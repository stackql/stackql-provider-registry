            - "2025-04-15T18:37:24.100435Z"
          format: date-time
          title: Created At
          type: string
        downloadable:
          default: false
          description: Whether the file can be downloaded.
          examples:
            - false
          title: Downloadable
          type: boolean
        expires_at:
          default: null
          description: RFC 3339 datetime string representing when the file will expire and become unavailable for download. Null if the file does not expire. For files uploaded with `expires_in_seconds`, this is the upload time plus that value.
          examples:
            - "2025-05-15T18:37:24.100435Z"
          title: Expires At
          nullable: true
          format: date-time
          type: string
        filename:
          description: Original filename of the uploaded file.
          examples:
            - document.pdf
          maxLength: 500
          minLength: 1
          title: Filename
          type: string
        id:
          description: |-
            Unique object identifier.

            The format and length of IDs may change over time.
          examples:
            - file_011CNha8iCJcU1wXNR6q4V8w
          title: Id
          type: string
        mime_type:
          description: MIME type of the file.
          examples:
            - application/pdf
          maxLength: 255
          minLength: 1
          title: Mime Type
          type: string
        size_bytes:
          description: Size of the file in bytes.
          examples:
            - 102400
          minimum: 0
          title: Size Bytes
          type: integer
        type:
          description: |-
            Object type.

            For files, this is always `"file"`.
          title: Type
          type: string
          enum:
            - file
      required:
        - created_at
        - filename
        - id
        - mime_type
        - size_bytes
        - type
