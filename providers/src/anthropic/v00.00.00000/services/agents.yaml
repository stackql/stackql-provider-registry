components:
  schemas:
    BetaManagedAgentsCreateAgentParams:
      description: Request parameters for creating an `agent`.
      type: object
      required:
        - name
        - model
      properties:
        name:
          description: Human-readable name for the agent.
          type: string
          minLength: 1
          maxLength: 256
          examples:
            - My First Agent
        model:
          description: Model identifier. Accepts the [model string](https://platform.claude.com/docs/en/about-claude/models/overview#latest-models-comparison), e.g. `claude-opus-5`, or a `model_config` object for additional configuration control
          examples:
