          title: BetaManagedAgentsModel
          x-stainless-skip:
            - go
            - cli
          type: string
          x-stainless-nominal: false
          enum:
            - claude-fable-5-1
          required:
            - id
          properties:
            id:
              $ref: "#/components/schemas/BetaManagedAgentsModel"
            speed:
              description: Inference speed mode. Defaults to `standard`.
              nullable: true
              type: string
              enum:
                - standard
                - fast
            effort:
              description: 'How hard Claude works on each inference call. Accepts a bare level string (`"high"`) or `{"type": "high"}`. On create, omitting it resolves the per-model default; on update, omitting it leaves the stored value unchanged.'
              x-anthropic-beta-required:
                - managed-agents-2026-04-01
              nullable: true
              type: string
              enum:
                - low
                - medium
                - high
                - xhigh
                - max
              discriminator:
                propertyName: type
                mapping:
                  low: "#/components/schemas/BetaManagedAgentsEffortLow"
                  medium: "#/components/schemas/BetaManagedAgentsEffortMedium"
                  high: "#/components/schemas/BetaManagedAgentsEffortHigh"
                  xhigh: "#/components/schemas/BetaManagedAgentsEffortXhigh"
                  max: "#/components/schemas/BetaManagedAgentsEffortMax"
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - low
            inference_geo:
              description: Geographic region for model inference. When unset, requests fall through to the workspace's default_inference_geo. On update, `model` is whole-object replacement — omitting inference_geo clears it.
              x-anthropic-beta-required:
                - managed-agents-2026-04-01
              nullable: true
              type: string
          example:
            id: claude-opus-5
        description:
          description: Description of what the agent does.
          examples:
            - A general-purpose starter agent.
          nullable: true
          type: string
          maxLength: 2048
        system:
          description: System prompt for the agent.
          examples:
            - You are a general-purpose agent that can research, write code, run commands, and use connected tools to complete the user's task end to end.
          nullable: true
          type: string
          maxLength: 100000
        tools:
          description: Tool configurations available to the agent. Maximum of 128 tools across all toolsets allowed.
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsAgentToolParams"
          examples:
            - - type: agent_toolset_20260401
        mcp_servers:
          description: MCP servers this agent connects to. Maximum 20. Names must be unique within the array. Every server must be referenced by an `mcp_toolset` in `tools`; unreferenced servers are rejected. See the [MCP connector guide](https://platform.claude.com/docs/en/managed-agents/mcp-connector).
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsMCPServerParams"
        skills:
          description: Skills available to the agent.
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsSkillParams"
        metadata:
          description: Arbitrary key-value metadata. Maximum 16 pairs, keys up to 64 chars, values up to 512 chars.
          type: object
          examples:
            - foo: bar
        multiagent:
          description: Multiagent orchestration configuration. Currently supports the `coordinator` topology with a roster of 1-20 agents.
          x-anthropic-beta-required:
            - managed-agents-2026-04-01
          nullable: true
          discriminator:
            propertyName: type
            mapping:
              coordinator: "#/components/schemas/BetaManagedAgentsMultiagentCoordinatorParams"
          type: object
          required:
            - type
            - agents
          properties:
            type:
              type: string
              enum:
                - coordinator
              examples:
                - coordinator
            agents:
              description: Agents the coordinator may spawn as session threads. 1–20 entries. Each entry is an agent ID string, a versioned `{"type":"agent","id","version"}` reference, or `{"type":"self"}` to allow recursive self-invocation. Entries must reference distinct agents (after resolving `self` and string forms); at most one `self`. Referenced agents must exist, must not be archived, and must not themselves have `multiagent` set (depth limit 1).
              type: array
              items:
                $ref: "#/components/schemas/BetaManagedAgentsMultiagentRosterEntryParams"
              examples:
                - - agent_011CZkYqphY8vELVzwCUpqiQ
                  - type: self
          example:
            type: coordinator
            agents:
              - agent_011CZkYqphY8vELVzwCUpqiQ
              - type: self
