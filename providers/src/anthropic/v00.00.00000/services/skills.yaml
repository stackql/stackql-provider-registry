components:
  schemas:
    Body_create_skill_v1_skills_post:
      properties:
        files:
          items:
            type: string
            format: binary
          type: array
          title: Files
          description: |-
            Files to upload for the skill.

            All files must be in the same top-level directory and must include a SKILL.md file at the root of that directory.
        display_name:
          title: Display Name
          description: |-
            Human-readable, single-line label for the Skill. Maximum 255 characters.
            Always set: derived from the SKILL.md frontmatter `name` when omitted at
            creation. Not unique.
          nullable: true
          type: string
      type: object
      required:
        - files
      title: Body_create_skill_v1_skills_post
    Skill:
      properties:
        created_at:
          type: string
          format: date-time
          title: Created At
          description: ISO 8601 timestamp of when the skill was created.
          examples:
            - "2024-10-30T23:58:27.427722Z"
        display_name:
          type: string
          title: Display Name
          description: |-
            Human-readable, single-line label for the Skill. Maximum 255 characters.
            Always set: derived from the SKILL.md frontmatter `name` when omitted at
            creation. Not unique.
        id:
          type: string
          title: Id
          description: |-
            Unique identifier for the skill.

            The format and length of IDs may change over time.
          examples:
            - skill_01JAbcdefghijklmnopqrstuvw
        latest_version_id:
          type: string
          title: Latest Version Id
          description: "ID of the newest Skill Version — what `latest` references resolve to. Always set: a Skill holds at least one version."
        source:
          $ref: "#/components/schemas/SkillSource"
          description: |-
            Where the Skill comes from.

            Possible values:
            * `"custom"`: authored by the platform user; private to their workspace
            * `"anthropic"`: published by Anthropic; shared and read-only
            * `"anthropic_example"`: Anthropic-published sample Skill
            * `"plugin"`: resolved from an installed plugin
        type:
          type: string
          title: Type
          description: |-
            Object type.

            For Skills, this is always `"skill"`.
          default: skill
          enum:
            - skill
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: ISO 8601 timestamp of when the skill was last updated.
          examples:
            - "2024-10-30T23:58:27.427722Z"
      type: object
      required:
        - created_at
        - display_name
        - id
        - latest_version_id
        - source
        - type
        - updated_at
      title: Skill
    ErrorResponse:
      properties:
        error:
          discriminator:
            mapping:
              api_error: "#/components/schemas/APIError"
              authentication_error: "#/components/schemas/AuthenticationError"
              billing_error: "#/components/schemas/BillingError"
