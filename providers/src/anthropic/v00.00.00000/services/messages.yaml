            openAPIDocKey: "200"
          request:
            mediaType: application/json
      sqlVerbs:
        select:
          - $ref: "#/components/x-stackQL-resources/token_counts/methods/count_tokens"
        insert: []
        update: []
        delete: []
        replace: []
