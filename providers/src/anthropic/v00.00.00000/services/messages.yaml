            $ref: "#/paths/~1v1~1messages/post"
          response:
            mediaType: application/json
            openAPIDocKey: "200"
          request:
            mediaType: application/json
      sqlVerbs:
        select:
          - $ref: "#/components/x-stackQL-resources/messages/methods/create"
        insert: []
        update: []
        delete: []
        replace: []
    batches:
      id: anthropic.messages.batches
      name: batches
      title: Batches
      methods:
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: "#/paths/~1v1~1messages~1batches/post"
          response:
            mediaType: application/json
            openAPIDocKey: "200"
          request:
            mediaType: application/json
        list:
          operation:
            $ref: "#/paths/~1v1~1messages~1batches/get"
          response:
            mediaType: application/json
            openAPIDocKey: "200"
            objectKey: $.data
          config:
            queryParamPushdown:
              top:
                paramName: limit
                maxValue: 1000
        get:
          operation:
            $ref: "#/paths/~1v1~1messages~1batches~1{message_batch_id}/get"
          response:
            mediaType: application/json
            openAPIDocKey: "200"
        delete:
          operation:
            $ref: "#/paths/~1v1~1messages~1batches~1{message_batch_id}/delete"
          response:
            mediaType: application/json
            openAPIDocKey: "200"
        cancel:
          operation:
            $ref: "#/paths/~1v1~1messages~1batches~1{message_batch_id}~1cancel/post"
          response:
            mediaType: application/json
            openAPIDocKey: "200"
            schema_override:
              $ref: "#/components/schemas/StackqlExecResult"
        results:
          operation:
            $ref: "#/paths/~1v1~1messages~1batches~1{message_batch_id}~1results/get"
          response:
            mediaType: application/x-jsonl
            openAPIDocKey: "200"
      sqlVerbs:
        select:
          - $ref: "#/components/x-stackQL-resources/batches/methods/get"
          - $ref: "#/components/x-stackQL-resources/batches/methods/list"
        insert:
          - $ref: "#/components/x-stackQL-resources/batches/methods/create"
        update: []
        delete:
          - $ref: "#/components/x-stackQL-resources/batches/methods/delete"
        replace: []
