    BrowserStateChangeTabOpened:
      description: |-
        A tab this call's execution opened that remains open at its end —
        the creation delta of the `tabs` inventory, not an event log.

        Carries only the `tab_id`; the tab's `title` and `url` live on its
        `tabs` entry, which must include the same `tab_id`. A tab opened
        during a failed call gets no deferred `tab_opened`; it simply appears
        in the next result's `tabs` inventory.
      properties:
        tab_id:
          description: The `tab_id` of the opened tab, present in `tabs`.
          maxLength: 4096
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Tab Id
          type: string
        type:
          title: Type
          type: string
          enum:
            - tab_opened
      required:
        - tab_id
        - type
      title: BrowserStateChangeTabOpened
      type: object
    BrowserStateChangeDownloadStarted:
      description: A file download that started during this call.
      properties:
        download_id:
          description: The caller-assigned identifier for this download, stable across the state changes reporting it.
          maxLength: 4096
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Download Id
          type: string
        type:
          title: Type
          type: string
          enum:
            - download_started
        url:
          description: The final post-redirect URL the download was served from.
          maxLength: 4096
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Url
          type: string
      required:
        - download_id
        - type
        - url
      title: BrowserStateChangeDownloadStarted
      type: object
    BrowserStateChangeDownloadCompleted:
      description: |-
        A file download that finished during this call, reported with the
        same `download_id` as its `download_started` — or without a prior
        `download_started`, when the download finished during the call that
        started it (at most one state change per `download_id` per result).
      properties:
        download_id:
          description: The caller-assigned identifier for this download, stable across the state changes reporting it.
          maxLength: 4096
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Download Id
          type: string
        path:
          description: Where the executor saved the file, on the executor's filesystem. Only included when another tool in the same environment can read the file at that path.
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Path
          nullable: true
          maxLength: 4096
          type: string
        size_bytes:
          description: The completed download's size.
          title: Size Bytes
          nullable: true
          minimum: 0
          type: integer
        type:
          title: Type
          type: string
          enum:
            - download_completed
        url:
          description: The final post-redirect URL the download was served from.
          maxLength: 4096
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Url
          type: string
      required:
        - download_id
        - type
        - url
      title: BrowserStateChangeDownloadCompleted
      type: object
    BrowserStateChangeDownloadFailed:
      description: A file download that failed — or was cancelled — during this call.
      properties:
        download_id:
          description: The caller-assigned identifier for this download, stable across the state changes reporting it.
          maxLength: 4096
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Download Id
          type: string
        error:
          description: The failure or cancellation detail, when known.
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Error
          nullable: true
          maxLength: 4096
          type: string
        type:
          title: Type
          type: string
          enum:
            - download_failed
        url:
          description: The final post-redirect URL the download was served from.
          maxLength: 4096
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Url
          type: string
      required:
        - download_id
        - type
        - url
      title: BrowserStateChangeDownloadFailed
      type: object
    BrowserStateTabEntry:
      description: |-
        One open browser tab reported in a `browser_state` block's `tabs`
        inventory.

        `tab_id` is the caller-assigned identifier for the tab; `title` and
        `url` describe the page the tab is currently showing and may be empty
        strings (a blank tab legitimately has both empty). `active` marks the
        tab that is active after this call; whenever `tabs` is non-empty,
        exactly one entry is marked.
      properties:
        active:
          description: "Whether this tab is the active tab after this call. Whenever `tabs` is non-empty, exactly one entry is marked `active: true`."
          title: Active
          type: boolean
        tab_id:
          description: The caller-assigned identifier for this tab, unique within the inventory.
          maxLength: 4096
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Tab Id
          type: string
        title:
          description: The title of the page the tab is showing. May be empty.
          maxLength: 4096
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Title
          type: string
        url:
          description: The URL of the page the tab is showing. May be empty.
          maxLength: 4096
          pattern: ^[^\x00-\x1f\x7f-\x9f\u2028\u2029]*$
          title: Url
          type: string
      required:
        - tab_id
        - title
        - url
      title: BrowserStateTabEntry
      type: object
    RequestCodeExecutionOutputBlock:
      properties:
        file_id:
          title: File Id
          type: string
