components:
  schemas:
    BetaCreateUserProfileRequest:
      type: object
      properties:
        external_id:
          description: Platform's own identifier for this user. Not enforced unique. Maximum 255 characters. Accepted under the `user-profiles-2026-03-24` and `user-profiles-2026-08-18` beta headers; under `user-profiles-2026-09-04` send `external_user_details.reference_id` instead.
          x-anthropic-beta-required:
            - user-profiles-2026-03-24
            - user-profiles-2026-08-18
          examples:
            - user_12345
          nullable: true
          type: string
          minLength: 1
          maxLength: 255
        name:
          description: Optional for all profiles. Real-world name of the entity this profile represents (company or individual); for a company the platform resells Claude access to (`access_type` `passthrough`), that company's name where known. Maximum 255 characters.
          nullable: true
          type: string
          minLength: 1
          maxLength: 255
        access_type:
          description: "How the platform uses the API for this entity. `application` (default): the profile represents an individual end-user of the platform's product. `passthrough`: the profile identifies a company the platform resells Claude access to."
          x-anthropic-beta-required:
            - user-profiles-2026-08-18
            - user-profiles-2026-09-04
          type: string
          enum:
            - application
            - passthrough
        external_user_onboarded_at:
          description: "When the entity this profile represents opened its account with the platform, in RFC 3339 format: for an `application` profile, when the end-user signed up; for a `passthrough` profile, when the company became the platform's customer. Must be a complete timestamp no more than 1 minute in the future. Optional. Accepted under the `user-profiles-2026-08-18` beta header; under `user-profiles-2026-09-04` send `external_user_details.onboarded_at` instead."
          x-anthropic-beta-required:
            - user-profiles-2026-08-18
          examples:
            - "2024-11-02T08:15:00Z"
          type: string
          format: date-time
        external_user_details:
          description: Details about the entity this profile represents, as the platform states them. Every field is optional. Accepted under the `user-profiles-2026-09-04` beta header only.
          x-anthropic-beta-required:
            - user-profiles-2026-09-04
          type: object
          properties:
            reference_id:
              description: The platform's own reference for the entity, for example the key of the end-user's row in the platform's database. Not interpreted by Anthropic and not enforced unique. 1 to 255 characters.
              nullable: true
              type: string
              minLength: 1
              maxLength: 255
            onboarded_at:
              description: "When the entity opened its account with the platform, in RFC 3339 format: for an `application` profile, when the end-user signed up; for a `passthrough` profile, when the company became the platform's customer. Must be a complete timestamp no more than 1 minute in the future."
              type: string
              format: date-time
            account_status:
              description: "The status of the entity's account on the platform: `active`, `suspended` or `blocked`."
              nullable: true
              type: string
              enum:
                - active
                - suspended
                - blocked
            entity_type:
              description: "What kind of entity the profile represents: `individual`, `business`, `non_profit` or `government`."
              nullable: true
              type: string
              enum:
                - individual
                - business
                - non_profit
                - government
            country:
              description: "The country of the entity (not of the platform), as the platform determines it: an ISO 3166-1 alpha-2 code in upper case, for example `US`. Only the form, two uppercase ASCII letters, is checked."
              nullable: true
              type: string
            name_hash:
              description: A hash of the entity's name, computed by the platform. Anthropic treats it as an opaque string and does not prescribe the hash function. 1 to 255 characters.
              nullable: true
              type: string
              minLength: 1
              maxLength: 255
            email_hash:
              description: A hash of the entity's email address, computed by the platform. Anthropic treats it as an opaque string and does not prescribe the hash function. 1 to 255 characters.
              nullable: true
              type: string
              minLength: 1
              maxLength: 255
        metadata:
          description: Free-form key-value data to attach to this user profile. Maximum 16 keys, with keys up to 64 characters and values up to 512 characters. Values must be non-empty strings.
          type: object
          examples:
            - {}
      example:
        external_id: user_12345
        external_user_onboarded_at: "2024-11-02T08:15:00Z"
        metadata: {}
    BetaUserProfile:
      type: object
      required:
        - id
        - type
        - trust_grants
        - created_at
        - metadata
        - updated_at
      properties:
        id:
          description: Unique identifier for this user profile, prefixed `uprof_`.
          type: string
          examples:
            - uprof_011CZkZCu8hGbp5mYRQgUmz9
        type:
          description: Object type. Always `user_profile`.
          type: string
          enum:
            - user_profile
          examples:
            - user_profile
        external_id:
          description: Platform's own identifier for this user. Not enforced unique. Present under the `user-profiles-2026-03-24` and `user-profiles-2026-08-18` beta headers; under `user-profiles-2026-09-04` the value is `external_user_details.reference_id`.
          x-anthropic-beta-required:
            - user-profiles-2026-03-24
