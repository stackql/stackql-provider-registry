    BetaUpdateUserProfileRequestBody:
      type: object
      properties:
        external_id:
          description: If present, replaces the stored external_id. Omit to leave unchanged. Maximum 255 characters. Accepted under the `user-profiles-2026-03-24` and `user-profiles-2026-08-18` beta headers; under `user-profiles-2026-09-04` send `external_user_details.reference_id` instead.
          x-anthropic-beta-required:
            - user-profiles-2026-03-24
            - user-profiles-2026-08-18
          examples:
            - user_12345
          nullable: true
          type: string
          minLength: 1
          maxLength: 255
        metadata:
          description: Key-value pairs to merge into the stored metadata. Keys provided overwrite existing values. To remove a key, set its value to an empty string. Keys not provided are left unchanged. Maximum 16 keys, with keys up to 64 characters and values up to 512 characters.
          type: object
        name:
          description: If present, replaces the stored name. Omit to leave unchanged. Maximum 255 characters.
          nullable: true
          type: string
          minLength: 1
          maxLength: 255
        access_type:
          description: If present, replaces the stored access type. Omit to leave unchanged.
          x-anthropic-beta-required:
            - user-profiles-2026-08-18
            - user-profiles-2026-09-04
          nullable: true
          type: string
          enum:
            - application
            - passthrough
        external_user_onboarded_at:
          description: If present, replaces the stored account creation time. Omit to leave unchanged; once set, the value cannot be cleared and `null` is rejected. Must be a complete RFC 3339 timestamp no more than 1 minute in the future. Accepted under the `user-profiles-2026-08-18` beta header; under `user-profiles-2026-09-04` send `external_user_details.onboarded_at` instead.
          x-anthropic-beta-required:
            - user-profiles-2026-08-18
          type: string
          format: date-time
        external_user_details:
          description: Details about the entity this profile represents, as the platform states them. Each field sent replaces the stored value; omit a field to leave it unchanged. Once set, a value cannot be cleared and `null` is rejected. Accepted under the `user-profiles-2026-09-04` beta header only.
          x-anthropic-beta-required:
            - user-profiles-2026-09-04
          type: object
          properties:
            reference_id:
              description: The platform's own reference for the entity, for example the key of the end-user's row in the platform's database. Not interpreted by Anthropic and not enforced unique. 1 to 255 characters.
              nullable: true
              type: string
              minLength: 1
              maxLength: 255
            onboarded_at:
              description: "When the entity opened its account with the platform, in RFC 3339 format: for an `application` profile, when the end-user signed up; for a `passthrough` profile, when the company became the platform's customer. Must be a complete timestamp no more than 1 minute in the future."
              type: string
              format: date-time
            account_status:
              description: "The status of the entity's account on the platform: `active`, `suspended` or `blocked`."
              nullable: true
              type: string
              enum:
                - active
                - suspended
                - blocked
            entity_type:
              description: "What kind of entity the profile represents: `individual`, `business`, `non_profit` or `government`."
              nullable: true
              type: string
              enum:
                - individual
                - business
                - non_profit
                - government
            country:
              description: "The country of the entity (not of the platform), as the platform determines it: an ISO 3166-1 alpha-2 code in upper case, for example `US`. Only the form, two uppercase ASCII letters, is checked."
              nullable: true
              type: string
            name_hash:
              description: A hash of the entity's name, computed by the platform. Anthropic treats it as an opaque string and does not prescribe the hash function. 1 to 255 characters.
              nullable: true
              type: string
              minLength: 1
              maxLength: 255
            email_hash:
              description: A hash of the entity's email address, computed by the platform. Anthropic treats it as an opaque string and does not prescribe the hash function. 1 to 255 characters.
              nullable: true
              type: string
              minLength: 1
              maxLength: 255
      example:
        external_id: user_12345
