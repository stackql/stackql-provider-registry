    BetaManagedAgentsSessionEndTurn:
      description: The agent completed its turn naturally and is ready for the next user message.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - end_turn
    BetaManagedAgentsSessionRequiresAction:
      description: The agent is idle waiting on one or more blocking user-input events (tool confirmation, custom tool result, etc.). Resolving all of them transitions the session back to running.
      type: object
      required:
        - type
        - event_ids
      properties:
        type:
          type: string
          enum:
            - requires_action
        event_ids:
          description: The ids of events the agent is blocked on. Resolving fewer than all re-emits `session.status_idle` with the remainder.
          type: array
          items:
            type: string
    BetaManagedAgentsSessionRetriesExhausted:
      description: "The turn ended because repeated errors exhausted the retry budget or an error escalated to `retry_status: 'exhausted'`."
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - retries_exhausted
    BetaManagedAgentsSessionBudgetReached:
      description: The agent stopped because the session's tracked list cost reached its budget, or because its usage includes a model with no list price (which the budget cannot measure). Raise the budget to continue — or, if raising is rejected because a model has no list price, remove the budget.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - budget_reached
    BetaManagedAgentsSpanModelUsage:
      description: Token usage for a single model request.
      type: object
      required:
        - input_tokens
        - output_tokens
        - cache_creation_input_tokens
        - cache_read_input_tokens
      properties:
        input_tokens:
          description: Input tokens consumed by this request.
          type: integer
          format: int32
        output_tokens:
          description: Output tokens generated by this request.
          type: integer
          format: int32
        cache_creation_input_tokens:
          description: Tokens used to create prompt cache in this request.
          type: integer
          format: int32
        cache_read_input_tokens:
          description: Tokens read from prompt cache in this request.
          type: integer
          format: int32
        speed:
          description: Inference speed tier this request actually ran at. Mirrors `usage.speed` on /v1/messages. Only present when the fast-mode beta is active.
          x-anthropic-beta-required:
            - managed-agents-2026-04-01
            - fast-mode-2026-02-01
          nullable: true
          type: string
          enum:
            - standard
            - fast
    BetaManagedAgentsRubric:
      description: Rubric for grading the quality of an outcome.
      discriminator:
        propertyName: type
        mapping:
          file: "#/components/schemas/BetaManagedAgentsFileRubric"
          text: "#/components/schemas/BetaManagedAgentsTextRubric"
      type: object
      required:
        - type
        - file_id
        - content
      properties:
        type:
          type: string
          enum:
            - file
        file_id:
          description: ID of the rubric file.
          type: string
        content:
          description: Rubric content. Plain text or markdown — the grader treats it as freeform text.
          type: string
    BetaManagedAgentsSystemContentBlock:
      description: Content block in a mid-conversation system message. Text-only.
      type: object
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/BetaManagedAgentsTextBlock"
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
          examples:
            - text
        text:
          description: The text content.
          type: string
          minLength: 1
          examples:
            - "Where is my order #1234?"
      example:
        type: text
        text: "Where is my order #1234?"
    BetaManagedAgentsSessionUsageSnapshot:
      description: Point-in-time snapshot of a session's cumulative usage.
      type: object
      properties:
        input_tokens:
          description: Total input tokens consumed across all turns.
          type: integer
          format: int32
        output_tokens:
          description: Total output tokens generated across all turns.
          type: integer
          format: int32
        cache_read_input_tokens:
          description: Total tokens read from prompt cache.
          type: integer
          format: int32
        cache_creation:
          description: Tokens used to create prompt cache entries, broken down by cache TTL.
          type: object
          properties:
            ephemeral_1h_input_tokens:
              description: Tokens used to create 1-hour ephemeral cache entries.
              type: integer
              format: int32
            ephemeral_5m_input_tokens:
              description: Tokens used to create 5-minute ephemeral cache entries.
              type: integer
              format: int32
        list_cost:
          description: Cumulative list cost of the session across all turns, priced at public list rates.
          type: object
          required:
            - currency
            - amount
          properties:
            currency:
              description: Uppercase ISO-4217 currency code. `USD` is the only currency currently supported; the accepted set is closed and grows only when a new currency is priced.
              examples:
                - USD
              type: string
              enum:
                - USD
            amount:
              description: 'Amount in minor units of the currency, as an integer decimal string with no leading zeros: "2500" is $25.00 and "50" is fifty cents. A string rather than a number so no float rounding is ever applied.'
              type: string
              examples:
                - "2500"
          example:
            currency: USD
            amount: "2500"
        server_tool_use:
          description: Cumulative server-executed tool usage across all turns.
          type: object
          properties:
            web_search_requests:
              description: Number of server-executed web search requests.
              type: integer
              format: int32
              examples:
                - 3
            web_fetch_requests:
              description: Number of server-executed web fetch requests.
              type: integer
              format: int32
              examples:
                - 0
          example:
            web_search_requests: 3
            web_fetch_requests: 0
        active_seconds:
          description: Cumulative time in seconds during which the session had at least one thread in running status. Overlapping activity from concurrent threads is counted once. This is the duration the session's runtime cost is priced on.
          type: number
          format: double
    BetaManagedAgentsBranchCheckout:
      type: object
