          description: Never return search results whose host is one of these domains or a subdomain of one. Each entry is a plain hostname like "ads.example.com" (no scheme or port; an optional path suffix is accepted). At most 64 entries; an empty list is rejected (omit the field instead). Cannot be combined with allowed_domains.
          type: array
          items:
            type: string
        user_location:
          description: Approximate user location for search result localization.
          nullable: true
          type: object
          required:
            - type
          properties:
            type:
              description: Location precision. Only "approximate" is supported.
              type: string
              enum:
                - approximate
            city:
              description: City name.
              nullable: true
              type: string
              minLength: 1
              maxLength: 255
            region:
              description: Region or state name.
              nullable: true
              type: string
              minLength: 1
              maxLength: 255
            country:
              description: Two-letter ISO 3166-1 country code, uppercase.
              nullable: true
              type: string
            timezone:
              description: IANA timezone identifier, e.g. "America/Los_Angeles".
              nullable: true
              type: string
              minLength: 1
              maxLength: 255
    BetaManagedAgentsSearchResultContent:
      description: Text content within a search result.
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
        text:
          description: The text content.
          type: string
          minLength: 1
    BetaManagedAgentsSearchResultCitations:
      description: Citation settings for a search result.
      type: object
      required:
        - enabled
      properties:
        enabled:
          description: Whether citations are enabled for this search result.
          type: boolean
    BetaManagedAgentsAgentAutoEvaluatedPermission:
      description: "The server's per-invocation judgement under the auto permission policy. Its type always equals the event's top-level evaluated_permission. Open union: clients must tolerate unknown variants."
      discriminator:
        propertyName: type
        mapping:
          allow: "#/components/schemas/BetaManagedAgentsAgentAutoEvaluatedPermissionAllow"
          ask: "#/components/schemas/BetaManagedAgentsAgentAutoEvaluatedPermissionAsk"
          deny: "#/components/schemas/BetaManagedAgentsAgentAutoEvaluatedPermissionDeny"
      type: object
      required:
        - type
        - reason_code
      properties:
        type:
          type: string
          enum:
            - allow
        reason_code:
          description: The judgement's grounds in registry-bound terms, for client branching and audit rather than end-user display. Open registry; currently "indeterminate" (no judgement was reached). Clients must tolerate values outside this set.
          type: string
          maxLength: 64
    BetaManagedAgentsRetryStatusRetrying:
      description: The server is retrying automatically. Client should wait; the same error type may fire again as retrying, then once as exhausted when the retry budget runs out.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - retrying
    BetaManagedAgentsRetryStatusExhausted:
      description: This turn is dead; queued inputs are flushed and the session returns to idle. Client may send a new prompt.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - exhausted
    BetaManagedAgentsRetryStatusTerminal:
      description: The session encountered a terminal error and will transition to `terminated` state.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - terminal
    BetaManagedAgentsEffortLevel:
      type: string
      description: How hard Claude works on each turn. Higher levels favor reasoning depth over latency. Not all models accept every level; invalid combinations are rejected at create time.
      enum:
        - low
        - medium
        - high
        - xhigh
        - max
    BetaManagedAgentsBase64ImageSource:
      description: Base64-encoded image data.
      type: object
      required:
