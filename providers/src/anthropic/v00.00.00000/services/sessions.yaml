      required:
        - type
        - url
      properties:
        type:
          type: string
          enum:
            - url
        url:
          description: URL of the document to fetch.
          type: string
          minLength: 1
    BetaManagedAgentsFileDocumentSource:
      description: Document referenced by file ID.
      type: object
      required:
        - type
        - file_id
      properties:
        type:
          type: string
          enum:
            - file
        file_id:
          description: ID of a previously uploaded file.
          type: string
          minLength: 1
    BetaManagedAgentsAlwaysAllowPolicy:
      description: Tool calls are automatically approved without user confirmation.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - always_allow
    BetaManagedAgentsAlwaysAskPolicy:
      description: Tool calls require user confirmation before execution.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - always_ask
    BetaManagedAgentsAutoPolicy:
      description: "The server decides each tool call individually: it judges, from the tool, its input, and the session content so far, whether the call is safe to execute or high-risk, and evaluates it to allow when judged safe and to deny when judged high-risk. A call the server cannot reach a judgement on evaluates to ask."
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - auto
    BetaManagedAgentsUserLocation:
      description: Approximate user location for search result localization.
      type: object
      required:
        - type
      properties:
        type:
          description: Location precision. Only "approximate" is supported.
          type: string
          enum:
            - approximate
        city:
          description: City name.
          nullable: true
          type: string
          minLength: 1
          maxLength: 255
        region:
          description: Region or state name.
          nullable: true
          type: string
          minLength: 1
          maxLength: 255
        country:
          description: Two-letter ISO 3166-1 country code, uppercase.
          nullable: true
          type: string
        timezone:
          description: IANA timezone identifier, e.g. "America/Los_Angeles".
          nullable: true
          type: string
          minLength: 1
          maxLength: 255
    BetaManagedAgentsAgentAutoEvaluatedPermissionAllow:
      description: The server judged the invocation safe to execute without client approval.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - allow
    BetaManagedAgentsAgentAutoEvaluatedPermissionAsk:
      description: The server reached no judgement; the invocation is held for client approval.
      type: object
      required:
        - type
        - reason_code
      properties:
        type:
          type: string
          enum:
            - ask
        reason_code:
          description: The judgement's grounds in registry-bound terms, for client branching and audit rather than end-user display. Open registry; currently "indeterminate" (no judgement was reached). Clients must tolerate values outside this set.
          type: string
          maxLength: 64
    BetaManagedAgentsAgentAutoEvaluatedPermissionDeny:
      description: The server judged the invocation high-risk; it does not execute and a synthetic error tool result is appended.
      type: object
      required:
        - type
        - reason_code
      properties:
        type:
          type: string
          enum:
            - deny
        reason_code:
          description: The judgement's grounds in registry-bound terms. Open registry; currently "high_risk" (judged high-risk; the call does not run). Clients must tolerate values outside this set.
          type: string
          maxLength: 64
    StackqlExecResult:
      type: object
      description: Synthetic dispatch-result envelope for EXEC-only methods (see post-pass step 3).
      properties:
        result:
          type: string
          description: Raw response payload.
        items:
          type: array
          items:
            type: string
