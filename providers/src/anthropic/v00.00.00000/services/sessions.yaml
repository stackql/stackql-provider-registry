components:
  schemas:
    BetaManagedAgentsCreateSessionParams:
      description: Request parameters for creating a `session`.
      type: object
      required:
        - agent
        - environment_id
      properties:
        agent:
          type: string
          description: Agent identifier. Accepts the `agent` ID string, which pins the latest version for the session, or an `agent` object with both id and version specified.
        environment_id:
          description: ID of the `environment` defining the container configuration for this session.
          type: string
          minLength: 1
          maxLength: 128
          examples:
            - env_011CZkZ9X2dpNyB7HsEFoRfW
        title:
          description: Human-readable session title.
          examples:
            - "Order #1234 inquiry"
          nullable: true
          type: string
          maxLength: 500
        metadata:
          description: Arbitrary key-value metadata attached to the session. Maximum 16 pairs, keys up to 64 chars, values up to 512 chars.
          type: object
        resources:
          description: Resources (e.g. repositories, files) to mount into the session's container.
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsSessionResourceParams"
        vault_ids:
          description: Vault IDs for stored credentials the agent can use during the session.
          type: array
          items:
            type: string
        initial_events:
          description: Initial events to send to the `session` at creation, processed in order. Supports `user.message` and `user.define_outcome` events. Maximum 50 events.
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsSessionInitialEventParams"
          x-anthropic-beta-required:
            - managed-agents-2026-04-01
        budget:
          description: Enforced spend ceiling for the session. Omit to create an uncapped session. Every model the session can run — the agent's model and each callable agent's model — must have a public list price, or the request is rejected with reason `model_not_budgetable`.
          x-anthropic-beta-required:
            - managed-agents-2026-04-01
          type: object
          discriminator:
            propertyName: type
            mapping:
              limit: "#/components/schemas/BetaManagedAgentsBudgetLimit"
          required:
            - type
            - max_list_cost
          properties:
            type:
              type: string
              enum:
                - limit
            max_list_cost:
              description: Maximum list cost the session may accrue. List price is used regardless of any negotiated discount, so the cap fires at or before the actual charge.
              type: object
              required:
                - currency
                - amount
              properties:
                currency:
                  description: Uppercase ISO-4217 currency code. `USD` is the only currency currently supported; the accepted set is closed and grows only when a new currency is priced.
                  examples:
                    - USD
                  type: string
                  enum:
                    - USD
                amount:
                  description: 'Amount in minor units of the currency, as an integer decimal string with no leading zeros: "2500" is $25.00 and "50" is fifty cents. A string rather than a number so no float rounding is ever applied.'
                  type: string
                  examples:
                    - "2500"
              example:
                currency: USD
                amount: "2500"
      example:
        agent: agent_011CZkYpogX7uDKUyvBTophP
        environment_id: env_011CZkZ9X2dpNyB7HsEFoRfW
        title: "Order #1234 inquiry"
    BetaManagedAgentsSession:
      description: A Managed Agents `session`.
      type: object
      required:
        - type
        - id
        - status
        - created_at
        - updated_at
        - environment_id
        - title
        - metadata
        - agent
        - resources
        - vault_ids
        - outcome_evaluations
        - usage
        - stats
        - archived_at
        - budget
      properties:
        type:
          type: string
          enum:
