    BetaManagedAgentsSessionUpdatedEvent:
      description: Emitted when an UpdateSession request changed at least one field. Carries only the fields that changed; absent fields were not part of the update. The new configuration applies from the next turn.
      type: object
      required:
        - type
        - id
        - processed_at
      properties:
        type:
          type: string
          enum:
            - session.updated
        id:
          description: Unique identifier for this event.
          type: string
        processed_at:
          description: Timestamp when the update was applied.
          type: string
          format: date-time
        title:
          description: The session's new title. Present only when the update changed it.
          nullable: true
          type: string
        metadata:
          description: The session's full metadata bag after the update. Present when the update set non-empty metadata; absent when metadata was unchanged or cleared to empty.
          type: object
        agent:
          description: The session's effective agent configuration after the update. Present only when the update changed `agent` (tools or mcp_servers); when present it is the full materialised snapshot, not a diff.
          nullable: true
          type: object
          required:
            - type
            - id
            - version
            - name
            - description
            - model
            - system
            - tools
            - mcp_servers
            - skills
            - multiagent
          properties:
            type:
              type: string
              enum:
                - agent
              examples:
                - agent
            id:
              type: string
              examples:
                - agent_011CZkYpogX7uDKUyvBTophP
            version:
              type: integer
              format: int32
              examples:
                - 1
            name:
              type: string
              examples:
                - My First Agent
            description:
              examples:
                - A general-purpose starter agent.
              nullable: true
              type: string
            model:
              $ref: "#/components/schemas/BetaManagedAgentsModelConfig"
              examples:
                - id: claude-opus-5
                  speed: standard
            system:
              examples:
                - You are a general-purpose agent that can research, write code, run commands, and use connected tools to complete the user's task end to end.
              nullable: true
              type: string
            tools:
              type: array
              items:
                $ref: "#/components/schemas/BetaManagedAgentsAgentTool"
              examples:
                - - type: agent_toolset_20260401
                    default_config:
                      enabled: true
                      permission_policy:
                        type: always_ask
                    configs: []
            mcp_servers:
              type: array
              items:
                $ref: "#/components/schemas/BetaManagedAgentsMCPServer"
              examples:
                - - type: url
                    name: example-mcp
                    url: https://example-server.modelcontextprotocol.io/sse
            skills:
              type: array
              items:
                $ref: "#/components/schemas/BetaManagedAgentsSkill"
              examples:
                - - type: anthropic
                    skill_id: xlsx
                    version: "1"
                  - type: custom
                    skill_id: skill_011CZkZFNu9hAbo3jZPRgTlx
                    version: "2"
            multiagent:
              description: Resolved multiagent orchestration configuration. Null when the agent is single-threaded.
              x-anthropic-beta-required:
                - managed-agents-2026-04-01
              examples:
                - null
              nullable: true
              discriminator:
                propertyName: type
                mapping:
                  coordinator: "#/components/schemas/BetaManagedAgentsSessionMultiagentCoordinator"
              type: object
              required:
                - type
                - agents
              properties:
                type:
                  type: string
                  enum:
                    - coordinator
                agents:
                  description: Full `agent` definitions the coordinator may spawn as session threads.
                  type: array
                  items:
                    $ref: "#/components/schemas/BetaManagedAgentsSessionRosterEntry"
          example:
            type: agent
            id: agent_011CZkYpogX7uDKUyvBTophP
            version: 1
            name: My First Agent
            description: A general-purpose starter agent.
            model:
              id: claude-opus-5
              speed: standard
            system: You are a general-purpose agent that can research, write code, run commands, and use connected tools to complete the user's task end to end.
            tools:
              - type: agent_toolset_20260401
                default_config:
                  enabled: true
                  permission_policy:
                    type: always_ask
                configs: []
            mcp_servers:
              - type: url
                name: example-mcp
                url: https://example-server.modelcontextprotocol.io/sse
            skills:
              - type: anthropic
                skill_id: xlsx
                version: "1"
              - type: custom
                skill_id: skill_011CZkZFNu9hAbo3jZPRgTlx
                version: "2"
            multiagent: null
        budget:
          description: "The session's budget after the update: the new budget when set or replaced, or null when the update removed it. Present only when the update changed the budget."
          x-anthropic-beta-required:
            - managed-agents-2026-04-01
          nullable: true
          type: object
          discriminator:
            propertyName: type
            mapping:
              limit: "#/components/schemas/BetaManagedAgentsBudgetLimit"
          required:
            - type
            - max_list_cost
          properties:
            type:
              type: string
              enum:
                - limit
            max_list_cost:
              description: Maximum list cost the session may accrue. List price is used regardless of any negotiated discount, so the cap fires at or before the actual charge.
              type: object
              required:
                - currency
                - amount
              properties:
                currency:
                  description: Uppercase ISO-4217 currency code. `USD` is the only currency currently supported; the accepted set is closed and grows only when a new currency is priced.
                  examples:
                    - USD
                  type: string
                  enum:
                    - USD
                amount:
                  description: 'Amount in minor units of the currency, as an integer decimal string with no leading zeros: "2500" is $25.00 and "50" is fifty cents. A string rather than a number so no float rounding is ever applied.'
                  type: string
                  examples:
                    - "2500"
              example:
                currency: USD
                amount: "2500"
