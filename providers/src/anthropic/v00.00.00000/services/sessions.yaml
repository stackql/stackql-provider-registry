          description: Whether this tool is enabled and available to Claude. Overrides the default_config setting.
          nullable: true
          type: boolean
        permission_policy:
          description: Permission policy for this tool. Controls whether tool calls are auto-approved or require confirmation.
          nullable: true
          type: object
          discriminator:
            propertyName: type
            mapping:
              always_allow: "#/components/schemas/BetaManagedAgentsAlwaysAllowPolicy"
              always_ask: "#/components/schemas/BetaManagedAgentsAlwaysAskPolicy"
              auto: "#/components/schemas/BetaManagedAgentsAutoPolicy"
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - always_allow
        allowed_domains:
          description: Only fetch URLs whose host is one of these domains or a subdomain of one. Each entry is a plain hostname like "docs.example.com" (no scheme, port, or path). At most 64 entries; an empty list is rejected (omit the field instead). Cannot be combined with blocked_domains.
