    BetaManagedAgentsSessionInitialEventParams:
      description: An event sent to the `session` immediately after it is created. Supports `user.message` and `user.define_outcome`.
      type: object
      discriminator:
        propertyName: type
        mapping:
          user.message: "#/components/schemas/BetaManagedAgentsUserMessageEventParams"
          user.define_outcome: "#/components/schemas/BetaManagedAgentsUserDefineOutcomeEventParams"
      required:
        - type
        - content
        - description
        - rubric
      properties:
        type:
          type: string
          enum:
            - user.message
          examples:
            - user.message
        content:
          description: Array of content blocks for the user message.
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsUserContentBlock"
          examples:
            - - type: text
                text: "Where is my order #1234?"
        description:
          description: What the agent should produce. This is the task specification.
          type: string
          examples:
            - Produce a 2-page summary as summary.md
        rubric:
          description: How to grade the outcome. Text or file reference.
          examples:
            - type: text
              content: Must cover all five sections; cite sources inline.
          discriminator:
            propertyName: type
            mapping:
              file: "#/components/schemas/BetaManagedAgentsFileRubricParams"
              text: "#/components/schemas/BetaManagedAgentsTextRubricParams"
          type: object
          required:
            - type
            - file_id
            - content
          properties:
            type:
              type: string
              enum:
                - file
              examples:
                - file
            file_id:
              description: ID of the rubric file.
              type: string
              examples:
                - file_011CNha8iCJcU1wXNR6q4V8w
            content:
              description: Rubric content. Plain text or markdown — the grader treats it as freeform text. Maximum 262144 characters.
              type: string
              maxLength: 262144
              examples:
                - Must cover all five sections; cite sources inline.
          example:
            type: file
            file_id: file_011CNha8iCJcU1wXNR6q4V8w
            content: Must cover all five sections; cite sources inline.
        max_iterations:
          description: Eval→revision cycles before giving up. Default 3, max 20.
          examples:
            - 3
          nullable: true
          type: integer
          format: int32
      example:
        type: user.message
        content:
          - type: text
            text: "Where is my order #1234?"
        description: Produce a 2-page summary as summary.md
        rubric:
          type: text
          content: Must cover all five sections; cite sources inline.
        max_iterations: 3
    BetaManagedAgentsBudget:
      description: An enforced spend ceiling on a session. Discriminated on `type`; `limit` is the only kind currently supported.
      type: object
      discriminator:
        propertyName: type
        mapping:
          limit: "#/components/schemas/BetaManagedAgentsBudgetLimit"
      required:
        - type
        - max_list_cost
      properties:
        type:
          type: string
          enum:
            - limit
        max_list_cost:
          description: Maximum list cost the session may accrue. List price is used regardless of any negotiated discount, so the cap fires at or before the actual charge.
          type: object
          required:
            - currency
            - amount
          properties:
            currency:
              description: Uppercase ISO-4217 currency code. `USD` is the only currency currently supported; the accepted set is closed and grows only when a new currency is priced.
              examples:
                - USD
              type: string
              enum:
                - USD
            amount:
              description: 'Amount in minor units of the currency, as an integer decimal string with no leading zeros: "2500" is $25.00 and "50" is fifty cents. A string rather than a number so no float rounding is ever applied.'
              type: string
              examples:
                - "2500"
          example:
            currency: USD
            amount: "2500"
