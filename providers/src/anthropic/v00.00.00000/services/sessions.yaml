          type: array
          items:
            type: string
        agent:
          description: Agent configuration update. Only `tools` and `mcp_servers` are updatable mid-session. Only valid for sessions created from an agent or deployment reference. The session must not be running.
          x-anthropic-beta-required:
            - managed-agents-2026-04-01
          type: object
          properties:
            tools:
              description: "Replacement tool list. Full replacement: the provided array becomes the new value. Send an empty array to clear; omit to preserve."
              type: array
              items:
                $ref: "#/components/schemas/BetaManagedAgentsAgentToolParams"
            mcp_servers:
              description: "Replacement MCP server list. Full replacement: the provided array becomes the new value. Send an empty array to clear; omit to preserve."
              type: array
              items:
                $ref: "#/components/schemas/BetaManagedAgentsMCPServerParams"
        budget:
          description: Enforced spend ceiling for the session. Set an object to replace the budget of a session that was created with one, or `null` to remove it; omit to preserve. A budget cannot be added to a session created without one (rejected with reason `budget_create_only`), and a removed budget cannot be re-added. Allowed in any non-terminated status. Lowering `max_list_cost` to at or below the session's consumed list cost is rejected with reason `budget_not_raised`, and every model the session can run must have a public list price or the request is rejected with reason `model_not_budgetable`.
          x-anthropic-beta-required:
            - managed-agents-2026-04-01
          nullable: true
          type: object
          discriminator:
            propertyName: type
            mapping:
              limit: "#/components/schemas/BetaManagedAgentsBudgetLimit"
          required:
            - type
            - max_list_cost
          properties:
            type:
              type: string
              enum:
                - limit
            max_list_cost:
              description: Maximum list cost the session may accrue. List price is used regardless of any negotiated discount, so the cap fires at or before the actual charge.
              type: object
              required:
                - currency
                - amount
              properties:
                currency:
                  description: Uppercase ISO-4217 currency code. `USD` is the only currency currently supported; the accepted set is closed and grows only when a new currency is priced.
                  examples:
                    - USD
                  type: string
                  enum:
                    - USD
                amount:
                  description: 'Amount in minor units of the currency, as an integer decimal string with no leading zeros: "2500" is $25.00 and "50" is fifty cents. A string rather than a number so no float rounding is ever applied.'
                  type: string
                  examples:
                    - "2500"
              example:
                currency: USD
                amount: "2500"
      example:
