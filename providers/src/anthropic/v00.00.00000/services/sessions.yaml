          write: "#/components/schemas/BetaManagedAgentsWriteToolConfigParams"
          glob: "#/components/schemas/BetaManagedAgentsGlobToolConfigParams"
          grep: "#/components/schemas/BetaManagedAgentsGrepToolConfigParams"
          web_fetch: "#/components/schemas/BetaManagedAgentsWebFetchToolConfigParams"
