openapi: 3.0.0
info:
  title: billing API
  description: Billing related endpoints
  version: 1.0.0
paths:
  /billing/addons:
    get:
      description: Returns the billing addons that are currently applied, including the active compute instance size, and lists every addon option that can be provisioned with pricing metadata.
      operationId: v1-list-project-addons
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectAddonsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to list project addons
      security:
        - bearer: []
      summary: List billing addons and compute instance selections
      tags:
        - Billing
      x-endpoint-owners:
        - billing
      x-fga-permissions:
        - - infra_add_ons_read
    patch:
      description: Selects an addon variant, for example scaling the project’s compute instance up or down, and applies it to the project.
      operationId: v1-apply-project-addon
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyProjectAddonBody'
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to apply project addon
      security:
        - bearer: []
      summary: Apply or update billing addons, including compute instance size
      tags:
        - Billing
      x-endpoint-owners:
        - billing
      x-fga-permissions:
        - - infra_add_ons_write
  /billing/addons/{addon_variant}:
    delete:
      description: Disables the selected addon variant, including rolling the compute instance back to its previous size.
      operationId: v1-remove-project-addon
      parameters:
        - name: addon_variant
          required: true
          in: path
          schema:
            example: pitr_7
            anyOf:
              - type: string
                enum:
                  - ci_micro
                  - ci_small
                  - ci_medium
                  - ci_large
                  - ci_xlarge
                  - ci_2xlarge
                  - ci_4xlarge
                  - ci_8xlarge
                  - ci_12xlarge
                  - ci_16xlarge
                  - ci_24xlarge
                  - ci_24xlarge_optimized_cpu
                  - ci_24xlarge_optimized_memory
                  - ci_24xlarge_high_memory
                  - ci_48xlarge
                  - ci_48xlarge_optimized_cpu
                  - ci_48xlarge_optimized_memory
                  - ci_48xlarge_high_memory
              - type: string
                enum:
                  - cd_default
              - type: string
                enum:
                  - pitr_7
                  - pitr_14
                  - pitr_28
              - type: string
                enum:
                  - ipv4_default
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to remove project addon
      security:
        - bearer: []
      summary: Remove billing addons or revert compute instance sizing
      tags:
        - Billing
      x-endpoint-owners:
        - billing
      x-fga-permissions:
        - - infra_add_ons_write
components:
  schemas:
    ListProjectAddonsResponse:
      type: object
      properties:
        selected_addons:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - custom_domain
                  - compute_instance
                  - pitr
                  - ipv4
                  - auth_mfa_phone
                  - auth_mfa_web_authn
                  - log_drain
                  - etl_pipeline
              variant:
                type: object
                properties:
                  id:
                    anyOf:
                      - type: string
                        enum:
                          - ci_micro
                          - ci_small
                          - ci_medium
                          - ci_large
                          - ci_xlarge
                          - ci_2xlarge
                          - ci_4xlarge
                          - ci_8xlarge
                          - ci_12xlarge
                          - ci_16xlarge
                          - ci_24xlarge
                          - ci_24xlarge_optimized_cpu
                          - ci_24xlarge_optimized_memory
                          - ci_24xlarge_high_memory
                          - ci_48xlarge
                          - ci_48xlarge_optimized_cpu
                          - ci_48xlarge_optimized_memory
                          - ci_48xlarge_high_memory
                      - type: string
                        enum:
                          - cd_default
                      - type: string
                        enum:
                          - pitr_7
                          - pitr_14
                          - pitr_28
                      - type: string
                        enum:
                          - ipv4_default
                      - type: string
                        enum:
                          - auth_mfa_phone_default
                      - type: string
                        enum:
                          - auth_mfa_web_authn_default
                      - type: string
                        enum:
                          - log_drain_default
                      - type: string
                        enum:
                          - etl_pipeline_default
                  name:
                    type: string
                  price:
                    type: object
                    properties:
                      description:
                        type: string
                      type:
                        type: string
                        enum:
                          - fixed
                          - usage
                      interval:
                        type: string
                        enum:
                          - monthly
                          - hourly
                      amount:
                        type: number
                    required:
                      - description
                      - type
                      - interval
                      - amount
                  meta:
                    $ref: '#/components/schemas/ListProjectAddonsResponseJsonValue'
                required:
                  - id
                  - name
                  - price
            required:
              - type
              - variant
        available_addons:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - custom_domain
                  - compute_instance
                  - pitr
                  - ipv4
                  - auth_mfa_phone
                  - auth_mfa_web_authn
                  - log_drain
                  - etl_pipeline
              name:
                type: string
              variants:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      anyOf:
                        - type: string
                          enum:
                            - ci_micro
                            - ci_small
                            - ci_medium
                            - ci_large
                            - ci_xlarge
                            - ci_2xlarge
                            - ci_4xlarge
                            - ci_8xlarge
                            - ci_12xlarge
                            - ci_16xlarge
                            - ci_24xlarge
                            - ci_24xlarge_optimized_cpu
                            - ci_24xlarge_optimized_memory
                            - ci_24xlarge_high_memory
                            - ci_48xlarge
                            - ci_48xlarge_optimized_cpu
                            - ci_48xlarge_optimized_memory
                            - ci_48xlarge_high_memory
                        - type: string
                          enum:
                            - cd_default
                        - type: string
                          enum:
                            - pitr_7
                            - pitr_14
                            - pitr_28
                        - type: string
                          enum:
                            - ipv4_default
                        - type: string
                          enum:
                            - auth_mfa_phone_default
                        - type: string
                          enum:
                            - auth_mfa_web_authn_default
                        - type: string
                          enum:
                            - log_drain_default
                        - type: string
                          enum:
                            - etl_pipeline_default
                    name:
                      type: string
                    price:
                      type: object
                      properties:
                        description:
                          type: string
                        type:
                          type: string
                          enum:
                            - fixed
                            - usage
                        interval:
                          type: string
                          enum:
                            - monthly
                            - hourly
                        amount:
                          type: number
                      required:
                        - description
                        - type
                        - interval
                        - amount
                    meta:
                      $ref: '#/components/schemas/ListProjectAddonsResponseJsonValue'
                  required:
                    - id
                    - name
                    - price
            required:
              - type
              - name
              - variants
      required:
        - selected_addons
        - available_addons
    ApplyProjectAddonBody:
      type: object
      properties:
        addon_variant:
          type: string
          enum:
            - ci_micro
            - ci_small
            - ci_medium
            - ci_large
            - ci_xlarge
            - ci_2xlarge
            - ci_4xlarge
            - ci_8xlarge
            - ci_12xlarge
            - ci_16xlarge
            - ci_24xlarge
            - ci_24xlarge_optimized_cpu
            - ci_24xlarge_optimized_memory
            - ci_24xlarge_high_memory
            - ci_48xlarge
            - ci_48xlarge_optimized_cpu
            - ci_48xlarge_optimized_memory
            - ci_48xlarge_high_memory
        addon_type:
          type: string
          enum:
            - custom_domain
            - compute_instance
            - pitr
            - ipv4
            - auth_mfa_phone
            - auth_mfa_web_authn
            - log_drain
            - etl_pipeline
      required:
        - addon_variant
        - addon_type
      example:
        addon_variant: pitr_7
        addon_type: pitr
    ListProjectAddonsResponseJsonValue:
      description: Any JSON-serializable value
      anyOf:
        - type: string
        - type: number
        - type: boolean
      nullable: true
      type: array
      items:
        $ref: '#/components/schemas/ListProjectAddonsResponseJsonValue'
      additionalProperties:
        $ref: '#/components/schemas/ListProjectAddonsResponseJsonValue'
  x-stackQL-resources:
    addons:
      id: supabase.billing.addons
      name: addons
      title: Addons
      methods:
        list:
          operation:
            $ref: '#/paths/~1billing~1addons/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.selected_addons
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1billing~1addons/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete:
          operation:
            $ref: '#/paths/~1billing~1addons~1{addon_variant}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/addons/methods/list'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/addons/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/addons/methods/delete'
        replace: []
servers:
  - url: https://api.supabase.com/v1/projects/{ref}
    variables:
      ref:
        description: Supabase project reference (the Project ID shown in the dashboard under Settings -> General; 20 lowercase letters). Resolved from the SUPABASE_PROJECT_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every project-scoped query as WHERE ref = '<ref>'. A WHERE value always takes precedence over the environment.
        x-stackQL-envVar: SUPABASE_PROJECT_ID
