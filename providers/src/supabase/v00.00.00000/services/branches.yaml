openapi: 3.0.0
info:
  title: branches API
  description: supabase branches API
  version: 1.0.0
paths:
  /v1/branches/{branch_id_or_ref}:
    get:
      description: Fetches configurations of the specified database branch
      operationId: v1-get-a-branch-config
      parameters:
        - name: branch_id_or_ref
          required: true
          in: path
          description: Branch ref or deprecated branch ID
          schema:
            example: abcdefghijklmnopqrst
            anyOf:
              - type: string
                minLength: 20
                maxLength: 20
                pattern: ^[a-z]+$
                description: Project ref
                example: abcdefghijklmnopqrst
              - type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                deprecated: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDetailResponse'
        '500':
          description: Failed to retrieve database branch
      security:
        - bearer: []
      summary: Get database branch config
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:read'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_read
        - - branching_production_read
      x-oauth-scope: environment:read
    patch:
      description: Updates the configuration of the specified database branch
      operationId: v1-update-a-branch-config
      parameters:
        - name: branch_id_or_ref
          required: true
          in: path
          description: Branch ref or deprecated branch ID
          schema:
            example: abcdefghijklmnopqrst
            anyOf:
              - type: string
                minLength: 20
                maxLength: 20
                pattern: ^[a-z]+$
                description: Project ref
                example: abcdefghijklmnopqrst
              - type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '500':
          description: Failed to update database branch
      security:
        - bearer: []
      summary: Update database branch config
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_write
        - - branching_production_write
      x-oauth-scope: environment:write
    delete:
      description: Deletes the specified database branch. By default, deletes immediately. Use force=false to schedule deletion with 1-hour grace period (only when soft deletion is enabled).
      operationId: v1-delete-a-branch
      parameters:
        - name: branch_id_or_ref
          required: true
          in: path
          description: Branch ref or deprecated branch ID
          schema:
            example: abcdefghijklmnopqrst
            anyOf:
              - type: string
                minLength: 20
                maxLength: 20
                pattern: ^[a-z]+$
                description: Project ref
                example: abcdefghijklmnopqrst
              - type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                deprecated: true
        - name: force
          required: false
          in: query
          description: If set to false, schedule deletion with 1-hour grace period (only when soft deletion is enabled).
          schema:
            example: false
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDeleteResponse'
        '500':
          description: Failed to delete database branch
      security:
        - bearer: []
      summary: Delete a database branch
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_delete
        - - branching_production_delete
      x-oauth-scope: environment:write
    servers:
      - url: https://api.supabase.com
  /v1/branches/{branch_id_or_ref}/push:
    post:
      description: Pushes the specified database branch
      operationId: v1-push-a-branch
      parameters:
        - name: branch_id_or_ref
          required: true
          in: path
          description: Branch ref or deprecated branch ID
          schema:
            example: abcdefghijklmnopqrst
            anyOf:
              - type: string
                minLength: 20
                maxLength: 20
                pattern: ^[a-z]+$
                description: Project ref
                example: abcdefghijklmnopqrst
              - type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchActionBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchUpdateResponse'
        '500':
          description: Failed to push database branch
      security:
        - bearer: []
      summary: Pushes a database branch
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_write
        - - branching_production_write
      x-oauth-scope: environment:write
    servers:
      - url: https://api.supabase.com
  /v1/branches/{branch_id_or_ref}/merge:
    post:
      description: Merges the specified database branch
      operationId: v1-merge-a-branch
      parameters:
        - name: branch_id_or_ref
          required: true
          in: path
          description: Branch ref or deprecated branch ID
          schema:
            example: abcdefghijklmnopqrst
            anyOf:
              - type: string
                minLength: 20
                maxLength: 20
                pattern: ^[a-z]+$
                description: Project ref
                example: abcdefghijklmnopqrst
              - type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchActionBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchUpdateResponse'
        '500':
          description: Failed to merge database branch
      security:
        - bearer: []
      summary: Merges a database branch
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_write
        - - branching_production_write
      x-oauth-scope: environment:write
    servers:
      - url: https://api.supabase.com
  /v1/branches/{branch_id_or_ref}/reset:
    post:
      description: Resets the specified database branch
      operationId: v1-reset-a-branch
      parameters:
        - name: branch_id_or_ref
          required: true
          in: path
          description: Branch ref or deprecated branch ID
          schema:
            example: abcdefghijklmnopqrst
            anyOf:
              - type: string
                minLength: 20
                maxLength: 20
                pattern: ^[a-z]+$
                description: Project ref
                example: abcdefghijklmnopqrst
              - type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchActionBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchUpdateResponse'
        '500':
          description: Failed to reset database branch
      security:
        - bearer: []
      summary: Resets a database branch
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_write
        - - branching_production_write
      x-oauth-scope: environment:write
    servers:
      - url: https://api.supabase.com
  /v1/branches/{branch_id_or_ref}/restore:
    post:
      description: Cancels scheduled deletion and restores the branch to active state
      operationId: v1-restore-a-branch
      parameters:
        - name: branch_id_or_ref
          required: true
          in: path
          description: Branch ref or deprecated branch ID
          schema:
            example: abcdefghijklmnopqrst
            anyOf:
              - type: string
                minLength: 20
                maxLength: 20
                pattern: ^[a-z]+$
                description: Project ref
                example: abcdefghijklmnopqrst
              - type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                deprecated: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchRestoreResponse'
        '500':
          description: Failed to restore database branch
      security:
        - bearer: []
      summary: Restore a scheduled branch deletion
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_write
        - - branching_production_write
      x-oauth-scope: environment:write
    servers:
      - url: https://api.supabase.com
  /v1/branches/{branch_id_or_ref}/diff:
    get:
      description: Diffs the specified database branch
      operationId: v1-diff-a-branch
      parameters:
        - name: branch_id_or_ref
          required: true
          in: path
          description: Branch ref or deprecated branch ID
          schema:
            example: abcdefghijklmnopqrst
            anyOf:
              - type: string
                minLength: 20
                maxLength: 20
                pattern: ^[a-z]+$
                description: Project ref
                example: abcdefghijklmnopqrst
              - type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                deprecated: true
        - name: included_schemas
          required: false
          in: query
          schema:
            example: public,auth
            type: string
        - name: pgdelta
          required: false
          in: query
          description: |-
            Use pg-delta instead of Migra for diffing when true. 
            Boolean string.

            Truthy values: `true`, `1`, `yes`, `on`, `y`, `enabled`

            Falsy values: `false`, `0`, `no`, `off`, `n`, `disabled`
          schema:
            example: 'true'
            type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: ''
        '500':
          description: Failed to diff database branch
      security:
        - bearer: []
      summary: '[Beta] Diffs a database branch'
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_write
        - - branching_production_write
      x-oauth-scope: environment:write
    servers:
      - url: https://api.supabase.com
  /actions:
    head:
      description: Returns the total number of action runs of the specified project.
      operationId: v1-count-action-runs
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
      responses:
        '200':
          headers:
            X-Total-Count:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: total count value
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to count action runs
      security:
        - bearer: []
      summary: Count the number of action runs
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:read'
          position: after
      x-fga-permissions:
        - - action_runs_read
      x-oauth-scope: environment:read
    get:
      description: Returns a paginated list of action runs of the specified project.
      operationId: v1-list-action-runs
      parameters:
        - name: offset
          required: false
          in: query
          schema:
            minimum: 0
            example: 0
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 10
            example: 20
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-list-action-runsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to list action runs
      security:
        - bearer: []
      summary: List all action runs
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:read'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - action_runs_read
      x-oauth-scope: environment:read
  /actions/{run_id}:
    get:
      description: Returns the current status of the specified action run.
      operationId: v1-get-action-run
      parameters:
        - name: run_id
          required: true
          in: path
          description: Action Run ID
          schema:
            example: run_01hq3q9m7y5q7e4a7x2c8m1p4n
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRunResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to get action run status
      security:
        - bearer: []
      summary: Get the status of an action run
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:read'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - action_runs_read
      x-oauth-scope: environment:read
  /actions/{run_id}/status:
    patch:
      description: Updates the status of an ongoing action run.
      operationId: v1-update-action-run-status
      parameters:
        - name: run_id
          required: true
          in: path
          description: Action Run ID
          schema:
            example: run_01hq3q9m7y5q7e4a7x2c8m1p4n
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRunStatusBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRunStatusResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to update action run status
      security:
        - bearer: []
      summary: Update the status of an action run
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - action_runs_write
      x-oauth-scope: environment:write
  /actions/{run_id}/logs:
    get:
      description: Returns the logs from the specified action run.
      operationId: v1-get-action-run-logs
      parameters:
        - name: run_id
          required: true
          in: path
          description: Action Run ID
          schema:
            example: run_01hq3q9m7y5q7e4a7x2c8m1p4n
            type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to get action run logs
      security:
        - bearer: []
      summary: Get the logs of an action run
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:read'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - action_runs_read
      x-oauth-scope: environment:read
  /branches:
    get:
      description: Returns all database branches of the specified project.
      operationId: v1-list-all-branches
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-list-all-branchesResponse'
        '500':
          description: Failed to retrieve database branches
      security:
        - bearer: []
      summary: List all database branches
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:read'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_read
        - - branching_production_read
      x-oauth-scope: environment:read
    post:
      description: Creates a database branch from the specified project.
      operationId: v1-create-a-branch
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '500':
          description: Failed to create database branch
      security:
        - bearer: []
      summary: Create a database branch
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_create
        - - branching_production_create
      x-oauth-scope: environment:write
    delete:
      description: Disables preview branching for the specified project
      operationId: v1-disable-preview-branching
      parameters: []
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to disable preview branching
      security:
        - bearer: []
      summary: Disables preview branching
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_production_delete
      x-oauth-scope: environment:write
  /branches/{name}:
    get:
      description: Fetches the specified database branch by its name.
      operationId: v1-get-a-branch
      parameters:
        - name: name
          required: true
          in: path
          schema:
            example: preview-login-page
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '500':
          description: Failed to fetch database branch
      security:
        - bearer: []
      summary: Get a database branch
      tags:
        - Environments
      x-badges:
        - name: 'OAuth scope: environment:read'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - branching_development_read
        - - branching_production_read
      x-oauth-scope: environment:read
components:
  schemas:
    BranchDetailResponse:
      type: object
      properties:
        ref:
          type: string
        postgres_version:
          type: string
        postgres_engine:
          type: string
        release_channel:
          type: string
        status:
          type: string
          enum:
            - INACTIVE
            - ACTIVE_HEALTHY
            - ACTIVE_UNHEALTHY
            - COMING_UP
            - UNKNOWN
            - GOING_DOWN
            - INIT_FAILED
            - REMOVED
            - RESTORING
            - UPGRADING
            - PAUSING
            - RESTORE_FAILED
            - RESTARTING
            - PAUSE_FAILED
            - RESIZING
        db_host:
          type: string
        db_port:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        db_user:
          type: string
        db_pass:
          type: string
        jwt_secret:
          type: string
      required:
        - ref
        - postgres_version
        - postgres_engine
        - release_channel
        - status
        - db_host
        - db_port
    UpdateBranchBody:
      type: object
      properties:
        branch_name:
          type: string
        git_branch:
          type: string
        reset_on_push:
          description: This field is deprecated and will be ignored. Use v1-reset-a-branch endpoint directly instead.
          deprecated: true
          type: boolean
        persistent:
          type: boolean
        status:
          type: string
          enum:
            - CREATING_PROJECT
            - RUNNING_MIGRATIONS
            - MIGRATIONS_PASSED
            - MIGRATIONS_FAILED
            - FUNCTIONS_DEPLOYED
            - FUNCTIONS_FAILED
        request_review:
          type: boolean
        notify_url:
          type: string
          format: uri
          description: HTTP endpoint to receive branch status updates.
      example:
        branch_name: preview-login-page
        git_branch: feature/login-page
        persistent: true
        request_review: true
        notify_url: https://example.com/webhooks/branches
    BranchResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
        project_ref:
          type: string
        parent_project_ref:
          type: string
        is_default:
          type: boolean
        git_branch:
          type: string
        pr_number:
          type: integer
          format: int32
          minimum: -9007199254740991
