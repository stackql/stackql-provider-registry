openapi: 3.0.0
info:
  title: domains API
  description: Domains related endpoints
  version: 1.0.0
paths:
  /custom-hostname:
    get:
      operationId: v1-get-hostname-config
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomHostnameResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project's custom hostname config
      security:
        - bearer: []
      summary: '[Beta] Gets project''s custom hostname config'
      tags:
        - Domains
      x-badges:
        - name: 'OAuth scope: domains:read'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - custom_domain_read
      x-oauth-scope: domains:read
    delete:
      operationId: v1-Delete hostname config
      parameters:
        - name: remove_addon
          required: false
          in: query
          description: If true, also removes the custom domain add-on from the project subscription.
          schema:
            type: string
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to delete project custom hostname configuration
      security:
        - bearer: []
      summary: '[Beta] Deletes a project''s custom hostname configuration'
      tags:
        - Domains
      x-badges:
        - name: 'OAuth scope: domains:write'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - custom_domain_write
      x-oauth-scope: domains:write
  /custom-hostname/initialize:
    post:
      operationId: v1-update-hostname-config
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomHostnameBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomHostnameResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to update project custom hostname configuration
      security:
        - bearer: []
      summary: '[Beta] Updates project''s custom hostname configuration'
      tags:
        - Domains
      x-badges:
        - name: 'OAuth scope: domains:write'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - custom_domain_write
      x-oauth-scope: domains:write
  /custom-hostname/reverify:
    post:
      operationId: v1-verify-dns-config
      parameters: []
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomHostnameResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to verify project custom hostname configuration
      security:
        - bearer: []
      summary: '[Beta] Attempts to verify the DNS configuration for project''s custom hostname configuration'
      tags:
        - Domains
      x-badges:
        - name: 'OAuth scope: domains:write'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - custom_domain_write
      x-oauth-scope: domains:write
  /custom-hostname/activate:
    post:
      operationId: v1-activate-custom-hostname
      parameters: []
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomHostnameResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to activate project custom hostname configuration
      security:
        - bearer: []
      summary: '[Beta] Activates a custom hostname for a project.'
      tags:
        - Domains
      x-badges:
        - name: 'OAuth scope: domains:write'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - custom_domain_write
      x-oauth-scope: domains:write
  /vanity-subdomain:
    get:
      operationId: v1-get-vanity-subdomain-config
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VanitySubdomainConfigResponse'
        '400':
          description: This feature requires the Pro, Team, or Enterprise organization plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanGateErrorBody'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to get project vanity subdomain configuration
      security:
        - bearer: []
      summary: '[Beta] Gets current vanity subdomain config'
      tags:
        - Domains
      x-allowed-plans:
        - Pro
        - Team
        - Enterprise
      x-badges:
        - name: 'OAuth scope: domains:read'
          position: after
        - name: Only available on Pro, Team, Enterprise
          position: before
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - vanity_subdomain_read
      x-oauth-scope: domains:read
    delete:
      operationId: v1-deactivate-vanity-subdomain-config
      parameters: []
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to delete project vanity subdomain configuration
      security:
        - bearer: []
      summary: '[Beta] Deletes a project''s vanity subdomain configuration'
      tags:
        - Domains
      x-badges:
        - name: 'OAuth scope: domains:write'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - vanity_subdomain_write
      x-oauth-scope: domains:write
  /vanity-subdomain/check-availability:
    post:
      operationId: v1-check-vanity-subdomain-availability
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VanitySubdomainBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubdomainAvailabilityResponse'
        '400':
          description: This feature requires the Pro, Team, or Enterprise organization plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanGateErrorBody'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to check project vanity subdomain configuration
      security:
        - bearer: []
      summary: '[Beta] Checks vanity subdomain availability'
      tags:
        - Domains
      x-allowed-plans:
        - Pro
        - Team
        - Enterprise
      x-badges:
        - name: 'OAuth scope: domains:write'
          position: after
        - name: Only available on Pro, Team, Enterprise
          position: before
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - vanity_subdomain_write
      x-oauth-scope: domains:write
  /vanity-subdomain/activate:
    post:
      operationId: v1-activate-vanity-subdomain-config
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VanitySubdomainBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateVanitySubdomainResponse'
        '400':
          description: This feature requires the Pro, Team, or Enterprise organization plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanGateErrorBody'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to activate project vanity subdomain configuration
      security:
        - bearer: []
      summary: '[Beta] Activates a vanity subdomain for a project.'
      tags:
        - Domains
      x-allowed-plans:
        - Pro
        - Team
        - Enterprise
      x-badges:
        - name: 'OAuth scope: domains:write'
          position: after
        - name: Only available on Pro, Team, Enterprise
          position: before
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - vanity_subdomain_write
      x-oauth-scope: domains:write
components:
  schemas:
    UpdateCustomHostnameResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - 1_not_started
            - 2_initiated
            - 3_challenge_verified
            - 4_origin_setup_completed
            - 5_services_reconfigured
        custom_hostname:
          type: string
        data:
          type: object
          properties:
            success:
              type: boolean
            errors:
              type: array
              items:
                $ref: '#/components/schemas/UpdateCustomHostnameResponseJsonValue'
            messages:
              type: array
              items:
                $ref: '#/components/schemas/UpdateCustomHostnameResponseJsonValue'
            result:
              type: object
              properties:
                id:
                  type: string
                hostname:
                  type: string
                ssl:
                  type: object
                  properties:
                    status:
                      type: string
                    validation_records:
                      type: array
                      items:
                        type: object
                        properties:
                          txt_name:
                            type: string
                          txt_value:
                            type: string
                        required:
                          - txt_name
                          - txt_value
                    validation_errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                        required:
                          - message
                  required:
                    - status
                    - validation_records
                ownership_verification:
                  type: object
                  properties:
                    type:
                      type: string
                    name:
                      type: string
                    value:
                      type: string
                  required:
                    - type
                    - name
                    - value
                custom_origin_server:
                  type: string
                verification_errors:
                  type: array
                  items:
                    type: string
                status:
                  type: string
              required:
                - id
                - hostname
                - ssl
                - ownership_verification
                - custom_origin_server
                - status
          required:
            - success
            - errors
            - messages
            - result
      required:
        - status
        - custom_hostname
        - data
    UpdateCustomHostnameBody:
      type: object
      properties:
        custom_hostname:
          type: string
          minLength: 1
          maxLength: 253
      required:
        - custom_hostname
      example:
        custom_hostname: docs.example.com
    VanitySubdomainConfigResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - not-used
            - custom-domain-used
            - active
        custom_domain:
          type: string
          minLength: 1
      required:
        - status
    PlanGateErrorBody:
      type: object
      properties:
        message:
          type: string
          description: Human-readable explanation of the plan gate
        error:
          description: Present on entitlement denials. Other errors with this status code (validation, billing state) carry only message.
          type: object
          properties:
            code:
              type: string
              description: Machine-readable marker for plan-gated denials
              enum:
                - entitlement_required
            feature:
              type: string
              description: Entitlement feature key that failed the check
            upgrade_url:
              description: Billing page URL for the organization, present when the org is resolvable
              type: string
          required:
            - code
            - feature
      required:
        - message
    VanitySubdomainBody:
      type: object
      properties:
        vanity_subdomain:
          type: string
          maxLength: 63
      required:
        - vanity_subdomain
      example:
        vanity_subdomain: acme-prod
    SubdomainAvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
      required:
        - available
    ActivateVanitySubdomainResponse:
      type: object
      properties:
        custom_domain:
          type: string
      required:
        - custom_domain
    UpdateCustomHostnameResponseJsonValue:
      description: Any JSON-serializable value
      anyOf:
        - type: string
        - type: number
        - type: boolean
      nullable: true
      type: array
      items:
        $ref: '#/components/schemas/UpdateCustomHostnameResponseJsonValue'
      additionalProperties:
        $ref: '#/components/schemas/UpdateCustomHostnameResponseJsonValue'
  x-stackQL-resources:
    custom_hostnames:
      id: supabase.domains.custom_hostnames
      name: custom_hostnames
      title: Custom Hostnames
      methods:
        get:
          operation:
            $ref: '#/paths/~1custom-hostname/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete:
          operation:
            $ref: '#/paths/~1custom-hostname/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        initialize:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1custom-hostname~1initialize/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        reverify:
          operation:
            $ref: '#/paths/~1custom-hostname~1reverify/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        activate:
          operation:
            $ref: '#/paths/~1custom-hostname~1activate/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/custom_hostnames/methods/get'
        insert: []
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/custom_hostnames/methods/delete'
        replace: []
    vanity_subdomains:
      id: supabase.domains.vanity_subdomains
      name: vanity_subdomains
      title: Vanity Subdomains
      methods:
        get:
          operation:
            $ref: '#/paths/~1vanity-subdomain/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete:
          operation:
            $ref: '#/paths/~1vanity-subdomain/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        check_availability:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1vanity-subdomain~1check-availability/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        activate:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1vanity-subdomain~1activate/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/vanity_subdomains/methods/get'
        insert: []
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/vanity_subdomains/methods/delete'
        replace: []
servers:
  - url: https://api.supabase.com/v1/projects/{ref}
    variables:
      ref:
        description: Supabase project reference (the Project ID shown in the dashboard under Settings -> General; 20 lowercase letters). Resolved from the SUPABASE_PROJECT_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every project-scoped query as WHERE ref = '<ref>'. A WHERE value always takes precedence over the environment.
        x-stackQL-envVar: SUPABASE_PROJECT_ID
