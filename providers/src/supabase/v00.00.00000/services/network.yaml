openapi: 3.0.0
info:
  title: network API
  description: supabase network API
  version: 1.0.0
paths:
  /network-bans/retrieve:
    post:
      operationId: v1-list-all-network-bans
      parameters: []
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkBanResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project's network bans
      security:
        - bearer: []
      summary: '[Beta] Gets project''s network bans'
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - database_network_bans_read
      x-oauth-scope: projects:read
  /network-bans/retrieve/enriched:
    post:
      operationId: v1-list-all-network-bans-enriched
      parameters: []
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkBanResponseEnriched'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project's enriched network bans
      security:
        - bearer: []
      summary: '[Beta] Gets project''s network bans with additional information about which databases they affect'
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - database_network_bans_read
      x-oauth-scope: projects:read
  /network-bans:
    delete:
      operationId: v1-delete-network-bans
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveNetworkBanRequest'
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to remove network bans.
      security:
        - bearer: []
      summary: '[Beta] Remove network bans.'
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - database_network_bans_write
      x-oauth-scope: projects:write
  /network-restrictions:
    get:
      operationId: v1-get-network-restrictions
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRestrictionsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project's network restrictions
      security:
        - bearer: []
      summary: '[Beta] Gets project''s network restrictions'
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - database_network_restrictions_read
      x-oauth-scope: projects:read
    patch:
      operationId: v1-patch-network-restrictions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkRestrictionsPatchRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRestrictionsV2Response'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to update project network restrictions
      security:
        - bearer: []
      summary: '[Alpha] Updates project''s network restrictions by adding or removing CIDRs'
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - database_network_restrictions_write
      x-oauth-scope: projects:write
  /network-restrictions/apply:
    post:
      operationId: v1-update-network-restrictions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkRestrictionsRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRestrictionsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to update project network restrictions
      security:
        - bearer: []
      summary: '[Beta] Updates project''s network restrictions'
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - database_network_restrictions_write
      x-oauth-scope: projects:write
components:
  schemas:
    NetworkBanResponse:
      type: object
      properties:
        banned_ipv4_addresses:
          type: array
          items:
            type: string
      required:
        - banned_ipv4_addresses
    NetworkBanResponseEnriched:
      type: object
      properties:
        banned_ipv4_addresses:
          type: array
          items:
            type: object
            properties:
              banned_address:
                type: string
              identifier:
                type: string
              type:
                type: string
            required:
              - banned_address
              - identifier
              - type
      required:
        - banned_ipv4_addresses
    RemoveNetworkBanRequest:
      type: object
      properties:
        ipv4_addresses:
          type: array
          items:
            type: string
          description: List of IP addresses to unban.
        requester_ip:
          default: false
          description: Include requester's public IP in the list of addresses to unban.
          type: boolean
        identifier:
          type: string
      required:
        - ipv4_addresses
      example:
        ipv4_addresses:
          - 203.0.113.10
        requester_ip: false
    NetworkRestrictionsResponse:
      type: object
      properties:
        entitlement:
          type: string
          enum:
            - disallowed
            - allowed
        config:
          type: object
          properties:
            dbAllowedCidrs:
              type: array
              items:
                type: string
            dbAllowedCidrsV6:
              type: array
              items:
                type: string
          example:
            dbAllowedCidrs:
              - 203.0.113.0/24
            dbAllowedCidrsV6:
              - 2001:db8::/32
          description: At any given point in time, this is the config that the user has requested be applied to their project. The `status` field indicates if it has been applied to the project, or is pending. When an updated config is received, the applied config is moved to `old_config`.
        old_config:
          description: Populated when a new config has been received, but not registered as successfully applied to a project.
          type: object
          properties:
            dbAllowedCidrs:
              type: array
              items:
                type: string
            dbAllowedCidrsV6:
              type: array
              items:
                type: string
          example:
            dbAllowedCidrs:
              - 203.0.113.0/24
            dbAllowedCidrsV6:
              - 2001:db8::/32
        status:
          type: string
          enum:
            - stored
            - applied
        updated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        applied_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - entitlement
        - config
        - status
    NetworkRestrictionsPatchRequest:
      type: object
      properties:
        add:
          type: object
          properties:
            dbAllowedCidrs:
              type: array
              items:
                type: string
            dbAllowedCidrsV6:
              type: array
              items:
                type: string
        remove:
          type: object
          properties:
            dbAllowedCidrs:
              type: array
              items:
                type: string
            dbAllowedCidrsV6:
              type: array
              items:
                type: string
      example:
        add:
          dbAllowedCidrs:
            - 203.0.113.0/24
        remove:
          dbAllowedCidrs:
            - 198.51.100.0/24
    NetworkRestrictionsV2Response:
      type: object
      properties:
        entitlement:
          type: string
          enum:
            - disallowed
            - allowed
        config:
          type: object
          properties:
            dbAllowedCidrs:
              type: array
              items:
                type: object
                properties:
                  address:
                    type: string
                  type:
                    type: string
                    enum:
                      - v4
                      - v6
                required:
                  - address
                  - type
          description: At any given point in time, this is the config that the user has requested be applied to their project. The `status` field indicates if it has been applied to the project, or is pending. When an updated config is received, the applied config is moved to `old_config`.
        old_config:
          description: Populated when a new config has been received, but not registered as successfully applied to a project.
          type: object
          properties:
            dbAllowedCidrs:
              type: array
              items:
                type: object
                properties:
                  address:
                    type: string
                  type:
                    type: string
                    enum:
                      - v4
                      - v6
                required:
                  - address
                  - type
        updated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        applied_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        status:
          type: string
          enum:
            - stored
            - applied
      required:
        - entitlement
        - config
        - status
    NetworkRestrictionsRequest:
      type: object
      properties:
        dbAllowedCidrs:
          type: array
          items:
            type: string
        dbAllowedCidrsV6:
          type: array
          items:
            type: string
      example:
        dbAllowedCidrs:
          - 203.0.113.0/24
        dbAllowedCidrsV6:
          - 2001:db8::/32
  x-stackQL-resources:
    network_bans:
      id: supabase.network.network_bans
      name: network_bans
      title: Network Bans
      methods:
        retrieve:
          operation:
            $ref: '#/paths/~1network-bans~1retrieve/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        list:
          operation:
            $ref: '#/paths/~1network-bans~1retrieve~1enriched/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
            objectKey: $.banned_ipv4_addresses
        delete:
          operation:
            $ref: '#/paths/~1network-bans/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          config:
            requestBodyTranslate:
              algorithm: naive
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/network_bans/methods/list'
        insert: []
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/network_bans/methods/delete'
        replace: []
    network_restrictions:
      id: supabase.network.network_restrictions
      name: network_restrictions
      title: Network Restrictions
      methods:
        get:
          operation:
            $ref: '#/paths/~1network-restrictions/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1network-restrictions/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        apply:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1network-restrictions~1apply/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/network_restrictions/methods/get'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/network_restrictions/methods/update'
        delete: []
        replace: []
servers:
  - url: https://api.supabase.com/v1/projects/{ref}
    variables:
      ref:
        description: Supabase project reference (the Project ID shown in the dashboard under Settings -> General; 20 lowercase letters). Resolved from the SUPABASE_PROJECT_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every project-scoped query as WHERE ref = '<ref>'. A WHERE value always takes precedence over the environment.
        x-stackQL-envVar: SUPABASE_PROJECT_ID
