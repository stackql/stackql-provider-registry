    get:
      operationId: v1-get-pgsodium-config
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PgsodiumConfigResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project's pgsodium config
      security:
        - bearer: []
      summary: '[Beta] Gets project''s pgsodium config'
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:read'
          position: after
      x-endpoint-owners:
        - infra
      x-fga-permissions:
        - - project_admin_write
      x-oauth-scope: secrets:read
    put:
      operationId: v1-update-pgsodium-config
