components:
  schemas:
    PgsodiumConfigResponse:
      type: object
      properties:
        root_key:
          type: string
          description: 'The pgsodium root key: 32 bytes, hex-encoded (64 characters).'
      required:
        - root_key
      example:
        root_key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    UpdatePgsodiumConfigBody:
      type: object
      properties:
        root_key:
          type: string
          description: 'The pgsodium root key: 32 bytes, hex-encoded (64 characters).'
      required:
        - root_key
      example:
        root_key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    PostgrestConfigWithJWTSecretResponse:
      type: object
      properties:
        db_schema:
          type: string
        max_rows:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        db_extra_search_path:
          type: string
        db_pool:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: If `null`, the value is automatically configured based on compute size.
          nullable: true
        db_pool_acquisition_timeout:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: If `null`, the value is automatically configured to 10.
          nullable: true
        jwt_secret:
          type: string
      required:
        - db_schema
        - max_rows
        - db_extra_search_path
        - db_pool
        - db_pool_acquisition_timeout
    V1UpdatePostgrestConfigBody:
      type: object
      properties:
        db_extra_search_path:
          type: string
        db_schema:
          type: string
        max_rows:
          type: integer
          minimum: 0
          maximum: 1000000
        db_pool:
          type: integer
          minimum: 0
          maximum: 1000
        db_pool_acquisition_timeout:
          type: integer
          minimum: 0
          maximum: 60
      example:
        db_schema: public,storage
        db_pool: 20
        max_rows: 1000
    V1PostgrestConfigResponse:
      type: object
      properties:
        db_schema:
          type: string
        max_rows:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        db_extra_search_path:
          type: string
        db_pool:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: If `null`, the value is automatically configured based on compute size.
          nullable: true
        db_pool_acquisition_timeout:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: If `null`, the value is automatically configured to 10.
          nullable: true
      required:
        - db_schema
        - max_rows
        - db_extra_search_path
        - db_pool
        - db_pool_acquisition_timeout
    SslEnforcementResponse:
      type: object
      properties:
        currentConfig:
          type: object
          properties:
            database:
              type: boolean
          required:
            - database
        appliedSuccessfully:
          type: boolean
      required:
        - currentConfig
        - appliedSuccessfully
    SslEnforcementRequest:
      type: object
      properties:
        requestedConfig:
          type: object
          properties:
            database:
              type: boolean
          required:
            - database
      required:
        - requestedConfig
      example:
        requestedConfig:
          database: true
    SigningKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        algorithm:
          type: string
          enum:
            - EdDSA
            - ES256
            - RS256
            - HS256
        status:
          type: string
          enum:
            - in_use
            - previously_used
            - revoked
            - standby
        public_jwk:
          nullable: true
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - algorithm
        - status
        - public_jwk
        - created_at
        - updated_at
      additionalProperties: false
    CreateSigningKeyBody:
      type: object
      properties:
        algorithm:
          type: string
          enum:
            - EdDSA
            - ES256
            - RS256
            - HS256
        status:
          type: string
          enum:
            - in_use
            - standby
        private_jwk:
          type: object
          properties:
            kid:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            use:
              type: string
              enum:
                - sig
            key_ops:
              minItems: 2
              maxItems: 2
              type: array
              items:
                type: string
                enum:
                  - sign
                  - verify
            ext:
              type: boolean
              enum:
                - true
            kty:
              type: string
              enum:
                - RSA
            alg:
              type: string
              enum:
                - RS256
            'n':
              type: string
            e:
              type: string
              enum:
                - AQAB
            d:
              type: string
            p:
              type: string
            q:
              type: string
            dp:
              type: string
            dq:
              type: string
            qi:
              type: string
            crv:
              type: string
              enum:
                - P-256
            x:
              type: string
            'y':
              type: string
            k:
              type: string
              minLength: 16
          required:
            - kty
            - 'n'
            - e
            - d
            - p
            - q
            - dp
            - dq
            - qi
            - crv
            - x
            - 'y'
            - k
          additionalProperties: false
      required:
        - algorithm
      example:
        algorithm: RS256
        status: standby
      additionalProperties: false
    SigningKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              algorithm:
                type: string
                enum:
                  - EdDSA
                  - ES256
                  - RS256
                  - HS256
              status:
                type: string
                enum:
                  - in_use
                  - previously_used
                  - revoked
                  - standby
              public_jwk:
                nullable: true
              created_at:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              updated_at:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            required:
              - id
              - algorithm
              - status
              - public_jwk
              - created_at
              - updated_at
            additionalProperties: false
      required:
        - keys
      additionalProperties: false
    UpdateSigningKeyBody:
      type: object
      properties:
        status:
          type: string
