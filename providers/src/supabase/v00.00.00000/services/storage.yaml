openapi: 3.0.0
info:
  title: storage API
  description: Visit [https://supabase.github.io/storage/](https://supabase.github.io/storage/) for complete documentation.
  version: 1.0.0
paths:
  /storage/buckets:
    get:
      operationId: v1-list-all-buckets
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-list-all-bucketsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to get list of buckets
      security:
        - bearer: []
      summary: Lists all buckets
      tags:
        - Storage
      x-badges:
        - name: 'OAuth scope: storage:read'
          position: after
      x-endpoint-owners:
        - storage
      x-fga-permissions:
        - - storage_read
      x-oauth-scope: storage:read
components:
  schemas:
    V1StorageBucketResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        public:
          type: boolean
      required:
        - id
        - name
        - owner
        - created_at
        - updated_at
        - public
    V1-list-all-bucketsResponse:
      type: object
      properties:
        v1_list_all_buckets:
          type: array
          items:
            $ref: '#/components/schemas/V1StorageBucketResponse'
  x-stackQL-resources:
    buckets:
      id: supabase.storage.buckets
      name: buckets
      title: Buckets
      methods:
        list:
          operation:
            $ref: '#/paths/~1storage~1buckets/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_list_all_buckets
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/V1-list-all-bucketsResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_list_all_buckets\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/buckets/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.supabase.com/v1/projects/{ref}
    variables:
      ref:
        description: Supabase project reference (the Project ID shown in the dashboard under Settings -> General; 20 lowercase letters). Resolved from the SUPABASE_PROJECT_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every project-scoped query as WHERE ref = '<ref>'. A WHERE value always takes precedence over the environment.
        x-stackQL-envVar: SUPABASE_PROJECT_ID
