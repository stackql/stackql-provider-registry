openapi: 3.0.0
info:
  title: functions API
  description: supabase functions API
  version: 1.0.0
paths:
  /functions:
    get:
      description: Returns all functions you've previously added to the specified project.
      operationId: v1-list-all-functions
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-list-all-functionsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project's functions
      security:
        - bearer: []
      summary: List all functions
      tags:
        - Edge Functions
      x-badges:
        - name: 'OAuth scope: edge_functions:read'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_read
      x-oauth-scope: edge_functions:read
    post:
      deprecated: true
      description: This endpoint is deprecated - use the deploy endpoint. Creates a function and adds it to the specified project.
      operationId: v1-create-a-function
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1CreateFunctionBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
        '401':
          description: Unauthorized
        '402':
          description: Maximum number of functions reached for Plan
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to create project's function
      security:
        - bearer: []
      summary: Create a function
      tags:
        - Edge Functions
      x-badges:
        - name: 'OAuth scope: edge_functions:write'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_write
      x-oauth-scope: edge_functions:write
    put:
      description: 'Bulk update functions. It will create a new function or replace existing. The operation is idempotent. NOTE: You will need to manually bump the version.'
      operationId: v1-bulk-update-functions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateFunctionBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateFunctionResponse'
        '401':
          description: Unauthorized
        '402':
          description: Maximum number of functions reached for Plan
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to update functions
      security:
        - bearer: []
      summary: Bulk update functions
      tags:
        - Edge Functions
      x-badges:
        - name: 'OAuth scope: edge_functions:write'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_write
      x-oauth-scope: edge_functions:write
  /functions/deploy:
    post:
      description: A new endpoint to deploy functions. It will create if function does not exist.
      operationId: v1-deploy-a-function
      parameters:
        - name: slug
          required: false
          in: query
          schema:
            pattern: ^[A-Za-z][A-Za-z0-9_-]*$
            example: hello-world
            type: string
        - name: bundleOnly
          required: false
          in: query
          schema:
            example: false
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FunctionDeployBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployFunctionResponse'
        '401':
          description: Unauthorized
        '402':
          description: Maximum number of functions reached for Plan
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to deploy function
      security:
        - bearer: []
      summary: Deploy a function
      tags:
        - Edge Functions
      x-badges:
        - name: 'OAuth scope: edge_functions:write'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_write
      x-oauth-scope: edge_functions:write
  /functions/{function_slug}:
    get:
      description: Retrieves a function with the specified slug and project.
      operationId: v1-get-a-function
      parameters:
        - name: function_slug
          required: true
          in: path
          description: Function slug
          schema:
            pattern: ^[A-Za-z0-9_-]+$
            example: hello-world
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionSlugResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve function with given slug
      security:
        - bearer: []
      summary: Retrieve a function
      tags:
        - Edge Functions
      x-badges:
        - name: 'OAuth scope: edge_functions:read'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_read
      x-oauth-scope: edge_functions:read
    patch:
      description: Updates a function with the specified slug and project.
      operationId: v1-update-a-function
      parameters:
        - name: function_slug
          required: true
          in: path
          description: Function slug
          schema:
            pattern: ^[A-Za-z0-9_-]+$
            example: hello-world
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1UpdateFunctionBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to update function with given slug
      security:
        - bearer: []
      summary: Update a function
      tags:
        - Edge Functions
      x-badges:
        - name: 'OAuth scope: edge_functions:write'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_write
      x-oauth-scope: edge_functions:write
    delete:
      description: Deletes a function with the specified slug from the specified project.
      operationId: v1-delete-a-function
      parameters:
        - name: function_slug
          required: true
          in: path
          description: Function slug
          schema:
            pattern: ^[A-Za-z0-9_-]+$
            example: hello-world
            type: string
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to delete function with given slug
      security:
        - bearer: []
      summary: Delete a function
      tags:
        - Edge Functions
      x-badges:
        - name: 'OAuth scope: edge_functions:write'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_write
      x-oauth-scope: edge_functions:write
  /functions/{function_slug}/body:
    get:
      description: Retrieves a function body for the specified slug and project.
      operationId: v1-get-a-function-body
      parameters:
        - name: function_slug
          required: true
          in: path
          description: Function slug
          schema:
            pattern: ^[A-Za-z0-9_-]+$
            example: hello-world
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamableFile'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve function body with given slug
      security:
        - bearer: []
      summary: Retrieve a function body
      tags:
        - Edge Functions
      x-badges:
        - name: 'OAuth scope: edge_functions:read'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_read
      x-oauth-scope: edge_functions:read
components:
  schemas:
    FunctionResponse:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - REMOVED
            - THROTTLED
        version:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        created_at:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          format: int64
        updated_at:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          format: int64
        verify_jwt:
          type: boolean
        import_map:
          type: boolean
        entrypoint_path:
          type: string
        import_map_path:
          type: string
        ezbr_sha256:
          type: string
      required:
        - id
        - slug
        - name
        - status
        - version
        - created_at
        - updated_at
    V1CreateFunctionBody:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_-]*$
        name:
          type: string
        body:
          type: string
        verify_jwt:
          type: boolean
      required:
        - slug
        - name
        - body
      example:
        slug: hello-world
        name: Hello World
        body: Deno.serve(() => new Response('Hello, world!'))
        verify_jwt: true
    BulkUpdateFunctionBody:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          slug:
            type: string
            pattern: ^[A-Za-z][A-Za-z0-9_-]*$
          name:
            type: string
          status:
            type: string
            enum:
              - ACTIVE
              - REMOVED
              - THROTTLED
          version:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          created_at:
            type: integer
            format: int64
            minimum: -9007199254740991
            maximum: 9007199254740991
          verify_jwt:
            type: boolean
          import_map:
            type: boolean
          entrypoint_path:
            type: string
          import_map_path:
            type: string
          ezbr_sha256:
            type: string
        required:
          - id
          - slug
          - name
          - status
          - version
      example:
        - id: 3c078cce-ad70-4148-9f37-4da362789053
          slug: hello-world
          name: Hello World
          status: ACTIVE
          version: 2
          verify_jwt: true
          entrypoint_path: index.ts
    BulkUpdateFunctionResponse:
      type: object
      properties:
        functions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              slug:
                type: string
              name:
                type: string
              status:
                type: string
                enum:
                  - ACTIVE
                  - REMOVED
                  - THROTTLED
              version:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              created_at:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
                format: int64
              updated_at:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
                format: int64
              verify_jwt:
                type: boolean
              import_map:
                type: boolean
              entrypoint_path:
                type: string
              import_map_path:
                type: string
              ezbr_sha256:
                type: string
            required:
              - id
              - slug
              - name
              - status
              - version
              - created_at
              - updated_at
      required:
        - functions
    FunctionDeployBody:
      type: object
      properties:
        file:
          type: array
          items:
            type: string
            format: binary
        metadata:
          type: object
          properties:
            entrypoint_path:
              type: string
            import_map_path:
              type: string
            static_patterns:
              type: array
              items:
                type: string
            verify_jwt:
              type: boolean
            name:
              type: string
          required:
            - entrypoint_path
      required:
        - file
        - metadata
      example:
        file:
          - ./supabase/functions/hello-world/index.ts
        metadata:
          entrypoint_path: index.ts
          verify_jwt: true
          name: Hello World
    DeployFunctionResponse:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - REMOVED
            - THROTTLED
        version:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        created_at:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
        updated_at:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
        verify_jwt:
          type: boolean
        import_map:
          type: boolean
        entrypoint_path:
          type: string
        import_map_path:
          type: string
        ezbr_sha256:
          type: string
      required:
        - id
        - slug
        - name
        - status
        - version
    FunctionSlugResponse:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - REMOVED
            - THROTTLED
        version:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        created_at:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          format: int64
        updated_at:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          format: int64
        verify_jwt:
          type: boolean
        import_map:
          type: boolean
        entrypoint_path:
          type: string
        import_map_path:
          type: string
        ezbr_sha256:
          type: string
      required:
        - id
        - slug
        - name
        - status
        - version
        - created_at
        - updated_at
    V1UpdateFunctionBody:
      type: object
      properties:
        name:
          type: string
        body:
          type: string
        verify_jwt:
          type: boolean
      example:
        name: Hello World
        body: Deno.serve(() => new Response('Hello again!'))
        verify_jwt: true
    StreamableFile:
      type: object
      properties: {}
    V1-list-all-functionsResponse:
      type: object
      properties:
        v1_list_all_functions:
          type: array
          items:
            $ref: '#/components/schemas/FunctionResponse'
  x-stackQL-resources:
    edge_functions:
      id: supabase.functions.edge_functions
      name: edge_functions
      title: Edge Functions
      methods:
        list:
          operation:
            $ref: '#/paths/~1functions/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_list_all_functions
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/V1-list-all-functionsResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_list_all_functions\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1functions/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        get:
          operation:
            $ref: '#/paths/~1functions~1{function_slug}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1functions~1{function_slug}/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete:
          operation:
            $ref: '#/paths/~1functions~1{function_slug}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/edge_functions/methods/get'
          - $ref: '#/components/x-stackQL-resources/edge_functions/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/edge_functions/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/edge_functions/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/edge_functions/methods/delete'
        replace: []
servers:
  - url: https://api.supabase.com/v1/projects/{ref}
    variables:
      ref:
        description: Supabase project reference (the Project ID shown in the dashboard under Settings -> General; 20 lowercase letters). Resolved from the SUPABASE_PROJECT_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every project-scoped query as WHERE ref = '<ref>'. A WHERE value always takes precedence over the environment.
        x-stackQL-envVar: SUPABASE_PROJECT_ID
