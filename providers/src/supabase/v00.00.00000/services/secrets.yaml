openapi: 3.0.0
info:
  title: secrets API
  description: Secrets related endpoints
  version: 1.0.0
paths:
  /api-keys:
    get:
      operationId: v1-get-project-api-keys
      parameters:
        - name: reveal
          required: false
          in: query
          description: |-
            Boolean string.

            Truthy values: `true`, `1`, `yes`, `on`, `y`, `enabled`

            Falsy values: `false`, `0`, `no`, `off`, `n`, `disabled`
          schema:
            example: 'true'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-get-project-api-keysResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Get project api keys
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:read'
          position: after
      x-endpoint-owners:
        - auth
        - control-plane
      x-fga-permissions:
        - - api_gateway_keys_read
      x-oauth-scope: secrets:read
    post:
      operationId: v1-create-project-api-key
      parameters:
        - name: reveal
          required: false
          in: query
          description: |-
            Boolean string.

            Truthy values: `true`, `1`, `yes`, `on`, `y`, `enabled`

            Falsy values: `false`, `0`, `no`, `off`, `n`, `disabled`
          schema:
            example: 'true'
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Creates a new API key for the project
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - auth
        - control-plane
      x-fga-permissions:
        - - api_gateway_keys_write
      x-oauth-scope: secrets:write
  /api-keys/legacy:
    get:
      operationId: v1-get-project-legacy-api-keys
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyApiKeysResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Check whether JWT based legacy (anon, service_role) API keys are enabled. This API endpoint will be removed in the future, check for HTTP 404 Not Found.
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:read'
          position: after
      x-endpoint-owners:
        - auth
        - control-plane
      x-fga-permissions:
        - - api_gateway_keys_read
      x-oauth-scope: secrets:read
    put:
      operationId: v1-update-project-legacy-api-keys
      parameters:
        - name: enabled
          required: true
          in: query
          description: |-
            Boolean string.

            Truthy values: `true`, `1`, `yes`, `on`, `y`, `enabled`

            Falsy values: `false`, `0`, `no`, `off`, `n`, `disabled`
          schema:
            example: 'true'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyApiKeysResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Disable or re-enable JWT based legacy (anon, service_role) API keys. This API endpoint will be removed in the future, check for HTTP 404 Not Found.
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - auth
        - control-plane
      x-fga-permissions:
        - - api_gateway_keys_write
      x-oauth-scope: secrets:write
  /api-keys/{id}:
    patch:
      operationId: v1-update-project-api-key
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            example: 22222222-2222-4222-8222-222222222222
            type: string
        - name: reveal
          required: false
          in: query
          description: |-
            Boolean string.

            Truthy values: `true`, `1`, `yes`, `on`, `y`, `enabled`

            Falsy values: `false`, `0`, `no`, `off`, `n`, `disabled`
          schema:
            example: 'true'
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Updates an API key for the project
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - auth
        - control-plane
      x-fga-permissions:
        - - api_gateway_keys_write
      x-oauth-scope: secrets:write
    get:
      operationId: v1-get-project-api-key
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            example: 22222222-2222-4222-8222-222222222222
            type: string
        - name: reveal
          required: false
          in: query
          description: |-
            Boolean string.

            Truthy values: `true`, `1`, `yes`, `on`, `y`, `enabled`

            Falsy values: `false`, `0`, `no`, `off`, `n`, `disabled`
          schema:
            example: 'true'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Get API key
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:read'
          position: after
      x-endpoint-owners:
        - auth
        - control-plane
      x-fga-permissions:
        - - api_gateway_keys_read
      x-oauth-scope: secrets:read
    delete:
      operationId: v1-delete-project-api-key
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            example: 22222222-2222-4222-8222-222222222222
            type: string
        - name: reveal
          required: false
          in: query
          description: Boolean string, true or false
          schema:
            example: true
            type: string
        - name: was_compromised
          required: false
          in: query
          description: Boolean string, true or false
          schema:
            example: false
            type: string
        - name: reason
          required: false
          in: query
          schema:
            example: rotating_key
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Deletes an API key for the project
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - auth
        - control-plane
      x-fga-permissions:
        - - api_gateway_keys_write
      x-oauth-scope: secrets:write
  /secrets:
    get:
      description: Returns all secrets you've previously added to the specified project.
      operationId: v1-list-all-secrets
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-list-all-secretsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project's secrets
      security:
        - bearer: []
      summary: List all secrets
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:read'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_secrets_read
      x-oauth-scope: secrets:read
    post:
      description: Creates multiple secrets and adds them to the specified project.
      operationId: v1-bulk-create-secrets
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 256
                  pattern: ^(?!SUPABASE_).*
                  description: Secret name must not start with the SUPABASE_ prefix.
                value:
                  type: string
                  maxLength: 24576
              required:
                - name
                - value
              description: One secret. The wire body is an array; the provider wraps this object into it (one secret per INSERT).
      responses:
        '201':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to create project's secrets
      security:
        - bearer: []
      summary: Bulk create secrets
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_secrets_write
      x-oauth-scope: secrets:write
    delete:
      description: Deletes all secrets with the given names from the specified project
      operationId: v1-bulk-delete-secrets
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The secret to delete. The wire body is an array of names; the provider wraps this object into it (one secret per DELETE).
              properties:
                name:
                  type: string
                  description: Secret name
              required:
                - name
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to delete secrets with given names
      security:
        - bearer: []
      summary: Bulk delete secrets
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - functions
      x-fga-permissions:
        - - edge_functions_secrets_write
      x-oauth-scope: secrets:write
components:
  schemas:
    ApiKeyResponse:
      type: object
      properties:
        api_key:
          type: string
          nullable: true
        id:
          type: string
          nullable: true
        type:
          type: string
          enum:
            - legacy
            - publishable
            - secret
            - null
          nullable: true
        prefix:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        hash:
          type: string
          nullable: true
        secret_jwt_template:
          type: object
          additionalProperties: {}
          nullable: true
        inserted_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          nullable: true
        updated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          nullable: true
      required:
        - name
    CreateApiKeyBody:
      type: object
      properties:
        type:
          type: string
          enum:
            - publishable
            - secret
        name:
          type: string
          minLength: 4
          maxLength: 64
          pattern: ^[a-z_][a-z0-9_]+$
        description:
          type: string
          nullable: true
        secret_jwt_template:
          type: object
          additionalProperties: {}
          nullable: true
      required:
        - type
        - name
      example:
        type: secret
        name: ci_secret_key
        description: CI deploy key
    LegacyApiKeysResponse:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    UpdateApiKeyBody:
      type: object
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 64
          pattern: ^[a-z_][a-z0-9_]+$
        description:
          type: string
          nullable: true
        secret_jwt_template:
          type: object
          additionalProperties: {}
          nullable: true
      example:
        name: ci_secret_key_rotated
        description: Rotated after March release
    SecretResponse:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        updated_at:
          type: string
      required:
        - name
        - value
    CreateSecretBody:
      maxItems: 100
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            maxLength: 256
            pattern: ^(?!SUPABASE_).*
            description: Secret name must not start with the SUPABASE_ prefix.
          value:
            type: string
            maxLength: 24576
        required:
          - name
          - value
      example:
        - name: OPENAI_API_KEY
          value: sk-example-secret
        - name: STRIPE_WEBHOOK_SECRET
          value: whsec_example
    DeleteSecretsBody:
      type: array
      items:
        type: string
      example:
        - OPENAI_API_KEY
    V1-get-project-api-keysResponse:
      type: object
      properties:
        v1_get_project_api_keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyResponse'
    V1-list-all-secretsResponse:
      type: object
      properties:
        v1_list_all_secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretResponse'
  x-stackQL-resources:
    api_keys:
      id: supabase.secrets.api_keys
      name: api_keys
      title: Api Keys
      methods:
        list:
          operation:
            $ref: '#/paths/~1api-keys/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_get_project_api_keys
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/V1-get-project-api-keysResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_get_project_api_keys\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1api-keys/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1api-keys~1{id}/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        get:
          operation:
            $ref: '#/paths/~1api-keys~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete:
          operation:
            $ref: '#/paths/~1api-keys~1{id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/api_keys/methods/get'
          - $ref: '#/components/x-stackQL-resources/api_keys/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/api_keys/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/api_keys/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/api_keys/methods/delete'
        replace: []
    legacy_api_keys:
      id: supabase.secrets.legacy_api_keys
      name: legacy_api_keys
      title: Legacy Api Keys
      methods:
        get:
          operation:
            $ref: '#/paths/~1api-keys~1legacy/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update:
          operation:
            $ref: '#/paths/~1api-keys~1legacy/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/legacy_api_keys/methods/get'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/legacy_api_keys/methods/update'
        delete: []
        replace: []
    secrets:
      id: supabase.secrets.secrets
      name: secrets
      title: Secrets
      methods:
        list:
          operation:
            $ref: '#/paths/~1secrets/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_list_all_secrets
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/V1-list-all-secretsResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_list_all_secrets\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1secrets/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
          request:
            transform:
              type: golang_template_text_v0.3.0
              body: '[{{ . }}]'
        delete:
          operation:
            $ref: '#/paths/~1secrets/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            transform:
              type: golang_template_json_v0.3.0
              body: '[{{ toJson .name }}]'
          config:
            requestBodyTranslate:
              algorithm: naive
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/secrets/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/secrets/methods/create'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/secrets/methods/delete'
        replace: []
servers:
  - url: https://api.supabase.com/v1/projects/{ref}
    variables:
      ref:
        description: Supabase project reference (the Project ID shown in the dashboard under Settings -> General; 20 lowercase letters). Resolved from the SUPABASE_PROJECT_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every project-scoped query as WHERE ref = '<ref>'. A WHERE value always takes precedence over the environment.
        x-stackQL-envVar: SUPABASE_PROJECT_ID
