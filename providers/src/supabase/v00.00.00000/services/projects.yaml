        user_defined_objects_in_internal_schemas:
          type: array
          items:
            type: string
          deprecated: true
          description: Use validation_errors instead.
        validation_errors:
          type: array
          items:
            anyOf:
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - objects_depending_on_pg_cron
                  dependents:
                    type: array
                    items:
                      type: string
                required:
                  - type
                  - dependents
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - indexes_referencing_ll_to_earth
                  schema_name:
                    type: string
                  table_name:
                    type: string
                  index_name:
                    type: string
                required:
                  - type
                  - schema_name
                  - table_name
                  - index_name
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - function_using_obsolete_lang
                  schema_name:
                    type: string
                  function_name:
                    type: string
                  lang_name:
                    type: string
                required:
                  - type
                  - schema_name
                  - function_name
                  - lang_name
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - unsupported_extension
                  extension_name:
                    type: string
                required:
                  - type
                  - extension_name
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - unsupported_fdw_handler
                  fdw_name:
                    type: string
                  fdw_handler_name:
                    type: string
                required:
                  - type
                  - fdw_name
                  - fdw_handler_name
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - unlogged_table_with_persistent_sequence
                  schema_name:
                    type: string
                  table_name:
                    type: string
                  sequence_name:
                    type: string
                required:
                  - type
                  - schema_name
                  - table_name
                  - sequence_name
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - user_defined_objects_in_internal_schemas
                  obj_type:
                    anyOf:
                      - type: string
                        enum:
                          - table
                      - type: string
                        enum:
                          - function
                  schema_name:
                    type: string
                  obj_name:
                    type: string
                required:
                  - type
                  - obj_type
                  - schema_name
                  - obj_name
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - active_replication_slot
                  slot_name:
                    type: string
                required:
                  - type
                  - slot_name
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - x86_architecture
                required:
                  - type
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - project_hibernating
                required:
                  - type
        warnings:
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - pg_graphql_introspection_change
                required:
                  - type
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - ltree_reindex_required
                required:
                  - type
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - operator_estimator_gate
                required:
                  - type
