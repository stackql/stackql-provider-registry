openapi: 3.0.0
info:
  title: projects API
  description: Projects related endpoints
  version: 1.0.0
paths:
  /v1/projects:
    get:
      description: Returns a list of all projects you've previously created.
      operationId: v1-list-all-projects
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-list-all-projectsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: List all projects
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - projects_read
      x-oauth-scope: projects:read
    post:
      operationId: v1-create-a-project
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1CreateProjectBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ProjectResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Create a project
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - organization_projects_create
      x-oauth-scope: projects:write
    servers:
      - url: https://api.supabase.com
  /v1/projects/available-regions:
    get:
      operationId: v1-get-available-regions
      parameters:
        - name: organization_slug
          required: true
          in: query
          description: Slug of your organization
          schema:
            example: tsrqponmlkjihgfedcba
            type: string
        - name: continent
          required: false
          in: query
          description: 'Continent code to determine regional recommendations: NA (North America), SA (South America), EU (Europe), AF (Africa), AS (Asia), OC (Oceania), AN (Antarctica)'
          schema:
            example: NA
            type: string
            enum:
              - NA
              - SA
              - EU
              - AF
              - AS
              - OC
              - AN
        - name: desired_instance_size
          required: false
          in: query
          description: Desired instance size. Omit this field to always default to the smallest possible size.
          schema:
            type: string
            enum:
              - nano
              - micro
              - small
              - medium
              - large
              - xlarge
              - 2xlarge
              - 4xlarge
              - 8xlarge
              - 12xlarge
              - 16xlarge
              - 24xlarge
              - 24xlarge_optimized_memory
              - 24xlarge_optimized_cpu
              - 24xlarge_high_memory
              - 48xlarge
              - 48xlarge_optimized_memory
              - 48xlarge_optimized_cpu
              - 48xlarge_high_memory
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionsInfo'
      security:
        - bearer: []
      summary: '[Beta] Gets the list of available regions that can be used for a new project'
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: organizations:read'
          position: after
      x-endpoint-owners:
        - infra
      x-oauth-scope: organizations:read
    servers:
      - url: https://api.supabase.com
  /v1/projects/{ref}:
    get:
      operationId: v1-get-project
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ProjectWithDatabaseResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project
      security:
        - bearer: []
      summary: Gets a specific project that belongs to the authenticated user
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - project_admin_read
      x-oauth-scope: projects:read
    delete:
      operationId: v1-delete-a-project
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ProjectRefResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Deletes the given project
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
        - dev-workflows
      x-fga-permissions:
        - - project_admin_write
      x-oauth-scope: projects:write
    patch:
      operationId: v1-update-a-project
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1UpdateProjectBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ProjectRefResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to update project
      security:
        - bearer: []
      summary: Updates the given project
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - project_admin_write
      x-oauth-scope: projects:write
    servers:
      - url: https://api.supabase.com
  /upgrade:
    post:
      operationId: v1-upgrade-postgres-version
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeDatabaseBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpgradeInitiateResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to initiate project upgrade
      security:
        - bearer: []
      summary: '[Beta] Upgrades the project''s Postgres version'
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - project_admin_write
          - database_write
      x-oauth-scope: projects:write
  /upgrade/eligibility:
    get:
      operationId: v1-get-postgres-upgrade-eligibility
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpgradeEligibilityResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to determine project upgrade eligibility
      security:
        - bearer: []
      summary: '[Beta] Returns the project''s eligibility for upgrades'
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - project_admin_read
          - database_read
      x-oauth-scope: projects:read
  /upgrade/status:
    get:
      operationId: v1-get-postgres-upgrade-status
      parameters:
        - name: tracking_id
          required: false
          in: query
          schema:
            example: 9f4d3a20-6b2e-4a7e-8c91-1d5f3e7a2b4c
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseUpgradeStatusResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project upgrade status
      security:
        - bearer: []
      summary: '[Beta] Gets the latest status of the project''s upgrade'
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - project_admin_read
          - database_read
      x-oauth-scope: projects:read
  /read-replicas/setup:
    post:
      operationId: v1-setup-a-read-replica
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUpReadReplicaBody'
      responses:
        '204':
          description: ''
        '401':
          description: Unauthorized
        '402':
          description: This feature requires the Pro, Team, or Enterprise organization plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanGateErrorBody'
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to set up read replica
      security:
        - bearer: []
      summary: '[Beta] Set up a read replica'
      tags:
        - Database
      x-allowed-plans:
        - Pro
        - Team
        - Enterprise
      x-badges:
        - name: Only available on Pro, Team, Enterprise
          position: before
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - infra_read_replicas_write
  /read-replicas/remove:
    post:
      operationId: v1-remove-a-read-replica
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveReadReplicaBody'
      responses:
        '204':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to remove read replica
      security:
        - bearer: []
      summary: '[Beta] Remove a read replica'
      tags:
        - Database
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - infra_read_replicas_write
  /health:
    get:
      operationId: v1-get-services-health
      parameters:
        - name: services
          required: true
          in: query
          description: Comma-separated list of enums or array of enums.
          schema:
            example:
              - auth,db
              - auth
            anyOf:
              - type: string
                description: |-
                  Comma-separated list of enums:

                  - `auth`
                  - `db`
                  - `db_postgres_user`
                  - `pooler`
                  - `realtime`
                  - `rest`
                  - `storage`
                  - `pg_bouncer`
                example:
                  - auth,db
                  - auth
              - type: array
                items:
                  type: string
                  enum:
                    - auth
                    - db
                    - db_postgres_user
                    - pooler
                    - realtime
                    - rest
                    - storage
                    - pg_bouncer
                description: Array of enums.
                example:
                  - '{field}=auth&{field}=db'
                  - '{field}=auth'
        - name: timeout_ms
          required: false
          in: query
          schema:
            minimum: 0
            maximum: 10000
            example: 2000
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-get-services-healthResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project's service health status
      security:
        - bearer: []
      summary: Gets project's service health status
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - project_admin_read
      x-oauth-scope: projects:read
  /pause:
    post:
      operationId: v1-pause-a-project
      parameters: []
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Pauses the given project
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - project_admin_write
      x-oauth-scope: projects:write
  /restart:
    post:
      operationId: v1-restart-a-project
      parameters: []
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Restarts the given project
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - infra
        - control-plane
      x-fga-permissions:
        - - project_admin_write
      x-oauth-scope: projects:write
  /restore:
    get:
      operationId: v1-list-available-restore-versions
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectAvailableRestoreVersionsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Lists available restore versions for the given project
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - project_admin_read
      x-oauth-scope: projects:read
    post:
      operationId: v1-restore-a-project
      parameters: []
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Restores the given project
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - project_admin_write
      x-oauth-scope: projects:write
  /restore/cancel:
    post:
      operationId: v1-cancel-a-project-restoration
      parameters: []
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Cancels the given project restoration
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:write'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - project_admin_write
      x-oauth-scope: projects:write
  /claim-token:
    get:
      operationId: v1-get-project-claim-token
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectClaimTokenResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Gets project claim token
      tags:
        - Projects
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - project_admin_read
      x-internal: true
    post:
      operationId: v1-create-project-claim-token
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectClaimTokenResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Creates project claim token
      tags:
        - Projects
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - organization_admin_write
          - project_admin_write
      x-internal: true
    delete:
      operationId: v1-delete-project-claim-token
      parameters: []
      responses:
        '204':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Revokes project claim token
      tags:
        - Projects
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - organization_admin_write
          - project_admin_write
      x-internal: true
  /config/disk:
    get:
      operationId: v1-get-database-disk
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to get database disk attributes
      security:
        - bearer: []
      summary: Get database disk attributes
      tags:
        - Projects
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - infra_disk_config_read
    post:
      operationId: v1-modify-database-disk
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskRequestBody'
      responses:
        '201':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to modify database disk
      security:
        - bearer: []
      summary: Modify database disk
      tags:
        - Projects
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - infra_disk_config_write
  /config/disk/util:
    get:
      operationId: v1-get-disk-utilization
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskUtilMetricsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to get disk utilization
      security:
        - bearer: []
      summary: Get disk utilization
      tags:
        - Projects
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - infra_disk_config_read
  /config/disk/autoscale:
    get:
      operationId: v1-get-project-disk-autoscale-config
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskAutoscaleConfig'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to get project disk autoscale config
      security:
        - bearer: []
      summary: Gets project disk autoscale config
      tags:
        - Projects
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - infra_disk_config_read
  /v1/organizations/{slug}/projects:
    get:
      description: |-
        Returns a paginated list of projects for the specified organization.

        This endpoint uses offset-based pagination. Use the `offset` parameter to skip a number of projects and the `limit` parameter to control the number of projects returned per page.
      operationId: v1-get-all-projects-for-organization
      parameters:
        - name: slug
          required: true
          in: path
          description: Organization slug
          schema:
            pattern: ^[\w-]+$
            example: tsrqponmlkjihgfedcba
            type: string
        - name: offset
          required: false
          in: query
          description: Number of projects to skip
          schema:
            minimum: 0
            maximum: 9007199254740991
            default: 0
            example: 0
            type: integer
        - name: limit
          required: false
          in: query
          description: Number of projects to return per page
          schema:
            minimum: 1
            maximum: 100
            default: 100
            example: 20
            type: integer
        - name: search
          required: false
          in: query
          description: Search projects by name
          schema:
            example: acme
            type: string
        - name: sort
          required: false
          in: query
          description: Sort order for projects
          schema:
            default: name_asc
            example: created_desc
            type: string
            enum:
              - name_asc
              - name_desc
              - created_asc
              - created_desc
        - name: statuses
          required: false
          in: query
          description: |-
            A comma-separated list of project statuses to filter by.

            The following values are supported: `ACTIVE_HEALTHY`, `INACTIVE`.
          schema:
            example: ACTIVE_HEALTHY,INACTIVE
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProjectsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve projects
      security:
        - bearer: []
      summary: Gets all projects for the given organization
      tags:
        - Projects
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - organization_projects_read
      x-oauth-scope: projects:read
    servers:
      - url: https://api.supabase.com
components:
  schemas:
    V1ProjectWithDatabaseResponse:
      type: object
      properties:
        id:
          type: string
          deprecated: true
          description: 'Deprecated: Use `ref` instead.'
        ref:
          type: string
          minLength: 20
          maxLength: 20
          pattern: ^[a-z]+$
          description: Project ref
          example: abcdefghijklmnopqrst
        organization_id:
          type: string
          description: 'Deprecated: Use `organization_slug` instead.'
          deprecated: true
        organization_slug:
          type: string
          pattern: ^[\w-]+$
          description: Organization slug
          example: tsrqponmlkjihgfedcba
        name:
          type: string
          description: Name of your project
        region:
          type: string
          description: Region of your project
        created_at:
          type: string
          description: Creation timestamp
        status:
          type: string
          enum:
            - INACTIVE
            - ACTIVE_HEALTHY
            - ACTIVE_UNHEALTHY
            - COMING_UP
            - UNKNOWN
            - GOING_DOWN
            - INIT_FAILED
            - REMOVED
            - RESTORING
            - UPGRADING
            - PAUSING
            - RESTORE_FAILED
            - RESTARTING
            - PAUSE_FAILED
            - RESIZING
