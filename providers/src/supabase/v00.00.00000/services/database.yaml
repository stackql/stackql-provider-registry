      properties:
        schedule_for:
          type: string
          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?$
          description: 'Time of day to schedule daily backups, in UTC. Format: HH:MM:SS.'
          example: '04:00:00'
        updated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          description: Timestamp of when the backup schedule was last updated.
          example: '2026-05-04T14:40:44+00:00'
      required:
        - schedule_for
        - updated_at
    PlanGateErrorBody:
      type: object
      properties:
        message:
          type: string
          description: Human-readable explanation of the plan gate
        error:
          description: Present on entitlement denials. Other errors with this status code (validation, billing state) carry only message.
          type: object
          properties:
            code:
              type: string
              description: Machine-readable marker for plan-gated denials
              enum:
                - entitlement_required
            feature:
              type: string
              description: Entitlement feature key that failed the check
            upgrade_url:
              description: Billing page URL for the organization, present when the org is resolvable
              type: string
          required:
            - code
            - feature
      required:
        - message
    V1UpdateBackupScheduleBody:
      type: object
      properties:
