components:
  schemas:
    SnippetList:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              inserted_at:
                type: string
              updated_at:
                type: string
              type:
                type: string
                enum:
                  - sql
              visibility:
                type: string
                enum:
                  - user
                  - project
                  - org
                  - public
              name:
                type: string
              description:
                type: string
                nullable: true
              project:
                type: object
                properties:
                  id:
                    type: number
                  name:
                    type: string
                required:
                  - id
                  - name
              owner:
                type: object
                properties:
                  id:
                    type: number
                  username:
                    type: string
                required:
                  - id
                  - username
              updated_by:
                type: object
                properties:
                  id:
                    type: number
                  username:
                    type: string
                required:
                  - id
                  - username
              favorite:
                type: boolean
            required:
              - id
              - inserted_at
              - updated_at
              - type
              - visibility
              - name
              - description
              - project
              - owner
              - updated_by
              - favorite
        cursor:
          type: string
      required:
        - data
    SnippetResponse:
      type: object
      properties:
        id:
          type: string
        inserted_at:
          type: string
        updated_at:
          type: string
        type:
          type: string
          enum:
            - sql
        visibility:
          type: string
          enum:
            - user
            - project
            - org
            - public
        name:
          type: string
        description:
          type: string
          nullable: true
        project:
          type: object
          properties:
            id:
              type: number
            name:
              type: string
          required:
            - id
            - name
        owner:
          type: object
          properties:
            id:
              type: number
            username:
              type: string
          required:
            - id
            - username
        updated_by:
          type: object
          properties:
            id:
              type: number
            username:
              type: string
          required:
            - id
            - username
        favorite:
          type: boolean
        content:
          type: object
          properties:
            favorite:
              deprecated: true
              description: 'Deprecated: Rely on root-level favorite property instead.'
              type: boolean
            schema_version:
              type: string
            sql:
              type: string
          required:
            - schema_version
            - sql
      required:
        - id
        - inserted_at
        - updated_at
        - type
        - visibility
        - name
        - description
        - project
        - owner
        - updated_by
        - favorite
        - content
    JitAccessRequestRequest:
      type: object
      properties:
        state:
          type: string
          enum:
            - enabled
            - disabled
      required:
        - state
      example:
        state: enabled
    TypescriptResponse:
      type: object
      properties:
        types:
          type: string
      required:
        - types
    ReadOnlyStatusResponse:
      type: object
      properties:
        enabled:
          type: boolean
        override_enabled:
          type: boolean
        override_active_until:
          type: string
      required:
        - enabled
        - override_enabled
        - override_active_until
    CreateRoleBody:
      type: object
      properties:
        read_only:
          type: boolean
      required:
        - read_only
      example:
        read_only: true
    CreateRoleResponse:
      type: object
      properties:
        role:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          format: int64
      required:
        - role
        - password
        - ttl_seconds
    DeleteRolesResponse:
      type: object
      properties:
        message:
          type: string
          enum:
            - ok
      required:
        - message
    V1ListMigrationsResponse:
      type: array
      items:
        type: object
        properties:
          version:
            type: string
            minLength: 1
          name:
            type: string
        required:
          - version
    V1CreateMigrationBody:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        name:
          type: string
        rollback:
          type: string
      required:
        - query
      example:
        query: create table public.widgets(id bigint primary key);
        name: create_widgets_table
        rollback: drop table if exists public.widgets;
    V1UpsertMigrationBody:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        name:
          type: string
        rollback:
          type: string
      required:
        - query
      example:
        query: create table public.widgets(id bigint primary key);
        name: create_widgets_table
        rollback: drop table if exists public.widgets;
    V1GetMigrationResponse:
      type: object
      properties:
        version:
          type: string
          minLength: 1
        name:
          type: string
        statements:
          type: array
          items:
            type: string
        rollback:
          type: array
          items:
            type: string
        created_by:
          type: string
        idempotency_key:
          type: string
      required:
        - version
    V1PatchMigrationBody:
      type: object
      properties:
        name:
          type: string
        rollback:
          type: string
      example:
        name: create_widgets_table
        rollback: drop table if exists public.widgets;
    V1RunQueryBody:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        parameters:
          type: array
          items: {}
        read_only:
          type: boolean
      required:
        - query
      example:
        query: select * from pg_stat_activity limit 1;
        read_only: true
    V1ReadOnlyQueryBody:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        parameters:
          type: array
          items: {}
      required:
        - query
      example:
        query: select * from pg_stat_activity limit 1;
    GetProjectDbMetadataResponse:
      type: object
      properties:
        databases:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              schemas:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  additionalProperties: {}
            required:
              - name
              - schemas
            additionalProperties: {}
      required:
        - databases
    V1UpdatePasswordBody:
      type: object
      properties:
        password:
          type: string
          minLength: 4
      required:
        - password
      example:
        password: correct-horse-battery-staple
    V1UpdatePasswordResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    JitAccessResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        user_roles:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                minLength: 1
              expires_at:
                type: number
              allowed_networks:
                type: object
                properties:
                  allowed_cidrs:
                    type: array
                    items:
                      type: object
                      properties:
                        cidr:
                          type: string
                          format: cidrv4
                          pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\/([0-9]|[1-2][0-9]|3[0-2])$
                      required:
                        - cidr
                  allowed_cidrs_v6:
                    type: array
                    items:
                      type: object
                      properties:
                        cidr:
                          type: string
                          format: cidrv6
                          pattern: ^(([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|::|([0-9a-fA-F]{1,4})?::([0-9a-fA-F]{1,4}:?){0,6})\/(12[0-8]|1[01][0-9]|[1-9]?[0-9])$
                      required:
                        - cidr
              branches_only:
                type: boolean
            required:
              - role
      required:
        - user_roles
    AuthorizeJitAccessBody:
      type: object
      properties:
        role:
          type: string
          minLength: 1
        rhost:
          type: string
          format: ipv4
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])$
      required:
        - role
        - rhost
      example:
        role: postgres
        rhost: 203.0.113.10
    JitAuthorizeAccessResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        user_role:
          type: object
          properties:
            role:
              type: string
              minLength: 1
            expires_at:
              type: number
            allowed_networks:
              type: object
              properties:
                allowed_cidrs:
                  type: array
                  items:
                    type: object
                    properties:
                      cidr:
                        type: string
                        format: cidrv4
                        pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\/([0-9]|[1-2][0-9]|3[0-2])$
                    required:
                      - cidr
                allowed_cidrs_v6:
                  type: array
                  items:
                    type: object
                    properties:
                      cidr:
                        type: string
                        format: cidrv6
                        pattern: ^(([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|::|([0-9a-fA-F]{1,4})?::([0-9a-fA-F]{1,4}:?){0,6})\/(12[0-8]|1[01][0-9]|[1-9]?[0-9])$
                    required:
                      - cidr
            branches_only:
              type: boolean
          required:
            - role
      required:
        - user_id
        - user_role
    UpdateJitAccessBody:
      type: object
      properties:
        user_id:
          type: string
          minLength: 1
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        roles:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                minLength: 1
              expires_at:
                type: number
              allowed_networks:
                type: object
                properties:
                  allowed_cidrs:
                    type: array
                    items:
                      type: object
                      properties:
                        cidr:
                          type: string
                          format: cidrv4
                          pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\/([0-9]|[1-2][0-9]|3[0-2])$
                      required:
                        - cidr
                  allowed_cidrs_v6:
                    type: array
                    items:
                      type: object
                      properties:
                        cidr:
                          type: string
                          format: cidrv6
                          pattern: ^(([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|::|([0-9a-fA-F]{1,4})?::([0-9a-fA-F]{1,4}:?){0,6})\/(12[0-8]|1[01][0-9]|[1-9]?[0-9])$
                      required:
                        - cidr
              branches_only:
                type: boolean
            required:
              - role
      required:
        - user_id
        - roles
      example:
        user_id: 55555555-5555-4555-8555-555555555555
        roles:
          - role: postgres
            expires_at: 1740787200
            allowed_networks:
              allowed_cidrs:
                - cidr: 203.0.113.0/24
            branches_only: false
    JitListAccessResponse:
      type: object
      properties:
        items:
          type: array
          items:
            anyOf:
              - type: object
                properties:
                  user_id:
