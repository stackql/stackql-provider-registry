openapi: 3.0.0
info:
  title: database API
  description: Database related endpoints
  version: 1.0.0
paths:
  /v1/snippets:
    get:
      operationId: v1-list-all-snippets
      parameters:
        - name: project_ref
          required: false
          in: query
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
        - name: cursor
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            type: string
            minimum: 1
            maximum: 100
        - name: sort_by
          required: false
          in: query
          schema:
            enum:
              - name
              - inserted_at
            type: string
        - name: sort_order
          required: false
          in: query
          schema:
            enum:
              - asc
              - desc
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to list user's SQL snippets
      security:
        - bearer: []
      summary: Lists SQL snippets for the logged in user
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:read'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - snippets_read
      x-oauth-scope: database:read
    servers:
      - url: https://api.supabase.com
  /v1/snippets/{id}:
    get:
      operationId: v1-get-a-snippet
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            example: 44444444-4444-4444-8444-444444444444
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve SQL snippet
      security:
        - bearer: []
      summary: Gets a specific SQL snippet
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:read'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - snippets_read
      x-oauth-scope: database:read
    servers:
      - url: https://api.supabase.com
  /jit-access:
    get:
      operationId: v1-get-jit-access-config
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum:
                      - enabled
                      - disabled
                  appliedSuccessfully:
                    type: boolean
                  unavailableReason:
                    type: string
                    enum:
                      - postgres_upgrade_required
                      - ssl_enforcement_required
                      - temporarily_unavailable
                required:
                  - state
                  - unavailableReason
                additionalProperties: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project's temporary access configuration.
      security:
        - bearer: []
      summary: '[Beta] Get project''s temporary access configuration.'
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:read'
          position: after
      x-endpoint-owners:
        - security
        - control-plane
      x-fga-permissions:
        - - project_admin_read
      x-oauth-scope: database:read
    put:
      operationId: v1-update-jit-access-config
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitAccessRequestRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum:
                      - enabled
                      - disabled
                  appliedSuccessfully:
                    type: boolean
                  unavailableReason:
                    type: string
                    enum:
                      - postgres_upgrade_required
                      - ssl_enforcement_required
                      - temporarily_unavailable
                required:
                  - state
                  - unavailableReason
                additionalProperties: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to update project's temporary access configuration.
      security:
        - bearer: []
      summary: '[Beta] Update project''s temporary access configuration.'
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - security
        - control-plane
      x-fga-permissions:
        - - project_admin_write
      x-oauth-scope: database:write
  /types/typescript:
    get:
      description: Returns the TypeScript types of your schema for use with supabase-js.
      operationId: v1-generate-typescript-types
      parameters:
        - name: included_schemas
          required: false
          in: query
          schema:
            default: public
            example: public,auth
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypescriptResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to generate TypeScript types
      security:
        - bearer: []
      summary: Generate TypeScript types
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:read'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - database_read
      x-oauth-scope: database:read
  /readonly:
    get:
      operationId: v1-get-readonly-mode-status
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadOnlyStatusResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to get project readonly mode status
      security:
        - bearer: []
      summary: Returns project's readonly mode status
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:read'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
        - support-tooling
      x-fga-permissions:
        - - database_readonly_config_read
      x-oauth-scope: database:read
  /readonly/temporary-disable:
    post:
      operationId: v1-disable-readonly-mode-temporarily
      parameters: []
      responses:
        '201':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to disable project's readonly mode
      security:
        - bearer: []
      summary: Disables project's readonly mode for the next 15 minutes
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
        - support-tooling
      x-fga-permissions:
        - - database_readonly_config_write
      x-oauth-scope: database:write
  /cli/login-role:
    post:
      operationId: v1-create-login-role
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRoleResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to create login role
      security:
        - bearer: []
      summary: '[Beta] Create a login role for CLI with temporary password'
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - database_write
      x-oauth-scope: database:write
    delete:
      operationId: v1-delete-login-roles
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRolesResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to delete login roles
      security:
        - bearer: []
      summary: '[Beta] Delete existing login roles used by CLI'
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - dev-workflows
      x-fga-permissions:
        - - database_write
      x-oauth-scope: database:write
  /database/migrations:
    get:
      operationId: v1-list-migration-history
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-list-migration-historyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to list database migrations
      security:
        - bearer: []
      summary: List applied migration versions
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:read'
          position: after
      x-endpoint-owners:
        - infra
      x-fga-permissions:
        - - database_migrations_read
      x-oauth-scope: database:read
    post:
      operationId: v1-apply-a-migration
      parameters:
        - name: Idempotency-Key
          required: false
          in: header
          description: A unique key to ensure the same migration is tracked only once.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1CreateMigrationBody'
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to apply database migration
      security:
        - bearer: []
      summary: Apply a database migration
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - infra
      x-fga-permissions:
        - - database_migrations_write
      x-oauth-scope: database:write
    put:
      operationId: v1-upsert-a-migration
      parameters:
        - name: Idempotency-Key
          required: false
          in: header
          description: A unique key to ensure the same migration is tracked only once.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1UpsertMigrationBody'
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to upsert database migration
      security:
        - bearer: []
      summary: Upsert a database migration without applying
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - infra
      x-fga-permissions:
        - - database_migrations_write
      x-oauth-scope: database:write
    delete:
      operationId: v1-rollback-migrations
      parameters:
        - name: gte
          required: true
          in: query
          description: Rollback migrations greater or equal to this version
          schema:
            pattern: ^\d+$
            example: '20250312000000'
            type: string
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to rollback database migration
      security:
        - bearer: []
      summary: Rollback database migrations and remove them from history table
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - infra
      x-fga-permissions:
        - - database_migrations_write
      x-oauth-scope: database:write
  /database/migrations/{version}:
    get:
      operationId: v1-get-a-migration
      parameters:
        - name: version
          required: true
          in: path
          schema:
            pattern: ^\d+$
            example: '20250312000000'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1GetMigrationResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to get database migration
      security:
        - bearer: []
      summary: Fetch an existing entry from migration history
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:read'
          position: after
      x-endpoint-owners:
        - infra
      x-fga-permissions:
        - - database_migrations_read
      x-oauth-scope: database:read
    patch:
      operationId: v1-patch-a-migration
      parameters:
        - name: version
          required: true
          in: path
          schema:
            pattern: ^\d+$
            example: '20250312000000'
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1PatchMigrationBody'
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to patch database migration
      security:
        - bearer: []
      summary: Patch an existing entry in migration history
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - infra
      x-fga-permissions:
        - - database_migrations_write
      x-oauth-scope: database:write
  /database/query:
    post:
      operationId: v1-run-a-query
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1RunQueryBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1RunQueryResultRows'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to run sql query
      security:
        - bearer: []
      summary: '[Beta] Run sql query'
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - database_read
        - - database_write
      x-oauth-scope: database:write
  /database/query/read-only:
    post:
      description: All entity references must be schema qualified.
      operationId: v1-read-only-query
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1ReadOnlyQueryBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1RunQueryResultRows'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to run read-only sql query
      security:
        - bearer: []
      summary: '[Beta] Run a sql query as supabase_read_only_user'
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:read'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - database_read
      x-oauth-scope: database:read
  /database/webhooks/enable:
    post:
      operationId: v1-enable-database-webhook
      parameters: []
      responses:
        '201':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to enable Database Webhooks on the project
      security:
        - bearer: []
      summary: '[Beta] Enables Database Webhooks on the project'
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - database_webhooks_config_write
      x-oauth-scope: database:write
  /database/context:
    get:
      deprecated: true
      description: This is an **experimental** endpoint. It is subject to change or removal in future versions. Use it with caution, as it may not remain supported or stable.
      operationId: v1-get-database-metadata
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectDbMetadataResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Gets database metadata for the given project.
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: projects:read'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - database_read
      x-oauth-scope: projects:read
  /database/password:
    patch:
      operationId: v1-update-database-password
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1UpdatePasswordBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1UpdatePasswordResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to update database password
      security:
        - bearer: []
      summary: Updates the database password
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:write'
          position: after
      x-endpoint-owners:
        - control-plane
        - infra
      x-fga-permissions:
        - - database_config_write
      x-oauth-scope: database:write
  /database/jit:
    get:
      description: Mappings of roles a user can assume in the project database
      operationId: v1-get-jit-access
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitAccessResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to list database jit access
      security:
        - bearer: []
      summary: Get user-id to role mappings for JIT access
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:read'
          position: after
      x-endpoint-owners:
        - security
      x-fga-permissions:
        - - database_jit_read
      x-oauth-scope: database:read
    post:
      description: Authorizes the request to assume a role in the project database
      operationId: v1-authorize-jit-access
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeJitAccessBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitAuthorizeAccessResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to authorize database jit access
      security:
        - bearer: []
      summary: Authorize user-id to role mappings for JIT access
      tags:
        - Database
      x-badges:
        - name: 'OAuth scope: database:read'
          position: after
      x-endpoint-owners:
        - security
      x-fga-permissions:
        - - database_jit_read
      x-oauth-scope: database:read
    put:
      description: Modifies the roles that can be assumed and for how long
      operationId: v1-update-jit-access
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJitAccessBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitAccessResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to update JIT access
      security:
        - bearer: []
      summary: Updates a user mapping for JIT access
      tags:
        - Database
      x-endpoint-owners:
        - security
      x-fga-permissions:
        - - database_jit_write
  /database/jit/list:
    get:
      description: Mappings of roles a user can assume in the project database
      operationId: v1-list-jit-access
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitListAccessResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to list database jit access
      security:
        - bearer: []
      summary: List all user-id to role mappings for JIT access
      tags:
        - Database
      x-endpoint-owners:
        - security
      x-fga-permissions:
        - - database_jit_write
  /database/jit/invite:
    post:
      description: Invites the external user and sets initial roles that can be assumed and for how long
      operationId: v1-invite-external-jit-access
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteExternalUserJitAccessBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteExternalUserJitResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to invite external user
      security:
        - bearer: []
      summary: Invites an external user to a database for JIT access
      tags:
        - Database
      x-endpoint-owners:
        - security
      x-fga-permissions:
        - - database_jit_write
  /database/jit/invite/accept:
    post:
      description: Accepts the invitation to JIT database access
      operationId: v1-accept-invite-external-jit-access
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteExternalUserJitAccessBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitAccessResponse'
        '500':
          description: Failed to accept invitation
      security:
        - bearer: []
      summary: Accepts invitation for JIT database access
      tags:
        - Database
      x-endpoint-owners:
