          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?$
          description: 'Time of day to schedule daily backups, in UTC. Format: HH:MM:SS.'
          example: '04:00:00'
      required:
        - schedule_for
      example:
        schedule_for: '04:00:00'
    V1UndoBody:
      type: object
      properties:
        name:
          type: string
          maxLength: 20
      required:
        - name
      example:
        name: before-upgrade
    V1RunQueryResultRows:
      type: object
      description: Result of a SQL statement run against the project database. The API returns a bare JSON array of row objects whose keys depend on the statement; the provider presents it as one row whose rows column carries the array (address values with json_extract).
      properties:
        rows:
