openapi: 3.0.0
info:
  title: profile API
  description: supabase profile API
  version: 1.0.0
paths:
  /v1/profile:
    get:
      operationId: v1-get-profile
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ProfileResponse'
      security:
        - bearer: []
      summary: Gets the user's profile
      tags:
        - Profile
      x-endpoint-owners:
        - control-plane
    servers:
      - url: https://api.supabase.com
components:
  schemas:
    V1ProfileResponse:
      type: object
      properties:
        gotrue_id:
          type: string
        primary_email:
          type: string
        username:
          type: string
      required:
        - gotrue_id
        - primary_email
        - username
  x-stackQL-resources:
    profiles:
      id: supabase.profile.profiles
      name: profiles
      title: Profiles
      methods:
        get:
          operation:
            $ref: '#/paths/~1v1~1profile/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/profiles/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.supabase.com/v1/projects/{ref}
    variables:
      ref:
        description: Supabase project reference (the Project ID shown in the dashboard under Settings -> General; 20 lowercase letters). Resolved from the SUPABASE_PROJECT_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every project-scoped query as WHERE ref = '<ref>'. A WHERE value always takes precedence over the environment.
        x-stackQL-envVar: SUPABASE_PROJECT_ID
