      - name: metastore_id
        in: path
        required: true
        schema:
          type: string
        description: Unity Catalog metastore ID
      - name: storage_credential_name
        in: path
        required: true
        schema:
          type: string
        description: Name of the storage credential.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                credential_info:
                  type: object
                  properties:
                    aws_iam_role:
                      type: object
                      properties:
                        role_arn:
                          type: string
                          description: The Amazon Resource Name (ARN) of the AWS IAM role used to vend temporary credentials.
                      required:
