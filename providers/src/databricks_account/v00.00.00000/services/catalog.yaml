      - account_metastores
      description: |-
        Creates a Unity Catalog metastore.

        :param metastore_info: :class:`CreateAccountsMetastore` (optional)

        :returns: :class:`AccountsCreateMetastoreResponse`
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metastore_info:
                  type: object
                  properties:
                    name:
                      type: string
                    external_access_enabled:
                      type: boolean
                      description: Whether to allow non-DBR clients to directly access entities under the metastore.
                    region:
                      type: string
                      description: Cloud region which the metastore serves (e.g., ``us-west-2``, ``westus``).
                    storage_root:
                      type: string
                      description: The storage root URL for metastore
                  required:
                  - name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsCreateMetastoreResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountMetastoresAPI
    get:
      operationId: account_metastores_list
      summary: Gets all Unity Catalog metastores associated with an account specified by ID.
      tags:
