        A Unity Catalog securable that registers an MCP server through a Unity Catalog connection and
            exposes its tools for discovery, authorization, and invocation.
    McpServiceConfig:
      type: object
      properties:
        include_tool_selectors:
          type: array
          items:
            type: string
          description: Tool names or prefix patterns to expose from the MCP server. Use exact tool names or prefix patterns
            such as ``read_*``. An empty list exposes all tools. At most 1,024 selectors are allowed, and each selector can
            contain at most 256 characters.
        rate_limits:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
          description: Rate limits for tool invocations. Supported scopes are user, group, service principal, the service
            as a whole, and each user by default. Request and token limits are supported. Empty when no rate limit is configured.
        source_connection:
          $ref: '#/components/schemas/McpServiceConfigSourceConnection'
          description: Unity Catalog connection referencing the MCP server. Required on Create.
      description: |-
        Operational configuration for an MCP service. Groups the source reference, tool selectors, and
            rate limits -- the fields that configure how the MCP service behaves at invocation time.
    McpServiceConfigSourceConnection:
      type: object
      properties:
        name:
          type: string
          description: Resource name of the Unity Catalog connection used to access the MCP server, in the form ``connections/{catalog}.{schema}.{connection}``.
        is_deleted:
          type: boolean
          description: Whether the referenced connection has been deleted. The MCP service keeps the reference so callers
            can identify the broken dependency; tool invocation fails until the source connection is updated.
        options:
          type: object
          description: 'Options needed to build the U2M authorize request, returned as a flat map. When set, it includes:
            ``authorization_endpoint`` (OAuth authorize URL), ``token_endpoint`` (token-exchange URL), ``oauth_scope`` (space-separated
            scopes to request), ``client_id`` (OAuth client id), and ``oauth_provider`` (the OAuth provider).'
      required:
      - name
      description: |-
        Unity Catalog connection that points to the MCP server. On Create, provide ``name`` in the
            schema-scoped form ``connections/{catalog}.{schema}.{connection}``. On read, the service
            populates the resolved connection metadata. If the connection is deleted, its reference remains
            visible so you can identify the broken dependency.
