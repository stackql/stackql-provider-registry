    McpService:
      type: object
      properties:
        browse_only:
          type: boolean
          description: Whether the caller sees only metadata available through the BROWSE privilege.
        comment:
          type: string
          description: User-provided description.
        config:
          $ref: '#/components/schemas/McpServiceConfig'
          description: 'Operational configuration: connection, tool selectors, rate limit. Required on CreateMcpService; on
            UpdateMcpService it is required only when ``config`` (or a ``config.*`` subpath) appears in ``update_mask``.'
        create_time:
          type: string
          format: date-time
          description: When the MCP service was created.
        created_by:
          type: string
          description: Creator identity.
        effective_owner:
          type: string
          description: The resolved owner of the MCP service. Falls back to the caller's identity when ``owner`` is not explicitly
            set on creation.
        etag:
          type: string
          description: Optimistic concurrency control token. Server-generated from the entity's state and returned on every
            read. To use it as an if-match precondition on a mutation, echo the last-read value back via the dedicated ``etag``
            field on the Update / Delete request; the server rejects the mutation if the stored etag differs.
        metastore_id:
          type: string
          description: Metastore hosting the MCP service.
        name:
          type: string
          description: 'Resource name of the MCP service. Format: ``mcp-services/{catalog}.{schema}.{mcp_service}``. Each
            ``{...}`` component is capped at 255 characters individually. Server-derived on Create from ``parent`` + ``mcp_service_id``;
            required and immutable on Update/Get/Delete.'
        owner:
          type: string
          description: The owner of the MCP service. Write-only; read owner via effective_owner.
        update_time:
          type: string
          format: date-time
          description: When the MCP service was last modified.
        updated_by:
          type: string
          description: Identity of the last updater.
      description: |-
        A governed MCP server registration in Unity Catalog. Acts as a container securable that
            references an MCP server -- customer-external via a UC Connection, or Databricks-hosted via an
            internal server -- and exposes its tools for discovery, authorization, and invocation.
    McpServiceConfig:
      type: object
      properties:
        include_tool_selectors:
          type: array
          items:
            type: string
          description: Glob or exact-match patterns selecting which tools from the MCP server to expose. Prefix match for
            patterns with ``*``, exact match otherwise. An empty list means all tools are included. Per-element max 256 chars.
        rate_limits:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
          description: Per-principal rate limits applied to tool invocations routed through this MCP service. Repeated to
            support per-USER / USER_GROUP / SERVICE_PRINCIPAL / SERVICE / USER_DEFAULT scopes simultaneously, mirroring the
            ``ModelServiceConfig.rate_limits`` shape. Empty when no rate limit is configured.
        source_connection:
          $ref: '#/components/schemas/McpServiceConfigSourceConnection'
          description: UC Connection referencing the MCP server.
      description: |-
        Operational configuration for an MCP service. Groups the source reference, tool selectors, and
            rate limit -- the fields that configure how the MCP service behaves at invocation time.
    McpServiceConfigSourceConnection:
      type: object
      properties:
        name:
          type: string
        is_deleted:
          type: boolean
      required:
      - name
      description: |-
        UC Connection that hosts the MCP server. On create, provide ``name`` in the schema-scoped form
            ``connections/{catalog}.{schema}.{connection}``. On read, the service populates the resolved
            connection metadata and preserves a dangling source so callers can diagnose a deleted backing
            connection.
    MetastoreAssignment:
      type: object
      properties:
        workspace_id:
          type: integer
        metastore_id:
          type: string
          description: The unique ID of the metastore.
        default_catalog_name:
          type: string
          description: The name of the default catalog in the metastore. This field is deprecated. Please use "Default Namespace
            API" to configure the default catalog for a Databricks workspace.
      required:
      - workspace_id
      - metastore_id
    MetastoreInfo:
      type: object
      properties:
        cloud:
          type: string
        created_at:
          type: integer
          description: Time at which this metastore was created, in epoch milliseconds.
        created_by:
          type: string
          description: Username of metastore creator.
        default_data_access_config_id:
          type: string
          description: Unique identifier of the metastore's (Default) Data Access Configuration.
        delta_sharing_organization_name:
          type: string
          description: The organization name of a Delta Sharing entity, to be used in Databricks-to-Databricks Delta Sharing
            as the official name.
        delta_sharing_recipient_token_lifetime_in_seconds:
          type: integer
          description: The lifetime of delta sharing recipient token in seconds.
        delta_sharing_scope:
          $ref: '#/components/schemas/DeltaSharingScopeEnum'
          description: The scope of Delta Sharing enabled for the metastore.
        external_access_enabled:
          type: boolean
          description: Whether to allow non-DBR clients to directly access entities under the metastore.
        global_metastore_id:
          type: string
          description: Globally unique metastore ID across clouds and regions, of the form ``cloud:region:metastore_id``.
        metastore_id:
          type: string
          description: Unique identifier of metastore.
        name:
          type: string
          description: The user-specified name of the metastore.
        owner:
          type: string
          description: The owner of the metastore.
        privilege_model_version:
          type: string
          description: Privilege model version of the metastore, of the form ``major.minor`` (e.g., ``1.0``).
        region:
          type: string
          description: Cloud region which the metastore serves (e.g., ``us-west-2``, ``westus``).
        storage_root:
          type: string
          description: The storage root URL for metastore
        storage_root_credential_id:
          type: string
          description: UUID of storage credential to access the metastore storage_root.
        storage_root_credential_name:
          type: string
          description: Name of the storage credential to access the metastore storage_root.
        updated_at:
          type: integer
          description: Time at which the metastore was last modified, in epoch milliseconds.
        updated_by:
          type: string
          description: Username of user who last modified the metastore.
    ModelProviderService:
      type: object
      properties:
        browse_only:
          type: boolean
          description: Whether the caller sees only metadata available through the BROWSE privilege.
        comment:
          type: string
          description: User-provided description.
        config:
          $ref: '#/components/schemas/ModelProviderServiceConfig'
          description: 'Behavioral configuration: provider connection, model catalog, and passthrough policy. See ``ModelProviderServiceConfig``
            for the per-field contract. Required on CreateModelProviderService; on Update it is required only when ``config``
            (or a ``config.*`` subpath) appears in ``update_mask``.'
        create_time:
          type: string
          format: date-time
          description: When the provider service was created.
        created_by:
          type: string
          description: Creator identity.
        effective_owner:
          type: string
          description: The resolved owner of the model provider service. Falls back to the caller's identity when ``owner``
            is not explicitly set on creation.
        etag:
          type: string
          description: Optimistic concurrency control token. Server-generated from the entity's state and returned on every
            read. To use it as an if-match precondition on a mutation, echo the last-read value back via the dedicated ``etag``
            field on the Update / Delete request; the server rejects the mutation if the stored etag differs.
        metastore_id:
          type: string
          description: Metastore hosting the provider service.
        name:
          type: string
          description: 'Resource name of the provider service. Format: ``model-provider-services/{catalog}.{schema}.{model_provider_service}``.
            Each ``{...}`` component is capped at 255 characters individually. Server-derived on Create from ``parent`` +
            ``model_provider_service_id``; required and immutable on Update/Get/Delete.'
        owner:
          type: string
          description: The owner of the model provider service. Write-only; read owner via effective_owner.
        update_time:
          type: string
          format: date-time
          description: When the provider service was last modified.
        updated_by:
          type: string
          description: Identity of the last updater.
      description: |-
        A governed external model-provider connection stored in Unity Catalog (e.g. an OpenAI API
            account, an Azure OpenAI deployment, an Amazon Bedrock account). Owns the provider type and the
            auth/configuration the platform needs to invoke that provider, and is referenced from
            ``ExternalModelConfig.model_provider_service`` on a ModelService.

            One ModelProviderService can back many ModelServices (e.g. an ``openai_prod`` provider serving
            multiple models); a single ModelService can fan out across multiple ModelProviderServices for
            traffic split or failover.
    ModelProviderServiceConfig:
      type: object
      properties:
        allow_all_targets:
          type: boolean
          description: When true, accepts any model exposed by the upstream provider; ``targets`` is not required and does
            not restrict routability. When false, only models listed in ``targets`` are routable.
        amazon_bedrock:
          $ref: '#/components/schemas/ModelProviderServiceConfigAmazonBedrockProviderConfig'
        anthropic:
          $ref: '#/components/schemas/ModelProviderServiceConfigAnthropicProviderConfig'
        azure_openai:
          $ref: '#/components/schemas/ModelProviderServiceConfigAzureOpenAiProviderConfig'
        custom:
          $ref: '#/components/schemas/ModelProviderServiceConfigCustomProviderConfig'
        forward_headers:
          type: boolean
          description: Whether to forward incoming request headers to the upstream provider. Applies to managed (multi-model)
            requests as well as passthrough requests served by this provider service. Governance-level decision by the provider
            service owner; not selectable per inference call.
        forward_query_parameters:
          type: boolean
          description: Whether to forward incoming request query parameters to the upstream provider. Same trust-boundary
            semantics as ``forward_headers``.
        forward_unmanaged_paths:
          type: boolean
          description: Whether to forward request paths that fall outside this service's managed API set to the upstream provider
            as opaque passthrough. When true, requests addressed to subpaths not recognized by the managed API surface are
            proxied to the upstream provider over the same provider connection. When false, only managed-API paths are served.
            Governance-level decision by the provider service owner; expanding this expands the trust boundary that the ModelProviderService
            exposes.
        gemini_enterprise:
          $ref: '#/components/schemas/ModelProviderServiceConfigGeminiEnterpriseProviderConfig'
        inference_table:
          $ref: '#/components/schemas/InferenceTableConfig'
          description: Inference table configuration for payload logging when this provider service is invoked directly. When
            it is invoked through a model service, the model service's own inference table captures the invocation instead.
            Mirrors ``ModelServiceConfig.inference_table`` / ``AgentServiceConfig.inference_table``.
        microsoft_foundry:
          $ref: '#/components/schemas/ModelProviderServiceConfigMicrosoftFoundryProviderConfig'
        openai:
          $ref: '#/components/schemas/ModelProviderServiceConfigOpenAiProviderConfig'
        provider_type:
          $ref: '#/components/schemas/ModelProviderServiceConfigExternalModelProviderType'
          description: Provider type discriminator. Required at create time; immutable after. Determines which variant of
            the ``provider`` oneof must be set. May not be changed via Update; attempts to include ``config.provider_type``
            in ``UpdateModelProviderServiceRequest.update_mask`` are rejected. Required on CreateModelProviderService and
            immutable thereafter.
        rate_limits:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
          description: Rate limits applied when this provider service is invoked directly. When it is invoked through a model
            service, the model service's own ``rate_limits`` apply instead. Mirrors ``ModelServiceConfig.rate_limits`` / ``McpServiceConfig.rate_limits``.
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ModelProviderServiceConfigModelTargetConfig'
          description: Routing targets this provider service exposes (provider-side model identifier + unified API types per
            entry). Required (>=1) when ``allow_all_targets = false``; optional and additive when ``allow_all_targets = true``.
            References from ``ExternalModelConfig.target`` must match an entry here unless ``allow_all_targets = true``.
      description: |-
        Behavioral configuration for a ModelProviderService: provider connection (auth +
            provider-specific fields), the catalog of models this provider service can route to, and the
            passthrough policy that governs how request headers, query parameters, and unmanaged subpaths
            cross the trust boundary to the upstream provider.
    ModelProviderServiceConfigAmazonBedrockProviderConfig:
      type: object
      properties:
        direct:
          $ref: '#/components/schemas/ModelProviderServiceConfigAmazonBedrockProviderDirectConfig'
      description: Amazon Bedrock provider configuration.
    ModelProviderServiceConfigAmazonBedrockProviderDirectConfig:
      type: object
      properties:
        aws_access_key:
          $ref: '#/components/schemas/ModelProviderServiceConfigAwsAccessKey'
          description: AWS access-key-pair auth. Mutually exclusive with ``service_credential``. Supersedes the flat ``aws_access_key_id``
            / ``aws_secret_access_key`` fields.
        aws_access_key_id:
          type: string
          description: 'Deprecated flat AWS access key ID. Superseded by ``aws_access_key.access_key_id``. Kept for one migration
            cycle; the handler mirrors it to/from ``aws_access_key``. Treated as username-equivalent (not a secret value):
            round-trips on reads and is scrubbed from audit logs.'
        aws_secret_access_key:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: Deprecated flat AWS secret access key. Superseded by ``aws_access_key.secret_access_key``. Kept for
            one migration cycle; the handler mirrors it to/from ``aws_access_key``. Supplied as inline plaintext via ``ProviderSecret.plaintext``.
        region:
          type: string
          description: AWS region where the Bedrock endpoint is hosted (e.g., ``us-east-1``). Required on Create.
        service_credential:
          $ref: '#/components/schemas/ModelProviderServiceConfigServiceCredential'
          description: Reference to a UC service credential authorizing Bedrock requests. On Create the caller supplies ``service_credential.name``
            in the AIP-122 resource-name form ``credentials/{name}``. Required on Create when using UC-service-credential
            auth; mutually exclusive with ``aws_access_key``. The credential is referenced by name; its value is not carried
            here. On read the resolved ``id`` and ``is_deleted`` are also populated. Only supported on AWS-hosted workspaces;
            Create requests from other clouds are rejected with INVALID_PARAMETER_VALUE.
      description: |-
        Direct form of Amazon Bedrock provider config.

            Authentication is one of two mutually exclusive modes, exactly one of which must be supplied on
            Create:

            - Access keys: set ``aws_access_key``, leave ``service_credential`` unset.
            - UC service credential: set ``service_credential.name`` to the AIP-122 resource-name form
              ``credentials/{name}``, leave ``aws_access_key`` unset. The credential value lives in UC and
              is referenced by name, not held on this message. Setting more than one mode is rejected.
    ModelProviderServiceConfigAnthropicProviderConfig:
      type: object
      properties:
        direct:
          $ref: '#/components/schemas/ModelProviderServiceConfigAnthropicProviderDirectConfig'
          description: 'Direct (inline-credentials) form: caller supplies the API key in the request body. Required on Create
            unless ``relayed`` is set.'
        relayed:
          $ref: '#/components/schemas/ModelProviderServiceConfigAnthropicProviderRelayedConfig'
          description: 'Relayed (credential-less) form: no Anthropic credential is stored. Each inference request instead
            carries the caller''s own OAuth token, which the platform forwards to Anthropic on outbound requests. Mutually
            exclusive with ``direct``; no ``api_key`` is required or persisted.'
      description: |-
        Anthropic provider configuration. Exactly one of ``direct`` or ``relayed`` must be set on
            Create; the two are mutually exclusive.
    ModelProviderServiceConfigAnthropicProviderDirectConfig:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: Anthropic API key. Required on Create. Sent as the ``x-api-key`` header on outbound requests. Supplied
            as inline plaintext via ``ProviderSecret.plaintext``.
      description: Direct form of Anthropic provider config.
    ModelProviderServiceConfigAnthropicProviderRelayedConfig:
      type: object
      properties:
        plan_type:
          $ref: '#/components/schemas/ModelProviderServiceConfigAnthropicProviderRelayedConfigAnthropicRelayedPlanType'
          description: Which Anthropic subscription tier the relayed token belongs to. Optional; when unset the MPS gets the
            full governance surface (see TEAM_ENTERPRISE). Immutable after Create, so the tier cannot be flipped in place.
      description: |-
        Relayed form of Anthropic provider config: no credential is stored. Authentication is the
            caller's own OAuth token, forwarded to Anthropic on outbound requests, so there is no persisted
            secret. Presence of this variant is the signal that the provider service uses relayed auth;
            ``plan_type`` further distinguishes which Anthropic subscription tier the token belongs to.
    ModelProviderServiceConfigAwsAccessKey:
      type: object
      properties:
        access_key_id:
          type: string
          description: 'AWS access key ID. Required on Create when using access-key auth. Treated as username-equivalent (not
            a secret value): round-trips on reads and is scrubbed from audit logs.'
        secret_access_key:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: AWS secret access key paired with ``access_key_id``. Required on Create when using access-key auth.
            Supplied as inline plaintext via ``ProviderSecret.plaintext``.
      description: 'AWS access-key-pair auth for Amazon Bedrock: a SigV4-signing key pair.'
    ModelProviderServiceConfigAzureOpenAiProviderConfig:
      type: object
      properties:
        direct:
          $ref: '#/components/schemas/ModelProviderServiceConfigAzureOpenAiProviderDirectConfig'
      description: Azure OpenAI provider configuration.
    ModelProviderServiceConfigAzureOpenAiProviderDirectConfig:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: Azure OpenAI API key. Mutually exclusive with the Entra and service-credential modes. Supplied as inline
            plaintext via ``ProviderSecret.plaintext``.
        base_url:
          type: string
          description: Full Azure OpenAI endpoint base URL, e.g. ``https://myresource.openai.azure.com``. Required on Create.
        client_id:
          type: string
          description: Deprecated flat Entra client ID. Superseded by ``entra_service_principal.client_id``. Kept for one
            migration cycle; the handler mirrors it to/from ``entra_service_principal``.
        client_secret:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: Deprecated flat Entra client secret. Superseded by ``entra_service_principal.client_secret``. Kept
            for one migration cycle; the handler mirrors it to/from ``entra_service_principal``. Supplied as inline plaintext
            via ``ProviderSecret.plaintext``.
        entra_service_principal:
          $ref: '#/components/schemas/ModelProviderServiceConfigEntraServicePrincipal'
          description: Entra ID (service principal) auth. Mutually exclusive with ``api_key`` and ``service_credential``.
            Supersedes the flat ``tenant_id`` / ``client_id`` / ``client_secret`` fields.
        service_credential:
          $ref: '#/components/schemas/ModelProviderServiceConfigServiceCredential'
          description: Reference to a UC service credential authorizing Azure OpenAI requests. On Create the caller supplies
            ``service_credential.name`` in the AIP-122 resource-name form ``credentials/{name}``. Required on Create when
            using UC-service-credential auth; mutually exclusive with ``api_key`` and ``entra_service_principal``. The credential
            is referenced by name; its value is not carried here. On read the resolved ``id`` and ``is_deleted`` are also
            populated. Only supported on Azure-hosted workspaces; Create requests from other clouds are rejected with INVALID_PARAMETER_VALUE.
        tenant_id:
          type: string
          description: Deprecated flat Entra tenant ID. Superseded by ``entra_service_principal.tenant_id``. Kept for one
            migration cycle; the handler mirrors it to/from ``entra_service_principal``.
      description: |-
        Direct form of Azure OpenAI provider config. Exactly one of three mutually-exclusive auth modes
            must be supplied on Create:

            - API key: set ``api_key``, leave ``entra_service_principal`` and ``service_credential`` unset.
            - Entra ID (service principal): set ``entra_service_principal``, leave ``api_key`` and
              ``service_credential`` unset.
            - UC service credential: set ``service_credential.name`` to the AIP-122 resource-name form
              ``credentials/{name}``, leave ``api_key`` and ``entra_service_principal`` unset. The
              credential value lives in UC and is referenced by name, not held on this message. Only
              supported on Azure-hosted workspaces. Setting more than one mode is rejected.
    ModelProviderServiceConfigCustomProviderConfig:
      type: object
      properties:
        direct:
          $ref: '#/components/schemas/ModelProviderServiceConfigCustomProviderDirectConfig'
      description: 'Custom provider configuration: arbitrary HTTP endpoint with bearer-token auth.'
    ModelProviderServiceConfigCustomProviderDirectConfig:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: 'Bearer token forwarded as the ``Authorization: Bearer ...`` header on outbound requests. Supplied
            as inline plaintext via ``ProviderSecret.plaintext``. Set this for bearer-token auth.'
        base_url:
          type: string
          description: Endpoint URL of the OpenAI-compatible service (e.g., ``https://api.example.com/v1``). Required on Create.
      description: |-
        Direct form of custom provider config.

            Authentication is one of two mutually exclusive modes, exactly one of which must be supplied on
            Create:

            - Bearer: set ``api_key``, leave ``header_auth`` unset. The secret is forwarded as
              ``Authorization: Bearer <secret>``.
            - Header: set ``header_auth``, leave ``api_key`` unset. The secret is forwarded as
              ``<api_key_name>: <api_key_value>``. Setting both modes or neither mode is rejected.
    ModelProviderServiceConfigEntraServicePrincipal:
      type: object
      properties:
        client_id:
          type: string
          description: Entra ID client (application) ID. Required on Create.
        client_secret:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: Entra ID client secret. Supplied as inline plaintext via ``ProviderSecret.plaintext``.
        tenant_id:
          type: string
          description: Entra ID (Azure AD) tenant ID. Required on Create.
      description: |-
        Entra ID (Azure AD) service-principal auth: AI Gateway exchanges the ``tenant_id`` +
            ``client_id`` identify the service principal, and the ``credential`` oneof proves that identity,
            exchanged for an Entra bearer token on outbound requests via the OAuth2 client-credentials
            grant. Shared by the Azure OpenAI and Microsoft Foundry provider configs.
    ModelProviderServiceConfigGeminiEnterpriseProviderConfig:
      type: object
      properties:
        direct:
          $ref: '#/components/schemas/ModelProviderServiceConfigGeminiEnterpriseProviderDirectConfig'
      description: Gemini Enterprise provider configuration.
    ModelProviderServiceConfigGeminiEnterpriseProviderDirectConfig:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: Google Gemini Enterprise API key. Required on Create. Supplied as inline plaintext via ``ProviderSecret.plaintext``.
        project_id:
          type: string
          description: GCP project ID hosting the Gemini Enterprise endpoint. Required on Create.
        region:
          type: string
          description: GCP region of the Gemini Enterprise endpoint (e.g., ``us-central1``). Required on Create.
      description: Direct form of Gemini Enterprise provider config.
    ModelProviderServiceConfigMicrosoftFoundryProviderConfig:
      type: object
      properties:
        direct:
          $ref: '#/components/schemas/ModelProviderServiceConfigMicrosoftFoundryProviderDirectConfig'
      description: Microsoft Foundry provider configuration.
    ModelProviderServiceConfigMicrosoftFoundryProviderDirectConfig:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: Microsoft AI Foundry API key. Mutually exclusive with the Entra and service-credential modes. Supplied
            as inline plaintext via ``ProviderSecret.plaintext``.
        base_url:
          type: string
          description: Microsoft AI Foundry endpoint URL. Required on Create.
        client_id:
          type: string
          description: Deprecated flat Entra client ID. Superseded by ``entra_service_principal.client_id``. Kept for one
            migration cycle; the handler mirrors it to/from ``entra_service_principal``.
        client_secret:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: Deprecated flat Entra client secret. Superseded by ``entra_service_principal.client_secret``. Kept
            for one migration cycle; the handler mirrors it to/from ``entra_service_principal``. Supplied as inline plaintext
            via ``ProviderSecret.plaintext``.
        entra_service_principal:
          $ref: '#/components/schemas/ModelProviderServiceConfigEntraServicePrincipal'
          description: Entra ID (service principal) auth. Mutually exclusive with ``api_key`` and ``service_credential``.
            Supersedes the flat ``tenant_id`` / ``client_id`` / ``client_secret`` fields.
        service_credential:
          $ref: '#/components/schemas/ModelProviderServiceConfigServiceCredential'
          description: Reference to a UC service credential authorizing Microsoft Foundry requests. On Create the caller supplies
            ``service_credential.name`` in the AIP-122 resource-name form ``credentials/{name}``. Required on Create when
            using UC-service-credential auth; mutually exclusive with ``api_key`` and ``entra_service_principal``. The credential
            is referenced by name; its value is not carried here. On read the resolved ``id`` and ``is_deleted`` are also
            populated. Only supported on Azure-hosted workspaces; Create requests from other clouds are rejected with INVALID_PARAMETER_VALUE.
        tenant_id:
          type: string
          description: Deprecated flat Entra tenant ID. Superseded by ``entra_service_principal.tenant_id``. Kept for one
            migration cycle; the handler mirrors it to/from ``entra_service_principal``.
      description: |-
        Direct form of Microsoft Foundry provider config.

            Authentication is one of three mutually exclusive modes, exactly one of which must be supplied
            on Create:

            - API key: set ``api_key``, leave ``entra_service_principal`` and ``service_credential`` unset.
            - Entra ID (service principal): set ``entra_service_principal``, leave ``api_key`` and
              ``service_credential`` unset. AI Gateway exchanges these for an Entra bearer token on outbound
              requests via the OAuth2 client-credentials grant.
            - UC service credential: set ``service_credential.name`` to the AIP-122 resource-name form
              ``credentials/{name}``, leave ``api_key`` and ``entra_service_principal`` unset. The
              credential value lives in UC and is referenced by name, not held on this message. Only
              supported on Azure-hosted workspaces. Setting more than one mode is rejected.
    ModelProviderServiceConfigModelTargetConfig:
      type: object
      properties:
        model:
          type: string
          description: Provider-side model identifier (e.g. "gpt-5", "claude-opus-4-7"). This is a string on the LLM provider's
            side, not a UC entity. The UC governance hook for external destinations is the ModelProviderService referenced
            by ``ExternalModelConfig.model_provider_service``, not the model itself.
        native_api_types:
          type: array
          items:
            type: string
          description: Provider-native API types the model supports (e.g. "openai/v1/chat/completions"). Used by the platform
            for request/response translation from the unified API type. At most 64 entries of at most 256 characters each;
            the list is persisted into the destination binding's bounded storage envelope.
      required:
      - model
      description: Model target configuration for an external model destination.
    ModelProviderServiceConfigOpenAiProviderConfig:
      type: object
      properties:
        direct:
          $ref: '#/components/schemas/ModelProviderServiceConfigOpenAiProviderDirectConfig'
      description: OpenAI provider configuration.
    ModelProviderServiceConfigOpenAiProviderDirectConfig:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/ModelProviderServiceConfigProviderSecret'
          description: OpenAI API key. Required on Create. Supplied as inline plaintext via ``ProviderSecret.plaintext``.
        base_url:
          type: string
          description: Optional custom base URL. Defaults to ``https://api.openai.com/v1``. Use for OpenAI-API-compatible
            third-party endpoints or in-network proxies.
        organization:
          type: string
          description: Optional OpenAI organization ID. When set, the platform forwards it as the ``OpenAI-Organization``
            header.
      description: Direct (inline-credentials) form of the OpenAI provider config.
    ModelProviderServiceConfigProviderSecret:
      type: object
      properties:
        plaintext:
          type: string
          description: 'Inline plaintext credential. INPUT_ONLY: the value never round-trips on reads. Get and List responses
            omit ``plaintext``; the field''s presence in the read shape only indicates that a secret is configured.'
      description: |-
        A secret value supplied as part of an inline provider config. The caller supplies the value as
            inline ``plaintext`` on writes; the platform stores it encrypted. The ``plaintext`` field is
            ``INPUT_ONLY`` and never round-trips on reads.
    ModelProviderServiceConfigServiceCredential:
      type: object
      properties:
        name:
          type: string
          description: Resource name of the bound UC service credential, in the AIP-122 form ``credentials/{name}`` (a metastore-level
            single-part credential name). On create the caller supplies the name here. On read it reflects the credential's
            current name at read time.
      required:
      - name
      description: |-
        ---- Provider configuration (nested; see the ``provider`` oneof below) ---- The customer-owned
            UC service credential a ModelProviderService uses to authenticate to its provider, referenced by
            name.
    ModelService:
      type: object
      properties:
        browse_only:
          type: boolean
          description: Whether the caller sees only metadata available through the BROWSE privilege.
        comment:
          type: string
          description: User-provided description.
        config:
          $ref: '#/components/schemas/ModelServiceConfig'
          description: 'Operational configuration: destinations, routing, rate limits, inference table. Required on CreateModelService;
            on UpdateModelService it is required only when ``config`` (or a ``config.*`` subpath) appears in ``update_mask``.'
        create_time:
          type: string
          format: date-time
          description: When the model service was created.
        created_by:
          type: string
          description: Creator identity.
        effective_owner:
          type: string
          description: The resolved owner of the ModelService. Falls back to the caller's identity when ``owner`` is not explicitly
            set on creation.
        etag:
          type: string
          description: Optimistic concurrency control token. Server-generated from the entity's state and returned on every
            read. To use it as an if-match precondition on a mutation, echo the last-read value back via the dedicated ``etag``
            field on the Update / Delete request; the server rejects the mutation if the stored etag differs.
        metastore_id:
          type: string
          description: Metastore hosting the model service.
        name:
          type: string
          description: 'Resource name of the model service. Format: ``model-services/{catalog}.{schema}.{model_service}``.
            Each ``{...}`` component is capped at 255 characters individually. Server-derived on Create from ``parent`` +
            ``model_service_id``; required and immutable on Update/Get/Delete.'
        owner:
          type: string
          description: The owner of the model service. Write-only; read owner via effective_owner.
        supported_api_types:
          type: array
          items:
            type: string
          description: Unified API types this endpoint supports (e.g. "chat", "embeddings", "completions"). Derived from the
            destinations' backing models / providers at read time.
        update_time:
          type: string
          format: date-time
          description: When the model service was last modified.
        updated_by:
          type: string
          description: Identity of the last updater.
      description: |-
        A governed AI Gateway endpoint in Unity Catalog that routes inference requests to one or more
            model destinations (for example a foundation model or an external LLM reached through a
            ModelProviderService). Applies centralized access control, rate limits, guardrails, and auditing
            to the traffic it serves.
    ModelServiceConfig:
      type: object
      properties:
        inference_table:
          $ref: '#/components/schemas/InferenceTableConfig'
          description: Inference table config for payload logging.
        rate_limits:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
          description: Rate limits applied to requests routed through this model service.
        routing:
          $ref: '#/components/schemas/ModelServiceConfigRoutingConfig'
          description: 'Routing configuration: destinations, routing strategy, and fallback.'
      description: Operational configuration wrapped around the ModelService resource.
    ModelServiceConfigDestinationConfig:
      type: object
      properties:
        name:
          type: string
          description: User-facing label for this destination, used in routing references.
        destination_type:
          $ref: '#/components/schemas/ModelServiceConfigDestinationConfigDestinationType'
          description: Backing-model category. Determines which oneof variant is populated.
        external_model_config:
          $ref: '#/components/schemas/ModelServiceConfigExternalModelConfig'
        is_deleted:
          type: boolean
          description: True when the destination's backing UC entity (MODEL for foundation-model destinations, MODEL_PROVIDER_SERVICE
            for external destinations) has been deleted but the destination row still references it. The dangling destination
            is surfaced (not silently dropped) so callers can see the broken routing. Inference traffic through this destination
            fails closed (BAD_REQUEST / FAILED_PRECONDITION).
        pay_per_token_config:
          $ref: '#/components/schemas/ModelServiceConfigPayPerTokenConfig'
        provisioned_throughput_config:
          $ref: '#/components/schemas/ModelServiceConfigProvisionedThroughputConfig'
        traffic_percentage:
          type: integer
          description: Share of traffic sent to this destination, 0-100. Optional on fallback destinations; see FallbackConfig.
      required:
      - name
      - destination_type
      description: |-
        A destination the model service can route traffic to. Exactly one of the per-type configs inside
            ``type_config`` must be set, and it must match ``destination_type``.
    ModelServiceConfigExternalModelConfig:
      type: object
      properties:
        model_provider_service:
          type: string
          description: 'Resource name of the governed ModelProviderService that owns provider auth and provider-specific configuration.
            The referenced ModelProviderService also carries the provider type, so this message does not surface it directly.
            Format: ``model-provider-services/{catalog}.{schema}.{model_provider_service}``. Each ``{...}`` component is capped
            at 255 characters individually.'
        target:
          $ref: '#/components/schemas/ModelProviderServiceConfigModelTargetConfig'
          description: 'Routing target for the destination: the provider-side model selected from the referenced ModelProviderService''s
            ``targets`` catalog, plus the unified API types the platform should translate to/from at request time.'
      required:
      - model_provider_service
      - target
      description: |-
        Configuration for an external-foundation-model destination. Provider auth and provider-specific
            cloud configuration are owned by a separate, governed ModelProviderService entity referenced via
            ``model_provider_service``; the platform resolves the provider at invocation time.
    ModelServiceConfigFallbackConfig:
      type: object
      properties:
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/ModelServiceConfigDestinationConfig'
          description: Ordered list of fallback destinations. Traversal is in list order; the attempt count is the length
            of the list. At most 5 are allowed.
      description: |-
        Fallback routing, applied after the primary destination returns a retryable error. Traversal is
            in list order; the attempt count is the length of the list.
    ModelServiceConfigPayPerTokenConfig:
      type: object
      properties:
        model:
          type: string
          description: 'Resource name of the UC model. Format: ``models/{catalog}.{schema}.{model}``.'
      required:
      - model
      description: |-
        Configuration for a pay-per-token foundation-model destination. Identifies the foundation model
            by its UC resource name; the platform resolves it to a Model Serving endpoint at request time.
    ModelServiceConfigProvisionedThroughputConfig:
      type: object
      properties:
        model_serving_endpoint:
          type: string
          description: Name of the backing Model Serving endpoint serving the provisioned- throughput foundation model, as
            the AIP-122 typed resource name ``serving-endpoints/{name}``. The same UC model can be served on multiple Model
            Serving endpoints (different throughput / region / config); the caller picks which one this destination routes
            to. The endpoint must exist at create time.
        model:
          type: string
          description: UC model FQN of the model served by the backing endpoint (e.g., ``system.ai.databricks-claude-opus-4-6``).
            Resolved from Model Serving at Create/Update time.
      required:
      - model_serving_endpoint
      description: |-
        Configuration for a provisioned-throughput foundation-model destination. References a
            pre-existing Model Serving endpoint that serves the model; sizing (provisioned throughput, burst
            scaling, model version) is owned by the Model Serving endpoint itself, not by this message.
    ModelServiceConfigRoutingConfig:
      type: object
      properties:
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/ModelServiceConfigDestinationConfig'
          description: Primary routing destinations. At most 10 are allowed. At least one is required on CreateModelService;
            on UpdateModelService it is required only when ``config.routing`` (or a ``config.routing.*`` subpath) appears
            in ``update_mask``.
        fallback:
          $ref: '#/components/schemas/ModelServiceConfigFallbackConfig'
          description: Fallback routing config, applied after primary destinations fail.
        first_token_timeout:
          type: string
          description: Timeout for the first token of a streaming response. If a destination does not return its first token
            within this duration, AI Gateway aborts the attempt and fails over to the next destination. Applies to streaming
            requests only. Leave unset for no first-token timeout.
        traffic_splitting:
          $ref: '#/components/schemas/ModelServiceConfigRoutingConfigTrafficSplitting'
          description: Marker message selecting request-based traffic splitting. Traffic is distributed according to each
            destination's traffic_percentage value; no configuration lives on this message itself.
      description: |-
        Routing configuration for a model service, nesting destinations, routing strategy, and fallback
            under a single sub-message.
    ModelServiceConfigRoutingConfigTrafficSplitting:
      type: object
      properties: {}
      description: |-
        Marker message selecting request-based traffic splitting across primary destinations. Split
            weights are read from each DestinationConfig.traffic_percentage.
    ModelVersionInfo:
      type: object
      properties:
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredModelAlias'
        catalog_name:
          type: string
          description: The name of the catalog containing the model version
        comment:
          type: string
          description: The comment attached to the model version
        created_at:
          type: integer
        created_by:
          type: string
          description: The identifier of the user who created the model version
        id:
          type: string
          description: The unique identifier of the model version
        metastore_id:
          type: string
          description: The unique identifier of the metastore containing the model version
        model_name:
          type: string
          description: The name of the parent registered model of the model version, relative to parent schema
        model_version_dependencies:
          $ref: '#/components/schemas/DependencyList'
          description: Model version dependencies, for feature-store packaged models
        run_id:
          type: string
          description: MLflow run ID used when creating the model version, if ``source`` was generated by an experiment run
            stored in an MLflow tracking server
        run_workspace_id:
          type: integer
          description: ID of the Databricks workspace containing the MLflow run that generated this model version, if applicable
        schema_name:
          type: string
          description: The name of the schema containing the model version, relative to parent catalog
        source:
          type: string
          description: URI indicating the location of the source artifacts (files) for the model version
        status:
          $ref: '#/components/schemas/ModelVersionInfoStatus'
          description: Current status of the model version. Newly created model versions start in PENDING_REGISTRATION status,
            then move to READY status once the model version files are uploaded and the model version is finalized. Only model
            versions in READY status can be loaded for inference or served.
        storage_location:
          type: string
          description: The storage location on the cloud under which model version data files are stored
        updated_at:
          type: integer
        updated_by:
          type: string
          description: The identifier of the user who updated the model version last time
        version:
          type: integer
          description: Integer model version number, used to reference the model version in API requests.
    MonitorCronSchedule:
      type: object
      properties:
        quartz_cron_expression:
          type: string
        timezone_id:
          type: string
          description: The timezone id (e.g., ``PST``) in which to evaluate the quartz expression.
        pause_status:
          $ref: '#/components/schemas/MonitorCronSchedulePauseStatus'
          description: Read only field that indicates whether a schedule is paused or not.
      required:
      - quartz_cron_expression
      - timezone_id
    MonitorDataClassificationConfig:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether to enable data classification.
      description: Data classification related configuration.
    MonitorDestination:
      type: object
      properties:
        email_addresses:
          type: array
          items:
            type: string
    MonitorInferenceLog:
      type: object
      properties:
        problem_type:
          $ref: '#/components/schemas/MonitorInferenceLogProblemType'
        timestamp_col:
          type: string
          description: Column for the timestamp.
        granularities:
          type: array
          items:
            type: string
          description: List of granularities to use when aggregating data into time windows based on their timestamp.
        prediction_col:
          type: string
          description: Column for the prediction.
        model_id_col:
          type: string
          description: Column for the model identifier.
        label_col:
          type: string
          description: Column for the label.
        prediction_proba_col:
          type: string
          description: Column for prediction probabilities
      required:
      - problem_type
      - timestamp_col
      - granularities
      - prediction_col
      - model_id_col
    MonitorInfo:
      type: object
      properties:
        output_schema_name:
          type: string
        table_name:
          type: string
          description: '[Create:ERR Update:IGN] UC table to monitor. Format: ``catalog.schema.table_name``'
        status:
          $ref: '#/components/schemas/MonitorInfoStatus'
          description: '[Create:ERR Update:IGN] The monitor status.'
        profile_metrics_table_name:
          type: string
          description: '[Create:ERR Update:IGN] Table that stores profile metrics data. Format: ``catalog.schema.table_name``.'
        drift_metrics_table_name:
          type: string
          description: '[Create:ERR Update:IGN] Table that stores drift metrics data. Format: ``catalog.schema.table_name``.'
        monitor_version:
          type: integer
          description: '[Create:ERR Update:IGN] Represents the current monitor configuration version in use. The version will
            be represented in a numeric fashion (1,2,3...). The field has flexibility to take on negative values, which can
            indicate corrupted monitor_version numbers.'
        assets_dir:
          type: string
          description: '[Create:REQ Update:IGN] Field for specifying the absolute path to a custom directory to store data-monitoring
            assets. Normally prepopulated to a default user location via UI and Python APIs.'
        baseline_table_name:
          type: string
          description: '[Create:OPT Update:OPT] Baseline table name. Baseline data is used to compute drift from the data
            in the monitored ``table_name``. The baseline table and the monitored table shall have the same schema.'
        custom_metrics:
          type: array
          items:
            $ref: '#/components/schemas/MonitorMetric'
          description: '[Create:OPT Update:OPT] Custom metrics.'
        dashboard_id:
          type: string
          description: '[Create:ERR Update:OPT] Id of dashboard that visualizes the computed metrics. This can be empty if
            the monitor is in PENDING state.'
        data_classification_config:
          $ref: '#/components/schemas/MonitorDataClassificationConfig'
          description: '[Create:OPT Update:OPT] Data classification related config.'
        inference_log:
          $ref: '#/components/schemas/MonitorInferenceLog'
        latest_monitor_failure_msg:
          type: string
          description: '[Create:ERR Update:IGN] The latest error message for a monitor failure.'
        notifications:
          $ref: '#/components/schemas/MonitorNotifications'
          description: '[Create:OPT Update:OPT] Field for specifying notification settings.'
        schedule:
          $ref: '#/components/schemas/MonitorCronSchedule'
          description: '[Create:OPT Update:OPT] The monitor schedule.'
        slicing_exprs:
          type: array
          items:
            type: string
          description: '[Create:OPT Update:OPT] List of column expressions to slice data with for targeted analysis. The data
            is grouped by each expression independently, resulting in a separate slice for each predicate and its complements.
            For example ``slicing_exprs=[“col_1”, “col_2 > 10”]`` will generate the following slices: two slices for ``col_2
            > 10`` (True and False), and one slice per unique value in ``col1``. For high-cardinality columns, only the top
            100 unique values by frequency will generate slices.'
        snapshot:
          $ref: '#/components/schemas/MonitorSnapshot'
          description: Configuration for monitoring snapshot tables.
        time_series:
          $ref: '#/components/schemas/MonitorTimeSeries'
          description: Configuration for monitoring time series tables.
      required:
      - output_schema_name
      - table_name
      - status
      - profile_metrics_table_name
      - drift_metrics_table_name
      - monitor_version
    MonitorMetric:
      type: object
      properties:
        name:
          type: string
          description: Name of the metric in the output tables.
        definition:
          type: string
          description: Jinja template for a SQL expression that specifies how to compute the metric. See `create metric definition
            <https://docs.databricks.com/en/lakehouse-monitoring/custom-metrics.html#create-definition>`__.
        input_columns:
          type: array
          items:
            type: string
          description: A list of column names in the input table the metric should be computed for. Can use ``":table"`` to
            indicate that the metric needs information from multiple columns.
        output_data_type:
          type: string
          description: The output type of the custom metric.
        type:
          $ref: '#/components/schemas/MonitorMetricType'
          description: 'Can only be one of ``"CUSTOM_METRIC_TYPE_AGGREGATE"``, ``"CUSTOM_METRIC_TYPE_DERIVED"``, or ``"CUSTOM_METRIC_TYPE_DRIFT"``.
            The ``"CUSTOM_METRIC_TYPE_AGGREGATE"`` and ``"CUSTOM_METRIC_TYPE_DERIVED"`` metrics are computed on a single table,
            whereas the ``"CUSTOM_METRIC_TYPE_DRIFT"`` compare metrics across baseline and input table, or across the two
            consecutive time windows. - CUSTOM_METRIC_TYPE_AGGREGATE: only depend on the existing columns in your table -
            CUSTOM_METRIC_TYPE_DERIVED: depend on previously computed aggregate metrics - CUSTOM_METRIC_TYPE_DRIFT: depend
            on previously computed aggregate or derived metrics'
      required:
      - name
      - definition
      - input_columns
      - output_data_type
      - type
      description: Custom metric definition.
    MonitorNotifications:
      type: object
      properties:
        on_failure:
          $ref: '#/components/schemas/MonitorDestination'
        on_new_classification_tag_detected:
          $ref: '#/components/schemas/MonitorDestination'
          description: Destinations to send notifications on new classification tag detected.
    MonitorRefreshInfo:
      type: object
      properties:
        refresh_id:
          type: integer
        state:
          $ref: '#/components/schemas/MonitorRefreshInfoState'
          description: The current state of the refresh.
        start_time_ms:
          type: integer
          description: Time at which refresh operation was initiated (milliseconds since 1/1/1970 UTC).
        end_time_ms:
          type: integer
          description: Time at which refresh operation completed (milliseconds since 1/1/1970 UTC).
        message:
          type: string
          description: An optional message to give insight into the current state of the job (e.g. FAILURE messages).
        trigger:
          $ref: '#/components/schemas/MonitorRefreshInfoTrigger'
          description: The method by which the refresh was triggered.
      required:
      - refresh_id
      - state
      - start_time_ms
    MonitorRefreshListResponse:
      type: object
      properties:
        refreshes:
          type: array
          items:
            $ref: '#/components/schemas/MonitorRefreshInfo'
    MonitorSnapshot:
      type: object
      properties: {}
      description: Snapshot analysis configuration
    MonitorTimeSeries:
      type: object
      properties:
        timestamp_col:
          type: string
          description: Column for the timestamp.
        granularities:
          type: array
          items:
            type: string
          description: 'Granularities for aggregating data into time windows based on their timestamp. Currently the following
            static granularities are supported: {``\"5 minutes\"``, ``\"30 minutes\"``, ``\"1 hour\"``, ``\"1 day\"``, ``\"\u003cn\u003e
            week(s)\"``, ``\"1 month\"``, ``\"1 year\"``}.'
      required:
      - timestamp_col
      - granularities
      description: Time series analysis configuration.
    NamedTableConstraint:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    NotificationDestination:
      type: object
      properties:
        destination_id:
          type: string
        destination_type:
          $ref: '#/components/schemas/DestinationType'
          description: The type of the destination.
        special_destination:
          $ref: '#/components/schemas/SpecialDestination'
          description: 'This field is used to denote whether the destination is the email of the owner of the securable object.
            The special destination cannot be assigned to a securable and only represents the default destination of the securable.
            The securable types that support default special destinations are: "catalog", "external_location", "connection",
            "credential", and "metastore". The **destination_type** of a **special_destination** is always EMAIL.'
    OneLakeEventQueue:
      type: object
      properties:
        consumer_group:
          type: string
          description: 'Event Hubs consumer group used to consume file events. Defaults to "$Default" when unset. Recommended
            for provided_onelake: create a dedicated consumer group on the Event Hub for file events to avoid contending with
            the customer''s other consumers.'
        event_hub_name:
          type: string
          description: Event Hub entity name within the namespace. Only required for provided_onelake.
        event_hub_url:
          type: string
          description: 'The Event Hub URL in the format https://{namespace}.servicebus.windows.net/{event_hub_name}. Deprecated:
            use fully_qualified_namespace + event_hub_name instead.'
        fully_qualified_namespace:
          type: string
          description: The fully qualified domain name of the Event Hubs namespace, e.g. {yournamespace}.servicebus.windows.net.
            Only required for provided_onelake.
        managed_resource_id:
          type: string
          description: Unique identifier included in the name of the file events managed resources.
      description: |-
        File event queue for OneLake (Microsoft Fabric) locations. Events flow through Fabric
            Eventstream in both arms; CSMS consumes from a user-provided Azure Event Hub (provided_onelake)
            or from a Fabric Eventstream that CSMS provisions in the user's workspace (managed_onelake).
    OnlineTable:
      type: object
      properties:
        name:
          type: string
          description: Full three-part (catalog, schema, table) name of the table.
        spec:
          $ref: '#/components/schemas/OnlineTableSpec'
          description: Specification of the online table.
        status:
          $ref: '#/components/schemas/OnlineTableStatus'
          description: Online Table data synchronization status
        table_serving_url:
          type: string
          description: Data serving REST API URL for this table
        unity_catalog_provisioning_state:
          $ref: '#/components/schemas/ProvisioningInfoState'
          description: The provisioning state of the online table entity in Unity Catalog. This is distinct from the state
            of the data synchronization pipeline (i.e. the table may be in "ACTIVE" but the pipeline may be in "PROVISIONING"
            as it runs asynchronously).
      description: Online Table information.
    OnlineTableSpec:
      type: object
      properties:
        perform_full_copy:
          type: boolean
          description: Whether to create a full-copy pipeline -- a pipeline that stops after creates a full copy of the source
            table upon initialization and does not process any change data feeds (CDFs) afterwards. The pipeline can still
            be manually triggered afterwards, but it always perform a full copy of the source table and there are no incremental
            updates. This mode is useful for syncing views or tables without CDFs to online tables. Note that the full-copy
            pipeline only supports "triggered" scheduling policy.
        pipeline_id:
          type: string
          description: ID of the associated pipeline. Generated by the server - cannot be set by the caller.
        primary_key_columns:
          type: array
          items:
            type: string
          description: Primary Key columns to be used for data insert/update in the destination.
        run_continuously:
          $ref: '#/components/schemas/OnlineTableSpecContinuousSchedulingPolicy'
          description: Pipeline runs continuously after generating the initial data.
        run_triggered:
          $ref: '#/components/schemas/OnlineTableSpecTriggeredSchedulingPolicy'
          description: Pipeline stops after generating the initial data and can be triggered later (manually, through a cron
            job or through data triggers)
        source_table_full_name:
          type: string
          description: Three-part (catalog, schema, table) name of the source Delta table.
        timeseries_key:
          type: string
          description: Time series key to deduplicate (tie-break) rows with the same primary key.
      description: Specification of an online table.
    OnlineTableSpecContinuousSchedulingPolicy:
      type: object
      properties: {}
    OnlineTableSpecTriggeredSchedulingPolicy:
      type: object
      properties: {}
    OnlineTableStatus:
      type: object
      properties:
        continuous_update_status:
          $ref: '#/components/schemas/ContinuousUpdateStatus'
        detailed_state:
          $ref: '#/components/schemas/OnlineTableState'
          description: The state of the online table.
        failed_status:
          $ref: '#/components/schemas/FailedStatus'
        message:
          type: string
          description: A text description of the current state of the online table.
        provisioning_status:
          $ref: '#/components/schemas/ProvisioningStatus'
        triggered_update_status:
          $ref: '#/components/schemas/TriggeredUpdateStatus'
      description: Status of an online table.
    OptionSpec:
      type: object
      properties:
        allowed_values:
          type: array
          items:
            type: string
          description: For drop down / radio button selections, UI will want to know the possible input values, it can also
            be used by other option types to limit input selections.
        conditional_display:
          $ref: '#/components/schemas/ConditionalDisplay'
          description: Conditional display configuration. Specifies when this option should be hidden based on another option's
            value.
        default_value:
          type: string
          description: The default value of the option, for example, value '443' for 'port' option.
        description:
          type: string
          description: A concise user facing description of what the input value of this option should look like.
        hint:
          type: string
          description: 'The hint is used on the UI to suggest what the input value can possibly be like, for example: example.com
            for ''host'' option. Unlike default value, it will not be applied automatically without user input.'
        is_copiable:
          type: boolean
          description: Indicates whether an option should be displayed with copy button on the UI.
        is_creatable:
          type: boolean
          description: Indicates whether an option can be provided by users in the create/update path of an entity.
        is_hidden:
          type: boolean
          description: Is the option value not user settable and is thus not shown on the UI.
        is_loggable:
          type: boolean
          description: Specifies whether this option is safe to log, i.e. no sensitive information.
        is_required:
          type: boolean
          description: Is the option required.
        is_secret:
          type: boolean
          description: Is the option value considered secret and thus redacted on the UI.
        is_updatable:
          type: boolean
          description: Is the option updatable by users.
        name:
          type: string
          description: The unique name of the option.
        oauth_stage:
          $ref: '#/components/schemas/OptionSpecOauthStage'
          description: Specifies when the option value is displayed on the UI within the OAuth flow.
        type:
          $ref: '#/components/schemas/OptionSpecOptionType'
          description: The type of the option.
      description: |-
        Spec of an allowed option on a securable kind and its attributes. This is mostly used by UI to
            provide user friendly hints and descriptions in order to facilitate the securable creation
            process.
    PermissionsChange:
      type: object
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/Privilege'
        principal:
          type: string
          description: The principal whose privileges we are changing. Only one of principal or principal_id should be specified,
            never both at the same time.
        principal_id:
          type: integer
          description: An opaque internal ID that identifies the principal whose privileges should be removed. This field
            is intended for removing privileges associated with a deleted user. When set, only the entries specified in the
            remove field are processed; any entries in the add field will be rejected. Only one of principal or principal_id
            should be specified, never both at the same time.
        remove:
          type: array
          items:
            $ref: '#/components/schemas/Privilege'
          description: The set of privileges to remove.
    PipelineProgress:
      type: object
      properties:
        estimated_completion_time_seconds:
          type: number
          description: The estimated time remaining to complete this update in seconds.
        latest_version_currently_processing:
          type: integer
          description: The source table Delta version that was last processed by the pipeline. The pipeline may not have completely
            processed this version yet.
        sync_progress_completion:
          type: number
          description: The completion ratio of this update. This is a number between 0 and 1.
        synced_row_count:
          type: integer
          description: The number of rows that have been synced in this update.
        total_row_count:
          type: integer
          description: The total number of rows that need to be synced in this update. This number may be an estimate.
      description: Progress information of the Online Table data synchronization pipeline.
    PolicyFunctionArgument:
      type: object
      properties:
        column:
          type: string
          description: A column reference.
        constant:
          type: string
          description: A constant literal.
      description: |-
        A positional argument passed to a row filter or column mask function. Distinguishes between
            column references and literals.
    PolicyInfo:
      type: object
      properties:
        to_principals:
          type: array
          items:
            type: string
        for_securable_type:
          $ref: '#/components/schemas/SecurableType'
          description: Type of securables that the policy should take effect on. Only ``TABLE`` is supported at this moment.
            Required on create and optional on update.
        policy_type:
          $ref: '#/components/schemas/PolicyType'
          description: Type of the policy. Required on create.
        column_mask:
          $ref: '#/components/schemas/ColumnMaskOptions'
          description: Options for column mask policies. Valid only if ``policy_type`` is ``POLICY_TYPE_COLUMN_MASK``. Required
            on create and optional on update. When specified on update, the new options will replace the existing options
            as a whole.
        comment:
          type: string
          description: Optional description of the policy.
        created_at:
          type: integer
          description: Time at which the policy was created, in epoch milliseconds. Output only.
        created_by:
          type: string
          description: Username of the user who created the policy. Output only.
        deny:
          $ref: '#/components/schemas/DenyOptions'
          description: Options for deny policies. Valid only if ``policy_type`` is ``POLICY_TYPE_DENY``. Required on create
            and optional on update. When specified on update, the new options will replace the existing options as a whole.
        except_principals:
          type: array
          items:
            type: string
          description: Optional list of user or group names that should be excluded from the policy.
        grant:
          $ref: '#/components/schemas/GrantOptions'
          description: Options for grant policies. Valid only if ``policy_type`` is ``POLICY_TYPE_GRANT``. Required on create
            and optional on update. When specified on update, the new options will replace the existing options as a whole.
        id:
          type: string
          description: Unique identifier of the policy. This field is output only and is generated by the system.
        match_columns:
          type: array
          items:
            $ref: '#/components/schemas/MatchColumn'
          description: Optional list of condition expressions used to match table columns. Only valid when ``for_securable_type``
            is ``TABLE``. When specified, the policy only applies to tables whose columns satisfy all match conditions.
        name:
          type: string
          description: Name of the policy. Required on create and optional on update. To rename the policy, set ``name`` to
            a different value on update.
        on_securable_fullname:
          type: string
          description: Full name of the securable on which the policy is defined. Required on create.
        on_securable_type:
          $ref: '#/components/schemas/SecurableType'
          description: Type of the securable on which the policy is defined. Only ``CATALOG``, ``SCHEMA`` and ``TABLE`` are
            supported at this moment. Required on create.
        row_filter:
          $ref: '#/components/schemas/RowFilterOptions'
          description: Options for row filter policies. Valid only if ``policy_type`` is ``POLICY_TYPE_ROW_FILTER``. Required
            on create and optional on update. When specified on update, the new options will replace the existing options
            as a whole.
        updated_at:
          type: integer
          description: Time at which the policy was last modified, in epoch milliseconds. Output only.
        updated_by:
          type: string
          description: Username of the user who last modified the policy. Output only.
        use_session_identity:
          type: boolean
          description: Temporary for migrating customers to session identity. Customers not currently using ABAC will not
            be able to set this field to false and all new policies will have this field default to true. Existing customers
            will have this field default to false, but can set it to true to opt in to session identity. after a grace period,
            this field will be removed and all policies will use session identity. Only for row filter and column mask policies.
            Not applicable to deny policies.
        when_condition:
          type: string
          description: Optional condition when the policy should take effect.
      required:
      - to_principals
      - for_securable_type
      - policy_type
