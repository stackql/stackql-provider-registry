            ``model_provider_service_id``; required and immutable on Update/Get/Delete.'
        update_time:
          type: string
          format: date-time
          description: Time the provider service was last modified.
        updated_by:
          type: string
          description: Identity of the last updater.
      description: |-
        A Unity Catalog securable that stores authentication and request configuration for an external
            model provider, such as OpenAI, Azure OpenAI, or Amazon Bedrock. Model service destinations
            reference it to send requests to that provider.

            A model provider service can be referenced by multiple model services. A model service can route
            across multiple model provider services for traffic splitting or failover.
    ModelProviderServiceConfig:
      type: object
      properties:
        allow_all_targets:
          type: boolean
          description: When true, allows models from the provider's built-in model catalog in addition to explicit ``targets``.
            When false, only models listed in ``targets`` are routable. Defaults to false. CUSTOM providers have no built-in
            model catalog and must leave this false and list their models in ``targets``.
        amazon_bedrock:
          $ref: '#/components/schemas/ModelProviderServiceConfigAmazonBedrockProviderConfig'
        anthropic:
          $ref: '#/components/schemas/ModelProviderServiceConfigAnthropicProviderConfig'
        azure_openai:
          $ref: '#/components/schemas/ModelProviderServiceConfigAzureOpenAiProviderConfig'
        bedrock_mantle:
          $ref: '#/components/schemas/ModelProviderServiceConfigAmazonBedrockProviderConfig'
        custom:
          $ref: '#/components/schemas/ModelProviderServiceConfigCustomProviderConfig'
        forward_headers:
          type: boolean
          description: Whether to forward incoming HTTP headers to the upstream provider. Defaults to false and is configured
            for the entire provider service, not per request. Upstream authentication is configured separately in the provider-specific
            configuration.
        forward_query_parameters:
          type: boolean
          description: Whether to forward incoming query parameters to the upstream provider. Defaults to false and is configured
            for the entire provider service, not per request.
        forward_unmanaged_paths:
          type: boolean
          description: Whether to proxy paths that AI Gateway does not recognize as configured provider-native API types.
            Defaults to false. When true, these paths are forwarded unchanged to the upstream provider. When false, only recognized
            API paths are served. Enabling this broadens the upstream API surface exposed through the provider service. AI
            Gateway cannot evaluate Service Policies on opaque unmanaged requests, so unmanaged requests are rejected whenever
            Service Policies are attached to this securable.
