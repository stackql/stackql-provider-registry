  /api/2.1/unity-catalog/validate-credentials:
    post:
      operationId: credentials_validate_credential
      summary: Validates a credential.
      tags:
      - catalog
      - credentials
      description: |-
        Validates a credential.

        For service credentials (purpose is **SERVICE**), either the **credential_name** or the cloud-specific
        credential must be provided.

        For storage credentials (purpose is **STORAGE**), at least one of **external_location_name** and
        **url** need to be provided. If only one of them is provided, it will be used for validation. And if
        both are provided, the **url** will be used for validation, and **external_location_name** will be
        ignored when checking overlapping urls. Either the **credential_name** or the cloud-specific
        credential must be provided.

        The caller must be a metastore admin or the credential owner or have the required permission on the
        metastore and the credential (e.g., **CREATE_EXTERNAL_LOCATION** when purpose is **STORAGE**).

        :param aws_iam_role: :class:`AwsIamRole` (optional)
        :param azure_managed_identity: :class:`AzureManagedIdentity` (optional)
        :param credential_name: str (optional)
          Required. The name of an existing credential or long-lived cloud credential to validate.
        :param databricks_gcp_service_account: :class:`DatabricksGcpServiceAccount` (optional)
        :param external_location_name: str (optional)
          The name of an existing external location to validate. Only applicable for storage credentials
          (purpose is **STORAGE**.)
        :param purpose: :class:`CredentialPurpose` (optional)
          The purpose of the credential. This should only be used when the credential is specified.
        :param read_only: bool (optional)
          Whether the credential is only usable for read operations. Only applicable for storage credentials
          (purpose is **STORAGE**.)
        :param url: str (optional)
          The external location url to validate. Only applicable when purpose is **STORAGE**.

        :returns: :class:`ValidateCredentialResponse`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                aws_iam_role:
                  type: object
                  properties:
                    external_id:
                      type: string
                      description: The external ID used in role assumption to prevent the confused deputy problem.
                    role_arn:
                      type: string
                      description: The Amazon Resource Name (ARN) of the AWS IAM role used to vend temporary credentials.
                    unity_catalog_iam_arn:
                      type: string
                      description: The Amazon Resource Name (ARN) of the AWS IAM user managed by Databricks. This is the identity
                        that is going to assume the AWS IAM role.
                  description: The AWS IAM role configuration
                azure_managed_identity:
                  type: object
                  properties:
                    access_connector_id:
                      type: string
                      description: The Azure resource ID of the Azure Databricks Access Connector. Use the format ``/subscriptions/{guid}/resourceGroups/{rg-name}/providers/Microsoft.Databricks/accessConnectors/{connector-name}``.
                    credential_id:
                      type: string
                      description: The Databricks internal ID that represents this managed identity.
                    managed_identity_id:
                      type: string
                      description: The Azure resource ID of the managed identity. Use the format, ``/subscriptions/{guid}/resourceGroups/{rg-name}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identity-name}``
                        This is only available for user-assgined identities. For system-assigned identities, the access_connector_id
                        is used to identify the identity. If this field is not provided, then we assume the AzureManagedIdentity
                        is using the system-assigned identity.
                  required:
                  - access_connector_id
                  description: The Azure managed identity configuration.
                credential_name:
                  type: string
                  description: Required. The name of an existing credential or long-lived cloud credential to validate.
                databricks_gcp_service_account:
                  type: object
                  properties:
                    credential_id:
                      type: string
                      description: The Databricks internal ID that represents this managed identity.
                    email:
                      type: string
                      description: The email of the service account.
                    private_key_id:
                      type: string
                      description: The ID that represents the private key for this Service Account
                  description: GCP long-lived credential. Databricks-created Google Cloud Storage service account.
                external_location_name:
                  type: string
                  description: The name of an existing external location to validate. Only applicable for storage credentials
                    (purpose is **STORAGE**.)
                purpose:
                  type: string
                  x-enum:
                  - SERVICE
                  - STORAGE
                  description: The purpose of the credential. This should only be used when the credential is specified.
                read_only:
                  type: boolean
                  description: Whether the credential is only usable for read operations. Only applicable for storage credentials
                    (purpose is **STORAGE**.)
                url:
                  type: string
                  description: The external location url to validate. Only applicable when purpose is **STORAGE**.
      responses:
