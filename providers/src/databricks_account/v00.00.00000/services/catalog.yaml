            unless ``key`` is ``RATE_LIMIT_KEY_SERVICE``, ``RATE_LIMIT_KEY_USER_DEFAULT``, or ``RATE_LIMIT_KEY_REQUEST_TAG``
            (which must not set a principal).'
        request_tag_key:
          type: string
          description: Request tag key this limit applies to. Required when ``key`` is ``RATE_LIMIT_KEY_REQUEST_TAG``, forbidden
            otherwise.
        request_tag_value:
          type: string
          description: Request tag value this limit applies to. Only valid when ``key`` is ``RATE_LIMIT_KEY_REQUEST_TAG``.
            Leave unset to apply the limit to every value of ``request_tag_key`` (an any-value default); a set value is a
            specific override for that value.
        requests:
          type: integer
