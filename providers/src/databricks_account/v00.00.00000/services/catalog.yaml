    get:
      operationId: credentials_list_credentials
      summary: Gets an array of credentials (as **CredentialInfo** objects).
      tags:
      - catalog
      - credentials
      description: |-
        Gets an array of credentials (as **CredentialInfo** objects).

        The array is limited to only the credentials that the caller has permission to access. If the caller
        is a metastore admin, retrieval of credentials is unrestricted. There is no guarantee of a specific
        ordering of the elements in the array.

        PAGINATION BEHAVIOR: The API is by default paginated, a page may contain zero results while still
        providing a next_page_token. Clients must continue reading pages until next_page_token is absent,
        which is the only indication that the end of results has been reached.

        :param include_unbound: bool (optional)
          Whether to include credentials not bound to the workspace. Effective only if the user has permission
          to update the credential–workspace binding.
        :param max_results: int (optional)
          Maximum number of credentials to return.

          - If not set, the default max page size is used.
          - When set to a value greater than 0, the page length is the minimum of this value and a
            server-configured value.
          - When set to 0, the page length is set to a server-configured value (recommended).
          - When set to a value less than 0, an invalid parameter error is returned.
        :param page_token: str (optional)
          Opaque token to retrieve the next page of results.
        :param purpose: :class:`CredentialPurpose` (optional)
          Return only credentials for the specified purpose.

        :returns: Iterator over :class:`CredentialInfo`
      parameters:
      - name: include_unbound
        in: query
        required: false
        schema:
          type: boolean
        description: Whether to include credentials not bound to the workspace. Effective only if the user has permission
          to update the credential–workspace binding.
      - name: max_results
        in: query
        required: false
        schema:
          type: integer
        description: Maximum number of credentials to return. - If not set, the default max page size is used. - When set
          to a value greater than 0, the page length is the minimum of this value and a server-configured value. - When set
          to 0, the page length is set to a server-configured value (recommended). - When set to a value less than 0, an invalid
          parameter error is returned.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
        description: Opaque token to retrieve the next page of results.
      - name: purpose
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CredentialPurpose'
        description: Return only credentials for the specified purpose.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCredentialsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
