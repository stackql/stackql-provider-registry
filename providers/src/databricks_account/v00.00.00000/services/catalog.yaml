openapi: 3.0.0
info:
  title: Databricks Catalog API (account)
  description: OpenAPI specification for the Databricks catalog service (account-level APIs), generated from the Databricks
    Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.catalog
servers:
- url: https://{account_host}
  variables:
    account_host:
      description: The Databricks account console host. Selected by DATABRICKS_CLOUD (aws, azure or gcp; default aws), or
        set explicitly with DATABRICKS_ACCOUNT_HOST (bare host, no scheme).
      default: accounts.cloud.databricks.com
      x-stackQL-envVar: DATABRICKS_ACCOUNT_HOST
      x-stackQL-envVarSelector:
        envVar: DATABRICKS_CLOUD
        default: aws
        values:
          aws: accounts.cloud.databricks.com
          azure: accounts.azuredatabricks.net
          gcp: accounts.gcp.databricks.com
paths:
  /api/2.0/accounts/{account_id}/workspaces/{workspace_id}/metastores/{metastore_id}:
    post:
      operationId: account_metastore_assignments_create
      summary: Creates an assignment to a metastore for a workspace
      tags:
      - catalog
      - account_metastore_assignments
      description: |-
        Creates an assignment to a metastore for a workspace

        :param workspace_id: int
          Workspace ID.
        :param metastore_id: str
          Unity Catalog metastore ID
        :param metastore_assignment: :class:`CreateMetastoreAssignment` (optional)

        :returns: :class:`AccountsCreateMetastoreAssignmentResponse`
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: integer
        description: Workspace ID.
      - name: metastore_id
        in: path
        required: true
        schema:
          type: string
        description: Unity Catalog metastore ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metastore_assignment:
                  type: object
                  properties:
                    workspace_id:
                      type: integer
                    metastore_id:
                      type: string
                      description: The unique ID of the metastore.
                    default_catalog_name:
                      type: string
                      description: The name of the default catalog in the metastore. This field is deprecated. Please use
                        "Default Namespace API" to configure the default catalog for a Databricks workspace.
                  required:
                  - workspace_id
                  - metastore_id
                  - default_catalog_name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsCreateMetastoreAssignmentResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountMetastoreAssignmentsAPI
    delete:
      operationId: account_metastore_assignments_delete
      summary: Deletes a metastore assignment to a workspace, leaving the workspace with no metastore.
      tags:
      - catalog
      - account_metastore_assignments
      description: |-
        Deletes a metastore assignment to a workspace, leaving the workspace with no metastore.

        :param workspace_id: int
          Workspace ID.
        :param metastore_id: str
          Unity Catalog metastore ID

        :returns: :class:`AccountsDeleteMetastoreAssignmentResponse`
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: integer
        description: Workspace ID.
      - name: metastore_id
        in: path
        required: true
        schema:
          type: string
        description: Unity Catalog metastore ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
