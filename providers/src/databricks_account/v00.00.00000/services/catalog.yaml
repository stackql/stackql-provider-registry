    InferenceTableConfig:
      type: object
      properties:
        parent:
          type: string
          description: 'Parent UC schema where the inference table is created. Format: ``schemas/{catalog}.{schema}``. Set
            at create time and immutable thereafter; changing it on an existing service is rejected.'
        disabled:
          type: boolean
          description: Indicates whether payload logging is disabled (opt-out). Unset means that payload logging is active
            (the on-by-default state coincides with the proto zero-value, so the server never fills this field for a client
            that leaves it unset). Set ``disabled = true`` to pause runtime logging while keeping the sub-message attached
            (preserving ``parent`` and ``table_name_prefix`` for a later flip back to active). ``parent`` remains required
            either way.
        is_deleted:
          type: boolean
          description: True when the bound inference TABLE has been deleted but the parent service still references it. The
            dangling reference is surfaced (not silently dropped) so callers can see the broken dependency. AI Gateway payload
            logging fails closed in this state.
        table:
          type: string
          description: 'Resolved UC table for payload logs. Format: ``tables/{catalog}.{schema}.{table}``.'
        table_name_prefix:
          type: string
          description: Prefix for the inference-table's UC-registered name. The actual leaf name UC stores is ``<table_name_prefix>_payload``;
            the ``_payload`` suffix is appended automatically. To find the actual UC table after Create, read the ``table``
            field on the response. Defaults to ``<model_service_name>_payload`` when unset. Set at create time and immutable
            thereafter; changing it on an existing service is rejected.
      required:
      - parent
      description: |-
        Inference table configuration for payload logging on a model service.

            ``parent`` is always REQUIRED when the sub-message is set; the destination UC schema is needed
            to construct or rebind the payload TABLE regardless of whether payload logging is currently
            active. Payload logging is active by default; set ``disabled = true`` to pause runtime logging
            without dropping the table or the binding.
