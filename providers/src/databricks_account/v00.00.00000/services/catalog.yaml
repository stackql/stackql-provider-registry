            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountMetastoresAPI
    put:
      operationId: account_metastores_update
      summary: Updates an existing Unity Catalog metastore.
      tags:
      - catalog
      - account_metastores
      description: |-
        Updates an existing Unity Catalog metastore.

        :param metastore_id: str
          Unity Catalog metastore ID
        :param metastore_info: :class:`UpdateAccountsMetastore` (optional)
          Properties of the metastore to change.

        :returns: :class:`AccountsUpdateMetastoreResponse`
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      - name: metastore_id
        in: path
        required: true
        schema:
          type: string
        description: Unity Catalog metastore ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metastore_info:
                  type: object
                  properties:
                    delta_sharing_organization_name:
                      type: string
                    delta_sharing_recipient_token_lifetime_in_seconds:
                      type: integer
                      description: The lifetime of delta sharing recipient token in seconds.
                    delta_sharing_scope:
                      type: string
                      x-enum:
                      - INTERNAL
                      - INTERNAL_AND_EXTERNAL
                      description: The scope of Delta Sharing enabled for the metastore.
                    external_access_enabled:
                      type: boolean
                      description: Whether to allow non-DBR clients to directly access entities under the metastore.
                    owner:
                      type: string
                      description: The owner of the metastore.
                    privilege_model_version:
                      type: string
                      description: Privilege model version of the metastore, of the form ``major.minor`` (e.g., ``1.0``).
                    storage_root_credential_id:
                      type: string
                      description: UUID of storage credential to access the metastore storage_root.
                  description: Properties of the metastore to change.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsUpdateMetastoreResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountMetastoresAPI
  /api/2.0/accounts/{account_id}/metastores/{metastore_id}/storage-credentials:
    post:
      operationId: account_storage_credentials_create
      summary: 'Creates a new storage credential. The request object is specific to the cloud:'
      tags:
      - catalog
      - account_storage_credentials
      description: |-
        Creates a new storage credential. The request object is specific to the cloud:

        - **AwsIamRole** for AWS credentials
        - **AzureServicePrincipal** for Azure credentials
        - **GcpServiceAccountKey** for GCP credentials

        The caller must be a metastore admin and have the ``CREATE_STORAGE_CREDENTIAL`` privilege on the
        metastore.

        :param metastore_id: str
          Unity Catalog metastore ID
        :param credential_info: :class:`CreateAccountsStorageCredential` (optional)
        :param skip_validation: bool (optional)
          Optional, default false. Supplying true to this argument skips validation of the created set of
          credentials.

        :returns: :class:`AccountsCreateStorageCredentialInfo`
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      - name: metastore_id
        in: path
        required: true
        schema:
          type: string
        description: Unity Catalog metastore ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                credential_info:
                  type: object
                  properties:
                    name:
                      type: string
                    aws_iam_role:
                      type: object
                      properties:
                        role_arn:
                          type: string
                          description: The Amazon Resource Name (ARN) of the AWS IAM role used to vend temporary credentials.
                      required:
                      - role_arn
                      description: The AWS IAM role configuration.
                    azure_managed_identity:
                      type: object
                      properties:
                        access_connector_id:
                          type: string
                          description: The Azure resource ID of the Azure Databricks Access Connector. Use the format ``/subscriptions/{guid}/resourceGroups/{rg-name}/providers/Microsoft.Databricks/accessConnectors/{connector-name}``.
                        managed_identity_id:
                          type: string
                          description: The Azure resource ID of the managed identity. Use the format, ``/subscriptions/{guid}/resourceGroups/{rg-name}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identity-name}``
                            This is only available for user-assgined identities. For system-assigned identities, the access_connector_id
                            is used to identify the identity. If this field is not provided, then we assume the AzureManagedIdentity
                            is using the system-assigned identity.
                      required:
                      - access_connector_id
                      description: The Azure managed identity configuration.
                    azure_service_principal:
                      type: object
                      properties:
                        directory_id:
                          type: string
                          description: The directory ID corresponding to the Azure Active Directory (AAD) tenant of the application.
                        application_id:
                          type: string
                          description: The application ID of the application registration within the referenced AAD tenant.
                        client_secret:
                          type: string
                          description: The client secret generated for the above app ID in AAD.
                      required:
                      - directory_id
                      - application_id
                      - client_secret
                      description: The Azure service principal configuration.
                    cloudflare_api_token:
                      type: object
                      properties:
                        access_key_id:
                          type: string
                          description: The access key ID associated with the API token.
                        secret_access_key:
                          type: string
                          description: The secret access token generated for the above access key ID.
                        account_id:
                          type: string
                          description: The ID of the account associated with the API token.
                      required:
                      - access_key_id
                      - secret_access_key
                      description: The Cloudflare API token configuration.
                    comment:
                      type: string
                      description: Comment associated with the credential.
                    databricks_gcp_service_account:
                      type: object
                      properties: {}
                      description: The Databricks managed GCP service account configuration.
                    read_only:
                      type: boolean
                      description: Whether the credential is usable only for read operations. Only applicable when purpose
                        is **STORAGE**.
                  required:
                  - name
                skip_validation:
                  type: boolean
                  description: Optional, default false. Supplying true to this argument skips validation of the created set
                    of credentials.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsCreateStorageCredentialInfo'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountStorageCredentialsAPI
    get:
      operationId: account_storage_credentials_list
      summary: Gets a list of all storage credentials that have been assigned to given metastore.
      tags:
      - catalog
      - account_storage_credentials
      description: |-
