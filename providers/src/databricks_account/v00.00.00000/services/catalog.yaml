        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountMetastoreAssignmentsAPI
    put:
      operationId: account_metastore_assignments_update
      summary: Updates an assignment to a metastore for a workspace. Currently, only the default catalog may be
      tags:
      - catalog
      - account_metastore_assignments
      description: |-
        Updates an assignment to a metastore for a workspace. Currently, only the default catalog may be
        updated.

        :param workspace_id: int
          Workspace ID.
        :param metastore_id: str
          Unity Catalog metastore ID
        :param metastore_assignment: :class:`UpdateMetastoreAssignment` (optional)

        :returns: :class:`AccountsUpdateMetastoreAssignmentResponse`
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: integer
        description: Workspace ID.
      - name: metastore_id
        in: path
        required: true
        schema:
          type: string
        description: Unity Catalog metastore ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metastore_assignment:
                  type: object
                  properties:
                    workspace_id:
                      type: integer
                    default_catalog_name:
                      type: string
                      description: The name of the default catalog in the metastore. This field is deprecated. Please use
                        "Default Namespace API" to configure the default catalog for a Databricks workspace.
                    metastore_id:
                      type: string
                      description: The unique ID of the metastore.
                  required:
                  - workspace_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsUpdateMetastoreAssignmentResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountMetastoreAssignmentsAPI
  /api/2.0/accounts/{account_id}/workspaces/{workspace_id}/metastore:
    get:
      operationId: account_metastore_assignments_get
      summary: Gets the metastore assignment, if any, for the workspace specified by ID. If the workspace is assigned
      tags:
