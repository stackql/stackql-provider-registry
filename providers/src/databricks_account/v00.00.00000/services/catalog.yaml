    AgentService:
      type: object
      properties:
        agent_service_type:
          $ref: '#/components/schemas/AgentServiceAgentServiceType'
          description: Type of agent service. Required on create. Immutable after creation. For future internal / genie /
            app kinds, determines how the backing agent surface is provisioned.
        browse_only:
          type: boolean
          description: Whether the caller sees only metadata available through the BROWSE privilege.
        comment:
          type: string
          description: User-provided description.
        config:
          $ref: '#/components/schemas/AgentServiceConfig'
          description: 'Operational configuration: connection, base_path, system_prompt, model_service, optional inference
            table, optional rate limits. Required on CreateAgentService; on UpdateAgentService it is required only when ``config``
            (or a ``config.*`` subpath) appears in ``update_mask``.'
        create_time:
          type: string
          format: date-time
          description: When the agent service was created.
        created_by:
          type: string
          description: Creator identity.
        effective_owner:
          type: string
          description: The resolved owner of the agent service. Falls back to the caller's identity when ``owner`` is not
            explicitly set on creation.
        etag:
          type: string
          description: Optimistic concurrency control token. Server-generated from the entity's state and returned on every
            read. To use it as an if-match precondition on a mutation, echo the last-read value back via the dedicated ``etag``
            field on the Update / Delete request; the server rejects the mutation if the stored etag differs.
        metastore_id:
          type: string
          description: Metastore hosting the agent service.
        name:
          type: string
          description: 'Resource name of the agent service. Format: ``agent-services/{catalog}.{schema}.{agent_service}``.
            Each ``{...}`` component is capped at 255 characters individually. Server-derived on Create from ``parent`` +
            ``agent_service_id``; required and immutable on Update/Get/Delete.'
        owner:
          type: string
          description: The owner of the agent service. Write-only; read owner via effective_owner.
        update_time:
          type: string
          format: date-time
          description: When the agent service was last modified.
        updated_by:
          type: string
          description: Identity of the last updater.
      description: |-
        An agent service represents a governed registration of an external AI agent (Bedrock Agents,
            Snowflake Cortex Agents, Foundry, etc) in Unity Catalog. It acts as a schema-scoped securable
            that references a UC Connection holding the agent platform's auth + endpoint, and exposes the
            agent for discovery, authorization, and audit logging. Initial kind: AGENT_SERVICE_STANDARD.
            Future kinds (INTERNAL, GENIE, APP) can be added as separate enum values.
    AgentServiceConfig:
      type: object
      properties:
        base_path:
          type: string
          description: 'Vendor base path appended to the connection url at invocation time. Bedrock example: ``/agents/AGENT123/agentAliases/ALIAS1/sessions``.
            Empty when the agent platform does not require a per-agent suffix.'
        inference_table:
          $ref: '#/components/schemas/InferenceTableConfig'
          description: Inference table config for invocation payload logging. Reuses the shared InferenceTableConfig (same
            as ModelServiceConfig.inference_table).
        model_service:
          type: string
          description: 'Resource name of the model service backing this agent. Empty when the agent platform manages its own
            model selection (e.g. Bedrock Agents). Format: ``model-services/{catalog}.{schema}.{model_service}``.'
        rate_limits:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
          description: Per-principal rate limits applied to invocations routed through this agent service. Repeated to support
            per-USER / USER_GROUP / SERVICE_PRINCIPAL / SERVICE / USER_DEFAULT scopes simultaneously, mirroring McpServiceConfig.rate_limits.
            Empty when no rate limit is configured.
        source_connection:
          $ref: '#/components/schemas/AgentServiceConfigSourceConnection'
          description: External agent referenced via a UC Connection.
        system_prompt:
          type: string
          description: System prompt prepended to invocations. Max 8 KB.
      description: |-
        Operational configuration for an agent service. Groups the source connection, base path, system
            prompt, model service reference, optional inference table, and optional rate limits. The
            ``source_connection.name`` is supplied on create.
    AgentServiceConfigSourceConnection:
