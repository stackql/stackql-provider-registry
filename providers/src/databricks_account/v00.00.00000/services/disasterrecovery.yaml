components:
  schemas:
    AssetReplicationConfig:
      type: object
      properties:
        enable_jobs:
          type: boolean
          description: Whether to replicate jobs.
        enable_clusters:
          type: boolean
          description: >-
            Whether to replicate clusters (including cluster policies, instance
            profiles, global init scripts, and worker environment overlays).
        enable_warehouse:
          type: boolean
          description: Whether to replicate SQL warehouses.
        enable_sql_workspace:
          type: boolean
          description: Whether to replicate the SQL workspace.
        enable_libraries:
          type: boolean
          description: Whether to replicate libraries.
        enable_notebooks:
          type: boolean
          description: Whether to replicate notebooks.
        enable_files:
          type: boolean
          description: Whether to replicate workspace files.
        enable_queries:
          type: boolean
          description: Whether to replicate SQL queries.
        enable_dashboards:
          type: boolean
          description: Whether to replicate dashboards.
      required:
        - enable_jobs
        - enable_clusters
        - enable_warehouse
        - enable_sql_workspace
        - enable_libraries
        - enable_notebooks
        - enable_files
        - enable_queries
        - enable_dashboards
      description: >-
        Per-asset-type control over which workspace assets are replicated for a
        workspace set. Applies
            only when replicate_workspace_assets is true. Each toggle enables replication of one asset type
            (or, for the workspace tree, one sub-type). Folders and permissions are always replicated for a
            coherent recovery copy and therefore have no toggle.

            This message is all-or-nothing: if it is provided, every toggle must be set (a partial config is
            rejected). Omitting the containing asset_replication_config field entirely selects the default
            of replicating every asset type; sending the message means the caller opts into explicit
            per-type control and must therefore state each type.
    FailoverGroup:
      type: object
      properties:
        regions:
          type: array
          items:
            type: string
          description: List of all regions participating in this failover group.
        workspace_sets:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSet'
          description: >-
            Workspace sets, each containing workspaces that replicate to each
            other.
        initial_primary_region:
          type: string
          description: >-
            Initial primary region. Used only in Create requests to set the
            starting primary region. Not returned in responses.
        create_time:
          type: string
          format: date-time
          description: Time at which this failover group was created.
        effective_primary_region:
          type: string
          description: >-
            Current effective primary region. Replication flows FROM workspaces
            in this region. Changes after a successful failover.
        etag:
          type: string
          description: >-
            Opaque version string for optimistic locking. Server-generated and
            returned in responses.
        name:
          type: string
          description: >-
            Fully qualified resource name in the format
            accounts/{account_id}/failover-groups/{failover_group_id}.
        replication_point:
          type: string
          format: date-time
          description: The latest point in time to which data has been replicated.
        state:
          $ref: '#/components/schemas/FailoverGroupState'
          description: Aggregate state of the failover group.
        unity_catalog_assets:
          $ref: '#/components/schemas/UcReplicationConfig'
          description: Unity Catalog replication configuration.
        update_time:
          type: string
          format: date-time
          description: Time at which this failover group was last modified.
      required:
        - regions
        - workspace_sets
        - initial_primary_region
      description: >-
        A failover group manages disaster recovery across workspace sets,
        coordinating Unity Catalog and
            workspace assets replication.
    ListFailoverGroupsResponse:
      type: object
      properties:
        failover_groups:
          type: array
          items:
            $ref: '#/components/schemas/FailoverGroup'
          description: The failover groups for this account.
        next_page_token:
          type: string
          description: >-
            A token that can be sent as page_token to retrieve the next page. If
            omitted, there are no subsequent pages.
      description: Response for listing failover groups.
    ListStableUrlsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token that can be sent as page_token to retrieve the next page. If
            omitted, there are no subsequent pages.
        stable_urls:
          type: array
          items:
            $ref: '#/components/schemas/StableUrl'
          description: The stable URLs for this account.
      description: Response for listing stable URLs.
    LocationMapping:
      type: object
      properties:
        name:
          type: string
          description: Resource name for this location.
        uri_by_region:
          type: array
          items:
            $ref: '#/components/schemas/LocationMappingEntry'
          description: URI for each region. Each entry maps a region name to a storage URI.
      required:
        - name
        - uri_by_region
      description: >-
        A location mapping identified by a name, with URIs per region. The
        system derives replication
            direction from effective_primary_region.
    LocationMappingEntry:
      type: object
      properties:
        region:
          type: string
          description: The region name.
        uri:
          type: string
          description: The storage URI for this region.
      required:
        - region
        - uri
      description: >-
        A single entry in a location mapping, mapping a region to a storage URI.
        Used instead of
            map<string, string> for proto2 compatibility.
    StableUrl:
      type: object
      properties:
        initial_workspace_id:
          type: string
          description: >-
            The workspace this stable URL is initially bound to. Used only in
            Create requests to associate the stable URL with a workspace. Not
            returned in responses.
        effective_workspace_id:
          type: string
          description: >-
            The workspace this stable URL currently routes to. Set to
            ``initial_workspace_id`` at creation, advanced to the failover
            group's primary while attached (including across a failover), and
            preserved when the stable URL is detached from its failover group.
            Read this to see where an unattached stable URL points: after a
            failover followed by a detach it reflects the post-failover primary,
            not ``initial_workspace_id``.
        failover_group_name:
          type: string
          description: >-
            Fully qualified resource name of the FailoverGroup this stable URL
            is currently linked to, in the format
            ``accounts/{account_id}/failover-groups/{failover_group_id}``. Empty
            when the stable URL is not attached to any failover group.
        name:
          type: string
          description: >-
            Fully qualified resource name. Format:
            accounts/{account_id}/stable-urls/{stable_url_id}.
        stable_workspace_id:
          type: string
          description: >-
            The stable workspace ID for this stable URL. Generated on creation
            and immutable thereafter; identifies the URL across failovers and is
            the same value embedded in the ``url`` (as the ``w=`` query
            parameter for SPOG URLs, or in the ``conn-<id>`` hostname for
            Private-Link URLs).
        url:
          type: string
          description: >-
            The stable URL endpoint. Generated on creation and immutable
            thereafter. For non-Private-Link workspaces this is
            ``https://<spog_host>/?w=<connection_id>``. For Private-Link
            workspaces this is the per-connection hostname.
      required:
        - initial_workspace_id
      description: >-
        A stable URL provides a failover-aware endpoint for accessing a
        workspace. Its lifecycle is
            independent of any failover group.
    UcCatalog:
      type: object
      properties:
        name:
          type: string
          description: The name of the UC catalog to replicate.
      required:
        - name
      description: A Unity Catalog catalog to replicate.
    UcReplicationConfig:
      type: object
      properties:
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/UcCatalog'
          description: UC catalogs to replicate.
        data_replication_workspace_set:
          type: string
          description: >-
            The workspace set whose workspaces will be used for data replication
            of all UC catalogs' underlying storage.
        location_mappings:
          type: array
          items:
            $ref: '#/components/schemas/LocationMapping'
          description: Location mappings - storage URI per region for each location.
      required:
        - catalogs
        - data_replication_workspace_set
      description: Unity Catalog replication configuration (top-level, not per-set).
    WorkspaceSet:
      type: object
      properties:
        name:
          type: string
          description: Resource name for this workspace set.
        workspace_ids:
          type: array
          items:
            type: string
          description: >-
            Workspace IDs in this set. The system derives and validates regions.
            All workspaces must be in the Mission Critical tier.
        asset_replication_config:
          $ref: '#/components/schemas/AssetReplicationConfig'
          description: >-
            Per-asset-type control over which workspace assets are replicated.
            Applies only when replicate_workspace_assets is true. When omitted
            while control plane DR is enabled, every asset type is replicated.
        replicate_workspace_assets:
          type: boolean
          description: >-
            Whether to enable control plane DR (notebooks, jobs, clusters, etc.)
            for this set. Defaults to false.
        stable_url_names:
          type: array
          items:
            type: string
          description: >-
            Resource names of stable URLs associated with this workspace set.
            Format: accounts/{account_id}/stable-urls/{stable_url_id}. The
            referenced stable URLs must already exist (via CreateStableUrl).
      required:
        - name
        - workspace_ids
      description: A set of workspaces that replicate to each other across regions.
    FailoverFailoverGroupRequestFailoverType:
      type: string
      x-enum:
        - FORCED
      description: The type of failover to perform.
    FailoverGroupState:
      type: string
      x-enum:
        - ACTIVE
        - CREATING
        - CREATION_FAILED
        - DELETING
        - DELETION_FAILED
        - FAILING_OVER
        - FAILOVER_FAILED
        - INITIAL_REPLICATION
      description: The aggregate state of a FailoverGroup.
