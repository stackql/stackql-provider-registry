    get:
      operationId: disaster_recovery_list_failover_groups
      summary: List failover groups.
      tags:
        - disasterrecovery
        - disaster_recovery
      description: >-
        List failover groups.


        List entries are abbreviated: ``state`` and ``replication_point`` are
        not populated. Call

        GetFailoverGroup to retrieve the full resource.


        :param parent: str
          The parent resource. Format: accounts/{account_id}.
        :param page_size: int (optional)
          Maximum number of failover groups to return per page:

          - when set to a value greater than 0, the page length is the minimum of this value and a server
            configured value;
          - when set to 0 or unset, the page length is set to a server configured value (recommended);
          - when set to a value less than 0, an invalid parameter error is returned.
        :param page_token: str (optional)
          Page token received from a previous ListFailoverGroups call. Provide this to retrieve the subsequent
          page.

        :returns: Iterator over :class:`FailoverGroup`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: 'The parent resource. Format: accounts/{account_id}.'
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Maximum number of failover groups to return per page: - when set to
            a value greater than 0, the page length is the minimum of this value
            and a server configured value; - when set to 0 or unset, the page
            length is set to a server configured value (recommended); - when set
            to a value less than 0, an invalid parameter error is returned.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            Page token received from a previous ListFailoverGroups call. Provide
            this to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFailoverGroupsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
