        :param parent: str
          The parent resource. Format: accounts/{account_id}.
        :param stable_url: :class:`StableUrl`
          The stable URL to create.
        :param stable_url_id: str
          Client-provided identifier for the stable URL. Used to construct the resource name as
          {parent}/stable-urls/{stable_url_id}.
        :param validate_only: bool (optional)
          When true, validates the request without creating the stable URL.

        :returns: :class:`StableUrl`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: 'The parent resource. Format: accounts/{account_id}.'
        - name: stable_url_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            Client-provided identifier for the stable URL. Used to construct the
            resource name as {parent}/stable-urls/{stable_url_id}.
        - name: validate_only
          in: query
          required: false
          schema:
            type: boolean
          description: When true, validates the request without creating the stable URL.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stable_url:
                  type: object
                  properties:
                    initial_workspace_id:
                      type: string
                      description: >-
                        The workspace this stable URL is initially bound to.
                        Used only in Create requests to associate the stable URL
                        with a workspace. Not returned in responses.
                    effective_workspace_id:
                      type: string
                      description: >-
                        The workspace this stable URL currently routes to. Set
                        to ``initial_workspace_id`` at creation, advanced to the
                        failover group's primary while attached (including
                        across a failover), and preserved when the stable URL is
                        detached from its failover group. Read this to see where
                        an unattached stable URL points: after a failover
                        followed by a detach it reflects the post-failover
                        primary, not ``initial_workspace_id``.
                    failover_group_name:
                      type: string
                      description: >-
                        Fully qualified resource name of the FailoverGroup this
                        stable URL is currently linked to, in the format
                        ``accounts/{account_id}/failover-groups/{failover_group_id}``.
                        Empty when the stable URL is not attached to any
                        failover group.
                    name:
                      type: string
                      description: >-
                        Fully qualified resource name. Format:
                        accounts/{account_id}/stable-urls/{stable_url_id}.
                    stable_workspace_id:
                      type: string
                      description: >-
                        The stable workspace ID for this stable URL. Generated
                        on creation and immutable thereafter; identifies the URL
                        across failovers and is the same value embedded in the
                        ``url`` (as the ``w=`` query parameter for SPOG URLs, or
                        in the ``conn-<id>`` hostname for Private-Link URLs).
                    url:
                      type: string
                      description: >-
                        The stable URL endpoint. Generated on creation and
                        immutable thereafter. For non-Private-Link workspaces
                        this is ``https://<spog_host>/?w=<connection_id>``. For
                        Private-Link workspaces this is the per-connection
                        hostname.
                  required:
                    - initial_workspace_id
                  description: The stable URL to create.
              required:
                - stable_url
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableUrl'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: DisasterRecoveryAPI
