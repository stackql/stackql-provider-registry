openapi: 3.0.0
info:
  title: Databricks Disasterrecovery API (account)
  description: >-
    OpenAPI specification for the Databricks disasterrecovery service
    (account-level APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-07-31'
  x-stackql-sdk-namespace: databricks.sdk.service.disasterrecovery
servers:
  - url: https://accounts.cloud.databricks.com
paths:
  /api/disaster-recovery/v1/{parent}/failover-groups:
    post:
      operationId: disaster_recovery_create_failover_group
      summary: Create a new failover group.
      tags:
        - disasterrecovery
        - disaster_recovery
      description: |-
        Create a new failover group.

        :param parent: str
          The parent resource. Format: accounts/{account_id}.
        :param failover_group: :class:`FailoverGroup`
          The failover group to create.
        :param failover_group_id: str
          Client-provided identifier for the failover group. Used to construct the resource name as
          {parent}/failover-groups/{failover_group_id}.
        :param validate_only: bool (optional)
          When true, validates the request without creating the failover group.

        :returns: :class:`FailoverGroup`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: 'The parent resource. Format: accounts/{account_id}.'
        - name: failover_group_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            Client-provided identifier for the failover group. Used to construct
            the resource name as {parent}/failover-groups/{failover_group_id}.
        - name: validate_only
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            When true, validates the request without creating the failover
            group.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                failover_group:
                  type: object
                  properties:
                    regions:
                      type: array
                      items:
                        type: string
                      description: >-
                        List of all regions participating in this failover
                        group.
                    workspace_sets:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Resource name for this workspace set.
                          workspace_ids:
                            type: array
                            items:
                              type: string
                            description: >-
                              Workspace IDs in this set. The system derives and
                              validates regions. All workspaces must be in the
                              Mission Critical tier.
                          asset_replication_config:
                            type: object
                            properties:
                              enable_jobs:
                                type: boolean
                                description: Whether to replicate jobs.
                              enable_clusters:
                                type: boolean
                                description: >-
                                  Whether to replicate clusters (including
                                  cluster policies, instance profiles, global
                                  init scripts, and worker environment
                                  overlays).
                              enable_warehouse:
                                type: boolean
                                description: Whether to replicate SQL warehouses.
                              enable_sql_workspace:
                                type: boolean
                                description: Whether to replicate the SQL workspace.
                              enable_libraries:
                                type: boolean
                                description: Whether to replicate libraries.
                              enable_notebooks:
                                type: boolean
                                description: Whether to replicate notebooks.
                              enable_files:
                                type: boolean
                                description: Whether to replicate workspace files.
                              enable_queries:
                                type: boolean
                                description: Whether to replicate SQL queries.
                              enable_dashboards:
                                type: boolean
                                description: Whether to replicate dashboards.
                            required:
                              - enable_jobs
                              - enable_clusters
                              - enable_warehouse
                              - enable_sql_workspace
                              - enable_libraries
                              - enable_notebooks
                              - enable_files
                              - enable_queries
                              - enable_dashboards
                            description: >-
                              Per-asset-type control over which workspace assets
                              are replicated. Applies only when
                              replicate_workspace_assets is true. When omitted
                              while control plane DR is enabled, every asset
                              type is replicated.
                          replicate_workspace_assets:
                            type: boolean
                            description: >-
                              Whether to enable control plane DR (notebooks,
                              jobs, clusters, etc.) for this set. Defaults to
                              false.
                          stable_url_names:
                            type: array
                            items:
                              type: string
                            description: >-
                              Resource names of stable URLs associated with this
                              workspace set. Format:
                              accounts/{account_id}/stable-urls/{stable_url_id}.
                              The referenced stable URLs must already exist (via
                              CreateStableUrl).
                        required:
                          - name
                          - workspace_ids
                        description: >-
                          A set of workspaces that replicate to each other
                          across regions.
                      description: >-
                        Workspace sets, each containing workspaces that
                        replicate to each other.
                    initial_primary_region:
                      type: string
                      description: >-
                        Initial primary region. Used only in Create requests to
                        set the starting primary region. Not returned in
                        responses.
                    create_time:
                      type: string
                      format: date-time
                      description: Time at which this failover group was created.
                    effective_primary_region:
                      type: string
                      description: >-
                        Current effective primary region. Replication flows FROM
                        workspaces in this region. Changes after a successful
                        failover.
                    etag:
                      type: string
                      description: >-
                        Opaque version string for optimistic locking.
                        Server-generated and returned in responses.
                    name:
                      type: string
                      description: >-
                        Fully qualified resource name in the format
                        accounts/{account_id}/failover-groups/{failover_group_id}.
                    replication_point:
                      type: string
                      format: date-time
                      description: >-
                        The latest point in time to which data has been
                        replicated.
                    state:
                      type: string
                      x-enum:
                        - ACTIVE
                        - CREATING
                        - CREATION_FAILED
                        - DELETING
                        - DELETION_FAILED
                        - FAILING_OVER
                        - FAILOVER_FAILED
                        - INITIAL_REPLICATION
                      description: Aggregate state of the failover group.
                    unity_catalog_assets:
                      type: object
                      properties:
                        catalogs:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: The name of the UC catalog to replicate.
                            required:
                              - name
                            description: A Unity Catalog catalog to replicate.
                          description: UC catalogs to replicate.
                        data_replication_workspace_set:
                          type: string
                          description: >-
                            The workspace set whose workspaces will be used for
                            data replication of all UC catalogs' underlying
                            storage.
                        location_mappings:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Resource name for this location.
                              uri_by_region:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    region:
                                      type: string
                                      description: The region name.
                                    uri:
                                      type: string
                                      description: The storage URI for this region.
                                  required:
                                    - region
                                    - uri
                                  description: >-
                                    A single entry in a location mapping,
                                    mapping a region to a storage URI. Used
                                    instead of
                                        map<string, string> for proto2 compatibility.
                                description: >-
                                  URI for each region. Each entry maps a region
                                  name to a storage URI.
                            required:
                              - name
                              - uri_by_region
                            description: >-
                              A location mapping identified by a name, with URIs
                              per region. The system derives replication
                                  direction from effective_primary_region.
                          description: >-
                            Location mappings - storage URI per region for each
                            location.
                      required:
                        - catalogs
                        - data_replication_workspace_set
                      description: Unity Catalog replication configuration.
                    update_time:
                      type: string
                      format: date-time
                      description: Time at which this failover group was last modified.
                  required:
                    - regions
                    - workspace_sets
                    - initial_primary_region
                  description: The failover group to create.
              required:
                - failover_group
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailoverGroup'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
