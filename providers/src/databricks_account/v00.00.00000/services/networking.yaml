openapi: 3.0.0
info:
  title: Databricks Networking API (account)
  description: >-
    OpenAPI specification for the Databricks networking service (account-level
    APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.networking
servers:
  - url: https://{account_host}
    variables:
      account_host:
        description: >-
          The Databricks account console host. Selected by DATABRICKS_CLOUD
          (aws, azure or gcp; default aws), or set explicitly with
          DATABRICKS_ACCOUNT_HOST (bare host, no scheme).
        default: accounts.cloud.databricks.com
        x-stackQL-envVar: DATABRICKS_ACCOUNT_HOST
        x-stackQL-envVarSelector:
          envVar: DATABRICKS_CLOUD
          default: aws
          values:
            aws: accounts.cloud.databricks.com
            azure: accounts.azuredatabricks.net
            gcp: accounts.gcp.databricks.com
paths:
  /api/networking/v1/accounts/{account_id}/endpoints:
    post:
      operationId: endpoints_create_endpoint
      summary: >-
        Creates a new network connectivity endpoint that enables private
        connectivity between your network
      tags:
        - networking
        - endpoints
      description: >-
        Creates a new network connectivity endpoint that enables private
        connectivity between your network

        resources and Databricks services.


        After creation, the endpoint is initially in the PENDING state. The
        Databricks endpoint service

        automatically reviews and approves the endpoint within a few minutes.
        Use the GET method to retrieve

        the latest endpoint state.


        An endpoint can be used only after it reaches the APPROVED state.


        :param parent: str
          The parent resource name of the account under which the endpoint is created. Format:
          ``accounts/{account_id}``.
        :param endpoint: :class:`Endpoint`


        :returns: :class:`Endpoint`
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `account_id` segment of the `parent` resource name
            (`accounts/{account_id}`). The parent resource name of the account
            under which the endpoint is created. Format:
            ``accounts/{account_id}``.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: >-
                    The human-readable display name of this endpoint. The input
                    should conform to RFC-1034, which restricts to letters,
                    numbers, and hyphens, with the first character a letter, the
                    last a letter or a number, and a 63 character maximum.
                region:
                  type: string
                  description: The cloud provider region where this endpoint is located.
                account_id:
                  type: string
                  description: The Databricks Account in which the endpoint object exists.
                aws_vpc_endpoint_info:
                  type: object
                  properties:
                    aws_vpc_endpoint_id:
                      type: string
                    aws_account_id:
                      type: string
                      description: The AWS account ID in which this VPC endpoint lives.
                    aws_endpoint_service_id:
                      type: string
                      description: >-
                        The ID of the Databricks VPC endpoint service that this
                        endpoint connects to.
                  required:
                    - aws_vpc_endpoint_id
                  description: Info for an AWS VPC endpoint.
                azure_private_endpoint_info:
                  type: object
                  properties:
                    private_endpoint_name:
                      type: string
                    private_endpoint_resource_guid:
                      type: string
                      description: >-
                        The GUID of the Private Endpoint resource in the Azure
                        subscription. This is assigned by Azure when the user
                        sets up the Private Endpoint.
                    private_endpoint_resource_id:
                      type: string
                      description: The full resource ID of the Private Endpoint.
                    private_link_service_id:
                      type: string
                      description: >-
                        The resource ID of the Databricks Private Link Service
                        that this Private Endpoint connects to.
                  required:
                    - private_endpoint_name
                    - private_endpoint_resource_guid
                  description: Info for an Azure private endpoint.
                create_time:
                  type: string
                  format: date-time
                  description: >-
                    The timestamp when the endpoint was created. The timestamp
                    is in RFC 3339 format in UTC timezone.
                endpoint_id:
                  type: string
                  description: >-
                    The unique identifier for this endpoint under the account.
                    This field is a UUID generated by Databricks.
                gcp_psc_endpoint_info:
                  type: object
                  properties:
                    project_id:
                      type: string
                    psc_endpoint:
                      type: string
                      description: >-
                        The name of this PSC connection in the GCP consumer
                        project. Provided by the customer when registering an
                        existing PSC endpoint.
                    endpoint_region:
                      type: string
                      description: >-
                        The GCP region of the PSC connection endpoint. Provided
                        by the customer when registering an existing PSC
                        endpoint. GCP supports only same-region PSC, so this
                        must match the workspace region.
                    psc_connection_id:
                      type: string
                      description: >-
                        The ID of the underlying Private Service Connect
                        connection in the GCP consumer project, assigned by GCP
                        when the PSC connection is created.
                    service_attachment_id:
                      type: string
                      description: >-
                        The ID of the Databricks service attachment this PSC
                        endpoint connects to.
                  required:
                    - project_id
                    - psc_endpoint
                    - endpoint_region
                  description: Info for a GCP Private Service Connect endpoint.
                name:
                  type: string
                  description: >-
                    The resource name of the endpoint, which uniquely identifies
                    the endpoint.
                state:
                  type: string
                  x-enum:
                    - APPROVED
                    - DISCONNECTED
                    - FAILED
                    - PENDING
                  description: >-
                    The state of the endpoint. The endpoint can only be used if
                    the state is ``APPROVED``.
                use_case:
                  type: string
                  x-enum:
                    - SERVICE_DIRECT
                  description: >-
                    The use case that determines the type of network
                    connectivity this endpoint provides. This field is
                    automatically determined based on the endpoint configuration
                    and cloud-specific settings.
              required:
                - display_name
                - region
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
