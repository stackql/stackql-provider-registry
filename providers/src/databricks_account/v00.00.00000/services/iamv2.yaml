  /api/2.0/identity/accounts/{account_id}/users:
    post:
      operationId: account_iam_v2_create_user
      summary: >-
        Creates a local user in the Databricks account and returns the created
        user. A local user is one that
      tags:
        - iamv2
        - account_iam_v2
      description: >-
