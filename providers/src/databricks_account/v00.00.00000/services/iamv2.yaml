components:
  schemas:
    DirectGroupMember:
      type: object
      properties:
        principal_id:
          type: integer
          description: Internal ID of the principal in Databricks.
        display_name:
          type: string
          description: Display name of the principal.
        external_id:
          type: string
          description: The external ID of the principal in the customer's IdP.
        group_id:
          type: integer
          description: The internal ID of the group this member belongs to.
        membership_source:
          $ref: '#/components/schemas/GroupMembershipSource'
          description: The source of group membership (internal or from identity provider).
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
          description: The type of the principal (user/service principal/group).
      required:
        - principal_id
      description: >-
        Represents a principal that is a direct member of a group, with its
        source of membership.
    ExactMatchRule:
      type: object
      properties:
        external_id:
          type: string
          description: >-
            The identity provider's external ID for the group to match. This is
            not the Databricks group ID. The value must be non-empty and is
            matched exactly, including case.
      required:
        - external_id
      description: >-
        An exact-match rule that matches a group's external ID from the identity
        provider.
    ExternalGroup:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
        display_name:
          type: string
          description: Display name of the group from the customer's IdP.
        external_group_id:
          type: string
          description: The external ID of the group in the customer's IdP.
        internal_id:
          type: string
          description: Internal groupId of the group in Databricks.
        name:
          type: string
          description: >-
            The resource name of the external group. The format depends on the
            API that returned it: - Account-scoped:
            accounts/{account_id}/external-groups/{external_group_id} -
            Workspace-scoped: external-groups/{external_group_id}
      description: >-
        An external group from the customer's Identity Provider, resolved into
        Databricks. This is a
            read-only resource keyed by the IdP external ID. The Get method may trigger an idempotent sync
            from the customer's IdP to provision or refresh the group's data in Databricks.
    ExternalServicePrincipal:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
        account_sp_status:
          $ref: '#/components/schemas/State'
          description: >-
            The activity status of the service principal in the Databricks
            account.
        application_id:
          type: string
          description: Application ID of the service principal, from the customer's IdP.
        display_name:
          type: string
          description: Display name of the service principal, from the customer's IdP.
        external_service_principal_id:
          type: string
          description: The external ID of the service principal in the customer's IdP.
        internal_id:
          type: string
          description: Internal servicePrincipalId of the service principal in Databricks.
        name:
          type: string
          description: >-
            The resource name of the external service principal. The format
            depends on the API that returned it: - Account-scoped:
            accounts/{account_id}/external-service-principals/{external_service_principal_id}
            - Workspace-scoped:
            external-service-principals/{external_service_principal_id}
      description: >-
        An external service principal from the customer's Identity Provider,
        resolved into Databricks.
            This is a read-only resource keyed by the IdP external ID. The Get method may trigger an
            idempotent sync from the customer's IdP to provision or refresh the service principal's data in
            Databricks.
    ExternalUser:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
        account_user_status:
          $ref: '#/components/schemas/State'
          description: The activity status of the user in the Databricks account.
        display_name:
          type: string
          description: Display name of the user from the customer's IdP.
        external_user_id:
          type: string
          description: The external ID of the user in the customer's IdP.
        full_name:
          $ref: '#/components/schemas/FullName'
          description: The full name of the user, from the customer's IdP.
        internal_id:
          type: string
          description: Internal userId of the user in Databricks.
        name:
          type: string
          description: >-
            The resource name of the external user. The format depends on the
            API that returned it: - Account-scoped:
            accounts/{account_id}/external-users/{external_user_id} -
            Workspace-scoped: external-users/{external_user_id}
        username:
          type: string
          description: Username/email of the user, from Databricks.
      description: >-
        An external user from the customer's Identity Provider, resolved into
        Databricks. This is a
            read-only resource that allows customers to look up external user identities by their IdP
            external ID and retrieve the corresponding Databricks internal ID and metadata. The Get method
            may trigger an idempotent sync from the customer's IdP to provision or refresh the user's data
            in Databricks.
    FullName:
      type: object
      properties:
        family_name:
          type: string
          description: The family (last) name of the user, from the customer's IdP.
        given_name:
          type: string
          description: The given (first) name of the user, from the customer's IdP.
      description: The full name of a user.
    Group:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID for group in Databricks.
        external_id:
          type: string
          description: ExternalId of the group in the customer's IdP.
        group_id:
          type: string
          description: Internal group ID of the group in Databricks.
        group_name:
          type: string
          description: Display name of the group.
      description: The details of a Group resource.
    IdentityVisibilityFilter:
      type: object
      properties:
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
          description: >-
            The type of principal this rule applies to. Set to ``GROUP`` when
            creating a filter. Other principal types are not supported for
            creation.
        exact:
          $ref: '#/components/schemas/ExactMatchRule'
          description: Exact match on the group's external ID from the identity provider.
        name:
          type: string
          description: >-
            The resource name of the identity-visibility filter. Format:
            accounts/{account_id}/identity-visibility-filters/{identity_visibility_filter_id}
        prefix:
          $ref: '#/components/schemas/PrefixMatchRule'
          description: Case-sensitive starts-with match on the group's display name.
        regex:
          $ref: '#/components/schemas/RegexMatchRule'
          description: Full, case-sensitive RE2 match on the identity's display name.
      required:
        - principal_type
      description: >-
        An account-level rule that controls which identity provider groups are
        discoverable in directory
            search and group pickers when automatic identity management is enabled. Filters apply across all
            workspaces in the account.

            If no group filters are configured, all groups are visible. Otherwise, a group is visible if it
            or any of its transitive parent groups matches at least one rule. A group is also visible if it
            or any transitive parent group is already provisioned in the account. Local Databricks groups
            remain visible regardless of the filters.

            Only group filters can be created. Filters do not change provisioning or sign-in for users and
            service principals. Filters are immutable: to change a rule, delete it and create a new one.
    ListDirectGroupMembersResponse:
      type: object
      properties:
        direct_group_members:
          type: array
          items:
            $ref: '#/components/schemas/DirectGroupMember'
          description: The list of direct group members with their membership source type.
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
      description: Response message for listing direct group members.
    ListGroupsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
      description: Response message containing a page of groups in the account.
    ListIdentityVisibilityFiltersResponse:
      type: object
      properties:
        identity_visibility_filters:
          type: array
          items:
            $ref: '#/components/schemas/IdentityVisibilityFilter'
          description: >-
            The filters in this page. These are filter rules, not the groups
            matched by the rules.
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If omitted, there are no subsequent pages.
      description: >-
        Response message containing a page of identity-visibility filters in the
        account.
    ListServicePrincipalsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
        service_principals:
          type: array
          items:
            $ref: '#/components/schemas/ServicePrincipal'
      description: Response message containing a page of service principals in the account.
    ListTransitiveParentGroupsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
        transitive_parent_groups:
          type: array
          items:
            $ref: '#/components/schemas/TransitiveParentGroup'
          description: The list of transitive parent groups.
      description: >-
        Response message for listing all transitive parent groups of a
        principal.
    ListUsersResponse:
      type: object
      properties:
        next_page_token:
          type: string
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    ListWorkspaceAssignmentDetailsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
        workspace_assignment_details:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceAssignmentDetail'
      description: Response message for listing workspace assignment details.
    ListWorkspaceAssignmentsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
        workspace_assignments:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceAssignment'
      description: Response message for listing workspace assignments.
    PrefixMatchRule:
      type: object
      properties:
        display_name_prefix:
          type: string
          description: >-
            The display-name prefix to match. Must contain at least one
            non-whitespace character. Leading and trailing whitespace are
            preserved, and matching is case-sensitive.
      required:
        - display_name_prefix
      description: >-
        A starts-with rule that matches groups whose display name begins with a
        specified prefix.
            Matching is case-sensitive. For example, the prefix ``data-`` matches ``data-platform``.
    RegexMatchRule:
      type: object
      properties:
        display_name_regex:
          type: string
          description: >-
            The RE2 regular expression matched against the complete display
            name.
      required:
        - display_name_regex
      description: >-
        A rule that matches an identity whose complete display name matches an
        RE2 regular expression.
            Matching is case-sensitive. Use .* explicitly when substring matching is desired.
    ResolveGroupResponse:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/Group'
    ResolveServicePrincipalResponse:
      type: object
      properties:
        service_principal:
          $ref: '#/components/schemas/ServicePrincipal'
    ResolveUserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
    ServicePrincipal:
      type: object
      properties:
        display_name:
          type: string
          description: Display name of the service principal.
        account_sp_status:
          $ref: '#/components/schemas/State'
          description: The activity status of a service principal in a Databricks account.
        account_id:
          type: string
          description: The parent account ID for the service principal in Databricks.
        application_id:
          type: string
          description: >-
            Application ID of the service principal. Set at creation time and
