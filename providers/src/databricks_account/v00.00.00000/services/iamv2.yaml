  /api/2.0/identity/accounts/{account_id}/workspaces/{workspace_id}/workspace-assignment-details:
    post:
      operationId: account_iam_v2_create_workspace_assignment_detail
      summary: >-
        Creates a workspace assignment detail for a principal. Entitlement
        grants are applied individually and
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Creates a workspace assignment detail for a principal. Entitlement
        grants are applied individually and

        non-atomically — if a failure occurs partway through, the principal will
        be assigned to the

        workspace but with only a subset of the requested entitlements. Use
        GetWorkspaceAssignmentDetail to

        confirm which entitlements were successfully granted.


