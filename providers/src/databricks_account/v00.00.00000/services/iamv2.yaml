            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional. Allows filtering service principals by application id or
            external id.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of service principals to return. The service may
