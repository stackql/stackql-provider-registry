openapi: 3.0.0
info:
  title: Databricks Iamv2 API (account)
  description: >-
    OpenAPI specification for the Databricks iamv2 service (account-level APIs),
    generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.iamv2
servers:
  - url: https://{account_host}
    variables:
      account_host:
        description: >-
          The Databricks account console host. Selected by DATABRICKS_CLOUD
          (aws, azure or gcp; default aws), or set explicitly with
          DATABRICKS_ACCOUNT_HOST (bare host, no scheme).
        default: accounts.cloud.databricks.com
        x-stackQL-envVar: DATABRICKS_ACCOUNT_HOST
        x-stackQL-envVarSelector:
          envVar: DATABRICKS_CLOUD
          default: aws
          values:
            aws: accounts.cloud.databricks.com
            azure: accounts.azuredatabricks.net
            gcp: accounts.gcp.databricks.com
paths:
  /api/2.0/identity/accounts/{account_id}/groups/{group_id}/direct-members:
    post:
      operationId: account_iam_v2_create_direct_group_member
      summary: Creates a group membership (assigns a principal to a group).
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Creates a group membership (assigns a principal to a group).


        Authorization: the caller must be an account admin or a manager of the
        group (holds the

        ``roles/group.manager`` role on it).


        :param group_id: int
          Required. Internal ID of the group in Databricks.
        :param direct_group_member: :class:`DirectGroupMember`
          Required. The direct group member to be added to the group.

        :returns: :class:`DirectGroupMember`
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
          description: Required. Internal ID of the group in Databricks.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                principal_id:
                  type: integer
                  description: Internal ID of the principal in Databricks.
                display_name:
                  type: string
                  description: Display name of the principal.
                external_id:
                  type: string
                  description: The external ID of the principal in the customer's IdP.
                group_id:
                  type: integer
                  description: The internal ID of the group this member belongs to.
                membership_source:
                  type: string
                  x-enum:
                    - IDENTITY_PROVIDER
                    - INTERNAL
                  description: >-
                    The source of group membership (internal or from identity
                    provider).
                principal_type:
                  type: string
                  x-enum:
                    - GROUP
                    - SERVICE_PRINCIPAL
                    - USER
                  description: The type of the principal (user/service principal/group).
              required:
                - principal_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectGroupMember'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
    get:
      operationId: account_iam_v2_list_direct_group_members
      summary: >-
        Lists provisioned direct members of a group with their membership source
        (internal or from identity
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Lists provisioned direct members of a group with their membership source
        (internal or from identity

        provider).


        :param group_id: int
          Required. Internal ID of the group in Databricks whose direct members are being listed.
        :param page_size: int (optional)
          The maximum number of members to return. The service may return fewer than this value. If not
          provided, defaults to 1000, which is also the maximum allowed. Requests for more than the maximum
          are clamped to 1000.
        :param page_token: str (optional)
          A page token, received from a previous ListDirectGroupMembers call. Provide this to retrieve the
          subsequent page.

        :returns: Iterator over :class:`DirectGroupMember`
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
          description: >-
            Required. Internal ID of the group in Databricks whose direct
            members are being listed.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of members to return. The service may return
            fewer than this value. If not provided, defaults to 1000, which is
            also the maximum allowed. Requests for more than the maximum are
            clamped to 1000.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ListDirectGroupMembers call.
            Provide this to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDirectGroupMembersResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
  /api/2.0/identity/accounts/{account_id}/groups:
    post:
      operationId: account_iam_v2_create_group
      summary: >-
        Creates a local group in the Databricks account and returns the created
        group. A local group is one
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Creates a local group in the Databricks account and returns the created
        group. A local group is one

        that is not synced from the customer's identity provider, and can be
        created whether or not Account

        Identity Management (AIM) is enabled.


        When AIM is enabled, supplying an external ID returns an error. To
        provision the identity from your

        identity provider, resolve it by its external ID with ResolveGroup; to
        read an existing external

        identity, use the ExternalGroup resource.


        :param group: :class:`Group`
          Required. Group to be created in Databricks

        :returns: :class:`Group`
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  description: The parent account ID for group in Databricks.
                external_id:
                  type: string
                  description: ExternalId of the group in the customer's IdP.
                group_id:
                  type: string
                  description: Internal group ID of the group in Databricks.
                group_name:
                  type: string
                  description: Display name of the group.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
    get:
      operationId: account_iam_v2_list_groups
      summary: >-
        Lists the groups in the Databricks account, returning one page per call.
        Supports filtering by group
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Lists the groups in the Databricks account, returning one page per call.
        Supports filtering by group

        name or external ID.


        :param filter: str (optional)
          Optional. Allows filtering groups by group name or external id.
        :param page_size: int (optional)
          The maximum number of groups to return. The service may return fewer than this value. If not
          provided, defaults to 1000, which is also the maximum allowed. Requests for more than the maximum
          are clamped to 1000.
        :param page_token: str (optional)
          A page token, received from a previous ListGroups call. Provide this to retrieve the subsequent
          page.

        :returns: Iterator over :class:`Group`
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: Optional. Allows filtering groups by group name or external id.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of groups to return. The service may return fewer
            than this value. If not provided, defaults to 1000, which is also
            the maximum allowed. Requests for more than the maximum are clamped
            to 1000.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ListGroups call. Provide this
            to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroupsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
  /api/2.0/identity/accounts/{account_id}/identity-visibility-filters:
    post:
      operationId: account_iam_v2_create_identity_visibility_filter
      summary: >-
        Creates a group visibility filter in the account. Requires account admin
        privileges. Set
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Creates a group visibility filter in the account. Requires account admin
        privileges. Set

        ``principal_type`` to ``GROUP`` and specify exactly one of ``exact``
        (external ID), ``prefix``

        (display-name starts with), or ``regex`` (full RE2 display-name match).
        The filter applies across all

        workspaces in the account. A duplicate filter ID or an existing rule
        with the same type and match

        value returns ``ALREADY_EXISTS``. Filters are immutable; to change a
        rule, delete it and create a new

        one.


        :param parent: str
          Required. The parent account. Format: accounts/{account_id}
        :param identity_visibility_filter: :class:`IdentityVisibilityFilter`
          Required. The filter to create. Set ``principal_type`` to ``GROUP`` and specify exactly one of
          ``exact``, ``prefix``, or ``regex``. The server assigns the resource name; any supplied ``name`` is
          ignored.
        :param identity_visibility_filter_id: str (optional)
          Optional. The ID to use for the filter, which becomes the final component of its resource name. If
          not specified or empty, the server generates one. Must not contain ``/``.

        :returns: :class:`IdentityVisibilityFilter`
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `account_id` segment of the `parent` resource name
            (`accounts/{account_id}`). Required. The parent account. Format:
            accounts/{account_id}
        - name: identity_visibility_filter_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional. The ID to use for the filter, which becomes the final
            component of its resource name. If not specified or empty, the
            server generates one. Must not contain ``/``.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                principal_type:
                  type: string
                  x-enum:
                    - GROUP
                    - SERVICE_PRINCIPAL
                    - USER
                  description: >-
                    The type of principal this rule applies to. Set to ``GROUP``
                    when creating a filter. Other principal types are not
                    supported for creation.
                exact:
                  type: object
                  properties:
                    external_id:
                      type: string
                      description: >-
                        The identity provider's external ID for the group to
                        match. This is not the Databricks group ID. The value
                        must be non-empty and is matched exactly, including
                        case.
                  required:
                    - external_id
                  description: >-
                    Exact match on the group's external ID from the identity
                    provider.
                name:
                  type: string
                  description: >-
                    The resource name of the identity-visibility filter. Format:
                    accounts/{account_id}/identity-visibility-filters/{identity_visibility_filter_id}
                prefix:
                  type: object
                  properties:
                    display_name_prefix:
                      type: string
                      description: >-
                        The display-name prefix to match. Must contain at least
                        one non-whitespace character. Leading and trailing
                        whitespace are preserved, and matching is
                        case-sensitive.
                  required:
                    - display_name_prefix
                  description: >-
                    Case-sensitive starts-with match on the group's display
                    name.
                regex:
                  type: object
                  properties:
                    display_name_regex:
                      type: string
                      description: >-
                        The RE2 regular expression matched against the complete
                        display name.
                  required:
                    - display_name_regex
                  description: >-
                    Full, case-sensitive RE2 match on the identity's display
                    name.
              required:
                - principal_type
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityVisibilityFilter'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
    get:
      operationId: account_iam_v2_list_identity_visibility_filters
      summary: >-
        Lists group visibility filters in the account, returning one page per
        call. Requires account admin
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Lists group visibility filters in the account, returning one page per
        call. Requires account admin

        privileges. Returns filter rules, not the groups matched by those rules.
        To retrieve the next page,

        pass the response's ``next_page_token`` as ``page_token`` in the next
        request. If ``next_page_token``

        is omitted, there are no more pages.


        :param parent: str
          Required. The parent account. Format: accounts/{account_id}
        :param page_size: int (optional)
          The maximum number of filters to return. The service may return fewer than this value. If omitted or
          non-positive, defaults to 100. Values above 1000 are reduced to 1000.
        :param page_token: str (optional)
          A page token, received from a previous ListIdentityVisibilityFilters call. Provide this to retrieve
          the subsequent page.

        :returns: Iterator over :class:`IdentityVisibilityFilter`
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `account_id` segment of the `parent` resource name
            (`accounts/{account_id}`). Required. The parent account. Format:
            accounts/{account_id}
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of filters to return. The service may return
            fewer than this value. If omitted or non-positive, defaults to 100.
            Values above 1000 are reduced to 1000.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ListIdentityVisibilityFilters
            call. Provide this to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIdentityVisibilityFiltersResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
  /api/2.0/identity/accounts/{account_id}/service-principals:
    post:
      operationId: account_iam_v2_create_service_principal
      summary: >-
        Creates a local service principal in the Databricks account and returns
        the created service principal.
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Creates a local service principal in the Databricks account and returns
        the created service principal.

        A local service principal is one that is not synced from the customer's
        identity provider, and can be

        created whether or not Account Identity Management (AIM) is enabled.


        When AIM is enabled, supplying an external ID returns an error. To
        provision the identity from your

        identity provider, resolve it by its external ID with
        ResolveServicePrincipal; to read an existing

        external identity, use the ExternalServicePrincipal resource.


        :param service_principal: :class:`ServicePrincipal`
          Required. Service principal to be created in Databricks

        :returns: :class:`ServicePrincipal`
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: Display name of the service principal.
                account_sp_status:
                  type: string
                  x-enum:
                    - ACTIVE
                    - INACTIVE
                  description: >-
                    The activity status of a service principal in a Databricks
                    account.
                account_id:
                  type: string
                  description: >-
                    The parent account ID for the service principal in
                    Databricks.
                application_id:
                  type: string
                  description: >-
                    Application ID of the service principal. Set at creation
                    time and cannot be changed afterwards; when omitted, the
                    server generates one.
                external_id:
                  type: string
                  description: ExternalId of the service principal in the customer's IdP.
                service_principal_id:
                  type: string
                  description: >-
                    Internal service principal ID of the service principal in
                    Databricks.
              required:
                - display_name
                - account_sp_status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrincipal'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
    get:
      operationId: account_iam_v2_list_service_principals
      summary: >-
        Lists the service principals in the Databricks account, returning one
        page per call. Supports
      tags:
        - iamv2
        - account_iam_v2
      description: >-
