paths:
  /api/2.0/{parent}/account-access-identity-rules:
    post:
      operationId: account_iam_v2_create_account_access_identity_rule
      summary: >-
        Creates a new account access identity rule for a given account. This
        allows administrators to
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Creates a new account access identity rule for a given account. This
        allows administrators to

        explicitly allow or deny specific principals from accessing the account.


        :param parent: str
          Required. The account under which to create the rule. Format: accounts/{account_id}
        :param account_access_identity_rule: :class:`AccountAccessIdentityRule`
          Required. The rule to create.
        :param external_principal_id: str
          Required. The external ID of the principal in the customer's IdP.

        :returns: :class:`AccountAccessIdentityRule`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            Required. The account under which to create the rule. Format:
            accounts/{account_id}
        - name: external_principal_id
          in: query
          required: true
          schema:
            type: string
          description: Required. The external ID of the principal in the customer's IdP.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_access_identity_rule:
                  type: object
                  properties:
                    action:
                      type: string
                      x-enum:
                        - DENY
                      description: Currently, only DENY action is supported.
                    display_name:
                      type: string
                      description: Display name of the principal.
                    external_principal_id:
                      type: string
                      description: External ID of the principal in the customer's IdP.
                    name:
                      type: string
                      description: >-
                        Fully qualified name for the rule. Format:
                        accounts/{account_id}/account-access-identity-rules/{external_principal_id}
                    principal_type:
                      type: string
                      x-enum:
                        - GROUP
                        - SERVICE_PRINCIPAL
                        - USER
                      description: >-
                        The type of the principal (user/service
                        principal/group). This field is populated by the server
                        based on the external_principal_id.
                  required:
                    - action
                  description: Required. The rule to create.
              required:
                - account_access_identity_rule
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAccessIdentityRule'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
    get:
      operationId: account_iam_v2_list_account_access_identity_rules
      summary: >-
        Lists all account access identity rules for a given account. These rules
        control which principals
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Lists all account access identity rules for a given account. These rules
        control which principals

        (users, service principals, groups) from the customer's IdP are allowed
        or denied access to the

        Databricks account.


        :param parent: str
          Required. The account for which to list the rules. Format: accounts/{account_id}
        :param filter: str (optional)
          Optional. Filter to apply to the list. Supports filtering by displayName.
        :param page_size: int (optional)
          Optional. The maximum number of rules to return. The service may return fewer than this value.
        :param page_token: str (optional)
          Optional. A page token, received from a previous call. Provide this to retrieve the subsequent page.

        :returns: :class:`ListAccountAccessIdentityRulesResponse`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            Required. The account for which to list the rules. Format:
            accounts/{account_id}
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional. Filter to apply to the list. Supports filtering by
            displayName.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Optional. The maximum number of rules to return. The service may
            return fewer than this value.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional. A page token, received from a previous call. Provide this
            to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountAccessIdentityRulesResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
  /api/2.0/{parent}/attribute-control-entries:
    post:
      operationId: account_iam_v2_create_attribute_control_entry
      summary: >-
        Creates (allows) an identity attribute control-list entry for an
        account.
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Creates (allows) an identity attribute control-list entry for an
        account.


        :param parent: str
          Required. The account under which to create the entry. Format: accounts/{account_id}
        :param attribute_control_entry: :class:`AttributeControlEntry`
          Required. The entry to create.
        :param attribute_control_entry_id: str (optional)
          Optional. The ID to use for the entry, which becomes the last segment of its resource name: the IdP
          attribute being governed (e.g. "department").

        :returns: :class:`AttributeControlEntry`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            Required. The account under which to create the entry. Format:
            accounts/{account_id}
        - name: attribute_control_entry_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional. The ID to use for the entry, which becomes the last
            segment of its resource name: the IdP attribute being governed (e.g.
            "department").
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                attribute_control_entry:
                  type: object
                  properties:
                    is_allowed:
                      type: boolean
                      description: >-
                        Whether the attribute is permitted. Always true in the
                        Identity Attributes PrPr.
                    name:
                      type: string
                      description: >-
                        The resource name of the entry. Format:
                        accounts/{account_id}/attribute-control-entries/{attribute_name}
                        where {attribute_name} is the IdP attribute being
                        governed (e.g. "department").
                  description: Required. The entry to create.
              required:
                - attribute_control_entry
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeControlEntry'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
