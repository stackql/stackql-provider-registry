  /api/2.0/identity/accounts/{account_id}/workspaces/{workspace_id}/workspace-assignments:
    post:
      operationId: account_iam_v2_create_workspace_assignment
      summary: >-
        Creates a workspace assignment for a principal. Entitlements are granted
        one at a time rather than
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Creates a workspace assignment for a principal. Entitlements are granted
        one at a time rather than

        atomically. If the request fails partway through, the principal stays
        assigned to the workspace with

        only some of the requested entitlements. Get the assignment afterwards
        to confirm which entitlements

        were granted.


        :param workspace_id: int
          Required. The workspace ID for which the workspace assignment is being created.
        :param workspace_assignment: :class:`WorkspaceAssignment`
          Required. Workspace assignment to be created in Databricks.

        :returns: :class:`WorkspaceAssignment`
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
          description: >-
            Required. The workspace ID for which the workspace assignment is
            being created.
      requestBody:
        content:
          application/json:
            schema:
