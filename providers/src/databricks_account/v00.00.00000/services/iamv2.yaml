  /api/2.0/identity/accounts/{account_id}/users:
    post:
      operationId: account_iam_v2_create_user
      summary: >-
        Creates a user in the Databricks account and returns the resulting User
        resource. Behavior depends on
      tags:
        - iamv2
        - account_iam_v2
      description: >-
        Creates a user in the Databricks account and returns the resulting User
        resource. Behavior depends on

        whether Account Identity Management (AIM) is enabled:


        - When AIM is enabled: the user is provisioned with an internalId. If an
        externalId is provided, the
          identity provider is treated as the source of truth for user metadata, and customer-supplied field
          values may be overridden.
        - When AIM is disabled: the user is provisioned with an internalId only,
        and customer-supplied
          metadata is used as-is.

        :param user: :class:`User`
          Required. User to be created in <Databricks>

        :returns: :class:`User`
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    account_id:
                      type: string
                      description: The accountId parent of the user in Databricks.
                    account_user_status:
                      type: string
                      x-enum:
                        - ACTIVE
                        - INACTIVE
                      description: The activity status of a user in a Databricks account.
                    external_id:
                      type: string
                      description: ExternalId of the user in the customer's IdP.
                    full_name:
                      type: object
                      properties:
                        family_name:
                          type: string
                        given_name:
                          type: string
                    internal_id:
                      type: string
                      description: Internal userId of the user in Databricks.
                    username:
                      type: string
                      description: Username/email of the user.
                  description: Required. User to be created in <Databricks>
              required:
                - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AccountIamV2API
