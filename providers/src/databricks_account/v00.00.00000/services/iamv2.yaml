  schemas:
    AccountAccessIdentityRule:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/AccountAccessRuleAction'
          description: Currently, only DENY action is supported.
        display_name:
          type: string
          description: Display name of the principal.
        external_principal_id:
          type: string
          description: External ID of the principal in the customer's IdP.
        name:
          type: string
          description: >-
            Fully qualified name for the rule. Format:
            accounts/{account_id}/account-access-identity-rules/{external_principal_id}
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
          description: >-
            The type of the principal (user/service principal/group). This field
            is populated by the server based on the external_principal_id.
      required:
        - action
      description: An identity rule that controls which principals can access an account.
    AttributeControlEntry:
      type: object
      properties:
        is_allowed:
          type: boolean
          description: >-
            Whether the attribute is permitted. Always true in the Identity
            Attributes PrPr.
        name:
          type: string
          description: >-
            The resource name of the entry. Format:
            accounts/{account_id}/attribute-control-entries/{attribute_name}
            where {attribute_name} is the IdP attribute being governed (e.g.
            "department").
      description: >-
        A single entry in an account's identity attribute control list. The
        presence of an entry means
            the governed attribute (the last segment of ``name``) is controlled across all write sources
            (SCIM, Identity APIs, AIM); is_allowed records whether the attribute is permitted (always true
            in the Identity Attributes PrPr). For the Identity Attributes PrPr the control list is an
            explicit allowlist: an attribute that is NOT present in the control list is treated as not
            allowed. This may change post-PrPr.
    DirectGroupMember:
      type: object
      properties:
        principal_id:
          type: integer
          description: Internal ID of the principal in Databricks.
        display_name:
          type: string
          description: Display name of the principal.
        external_id:
          type: string
          description: The external ID of the principal in Databricks.
        membership_source:
          $ref: '#/components/schemas/GroupMembershipSource'
          description: The source of group membership (internal or from identity provider).
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
          description: The type of the principal (user/service principal/group).
      required:
        - principal_id
      description: >-
        Represents a principal that is a direct member of a group, with its
        source of membership.
    ExternalGroup:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
        display_name:
          type: string
          description: Display name of the group from the customer's IdP.
        external_group_id:
          type: string
          description: The external ID of the group in the customer's IdP.
        internal_id:
          type: string
          description: Internal groupId of the group in Databricks.
        name:
          type: string
          description: >-
            The resource name of the external group. Format:
            accounts/{account_id}/external-groups/{external_group_id}
      description: >-
        An external group from the customer's Identity Provider, resolved into
        Databricks. This is a
            read-only resource keyed by the IdP external ID. The Get method may trigger an idempotent sync
            from the customer's IdP to provision or refresh the group's data in Databricks.
    ExternalServicePrincipal:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
        account_sp_status:
          $ref: '#/components/schemas/State'
          description: >-
            The activity status of the service principal in the Databricks
            account.
        application_id:
          type: string
          description: Application ID of the service principal, from the customer's IdP.
        display_name:
          type: string
          description: Display name of the service principal, from the customer's IdP.
        external_service_principal_id:
          type: string
          description: The external ID of the service principal in the customer's IdP.
        internal_id:
          type: string
          description: Internal servicePrincipalId of the service principal in Databricks.
        name:
          type: string
          description: >-
            The resource name of the external service principal. Format:
            accounts/{account_id}/external-service-principals/{external_service_principal_id}
      description: >-
        An external service principal from the customer's Identity Provider,
        resolved into Databricks.
            This is a read-only resource keyed by the IdP external ID. The Get method may trigger an
            idempotent sync from the customer's IdP to provision or refresh the service principal's data in
            Databricks.
    ExternalUser:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
        account_user_status:
          $ref: '#/components/schemas/State'
          description: The activity status of the user in the Databricks account.
        display_name:
          type: string
          description: Display name of the user from the customer's IdP.
        external_user_id:
          type: string
          description: The external ID of the user in the customer's IdP.
        full_name:
          $ref: '#/components/schemas/FullName'
          description: The full name of the user, from the customer's IdP.
        internal_id:
          type: string
          description: Internal userId of the user in Databricks.
        name:
          type: string
          description: >-
            The resource name of the external user. Format:
            accounts/{account_id}/external-users/{external_user_id}
        username:
          type: string
          description: Username/email of the user, from Databricks.
      description: >-
        An external user from the customer's Identity Provider, resolved into
        Databricks. This is a
            read-only resource that allows customers to look up external user identities by their IdP
            external ID and retrieve the corresponding Databricks internal ID and metadata. The Get method
            may trigger an idempotent sync from the customer's IdP to provision or refresh the user's data
            in Databricks.
    FullName:
      type: object
      properties:
        family_name:
          type: string
          description: The family (last) name of the user, from the customer's IdP.
        given_name:
          type: string
          description: The given (first) name of the user, from the customer's IdP.
      description: The full name of a user.
    Group:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID for group in Databricks.
        external_id:
          type: string
          description: ExternalId of the group in the customer's IdP.
        group_name:
          type: string
          description: Display name of the group.
        internal_id:
          type: string
          description: Internal group ID of the group in Databricks.
      description: The details of a Group resource.
    ListAccountAccessIdentityRulesResponse:
      type: object
      properties:
        account_access_identity_rules:
          type: array
          items:
            $ref: '#/components/schemas/AccountAccessIdentityRule'
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
      description: Response message for listing account access identity rules.
    ListAttributeControlEntriesResponse:
      type: object
      properties:
        attribute_control_entries:
          type: array
          items:
            $ref: '#/components/schemas/AttributeControlEntry'
        next_page_token:
          type: string
          description: >-
            A token to retrieve the next page; empty when there are no more
            results.
      description: Response message for listing identity attribute control-list entries.
    ListDirectGroupMembersResponse:
      type: object
      properties:
        direct_group_members:
          type: array
          items:
            $ref: '#/components/schemas/DirectGroupMember'
          description: The list of direct group members with their membership source type.
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
      description: Response message for listing direct group members.
    ListGroupsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
      description: Response message containing a page of groups in the account.
    ListServicePrincipalsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
        service_principals:
          type: array
          items:
            $ref: '#/components/schemas/ServicePrincipal'
      description: Response message containing a page of service principals in the account.
    ListTransitiveParentGroupsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
        transitive_parent_groups:
          type: array
          items:
            $ref: '#/components/schemas/TransitiveParentGroup'
          description: The list of transitive parent groups.
      description: >-
        Response message for listing all transitive parent groups of a
        principal.
    ListUsersResponse:
      type: object
      properties:
        next_page_token:
          type: string
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    ListWorkspaceAccessDetailsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
        workspace_access_details:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceAccessDetail'
      description: Response message containing a page of workspace access details.
    ListWorkspaceAssignmentDetailsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
        workspace_assignment_details:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceAssignmentDetail'
      description: Response message for listing workspace assignment details.
    ResolveGroupResponse:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/Group'
    ResolveServicePrincipalResponse:
      type: object
      properties:
        service_principal:
          $ref: '#/components/schemas/ServicePrincipal'
    ResolveUserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
    ServicePrincipal:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID for the service principal in Databricks.
        account_sp_status:
          $ref: '#/components/schemas/State'
          description: The activity status of a service principal in a Databricks account.
        application_id:
          type: string
          description: Application ID of the service principal.
        display_name:
          type: string
          description: Display name of the service principal.
        external_id:
          type: string
          description: ExternalId of the service principal in the customer's IdP.
        internal_id:
          type: string
          description: >-
            Internal service principal ID of the service principal in
            Databricks.
      description: The details of a ServicePrincipal resource.
    TransitiveParentGroup:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID for group in Databricks.
        external_id:
          type: string
          description: ExternalId of the group in the customer's IdP.
        internal_id:
          type: string
          description: Internal group ID of the group in Databricks.
      description: Represents a group that is a transitive parent of a principal.
    User:
      type: object
      properties:
        account_id:
          type: string
          description: The accountId parent of the user in Databricks.
        account_user_status:
          $ref: '#/components/schemas/State'
          description: The activity status of a user in a Databricks account.
        external_id:
          type: string
          description: ExternalId of the user in the customer's IdP.
        full_name:
          $ref: '#/components/schemas/UserFullName'
        internal_id:
          type: string
          description: Internal userId of the user in Databricks.
        username:
          type: string
          description: Username/email of the user.
      description: The details of a User resource.
    UserFullName:
      type: object
      properties:
        family_name:
          type: string
        given_name:
          type: string
    WorkspaceAccessDetail:
      type: object
      properties:
        access_type:
          $ref: '#/components/schemas/WorkspaceAccessDetailAccessType'
        account_id:
          type: string
          description: >-
            The account ID parent of the workspace where the principal has
            access.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/WorkspacePermission'
          description: The permissions granted to the principal in the workspace.
        principal_id:
          type: integer
          description: The internal ID of the principal (user/sp/group) in Databricks.
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
        status:
          $ref: '#/components/schemas/State'
          description: >-
            The activity status of the principal in the workspace. Not
            applicable for groups at the moment.
        workspace_id:
          type: integer
          description: The workspace ID where the principal has access.
      description: The details of a principal's access to a workspace.
    WorkspaceAssignmentDetail:
      type: object
      properties:
        principal_id:
          type: integer
          description: The internal ID of the principal (user/sp/group) in Databricks.
        account_id:
          type: string
          description: >-
            The account ID parent of the workspace where the principal is
            assigned
        effective_entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
          description: >-
            The principal's full effective entitlements granted in this
            workspace: every entitlement it holds whether granted directly or
            via group membership. Populated on Get; empty on List.
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
          description: >-
            Entitlements granted directly to the principal on this workspace.
            The only client-settable field: create and update manage exactly
            this set (including entitlements the principal also holds via a
            group). Not populated by ListWorkspaceAssignmentDetails (omitted for
            scalability); call GetWorkspaceAssignmentDetail to read the
            entitlements for a single principal.
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
        workspace_id:
          type: integer
          description: The workspace ID where the principal is assigned
      required:
        - principal_id
      description: >-
        The direct assignment of a provisioned account-level principal (user,
        service principal, or
            group) to a workspace, together with the entitlements that assignment grants in the workspace.

            A WorkspaceAssignmentDetail exists only for principals that are directly assigned to the
            workspace; principals that merely inherit workspace access through a group are not represented
            here (see WorkspaceAccessDetail / WorkspaceIdentityDetail for the effective, direct-or-indirect
            view). Creating the resource assigns the principal to the workspace; deleting it removes the
            assignment. The ``entitlements`` field is the only client-settable field and defines the
            entitlements granted directly on this assignment; ``effective_entitlements`` is the read-only
            union of those plus any granted via group membership.

            A direct assignment always carries at least one directly-assigned entitlement: the assignment is
            what grants the entitlement, so a WorkspaceAssignmentDetail with an empty ``entitlements`` set
            is not a valid state. Both create and update require a non-empty ``entitlements`` set (an empty
            set is rejected); to remove a principal's assignment entirely, delete the resource.

            This resource replaces workspace assignment previously managed through the workspace SCIM and
            permission-assignment APIs, and is intended for account and workspace admins.
    WorkspaceIdentityDetail:
      type: object
      properties:
        assignment_type:
          $ref: '#/components/schemas/WorkspaceIdentityDetailAssignmentType'
          description: >-
            The type of assignment the principal has to the workspace (direct or
            indirect).
        principal_id:
          type: integer
          description: The internal ID of the principal (user/sp/group) in Databricks.
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
          description: The type of the principal (user/service principal/group).
        workspace_identity_status:
          $ref: '#/components/schemas/State'
          description: The activity status of an identity in a Databricks workspace.
      description: >-
        The details of a directly or indirectly assigned principal's details in
        a workspace.
    AccountAccessRuleAction:
      type: string
      x-enum:
        - DENY
      description: >-
        The action type for an account access identity rule (currently DENY
        only).
    Entitlement:
      type: string
      x-enum:
        - ALLOW_CLUSTER_CREATE
        - ALLOW_INSTANCE_POOL_CREATE
        - DATABRICKS_SQL_ACCESS
        - WORKSPACE_ACCESS
        - WORKSPACE_ADMIN
        - WORKSPACE_CONSUME
      description: |-
        Create a collection of name/value pairs.

        Example enumeration:

        >>> class Color(Enum):
        ...     RED = 1
        ...     BLUE = 2
        ...     GREEN = 3

        Access them by:

        - attribute access:

          >>> Color.RED
          <Color.RED: 1>

        - value lookup:

          >>> Color(1)
          <Color.RED: 1>

        - name lookup:

          >>> Color['RED']
          <Color.RED: 1>

        Enumerations can be iterated over, and know how many members they have:

        >>> len(Color)
        3

        >>> list(Color)
        [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

        Methods can be added to enumerations, and members can have their own
        attributes -- see the documentation for details.
    GroupMembershipSource:
      type: string
      x-enum:
        - IDENTITY_PROVIDER
        - INTERNAL
      description: The source of the group membership (internal or from identity provider).
    PrincipalType:
      type: string
      x-enum:
        - GROUP
        - SERVICE_PRINCIPAL
        - USER
      description: The type of the principal (user/sp/group).
    State:
      type: string
      x-enum:
        - ACTIVE
        - INACTIVE
      description: >-
        The activity status of a user or service principal in a Databricks
        account or workspace.
    WorkspaceAccessDetailAccessType:
      type: string
      x-enum:
        - DIRECT
        - INDIRECT
      description: The type of access the principal has to the workspace.
    WorkspaceAccessDetailView:
      type: string
      x-enum:
        - BASIC
        - FULL
      description: >-
        Controls what fields are returned in the GetWorkspaceAccessDetail
        response.
    WorkspaceIdentityDetailAssignmentType:
      type: string
      x-enum:
        - DIRECT
        - INDIRECT
      description: The type of assignment the principal has to the workspace.
    WorkspacePermission:
      type: string
      x-enum:
        - ADMIN_PERMISSION
        - USER_PERMISSION
      description: The type of permission a principal has to a workspace (admin/user).
