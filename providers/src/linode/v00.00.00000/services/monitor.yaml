        url: https://techdocs.akamai.com/linode-api/reference/post-alert-definition-for-service-type
      operationId: post-alert-definition-for-service-type
      requestBody:
        content:
          application/json:
            example:
              channel_ids:
              - 546
              - 392
              description: Alert for my PostgreSQL database.
              entity_ids:
              - '13116'
              - '13217'
              - '13331'
              label: High Memory Usage Plan Dedicated
              rule_criteria:
                rules:
                - aggregate_function: min
                  dimension_filters:
                  - dimension_label: node_type
                    operator: eq
                    value: primary
                  label: CPU Usage
                  metric: cpu_usage
                  operator: gt
                  threshold: 80
              severity: 1
              trigger_conditions:
                criteria_condition: ALL
                evaluation_period_seconds: 300
                polling_interval_seconds: 300
                trigger_occurrences: 3
            schema:
              additionalProperties: false
              properties:
