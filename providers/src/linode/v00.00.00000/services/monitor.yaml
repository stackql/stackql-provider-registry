  /monitor/services/{serviceType}/metrics:
    post:
      description: '__Beta__ Returns metrics information for the individual entities
        within a specific service type. Thi operation also requires an `authorization:
        Bearer` [token](https://techdocs.akamai.com/linode-api/reference/post-get-token)
        you''ve created for this `serviceType`.


        > 📘

        >

        > - This operation uses a different URL and version from standard Linode API
        operations. Verify you''re using the URL with the `monitor-api.linode.com`
        hostname and include `v2beta` as the version in the URL.

        >

        > - For more details on the metrics available for each service, see the [Metrics
        reference](https://techdocs.akamai.com/cloud-computing/docs/metrics-dimensions-parameters).'
      externalDocs:
        description: See documentation for this operation in Akamai's Linode API
        url: https://techdocs.akamai.com/linode-api/reference/post-read-metric
      operationId: post-read-metric
      requestBody:
        content:
          application/json:
            example:
              absolute_time_duration:
                end: '2024-10-16T02:00:00Z'
                start: '2024-10-14T01:00:00Z'
              entity_ids:
              - 13116
              - 13217
              - 13331
              filters:
              - dimension_label: node_type
                operator: eq
                value: primary
              group_by:
              - entity_id
              - node_type
              metrics:
              - aggregate_function: avg
                name: read_iops
              - aggregate_function: avg
                name: cpu_usage
              time_granularity:
                unit: sec
                value: 700
            schema:
              additionalProperties: false
              description: Settings used for data queries.
              type: object
              x-akamai:
                file-path: schemas/aclp-metric-read-request.yaml
              required:
              - relative_time_duration
              - metrics
              - entity_ids
              - absolute_time_duration
              title: Relative Time
              properties:
                entity_ids:
                  description: The `id` for each individual entity from a `service_type`.
                    Get this value by running the list operation for the appropriate
                    entity. For example, if your entity is one of your PostgreSQL
                    databases, run the [List PostgreSQL Managed Databases](https://techdocs.akamai.com/linode-api/reference/get-databases-postgre-sql-instances)
                    operation and store the `id` for the appropriate database from
                    the response.
                  example:
                  - 13116
                  - 13217
                  - 13331
                  items:
                    type: integer
                  minItems: 1
                  type: array
                filters:
                  description: Individual objects that define dimension filters for
                    the query.
                  items:
                    additionalProperties: false
                    properties:
                      dimension_label:
                        description: The name of the dimension label to filter on.
                        example: node_type
                        type: string
                      operator:
                        description: The operator to apply to the dimension label.
                          Available values are `eq` for equal, `neq` for not equal,
                          `startswith`, and `endswith`.
                        enum:
                        - eq
                        - neq
                        - startswith
                        - endswith
                        example: eq
                        type: string
                      value:
                        description: The value to compare the dimension label against.
                        example: primary
                        type: string
                    type: object
                  type: array
                group_by:
                  description: 'Categorizes response data based on the specified fields:


                    * `entity_id`. Include this parameter by name to group the response
                    data using the `entity_id` values included in the request.


                    * `dimension_label`. This represents the desired dimension from
                    a monitoring metric. To get a `dimension_label`, run the [List
                    metrics for a service type](https://techdocs.akamai.com/linode-api/reference/get-monitor-information)
                    operation, review the available `dimensions`, and store the applicable
                    `dimension_label` values.


                    You can group these fields using these combinations:


                    * Group by `entity_id` values and one or more `dimensions_label`
                    values. For example, `[entity_id, node_type]` groups response
                    data based on values set for the `entity_id` parameter and the
                    `node_type` dimension that''s available for a `service_type` of
                    `dbaas`.


                    * Group by only the `entity_id` values. For example, `[entity_id]`
                    exclusively groups response data based on values set for the `entity_id`
                    parameter.


                    * Group by one or more `dimension_label` values. For example,
                    `[node_type]` groups response data based on the `node_type` dimension
                    that''s available for a `service_type` of `dbaas`.


                    If you leave this out of a request, data is aggregated across
                    all series.'
                  items:
                    example:
                    - entity_id
                    - node_type
                    type: string
                  type: array
                metrics:
                  description: A list of metric objects, each specifying a metric
                    name and its corresponding aggregation function.
                  example:
                  - aggregate_function: avg
                    name: cpu_usage
                  - aggregate_function: sum
                    name: cpu_usage
                  items:
                    additionalProperties: false
                    properties:
                      aggregate_function:
                        description: The aggregation function applied to the metric.
                          Available values are `min`, `max`, `avg`, and `sum`.
                        enum:
                        - min
                        - max
                        - avg
                        - sum
                        example: avg
                        type: string
                      name:
                        description: The metric to query.
                        example: cpu_usage
                        type: string
                    type: object
                  minItems: 1
                  type: array
                time_granularity:
                  additionalProperties: false
                  description: Allows for an optional time granularity setting for
                    metric data.
                  properties:
                    unit:
                      description: The unit of time granularity for the metric data.
                        Available values are `sec`, `min`, `hr`, and `days`.
                      enum:
                      - sec
                      - min
                      - hr
                      - days
                      example: min
                      type: string
                    value:
                      description: The value that corresponds to the `unit`. Set to
                        `10` with a `unit` of `hr` for 10 hours.
                      example: 5
                      type: integer
                  type: object
                relative_time_duration:
                  additionalProperties: false
                  description: Specifies a relative time duration for data queries.
                    Queries begin immediately for the specified amount of time. You
                    can specify a `relative_time_duration` or an `absolute_time_duration`,
                    but not both.
                  properties:
                    unit:
                      description: The unit of time used for the relative duration
                        to query metric data. Available values are `sec`, `min`, `hr`,
                        and `days`.
                      enum:
                      - sec
                      - min
                      - hr
                      - days
                      example: min
                      type: string
                    value:
                      description: The value that corresponds to the `unit`. Set to
                        `30` with a `unit` of `min` for 30 minutes.
                      example: 30
                      type: integer
                  type: object
                absolute_time_duration:
                  additionalProperties: false
                  description: 'Specifies an absolute time range for data queries.
                    Queries begin and end at a specific time.


                    > 📘

                    >

                    > - You can query data for up to 31 days.

                    >

