openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Firebase SQL Connect API
  description: >-
    Firebase SQL Connect is a relational database service for mobile and web
    apps that lets you build and scale using a fully-managed PostgreSQL database
    powered by Cloud SQL. The REST API lets developers manage the connections to
    their database, change the schema of their database, and query the database.
  version: v1
  x-discovery-doc-revision: '20260726'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://firebase.google.com/docs/data-connect
servers:
  - url: https://firebasedataconnect.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    Schema:
      properties:
        labels:
          description: Optional. Labels as key value pairs.
          type: object
          additionalProperties:
            type: string
        name:
          type: string
          description: >-
            Identifier. The relative resource name of the schema, in the format:
            ```
            projects/{project}/locations/{location}/services/{service}/schemas/{schema}
            ``` Right now, the only supported schema is "main".
        updateTime:
          type: string
          format: google-datetime
          description: Output only. [Output only] Update time stamp.
          readOnly: true
        etag:
          type: string
          description: >-
            Output only. This checksum is computed by the server based on the
            value of other fields, and may be sent on update and delete requests
            to ensure the client has an up-to-date value before proceeding.
            [AIP-154](https://google.aip.dev/154)
          readOnly: true
        uid:
          readOnly: true
          description: Output only. System-assigned, unique identifier.
          type: string
        reconciling:
          readOnly: true
          type: boolean
          description: >-
            Output only. A field that if true, indicates that the system is
            working to compile and deploy the schema.
        displayName:
          description: Optional. Mutable human-readable name. 63 character limit.
          type: string
        annotations:
          type: object
          additionalProperties:
            type: string
          description: Optional. Stores small amounts of arbitrary data.
        datasources:
          type: array
          description: Required. The data sources linked in the schema.
          items:
            $ref: '#/components/schemas/Datasource'
        source:
          description: Required. The source files that comprise the application schema.
          $ref: '#/components/schemas/Source'
        createTime:
          description: Output only. [Output only] Create time stamp.
          type: string
          format: google-datetime
          readOnly: true
      type: object
      id: Schema
      description: The application schema of a Firebase SQL Connect service.
    DataConnectProperties:
      properties:
        path:
          type: array
          description: >-
            The path under response.data where the rest of the fields apply.
            Each element may be a string (field name) or number (array index).
            The root of response.data is denoted by the empty list `[]`.
          items:
            type: any
        entityId:
          description: A single Entity ID. Set if the path points to a single entity.
          type: string
        entityIds:
          description: >-
            A list of Entity IDs. Set if the path points to an array of
            entities. An ID is present for each element of the array at the
            corresponding index.
          items:
            type: string
          type: array
        maxAge:
          description: >-
            The server-suggested duration before data under path is considered
            stale.
          type: string
          format: google-duration
      id: DataConnectProperties
      description: SQL Connect specific properties for a path under response.data.
      type: object
    ImpersonateRequest:
      properties:
        variables:
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
          description: Optional. Values for GraphQL variables provided in this request.
        extensions:
          $ref: '#/components/schemas/GraphqlRequestExtensions'
          description: Optional. Additional GraphQL request information.
        operationName:
          type: string
          description: >-
            Required. The name of the GraphQL operation name. Required because
            all Connector operations must be named. See
            https://graphql.org/learn/queries/#operation-name.
      id: ImpersonateRequest
      description: The Impersonate request to Firebase SQL Connect.
      type: object
    CodeChunk:
      properties:
        code:
          description: Required. The code content string.
          type: string
        languageCode:
          type: string
          description: >-
            Optional. Specifies the language if we expand support beyond GraphQL
            (e.g., SQL or JSON) The standard is BCP-47 language code.
      id: CodeChunk
      description: A chunk of code.
      type: object
    GraphqlRequestExtensions:
      type: object
      id: GraphqlRequestExtensions
      description: >-
        GraphqlRequestExtensions contains additional information of
        `GraphqlRequest`.
      properties:
        impersonate:
          description: >-
            Optional. If set, impersonate a request with given Firebase Auth
            context and evaluate the auth policies on the operation. If omitted,
            bypass any defined auth policies.
          $ref: '#/components/schemas/Impersonation'
    GenerateQueryResponse:
      properties:
        status:
          description: >-
            Essential for providing responsive UI feedback (e.g., a spinner or
            "Analyzing schema..." step).
          $ref: '#/components/schemas/GenerationStatus'
        part:
          $ref: '#/components/schemas/Part'
          description: Required. The content from the current conversational turn.
      id: GenerateQueryResponse
      description: Output for streaming generate query requests
      type: object
    Connector:
      properties:
        clientCache:
          $ref: '#/components/schemas/ClientCache'
          description: Optional. The client cache settings of the connector.
        source:
          $ref: '#/components/schemas/Source'
          description: Required. The source files that comprise the connector.
        createTime:
          description: Output only. [Output only] Create time stamp.
          type: string
          format: google-datetime
          readOnly: true
        annotations:
          description: Optional. Stores small amounts of arbitrary data.
          type: object
          additionalProperties:
            type: string
        uid:
          readOnly: true
          type: string
          description: Output only. System-assigned, unique identifier.
        reconciling:
          description: >-
            Output only. A field that if true, indicates that the system is
            working to compile and deploy the connector.
          type: boolean
          readOnly: true
        displayName:
          type: string
          description: Optional. Mutable human-readable name. 63 character limit.
        etag:
          readOnly: true
          description: >-
            Output only. This checksum is computed by the server based on the
            value of other fields, and may be sent on update and delete requests
            to ensure the client has an up-to-date value before proceeding.
            [AIP-154](https://google.aip.dev/154)
          type: string
        updateTime:
          readOnly: true
          description: Output only. [Output only] Update time stamp.
          type: string
          format: google-datetime
        name:
          type: string
          description: >-
            Identifier. The relative resource name of the connector, in the
            format: ```
            projects/{project}/locations/{location}/services/{service}/connectors/{connector}
            ```
        labels:
          description: Optional. Labels as key value pairs.
          type: object
          additionalProperties:
            type: string
      id: Connector
      description: Connector consists of a set of operations, i.e. queries and mutations.
      type: object
    CancelOperationRequest:
      id: CancelOperationRequest
      description: The request message for Operations.CancelOperation.
      type: object
      properties: {}
    ExecuteQueryRequest:
      id: ExecuteQueryRequest
      description: The ExecuteQuery request to Firebase SQL Connect.
      type: object
      properties:
        variables:
          description: Optional. Values for GraphQL variables provided in this request.
          type: object
          additionalProperties:
            description: Properties of the object.
            type: any
        operationName:
          type: string
          description: >-
            Required. The name of the GraphQL operation name. Required because
            all Connector operations must be named. See
            https://graphql.org/learn/queries/#operation-name.
    GenerateQueryRequest:
      properties:
        prompt:
          type: string
          description: >-
            Required. The natural language description of the desired query.
            Example: "Find all users who signed up in the last 7 days."
        schemas:
          type: array
          description: >-
            Optional. The user's locally defined FDC Schema(s). If not defined,
            the backend will fetch the user's deployed schema.
          items:
            $ref: '#/components/schemas/Schema'
      type: object
      id: GenerateQueryRequest
      description: Request message for GenerateQuery.
    PostgreSql:
      properties:
        schemaValidation:
          description: >-
            Optional. Configure how much PostgreSQL schema validation to perform
            against the live database before deploying the FDC schema.
          enumDescriptions:
            - Unspecified SQL schema validation. Defaults to STRICT.
            - >-
              Skips SQL schema validation. Deployment succeeds even if the
              database is pending provisioning, unavailable, or incompatible.
              Under NONE, newly created services route requests to a temporary
              ephemeral database (in-memory emulation) so the API can be tested
              immediately. Ephemeral data expires after 24 hours unless
              successfully validated or migrated to a linked database.
            - >-
              Connects to the SQL database and validates that the SQL DDL
              matches the FDC schema exactly. Any discrepancies (extra or
              missing tables/columns) result in a FAILED_PRECONDITION error with
              required SQL diffs. Recommended for greenfield projects to ensure
              full schema consistency.
            - >-
              Connects to the SQL database and validates that it contains all
              the SQL resources required by the FDC schema. Succeeds even if the
              database contains additional tables or columns not used by FDC.
              Suitable when sharing a database with other tools or legacy
              applications.
          type: string
          enum:
            - SQL_SCHEMA_VALIDATION_UNSPECIFIED
            - NONE
            - STRICT
            - COMPATIBLE
        ephemeral:
          readOnly: true
          description: >-
            Output only. Ephemeral is true if this SQL Connect service is served
            from temporary in-memory emulation of Postgres. While Cloud SQL is
            being provisioned, the SQL Connect service provides the ephemeral
            service to help developers get started. Once the Cloud SQL is
            provisioned, SQL Connect service will transfer its data on a
            best-effort basis to the Cloud SQL instance. WARNING: Ephemeral data
            sources will expire after 24 hour. The data will be lost if they
            aren't transferred to the Cloud SQL instance. WARNING: When
            `ephemeral=true`, mutations to the database are not guaranteed to be
            durably persisted, even if an OK status code is returned. All or
            parts of the data may be lost or reverted to earlier versions.
          type: boolean
        database:
          type: string
          description: Required. Name of the PostgreSQL database.
        schemaMigration:
          description: >-
            Optional. Configure how to perform automatic PostgreSQL schema
            migration before deploying the FDC schema. This is an additive-only
            operation.
          enumDescriptions:
            - Unspecified SQL schema migration.
            - >-
              Waits for the Cloud SQL instance to be provisioned and
              automatically creates necessary SQL resources (tables, columns,
              etc.) to match the desired FDC schema. This operation is strictly
              additive and executes as a Long-Running Operation during
              provisioning. Rejects migrations on a non-empty existing SQL
              schema.
          type: string
          enum:
            - SQL_SCHEMA_MIGRATION_UNSPECIFIED
            - MIGRATE_COMPATIBLE
        unlinked:
          deprecated: true
          type: boolean
          description: >-
            No Postgres data source is linked. If set, don't allow `database`
            and `schema_validation` to be configured.
        cloudSql:
          description: Cloud SQL configurations.
          $ref: '#/components/schemas/CloudSqlInstance'
        schema:
          type: string
          description: >-
            Optional. User-configured PostgreSQL schema. Defaults to "public" if
            not specified.
      id: PostgreSql
      description: Settings for PostgreSQL data source.
      type: object
    GenerationStatus:
      type: object
      id: GenerationStatus
      description: Represents the progress of the server side generation request.
      properties:
        state:
          enum:
            - STATE_UNSPECIFIED
            - ANALYZING_CODE
            - GENERATING_CODE
            - COMPLETED
          enumDescriptions:
            - Unspecified state.
            - The agent is analyzing schema or operations.
            - The agent is generating code
            - Generation is complete.
          readOnly: true
          type: string
          description: Output only. The state of generation.
        message:
          readOnly: true
          description: Output only. A message providing more details about the state.
          type: string
    File:
      properties:
        path:
          type: string
          description: >-
            Required. The file name including folder path, if applicable. The
            path should be relative to a local workspace (e.g.
            dataconnect/(schema|connector)/*.gql) and not an absolute path (e.g.
            /absolute/path/(schema|connector)/*.gql).
        content:
          type: string
          description: Required. The file's textual content.
      type: object
      id: File
      description: Individual files.
    GraphqlResponseExtensions:
      type: object
      id: GraphqlResponseExtensions
      description: >-
        GraphqlResponseExtensions contains additional information of
        `GraphqlResponse` or `ExecuteQueryResponse`.
      properties:
        dataConnect:
          description: >-
            SQL Connect specific GraphQL extension, a list of paths and
            properties.
          items:
            $ref: '#/components/schemas/DataConnectProperties'
          type: array
    OperationMetadata:
      id: OperationMetadata
      description: >-
        Represents the metadata of the long-running operation. Note: This
        message is auto-generated by CCFE. CCFE's storage, called Resource
        Metadata Store (RMS), holds metadata about long-running operations (i.e.
        OperationMetadata) and resources (i.e. ResourceMetadata).
        OperationMetadata documents the status of the operation. See [CCFE
        documentation for sidechannel
        data](https://g3doc.corp.google.com/cloud/control2/g3doc/dev/codelab_extras/sidechannel.md?cl=head#sidechannel-data)
        and yaqs/4289526912465764352.
      type: object
      properties:
        target:
          type: string
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
        verb:
          type: string
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
        statusMessage:
          readOnly: true
          description: Output only. Human-readable status of the operation, if any.
          type: string
        requestedCancellation:
          readOnly: true
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have Operation.error value with a google.rpc.Status.code of 1,
            corresponding to `Code.CANCELLED`.
          type: boolean
        apiVersion:
          type: string
          description: Output only. API version used to start the operation.
          readOnly: true
        endTime:
          description: Output only. The time the operation finished running.
          type: string
          format: google-datetime
          readOnly: true
        createTime:
          type: string
          format: google-datetime
          description: Output only. The time the operation was created.
          readOnly: true
    Workaround:
      properties:
        reason:
          type: string
          description: Why would this workaround address the error and warning.
        replace:
          description: A suggested code snippet to fix the error and warning.
          type: string
        description:
          type: string
          description: Description of this workaround.
      id: Workaround
      description: Workaround provides suggestions to address errors and warnings.
      type: object
    ClientCache:
      properties:
        strictValidationEnabled:
          type: boolean
          description: >-
            Optional. A field that, if true, enables stricter validation on the
            connector source code to make sure the operation response shapes are
            suitable for client-side caching. This can include additional errors
            and warnings. For example, using the same alias for different fields
            is disallowed, as it may cause conflicts or confusion with
            normalized caching. (This field is off by default for compatibility,
            but enabling it is highly recommended to catch common caching
            pitfalls.)
        entityIdIncluded:
          description: >-
            Optional. A field that, if true, means that responses served by this
            connector will include entityIds in GraphQL response extensions.
            This helps the client SDK cache responses in an improved way, known
            as "normalized caching", if caching is enabled on the client. Each
            entityId is a stable key based on primary key values. Therefore,
            this field should only be set to true if the primary keys of
            accessed tables do not contain sensitive information.
          type: boolean
      id: ClientCache
      description: Client caching settings of a connector.
      type: object
    ExecuteMutationResponse:
      id: ExecuteMutationResponse
      description: The ExecuteMutation response from Firebase SQL Connect.
      type: object
      properties:
        errors:
          description: Errors of this response.
          items:
            $ref: '#/components/schemas/GraphqlError'
          type: array
        extensions:
          $ref: '#/components/schemas/GraphqlResponseExtensions'
          description: Additional response information.
        data:
          type: object
          additionalProperties:
            description: Properties of the object.
            type: any
          description: The result of executing the requested operation.
    Operation:
      properties:
        metadata:
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
        response:
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
      type: object
      id: Operation
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
    TextChunk:
      properties:
        text:
          description: Required. The text content string.
          type: string
      type: object
      id: TextChunk
      description: A chunk of conversational text.
    GenerateSchemaRequest:
      type: object
      id: GenerateSchemaRequest
      description: Request message for GenerateSchema.
      properties:
        prompt:
          description: >-
            Required. The natural language description of the data model to
            generate. Example: "A blog system with Users, Posts, and Comments.
            Users can have multiple posts."
          type: string
    GenerateSchemaResponse:
      properties:
        status:
          description: >-
            Essential for providing responsive UI feedback (e.g., a spinner or
            "Analyzing schema..." step).
          $ref: '#/components/schemas/GenerationStatus'
        part:
          description: The content from the current conversational turn.
          $ref: '#/components/schemas/Part'
      id: GenerateSchemaResponse
      description: Output for streaming generate schema requests
      type: object
    Part:
      properties:
        textChunk:
          $ref: '#/components/schemas/TextChunk'
          description: Optional. A chunk of text.
        codeChunk:
          description: Optional. A chunk of code.
          $ref: '#/components/schemas/CodeChunk'
      id: Part
      description: Represents a chunk of content.
      type: object
    SourceLocation:
      properties:
        column:
          type: integer
          format: int32
          description: Column number starting at 1.
        line:
          description: Line number starting at 1.
          type: integer
          format: int32
      id: SourceLocation
      description: SourceLocation references a location in a GraphQL source.
      type: object
    ListConnectorsResponse:
      properties:
        connectors:
          type: array
          description: The list of Connectors.
          items:
            $ref: '#/components/schemas/Connector'
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
          type: string
        unreachable:
          type: array
          description: Locations that could not be reached.
          items:
            type: string
      type: object
      id: ListConnectorsResponse
      description: >-
        Message for response to listing Connectors. By default,
        `connectors.source` will not be included in the response. To specify the
        fields included in the response, the response field mask can be provided
        by using the query parameter `$fields` or the header `X-Goog-FieldMask`.
    ListOperationsResponse:
      properties:
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      id: ListOperationsResponse
      description: The response message for Operations.ListOperations.
      type: object
    GraphqlErrorExtensions:
      properties:
        workarounds:
          description: >-
            Workarounds provide suggestions to address the compile errors or
            warnings.
          items:
            $ref: '#/components/schemas/Workaround'
          type: array
        code:
          description: >-
            Maps to canonical gRPC codes. If not specified, it represents
            `Code.INTERNAL`.
          enumDescriptions:
            - 'Not an error; returned on success. HTTP Mapping: 200 OK'
            - >-
              The operation was cancelled, typically by the caller. HTTP
              Mapping: 499 Client Closed Request
            - >-
              Unknown error. For example, this error may be returned when a
              `Status` value received from another address space belongs to an
              error space that is not known in this address space. Also errors
              raised by APIs that do not return enough error information may be
              converted to this error. HTTP Mapping: 500 Internal Server Error
            - >-
              The client specified an invalid argument. Note that this differs
              from `FAILED_PRECONDITION`. `INVALID_ARGUMENT` indicates arguments
              that are problematic regardless of the state of the system (e.g.,
              a malformed file name). HTTP Mapping: 400 Bad Request
            - >-
              The deadline expired before the operation could complete. For
              operations that change the state of the system, this error may be
              returned even if the operation has completed successfully. For
              example, a successful response from a server could have been
              delayed long enough for the deadline to expire. HTTP Mapping: 504
              Gateway Timeout
            - >-
              Some requested entity (e.g., file or directory) was not found.
              Note to server developers: if a request is denied for an entire
              class of users, such as gradual feature rollout or undocumented
              allowlist, `NOT_FOUND` may be used. If a request is denied for
              some users within a class of users, such as user-based access
              control, `PERMISSION_DENIED` must be used. HTTP Mapping: 404 Not
              Found
            - >-
              The entity that a client attempted to create (e.g., file or
              directory) already exists. HTTP Mapping: 409 Conflict
            - >-
              The caller does not have permission to execute the specified
              operation. `PERMISSION_DENIED` must not be used for rejections
              caused by exhausting some resource (use `RESOURCE_EXHAUSTED`
              instead for those errors). `PERMISSION_DENIED` must not be used if
              the caller can not be identified (use `UNAUTHENTICATED` instead
              for those errors). This error code does not imply the request is
              valid or the requested entity exists or satisfies other
              pre-conditions. HTTP Mapping: 403 Forbidden
            - >-
              The request does not have valid authentication credentials for the
              operation. HTTP Mapping: 401 Unauthorized
            - >-
              Some resource has been exhausted, perhaps a per-user quota, or
              perhaps the entire file system is out of space. HTTP Mapping: 429
              Too Many Requests
            - >-
              The operation was rejected because the system is not in a state
              required for the operation's execution. For example, the directory
              to be deleted is non-empty, an rmdir operation is applied to a
              non-directory, etc. Service implementors can use the following
              guidelines to decide between `FAILED_PRECONDITION`, `ABORTED`, and
              `UNAVAILABLE`: (a) Use `UNAVAILABLE` if the client can retry just
              the failing call. (b) Use `ABORTED` if the client should retry at
              a higher level. For example, when a client-specified test-and-set
              fails, indicating the client should restart a read-modify-write
              sequence. (c) Use `FAILED_PRECONDITION` if the client should not
              retry until the system state has been explicitly fixed. For
              example, if an "rmdir" fails because the directory is non-empty,
              `FAILED_PRECONDITION` should be returned since the client should
              not retry unless the files are deleted from the directory. HTTP
              Mapping: 400 Bad Request
            - >-
              The operation was aborted, typically due to a concurrency issue
              such as a sequencer check failure or transaction abort. See the
              guidelines above for deciding between `FAILED_PRECONDITION`,
              `ABORTED`, and `UNAVAILABLE`. HTTP Mapping: 409 Conflict
            - >-
              The operation was attempted past the valid range. E.g., seeking or
              reading past end-of-file. Unlike `INVALID_ARGUMENT`, this error
              indicates a problem that may be fixed if the system state changes.
              For example, a 32-bit file system will generate `INVALID_ARGUMENT`
              if asked to read at an offset that is not in the range [0,2^32-1],
              but it will generate `OUT_OF_RANGE` if asked to read from an
              offset past the current file size. There is a fair bit of overlap
              between `FAILED_PRECONDITION` and `OUT_OF_RANGE`. We recommend
              using `OUT_OF_RANGE` (the more specific error) when it applies so
              that callers who are iterating through a space can easily look for
              an `OUT_OF_RANGE` error to detect when they are done. HTTP
              Mapping: 400 Bad Request
            - >-
              The operation is not implemented or is not supported/enabled in
              this service. HTTP Mapping: 501 Not Implemented
            - >-
              Internal errors. This means that some invariants expected by the
              underlying system have been broken. This error code is reserved
              for serious errors. HTTP Mapping: 500 Internal Server Error
            - >-
              The service is currently unavailable. This is most likely a
              transient condition, which can be corrected by retrying with a
              backoff. Note that it is not always safe to retry non-idempotent
              operations. See the guidelines above for deciding between
              `FAILED_PRECONDITION`, `ABORTED`, and `UNAVAILABLE`. HTTP Mapping:
              503 Service Unavailable
            - >-
              Unrecoverable data loss or corruption. HTTP Mapping: 500 Internal
              Server Error
          type: string
          enum:
            - OK
            - CANCELLED
            - UNKNOWN
            - INVALID_ARGUMENT
            - DEADLINE_EXCEEDED
            - NOT_FOUND
            - ALREADY_EXISTS
            - PERMISSION_DENIED
            - UNAUTHENTICATED
            - RESOURCE_EXHAUSTED
            - FAILED_PRECONDITION
            - ABORTED
            - OUT_OF_RANGE
            - UNIMPLEMENTED
            - INTERNAL
            - UNAVAILABLE
            - DATA_LOSS
        warningLevel:
          type: string
          description: >-
            Warning level describes the severity and required action to suppress
            this warning when Firebase CLI run into it.
          enumDescriptions:
            - Warning level is not specified.
            - Display a warning without action needed.
            - Request a confirmation in interactive deployment flow.
            - Require an explicit confirmation in all deployment flows.
            - Require --force in all deployment flows.
          enum:
            - WARNING_LEVEL_UNKNOWN
            - LOG_ONLY
            - INTERACTIVE_ACK
            - REQUIRE_ACK
            - REQUIRE_FORCE
        file:
          type: string
          description: >-
            The source file name where the error occurred. Included only for
            `UpdateSchema` and `UpdateConnector`, it corresponds to `File.path`
            of the provided `Source`.
        debugDetails:
          description: >-
            More detailed error message to assist debugging. It contains
            application business logic that are inappropriate to leak publicly.
            In the emulator, SQL Connect API always includes it to assist local
            development and debugging. In the backend, ConnectorService always
            hides it. GraphqlService without impersonation always include it.
            GraphqlService with impersonation includes it only if explicitly
            opted-in with `include_debug_details` in `GraphqlRequestExtensions`.
          type: string
      type: object
      id: GraphqlErrorExtensions
      description: >-
        GraphqlErrorExtensions contains additional information of
        `GraphqlError`.
