components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    ClientCache:
      description: Client caching settings of a connector.
      id: ClientCache
      properties:
        entityIdIncluded:
          description: >-
            Optional. A field that, if true, means that responses served by this
            connector will include entityIds in GraphQL response extensions.
            This helps the client SDK cache responses in an improved way, known
            as "normalized caching", if caching is enabled on the client. Each
            entityId is a stable key based on primary key values. Therefore,
            this field should only be set to true if the primary keys of
            accessed tables do not contain sensitive information.
          type: boolean
        strictValidationEnabled:
          description: >-
            Optional. A field that, if true, enables stricter validation on the
            connector source code to make sure the operation response shapes are
            suitable for client-side caching. This can include additional errors
            and warnings. For example, using the same alias for different fields
            is disallowed, as it may cause conflicts or confusion with
            normalized caching. (This field is off by default for compatibility,
            but enabling it is highly recommended to catch common caching
            pitfalls.)
          type: boolean
      type: object
    CloudSqlInstance:
      description: Settings for CloudSQL instance configuration.
      id: CloudSqlInstance
      properties:
        edition:
          description: Output only. [Output only] The Cloud SQL instance edition.
          enum:
            - EDITION_UNSPECIFIED
            - EDITION_ENTERPRISE
            - EDITION_ENTERPRISE_PLUS
            - EDITION_DEVELOPER
          enumDescriptions:
            - Unspecified edition.
            - Enterprise edition.
            - Enterprise Plus edition.
            - Developer edition (includes AI Developer edition).
          readOnly: true
          type: string
        instance:
          description: >-
            Required. Name of the CloudSQL instance, in the format: ```
            projects/{project}/locations/{location}/instances/{instance} ```
          type: string
      type: object
    CodeChunk:
      description: A chunk of code.
      id: CodeChunk
      properties:
        code:
          description: Required. The code content string.
          type: string
        languageCode:
          description: >-
            Optional. Specifies the language if we expand support beyond GraphQL
            (e.g., SQL or JSON) The standard is BCP-47 language code.
          type: string
      type: object
    Connector:
      description: Connector consists of a set of operations, i.e. queries and mutations.
      id: Connector
      properties:
        annotations:
          additionalProperties:
            type: string
          description: Optional. Stores small amounts of arbitrary data.
          type: object
        clientCache:
          $ref: '#/components/schemas/ClientCache'
          description: Optional. The client cache settings of the connector.
        createTime:
          description: Output only. [Output only] Create time stamp.
          format: google-datetime
          readOnly: true
          type: string
        displayName:
          description: Optional. Mutable human-readable name. 63 character limit.
          type: string
        etag:
          description: >-
            Output only. This checksum is computed by the server based on the
            value of other fields, and may be sent on update and delete requests
            to ensure the client has an up-to-date value before proceeding.
            [AIP-154](https://google.aip.dev/154)
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Labels as key value pairs.
          type: object
        name:
          description: >-
            Identifier. The relative resource name of the connector, in the
            format: ```
            projects/{project}/locations/{location}/services/{service}/connectors/{connector}
            ```
          type: string
        reconciling:
          description: >-
            Output only. A field that if true, indicates that the system is
            working to compile and deploy the connector.
          readOnly: true
          type: boolean
        source:
          $ref: '#/components/schemas/Source'
          description: Required. The source files that comprise the connector.
        uid:
          description: Output only. System-assigned, unique identifier.
          readOnly: true
          type: string
        updateTime:
          description: Output only. [Output only] Update time stamp.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    DataConnectProperties:
      description: SQL Connect specific properties for a path under response.data.
      id: DataConnectProperties
      properties:
        entityId:
          description: A single Entity ID. Set if the path points to a single entity.
          type: string
        entityIds:
          description: >-
            A list of Entity IDs. Set if the path points to an array of
            entities. An ID is present for each element of the array at the
            corresponding index.
          items:
            type: string
          type: array
        maxAge:
          description: >-
            The server-suggested duration before data under path is considered
            stale.
          format: google-duration
          type: string
        path:
          description: >-
            The path under response.data where the rest of the fields apply.
            Each element may be a string (field name) or number (array index).
            The root of response.data is denoted by the empty list `[]`.
          items:
            type: any
          type: array
      type: object
    Datasource:
      description: A data source that backs Firebase SQL Connect services.
      id: Datasource
      properties:
        httpGraphql:
          $ref: '#/components/schemas/HttpGraphql'
          description: HTTP GraphQL server webhook configurations.
        postgresql:
          $ref: '#/components/schemas/PostgreSql'
          description: PostgreSQL configurations.
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    ExecuteMutationRequest:
      description: The ExecuteMutation request to Firebase SQL Connect.
      id: ExecuteMutationRequest
      properties:
        operationName:
          description: >-
            Required. The name of the GraphQL operation name. Required because
            all Connector operations must be named. See
            https://graphql.org/learn/queries/#operation-name.
          type: string
        variables:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: Optional. Values for GraphQL variables provided in this request.
          type: object
      type: object
    ExecuteMutationResponse:
      description: The ExecuteMutation response from Firebase SQL Connect.
      id: ExecuteMutationResponse
      properties:
        data:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: The result of executing the requested operation.
          type: object
        errors:
          description: Errors of this response.
          items:
            $ref: '#/components/schemas/GraphqlError'
          type: array
        extensions:
          $ref: '#/components/schemas/GraphqlResponseExtensions'
          description: Additional response information.
      type: object
    ExecuteQueryRequest:
      description: The ExecuteQuery request to Firebase SQL Connect.
      id: ExecuteQueryRequest
      properties:
        operationName:
          description: >-
            Required. The name of the GraphQL operation name. Required because
            all Connector operations must be named. See
            https://graphql.org/learn/queries/#operation-name.
          type: string
        variables:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: Optional. Values for GraphQL variables provided in this request.
          type: object
      type: object
    ExecuteQueryResponse:
      description: The ExecuteQuery response from Firebase SQL Connect.
      id: ExecuteQueryResponse
      properties:
        data:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: The result of executing the requested operation.
          type: object
        errors:
          description: Errors of this response.
          items:
            $ref: '#/components/schemas/GraphqlError'
          type: array
        extensions:
          $ref: '#/components/schemas/GraphqlResponseExtensions'
          description: Additional response information.
      type: object
    File:
      description: Individual files.
      id: File
      properties:
        content:
          description: Required. The file's textual content.
          type: string
        path:
          description: >-
            Required. The file name including folder path, if applicable. The
            path should be relative to a local workspace (e.g.
            dataconnect/(schema|connector)/*.gql) and not an absolute path (e.g.
            /absolute/path/(schema|connector)/*.gql).
          type: string
      type: object
    GenerateQueryRequest:
      description: Request message for GenerateQuery.
      id: GenerateQueryRequest
      properties:
        prompt:
          description: >-
            Required. The natural language description of the desired query.
            Example: "Find all users who signed up in the last 7 days."
          type: string
        schemas:
          description: >-
            Optional. The user's locally defined FDC Schema(s). If not defined,
            the backend will fetch the user's deployed schema.
          items:
            $ref: '#/components/schemas/Schema'
          type: array
      type: object
    GenerateQueryResponse:
      description: Output for streaming generate query requests
      id: GenerateQueryResponse
      properties:
        part:
          $ref: '#/components/schemas/Part'
          description: Required. The content from the current conversational turn.
        status:
          $ref: '#/components/schemas/GenerationStatus'
          description: >-
            Essential for providing responsive UI feedback (e.g., a spinner or
            "Analyzing schema..." step).
      type: object
    GenerateSchemaRequest:
      description: Request message for GenerateSchema.
      id: GenerateSchemaRequest
      properties:
        prompt:
          description: >-
            Required. The natural language description of the data model to
            generate. Example: "A blog system with Users, Posts, and Comments.
            Users can have multiple posts."
          type: string
      type: object
    GenerateSchemaResponse:
      description: Output for streaming generate schema requests
      id: GenerateSchemaResponse
      properties:
        part:
          $ref: '#/components/schemas/Part'
          description: The content from the current conversational turn.
        status:
          $ref: '#/components/schemas/GenerationStatus'
          description: >-
            Essential for providing responsive UI feedback (e.g., a spinner or
            "Analyzing schema..." step).
      type: object
    GenerationStatus:
      description: Represents the progress of the server side generation request.
      id: GenerationStatus
      properties:
        message:
          description: Output only. A message providing more details about the state.
          readOnly: true
          type: string
        state:
          description: Output only. The state of generation.
          enum:
            - STATE_UNSPECIFIED
            - ANALYZING_CODE
            - GENERATING_CODE
            - COMPLETED
          enumDescriptions:
            - Unspecified state.
            - The agent is analyzing schema or operations.
            - The agent is generating code
            - Generation is complete.
          readOnly: true
          type: string
      type: object
    GraphqlError:
      description: >-
        GraphqlError conforms to the GraphQL error spec.
        https://spec.graphql.org/draft/#sec-Errors Firebase SQL Connect API
        surfaces `GraphqlError` in various APIs: - Upon compile error,
        `UpdateSchema` and `UpdateConnector` return Code.Invalid_Argument with a
        list of `GraphqlError` in error details. - Upon query compile error,
        `ExecuteGraphql`, `ExecuteGraphqlRead` and `IntrospectGraphql` return
        Code.OK with a list of `GraphqlError` in response body. - Upon query
        execution error, `ExecuteGraphql`, `ExecuteGraphqlRead`,
        `ExecuteMutation`, `ExecuteQuery`, `IntrospectGraphql`,
        `ImpersonateQuery` and `ImpersonateMutation` all return Code.OK with a
        list of `GraphqlError` in response body.
      id: GraphqlError
      properties:
        extensions:
          $ref: '#/components/schemas/GraphqlErrorExtensions'
          description: Additional error information.
        locations:
          description: >-
            The source locations where the error occurred. Locations should help
            developers and toolings identify the source of error quickly.
            Included in admin endpoints (`ExecuteGraphql`, `ExecuteGraphqlRead`,
            `IntrospectGraphql`, `ImpersonateQuery`, `ImpersonateMutation`,
            `UpdateSchema` and `UpdateConnector`) to reference the provided
            GraphQL GQL document. Omitted in `ExecuteMutation` and
            `ExecuteQuery` since the caller shouldn't have access access the
            underlying GQL source.
          items:
            $ref: '#/components/schemas/SourceLocation'
          type: array
        message:
          description: >-
            The detailed error message. The message should help developer
            understand the underlying problem without leaking internal data.
          type: string
        path:
          description: >-
            The result field which could not be populated due to error. Clients
            can use path to identify whether a null result is intentional or
            caused by a runtime error. It should be a list of string or index
            from the root of GraphQL query document.
          items:
            type: any
          type: array
      type: object
    GraphqlErrorExtensions:
      description: >-
        GraphqlErrorExtensions contains additional information of
        `GraphqlError`.
      id: GraphqlErrorExtensions
      properties:
        code:
          description: >-
            Maps to canonical gRPC codes. If not specified, it represents
            `Code.INTERNAL`.
          enum:
            - OK
            - CANCELLED
            - UNKNOWN
            - INVALID_ARGUMENT
            - DEADLINE_EXCEEDED
            - NOT_FOUND
            - ALREADY_EXISTS
            - PERMISSION_DENIED
            - UNAUTHENTICATED
            - RESOURCE_EXHAUSTED
            - FAILED_PRECONDITION
            - ABORTED
            - OUT_OF_RANGE
            - UNIMPLEMENTED
            - INTERNAL
            - UNAVAILABLE
            - DATA_LOSS
          enumDescriptions:
            - 'Not an error; returned on success. HTTP Mapping: 200 OK'
            - >-
              The operation was cancelled, typically by the caller. HTTP
              Mapping: 499 Client Closed Request
            - >-
              Unknown error. For example, this error may be returned when a
              `Status` value received from another address space belongs to an
              error space that is not known in this address space. Also errors
              raised by APIs that do not return enough error information may be
              converted to this error. HTTP Mapping: 500 Internal Server Error
            - >-
              The client specified an invalid argument. Note that this differs
              from `FAILED_PRECONDITION`. `INVALID_ARGUMENT` indicates arguments
              that are problematic regardless of the state of the system (e.g.,
              a malformed file name). HTTP Mapping: 400 Bad Request
            - >-
              The deadline expired before the operation could complete. For
              operations that change the state of the system, this error may be
              returned even if the operation has completed successfully. For
              example, a successful response from a server could have been
              delayed long enough for the deadline to expire. HTTP Mapping: 504
              Gateway Timeout
            - >-
              Some requested entity (e.g., file or directory) was not found.
              Note to server developers: if a request is denied for an entire
              class of users, such as gradual feature rollout or undocumented
              allowlist, `NOT_FOUND` may be used. If a request is denied for
              some users within a class of users, such as user-based access
              control, `PERMISSION_DENIED` must be used. HTTP Mapping: 404 Not
              Found
            - >-
              The entity that a client attempted to create (e.g., file or
              directory) already exists. HTTP Mapping: 409 Conflict
            - >-
              The caller does not have permission to execute the specified
              operation. `PERMISSION_DENIED` must not be used for rejections
              caused by exhausting some resource (use `RESOURCE_EXHAUSTED`
              instead for those errors). `PERMISSION_DENIED` must not be used if
              the caller can not be identified (use `UNAUTHENTICATED` instead
              for those errors). This error code does not imply the request is
              valid or the requested entity exists or satisfies other
              pre-conditions. HTTP Mapping: 403 Forbidden
            - >-
              The request does not have valid authentication credentials for the
              operation. HTTP Mapping: 401 Unauthorized
            - >-
              Some resource has been exhausted, perhaps a per-user quota, or
              perhaps the entire file system is out of space. HTTP Mapping: 429
              Too Many Requests
            - >-
              The operation was rejected because the system is not in a state
              required for the operation's execution. For example, the directory
              to be deleted is non-empty, an rmdir operation is applied to a
              non-directory, etc. Service implementors can use the following
              guidelines to decide between `FAILED_PRECONDITION`, `ABORTED`, and
              `UNAVAILABLE`: (a) Use `UNAVAILABLE` if the client can retry just
              the failing call. (b) Use `ABORTED` if the client should retry at
              a higher level. For example, when a client-specified test-and-set
              fails, indicating the client should restart a read-modify-write
              sequence. (c) Use `FAILED_PRECONDITION` if the client should not
              retry until the system state has been explicitly fixed. For
              example, if an "rmdir" fails because the directory is non-empty,
              `FAILED_PRECONDITION` should be returned since the client should
              not retry unless the files are deleted from the directory. HTTP
              Mapping: 400 Bad Request
            - >-
              The operation was aborted, typically due to a concurrency issue
              such as a sequencer check failure or transaction abort. See the
              guidelines above for deciding between `FAILED_PRECONDITION`,
              `ABORTED`, and `UNAVAILABLE`. HTTP Mapping: 409 Conflict
            - >-
              The operation was attempted past the valid range. E.g., seeking or
              reading past end-of-file. Unlike `INVALID_ARGUMENT`, this error
              indicates a problem that may be fixed if the system state changes.
              For example, a 32-bit file system will generate `INVALID_ARGUMENT`
              if asked to read at an offset that is not in the range [0,2^32-1],
              but it will generate `OUT_OF_RANGE` if asked to read from an
              offset past the current file size. There is a fair bit of overlap
              between `FAILED_PRECONDITION` and `OUT_OF_RANGE`. We recommend
              using `OUT_OF_RANGE` (the more specific error) when it applies so
              that callers who are iterating through a space can easily look for
              an `OUT_OF_RANGE` error to detect when they are done. HTTP
              Mapping: 400 Bad Request
            - >-
              The operation is not implemented or is not supported/enabled in
              this service. HTTP Mapping: 501 Not Implemented
            - >-
              Internal errors. This means that some invariants expected by the
              underlying system have been broken. This error code is reserved
              for serious errors. HTTP Mapping: 500 Internal Server Error
            - >-
              The service is currently unavailable. This is most likely a
              transient condition, which can be corrected by retrying with a
              backoff. Note that it is not always safe to retry non-idempotent
              operations. See the guidelines above for deciding between
              `FAILED_PRECONDITION`, `ABORTED`, and `UNAVAILABLE`. HTTP Mapping:
              503 Service Unavailable
            - >-
              Unrecoverable data loss or corruption. HTTP Mapping: 500 Internal
              Server Error
          type: string
        debugDetails:
          description: >-
            More detailed error message to assist debugging. It contains
            application business logic that are inappropriate to leak publicly.
            In the emulator, SQL Connect API always includes it to assist local
            development and debugging. In the backend, ConnectorService always
            hides it. GraphqlService without impersonation always include it.
            GraphqlService with impersonation includes it only if explicitly
            opted-in with `include_debug_details` in `GraphqlRequestExtensions`.
          type: string
        file:
          description: >-
            The source file name where the error occurred. Included only for
            `UpdateSchema` and `UpdateConnector`, it corresponds to `File.path`
            of the provided `Source`.
          type: string
        warningLevel:
          description: >-
            Warning level describes the severity and required action to suppress
            this warning when Firebase CLI run into it.
          enum:
            - WARNING_LEVEL_UNKNOWN
            - LOG_ONLY
            - INTERACTIVE_ACK
            - REQUIRE_ACK
            - REQUIRE_FORCE
          enumDescriptions:
            - Warning level is not specified.
            - Display a warning without action needed.
            - Request a confirmation in interactive deployment flow.
            - Require an explicit confirmation in all deployment flows.
            - Require --force in all deployment flows.
          type: string
        workarounds:
          description: >-
            Workarounds provide suggestions to address the compile errors or
            warnings.
          items:
            $ref: '#/components/schemas/Workaround'
          type: array
      type: object
    GraphqlRequest:
      description: >-
        The GraphQL request to Firebase SQL Connect. It strives to match the
        GraphQL over HTTP spec.
        https://github.com/graphql/graphql-over-http/blob/main/spec/GraphQLOverHTTP.md#post
      id: GraphqlRequest
      properties:
        extensions:
          $ref: '#/components/schemas/GraphqlRequestExtensions'
          description: Optional. Additional GraphQL request information.
        operationName:
          description: >-
            Optional. The name of the GraphQL operation name. Required only if
            `query` contains multiple operations. See
            https://graphql.org/learn/queries/#operation-name.
          type: string
        query:
          description: Required. The GraphQL query document source.
          type: string
        variables:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: Optional. Values for GraphQL variables provided in this request.
          type: object
      type: object
    GraphqlRequestExtensions:
      description: >-
        GraphqlRequestExtensions contains additional information of
        `GraphqlRequest`.
      id: GraphqlRequestExtensions
      properties:
        impersonate:
          $ref: '#/components/schemas/Impersonation'
          description: >-
            Optional. If set, impersonate a request with given Firebase Auth
            context and evaluate the auth policies on the operation. If omitted,
            bypass any defined auth policies.
      type: object
    GraphqlResponse:
      description: >-
        The GraphQL response from Firebase SQL Connect. It strives to match the
        GraphQL over HTTP spec. Note: Firebase SQL Connect always responds with
        `Content-Type: application/json`.
        https://github.com/graphql/graphql-over-http/blob/main/spec/GraphQLOverHTTP.md#body
      id: GraphqlResponse
      properties:
        data:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            The result of the execution of the requested operation. If an error
            was raised before execution begins, the data entry should not be
            present in the result. (a request error:
            https://spec.graphql.org/draft/#sec-Errors.Request-Errors) If an
            error was raised during the execution that prevented a valid
            response, the data entry in the response should be null. (a field
            error:
            https://spec.graphql.org/draft/#sec-Errors.Error-Result-Format)
          type: object
        errors:
          description: >-
            Errors of this response. If the data entry in the response is not
            present, the errors entry must be present. It conforms to
            https://spec.graphql.org/draft/#sec-Errors .
          items:
            $ref: '#/components/schemas/GraphqlError'
          type: array
        extensions:
          $ref: '#/components/schemas/GraphqlResponseExtensions'
          description: >-
            Additional response information. It conforms to
            https://spec.graphql.org/draft/#sec-Extensions .
      type: object
    GraphqlResponseExtensions:
      description: >-
        GraphqlResponseExtensions contains additional information of
        `GraphqlResponse` or `ExecuteQueryResponse`.
      id: GraphqlResponseExtensions
      properties:
        dataConnect:
          description: >-
            SQL Connect specific GraphQL extension, a list of paths and
            properties.
          items:
            $ref: '#/components/schemas/DataConnectProperties'
          type: array
      type: object
    HttpGraphql:
      description: Settings for HTTP GraphQL server webhook.
      id: HttpGraphql
      properties:
        timeout:
          description: Optional. Timeout duration for the HTTP request.
          format: google-duration
          type: string
        uri:
          description: Required. The endpoint of the HTTP GraphQL server.
          type: string
      type: object
    ImpersonateRequest:
      description: The Impersonate request to Firebase SQL Connect.
      id: ImpersonateRequest
      properties:
        extensions:
          $ref: '#/components/schemas/GraphqlRequestExtensions'
          description: Optional. Additional GraphQL request information.
        operationName:
          description: >-
            Required. The name of the GraphQL operation name. Required because
            all Connector operations must be named. See
            https://graphql.org/learn/queries/#operation-name.
          type: string
        variables:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: Optional. Values for GraphQL variables provided in this request.
          type: object
      type: object
    Impersonation:
      description: Impersonation configures the Firebase Auth context to impersonate.
      id: Impersonation
      properties:
        authClaims:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Evaluate the auth policy with a customized JWT auth token. Should
            follow the Firebase Auth token format.
            https://firebase.google.com/docs/rules/rules-and-auth For example: a
            verified user may have auth_claims of {"sub": , "email_verified":
            true}
          type: object
        includeDebugDetails:
          description: Optional. If set, include debug details in GraphQL error extensions.
          type: boolean
        unauthenticated:
          description: >-
            Evaluate the auth policy as an unauthenticated request. Can only be
            set to true.
          type: boolean
      type: object
    ListConnectorsResponse:
      description: >-
        Message for response to listing Connectors. By default,
        `connectors.source` will not be included in the response. To specify the
        fields included in the response, the response field mask can be provided
        by using the query parameter `$fields` or the header `X-Goog-FieldMask`.
      id: ListConnectorsResponse
      properties:
        connectors:
