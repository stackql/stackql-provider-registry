    PostgreSql:
      description: Settings for PostgreSQL data source.
      id: PostgreSql
      properties:
        cloudSql:
          $ref: '#/components/schemas/CloudSqlInstance'
          description: Cloud SQL configurations.
        database:
          description: Required. Name of the PostgreSQL database.
          type: string
        ephemeral:
          description: >-
            Output only. Ephemeral is true if this SQL Connect service is served
            from temporary in-memory emulation of Postgres. While Cloud SQL is
            being provisioned, the SQL Connect service provides the ephemeral
            service to help developers get started. Once the Cloud SQL is
            provisioned, SQL Connect service will transfer its data on a
            best-effort basis to the Cloud SQL instance. WARNING: Ephemeral data
            sources will expire after 24 hour. The data will be lost if they
            aren't transferred to the Cloud SQL instance. WARNING: When
            `ephemeral=true`, mutations to the database are not guaranteed to be
            durably persisted, even if an OK status code is returned. All or
            parts of the data may be lost or reverted to earlier versions.
          readOnly: true
          type: boolean
        schema:
          description: >-
            Optional. User-configured PostgreSQL schema. Defaults to "public" if
            not specified.
          type: string
        schemaMigration:
          description: >-
            Optional. Configure how to perform automatic PostgreSQL schema
            migration before deploying the FDC schema. This is an additive-only
            operation.
          enum:
            - SQL_SCHEMA_MIGRATION_UNSPECIFIED
            - MIGRATE_COMPATIBLE
          enumDescriptions:
            - Unspecified SQL schema migration.
            - >-
              Waits for the Cloud SQL instance to be provisioned and
              automatically creates necessary SQL resources (tables, columns,
              etc.) to match the desired FDC schema. This operation is strictly
              additive and executes as a Long-Running Operation during
              provisioning. Rejects migrations on a non-empty existing SQL
              schema.
          type: string
        schemaValidation:
          description: >-
            Optional. Configure how much PostgreSQL schema validation to perform
            against the live database before deploying the FDC schema.
          enum:
            - SQL_SCHEMA_VALIDATION_UNSPECIFIED
            - NONE
            - STRICT
            - COMPATIBLE
          enumDescriptions:
            - Unspecified SQL schema validation. Defaults to STRICT.
            - >-
              Skips SQL schema validation. Deployment succeeds even if the
              database is pending provisioning, unavailable, or incompatible.
              Under NONE, newly created services route requests to a temporary
              ephemeral database (in-memory emulation) so the API can be tested
              immediately. Ephemeral data expires after 24 hours unless
              successfully validated or migrated to a linked database.
            - >-
              Connects to the SQL database and validates that the SQL DDL
              matches the FDC schema exactly. Any discrepancies (extra or
              missing tables/columns) result in a FAILED_PRECONDITION error with
              required SQL diffs. Recommended for greenfield projects to ensure
              full schema consistency.
            - >-
              Connects to the SQL database and validates that it contains all
              the SQL resources required by the FDC schema. Succeeds even if the
              database contains additional tables or columns not used by FDC.
              Suitable when sharing a database with other tools or legacy
              applications.
          type: string
        unlinked:
          deprecated: true
          description: >-
            No Postgres data source is linked. If set, don't allow `database`
            and `schema_validation` to be configured.
          type: boolean
      type: object
