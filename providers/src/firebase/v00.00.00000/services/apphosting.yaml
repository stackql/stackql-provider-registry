          items:
            type: string
          type: array
      type: object
    ListBuildsResponse:
      description: Message for response to list builds.
      id: ListBuildsResponse
      properties:
        builds:
          description: The list of builds.
          items:
            $ref: '#/components/schemas/Build'
          type: array
        nextPageToken:
          description: >-
            A token identifying the next page of results the server should
            return.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListDomainsResponse:
      description: Message for response to list domains.
      id: ListDomainsResponse
      properties:
        domains:
          description: Output only. The list of domains.
          items:
            $ref: '#/components/schemas/Domain'
          readOnly: true
          type: array
        nextPageToken:
          description: >-
            Output only. A token identifying the next page of results the server
            should return.
          readOnly: true
          type: string
        unreachable:
          description: Output only. Locations that could not be reached.
          items:
            type: string
          readOnly: true
          type: array
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
