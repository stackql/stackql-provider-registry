  url: https://firebase.google.com/docs/app-hosting
info:
  contact:
    email: info@stackql.io
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
  description: >-
    Firebase App Hosting streamlines the development and deployment of dynamic
    Next.js and Angular applications, offering built-in framework support,
    GitHub integration, and integration with other Firebase products. You can
    use this API to intervene in the Firebase App Hosting build process and add
    custom functionality not supported in our default Console & CLI flows,
    including triggering builds from external CI/CD workflows or deploying from
    pre-built container images. 
  title: Firebase App Hosting API
  version: v1
  x-discovery-doc-revision: '20260813'
  x-generated-date: '2026-08-20'
openapi: 3.1.0
paths:
  /v1/projects/{projectsId}/locations:
    get:
      description: >-
        Lists information about the supported locations for this service. This
        method lists locations based on the resource scope provided in the
        ListLocationsRequest.name field: * **Global locations**: If `name` is
        empty, the method lists the public locations available to all projects.
        * **Project-specific locations**: If `name` follows the format
        `projects/{project}`, the method lists locations visible to that
        specific project. This includes public, private, or other
        project-specific locations enabled for the project. For gRPC and client
        library implementations, the resource name is passed as the `name`
        field. For direct service calls, the resource name is incorporated into
        the request path based on the specific service implementation and
        version.
      operationId: firebaseapphosting.projects.locations.list
      parameters:
        - in: path
          name: projectsId
          required: true
          schema:
            type: string
        - in: query
          name: extraLocationTypes
          schema:
            type: string
        - in: query
          name: filter
          schema:
            type: string
        - in: query
          name: pageSize
          schema:
            format: int32
            type: integer
        - in: query
          name: pageToken
