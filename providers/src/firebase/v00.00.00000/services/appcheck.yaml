openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Firebase App Check API
  description: >-
    Firebase App Check works alongside other Firebase services to help protect
    your backend resources from abuse, such as billing fraud or phishing.
  version: v1
  x-discovery-doc-revision: '20260725'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://firebase.google.com/docs/app-check
servers:
  - url: https://firebaseappcheck.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
            https://www.googleapis.com/auth/firebase: View and administer all your Firebase data and settings
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    GoogleFirebaseAppcheckV1ResourcePolicy:
      type: object
      properties:
        targetResource:
          type: string
          description: >-
            Required. Service specific name of the resource object to which this
            policy applies, in the format: * **iOS OAuth clients** (Google
            Identity for iOS):
            `//oauth2.googleapis.com/projects/{project_number}/oauthClients/{oauth_client_id}`
            Note that the resource must belong to the service specified in the
            `name` and be from the same project as this policy, but the resource
            is allowed to be missing at the time of creation of this policy; in
            that case, we make a best-effort attempt at respecting this policy,
            but it may not have any effect until the resource is fully created.
        etag:
          type: string
          description: >-
            This checksum is computed by the server based on the value of other
            fields, and may be sent on update and delete requests to ensure the
            client has an up-to-date value before proceeding. This etag is
            strongly validated as defined by RFC 7232.
        enforcementMode:
          type: string
          enumDescriptions:
            - >-
              When a particular protection is set to this mode, that protection
              is not applied for the service or resource, nor are metrics
              related to that protection collected. Though the relevant App
              Check protection is not applied, other applicable protections
              outside of App Check, such as user authorization, are still
              applied. An unconfigured EnforcementMode is in this mode by
              default.
            - >-
              When a particular protection is set to this mode, that protection
              is not enforced for the service or resource. Metrics related to
              that protection are collected to help you decide when to turn on
              enforcement. These metrics will show the portion of traffic that
              is deemed invalid by that protection, but that traffic will not be
              rejected until you turn on enforcement. This `UNENFORCED` mode is
              also known as monitoring-only mode. Though the relevant App Check
              protection is not enforced, other applicable protections outside
              of App Check, such as user authorization, are still applied. Some
              services require certain conditions to be met before they will
              work with App Check, such as requiring you to upgrade to a
              specific service tier. Until those requirements are met for a
              service, this `UNENFORCED` setting will have no effect and App
              Check will not work with that service.
            - >-
              When a particular protection is set to this mode, that protection
              is enforced for the service or resource. It will reject any
              traffic not accompanied by an App Check token that it deems valid.
              There are some exceptions depending on the service; for example,
              some services will still allow requests bearing the developer's
              privileged service account credentials without an App Check token.
              App Check metrics continue to be collected to help you detect
              issues with your App Check integration and monitor the composition
              of your callers. While the service is protected by App Check,
              other applicable protections outside of App Check, such as user
              authorization, continue to be applied at the same time. Use
              caution when choosing to enforce App Check protections. If your
              users have not updated to a version of your app that meets the
              requirements of the relevant App Check protection, their app may
              stop working. App Check metrics can help you decide when to
              enforce that protection on your services and resources. If you
              have not yet published your app, you should enable enforcement as
              soon as you verify that your App Check implementation is correct,
              since there are no outdated clients in use. Some services require
              certain conditions to be met before they will work with App Check,
              such as requiring you to upgrade to a specific service tier. Until
              those requirements are met for a service, this `ENFORCED` setting
              will have no effect and App Check will not work with that service.
          description: >-
            Required. The baseline protection EnforcementMode for this resource.
            This will override the service-level baseline protection
            EnforcementMode.
          enum:
            - 'OFF'
            - UNENFORCED
            - ENFORCED
        updateTime:
          description: >-
            Output only. Timestamp when this resource policy configuration
            object was most recently updated.
          readOnly: true
          format: google-datetime
          type: string
        name:
          type: string
          description: >-
            Required. Identifier. The relative name of the resource policy
            object, in the format: ```
            projects/{project_number}/services/{service_id}/resourcePolicies/{resource_policy_id}
            ``` Note that the `service_id` element must be a supported service
            ID. Currently, the following service IDs are supported: *
            `oauth2.googleapis.com` (Google Identity for iOS)
            `resource_policy_id` is a system-generated UID.
      id: GoogleFirebaseAppcheckV1ResourcePolicy
      description: >-
        App Check enforcement policy for a specific resource of a Google service
        supported by App Check. Note that this policy will override the
        service-level configuration.
    GoogleFirebaseAppcheckV1GenerateAppAttestChallengeRequest:
      type: object
      properties: {}
      description: Request message for the GenerateAppAttestChallenge method.
      id: GoogleFirebaseAppcheckV1GenerateAppAttestChallengeRequest
    GoogleFirebaseAppcheckV1ExchangeAppAttestAttestationResponse:
      description: Response message for the ExchangeAppAttestAttestation method.
      id: GoogleFirebaseAppcheckV1ExchangeAppAttestAttestationResponse
      type: object
      properties:
        artifact:
          description: >-
            An artifact that can be used in future calls to
            ExchangeAppAttestAssertion.
          format: byte
          type: string
        appCheckToken:
          description: Encapsulates an App Check token.
          $ref: '#/components/schemas/GoogleFirebaseAppcheckV1AppCheckToken'
    GoogleFirebaseAppcheckV1DebugToken:
      type: object
      properties:
        name:
          type: string
          description: >-
            Required. The relative resource name of the debug token, in the
            format: ```
            projects/{project_number}/apps/{app_id}/debugTokens/{debug_token_id}
            ```
        displayName:
          description: >-
            Required. A human readable display name used to identify this debug
            token.
          type: string
        etag:
          type: string
          description: >-
            Optional. This checksum is computed by the server based on the value
            of other fields, and may be sent on update and delete requests to
            ensure the client has an up-to-date value before proceeding. This
            etag is strongly validated as defined by RFC 7232.
        token:
          description: >-
            Required. Input only. Immutable. The secret token itself. Must be
            provided during creation, and must be a UUID4, case insensitive.
            This field is immutable once set, and cannot be provided during a
            UpdateDebugToken request. You can, however, delete this debug token
            using DeleteDebugToken to revoke it. For security reasons, this
            field will never be populated in any response.
          type: string
        updateTime:
          type: string
          description: >-
            Output only. Timestamp when this debug token was most recently
            updated.
          readOnly: true
          format: google-datetime
      id: GoogleFirebaseAppcheckV1DebugToken
      description: >-
        A *debug token* is a secret used during the development or integration
        testing of an app. It essentially allows the development or integration
        testing to bypass app attestation while still allowing App Check to
        enforce protection on supported production Firebase services.
    GoogleFirebaseAppcheckV1PlayIntegrityConfig:
      description: >-
        An app's Play Integrity configuration object. This configuration
        controls certain properties of the `AppCheckToken` returned by
        ExchangePlayIntegrityToken, such as its ttl. Note that your registered
        SHA-256 certificate fingerprints are used to validate tokens issued by
        the Play Integrity API; please register them via the Firebase Console or
        programmatically via the [Firebase Management
        Service](https://firebase.google.com/docs/projects/api/reference/rest/v1beta1/projects.androidApps.sha/create).
      id: GoogleFirebaseAppcheckV1PlayIntegrityConfig
      type: object
      properties:
        tokenTtl:
          type: string
          description: >-
            Specifies the duration for which App Check tokens exchanged from
            Play Integrity tokens will be valid. If unset, a default value of 1
            hour is assumed. Must be between 30 minutes and 7 days, inclusive.
          format: google-duration
        name:
          description: >-
            Required. The relative resource name of the Play Integrity
            configuration object, in the format: ```
            projects/{project_number}/apps/{app_id}/playIntegrityConfig ```
          type: string
        deviceIntegrity:
          description: >-
            Specifies device integrity requirements for Android devices running
            your app. These settings correspond to requirements on the [**device
            integrity**
            field](https://developer.android.com/google/play/integrity/verdicts#device-integrity-field)
            obtained from the Play Integrity API. See the [default responses
            table](https://developer.android.com/google/play/integrity/setup#default)
            for a quick summary. Warning: There are also
            [conditional](https://developer.android.com/google/play/integrity/setup#conditional)
            as well as
            [optional](https://developer.android.com/google/play/integrity/setup#optional_device_information)
            responses that you can receive, but requires additional explicit
            opt-in from you. The App Check API is **not** responsible for any
            such opt-ins. The default values for these settings work for most
            apps, and are recommended.
          $ref: >-
            #/components/schemas/GoogleFirebaseAppcheckV1PlayIntegrityConfigDeviceIntegrity
        appIntegrity:
          description: >-
            Specifies application integrity requirements for Android devices
            running your app. These settings correspond to requirements on the
            [**application integrity**
            field](https://developer.android.com/google/play/integrity/verdicts#application-integrity-field)
            obtained from the Play Integrity API. See the [default responses
            table](https://developer.android.com/google/play/integrity/setup#default)
            for a quick summary. The default values for these settings work for
            most apps, and are recommended.
          $ref: >-
            #/components/schemas/GoogleFirebaseAppcheckV1PlayIntegrityConfigAppIntegrity
        accountDetails:
          description: >-
            Specifies account requirements for Android devices running your app.
            These settings correspond to requirements on the [**account
            details**
            field](https://developer.android.com/google/play/integrity/verdicts#account-details-field)
            obtained from the Play Integrity API. See the [default responses
            table](https://developer.android.com/google/play/integrity/setup#default)
            for a quick summary. The default values for these settings work for
            most apps, and are recommended.
          $ref: >-
            #/components/schemas/GoogleFirebaseAppcheckV1PlayIntegrityConfigAccountDetails
    GoogleFirebaseAppcheckV1PlayIntegrityConfigAccountDetails:
      type: object
      properties:
        requireLicensed:
          description: >-
            Specifies whether the caller must have received the [`LICENSED`
            verdict](https://developer.android.com/google/play/integrity/verdicts#account-details-field).
            For additional details about scenarios where your users will receive
            this `LICENSED` label, see [the default responses
            table](https://developer.android.com/google/play/integrity/setup#default).
            If set to `true`, apps without the `LICENSED` app licensing verdict
            will be rejected. If set to `false`, any app licensing verdict is
            allowed. The default value is `false`.
          type: boolean
      id: GoogleFirebaseAppcheckV1PlayIntegrityConfigAccountDetails
      description: >-
        A settings object specifying account requirements for Android devices
        running your app. These settings correspond to requirements on the
        [**account details**
        field](https://developer.android.com/google/play/integrity/verdicts#account-details-field)
        obtained from the Play Integrity API. See the [default responses
        table](https://developer.android.com/google/play/integrity/setup#default)
        for a quick summary. The default values for these settings work for most
        apps, and are recommended.
    GoogleFirebaseAppcheckV1PublicJwk:
      type: object
      properties:
        alg:
          type: string
          description: >-
            See [section 4.4 of RFC
            7517](https://tools.ietf.org/html/rfc7517#section-4.4).
        kty:
          description: >-
            See [section 4.1 of RFC
            7517](https://tools.ietf.org/html/rfc7517#section-4.1).
          type: string
        'n':
          description: >-
            See [section 6.3.1.1 of RFC
            7518](https://tools.ietf.org/html/rfc7518#section-6.3.1.1).
          type: string
        use:
          description: >-
            See [section 4.2 of RFC
            7517](https://tools.ietf.org/html/rfc7517#section-4.2).
          type: string
        kid:
          description: >-
            See [section 4.5 of RFC
            7517](https://tools.ietf.org/html/rfc7517#section-4.5).
          type: string
        e:
          description: >-
            See [section 6.3.1.2 of RFC
            7518](https://tools.ietf.org/html/rfc7518#section-6.3.1.2).
          type: string
      description: >-
        A JWK as specified by [section 4 of RFC
        7517](https://tools.ietf.org/html/rfc7517#section-4) and [section 6.3.1
        of RFC 7518](https://tools.ietf.org/html/rfc7518#section-6.3.1).
      id: GoogleFirebaseAppcheckV1PublicJwk
    GoogleFirebaseAppcheckV1DeviceCheckConfig:
      type: object
      properties:
        tokenTtl:
          type: string
          description: >-
            Specifies the duration for which App Check tokens exchanged from
            DeviceCheck tokens will be valid. If unset, a default value of 1
            hour is assumed. Must be between 30 minutes and 7 days, inclusive.
          format: google-duration
        privateKeySet:
          type: boolean
          description: >-
            Output only. Whether the `private_key` field was previously set.
            Since we will never return the `private_key` field, this field is
            the only way to find out whether it was previously set.
          readOnly: true
        keyId:
          description: >-
            Required. The key identifier of a private key enabled with
            DeviceCheck, created in your Apple Developer account.
          type: string
        privateKey:
          description: >-
            Required. Input only. The contents of the private key (`.p8`) file
            associated with the key specified by `key_id`. For security reasons,
            this field will never be populated in any response.
          type: string
        name:
          type: string
          description: >-
            Required. The relative resource name of the DeviceCheck
            configuration object, in the format: ```
            projects/{project_number}/apps/{app_id}/deviceCheckConfig ```
      description: >-
        An app's DeviceCheck configuration object. This configuration is used by
        ExchangeDeviceCheckToken to validate device tokens issued to apps by
        DeviceCheck. It also controls certain properties of the returned
        `AppCheckToken`, such as its ttl. Note that the Team ID registered with
        your app is used as part of the validation process. Please register it
        via the Firebase Console or programmatically via the [Firebase
        Management
        Service](https://firebase.google.com/docs/projects/api/reference/rest/v11/projects.iosApps/patch).
      id: GoogleFirebaseAppcheckV1DeviceCheckConfig
    GoogleFirebaseAppcheckV1Service:
      type: object
      properties:
        etag:
          description: >-
            Optional. This checksum is computed by the server based on the value
            of other fields, and may be sent on update and delete requests to
            ensure the client has an up-to-date value before proceeding. This
            etag is strongly validated as defined by RFC 7232.
          type: string
        enforcementMode:
