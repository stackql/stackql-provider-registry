          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
        - Oauth2:
            - https://www.googleapis.com/auth/firebase
          Oauth2c:
            - https://www.googleapis.com/auth/firebase
  /v1/oauthClients/{oauthClientsId}:generateAppAttestChallenge:
    parameters: *ref_1
