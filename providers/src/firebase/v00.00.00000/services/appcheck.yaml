              is not applied for the service or resource, nor are metrics
              related to that protection collected. Though the relevant App
              Check protection is not applied, other applicable protections
              outside of App Check, such as user authorization, are still
              applied. An unconfigured EnforcementMode is in this mode by
              default.
            - >-
