            documentation.
          type: string
        replayProtection:
          description: >-
            Optional. The replay protection EnforcementMode for this service.
            Note that this field cannot be set to a level higher than that of
            baseline protection. For example, if the enforcement mode for
            baseline protection is set to `UNENFORCED`, this field cannot be set
            to `ENFORCED`. In order to enforce replay protection, you must first
            enforce App Check's baseline protection. An HTTP 400 error will be
            returned in this case. By default, this field is set to `OFF`.
            Setting this field to `UNENFORCED` or `ENFORCED` is considered
            opting into replay protection. Opting in can impact your requests by
            adding some latency and sometimes cost (depending on your
