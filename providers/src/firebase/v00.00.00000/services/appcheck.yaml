    GoogleFirebaseAppcheckV1PlayIntegrityConfigAppIntegrity:
      type: object
      properties:
        allowUnrecognizedVersion:
          description: >-
            Specifies whether your running app is allowed to have the
            `UNRECOGNIZED_VERSION` [app recognition
            verdict](https://developer.android.com/google/play/integrity/verdicts#application-integrity-field).
            Note that the app recognition verdict `PLAY_RECOGNIZED` is a strong,
            comprehensive integrity signal that takes into account various other
            signals, including conditional and optional device integrity
            responses that you have opted into. If your app is published
            off-Play, this field should be set to `true` to allow instances of
            your app installed from off-Play sources to function. If set to
            `false`, only `PLAY_RECOGNIZED` verdicts are allowed, and both
            `UNRECOGNIZED_VERSION` and `UNEVALUATED` will be rejected. If set to
            `true`, any app recognition verdict is allowed. The default value is
            `false`.
          type: boolean
      id: GoogleFirebaseAppcheckV1PlayIntegrityConfigAppIntegrity
      description: >-
        A settings object specifying application integrity requirements for
        Android devices running your app. These settings correspond to
        requirements on the [**application integrity**
        field](https://developer.android.com/google/play/integrity/verdicts#application-integrity-field)
        obtained from the Play Integrity API. See the [default responses
        table](https://developer.android.com/google/play/integrity/setup#default)
        for a quick summary. The default values for these settings work for most
        apps, and are recommended.
    GoogleFirebaseAppcheckV1ListServicesResponse:
