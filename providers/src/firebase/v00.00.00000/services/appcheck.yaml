              rejected until you turn on enforcement. This `UNENFORCED` mode is
              also known as monitoring-only mode. Though the relevant App Check
              protection is not enforced, other applicable protections outside
              of App Check, such as user authorization, are still applied. Some
              services require certain conditions to be met before they will
              work with App Check, such as requiring you to upgrade to a
              specific service tier. Until those requirements are met for a
              service, this `UNENFORCED` setting will have no effect and App
              Check will not work with that service.
            - >-
              When a particular protection is set to this mode, that protection
