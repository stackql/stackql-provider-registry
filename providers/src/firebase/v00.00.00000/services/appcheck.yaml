      description: >-
        The enforcement configuration for a Firebase service supported by App
        Check.
      id: GoogleFirebaseAppcheckV1Service
    GoogleFirebaseAppcheckV1AppCheckToken:
      type: object
      properties:
        token:
          description: >-
            The App Check token. App Check tokens are signed
            [JWTs](https://tools.ietf.org/html/rfc7519) containing claims that
            identify the attested app and GCP project. This token is used to
            access Google services protected by App Check. These tokens can also
            be [verified by your own custom
            backends](https://firebase.google.com/docs/app-check/custom-resource-backend)
            using the Firebase Admin SDK or third-party libraries.
          type: string
        ttl:
          description: >-
            The duration from the time this token is minted until its
            expiration. This field is intended to ease client-side token
            management, since the client may have clock skew, but is still able
            to accurately measure a duration.
          format: google-duration
          type: string
      description: >-
        Encapsulates an *App Check token*, which are used to access backend
        services protected by App Check.
      id: GoogleFirebaseAppcheckV1AppCheckToken
    GoogleFirebaseAppcheckV1ExchangeDebugTokenRequest:
      type: object
      properties:
        debugToken:
          type: string
          description: >-
            Required. A debug token secret. This string must match a debug token
            secret previously created using CreateDebugToken.
        limitedUse:
          description: >-
            Specifies whether this attestation is for use in a *limited use*
            (`true`) or *session based* (`false`) context. To enable this
            attestation to be used with the *replay protection* feature, set
            this to `true`. The default value is `false`.
          type: boolean
      id: GoogleFirebaseAppcheckV1ExchangeDebugTokenRequest
      description: Request message for the ExchangeDebugToken method.
    GoogleFirebaseAppcheckV1BatchUpdateServicesRequest:
      type: object
      properties:
        updateMask:
          description: >-
            Optional. A comma-separated list of names of fields in the Services
            to update. Example: `display_name`. If the `update_mask` field is
            set in both this request and any of the UpdateServiceRequest
            messages, they must match or the entire batch fails and no updates
            will be committed.
          format: google-fieldmask
          type: string
        requests:
          type: array
          description: >-
            Required. The request messages specifying the Services to update. A
            maximum of 100 objects can be updated in a batch.
          items:
            $ref: '#/components/schemas/GoogleFirebaseAppcheckV1UpdateServiceRequest'
      id: GoogleFirebaseAppcheckV1BatchUpdateServicesRequest
      description: Request message for the BatchUpdateServices method.
    GoogleFirebaseAppcheckV1BatchUpdateServicesResponse:
      id: GoogleFirebaseAppcheckV1BatchUpdateServicesResponse
      description: Response message for the BatchUpdateServices method.
      type: object
      properties:
        services:
          description: Service objects after the updates have been applied.
          items:
            $ref: '#/components/schemas/GoogleFirebaseAppcheckV1Service'
          type: array
    GoogleFirebaseAppcheckV1ExchangeAppAttestAssertionRequest:
      description: Request message for the ExchangeAppAttestAssertion method.
      id: GoogleFirebaseAppcheckV1ExchangeAppAttestAssertionRequest
      type: object
      properties:
        challenge:
          type: string
          description: >-
            Required. A one-time challenge returned by an immediately prior call
            to GenerateAppAttestChallenge.
          format: byte
        limitedUse:
          description: >-
            Specifies whether this attestation is for use in a *limited use*
            (`true`) or *session based* (`false`) context. To enable this
            attestation to be used with the *replay protection* feature, set
            this to `true`. The default value is `false`.
          type: boolean
        artifact:
          type: string
          description: >-
            Required. The artifact returned by a previous call to
            ExchangeAppAttestAttestation.
          format: byte
        assertion:
          description: >-
            Required. The CBOR-encoded assertion returned by the client-side App
            Attest API.
          format: byte
          type: string
    GoogleFirebaseAppcheckV1PlayIntegrityConfigDeviceIntegrity:
      type: object
      properties:
        minDeviceRecognitionLevel:
          type: string
          enumDescriptions:
            - >-
              Default value. Do not specify this value directly. If this value
              is detected in a configuration, it will have the same effect as
              the value `NO_INTEGRITY`.
            - >-
              If this level is set, no explicit device integrity label
              requirements will be checked. However, because Play Integrity's
              other features may perform (and require) their own intrinsic
              device integrity checks, your `app_integrity` and
              `account_details` settings may still cause some device integrity
              checks to be performed.
            - >-
              This level corresponds to the `MEETS_BASIC_INTEGRITY` [optional
              device recognition
              label](https://developer.android.com/google/play/integrity/verdicts#optional-device-labels).
              This value represents the most basic level of device integrity,
              and is the minimum allowed in App Check's standard implementation
              of Play Integrity. Warning: Because this is an optional response,
              you **must** first explicitly [opt in your app in the Play
              Console](https://developer.android.com/google/play/integrity/setup#optional)
              in order to receive this label. Without this opt-in, **your app
              may break** for any user whose device is eligible for
              `MEETS_BASIC_INTEGRITY` but not `MEETS_DEVICE_INTEGRITY`. This API
              is **not** responsible for any such opt-ins.
            - >-
              This level corresponds to the `MEETS_DEVICE_INTEGRITY` [device
              recognition
              verdict](https://developer.android.com/google/play/integrity/verdicts#device-integrity-field).
              Any app integrated with Play Integrity will automatically be
              eligible to receive this label without any additional action from
              you. At this level, devices that have the `MEETS_BASIC_INTEGRITY`
              label but **not** the `MEETS_DEVICE_INTEGRITY` label will be
              rejected.
            - >-
              This level corresponds to the `MEETS_STRONG_INTEGRITY` [optional
              device recognition
              label](https://developer.android.com/google/play/integrity/verdicts#optional-device-labels).
              This value represents the highest level of device integrity. At
              this level, devices that have the `MEETS_BASIC_INTEGRITY` or
              `MEETS_DEVICE_INTEGRITY` but **not** the `MEETS_STRONG_INTEGRITY`
              label will be rejected. Warning: Because this is an optional
              response, you **must** first explicitly [opt in your app in the
              Play
              Console](https://developer.android.com/google/play/integrity/setup#optional)
              in order to receive this label. Without this opt-in, **your app
              may break** for any user whose device is eligible for
              `MEETS_STRONG_INTEGRITY`. This API is **not** responsible for any
              such opt-ins.
          description: >-
            Specifies the minimum device integrity level in order for the device
            to be considered valid. Any device with a device recognition verdict
            lower than this level will be rejected. If this is unspecified, the
            default level is `NO_INTEGRITY`.
          enum:
            - DEVICE_RECOGNITION_LEVEL_UNSPECIFIED
            - NO_INTEGRITY
            - MEETS_BASIC_INTEGRITY
            - MEETS_DEVICE_INTEGRITY
            - MEETS_STRONG_INTEGRITY
      description: >-
        A settings object specifying device integrity requirements for Android
        devices running your app. These settings correspond to requirements on
        the [**device integrity**
        field](https://developer.android.com/google/play/integrity/verdicts#device-integrity-field)
        obtained from the Play Integrity API. See the [default responses
        table](https://developer.android.com/google/play/integrity/setup#default)
        for a quick summary. Warning: There are also
        [conditional](https://developer.android.com/google/play/integrity/setup#conditional)
        as well as
        [optional](https://developer.android.com/google/play/integrity/setup#optional_device_information)
        responses that you can receive, but requires additional explicit opt-in
        from you. The App Check API is **not** responsible for any such opt-ins.
        The default values for these settings work for most apps, and are
        recommended.
      id: GoogleFirebaseAppcheckV1PlayIntegrityConfigDeviceIntegrity
    GoogleFirebaseAppcheckV1ExchangeRecaptchaEnterpriseTokenRequest:
      type: object
      properties:
        recaptchaEnterpriseToken:
          description: >-
            Required. The reCAPTCHA token as returned by the [reCAPTCHA
            Enterprise JavaScript
            API](https://cloud.google.com/recaptcha-enterprise/docs/instrument-web-pages).
          type: string
        limitedUse:
          type: boolean
          description: >-
            Specifies whether this attestation is for use in a *limited use*
            (`true`) or *session based* (`false`) context. To enable this
            attestation to be used with the *replay protection* feature, set
