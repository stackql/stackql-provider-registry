          type: string
        updateTime:
          readOnly: true
          type: string
          format: google-datetime
          description: Output only. Time the release was updated.
        name:
          type: string
          description: 'Required. Format: `projects/{project_id}/releases/{release_id}`'
        createTime:
          readOnly: true
          type: string
          format: google-datetime
          description: Output only. Time the release was created.
    TestSuite:
      properties:
        testCases:
          type: array
          items:
