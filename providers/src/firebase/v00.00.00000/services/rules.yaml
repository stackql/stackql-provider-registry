    Release:
      id: Release
      description: >-
        `Release` is a named reference to a `Ruleset`. Once a `Release` refers
        to a `Ruleset`, rules-enabled services will be able to enforce the
        `Ruleset`.
      type: object
      properties:
        rulesetName:
          description: >-
            Required. Name of the `Ruleset` referred to by this `Release`. The
