          type: string
          description: Browser display version number.
        browser:
          description: Browser name.
          type: string
        displayName:
          type: string
          description: >-
            Browser name and version number. Formatted to be suitable for
            passing to BrowserFilter.
    Thread:
      id: Thread
      description: An application thread.
      type: object
      properties:
        blamed:
          type: boolean
          description: >-
            True when the Crashlytics analysis has determined that the
            stacktrace in this thread is where the fault occurred.
        name:
          type: string
          description: The name of the thread.
        threadId:
          type: string
          description: The id of the thread, only available for ANR threads.
          format: int64
        crashAddress:
          description: >-
            The address of the signal that caused the application to crash. Only
            present on crashed native threads.
          type: string
          format: int64
        threadState:
          readOnly: true
          type: string
          enum:
            - STATE_UNSPECIFIED
            - THREAD_STATE_TERMINATED
            - THREAD_STATE_RUNNABLE
            - THREAD_STATE_TIMED_WAITING
            - THREAD_STATE_BLOCKED
            - THREAD_STATE_WAITING
            - THREAD_STATE_NEW
            - THREAD_STATE_NATIVE_RUNNABLE
            - THREAD_STATE_NATIVE_WAITING
          description: Output only. The state of the thread at the time the ANR occurred.
          enumDescriptions:
            - Thread state unspecified.
            - Thread was terminated.
            - Thread was runnable.
            - Thread was waiting with a timeout.
            - Thread was blocked.
            - Thread was waiting.
            - Thread was started, yet to run anything.
            - >-
              The thread was native and we could not heuristically determine
              that it was was waiting, so assume it's runnable.
            - We heuristically determined that the thread is waiting.
        title:
          description: The title of the thread.
          type: string
        sysThreadId:
          type: string
          description: The system id of the thread, only available for ANR threads.
          format: int64
        frames:
          description: The frames in the thread's stacktrace.
          type: array
          items:
            $ref: '#/components/schemas/Frame'
        subtitle:
          type: string
          description: The subtitle of the thread.
        crashed:
          description: True when the thread has crashed.
          type: boolean
        signal:
          type: string
          description: >-
            The name of the signal that caused the app to crash. Only present on
            crashed native threads.
        signalCode:
          description: >-
            The code of the signal that caused the app to crash. Only present on
            crashed native threads.
          type: string
        queue:
          description: The queue on which the thread was running.
          type: string
    WebMetricsGroup:
