openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Firebase Crashlytics API
  description: >-
    This service provides an API for mobile app developers to request deletion
    of user's crash reports.
  version: v1alpha
  x-discovery-doc-revision: '20260730'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://firebase.google.com/docs/crashlytics
servers:
  - url: https://firebasecrashlytics.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
            https://www.googleapis.com/auth/firebase: View and administer all your Firebase data and settings
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    Breadcrumb:
      properties:
        title:
          type: string
          description: Analytic event name.
        eventTime:
          type: string
          description: Device timestamp for the event.
          format: google-datetime
        params:
          description: Event parameters.
          additionalProperties:
            type: string
          type: object
      id: Breadcrumb
      description: Analytics events recorded during the session.
      type: object
    Note:
      id: Note
      description: Developer notes for an issue.
      type: object
      properties:
        body:
          type: string
          description: Immutable. The body of the note.
        author:
          readOnly: true
          type: string
          description: Output only. The email of the author of the note.
        name:
          readOnly: true
          type: string
          description: >-
            Output only. Identifier. Format:
            "projects/{project}/apps/app/issues/{issue}/notes/{note}".
        createTime:
          format: google-datetime
          description: Output only. Time when the note was created.
          readOnly: true
          type: string
    IssueVariant:
      id: IssueVariant
      description: >-
        A variant is a subgroup of an issue where all events have very similar
        stack traces. Issues may contain one or more variants.
      type: object
      properties:
        uri:
          description: >-
            Output only. Provides a link to the variant on the Firebase console.
            When this variant is obtained as part of a Report, then the link
            will be configured with the same time interval and filters as the
            request.
          readOnly: true
          type: string
        sampleEvent:
          description: Output only. The resource name for a sample event in this variant.
          readOnly: true
          type: string
        id:
          description: Output only. Immutable. Distinct identifier for the variant.
          readOnly: true
          type: string
    IntervalMetrics:
      properties:
        eventsCount:
          type: string
          description: The total count of events in the interval.
          format: int64
        sessionsCount:
          format: int64
          type: string
          description: The number of distinct sessions in the set of events.
        impactedUsersCount:
          format: int64
          description: The number of distinct users in the set of events.
          type: string
        startTime:
          format: google-datetime
          description: The start of the interval covered by the computation.
          type: string
        endTime:
          type: string
          description: The end of the interval covered by the computation.
          format: google-datetime
      type: object
      id: IntervalMetrics
      description: A set of computed metric values for a time interval
    ListEventsResponse:
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          description: >-
            Returns one element per event, in descending order the by event
            timestamp.
        nextPageToken:
          type: string
          description: >-
            A pagination token to retrieve the next page of events. The next
            page will have earlier or later events depending on the request's
            ordering. If this field is not present, there are no subsequent
            events.
      type: object
      id: ListEventsResponse
      description: Response message for the ListEvents method.
    Frame:
      id: Frame
      description: A frame in a stacktrace.
      type: object
      properties:
        file:
          description: The name of the source file in which the frame is found.
          type: string
        column:
          format: int64
          type: string
          description: The column on the line.
        library:
          description: The display name of the library that includes the frame.
          type: string
        offset:
          format: int64
          type: string
          description: >-
            The byte offset into the binary image that contains the code.
            Present for native frames.
        symbol:
          type: string
          description: >-
            The frame symbol after it has been deobfuscated or symbolicated. The
            raw symbol from the device if it could not be hydrated.
        address:
          description: >-
            The address in the binary image which contains the code. Present for
            native frames.
          type: string
          format: int64
        line:
          format: int64
          type: string
          description: The line number in the file of the frame.
        blamed:
          description: >-
            True when the Crashlytics analysis has determined that this frame is
            likely to be the cause of the error.
          type: boolean
        owner:
          description: One of DEVELOPER, VENDOR, RUNTIME, PLATFORM, or SYSTEM.
          type: string
    OperatingSystem:
      properties:
        displayVersion:
          description: Operating system display version number.
          type: string
        os:
          description: Operating system name.
          type: string
        displayName:
          description: >-
            Name and version number. Formatted to be suitable for passing to
            OperatingSystemFilter.
          type: string
        modificationState:
          type: string
          description: Indicates if the OS has been modified or "jailbroken".
        type:
          description: The OS type on Apple platforms (iOS, iPadOS, etc.).
          type: string
        deviceType:
          description: The device category (mobile, tablet, desktop).
          type: string
      type: object
      id: OperatingSystem
      description: Mobile device operating system metadata.
    Memory:
      type: object
      id: Memory
      description: Mobile device memory usage.
      properties:
        used:
          description: Bytes in use.
          type: string
          format: int64
        free:
          format: int64
          description: Bytes free.
          type: string
    IssueSignals:
      properties:
        description:
          description: Output only. Supporting detail information.
          readOnly: true
          type: string
        signal:
          description: Output only. The signal name.
          enumDescriptions:
            - Default.
            - >-
              Indicates an issue that is impacting end users early in the app
              session.
            - Indicates newly detected issues.
            - Indicates previously closed issues which have been detected again.
            - Indicates issues impacting some end users multiple times.
          readOnly: true
          type: string
          enum:
            - SIGNAL_UNSPECIFIED
            - SIGNAL_EARLY
            - SIGNAL_FRESH
            - SIGNAL_REGRESSED
            - SIGNAL_REPETITIVE
      id: IssueSignals
      description: Distinctive characteristics assigned by the Crashlytics analyzer.
      type: object
    Storage:
      type: object
      id: Storage
      description: Mobile device disk/flash usage. Not reported for all devices.
      properties:
        used:
          format: int64
          type: string
          description: Bytes used.
        free:
          type: string
          description: Bytes free.
          format: int64
    User:
      id: User
      description: Developer-provided end user identifiers.
      type: object
      properties:
        id:
          description: User id if provided by the app developer.
          type: string
    Issue:
      properties:
        id:
          readOnly: true
          type: string
          description: Output only. Immutable. Unique identifier for the issue.
        sampleEvent:
          readOnly: true
          type: string
          description: Output only. The resource name for a sample event in this issue.
        title:
          readOnly: true
          type: string
          description: >-
            Output only. Immutable. Caption title. This is usually a source file
            or method name.
        firstSeenTime:
          format: google-datetime
          readOnly: true
          type: string
          description: Output only. Immutable. The first time this issue was seen.
        errorType:
          description: >-
            Output only. Immutable. Indicates whether this issue is a crash,
            non-fatal exception, or ANR.
          enumDescriptions:
            - Unknown.
            - Fatal crash event.
            - >-
              Non-fatal event, such as a caught Java exception or NSError on
              iOS.
            - Application not responding error, Android only.
          readOnly: true
          type: string
          enum:
            - ERROR_TYPE_UNSPECIFIED
            - FATAL
            - NON_FATAL
            - ANR
        stateUpdateTime:
          format: google-datetime
          readOnly: true
          type: string
          description: Output only. The time at which the issue state was last changed.
        variants:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/IssueVariant'
          description: >-
            Output only. Immutable. The top 12 variants (subgroups) within the
            issue. Variants group events within an issue that are very similar.
            A single result implies that the variant is the same as the parent
            issue. This field will be empty when multiple issues are requested.
            Request a single issue to list variants.
        subtitle:
          readOnly: true
          type: string
          description: >-
            Output only. Immutable. Caption subtitle. This is usually a symbol
            or an exception message.
        firstSeenVersion:
          description: >-
            Output only. Immutable. The first app display_version in which this
            issue was seen, populated for mobile issues only.
          readOnly: true
          type: string
        lastSeenVersion:
          description: >-
            Output only. The most recent app display_version in which this issue
            was seen, populated for mobile issues only.
          readOnly: true
          type: string
        notesCount:
          format: int64
          description: Output only. The number of notes attached to an issue.
          readOnly: true
          type: string
        name:
          readOnly: true
          type: string
          description: >-
            Required. Output only. Immutable. Identifier. The name of the issue
            resource. Format: "projects/{project}/apps/{app}/issues/{issue}".
        uri:
          readOnly: true
          type: string
          description: >-
            Output only. Provides a link to the Issue on the Firebase console.
            When this Issue is obtained as part of a Report, then the link will
            be configured with the same time interval and filters as the
            request.
        lastSeenTime:
          readOnly: true
          type: string
          description: Output only. The most recent time this issue was seen.
          format: google-datetime
        state:
          readOnly: true
          type: string
          enum:
            - STATE_UNSPECIFIED
            - OPEN
            - CLOSED
            - MUTED
          description: >-
            Output only. Indicates whether this issue is open, closed or muted.
            For details on how issue states change without user actions, see
            [Regressed
            Issues](https://firebase.google.com/docs/crashlytics/troubleshooting?platform=ios#regressed-issues).
          enumDescriptions:
            - Unknown.
            - Ongoing issue.
            - Issue resolved.
            - Issue muted. No alerts will be fired for this issue.
        signals:
          description: >-
            Output only. Immutable. Distinctive characteristics assigned by the
            Crashlytics analyzer.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/IssueSignals'
      id: Issue
      description: >-
        An issue describes a set of similar events that have been analyzed by
        Crashlytics and grouped together. All events within an issue will be of
        the same error_type: crash, non-fatal exception or ANR. All events
        within an issue will contain similar stack traces in their blamed
        thread.
      type: object
    ListReportsResponse:
      properties:
        reports:
          description: >-
            The report objects returned will contain their names and usage
            instructions, but include no results. Use the `GetReport` method to
            run the report and obtain the paged results.
          type: array
          items:
            $ref: '#/components/schemas/Report'
      id: ListReportsResponse
      description: >-
        Response method for the ListReports method. The response will always
        include all of the available reports.
      type: object
    ReportGroup:
      properties:
        version:
          description: Version metrics group.
          $ref: '#/components/schemas/Version'
        device:
          description: Device metrics group.
          $ref: '#/components/schemas/Device'
        operatingSystem:
          description: Operating system metrics group.
          $ref: '#/components/schemas/OperatingSystem'
        browser:
          description: Browser metrics group.
          $ref: '#/components/schemas/Browser'
        webMetricsGroup:
          description: Web metrics group.
          $ref: '#/components/schemas/WebMetricsGroup'
        issue:
          description: Issue metrics group.
          $ref: '#/components/schemas/Issue'
        variant:
          description: Issue variant metrics group.
          $ref: '#/components/schemas/IssueVariant'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/IntervalMetrics'
          description: >-
            Scalar metrics will contain a single object covering the entire
            interval, while time-dimensioned graphs will contain one per time
            grain.
        subgroups:
          description: >-
            When applicable, this field contains additional nested groupings.
            For example, events can be grouped by operating system and by
            operating system version.
          type: array
          items:
            $ref: '#/components/schemas/ReportGroup'
      id: ReportGroup
      description: >-
        A group of results in an EventReport. In any report, the group_parent
        field is strictly the same type for all of the groups in any collection.
      type: object
    Log:
      properties:
        logTime:
          description: Device timestamp when the line was logged.
          type: string
          format: google-datetime
        message:
          type: string
          description: Log message.
      type: object
      id: Log
      description: Developer-provided log lines recorded during the session.
    Report:
      properties:
        nextPageToken:
          readOnly: true
          type: string
          description: >-
            Output only. A page token used to retrieve additional report groups.
            If this field is not present, there are no subsequent pages
            available to retrieve.
        usage:
          type: string
          description: >-
            Usage instructions for the report with a description of the result
            metrics. This field contains a description of the underlying query
            and describes the expected response data with any known caveats.
            This string can be displayed in the UI of any integration that
            offers comprehensive access to all Crashlytics reports.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ReportGroup'
          description: >-
            Aggregate event statistics in the report will be grouped by a
            dimension, such as by issue or by version. The response contains one
            element per group, and all ReportGroup messages will have the same
            parent field.
        totalSize:
          description: Output only. The total number of groups retrievable by the request.
          readOnly: true
          type: integer
          format: int32
        name:
          description: >-
            The name of the report. Format:
            "projects/{project}/apps/{app_id}/reports/{report}".
          type: string
        displayName:
          description: Output only. The displayable title of the report.
          readOnly: true
          type: string
      type: object
      id: Report
      description: >-
        Response message for the GetReport method. A report consists of the
        results of a query over an application's events. The events may be
        filtered by various criteria defined in the filters proto. The result
        will consist of a number of paginated groups, of a type relevant to the
        report such as issues or device models.
    Event:
      properties:
        receivedTime:
          format: google-datetime
          description: Server timestamp that the event was received by Crashlytics.
          type: string
        user:
          description: End user identifiers for the device owner.
          $ref: '#/components/schemas/User'
        sessionId:
          description: Unique identifier for the Firebase session.
          type: string
        customKeys:
          description: Custom keys set by the developer during the session.
          additionalProperties:
            type: string
          type: object
        routePath:
          description: >-
            Output only. Web only. The route path of the web application when
            the event occurred, excluding query parameters and fragment.
          readOnly: true
          type: string
        crashlyticsSdkVersion:
          type: string
          description: Crashlytics SDK version.
        name:
          readOnly: true
          type: string
          description: >-
            Required. Output only. Immutable. Identifier. The name of the event
            resource. Format: "projects/{project}/apps/{app_id}/events/{event}".
        errors:
          description: >-
            Apple only. A non-fatal error captured by the iOS SDK and its
            stacktrace.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        processState:
          type: string
          description: The state of the app process at the time of the event.
        memory:
          description: Mobile device memory usage.
          $ref: '#/components/schemas/Memory'
        installationUuid:
          description: >-
            Unique identifier for the device-app installation. This field is
            used to compute the unique number of impacted users.
          type: string
        logs:
          type: array
          items:
            $ref: '#/components/schemas/Log'
          description: Log messages recorded by the developer during the session.
        operatingSystem:
          description: Operating system and version.
          $ref: '#/components/schemas/OperatingSystem'
        appOrientation:
          type: string
          description: App orientation at the time of the crash (portrait or landscape).
        issueTitle:
          type: string
          description: >-
            The title of the issue in which the event was grouped. This is
            usually a source file or method name.
        blameFrame:
          description: >-
            The stack trace frame blamed by Crashlytics processing. May not be
            present in future analyzer.
          $ref: '#/components/schemas/Frame'
        threads:
          description: >-
            Application threads present at the time the event was recorded. Each
            contains a stacktrace. One thread will be blamed for the error.
          type: array
          items:
            $ref: '#/components/schemas/Thread'
        platform:
          description: ANDROID, IOS, or WEB.
          type: string
        bundleOrPackage:
          description: >-
            The bundle name for iOS apps or the package name of Android apps.
            Format: "com.mycompany.myapp".
          type: string
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/Exception'
          description: >-
            Android and web only. Exceptions that occurred during this event.
            Nested exceptions are presented in reverse chronological order, so
            that the last record is the first exception thrown.
        issueSubtitle:
          type: string
          description: >-
            The subtitle of the issue in which the event was grouped. This is
            usually a symbol or an exception message.
        buildStamp:
          description: >-
            Metadata provided by the app's build system, including version
            control repository info.
          type: string
        device:
          description: Mobile device metadata.
          $ref: '#/components/schemas/Device'
        version:
          description: Mobile application version.
          $ref: '#/components/schemas/Version'
        browser:
          description: Browser and version.
          $ref: '#/components/schemas/Browser'
        eventTime:
          format: google-datetime
          description: Device timestamp that the event was recorded.
          type: string
        storage:
          description: Mobile device disk/flash usage.
          $ref: '#/components/schemas/Storage'
        issueVariant:
          description: Details for the [IssueVariant] assigned to this [Event].
          $ref: '#/components/schemas/IssueVariant'
        issue:
          description: Details for the [Issue] assigned to this [Event].
          $ref: '#/components/schemas/Issue'
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          description: Analytics events recorded by the analytics SDK during the session.
        eventId:
          description: >-
            Output only. Immutable. The unique event identifier is assigned
            during processing.
          readOnly: true
          type: string
        deviceOrientation:
          description: Device orientation at the time of the crash (portrait or landscape).
          type: string
      id: Event
      description: >-
        The message describing a single Crashlytics event. Related to BigQuery
        export schema, which can be found at [Export Crashlytics data to
        BigQuery](https://firebase.google.com/docs/crashlytics/bigquery-export#dataset-schema-crashlytics)
      type: object
    Error:
      id: Error
      description: A non-fatal error and its stacktrace, only from Apple apps.
      type: object
      properties:
        frames:
          type: array
          items:
            $ref: '#/components/schemas/Frame'
          description: The frames in the error's stacktrace.
        code:
          format: int64
          type: string
          description: Error code associated with the app's custom logged NSError.
        queue:
          description: The queue on which the thread was running.
          type: string
        title:
          type: string
          description: The title of the error.
        subtitle:
          type: string
          description: The subtitle of the error.
        blamed:
          type: boolean
          description: >-
            True when the Crashlytics analysis has determined that the
            stacktrace in this error is where the fault occurred.
    Empty:
      id: Empty
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      type: object
      properties: {}
    UpdateIssueRequest:
      properties:
        issue:
          description: >-
            Required. The issue to update. The issue's `name` field is used to
            identify the issue to update. Format:
            "projects/{project}/apps/{app}/issues/{issue}".
          $ref: '#/components/schemas/Issue'
        updateMask:
          format: google-fieldmask
          type: string
          description: >-
            Optional. The list of Issue fields to update. Currently only "state"
            is mutable.
      id: UpdateIssueRequest
      description: Request message for the UpdateIssue method.
      type: object
    Version:
      id: Version
      description: Application software version.
      type: object
      properties:
        displayVersion:
          description: >-
            Readable version string, e.g. "1.2.3". On Android, strictly the same
            as "version name". On iOS, strictly the same as "version number" or
            CFBundleShortVersionString.
          type: string
        buildVersion:
          type: string
          description: >-
            Mobile only. One display_version can have many build_version. On
            Android, strictly the same as "version code". On iOS, strictly the
            same as "build number" or CFBundleVersion.
        tracks:
          description: >-
            Indicates releases which have artifacts that are currently available
            in the Play Store to the target audience of the track. Versions may
            be available in multiple tracks.
          type: array
          items:
            $ref: '#/components/schemas/PlayTrack'
        displayName:
          type: string
          description: >-
            Compound readable string containing both display and build versions.
            Format: "display_version (build_version)" e.g. "1.2.3 (456)". This
            string can be used for filtering with the VersionFilter.display_name
            field.
    BatchUpdateIssuesRequest:
      type: object
      id: BatchUpdateIssuesRequest
      description: Request message for the BatchUpdateIssues method.
      properties:
        requests:
          description: >-
            Required. The request message specifying the resources to update. A
            maximum of 100 issues can be modified in a batch.
          type: array
          items:
            $ref: '#/components/schemas/UpdateIssueRequest'
        updateMask:
          format: google-fieldmask
          description: >-
            Optional. The list of Issue fields to update. If this is set, the
            update_mask field in the UpdateIssueRequest messages must either be
            empty or match this field.
          type: string
    DeleteUserCrashReportsResponse:
      type: object
      id: DeleteUserCrashReportsResponse
      description: >-
        Response message for the DeleteUserCrashReports method. All crash
        reports associated with the specified user will be deleted typically
        within 24 hours of receiving the crash report.
      properties:
        targetCompleteTime:
          format: google-datetime
          description: Target time to complete the delete crash reports operation.
          type: string
    FirebaseSessionEvent:
      id: FirebaseSessionEvent
      description: Sessions recorded by the Firebase App Quality Sessions SDK.
      type: object
      properties:
        operatingSystem:
          description: Operating system and version.
          $ref: '#/components/schemas/OperatingSystem'
        firebaseInstallationId:
          type: string
          description: Uniquely identifies a device with Firebase apps installed.
        version:
          description: Mobile application version numbers.
          $ref: '#/components/schemas/Version'
        device:
          description: Mobile device metadata.
          $ref: '#/components/schemas/Device'
        sessionId:
          description: Unique identifier for the Firebase session.
          type: string
        firstSessionId:
          description: >-
            The identifier of the first session since the last cold start. This
            id and the session_id will be the same for app launches.
          type: string
        eventType:
          description: >-
            Session event type. The SDK only supports SESSION_START events at
            this time.
          enumDescriptions:
            - Unknown.
            - Application session started.
          type: string
          enum:
            - SESSION_EVENT_TYPE_UNKNOWN
            - SESSION_START
        sessionIndex:
          format: int32
          description: Indicates the number of sessions since the last cold start.
          type: integer
        eventTime:
          format: google-datetime
          type: string
          description: The start timestamp for the session event.
    BatchGetEventsResponse:
      type: object
      id: BatchGetEventsResponse
      description: Response message for the BatchGetEvents method.
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          description: The list of retrieved events.
    PlayTrack:
      properties:
        title:
          description: >-
            User-generated or auto-generated name of the track. PROD and
            INTERNAL track types always have auto-generated names, e.g. "prod"
            and "internal" respectively. Tracks of type EARLY_ACCESS always have
            a user-generated name. Other track types do not have any guarantees,
            might have user-generated or auto-generated names.
          type: string
        type:
          type: string
          enum:
            - TRACK_TYPE_UNSPECIFIED
            - TRACK_TYPE_PROD
            - TRACK_TYPE_INTERNAL
            - TRACK_TYPE_OPEN_TESTING
            - TRACK_TYPE_CLOSED_TESTING
            - TRACK_TYPE_EARLY_ACCESS
          description: The type of track (prod, internal, etc...).
          enumDescriptions:
            - Unknown.
            - Production.
            - Internal testing.
            - Open testing.
            - Closed testing.
            - Early access.
