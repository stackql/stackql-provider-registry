    Device:
      id: Device
      description: Mobile device metadata.
      type: object
      properties:
        model:
          type: string
          description: >-
            The model name which is consistent with android.os.Build.MODEL, e.g.
            ("SPH-L710", "GT-I9300").
        displayName:
          description: >-
            Full device name, suitable for passing to DeviceFilter. Format:
            "manufacturer (model)".
          type: string
        formFactor:
          description: See FormFactor message.
          enumDescriptions:
            - Unknown.
            - >-
              Includes mobile phones, small foldables and other form factors not
              fitting the other categories.
            - Includes tablets and larger foldables.
            - Includes desktops, laptops, Chromebooks, etc.
            - Includes televisions and set-tops.
            - Includes both watches and other wearables.
          type: string
          enum:
            - FORM_FACTOR_UNSPECIFIED
            - PHONE
            - TABLET
            - DESKTOP
            - TV
            - WATCH
        companyName:
          type: string
          description: >-
            An invariant name of the manufacturer that submitted this product in
            its most recognizable public form, e.g. "Google".
        architecture:
          type: string
          description: Device processor architecture.
        manufacturer:
          type: string
          description: Device brand name which is consistent with android.os.Build.BRAND.
        marketingName:
          description: Marketing name, most recognizable public form, e.g. "Pixel 6".
          type: string
    Exception:
      properties:
        type:
          type: string
          description: The exception type e.g. java.lang.IllegalStateException.
        frames:
          type: array
          items:
            $ref: '#/components/schemas/Frame'
          description: The frames in the exception's stacktrace.
        exceptionMessage:
          description: A message associated with the exception.
          type: string
        nested:
          type: boolean
          description: True for all but the last-thrown exception (i.e. the first record).
        blamed:
          type: boolean
          description: >-
            True when the Crashlytics analysis has determined that this thread
            is where the fault occurred.
        title:
          description: The title of the exception.
          type: string
        subtitle:
          type: string
          description: The subtitle of the exception.
      type: object
      id: Exception
      description: >-
        A Java or Javascript exception and its stacktrace. Only from Android or
        web apps.
