      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/scheduled_views/methods/get'
          - $ref: '#/components/x-stackQL-resources/scheduled_views/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/scheduled_views/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/scheduled_views/methods/update'
