        replace: []
    quota:
      id: sumologic.scheduled_views.quota
      name: quota
      title: Quota
      methods:
        get:
          operation:
            $ref: '#/paths/~1v1~1scheduledViews~1quota/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
