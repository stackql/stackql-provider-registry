            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1lookupTables~1{id}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        delete:
          operation:
            $ref: '#/paths/~1v1~1lookupTables~1{id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            nativeCasing: camel
        truncate:
          operation:
            $ref: '#/paths/~1v1~1lookupTables~1{id}~1truncate/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        upsert_row:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1lookupTables~1{id}~1row/put'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            mediaType: application/json
            nativeCasing: camel
        delete_row:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1lookupTables~1{id}~1deleteTableRow/put'
