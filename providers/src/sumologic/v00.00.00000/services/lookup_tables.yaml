            mediaType: application/json
            openAPIDocKey: '204'
          request:
            mediaType: application/json
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/lookup_tables/methods/get'
        insert:
          - $ref: '#/components/x-stackQL-resources/lookup_tables/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/lookup_tables/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/lookup_tables/methods/delete'
        replace: []
    jobs:
      id: sumologic.lookup_tables.jobs
      name: jobs
      title: Jobs
      methods:
        get:
          operation:
            $ref: '#/paths/~1v1~1lookupTables~1jobs~1{jobId}~1status/get'
          response:
            mediaType: application/json
