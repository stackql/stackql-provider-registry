openapi: 3.0.0
info:
  title: Sumo Logic Content Sync API
  description: Multi-account content synchronisation jobs between child organizations.
  version: 1.0.0
paths:
  /v1/multi-account-management/content/sync:
    get:
      tags:
        - contentConfigManagement
      summary: Get Content Sync Job Id.
      description: Get Content Sync Job Id of last triggered job.
      operationId: getContentSyncJobDetails
      responses:
        '200':
          description: Last triggered Content Sync Job Details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSyncResponse'
        default:
          description: Error occurred while getting Content Sync Job Id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - contentConfigManagement
      summary: Sync Content and Configuration across Organization.
      description: Sync Content and Configuration across Organization.
      operationId: contentSync
      requestBody:
        description: Content and Organisation Information for Syncing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentSyncRequest'
        required: true
      responses:
        '200':
          description: Content Sync Job created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSyncResponse'
        default:
          description: Failed to created Content Sync Job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/multi-account-management/content/sync/{jobId}/status:
    get:
      tags:
        - contentConfigManagement
      summary: Get Status of Content Sync Job.
      description: Get Status of Content Sync Job.
      operationId: contentSyncStatus
      parameters:
        - name: jobId
          in: path
          description: Id of Content Sync Job
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Content Sync Job Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSyncStatusResponse'
        default:
          description: Error occurred while getting Content Sync Job Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/multi-account-management/content/sync/{jobId}/retry:
    post:
      tags:
        - contentConfigManagement
      summary: Retry Content Sync Job by ID
      description: Retry Content Sync Job by ID to re-execute job.
      operationId: contentSyncRetry
      parameters:
        - name: jobId
          in: path
          description: Id of Content Sync Job
          required: true
          schema:
            type: string
        - name: retryOptions
          in: query
          description: Controls which contents to retry
          required: false
          schema:
            $ref: '#/components/schemas/RetryOptions'
      responses:
        '200':
          description: Content Sync Job restarted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSyncResponse'
        default:
          description: Error occurred while restarting Content Sync Job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/multi-account-management/content/sync/{jobId}/cancel:
    post:
      tags:
        - contentConfigManagement
      summary: Cancel Content Sync Job by ID
      description: Cancel In Progress Sync Job by ID..
      operationId: contentSyncCancel
      parameters:
        - name: jobId
          in: path
          description: Id of Content Sync Job
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Content Sync Job Cancellation started successfully
          content: {}
        default:
          description: Error occurred while cancelling Content Sync Job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/multi-account-management/content/sync/{jobId}/result:
    get:
      tags:
        - contentConfigManagement
      summary: Get Result of Content Sync Job by ID.
      description: Get Result Of Content Sync Job by ID.
      operationId: contentSyncResult
      parameters:
        - name: jobId
          in: path
          description: Id of Content Sync Job
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Specific Status of Content Sync Job Result to be fetched. Possible values are "SUCCESS", "FAILED", "WARNING", "CANCELLED".
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Result of Content Sync Job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSyncResult'
        default:
          description: Error occurred while getting Result for Content Sync Job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/multi-account-management/content/sync/{jobId}/info:
    get:
      tags:
        - contentConfigManagement
      summary: Get Information of Content Sync Job by ID.
      description: Information Of Content Sync Job by ID.
      operationId: contentSyncJobInfo
      parameters:
        - name: jobId
          in: path
          description: Id of Content Sync Job
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Information of Content Sync Job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSyncJobInfo'
        default:
          description: Error occurred while getting Result for Content Sync Job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ContentSyncResponse:
      required:
        - jobId
      type: object
      properties:
        jobId:
          type: string
          description: Content Sync Job Id.
          example: 68B6D772B616DC06
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    ContentSyncRequest:
      required:
        - contentList
        - destinationChildOrgInfo
        - sourceChildOrgInfo
      type: object
      properties:
        sourceChildOrgInfo:
          $ref: '#/components/schemas/ChildOrgInfo'
        destinationChildOrgInfo:
          $ref: '#/components/schemas/DestinationChildOrgInfo'
        contentList:
          type: array
          description: List of Content and Configuration Information.
          items:
            $ref: '#/components/schemas/Content_1'
    ContentSyncStatusResponse:
      required:
        - progress
        - status
      type: object
      properties:
        status:
          type: string
          description: Content Sync Job status.
          example: Success
        progress:
          type: integer
          description: Content Sync Job progress percentage.
          example: 100
    RetryOptions:
      type: string
      description: Determines retry scope -> "ALL_CONTENTS" (default) retries all, "NON_SUCCESS_CONTENTS" retries only failed ones.
      enum:
        - ALL_CONTENTS
        - NON_SUCCESS_CONTENTS
      default: ALL_CONTENTS
    ContentSyncResult:
      required:
        - contentList
      type: object
      properties:
        contentList:
          type: array
          description: List of content sync items with details.
          items:
            $ref: '#/components/schemas/ContentSyncItemResult'
    ContentSyncJobInfo:
      required:
        - contentList
        - destinationChildOrgInfo
        - sourceChildOrgInfo
      type: object
      properties:
        sourceChildOrgInfo:
          $ref: '#/components/schemas/ChildOrgInfo'
        destinationChildOrgInfo:
          $ref: '#/components/schemas/DestinationChildOrgInfo'
        contentList:
          type: array
          description: List of Content and Configuration Information.
          items:
            $ref: '#/components/schemas/Content_1'
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    ChildOrgInfo:
      required:
        - orgId
      type: object
      properties:
        orgId:
          type: string
          description: Organization Identifier.
          example: us2-0000000000000006
        orgName:
          type: string
          description: Organization Name.
          example: Test Org Name
    DestinationChildOrgInfo:
      required:
        - excluded
        - included
      type: object
      properties:
        included:
          type: array
          description: Organization Info which needs to be included in Destination Organisation List.
          items:
            $ref: '#/components/schemas/ChildOrgInfo'
        excluded:
          type: array
          description: Organization Info which needs to be excluded from Destination Organisation List.
          items:
            $ref: '#/components/schemas/ChildOrgInfo'
    Content_1:
      required:
        - id
        - options
        - type
      type: object
      properties:
        id:
          type: string
          description: Identifier of Content or Configuration
          example: MATCH-S00574
        type:
          type: string
          description: Type Of Content.
          example: CSE_RULE
          enum:
            - CSE_RULE
            - CSE_TUNING_EXPRESSION
            - LIBRARY_FOLDER
            - DASHBOARD
            - SEARCH
            - SCHEDULED_SEARCH
            - MONITOR
            - MONITOR_FOLDER
            - SOURCE_TEMPLATE
            - LOOKUP_TABLE
        name:
          type: string
          description: Name of Content or Configuration
          example: Test CSE Rule
        options:
          maxProperties: 100
          type: object
          additionalProperties:
            type: string
          description: Advance Settings required for syncing content or configuration.
          example:
            includeCSERule: true
          default: {}
    ContentSyncItemResult:
      required:
        - childOrganization
        - contentId
        - message
      type: object
      properties:
        contentId:
          type: string
          description: Identifier of Content or Configuration
          example: MATCH-S00574
        message:
          type: string
          description: Message Passed while processing content or configuration sync.
          example: Sync Failed due to an Internal Error, Please check with support team for more details.
        childOrganization:
          $ref: '#/components/schemas/ChildOrgInfo'
  x-stackQL-resources:
    sync_jobs:
      id: sumologic.content_sync.sync_jobs
      name: sync_jobs
      title: Sync Jobs
      methods:
        get_current:
          operation:
            $ref: '#/paths/~1v1~1multi-account-management~1content~1sync/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1multi-account-management~1content~1sync/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1v1~1multi-account-management~1content~1sync~1{jobId}~1status/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        retry:
          operation:
            $ref: '#/paths/~1v1~1multi-account-management~1content~1sync~1{jobId}~1retry/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        cancel:
          operation:
            $ref: '#/paths/~1v1~1multi-account-management~1content~1sync~1{jobId}~1cancel/post'
          response:
            mediaType: application/json
            openAPIDocKey: '202'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/sync_jobs/methods/get'
          - $ref: '#/components/x-stackQL-resources/sync_jobs/methods/get_current'
        insert:
          - $ref: '#/components/x-stackQL-resources/sync_jobs/methods/create'
        update: []
        delete: []
        replace: []
    sync_job_results:
      id: sumologic.content_sync.sync_job_results
      name: sync_job_results
      title: Sync Job Results
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1multi-account-management~1content~1sync~1{jobId}~1result/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.contentList
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/sync_job_results/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    sync_job_info:
      id: sumologic.content_sync.sync_job_info
      name: sync_job_info
      title: Sync Job Info
      methods:
        get:
          operation:
            $ref: '#/paths/~1v1~1multi-account-management~1content~1sync~1{jobId}~1info/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/sync_job_info/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.{region}.sumologic.com/api
    description: Sumo Logic deployment API endpoint
    variables:
      region:
        description: Sumo Logic deployment (au, ca, ch, de, eu, fed, in, jp, kr, us1, us2). Resolved from the SUMOLOGIC_ENVIRONMENT environment variable when it is set (x-stackQL-envVar, the same variable the Terraform provider reads); otherwise defaults to us2. A WHERE region = '...' value always takes precedence.
        enum:
          - au
          - ca
          - ch
          - de
          - eu
          - fed
          - in
          - jp
          - kr
          - us1
          - us2
        default: us2
        x-stackQL-envVar: SUMOLOGIC_ENVIRONMENT
x-stackQL-config:
  pagination:
    requestToken:
      key: token
      location: query
    responseToken:
      key: next
      location: body
