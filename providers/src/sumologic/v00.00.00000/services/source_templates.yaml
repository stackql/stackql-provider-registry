openapi: 3.0.0
info:
  title: Sumo Logic Source Templates API
  description: Source templates for OpenTelemetry collectors (v1 deprecated and v2).
  version: 1.0.0
paths:
  /v1/sourceTemplates:
    get:
      tags:
        - sourceTemplateManagementExternal
      summary: List all source templates.
      description: Get a list of all source templates.
      operationId: getSourceTemplatesV2
      parameters:
        - name: showDisabled
          in: query
          description: A boolean parameter to get all, including disabled source templates.
          required: false
          schema:
            type: boolean
            default: false
        - name: name
          in: query
          description: Only return source template matching the given name (exact match).
          required: false
          schema:
            minLength: 1
            type: string
            nullable: true
        - name: fleetIds
          in: query
          description: Comma-separated list of fleet IDs (hex-encoded).
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A list of source templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateListResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - sourceTemplateManagementExternal
      summary: Create source template.
      description: Create source template.
      operationId: createSourceTemplateV2
      parameters:
        - name: dryRun
          in: query
          description: Whether this creation request is a dry run. With dryRun set to true, the source template will not be created but the request will be validated.
          required: false
          schema:
            type: boolean
            example: true
            default: false
      requestBody:
        description: Create source template details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTemplateRequest'
        required: true
      responses:
        '200':
          description: Create source template response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateDefinition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sourceTemplates/{id}:
    get:
      tags:
        - sourceTemplateManagementExternal
      summary: Get a source template by Id.
      description: Get a source template with the given identifier.
      operationId: getSourceTemplateV2
      parameters:
        - name: id
          in: path
          description: Identifier of the source template to get.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Get source template response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateDefinition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - sourceTemplateManagementExternal
      summary: Update source template.
      description: Update a source template with the given identifier.
      operationId: updateSourceTemplateV2
      parameters:
        - name: id
          in: path
          description: Identifier of the source template to update.
          required: true
          schema:
            type: string
      requestBody:
        description: Request details of update source template.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTemplateUpdateRequest'
        required: true
      responses:
        '200':
          description: Update source template response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateDefinition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - sourceTemplateManagementExternal
      summary: Delete a source template.
      description: Delete a source template with the given identifier.
      operationId: deleteSourceTemplateV2
      parameters:
        - name: id
          in: path
          description: Identifier of the source template to delete.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The source template was deleted successfully.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sourceTemplates/{id}/status:
    put:
      tags:
        - sourceTemplateManagementExternal
      summary: Update status of source template
      description: Update the status (enable or disable) of a source template.
      operationId: updateSourceTemplateStatusV2
      parameters:
        - name: id
          in: path
          description: Identifier of the source template to update.
          required: true
          schema:
            type: string
      requestBody:
        description: Status of source template
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTemplateStatusUpdateRequest'
        required: true
      responses:
        '200':
          description: Update source template status response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateDefinition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sourceTemplates/{id}/upgrade:
    post:
      tags:
        - sourceTemplateManagementExternal
      summary: Upgrade source template.
      description: Upgrade a source template with the given identifier.
      operationId: upgradeSourceTemplateV2
      parameters:
        - name: id
          in: path
          description: Identifier of the source template to upgrade.
          required: true
          schema:
            type: string
      requestBody:
        description: Source template upgrade request details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTemplateUpgradeRequest'
        required: true
      responses:
        '200':
          description: Upgrade source template response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateDefinition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sourceTemplates/getLinkedSourceTemplatesImpact:
    post:
      tags:
        - sourceTemplateManagementExternal
      summary: Preview source template linking changes.
      description: Given the set of tags user wants to update, display the list of source templates that will be linked/unlinked to the otCollector.
      operationId: getLinkedSourceTemplatesImpact
      requestBody:
        description: Request body containing otCollector id and set of tags.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkedSourceTemplatesUpdateRequest'
        required: true
      responses:
        '200':
          description: A list of source templates whose linking to the otCollector will be impacted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedSourceTemplatesUpdateResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sourceTemplate:
    get:
      tags:
        - sourceTemplateManagementExternal
      summary: Return all source templates of a customer (deprecated).
      description: |
        Get a list of source template.

        **DEPRECATED**: This endpoint will be removed soon. Please use GET /v1/sourceTemplates instead.
      operationId: getSourceTemplates
      parameters:
        - name: showDisabled
          in: query
          description: A boolean parameter to get all, including disabled source templates.
          required: false
          schema:
            type: boolean
            default: false
        - name: name
          in: query
          description: Only return source template matching the given name (exact match).
          required: false
          schema:
            minLength: 1
            type: string
            nullable: true
        - name: fleetIds
          in: query
          description: Comma-separated list of fleet IDs (hex-encoded).
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A list of source templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateListResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
    post:
      tags:
        - sourceTemplateManagementExternal
      summary: Create source template (deprecated).
      description: |
        Create source template.

        **DEPRECATED**: This endpoint will be removed soon. Please use POST /v1/sourceTemplates instead.
      operationId: createSourceTemplate
      parameters:
        - name: dryRun
          in: query
          description: Whether this creation request is a dry run. With dryRun set to true, the source template will not be created but the request will be validated.
          required: false
          schema:
            type: boolean
            example: true
            default: false
      requestBody:
        description: Create source template details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTemplateRequest'
        required: true
      responses:
        '200':
          description: Create source template response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateDefinition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
  /v1/sourceTemplate/{id}:
    get:
      tags:
        - sourceTemplateManagementExternal
      summary: Get a source template by Id (deprecated).
      description: |
        Get a source template with the given identifier.

        **DEPRECATED**: This endpoint will be removed soon. Please use GET /v1/sourceTemplates/{id} instead.
      operationId: getSourceTemplate
      parameters:
        - name: id
          in: path
          description: Identifier of the source template to get.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Get source template response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateDefinition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
    post:
      tags:
        - sourceTemplateManagementExternal
      summary: Update source template (deprecated).
      description: |
        Update a source template with the given identifier.

        **DEPRECATED**: This endpoint will be removed soon. Please use POST /v1/sourceTemplates/{id} instead.
      operationId: updateSourceTemplate
      parameters:
        - name: id
          in: path
          description: Identifier of the source template to update.
          required: true
          schema:
            type: string
      requestBody:
        description: Source template request details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTemplateRequest'
        required: true
      responses:
        '200':
          description: Update source template response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateDefinition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
    delete:
      tags:
        - sourceTemplateManagementExternal
      summary: Delete a source template (deprecated).
      description: |
        Delete a source template with the given identifier.

        **DEPRECATED**: This endpoint will be removed soon. Please use DELETE /v1/sourceTemplates/{id} instead.
      operationId: deleteSourceTemplate
      parameters:
        - name: id
          in: path
          description: Identifier of the source template to delete.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The source template was deleted successfully.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
  /v1/upgrade/sourceTemplate/{id}:
    post:
      tags:
        - sourceTemplateManagementExternal
      summary: Upgrade source template (deprecated).
      description: |
        Upgrade a source template with the given identifier.

        **DEPRECATED**: This endpoint will be removed soon. Please use POST /v1/sourceTemplates/{id}/upgrade instead.
      operationId: upgradeSourceTemplate
      parameters:
        - name: id
          in: path
          description: Identifier of the source template to upgrade.
          required: true
          schema:
            type: string
      requestBody:
        description: Source template upgrade request details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTemplateUpgradeRequest'
        required: true
      responses:
        '200':
          description: Upgrade source template response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateDefinition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
  /v1/sourceTemplate/getLinkedSourceTemplatesImpact:
    post:
      tags:
        - sourceTemplateManagementExternal
      summary: Get linked source templates update based on the ot-collector tags user is wants to update.
      description: Given the set of tags user wants to update, display the list of source templates that will be linked/unlinked to the otCollector.
      operationId: getLinkedSourceTemplatesUpdate
      requestBody:
        description: Request body containing otCollector id and set of tags.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkedSourceTemplatesUpdateRequest'
        required: true
      responses:
        '200':
          description: A list of source templates whose linking to the otCollector will be impacted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedSourceTemplatesUpdateResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sourceTemplate/{id}/status:
    put:
      tags:
        - sourceTemplateManagementExternal
      summary: Update status of source template (deprecated)
      description: |
        Update the status (enable or disable) of a source template.

        **DEPRECATED**: This endpoint will be removed soon. Please use PUT /v1/sourceTemplates/{id}/status instead.
      operationId: updateSourceTemplateStatus
      parameters:
        - name: id
          in: path
          description: Identifier of the source template to update.
          required: true
          schema:
            type: string
      requestBody:
        description: Status of source template
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTemplateStatusUpdateRequest'
        required: true
      responses:
        '200':
          description: Update source template status response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTemplateDefinition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
components:
  schemas:
    SourceTemplateListResponse:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: List of source templates.
          items:
            $ref: '#/components/schemas/SourceTemplateDefinition'
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    SourceTemplateRequest:
      required:
        - inputJson
        - schemaRef
      type: object
      properties:
        schemaRef:
          $ref: '#/components/schemas/SchemaRef'
        inputJson:
          maxProperties: 1000
          required:
            - name
            - receivers
          type: object
          properties:
            name:
              type: string
              description: name of source template.
              example: apache_test_source_template
            receivers:
              type: string
              description: receiver information of source template (opaque JSON object)
              example: {}
            description:
              type: string
              description: description of source template
              example: Demo Description for Source Template
            processors:
              type: string
              description: processors for source template (opaque JSON object)
              example: {}
          additionalProperties: true
          description: inputJson of source template
        selector:
          $ref: '#/components/schemas/Selector'
        isEnabled:
          type: boolean
          description: Indicates whether the source template is enabled - **Create operation:** Defaults to `true` (the template is enabled when created). - **Update operation:** If omitted, the existing status is preserved.
          example: true
      description: request body for creating source template.
    SourceTemplateDefinition:
      type: object
      properties:
        schemaRef:
          $ref: '#/components/schemas/SchemaRef'
        id:
          type: string
          description: id of source template.
          example: 0000000003343FDD
        inputJson:
          maxProperties: 1000
          type: object
          additionalProperties: true
          description: inputJson of source template
          example: {}
        config:
          type: string
          description: configuration of source template
          example: apache.yaml.example
        selector:
          $ref: '#/components/schemas/Selector'
        totalCollectorLinked:
          type: integer
          description: count of total collector linked with this source template.
          format: int32
          default: 0
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedAt:
          type: string
          description: Modification timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Id of the user who created source template
          example: 0000000006743FDD
        modifiedBy:
          type: string
          description: Id of the user who last modified the source template
          example: 0000000006243FDD
        status:
          type: string
          description: Status of Source template
          enum:
            - enable
            - disable
        isEnabled:
          type: boolean
          description: A boolean parameter to get if the source template is enabled.
          example: true
          default: true
      description: response definition of source template.
    SourceTemplateUpdateRequest:
      required:
        - inputJson
        - schemaRef
      type: object
      properties:
        schemaRef:
          $ref: '#/components/schemas/SchemaRef'
        inputJson:
          maxProperties: 1000
          required:
            - name
            - receivers
          type: object
          properties:
            name:
              type: string
              description: Name of source template.
              example: apache_test_source_template
            receivers:
              type: string
              description: Receiver information of source template (opaque JSON object)
              example: {}
            description:
              type: string
              description: Description of source template
              example: Demo Description for source template
            processors:
              type: string
              description: Processors for source template (opaque JSON object)
              example: {}
          additionalProperties: true
          description: InputJson of source template
        selector:
          $ref: '#/components/schemas/Selector'
        isEnabled:
          type: boolean
          description: Indicates whether the source template is enabled. If omitted, the existing status is preserved.
          example: true
      description: Request body for updating source template.
    SourceTemplateStatusUpdateRequest:
      required:
        - status
      type: object
      properties:
        status:
          type: string
          description: status to set for the source template (enable or disable).
          enum:
            - enable
            - disable
      example:
        status: enable
    SourceTemplateUpgradeRequest:
      required:
        - inputJson
        - schemaRef
      type: object
      properties:
        schemaRef:
          $ref: '#/components/schemas/UpgradeSchemaRef'
        inputJson:
          maxProperties: 1000
          required:
            - name
            - receivers
          type: object
          properties:
            name:
              type: string
              description: name of source template.
              example: apache_test_source_template
            receivers:
              type: string
              description: receiver information of source template (opaque JSON object)
              example:
                hostmetrics:
                  receiverType: hostmetrics
                  collection_interval: 5m
            description:
              type: string
              description: description of source template
              example: Demo Description for source template
            processors:
              type: string
              description: processors for source template (opaque JSON object)
              example:
                resource:
                  processorType: resource
          additionalProperties: true
          description: inputJson of source template
      description: request body for creating source template.
    LinkedSourceTemplatesUpdateRequest:
      required:
        - collectorId
      type: object
      properties:
        collectorId:
          type: string
          description: otCollector id for which tags are edited.
          example: 00005AF3107BF0D6
        tags:
          maxProperties: 50
          type: object
          additionalProperties:
            type: string
          description: JSON map of key-value metadata to apply to the otCollector.
          example:
            environment: production
            location: us-west-2
          default: {}
        updatedName:
          type: string
          description: Updated Name of the otCollector.
          example: demo_macOS
    LinkedSourceTemplatesUpdateResponse:
      required:
        - collectorId
      type: object
      properties:
        collectorId:
          type: string
          description: otCollector id for which tags are edited.
          example: 00005AF3107BF0D6
        addedSourceTemplates:
          type: array
          description: list of sourceTemplates which are linked to otCollector.
          items:
            $ref: '#/components/schemas/LinkingUpdatedSourceTemplateDetails'
        removedSourceTemplates:
          type: array
          description: list of sourceTemplates which are removed from otCollector linking.
          items:
            $ref: '#/components/schemas/LinkingUpdatedSourceTemplateDetails'
      description: linked source template details based on the ot-collector tags user wants to update.
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    SchemaRef:
      required:
        - type
      type: object
      properties:
        type:
          type: string
          description: type of source template.
          example: Apache
      description: schema reference for source template.
    Selector:
      type: object
      properties:
        tags:
          type: array
          description: tags filter for agents
          items:
            type: array
            items:
              $ref: '#/components/schemas/OtTag'
        names:
          type: array
          description: names to select custom agents
          items:
            type: string
            example: demo_macOS
        fleetIds:
          type: array
          description: IDs of the fleets the source template is associated with
          items:
            maxLength: 16
            minLength: 16
            type: string
            example: 0000000006243FDD
      description: Agent selector conditions
    UpgradeSchemaRef:
      required:
        - type
        - version
      type: object
      properties:
        type:
          type: string
          description: type of source template.
          example: Apache
        version:
          type: string
          description: version of source template.
          example: 1.0.0
      description: schema reference for upgrade source template request.
    LinkingUpdatedSourceTemplateDetails:
      required:
        - reasonTags
        - sourceTemplateDefinition
      type: object
      properties:
        sourceTemplateDefinition:
          $ref: '#/components/schemas/SourceTemplateDefinition'
        reasonTags:
          type: array
          description: tags which are responsible for source template and collector linking impact.
          items:
            type: array
            items:
              $ref: '#/components/schemas/CollectorTag'
      description: source template details with tags responsible for otCollector Linking update.
    OtTag:
      required:
        - key
        - values
      type: object
      properties:
        key:
          type: string
          description: key of the given tag.
          example: key1
        values:
          type: array
          description: values of the given tag.
          items:
            type: string
            example: value1
    CollectorTag:
      required:
        - key
        - values
      type: object
      properties:
        key:
          type: string
          description: Key of the given tag.
          example: key1
        value:
          type: string
          description: Values of the given tag.
          example: value1
  x-stackQL-resources:
    source_templates:
      id: sumologic.source_templates.source_templates
      name: source_templates
      title: Source Templates
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1sourceTemplates/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1sourceTemplates/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1v1~1sourceTemplates~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1sourceTemplates~1{id}/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        delete:
