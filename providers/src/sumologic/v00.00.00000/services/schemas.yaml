openapi: 3.0.0
info:
  title: Sumo Logic Schemas API
  description: Schema identities grouped by product (Schema Base Management).
  version: 1.0.0
paths:
  /v1/schemaIdentitiesGrouped:
    get:
      tags:
        - schemaBaseManagement
      summary: Get schema base identities grouped by type and sorted by version.
      description: Get a summary of all available schema bases grouped by type and their versions sorted by latest.
      operationId: getSchemaIdentitiesGrouped
      responses:
        '200':
          description: A summary of all available schema bases grouped by type and their versions sorted by latest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSchemaBaseTypeToVersionsResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ListSchemaBaseTypeToVersionsResponse:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: List of maps containing the mappings schema type -> versions.
          items:
            $ref: '#/components/schemas/SchemaBaseTypeToVersionsResponse'
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    SchemaBaseTypeToVersionsResponse:
      required:
        - type
        - versions
      type: object
      properties:
        type:
          type: string
          description: The type of the schema.
          example: Okta
        versions:
          type: array
          description: List of schema base identities sorted by latest version for a specific schema type.
          items:
            $ref: '#/components/schemas/SchemaBaseComplete'
      description: Map of the schema base type to its list of schema base identities.
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    SchemaBaseComplete:
      type: object
      required:
        - family
        - schema
        - type
        - version
        - id
      properties:
        type:
          maxLength: 128
          minLength: 1
          type: string
          description: The type of the integration.
          example: Okta
        version:
          maxLength: 128
          minLength: 5
          pattern: ^([0-9]+)\.([0-9]+)\.([0-9]+)$
          type: string
          description: The version (or image tag) of the integration. Follows the Major.Minor.Patch semantic versioning format.
          example: 1.0.0
          x-pattern-message: 'must follow semantic versioning: https://semver.org/'
        description:
          maxLength: 1024
          minLength: 0
          type: string
          description: The description of the integration.
          example: An Okta integration that collects Okta event logs into Sumo Logic.
        manifest:
          maxProperties: 1000
          type: object
          additionalProperties: true
          description: The manifest of the integration.
        schema:
          maxProperties: 1000
          type: object
          additionalProperties: true
          description: The schema in JSON Schema specification.
        family:
          type: string
          description: The family to which schema belong.
          enum:
            - OTC_Source_Template
            - OTEL_Component
        id:
          type: string
          description: Unique identifier of the schema.
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        templateYaml:
          maxLength: 10960
          minLength: 1
          type: string
          description: The template yaml of schema.
          example: example templateYaml
    SchemaBaseIdentityWithMetadata:
      type: object
      required:
        - family
        - schema
        - type
        - version
        - id
      properties:
        type:
          maxLength: 128
          minLength: 1
          type: string
          description: The type of the integration.
          example: Okta
        version:
          maxLength: 128
          minLength: 5
          pattern: ^([0-9]+)\.([0-9]+)\.([0-9]+)$
          type: string
          description: The version (or image tag) of the integration. Follows the Major.Minor.Patch semantic versioning format.
          example: 1.0.0
          x-pattern-message: 'must follow semantic versioning: https://semver.org/'
        description:
          maxLength: 1024
          minLength: 0
          type: string
          description: The description of the integration.
          example: An Okta integration that collects Okta event logs into Sumo Logic.
        manifest:
          maxProperties: 1000
          type: object
          additionalProperties: true
          description: The manifest of the integration.
        schema:
          maxProperties: 1000
          type: object
          additionalProperties: true
          description: The schema in JSON Schema specification.
        family:
          type: string
          description: The family to which schema belong.
          enum:
            - OTC_Source_Template
            - OTEL_Component
        id:
          type: string
          description: Unique identifier of the schema.
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
    SchemaBaseTemplateYaml:
      type: object
      properties:
        templateYaml:
          maxLength: 10960
          minLength: 1
          type: string
          description: The template yaml of schema.
          example: example templateYaml
    SchemaBaseIdentity:
      required:
        - family
        - schema
        - type
        - version
      type: object
      properties:
        type:
          maxLength: 128
          minLength: 1
          type: string
          description: The type of the integration.
          example: Okta
        version:
          maxLength: 128
          minLength: 5
          pattern: ^([0-9]+)\.([0-9]+)\.([0-9]+)$
          type: string
          description: The version (or image tag) of the integration. Follows the Major.Minor.Patch semantic versioning format.
          example: 1.0.0
          x-pattern-message: 'must follow semantic versioning: https://semver.org/'
        description:
          maxLength: 1024
          minLength: 0
          type: string
          description: The description of the integration.
          example: An Okta integration that collects Okta event logs into Sumo Logic.
        manifest:
          maxProperties: 1000
          type: object
          additionalProperties: true
          description: The manifest of the integration.
        schema:
          maxProperties: 1000
          type: object
          additionalProperties: true
          description: The schema in JSON Schema specification.
        family:
          type: string
          description: The family to which schema belong.
          enum:
            - OTC_Source_Template
            - OTEL_Component
  x-stackQL-resources:
    schema_identities:
      id: sumologic.schemas.schema_identities
      name: schema_identities
      title: Schema Identities
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1schemaIdentitiesGrouped/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/schema_identities/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.{region}.sumologic.com/api
    description: Sumo Logic deployment API endpoint
    variables:
      region:
        description: Sumo Logic deployment (au, ca, ch, de, eu, fed, in, jp, kr, us1, us2). Resolved from the SUMOLOGIC_ENVIRONMENT environment variable when it is set (x-stackQL-envVar, the same variable the Terraform provider reads); otherwise defaults to us2. A WHERE region = '...' value always takes precedence.
        enum:
          - au
          - ca
          - ch
          - de
          - eu
          - fed
          - in
          - jp
          - kr
          - us1
          - us2
        default: us2
        x-stackQL-envVar: SUMOLOGIC_ENVIRONMENT
x-stackQL-config:
  pagination:
    requestToken:
      key: token
      location: query
    responseToken:
      key: next
      location: body
