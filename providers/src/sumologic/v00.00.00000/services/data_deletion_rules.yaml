openapi: 3.0.0
info:
  title: Sumo Logic Data Deletion Rules API
  description: Data deletion rules that remove already-ingested log data.
  version: 1.0.0
paths:
  /v1/dataDeletionRules:
    get:
      tags:
        - dataDeletionRules
      summary: Get a list of Data Deletion Rules
      description: Get a list of data deletion rules in the organization. The response is paginated with a default limit of 50 rules.
      operationId: listDeletionRules
      parameters:
        - name: limit
          in: query
          description: Limit the number of deletion Rules returned in the response
          required: false
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
            default: 50
          example: 100
        - name: token
          in: query
          description: Continuation token to get the next page of results. A page object with the next continuation token is returned in the response body. Subsequent GET requests should specify the continuation token to get the next page of results. `token` is set to null when no more pages are left.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of data deletion Rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeletionRulesResponse'
        default:
          description: Operation failed with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - dataDeletionRules
      summary: Create a new Data Deletion Rule
      description: Create a new data deletion rule to delete logs.
      operationId: createDataDeletionRule
      parameters: []
      requestBody:
        description: Information about the new deletion rule.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeletionRuleRequest'
        required: true
      responses:
        '200':
          description: The data deletion Rule that has been created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRuleDefinition'
        default:
          description: Operation failed with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/dataDeletionRules/{id}:
    get:
      tags:
        - dataDeletionRules
      summary: Get Data Deletion Rule information for the given Id.
      description: Get Data Deletion Rule information for the given Id with updated fields.
      operationId: getDataDeletionRule
      parameters:
        - name: id
          in: path
          description: Identifier of the Deletion Rule to fetch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The data deletion Rule Definition that was requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRuleDefinition'
        default:
          description: Operation failed with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/dataDeletionRules/{id}/cancel:
    post:
      tags:
        - dataDeletionRules
      summary: Cancel the data Deletion Rule with the given Id.
      description: Cancel the data Deletion Rule with the given Id. Allowed only if the rule is waiting for approval.
      operationId: cancelDataDeletionRule
      parameters:
        - name: id
          in: path
          description: Identifier of the Deletion Rule to cancel
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The data deletion Rule has been cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRuleDefinition'
        default:
          description: Operation failed with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/dataDeletionRules/{id}/delete:
    delete:
      tags:
        - dataDeletionRules
      summary: Delete the data Deletion Rule with the given Id.
      description: Delete the data Deletion Rule with the given Id. Allowed only if the rule is cancelled.
      operationId: deleteDataDeletionRule
      parameters:
        - name: id
          in: path
          description: Identifier of the Deletion Rule to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The data deletion Rule has been deleted successfully.
        default:
          description: Operation failed with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ListDeletionRulesResponse:
      required:
        - deletionRulesList
      type: object
      properties:
        deletionRulesList:
          type: array
          description: List of data deletion rules.
          items:
            $ref: '#/components/schemas/DeletionRuleDefinition'
        next:
          type: string
          description: Next Continuation token
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    CreateDeletionRuleRequest:
      required:
        - endMillis
        - query
        - ruleName
        - ruleReason
        - startMillis
      type: object
      properties:
        ruleName:
          maxLength: 127
          minLength: 1
          type: string
          description: Name of the deletion rule.
        ruleReason:
          maxLength: 255
          minLength: 1
          type: string
          description: Reason mentioning what data is being deleted and why.
        query:
          maxLength: 15000
          minLength: 0
          type: string
          description: query to filter out the logs that need to be deleted.
        startMillis:
          type: integer
          description: Start time of the search as a number of milliseconds.
          format: int64
          example: 1704976268773
        endMillis:
          type: integer
          description: End time of the search as a number of milliseconds.
          format: int64
          example: 1704977168773
        byReceiptTime:
          type: boolean
          description: Flag to order the search results in the order collector received it. This has the value `true` if the search is to be run by receipt time and `false` if it is to be run by message time.
          default: false
        timezone:
          type: string
          description: Timezone for the resolving timerange from startMillis,endMillis
          default: UTC
        parsingMode:
          pattern: ^(AutoParse|Manual)$
          type: string
          description: |-
            Define the parsing mode to scan the JSON format log messages. Possible values are:
              1. `AutoParse`
              2. `Manual`
            In AutoParse mode, the system automatically figures out fields to parse based on the search query. While in the Manual mode, no fields are parsed out automatically. For more information see [Dynamic Parsing](https://help.sumologic.com/?cid=0011).
          example: AutoParse
          default: Manual
    DeletionRuleDefinition:
      required:
        - endMillis
        - query
        - ruleName
        - ruleReason
        - startMillis
      type: object
      properties:
        ruleName:
          maxLength: 127
          minLength: 1
          type: string
          description: Name of the deletion rule.
        ruleReason:
          maxLength: 255
          minLength: 1
          type: string
          description: Reason mentioning what data is being deleted and why.
        query:
          maxLength: 15000
          minLength: 0
          type: string
          description: query to filter out the logs that need to be deleted.
        startMillis:
          type: integer
          description: Start time of the search as a number of milliseconds.
          format: int64
          example: 1704976268773
        endMillis:
          type: integer
          description: End time of the search as a number of milliseconds.
          format: int64
          example: 1704977168773
        byReceiptTime:
          type: boolean
          description: Flag to order the search results in the order collector received it. This has the value `true` if the search is to be run by receipt time and `false` if it is to be run by message time.
          default: false
        timezone:
          type: string
          description: Timezone for the resolving timerange from startMillis,endMillis
          default: UTC
        parsingMode:
          pattern: ^(AutoParse|Manual)$
          type: string
          description: |-
            Define the parsing mode to scan the JSON format log messages. Possible values are:
              1. `AutoParse`
              2. `Manual`
            In AutoParse mode, the system automatically figures out fields to parse based on the search query. While in the Manual mode, no fields are parsed out automatically. For more information see [Dynamic Parsing](https://help.sumologic.com/?cid=0011).
          example: AutoParse
          default: Manual
        id:
          type: string
          description: Identifier for the deletion rule.
        createdAt:
          type: string
          description: Creation timestamp in UTC.
          format: date-time
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
        error:
          type: string
          description: Errors related to the deletion rule.
        status:
          type: string
          description: Status of the deletion rule.
        createdBy:
          type: string
          description: Identifier of the user who created the deletion rule.
          example: 0000000006743FE8
        modifiedBy:
          type: string
          description: Identifier of the user who last modified the resource.
          example: 0000000006743FE8
        deletedRanges:
          type: array
          description: List of the different units of deleted ranges since the deletion rule has been created.
          items:
            $ref: '#/components/schemas/DeletedRange'
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    DeletedRange:
      required:
        - endTime
        - startTime
      type: object
      properties:
        startTime:
          type: string
          description: Start of the timestamp for each unit of filled ranges, expressed in timeZone specified in rule.
          format: date-time
        endTime:
          type: string
          description: End of the timestamp for each unit of filled ranges, expressed in timeZone specified in rule.
          format: date-time
      description: Range of timestamps from which logs obtained from the query have been deleted.
  x-stackQL-resources:
    data_deletion_rules:
      id: sumologic.data_deletion_rules.data_deletion_rules
      name: data_deletion_rules
      title: Data Deletion Rules
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1dataDeletionRules/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.deletionRulesList
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1dataDeletionRules/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1v1~1dataDeletionRules~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        cancel:
          operation:
            $ref: '#/paths/~1v1~1dataDeletionRules~1{id}~1cancel/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete:
          operation:
            $ref: '#/paths/~1v1~1dataDeletionRules~1{id}~1delete/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/data_deletion_rules/methods/get'
          - $ref: '#/components/x-stackQL-resources/data_deletion_rules/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/data_deletion_rules/methods/create'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/data_deletion_rules/methods/delete'
        replace: []
servers:
  - url: https://api.{region}.sumologic.com/api
    description: Sumo Logic deployment API endpoint
    variables:
      region:
        description: Sumo Logic deployment (au, ca, ch, de, eu, fed, in, jp, kr, us1, us2). Resolved from the SUMOLOGIC_ENVIRONMENT environment variable when it is set (x-stackQL-envVar, the same variable the Terraform provider reads); otherwise defaults to us2. A WHERE region = '...' value always takes precedence.
        enum:
          - au
          - ca
          - ch
          - de
          - eu
          - fed
          - in
          - jp
          - kr
          - us1
          - us2
        default: us2
        x-stackQL-envVar: SUMOLOGIC_ENVIRONMENT
x-stackQL-config:
  pagination:
    requestToken:
      key: token
      location: query
    responseToken:
      key: next
      location: body
