openapi: 3.0.0
info:
  title: Sumo Logic Budgets API
  description: Data volume and search cost budgets and their usage.
  version: 1.0.0
paths:
  /v1/budgets:
    get:
      tags:
        - budgetManagement
      summary: Get budgets
      description: Get budgets
      operationId: getBudgets
      parameters:
        - name: limit
          in: query
          description: Limit the number of budgets returned in the response. The number of budgets returned may be less than the `limit`.
          required: false
          schema:
            maximum: 1000
            minimum: 1
            type: integer
            format: int32
            default: 100
        - name: token
          in: query
          description: Continuation token to get the next page of results. A page object with the next continuation token is returned in the response body. Subsequent GET requests should specify the continuation token to get the next page of results.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Budgets assigned to the org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBudgetList'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - budgetManagement
      summary: Creates a budget definition
      description: Create a budget definition
      operationId: createBudget
      parameters: []
      requestBody:
        description: Information about the new budget.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanBudgetDefinition'
        required: true
      responses:
        '200':
          description: The created budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBudget'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/budgets/{budgetId}:
    get:
      tags:
        - budgetManagement
      summary: Get budget
      description: Get budget
      operationId: getBudget
      parameters:
        - name: budgetId
          in: path
          description: The id of the budget.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBudget'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - budgetManagement
      summary: Update budget
      description: Update budget
      operationId: updateBudget
      parameters:
        - name: budgetId
          in: path
          description: The id of the budget.
          required: true
          schema:
            type: string
      requestBody:
        description: Updated budget.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanBudgetDefinition'
        required: true
      responses:
        '200':
          description: The updated budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBudget'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - budgetManagement
      summary: Delete budget
      description: Delete budget
      operationId: deleteBudget
      parameters:
        - name: budgetId
          in: path
          description: The id of the budget.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The budget was successfully deleted.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/budgets/usage:
    get:
      tags:
        - budgetManagement
      summary: Get budget usages
      description: Get budget usages
      operationId: getBudgetUsages
      parameters:
        - name: limit
          in: query
          description: Limit the number of budget usages returned in the response. The number of budget usages returned may be less than the `limit`.
          required: false
          schema:
            maximum: 1000
            minimum: 1
            type: integer
            format: int32
            default: 100
        - name: token
          in: query
          description: Continuation token to get the next page of results. A page object with the next continuation token is returned in the response body. Subsequent GET requests should specify the continuation token to get the next page of results.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Scan budget usages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBudgetUsageList'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/budgets/{budgetId}/usage:
    get:
      tags:
        - budgetManagement
      summary: Get budget usage
      description: Get budget usage
      operationId: getBudgetUsage
      parameters:
        - name: budgetId
          in: path
          description: The id of the budget.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested budget usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBudgetUsage'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ScanBudgetList:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: List of scan budgets.
          items:
            $ref: '#/components/schemas/ScanBudget'
        next:
          type: string
          description: Next continuation token.
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    ScanBudgetDefinition:
      required:
        - action
        - applicableOn
        - budgetType
        - capacity
        - groupBy
        - name
        - scope
        - unit
        - window
      type: object
      properties:
        name:
          type: string
          description: Name of the budget.
        capacity:
          type: integer
          description: Capacity of the budget.
          format: int64
        unit:
          pattern: ^(GB|MB|TB|KB)$
          type: string
          description: Unit of the budget.
          example: GB
        budgetType:
          $ref: '#/components/schemas/BudgetType'
        scope:
          $ref: '#/components/schemas/ScanBudgetScope'
        window:
          pattern: ^(Query|Daily|Weekly|Monthly)$
          type: string
          description: Window of the budget. Use Daily/Weekly/Monthly for creating a time based budget (beta)
          example: Query
        applicableOn:
          pattern: ^(PerEntity|Sum)$
          type: string
          description: Grouping of the budget.
          example: PerEntity
        groupBy:
          pattern: ^(User)$
          type: string
          description: Grouping Entity of the budget.
          example: User
        action:
          pattern: ^(StopScan|StopForeGroundScan|Warn)$
          type: string
          description: Action to be taken if the budget is breached
          example: Warn
        callerModules:
          type: array
          description: Caller modules this budget applies to. Empty list means budget applies to all callers.
          example:
            - api
            - mcp
          items:
            type: string
        status:
          pattern: ^(active|inactive)$
          type: string
          description: Signifies the state of the budget. (Active/Inactive)
          example: active
    ScanBudget:
      required:
        - action
        - applicableOn
        - budgetType
        - capacity
        - groupBy
        - name
        - scope
        - unit
        - window
        - createdAt
        - createdBy
        - id
        - modifiedAt
        - modifiedBy
        - orgId
        - resetDateOfMonth
        - resetDayOfWeek
        - resetTime
        - resetTimeZone
      type: object
      properties:
        name:
          type: string
          description: Name of the budget.
        capacity:
          type: integer
          description: Capacity of the budget.
          format: int64
        unit:
          pattern: ^(GB|MB|TB|KB)$
          type: string
          description: Unit of the budget.
          example: GB
        budgetType:
          $ref: '#/components/schemas/BudgetType'
        scope:
          $ref: '#/components/schemas/ScanBudgetScope'
        window:
          pattern: ^(Query|Daily|Weekly|Monthly)$
          type: string
          description: Window of the budget. Use Daily/Weekly/Monthly for creating a time based budget (beta)
          example: Query
        applicableOn:
          pattern: ^(PerEntity|Sum)$
          type: string
          description: Grouping of the budget.
          example: PerEntity
        groupBy:
          pattern: ^(User)$
          type: string
          description: Grouping Entity of the budget.
          example: User
        action:
          pattern: ^(StopScan|StopForeGroundScan|Warn)$
          type: string
          description: Action to be taken if the budget is breached
          example: Warn
        callerModules:
          type: array
          description: Caller modules this budget applies to. Empty list means budget applies to all callers.
          example:
            - api
            - mcp
          items:
            type: string
        status:
          pattern: ^(active|inactive)$
          type: string
          description: Signifies the state of the budget. (Active/Inactive)
          example: active
        id:
          type: string
          description: Id of the budget.
        orgId:
          type: string
          description: Org Id of the org for the budget.
        resetTime:
          maxLength: 5
          minLength: 5
          type: string
          description: Reset time of the time based scan budget in HH:MM format
          example: '23:30'
          default: '00:00'
        resetTimeZone:
          type: string
          description: Time zone of the reset time for the time based scan budget. Follow the format in the [IANA Time Zone Database](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
          example: America/Los_Angeles
          default: Etc/UTC
        resetDayOfWeek:
          pattern: ^(MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY|SATURDAY|SUNDAY)$
          type: string
          description: The day of the week when the budget resets, applicable for time based budgets with a Weekly window. Must be a valid day of the week.
          default: MONDAY
        resetDateOfMonth:
          maximum: 28
          minimum: 1
          type: integer
          description: The date of the month when the budget resets, applicable for time based budgets with a Monthly window. Must be a valid day of the month (1-28).
          format: int32
          default: 1
        createdAt:
          type: string
          description: Date & time when budget was created.
          format: date-time
        createdBy:
          type: string
          description: Id of the user who created the budget.
        modifiedAt:
          type: string
          description: Date & time when budget was last modified.
          format: date-time
        modifiedBy:
          type: string
          description: Id of the user who last modified the budget.
    ScanBudgetUsageList:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: List of budget usages
          items:
            $ref: '#/components/schemas/ScanBudgetUsage'
        next:
          type: string
          description: Next continuation token.
    ScanBudgetUsage:
      required:
        - budgetId
        - usage
        - usagePercentage
      type: object
      properties:
        budgetId:
          type: string
          description: Budget id.
        usage:
          type: integer
          description: Budget usage (in bytes).
          format: int64
        usagePercentage:
          type: integer
          description: Budget usage percentage.
          format: int64
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    BudgetType:
      pattern: ^(ScanBudget)$
      type: string
      description: Type of the budget.
      example: ScanBudget
    ScanBudgetScope:
      required:
        - excludedRoles
        - excludedUsers
        - includedRoles
        - includedUsers
      type: object
      properties:
        includedUsers:
          type: array
          description: List of userIds included in the budget.
          example:
            - 00000000000001DF
            - 00000000000002D2
          items:
            type: string
        excludedUsers:
          type: array
          description: List of userIds excluded in the budget.
          example:
            - 00000000000001DF
            - 00000000000002D2
          items:
            type: string
        includedRoles:
          type: array
          description: List of roleIds included in the budget.
          example:
            - 00000000000001DF
            - 00000000000002D2
          items:
            type: string
        excludedRoles:
          type: array
          description: List of roleIds excluded in the budget.
          example:
            - 00000000000001DF
            - 00000000000002D2
          items:
            type: string
  x-stackQL-resources:
    budgets:
      id: sumologic.budgets.budgets
      name: budgets
      title: Budgets
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1budgets/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1budgets/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1v1~1budgets~1{budgetId}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1budgets~1{budgetId}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        delete:
          operation:
            $ref: '#/paths/~1v1~1budgets~1{budgetId}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/budgets/methods/get'
          - $ref: '#/components/x-stackQL-resources/budgets/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/budgets/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/budgets/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/budgets/methods/delete'
        replace: []
    usages:
      id: sumologic.budgets.usages
      name: usages
      title: Usages
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1budgets~1usage/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1v1~1budgets~1{budgetId}~1usage/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/usages/methods/get'
          - $ref: '#/components/x-stackQL-resources/usages/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.{region}.sumologic.com/api
    description: Sumo Logic deployment API endpoint
    variables:
      region:
        description: Sumo Logic deployment (au, ca, ch, de, eu, fed, in, jp, kr, us1, us2). Resolved from the SUMOLOGIC_ENVIRONMENT environment variable when it is set (x-stackQL-envVar, the same variable the Terraform provider reads); otherwise defaults to us2. A WHERE region = '...' value always takes precedence.
        enum:
          - au
          - ca
          - ch
          - de
          - eu
          - fed
          - in
          - jp
          - kr
          - us1
          - us2
        default: us2
        x-stackQL-envVar: SUMOLOGIC_ENVIRONMENT
x-stackQL-config:
  pagination:
    requestToken:
      key: token
      location: query
    responseToken:
      key: next
      location: body
