        - users
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 1
          type: string
          description: Name of the role.
          example: DataAdmin
        description:
          maxLength: 255
          minLength: 0
          type: string
          description: Description of the role.
          example: Manage data of the org.
        logAnalyticsFilter:
          type: string
          description: A search filter which would be applied on partitions which belong to Log Analytics product area.
          example: '!_sourceCategory=collector'
        auditDataFilter:
          type: string
          description: 'A search filter which would be applied on partitions which belong to Audit Data product area. Help Doc : (https://help.sumologic.com/docs/manage/security/audit-index/).'
          example: info
        securityDataFilter:
          type: string
          description: A search filter which would be applied on partitions which belong to Security Data product area.
          example: error
        selectionType:
          type: string
          description: |-
            Describes the Permission Construct for the list of views in "selectedViews" parameter. 
            ### Valid Values are : 
              - `All` selectionType would allow access to all views in the org.
              - `Allow` selectionType would allow access to specific views mentioned in "selectedViews" parameter.
              - `Deny` selectionType would deny access to specific views mentioned in "selectedViews" parameter.
          example: All
        selectedViews:
          type: array
          description: List of views which with specific view level filters in accordance to the selectionType chosen.
          items:
            $ref: '#/components/schemas/ViewFilterDefinition'
        users:
          type: array
          description: List of user identifiers to assign the role to.
          example:
            - 0000000006743FE0
            - 0000000005FCE0EE
          items:
            type: string
        capabilities:
          type: array
          description: |-
            List of [capabilities](https://help.sumologic.com/Manage/Users-and-Roles/Manage-Roles/Role-Capabilities) associated with this role. Valid values are
            ### Data Management
              - viewCollectors
              - manageCollectors
