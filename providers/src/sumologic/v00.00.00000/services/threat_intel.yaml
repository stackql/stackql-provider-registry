openapi: 3.0.0
info:
  title: Sumo Logic Threat Intel API
  description: Threat intelligence datastore, data sources, retention and indicator ingestion.
  version: 1.0.0
paths:
  /v1/threatIntel/datastore/db:
    get:
      tags:
        - threatIntelIngest
      summary: Get threat intel indicators DB information
      description: Get threat intel indicators DB information, such as storage utilization and indicator counts
      operationId: datastoreGet
      responses:
        '200':
          description: Threat intel ingest DB information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatastoreStatusResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - threatIntelIngest
      summary: Remove the threat intel indicators DB
      description: Removes the entire database and all indicators associated with this tenant
      operationId: removeDatastore
      responses:
        '204':
          description: Removing the indicator database succeeded
        default:
          description: Operation failed with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/threatIntel/datastore/retentionPeriod:
    get:
      tags:
        - threatIntelIngest
      summary: Get threat intel indicators store retention period in terms of days.
      description: Get the threat intel indicators store retention period in terms of days.
      operationId: retentionPeriod
      responses:
        '200':
          description: Threat intel indicators store retention period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatastoreRetentionPeriod'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - threatIntelIngest
      summary: Set the threat intel indicators store retention period in terms of days.
      description: Sets the threat intel indicators store retention period in terms of days.
      operationId: setRetentionPeriod
      parameters: []
      requestBody:
        description: The threat intel indicators store retention period in terms of days.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatastoreRetentionPeriod'
        required: true
      responses:
        '200':
          description: Threat intel indicators store retention period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatastoreRetentionPeriod'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/threatIntel/datastore/indicators/normalized:
    post:
      tags:
        - threatIntelIngestProducer
      summary: Uploads indicators in a Sumo normalized format.
      description: Uploads a list indicators in a Sumo normalized format.
      operationId: uploadNormalizedIndicators
      parameters: []
      requestBody:
        description: The list of normalized threat intel indicators to upload.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadNormalizedIndicatorRequest'
        required: true
      responses:
        '204':
          description: Normalized indicators successfully uploaded.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/threatIntel/datastore/indicators/stix:
    post:
      tags:
        - threatIntelIngestProducer
      summary: Uploads indicators in a STIX 2.x json format.
      description: Uploads a list indicators in in a STIX 2.x json format.
      operationId: uploadStixIndicators
      parameters: []
      requestBody:
        description: Upload stix indicators request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadStixIndicatorsRequest'
        required: true
      responses:
        '200':
          description: Stix indicators successfully uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStixIndicatorsResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/threatIntel/datastore/indicators:
    delete:
      tags:
        - threatIntelIngestProducer
      summary: Removes indicators by their IDS
      description: Removes indicators by specifying a list of indicator IDs
      operationId: removeIndicators
      parameters: []
      requestBody:
        description: The list of indicator IDs to remove
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveIndicatorsRequest'
        required: true
      responses:
        '204':
          description: Indicators successfully removed
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/threatIntel/datastore/dataSource/{dataSourceName}:
    put:
      tags:
        - threatIntelIngest
      summary: Updates source properties
      description: Updates source properties
      operationId: dataSourcePropertiesUpdate
      parameters:
        - name: dataSourceName
          in: path
          description: Source name
          required: true
          schema:
            type: string
      requestBody:
        description: Source properties
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceProperties'
        required: true
      responses:
        '204':
          description: Data source properties successfuly updated.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    DatastoreStatusResponse:
      required:
        - diskSize
        - indicatorCount
        - indicatorLimit
        - sourceStatus
      type: object
      properties:
        diskSize:
          type: integer
          description: Total DB size in terms of disk bytes
          format: int64
          example: 1024
        indicatorCount:
          type: integer
          description: Total number of indicators in the DB
          format: int64
          example: 100
        indicatorLimit:
          type: integer
          description: Limit number of indicators supported in the DB
          format: int64
          example: 10000000
        sourceStatus:
          type: array
          description: A list of sources and their individual DB sizes and indicator counts
          items:
            $ref: '#/components/schemas/DatastoreSourceStatusResponse'
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    DatastoreRetentionPeriod:
      required:
        - retentionPeriod
      type: object
      properties:
        retentionPeriod:
          type: integer
          description: Retention period in days.
          format: int64
          example: 120
    UploadNormalizedIndicatorRequest:
      required:
        - indicators
      type: object
      properties:
        indicators:
          type: array
          description: The list of normalized threat intel indicators to upload.
          items:
            $ref: '#/components/schemas/NormalizedIndicator'
    UploadStixIndicatorsRequest:
      required:
        - indicators
        - source
      type: object
      properties:
        source:
          type: string
          description: User-provided text to identify the source of the indicator
          example: FreeTAXII
        indicators:
          type: array
          description: The list of stix threat intel indicators to upload.
          items:
            $ref: '#/components/schemas/StixIndicator'
    UploadStixIndicatorsResponse:
      required:
        - invalidIndicators
      type: object
      properties:
        invalidIndicators:
          type: array
          description: A list of invalid indicator IDs that were not ingested
          example:
            - indicator--foo
            - indicator--bar
          items:
            type: string
    RemoveIndicatorsRequest:
      required:
        - indicatorIds
        - source
      type: object
      properties:
        source:
          type: string
          description: The source of the indicator ID to match against
          example: Crowdstrike
        indicatorIds:
          type: array
          description: The list of indicator IDs to match against
          example:
            - indicator--abcd
            - indicator--ef012
          items:
            type: string
    DataSourceProperties:
      type: object
      properties:
        enabled:
          type: boolean
          description: True if enabled.
          example: true
        description:
          type: string
          description: The data source description.
          example: This is a stix1.2 data source.
    DatastoreSourceStatusResponse:
      required:
        - source
      type: object
      properties:
        source:
          type: string
          description: The source name
          example: unit42_source
        description:
          type: string
          description: The source description
          example: This is a stix1.2 indicators source
        diskSize:
          type: integer
          description: Disk utilization in bytes estimate for the indicator source
          format: int64
          example: 1024
        indicatorCount:
          type: integer
          description: Number of indicators for the indicator source
          format: int64
          example: 1024
        sumoProvided:
          type: boolean
          description: True if sumo provided source
          example: false
        supportsCat:
          type: boolean
          description: True if can be used in cat operator
          example: false
        enabled:
          type: boolean
          description: True if enabled
          example: true
      description: DB sizes and indicator counts for an individual source
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    NormalizedIndicator:
      required:
        - confidence
        - id
        - indicator
        - source
        - threatType
        - type
        - validFrom
      type: object
      properties:
        id:
          type: string
          description: ID of the indicator
          example: indicator--d81f86b9-975b-4c0b-875e-810c5ad45a4f
        indicator:
          type: string
          description: Value of the indicator
          example: 182.158.1.1
        type:
          type: string
          description: Type of indicator
          example: ipv4-addr
        source:
          type: string
          description: User-provided text to identify the source of the indicator
          example: FreeTAXII
        updated:
          type: string
          description: When this indicator was most recently updated in Sumo. Timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2023-03-21T12:00:00.000Z'
        validFrom:
          type: string
          description: Beginning time this indicator is valid. Timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2023-03-21T12:00:00.000Z'
        validUntil:
          type: string
          description: 'Time at which this indicator expires. If not set, a default TTL is applied based on indicator type and confidence. File hash indicators (type prefix `file:hashes`): 30/365/730 days for low/medium/high confidence. All other indicator types: 30/90/180 days for low/medium/high confidence. Confidence bands: low 0-49, medium 50-74, high 75-100. Timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.'
          format: date-time
          example: '2023-03-21T12:00:00.000Z'
        confidence:
          maximum: 100
          minimum: 1
          type: integer
          description: Confidence that the creator has in the correctness of their data, where 100 is highest
        threatType:
          type: string
          description: Type of indicator ( https://docs.oasis-open.org/cti/stix/v2.1/os/stix-v2.1-os.html#_cvhfwe3t9vuo )
          example: benign
        actors:
          type: string
          description: Actors as a comma separated list.
          example: actor1,actor2
        killChain:
          type: string
          description: Kill Chain as a comma separated list.
          example: KC1,KC2
        fields:
          maxProperties: 1000
          type: object
          additionalProperties:
            type: string
          description: Flattened fields from the original indicator object (e.g. flattened STIX fields)
    StixIndicator:
      required:
        - created
        - id
        - modified
        - pattern
        - pattern_type
        - spec_version
        - type
        - valid_from
      type: object
      properties:
        type:
          type: string
          description: The type property identifies the type of STIX Object.
          example: indicator
        spec_version:
          type: string
          description: The STIX version
          example: '2.1'
        id:
          type: string
          description: The ID of the indicator
          example: acme:indicator-bf8bc5d5-c7e6-46b0-8d22-7500fea77196
        created:
          type: string
          description: The time from which this Indicator is considered a valid indicator of the behaviors it is related or represents.
          format: date-time
          example: '2023-03-21T12:00:00.000Z'
        modified:
          type: string
          description: The time from which this Indicator is considered a valid indicator of the behaviors it is related or represents.
          format: date-time
          example: '2023-03-21T12:00:00.000Z'
        created_by_ref:
          type: string
          description: Identifier of type identity
          example: identity--f431f809-377b-45e0-aa1c-6a4751cae5ff
        revoked:
          type: boolean
          description: The revoked property is only used by STIX Objects that support versioning and indicates whether the object has been revoked.
        labels:
          type: array
          description: The labels property specifies a set of terms used to describe this object. The terms are user-defined or trust-group defined and their meaning is outside the scope of this specification and MAY be ignored.
          example:
            - heartbleed
            - has-logo
          items:
            type: string
        confidence:
          maximum: 100
          minimum: 1
          type: integer
          description: Confidence that the creator has in the correctness of their data, where 100 is highest
        lang:
          type: string
          description: The lang property identifies the language of the text content in this object. When present, it MUST be a language code conformant to [RFC5646]. If the property is not present, then the language of the content is en (English)
          example: en
        external_references:
          type: array
          description: A list of external references which refer to non-STIX information. This property MAY be used to provide one or more Vulnerability identifiers, such as a CVE ID
          items:
            $ref: '#/components/schemas/ExternalReference'
        object_marking_refs:
          type: array
          description: The object_marking_refs property specifies a list of id properties of marking-definition objects that apply to this object.
          example:
            - marking-definition--089a6ecb-cc15-43cc-9494-767639779123
          items:
            type: string
        granular_markings:
          type: array
          description: The granular_markings property specifies a list of granular markings applied to this object
          items:
            $ref: '#/components/schemas/GranularMarkingType'
        extensions:
          maxProperties: 1000
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Extension'
          description: Specifies any extensions of the object, as a dictionary
        name:
          type: string
          description: The name of the object
        description:
          type: string
          description: A human readable description
        indicator_types:
          type: array
          description: A set of categorizations for this indicator.
          example:
            - malicious-activity
          items:
            type: string
        pattern:
          type: string
          description: The detection pattern for this Indicator expressed as a STIX patter.
          example: '[ipv4-addr:value = ''1.2.3.4'']'
        pattern_type:
          type: string
          description: The type of pattern
          example: stix
        pattern_version:
          type: string
          description: The version of the pattern language that is used for the data in the pattern property which MUST match the type of pattern data included in the pattern property.
        valid_from:
          type: string
          description: The time from which this Indicator is considered a valid indicator of the behaviors it is related or represents.
          format: date-time
          example: '2023-03-21T12:00:00.000Z'
        valid_until:
          type: string
          description: 'The time at which this Indicator should no longer be considered a valid indicator of the behaviors it is related to or represents. If not set, a default TTL is applied based on indicator type and confidence. File hash indicators (type prefix `file:hashes`): 30/365/730 days for low/medium/high confidence. All other indicator types: 30/90/180 days for low/medium/high confidence. Confidence bands: low 0-49, medium 50-74, high 75-100.'
          format: date-time
          example: '2023-03-21T12:00:00.000Z'
        kill_chain_phases:
          type: array
          description: The list of Kill Chain Phases for which this Attack Pattern is used
          items:
            $ref: '#/components/schemas/KillChainPhase'
    ExternalReference:
      required:
        - source_name
      type: object
      properties:
        source_name:
          type: string
          description: The name of the source that the external-reference is defined within
          example: system
        description:
          type: string
          description: A human readable description
        url:
          type: string
          description: A URL reference to an external resource
          example: https://github.com/vz-risk/0001AA7F-C601-424A-B2B8-BE6C9F5164E7.json
        hashes:
          maxProperties: 1000
          type: object
          additionalProperties:
            type: string
          description: Specifies a dictionary of hashes for the contents of the url
          example:
            SHA-256: 6db12788c37247f2316052e142f42f4b259d6561751e5f401a1ae2a6df9c674b
        external_id:
          type: string
          description: An identifier for the external reference content
          example: 0001AA7F-C601-424A-B2B8-BE6C9F5164E7
    GranularMarkingType:
      required:
        - selectors
      type: object
      properties:
        lang:
          type: string
          description: The lang property identifies the language of the text identified by this marking
          example: en
        marking_ref:
          type: string
          description: The marking_ref property specifies the ID of the marking-definition object that describes the marking
          example: marking-definition--089a6ecb-cc15-43cc-9494-767639779123
        selectors:
          type: array
          description: The selectors property specifies a list of selectors for content contained within the STIX Object in which this property appears
          example:
            - description
            - labels
          items:
            type: string
    Extension:
      required:
        - created
        - created_by_ref
        - extension_types
        - id
        - modified
        - name
        - schema
        - spec_version
        - type
        - version
      type: object
      properties:
        type:
          type: string
          description: The type property identifies the type of object
          example: indicator
        spec_version:
          type: string
          description: The STIX version
          example: '2.1'
        id:
          type: string
          description: The ID of the indicator
          example: acme:indicator-bf8bc5d5-c7e6-46b0-8d22-7500fea77196
        created:
          type: string
          description: The time from which this Indicator is considered a valid indicator of the behaviors it is related or represents.
          format: date-time
          example: '2023-03-21T12:00:00.000Z'
        modified:
          type: string
          description: The time from which this Indicator is considered a valid indicator of the behaviors it is related or represents.
          format: date-time
          example: '2023-03-21T12:00:00.000Z'
        created_by_ref:
          type: string
          description: Identifier of type identity
          example: identity--f431f809-377b-45e0-aa1c-6a4751cae5ff
        revoked:
          type: boolean
          description: The revoked property is only used by STIX Objects that support versioning and indicates whether the object has been revoked.
        labels:
          type: array
          description: The labels property specifies a set of terms used to describe this object. The terms are user-defined or trust-group defined and their meaning is outside the scope of this specification and MAY be ignored.
          example:
            - heartbleed
            - has-logo
          items:
            type: string
        external_references:
          type: array
          description: A list of external references which refer to non-STIX information. This property MAY be used to provide one or more Vulnerability identifiers, such as a CVE ID
          items:
            $ref: '#/components/schemas/ExternalReference'
        object_marking_refs:
          type: array
          description: The object_marking_refs property specifies a list of id properties of marking-definition objects that apply to this object.
          example:
            - marking-definition--089a6ecb-cc15-43cc-9494-767639779123
          items:
            type: string
        granular_markings:
          type: array
          description: The granular_markings property specifies a list of granular markings applied to this object
          items:
            $ref: '#/components/schemas/GranularMarkingType'
        name:
          type: string
          description: The name of the object
        description:
          type: string
          description: A human readable description
        schema:
          type: string
          description: The normative definition of the extension, either as a URL or as plain text explaining the definition
          example: https://www.example.com/schema-my-favorite-sdo-1/v1
        version:
          type: string
          description: The version of this extension
        extension_types:
          type: array
          description: This property specifies one or more extension types contained within this extension
          items:
            type: string
            enum:
              - new-sdo
              - new-sco
              - new-sro
              - property-extension
              - toplevel-property-extension
        extension_properties:
          type: array
          description: This property contains the list of new property names that are added to an object by an extension
          items:
            type: string
    KillChainPhase:
      required:
        - kill_chain_name
      type: object
      properties:
        kill_chain_name:
          type: string
          description: The name of the kill chain. The value of this property SHOULD be all lowercase and SHOULD use hyphens instead of spaces or underscores as word separators
          example: lockheed-martin-cyber-kill-chain
        phase_name:
          type: string
          description: The name of the phase in the kill chain. The value of this property SHOULD be all lowercase and SHOULD use hyphens instead of spaces or underscores as word separators
          example: reconnaissance
  x-stackQL-resources:
    datastore:
      id: sumologic.threat_intel.datastore
      name: datastore
      title: Datastore
      methods:
        get:
          operation:
            $ref: '#/paths/~1v1~1threatIntel~1datastore~1db/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        delete:
          operation:
            $ref: '#/paths/~1v1~1threatIntel~1datastore~1db/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/datastore/methods/get'
        insert: []
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/datastore/methods/delete'
        replace: []
    retention_period:
      id: sumologic.threat_intel.retention_period
      name: retention_period
      title: Retention Period
      methods:
        get:
          operation:
            $ref: '#/paths/~1v1~1threatIntel~1datastore~1retentionPeriod/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1threatIntel~1datastore~1retentionPeriod/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/retention_period/methods/get'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/retention_period/methods/update'
        delete: []
        replace: []
    indicators:
      id: sumologic.threat_intel.indicators
      name: indicators
      title: Indicators
      methods:
        upload_normalized:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1threatIntel~1datastore~1indicators~1normalized/post'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            mediaType: application/json
            nativeCasing: camel
        upload_stix:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1threatIntel~1datastore~1indicators~1stix/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        remove:
          operation:
            $ref: '#/paths/~1v1~1threatIntel~1datastore~1indicators/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            mediaType: application/json
            nativeCasing: camel
      sqlVerbs:
        select: []
        insert: []
        update: []
        delete: []
        replace: []
    data_sources:
      id: sumologic.threat_intel.data_sources
      name: data_sources
      title: Data Sources
      methods:
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
