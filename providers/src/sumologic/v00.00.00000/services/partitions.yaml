openapi: 3.0.0
info:
  title: Sumo Logic Partitions API
  description: Partitions (indexes), their retention and decommissioning, and the partition quota.
  version: 1.0.0
paths:
  /v1/partitions:
    get:
      tags:
        - partitionManagement
      summary: Get a list of partitions.
      description: Get a list of all partitions in the organization. The response is paginated with a default limit of 100 partitions per page.
      operationId: listPartitions
      parameters:
        - name: limit
          in: query
          description: Limit the number of partitions returned in the response. The number of partitions returned may be less than the `limit`.
          required: false
          schema:
            maximum: 1000
            minimum: 1
            type: integer
            format: int32
            default: 100
        - name: token
          in: query
          description: Continuation token to get the next page of results. A page object with the next continuation token is returned in the response body. Subsequent GET requests should specify the continuation token to get the next page of results. `token` is set to null when no more pages are left.
          required: false
          schema:
            type: string
        - name: viewTypes
          in: query
          description: |-
            The type of partitions to retrieve. Valid values are:
              1. `DefaultView`: To get General Index partition.
              2. `Partition`: To get user defined views/partitions.
              3. `AuditIndex`: To get the internal audit indexes. Eg. sumologic_audit_events.

            More than one type of partitions can be retrieved in same request.
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              pattern: ^(AuditIndex|Partition|DefaultView)$
              type: string
          example:
            - AuditIndex
            - Partition
      responses:
        '200':
          description: A paginated list of partitions in the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPartitionsResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - partitionManagement
      summary: Create a new partition.
      description: Create a new partition.
      operationId: createPartition
      parameters: []
      requestBody:
        description: Information about the new partition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartitionDefinition'
        required: true
      responses:
        '200':
          description: The partition has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/partitions/{id}:
    get:
      tags:
        - partitionManagement
      summary: Get a partition.
      description: Get a partition with the given identifier from the organization.
      operationId: getPartition
      parameters:
        - name: id
          in: path
          description: Identifier of partition to return.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Partition object that was requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - partitionManagement
      summary: Update a partition.
      description: Update an existing partition in the organization.
      operationId: updatePartition
      parameters:
        - name: id
          in: path
          description: Identifier of the partition to update.
          required: true
          schema:
            type: string
      requestBody:
        description: Information to update about the partition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartitionDefinition'
        required: true
      responses:
        '200':
          description: The partition was successfully modified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partition'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/partitions/{id}/decommission:
    post:
      tags:
        - partitionManagement
      summary: Decommission a partition.
      description: Decommission a partition with the given identifier from the organization.
      operationId: decommissionPartition
      parameters:
        - name: id
          in: path
          description: Identifier of the partition to decommission.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The partition was decommissioned successfully.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/partitions/{id}/cancelRetentionUpdate:
    post:
      tags:
        - partitionManagement
      summary: Cancel a retention update for a partition
      description: Cancel update to retention of a partition for which retention was updated previously using `reduceRetentionPeriodImmediately` parameter as false
      operationId: cancelRetentionUpdate
      parameters:
        - name: id
          in: path
          description: Identifier of the partition to cancel the retention update for.
          required: true
          schema:
            type: string
          example: 1
      responses:
        '204':
          description: The retention update was cancelled successfully.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/partitions/quota:
    get:
      tags:
        - partitionManagement
      summary: Provides information about partitions quota.
      description: Every customer can use a limited number of partitions. This endpoint allows learning about these limitations and remaining quota.
      operationId: getPartitionsQuota
      responses:
        '200':
          description: Current state of partitions quota usage (limit and remaining).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartitionsQuotaUsage'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ListPartitionsResponse:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: List of partitions.
          items:
            $ref: '#/components/schemas/Partition'
        next:
          type: string
          description: Next continuation token.
          example: '1'
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    CreatePartitionDefinition:
      required:
        - name
        - routingExpression
      type: object
      properties:
        name:
          maxLength: 255
          type: string
          description: The name of the partition.
          example: apache
        routingExpression:
          maxLength: 16384
          minLength: 1
          type: string
          description: The query that defines the data to be included in the partition.
          example: _sourcecategory=*/Apache
        analyticsTier:
          type: string
          description: |-
            The Data Tier where the data in the partition will reside. Possible values are:
                          1. `continuous`
                          2. `frequent`
                          3. `infrequent`
            Note: The "infrequent" and "frequent" tiers are only available to Cloud Flex Credits Enterprise Suite accounts.
          example: continuous
          x-limited-description: The Data Tier where the data in the partition will reside. You can leave it empty or send `flex`. It is the only value applicable on your account.
          x-limited-example: flex
        retentionPeriod:
          type: integer
          description: The number of days to retain data in the partition, or -1 to use the default value for your account.  Only relevant if your account has variable retention enabled.
          example: 365
          default: -1
        isCompliant:
          type: boolean
          description: Whether the partition is compliant or not. Mark a partition as compliant if it contains data used for compliance or audit purpose. Retention for a compliant partition can only be increased and cannot be reduced after the partition is marked compliant. A partition once marked compliant, cannot be marked non-compliant later.
          example: false
          default: false
        isIncludedInDefaultSearch:
          type: boolean
          description: Indicates whether the partition is included in the default search scope. When executing a  query such as "error | count," certain partitions are automatically part of the search scope.  However, for specific partitions, the user must explicitly mention the partition using the _index  term, as in "_index=webApp error | count". This property governs the default inclusion of the  partition in the search scope. Configuring this property is exclusively permitted for flex partitions.
          example: true
    Partition:
      type: object
      required:
        - name
        - routingExpression
        - createdAt
        - createdBy
        - modifiedAt
        - modifiedBy
        - id
        - totalBytes
      properties:
        name:
          maxLength: 255
          type: string
          description: The name of the partition.
          example: apache
        routingExpression:
          maxLength: 16384
          minLength: 1
          type: string
          description: The query that defines the data to be included in the partition.
          example: _sourcecategory=*/Apache
        analyticsTier:
          type: string
          description: |-
            The Data Tier where the data in the partition will reside. Possible values are:
                          1. `continuous`
                          2. `frequent`
                          3. `infrequent`
            Note: The "infrequent" and "frequent" tiers are only available to Cloud Flex Credits Enterprise Suite accounts.
          example: continuous
          x-limited-description: The Data Tier where the data in the partition will reside. You can leave it empty or send `flex`. It is the only value applicable on your account.
          x-limited-example: flex
        retentionPeriod:
          type: integer
          description: The number of days to retain data in the partition, or -1 to use the default value for your account.  Only relevant if your account has variable retention enabled.
          example: 365
          default: -1
        isCompliant:
          type: boolean
          description: Whether the partition is compliant or not. Mark a partition as compliant if it contains data used for compliance or audit purpose. Retention for a compliant partition can only be increased and cannot be reduced after the partition is marked compliant. A partition once marked compliant, cannot be marked non-compliant later.
          example: false
          default: false
        isIncludedInDefaultSearch:
          type: boolean
          description: Indicates whether the partition is included in the default search scope. When executing a  query such as "error | count," certain partitions are automatically part of the search scope.  However, for specific partitions, the user must explicitly mention the partition using the _index  term, as in "_index=webApp error | count". This property governs the default inclusion of the  partition in the search scope. Configuring this property is exclusively permitted for flex partitions.
          example: true
        newRetentionPeriod:
          type: integer
          description: If the retention period is scheduled to be updated in the future (i.e., if retention period is previously reduced with value of reduceRetentionPeriodImmediately as false), this property gives the future value of retention period while retentionPeriod gives the current value. retentionPeriod will take up the value of newRetentionPeriod after the scheduled time.
          format: int32
          example: 300
        retentionEffectiveAt:
          type: string
          description: When the newRetentionPeriod will become effective in UTC format.
          format: date-time
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the resource.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who last modified the resource.
          example: 0000000006743FE8
        id:
          type: string
          description: Unique identifier for the partition.
          example: '1'
        totalBytes:
          type: integer
          description: Size of data in partition in bytes.
          format: int64
          example: 42
        isActive:
          type: boolean
          description: This has the value `true` if the partition is active and `false` if it has been decommissioned.
        indexType:
          pattern: ^(DefaultIndex|AuditIndex|Partition)$
          type: string
          description: This has the value `DefaultIndex`, `AuditIndex`or `Partition` depending upon the type of partition.
          example: Partition
        dataForwardingId:
          type: string
          description: Id of the data forwarding configuration to be used by the partition.
    UpdatePartitionDefinition:
      type: object
      properties:
        retentionPeriod:
          type: integer
          description: The number of days to retain data in the partition, or -1 to use the default value for your account. Only relevant if your account has variable retention enabled.
          example: 365
        reduceRetentionPeriodImmediately:
          type: boolean
          description: This is required if the newly specified `retentionPeriod` is less than the existing retention period.  In such a situation, a value of `true` says that data between the existing retention period and the new  retention period should be deleted immediately; if `false`, such data will be deleted after seven days.  This property is optional and ignored if the specified `retentionPeriod` is greater than or equal to the  current retention period.
          default: false
        isCompliant:
          type: boolean
          description: Whether to mark a partition as compliant. Mark a partition as compliant if it contains data used for compliance or audit purpose. Retention for a compliant partition can only be increased and cannot be reduced after the partition marked as compliant. A partition once marked compliant, cannot be marked non-compliant later.
          example: false
          default: false
        isIncludedInDefaultSearch:
          type: boolean
          description: Indicates whether the partition is included in the default search scope. When executing a  query such as "error | count," certain partitions are automatically part of the search scope.  However, for specific partitions, the user must explicitly mention the partition using the _index  term, as in "_index=webApp error | count". This property governs the default inclusion of the  partition in the search scope. Configuring this property is exclusively permitted for flex partitions.
        routingExpression:
          maxLength: 16384
          minLength: 1
          type: string
          description: The query that defines the data to be included in the partition.
          example: _sourcecategory=*/Apache
    PartitionsQuotaUsage:
      required:
        - quota
        - remaining
      type: object
      properties:
        quota:
          type: integer
          description: Maximum number of Partitions allowed.
          format: int32
          example: 200
        remaining:
          type: integer
          description: Remaining number of Partitions allowed.
          format: int32
          example: 121
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    ViewRetentionProperties:
      type: object
      properties:
        newRetentionPeriod:
          type: integer
          description: If the retention period is scheduled to be updated in the future (i.e., if retention period is previously reduced with value of reduceRetentionPeriodImmediately as false), this property gives the future value of retention period while retentionPeriod gives the current value. retentionPeriod will take up the value of newRetentionPeriod after the scheduled time.
          format: int32
          example: 300
        retentionEffectiveAt:
          type: string
          description: When the newRetentionPeriod will become effective in UTC format.
          format: date-time
    MetadataModel:
      required:
        - createdAt
        - createdBy
        - modifiedAt
        - modifiedBy
      type: object
      properties:
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the resource.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who last modified the resource.
          example: 0000000006743FE8
  x-stackQL-resources:
    partitions:
      id: sumologic.partitions.partitions
      name: partitions
      title: Partitions
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1partitions/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1partitions/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1v1~1partitions~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1partitions~1{id}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        decommission:
          operation:
            $ref: '#/paths/~1v1~1partitions~1{id}~1decommission/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        cancel_retention_update:
          operation:
            $ref: '#/paths/~1v1~1partitions~1{id}~1cancelRetentionUpdate/post'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/partitions/methods/get'
          - $ref: '#/components/x-stackQL-resources/partitions/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/partitions/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/partitions/methods/update'
        delete: []
        replace: []
    quota:
      id: sumologic.partitions.quota
      name: quota
      title: Quota
      methods:
        get:
          operation:
            $ref: '#/paths/~1v1~1partitions~1quota/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/quota/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.{region}.sumologic.com/api
    description: Sumo Logic deployment API endpoint
    variables:
      region:
        description: Sumo Logic deployment (au, ca, ch, de, eu, fed, in, jp, kr, us1, us2). Resolved from the SUMOLOGIC_ENVIRONMENT environment variable when it is set (x-stackQL-envVar, the same variable the Terraform provider reads); otherwise defaults to us2. A WHERE region = '...' value always takes precedence.
        enum:
          - au
          - ca
          - ch
          - de
          - eu
          - fed
          - in
          - jp
          - kr
          - us1
          - us2
        default: us2
        x-stackQL-envVar: SUMOLOGIC_ENVIRONMENT
x-stackQL-config:
  pagination:
    requestToken:
      key: token
      location: query
    responseToken:
      key: next
      location: body
