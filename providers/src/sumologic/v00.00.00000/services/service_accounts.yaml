openapi: 3.0.0
info:
  title: Sumo Logic Service Accounts API
  description: Service accounts and their access keys.
  version: 1.0.0
paths:
  /v1/serviceAccounts:
    get:
      tags:
        - serviceAccountManagement
      summary: Get a list of service accounts.
      description: Get a list of all service accounts in the organization.
      operationId: listServiceAccounts
      responses:
        '200':
          description: A list of service accounts in the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListServiceAccountModelsResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - serviceAccountManagement
      summary: Create a new service account.
      description: Create a new service account in the organization.
      operationId: createServiceAccount
      parameters: []
      requestBody:
        description: Information about the new service account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceAccountDefinition'
        required: true
      responses:
        '200':
          description: A service account has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountModel'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/serviceAccounts/{id}:
    get:
      tags:
        - serviceAccountManagement
      summary: Get a service account.
      description: Get a service account with the given identifier from the organization.
      operationId: getServiceAccount
      parameters:
        - name: id
          in: path
          description: Identifier of service account to return.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service account object that was requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountModel'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - serviceAccountManagement
      summary: Update a service account.
      description: Update an existing service account in the organization.
      operationId: updateServiceAccount
      parameters:
        - name: id
          in: path
          description: Identifier of the service account to update.
          required: true
          schema:
            type: string
      requestBody:
        description: Information to update about the service account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceAccountDefinition'
        required: true
      responses:
        '200':
          description: The service account was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountModel'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - serviceAccountManagement
      summary: Delete a service account.
      description: Delete a service account with the given identifier from the organization and transfer its content to a user or  a service account with the identifier specified in "transferTo".
      operationId: deleteServiceAccount
      parameters:
        - name: id
          in: path
          description: Identifier of the service account to delete.
          required: true
          schema:
            type: string
        - name: transferTo
          in: query
          description: Identifier of a user/service account to receive the transfer of content from the deleted service account. <br> **Note:** If `deleteContent` is not set to `true`, and no user identifier is specified in `transferTo`, content from the deleted service account is transferred to the executing user.
          required: false
          schema:
            type: string
        - name: deleteContent
          in: query
          description: Whether to delete content from the deleted service account or not. <br> **Warning:** If `deleteContent` is set to `true`, all of the content for the service account being  deleted is permanently deleted and cannot be recovered.
          required: false
          schema:
            type: boolean
      responses:
        '204':
          description: Service account was deleted successfully.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/serviceAccounts/{serviceAccountId}/accessKeys:
    get:
      tags:
        - serviceAccountManagement
      summary: List access keys for a service account.
      description: List all access keys of a service account.
      operationId: listAccessKeysForServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          description: Identifier of the service account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of all access keys within the organization of a service account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccessKeysResult'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - serviceAccountManagement
      summary: Create a new access key for a service account.
      description: Creates a new access ID and key pair for a service account.
      operationId: createAccessKeyForServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          description: Identifier of the service account.
          required: true
          schema:
            type: string
      requestBody:
        description: Information about the new access key of a service account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessKeyCreateRequest'
        required: true
      responses:
        '200':
          description: The access key has been created for a service account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKey'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/serviceAccounts/{serviceAccountId}/accessKeys/{accessId}:
    get:
      tags:
        - serviceAccountManagement
      summary: Get an access key of a service account.
      description: Get an access key with the given identifier from the organization of a service account.
      operationId: getAccessKeyByIdOfAServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          description: Identifier of the service account.
          required: true
          schema:
            type: string
        - name: accessId
          in: path
          description: Identifier of an access key to return.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Access key object that was requested of a service account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKeyPublic'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - serviceAccountManagement
      summary: Update an access key of a service account.
      description: Updates the properties of existing accessKey by Id of a service account.
      operationId: updateAccessKeyOfAServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          description: Identifier of the service account.
          required: true
          schema:
            type: string
        - name: accessId
          in: path
          description: The id of an access key to update of a service account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessKeyUpdateRequest'
        required: true
      responses:
        '200':
          description: Access key of a service account updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKeyPublic'
        default:
          description: Access key updation of a service account failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - serviceAccountManagement
      summary: Delete an access key of a service account.
      description: Deletes the access key with the given Id of a service account.
      operationId: deleteAccessKeyOfAServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          description: Identifier of the service account.
          required: true
          schema:
            type: string
        - name: accessId
          in: path
          description: The Id of the access key to delete of a service account.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Access key deletion of a service account completed successfully.
        default:
          description: Access key deletion of a service account failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ListServiceAccountModelsResponse:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: List of service accounts.
          items:
            $ref: '#/components/schemas/ServiceAccountModel'
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    CreateServiceAccountDefinition:
      required:
        - email
        - name
        - roleIds
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 0
          type: string
          description: Name of the service account.
          example: Service Account
        email:
          maxLength: 255
          type: string
          description: Email address of the service account.
          format: email
          example: johndoe@acme.com
        roleIds:
          type: array
          description: List of roleIds associated with the service account.
          example:
            - 00000000000001DF
            - 00000000000002D2
          items:
            type: string
    ServiceAccountModel:
      type: object
      required:
        - email
        - name
        - roleIds
        - createdAt
        - createdBy
        - modifiedAt
        - modifiedBy
        - id
      properties:
        name:
          maxLength: 128
          minLength: 0
          type: string
          description: Name of the service account.
          example: Service Account
        email:
          maxLength: 255
          type: string
          description: Email address of the service account.
          format: email
          example: johndoe@acme.com
        roleIds:
          type: array
          description: List of roleIds associated with the service account.
          example:
            - 00000000000001DF
            - 00000000000002D2
          items:
            type: string
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the resource.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who last modified the resource.
          example: 0000000006743FE8
        id:
          type: string
          description: Unique identifier for the service account.
          example: 000000000FE20FE2
        isActive:
          type: boolean
          description: True if the service account is active.
          example: true
    UpdateServiceAccountDefinition:
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 0
          type: string
          description: Name of the service account.
          example: Service Account
        isActive:
          type: boolean
          description: This has the value `true` if the service account is active and `false` if it has been deactivated.
          example: true
        roleIds:
          type: array
          description: List of role identifiers associated with the service account.
          example:
            - 00000000000001DF
            - 00000000000002D2
          items:
            type: string
        email:
          maxLength: 255
          type: string
          description: New email address of the service account.
          format: email
          example: johndoe@acme.com
    ListAccessKeysResult:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: An array of access keys.
          items:
            $ref: '#/components/schemas/AccessKeyPublic'
      description: List of access keys.
    AccessKeyCreateRequest:
      required:
        - label
      type: object
      properties:
        label:
          maxLength: 128
          type: string
          description: A name for the access key to be created.
          example: automation access key
        corsHeaders:
          maxItems: 20
          type: array
          description: |-
            An array of domains for which the access key is valid. Whether Sumo Logic accepts or rejects an API request
            depends on whether it contains an ORIGIN header and the entries in the allowlist.
            Sumo Logic will reject:
              1. Requests with an ORIGIN header but the allowlist is empty.
              2. Requests with an ORIGIN header that don't match any entry in the allowlist.
          example:
            - https://my-app.com
            - https://mail.my-app.com
          items:
            type: string
        scopes:
          type: array
          description: |-
            Scopes assigned to the key.
            ### Alerting
              - adminMonitorsV2
              - viewMonitorsV2
              - manageMonitorsV2

            ### Data Management
              - manageApps
              - viewCollectors
              - manageCollectors
              - viewConnections
              - manageConnections
              - contentAdmin
              - viewFieldExtractionRules
              - manageFieldExtractionRules            
              - viewFields
              - manageFields
              - manageBudgets
              - viewLibrary
              - manageLibrary
              - viewPartitions
              - managePartitions
              - manageS3DataForwarding
              - viewScheduledViews
              - manageScheduledViews
              - manageTokens

            ### Logs
              - runLogSearch

            ### Metrics
              - runMetricsQuery 

            ### Reliability Management
              - viewSlos
              - manageSlos

            ### Security
              - manageAccessKeys
              - viewPersonalAccessKeys
              - managePersonalAccessKeys

            ### UserManagement
              - viewUsersAndRoles
              - manageUsersAndRoles
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
    AccessKey:
      required:
        - createdAt
        - createdBy
        - disabled
        - id
        - label
        - modifiedAt
        - modifiedBy
        - key
      type: object
      properties:
        id:
          type: string
          description: Identifier of the access key.
          example: su0w3Q37CBzHUM
        label:
          type: string
          description: The name of the access key.
          example: collector access key
        corsHeaders:
          type: array
          description: |-
            An array of domains for which the access key is valid. Whether Sumo Logic accepts or rejects an API request depends on whether it contains an ORIGIN header and the entries in the allowlist. Sumo Logic will reject:
              1. Requests with an ORIGIN header but the allowlist is empty.
              2. Requests with an ORIGIN header that don't match any entry in the allowlist.
          example:
            - https://my-app.com
            - https://mail.my-app.com
          items:
            type: string
        disabled:
          type: boolean
          description: Indicates whether the access key is disabled or not.
          example: false
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the access key.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who modified the access key.
          example: 0000000006743FDD
        serviceAccountId:
          type: string
          description: Identifier of the service account who owns the access key.
          example: 0000000006743FDA
        lastUsed:
          type: string
          description: Last used timestamp in UTC.  <br> **Note:** Property not in use, it is part of an upcoming feature.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        scopes:
          type: array
          description: |-
            Scopes assigned to the key.
            ### Alerting
              - adminMonitorsV2
              - viewMonitorsV2
              - manageMonitorsV2

            ### Data Management
              - manageApps
              - viewCollectors
              - manageCollectors
              - viewConnections
              - manageConnections
              - contentAdmin
              - viewFieldExtractionRules
              - manageFieldExtractionRules            
              - viewFields
              - manageFields
              - manageBudgets
              - viewLibrary
              - manageLibrary
              - viewPartitions
              - managePartitions 
              - manageS3DataForwarding
              - viewScheduledViews
              - manageScheduledViews
              - manageTokens

            ### Logs
              - runLogSearch

            ### Metrics
              - runMetricsQuery 

            ### Reliability Management
              - viewSlos
              - manageSlos

            ### Security
              - manageAccessKeys
              - viewPersonalAccessKeys
              - managePersonalAccessKeys

            ### UserManagement
              - viewUsersAndRoles
              - manageUsersAndRoles
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
        effectiveScopes:
          type: array
          description: Effective scopes based on the intersection of the user's RBAC capabilities and the assigned scopes.
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
        key:
          type: string
          description: The key for the created access key. This field will have values only in the response for an access key create request. The value will be an empty string while listing all keys.
          example: F9GZvb4fISxUZHM7pqHCsGXGWf4OArgmt9Tz8ewZ
    AccessKeyPublic:
      required:
        - createdAt
        - createdBy
        - disabled
        - id
        - label
        - modifiedAt
        - modifiedBy
      type: object
      properties:
        id:
          type: string
          description: Identifier of the access key.
          example: su0w3Q37CBzHUM
        label:
          type: string
          description: The name of the access key.
          example: collector access key
        corsHeaders:
          type: array
          description: |-
            An array of domains for which the access key is valid. Whether Sumo Logic accepts or rejects an API request depends on whether it contains an ORIGIN header and the entries in the allowlist. Sumo Logic will reject:
              1. Requests with an ORIGIN header but the allowlist is empty.
              2. Requests with an ORIGIN header that don't match any entry in the allowlist.
          example:
            - https://my-app.com
            - https://mail.my-app.com
          items:
            type: string
        disabled:
          type: boolean
          description: Indicates whether the access key is disabled or not.
          example: false
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the access key.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who modified the access key.
          example: 0000000006743FDD
        serviceAccountId:
          type: string
          description: Identifier of the service account who owns the access key.
          example: 0000000006743FDA
        lastUsed:
          type: string
          description: Last used timestamp in UTC.  <br> **Note:** Property not in use, it is part of an upcoming feature.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        scopes:
          type: array
          description: |-
            Scopes assigned to the key.
            ### Alerting
              - adminMonitorsV2
              - viewMonitorsV2
              - manageMonitorsV2

            ### Data Management
              - manageApps
              - viewCollectors
              - manageCollectors
              - viewConnections
              - manageConnections
              - contentAdmin
              - viewFieldExtractionRules
              - manageFieldExtractionRules            
              - viewFields
              - manageFields
              - manageBudgets
              - viewLibrary
              - manageLibrary
              - viewPartitions
              - managePartitions 
              - manageS3DataForwarding
              - viewScheduledViews
              - manageScheduledViews
              - manageTokens

            ### Logs
              - runLogSearch

            ### Metrics
              - runMetricsQuery 

            ### Reliability Management
              - viewSlos
              - manageSlos

            ### Security
              - manageAccessKeys
              - viewPersonalAccessKeys
              - managePersonalAccessKeys

            ### UserManagement
              - viewUsersAndRoles
              - manageUsersAndRoles
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
        effectiveScopes:
          type: array
          description: Effective scopes based on the intersection of the user's RBAC capabilities and the assigned scopes.
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
    AccessKeyUpdateRequest:
      required:
        - disabled
      type: object
      properties:
        disabled:
          type: boolean
          description: Indicates whether the access key is disabled or not.
          example: true
        corsHeaders:
          maxItems: 20
          type: array
          description: |-
            An array of domains for which the access key is valid. Whether Sumo Logic accepts or rejects an API request depends on whether it contains an ORIGIN header and the entries in the allowlist. Sumo Logic will reject:
              1. Requests with an ORIGIN header but the allowlist is empty.
              2. Requests with an ORIGIN header that don't match any entry in the allowlist.
          example:
            - https://my-app.com
            - https://mail.my-app.com
          items:
            type: string
        scopes:
          type: array
          description: |-
            Scopes assigned to the key. <br><br> Note: Updates to scopes will take up to 5m to reflect due to caching in the system.
            ### Alerting
              - adminMonitorsV2
              - viewMonitorsV2
              - manageMonitorsV2

            ### Data Management
              - manageApps
              - viewCollectors
              - manageCollectors
              - viewConnections
              - manageConnections
              - contentAdmin
              - viewFieldExtractionRules
              - manageFieldExtractionRules            
              - viewFields
              - manageFields
              - manageBudgets
              - viewLibrary
              - manageLibrary
              - viewPartitions
              - managePartitions
              - manageS3DataForwarding
              - viewScheduledViews
              - manageScheduledViews
              - manageTokens

            ### Logs
              - runLogSearch

            ### Metrics
              - runMetricsQuery 

            ### Reliability Management
              - viewSlos
              - manageSlos

            ### Security
              - manageAccessKeys
              - viewPersonalAccessKeys
              - managePersonalAccessKeys

            ### UserManagement
              - viewUsersAndRoles
              - manageUsersAndRoles
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    MetadataModel:
      required:
        - createdAt
        - createdBy
        - modifiedAt
        - modifiedBy
      type: object
      properties:
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the resource.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who last modified the resource.
          example: 0000000006743FE8
