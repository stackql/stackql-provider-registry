openapi: 3.0.0
info:
  title: Sumo Logic Access Keys API
  description: Access keys of the calling user and of the organization, their scopes, CORS headers and secret rotation.
  version: 1.0.0
paths:
  /v1/accessKeys:
    get:
      tags:
        - accessKeyManagement
      summary: List all access keys.
      description: List all access keys in your account.
      operationId: listAccessKeys
      parameters:
        - name: limit
          in: query
          description: Limit the number of access keys returned in the response. The number of access keys returned may be less than the `limit`.
          required: false
          schema:
            maximum: 1000
            minimum: 1
            type: integer
            format: int32
            default: 100
        - name: token
          in: query
          description: Continuation token to get the next page of results. A page object with the next continuation token is returned in the response body. Subsequent GET requests should specify the continuation token to get the next page of results. `token` is set to null when no more pages are left.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of all access keys in your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListAccessKeysResult'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - accessKeyManagement
      summary: Create an access key.
      description: |-
        Creates a new access ID and key pair. The new access key can be used from the domains specified in corsHeaders field. Whether Sumo Logic accepts or rejects an API request depends on whether it contains an ORIGIN header and the entries in the allowlist. Sumo Logic will reject:
          1. Requests with an ORIGIN header but the allowlist is empty.
          2. Requests with an ORIGIN header that don't match any entry in the allowlist.
      operationId: createAccessKey
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessKeyCreateRequest'
        required: true
      responses:
        '200':
          description: Access key created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKey'
        default:
          description: Access key creation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accessKeys/personal:
    get:
      tags:
        - accessKeyManagement
      summary: List personal keys.
      description: List all access keys that belong to your user.
      operationId: listPersonalAccessKeys
      responses:
        '200':
          description: A list of all access keys that belong to the user making the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccessKeysResult'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accessKeys/scopes:
    get:
      tags:
        - accessKeyManagement
      summary: Get all scopes.
      description: Get a list of all of the scopes that can be added to an access key.
      operationId: listScopes
      responses:
        '200':
          description: A list of scopes that can be added to an access key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopesList'
        default:
          description: Operation failed with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accessKeys/{id}:
    put:
      tags:
        - accessKeyManagement
      summary: Update an access key.
      description: Updates the properties of existing accessKey by accessId. It can be used to enable or disable the access key and to update the corsHeaders list.
      operationId: updateAccessKey
      parameters:
        - name: id
          in: path
          description: The accessId of the access key to update.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessKeyUpdateRequest'
        required: true
      responses:
        '200':
          description: Access key updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKeyPublic'
        default:
          description: Access key update failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - accessKeyManagement
      summary: Delete an access key.
      description: Deletes the access key with the given accessId.
      operationId: deleteAccessKey
      parameters:
        - name: id
          in: path
          description: The accessId of the access key to delete.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Access key deletion completed successfully.
        default:
          description: Access key deletion failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accessKeys/{id}/rotate:
    put:
      tags:
        - accessKeyManagement
      summary: Rotate the access key secret
      description: Generates a new secret for the access key that is passed in the call, keeping the same access ID.
      operationId: rotateAccessKeySecret
      parameters:
        - name: id
          in: path
          description: The accessId of the access key to rotate the secret for.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Access key secret rotated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKey'
        default:
          description: Access key secret rotation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    PaginatedListAccessKeysResult:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: An array of access keys.
          items:
            $ref: '#/components/schemas/AccessKeyPublic'
        next:
          type: string
          description: Next continuation token.
          example: GDCiRv4vebF3UWFJQ1kySXBOR3Bzh69GR0RyWm9vCtc
      description: List of access keys.
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    AccessKeyCreateRequest:
      required:
        - label
      type: object
      properties:
        label:
          maxLength: 128
          type: string
          description: A name for the access key to be created.
          example: automation access key
        corsHeaders:
          maxItems: 20
          type: array
          description: |-
            An array of domains for which the access key is valid. Whether Sumo Logic accepts or rejects an API request
            depends on whether it contains an ORIGIN header and the entries in the allowlist.
            Sumo Logic will reject:
              1. Requests with an ORIGIN header but the allowlist is empty.
              2. Requests with an ORIGIN header that don't match any entry in the allowlist.
          example:
            - https://my-app.com
            - https://mail.my-app.com
          items:
            type: string
        scopes:
          type: array
          description: |-
            Scopes assigned to the key.
            ### Alerting
              - adminMonitorsV2
              - viewMonitorsV2
              - manageMonitorsV2

            ### Data Management
              - manageApps
              - viewCollectors
              - manageCollectors
              - viewConnections
              - manageConnections
              - contentAdmin
              - viewFieldExtractionRules
              - manageFieldExtractionRules            
              - viewFields
              - manageFields
              - manageBudgets
              - viewLibrary
              - manageLibrary
              - viewPartitions
              - managePartitions
              - manageS3DataForwarding
              - viewScheduledViews
              - manageScheduledViews
              - manageTokens

            ### Logs
              - runLogSearch

            ### Metrics
              - runMetricsQuery 

            ### Reliability Management
              - viewSlos
              - manageSlos

            ### Security
              - manageAccessKeys
              - viewPersonalAccessKeys
              - managePersonalAccessKeys

            ### UserManagement
              - viewUsersAndRoles
              - manageUsersAndRoles
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
    AccessKey:
      required:
        - createdAt
        - createdBy
        - disabled
        - id
        - label
        - modifiedAt
        - modifiedBy
        - key
      type: object
      properties:
        id:
          type: string
          description: Identifier of the access key.
          example: su0w3Q37CBzHUM
        label:
          type: string
          description: The name of the access key.
          example: collector access key
        corsHeaders:
          type: array
          description: |-
            An array of domains for which the access key is valid. Whether Sumo Logic accepts or rejects an API request depends on whether it contains an ORIGIN header and the entries in the allowlist. Sumo Logic will reject:
              1. Requests with an ORIGIN header but the allowlist is empty.
              2. Requests with an ORIGIN header that don't match any entry in the allowlist.
          example:
            - https://my-app.com
            - https://mail.my-app.com
          items:
            type: string
        disabled:
          type: boolean
          description: Indicates whether the access key is disabled or not.
          example: false
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the access key.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who modified the access key.
          example: 0000000006743FDD
        serviceAccountId:
          type: string
          description: Identifier of the service account who owns the access key.
          example: 0000000006743FDA
        lastUsed:
          type: string
          description: Last used timestamp in UTC.  <br> **Note:** Property not in use, it is part of an upcoming feature.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        scopes:
          type: array
          description: |-
            Scopes assigned to the key.
            ### Alerting
              - adminMonitorsV2
              - viewMonitorsV2
              - manageMonitorsV2

            ### Data Management
              - manageApps
              - viewCollectors
              - manageCollectors
              - viewConnections
              - manageConnections
              - contentAdmin
              - viewFieldExtractionRules
              - manageFieldExtractionRules            
              - viewFields
              - manageFields
              - manageBudgets
              - viewLibrary
              - manageLibrary
              - viewPartitions
              - managePartitions 
              - manageS3DataForwarding
              - viewScheduledViews
              - manageScheduledViews
              - manageTokens

            ### Logs
              - runLogSearch

            ### Metrics
              - runMetricsQuery 

            ### Reliability Management
              - viewSlos
              - manageSlos

            ### Security
              - manageAccessKeys
              - viewPersonalAccessKeys
              - managePersonalAccessKeys

            ### UserManagement
              - viewUsersAndRoles
              - manageUsersAndRoles
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
        effectiveScopes:
          type: array
          description: Effective scopes based on the intersection of the user's RBAC capabilities and the assigned scopes.
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
        key:
          type: string
          description: The key for the created access key. This field will have values only in the response for an access key create request. The value will be an empty string while listing all keys.
          example: F9GZvb4fISxUZHM7pqHCsGXGWf4OArgmt9Tz8ewZ
    ListAccessKeysResult:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: An array of access keys.
          items:
            $ref: '#/components/schemas/AccessKeyPublic'
      description: List of access keys.
    ScopesList:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: List of scopes
          items:
            $ref: '#/components/schemas/ScopeDefinition'
    AccessKeyUpdateRequest:
      required:
        - disabled
      type: object
      properties:
        disabled:
          type: boolean
          description: Indicates whether the access key is disabled or not.
          example: true
        corsHeaders:
          maxItems: 20
          type: array
          description: |-
            An array of domains for which the access key is valid. Whether Sumo Logic accepts or rejects an API request depends on whether it contains an ORIGIN header and the entries in the allowlist. Sumo Logic will reject:
              1. Requests with an ORIGIN header but the allowlist is empty.
              2. Requests with an ORIGIN header that don't match any entry in the allowlist.
          example:
            - https://my-app.com
            - https://mail.my-app.com
          items:
            type: string
        scopes:
          type: array
          description: |-
            Scopes assigned to the key. <br><br> Note: Updates to scopes will take up to 5m to reflect due to caching in the system.
            ### Alerting
              - adminMonitorsV2
              - viewMonitorsV2
              - manageMonitorsV2

            ### Data Management
              - manageApps
              - viewCollectors
              - manageCollectors
              - viewConnections
              - manageConnections
              - contentAdmin
              - viewFieldExtractionRules
              - manageFieldExtractionRules            
              - viewFields
              - manageFields
              - manageBudgets
              - viewLibrary
              - manageLibrary
              - viewPartitions
              - managePartitions
              - manageS3DataForwarding
              - viewScheduledViews
              - manageScheduledViews
              - manageTokens

            ### Logs
              - runLogSearch

            ### Metrics
              - runMetricsQuery 

            ### Reliability Management
              - viewSlos
              - manageSlos

            ### Security
              - manageAccessKeys
              - viewPersonalAccessKeys
              - managePersonalAccessKeys

            ### UserManagement
              - viewUsersAndRoles
              - manageUsersAndRoles
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
    AccessKeyPublic:
      required:
        - createdAt
        - createdBy
        - disabled
        - id
        - label
        - modifiedAt
        - modifiedBy
      type: object
      properties:
        id:
          type: string
          description: Identifier of the access key.
          example: su0w3Q37CBzHUM
        label:
          type: string
          description: The name of the access key.
          example: collector access key
        corsHeaders:
          type: array
          description: |-
            An array of domains for which the access key is valid. Whether Sumo Logic accepts or rejects an API request depends on whether it contains an ORIGIN header and the entries in the allowlist. Sumo Logic will reject:
              1. Requests with an ORIGIN header but the allowlist is empty.
              2. Requests with an ORIGIN header that don't match any entry in the allowlist.
          example:
            - https://my-app.com
            - https://mail.my-app.com
          items:
            type: string
        disabled:
          type: boolean
          description: Indicates whether the access key is disabled or not.
          example: false
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the access key.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who modified the access key.
          example: 0000000006743FDD
        serviceAccountId:
          type: string
          description: Identifier of the service account who owns the access key.
          example: 0000000006743FDA
        lastUsed:
          type: string
          description: Last used timestamp in UTC.  <br> **Note:** Property not in use, it is part of an upcoming feature.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        scopes:
          type: array
          description: |-
            Scopes assigned to the key.
            ### Alerting
              - adminMonitorsV2
              - viewMonitorsV2
              - manageMonitorsV2

            ### Data Management
              - manageApps
              - viewCollectors
              - manageCollectors
              - viewConnections
              - manageConnections
              - contentAdmin
              - viewFieldExtractionRules
              - manageFieldExtractionRules            
              - viewFields
              - manageFields
              - manageBudgets
              - viewLibrary
              - manageLibrary
              - viewPartitions
              - managePartitions 
              - manageS3DataForwarding
              - viewScheduledViews
              - manageScheduledViews
              - manageTokens

            ### Logs
              - runLogSearch

            ### Metrics
              - runMetricsQuery 

            ### Reliability Management
              - viewSlos
              - manageSlos

            ### Security
              - manageAccessKeys
              - viewPersonalAccessKeys
              - managePersonalAccessKeys

            ### UserManagement
              - viewUsersAndRoles
              - manageUsersAndRoles
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
        effectiveScopes:
          type: array
          description: Effective scopes based on the intersection of the user's RBAC capabilities and the assigned scopes.
          example:
            - manageUsersAndRoles
            - viewCollectors
          items:
            type: string
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    ScopeDefinition:
      required:
        - dependsOn
        - group
        - id
        - label
        - type
      type: object
      properties:
        id:
          type: string
          description: The name of the scope.
          example: managePartitions
        label:
          type: string
          description: The UI label for the scope.
          example: Manage Partitions
        type:
          type: string
          description: Type of scope.
          example: Manage
        dependsOn:
          type: array
          description: Any scopes that are required for this scope to be enabled.
          example:
            - viewPartitions
          items:
            type: string
        group:
          required:
            - id
            - label
          type: object
          properties:
            id:
              type: string
              description: The name of the scope group
              example: dataManagement
            label:
              type: string
              description: The label for the scope group
              example: Data Management
            parentId:
              type: string
              description: The ID of the parent scope group
          description: The group that the scope belongs to.
  x-stackQL-resources:
    access_keys:
      id: sumologic.access_keys.access_keys
      name: access_keys
      title: Access Keys
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1accessKeys/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1accessKeys/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1accessKeys~1{id}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        delete:
          operation:
            $ref: '#/paths/~1v1~1accessKeys~1{id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            nativeCasing: camel
        rotate_secret:
          operation:
            $ref: '#/paths/~1v1~1accessKeys~1{id}~1rotate/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/access_keys/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/access_keys/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/access_keys/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/access_keys/methods/delete'
        replace: []
    personal_access_keys:
      id: sumologic.access_keys.personal_access_keys
      name: personal_access_keys
      title: Personal Access Keys
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1accessKeys~1personal/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/personal_access_keys/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    scopes:
      id: sumologic.access_keys.scopes
      name: scopes
      title: Scopes
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1accessKeys~1scopes/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/scopes/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.{region}.sumologic.com/api
    description: Sumo Logic deployment API endpoint
    variables:
      region:
        description: Sumo Logic deployment (au, ca, ch, de, eu, fed, in, jp, kr, us1, us2). Resolved from the SUMOLOGIC_ENVIRONMENT environment variable when it is set (x-stackQL-envVar, the same variable the Terraform provider reads); otherwise defaults to us2. A WHERE region = '...' value always takes precedence.
        enum:
          - au
          - ca
          - ch
          - de
          - eu
          - fed
          - in
          - jp
          - kr
          - us1
          - us2
        default: us2
        x-stackQL-envVar: SUMOLOGIC_ENVIRONMENT
x-stackQL-config:
  pagination:
    requestToken:
      key: token
      location: query
    responseToken:
      key: next
      location: body
