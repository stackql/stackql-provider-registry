openapi: 3.0.0
info:
  title: Sumo Logic Feature Settings API
  description: Organization feature settings.
  version: 1.0.0
paths:
  /v1/featureSettings:
    get:
      tags:
        - orgFeatureSettings
      summary: Get a list of opt-in/out features.
      description: Get a list of opt-in/out features for the organization.
      operationId: listFeatureSettings
      responses:
        '200':
          description: A list of opt-in/out features for the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureSettingsResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - orgFeatureSettings
      summary: Update one or more feature settings.
      description: Update feature settings for the organization.
      operationId: updateFeatureSettings
      parameters: []
      requestBody:
        description: List of feature Id and its settings.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureSettingsRequest'
        required: true
      responses:
        '200':
          description: One or more feature settings have been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureSettingsResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    FeatureSettingsResponse:
      type: object
      properties:
        featureSettings:
          type: array
          description: List of opt-in/out features.
          items:
            $ref: '#/components/schemas/FeatureSettingsModel'
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    UpdateFeatureSettingsRequest:
      required:
        - featureSettings
      type: object
      properties:
        featureSettings:
          minItems: 1
          type: array
          description: List of feature Id and its settings.
          items:
            $ref: '#/components/schemas/FeatureSettingsBase'
    FeatureSettingsModel:
      required:
        - id
        - settings
        - description
        - lastModifiedAt
        - lastModifiedBy
        - name
        - type
      type: object
      properties:
        id:
          maxLength: 32
          type: string
          description: Id of the feature.
          example: Mobot
        settings:
          minItems: 1
          type: array
          description: List of settings.
          items:
            $ref: '#/components/schemas/Setting'
        name:
          maxLength: 64
          type: string
          description: Name of the feature (user-friendly).
          example: Mobot
        description:
          maxLength: 255
          type: string
          description: Details of the feature.
        type:
          pattern: ^(GA|PublicPreview|PrivatePreview)$
          type: string
          description: Type of the feature
          example: GA
        lastModifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          nullable: true
          example: '2025-10-16T09:10:00.000Z'
        lastModifiedBy:
          type: string
          description: Identifier of the user who last modified the resource.
          nullable: true
          example: 0000000006743FE8
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    FeatureSettingsBase:
      required:
        - id
        - settings
      type: object
      properties:
        id:
          maxLength: 32
          type: string
          description: Id of the feature.
          example: Mobot
        settings:
          minItems: 1
          type: array
          description: List of settings.
          items:
            $ref: '#/components/schemas/Setting'
    Setting:
      required:
        - key
        - value
      type: object
      properties:
        key:
          type: string
          description: The key for the setting.
          example: enabled
        value:
          type: string
          description: The value for the setting.
          example: 'false'
  x-stackQL-resources:
    feature_settings:
      id: sumologic.feature_settings.feature_settings
      name: feature_settings
      title: Feature Settings
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1featureSettings/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.featureSettings
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1featureSettings/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/feature_settings/methods/list'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/feature_settings/methods/update'
        delete: []
        replace: []
servers:
  - url: https://api.{region}.sumologic.com/api
    description: Sumo Logic deployment API endpoint
    variables:
      region:
        description: Sumo Logic deployment (au, ca, ch, de, eu, fed, in, jp, kr, us1, us2). Resolved from the SUMOLOGIC_ENVIRONMENT environment variable when it is set (x-stackQL-envVar, the same variable the Terraform provider reads); otherwise defaults to us2. A WHERE region = '...' value always takes precedence.
        enum:
          - au
          - ca
          - ch
          - de
          - eu
          - fed
          - in
          - jp
          - kr
          - us1
          - us2
        default: us2
        x-stackQL-envVar: SUMOLOGIC_ENVIRONMENT
x-stackQL-config:
  pagination:
    requestToken:
      key: token
      location: query
    responseToken:
      key: next
      location: body
