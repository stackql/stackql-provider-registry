      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/data_masking_rules/methods/get'
          - $ref: '#/components/x-stackQL-resources/data_masking_rules/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/data_masking_rules/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/data_masking_rules/methods/update'
