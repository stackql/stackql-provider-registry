openapi: 3.0.0
info:
  title: Sumo Logic Macros API
  description: Search macros.
  version: 1.0.0
paths:
  /v2/macros:
    get:
      tags:
        - macroManagement
      summary: List all macros.
      description: List all viewable macros for the customer.
      operationId: listMacros
      parameters:
        - name: limit
          in: query
          description: Limit the number of macro returned in the response. The number of macros returned may be less than the `limit`. Default 50.
          required: false
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
            default: 50
          example: 50
        - name: token
          in: query
          description: Continuation token to get the next page of results. A page object with the next continuation token is returned in the response body. Subsequent GET requests should specify the continuation token to get the next page of results. `token` is set to null when no more pages are left.
          required: false
          schema:
            type: string
          example: GDCiRv4vebF3UWFJQ1kySXBOR3Bzh69GR0RyWm9vCtc
      responses:
        '200':
          description: Paginated list of viewable macros for the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMacros'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - macroManagement
      summary: Create a new macro.
      description: Creates a new macro.
      operationId: createMacro
      requestBody:
        description: Information to create the new macro.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MacroRequest'
        required: true
      responses:
        '200':
          description: The macro has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Macro'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/macros/{id}:
    get:
      tags:
        - macroManagement
      summary: Get a macro.
      description: Get a macro by the given identifier.
      operationId: getMacro
      parameters:
        - name: id
          in: path
          description: UUID of the macro.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Macro object that was requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Macro'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - macroManagement
      summary: Edit a macro.
      description: Edits an existing macro by id. Macro name is immutable.
      operationId: editMacro
      parameters:
        - name: id
          in: path
          description: UUID of the macro to edit.
          required: true
          schema:
            type: string
      requestBody:
        description: Macro fields to update. Macro name is immutable.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseMacroRequest'
        required: true
      responses:
        '200':
          description: The edited macro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Macro'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - macroManagement
      summary: Delete a macro.
      description: Delete a macro by id.
      operationId: deleteMacro
      parameters:
        - name: id
          in: path
          description: Id of macro to delete.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Macro was deleted successfully.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    PaginatedMacros:
      required:
        - macros
      type: object
      properties:
        data:
          type: array
          description: List of macros.
          items:
            $ref: '#/components/schemas/Macro'
        next:
          type: string
          description: Next continuation token. `token` is set to null when no more pages are left.
          example: GDCiRv4vebF3UWFJQ1kySXBOR3Bzh69GR0RyWm9vCtc
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    MacroRequest:
      required:
        - definition
        - name
      type: object
      properties:
        description:
          maxLength: 4000
          type: string
          description: Description of the macro.
          example: Macro for geo lookup.
        definition:
          minLength: 1
          type: string
          description: The definition of the macro. Use a valid Sumo Log Search expression.
          example: |
            lookup latitude, longitude from geo://location on ip = {{ip_field}} | count by latitude, longitude | sort _count"
        enabled:
          type: boolean
          description: If the macro is enabled or not (default True)
          default: true
        arguments:
          type: array
          description: Arguments used in the macro.
          items:
            $ref: '#/components/schemas/Argument'
        argumentValidations:
          type: array
          description: Validation expressions for the arguments.
          items:
            $ref: '#/components/schemas/ArgumentValidation'
        name:
          maxLength: 128
          minLength: 1
          type: string
          description: Name of the macro.
          example: MacroGeoLookup
        macroCreationSuggestionId:
          type: string
          description: Identifier if the suggestion comes from an macro creation suggestion. This id is used to track macro creation suggestions, and to delete the suggestion once the macro is created.
          example: ABC12
    Macro:
      required:
        - definition
        - name
        - createdAt
        - createdBy
        - id
      type: object
      properties:
        description:
          maxLength: 4000
          type: string
          description: Description of the macro.
          example: Macro for geo lookup.
        definition:
          minLength: 1
          type: string
          description: The definition of the macro. Use a valid Sumo Log Search expression.
          example: |
            lookup latitude, longitude from geo://location on ip = {{ip_field}} | count by latitude, longitude | sort _count"
        enabled:
          type: boolean
          description: If the macro is enabled or not (default True)
          default: true
        arguments:
          type: array
          description: Arguments used in the macro.
          items:
            $ref: '#/components/schemas/Argument'
        argumentValidations:
          type: array
          description: Validation expressions for the arguments.
          items:
            $ref: '#/components/schemas/ArgumentValidation'
        name:
          maxLength: 128
          minLength: 1
          type: string
          description: Name of the macro.
          example: MacroGeoLookup
        macroCreationSuggestionId:
          type: string
          description: Identifier if the suggestion comes from an macro creation suggestion. This id is used to track macro creation suggestions, and to delete the suggestion once the macro is created.
          example: ABC12
        id:
          type: string
          description: |
            Unique identifier for the macro. This id is used to get detailed information about the macro, such as name, definition, arguments and argument validations.
          example: C03E086C137F38B4
        createdAt:
          type: string
          description: Creation timestamp of the macro in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2024-10-01T09:10:00.000Z'
        createdBy:
          type: string
          description: The identifier of the user who created the macro.
          example: 0000000006743FDD
    BaseMacroRequest:
      required:
        - definition
      type: object
      properties:
        description:
          maxLength: 4000
          type: string
          description: Description of the macro.
          example: Macro for geo lookup.
        definition:
          minLength: 1
          type: string
          description: The definition of the macro. Use a valid Sumo Log Search expression.
          example: |
            lookup latitude, longitude from geo://location on ip = {{ip_field}} | count by latitude, longitude | sort _count"
        enabled:
          type: boolean
          description: If the macro is enabled or not (default True)
          default: true
        arguments:
          type: array
          description: Arguments used in the macro.
          items:
            $ref: '#/components/schemas/Argument'
        argumentValidations:
          type: array
          description: Validation expressions for the arguments.
          items:
            $ref: '#/components/schemas/ArgumentValidation'
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    Argument:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: Argument name for the macro.
          example: ip_field
        type:
          pattern: ^(String|Any|Number|Keyword)$
          type: string
          description: The type of the macro.
          example: String
          default: String
          x-pattern-message: Must be `String`, `Any`, `Number or `Keyword`.
    ArgumentValidation:
      required:
        - errorMessage
        - evalExpression
      type: object
      properties:
        evalExpression:
          type: string
          description: The expression to validate a macro argument.
          example: isValidIp(ip_field)
        errorMessage:
          type: string
          description: Error message to be shown if the macro argument validation fails.
          example: You need to enter a field name which is a valid ip.
  x-stackQL-resources:
    macros:
      id: sumologic.macros.macros
      name: macros
      title: Macros
      methods:
        list:
          operation:
            $ref: '#/paths/~1v2~1macros/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v2~1macros/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1v2~1macros~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v2~1macros~1{id}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            mediaType: application/json
            nativeCasing: camel
        delete:
          operation:
            $ref: '#/paths/~1v2~1macros~1{id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/macros/methods/get'
          - $ref: '#/components/x-stackQL-resources/macros/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/macros/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/macros/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/macros/methods/delete'
        replace: []
servers:
  - url: https://api.{region}.sumologic.com/api
    description: Sumo Logic deployment API endpoint
    variables:
      region:
        description: Sumo Logic deployment (au, ca, ch, de, eu, fed, in, jp, kr, us1, us2). Resolved from the SUMOLOGIC_ENVIRONMENT environment variable when it is set (x-stackQL-envVar, the same variable the Terraform provider reads); otherwise defaults to us2. A WHERE region = '...' value always takes precedence.
        enum:
          - au
          - ca
          - ch
          - de
          - eu
          - fed
          - in
          - jp
          - kr
          - us1
          - us2
        default: us2
        x-stackQL-envVar: SUMOLOGIC_ENVIRONMENT
x-stackQL-config:
  pagination:
    requestToken:
      key: token
      location: query
    responseToken:
      key: next
      location: body
