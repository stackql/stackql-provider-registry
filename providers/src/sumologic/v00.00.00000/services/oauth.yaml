openapi: 3.0.0
info:
  title: Sumo Logic Oauth API
  description: OAuth clients, consents and scopes.
  version: 1.0.0
paths:
  /v1/oauth/scopes:
    get:
      tags:
        - oauthManagement
      summary: Get all scopes.
      description: Get a list of all of the scopes that can be added to an oauth client.
      operationId: listOAuthScopes
      responses:
        '200':
          description: A list of scopes that can be added to an oauth client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopesList'
        default:
          description: Operation failed with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/oauth/clients:
    get:
      tags:
        - oauthManagement
      summary: List the OAuth clients.
      description: List all OAuth clients.
      operationId: listOAuthClients
      parameters:
        - name: limit
          in: query
          description: Limit the number of OAuth clients returned in the response. The number of OAuth clients returned may be  less than the `limit`.
          required: false
          schema:
            maximum: 1000
            minimum: 1
            type: integer
            format: int32
            default: 100
        - name: token
          in: query
          description: Continuation token to get the next page of results. A page object with the next continuation token is  returned in the response body. Subsequent GET requests should specify the continuation token to get the  next page of results. `token` is set to null when no more pages are left.
          required: false
          schema:
            type: string
        - name: runAsId
          in: query
          description: Identifier of the service account that the OAuth Client runs as.
          required: false
          schema:
            type: string
        - name: clientId
          in: query
          description: Filter clients by exact client ID. When specified, returns only the client matching this ID. Supports URL-based client identifiers (URL-encode the value).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of all OAuth clients within the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListOAuthClientsResult'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - oauthManagement
      summary: Create a new OAuth client.
      description: Creates a new OAuth clientId and clientSecret.
      operationId: createOAuthClient
      requestBody:
        description: Information about the new OAuth client.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientCreateRequest'
        required: true
      responses:
        '200':
          description: The OAuth client has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientCreationResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/oauth/clients/{id}:
    get:
      tags:
        - oauthManagement
      summary: Get an OAuth client.
      description: Get an OAuth client with the given identifier from the organization.
      operationId: getOAuthClientById
      parameters:
        - name: id
          in: path
          description: Identifier of an OAuth client to return.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OAuth client object that was requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - oauthManagement
      summary: Update an OAuth client.
      description: Updates the properties of existing OAuth client by Id.
      operationId: updateOAuthClient
      parameters:
        - name: id
          in: path
          description: The id of an OAuth client to update.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientUpdateRequest'
        required: true
      responses:
        '200':
          description: OAuth client updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
        default:
          description: OAuth client update failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - oauthManagement
      summary: Delete an OAuth client.
      description: Deletes the OAuth client with the given Id.
      operationId: deleteOAuthClient
      parameters:
        - name: id
          in: path
          description: The Id of the OAuth client to delete.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OAuth client deletion completed successfully.
        default:
          description: OAuth client deletion failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/oauth/clients/{id}/rotate:
    put:
      tags:
        - oauthManagement
      summary: Rotate the oauth client secret
      description: Generates a new secret for the oauth client that is passed in the call, keeping the same client ID.
      operationId: rotateOauthSecret
      parameters:
        - name: id
          in: path
          description: The ID of the oauth client to rotate the secret for.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OAuth client secret rotated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientCreationResponse'
        default:
          description: Oauth client secret rotation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/oauth/consents:
    get:
      tags:
        - oauthManagement
      summary: List OAuth consents.
      description: Get a list of OAuth consents within the organization. Administrators can list all consents, while others can only list consents that they have authorized.
      operationId: listOAuthConsents
      parameters:
        - name: limit
          in: query
          description: Limit the number of consents returned in the response.
          required: false
          schema:
            maximum: 10000
            minimum: 1
            type: integer
            format: int32
            default: 100
        - name: token
          in: query
          description: Continuation token to get the next page of results.
          required: false
          schema:
            type: string
        - name: authorizedUser
          in: query
          description: Filter consents by the identifier of the user who authorized the consent.
          required: false
          schema:
            type: string
        - name: clientId
          in: query
          description: Filter consents by the clientId of a registered OAuth client.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of OAuth consents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListOAuthConsentsResult'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/oauth/consents/{consentId}:
    delete:
      tags:
        - oauthManagement
      summary: Delete an OAuth consent.
      description: Deletes the OAuth consent with the given Id.
      operationId: deleteOAuthConsent
      parameters:
        - name: consentId
          in: path
          description: The ID of the OAuth consent to delete.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OAuth consent deletion completed successfully.
        default:
          description: OAuth consent deletion failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ScopesList:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: List of scopes
          items:
            $ref: '#/components/schemas/ScopeDefinition'
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    PaginatedListOAuthClientsResult:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: An array of OAuth clients.
          items:
            $ref: '#/components/schemas/OAuthClient'
        next:
          type: string
          description: Next continuation token.
          example: GDCiRv4vebF3UWFJQ1kySXBOR3Bzh69GR0RyWm9vCtc
      description: List of OAuth clients.
    OAuthClientCreateRequest:
      required:
        - scopes
        - type
      type: object
