              - `rules___getRule` — viewCse, cseViewRules
              - `rules___getRules` — viewCse, cseViewRules
              - `rules___createTemplatedMatchRule` — viewCse, cseManageRules
              - `rules___createThresholdRule` — viewCse, cseManageRules

