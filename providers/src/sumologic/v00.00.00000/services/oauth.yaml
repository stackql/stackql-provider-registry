      discriminator:
        propertyName: type
        mapping:
          ClientCredentialsClient: '#/components/schemas/CreateClientCredentialsClientRequest'
          AuthorizationCodeClient: '#/components/schemas/CreateAuthorizationCodeClientRequest'
          CimdAuthorizationCodeClient: '#/components/schemas/CreateCimdAuthorizationCodeClientRequest'
    OAuthClientCreationResponse:
      required:
        - clientId
        - createdAt
        - createdBy
        - description
        - disabled
        - id
        - modifiedAt
        - modifiedBy
        - name
        - scopes
        - type
      type: object
      properties:
        type:
          type: string
          description: Type of the object model.
        id:
          pattern: ^[0-9A-F]{16}$
          type: string
          description: Unique identifier of the OAuth client.
          example: 0000000006743FDE
        clientId:
          type: string
          description: Identifier of the OAuth client. Unique within each organization. Will be a URL for dynamically generated clients.
          example: zVplCFHcpTDwtktBIQmFI2K6s9HEo4HAtcQD1f1M5eQ
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the OAuth client.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who modified the OAuth client.
          example: 0000000006743FDD
        name:
          maxLength: 128
          minLength: 0
          type: string
          description: Name of the OAuth client.
          example: My OAuth Client
        description:
          maxLength: 255
          minLength: 0
          type: string
          description: Description of the OAuth client.
          example: OAuth client for data ingestion
        disabled:
          type: boolean
          description: Whether the OAuth client is disabled. Disabled OAuth clients cannot be used to authenticate users.
        scopes:
          type: array
          description: |-
            Scopes assigned to the client.

            **MCP Server Required Scopes:** For full access to all MCP Server tools, the following scopes are required. Each tool lists the scopes it needs.

