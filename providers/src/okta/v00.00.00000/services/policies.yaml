openapi: 3.0.3
info:
  title: policies API
  description: okta policies API
  version: 2026.07.2
paths:
  /api/v1/policies:
    get:
      summary: List all policies
      description: Lists all policies with the specified type
      operationId: listPolicies
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PolicyType'
          description: Specifies the type of policy to return
        - name: status
          in: query
          schema:
            type: string
          description: Refines the query by the `status` of the policy - `ACTIVE` or `INACTIVE`
        - name: q
          in: query
          schema:
            type: string
          description: Refines the query by policy name prefix (startWith method) passed in as `q=string`
        - name: expand
          in: query
          schema:
            type: string
            default: ''
        - name: sortBy
          in: query
          schema:
            type: string
          description: Refines the query by sorting on the policy `name` in ascending order
        - name: limit
          in: query
          schema:
            type: string
          description: Defines the number of policies returned, see [Pagination](https://developer.okta.com/docs/api/#pagination)
        - name: resourceId
          in: query
          schema:
            type: string
          description: Reference to the associated authorization server
        - name: after
          in: query
          schema:
            type: string
          description: End page cursor for pagination, see [Pagination](https://developer.okta.com/docs/api/#pagination)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPoliciesResponse'
              examples:
                password:
                  $ref: '#/components/examples/list-password-policy-response'
                mfa-enroll:
                  $ref: '#/components/examples/list-mfa-enroll-policy-response'
                idp-discovery:
                  $ref: '#/components/examples/list-idp-discovery-policy-response'
                profile-enrollment:
                  $ref: '#/components/examples/list-profile-enrollment-policy-response'
                access-policy:
                  $ref: '#/components/examples/list-access-policy-response'
                device-signal-collection-policy:
                  $ref: '#/components/examples/list-device-signal-collection-policy-response'
                okta-sign-on-policy:
                  $ref: '#/components/examples/list-okta-sign-on-policy-response'
                entity-risk-policy:
                  $ref: '#/components/examples/list-entity-risk-policy-response'
                post-auth-session-policy:
                  $ref: '#/components/examples/list-post-auth-session-policy-response'
                session-violation-detection-policy:
                  $ref: '#/components/examples/list-session-violation-detection-policy-response'
                passwordWithBreachedProtection:
                  $ref: '#/components/examples/list-password-policy-with-breached-protection-response'
                mfa-enroll-grace-period:
                  $ref: '#/components/examples/list-mfa-enroll-policy-with-grace-period-response'
                mfa-enroll-auto-enroll-disabled:
                  $ref: '#/components/examples/list-mfa-enroll-policy-auto-enroll-disabled-response'
                identity-claim-sourcing-policy:
                  $ref: '#/components/examples/list-identity-claim-sourcing-policy-response'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.read
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
    post:
      summary: Create a policy
      description: Creates a policy. There are many types of policies that you can create. See [Policies](https://developer.okta.com/docs/concepts/policies/) for an overview of the types of policies available and links to more indepth information.
      operationId: createPolicy
      parameters:
        - name: activate
          description: This query parameter is only valid for Classic Engine orgs.
          in: query
          schema:
            type: string
            default: 'true'
      x-codegen-request-body-name: policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdatePolicy'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrUpdatePolicy'
              examples:
                password:
                  $ref: '#/components/examples/password-policy-response'
                mfa-enroll:
                  $ref: '#/components/examples/mfa-enroll-policy-with-grace-period-response'
                idp-discovery:
                  $ref: '#/components/examples/idp-discovery-policy-response'
                profile-enrollment:
                  $ref: '#/components/examples/profile-enrollment-policy-response'
                access-policy:
                  $ref: '#/components/examples/create-access-policy-response'
                device-signal-collection-policy:
                  $ref: '#/components/examples/device-signal-collection-policy-response'
                okta-sign-on-policy:
                  $ref: '#/components/examples/create-okta-sign-on-policy-response'
                passwordWithBreachedProtection:
                  $ref: '#/components/examples/password-policy-with-breached-protection-response'
                mfa-enroll-auto-enroll-disabled:
                  $ref: '#/components/examples/mfa-enroll-policy-auto-enroll-disabled-response'
        '400':
          $ref: '#/components/responses/ErrorApiValidationFailed400'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.manage
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
  /api/v1/policies/simulate:
    post:
      summary: Create a policy simulation
      description: |-
        Creates a policy or policy rule simulation. The access simulation evaluates policy and policy rules based on the existing policy rule configuration.
        The evaluation result simulates what the real-world authentication flow is and what policy rules have been applied or matched to the authentication flow.
      operationId: createPolicySimulation
      x-codegen-request-body-name: simulatePolicy
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SimulatePolicyBody'
            examples:
              SimulatePolicy:
                $ref: '#/components/examples/SimulatePolicyBody'
        required: true
      responses:
        '200':
          description: Success
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.read
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: LIMITED_GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/simulateParameter'
  /api/v1/policies/{policyId}:
    get:
      summary: Retrieve a policy
      description: Retrieves a policy
      operationId: getPolicy
      parameters:
        - name: expand
          in: query
          schema:
            type: string
            default: ''
        - $ref: '#/components/parameters/pathPolicyId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
              examples:
                password:
                  $ref: '#/components/examples/password-policy-response'
                mfa-enroll:
                  $ref: '#/components/examples/mfa-enroll-policy-response'
                idp-discovery:
                  $ref: '#/components/examples/idp-discovery-policy-response'
                profile-enrollment:
                  $ref: '#/components/examples/profile-enrollment-policy-response'
                access-policy:
                  $ref: '#/components/examples/create-access-policy-response'
                device-signal-collection-policy:
                  $ref: '#/components/examples/device-signal-collection-policy-response'
                okta-sign-on-policy:
                  $ref: '#/components/examples/create-okta-sign-on-policy-response'
                entity-risk-policy:
                  $ref: '#/components/examples/get-entity-risk-policy-response'
                post-auth-session-policy:
                  $ref: '#/components/examples/get-post-auth-session-policy-response'
                session-violation-detection-policy:
                  $ref: '#/components/examples/get-session-violation-detection-policy-response'
                passwordWithBreachedProtection:
                  $ref: '#/components/examples/password-policy-with-breached-protection-response'
                mfa-enroll-grace-period:
                  $ref: '#/components/examples/mfa-enroll-policy-with-grace-period-response'
                mfa-enroll-auto-enroll-disabled:
                  $ref: '#/components/examples/mfa-enroll-policy-auto-enroll-disabled-response'
                identity-claim-sourcing-policy:
                  $ref: '#/components/examples/get-identity-claim-sourcing-policy-response'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.read
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
    put:
      summary: Replace a policy
      description: Replaces the properties of a policy identified by `policyId`
      operationId: replacePolicy
      x-codegen-request-body-name: policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdatePolicy'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
              examples:
                password:
                  $ref: '#/components/examples/password-policy-response'
                mfa-enroll:
                  $ref: '#/components/examples/mfa-enroll-policy-response'
                idp-discovery:
                  $ref: '#/components/examples/idp-discovery-policy-response'
                profile-enrollment:
                  $ref: '#/components/examples/profile-enrollment-policy-response'
                access-policy:
                  $ref: '#/components/examples/create-access-policy-response'
                device-signal-collection-policy:
                  $ref: '#/components/examples/device-signal-collection-policy-response'
                okta-sign-on-policy:
                  $ref: '#/components/examples/create-okta-sign-on-policy-response'
                passwordWithBreachedProtection:
                  $ref: '#/components/examples/password-policy-with-breached-protection-response'
                mfa-enroll-with-grace-period:
                  $ref: '#/components/examples/mfa-enroll-policy-with-grace-period-response'
                mfa-enroll-auto-enroll-disabled:
                  $ref: '#/components/examples/mfa-enroll-policy-auto-enroll-disabled-response'
        '400':
          $ref: '#/components/responses/ErrorApiValidationFailed400'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.manage
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
    delete:
      summary: Delete a policy
      description: Deletes a policy
      operationId: deletePolicy
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.manage
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
  /api/v1/policies/{policyId}/app:
    get:
      deprecated: true
      summary: List all apps mapped to a policy
      description: |-
        Lists all applications mapped to a policy identified by `policyId`

        > **Note:** Use [List all resources mapped to a policy](https://developer.okta.com/docs/api/openapi/okta-management/management/tags/policy/#tag/Policy/operation/listPolicyMappings) to list all applications mapped to a policy.
      operationId: listPolicyApps
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPolicyAppsResponse'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.read
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
  /api/v1/policies/{policyId}/clone:
    post:
      summary: Clone an existing policy
      description: Clones an existing policy
      operationId: clonePolicy
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
              examples:
                password:
                  $ref: '#/components/examples/password-policy-response'
                mfa-enroll:
                  $ref: '#/components/examples/mfa-enroll-policy-response'
                idp-discovery:
                  $ref: '#/components/examples/idp-discovery-policy-response'
                profile-enrollment:
                  $ref: '#/components/examples/profile-enrollment-policy-response'
                access-policy:
                  $ref: '#/components/examples/create-access-policy-response'
                okta-sign-on-policy:
                  $ref: '#/components/examples/create-okta-sign-on-policy-response'
                passwordWithBreachedProtection:
                  $ref: '#/components/examples/password-policy-with-breached-protection-response'
                mfa-enroll-with-grace-period:
                  $ref: '#/components/examples/mfa-enroll-policy-with-grace-period-response'
                mfa-enroll-auto-enroll-disabled:
                  $ref: '#/components/examples/mfa-enroll-policy-auto-enroll-disabled-response'
        '400':
          $ref: '#/components/responses/ErrorApiValidationFailed400'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.manage
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: LIMITED_GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
  /api/v1/policies/{policyId}/lifecycle/activate:
    post:
      summary: Activate a policy
      description: Activates a policy
      operationId: activatePolicy
      responses:
        '204':
          description: No Content
          content: {}
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.manage
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
  /api/v1/policies/{policyId}/lifecycle/deactivate:
    post:
      summary: Deactivate a policy
      description: Deactivates a policy
      operationId: deactivatePolicy
      responses:
        '204':
          description: No Content
          content: {}
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.manage
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
  /api/v1/policies/{policyId}/mappings:
    get:
      summary: List all resources mapped to a policy
      description: Lists all resources mapped to a policy identified by `policyId`
      operationId: listPolicyMappings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPolicyMappingsResponse'
              examples:
                policy-mapping-response:
                  $ref: '#/components/examples/policy-mapping-list-response'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.read
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
    post:
      summary: Map a resource to a policy
      description: |-
        Maps a resource to a policy identified by `policyId`

        > **Note:** Use the [Assign an app sign-in policy](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/ApplicationPolicies/#tag/ApplicationPolicies/operation/assignApplicationPolicy) endpoint to assign an app sign-in policy to an app.
      operationId: mapResourceToPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyMappingRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyMapping'
              examples:
                policy-mapping-response:
                  $ref: '#/components/examples/policy-mapping-response'
        '400':
          $ref: '#/components/responses/ErrorApiValidationFailed400'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.manage
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
  /api/v1/policies/{policyId}/mappings/{mappingId}:
    get:
      summary: Retrieve a policy resource mapping
      description: Retrieves a resource mapping for a policy identified by `policyId` and `mappingId`
      operationId: getPolicyMapping
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyMapping'
              examples:
                policy-mapping-response:
                  $ref: '#/components/examples/policy-mapping-response'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.read
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
        - $ref: '#/components/parameters/pathPolicyMappingId'
    delete:
      summary: Delete a policy resource mapping
      description: Deletes the resource mapping for a policy identified by `policyId` and `mappingId`
      operationId: deletePolicyResourceMapping
      responses:
        '204':
          description: No Content
          content: {}
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.manage
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
        - $ref: '#/components/parameters/pathPolicyMappingId'
  /api/v1/policies/{policyId}/rules:
    get:
      summary: List all policy rules
      description: Lists all policy rules
      operationId: listPolicyRules
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPolicyRulesResponse'
              examples:
                okta-sign-on:
                  $ref: '#/components/examples/list-all-sign-on-policy-rule-response'
                access:
                  $ref: '#/components/examples/list-all-access-policy-rule-response'
                device-signal-collection:
                  $ref: '#/components/examples/list-all-device-signal-collection-rule-response'
                entity-risk:
                  $ref: '#/components/examples/list-all-entity-risk-policy-rule-response'
                identity-claim-sourcing:
                  $ref: '#/components/examples/list-all-identity-claim-sourcing-policy-rule-response'
                post-auth-session:
                  $ref: '#/components/examples/list-all-post-auth-session-policy-rule-response'
                password:
                  $ref: '#/components/examples/list-all-password-policy-rule-response'
                idp-discovery:
                  $ref: '#/components/examples/list-all-idp-discovery-policy-rule-response'
                mfa-enroll:
                  $ref: '#/components/examples/list-all-mfa-enroll-policy-rule-response'
                profile-enrollment:
                  $ref: '#/components/examples/list-all-profile-enrollment-policy-rule-response'
                session-violation-detection:
                  $ref: '#/components/examples/list-all-session-violation-detection-policy-rule-response'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.policies.read
      tags:
        - Policy
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathPolicyId'
        - $ref: '#/components/parameters/limitParameter'
    post:
      summary: Create a policy rule
      description: |-
        Creates a policy rule

        > **Note:** You can't create additional rules for the `PROFILE_ENROLLMENT`, `POST_AUTH_SESSION`, `CLIENT_UPDATE`, or <x-lifecycle class="ea"></x-lifecycle> `IDENTITY_CLAIM_SOURCING` policies.
      operationId: createPolicyRule
      parameters:
        - name: activate
          description: Set this parameter to `false` to create an `INACTIVE` rule.
          in: query
          schema:
            type: string
            default: 'true'
        - $ref: '#/components/parameters/pathPolicyId'
        - $ref: '#/components/parameters/limitParameter'
      x-codegen-request-body-name: policyRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRule'
            examples:
              CreateAuthPolicyRuleDevicePlatformCondition:
                $ref: '#/components/examples/create-auth-policy-rule-condition'
              Enable2FAPreciseAuth:
                $ref: '#/components/examples/twofa-enabled-disallow-password-allow-phishing'
              CreateAuthPolicyRule2FAEnablePostAuthKmsi:
                $ref: '#/components/examples/twofa-enabled-post-auth-kmsi-enabled'
              CreateAuthPolicyRule2FADisablePostAuthKmsi:
                $ref: '#/components/examples/twofa-enabled-post-auth-kmsi-disabled'
              CreateAuthPolicyRuleAmc2Chains:
                $ref: '#/components/examples/amc-two-chain'
              DeviceSignalCollectionRule:
                $ref: '#/components/examples/create-device-signal-collection-rule'
              SignOnPolicy:
                $ref: '#/components/examples/sign-on-policy-rule'
              SkipFactorChallengeOnPremRule:
                $ref: '#/components/examples/skip-factor-challenge-on-prem-rule'
              RadiusRule:
                $ref: '#/components/examples/radius-rule'
              CloudRule:
                $ref: '#/components/examples/cloud-rule'
              DenyRule:
                $ref: '#/components/examples/deny-rule'
              EnableSpecificRoutingRule:
                $ref: '#/components/examples/idp-discovery-specific-routing-rule'
              EnableDynamicRoutingRule:
                $ref: '#/components/examples/idp-discovery-dynamic-routing-rule'
              EnableSsprSecurityQuestionStepUp:
                $ref: '#/components/examples/sspr-enabled-sq-step-up'
              EnableSsprSSOStepUp:
                $ref: '#/components/examples/sspr-enabled-sso-step-up'
