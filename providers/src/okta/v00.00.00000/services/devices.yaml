openapi: 3.0.3
info:
  title: devices API
  description: okta devices API
  version: 2026.07.2
paths:
  /api/v1/devices:
    get:
      summary: List all devices
      description: >-
        Lists all devices with pagination support.


        >**Note:** To list all devices enrolled by a user, use the [List all
        devices endpoint in the User Resources
        API](https://developer.okta.com/docs/api/openapi/okta-management/management/userresources/listuserdevices).


        You can return a subset of devices that match a supported search
        criteria using the `search` query parameter.

        Searches for devices based on the properties specified in the `search`
        parameter conforming SCIM filter specifications (case-insensitive). This
        data is eventually consistent. The API returns different results
        depending on specified queries in the request. Empty list is returned if
        no objects match `search` request.


        > **Note:** The `search` parameter results are sourced from an
        eventually consistent datasource and may not reflect the latest
        information.


        Don't use search results directly for record updates, as the data might
        be stale and therefore overwrite newer data, resulting in data loss.


        Use an `id` lookup for records that you update to ensure your results
        contain the latest data.


        This operation requires [URL
        encoding](https://www.w3.org/TR/html4/interact/forms.html#h-17.13.4.1).
        For example, `search=profile.displayName eq "Bob"` is encoded as
        `search=profile.displayName%20eq%20%22Bob%22`.
      operationId: listDevices
      parameters:
        - name: after
          in: query
          schema:
            type: string
            description: >-
              The cursor to use for pagination. It is an opaque string that
              specifies your current location in the list and is obtained from
              the `Link` response header. See [Pagination]https://developer.okta.com/docs/api#pagination for
              more information.
            example: 200u3des4afA47rYJu1d7
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
            example: 20
          description: A limit on the number of objects to return (recommend `20`)
        - name: search
          in: query
          description: >-
            A SCIM filter expression that filters the results. Searches include
            all device `profile` properties and the device `id`, `status`, and
            `lastUpdated` properties.


            Searches for devices can be filtered by the contains (`co`)
            operator. You can only use `co` with these select device profile
            attributes: `profile.displayName`, `profile.serialNumber`,
            `profile.imei`, `profile.meid`, `profile.udid`, and `profile.sid`.
            See [Operators](https://developer.okta.com/docs/api/#operators).
          schema:
            type: string
            example: lastUpdated gt "2019-06-01T09:00:00.000Z"
          examples:
            FilterByDeviceStatus:
              summary: Filter by device status
              value: status eq "ACTIVE"
            FilterByLastUpdatedTime:
              summary: Filter by last updated time
              value: lastUpdated gt "2024-12-23T00:00:00.000Z"
            FilterByDeviceId:
              summary: Filter by device ID
              value: id eq "guo4a5u7JHHhjXrMK0g4"
            FilterByDeviceDisplayName:
              summary: Filter by device display name
              value: profile.displayName eq "Bob"
            FilterByDevicePlatform:
              summary: Filter by device platform
              value: profile.platform eq "WINDOWS"
            FilterBySID:
              summary: Filter by device security identifier (SID)
              value: profile.sid sw "S-1"
        - name: expand
          in: query
          description: >-
            Includes associated user details and management status for the
            device in the `_embedded` attribute
          schema:
            type: string
            example: userSummary
            enum:
              - user
              - userSummary
            x-enumDescriptions:
              user: Lists full details for associated users
              userSummary: Lists summaries for associated users
          examples:
            UserFullDetails:
              summary: Get a detailed list of associated users
              value: user
            UserSummaries:
              summary: Get the list of associated user summaries
              value: userSummary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDevicesResponse'
              examples:
                APIDevicesResponseUserSummaryExample:
                  type: array
                  $ref: '#/components/examples/APIDevicesListAllUserSummaryResponse'
                APIDevicesResponseExample:
                  type: array
                  $ref: '#/components/examples/APIDevicesListAllResponse'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.devices.read
      tags:
        - Device
      x-okta-lifecycle:
        lifecycle: LIMITED_GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
  /api/v1/devices/{deviceId}:
    get:
      summary: Retrieve a device
      description: Retrieves a device by `deviceId`
      operationId: getDevice
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceWithProviders'
              examples:
                APIDevicesResponseExample:
                  $ref: '#/components/examples/DeviceResponse'
                APIDevicesWithProvidersResponseExample:
                  $ref: '#/components/examples/DeviceWithProvidersResponse'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.devices.read
      tags:
        - Device
      x-okta-lifecycle:
        lifecycle: LIMITED_GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathDeviceId'
    delete:
      summary: Delete a device
      description: >-
        Deletes (permanently) a device by `deviceId` if it has a status of
        `DEACTIVATED`. You can transition the device to `DEACTIVATED` status
        using the [Deactivate a
        Device](https://developer.okta.com/docs/api/openapi/okta-management/management/tags/device/other/deactivatedevice)
        endpoint.

        This request is destructive and deletes all of the profile data related
        to the device. Once deleted, device data can't be recovered. However,
        reenrollment creates a new device record.

        > **Note:** Attempts to delete a device that isn't in a `DEACTIVATED`
        state raise an error.
      operationId: deleteDevice
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Access Denied:
                  $ref: '#/components/examples/ErrorAccessDenied'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.devices.manage
      tags:
        - Device
      x-okta-lifecycle:
        lifecycle: LIMITED_GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathDeviceId'
  /api/v1/devices/{deviceId}/lifecycle/activate:
    post:
      summary: Activate a device
      description: |-
        Activates a device by setting its status to `ACTIVE` by `deviceId`.
        Activated devices are used to create and delete device user links.
      operationId: activateDevice
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.devices.manage
      tags:
        - Device
      x-okta-lifecycle:
        lifecycle: LIMITED_GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathDeviceId'
  /api/v1/devices/{deviceId}/lifecycle/deactivate:
    post:
      summary: Deactivate a device
      description: >-
        Deactivates a device by setting its status to `DEACTIVATED` by
        `deviceId`.

        Deactivation causes a device to lose all device user links. Set the
        device status to `DEACTIVATED` before deleting it.

        > **Note:** When deactivating a Device, keep in mind the following:
          - Device deactivation is a destructive operation for device factors and client certificates. Device reenrollment using Okta Verify allows end users to set up new factors on the device.
          - Device deletion removes the device record from Okta. Reenrollment creates a new device record.
      operationId: deactivateDevice
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.devices.manage
      tags:
        - Device
      x-okta-lifecycle:
        lifecycle: LIMITED_GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathDeviceId'
  /api/v1/devices/{deviceId}/lifecycle/suspend:
    post:
      summary: Suspend a Device
      description: >-
        Suspends a device by setting its status to `SUSPENDED`.

        Use suspended devices to create and delete device user links. You can
        only unsuspend or deactivate suspended devices.

        > **Note:** `SUSPENDED` status is meant to be temporary, so it isn't
        destructive.
      operationId: suspendDevice
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.devices.manage
      tags:
        - Device
      x-okta-lifecycle:
        lifecycle: LIMITED_GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathDeviceId'
  /api/v1/devices/{deviceId}/lifecycle/unsuspend:
    post:
      summary: Unsuspend a Device
      description: |-
        Unsuspends a device by returning its `status` to `ACTIVE`.
        >**Note:** Only devices with a `SUSPENDED` status can be unsuspended.
      operationId: unsuspendDevice
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.devices.manage
      tags:
        - Device
      x-okta-lifecycle:
        lifecycle: LIMITED_GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathDeviceId'
  /api/v1/devices/{deviceId}/os-accounts:
    get:
      summary: List all OS accounts for a device
      description: Lists all OS accounts for a device by `deviceId`
      operationId: listDeviceOSAccounts
      parameters:
        - $ref: '#/components/parameters/queryOsAccountExpand'
        - $ref: '#/components/parameters/pathDeviceId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeviceOSAccountsResponse'
              examples:
                WindowsOSAccountListResponseExample:
                  summary: List all Windows OS accounts for a specific device
                  $ref: '#/components/examples/WindowsOSAccountListResponse'
                MacOSOSAccountListResponseExample:
                  summary: List all macOS accounts for a specific device
                  $ref: '#/components/examples/MacOSOSAccountListResponse'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.devices.read
      tags:
        - Device
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
  /api/v1/devices/{deviceId}/os-accounts/{osAccountId}:
    get:
      summary: Retrieve an OS account
      description: Retrieves an OS account by `osAccountId` for a device
      operationId: getDeviceOSAccount
      parameters:
        - $ref: '#/components/parameters/queryOsAccountExpand'
        - $ref: '#/components/parameters/pathDeviceId'
        - $ref: '#/components/parameters/pathOsAccountId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                discriminator:
                  propertyName: platform
                  mapping:
                    WINDOWS: '#/components/schemas/OSAccountWindows'
                    MACOS: '#/components/schemas/OSAccountMacOS'
                type: object
                properties:
                  created:
                    type: string
                    format: date-time
                    description: Timestamp when the OS account was created
                    readOnly: true
                  deviceId:
                    type: string
                    description: Unique identifier of the device this OS account belongs to
                    readOnly: true
                  id:
                    type: string
                    description: Unique identifier for the OS account
                    readOnly: true
                  lastSeenAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the OS account was last seen
                  lastUpdated:
                    type: string
                    format: date-time
                    description: Timestamp when the OS account was last updated
                    readOnly: true
                  platform:
                    $ref: '#/components/schemas/OSAccountPlatform'
                  resourceAlternateId:
                    type: string
                    nullable: true
                    readOnly: true
                  resourceDisplayName:
                    $ref: '#/components/schemas/OSAccountDisplayName'
                  resourceId:
                    type: string
                    description: Alternate key for the `id`
                    readOnly: true
                  resourceType:
                    type: string
                    default: DOSAccount
                    readOnly: true
                  status:
                    type: string
                    description: Status of the OS account
                    enum:
                      - ACTIVE
                      - DELETED
                  _embedded:
                    $ref: '#/components/schemas/OSAccountEmbedded'
                  _links:
                    $ref: '#/components/schemas/OSAccountLinks'
                  profile:
                    $ref: '#/components/schemas/WindowsOSAccountProfile'
                required:
                  - id
                  - deviceId
                  - created
                  - lastUpdated
                  - platform
                  - status
                  - _links
                  - profile
              examples:
                WindowsOSAccountResponseExample:
                  summary: Windows OS account
                  $ref: '#/components/examples/WindowsOSAccountResponse'
                MacOSOSAccountResponseExample:
                  summary: macOS account
                  $ref: '#/components/examples/MacOSOSAccountResponse'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.devices.read
      tags:
        - Device
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
  /api/v1/devices/{deviceId}/users:
    get:
      summary: List all users for a device
      description: Lists all Users for a device by `deviceId`
      operationId: listDeviceUsers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeviceUsersResponse'
              examples:
                APIDevicesListAllUsersResponseExample:
                  summary: List all users for a specific device
                  $ref: '#/components/examples/APIDevicesListAllUsersResponse'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.devices.read
      tags:
        - Device
      x-okta-lifecycle:
        lifecycle: LIMITED_GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathDeviceId'
components:
  schemas:
    DeviceList:
      x-okta-ignore-redocly-rules-for-sdk: true
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: Timestamp when the device was created
          readOnly: true
        id:
          type: string
          description: Unique key for the device
          readOnly: true
        lastUpdated:
          type: string
          format: date-time
          description: >-
            Timestamp when the device record was last updated. Updates occur
            when Okta collects and saves device signals during authentication,
            and when the lifecycle state of the device changes.
          readOnly: true
        profile:
          $ref: '#/components/schemas/DeviceProfile'
        resourceAlternateId:
          type: string
          readOnly: true
        resourceDisplayName:
          $ref: '#/components/schemas/DeviceDisplayName'
        resourceId:
          type: string
          description: Alternate key for the `id`
          readOnly: true
        resourceType:
          type: string
          default: UDDevice
          readOnly: true
        status:
          $ref: '#/components/schemas/DeviceStatus'
        _links:
          $ref: '#/components/schemas/LinksSelfAndFullUsersLifecycle'
        _embedded:
          type: object
          description: >-
            List of associated users for the device if the `expand=user` query
            parameter is specified in the request. Use `expand=userSummary` to
            get only a summary of each associated user for the device.
          properties:
            users:
              description: Users for the device
              type: array
              items:
                $ref: '#/components/schemas/DeviceUser'
          readOnly: true
    DeviceWithProviders:
      x-okta-ignore-redocly-rules-for-sdk: true
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: Timestamp when the device was created
          readOnly: true
        id:
          type: string
          description: Unique key for the device
          readOnly: true
        lastUpdated:
          type: string
          format: date-time
          description: >-
            Timestamp when the device record was last updated. Updates occur
            when Okta collects and saves device signals during authentication,
            and when the lifecycle state of the device changes.
          readOnly: true
        profile:
          $ref: '#/components/schemas/DeviceProfile'
        resourceAlternateId:
          type: string
          readOnly: true
        resourceDisplayName:
          $ref: '#/components/schemas/DeviceDisplayName'
        resourceId:
          type: string
          description: Alternate key for the `id`
          readOnly: true
        resourceType:
          type: string
          default: UDDevice
          readOnly: true
        status:
          $ref: '#/components/schemas/DeviceStatus'
        _links:
          $ref: '#/components/schemas/LinksSelfAndFullUsersLifecycle'
        providers:
          type: array
          description: >-
            List of providers for the device when the `expand=providers` query
            parameter is specified
          readOnly: true
          items:
            $ref: '#/components/schemas/DeviceProvider'
    Error:
      title: Error
      type: object
      properties:
        errorCauses:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCause'
        errorCode:
          type: string
          description: An Okta code for this type of error
        errorId:
          type: string
          description: >-
            A unique identifier for this error. This can be used by Okta Support
            to help with troubleshooting.
        errorLink:
          type: string
          description: An Okta code for this type of error
        errorSummary:
          type: string
          description: >-
            A short description of what caused this error. Sometimes this
            contains dynamically-generated information about your specific
            error.
    OSAccountWindows:
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: Timestamp when the OS account was created
          readOnly: true
        deviceId:
          type: string
          description: Unique identifier of the device this OS account belongs to
          readOnly: true
        id:
          type: string
          description: Unique identifier for the OS account
          readOnly: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the OS account was last seen
        lastUpdated:
          type: string
          format: date-time
          description: Timestamp when the OS account was last updated
          readOnly: true
        platform:
          $ref: '#/components/schemas/OSAccountPlatform'
        resourceAlternateId:
          type: string
          nullable: true
          readOnly: true
        resourceDisplayName:
          $ref: '#/components/schemas/OSAccountDisplayName'
        resourceId:
          type: string
          description: Alternate key for the `id`
          readOnly: true
        resourceType:
          type: string
          default: DOSAccount
          readOnly: true
        status:
          type: string
          description: Status of the OS account
          enum:
            - ACTIVE
            - DELETED
        _embedded:
          $ref: '#/components/schemas/OSAccountEmbedded'
        _links:
          $ref: '#/components/schemas/OSAccountLinks'
        profile:
          $ref: '#/components/schemas/WindowsOSAccountProfile'
      required:
        - id
        - deviceId
        - created
        - lastUpdated
        - platform
        - status
        - _links
        - profile
      discriminator:
        propertyName: platform
        mapping:
          WINDOWS: '#/components/schemas/OSAccountWindows'
          MACOS: '#/components/schemas/OSAccountMacOS'
    OSAccountMacOS:
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: Timestamp when the OS account was created
          readOnly: true
        deviceId:
          type: string
          description: Unique identifier of the device this OS account belongs to
          readOnly: true
        id:
          type: string
          description: Unique identifier for the OS account
          readOnly: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the OS account was last seen
        lastUpdated:
          type: string
          format: date-time
          description: Timestamp when the OS account was last updated
          readOnly: true
        platform:
          $ref: '#/components/schemas/OSAccountPlatform'
        resourceAlternateId:
          type: string
          nullable: true
          readOnly: true
        resourceDisplayName:
          $ref: '#/components/schemas/OSAccountDisplayName'
        resourceId:
          type: string
          description: Alternate key for the `id`
          readOnly: true
        resourceType:
          type: string
          default: DOSAccount
          readOnly: true
        status:
          type: string
          description: Status of the OS account
          enum:
            - ACTIVE
            - DELETED
        _embedded:
          $ref: '#/components/schemas/OSAccountEmbedded'
        _links:
          $ref: '#/components/schemas/OSAccountLinks'
        profile:
          $ref: '#/components/schemas/MacOSAccountProfile'
      required:
        - id
        - deviceId
        - created
        - lastUpdated
        - platform
        - status
        - _links
        - profile
      discriminator:
        propertyName: platform
        mapping:
          WINDOWS: '#/components/schemas/OSAccountWindows'
          MACOS: '#/components/schemas/OSAccountMacOS'
    DeviceUser:
      type: object
      properties:
        created:
          type: string
          description: Timestamp when device was created
        managementStatus:
          type: string
          description: The management status of the device
          enum:
            - MANAGED
            - NOT_MANAGED
          x-enumDescriptions:
            MANAGED: The device has management software installed
            NOT_MANAGED: The device doesn't have management software installed
        screenLockType:
          type: string
          description: Screen lock type of the device
          enum:
            - NONE
            - PASSCODE
            - BIOMETRIC
        user:
          $ref: '#/components/schemas/User'
    Device:
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: Timestamp when the device was created
          readOnly: true
        id:
          type: string
          description: Unique key for the device
          readOnly: true
        lastUpdated:
          type: string
          format: date-time
          description: >-
            Timestamp when the device record was last updated. Updates occur
            when Okta collects and saves device signals during authentication,
            and when the lifecycle state of the device changes.
          readOnly: true
        profile:
          $ref: '#/components/schemas/DeviceProfile'
        resourceAlternateId:
          type: string
          readOnly: true
        resourceDisplayName:
          $ref: '#/components/schemas/DeviceDisplayName'
        resourceId:
          type: string
          description: Alternate key for the `id`
          readOnly: true
        resourceType:
          type: string
          default: UDDevice
          readOnly: true
        status:
          $ref: '#/components/schemas/DeviceStatus'
        _links:
          $ref: '#/components/schemas/LinksSelfAndFullUsersLifecycle'
    DeviceProvider:
      type: object
      properties:
        payload:
          $ref: '#/components/schemas/OktaVerifyPayload'
        payloadVersion:
          type: string
          description: The version of the payload schema
          example: '1.0'
        provider:
          type: string
          description: The name of the provider
          example: oktaVerify
    ErrorCause:
      type: object
      properties:
        errorSummary:
          type: string
    OSAccount:
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: Timestamp when the OS account was created
          readOnly: true
        deviceId:
          type: string
