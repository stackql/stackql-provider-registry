openapi: 3.0.3
info:
  title: oauth2 API
  description: okta oauth2 API
  version: 2026.07.2
paths:
  /oauth2/v1/clients/{clientId}/roles:
    get:
      summary: List all client role assignments
      description: Lists all roles assigned to a client app identified by `clientId`
      operationId: listRolesForClient
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesForClientResponse'
              examples:
                Standard roles:
                  $ref: '#/components/examples/StandardRolesListResponseClient'
                Custom roles:
                  $ref: '#/components/examples/CustomRolesListResponseClient'
                IAM-based standard roles:
                  $ref: '#/components/examples/IAMStandardRolesListResponseClient'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.read
      tags:
        - RoleAssignmentClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathClientId'
    post:
      summary: Assign a client role
      description: >-
        Assigns a [standard
        role](https://developer.okta.com/docs/api/openapi/okta-management/guides/roles/#standard-roles) to a client
        app.


        You can also assign a custom role to a client app, but the preferred
        method to assign a custom role to a client is to create a binding
        between the custom role, the resource set, and the client app. See
        [Create a role resource set
        binding](https://developer.okta.com/docs/api/openapi/okta-management/management/roledresourcesetbinding/createresourcesetbinding).


        > **Notes:**

        > * The request payload is different for standard and custom role
        assignments.

        > * For IAM-based standard role assignments, use the request payload for
        standard roles. However, the response payload for IAM-based role
        assignments is similar to the custom role's assignment response.
      operationId: assignRoleToClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              discriminator:
                propertyName: type
                mapping:
                  API_ACCESS_MANAGEMENT_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  APP_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  GROUP_MEMBERSHIP_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  HELP_DESK_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  ORG_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  READ_ONLY_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  REPORT_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  SUPER_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  USER_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  ACCESS_CERTIFICATIONS_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  ACCESS_REQUESTS_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  WORKFLOWS_ADMIN: '#/components/schemas/StandardRoleAssignmentSchema'
                  CUSTOM: '#/components/schemas/CustomRoleAssignmentSchema'
              title: Standard role
              type: object
              properties:
                type:
                  type: string
                  description: >-
                    Specify a [standard admin
                    role](https://developer.okta.com/docs/api/openapi/okta-management/guides/roles/#standard-roles),
                    an [IAM-based standard
                    role](https://developer.okta.com/docs/api/openapi/okta-management/guides/roles/#iam-based-standard-roles),
                    or `CUSTOM` for a custom role type:
                  enum:
                    - ACCESS_CERTIFICATIONS_ADMIN
                    - ACCESS_REQUESTS_ADMIN
                    - API_ACCESS_MANAGEMENT_ADMIN
                    - APP_ADMIN
                    - GROUP_MEMBERSHIP_ADMIN
                    - HELP_DESK_ADMIN
                    - ORG_ADMIN
                    - READ_ONLY_ADMIN
                    - REPORT_ADMIN
                    - SUPER_ADMIN
                    - USER_ADMIN
                    - WORKFLOWS_ADMIN
                resource-set:
                  type: string
                  description: Resource set ID
                role:
                  type: string
                  description: Custom role ID
              required:
                - type
                - role
                - resource-set
            examples:
              Standard role:
                $ref: '#/components/examples/StandardRoleAssignmentRequest'
              Custom role assignment:
                $ref: '#/components/examples/CustomRoleAssignmentRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                discriminator:
                  propertyName: type
                  mapping:
                    API_ACCESS_MANAGEMENT_ADMIN: '#/components/schemas/StandardRole'
                    APP_ADMIN: '#/components/schemas/StandardRole'
                    GROUP_MEMBERSHIP_ADMIN: '#/components/schemas/StandardRole'
                    HELP_DESK_ADMIN: '#/components/schemas/StandardRole'
                    ORG_ADMIN: '#/components/schemas/StandardRole'
                    READ_ONLY_ADMIN: '#/components/schemas/StandardRole'
                    REPORT_ADMIN: '#/components/schemas/StandardRole'
                    SUPER_ADMIN: '#/components/schemas/StandardRole'
                    USER_ADMIN: '#/components/schemas/StandardRole'
                    ACCESS_CERTIFICATIONS_ADMIN: '#/components/schemas/CustomRole'
                    ACCESS_REQUESTS_ADMIN: '#/components/schemas/CustomRole'
                    WORKFLOWS_ADMIN: '#/components/schemas/CustomRole'
                    CUSTOM: '#/components/schemas/CustomRole'
                title: Standard role assignment
                x-okta-ignore-redocly-rules-for-sdk: true
                type: object
                properties:
                  assignmentType:
                    $ref: '#/components/schemas/RoleAssignmentType'
                  created:
                    type: string
                    description: Timestamp when the object was created
                    format: date-time
                    readOnly: true
                  id:
                    type: string
                    description: Role assignment ID
                    readOnly: true
                  label:
                    type: string
                    description: Label for the role assignment
                    readOnly: true
                  lastUpdated:
                    type: string
                    description: Timestamp when the object was last updated
                    format: date-time
                    readOnly: true
                  status:
                    type: string
                    enum:
                      - ACTIVE
                      - INACTIVE
                    description: Status of the role assignment
                  type:
                    $ref: '#/components/schemas/RoleType'
                  _embedded:
                    type: object
                    description: Optional embedded resources for the role assignment
                    properties:
                      targets:
                        type: object
                        description: Targets configured for the role assignment
                        properties:
                          groups:
                            type: array
                            description: Group targets
                            items:
                              $ref: '#/components/schemas/Group'
                          catalog:
                            description: App targets
                            properties:
                              apps:
                                type: array
                                items:
                                  $ref: '#/components/schemas/CatalogApplication'
                            type: object
                  _links:
                    $ref: '#/components/schemas/LinksAssignee'
                  resource-set:
                    type: string
                    description: Resource set ID
                    readOnly: true
                  role:
                    type: string
                    description: Role ID
                    readOnly: true
                required:
                  - type
              examples:
                Standard role:
                  $ref: '#/components/examples/StandardRoleResponseClient'
                Custom role assignment:
                  $ref: '#/components/examples/CustomRoleResponseClient'
                IAM-based role assignment:
                  $ref: '#/components/examples/IAMStandardRolesListResponseClient'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.manage
      tags:
        - RoleAssignmentClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathClientId'
  /oauth2/v1/clients/{clientId}/roles/{roleAssignmentId}:
    get:
      summary: Retrieve a client role
      description: >-
        Retrieves a role assignment (identified by `roleAssignmentId`) for a
        client app (identified by `clientId`)
      operationId: retrieveClientRole
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                discriminator:
                  propertyName: type
                  mapping:
                    API_ACCESS_MANAGEMENT_ADMIN: '#/components/schemas/StandardRole'
                    APP_ADMIN: '#/components/schemas/StandardRole'
                    GROUP_MEMBERSHIP_ADMIN: '#/components/schemas/StandardRole'
                    HELP_DESK_ADMIN: '#/components/schemas/StandardRole'
                    ORG_ADMIN: '#/components/schemas/StandardRole'
                    READ_ONLY_ADMIN: '#/components/schemas/StandardRole'
                    REPORT_ADMIN: '#/components/schemas/StandardRole'
                    SUPER_ADMIN: '#/components/schemas/StandardRole'
                    USER_ADMIN: '#/components/schemas/StandardRole'
                    ACCESS_CERTIFICATIONS_ADMIN: '#/components/schemas/CustomRole'
                    ACCESS_REQUESTS_ADMIN: '#/components/schemas/CustomRole'
                    WORKFLOWS_ADMIN: '#/components/schemas/CustomRole'
                    CUSTOM: '#/components/schemas/CustomRole'
                title: Standard role assignment
                x-okta-ignore-redocly-rules-for-sdk: true
                type: object
                properties:
                  assignmentType:
                    $ref: '#/components/schemas/RoleAssignmentType'
                  created:
                    type: string
                    description: Timestamp when the object was created
                    format: date-time
                    readOnly: true
                  id:
                    type: string
                    description: Role assignment ID
                    readOnly: true
                  label:
                    type: string
                    description: Label for the role assignment
                    readOnly: true
                  lastUpdated:
                    type: string
                    description: Timestamp when the object was last updated
                    format: date-time
                    readOnly: true
                  status:
                    type: string
                    enum:
                      - ACTIVE
                      - INACTIVE
                    description: Status of the role assignment
                  type:
                    $ref: '#/components/schemas/RoleType'
                  _embedded:
                    type: object
                    description: Optional embedded resources for the role assignment
                    properties:
                      targets:
                        type: object
                        description: Targets configured for the role assignment
                        properties:
                          groups:
                            type: array
                            description: Group targets
                            items:
                              $ref: '#/components/schemas/Group'
                          catalog:
                            description: App targets
                            properties:
                              apps:
                                type: array
                                items:
                                  $ref: '#/components/schemas/CatalogApplication'
                            type: object
                  _links:
                    $ref: '#/components/schemas/LinksAssignee'
                  resource-set:
                    type: string
                    description: Resource set ID
                    readOnly: true
                  role:
                    type: string
                    description: Role ID
                    readOnly: true
                required:
                  - type
              examples:
                Standard role:
                  $ref: '#/components/examples/StandardRoleResponseClient'
                Custom role assignment:
                  $ref: '#/components/examples/CustomRoleResponseClient'
                IAM-based standard role assignment:
                  $ref: '#/components/examples/IAMStandardRoleResponseClient'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.read
      tags:
        - RoleAssignmentClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathClientId'
        - $ref: '#/components/parameters/pathRoleAssignmentId'
    delete:
      summary: Unassign a client role
      description: >-
        Unassigns a role assignment (identified by `roleAssignmentId`) from a
        client app (identified by `clientId`)
      operationId: deleteRoleFromClient
      responses:
        '204':
          description: No Content
          content: {}
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.manage
      tags:
        - RoleAssignmentClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathClientId'
        - $ref: '#/components/parameters/pathRoleAssignmentId'
  /oauth2/v1/clients/{clientId}/roles/{roleAssignmentId}/targets/catalog/apps:
    get:
      summary: List all client role app targets
      description: >-
        Lists all OIN app targets for an `APP_ADMIN` role that's assigned to a
        client (by `clientId`).
      operationId: listAppTargetRoleToClient
      parameters:
        - $ref: '#/components/parameters/queryAfter'
        - $ref: '#/components/parameters/queryLimit'
        - $ref: '#/components/parameters/pathClientId'
        - $ref: '#/components/parameters/pathRoleAssignmentId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppTargetRoleToClientResponse'
              examples:
                ClientRoleTargetExample:
                  $ref: '#/components/examples/ClientRoleTargetResponseFacebookEx'
                ClientRoleTargetNonOINExample:
                  $ref: '#/components/examples/ClientRoleTargetResponseInstanceEx'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.read
      tags:
        - RoleBTargetClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
  /oauth2/v1/clients/{clientId}/roles/{roleAssignmentId}/targets/catalog/apps/{appName}:
    put:
      summary: Assign a client role app target
      description: >-
        Assigns an OIN app target for an `APP_ADMIN` role assignment to a
        client. When you assign an app target from the OIN catalog, you reduce
        the scope of the role assignment.

        The role assignment applies to only app instances that are included in
        the specified OIN app target.


        An assigned OIN app target overrides any existing app instance targets.

        For example, if a user is assigned to administer a specific Facebook
        instance, a successful request to add an OIN app target with `facebook`
        for `appName` makes that user the administrator for all Facebook
        instances.
      operationId: assignAppTargetRoleToClient
      responses:
        '204':
          description: No Content
          content: {}
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.manage
      tags:
        - RoleBTargetClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathClientId'
        - $ref: '#/components/parameters/pathRoleAssignmentId'
        - $ref: '#/components/parameters/pathAppName'
    delete:
      summary: Unassign a client role app target
      description: >-
        Unassigns an OIN app target for a role assignment to a client app


        > **Note:** You can't remove the last OIN app target from a role
        assignment.

        > If you need a role assignment that applies to all apps, delete the
        role assignment with the target and create another one. See [Unassign a
        client
        role](https://developer.okta.com/docs/api/openapi/okta-management/management/tags/roleassignmentclient/other/deleterolefromclient).
      operationId: removeAppTargetRoleFromClient
      responses:
        '204':
          description: No Content
          content: {}
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.manage
      tags:
        - RoleBTargetClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathClientId'
        - $ref: '#/components/parameters/pathRoleAssignmentId'
        - $ref: '#/components/parameters/pathAppName'
  /oauth2/v1/clients/{clientId}/roles/{roleAssignmentId}/targets/catalog/apps/{appName}/{appId}:
    put:
      summary: Assign a client role app instance target
      description: >-
        Assigns an app instance target to an `APP_ADMIN` role assignment to a
        client. When you assign the first OIN app or app instance target, you
        reduce the scope of the role assignment.

        The role no longer applies to all app targets, but applies only to the
        specified target.


        > **Note:** You can target a mixture of both OIN app and app instance
        targets, but you can't assign permissions to manage all instances of an
        OIN app and then assign a subset of permissions to the same app.

        For example, you can't specify that an admin has access to manage all
        instances of the Salesforce app and then also manage only specific
        configurations of the Salesforce app.
      operationId: assignAppTargetInstanceRoleForClient
      responses:
        '204':
          description: No Content
          content: {}
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.manage
      tags:
        - RoleBTargetClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathClientId'
        - $ref: '#/components/parameters/pathRoleAssignmentId'
        - $ref: '#/components/parameters/pathAppName'
        - $ref: '#/components/parameters/pathAppId'
    delete:
      summary: Unassign a client role app instance target
      description: >-
        Unassigns an app instance target from a role assignment to a client app


        > **Note:** You can't remove the last app instance target from a role
        assignment.

        > If you need a role assignment that applies to all the apps, delete the
        role assignment with the instance target and create another one.  See
        [Unassign a client
        role](https://developer.okta.com/docs/api/openapi/okta-management/management/tags/roleassignmentclient/other/deleterolefromclient).
      operationId: removeAppTargetInstanceRoleForClient
      responses:
        '204':
          description: No Content
          content: {}
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.manage
      tags:
        - RoleBTargetClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathClientId'
        - $ref: '#/components/parameters/pathRoleAssignmentId'
        - $ref: '#/components/parameters/pathAppName'
        - $ref: '#/components/parameters/pathAppId'
  /oauth2/v1/clients/{clientId}/roles/{roleAssignmentId}/targets/groups:
    get:
      summary: List all client role group targets
      description: >-
        Lists all group targets for a
        [`USER_ADMIN`](https://developer.okta.com/docs/api/openapi/okta-management/guides/roles/#standard-roles),
        `HELP_DESK_ADMIN`, or `GROUP_MEMBERSHIP_ADMIN` role assignment to a
        client. If the role isn't scoped to specific group targets, Okta returns
        an empty array `[]`.
      operationId: listGroupTargetRoleForClient
      parameters:
        - $ref: '#/components/parameters/queryAfter'
        - $ref: '#/components/parameters/queryLimit'
        - $ref: '#/components/parameters/pathClientId'
        - $ref: '#/components/parameters/pathRoleAssignmentId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroupTargetRoleForClientResponse'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.read
      tags:
        - RoleBTargetClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
  /oauth2/v1/clients/{clientId}/roles/{roleAssignmentId}/targets/groups/{groupId}:
    put:
      summary: Assign a client role group target
      description: >-
        Assigns a group target to a
        [`USER_ADMIN`](https://developer.okta.com/docs/api/openapi/okta-management/guides/roles/#standard-roles),
        `HELP_DESK_ADMIN`, or `GROUP_MEMBERSHIP_ADMIN` role assignment to a
        client app. When you assign the first group target, you reduce the scope
        of the role assignment. The role no longer applies to all targets, but
        applies only to the specified target.
      operationId: assignGroupTargetRoleForClient
      responses:
        '204':
          description: No Content
          content: {}
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.manage
      tags:
        - RoleBTargetClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathClientId'
        - $ref: '#/components/parameters/pathRoleAssignmentId'
        - $ref: '#/components/parameters/pathGroupId'
    delete:
      summary: Unassign a client role group target
      description: >-
        Unassigns a Group target from a `USER_ADMIN`, `HELP_DESK_ADMIN`, or
        `GROUP_MEMBERSHIP_ADMIN` role assignment to a client app.


        > **Note:** You can't remove the last group target from a role
        assignment. If you need a role assignment that applies to all groups,
        delete the role assignment with the target and create another one. See
        [Unassign a client
        role](https://developer.okta.com/docs/api/openapi/okta-management/management/tags/roleassignmentclient/other/deleterolefromclient).
      operationId: removeGroupTargetRoleFromClient
      responses:
        '204':
          description: No Content
          content: {}
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.roles.manage
      tags:
        - RoleBTargetClient
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: true
      parameters:
        - $ref: '#/components/parameters/pathClientId'
        - $ref: '#/components/parameters/pathRoleAssignmentId'
        - $ref: '#/components/parameters/pathGroupId'
components:
  schemas:
    StandardRole:
      title: Standard role assignment
      x-okta-ignore-redocly-rules-for-sdk: true
      type: object
      properties:
        assignmentType:
          $ref: '#/components/schemas/RoleAssignmentType'
        created:
          type: string
          description: Timestamp when the object was created
          format: date-time
          readOnly: true
        id:
          type: string
          description: Role assignment ID
          readOnly: true
        label:
          type: string
          description: Label for the role assignment
          readOnly: true
        lastUpdated:
          type: string
          description: Timestamp when the object was last updated
          format: date-time
          readOnly: true
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          description: Status of the role assignment
        type:
          $ref: '#/components/schemas/RoleType'
        _embedded:
          type: object
          description: Optional embedded resources for the role assignment
          properties:
            targets:
              type: object
              description: Targets configured for the role assignment
              properties:
                groups:
                  type: array
                  description: Group targets
                  items:
                    $ref: '#/components/schemas/Group'
                catalog:
                  description: App targets
                  properties:
                    apps:
                      type: array
                      items:
                        $ref: '#/components/schemas/CatalogApplication'
                  type: object
        _links:
          $ref: '#/components/schemas/LinksAssignee'
      required:
        - type
    CustomRole:
      title: Custom role assignment
      x-okta-ignore-redocly-rules-for-sdk: true
      type: object
      properties:
        assignmentType:
          $ref: '#/components/schemas/RoleAssignmentType'
        created:
          type: string
          description: Timestamp when the object was created
          format: date-time
          readOnly: true
        id:
          type: string
          description: Binding object ID
          readOnly: true
        label:
          type: string
          description: Label for the role assignment
          readOnly: true
        lastUpdated:
          type: string
          description: Timestamp when the object was last updated
          format: date-time
          readOnly: true
        resource-set:
          type: string
          description: Resource set ID
          readOnly: true
        role:
          type: string
          description: Role ID
          readOnly: true
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          description: Status of the role assignment
        type:
          $ref: '#/components/schemas/RoleType'
        _links:
