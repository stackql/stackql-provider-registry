      id: okta.oauth2.client_roles
      name: client_roles
      title: Client Roles
      methods:
        list_roles_for_client:
          operation:
            $ref: '#/paths/~1oauth2~1v1~1clients~1{clientId}~1roles/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.roles_for_client
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/ListRolesForClientResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"roles_for_client\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
        assign_role_to_client:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1oauth2~1v1~1clients~1{clientId}~1roles/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        retrieve_client_role:
          operation:
            $ref: >-
              #/paths/~1oauth2~1v1~1clients~1{clientId}~1roles~1{roleAssignmentId}/get
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete_role_from_client:
          operation:
            $ref: >-
              #/paths/~1oauth2~1v1~1clients~1{clientId}~1roles~1{roleAssignmentId}/delete
          response:
            mediaType: application/json
            openAPIDocKey: '204'
      sqlVerbs:
        select:
          - $ref: >-
              #/components/x-stackQL-resources/client_roles/methods/retrieve_client_role
