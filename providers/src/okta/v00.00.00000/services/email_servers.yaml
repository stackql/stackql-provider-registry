openapi: 3.0.3
info:
  title: email_servers API
  description: okta email_servers API
  version: 2026.07.2
paths:
  /api/v1/email-servers:
    get:
      summary: List all enrolled SMTP servers
      description: Lists all the enrolled custom SMTP server configurations
      operationId: listEmailServers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailServerListResponse'
              examples:
                BasicSMTP:
                  $ref: '#/components/examples/ListBasicSMTPServer'
                OAuthClientCredentials:
                  $ref: '#/components/examples/ListOAuthClientCredentialsServer'
                OAuthJWT:
                  $ref: '#/components/examples/ListOAuthJWTServer'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.emailServers.read
      tags:
        - EmailServer
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
    post:
      summary: Create a custom SMTP server
      description: >-
        Creates a custom email SMTP server configuration for your org.


        For more information about configuring the OAuth 2.0 authentication
        methods, see [Custom email providers with OAuth
        2.0](https://developer.okta.com/docs/guides/custom-smtp/main/).
      operationId: createEmailServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseEmailServerCreate'
            examples:
              BasicSMTP:
                $ref: '#/components/examples/BasicSMTPRequest'
              OAuthClientCredentials:
                $ref: '#/components/examples/OAuthClientCredentialsRequest'
              OAuthJWT:
                $ref: '#/components/examples/OAuthJWTRequest'
      responses:
        '201':
          description: Successfully enrolled server credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEmailServer'
              examples:
                BasicSMTP:
                  $ref: '#/components/examples/BasicSMTPResponse'
                OAuthClientCredentials:
                  $ref: '#/components/examples/OAuthClientCredentialsResponse'
                OAuthJWT:
                  $ref: '#/components/examples/OAuthJWTResponse'
        '400':
          $ref: '#/components/responses/ErrorApiValidationFailed400'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.emailServers.manage
      tags:
        - EmailServer
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
  /api/v1/email-servers/{emailServerId}:
    get:
      summary: Retrieve an SMTP server configuration
      description: Retrieves the specified custom SMTP server configuration
      operationId: getEmailServer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEmailServer'
              examples:
                SMTPServerResponse:
                  $ref: '#/components/examples/BasicSMTPResponse'
                OAuthClientCredentialsResponse:
                  $ref: '#/components/examples/OAuthClientCredentialsResponse'
                OAuthJWTResponse:
                  $ref: '#/components/examples/OAuthJWTResponse'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.emailServers.read
      tags:
        - EmailServer
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathEmailServerId'
    patch:
      summary: Update an SMTP server configuration
      description: >-
        Updates the specified custom SMTP server configuration


        > **Note:** When you update an SMTP server configuration that uses OAuth
        2.0 authentication, the
        [`authType`](#components/schemas/BaseEmailServer/properties/authType)
        property is required in the request body.
      operationId: updateEmailServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseEmailServer'
            examples:
              BasicSMTP:
                $ref: '#/components/examples/BasicSMTPPatchRequest'
              OAuthClientCredentials:
                $ref: '#/components/examples/OAuthClientCredentialsPatchRequest'
              OAuthJWT:
                $ref: '#/components/examples/OAuthJWTPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEmailServer'
              examples:
                BasicSMTP:
                  $ref: '#/components/examples/BasicSMTPPatchResponse'
                OAuthClientCredentials:
                  $ref: '#/components/examples/OAuthClientCredentialsPatchResponse'
                OAuthJWT:
                  $ref: '#/components/examples/OAuthJWTPatchResponse'
        '400':
          $ref: '#/components/responses/ErrorApiValidationFailed400'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.emailServers.manage
      tags:
        - EmailServer
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathEmailServerId'
    delete:
      summary: Delete an SMTP server configuration
      description: Deletes the specified custom SMTP server configuration
      operationId: deleteEmailServer
      responses:
        '204':
          description: No content
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.emailServers.manage
      tags:
        - EmailServer
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathEmailServerId'
  /api/v1/email-servers/{emailServerId}/test:
    post:
      summary: Test an SMTP server configuration
      description: Tests the specified custom SMTP server configuration
      operationId: testEmailServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTestAddresses'
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/ErrorApiValidationFailed400'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.emailServers.manage
      tags:
        - EmailServer
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      parameters:
        - $ref: '#/components/parameters/pathEmailServerId'
components:
  schemas:
    EmailServerListResponse:
      type: object
      properties:
        email-servers:
          type: array
          description: List of enrolled SMTP servers
          items:
            $ref: '#/components/schemas/BaseEmailServer'
    BaseEmailServerCreate:
      type: object
      properties:
        alias:
          type: string
          description: Human-readable name for your SMTP server
          example: CustomServer1
        authType:
          $ref: '#/components/schemas/SmtpAuthType'
        enabled:
          type: boolean
          description: If `true`, all email traffic is routed through your SMTP server
        host:
          type: string
          description: Hostname or IP address of your SMTP server
          example: 192.168.160.1
        id:
          type: string
          description: ID of your SMTP server
          readOnly: true
        port:
          type: integer
          description: Port number of your SMTP server
          example: 587
        username:
          type: string
          description: Username that's used to access your SMTP server
          example: some_user@domain.com
      required:
        - alias
        - enabled
        - host
        - port
        - username
        - authType
      discriminator:
        propertyName: authType
        mapping:
          BASIC_SMTP_AUTH: '#/components/schemas/BASIC_SMTP_AUTH_CREATE'
          OAUTH2_CLIENT_CREDENTIALS: '#/components/schemas/OAUTH2_CLIENT_CREDENTIALS_CREATE'
          OAUTH2_JWT_BEARER_GRANT: '#/components/schemas/OAUTH2_JWT_BEARER_GRANT_CREATE'
    BaseEmailServer:
      type: object
      properties:
        alias:
          type: string
          description: Human-readable name for your SMTP server
          example: CustomServer1
        authType:
          $ref: '#/components/schemas/SmtpAuthType'
        enabled:
          type: boolean
          description: If `true`, all email traffic is routed through your SMTP server
        host:
          type: string
          description: Hostname or IP address of your SMTP server
          example: 192.168.160.1
        id:
          type: string
          description: ID of your SMTP server
          readOnly: true
        port:
          type: integer
          description: Port number of your SMTP server
          example: 587
        username:
          type: string
          description: Username that's used to access your SMTP server
          example: some_user@domain.com
      required:
        - authType
      discriminator:
        propertyName: authType
        mapping:
          BASIC_SMTP_AUTH: '#/components/schemas/BASIC_SMTP_AUTH'
          OAUTH2_CLIENT_CREDENTIALS: '#/components/schemas/OAUTH2_CLIENT_CREDENTIALS'
          OAUTH2_JWT_BEARER_GRANT: '#/components/schemas/OAUTH2_JWT_BEARER_GRANT'
    EmailTestAddresses:
      type: object
      properties:
        fromAddress:
          type: string
          description: Email address that sends test emails
          example: sender@host.com
        toAddress:
          type: string
          description: Email address that receives test emails
          example: receiver@host.com
      required:
        - fromAddress
        - toAddress
    Error:
      title: Error
      type: object
      properties:
        errorCauses:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCause'
        errorCode:
          type: string
          description: An Okta code for this type of error
        errorId:
          type: string
          description: >-
            A unique identifier for this error. This can be used by Okta Support
            to help with troubleshooting.
        errorLink:
          type: string
          description: An Okta code for this type of error
        errorSummary:
          type: string
          description: >-
            A short description of what caused this error. Sometimes this
            contains dynamically-generated information about your specific
            error.
    SmtpAuthType:
      description: >-
        <x-lifecycle-container><x-lifecycle class="ea"></x-lifecycle>
        <x-lifecycle class="oie"></x-lifecycle></x-lifecycle-container>The
        authentication type that's used by your SMTP server
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      type: string
      enum:
        - BASIC_SMTP_AUTH
        - OAUTH2_CLIENT_CREDENTIALS
        - OAUTH2_JWT_BEARER_GRANT
      x-enumDescriptions:
        BASIC_SMTP_AUTH: >-
          Basic SMTP authentication uses a username and password to authenticate
          with your SMTP server
        OAUTH2_CLIENT_CREDENTIALS: >-
          OAuth 2.0 client credentials requires you to create an OAuth 2.0 app
          with your email provider to obtain a client ID and client secret
        OAUTH2_JWT_BEARER_GRANT: >-
          OAuth 2.0 JWT bearer token requires you to create an OAuth 2.0 app
          with your email provider and use a signed JWT to obtain an access
          token
    ErrorCause:
      type: object
      properties:
        errorSummary:
          type: string
  responses:
    ErrorAccessDenied403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            AccessDenied:
              $ref: '#/components/examples/ErrorAccessDenied'
    ErrorTooManyRequests429:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            TooManyRequests:
              $ref: '#/components/examples/ErrorTooManyRequests'
    ErrorApiValidationFailed400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            APIValidationFailed:
              $ref: '#/components/examples/ErrorApiValidationFailed'
    ErrorResourceNotFound404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ResourceNotFound:
              $ref: '#/components/examples/ErrorResourceNotFound'
  parameters:
    pathEmailServerId:
      name: emailServerId
      in: path
      required: true
      schema:
        type: string
        description: ID of your SMTP server configuration
  examples:
    ListBasicSMTPServer:
      summary: List containing basic authentication SMTP server
      value:
        email-servers:
          - id: ces7n3u7sSohfoaou0g1
            alias: CustomServer1
            enabled: true
            authType: BASIC_SMTP_AUTH
            host: smtp.example.com
            port: 587
            username: user@example.com
    ListOAuthClientCredentialsServer:
      summary: List containing OAuth 2.0 client credentials SMTP server
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      value:
        email-servers:
          - id: ces7n3u7sSohfoaou0g2
            alias: OAuthServer1
            enabled: true
            authType: OAUTH2_CLIENT_CREDENTIALS
            host: smtp.oauth.com
            port: 587
            username: user@oauth.com
            clientId: oauth-client-id
            tokenEndpoint: https://oauth.example.com/token
            tokenEndpointAuthMethod: CLIENT_SECRET_BASIC
            scopes:
              - send_email
    ListOAuthJWTServer:
      summary: List containing OAuth 2.0 JWT bearer grant SMTP server
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      value:
        email-servers:
          - id: ces7n3u7sSohfoaou0g3
            alias: OAuthServer2
            enabled: true
            authType: OAUTH2_JWT_BEARER_GRANT
            host: smtp.oauth.com
            port: 587
            username: user@oauth.com
            clientId: oauth-client-id
            tokenEndpoint: https://oauth.example.com/token
            signingAlgorithm: RS256
            issuer: https://oauth.example.com
            subject: user@oauth.com
            audience: https://smtp.oauth.com
            scopes:
              - org.email.send
    BasicSMTPRequest:
      summary: Create basic authentication SMTP server
      value:
        alias: CustomServer1
        enabled: true
        authType: BASIC_SMTP_AUTH
        host: smtp.example.com
        port: 587
        username: user@example.com
        password: securepassword
    OAuthClientCredentialsRequest:
      summary: Create OAuth client credentials server
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      value:
        alias: OAuthServer1
        enabled: false
        authType: OAUTH2_CLIENT_CREDENTIALS
        host: smtp.oauth.com
        port: 587
        username: user@oauth.com
        clientId: oauth-client-id
        clientSecret: oauth-client-secret
        tokenEndpoint: https://oauth.example.com/token
        tokenEndpointAuthMethod: CLIENT_SECRET_BASIC
        scopes:
          - send_email
    OAuthJWTRequest:
      summary: Create OAuth 2.0 JWT bearer grant server
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      value:
        alias: OAuthServer2
        enabled: false
        authType: OAUTH2_JWT_BEARER_GRANT
        host: smtp.oauth.com
        port: 587
        username: user@oauth.com
        clientId: oauth-client-id
        tokenEndpoint: https://oauth.example.com/token
        signingAlgorithm: RS256
        keyId: oauth-key-id
        issuer: https://oauth.example.com
        subject: user@oauth.com
        audience: https://smtp.oauth.com
        scopes:
          - org.email.send
        privateKey: |
          -----BEGIN PRIVATE KEY-----
          ...
          -----END PRIVATE KEY-----
    BasicSMTPResponse:
      summary: Basic authentication SMTP server response
      value:
        id: ces7n3u7sSohfoaou0g1
        alias: CustomServer1
        enabled: true
        authType: BASIC_SMTP_AUTH
        host: smtp.example.com
        port: 587
        username: user@example.com
    OAuthClientCredentialsResponse:
      summary: OAuth 2.0 client credentials server response
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      value:
        id: ces7n3u7sSohfoaou0g2
        alias: OAuthServer1
        enabled: false
        authType: OAUTH2_CLIENT_CREDENTIALS
        host: smtp.oauth.com
        port: 587
        username: user@oauth.com
        clientId: oauth-client-id
        tokenEndpoint: https://oauth.example.com/token
        tokenEndpointAuthMethod: CLIENT_SECRET_BASIC
        scopes:
          - send_email
    OAuthJWTResponse:
      summary: OAuth 2.0 JWT bearer grant server response
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      value:
        id: ces7n3u7sSohfoaou0g3
        alias: OAuthServer2
        enabled: false
        authType: OAUTH2_JWT_BEARER_GRANT
        host: smtp.oauth.com
        port: 587
        username: user@oauth.com
        clientId: oauth-client-id
        signingAlgorithm: RS256
        issuer: https://oauth.example.com
        subject: user@oauth.com
        audience: https://smtp.oauth.com
        scopes:
          - org.email.send
    BasicSMTPPatchRequest:
      summary: Update basic SMTP server
      value:
        alias: CustomServer1 New Alias
        password: New password
    OAuthClientCredentialsPatchRequest:
      summary: Update OAuth 2.0 client credentials server
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      value:
        alias: OAuthServer1 New Alias
        authType: OAUTH2_CLIENT_CREDENTIALS
        clientSecret: New client secret
    OAuthJWTPatchRequest:
      summary: Update OAuth 2.0 JWT bearer grant server
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      value:
        alias: OAuthServer2 New Alias
        authType: OAUTH2_JWT_BEARER_GRANT
        keyId: New keyId
        privateKey: |
          -----BEGIN PRIVATE KEY-----
          ... New Private Key Contents ...
          -----END PRIVATE KEY-----
    BasicSMTPPatchResponse:
      summary: Basic authentication SMTP server patch response
      value:
        id: ces7n3u7sSohfoaou0g1
        alias: CustomServer1 New Alias
        enabled: true
        authType: BASIC_SMTP_AUTH
        host: smtp.example.com
        port: 587
        username: user@example.com
    OAuthClientCredentialsPatchResponse:
      summary: OAuth 2.0 client credentials server patch response
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      value:
        id: ces7n3u7sSohfoaou0g2
        alias: OAuthServer1 New Alias
        enabled: false
        authType: OAUTH2_CLIENT_CREDENTIALS
        host: smtp.oauth.com
        port: 587
        username: user@oauth.com
        clientId: oauth-client-id
        tokenEndpoint: https://oauth.example.com/token
        tokenEndpointAuthMethod: CLIENT_SECRET_BASIC
        scopes:
          - send_email
    OAuthJWTPatchResponse:
      summary: OAuth 2.0 JWT bearer grant server patch response
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs:
          - Okta Identity Engine
      value:
        id: ces7n3u7sSohfoaou0g3
        alias: OAuthServer2 New Alias
        enabled: false
        authType: OAUTH2_JWT_BEARER_GRANT
        host: smtp.oauth.com
        port: 587
        username: user@oauth.com
        clientId: oauth-client-id
        signingAlgorithm: RS256
        issuer: https://oauth.example.com
        subject: user@oauth.com
        audience: https://smtp.oauth.com
        scopes:
          - org.email.send
    ErrorAccessDenied:
      summary: Access Denied
      value:
        errorCode: E0000006
        errorSummary: You do not have permission to perform the requested action
        errorLink: E0000006
        errorId: sampleNUSD_8fdkFd8fs8SDBK
        errorCauses: []
    ErrorTooManyRequests:
      summary: Too Many Requests
      value:
        errorCode: E0000047
        errorSummary: API call exceeded rate limit due to too many requests.
        errorLink: E0000047
        errorId: sampleQPivGUj_ND5v78vbYWW
        errorCauses: []
    ErrorApiValidationFailed:
      summary: API Validation Failed
      value:
        errorCode: E0000001
        errorSummary: 'Api validation failed: {0}'
        errorLink: E0000001
        errorId: sampleiCF-8D5rLW6myqiPItW
        errorCauses: []
    ErrorResourceNotFound:
      summary: Resource Not Found
      value:
        errorCode: E0000007
        errorSummary: 'Not found: {0}'
        errorLink: E0000007
        errorId: sampleMlLvGUj_YD5v16vkYWY
        errorCauses: []
  x-stackQL-resources:
    email_servers:
      id: okta.email_servers.email_servers
      name: email_servers
      title: Email Servers
      methods:
        list_email_servers:
          operation:
            $ref: '#/paths/~1api~1v1~1email-servers/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        create_email_server:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1api~1v1~1email-servers/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        get_email_server:
          operation:
            $ref: '#/paths/~1api~1v1~1email-servers~1{emailServerId}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update_email_server:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1api~1v1~1email-servers~1{emailServerId}/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete_email_server:
          operation:
            $ref: '#/paths/~1api~1v1~1email-servers~1{emailServerId}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
        test_email_server:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1api~1v1~1email-servers~1{emailServerId}~1test/post'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
      sqlVerbs:
        select:
          - $ref: >-
              #/components/x-stackQL-resources/email_servers/methods/get_email_server
          - $ref: >-
              #/components/x-stackQL-resources/email_servers/methods/list_email_servers
        insert:
          - $ref: >-
              #/components/x-stackQL-resources/email_servers/methods/create_email_server
        update:
          - $ref: >-
              #/components/x-stackQL-resources/email_servers/methods/update_email_server
        delete:
          - $ref: >-
              #/components/x-stackQL-resources/email_servers/methods/delete_email_server
        replace: []
servers:
  - url: https://{subdomain}.okta.com/
    variables:
      subdomain:
        default: my-org
x-stackQL-config:
  pagination:
    requestToken:
      key: ''
      location: request
    responseToken:
      key: Link
      location: header
  queryParamPushdown:
    top:
      paramName: limit
      maxValue: 200
