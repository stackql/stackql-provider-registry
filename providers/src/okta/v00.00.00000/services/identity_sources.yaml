          minItems: 1
          maxItems: 200
          items:
            type: string
            maxLength: 255
    BulkGroupUpsertRequestBody:
      type: object
      properties:
        profiles:
          type: array
          description: Array of group profiles that needs to be inserted or updated in Okta
          minItems: 1
          maxItems: 200
          items:
            type: object
            properties:
              externalId:
                type: string
                description: >-
                  The external ID of the group that needs to be created or
                  updated in Okta
                maxLength: 255
              profile:
                $ref: '#/components/schemas/IdentitySourceGroupProfileForUpsert'
    BulkUpsertRequestBody:
      type: object
      properties:
        entityType:
          description: >-
            The type of data to upsert into the session. Currently, only `USERS`
            is supported.
          type: string
          enum:
            - USERS
        profiles:
          type: array
          description: Array of user profiles to be uploaded
          items:
            type: object
            properties:
              externalId:
                type: string
                description: >-
                  The external ID of the entity that needs to be created or
                  updated in Okta
                maxLength: 512
              profile:
                $ref: '#/components/schemas/IdentitySourceUserProfileForUpsert'
