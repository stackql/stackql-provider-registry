        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsResponseSchema'
              examples:
                group:
                  $ref: '#/components/examples/GroupsResponse'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.identitySources.read
      tags:
        - IdentitySource
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs: []
      parameters:
        - $ref: '#/components/parameters/pathIdentitySourceId'
        - $ref: '#/components/parameters/pathIdentitySourceGroupOrExternalId'
    post:
      summary: Update an identity source group
      description: >-
        Updates a group to an identity source for the given identity source
        instance and group ID
      operationId: updateIdentitySourceGroups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupsRequestSchema'
            examples:
              createGroupsPayload:
                $ref: '#/components/examples/GroupsPayload'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsResponseSchema'
              examples:
                group:
                  $ref: '#/components/examples/GroupsResponse'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.identitySources.manage
      tags:
        - IdentitySource
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs: []
      parameters:
        - $ref: '#/components/parameters/pathIdentitySourceId'
        - $ref: '#/components/parameters/pathIdentitySourceGroupOrExternalId'
    delete:
      summary: Delete an identity source group
      description: >-
        Deletes a group in an identity source for a given identity source ID and
        group ID
      operationId: deleteIdentitySourceGroup
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.identitySources.manage
      tags:
        - IdentitySource
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs: []
      parameters:
        - $ref: '#/components/parameters/pathIdentitySourceId'
        - $ref: '#/components/parameters/pathIdentitySourceGroupOrExternalId'
  /api/v1/identity-sources/{identitySourceId}/groups/{groupOrExternalId}/membership:
    get:
      summary: Retrieve the memberships for the given identity source group
      description: >-
        Retrieves the group memberships for the given identity source group in
        the given identity source instance
      operationId: getIdentitySourceGroupMemberships
      parameters:
        - $ref: '#/components/parameters/queryAfter'
        - name: limit
          in: query
          description: >-
            Specifies the number of group membership results in a page. Okta
            recommends using a specific value other than the default or maximum.

            If your request times out, retry your request with a smaller `limit`
            and [page the
            results](https://developer.okta.com/docs/api/#pagination).
          schema:
            type: integer
            format: int32
            maximum: 1000
        - $ref: '#/components/parameters/pathIdentitySourceId'
        - $ref: '#/components/parameters/pathIdentitySourceGroupOrExternalId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembershipsResponseSchema'
              examples:
                groupMembershipsResponse:
                  $ref: '#/components/examples/GroupMemberships'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.identitySources.read
      tags:
        - IdentitySource
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs: []
    post:
      summary: Create the memberships for the given identity source group
      description: Creates the group memberships for the given identity source group
      operationId: createIdentitySourceGroupsMemberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequestSchema'
            examples:
              createGroupsPayload:
                $ref: '#/components/examples/MembershipPayload'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/ErrorApiValidationFailed400'
        '403':
          $ref: '#/components/responses/ErrorAccessDenied403'
        '404':
          $ref: '#/components/responses/ErrorResourceNotFound404'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests429'
      security:
        - apiToken: []
        - oauth2:
            - okta.identitySources.manage
      tags:
        - IdentitySource
      x-okta-lifecycle:
        lifecycle: GA
        isGenerallyAvailable: false
        SKUs: []
      parameters:
        - $ref: '#/components/parameters/pathIdentitySourceId'
        - $ref: '#/components/parameters/pathIdentitySourceGroupOrExternalId'
