        mapped to Okta standard properties. See the group [`profile`
        object](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Group/#tag/Group/operation/getGroup!c=200&path=profile&t=response)
        and Declaration of a Custom Identity Source Schema in [Using anything as
        a
        source](https://help.okta.com/okta_help.htm?type=oie&id=ext-anything-as-a-source).

        > **Note:** Profile attributes can only be of the string type.
      type: object
      properties:
        description:
          type: string
          description: Description of the group
          maxLength: 1024
          nullable: true
        displayName:
          type: string
          description: Name of the group
          minLength: 1
          maxLength: 255
    Error:
      title: Error
      type: object
      properties:
        errorCauses:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCause'
