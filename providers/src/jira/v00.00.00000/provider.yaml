id: jira
name: jira
version: v00.00.00000
providerServices:
  agile:
    id: agile:v00.00.00000
    name: agile
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/agile.yaml
    title: Jira Software (Agile)
    version: v00.00.00000
    description: Jira Software boards, sprints, epics, the backlog, board configuration and properties, issue ranking and estimation.
  atlassian_tenant:
    id: atlassian_tenant:v00.00.00000
    name: atlassian_tenant
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/atlassian_tenant.yaml
    title: Atlassian Tenant
    version: v00.00.00000
    description: 'Public, unauthenticated site metadata: the cloud ID of a Jira Cloud site, looked up by its subdomain.'
  dashboards:
    id: dashboards:v00.00.00000
    name: dashboards
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/dashboards.yaml
    title: Jira Dashboards
    version: v00.00.00000
    description: Dashboards, their gadgets and dashboard item properties.
  fields:
    id: fields:v00.00.00000
    name: fields
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/fields.yaml
    title: Jira Fields
    version: v00.00.00000
    description: System and custom fields, custom field contexts and options, field configurations and field configuration schemes, and field schemes.
  filters:
    id: filters:v00.00.00000
    name: filters
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/filters.yaml
    title: Jira Filters
    version: v00.00.00000
    description: Saved JQL filters, favourites, columns and share permissions.
  issue_attributes:
    id: issue_attributes:v00.00.00000
    name: issue_attributes
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/issue_attributes.yaml
    title: Jira Issue Attributes
    version: v00.00.00000
    description: Issue priorities, priority schemes and issue resolutions.
  issue_types:
    id: issue_types:v00.00.00000
    name: issue_types
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/issue_types.yaml
    title: Jira Issue Types
    version: v00.00.00000
    description: Issue types, issue type properties, issue type schemes and issue type screen schemes.
  issues:
    id: issues:v00.00.00000
    name: issues
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/issues.yaml
    title: Jira Issues
    version: v00.00.00000
    description: 'Issues and everything attached to them: JQL issue search, comments, worklogs, transitions, changelogs, links, remote links, watchers, votes, attachment metadata, properties, labels and bulk operations.'
  jql:
    id: jql:v00.00.00000
    name: jql
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/jql.yaml
    title: Jira JQL
    version: v00.00.00000
    description: 'JQL tooling: autocomplete data and suggestions, parsing, sanitising, personal data migration and the invalid JQL access log.'
  notifications:
    id: notifications:v00.00.00000
    name: notifications
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/notifications.yaml
    title: Jira Notification Schemes
    version: v00.00.00000
    description: Notification schemes, their notifications and project assignments.
  permissions:
    id: permissions:v00.00.00000
    name: permissions
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/permissions.yaml
    title: Jira Permissions
    version: v00.00.00000
    description: Permission schemes and grants, permission checks, project permission scheme assignments, issue security schemes and security levels.
  plans:
    id: plans:v00.00.00000
    name: plans
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/plans.yaml
    title: Jira Plans
    version: v00.00.00000
    description: Plans (Jira Premium) and the teams in a plan.
  projects:
    id: projects:v00.00.00000
    name: projects
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/projects.yaml
    title: Jira Projects
    version: v00.00.00000
    description: 'Projects and their configuration: components, versions, roles and role actors, categories, properties, features, templates, types and project policies.'
  screens:
    id: screens:v00.00.00000
    name: screens
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/screens.yaml
    title: Jira Screens
    version: v00.00.00000
    description: Screens, screen tabs and tab fields, and screen schemes.
  system:
    id: system:v00.00.00000
    name: system
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/system.yaml
    title: Jira System
    version: v00.00.00000
    description: 'Site-wide configuration and information: server info, application properties and global settings, application roles, license metrics, the announcement banner, audit records, time tracking, avatars, long-running tasks, issue navigator columns, classification levels, Jira expressions, app data policies, issue panel pins and agent invocation.'
  users:
    id: users:v00.00.00000
    name: users
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/users.yaml
    title: Jira Users and Groups
    version: v00.00.00000
    description: Users (by accountId), user search, user properties, the calling identity (myself) and groups with their members.
  workflows:
    id: workflows:v00.00.00000
    name: workflows
    preferred: true
    service:
      $ref: jira/v00.00.00000/services/workflows.yaml
    title: Jira Workflows
    version: v00.00.00000
    description: Workflows, workflow schemes and their drafts and project associations, statuses and status categories.
config:
  auth:
    type: oauth2
    grant_type: client_credentials
    client_id_env_var: ATLASSIAN_CLIENT_ID
    client_secret_env_var: ATLASSIAN_CLIENT_SECRET
    token_url: https://auth.atlassian.com/oauth/token
  snake_case_aliases: true
