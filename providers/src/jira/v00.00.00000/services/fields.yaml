  /rest/api/3/field/search:
    get:
      deprecated: false
      description: |-
        Returns a [paginated](#pagination) list of fields for Classic Jira projects. The list can include:

         *  all fields
         *  specific fields, by defining `id`
         *  fields that contain a string in the field name or description, by defining `query`
         *  specific fields that contain a string in the field name or description, by defining `id` and `query`

        Use `type` must be set to `custom` to show custom fields only.

        **[Permissions](#permissions) required:** Permission to access Jira.
      operationId: getFieldsPaginated
      parameters:
        - description: The index of the first item to return in a page of results (page offset).
          in: query
          name: startAt
          schema:
            default: 0
            format: int64
            type: integer
        - description: The maximum number of items to return per page.
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
        - description: The type of fields to search.
          in: query
          name: type
          schema:
            items:
              default: ''
              enum:
                - custom
                - system
              type: string
            type: array
        - description: The IDs of the custom fields to return or, where `query` is specified, filter.
          in: query
          name: id
          schema:
            items:
              default: ''
              type: string
            type: array
            uniqueItems: true
        - description: String used to perform a case-insensitive partial match with field names or descriptions.
          in: query
          name: query
          schema:
            type: string
        - description: |-
            [Order](#ordering) the results by:

             *  `contextsCount` sorts by the number of contexts related to a field
             *  `lastUsed` sorts by the date when the value of the field last changed
             *  `name` sorts by the field name
             *  `screensCount` sorts by the number of screens related to a field
          in: query
          name: orderBy
          schema:
            enum:
              - contextsCount
              - '-contextsCount'
              - +contextsCount
              - lastUsed
              - '-lastUsed'
              - +lastUsed
              - name
              - '-name'
              - +name
              - screensCount
              - '-screensCount'
              - +screensCount
              - projectsCount
              - '-projectsCount'
              - +projectsCount
            type: string
        - description: |-
            Use [expand](#expansion) to include additional information in the response. This parameter accepts a comma-separated list. Expand options include:

             *  `key` returns the key for each field
             *  `stableId` returns the stableId for each field
             *  `lastUsed` returns the date when the value of the field last changed
