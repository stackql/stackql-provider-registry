openapi: 3.0.1
info:
  title: Jira Users and Groups
  description: Users (by accountId), user search, user properties, the calling identity (myself) and groups with their members.
  version: 1001.0.0-SNAPSHOT-c708f3bbbb25201455fbb24169cbdc71ef7764bf
  x-stackQL-sourceSpec: platform
paths:
  /rest/api/3/group:
    delete:
      deprecated: false
      description: |-
        Deletes a group.

        **[Permissions](#permissions) required:** Site administration (that is, member of the *site-admin* strategic [group](https://confluence.atlassian.com/x/24xjL)).
      operationId: removeGroup
      parameters:
        - in: query
          name: groupname
          schema:
            type: string
        - description: The ID of the group. This parameter cannot be used with the `groupname` parameter.
          in: query
          name: groupId
          schema:
            type: string
          x-showInExample: 'true'
        - description: |-
            As a group's name can change, use of `swapGroupId` is recommended to identify a group.  
            The group to transfer restrictions to. Only comments and worklogs are transferred. If restrictions are not transferred, comments and worklogs are inaccessible after the deletion. This parameter cannot be used with the `swapGroupId` parameter.
          in: query
          name: swapGroup
          schema:
            type: string
        - description: The ID of the group to transfer restrictions to. Only comments and worklogs are transferred. If restrictions are not transferred, comments and worklogs are inaccessible after the deletion. This parameter cannot be used with the `swapGroup` parameter.
          in: query
          name: swapGroupId
          schema:
            type: string
      responses:
        '200':
          description: Returned if the request is successful.
        '400':
          description: Returned if the group name is not specified.
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
        '403':
          description: Returned if the user does not have the necessary permission.
        '404':
          description: Returned if the group is not found.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Remove group
      tags:
        - Groups
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - delete:group:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
    get:
      deprecated: true
      description: |-
        This operation is deprecated, use [`group/member`](#api-rest-api-3-group-member-get).

        Returns all users in a group.

        **[Permissions](#permissions) required:** either of:

         *  *Browse users and groups* [global permission](https://confluence.atlassian.com/x/x4dKLg).
         *  *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: getGroup
      parameters:
        - description: |-
            As a group's name can change, use of `groupId` is recommended to identify a group.  
            The name of the group. This parameter cannot be used with the `groupId` parameter.
          in: query
          name: groupname
          schema:
            type: string
        - description: The ID of the group. This parameter cannot be used with the `groupName` parameter.
          in: query
          name: groupId
          schema:
            type: string
          x-showInExample: 'true'
        - description: List of fields to expand.
          in: query
          name: expand
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: Returned if the request is successful.
        '400':
          description: Returned if the group name is not specified.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the calling user does not have the Administer Jira global permission.
        '404':
          description: Returned if the group is not found.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-user
      summary: Get group
      tags:
        - Groups
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-user
          state: Current
        - scheme: OAuth2
          scopes:
            - read:group:jira
            - read:user:jira
            - read:avatar:jira
          state: Beta
      x-atlassian-connect-scope: ADMIN
    post:
      deprecated: false
      description: |-
        Creates a group.

        **[Permissions](#permissions) required:** Site administration (that is, member of the *site-admin* [group](https://confluence.atlassian.com/x/24xjL)).
      operationId: createGroup
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              name: power-users
            schema:
              $ref: '#/components/schemas/AddGroupBean'
        description: The name of the group.
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"expand":"users","groupId":"276f955c-63d7-42c8-9520-92d01dca0625","name":"power-users","self":"https://your-domain.atlassian.net/rest/api/3/group?groupId=276f955c-63d7-42c8-9520-92d01dca0625","users":{"end-index":0,"items":[{"accountId":"5b10a2844c20165700ede21g","active":false,"displayName":"Mia Krystof","self":"https://your-domain.atlassian.net/rest/api/3/user?accountId=5b10a2844c20165700ede21g"}],"max-results":50,"size":1,"start-index":0}}'
              schema:
                $ref: '#/components/schemas/Group'
          description: Returned if the request is successful.
        '400':
          description: Returned if group name is not specified or the group name is in use.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have the necessary permission.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Create group
      tags:
        - Groups
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - read:group:jira
            - read:user:jira
            - write:group:jira
            - read:avatar:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/group/bulk:
    get:
      deprecated: false
      description: |-
        Returns a [paginated](#pagination) list of groups.

        **[Permissions](#permissions) required:** *Browse users and groups* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: bulkGetGroups
      parameters:
        - description: The index of the first item to return in a page of results (page offset).
          in: query
          name: startAt
          schema:
            default: 0
            format: int64
            type: integer
        - description: The maximum number of items to return per page.
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
        - description: The ID of a group. To specify multiple IDs, pass multiple `groupId` parameters. For example, `groupId=5b10a2844c20165700ede21g&groupId=5b10ac8d82e05b22cc7d4ef5`.
          in: query
          name: groupId
          schema:
            example: 3571b9a7-348f-414a-9087-8e1ea03a7df8
            items:
              default: ''
              example: 3571b9a7-348f-414a-9087-8e1ea03a7df8
              type: string
            type: array
            uniqueItems: true
          x-showInExample: 'true'
        - description: The name of a group. To specify multiple names, pass multiple `groupName` parameters. For example, `groupName=administrators&groupName=jira-software-users`.
          in: query
          name: groupName
          schema:
            items:
              default: ''
              type: string
            type: array
            uniqueItems: true
        - description: 'The access level of a group. Valid values: ''site-admin'', ''admin'', ''user''.'
          in: query
          name: accessType
          schema:
            type: string
        - description: 'The application key of the product user groups to search for. Valid values: ''jira-servicedesk'', ''jira-software'', ''jira-product-discovery'', ''jira-core''.'
          in: query
          name: applicationKey
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":10,"startAt":0,"total":2,"values":[{"groupId":"276f955c-63d7-42c8-9520-92d01dca0625","name":"jdog-developers"},{"groupId":"6e87dc72-4f1f-421f-9382-2fee8b652487","name":"juvenal-bot"}]}'
              schema:
                $ref: '#/components/schemas/PageBeanGroupDetails'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["Browse users and groups permission is required to view groups."],"errors":{}}'
          description: Returned if the user does not have the necessary permission.
        '500':
          content:
            application/json:
              example: '{"errorMessages":["Couldn''t retrieve groups with the site-admin accessType."],"errors":{}}'
          description: Returned if the group with the given access level can't be retrieved.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-user
      summary: Bulk get groups
      tags:
        - Groups
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-user
          state: Current
        - scheme: OAuth2
          scopes:
            - read:group:jira
          state: Beta
      x-experimental: true
      x-atlassian-connect-scope: ADMIN
  /rest/api/3/group/member:
    get:
      deprecated: false
      description: |-
        Returns a [paginated](#pagination) list of all users in a group.

        Note that users are ordered by username, however the username is not returned in the results due to privacy reasons.

        **[Permissions](#permissions) required:** either of:

         *  *Browse users and groups* [global permission](https://confluence.atlassian.com/x/x4dKLg).
         *  *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: getUsersFromGroup
      parameters:
        - description: |-
            As a group's name can change, use of `groupId` is recommended to identify a group.  
            The name of the group. This parameter cannot be used with the `groupId` parameter.
          in: query
          name: groupname
          schema:
            type: string
        - description: The ID of the group. This parameter cannot be used with the `groupName` parameter.
          in: query
          name: groupId
          schema:
            type: string
          x-showInExample: 'true'
        - description: Include inactive users.
          in: query
          name: includeInactiveUsers
          schema:
            default: false
            type: boolean
        - description: The index of the first item to return in a page of results (page offset).
          in: query
          name: startAt
          schema:
            default: 0
            format: int64
            type: integer
        - description: The maximum number of items to return per page (number should be between 1 and 50).
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":false,"maxResults":2,"nextPage":"https://your-domain.atlassian.net/rest/api/3/group/member?groupId=276f955c-63d7-42c8-9520-92d01dca0625&includeInactiveUsers=false&startAt=4&maxResults=2","self":"https://your-domain.atlassian.net/rest/api/3/group/member?groupId=276f955c-63d7-42c8-9520-92d01dca0625&includeInactiveUsers=false&startAt=2&maxResults=2","startAt":3,"total":5,"values":[{"accountId":"5b10a2844c20165700ede21g","accountType":"atlassian","active":true,"avatarUrls":{},"displayName":"Mia","emailAddress":"mia@example.com","key":"","name":"","self":"https://your-domain.atlassian.net/rest/api/3/user?accountId=5b10a2844c20165700ede21g","timeZone":"Australia/Sydney"},{"accountId":"5b10a0effa615349cb016cd8","accountType":"atlassian","active":false,"avatarUrls":{},"displayName":"Will","emailAddress":"will@example.com","key":"","name":"","self":"https://your-domain.atlassian.net/rest/api/3/user?accountId=5b10a0effa615349cb016cd8","timeZone":"Australia/Sydney"}]}'
              schema:
                $ref: '#/components/schemas/PageBeanUserDetails'
          description: Returned if the request is successful.
        '400':
          description: Returned if the group name is not specified.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the calling user does not have the Administer Jira global permission.
        '404':
          description: Returned if the group is not found.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Get users from group
      tags:
        - Groups
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - read:group:jira
            - read:user:jira
            - read:avatar:jira
          state: Beta
      x-atlassian-connect-scope: ADMIN
  /rest/api/3/group/user:
    delete:
      deprecated: false
      description: |-
        Removes a user from a group.

        **[Permissions](#permissions) required:** Site administration (that is, member of the *site-admin* [group](https://confluence.atlassian.com/x/24xjL)).
      operationId: removeUserFromGroup
      parameters:
        - description: |-
            As a group's name can change, use of `groupId` is recommended to identify a group.  
            The name of the group. This parameter cannot be used with the `groupId` parameter.
          in: query
          name: groupname
          schema:
            type: string
        - description: The ID of the group. This parameter cannot be used with the `groupName` parameter.
          in: query
          name: groupId
          schema:
            type: string
          x-showInExample: 'true'
        - description: This parameter is no longer available. See the [deprecation notice](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.
          in: query
          name: username
          schema:
            type: string
        - description: The account ID of the user, which uniquely identifies the user across all Atlassian products. For example, *5b10ac8d82e05b22cc7d4ef5*.
          in: query
          name: accountId
          required: true
          schema:
            example: 5b10ac8d82e05b22cc7d4ef5
            maxLength: 128
            type: string
          x-showInExample: 'true'
      responses:
        '200':
          description: Returned if the request is successful.
        '400':
          description: |-
            Returned if:

             *  `groupName` is missing.
             *  `accountId` is missing.
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
        '403':
          description: Returned if the user does not have the necessary permission.
        '404':
          description: Returned if the group or user are not found.
        '429':
          description: Returned if rate limiting is being enforced.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Remove user from group
      tags:
        - Groups
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - write:group:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
    post:
      deprecated: false
      description: |-
        Adds a user to a group.

        **[Permissions](#permissions) required:** Site administration (that is, member of the *site-admin* [group](https://confluence.atlassian.com/x/24xjL)).
      operationId: addUserToGroup
      parameters:
        - description: |-
            As a group's name can change, use of `groupId` is recommended to identify a group.  
            The name of the group. This parameter cannot be used with the `groupId` parameter.
          in: query
          name: groupname
          schema:
            type: string
        - description: The ID of the group. This parameter cannot be used with the `groupName` parameter.
          in: query
          name: groupId
          schema:
            type: string
          x-showInExample: 'true'
      requestBody:
        content:
          application/json:
            example:
              accountId: 5b10ac8d82e05b22cc7d4ef5
            schema:
              $ref: '#/components/schemas/UpdateUserToGroupBean'
        description: The user to add to the group.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: Returned if the request is successful.
        '400':
          description: |-
            Returned if:

             *  `groupname` is not provided.
             *  `accountId` is missing.
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
        '403':
          description: Returned if the calling user does not have the necessary permission.
        '404':
          description: Returned if the group or user are not found.
        '429':
          description: Returned if rate limiting is being enforced.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Add user to group
      tags:
        - Groups
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - write:group:jira
            - read:avatar:jira
            - read:group:jira
            - read:user:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/groups/picker:
    get:
      deprecated: false
      description: |-
        Returns a list of groups whose names contain a query string. A list of group names can be provided to exclude groups from the results.

        The primary use case for this resource is to populate a group picker suggestions list. To this end, the returned object includes the `html` field where the matched query term is highlighted in the group name with the HTML strong tag. Also, the groups list is wrapped in a response object that contains a header for use in the picker, specifically *Showing X of Y matching groups*.

        The list returns with the groups sorted. If no groups match the list criteria, an empty list is returned.

        This operation can be accessed anonymously.

        **[Permissions](#permissions) required:** *Browse projects* [project permission](https://confluence.atlassian.com/x/yodKLg). Anonymous calls and calls by users without the required permission return an empty list.

        *Browse users and groups* [global permission](https://confluence.atlassian.com/x/x4dKLg). Without this permission, calls where query is not an exact match to an existing group will return an empty list.
      operationId: findGroups
      parameters:
        - description: This parameter is deprecated, setting it does not affect the results. To find groups containing a particular user, use [Get user groups](#api-rest-api-3-user-groups-get).
          in: query
          name: accountId
          schema:
            type: string
        - description: The string to find in group names.
          in: query
          name: query
          schema:
            example: query
            type: string
        - description: |-
            As a group's name can change, use of `excludeGroupIds` is recommended to identify a group.  
            A group to exclude from the result. To exclude multiple groups, provide an ampersand-separated list. For example, `exclude=group1&exclude=group2`. This parameter cannot be used with the `excludeGroupIds` parameter.
          in: query
          name: exclude
          schema:
            items:
              type: string
            type: array
        - description: A group ID to exclude from the result. To exclude multiple groups, provide an ampersand-separated list. For example, `excludeId=group1-id&excludeId=group2-id`. This parameter cannot be used with the `excludeGroups` parameter.
          in: query
          name: excludeId
          schema:
            items:
              type: string
            type: array
        - description: The maximum number of groups to return. The maximum number of groups that can be returned is limited by the system property `jira.ajax.autocomplete.limit`.
          in: query
          name: maxResults
          schema:
            format: int32
            type: integer
        - description: Whether the search for groups should be case insensitive.
          in: query
          name: caseInsensitive
          schema:
            default: false
            type: boolean
        - description: This parameter is no longer available. See the [deprecation notice](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.
          in: query
          name: userName
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"groups":[{"groupId":"276f955c-63d7-42c8-9520-92d01dca0625","html":"<b>j</b>dog-developers","name":"jdog-developers"},{"groupId":"6e87dc72-4f1f-421f-9382-2fee8b652487","html":"<b>j</b>uvenal-bot","name":"juvenal-bot"}],"header":"Showing 20 of 25 matching groups","total":25}'
              schema:
                $ref: '#/components/schemas/FoundGroups'
          description: Returned if the request is successful.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-user
        - {}
      summary: Find groups
      tags:
        - Groups
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-user
          state: Current
        - scheme: OAuth2
          scopes:
            - read:group:jira
          state: Beta
      x-atlassian-connect-scope: READ
  /rest/api/3/groupuserpicker:
    get:
      deprecated: false
      description: |-
        Returns a list of users and groups matching a string. The string is used:

         *  for users, to find a case-insensitive match with display name and e-mail address. Note that if a user has hidden their email address in their user profile, partial matches of the email address will not find the user. An exact match is required.
         *  for groups, to find a case-sensitive match with group name.

        For example, if the string *tin* is used, records with the display name *Tina*, email address *sarah@tinplatetraining.com*, and the group *accounting* would be returned.

        Optionally, the search can be refined to:

         *  the projects and issue types associated with a custom field, such as a user picker. The search can then be further refined to return only users and groups that have permission to view specific:
            
             *  projects.
             *  issue types.
            
            If multiple projects or issue types are specified, they must be a subset of those enabled for the custom field or no results are returned. For example, if a field is enabled for projects A, B, and C then the search could be limited to projects B and C. However, if the search is limited to projects B and D, nothing is returned.
         *  not return Connect app users and groups.
         *  return groups that have a case-insensitive match with the query.

        The primary use case for this resource is to populate a picker field suggestion list with users or groups. To this end, the returned object includes an `html` field for each list. This field highlights the matched query term in the item name with the HTML strong tag. Also, each list is wrapped in a response object that contains a header for use in a picker, specifically *Showing X of Y matching groups*.

        This operation can be accessed anonymously.

        **[Permissions](#permissions) required:** *Browse users and groups* [global permission](https://confluence.atlassian.com/x/yodKLg).
      operationId: findUsersAndGroups
      parameters:
        - description: The search string.
          in: query
          name: query
          required: true
          schema:
            type: string
        - description: The maximum number of items to return in each list.
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
        - description: Whether the user avatar should be returned. If an invalid value is provided, the default value is used.
          in: query
          name: showAvatar
          schema:
            default: false
            type: boolean
        - description: The custom field ID of the field this request is for.
          in: query
          name: fieldId
          schema:
            type: string
        - description: The ID of a project that returned users and groups must have permission to view. To include multiple projects, provide an ampersand-separated list. For example, `projectId=10000&projectId=10001`. This parameter is only used when `fieldId` is present.
          in: query
          name: projectId
          schema:
            items:
              type: string
            type: array
        - description: The ID of an issue type that returned users and groups must have permission to view. To include multiple issue types, provide an ampersand-separated list. For example, `issueTypeId=10000&issueTypeId=10001`. Special values, such as `-1` (all standard issue types) and `-2` (all subtask issue types), are supported. This parameter is only used when `fieldId` is present.
          in: query
          name: issueTypeId
          schema:
            items:
              type: string
            type: array
        - description: The size of the avatar to return. If an invalid value is provided, the default value is used.
          in: query
          name: avatarSize
          schema:
            default: xsmall
            enum:
              - xsmall
              - xsmall@2x
              - xsmall@3x
              - small
              - small@2x
              - small@3x
              - medium
              - medium@2x
              - medium@3x
              - large
              - large@2x
              - large@3x
              - xlarge
              - xlarge@2x
              - xlarge@3x
              - xxlarge
              - xxlarge@2x
              - xxlarge@3x
              - xxxlarge
              - xxxlarge@2x
              - xxxlarge@3x
            type: string
        - description: Whether the search for groups should be case insensitive.
          in: query
          name: caseInsensitive
          schema:
            default: false
            type: boolean
        - description: Whether Connect app users and groups should be excluded from the search results. If an invalid value is provided, the default value is used.
          in: query
          name: excludeConnectAddons
          schema:
            default: false
            type: boolean
