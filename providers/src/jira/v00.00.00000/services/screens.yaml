openapi: 3.0.1
info:
  title: Jira Screens
  description: Screens, screen tabs and tab fields, and screen schemes.
  version: 1001.0.0-SNAPSHOT-a7b4351c3da87b54b4403678bdb0ff81c88ca648
  x-stackQL-sourceSpec: platform
paths:
  /rest/api/3/field/{fieldId}/screens:
    get:
      deprecated: false
      description: |-
        Returns a [paginated](#pagination) list of the screens a field is used in.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: getScreensForField
      parameters:
        - description: The ID of the field to return screens for.
          in: path
          name: fieldId
          required: true
          schema:
            type: string
        - description: The index of the first item to return in a page of results (page offset).
          in: query
          name: startAt
          schema:
            default: 0
            format: int64
            type: integer
        - description: The maximum number of items to return per page.
          in: query
          name: maxResults
          schema:
            default: 100
            format: int32
            type: integer
        - description: Use [expand](#expansion) to include additional information about screens in the response. This parameter accepts `tab` which returns details about the screen tabs the field is used in.
          in: query
          name: expand
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":false,"maxResults":1,"startAt":0,"total":5,"values":[{"id":10001,"name":"Default Screen","description":"Provides for the update of all system fields.","tab":{"id":10000,"name":"Fields Tab"}}]}'
              schema:
                $ref: '#/components/schemas/PageBeanScreenWithTab'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have the necessary permission.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-project
        - {}
      summary: Get screens for a field
      tags:
        - Screens
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-project
          state: Current
        - scheme: OAuth2
          scopes:
            - read:screen:jira
            - read:avatar:jira
            - read:project-category:jira
            - read:project:jira
            - read:screen-tab:jira
          state: Beta
      x-atlassian-connect-scope: NONE
  /rest/api/3/screens:
    get:
      deprecated: false
      description: |-
        Returns a [paginated](#pagination) list of all screens or those specified by one or more screen IDs.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: getScreens
      parameters:
        - description: The index of the first item to return in a page of results (page offset).
          in: query
          name: startAt
          schema:
            default: 0
            format: int64
            type: integer
        - description: The maximum number of items to return per page.
          in: query
          name: maxResults
          schema:
            default: 100
            format: int32
            type: integer
        - description: The list of screen IDs. To include multiple IDs, provide an ampersand-separated list. For example, `id=10000&id=10001`.
          in: query
          name: id
          schema:
            items:
              format: int64
              type: integer
            type: array
            uniqueItems: true
        - description: String used to perform a case-insensitive partial match with screen name.
          in: query
          name: queryString
          schema:
            default: ''
            type: string
        - description: The scope filter string. To filter by multiple scope, provide an ampersand-separated list. For example, `scope=GLOBAL&scope=PROJECT`.
          in: query
          name: scope
          schema:
            items:
              default: ''
              enum:
                - GLOBAL
                - TEMPLATE
                - PROJECT
              type: string
            type: array
            uniqueItems: true
        - description: |-
            [Order](#ordering) the results by a field:

             *  `id` Sorts by screen ID.
             *  `name` Sorts by screen name.
          in: query
          name: orderBy
          schema:
            enum:
              - name
              - '-name'
              - +name
              - id
              - '-id'
              - +id
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":100,"self":"https://your-domain.atlassian.net/rest/api/3/screens","startAt":0,"total":3,"values":[{"id":1,"name":"Default Screen","description":"Provides for the update all system fields."},{"id":2,"name":"Workflow Screen","description":"This screen is used in the workflow and enables you to assign issues."},{"id":3,"name":"Resolve Issue Screen","description":"Offers the ability to set resolution, change fix versions, and assign an issue."}]}'
              schema:
                $ref: '#/components/schemas/PageBeanScreen'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have the necessary permission.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-project
      summary: Get screens
      tags:
        - Screens
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-project
          state: Current
        - scheme: OAuth2
          scopes:
            - read:project:jira
            - read:screen:jira
            - read:avatar:jira
            - read:project-category:jira
          state: Beta
      x-atlassian-connect-scope: ADMIN
    post:
      deprecated: false
      description: |-
        Creates a screen with a default field tab.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: createScreen
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              description: Enables changes to resolution and linked issues.
              name: Resolve Security Issue Screen
            schema:
              $ref: '#/components/schemas/ScreenDetails'
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"id":10005,"name":"Resolve Security Issue Screen","description":"Enables changes to resolution and linked issues."}'
              schema:
                $ref: '#/components/schemas/Screen'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The name is used by another screen."],"errors":{}}'
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["Only Jira administrators can manage screens."],"errors":{}}'
          description: Returned if the user does not have the required permissions.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-project
      summary: Create screen
      tags:
        - Screens
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-project
          state: Current
        - scheme: OAuth2
          scopes:
            - read:project:jira
            - read:screen:jira
            - write:screen:jira
            - read:avatar:jira
            - read:project-category:jira
          state: Beta
      x-experimental: true
      x-atlassian-connect-scope: ADMIN
