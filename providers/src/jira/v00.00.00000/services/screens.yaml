          state: Beta
      x-atlassian-connect-scope: ADMIN
  /rest/api/3/screens/tabs:
    get:
      deprecated: false
      description: |-
        Returns the list of tabs for a bulk of screens.

        **[Permissions](#permissions) required:**

         *  *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: getBulkScreenTabs
      parameters:
        - description: The list of screen IDs. To include multiple screen IDs, provide an ampersand-separated list. For example, `screenId=10000&screenId=10001`.
          in: query
          name: screenId
          schema:
            items:
              format: int64
              type: integer
            type: array
            uniqueItems: true
        - description: The list of tab IDs. To include multiple tab IDs, provide an ampersand-separated list. For example, `tabId=10000&tabId=10001`.
          in: query
          name: tabId
          schema:
            items:
              format: int64
              type: integer
            type: array
            uniqueItems: true
        - description: The index of the first item to return in a page of results (page offset).
          in: query
          name: startAt
          schema:
            default: 0
            format: int64
            type: integer
        - description: The maximum number of items to return per page. The maximum number is 100,
          in: query
          name: maxResult
          schema:
            default: 100
            format: int32
            type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":100,"startAt":0,"total":2,"values":[{"screenId":10000,"tabId":10001,"tabName":"My Custom Tab 1"},{"screenId":10001,"tabId":10002,"tabName":"My Custom Tab 2"}]}'
              schema:
                type: object
                properties:
                  isLast:
                    type: boolean
                  maxResults:
                    type: integer
                    format: int64
                  startAt:
                    type: integer
                    format: int64
                  total:
                    type: integer
                    format: int64
                  values:
                    type: array
                    items:
                      type: object
                      properties:
                        screenId:
                          type: integer
                          format: int64
                        tabId:
                          type: integer
                          format: int64
                        tabName:
                          type: string
                description: Synthesized from the vendor example (fix class response_schema_from_example).
          description: Returned if the request is successful.
        '400':
          description: Returned if the screen ID or the tab ID is empty.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have the necessary permission.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-project
      summary: Get bulk screen tabs
      tags:
        - Screen tabs
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-project
          state: Current
        - scheme: OAuth2
          scopes:
            - read:screen-tab:jira
          state: Beta
      x-experimental: true
      x-atlassian-connect-scope: ADMIN
