                    writeOnly: true
                  type: array
                  writeOnly: true
              required:
                - ids
              type: object
              writeOnly: true
            remove:
              description: Projects to remove from a scheme
              additionalProperties: false
              properties:
                ids:
                  description: Affected entity ids.
                  items:
                    format: int64
                    type: integer
                    writeOnly: true
