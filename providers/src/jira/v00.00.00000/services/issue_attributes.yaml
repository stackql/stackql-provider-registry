openapi: 3.0.1
info:
  title: Jira Issue Attributes
  description: Issue priorities, priority schemes and issue resolutions.
  version: 1001.0.0-SNAPSHOT-a7b4351c3da87b54b4403678bdb0ff81c88ca648
  x-stackQL-sourceSpec: platform
paths:
  /rest/api/3/priority:
    get:
      deprecated: true
      description: |-
        Returns the list of all issue priorities.

        **Deprecated:** Use [Search priorities](#api-rest-api-3-priority-search-get) instead. **[Permissions](#permissions) required:** Permission to access Jira.
      operationId: getPriorities
      parameters: []
      responses:
        '200':
          content:
            application/json:
              example: '[{"description":"Major loss of function.","iconUrl":"https://your-domain.atlassian.net/images/icons/priorities/major.png","id":"1","name":"Major","self":"https://your-domain.atlassian.net/rest/api/3/priority/3","statusColor":"#009900"},{"description":"Very little impact.","iconUrl":"https://your-domain.atlassian.net/images/icons/priorities/trivial.png","id":"2","name":"Trivial","self":"https://your-domain.atlassian.net/rest/api/3/priority/5","statusColor":"#cfcfcf"}]'
              schema:
                $ref: '#/components/schemas/GetPrioritiesResponse'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get priorities
      tags:
        - Issue priorities
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:priority:jira
          state: Beta
      x-changes:
        - announced: '2022-10-11'
          details: https://developer.atlassian.com/cloud/jira/platform/changelog/#CHANGE-762
          effective: '2023-04-11'
          type: removed
      x-atlassian-connect-scope: READ
      x-stackql-bare-array-wrap:
        wrapperKey: priorities
        wrapperName: GetPrioritiesResponse
        mediaType: application/json
        scalar: false
    post:
      deprecated: false
      description: |-
        Creates an issue priority.

        **Deprecation notice:** The `iconUrl` parameter was sunset on 16th Mar 2025, and replaced with `avatarId`. See [CHANGE-1525](https://developer.atlassian.com/changelog/#CHANGE-1525).

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: createPriority
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              description: My priority description
              iconUrl: /images/icons/priorities/major.png
              name: My new priority
              statusColor: '#ABCDEF'
            schema:
              $ref: '#/components/schemas/CreatePriorityDetails'
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"id":"10001"}'
              schema:
                $ref: '#/components/schemas/PriorityId'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The length of the description must not exceed 255 characters."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request isn't valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["Only Jira administrators can access issue type screen schemes."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user doesn't have the necessary permission.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededResponseBean'
          description: Returned if the priority can't be added to the default priority scheme because that scheme has reached the maximum number of priorities.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Create priority
      tags:
        - Issue priorities
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/priority/default:
    put:
      deprecated: false
      description: |-
        Sets default issue priority.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: setDefaultPriority
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              id: '3'
            schema:
              $ref: '#/components/schemas/SetDefaultPriorityRequest'
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The id has to be provided."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request isn't valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["You are not authorized to perform this action. Administrator privileges are required."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user doesn't have the necessary permission.
        '404':
          content:
            application/json:
              example: '{"errorMessages":["Priority with ID 10000 not found."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the issue priority isn't found.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Set default priority
      tags:
        - Issue priorities
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/priority/move:
    put:
      deprecated: false
      description: |-
        Changes the order of issue priorities.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: movePriorities
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              after: '10003'
              ids:
                - '10004'
                - '10005'
            schema:
              $ref: '#/components/schemas/ReorderIssuePriorities'
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The ids must contain no more than 1,000 items."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request isn't valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["You are not authorized to perform this action. Administrator privileges are required."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user doesn't have the necessary permission.
        '404':
          content:
            application/json:
              example: '{"errorMessages":["Priority with ID 10000 not found."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the issue priority isn't found.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Move priorities
      tags:
        - Issue priorities
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/priority/search:
    get:
      deprecated: false
      description: |-
        Returns a [paginated](#pagination) list of priorities. The list can contain all priorities or a subset determined by any combination of these criteria:

         *  a list of priority IDs. Any invalid priority IDs are ignored.
         *  a list of project IDs. Only priorities that are available in these projects will be returned. Any invalid project IDs are ignored.
         *  whether the field configuration is a default. This returns priorities from company-managed (classic) projects only, as there is no concept of default priorities in team-managed projects.

        **Deprecation notice:** The `onlyDefault` parameter is deprecated and will be removed at a later date. See [CHANGE-1655](https://developer.atlassian.com/cloud/jira/platform/changelog/#CHANGE-1655).

        **Deprecation notice:** The `isDefault` property of priorities is deprecated and will be removed at a later date. See [CHANGE-1655](https://developer.atlassian.com/cloud/jira/platform/changelog/#CHANGE-1655).

        **[Permissions](#permissions) required:** Permission to access Jira.
      operationId: searchPriorities
      parameters:
        - description: The index of the first item to return in a page of results (page offset).
          in: query
          name: startAt
          schema:
            default: '0'
            type: string
        - description: The maximum number of items to return per page.
          in: query
          name: maxResults
          schema:
            default: '50'
            type: string
        - description: The list of priority IDs. To include multiple IDs, provide an ampersand-separated list. For example, `id=2&id=3`.
          in: query
          name: id
          schema:
            items:
              default: ''
              type: string
            type: array
        - description: The list of projects IDs. To include multiple IDs, provide an ampersand-separated list. For example, `projectId=10010&projectId=10111`.
          in: query
          name: projectId
          schema:
            items:
              default: ''
              type: string
            type: array
        - description: The name of priority to search for.
          in: query
          name: priorityName
          schema:
            default: ''
            type: string
        - description: Whether only the default priority is returned.
          in: query
          name: onlyDefault
          schema:
            default: false
            type: boolean
          x-changes:
            - announced: '2024-05-22'
              details: https://developer.atlassian.com/cloud/jira/platform/changelog/#CHANGE-1655
              effective: '2024-11-22'
              type: removed
        - description: Use `schemes` to return the associated priority schemes for each priority. Limited to returning first 15 priority schemes per priority.
          in: query
          name: expand
          schema:
            default: ''
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":50,"startAt":0,"total":2,"values":[{"description":"Major loss of function.","iconUrl":"https://your-domain.atlassian.net/images/icons/priorities/major.png","id":"1","isDefault":true,"name":"Major","self":"https://your-domain.atlassian.net/rest/api/3/priority/3","statusColor":"#009900"},{"description":"Very little impact.","iconUrl":"https://your-domain.atlassian.net/images/icons/priorities/trivial.png","id":"2","isDefault":false,"name":"Trivial","self":"https://your-domain.atlassian.net/rest/api/3/priority/5","statusColor":"#cfcfcf"}]}'
              schema:
                $ref: '#/components/schemas/PageBeanPriority'
          description: Returned if the request is successful.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Search priorities
      tags:
        - Issue priorities
      x-atlassian-connect-scope: READ
  /rest/api/3/priority/{id}:
    delete:
      deprecated: false
      description: |-
        Deletes an issue priority.

        This operation is [asynchronous](#async). Follow the `location` link in the response to determine the status of the task and use [Get task](#api-rest-api-3-task-taskId-get) to obtain subsequent updates.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: deletePriority
      parameters:
        - description: The ID of the issue priority.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The 303 See Other redirect to the task (GET /rest/api/3/task/{taskId}) is followed; the body is the task progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProgressBeanObject'
        '303':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProgressBeanObject'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The newPriority has to be provided."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request isn't valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["You are not authorized to perform this action. Administrator privileges are required."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user doesn't have the necessary permission.
        '404':
          content:
            application/json:
              example: '{"errorMessages":["Priority with ID 10000 not found."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the issue priority isn't found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the priority is still in use or a task to delete it is already running.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if priority usage cannot be checked.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Delete priority
      tags:
        - Issue priorities
      x-changes:
        - announced: '2023-07-18'
          details: https://developer.atlassian.com/changelog/#CHANGE-1067
          effective: '2024-05-24'
          type: removed
      x-atlassian-connect-scope: INACCESSIBLE
    get:
      deprecated: false
      description: |-
        Returns an issue priority. To fetch multiple priorities at once, use [Search priorities](#api-rest-api-3-priority-search-get) instead.

        **[Permissions](#permissions) required:** Permission to access Jira.
      operationId: getPriority
      parameters:
        - description: The ID of the issue priority.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"description":"Major loss of function.","iconUrl":"https://your-domain.atlassian.net/images/icons/priorities/major.png","id":"1","name":"Major","self":"https://your-domain.atlassian.net/rest/api/3/priority/3","statusColor":"#009900"}'
              schema:
                $ref: '#/components/schemas/Priority'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect.
        '404':
          description: Returned if the issue priority isn't found.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get priority
      tags:
        - Issue priorities
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:priority:jira
          state: Beta
      x-atlassian-connect-scope: READ
    put:
      deprecated: false
      description: |-
        Updates an issue priority.

        At least one request body parameter must be defined.

        **Deprecation notice:** The `iconUrl` parameter was sunset on 16th Mar 2025, and replaced with `avatarId`. See [CHANGE-1525](https://developer.atlassian.com/changelog/#CHANGE-1525).

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: updatePriority
      parameters:
        - description: The ID of the issue priority.
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              description: My updated priority description
              iconUrl: /images/icons/priorities/minor.png
              name: My updated priority
              statusColor: '#123456'
            schema:
              $ref: '#/components/schemas/UpdatePriorityDetails'
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The length of the description must not exceed 255 characters."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request isn't valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["You are not authorized to perform this action. Administrator privileges are required."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user doesn't have the necessary permission.
        '404':
          content:
            application/json:
              example: '{"errorMessages":["Priority with ID 10000 not found."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the issue priority isn't found.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Update priority
      tags:
        - Issue priorities
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/priorityscheme:
    get:
      deprecated: false
      description: |-
        Returns a [paginated](#pagination) list of priority schemes.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: getPrioritySchemes
      parameters:
        - description: The index of the first item to return in a page of results (page offset).
          in: query
          name: startAt
          schema:
            default: '0'
            type: string
        - description: The maximum number of items to return per page.
          in: query
          name: maxResults
          schema:
            default: '50'
            type: string
        - description: A set of priority IDs to filter by. To include multiple IDs, provide an ampersand-separated list. For example, `priorityId=10000&priorityId=10001`.
          in: query
          name: priorityId
          schema:
            items:
              format: int64
              type: integer
            type: array
            uniqueItems: true
        - description: A set of priority scheme IDs. To include multiple IDs, provide an ampersand-separated list. For example, `schemeId=10000&schemeId=10001`.
          in: query
          name: schemeId
          schema:
            items:
              format: int64
              type: integer
            type: array
            uniqueItems: true
        - description: The name of scheme to search for.
          in: query
          name: schemeName
          schema:
            default: ''
            type: string
        - description: Whether only the default priority is returned.
          in: query
          name: onlyDefault
          schema:
            default: false
            type: boolean
        - description: The ordering to return the priority schemes by.
          in: query
          name: orderBy
          schema:
            default: +name
            enum:
              - name
              - +name
              - '-name'
            type: string
        - description: A comma separated list of additional information to return. "priorities" will return priorities associated with the priority scheme. "projects" will return projects associated with the priority scheme. `expand=priorities,projects`.
          in: query
          name: expand
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":50,"startAt":0,"total":1,"values":[{"description":"This is the default scheme used by all new and unassigned projects","id":"1","isDefault":true,"name":"Default Priority Scheme","priorities":{"isLast":true,"maxResults":50,"startAt":0,"total":3,"values":[{"description":"Serious problem that could block progress.","iconUrl":"/images/icons/priorities/high.svg","id":"1","isDefault":false,"name":"High","statusColor":"#f15C75"},{"description":"Has the potential to affect progress.","iconUrl":"/images/icons/priorities/medium.svg","id":"2","isDefault":true,"name":"Medium","statusColor":"#f79232"},{"description":"Minor problem or easily worked around.","iconUrl":"/images/icons/priorities/low.svg","id":"3","isDefault":false,"name":"Low","statusColor":"#707070"}]},"projects":{"isLast":true,"maxResults":50,"startAt":0,"total":1,"values":[{"avatarUrls":{"16x16":"secure/projectavatar?size=xsmall&pid=10000","24x24":"secure/projectavatar?size=small&pid=10000","32x32":"secure/projectavatar?size=medium&pid=10000","48x48":"secure/projectavatar?size=large&pid=10000"},"id":"10000","key":"EX","name":"Example","projectCategory":{"description":"Project category description","id":"10000","name":"A project category"},"projectTypeKey":"ProjectTypeKey{key=''software''}","self":"project/EX","simplified":false}]}}]}'
              schema:
                $ref: '#/components/schemas/PageBeanPrioritySchemeWithPaginatedPrioritiesAndProjects'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request isn't valid.
        '401':
          description: Returned if the authentication credentials are incorrect.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Get priority schemes
      tags:
        - Priority schemes
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - read:priority-scheme:jira
          state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    post:
      deprecated: false
      description: |-
        Creates a new priority scheme.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: createPriorityScheme
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              defaultPriorityId: 10001
              description: My priority scheme description
              mappings:
                in:
                  '10002': 10000
                  '10005': 10001
                  '10006': 10001
                  '10008': 10003
                out: {}
              name: My new priority scheme
              priorityIds:
                - 10000
                - 10001
                - 10003
              projectIds:
                - 10005
                - 10006
                - 10007
            schema:
              $ref: '#/components/schemas/CreatePrioritySchemeDetails'
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"id":"10001"}'
              schema:
                $ref: '#/components/schemas/PrioritySchemeId'
          description: Returned if the request is completed.
        '202':
          content:
            application/json:
              example: '{"id":"10001","task":{"self":"https://your-domain.atlassian.net/rest/api/3/task/1","id":"1","description":"Task description","status":"COMPLETE","result":"the task result, this may be any JSON","submittedBy":10000,"progress":100,"elapsedRuntime":156,"submitted":1501708132800,"started":1501708132900,"finished":1501708133000,"lastUpdate":1501708133000}}'
              schema:
                $ref: '#/components/schemas/PrioritySchemeId'
          description: Returned if the request is accepted.
        '400':
          description: |-
            Returned if the request isn't valid.

            **Mappings Validation Errors**

             *  ``The priorities with IDs [ID 1, ID 2, ...] require mapping. Please provide mappings in the 'in' mappings object, where these priorities are the keys with corresponding values.`` The listed priority ID(s) have not been provided as keys for ``in`` mappings but are required, add them to the mappings object.
        '401':
          description: Returned if the authentication credentials are incorrect.
        '403':
          description: Returned if the user doesn't have the necessary permissions.
        '409':
          description: Returned if an action with this priority scheme is still in progress.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededResponseBean'
          description: 422 response
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Create priority scheme
      tags:
        - Priority schemes
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - write:priority-scheme:jira
          state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/priorityscheme/mappings:
    post:
      deprecated: false
      description: |-
        Returns a [paginated](#pagination) list of priorities that would require mapping, given a change in priorities or projects associated with a priority scheme.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: suggestedPrioritiesForMappings
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              maxResults: 50
              priorities:
                add:
                  - 10001
                  - 10002
                remove:
                  - 10003
              projects:
                add:
                  - 10021
              schemeId: 10005
              startAt: 0
            schema:
              $ref: '#/components/schemas/SuggestedMappingsRequestBean'
        required: true
      responses:
        '200':
          content:
            application/json:
