              example: '{"statusId":"1000","workflows":{"nextPageToken":"eyJvIjoyfQ==","values":[{"id":"545d80a3-91ff-4949-8b0d-a2bc484e70e5"}]}}'
              schema:
                $ref: '#/components/schemas/StatusWorkflowUsageDTO'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["Invalid format of nextPageToken"],"errors":{}}'
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
        '404':
          description: Returned if the status with the given ID does not exist.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Get workflow usages by status
      tags:
        - Status
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - read:workflow:jira
            - read:status:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/workflow/history:
    post:
      deprecated: false
      description: |-
        Returns a workflow and related statuses for a specified workflow id and version number.

        **Note:** Stored workflow data expires after 60 days. Additionally, no data from before the 30th of October 2025 is available.

        **[Permissions](#permissions) required:**

         *  *Administer Jira* global permission to access all, including project-scoped, workflows
         *  At least one of the *Administer projects* and *View (read-only) workflow* project permissions to access project-scoped workflows
      operationId: readWorkflowFromHistory
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              version: 4
              workflowId: c5ef565c-1b1e-427e-bc3b-e677b0dc027c
            schema:
              $ref: '#/components/schemas/WorkflowHistoryReadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
