openapi: 3.0.1
info:
  title: Jira Workflows
  description: Workflows, workflow schemes and their drafts and project associations, statuses and status categories.
  version: 1001.0.0-SNAPSHOT-a7b4351c3da87b54b4403678bdb0ff81c88ca648
  x-stackQL-sourceSpec: platform
paths:
  /rest/api/3/status:
    get:
      deprecated: false
      description: |-
        Returns a list of all statuses associated with active workflows.

        This operation can be accessed anonymously.

        [Permissions](#permissions) required: *Browse projects* [project permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-project-permissions/) for the project.
      operationId: getStatuses
      parameters: []
      responses:
        '200':
          content:
            application/json:
              example: '[{"description":"The issue is currently being worked on.","iconUrl":"https://your-domain.atlassian.net/images/icons/progress.gif","id":"10000","name":"In Progress","self":"https://your-domain.atlassian.net/rest/api/3/status/10000","statusCategory":{"colorName":"yellow","id":1,"key":"in-flight","name":"In Progress","self":"https://your-domain.atlassian.net/rest/api/3/statuscategory/1"}},{"description":"The issue is closed.","iconUrl":"https://your-domain.atlassian.net/images/icons/closed.gif","id":"5","name":"Closed","self":"https://your-domain.atlassian.net/rest/api/3/status/5","statusCategory":{"colorName":"green","id":9,"key":"completed","self":"https://your-domain.atlassian.net/rest/api/3/statuscategory/9"}}]'
              schema:
                $ref: '#/components/schemas/GetStatusesResponse'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get all statuses
      tags:
        - Workflow statuses
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:status:jira
          state: Beta
      x-atlassian-connect-scope: READ
  /rest/api/3/status/{idOrName}:
    get:
      deprecated: false
      description: |-
        Returns a status. The status must be associated with an active workflow to be returned.

        If a name is used on more than one status, only the status found first is returned. Therefore, identifying the status by its ID may be preferable.

        This operation can be accessed anonymously.

        [Permissions](#permissions) required: *Browse projects* [project permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-project-permissions/) for the project.
      operationId: getStatus
      parameters:
        - description: The ID or name of the status.
          in: path
          name: idOrName
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"description":"The issue is currently being worked on.","iconUrl":"https://your-domain.atlassian.net/images/icons/progress.gif","id":"10000","name":"In Progress","self":"https://your-domain.atlassian.net/rest/api/3/status/10000","statusCategory":{"colorName":"yellow","id":1,"key":"in-flight","name":"In Progress","self":"https://your-domain.atlassian.net/rest/api/3/statuscategory/1"}}'
              schema:
                $ref: '#/components/schemas/StatusDetails'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '404':
          description: |-
            Returned if:

             *  the status is not found.
             *  the status is not associated with a workflow.
             *  the user does not have the required permissions.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get status
      tags:
        - Workflow statuses
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:status:jira
          state: Beta
      x-atlassian-connect-scope: READ
  /rest/api/3/statuscategory:
    get:
      deprecated: false
      description: |-
        Returns a list of all status categories.

        **[Permissions](#permissions) required:** Permission to access Jira.
      operationId: getStatusCategories
      parameters: []
      responses:
        '200':
          content:
            application/json:
              example: '[{"colorName":"yellow","id":1,"key":"in-flight","name":"In Progress","self":"https://your-domain.atlassian.net/rest/api/3/statuscategory/1"},{"colorName":"green","id":9,"key":"completed","self":"https://your-domain.atlassian.net/rest/api/3/statuscategory/9"}]'
              schema:
                $ref: '#/components/schemas/GetStatusCategoriesResponse'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get all status categories
      tags:
        - Workflow status categories
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:status:jira
          state: Beta
      x-atlassian-connect-scope: READ
  /rest/api/3/statuscategory/{idOrKey}:
    get:
      deprecated: false
      description: |-
        Returns a status category. Status categories provided a mechanism for categorizing [statuses](#api-rest-api-3-status-idOrName-get).

        **[Permissions](#permissions) required:** Permission to access Jira.
      operationId: getStatusCategory
      parameters:
        - description: The ID or key of the status category.
          in: path
          name: idOrKey
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"colorName":"yellow","id":1,"key":"in-flight","name":"In Progress","self":"https://your-domain.atlassian.net/rest/api/3/statuscategory/1"}'
              schema:
                $ref: '#/components/schemas/StatusCategory'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '404':
          description: Returned if the status category is not found.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get status category
      tags:
        - Workflow status categories
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:status:jira
          state: Beta
      x-atlassian-connect-scope: READ
  /rest/api/3/statuses:
    delete:
      deprecated: false
      description: |-
        Deletes statuses by ID.

        **[Permissions](#permissions) required:**

         *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)
         *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: deleteStatusesById
      parameters:
        - description: |-
            The list of status IDs. To include multiple IDs, provide an ampersand-separated list. For example, id=10000&id=10001.

            Min items `1`, Max items `50`
          in: query
          name: id
          required: true
          schema:
            items:
              type: string
            type: array
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The name is too long, maxSize=255"],"errors":{}}'
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Bulk delete Statuses
      tags:
        - Status
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - write:workflow:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
    get:
      deprecated: false
      description: |-
        Returns a list of the statuses specified by one or more status IDs.

        **[Permissions](#permissions) required:**

         *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)
         *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: getStatusesById
      parameters:
        - description: |-
            The list of status IDs. To include multiple IDs, provide an ampersand-separated list. For example, id=10000&id=10001.

            Min items `1`, Max items `50`
          in: query
          name: id
          required: true
          schema:
            items:
              type: string
            type: array
      responses:
        '200':
          content:
            application/json:
              example: '[{"description":"The issue is resolved","id":"1000","name":"Finished","scope":{"project":{"id":"1"},"type":"PROJECT"},"statusCategory":"DONE"}]'
              schema:
                $ref: '#/components/schemas/GetStatusesByIdResponse'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Bulk get statuses
      tags:
        - Status
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - read:workflow:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
    post:
      deprecated: false
      description: |-
        Creates statuses for a global or project scope.

        **[Permissions](#permissions) required:**

         *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)
         *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: createStatuses
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              scope:
                project:
                  id: '1'
                type: PROJECT
              statuses:
                - description: The issue is resolved
                  name: Finished
                  statusCategory: DONE
            schema:
              $ref: '#/components/schemas/StatusCreateRequest'
        description: Details of the statuses being created and their scope.
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '[{"description":"The issue is resolved","id":"1000","name":"Finished","scope":{"project":{"id":"1"},"type":"PROJECT"},"statusCategory":"DONE"}]'
              schema:
                $ref: '#/components/schemas/CreateStatusesResponse'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The name is too long, maxSize=255"],"errors":{}}'
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
        '409':
          description: Returned if another workflow configuration update task is ongoing.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Bulk create statuses
      tags:
        - Status
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - write:workflow:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
    put:
      deprecated: false
      description: |-
        Updates statuses by ID.

        **[Permissions](#permissions) required:**

         *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)
         *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: updateStatuses
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              statuses:
                - description: The issue is resolved
                  id: '1000'
                  name: Finished
                  statusCategory: DONE
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
        description: The list of statuses that will be updated.
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The name is too long, maxSize=255"],"errors":{}}'
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
        '409':
          description: Returned if another workflow configuration update task is ongoing.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Bulk update statuses
      tags:
        - Status
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - write:workflow:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/statuses/byNames:
    get:
      deprecated: false
      description: |-
        Returns a list of the statuses specified by one or more status names.

        **[Permissions](#permissions) required:**

         *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)
         *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
         *  *Browse projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: getStatusesByName
      parameters:
        - description: |-
            The list of status names. To include multiple names, provide an ampersand-separated list. For example, name=nameXX&name=nameYY.

            Min items `1`, Max items `50`
          in: query
          name: name
          required: true
          schema:
            items:
              type: string
            type: array
        - description: The project the status is part of or null for global statuses.
          in: query
          name: projectId
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '[{"description":"The issue is resolved","id":"1000","name":"Finished","scope":{"project":{"id":"1"},"type":"PROJECT"},"statusCategory":"DONE"}]'
              schema:
                $ref: '#/components/schemas/GetStatusesByNameResponse'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Bulk get statuses by name
      tags:
        - Status
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - read:workflow:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/statuses/search:
    get:
      deprecated: false
      description: |-
        Returns a [paginated](https://developer.atlassian.com/cloud/jira/platform/rest/v3/intro/#pagination) list of statuses that match a search on name or project.

        **[Permissions](#permissions) required:**

         *  *Administer projects* [project permission.](https://confluence.atlassian.com/x/yodKLg)
         *  *Administer Jira* [project permission.](https://confluence.atlassian.com/x/yodKLg)
      operationId: search
      parameters:
        - description: The project the status is part of or null for global statuses.
          in: query
          name: projectId
          schema:
            type: string
        - description: The index of the first item to return in a page of results (page offset).
          in: query
          name: startAt
          schema:
            default: 0
            format: int64
            type: integer
        - description: The maximum number of items to return per page.
          in: query
          name: maxResults
          schema:
            default: 200
            format: int32
            type: integer
        - description: Term to match status names against or null to search for all statuses in the search scope.
          in: query
          name: searchString
          schema:
            maxLength: 255
            type: string
        - description: 'Category of the status to filter by. The supported values are: `TODO`, `IN_PROGRESS`, and `DONE`.'
          in: query
          name: statusCategory
          schema:
            type: string
        - description: Whether to include global statuses (scope = null, not tied to any project) in the response. Defaults to false. Only relevant for project scoped queries.
          in: query
          name: includeGlobalStatuses
          schema:
            type: boolean
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":2,"nextPage":"https://your-domain.atlassian.net/rest/api/3/statuses/search?startAt=2&maxResults=2","self":"https://your-domain.atlassian.net/rest/api/3/statuses/search?startAt=0&maxResults=2","startAt":0,"total":5,"values":[{"description":"The issue is resolved","id":"1000","name":"Finished","scope":{"project":{"id":"1"},"type":"PROJECT"},"statusCategory":"DONE"}]}'
              schema:
                $ref: '#/components/schemas/PageOfStatuses'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Search statuses paginated
      tags:
        - Status
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - read:workflow:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/statuses/{statusId}/project/{projectId}/issueTypeUsages:
    get:
      deprecated: false
      description: Returns a page of issue types in a project using a given status.
      operationId: getProjectIssueTypeUsagesForStatus
      parameters:
        - description: The statusId to fetch issue type usages for
          in: path
          name: statusId
          required: true
          schema:
            type: string
        - description: The projectId to fetch issue type usages for
          in: path
          name: projectId
          required: true
          schema:
            type: string
        - description: The cursor for pagination
          in: query
          name: nextPageToken
          schema:
            type: string
        - description: The maximum number of results to return. Must be an integer between 1 and 200.
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"issueTypes":{"nextPageToken":"eyJvIjoyfQ==","values":[{"id":"1000"}]},"projectId":"2000","statusId":"1000"}'
              schema:
                $ref: '#/components/schemas/StatusProjectIssueTypeUsageDTO'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["Invalid format of nextPageToken"],"errors":{}}'
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing, or the caller doesn't have permissions to perform the operation.
        '404':
          description: Returned if the status with the given ID does not exist.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Get issue type usages by status and project
      tags:
        - Status
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - read:project:jira
            - read:status:jira
            - read:issue-type:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/statuses/{statusId}/projectUsages:
    get:
      deprecated: false
      description: Returns a page of projects using a given status.
