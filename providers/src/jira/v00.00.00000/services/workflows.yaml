components:
  schemas:
    StatusDetails:
      additionalProperties: true
      description: A status.
      properties:
        description:
          description: The description of the status.
          readOnly: true
          type: string
        iconUrl:
          description: The URL of the icon used to represent the status.
          readOnly: true
          type: string
        id:
          description: The ID of the status.
          readOnly: true
          type: string
        name:
          description: The name of the status.
          readOnly: true
          type: string
        scope:
          description: The scope of the field.
          readOnly: true
          additionalProperties: true
          properties:
            project:
              description: The project the item has scope in.
              readOnly: true
              additionalProperties: false
              properties:
                avatarUrls:
                  description: The URLs of the project's avatars.
                  readOnly: true
                  additionalProperties: false
                  properties:
                    16x16:
                      description: The URL of the item's 16x16 pixel avatar.
                      format: uri
                      type: string
                    24x24:
                      description: The URL of the item's 24x24 pixel avatar.
                      format: uri
                      type: string
                    32x32:
                      description: The URL of the item's 32x32 pixel avatar.
                      format: uri
                      type: string
                    48x48:
                      description: The URL of the item's 48x48 pixel avatar.
                      format: uri
                      type: string
                  type: object
                id:
                  description: The ID of the project.
                  type: string
                key:
                  description: The key of the project.
                  readOnly: true
                  type: string
                name:
                  description: The name of the project.
                  readOnly: true
                  type: string
                projectCategory:
                  description: The category the project belongs to.
                  readOnly: true
                  additionalProperties: false
                  properties:
                    description:
                      description: The name of the project category.
                      readOnly: true
                      type: string
                    id:
                      description: The ID of the project category.
                      readOnly: true
                      type: string
                    name:
                      description: The description of the project category.
                      readOnly: true
                      type: string
                    self:
                      description: The URL of the project category.
                      readOnly: true
                      type: string
                  type: object
                projectTypeKey:
                  description: The [project type](https://confluence.atlassian.com/x/GwiiLQ#Jiraapplicationsoverview-Productfeaturesandprojecttypes) of the project.
                  enum:
                    - software
                    - service_desk
                    - business
                    - product_discovery
                  readOnly: true
                  type: string
                self:
                  description: The URL of the project details.
                  readOnly: true
                  type: string
                simplified:
                  description: Whether or not the project is simplified.
                  readOnly: true
                  type: boolean
              type: object
            type:
              description: The type of scope.
              enum:
                - PROJECT
                - TEMPLATE
              readOnly: true
              type: string
          type: object
        self:
          description: The URL of the status.
          readOnly: true
          type: string
        statusCategory:
          description: The category assigned to the status.
          readOnly: true
          additionalProperties: true
          properties:
            colorName:
              description: The name of the color used to represent the status category.
              readOnly: true
              type: string
            id:
              description: The ID of the status category.
              format: int64
              readOnly: true
              type: integer
            key:
              description: The key of the status category.
              readOnly: true
              type: string
            name:
              description: The name of the status category.
              readOnly: true
              type: string
            self:
              description: The URL of the status category.
              readOnly: true
              type: string
          type: object
      type: object
    StatusCategory:
      additionalProperties: true
      description: A status category.
      properties:
        colorName:
          description: The name of the color used to represent the status category.
          readOnly: true
          type: string
        id:
          description: The ID of the status category.
          format: int64
          readOnly: true
          type: integer
        key:
          description: The key of the status category.
          readOnly: true
          type: string
        name:
          description: The name of the status category.
          readOnly: true
          type: string
        self:
          description: The URL of the status category.
          readOnly: true
          type: string
      type: object
    JiraStatus:
      additionalProperties: false
      description: Details of a status.
      properties:
        description:
          description: The description of the status.
          type: string
        id:
          description: The ID of the status.
          type: string
        name:
          description: The name of the status.
          type: string
        scope:
          $ref: '#/components/schemas/StatusScope'
