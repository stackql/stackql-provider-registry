        - description: The cursor for pagination
          in: query
          name: nextPageToken
          schema:
            type: string
        - description: The maximum number of results to return. Must be an integer between 1 and 200.
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"projects":{"nextPageToken":"eyJvIjoyfQ==","values":[{"id":"1000"}]},"statusId":"1000"}'
