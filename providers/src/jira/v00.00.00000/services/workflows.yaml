        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: setWorkflowSchemeIssueType
      parameters:
        - description: The ID of the workflow scheme.
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: The ID of the issue type.
          in: path
          name: issueType
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              issueType: '10000'
              updateDraftIfNeeded: false
              workflow: jira
            schema:
              $ref: '#/components/schemas/IssueTypeWorkflowMapping'
        description: The issue type-project mapping.
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"defaultWorkflow":"jira","description":"The description of the example workflow scheme.","draft":false,"id":101010,"issueTypeMappings":{"10000":"scrum workflow","10001":"builds workflow"},"name":"Example workflow scheme","self":"https://your-domain.atlassian.net/rest/api/3/workflowscheme/101010"}'
              schema:
                $ref: '#/components/schemas/WorkflowScheme'
          description: Returned if the request is successful.
        '400':
          description: Returned if the workflow cannot be edited and `updateDraftIfNeeded` is false.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have the necessary permission.
        '404':
          description: Returned if the workflow scheme or issue type is not found.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Set workflow for issue type in workflow scheme
      tags:
        - Workflow schemes
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - write:workflow-scheme:jira
            - read:workflow-scheme:jira
            - read:workflow:jira
            - read:application-role:jira
            - read:avatar:jira
            - read:group:jira
            - read:issue-type:jira
            - read:project-category:jira
            - read:project:jira
            - read:user:jira
          state: Beta
      x-atlassian-connect-scope: ADMIN
  /rest/api/3/workflowscheme/{id}/workflow:
    delete:
      deprecated: false
      description: |-
        Deletes the workflow-issue type mapping for a workflow in a workflow scheme.

        Note that active workflow schemes cannot be edited. If the workflow scheme is active, set `updateDraftIfNeeded` to `true` and a draft workflow scheme is created or updated with the workflow-issue type mapping deleted. The draft workflow scheme can be published in Jira.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: deleteWorkflowMapping
      parameters:
        - description: The ID of the workflow scheme.
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: The name of the workflow.
          in: query
          name: workflowName
          required: true
          schema:
            type: string
        - description: Set to true to create or update the draft of a workflow scheme and delete the mapping from the draft, when the workflow scheme cannot be edited. Defaults to `false`.
          in: query
          name: updateDraftIfNeeded
          schema:
            default: false
            type: boolean
      responses:
        '200':
          description: Returned if the request is successful.
        '400':
          description: Returned if the workflow cannot be edited and `updateDraftIfNeeded` is not true.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have the necessary permission.
        '404':
          description: |-
            Returned if any of the following is true:

             *  The workflow scheme is not found.
             *  The workflow is not found.
             *  The workflow is not specified.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Delete issue types for workflow in workflow scheme
      tags:
        - Workflow schemes
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - delete:workflow-scheme:jira
          state: Beta
      x-atlassian-connect-scope: ADMIN
    get:
      deprecated: false
      description: |-
        Returns the workflow-issue type mappings for a workflow scheme.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: getWorkflow
      parameters:
        - description: The ID of the workflow scheme.
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: The name of a workflow in the scheme. Limits the results to the workflow-issue type mapping for the specified workflow.
          in: query
          name: workflowName
          schema:
            type: string
        - description: Returns the mapping from the workflow scheme's draft rather than the workflow scheme, if set to true. If no draft exists, the mapping from the workflow scheme is returned.
          in: query
          name: returnDraftIfExists
          schema:
            default: false
            type: boolean
      responses:
        '200':
          content:
            application/json:
              example: '{"defaultMapping":false,"issueTypes":["10000","10001"],"workflow":"jira"}'
              schema:
                $ref: '#/components/schemas/IssueTypesWorkflowMapping'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have the necessary permission.
        '404':
          description: Returned if either the workflow scheme or workflow is not found.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Get issue types for workflows in workflow scheme
      tags:
        - Workflow schemes
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - read:workflow-scheme:jira
            - read:workflow:jira
            - read:issue-type:jira
          state: Beta
      x-atlassian-connect-scope: ADMIN
    put:
      deprecated: false
      description: |-
        Sets the issue types for a workflow in a workflow scheme. The workflow can also be set as the default workflow for the workflow scheme. Unmapped issues types are mapped to the default workflow.

        Note that active workflow schemes cannot be edited. If the workflow scheme is active, set `updateDraftIfNeeded` to `true` in the request body and a draft workflow scheme is created or updated with the new workflow-issue types mappings. The draft workflow scheme can be published in Jira.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: updateWorkflowMapping
      parameters:
        - description: The ID of the workflow scheme.
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: The name of the workflow.
          in: query
          name: workflowName
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              issueTypes:
                - '10000'
              updateDraftIfNeeded: true
              workflow: jira
            schema:
              $ref: '#/components/schemas/IssueTypesWorkflowMapping'
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"defaultWorkflow":"jira","description":"The description of the example workflow scheme.","draft":false,"id":101010,"issueTypeMappings":{"10000":"scrum workflow","10001":"builds workflow"},"name":"Example workflow scheme","self":"https://your-domain.atlassian.net/rest/api/3/workflowscheme/101010"}'
              schema:
                $ref: '#/components/schemas/WorkflowScheme'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have the necessary permission.
        '404':
          description: |-
            Returned if any of the following is true:

             *  The workflow scheme is not found.
             *  The workflow is not found.
             *  The workflow is not specified.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Set issue types for workflow in workflow scheme
      tags:
        - Workflow schemes
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - write:workflow-scheme:jira
            - read:workflow-scheme:jira
            - read:workflow:jira
            - read:application-role:jira
            - read:avatar:jira
            - read:group:jira
            - read:issue-type:jira
            - read:project-category:jira
            - read:project:jira
            - read:user:jira
          state: Beta
      x-atlassian-connect-scope: ADMIN
  /rest/api/3/workflowscheme/{workflowSchemeId}/projectUsages:
    get:
      deprecated: false
      description: Returns a page of projects using a given workflow scheme.
      operationId: getProjectUsagesForWorkflowScheme
      parameters:
        - description: The workflow scheme ID
          in: path
          name: workflowSchemeId
          required: true
          schema:
            type: string
        - description: The cursor for pagination
          in: query
          name: nextPageToken
          schema:
            type: string
        - description: The maximum number of results to return. Must be an integer between 1 and 200.
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"projects":{"nextPageToken":"eyJvIjoyfQ==","values":[{"id":"1003"}]},"workflowSchemeId":"10005"}'
