  /rest/api/3/plans/plan/{plan_id}/team/atlassian:
    post:
      deprecated: false
      description: |-
        Adds an existing Atlassian team to a plan and configures their plannning settings.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: addAtlassianTeam
      parameters:
        - description: The ID of the plan.
          in: path
          name: plan_id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            example:
              capacity: 200
              id: AtlassianTeamId
              issueSourceId: 0
              planningStyle: Scrum
              sprintLength: 2
            schema:
              $ref: '#/components/schemas/AddAtlassianTeamRequest'
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              schema:
