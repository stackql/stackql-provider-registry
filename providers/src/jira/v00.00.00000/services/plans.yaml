        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not active.
      security:
        - basicAuth: []
        - OAuth2:
            - write:jira-work
      summary: Add Atlassian team to plan
      tags:
        - Teams in plan
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/plans/plan/{plan_id}/team/atlassian/{atlassian_team_id}:
