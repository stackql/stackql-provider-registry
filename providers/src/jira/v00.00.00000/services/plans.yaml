openapi: 3.0.1
info:
  title: Jira Plans
  description: Plans (Jira Premium) and the teams in a plan.
  version: 1001.0.0-SNAPSHOT-c708f3bbbb25201455fbb24169cbdc71ef7764bf
  x-stackQL-sourceSpec: platform
paths:
  /rest/api/3/plans/plan:
    get:
      deprecated: false
      description: |-
        Returns a [paginated](#pagination) list of plans.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: getPlans
      parameters:
        - description: Whether to include trashed plans in the results.
          in: query
          name: includeTrashed
          schema:
            default: false
            type: boolean
        - description: Whether to include archived plans in the results.
          in: query
          name: includeArchived
          schema:
            default: false
            type: boolean
        - description: The cursor to start from. If not provided, the first page will be returned.
          in: query
          name: cursor
          schema:
            default: ''
            type: string
        - description: The maximum number of plans to return per page. The maximum value is 50. The default value is 50.
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"cursor":"","isLast":true,"maxResults":2,"nextPageCursor":"2","total":10,"values":[{"id":"100","issueSources":[{"type":"Project","value":10000}],"name":"Plan 1","scenarioId":"200","status":"Active"},{"id":"200","issueSources":[{"type":"Board","value":20000}],"name":"Plan 2","scenarioId":"300","status":"Trashed"}]}'
              schema:
                $ref: '#/components/schemas/PageWithCursorGetPlanResponseForPage'
          description: Returned if the request is successful.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
      summary: Get plans paginated
      tags:
        - Plans
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    post:
      deprecated: false
      description: |-
        Creates a plan.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: createPlan
      parameters:
        - description: Whether to accept group IDs instead of group names. Group names are deprecated.
          in: query
          name: useGroupId
          schema:
            default: false
            type: boolean
      requestBody:
        content:
          application/json:
            example:
              crossProjectReleases:
                - name: AB and BC merge
                  releaseIds:
                    - 29
                    - 39
              customFields:
                - customFieldId: 2335
                  filter: true
              exclusionRules:
                issueIds:
                  - 2
                  - 3
                issueTypeIds:
                  - 32
                  - 33
                numberOfDaysToShowCompletedIssues: 50
                releaseIds:
                  - 42
                  - 43
                workStatusCategoryIds:
                  - 22
                  - 23
                workStatusIds:
                  - 12
                  - 13
              issueSources:
                - type: Project
                  value: 12
                - type: Board
                  value: 462
              leadAccountId: abc-12-rbji
              name: ABC Quaterly plan
              permissions:
                - holder:
                    type: AccountId
                    value: 234-tgj-343
                  type: Edit
              scheduling:
                dependencies: Sequential
                endDate:
                  type: DueDate
                estimation: Days
                inferredDates: ReleaseDates
                startDate:
                  type: TargetStartDate
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                format: int64
                type: integer
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
      security:
        - basicAuth: []
        - OAuth2:
            - write:jira-work
      summary: Create plan
      tags:
        - Plans
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/plans/plan/{plan_id}:
    get:
      deprecated: false
      description: |-
        Returns a plan.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: getPlan
      parameters:
        - description: The ID of the plan.
          in: path
          name: plan_id
          required: true
          schema:
            format: int64
            type: integer
        - description: Whether to return group IDs instead of group names. Group names are deprecated.
          in: query
          name: useGroupId
          schema:
            default: false
            type: boolean
      responses:
        '200':
          content:
            application/json:
              example: '{"crossProjectReleases":[{"name":"x-plr","releaseIds":[345]}],"customFields":[{"customFieldId":34,"filter":false},{"customFieldId":39,"filter":true}],"exclusionRules":{"issueIds":[1,2],"issueTypeIds":[13,23],"numberOfDaysToShowCompletedIssues":50,"releaseIds":[14,24],"workStatusCategoryIds":[12,22],"workStatusIds":[11,21]},"id":23,"issueSources":[{"type":"Project","value":12},{"type":"Filter","value":10293}],"lastSaved":"2024-10-03T10:15:30Z","leadAccountId":"628f5e86d5ec1f006ne7363x2s","name":"Onset TBJ Plan","permissions":[{"holder":{"type":"AccountId","value":"04jekw86d5jjje006ne7363x2s"},"type":"Edit"}],"scheduling":{"dependencies":"Concurrent","endDate":{"dateCustomFieldId":1098,"type":"DateCustomField"},"estimation":"Hours","inferredDates":"ReleaseDates","startDate":{"type":"TargetStartDate"}},"status":"Active"}'
              schema:
                $ref: '#/components/schemas/GetPlanResponse'
          description: Returned if the request is successful.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not found.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
      summary: Get plan
      tags:
        - Plans
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    put:
      deprecated: false
      description: |-
        Updates any of the following details of a plan using [JSON Patch](https://datatracker.ietf.org/doc/html/rfc6902).

         *  name
         *  leadAccountId
         *  scheduling
            
             *  estimation with StoryPoints, Days or Hours as possible values
             *  startDate
                
                 *  type with DueDate, TargetStartDate, TargetEndDate or DateCustomField as possible values
                 *  dateCustomFieldId
             *  endDate
                
                 *  type with DueDate, TargetStartDate, TargetEndDate or DateCustomField as possible values
                 *  dateCustomFieldId
             *  inferredDates with None, SprintDates or ReleaseDates as possible values
             *  dependencies with Sequential or Concurrent as possible values
         *  issueSources
            
             *  type with Board, Project or Filter as possible values
             *  value
         *  exclusionRules
            
             *  numberOfDaysToShowCompletedIssues
             *  issueIds
             *  workStatusIds
             *  workStatusCategoryIds
             *  issueTypeIds
             *  releaseIds
         *  crossProjectReleases
            
             *  name
             *  releaseIds
         *  customFields
            
             *  customFieldId
             *  filter
         *  permissions
            
             *  type with View or Edit as possible values
             *  holder
                
                 *  type with Group or AccountId as possible values
                 *  value

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).

        *Note that "add" operations do not respect array indexes in target locations. Call the "Get plan" endpoint to find out the order of array elements.*
      operationId: updatePlan
      parameters:
        - description: The ID of the plan.
          in: path
          name: plan_id
          required: true
          schema:
            format: int64
            type: integer
        - description: Whether to accept group IDs instead of group names. Group names are deprecated.
          in: query
          name: useGroupId
          schema:
            default: false
            type: boolean
      requestBody:
        content:
          application/json-patch+json:
            example: |
              [{"op": "replace", "path": "/scheduling/estimation", "value": "Days"}]
            schema:
              type: string
              description: (opaque JSON object)
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not active.
      security:
        - basicAuth: []
        - OAuth2:
            - write:jira-work
      summary: Update plan
      tags:
        - Plans
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
