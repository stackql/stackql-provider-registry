openapi: 3.0.1
info:
  title: Jira Software (Agile)
  description: Jira Software boards, sprints, epics, the backlog, board configuration and properties, issue ranking and estimation.
  version: 1001.0.0
  x-stackQL-sourceSpec: software
paths:
  /rest/agile/1.0/backlog/issue:
    post:
      deprecated: false
      description: |-
        Move issues to the backlog.  
        This operation is equivalent to remove future and active sprints from a given set of issues. At most 50 issues may be moved at once.
      operationId: moveIssuesToBacklog
      requestBody:
        content:
          application/json:
            example:
              issues:
                - '10001'
                - PR-1
                - PR-3
            schema:
              additionalProperties: false
              properties:
                issues:
                  items:
                    type: string
                  type: array
                  uniqueItems: true
              type: object
        required: true
      responses:
        '204':
          description: Empty response is returned if operation was successful.
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have a valid license or does not have permission to assign issues.
        '404':
          description: Returned if sprint does not exist or the user cannot view it.
      security:
        - basicAuth: []
        - OAuth2:
            - write:board-scope:jira-software
      summary: Move issues to backlog
      tags:
        - Backlog
      x-atlassian-connect-scope: WRITE
  /rest/agile/1.0/backlog/{board_id}/issue:
    post:
      deprecated: false
      description: |-
        Move issues to the backlog of a particular board (if they are already on that board).  
        This operation is equivalent to remove future and active sprints from a given set of issues if the board has sprints If the board does not have sprints this will put the issues back into the backlog from the board. At most 50 issues may be moved at once.
      operationId: moveIssuesToBacklogForBoard
      parameters:
        - in: path
          name: board_id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            example:
              issues:
                - PR-1
                - '10001'
                - PR-3
              rankBeforeIssue: PR-4
              rankCustomFieldId: 10521
            schema:
              additionalProperties: false
              properties:
                issues:
                  items:
                    type: string
                  type: array
                rankAfterIssue:
                  type: string
                rankBeforeIssue:
                  type: string
                rankCustomFieldId:
                  format: int64
                  type: integer
              type: object
        required: true
      responses:
        '204':
          description: Empty response is returned if operation was successful.
        '207':
          content:
            application/json:
              example: '{"entries":[{"issueId":10000,"issueKey":"PR-1","status":200},{"issueId":10001,"issueKey":"PR-2","status":200},{"errors":["JIRA Agile cannot execute the rank operation at this time. Please try again later."],"issueId":10002,"issueKey":"PR-3","status":503}]}'
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        issueId:
                          type: integer
                          format: int64
                        issueKey:
                          type: string
                        status:
                          type: integer
                          format: int64
                        errors:
                          type: array
                          items:
                            type: string
                description: Synthesized from the vendor example (fix class response_schema_from_example).
          description: Returns the list of issue with status of rank operation.
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have a valid license or does not have permission to assign issues.
        '404':
          description: Returned if sprint does not exist or the user cannot view it.
      security:
        - basicAuth: []
        - OAuth2:
            - write:board-scope:jira-software
      summary: Move issues to backlog for board
      tags:
        - Backlog
      x-atlassian-connect-scope: WRITE
  /rest/agile/1.0/board:
    get:
      deprecated: false
      description: |-
        Returns all boards. This only includes boards that the user has permission to view.

        **Deprecation notice:** The required OAuth 2.0 scopes will be updated on February 15, 2024.

         *  `read:board-scope:jira-software`, `read:project:jira`
      operationId: getAllBoards
      parameters:
        - description: 'The starting index of the returned boards. Base index: 0. See the ''Pagination'' section at the top of this page for more details.'
          in: query
          name: startAt
          schema:
            default: 0
            format: int64
            type: integer
        - description: The maximum number of boards to return per page. See the 'Pagination' section at the top of this page for more details.
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
        - description: 'Filters results to boards of the specified types. Valid values: scrum, kanban, simple.'
          in: query
          name: type
          schema:
            additionalProperties: false
            type: object
        - description: Filters results to boards that match or partially match the specified name.
          in: query
          name: name
          schema:
            type: string
        - description: Filters results to boards that are relevant to a project. Relevance means that the jql filter defined in board contains a reference to a project.
          in: query
          name: projectKeyOrId
          schema:
            type: string
        - in: query
          name: accountIdLocation
          schema:
            type: string
        - in: query
          name: projectLocation
          schema:
            type: string
        - description: Appends private boards to the end of the list. The name and type fields are excluded for security reasons.
          in: query
          name: includePrivate
          schema:
            type: boolean
        - description: If set to true, negate filters used for querying by location. By default false.
          in: query
          name: negateLocationFiltering
          schema:
            type: boolean
        - description: 'Ordering of the results by a given field. If not provided, values will not be sorted. Valid values: name.'
          in: query
          name: orderBy
          schema:
            enum:
              - name
              - '-name'
              - +name
            type: string
        - description: 'List of fields to expand for each board. Valid values: admins, permissions.'
          in: query
          name: expand
          schema:
            type: string
        - description: 'Filters results to boards that are relevant to a project types. Support Jira Software, Jira Service Management. Valid values: software, service\_desk. By default software.'
          in: query
          name: projectTypeLocation
          schema:
            items:
              default: ''
              type: string
            type: array
        - description: Filters results to boards that are relevant to a filter. Not supported for next-gen boards.
          in: query
          name: filterId
          schema:
            format: int64
            type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":false,"maxResults":2,"startAt":1,"total":5,"values":[{"id":84,"name":"scrum board","self":"https://your-domain.atlassian.net/rest/agile/1.0/board/84","type":"scrum"},{"id":92,"name":"kanban board","self":"https://your-domain.atlassian.net/rest/agile/1.0/board/92","type":"kanban"}]}'
              schema:
                additionalProperties: false
                properties:
                  isLast:
                    type: boolean
                  maxResults:
                    format: int32
                    type: integer
                  startAt:
                    format: int64
                    type: integer
                  total:
                    format: int64
                    type: integer
                  values:
                    items:
                      additionalProperties: false
                      description: Details about a board.
                      properties:
                        admins:
                          readOnly: true
                          additionalProperties: false
                          description: The users and groups who own the board.
                          properties:
                            groups:
                              items:
                                additionalProperties: false
                                properties:
                                  name:
                                    type: string
                                  self:
                                    format: uri
                                    type: string
                                type: object
                              type: array
                            users:
                              items:
                                additionalProperties: false
                                properties:
                                  accountId:
                                    description: The account ID of the user, which uniquely identifies the user across all Atlassian products. For example, *5b10ac8d82e05b22cc7d4ef5*.
                                    maxLength: 128
                                    type: string
                                  active:
                                    description: Whether the user is active.
                                    type: boolean
                                  avatarUrls:
                                    description: The avatars of the user.
                                    additionalProperties: false
                                    properties:
                                      16x16:
                                        description: The URL of the user's 16x16 pixel avatar.
                                        format: uri
                                        type: string
                                      24x24:
                                        description: The URL of the user's 24x24 pixel avatar.
                                        format: uri
                                        type: string
                                      32x32:
                                        description: The URL of the user's 32x32 pixel avatar.
                                        format: uri
                                        type: string
                                      48x48:
                                        description: The URL of the user's 48x48 pixel avatar.
                                        format: uri
                                        type: string
                                    type: object
                                  displayName:
                                    description: The display name of the user. Depending on the user’s privacy setting, this may return an alternative value.
                                    type: string
                                  key:
                                    description: |-
                                      This property is deprecated in favor of `accountId` because of privacy changes. See the [migration guide](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.  
                                      The key of the user.
                                    type: string
                                  name:
                                    description: |-
                                      This property is deprecated in favor of `accountId` because of privacy changes. See the [migration guide](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.  
                                      The username of the user.
                                    type: string
                                  self:
                                    description: The URL of the user.
                                    format: uri
                                    type: string
                                type: object
                              type: array
                          type: object
                        canEdit:
                          description: Whether the board can be edited.
                          readOnly: true
                          type: boolean
                        favourite:
                          description: Whether the board is selected as a favorite.
                          readOnly: true
                          type: boolean
                        id:
                          description: The ID of the board.
                          format: int64
                          type: integer
                        isPrivate:
                          description: Whether the board is private.
                          readOnly: true
                          type: boolean
                        location:
                          additionalProperties: false
                          description: The container that the board is located in.
                          properties:
                            avatarURI:
                              format: uri
                              type: string
                            displayName:
                              type: string
                            name:
                              type: string
                            projectId:
                              format: int64
                              type: integer
                            projectKey:
                              type: string
                            projectName:
                              type: string
                            projectTypeKey:
                              type: string
                            userAccountId:
                              type: string
                            userId:
                              format: int64
                              type: integer
