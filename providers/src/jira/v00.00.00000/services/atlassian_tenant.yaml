openapi: 3.0.1
info:
  title: Atlassian Tenant
  description: 'Public, unauthenticated site metadata: the cloud ID of a Jira Cloud site, looked up by its subdomain.'
  version: 1.0.0
  x-stackQL-sourceSpec: authored
servers:
  - url: https://{site}.atlassian.net
    description: A Jira Cloud site, addressed by its subdomain (the part before .atlassian.net).
    variables:
      site:
        description: The site subdomain, e.g. acme for https://acme.atlassian.net.
        default: your-domain
paths:
  /_edge/tenant_info:
    get:
      operationId: getTenantInfo
      summary: Get the cloud ID of a site
      description: 'Returns the cloud ID of the Jira Cloud site addressed by the site server variable (the subdomain of https://<site>.atlassian.net). The endpoint is public: it needs no credentials. The cloud ID is the value ATLASSIAN_CLOUD_ID (the cloud_id server variable of every other jira service) takes.'
      tags:
        - Tenant
      responses:
        '200':
          description: Returned if the site exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '404':
          description: Returned if no site has this subdomain.
components:
  schemas:
    TenantInfo:
      type: object
      description: Site metadata.
      properties:
        cloudId:
          type: string
          description: The cloud ID of the site.
          example: 1b5c9234-a0db-4a03-b735-6b3a3ed66889
  x-stackQL-resources:
    info:
      id: jira.atlassian_tenant.info
      name: info
      title: Info
      methods:
        get:
          operation:
            $ref: '#/paths/~1_edge~1tenant_info/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/info/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
tags:
  - name: Tenant
    description: Site metadata.
