        - scheme: OAuth2
          scopes:
            - read:avatar:jira
          state: Beta
      x-atlassian-connect-scope: ADMIN
    post:
      deprecated: false
      description: |-
        Loads a custom avatar for a project, issue type or priority.

        Specify the avatar's local file location in the body of the request. Also, include the following headers:

         *  `X-Atlassian-Token: no-check` To prevent XSRF protection blocking the request, for more information see [Special Headers](#special-request-headers).
         *  `Content-Type: image/image type` Valid image types are JPEG, GIF, or PNG.

        For example:  
        `curl --request POST `

        `--user email@example.com:<api_token> `

        `--header 'X-Atlassian-Token: no-check' `

        `--header 'Content-Type: image/< image_type>' `

        `--data-binary "<@/path/to/file/with/your/avatar>" `

        `--url 'https://your-domain.atlassian.net/rest/api/3/universal_avatar/type/{type}/owner/{entityId}'`

        The avatar is cropped to a square. If no crop parameters are specified, the square originates at the top left of the image. The length of the square's sides is set to the smaller of the height or width of the image.

        The cropped image is then used to create avatars of 16x16, 24x24, 32x32, and 48x48 in size.

        After creating the avatar use:

         *  [Update issue type](#api-rest-api-3-issuetype-id-put) to set it as the issue type's displayed avatar.
         *  [Set project avatar](#api-rest-api-3-project-projectIdOrKey-avatar-put) to set it as the project's displayed avatar.
         *  [Update priority](#api-rest-api-3-priority-id-put) to set it as the priority's displayed avatar.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: storeAvatar
      parameters:
        - description: The avatar type.
          in: path
          name: type
          required: true
          schema:
            enum:
              - project
              - issuetype
              - priority
            type: string
        - description: The ID of the item the avatar is associated with.
          in: path
          name: entityId
          required: true
          schema:
            type: string
        - description: The X coordinate of the top-left corner of the crop region.
          in: query
          name: x
          schema:
            default: 0
            format: int32
            type: integer
        - description: The Y coordinate of the top-left corner of the crop region.
          in: query
          name: 'y'
          schema:
            default: 0
            format: int32
            type: integer
        - description: The length of each side of the crop region.
          in: query
          name: size
          required: true
          schema:
            default: 0
            format: int32
            type: integer
      requestBody:
        content:
          '*/*':
            schema: {}
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"id":"1010","isDeletable":true,"isSelected":false,"isSystemAvatar":false}'
              schema:
                $ref: '#/components/schemas/Avatar'
          description: Returned if the request is successful.
        '400':
          description: |-
            Returned if:

             *  an image isn't included in the request.
             *  the image type is unsupported.
             *  the crop parameters extend the crop area beyond the edge of the image.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have the necessary permissions.
        '404':
          description: Returned if the avatar type is invalid, the associated item ID is missing, or the item is not found.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
        - {}
      summary: Load avatar
      tags:
        - Avatars
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - write:avatar:jira
            - read:avatar:jira
          state: Beta
      x-atlassian-connect-scope: ADMIN
