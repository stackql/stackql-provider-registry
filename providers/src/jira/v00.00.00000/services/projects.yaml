  /rest/api/3/component/{id}/relatedIssueCounts:
    get:
      deprecated: false
      description: |-
        Returns the counts of issues assigned to the component.

        This operation can be accessed anonymously.

        **Deprecation notice:** The required OAuth 2.0 scopes will be updated on June 15, 2024.

         *  **Classic**: `read:jira-work`
         *  **Granular**: `read:field:jira`, `read:project.component:jira`

        **[Permissions](#permissions) required:** None.
      operationId: getComponentRelatedIssues
      parameters:
        - description: The ID of the component.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"issueCount":23,"self":"https://your-domain.atlassian.net/rest/api/3/component/10000"}'
              schema:
                $ref: '#/components/schemas/ComponentIssuesCount'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '404':
          description: Returned if the component is not found.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get component issues count
      tags:
        - Project components
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:field:jira
            - read:project.component:jira
          state: Beta
      x-atlassian-connect-scope: READ
  /rest/api/3/policies:
    get:
      deprecated: false
      description: |-
        Returns a paginated summary of all known policies, including their names, descriptions, and which projects each policy is assigned to.

        Omit cursor for the first page and pass the returned \{@code nextPageCursor\} for subsequent pages. The legacy \{@code startAt\} and \{@code total\} fields are null because an offset and total are not available in cursor mode.
      operationId: listPolicies
      parameters:
        - description: legacy 0-based offset (default 0); only 0 is accepted in cursor mode
          in: query
          name: startAt
          schema:
            default: 0
            format: int64
            type: integer
        - description: the maximum number of items to return per page (default 50; cursor max 50)
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
        - description: opaque cursor returned by the previous page, absent for the first page
          in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySummaryResponse'
          description: 200 response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 400 response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 401 response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 403 response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 500 response
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
      summary: Get all policies
      tags:
        - Policies
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/policies/project/{projectIdOrKey}:
    get:
      deprecated: false
      description: Returns the policies applied to a project.
      operationId: getPolicyState
      parameters:
        - description: project ID or project key
          in: path
          name: projectIdOrKey
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPolicyStateResponse'
          description: 200 response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 401 response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 403 response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 404 response
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-project
      summary: Get project policy state
      tags:
        - Policies
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/policies/project/{projectIdOrKey}/policies:
    put:
      deprecated: false
      description: |-
        Sets the complete set of policies on a project (full replacement).

        A project may have at most one policy assigned. Jira Admin only.
      operationId: setProjectPolicies
      parameters:
        - description: project ID or project key
