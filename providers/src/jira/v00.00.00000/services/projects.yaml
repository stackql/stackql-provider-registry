  /rest/api/3/project/{projectIdOrKey}/delete:
    post:
      deprecated: false
      description: |-
        Deletes a project asynchronously.

        This operation is:

         *  transactional, that is, if part of the delete fails the project is not deleted.
         *  [asynchronous](#async). Follow the `location` link in the response to determine the status of the task and use [Get task](#api-rest-api-3-task-taskId-get) to obtain subsequent updates.

        **[Permissions](#permissions) required:** *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg).
      operationId: deleteProjectAsynchronously
      parameters:
        - description: The project ID or project key (case sensitive).
          in: path
          name: projectIdOrKey
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The 303 See Other redirect to the task (GET /rest/api/3/task/{taskId}) is followed; the body is the task progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProgressBeanObject'
        '303':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProgressBeanObject'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request is not valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '404':
          description: Returned if the project is not found or the user does not have the necessary permission.
      security:
        - basicAuth: []
        - OAuth2:
            - manage:jira-configuration
        - {}
      summary: Delete project asynchronously
      tags:
        - Projects
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - manage:jira-configuration
          state: Current
        - scheme: OAuth2
          scopes:
            - write:project:jira
            - write:project.property:jira
          state: Beta
      x-experimental: true
      x-atlassian-connect-scope: PROJECT_ADMIN
