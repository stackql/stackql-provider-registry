  /rest/api/3/project/{projectIdOrKey}/version:
    get:
      deprecated: false
      description: |-
        Returns a [paginated](#pagination) list of all versions in a project. See the [Get project versions](#api-rest-api-3-project-projectIdOrKey-versions-get) resource if you want to get a full list of versions without pagination.

        This operation can be accessed anonymously.

        **[Permissions](#permissions) required:** *Browse Projects* [project permission](https://confluence.atlassian.com/x/yodKLg) for the project.
      operationId: getProjectVersionsPaginated
      parameters:
        - description: The project ID or project key (case sensitive).
          in: path
          name: projectIdOrKey
          required: true
          schema:
            type: string
        - description: The index of the first item to return in a page of results (page offset).
          in: query
          name: startAt
          schema:
            default: 0
            format: int64
            type: integer
        - description: The maximum number of items to return per page.
          in: query
          name: maxResults
          schema:
            default: 50
            format: int32
            type: integer
        - description: |-
            [Order](#ordering) the results by a field:

             *  `description` Sorts by version description.
             *  `name` Sorts by version name.
             *  `releaseDate` Sorts by release date, starting with the oldest date. Versions with no release date are listed last.
             *  `sequence` Sorts by the order of appearance in the user interface.
             *  `startDate` Sorts by start date, starting with the oldest date. Versions with no start date are listed last.
          in: query
          name: orderBy
          schema:
            enum:
              - description
              - '-description'
              - +description
              - name
              - '-name'
              - +name
              - releaseDate
              - '-releaseDate'
              - +releaseDate
              - sequence
              - '-sequence'
              - +sequence
              - startDate
              - '-startDate'
              - +startDate
            type: string
        - description: Filter the results using a literal string. Versions with matching `name` or `description` are returned (case insensitive).
          in: query
          name: query
          schema:
            type: string
        - description: A list of status values used to filter the results by version status. This parameter accepts a comma-separated list. The status values are `released`, `unreleased`, and `archived`.
          in: query
          name: status
          schema:
            type: string
        - description: |-
            Use [expand](#expansion) to include additional information in the response. This parameter accepts a comma-separated list. Expand options include:

             *  `issuesstatus` Returns the number of issues in each status category for each version.
             *  `operations` Returns actions that can be performed on the specified version.
             *  `driver` Returns the Atlassian account ID of the version driver.
             *  `approvers` Returns a list containing the approvers for this version.
          in: query
          name: expand
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":false,"maxResults":2,"nextPage":"https://your-domain.atlassian.net/rest/api/3/project/PR/version?startAt=2&maxResults=2","self":"https://your-domain.atlassian.net/rest/api/3/project/PR/version?startAt=0&maxResults=2","startAt":0,"total":7,"values":[{"archived":false,"description":"An excellent version","id":"10000","name":"New Version 1","overdue":true,"projectId":10000,"releaseDate":"2010-07-06","released":true,"self":"https://your-domain.atlassian.net/rest/api/3/version/10000","userReleaseDate":"6/Jul/2010"},{"archived":false,"description":"Minor Bugfix version","id":"10010","issuesStatusForFixVersion":{"done":100,"inProgress":20,"toDo":10,"unmapped":0},"name":"Next Version","overdue":false,"projectId":10000,"released":false,"self":"https://your-domain.atlassian.net/rest/api/3/version/10010"}]}'
              schema:
                $ref: '#/components/schemas/PageBeanVersion'
          description: Returned if the request is successful.
        '404':
          description: Returned if the project is not found or the user does not have permission to view it.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get project versions paginated
      tags:
        - Project versions
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:project-version:jira
          state: Beta
      x-atlassian-connect-scope: READ
