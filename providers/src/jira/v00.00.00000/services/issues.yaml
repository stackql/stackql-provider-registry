    ContentItem:
      additionalProperties: false
      description: Represents the content to redact
      properties:
        entityId:
          description: |-
            The ID of the content entity.

             *  For redacting an issue field, this will be the field ID (e.g., summary, customfield\_10000).
             *  For redacting a comment, this will be the comment ID.
             *  For redacting a worklog, this will be the worklog ID.
          example: summary
          type: string
        entityType:
          description: |-
            The type of the entity to redact; It will be one of the following:

             *  **issuefieldvalue** \- To redact in issue fields
             *  **issue-comment** \- To redact in issue comments.
             *  **issue-worklog** \- To redact in issue worklogs
          enum:
            - issuefieldvalue
            - issue-comment
            - issue-worklog
          type: string
        id:
          description: This would be the issue ID
          example: '10000'
          type: string
      required:
        - entityId
        - entityType
        - id
      type: object
    RedactionPosition:
      additionalProperties: false
      description: Represents the position of the redaction
      properties:
        adfPointer:
          description: The ADF pointer indicating the position of the text to be redacted. This is only required when redacting from rich text(ADF) fields. For plain text fields, this field can be omitted.
          example: /content/0/content/0/text
          type: string
        expectedText:
          description: The text which will be redacted, encoded using SHA256 hash and Base64 digest
          example: ODFiNjM3ZDhmY2QyYzZkYTYzNTllNjk2MzExM2ExMTcwZGU3OTVlNGI3MjViODRkMWUwYjRjZmQ5ZWM1OGNlOQ==
          type: string
        from:
          description: The start index(inclusive) for the redaction in specified content
          example: 14
          format: int32
          type: integer
        to:
          description: The ending index(exclusive) for the redaction in specified content
          example: 20
          format: int32
          type: integer
      required:
