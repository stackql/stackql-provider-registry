openapi: 3.0.1
info:
  title: Jira Issues
  description: 'Issues and everything attached to them: JQL issue search, comments, worklogs, transitions, changelogs, links, remote links, watchers, votes, attachment metadata, properties, labels and bulk operations.'
  version: 1001.0.0-SNAPSHOT-a7b4351c3da87b54b4403678bdb0ff81c88ca648
  x-stackQL-sourceSpec: platform
paths:
  /rest/api/3/attachment/content/{id}:
    get:
      deprecated: false
      description: |-
        Returns the contents of an attachment. A `Range` header can be set to define a range of bytes within the attachment to download. See the [HTTP Range header standard](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Range) for details.

        To return a thumbnail of the attachment, use [Get attachment thumbnail](#api-rest-api-3-attachment-thumbnail-id-get).

        This operation can be accessed anonymously.

        **[Permissions](#permissions) required:** For the issue containing the attachment:

         *  *Browse projects* [project permission](https://confluence.atlassian.com/x/yodKLg) for the project that the issue is in.
         *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
         *  If attachments are added in private comments, the comment-level restriction will be applied.
      operationId: getAttachmentContent
      parameters:
        - description: The ID of the attachment.
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Whether a redirect is provided for the attachment download. Clients that do not automatically follow redirects can set this to `false` to avoid making multiple requests to download the attachment.
          in: query
          name: redirect
          schema:
            default: true
            type: boolean
      responses:
        '200':
          description: Returned if the request is successful when `redirect` is set to `false`.
        '206':
          description: Returned if the request is successful when a `Range` header is provided and `redirect` is set to `false`.
        '303':
          description: Returned if the request is successful. See the `Location` header for the download URL.
        '400':
          description: Returned if the range supplied in the `Range` header is malformed.
        '401':
          description: Returned if the authentication credentials are incorrect.
        '403':
          description: The user does not have the necessary permission.
        '404':
          description: |-
            Returned if:

             *  the attachment is not found.
             *  attachments are disabled in the Jira settings.
        '416':
          description: Returned if the server is unable to satisfy the range of bytes provided.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get attachment content
      tags:
        - Issue attachments
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:attachment:jira
          state: Beta
      x-atlassian-connect-scope: READ
  /rest/api/3/attachment/meta:
    get:
      deprecated: false
      description: |-
        Returns the attachment settings, that is, whether attachments are enabled and the maximum attachment size allowed.

        Note that there are also [project permissions](https://confluence.atlassian.com/x/yodKLg) that restrict whether users can create and delete attachments.

        This operation can be accessed anonymously.

        **[Permissions](#permissions) required:** None.
      operationId: getAttachmentMeta
      parameters: []
      responses:
        '200':
          content:
            application/json:
              example: '{"enabled":true,"uploadLimit":1000000}'
              schema:
                $ref: '#/components/schemas/AttachmentSettings'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get Jira attachment settings
      tags:
        - Issue attachments
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:instance-configuration:jira
          state: Beta
      x-atlassian-connect-scope: READ
  /rest/api/3/attachment/thumbnail/{id}:
    get:
      deprecated: false
      description: |-
        Returns the thumbnail of an attachment.

        To return the attachment contents, use [Get attachment content](#api-rest-api-3-attachment-content-id-get).

        This operation can be accessed anonymously.

        **[Permissions](#permissions) required:** For the issue containing the attachment:

         *  *Browse projects* [project permission](https://confluence.atlassian.com/x/yodKLg) for the project that the issue is in.
         *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
         *  If attachments are added in private comments, the comment-level restriction will be applied.
      operationId: getAttachmentThumbnail
      parameters:
        - description: The ID of the attachment.
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Whether a redirect is provided for the attachment download. Clients that do not automatically follow redirects can set this to `false` to avoid making multiple requests to download the attachment.
          in: query
          name: redirect
          schema:
            default: true
            type: boolean
        - description: Whether a default thumbnail is returned when the requested thumbnail is not found.
          in: query
          name: fallbackToDefault
          schema:
            default: true
            type: boolean
        - description: The maximum width to scale the thumbnail to.
          in: query
          name: width
          schema:
            format: int32
            type: integer
        - description: The maximum height to scale the thumbnail to.
          in: query
          name: height
          schema:
            format: int32
            type: integer
      responses:
        '200':
          description: Returned if the request is successful when `redirect` is set to `false`.
        '303':
          description: Returned if the request is successful. See the `Location` header for the download URL.
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the authentication credentials are incorrect.
        '403':
          description: The user does not have the necessary permission.
        '404':
          description: |-
            Returned if:

             *  the attachment is not found.
             *  attachments are disabled in the Jira settings.
             *  `fallbackToDefault` is `false` and the request thumbnail cannot be downloaded.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get attachment thumbnail
      tags:
        - Issue attachments
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:attachment:jira
          state: Beta
      x-atlassian-connect-scope: READ
  /rest/api/3/attachment/{id}:
    delete:
      deprecated: false
      description: |-
        Deletes an attachment from an issue.

        This operation can be accessed anonymously.

        **[Permissions](#permissions) required:** For the project holding the issue containing the attachment:

         *  *Delete own attachments* [project permission](https://confluence.atlassian.com/x/yodKLg) to delete an attachment created by the calling user.
         *  *Delete all attachments* [project permission](https://confluence.atlassian.com/x/yodKLg) to delete an attachment created by any user.
      operationId: removeAttachment
      parameters:
        - description: The ID of the attachment.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Returned if the request is successful.
        '403':
          description: Returned if the user does not have the necessary permission.
        '404':
          description: |-
            Returned if:

             *  the attachment is not found.
             *  attachments are disabled in the Jira settings.
      security:
        - basicAuth: []
        - OAuth2:
            - write:jira-work
        - {}
      summary: Delete attachment
      tags:
        - Issue attachments
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - write:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - delete:attachment:jira
          state: Beta
      x-atlassian-connect-scope: DELETE
    get:
      deprecated: false
      description: |-
        Returns the metadata for an attachment. Note that the attachment itself is not returned.

        This operation can be accessed anonymously.

        **[Permissions](#permissions) required:**

         *  *Browse projects* [project permission](https://confluence.atlassian.com/x/yodKLg) for the project that the issue is in.
         *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
         *  If attachments are added in private comments, the comment-level restriction will be applied.
      operationId: getAttachment
      parameters:
        - description: The ID of the attachment.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"author":{"accountId":"5b10a2844c20165700ede21g","accountType":"atlassian","active":false,"avatarUrls":{"16x16":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=16&s=16","24x24":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=24&s=24","32x32":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=32&s=32","48x48":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=48&s=48"},"displayName":"Mia Krystof","key":"","name":"","self":"https://your-domain.atlassian.net/rest/api/3/user?accountId=5b10a2844c20165700ede21g"},"content":"https://your-domain.atlassian.net/jira/rest/api/3/attachment/content/10000","created":"2022-10-06T07:32:47.000+0000","filename":"picture.jpg","id":10000,"mimeType":"image/jpeg","self":"https://your-domain.atlassian.net/rest/api/3/attachments/10000","size":23123,"thumbnail":"https://your-domain.atlassian.net/jira/rest/api/3/attachment/thumbnail/10000"}'
              schema:
                $ref: '#/components/schemas/AttachmentMetadata'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have the necessary permission.
        '404':
          description: |-
            Returned if:

             *  the attachment is not found.
             *  attachments are disabled in the Jira settings.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get attachment metadata
      tags:
        - Issue attachments
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:attachment:jira
            - read:user:jira
            - read:application-role:jira
            - read:avatar:jira
            - read:group:jira
          state: Beta
      x-atlassian-connect-scope: READ
  /rest/api/3/attachment/{id}/expand/human:
    get:
      deprecated: false
      description: |-
        Returns the metadata for the contents of an attachment, if it is an archive, and metadata for the attachment itself. For example, if the attachment is a ZIP archive, then information about the files in the archive is returned and metadata for the ZIP archive. Currently, only the ZIP archive format is supported.

        Use this operation to retrieve data that is presented to the user, as this operation returns the metadata for the attachment itself, such as the attachment's ID and name. Otherwise, use [ Get contents metadata for an expanded attachment](#api-rest-api-3-attachment-id-expand-raw-get), which only returns the metadata for the attachment's contents.

        This operation can be accessed anonymously.

        **[Permissions](#permissions) required:** For the issue containing the attachment:

         *  *Browse projects* [project permission](https://confluence.atlassian.com/x/yodKLg) for the project that the issue is in.
         *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
         *  If attachments are added in private comments, the comment-level restriction will be applied.
      operationId: expandAttachmentForHumans
      parameters:
        - description: The ID of the attachment.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"entries":[{"index":0,"label":"MG00N067.JPG","mediaType":"image/jpeg","path":"MG00N067.JPG","size":"119 kB"},{"index":1,"label":"Allegro from Duet in C Major.mp3","mediaType":"audio/mpeg","path":"Allegro from Duet in C Major.mp3","size":"1.36 MB"},{"index":2,"label":"long/path/thanks/to/.../reach/the/leaf.txt","mediaType":"text/plain","path":"long/path/thanks/to/lots/of/subdirectories/inside/making/it/quite/hard/to/reach/the/leaf.txt","size":"0.0 k"}],"id":7237823,"mediaType":"application/zip","name":"images.zip","totalEntryCount":39}'
              schema:
                $ref: '#/components/schemas/AttachmentArchiveMetadataReadable'
          description: Returned if the request is successful. If an empty list is returned in the response, the attachment is empty, corrupt, or not an archive.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: The user does not have the necessary permission.
        '404':
          description: |-
            Returned if:

             *  the attachment is not found.
             *  attachments are disabled in the Jira settings.
        '409':
          description: Returned if the attachment is an archive, but not a supported archive format.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get all metadata for an expanded attachment
      tags:
        - Issue attachments
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:attachment:jira
          state: Beta
      x-experimental: true
      x-atlassian-connect-scope: READ
  /rest/api/3/attachment/{id}/expand/raw:
    get:
      deprecated: false
      description: |-
        Returns the metadata for the contents of an attachment, if it is an archive. For example, if the attachment is a ZIP archive, then information about the files in the archive is returned. Currently, only the ZIP archive format is supported.

        Use this operation if you are processing the data without presenting it to the user, as this operation only returns the metadata for the contents of the attachment. Otherwise, to retrieve data to present to the user, use [ Get all metadata for an expanded attachment](#api-rest-api-3-attachment-id-expand-human-get) which also returns the metadata for the attachment itself, such as the attachment's ID and name.

        This operation can be accessed anonymously.

        **[Permissions](#permissions) required:** For the issue containing the attachment:

         *  *Browse projects* [project permission](https://confluence.atlassian.com/x/yodKLg) for the project that the issue is in.
         *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
         *  If attachments are added in private comments, the comment-level restriction will be applied.
      operationId: expandAttachmentForMachines
      parameters:
        - description: The ID of the attachment.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"entries":[{"entryIndex":0,"mediaType":"audio/mpeg","name":"Allegro from Duet in C Major.mp3","size":1430174},{"entryIndex":1,"mediaType":"text/rtf","name":"lrm.rtf","size":331}],"totalEntryCount":24}'
              schema:
                $ref: '#/components/schemas/AttachmentArchiveImpl'
          description: Returned if the request is successful. If an empty list is returned in the response, the attachment is empty, corrupt, or not an archive.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: The user does not have the necessary permission.
        '404':
          description: |-
            Returned if:

             *  the attachment is not found.
             *  attachments are disabled in the Jira settings.
        '409':
          description: Returned if the attachment is an archive, but not a supported archive format.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
        - {}
      summary: Get contents metadata for an expanded attachment
      tags:
        - Issue attachments
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:attachment:jira
          state: Beta
      x-experimental: true
      x-atlassian-connect-scope: READ
  /rest/api/3/bulk/issues/delete:
    post:
      deprecated: false
      description: |-
        Use this API to submit a bulk delete request. You can delete up to 1,000 issues in a single operation.

        **[Permissions](#permissions) required:**

         *  Global bulk change [permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-global-permissions/).
         *  Delete [issues permission](https://support.atlassian.com/jira-cloud-administration/docs/permissions-for-company-managed-projects/#Delete-issues/) in all projects that contain the selected issues.
         *  Browse [project permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-project-permissions/) in all projects that contain the selected issues.
         *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
      operationId: submitBulkDelete
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              selectedIssueIdsOrKeys:
                - '10001'
                - '10002'
              sendBulkNotification: false
            schema:
              $ref: '#/components/schemas/IssueBulkDeletePayload'
        description: The request body containing the issues to be deleted.
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"taskId":"10641"}'
              schema:
                $ref: '#/components/schemas/SubmittedBulkOperation'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errors":[{"message":"Some of the issues in the issueIdsOrKeys are not valid"}]}'
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the request is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the user does not have the necessary permission.
      security:
        - basicAuth: []
        - OAuth2:
            - write:jira-work
      summary: Bulk delete issues
      tags:
        - Issue bulk operations
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - write:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - write:issue:jira
            - read:issue:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/bulk/issues/fields:
    get:
      deprecated: false
      description: |-
        Use this API to get a list of fields visible to the user to perform bulk edit operations. You can pass single or multiple issues in the query to get eligible editable fields. This API uses pagination to return responses, delivering 50 fields at a time.

        **[Permissions](#permissions) required:**

         *  Global bulk change [permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-global-permissions/).
         *  Browse [project permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-project-permissions/) in all projects that contain the selected issues.
         *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
         *  Depending on the field, any field-specific permissions required to edit it.
      operationId: getBulkEditableFields
      parameters:
        - description: The IDs or keys of the issues to get editable fields from.
          in: query
          name: issueIdsOrKeys
          required: true
          schema:
            type: string
        - description: (Optional)The text to search for in the editable fields.
          in: query
          name: searchText
          schema:
            type: string
        - description: (Optional)The end cursor for use in pagination.
          in: query
          name: endingBefore
          schema:
            type: string
        - description: (Optional)The start cursor for use in pagination.
          in: query
          name: startingAfter
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"fields":[{"id":"assignee","isRequired":false,"name":"Assignee","searchUrl":"https://your-domain.atlassian.net/rest/api/3/user/assignable/multiProjectSearch?projectKeys=KAN&query=","type":"assignee"},{"id":"components","isRequired":false,"multiSelectFieldOptions":["ADD","REMOVE","REPLACE","REMOVE_ALL"],"name":"Components","type":"components","unavailableMessage":"{0}NOTE{1}: The project of the selected issue(s) does not have any components."},{"fieldOptions":[{"description":"This problem will block progress.","id":"1","priority":"Highest"},{"description":"Has the potential to affect progress.","id":"2","priority":"Lowest"},{"description":"Trivial problem with little or no impact on progress.","id":"3","priority":"Medium"}],"id":"priority","isRequired":false,"name":"Priority","type":"priority"}]}'
              schema:
                $ref: '#/components/schemas/BulkEditGetFields'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the user does not have the necessary permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if no editable fields are found for the provided issue IDs.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
      summary: Get bulk editable fields
      tags:
        - Issue bulk operations
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:issue:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
    post:
      deprecated: false
      description: |-
        Use this API to submit a bulk edit request and simultaneously edit multiple issues. There are limits applied to the number of issues and fields that can be edited. A single request can accommodate a maximum of 1000 issues (including subtasks) and 200 fields.

        **[Permissions](#permissions) required:**

         *  Global bulk change [permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-global-permissions/).
         *  Browse [project permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-project-permissions/) in all projects that contain the selected issues.
         *  Edit [issues permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-project-permissions/) in all projects that contain the selected issues.
         *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
      operationId: submitBulkEdit
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBulkEditPayload'
        description: The request body containing the issues to be edited and the new field values.
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"taskId":"10641"}'
              schema:
                $ref: '#/components/schemas/SubmittedBulkOperation'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errors":[{"message":"The following editedFieldInput values are not listed as selectedActions : issuetype"}]}'
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the request is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the authentication credentials are incorrect or missing.
      security:
        - basicAuth: []
        - OAuth2:
            - write:jira-work
      summary: Bulk edit issues
      tags:
        - Issue bulk operations
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - write:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - write:issue:jira
            - read:issue:jira
          state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/bulk/issues/move:
    post:
      deprecated: false
      description: |-
        Use this API to submit a bulk issue move request. You can move multiple issues from multiple projects in a single request, but they must all be moved to a single project, issue type, and parent. You can't move more than 1000 issues (including subtasks) at once.

        #### Scenarios: ####

        This is an early version of the API and it doesn't have full feature parity with the Bulk Move UI experience.

         *  Moving issue of type A to issue of type B in the same project or a different project: `SUPPORTED`
         *  Moving multiple issues of type A in one or more projects to multiple issues of type B in one of the source projects or a different project: `SUPPORTED`
         *  Moving issues of multiple issue types in one or more projects to issues of a single issue type in one of the source project or a different project: **`SUPPORTED`**  
            E.g. Moving issues of story and task issue types in project 1 and project 2 to issues of task issue type in project 3
         *  Moving a standard parent issue of type A with its multiple subtask issue types in one project to standard issue of type B and multiple subtask issue types in the same project or a different project: `SUPPORTED`
         *  Moving standard issues with their subtasks to a parent issue in the same project or a different project without losing their relation: `SUPPORTED`
         *  Moving an epic issue with its child issues to a different project without losing their relation: `SUPPORTED`  
            This usecase is **supported using multiple requests**. Move the epic in one request and then move the children in a separate request with target parent set to the epic issue id  
              
            (Alternatively, move them individually and stitch the relationship back with the Bulk Edit API)

        #### Limits applied to bulk issue moves: ####

        When using the bulk move, keep in mind that there are limits on the number of issues and fields you can include.

         *  You can move up to 1,000 issues in a single operation, including any subtasks.
         *  The total combined number of fields across all issues must not exceed 1,500,000. For example, if each issue includes 15,000 fields, then the maximum number of issues that can be moved is 100.

        **[Permissions](#permissions) required:**

         *  Global bulk change [permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-global-permissions/).
         *  Move [issues permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-project-permissions/) in source projects.
         *  Create [issues permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-project-permissions/) in destination projects.
         *  Browse [project permission](https://support.atlassian.com/jira-cloud-administration/docs/manage-project-permissions/) in destination projects, if moving subtasks only.
         *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
      operationId: submitBulkMove
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              sendBulkNotification: true
              targetToSourcesMapping:
                PROJECT-KEY,10001:
                  inferClassificationDefaults: false
                  inferFieldDefaults: false
                  inferStatusDefaults: false
                  inferSubtaskTypeDefault: true
                  issueIdsOrKeys:
                    - ISSUE-1
