    User:
      additionalProperties: false
      description: |-
        A user with details as permitted by the user's Atlassian Account privacy settings. However, be aware of these exceptions:

         *  User record deleted from Atlassian: This occurs as the result of a right to be forgotten request. In this case, `displayName` provides an indication and other parameters have default values or are blank (for example, email is blank).
         *  User record corrupted: This occurs as a results of events such as a server import and can only happen to deleted users. In this case, `accountId` returns *unknown* and all other parameters have fallback values.
         *  User record unavailable: This usually occurs due to an internal service outage. In this case, all parameters have fallback values.
      properties:
        accountId:
          description: The account ID of the user, which uniquely identifies the user across all Atlassian products. For example, *5b10ac8d82e05b22cc7d4ef5*. Required in requests.
          maxLength: 128
          type: string
        accountType:
          description: |-
            The user account type. Can take the following values:

             *  `atlassian` regular Atlassian user account
             *  `app` system account used for Connect applications and OAuth to represent external systems
             *  `customer` Jira Service Desk account representing an external service desk
          enum:
            - atlassian
            - app
            - customer
            - unknown
          readOnly: true
          type: string
        active:
          description: Whether the user is active.
          readOnly: true
          type: boolean
        appType:
          description: |-
            The app type of the user account when accountType is 'app'. Can take the following values:

             *  `service` Service Account
             *  `agent` Rovo Agent Account
             *  `unknown` Unknown app type
          readOnly: true
          type: string
        applicationRoles:
          description: The application roles the user is assigned to.
          readOnly: true
          additionalProperties: false
          properties:
            callback:
              $ref: '#/components/schemas/ListWrapperCallbackApplicationRole'
            items:
              items:
                $ref: '#/components/schemas/ApplicationRole'
              type: array
            max-results:
              format: int32
              type: integer
              xml:
                attribute: true
                name: max-results
            pagingCallback:
              $ref: '#/components/schemas/ListWrapperCallbackApplicationRole'
            size:
              format: int32
              type: integer
              xml:
                attribute: true
          type: object
          xml:
            name: list
        avatarUrls:
          description: The avatars of the user.
          readOnly: true
          additionalProperties: false
          properties:
            16x16:
              description: The URL of the item's 16x16 pixel avatar.
              format: uri
              type: string
            24x24:
              description: The URL of the item's 24x24 pixel avatar.
              format: uri
              type: string
            32x32:
              description: The URL of the item's 32x32 pixel avatar.
              format: uri
              type: string
            48x48:
              description: The URL of the item's 48x48 pixel avatar.
              format: uri
              type: string
          type: object
        displayName:
          description: The display name of the user. Depending on the user’s privacy setting, this may return an alternative value.
          readOnly: true
          type: string
        emailAddress:
          description: The email address of the user. Depending on the user’s privacy setting, this may be returned as null.
          readOnly: true
          type: string
        groups:
          description: The groups that the user belongs to.
          readOnly: true
          additionalProperties: false
          properties:
            callback:
              $ref: '#/components/schemas/ListWrapperCallbackGroupName'
            items:
              items:
                $ref: '#/components/schemas/GroupName'
              type: array
            max-results:
              format: int32
              type: integer
              xml:
                attribute: true
                name: max-results
            pagingCallback:
              $ref: '#/components/schemas/ListWrapperCallbackGroupName'
            size:
              format: int32
              type: integer
              xml:
                attribute: true
          type: object
          xml:
            name: list
        guest:
          description: Whether the user is a guest.
          readOnly: true
          type: boolean
        key:
          description: This property is no longer available and will be removed from the documentation soon. See the [deprecation notice](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.
          type: string
        locale:
          description: The locale of the user. Depending on the user’s privacy setting, this may be returned as null.
          readOnly: true
          type: string
        name:
          description: This property is no longer available and will be removed from the documentation soon. See the [deprecation notice](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.
          type: string
        self:
          description: The URL of the user.
          format: uri
          readOnly: true
          type: string
        timeZone:
          description: The time zone specified in the user's profile. If the user's time zone is not visible to the current user (due to user's profile setting), or if a time zone has not been set, the instance's default time zone will be returned.
          readOnly: true
          type: string
      type: object
      xml:
        name: user
