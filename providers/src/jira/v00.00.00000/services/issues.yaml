  /rest/api/3/issues/archive/export:
    put:
      deprecated: false
      description: |
        Enables admins to retrieve details of all archived issues. Upon a successful request, the admin who submitted it will receive an email with a link to download a CSV file with the issue details.

        Note that this API only exports the values of system fields and archival-specific fields (`ArchivedBy` and `ArchivedDate`). Custom fields aren't supported.

        **[Permissions](#permissions) required:** Jira admin or site admin: [global permission](https://confluence.atlassian.com/x/x4dKLg)

        **License required:** Premium or Enterprise

        **Signed-in users only:** This API can't be accessed anonymously.

        **Rate limiting:** Only a single request can be active at any given time.

          
      operationId: exportArchivedIssues
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              archivedBy:
                - uuid-rep-001
                - uuid-rep-002
              archivedDate:
                dateAfter: '2023-01-01'
                dateBefore: '2023-01-12'
              archivedDateRange:
                dateAfter: '2023-01-01'
                dateBefore: '2023-01-12'
              issueTypes:
                - '10001'
                - '10002'
              projects:
                - FOO
                - BAR
              reporters:
                - uuid-rep-001
                - uuid-rep-002
            schema:
              $ref: '#/components/schemas/ArchivedIssuesFilterRequest'
        description: You can filter the issues in your request by the `projects`, `archivedBy`, `archivedDate`, `issueTypes`, and `reporters` fields. All filters are optional. If you don't provide any filters, you'll get a list of up to one million archived issues.
        required: true
      responses:
        '202':
          content:
            application/json:
              example: '{"payload":"{projects=[FOO, BAR], reporters=[uuid-rep-001, uuid-rep-002], issueTypes=[10001, 10002], archivedDate={dateAfterInstant=2023-01-01, dateBeforeInstant=2023-01-12}, archivedBy=[uuid-rep-001, uuid-rep-002]}","progress":0,"status":"ENQUEUED","submittedTime":1623230887000,"taskId":"10990"}'
              schema:
                $ref: '#/components/schemas/ExportArchivedIssuesTaskProgressResponse'
          description: Returns the details of your export task. You can use the [get task](https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-tasks/#api-rest-api-3-task-taskid-get) API to view the progress of your request.
        '400':
          content:
            application/json:
              example: '["Your filter contains invalid values {errorMessage}"]'
          description: |-
            Returned when:

             *  The request is invalid, or the filters provided are incorrect
             *  You requested too many issues for export. The limit is one million issues per request
        '401':
          content:
            application/json:
              example: '{"errorMessages":["User is not logged in."],"errors":{}}'
          description: Returned if no issues were unarchived because the provided authentication credentials are either missing or invalid.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["User is not an admin."],"errors":{}}'
          description: Returned if no issues were unarchived because the user lacks the required Jira admin or site admin permissions.
        '412':
          content:
            application/json:
              example: '{"errorMessages":["An issue archival task is already running with ID 1010. To start a new one, cancel the task or wait for it to finish."],"errors":{}}'
          description: Returned if a request to export archived issues is already running.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
      summary: Export archived issue(s)
      tags:
        - Issues
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:issue:jira
          state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/jql/match:
    post:
      deprecated: false
      description: |-
        Checks whether one or more issues would be returned by one or more JQL queries. Up to 10 JQL queries can be specified and up to 50 issue IDs included in the request.

        **[Permissions](#permissions) required:** None, however, issues are only matched against JQL queries where the user has:

         *  *Browse projects* [project permission](https://confluence.atlassian.com/x/yodKLg) for the project that the issue is in.
         *  If [issue-level security](https://confluence.atlassian.com/x/J4lKLg) is configured, issue-level security permission to view the issue.
      operationId: matchIssues
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              issueIds:
                - 10001
                - 1000
                - 10042
              jqls:
                - project = FOO
                - issuetype = Bug
                - summary ~ "some text" AND project in (FOO, BAR)
            schema:
              $ref: '#/components/schemas/IssuesAndJQLQueries'
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"matches":[{"matchedIssues":[10000,10004],"errors":[]},{"matchedIssues":[100134,10025,10236],"errors":[]},{"matchedIssues":[],"errors":[]},{"matchedIssues":[],"errors":["Invalid JQL: broken = value"]}]}'
              schema:
                $ref: '#/components/schemas/IssueMatches'
          description: Returned if the request is successful.
        '400':
          description: Returned if `jqls` contains more than 10 JQL queries or `issueIds` contains more than 50 issue IDs.
      security:
        - basicAuth: []
        - OAuth2:
            - read:jira-work
      summary: Check issues against JQL
      tags:
        - Issue search
      x-atlassian-oauth2-scopes:
        - scheme: OAuth2
          scopes:
            - read:jira-work
          state: Current
        - scheme: OAuth2
          scopes:
            - read:issue-details:jira
          state: Beta
      x-atlassian-connect-scope: READ
