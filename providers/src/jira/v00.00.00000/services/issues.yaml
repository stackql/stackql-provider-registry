          description: Continuation token to fetch the next page. If this result represents the last or the only page this token will be null. This token will expire in 7 days.
          readOnly: true
          type: string
        schema:
          additionalProperties:
            $ref: '#/components/schemas/JsonTypeBean'
          description: The schema describing the field types in the search results.
          readOnly: true
          type: object
        warnings:
          description: Experimental. Warnings generated during the search, e.g. when a JQL clause exceeded its argument limit or when the result set was truncated due to an ingestion limit. This field is currently rolling out behind a feature flag and may be absent, empty, or change shape without notice until generally available.
          items:
            $ref: '#/components/schemas/SearchWarning'
          readOnly: true
          type: array
      type: object
    SearchAndReconcileRequestBean:
      additionalProperties: false
      properties:
        expand:
          description: |-
            Use [expand](#expansion) to include additional information about issues in the response. Note that, unlike the majority of instances where `expand` is specified, `expand` is defined as a comma-delimited string of values. The expand options are:

             *  `renderedFields` Returns field values rendered in HTML format.
             *  `names` Returns the display name of each field.
             *  `schema` Returns the schema describing a field type.
             *  `transitions` Returns all possible transitions for the issue.
             *  `operations` Returns all possible operations for the issue.
             *  `editmeta` Returns information about how each field can be edited.
             *  `changelog` Returns a list of recent updates to an issue, sorted by date, starting from the most recent.
             *  `versionedRepresentations` Instead of `fields`, returns `versionedRepresentations` a JSON array containing each version of a field's value, with the highest numbered item representing the most recent version.

            Examples: `"names,changelog"` Returns the display name of each field as well as a list of recent updates to an issue.
          type: string
        fields:
          description: |-
            A list of fields to return for each issue. Use it to retrieve a subset of fields. This parameter accepts a comma-separated list. Expand options include:

             *  `*all` Returns all fields.
             *  `*navigable` Returns navigable fields.
             *  `id` Returns only issue IDs.
             *  Any issue field, prefixed with a dash to exclude.

            The default is `id`.

            Examples:

             *  `summary,comment` Returns the summary and comments fields only.
             *  `*all,-comment` Returns all fields except comments.

            Multiple `fields` parameters can be included in a request.

            Note: By default, this resource returns IDs only. This differs from [GET issue](#api-rest-api-3-issue-issueIdOrKey-get) where the default is all fields.
          items:
            type: string
          type: array
        fieldsByKeys:
          description: Reference fields by their key (rather than ID). The default is `false`.
          type: boolean
        includeArchivedProjects:
          description: Whether to also return issues that belong to archived projects. Archived projects are excluded by default. Requires *Browse projects* permission on the archived project. The default is `false`.
          type: boolean
        jql:
          description: |-
            A [JQL](https://confluence.atlassian.com/x/egORLQ) expression. For performance reasons, this parameter requires a bounded query. A bounded query is a query with a search restriction.

             *  Example of an unbounded query: `order by key desc`.
             *  Example of a bounded query: `assignee = currentUser() order by key`.

            Additionally, `orderBy` clause can contain a maximum of 7 fields.
          type: string
        maxResults:
          default: 50
          description: The maximum number of items to return per page. To manage page size, API may return fewer items per page where a large number of fields are requested. The greatest number of items returned per page is achieved when requesting `id` or `key` only. It returns max 5000 issues.
          format: int32
          type: integer
        nextPageToken:
          description: The token for a page to fetch that is not the first page. The first page has a `nextPageToken` of `null`. Use the `nextPageToken` to fetch the next page of issues.
          type: string
        properties:
          description: A list of up to 5 issue properties to include in the results. This parameter accepts a comma-separated list.
          items:
            type: string
          type: array
        reconcileIssues:
          description: Strong consistency issue ids to be reconciled with search results. Accepts max 50 ids. This list of ids should be consistent with each paginated request across different pages.
          items:
            format: int64
            type: integer
          type: array
      type: object
