openapi: 3.0.0
info:
  title: logs API
  description: Search your logs and send them to your Datadog platform over HTTP. See the [Log Management page](https://docs.datadoghq.com/logs/) for more information.
  version: '1.0'
paths:
  /api/v2/logs:
    post:
      description: |-
        Send your logs to your Datadog platform over HTTP. Limits per HTTP request are:

        - Maximum content size per payload (uncompressed): 5MB
        - Maximum size for a single log: 1MB
        - Maximum array size if sending multiple logs in an array: 1000 entries

        Any log exceeding 1MB is accepted and truncated by Datadog:
        - For a single log request, the API truncates the log at 1MB and returns a 2xx.
        - For a multi-logs request, the API processes all logs, truncates only logs larger than 1MB, and returns a 2xx.

        Datadog recommends sending your logs compressed.
        Add the `Content-Encoding: gzip` header to the request when sending compressed logs.
        Log events can be submitted with a timestamp that is up to 18 hours in the past.

        The status codes answered by the HTTP API are:
        - 202: Accepted: the request has been accepted for processing
        - 400: Bad request (likely an issue in the payload formatting)
        - 401: Unauthorized (likely a missing API Key)
        - 403: Permission issue (likely using an invalid API Key)
        - 408: Request Timeout, request should be retried after some time
        - 413: Payload too large (batch is above 5MB uncompressed)
        - 429: Too Many Requests, request should be retried after some time
        - 500: Internal Server Error, the server encountered an unexpected condition that prevented it from fulfilling the request, request should be retried after some time
        - 503: Service Unavailable, the server is not ready to handle the request probably because it is overloaded, request should be retried after some time
      operationId: SubmitLog
      parameters:
        - description: HTTP header used to compress the media-type.
          in: header
          name: Content-Encoding
          required: false
          schema:
            $ref: '#/components/schemas/ContentEncoding'
        - description: Log tags can be passed as query parameters with `text/plain` content type.
          example: env:prod,user:my-user
          in: query
          name: ddtags
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  ddsource: nginx
                  ddtags: env:staging,version:5.1
                  hostname: i-012345678
                  message: 2019-11-19T14:37:58,995 INFO [process.name][20081] Hello World
                  service: payment
              multi-json-messages:
                description: Pass multiple log objects at once.
                summary: Multi JSON Messages
                value:
                  - ddsource: nginx
                    ddtags: env:staging,version:5.1
                    hostname: i-012345678
                    message: 2019-11-19T14:37:58,995 INFO [process.name][20081] Hello
                    service: payment
                  - ddsource: nginx
                    ddtags: env:staging,version:5.1
                    hostname: i-012345679
                    message: 2019-11-19T14:37:58,995 INFO [process.name][20081] World
                    service: payment
              simple-json-message:
                description: Log attributes can be passed as `key:value` pairs in valid JSON messages.
                summary: Simple JSON Message
                value:
                  ddsource: nginx
                  ddtags: env:staging,version:5.1
                  hostname: i-012345678
                  message: 2019-11-19T14:37:58,995 INFO [process.name][20081] Hello World
                  service: payment
            schema:
              $ref: '#/components/schemas/HTTPLog'
          application/logplex-1:
            examples:
              default:
                value:
                  multi-raw-message:
                    description: Submit log messages.
                    summary: Multi Logplex Messages
                    value: |-
                      2019-11-19T14:37:58,995 INFO [process.name][20081] Hello
                      2019-11-19T14:37:58,995 INFO [process.name][20081] World
              multi-raw-message:
                description: Submit log messages.
                summary: Multi Logplex Messages
                value: |-
                  2019-11-19T14:37:58,995 INFO [process.name][20081] Hello
                  2019-11-19T14:37:58,995 INFO [process.name][20081] World
              simple-logplex-message:
                description: Submit log string.
                summary: Simple Logplex Message
                value: 2019-11-19T14:37:58,995 INFO [process.name][20081] Hello World
            schema:
              type: string
          text/plain:
            examples:
              default:
                value:
                  multi-raw-message:
                    description: Submit log string.
                    summary: Multi Raw Messages
                    value: |-
                      2019-11-19T14:37:58,995 INFO [process.name][20081] Hello
                      2019-11-19T14:37:58,995 INFO [process.name][20081] World
              multi-raw-message:
                description: Submit log string.
                summary: Multi Raw Messages
                value: |-
                  2019-11-19T14:37:58,995 INFO [process.name][20081] Hello
                  2019-11-19T14:37:58,995 INFO [process.name][20081] World
              simple-raw-message:
                description: 'Submit log string. Log attributes can be passed as query parameters in the URL. This enables the addition of tags or the source by using the `ddtags` and `ddsource` parameters: `?host=my-hostname&service=my-service&ddsource=my-source&ddtags=env:prod,user:my-user`.'
                summary: Simple Raw Message
                value: 2019-11-19T14:37:58,995 INFO [process.name][20081] Hello World
            schema:
              type: string
        description: Log to send (JSON format).
        required: true
      responses:
        '202':
          content:
            application/json:
              examples:
                default:
                  value: {}
              schema:
                type: string
                description: (opaque JSON object)
          description: Request accepted for processing (always 202 empty JSON).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPLogErrors'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPLogErrors'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPLogErrors'
          description: Forbidden
        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPLogErrors'
          description: Request Timeout
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPLogErrors'
          description: Payload Too Large
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPLogErrors'
          description: Too Many Requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPLogErrors'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPLogErrors'
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Send logs
      tags:
        - Logs
      x-codegen-request-body-name: body
    servers:
      - url: https://http-intake.logs.{site:.+}
        variables:
          site:
            default: datadoghq.com
            description: The regional site for customers.
            x-stackQL-envVar: DD_SITE
  /api/v2/logs/analytics/aggregate:
    post:
      description: The API endpoint to aggregate events into buckets and compute metrics and timeseries.
      operationId: AggregateLogs
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  compute:
                    - aggregation: pc90
                      interval: 5m
                      metric: '@duration'
                      type: timeseries
                  filter:
                    from: now-15m
                    indexes:
                      - main
                      - web
                    query: service:web* AND @http.status_code:[200 TO 299]
                    storage_tier: indexes
                    to: now
                  group_by:
                    - facet: host
                      histogram:
                        interval: 10
                        max: 100
                        min: 50
                      sort:
                        aggregation: count
                        order: asc
                  options:
                    timezone: GMT
                  page:
                    cursor: eyJzdGFydEF0IjoiQVFBQUFYS2tMS3pPbm40NGV3QUFBQUJCV0V0clRFdDZVbG8zY3pCRmNsbHJiVmxDWlEifQ==
            schema:
              $ref: '#/components/schemas/LogsAggregateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      buckets:
                        - by:
                            host: my-hostname
                          computes:
                            c0: 19
                    meta:
                      elapsed: 132
                      status: done
              schema:
                $ref: '#/components/schemas/LogsAggregateResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - logs_read_data
      summary: Aggregate events
      tags:
        - Logs
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - logs_read_data
  /api/v2/logs/config/archive-order:
    get:
      description: |-
        Get the current order of your archives.
        This endpoint takes no JSON arguments.
      operationId: GetLogsArchiveOrder
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        archive_ids:
                          - a2zcMylnM4OCHpYusxIi1g
                          - a2zcMylnM4OCHpYusxIi2g
                          - a2zcMylnM4OCHpYusxIi3g
                      type: archive_order
              schema:
                $ref: '#/components/schemas/LogsArchiveOrder'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Get archive order
      tags:
        - Logs Archives
      x-permission:
        operator: OR
        permissions:
          - logs_read_config
    put:
      description: |-
        Update the order of your archives. Since logs are processed sequentially, reordering an archive may change
        the structure and content of the data processed by other archives.

        **Note**: Using the `PUT` method updates your archive's order by replacing the current order
        with the new one.
      operationId: UpdateLogsArchiveOrder
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      archive_ids:
                        - a2zcMylnM4OCHpYusxIi1g
                        - a2zcMylnM4OCHpYusxIi2g
                        - a2zcMylnM4OCHpYusxIi3g
                    type: archive_order
            schema:
              $ref: '#/components/schemas/LogsArchiveOrder'
        description: An object containing the new ordered list of archive IDs.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        archive_ids:
                          - a2zcMylnM4OCHpYusxIi1g
                          - a2zcMylnM4OCHpYusxIi2g
                          - a2zcMylnM4OCHpYusxIi3g
                      type: archive_order
              schema:
                $ref: '#/components/schemas/LogsArchiveOrder'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Entity
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Update archive order
      tags:
        - Logs Archives
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - logs_write_archives
  /api/v2/logs/config/archives:
    get:
      description: Get the list of configured logs archives with their definitions.
      operationId: ListLogsArchives
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          destination:
                            bucket: my-bucket
                            integration:
                              account_id: '123456789012'
                              role_name: my-role
                            type: s3
                          include_tags: false
                          name: Nginx Archive
                          query: source:nginx
                          state: WORKING
                        id: 00000000-0000-0000-0000-000000000001
                        type: archives
              schema:
                $ref: '#/components/schemas/LogsArchives'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Get all archives
      tags:
        - Logs Archives
      x-permission:
        operator: OR
        permissions:
          - logs_read_archives
    post:
      description: Create an archive in your organization.
      operationId: CreateLogsArchive
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      compression_method: GZIP
                      destination:
                        container: container-name
                        storage_account: account-name
                        type: azure
                      include_tags: false
                      name: Nginx Archive
                      query: source:nginx
                      rehydration_max_scan_size_in_gb: 100
                      rehydration_tags:
                        - team:intake
                        - team:app
                    type: archives
              s3_access_key_id:
                value:
                  data:
                    attributes:
                      destination:
                        bucket: my-bucket
                        integration:
                          access_key_id: AKIAIOSFODNN7EXAMPLE
                        type: s3
                      name: Nginx Archive
                      query: source:nginx
                    type: archives
            schema:
              $ref: '#/components/schemas/LogsArchiveCreateRequest'
        description: The definition of the new archive.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        destination:
                          bucket: my-bucket
                          integration:
                            account_id: '123456789012'
                            role_name: my-role
                          type: s3
                        include_tags: false
                        name: Nginx Archive
                        query: source:nginx
                        state: WORKING
                      id: 00000000-0000-0000-0000-000000000002
                      type: archives
                s3_access_key_id:
                  value:
                    data:
                      attributes:
                        destination:
                          bucket: my-bucket
                          integration:
                            access_key_id: AKIAIOSFODNN7EXAMPLE
                          type: s3
                        include_tags: false
                        name: Nginx Archive
                        query: source:nginx
                        state: WORKING
                      id: 00000000-0000-0000-0000-000000000002
                      type: archives
              schema:
                $ref: '#/components/schemas/LogsArchive'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Create an archive
      tags:
        - Logs Archives
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - logs_write_archives
  /api/v2/logs/config/archives/{archive_id}:
    delete:
      description: Delete a given archive from your organization.
      operationId: DeleteLogsArchive
      parameters:
        - $ref: '#/components/parameters/ArchiveID'
      responses:
        '204':
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Delete an archive
      tags:
        - Logs Archives
      x-permission:
        operator: OR
        permissions:
          - logs_write_archives
    get:
      description: Get a specific archive from your organization.
      operationId: GetLogsArchive
      parameters:
        - $ref: '#/components/parameters/ArchiveID'
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        destination:
                          bucket: my-bucket
                          integration:
                            account_id: '123456789012'
                            role_name: my-role
                          type: s3
                        include_tags: false
                        name: Nginx Archive
                        query: source:nginx
                        state: WORKING
                      id: 00000000-0000-0000-0000-000000000003
                      type: archives
              schema:
                $ref: '#/components/schemas/LogsArchive'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Get an archive
      tags:
        - Logs Archives
      x-permission:
        operator: OR
        permissions:
          - logs_read_archives
    put:
      description: |-
        Update a given archive configuration.

        **Note**: Using this method updates your archive configuration by **replacing**
        your current configuration with the new one sent to your Datadog organization.
      operationId: UpdateLogsArchive
      parameters:
        - $ref: '#/components/parameters/ArchiveID'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      compression_method: GZIP
                      destination:
                        container: container-name
                        storage_account: account-name
                        type: azure
                      include_tags: false
                      name: Nginx Archive
                      query: source:nginx
                      rehydration_max_scan_size_in_gb: 100
                      rehydration_tags:
                        - team:intake
                        - team:app
                    type: archives
              s3_access_key_id:
                value:
                  data:
                    attributes:
                      destination:
                        bucket: my-bucket
                        integration:
                          access_key_id: AKIAIOSFODNN7EXAMPLE
                        type: s3
                      name: Nginx Archive
                      query: source:nginx
                    type: archives
            schema:
              $ref: '#/components/schemas/LogsArchiveCreateRequest'
        description: New definition of the archive.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        destination:
                          bucket: my-bucket
                          integration:
                            account_id: '123456789012'
                            role_name: my-role
                          type: s3
                        include_tags: false
                        name: Nginx Archive
                        query: source:nginx
                        state: WORKING
                      id: 00000000-0000-0000-0000-000000000004
                      type: archives
                s3_access_key_id:
                  value:
                    data:
                      attributes:
                        destination:
                          bucket: my-bucket
                          integration:
                            access_key_id: AKIAIOSFODNN7EXAMPLE
                          type: s3
                        include_tags: false
                        name: Nginx Archive
                        query: source:nginx
                        state: WORKING
                      id: 00000000-0000-0000-0000-000000000004
                      type: archives
              schema:
                $ref: '#/components/schemas/LogsArchive'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Update an archive
      tags:
        - Logs Archives
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - logs_write_archives
  /api/v2/logs/config/archives/{archive_id}/readers:
    delete:
      description: Removes a role from an archive. ([Roles API](https://docs.datadoghq.com/api/v2/roles/))
      operationId: RemoveRoleFromArchive
      parameters:
        - $ref: '#/components/parameters/ArchiveID'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    id: 3653d3c6-0c75-11ea-ad28-fb5701eabc7d
                    type: roles
            schema:
              $ref: '#/components/schemas/RelationshipToRole'
        required: true
      responses:
        '204':
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Revoke role from an archive
      tags:
        - Logs Archives
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - logs_write_archives
    get:
      description: Returns all read roles a given archive is restricted to.
      operationId: ListArchiveReadRoles
      parameters:
        - $ref: '#/components/parameters/ArchiveID'
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          name: Example Role
                        id: 00000000-0000-0000-0000-000000000005
                        type: roles
              schema:
                $ref: '#/components/schemas/RolesResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: List read roles for an archive
      tags:
        - Logs Archives
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - logs_read_config
    post:
      description: Adds a read role to an archive. ([Roles API](https://docs.datadoghq.com/api/v2/roles/))
      operationId: AddReadRoleToArchive
      parameters:
        - $ref: '#/components/parameters/ArchiveID'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    id: 3653d3c6-0c75-11ea-ad28-fb5701eabc7d
                    type: roles
            schema:
              $ref: '#/components/schemas/RelationshipToRole'
        required: true
      responses:
        '204':
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Grant role to an archive
      tags:
        - Logs Archives
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - logs_write_archives
  /api/v2/logs/config/custom-destinations:
    get:
      description: Get the list of configured custom destinations in your organization with their definitions.
      operationId: ListLogsCustomDestinations
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          enabled: true
                          forward_tags: true
                          forward_tags_restriction_list:
                            - datacenter
                            - host
                          forward_tags_restriction_list_type: ALLOW_LIST
                          forwarder_destination:
