      required:
        - name
        - rule
      type: object
    ObservabilityPipelineParseGrokProcessorRuleSupportRule:
      description: The Grok helper rule referenced in the parsing rules.
      properties:
        name:
          description: The name of the Grok helper rule.
          example: user
          type: string
        rule:
          description: The definition of the Grok helper rule.
          example: ' %{word:user.name}'
          type: string
      required:
        - name
        - rule
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorActionRedact:
      description: Configuration for completely redacting matched sensitive data.
      properties:
        action:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorActionRedactAction'
        options:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorActionRedactOptions'
      required:
        - action
        - options
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorActionHash:
      description: Configuration for hashing matched sensitive values.
      properties:
        action:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorActionHashAction'
        options:
          description: |-
            Optional settings for the hash action. When omitted or empty, matched sensitive data is
            replaced with a deterministic hashed value that preserves structure for analytics while
            protecting the original content. Reserved for future hash configuration (for example, algorithm or salt). (opaque JSON object)
          type: string
      required:
        - action
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorActionPartialRedact:
      description: Configuration for partially redacting matched sensitive data.
      properties:
        action:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorActionPartialRedactAction'
        options:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorActionPartialRedactOptions'
      required:
        - action
        - options
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorCustomPattern:
      description: Defines a custom regex-based pattern for identifying sensitive data in logs.
      properties:
        options:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorCustomPatternOptions'
        type:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorCustomPatternType'
      required:
        - type
        - options
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorLibraryPattern:
      description: Specifies a pattern from Datadog’s sensitive data detection library to match known sensitive data types.
      properties:
        options:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorLibraryPatternOptions'
        type:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorLibraryPatternType'
      required:
        - type
        - options
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorScopeInclude:
      description: Includes only specific fields for sensitive data scanning.
      properties:
        options:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorScopeOptions'
        target:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorScopeIncludeTarget'
      required:
        - target
        - options
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorScopeExclude:
      description: Excludes specific fields from sensitive data scanning.
      properties:
        options:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorScopeOptions'
        target:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorScopeExcludeTarget'
      required:
        - target
        - options
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorScopeAll:
      description: Applies scanning across all available fields.
      properties:
        target:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorScopeAllTarget'
      required:
        - target
      type: object
    ObservabilityPipelineEnrichmentTableFieldStringPath:
      description: A plain field path in the log event, used as the lookup key.
      example: log.user.id
      type: string
    ObservabilityPipelineEnrichmentTableFieldEventLookup:
      description: Looks up a value from a field path in the log event.
      properties:
        event:
          description: The path to the field in the log event to use as the lookup key.
          example: log.user.id
          type: string
      required:
        - event
      type: object
    ObservabilityPipelineEnrichmentTableFieldVrlLookup:
      description: Evaluates a VRL expression to produce the lookup key.
      properties:
        vrl:
          description: A VRL expression that returns the value to use as the lookup key.
          example: .log.user.id
          type: string
      required:
        - vrl
      type: object
    ObservabilityPipelineEnrichmentTableFieldSecretLookup:
      description: Looks up a value stored as a pipeline secret.
      properties:
        secret:
          description: The name of the secret containing the lookup key value.
          example: MY_LOOKUP_SECRET
          type: string
      required:
        - secret
      type: object
    ObservabilityPipelineGeneratedMetricIncrementByOneStrategy:
      description: Increments the metric by 1 for each matching event.
      enum:
        - increment_by_one
      example: increment_by_one
      type: string
      x-enum-varnames:
        - INCREMENT_BY_ONE
    ObservabilityPipelineGeneratedMetricIncrementByFieldStrategy:
      description: Uses a numeric field in the log event as the metric increment.
      enum:
        - increment_by_field
      example: increment_by_field
      type: string
      x-enum-varnames:
        - INCREMENT_BY_FIELD
    ObservabilityPipelineOcsfMappingCustomFieldMapping:
      description: Defines a single field mapping rule for transforming a source field to an OCSF destination field.
      properties:
        default:
          description: The default value to use if the source field is missing or empty.
          example: ''
        dest:
          description: The destination OCSF field path.
          example: device.type
          type: string
        lookup:
          $ref: '#/components/schemas/ObservabilityPipelineOcsfMappingCustomLookup'
        source:
          description: The source field path from the log event.
          example: host.type
        sources:
          description: Multiple source field paths for combined mapping.
          example:
            - field1
            - field2
        value:
          description: A static value to use for the destination field.
          example: static_value
      required:
        - dest
      type: object
    ObservabilityPipelineOcsfMappingCustomMetadata:
      description: Metadata for the custom OCSF mapping.
      properties:
        class:
          description: The OCSF event class name.
          example: Device Inventory Info
          type: string
        profiles:
          description: A list of OCSF profiles to apply.
          example:
            - container
          items:
            description: The name of an OCSF profile to apply to the event.
            type: string
          type: array
        version:
          description: The OCSF schema version.
          example: 1.3.0
          type: string
      required:
        - class
        - version
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorActionRedactAction:
      description: Action type that completely replaces the matched sensitive data with a fixed replacement string to remove all visibility.
      enum:
        - redact
      example: redact
      type: string
      x-enum-varnames:
        - REDACT
    ObservabilityPipelineSensitiveDataScannerProcessorActionRedactOptions:
      description: Configuration for fully redacting sensitive data.
      properties:
        replace:
          description: The string used to replace matched sensitive data (for example, "***" or "[REDACTED]").
          example: '***'
          type: string
      required:
        - replace
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorActionHashAction:
      description: Action type that replaces the matched sensitive data with a hashed representation, preserving structure while securing content.
      enum:
        - hash
      example: hash
      type: string
      x-enum-varnames:
        - HASH
    ObservabilityPipelineSensitiveDataScannerProcessorActionPartialRedactAction:
      description: Action type that redacts part of the sensitive data while preserving a configurable number of characters, typically used for masking purposes (e.g., show last 4 digits of a credit card).
      enum:
        - partial_redact
      example: partial_redact
      type: string
      x-enum-varnames:
        - PARTIAL_REDACT
    ObservabilityPipelineSensitiveDataScannerProcessorActionPartialRedactOptions:
      description: Controls how partial redaction is applied, including character count and direction.
      properties:
        characters:
          description: Number of characters to leave visible from the start or end of the matched value; the rest are redacted.
          example: 4
          format: int64
          type: integer
        direction:
          $ref: '#/components/schemas/ObservabilityPipelineSensitiveDataScannerProcessorActionPartialRedactOptionsDirection'
      required:
        - characters
        - direction
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorCustomPatternOptions:
      description: Options for defining a custom regex pattern.
      properties:
        description:
          description: Human-readable description providing context about a sensitive data scanner rule
          example: Custom regex for internal API keys
          type: string
        rule:
          description: A regular expression used to detect sensitive values. Must be a valid regex.
          example: \b\d{16}\b
          type: string
      required:
        - rule
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorCustomPatternType:
      description: Indicates a custom regular expression is used for matching.
      enum:
        - custom
      example: custom
      type: string
      x-enum-varnames:
        - CUSTOM
    ObservabilityPipelineSensitiveDataScannerProcessorLibraryPatternOptions:
      description: Options for selecting a predefined library pattern and enabling keyword support.
      properties:
        description:
          description: Human-readable description providing context about a sensitive data scanner rule
          example: Credit card pattern
          type: string
        id:
          description: Identifier for a predefined pattern from the sensitive data scanner pattern library.
          example: credit_card
          type: string
        use_recommended_keywords:
          description: Whether to augment the pattern with recommended keywords (optional).
          type: boolean
      required:
        - id
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorLibraryPatternType:
      description: Indicates that a predefined library pattern is used.
      enum:
        - library
      example: library
      type: string
      x-enum-varnames:
        - LIBRARY
    ObservabilityPipelineSensitiveDataScannerProcessorScopeOptions:
      description: Fields to which the scope rule applies.
      properties:
        fields:
          description: List of log attribute names (field paths) to which the scope applies. Only these fields are included in or excluded from pattern matching.
          example:
            - ''
          items:
            description: A log field path to include or exclude from sensitive data scanning.
            type: string
          type: array
      required:
        - fields
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorScopeIncludeTarget:
      description: Applies the rule only to included fields.
      enum:
        - include
      example: include
      type: string
      x-enum-varnames:
        - INCLUDE
    ObservabilityPipelineSensitiveDataScannerProcessorScopeExcludeTarget:
      description: Excludes specific fields from processing.
      enum:
        - exclude
      example: exclude
      type: string
      x-enum-varnames:
        - EXCLUDE
    ObservabilityPipelineSensitiveDataScannerProcessorScopeAllTarget:
      description: Applies the rule to all fields.
      enum:
        - all
      example: all
      type: string
      x-enum-varnames:
        - ALL
    ObservabilityPipelineOcsfMappingCustomLookup:
      description: Lookup table configuration for mapping source values to destination values.
      properties:
        default:
          description: The default value to use if no lookup match is found.
          example: unknown
        table:
          description: A list of lookup table entries for value transformation.
          items:
            $ref: '#/components/schemas/ObservabilityPipelineOcsfMappingCustomLookupTableEntry'
          type: array
      type: object
    ObservabilityPipelineSensitiveDataScannerProcessorActionPartialRedactOptionsDirection:
      description: Indicates whether to redact characters from the first or last part of the matched value.
      enum:
        - first
        - last
      example: last
      type: string
      x-enum-varnames:
        - FIRST
        - LAST
    ObservabilityPipelineOcsfMappingCustomLookupTableEntry:
      description: A single entry in a lookup table for value transformation.
      properties:
        contains:
          description: The substring to match in the source value.
          example: Desktop
          type: string
        equals:
          description: The exact value to match in the source.
          example: desktop
        equals_source:
          description: The source field to match against.
          example: device_type
          type: string
        matches:
          description: A regex pattern to match in the source value.
          example: ^Desktop.*
          type: string
        not_matches:
          description: A regex pattern that must not match the source value.
          example: ^Mobile.*
          type: string
        value:
          description: The value to use when a match is found.
          example: desktop
      type: object
