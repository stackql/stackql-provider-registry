          example: HTTP_DESTINATION_URI
          type: string
        username_key:
          description: Name of the environment variable or secret that holds the username (used when `auth_strategy` is `basic`).
          example: HTTP_AUTH_USERNAME
          type: string
        bucket:
          description: S3 bucket name.
          example: error-logs
          type: string
        key_prefix:
          description: Optional prefix for object keys.
          type: string
        region:
          description: AWS region of the S3 bucket.
          example: us-east-1
          type: string
        server_side_encryption:
          $ref: '#/components/schemas/ObservabilityPipelineAmazonS3DestinationServerSideEncryption'
        ssekms_key_id:
          description: |-
            The AWS KMS key ID used for SSE-KMS encryption.
            Only applies when `server_side_encryption` is set to `aws:kms`.
          example: arn:aws:kms:us-east-1:123456789012:key/mrk-abc123
          type: string
        storage_class:
          $ref: '#/components/schemas/ObservabilityPipelineAmazonS3DestinationStorageClass'
        batch_settings:
          $ref: '#/components/schemas/ObservabilityPipelineAmazonS3GenericBatchSettings'
        custom_source_name:
          description: Custom source name for the logs in Security Lake.
          example: my-custom-source
          type: string
        blob_prefix:
          description: Optional prefix for blobs written to the container.
          example: logs/
          type: string
        connection_string_key:
          description: Name of the environment variable or secret that holds the Azure Storage connection string.
          example: AZURE_STORAGE_CONNECTION_STRING
          type: string
        container_name:
          description: The name of the Azure Blob Storage container to store logs in.
          example: my-log-container
          type: string
        batch:
          $ref: '#/components/schemas/ObservabilityPipelineClickhouseDestinationBatch'
        batch_encoding:
          $ref: '#/components/schemas/ObservabilityPipelineClickhouseDestinationBatchEncoding'
        database:
          description: Optional ClickHouse database name. If omitted, the user's default database on the ClickHouse server is used.
          example: my_database
          type: string
        date_time_best_effort:
          description: When `true`, enables flexible DateTime parsing on the ClickHouse server side.
          example: false
          type: boolean
        format:
          $ref: '#/components/schemas/ObservabilityPipelineClickhouseDestinationFormat'
        skip_unknown_fields:
          description: |-
            When `true`, fields not present in the target table schema are dropped instead of causing insert errors.
            When unset, the ClickHouse server's own `input_format_skip_unknown_fields` setting applies.
          example: true
          nullable: true
          type: boolean
        table:
          description: Target ClickHouse table name. Events are inserted into this table.
          example: application_logs
          type: string
        routes:
          description: A list of routing rules that forward matching logs to Datadog using dedicated API keys.
          example:
            - api_key_key: API_KEY_IDENTIFIER
              include: service:api
              route_id: datadog-logs-route-us1
              site: us1
          items:
            $ref: '#/components/schemas/ObservabilityPipelineDatadogLogsDestinationRoute'
          maxItems: 100
          type: array
        customer_id:
          description: The Google Chronicle customer ID.
          example: abcdefg123456789
          type: string
        log_type:
          description: The log type metadata associated with the Chronicle destination.
          example: nginx_logs
          type: string
        acl:
          $ref: '#/components/schemas/ObservabilityPipelineGoogleCloudStorageDestinationAcl'
        metadata:
          description: Custom metadata to attach to each object uploaded to the GCS bucket.
          items:
            $ref: '#/components/schemas/ObservabilityPipelineMetadataEntry'
          type: array
        project:
          description: The Google Cloud project ID that owns the Pub/Sub topic.
          example: my-gcp-project
          type: string
        topic:
          description: The Pub/Sub topic name to publish logs to.
          example: logs-subscription
          type: string
        bootstrap_servers_key:
          description: Name of the environment variable or secret that holds the Kafka bootstrap servers list.
          example: KAFKA_BOOTSTRAP_SERVERS
          type: string
        headers_key:
          description: The field name to use for Kafka message headers.
          example: headers
          type: string
        key_field:
          description: The field name to use as the Kafka message key.
          example: message_id
          type: string
        librdkafka_options:
          description: Optional list of advanced Kafka producer configuration options, defined as key-value pairs.
          items:
            $ref: '#/components/schemas/ObservabilityPipelineKafkaLibrdkafkaOption'
          type: array
        message_timeout_ms:
          description: Maximum time in milliseconds to wait for message delivery confirmation.
          example: 300000
          format: int64
          minimum: 1
          type: integer
        rate_limit_duration_secs:
          description: Duration in seconds for the rate limit window.
          example: 1
          format: int64
          minimum: 1
          type: integer
        rate_limit_num:
          description: Maximum number of messages allowed per rate limit duration.
          example: 1000
          format: int64
          minimum: 1
          type: integer
        sasl:
          $ref: '#/components/schemas/ObservabilityPipelineKafkaSasl'
        socket_timeout_ms:
          description: Socket timeout in milliseconds for network requests.
          example: 60000
          format: int64
          maximum: 300000
          minimum: 10
          type: integer
        client_id:
          description: Azure AD client ID used for authentication.
          example: a1b2c3d4-5678-90ab-cdef-1234567890ab
          type: string
        client_secret_key:
          description: Name of the environment variable or secret that holds the Azure AD client secret.
          example: AZURE_CLIENT_SECRET
          type: string
        dce_uri_key:
          description: Name of the environment variable or secret that holds the Data Collection Endpoint (DCE) URI.
          example: DCE_URI
          type: string
        dcr_immutable_id:
          description: The immutable ID of the Data Collection Rule (DCR).
          example: dcr-uuid-1234
          type: string
        tenant_id:
          description: Azure AD tenant ID.
          example: abcdef12-3456-7890-abcd-ef1234567890
          type: string
        account_id_key:
          description: Name of the environment variable or secret that holds the New Relic account ID.
          example: NEW_RELIC_ACCOUNT_ID
          type: string
        license_key_key:
          description: Name of the environment variable or secret that holds the New Relic license key.
          example: NEW_RELIC_LICENSE_KEY
          type: string
        keepalive:
          description: Optional socket keepalive duration in milliseconds.
          example: 60000
          format: int64
          minimum: 0
          type: integer
        address_key:
          description: Name of the environment variable or secret that holds the socket address (host:port).
          example: SOCKET_ADDRESS
          type: string
        framing:
          $ref: '#/components/schemas/ObservabilityPipelineSocketDestinationFraming'
        mode:
          $ref: '#/components/schemas/ObservabilityPipelineSocketDestinationMode'
        auto_extract_timestamp:
          description: |-
            If `true`, Splunk tries to extract timestamps from incoming log events.
            If `false`, Splunk assigns the time the event was received.
          example: true
          type: boolean
        index:
          description: Optional name of the Splunk index where logs are written.
          example: main
          type: string
        indexed_fields:
          description: List of log field names to send as indexed fields to Splunk HEC. Available only when `encoding` is `json`.
          example:
            - service
            - host
          items:
            description: A log field name to index in Splunk.
            type: string
          type: array
        sourcetype:
          description: The Splunk sourcetype to assign to log events.
          example: custom_sourcetype
          type: string
        token_strategy:
          $ref: '#/components/schemas/ObservabilityPipelineSplunkHecDestinationTokenStrategy'
        header_custom_fields:
          description: A list of custom headers to include in the request to Sumo Logic.
          items:
            $ref: '#/components/schemas/ObservabilityPipelineSumoLogicDestinationHeaderCustomFieldsItem'
          type: array
        header_host_name:
          description: Optional override for the host name header.
          example: host-123
          type: string
        header_source_category:
          description: Optional override for the source category header.
          example: source-category
          type: string
        header_source_name:
          description: Optional override for the source name header.
          example: source-name
          type: string
        ingestion_endpoint_key:
          description: Name of the environment variable or the secret identifier that references the Databricks Zerobus ingestion endpoint, which is used to stream data directly into your Databricks Lakehouse.
          example: DD_OP_DESTINATION_DATABRICKS_ZEROBUS_INGESTION_ENDPOINT
          type: string
        table_name:
          description: The fully qualified name of your target Databricks table. Make sure this table already exists in your Databricks workspace before deploying.
          example: catalog.schema.table
          type: string
        unity_catalog_endpoint_key:
          description: Name of the environment variable or the secret identifier that references your Databricks workspace URL, which is used to communicate with the Unity Catalog API.
          example: DD_OP_DESTINATION_DATABRICKS_ZEROBUS_UNITY_CATALOG_ENDPOINT
          type: string
        default_namespace:
          description: Optional default namespace for metrics sent to Splunk HEC.
          example: custom_namespace
          type: string
        source:
          description: The Splunk source field value for metric events.
          example: observability_pipelines
          type: string
      required:
        - id
        - type
        - inputs
        - encoding
        - auth
        - bucket
        - region
        - storage_class
        - compression
        - custom_source_name
        - container_name
        - table
        - customer_id
        - project
        - topic
        - client_id
        - tenant_id
        - dcr_immutable_id
        - framing
        - mode
        - table_name
      type: object
      x-pipeline-types:
        - logs
        - metrics
    ObservabilityPipelineConfigPipelineType:
      default: logs
      description: The type of data being ingested. Defaults to `logs` if not specified.
      enum:
        - logs
        - metrics
      example: logs
      type: string
      x-enum-varnames:
        - LOGS
        - METRICS
    ObservabilityPipelineConfigProcessorGroup:
      description: A group of processors.
      example:
        enabled: true
        id: my-processor-group
        include: service:my-service
        inputs:
          - datadog-agent-source
        processors:
          - enabled: true
            fields:
              - name: env
                value: prod
            id: add-fields-processor
            include: '*'
            type: add_fields
          - enabled: true
            id: filter-processor
            include: status:error
            type: filter
      properties:
        display_name:
          $ref: '#/components/schemas/ObservabilityPipelineComponentDisplayName'
        enabled:
          description: Whether this processor group is enabled.
          example: true
          type: boolean
        id:
          description: The unique identifier for the processor group.
          example: grouped-processors
          type: string
        include:
          description: Conditional expression for when this processor group should execute.
          example: service:my-service
          type: string
        inputs:
          description: A list of IDs for components whose output is used as the input for this processor group.
          example:
            - datadog-agent-source
          items:
            description: The ID of a component whose output is used as input.
            type: string
          type: array
        processors:
          description: Processors applied sequentially within this group. Events flow through each processor in order.
          example:
            - enabled: true
              fields:
                - name: env
                  value: prod
              id: add-fields-processor
              include: '*'
              type: add_fields
            - enabled: true
              id: filter-processor
              include: status:error
              type: filter
          items:
            $ref: '#/components/schemas/ObservabilityPipelineConfigProcessorItem'
          type: array
      required:
        - id
        - include
        - inputs
        - processors
        - enabled
      type: object
    ObservabilityPipelineConfigSourceItem:
      description: A data source for the pipeline.
      properties:
        address_key:
          description: Name of the environment variable or secret that holds the listen address for the Datadog Agent source.
          example: DATADOG_AGENT_ADDRESS
          type: string
        id:
          description: The unique identifier for this component. Used in other parts of the pipeline to reference this component (for example, as the `input` to downstream components).
          example: datadog-agent-source
          type: string
        tls:
          $ref: '#/components/schemas/ObservabilityPipelineTls'
        type:
          $ref: '#/components/schemas/ObservabilityPipelineDatadogAgentSourceType'
        auth:
          $ref: '#/components/schemas/ObservabilityPipelineAwsAuth'
        compression:
          $ref: '#/components/schemas/ObservabilityPipelineAmazonS3SourceCompression'
        region:
          description: AWS region where the S3 bucket resides.
          example: us-east-1
          type: string
        url_key:
          description: Name of the environment variable or secret that holds the S3 bucket URL.
          example: S3_BUCKET_URL
          type: string
        decoding:
          $ref: '#/components/schemas/ObservabilityPipelineDecoding'
        project:
          description: The Google Cloud project ID that owns the Pub/Sub subscription.
          example: my-gcp-project
          type: string
        subscription:
          description: The Pub/Sub subscription name from which messages are consumed.
          example: logs-subscription
          type: string
        auth_strategy:
          $ref: '#/components/schemas/ObservabilityPipelineHttpClientSourceAuthStrategy'
        custom_key:
          description: Name of the environment variable or secret that holds a custom header value (used with custom auth strategies).
          example: HTTP_AUTH_CUSTOM_HEADER
          type: string
        endpoint_url_key:
          description: Name of the environment variable or secret that holds the HTTP endpoint URL to scrape.
          example: HTTP_ENDPOINT_URL
          type: string
        password_key:
          description: Name of the environment variable or secret that holds the password (used when `auth_strategy` is `basic`).
          example: HTTP_AUTH_PASSWORD
          type: string
        scrape_interval_secs:
          description: The interval (in seconds) between HTTP scrape requests.
          example: 60
          format: int64
          type: integer
        scrape_timeout_secs:
          description: The timeout (in seconds) for each scrape request.
          example: 10
          format: int64
          type: integer
        token_key:
          description: Name of the environment variable or secret that holds the bearer token (used when `auth_strategy` is `bearer`).
          example: HTTP_AUTH_TOKEN
          type: string
        username_key:
          description: Name of the environment variable or secret that holds the username (used when `auth_strategy` is `basic`).
          example: HTTP_AUTH_USERNAME
          type: string
        valid_tokens:
          description: |-
            A list of tokens that are accepted for authenticating incoming HTTP requests. When set,
            the source rejects any request whose token does not match an enabled entry in this list.
            Cannot be combined with the `plain` auth strategy.
          items:
            $ref: '#/components/schemas/ObservabilityPipelineHttpServerSourceValidToken'
          maxItems: 1000
          minItems: 1
          type: array
        bootstrap_servers_key:
          description: Name of the environment variable or secret that holds the Kafka bootstrap servers list.
          example: KAFKA_BOOTSTRAP_SERVERS
          type: string
        group_id:
          description: Consumer group ID used by the Kafka client.
          example: consumer-group-0
          type: string
        librdkafka_options:
          description: Optional list of advanced Kafka client configuration options, defined as key-value pairs.
          items:
            $ref: '#/components/schemas/ObservabilityPipelineKafkaLibrdkafkaOption'
          type: array
        sasl:
          $ref: '#/components/schemas/ObservabilityPipelineKafkaSasl'
        topics:
          description: A list of Kafka topic names to subscribe to. The source ingests messages from each topic specified.
          example:
            - topic1
            - topic2
          items:
            description: A Kafka topic name to subscribe to.
            type: string
          type: array
        mode:
          $ref: '#/components/schemas/ObservabilityPipelineSyslogSourceMode'
        framing:
          $ref: '#/components/schemas/ObservabilityPipelineSocketSourceFraming'
        store_hec_token:
          description: |-
            When `true`, the Splunk HEC token from the incoming request is stored in the event metadata.
            This allows downstream components to forward the token to other Splunk HEC destinations.
          example: true
          type: boolean
        uri_key:
          description: Name of the environment variable or secret that holds the WebSocket server URI (`ws://` or `wss://`).
          example: WS_URI
          type: string
        grpc_address_key:
          description: Environment variable name containing the gRPC server address for receiving OTLP data. Must be a valid environment variable name (alphanumeric characters and underscores only).
          example: OTEL_GRPC_ADDRESS
          type: string
        http_address_key:
          description: Environment variable name containing the HTTP server address for receiving OTLP data. Must be a valid environment variable name (alphanumeric characters and underscores only).
          example: OTEL_HTTP_ADDRESS
          type: string
      required:
        - id
        - type
        - region
        - decoding
        - project
        - subscription
        - auth_strategy
        - group_id
        - topics
        - mode
        - framing
      type: object
      x-pipeline-types:
        - logs
        - metrics
    LogsArrayProcessorOperationAppend:
      description: Operation that appends a value to a target array attribute.
      properties:
        preserve_source:
          default: true
          description: Remove or preserve the remapped source element.
          type: boolean
        source:
          description: Attribute path containing the value to append.
          example: network.client.ip
          type: string
        target:
          description: Attribute path of the array to append to.
          example: sourceIps
          type: string
        type:
          $ref: '#/components/schemas/LogsArrayProcessorOperationAppendType'
      required:
        - type
        - source
        - target
      type: object
    LogsArrayProcessorOperationLength:
      description: Operation that computes the length of a `source` array and stores the result in the `target` attribute.
      properties:
        source:
          description: Attribute path of the array to measure.
          example: tags
          type: string
        target:
          description: Attribute that receives the computed length.
          example: tagCount
          type: string
        type:
          $ref: '#/components/schemas/LogsArrayProcessorOperationLengthType'
      required:
        - type
        - source
        - target
      type: object
    LogsArrayProcessorOperationSelect:
      description: Operation that finds an object in a `source` array using a `filter`, and then extracts a specific value into the `target` attribute.
      properties:
        filter:
          description: Filter condition expressed as `key:value` used to find the matching element.
          example: name:Referrer
          type: string
        source:
          description: Attribute path of the array to search into.
          example: httpRequest.headers
          type: string
        target:
          description: Attribute that receives the extracted value.
          example: referrer
          type: string
        type:
          $ref: '#/components/schemas/LogsArrayProcessorOperationSelectType'
        value_to_extract:
          description: Key of the value to extract from the matching element.
          example: value
          type: string
      required:
        - type
        - source
        - target
        - filter
        - value_to_extract
      type: object
    LogsArrayProcessorOperationExtractKeyValue:
      description: Operation that extracts key-value pairs from a `source` array and stores the result in the `target` attribute.
      properties:
        key_to_extract:
          description: Key of the attribute in each array element that holds the name to use for the extracted attribute.
          example: name
          type: string
        override_on_conflict:
          default: false
          description: Whether to override the target element if it's already set.
          type: boolean
        source:
          description: Attribute path of the array to extract key-value pairs from.
          example: tags
          type: string
        target:
          description: Attribute that receives the extracted key-value pairs. If not specified, the extracted attributes are added at the root level of the log.
          example: extracted
          type: string
        type:
          $ref: '#/components/schemas/LogsArrayProcessorOperationExtractKeyValueType'
        value_to_extract:
          description: Key of the attribute in each array element that holds the value to use for the extracted attribute.
          example: value
          type: string
      required:
        - type
        - source
        - key_to_extract
        - value_to_extract
      type: object
    LogsSchemaRemapper:
      description: The schema remapper maps source log fields to their correct fields.
      properties:
        name:
          description: Name of the logs schema remapper.
          example: Map userIdentity.principalId, responseElements.role.roleId, responseElements.user.userId to ocsf.user.uid
          type: string
        override_on_conflict:
          default: false
          description: Whether to override the target element if it's already set.
          type: boolean
        preserve_source:
          default: false
          description: Remove or preserve the remapped source element.
          type: boolean
        sources:
          description: Array of source attributes.
          example:
            - userIdentity.principalId
            - responseElements.role.roleId
            - responseElements.user.userId
          items:
            description: Attribute used as a source to remap its value to the target attribute.
            type: string
          type: array
        target:
          description: Target field to map log source field to.
          example: ocsf.user.uid
          type: string
        target_format:
          $ref: '#/components/schemas/TargetFormatType'
        type:
          $ref: '#/components/schemas/LogsSchemaRemapperType'
      required:
        - name
        - sources
        - target
        - type
      type: object
    LogsSchemaCategoryMapper:
      description: |-
        Use the Schema Category Mapper to categorize log event into enum fields.
        In the case of OCSF, they can be used to map sibling fields which are composed of an ID and a name.

        **Notes**:

        - The syntax of the query is the one of Logs Explorer search bar.
          The query can be done on any log attribute or tag, whether it is a facet or not.
          Wildcards can also be used inside your query.
        - Categories are executed in order and processing stops at the first match.
          Make sure categories are properly ordered in case a log could match multiple queries.
        - Sibling fields always have a numerical ID field and a human-readable string name.
        - A fallback section handles cases where the name or ID value matches a specific value.
          If the name matches "Other" or the ID matches 99, the value of the sibling name field will be pulled from a source field from the original log.
      properties:
        categories:
          description: |-
            Array of filters to match or not a log and their
            corresponding `name` to assign a custom value to the log.
          example:
            - filter:
                query: '@eventName:(ConsoleLogin OR ExternalIdPDirectoryLogin OR UserAuthentication OR Authenticate)'
              id: 1
              name: Logon
            - filter:
                query: '@eventName:*'
              id: 99
              name: Other
          items:
            $ref: '#/components/schemas/LogsSchemaCategoryMapperCategory'
          type: array
        fallback:
          $ref: '#/components/schemas/LogsSchemaCategoryMapperFallback'
        name:
          description: Name of the logs schema category mapper.
          example: activity_id and activity_name
          type: string
        targets:
          $ref: '#/components/schemas/LogsSchemaCategoryMapperTargets'
        type:
          $ref: '#/components/schemas/LogsSchemaCategoryMapperType'
      required:
        - categories
        - targets
        - type
        - name
      type: object
    LogsArrayMapAttributeRemapper:
      description: |-
        An attribute remapper sub-processor for use inside an array-map processor.
        Unlike the top-level attribute remapper, `is_enabled`, `source_type`, and
        `target_type` are not supported.
      properties:
        name:
          description: Name of the sub-processor.
          type: string
        override_on_conflict:
          default: false
          description: Override the target element if already set.
          type: boolean
        preserve_source:
          default: false
          description: Remove or preserve the remapped source element.
          type: boolean
        sources:
          description: Array of source attribute paths.
          example:
            - $sourceElem.id
          items:
            type: string
          type: array
        target:
          description: Target attribute path.
          example: $targetElem.uid
          type: string
        target_format:
          $ref: '#/components/schemas/TargetFormatType'
        type:
          $ref: '#/components/schemas/LogsAttributeRemapperType'
      required:
        - sources
        - target
        - type
      type: object
    LogsArrayMapArithmeticSubProcessor:
      description: |-
        An arithmetic sub-processor for use inside an array-map processor.
        Unlike the top-level arithmetic processor, `is_enabled` is not supported.
      properties:
        expression:
          description: Arithmetic operation to perform.
          example: $sourceElem.count * 2
          type: string
        is_replace_missing:
          default: false
          description: Replace missing attribute values with 0.
          type: boolean
        name:
          description: Name of the sub-processor.
          type: string
        target:
          description: Target attribute path for the result.
          example: $targetElem.doubled
          type: string
        type:
          $ref: '#/components/schemas/LogsArithmeticProcessorType'
      required:
        - expression
        - target
        - type
      type: object
    LogsArrayMapStringBuilderSubProcessor:
      description: |-
        A string builder sub-processor for use inside an array-map processor.
        Unlike the top-level string builder processor, `is_enabled` is not supported.
      properties:
        is_replace_missing:
          default: false
          description: Replace missing attribute values with an empty string.
          type: boolean
        name:
          description: Name of the sub-processor.
          type: string
        target:
          description: Target attribute path for the result.
          example: $targetElem.label
          type: string
        template:
          description: Formula with one or more attributes and raw text.
          example: item-%{$sourceElem.id}
          type: string
        type:
          $ref: '#/components/schemas/LogsStringBuilderProcessorType'
      required:
        - template
        - target
        - type
      type: object
    LogsArrayMapCategorySubProcessor:
      description: |-
        A category sub-processor for use inside an array-map processor.
        Unlike the top-level category processor, `is_enabled` is not supported.
      properties:
        categories:
          description: Array of filters to match against a log and the corresponding value to assign.
          items:
            $ref: '#/components/schemas/LogsCategoryProcessorCategory'
          type: array
        name:
          description: Name of the sub-processor.
          type: string
        target:
          description: Target attribute path for the category value.
          example: $targetElem.level
          type: string
        type:
          $ref: '#/components/schemas/LogsCategoryProcessorType'
      required:
        - categories
        - target
        - type
      type: object
    LogsAggregateBucketValueTimeseriesPoint:
      description: A timeseries point
      properties:
        time:
          description: The time value for this point
          example: '2020-06-08T11:55:00Z'
          type: string
        value:
          description: The value for this point
          example: 19
          format: double
          type: number
      type: object
    LogsArchiveIntegrationAzure:
