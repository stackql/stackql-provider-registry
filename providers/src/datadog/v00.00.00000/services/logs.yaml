          example:
            customAttribute: 123
            duration: 2345
          type: object
        host:
          description: Name of the machine from where the logs are being sent.
          example: i-0123
          type: string
        message:
          description: |-
            The message [reserved attribute](https://docs.datadoghq.com/logs/log_collection/#reserved-attributes)
            of your log. By default, Datadog ingests the value of the message attribute as the body of the log entry.
            That value is then highlighted and displayed in the Logstream, where it is indexed for full text search.
          example: Host connected to remote
          type: string
        service:
          description: |-
            The name of the application or service generating the log events.
            It is used to switch from Logs to APM, so make sure you define the same
            value when you use both products.
          example: agent
          type: string
        tags:
          description: Array of tags associated with your log.
          example:
            - team:A
          items:
            description: Tag associated with your log.
            type: string
          type: array
        timestamp:
          description: Timestamp of your log.
          example: '2020-05-26T13:36:14Z'
          format: date-time
          type: string
      type: object
    LogsExclusionFilter:
      description: Exclusion filter is defined by a query, a sampling rule, and a active/inactive toggle.
      properties:
        query:
          description: |-
            Default query is `*`, meaning all logs flowing in the index would be excluded.
            Scope down exclusion filter to only a subset of logs with a log query.
          example: '*'
          type: string
        sample_attribute:
          description: |-
            Sample attribute to use for the sampling of logs going through this exclusion filter.
            When set, only the logs with the specified attribute are sampled.
          example: '@ci.job_id'
          type: string
        sample_rate:
          description: |-
            Sample rate to apply to logs going through this exclusion filter,
            a value of 1.0 excludes all logs matching the query.
          example: 1
          format: double
          type: number
      required:
        - sample_rate
      type: object
    LogsGrokParser:
      description: |-
        Create custom grok rules to parse the full message or [a specific attribute of your raw event](https://docs.datadoghq.com/logs/log_configuration/parsing/#advanced-settings).
        For more information, see the [parsing section](https://docs.datadoghq.com/logs/log_configuration/parsing).
      properties:
        grok:
          $ref: '#/components/schemas/LogsGrokParserRules'
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        samples:
          description: List of sample logs to test this grok parser.
          items:
            description: A log sample that is used to test the grok parser.
            maxLength: 5000
            type: string
          maxItems: 5
          type: array
        source:
          default: message
          description: Name of the log attribute to parse.
          example: message
          type: string
        type:
          $ref: '#/components/schemas/LogsGrokParserType'
      required:
        - source
        - grok
        - type
      type: object
    LogsDateRemapper:
      description: |-
        As Datadog receives logs, it timestamps them using the value(s) from any of these default attributes.

          - `timestamp`
          - `date`
          - `_timestamp`
          - `Timestamp`
          - `eventTime`
          - `published_date`

          If your logs put their dates in an attribute not in this list,
          use the log date Remapper Processor to define their date attribute as the official log timestamp.
          The recognized date formats are ISO8601, UNIX (the milliseconds EPOCH format), and RFC3164.

          **Note:** If your logs don’t contain any of the default attributes
          and you haven’t defined your own date attribute, Datadog timestamps
          the logs with the date it received them.

          If multiple log date remapper processors can be applied to a given log,
          only the first one (according to the pipelines order) is taken into account.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        sources:
          description: Array of source attributes.
          example:
            - web
            - gateway
          items:
            description: Attribute used as a source to define the log associated date.
            type: string
          type: array
        type:
          $ref: '#/components/schemas/LogsDateRemapperType'
      required:
        - sources
        - type
      type: object
    LogsStatusRemapper:
      description: |-
        Use this Processor if you want to assign some attributes as the official status.

        Each incoming status value is mapped as follows.

          - Integers from 0 to 7 map to the Syslog severity standards
          - Strings beginning with `emerg` or f (case-insensitive) map to `emerg` (0)
          - Strings beginning with `a` (case-insensitive) map to `alert` (1)
          - Strings beginning with `c` (case-insensitive) map to `critical` (2)
          - Strings beginning with `err` (case-insensitive) map to `error` (3)
          - Strings beginning with `w` (case-insensitive) map to `warning` (4)
          - Strings beginning with `n` (case-insensitive) map to `notice` (5)
          - Strings beginning with `i` (case-insensitive) map to `info` (6)
          - Strings beginning with `d`, `trace` or `verbose` (case-insensitive) map to `debug` (7)
          - Strings beginning with `o` or matching `OK` or `Success` (case-insensitive) map to OK
          - All others map to `info` (6)

          **Note:** If multiple log status remapper processors can be applied to a given log,
          only the first one (according to the pipelines order) is taken into account.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        sources:
          description: Array of source attributes.
          example: []
          items:
            description: Attribute used as a source to define the log associated status.
            type: string
          type: array
        type:
          $ref: '#/components/schemas/LogsStatusRemapperType'
      required:
        - sources
        - type
      type: object
    LogsServiceRemapper:
      description: |-
        Use this processor if you want to assign one or more attributes as the official service.

        **Note:** If multiple service remapper processors can be applied to a given log,
        only the first one (according to the pipeline order) is taken into account.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        sources:
          description: Array of source attributes.
          example:
            - web
            - gateway
          items:
            description: Attribute used as a source to define the log associated service.
            type: string
          type: array
        type:
          $ref: '#/components/schemas/LogsServiceRemapperType'
      required:
        - sources
        - type
      type: object
    LogsMessageRemapper:
      description: |-
        The message is a key attribute in Datadog.
        It is displayed in the message column of the Log Explorer and you can do full string search on it.
        Use this Processor to define one or more attributes as the official log message.

        **Note:** If multiple log message remapper processors can be applied to a given log,
        only the first one (according to the pipeline order) is taken into account.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        sources:
          default:
            - msg
          description: Array of source attributes.
          example:
            - msg
          items:
            description: Attribute used as a source to define the log associated message.
            type: string
          type: array
        type:
          $ref: '#/components/schemas/LogsMessageRemapperType'
      required:
        - sources
        - type
      type: object
    LogsAttributeRemapper:
      description: |-
        The remapper processor remaps any source attribute(s) or tag to another target attribute or tag.
        Constraints on the tag/attribute name are explained in the [Tag Best Practice documentation](https://docs.datadoghq.com/logs/guide/log-parsing-best-practice).
        Some additional constraints are applied as `:` or `,` are not allowed in the target tag/attribute name.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        override_on_conflict:
          default: false
          description: Whether to override the target element if it's already set.
          type: boolean
        preserve_source:
          default: false
          description: Remove or preserve the remapped source element.
          type: boolean
        source_type:
          default: attribute
          description: Defines if the sources are from log `attribute` or `tag`.
          type: string
        sources:
          description: Array of source attributes.
          example:
            - web
            - gateway
          items:
            description: Attribute used as a source to remap its value to the target attribute.
            type: string
          type: array
        target:
          description: Final attribute or tag name to remap the sources to.
          example: operation_id
          type: string
        target_format:
          $ref: '#/components/schemas/TargetFormatType'
        target_type:
          default: attribute
          description: Defines if the final attribute or tag name is from log `attribute` or `tag`.
          type: string
        type:
          $ref: '#/components/schemas/LogsAttributeRemapperType'
      required:
        - sources
        - target
        - type
      type: object
    LogsURLParser:
      description: This processor extracts query parameters and other important parameters from a URL.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        normalize_ending_slashes:
          default: false
          description: Normalize the ending slashes or not.
          nullable: true
          type: boolean
        sources:
          default:
            - http.url
          description: Array of source attributes.
          example:
            - http.url
          items:
            description: Attribute to extract the URL from.
            type: string
          type: array
        target:
          default: http.url_details
          description: Name of the parent attribute that contains all the extracted details from the `sources`.
          example: http.url_details
          type: string
        type:
          $ref: '#/components/schemas/LogsURLParserType'
      required:
        - sources
        - target
        - type
      type: object
    LogsUserAgentParser:
      description: |-
        The User-Agent parser takes a User-Agent attribute and extracts the OS, browser, device, and other user data.
        It recognizes major bots like the Google Bot, Yahoo Slurp, and Bing.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        is_encoded:
          default: false
          description: Define if the source attribute is URL encoded or not.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        sources:
          default:
            - http.useragent
          description: Array of source attributes.
          example:
            - http.useragent
          items:
            description: Attribute to extract the User-Agent from.
            type: string
          type: array
        target:
          default: http.useragent_details
          description: Name of the parent attribute that contains all the extracted details from the `sources`.
          example: http.useragent_details
          type: string
        type:
          $ref: '#/components/schemas/LogsUserAgentParserType'
      required:
        - sources
        - target
        - type
      type: object
    LogsCategoryProcessor:
      description: |-
        Use the Category Processor to add a new attribute (without spaces or special characters in the new attribute name)
        to a log matching a provided search query. Use categories to create groups for an analytical view.
        For example, URL groups, machine groups, environments, and response time buckets.

        **Notes**:

        - The syntax of the query is the one of Logs Explorer search bar.
          The query can be done on any log attribute or tag, whether it is a facet or not.
          Wildcards can also be used inside your query.
        - Once the log has matched one of the Processor queries, it stops.
          Make sure they are properly ordered in case a log could match several queries.
        - The names of the categories must be unique.
        - Once defined in the Category Processor, you can map categories to log status using the Log Status Remapper.
      properties:
        categories:
          description: |-
            Array of filters to match or not a log and their
            corresponding `name` to assign a custom value to the log.
          example: []
          items:
            $ref: '#/components/schemas/LogsCategoryProcessorCategory'
          type: array
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        target:
          description: Name of the target attribute which value is defined by the matching category.
          example: ''
          type: string
        type:
          $ref: '#/components/schemas/LogsCategoryProcessorType'
      required:
        - categories
        - target
        - type
      type: object
    LogsArithmeticProcessor:
      description: |-
        Use the Arithmetic Processor to add a new attribute (without spaces or special characters
        in the new attribute name) to a log with the result of the provided formula.
        This enables you to remap different time attributes with different units into a single attribute,
        or to compute operations on attributes within the same log.

        The formula can use parentheses and the basic arithmetic operators `-`, `+`, `*`, `/`.

        By default, the calculation is skipped if an attribute is missing.
        Select “Replace missing attribute by 0” to automatically populate
        missing attribute values with 0 to ensure that the calculation is done.
        An attribute is missing if it is not found in the log attributes,
        or if it cannot be converted to a number.

        *Notes*:

        - The operator `-` needs to be space split in the formula as it can also be contained in attribute names.
        - If the target attribute already exists, it is overwritten by the result of the formula.
        - Results are rounded up to the 9th decimal. For example, if the result of the formula is `0.1234567891`,
          the actual value stored for the attribute is `0.123456789`.
        - If you need to scale a unit of measure,
          see [Scale Filter](https://docs.datadoghq.com/logs/log_configuration/parsing/?tab=filter#matcher-and-filter).
      properties:
        expression:
          description: Arithmetic operation between one or more log attributes.
          example: ''
          type: string
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        is_replace_missing:
          default: false
          description: |-
            If `true`, it replaces all missing attributes of expression by `0`, `false`
            skip the operation if an attribute is missing.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        target:
          description: Name of the attribute that contains the result of the arithmetic operation.
          example: ''
          type: string
        type:
          $ref: '#/components/schemas/LogsArithmeticProcessorType'
      required:
        - target
        - expression
        - type
      type: object
    LogsStringBuilderProcessor:
      description: |-
        Use the string builder processor to add a new attribute (without spaces or special characters)
        to a log with the result of the provided template.
        This enables aggregation of different attributes or raw strings into a single attribute.

        The template is defined by both raw text and blocks with the syntax `%{attribute_path}`.

        **Notes**:

        - The processor only accepts attributes with values or an array of values in the blocks.
        - If an attribute cannot be used (object or array of object),
          it is replaced by an empty string or the entire operation is skipped depending on your selection.
        - If the target attribute already exists, it is overwritten by the result of the template.
        - Results of the template cannot exceed 256 characters.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        is_replace_missing:
          default: false
          description: |-
            If true, it replaces all missing attributes of `template` by an empty string.
            If `false` (default), skips the operation for missing attributes.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        target:
          description: The name of the attribute that contains the result of the template.
          example: ''
          type: string
        template:
          description: A formula with one or more attributes and raw text.
          example: ''
          type: string
        type:
          $ref: '#/components/schemas/LogsStringBuilderProcessorType'
      required:
        - target
        - template
        - type
      type: object
    LogsPipelineProcessor:
      description: |-
        Nested Pipelines are pipelines within a pipeline. Use Nested Pipelines to split the processing into two steps.
        For example, first use a high-level filtering such as team and then a second level of filtering based on the
        integration, service, or any other tag or attribute.

        A pipeline can contain Nested Pipelines and Processors whereas a Nested Pipeline can only contain Processors.
      properties:
        description:
          description: A description of the pipeline.
          type: string
        filter:
          $ref: '#/components/schemas/LogsFilter'
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        processors:
          description: Ordered list of processors in this pipeline.
          items:
            $ref: '#/components/schemas/LogsProcessor'
          type: array
        tags:
          description: A list of tags associated with the pipeline.
          items:
            description: A single tag using the format `key:value`.
            type: string
          type: array
        type:
          $ref: '#/components/schemas/LogsPipelineProcessorType'
      required:
        - type
      type: object
    LogsGeoIPParser:
      description: |-
        The GeoIP parser takes an IP address attribute and extracts if available
        the Continent, Country, Subdivision, and City information in the target attribute path.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        sources:
          default:
            - network.client.ip
          description: Array of source attributes.
          example:
            - network.client.ip
          items:
            description: Attribute to geo-localize the IP from.
            type: string
          type: array
        target:
          default: network.client.geoip
          description: Name of the parent attribute that contains all the extracted details from the `sources`.
          example: network.client.geoip
          type: string
        type:
          $ref: '#/components/schemas/LogsGeoIPParserType'
      required:
        - sources
        - target
        - type
      type: object
    LogsLookupProcessor:
      description: |-
        Use the Lookup Processor to define a mapping between a log attribute
        and a human readable value saved in the processors mapping table.
        For example, you can use the Lookup Processor to map an internal service ID
        into a human readable service name. Alternatively, you could also use it to check
        if the MAC address that just attempted to connect to the production
        environment belongs to your list of stolen machines.
      properties:
        default_lookup:
          description: Value to set the target attribute if the source value is not found in the list.
          type: string
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        lookup_table:
          description: |-
            Mapping table of values for the source attribute and their associated target attribute values,
            formatted as `["source_key1,target_value1", "source_key2,target_value2"]`
          example:
            - source_key1,target_value1
            - source_key2,target_value2
          items:
            description: Mapping between a source and a value, it should follow the format `"<SOURCE>,<VALUE>"`.
            type: string
          type: array
        name:
          description: Name of the processor.
          type: string
        source:
          description: Source attribute used to perform the lookup.
          example: service_id
          type: string
        target:
          description: |-
            Name of the attribute that contains the corresponding value in the mapping list
            or the `default_lookup` if not found in the mapping list.
          example: service
          type: string
        type:
          $ref: '#/components/schemas/LogsLookupProcessorType'
      required:
        - source
        - target
        - lookup_table
        - type
      type: object
    ReferenceTableLogsLookupProcessor:
      description: |-
        **Note**: Reference Tables are in public beta.
        Use the Lookup Processor to define a mapping between a log attribute
        and a human readable value saved in a Reference Table.
        For example, you can use the Lookup Processor to map an internal service ID
        into a human readable service name. Alternatively, you could also use it to check
        if the MAC address that just attempted to connect to the production
        environment belongs to your list of stolen machines.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        lookup_enrichment_table:
          description: Name of the Reference Table for the source attribute and their associated target attribute values.
          example: service_id_to_service_name_table
          type: string
        name:
          description: Name of the processor.
          type: string
        source:
          description: Source attribute used to perform the lookup.
          example: service_id
          type: string
        target:
          description: Name of the attribute that contains the corresponding value in the mapping list.
          example: service
          type: string
        type:
          $ref: '#/components/schemas/LogsLookupProcessorType'
      required:
        - source
        - target
        - lookup_enrichment_table
        - type
      type: object
    LogsTraceRemapper:
      description: |-
        There are two ways to improve correlation between application traces and logs.

          1. Follow the documentation on [how to inject a trace ID in the application logs](https://docs.datadoghq.com/tracing/connect_logs_and_traces)
          and by default log integrations take care of all the rest of the setup.

          2. Use the Trace remapper processor to define a log attribute as its associated trace ID.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        sources:
          default:
            - dd.trace_id
          description: Array of source attributes.
          items:
            description: Attribute to extract the trace ID from.
            type: string
          type: array
        type:
          $ref: '#/components/schemas/LogsTraceRemapperType'
      required:
        - type
      type: object
    LogsSpanRemapper:
      description: |-
        There are two ways to define correlation between application spans and logs:

          1. Follow the documentation on [how to inject a span ID in the application logs](https://docs.datadoghq.com/tracing/connect_logs_and_traces).
          Log integrations automatically handle all remaining setup steps by default.

          2. Use the span remapper processor to define a log attribute as its associated span ID.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        sources:
          default:
            - dd.span_id
          description: Array of source attributes.
          items:
            description: Attribute to extract the span ID from.
            type: string
          type: array
        type:
          $ref: '#/components/schemas/LogsSpanRemapperType'
      required:
        - type
      type: object
    LogsArrayProcessor:
      description: |-
        A processor for extracting, aggregating, or transforming values from JSON arrays within your logs.
        Supported operations are:
        - Select value from matching element
        - Compute array length
        - Append a value to an array
        - Extract key-value pairs from an array
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        operation:
          $ref: '#/components/schemas/LogsArrayProcessorOperation'
        type:
          $ref: '#/components/schemas/LogsArrayProcessorType'
      required:
        - operation
        - type
      type: object
    LogsDecoderProcessor:
      description: |-
        The decoder processor decodes any source attribute containing a
        base64/base16-encoded UTF-8/ASCII string back to its original value, storing the
        result in a target attribute.
      properties:
        binary_to_text_encoding:
          $ref: '#/components/schemas/LogsDecoderProcessorBinaryToTextEncoding'
        input_representation:
          $ref: '#/components/schemas/LogsDecoderProcessorInputRepresentation'
        is_enabled:
          default: false
          description: Whether the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        source:
          description: Name of the log attribute with the encoded data.
          example: encoded.field
          type: string
        target:
          description: Name of the log attribute that contains the decoded data.
          example: decoded.field
          type: string
        type:
          $ref: '#/components/schemas/LogsDecoderProcessorType'
      required:
        - source
        - target
        - binary_to_text_encoding
        - input_representation
        - type
      type: object
    LogsSchemaProcessor:
      description: A processor that has additional validations and checks for a given schema. Currently supported schema types include OCSF.
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        mappers:
          description: The `LogsSchemaProcessor` `mappers`.
          example:
            - name: Map userIdentity to ocsf.user.uid
              sources:
                - userIdentity.principalId
              target: ocsf.user.uid
              type: schema-remapper
          items:
            $ref: '#/components/schemas/LogsSchemaMapper'
          type: array
        name:
          description: Name of the processor.
          example: Map additionalEventData.LoginTo to ocsf.dst_endpoint.svc_name
          type: string
        schema:
          $ref: '#/components/schemas/LogsSchemaData'
        type:
          $ref: '#/components/schemas/LogsSchemaProcessorType'
      required:
        - name
        - mappers
        - type
        - schema
      type: object
    LogsExcludeAttributeProcessor:
      description: |-
        Use this processor to remove an attribute from a log during processing.
        The processor strips the specified attribute from the log event, which is useful
        when the attribute contains sensitive data or is no longer needed downstream.
      properties:
        attribute_to_exclude:
          description: Name of the log attribute to remove from the log event.
          example: foo
          type: string
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        type:
          $ref: '#/components/schemas/LogsExcludeAttributeProcessorType'
      required:
        - type
        - attribute_to_exclude
      type: object
    LogsArrayMapProcessor:
      description: |-
        The array-map processor transforms each element of a source array by applying
        sub-processors in order and collecting the results into a target array.
        Results can be written to a new array, to the source array (in-place), or to
        an existing target array. Sub-processors can read from `$sourceElem.<field>`
        (object element field), bare `$sourceElem` (primitive element), or any parent
        log attribute path. Sub-processors write to `$targetElem.<field>` (object
        output field) or bare `$targetElem` (primitive output).
      properties:
        is_enabled:
          default: false
          description: Whether or not the processor is enabled.
          type: boolean
        name:
          description: Name of the processor.
          type: string
        preserve_source:
          default: true
          description: |-
            When `false` and `source != target`, the source attribute is removed after
            processing. Cannot be `false` when `source == target`.
          type: boolean
        processors:
          description: |-
            Sub-processors applied to each element. Allowed types: `attribute-remapper`,
            `string-builder-processor`, `arithmetic-processor`, `category-processor`.
          items:
            $ref: '#/components/schemas/LogsArrayMapSubProcessor'
          type: array
        source:
          description: |-
            Attribute path of the source array. Elements are read-only via `$sourceElem`
            inside sub-processors.
          example: detail.resource.s3BucketDetails
          type: string
        target:
          description: |-
            Attribute path of the output array. Sub-processors write to `$targetElem`
            (or `$targetElem.<field>`) to build each output element.
          example: ocsf.resources
          type: string
        type:
          $ref: '#/components/schemas/LogsArrayMapProcessorType'
      required:
        - source
        - target
        - processors
        - type
      type: object
    LogsGroupByMissingString:
