          example: 300000000
          format: int64
          type: integer
        daily_limit_reset:
          $ref: '#/components/schemas/LogsDailyLimitReset'
        daily_limit_warning_threshold_percentage:
          description: A percentage threshold of the daily quota at which a Datadog warning event is generated.
          example: 70
