          description: Whether to always use a text key for element content.
          type: boolean
        attr_prefix:
          description: The prefix to use for XML attributes in the parsed output.
          type: string
        include_attr:
          description: Whether to include XML attributes in the parsed output.
          type: boolean
        parse_bool:
          description: Whether to parse boolean values from strings.
          type: boolean
        parse_null:
          description: Whether to parse null values.
          type: boolean
        parse_number:
          description: Whether to parse numeric values from strings.
          type: boolean
        text_key:
          description: The key name to use for text content within XML elements. Must be at least 1 character if specified.
          minLength: 1
          type: string
        drop_events:
          description: 'If set to `true`, logs that match the quota filter and are sent after the quota is exceeded are dropped. Logs that do not match the filter continue through the pipeline. **Note**: You can set either `drop_events` or `overflow_action`, but not both.'
          example: false
          type: boolean
        ignore_when_missing_partitions:
          description: If `true`, the processor skips quota checks when partition fields are missing from the logs.
          type: boolean
        limit:
          $ref: '#/components/schemas/ObservabilityPipelineQuotaProcessorLimit'
        name:
          description: Name of the quota.
          example: MyQuota
          type: string
        overflow_action:
          $ref: '#/components/schemas/ObservabilityPipelineQuotaProcessorOverflowAction'
        overrides:
          description: A list of alternate quota rules that apply to specific sets of events, identified by matching field values. Each override can define a custom limit.
          items:
            $ref: '#/components/schemas/ObservabilityPipelineQuotaProcessorOverride'
          type: array
        partition_fields:
          description: A list of fields used to segment log traffic for quota enforcement. Quotas are tracked independently by unique combinations of these field values.
          items:
            description: The name of a log field used to partition quota enforcement.
            type: string
          type: array
        too_many_buckets_action:
          $ref: '#/components/schemas/ObservabilityPipelineQuotaProcessorOverflowAction'
        group_by:
          description: A list of fields used to group log events for merging.
          example:
            - log.user.id
            - log.device.id
          items:
            description: A log field path used to group events for aggregation.
            type: string
          type: array
        merge_strategies:
          description: List of merge strategies defining how values from grouped events should be combined.
          items:
            $ref: '#/components/schemas/ObservabilityPipelineReduceProcessorMergeStrategy'
          type: array
        percentage:
          description: The percentage of logs to sample.
          example: 10
          format: double
          type: number
        arrays:
          description: A list of array split configurations.
          items:
            $ref: '#/components/schemas/ObservabilityPipelineSplitArrayProcessorArrayConfig'
          maxItems: 15
          minItems: 1
          type: array
        threshold:
          description: the number of events allowed in a given time window. Events sent after the threshold has been reached, are dropped.
          example: 1000
          format: int64
          type: integer
        window:
          description: The time window in seconds over which the threshold applies.
          example: 60
          format: double
          type: number
        tags:
          description: A list of static tags (key-value pairs) added to each metric processed by this component.
          items:
            $ref: '#/components/schemas/ObservabilityPipelineFieldValue'
          maxItems: 15
          type: array
        interval_secs:
