    CustomDestinationResponseForwardDestination:
      description: A custom destination's location to forward logs.
      properties:
        auth:
          $ref: '#/components/schemas/CustomDestinationResponseHttpDestinationAuth'
        endpoint:
          description: |-
            The destination for which logs will be forwarded to.
            Must have HTTPS scheme and forwarding back to Datadog is not allowed.
          example: https://example.com
          type: string
        type:
          $ref: '#/components/schemas/CustomDestinationResponseForwardDestinationHttpType'
        sourcetype:
          description: |-
            The Splunk sourcetype for the events sent to this Splunk destination.

            If the field is absent from the request and no sourcetype has been previously set on this destination, the default sourcetype `_json` is used.
            On update, if the field is absent from the request but a sourcetype was previously set, the previous value is kept.
            If set to `null`, the sourcetype field is omitted from the forwarded event entirely.
            Otherwise, the provided string value is used as the sourcetype.
          example: my-source
          nullable: true
          type: string
        index_name:
          description: Name of the Elasticsearch index (must follow [Elasticsearch's criteria](https://www.elastic.co/guide/en/elasticsearch/reference/8.11/indices-create-index.html#indices-create-api-path-params)).
          example: nginx-logs
          type: string
        index_rotation:
          description: |-
            Date pattern with US locale and UTC timezone to be appended to the index name after adding `-`
            (that is, `${index_name}-${indexPattern}`).
            You can customize the index rotation naming pattern by choosing one of these options:
            - Hourly: `yyyy-MM-dd-HH` (as an example, it would render: `2022-10-19-09`)
            - Daily: `yyyy-MM-dd` (as an example, it would render: `2022-10-19`)
            - Weekly: `yyyy-'W'ww` (as an example, it would render: `2022-W42`)
            - Monthly: `yyyy-MM` (as an example, it would render: `2022-10`)

            If this field is missing or is blank, it means that the index name will always be the same
            (that is, no rotation).
          example: yyyy-MM-dd
          type: string
        client_id:
          description: Client ID from the Datadog Azure integration.
          example: 9a2f4d83-2b5e-429e-a35a-2b3c4182db71
          type: string
        data_collection_endpoint:
          description: Azure data collection endpoint.
          example: https://my-dce-5kyl.eastus-1.ingest.monitor.azure.com
          type: string
        data_collection_rule_id:
