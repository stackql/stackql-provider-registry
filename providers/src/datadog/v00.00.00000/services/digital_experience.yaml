      description: A retention interval aligned to calendar boundaries.
      properties:
        type:
          $ref: '#/components/schemas/ProductAnalyticsRetentionCalendarTimeIntervalType'
        value:
          $ref: '#/components/schemas/ProductAnalyticsCalendarInterval'
      required:
        - type
        - value
      type: object
    ProductAnalyticsRetentionFixedTimeInterval:
      description: A retention interval of fixed length, such as "7 days".
      properties:
        type:
          $ref: '#/components/schemas/ProductAnalyticsRetentionFixedTimeIntervalType'
        unit:
          $ref: '#/components/schemas/ProductAnalyticsRetentionFixedTimeIntervalUnit'
        value:
          description: Length of the interval, expressed in `unit`.
          example: 7
          exclusiveMinimum: true
          format: double
          minimum: 0
          type: number
      required:
        - type
        - value
        - unit
      type: object
