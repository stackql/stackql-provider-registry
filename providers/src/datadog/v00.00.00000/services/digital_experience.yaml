      description: The discriminator identifying a target selected by aggregation.
      enum:
        - aggregation
      example: aggregation
      type: string
      x-enum-varnames:
        - AGGREGATION
    ProductAnalyticsRetentionCalendarTimeIntervalType:
      description: The discriminator identifying a calendar-aligned retention interval.
      enum:
        - calendar
      example: calendar
      type: string
      x-enum-varnames:
        - CALENDAR
    ProductAnalyticsCalendarInterval:
      description: A calendar-aligned bucket definition, such as "every 1 week starting on Monday".
      properties:
        alignment:
          description: |-
            Where each bucket starts within the calendar unit. Use an hour for `day` (for example `1am` or `14`),
            a day name for `week` (for example `monday`), or an ordinal for `month` (for example `1st`).
          example: monday
          type: string
        quantity:
          description: Number of calendar units per bucket.
          example: 1
          format: int64
          minimum: 1
          type: integer
        timezone:
          description: Timezone used to align the buckets.
          example: UTC
          type: string
        type:
          $ref: '#/components/schemas/ProductAnalyticsCalendarIntervalType'
      required:
        - type
      type: object
    ProductAnalyticsRetentionFixedTimeIntervalType:
      description: The discriminator identifying a fixed-length retention interval.
      enum:
        - fixed
      example: fixed
      type: string
      x-enum-varnames:
        - FIXED
    ProductAnalyticsRetentionFixedTimeIntervalUnit:
      description: Time unit for a fixed-length retention interval.
      enum:
        - day
        - week
        - month
      example: day
      type: string
      x-enum-varnames:
        - DAY
        - WEEK
        - MONTH
    ProductAnalyticsCalendarIntervalType:
      description: Calendar unit used to bucket cohorts.
      enum:
        - minute
        - hour
        - day
        - week
        - month
        - quarter
        - year
      example: week
      type: string
      x-enum-varnames:
        - MINUTE
        - HOUR
        - DAY
        - WEEK
        - MONTH
        - QUARTER
        - YEAR
