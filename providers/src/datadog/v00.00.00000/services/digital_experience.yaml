      type: object
    RUMOperationJourneyCompositeRule:
      description: |-
        A composite rule combining several predicates. Used as an alternative to `nodes` on a journey
        step when several conditions must be matched together, in any order or in a specific order.
      properties:
        composite_rule_id:
          description: The unique identifier of the composite rule. Generated by the server if omitted.
          readOnly: true
          type: string
        config_version:
          description: A hash of the composite rule's configuration, computed by the server.
          readOnly: true
          type: string
        kind:
          $ref: '#/components/schemas/RUMOperationJourneyCompositeRuleKind'
        max_window_ms:
          description: The maximum time window, in milliseconds, in which all predicates must match.
          example: 30000
          format: int64
          type: integer
        predicates:
          description: The list of predicates that must be matched by RUM events.
          items:
            $ref: '#/components/schemas/RUMOperationJourneyPredicate'
          type: array
      required:
