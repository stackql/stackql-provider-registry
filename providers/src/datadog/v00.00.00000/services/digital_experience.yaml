      description: Selects the rolled-up row that aggregates every cohort, rather than a single cohort.
      properties:
        type:
          $ref: '#/components/schemas/ProductAnalyticsRetentionAggregationTargetType'
        value:
          description: The aggregation that produced the rolled-up row.
          example: weighted_avg
          type: string
      required:
        - type
        - value
      type: object
    ProductAnalyticsRetentionIndexTargetType:
      description: The discriminator identifying a target selected by index.
      enum:
        - index
      example: index
      type: string
      x-enum-varnames:
        - INDEX
    RUMOperationJourneyCompositeRuleKind:
      description: |-
        The rule used to combine the composite rule's predicates. `all_of` requires every predicate
        to match, in any order. `in_order` requires every predicate to match in the given order.
      enum:
        - all_of
        - in_order
      example: all_of
      type: string
      x-enum-varnames:
        - ALL_OF
        - IN_ORDER
    RUMOperationJourneyPredicate:
      description: A single predicate within a composite rule, matching RUM events with a query.
