openapi: 3.0.0
info:
  title: digital_experience API
  description: datadog digital_experience API
  version: '1.0'
paths:
  /api/v2/prodlytics:
    post:
      description: |-
        Send server-side events to Product Analytics. Server-side events are retained for 15 months.

        Server-Side events in Product Analytics are helpful for tracking events that occur on the server,
        as opposed to client-side events, which are captured by Real User Monitoring (RUM) SDKs.
        This allows for a more comprehensive view of the user journey by including actions that happen on the server.
        Typical examples could be `checkout.completed` or `payment.processed`.

        Ingested server-side events are integrated into Product Analytics to allow users to select and filter
        these events in the event picker, similar to how views or actions are handled.

        **Requirements:**
        - At least one of `usr`, `account`, or `session` must be provided with a valid ID.
        - The `application.id` must reference a Product Analytics-enabled application.

        **Custom Attributes:**
        Any additional fields in the payload are flattened and searchable as facets.
        For example, a payload with `{"customer": {"tier": "premium"}}` is searchable with
        the syntax `@customer.tier:premium` in Datadog.

        The status codes answered by the HTTP API are:
        - 202: Accepted: The request has been accepted for processing
        - 400: Bad request (likely an issue in the payload formatting)
        - 401: Unauthorized (likely a missing API Key)
        - 403: Permission issue (likely using an invalid API Key)
        - 408: Request Timeout, request should be retried after some time
        - 413: Payload too large (batch is above 5MB uncompressed)
        - 429: Too Many Requests, request should be retried after some time
        - 500: Internal Server Error, the server encountered an unexpected condition that prevented it from fulfilling the request, request should be retried after some time
        - 503: Service Unavailable, the server is not ready to handle the request probably because it is overloaded, request should be retried after some time
      operationId: SubmitProductAnalyticsEvent
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  application:
                    id: 123abcde-123a-123b-1234-123456789abc
                  event:
                    name: payment.processed
                  type: server
                  usr:
                    id: '123'
              event-with-account:
                description: Send a server-side event linked to an account.
                summary: Event with account ID
                value:
                  account:
                    id: account-456
                  application:
                    id: 123abcde-123a-123b-1234-123456789abc
                  event:
                    name: checkout.completed
                  type: server
              event-with-custom-attributes:
                description: Send a server-side event with additional custom attributes.
                summary: Event with custom attributes
                value:
                  application:
                    id: 123abcde-123a-123b-1234-123456789abc
                  customer:
                    tier: premium
                  event:
                    name: payment.processed
                  type: server
                  usr:
                    id: '123'
              event-with-session:
                description: Send a server-side event linked to a session.
                summary: Event with session ID
                value:
                  application:
                    id: 123abcde-123a-123b-1234-123456789abc
                  event:
                    name: form.submitted
                  session:
                    id: session-789
                  type: server
              simple-event-with-user:
                description: Send a server-side event linked to a user.
                summary: Simple event with user ID
                value:
                  application:
                    id: 123abcde-123a-123b-1234-123456789abc
                  event:
                    name: payment.processed
                  type: server
                  usr:
                    id: '123'
            schema:
              $ref: '#/components/schemas/ProductAnalyticsServerSideEventItem'
        description: Server-side event to send (JSON format).
        required: true
      responses:
        '202':
          content:
            application/json:
              examples:
                default:
                  value: {}
              schema:
                type: string
                description: (opaque JSON object)
          description: Request accepted for processing (always 202 empty JSON).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsServerSideEventErrors'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsServerSideEventErrors'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsServerSideEventErrors'
          description: Forbidden
        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsServerSideEventErrors'
          description: Request Timeout
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsServerSideEventErrors'
          description: Payload Too Large
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsServerSideEventErrors'
          description: Too Many Requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsServerSideEventErrors'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsServerSideEventErrors'
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Send server-side events
      tags:
        - Product Analytics
      x-codegen-request-body-name: body
    servers:
      - url: https://{site:.+}
        variables:
          site:
            default: browser-intake-datadoghq.com
            description: The intake domain for the regional site.
  /api/v2/product-analytics/accounts/facet_info:
    post:
      description: Get facet information for account attributes including possible values and counts
      operationId: GetAccountFacetInfo
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      facet_id: first_browser_name
                      limit: 10
                      search:
                        query: user_org_id:5001 AND first_country_code:US
                      term_search:
                        value: Chrome
                    id: facet_info_request
                    type: users_facet_info_request
            schema:
              $ref: '#/components/schemas/FacetInfoRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        result:
                          values:
                            - count: 4892
                              value: Chrome
                      id: facet_info_response
                      type: users_facet_info
              schema:
                $ref: '#/components/schemas/FacetInfoResponse'
          description: Successful response with facet information
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ: []
      summary: Get account facet info
      tags:
        - Rum Audience Management
      x-unstable: '**Note**: This endpoint may be subject to changes.'
  /api/v2/product-analytics/accounts/query:
    post:
      description: Query accounts with flexible filtering by account properties
      operationId: QueryAccounts
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      limit: 20
                      query: plan_type:enterprise AND user_count:>100 AND subscription_status:active
                      select_columns:
                        - account_id
                        - account_name
                        - user_count
                        - plan_type
                        - subscription_status
                        - created_at
                        - mrr
                        - industry
                      sort:
                        field: user_count
                        order: DESC
                      wildcard_search_term: tech
                    id: query_account_request
                    type: query_account_request
            schema:
              $ref: '#/components/schemas/QueryAccountRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        hits:
                          - account_id: '123'
                            account_name: Example Account
                            plan_type: enterprise
                            user_count: 150
                        total: 1
                      id: query_response
                      type: query_response
              schema:
                $ref: '#/components/schemas/QueryResponse'
          description: Successful response with account data
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ: []
      summary: Query accounts
      tags:
        - Rum Audience Management
      x-unstable: '**Note**: This endpoint may be subject to changes.'
  /api/v2/product-analytics/analytics/list:
    post:
      description: |-
        List the individual event records matching an analytics query.
        Use `columns` to choose the attributes returned on each row, `sort` to order the rows,
        and `limit` to cap how many are returned.
      operationId: QueryProductAnalyticsList
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      from: 1771232048460
                      query:
                        columns:
                          - '@view.name'
                        limit: 100
                        query:
                          data_source: product_analytics
                          search:
                            query: '@type:view'
                      to: 1771836848262
                    type: formula_analytics_extended_list_request
            schema:
              $ref: '#/components/schemas/ProductAnalyticsAnalyticsListRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        records: []
                        total_count: 0
                      id: abc-123
                      type: list_response
              schema:
                $ref: '#/components/schemas/ProductAnalyticsAnalyticsListResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: List analytics events
      tags:
        - Product Analytics
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - rum_apps_read
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/product-analytics/analytics/scalar:
    post:
      description: |-
        Compute scalar analytics results for Product Analytics data.
        Returns aggregated values (counts, averages, percentiles) optionally grouped by facets.
      operationId: QueryProductAnalyticsScalar
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      from: 1771232048460
                      query:
                        compute:
                          aggregation: count
                        query:
                          data_source: product_analytics
                          search:
                            query: '@type:view'
                      to: 1771836848262
                    type: formula_analytics_extended_request
            schema:
              $ref: '#/components/schemas/ProductAnalyticsAnalyticsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        columns: []
                      id: abc-123
                      type: scalar_response
              schema:
                $ref: '#/components/schemas/ProductAnalyticsScalarResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Compute scalar analytics
      tags:
        - Product Analytics
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - rum_apps_read
  /api/v2/product-analytics/analytics/timeseries:
    post:
      description: |-
        Compute timeseries analytics results for Product Analytics data.
        Returns time-bucketed values for charts and trend analysis.
        The `compute.interval` field (milliseconds) is required for time bucketing.
      operationId: QueryProductAnalyticsTimeseries
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      from: 1771232048460
                      query:
                        compute:
                          aggregation: count
                        query:
                          data_source: product_analytics
                          search:
                            query: '@type:view'
                      to: 1771836848262
                    type: formula_analytics_extended_request
            schema:
              $ref: '#/components/schemas/ProductAnalyticsAnalyticsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        series: []
                        times: []
                      id: abc-123
                      type: timeseries_response
              schema:
                $ref: '#/components/schemas/ProductAnalyticsTimeseriesResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Compute timeseries analytics
      tags:
        - Product Analytics
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - rum_apps_read
  /api/v2/product-analytics/journey/funnel:
    post:
      description: |-
        Compute a funnel over an ordered sequence of Product Analytics events.
        Returns the per-step conversion counts, conversion rates, and elapsed times,
        optionally segmented by group-by facets.
      operationId: QueryProductAnalyticsJourneyFunnel
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      from: 1756425600000
                      query:
                        compute:
                          aggregation: count
                        search:
                          expression: A -> B
                          node_objects:
                            A:
                              data_source: product_analytics
                              search:
                                query: '@type:view @view.name:Login'
                            B:
                              data_source: product_analytics
                              search:
                                query: '@type:action @action.target.name:Submit'
                      to: 1756857600000
                    type: journey_request
            schema:
              $ref: '#/components/schemas/ProductAnalyticsJourneyFunnelRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        end_to_end_conversion_rate: 0.42
                        end_to_end_elapsed_time:
                          avg: 9400
                          max: 86400
                          min: 1200
                        funnel_steps:
                          - elapsed_time_to_next_step:
                              avg: 5100
                              max: 42000
                              min: 900
                            groups: []
                            label: A
                            unit: millisecond
                            value: 1200
                        initial_count: 1200
                      id: 00000000-0000-0000-0000-000000000000
                      type: funnel_response
              schema:
                $ref: '#/components/schemas/ProductAnalyticsJourneyFunnelResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Compute journey funnel analysis
      tags:
        - Product Analytics
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - rum_apps_read
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/product-analytics/journey/list:
    post:
      description: |-
        Return the individual sessions that reached, or dropped off at, a given step of the journey.
        Each row contains the identity join key, the event timestamp, and the columns requested
        in `entity_columns`.
      operationId: QueryProductAnalyticsJourneyList
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      from: 1756425600000
                      query:
                        entity_columns:
                          - '@usr.name'
                        limit: 50
                        search:
                          expression: A -> B
                          node_objects:
                            A:
                              data_source: product_analytics
                              search:
                                query: '@type:view @view.name:Login'
                            B:
                              data_source: product_analytics
                              search:
                                query: '@type:action @action.target.name:Submit'
                      to: 1756857600000
                    type: journey_list_request
            schema:
              $ref: '#/components/schemas/ProductAnalyticsJourneyListRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        entity: session
                        records:
                          - '@session.id': 00000000-0000-0000-0000-000000000001
                            '@usr.name': Jane Doe
                            timestamp: 1756425600000
                        total_count: 231
                      id: 00000000-0000-0000-0000-000000000000
                      type: journey_list_response
              schema:
                $ref: '#/components/schemas/ProductAnalyticsJourneyListResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: List journey entities
      tags:
        - Product Analytics
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - rum_apps_read
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/product-analytics/journey/scalar:
    post:
      description: |-
        Compute scalar results for a journey query, such as the conversion count,
        the conversion rate, or the time to convert, optionally segmented by group-by facets.
      operationId: QueryProductAnalyticsJourneyScalar
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      from: 1756425600000
                      query:
                        compute:
                          aggregation: count
                          metric: __dd.conversion_rate
                        search:
                          expression: A -> B
                          node_objects:
                            A:
                              data_source: product_analytics
                              search:
                                query: '@type:view @view.name:Login'
                            B:
                              data_source: product_analytics
                              search:
                                query: '@type:action @action.target.name:Submit'
                      to: 1756857600000
                    type: formula_journey_request
            schema:
              $ref: '#/components/schemas/ProductAnalyticsJourneyScalarRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        columns: []
                      id: 00000000-0000-0000-0000-000000000000
                      type: journey_scalar_response
              schema:
                $ref: '#/components/schemas/ProductAnalyticsJourneyScalarResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Compute journey scalar analytics
      tags:
        - Product Analytics
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - rum_apps_read
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/product-analytics/journey/timeseries:
    post:
      description: |-
        Compute timeseries results for a journey query.
        Returns one series per group-by combination, bucketed by the requested interval.
      operationId: QueryProductAnalyticsJourneyTimeseries
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      from: 1756425600000
                      interval: 3600000
                      query:
                        compute:
                          aggregation: count
                        search:
                          expression: A -> B
                          node_objects:
                            A:
                              data_source: product_analytics
                              search:
                                query: '@type:view @view.name:Login'
                            B:
                              data_source: product_analytics
                              search:
                                query: '@type:action @action.target.name:Submit'
                      to: 1756857600000
                    type: formula_journey_request
            schema:
              $ref: '#/components/schemas/ProductAnalyticsFormulaJourneyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        series: []
                        times: []
                      id: 00000000-0000-0000-0000-000000000000
                      type: journey_timeseries_response
              schema:
                $ref: '#/components/schemas/ProductAnalyticsJourneyTimeseriesResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Compute journey timeseries analytics
      tags:
        - Product Analytics
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - rum_apps_read
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/product-analytics/retention/grid:
    post:
      description: |-
        Compute a retention grid, showing how much of each cohort came back over each subsequent period.
        Rows are cohorts, columns are return periods, and each cell holds the count and rate of entities that returned.
      operationId: QueryProductAnalyticsRetentionGrid
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      from: 1756425600000
                      query:
                        compute:
                          aggregation: count
                          metric: __dd.retention_rate
                        search:
                          cohort_criteria:
                            base_query:
                              data_source: product_analytics
                              search:
                                query: '@type:view @view.name:Signup'
                            time_interval:
                              type: calendar
                              value:
                                alignment: monday
                                quantity: 1
                                timezone: UTC
                                type: week
                          retention_entity: '@usr.id'
                          return_condition: conversion_on_or_after
                          return_criteria:
                            base_query:
                              data_source: product_analytics
                              search:
                                query: '@type:view'
                      to: 1756857600000
                    type: retention_grid_request
            schema:
              $ref: '#/components/schemas/ProductAnalyticsRetentionGridRequest'
        description: The retention grid query.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        cohorts: []
                        retention_entity: '@usr.id'
                        retention_periods: []
                      id: 00000000-0000-0000-0000-000000000000
                      type: retention_grid_response
              schema:
                $ref: '#/components/schemas/ProductAnalyticsRetentionGridResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Compute a retention grid
      tags:
        - Product Analytics
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - rum_apps_read
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/product-analytics/retention/list:
    post:
      description: |-
        List the individual users or accounts counted in one cell of the retention grid.
        Set `computation_scope` to the cohort and return period you want to examine.
      operationId: QueryProductAnalyticsRetentionList
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      from: 1756425600000
                      query:
                        columns:
                          - field:
                              path: '@usr.email'
                        computation_scope:
                          cohort_target:
                            type: index
                            value: 0
                          return_period_target:
                            type: index
                            value: 1
                          type: cell
                        limit: 100
                        search:
                          cohort_criteria:
                            base_query:
                              data_source: product_analytics
                              search:
                                query: '@type:view @view.name:Signup'
                            time_interval:
                              type: calendar
                              value:
                                quantity: 1
                                type: week
                          retention_entity: '@usr.id'
                          return_condition: conversion_on_or_after
                      to: 1756857600000
                    type: retention_list_request
            schema:
              $ref: '#/components/schemas/ProductAnalyticsRetentionListRequest'
        description: The retention list query.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        records: []
                        retention_entity: '@usr.id'
                      id: 00000000-0000-0000-0000-000000000000
                      type: retention_list_response
              schema:
                $ref: '#/components/schemas/ProductAnalyticsRetentionListResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
