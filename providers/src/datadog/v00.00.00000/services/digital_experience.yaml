        - <=
        - '>='
      example: <=
      type: string
      x-enum-varnames:
        - EQUAL
        - LESS_THAN
        - GREATER_THAN
        - LESS_THAN_OR_EQUAL
        - GREATER_THAN_OR_EQUAL
