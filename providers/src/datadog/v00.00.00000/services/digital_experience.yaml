      enum:
        - product_analytics_occurrence
      example: product_analytics_occurrence
      type: string
      x-enum-varnames:
        - PRODUCT_ANALYTICS_OCCURRENCE
    ProductAnalyticsOccurrenceSearch:
      description: Search parameters for an occurrence query.
      properties:
        occurrences:
          $ref: '#/components/schemas/ProductAnalyticsOccurrenceFilter'
        query:
          description: The search query using Datadog search syntax.
          example: '@type:action'
          type: string
      type: object
    ProductAnalyticsJourneyAudienceFilters:
      description: |-
        Restricts the journey to an audience built from named sub-queries.
        Sub-query names must be unique across `users`, `segments`, and `accounts`.
      properties:
        accounts:
          description: Named account sub-queries.
          items:
            $ref: '#/components/schemas/ProductAnalyticsJourneyAudienceAccountQuery'
          type: array
        formula:
          description: |-
            Boolean expression combining the sub-query names with `AND`, `OR`, and `NOT`.
            When empty, all sub-queries are combined with `AND`.
          example: power_users AND NOT trial_segment
          type: string
        segments:
          description: Named segment sub-queries.
          items:
            $ref: '#/components/schemas/ProductAnalyticsJourneyAudienceSegmentQuery'
          type: array
        users:
          description: Named user sub-queries.
          items:
            $ref: '#/components/schemas/ProductAnalyticsJourneyAudienceUserQuery'
          type: array
      type: object
    ProductAnalyticsJourneySearchGraphFilter:
      description: A filter applied to a step, or a range of steps, of the journey graph.
      properties:
        name:
          $ref: '#/components/schemas/ProductAnalyticsJourneySearchGraphFilterName'
        operator:
          $ref: '#/components/schemas/ProductAnalyticsJourneySearchGraphFilterOperator'
        target:
          $ref: '#/components/schemas/ProductAnalyticsJourneyTarget'
        value:
          description: Value compared against the metric. Durations are expressed in milliseconds.
          example: 60000
          format: int64
          type: integer
      required:
        - name
        - operator
        - value
      type: object
    ProductAnalyticsJourneyNodeTargetType:
      description: The discriminator identifying a target that references a single step.
      enum:
        - node
      example: node
      type: string
      x-enum-varnames:
        - NODE
    ProductAnalyticsJourneyPathTargetType:
      description: The discriminator identifying a target that references a range of steps.
      enum:
        - path
      example: path
      type: string
      x-enum-varnames:
        - PATH
