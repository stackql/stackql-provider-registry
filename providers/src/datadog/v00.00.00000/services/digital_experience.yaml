      enum:
        - return_period
      example: return_period
      type: string
      x-enum-varnames:
        - RETURN_PERIOD
    ProductAnalyticsRetentionTimeInterval:
      description: |-
        A retention interval, either aligned to calendar boundaries or of a fixed length.
        Cohort criteria use calendar intervals; return criteria use fixed intervals.
      properties:
        type:
          $ref: '#/components/schemas/ProductAnalyticsRetentionCalendarTimeIntervalType'
        value:
          $ref: '#/components/schemas/ProductAnalyticsCalendarInterval'
        unit:
          $ref: '#/components/schemas/ProductAnalyticsRetentionFixedTimeIntervalUnit'
      required:
        - type
        - value
        - unit
      type: object
