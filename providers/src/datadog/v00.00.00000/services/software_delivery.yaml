    FlakyTestAttributes:
      description: Attributes of a flaky test.
      properties:
        attempt_to_fix_id:
          description: |-
            Unique identifier for the attempt to fix this flaky test. Use this ID in the Git commit message in order to trigger the attempt to fix workflow.

            When the workflow is triggered the test is automatically retried by the tracer a certain number of configurable times. When all retries pass, the test is automatically marked as fixed in Flaky Test Management.
            Test runs are tagged with @test.test_management.attempt_to_fix_passed and @test.test_management.is_attempt_to_fix when the attempt to fix workflow is triggered.
          example: I42TEO
          type: string
        codeowners:
          description: The name of the test's code owners as inferred from the repository configuration.
          example:
            - '@foo'
            - '@bar'
          items:
            description: A code owner of the test as inferred from the repository configuration.
            type: string
          type: array
        envs:
          description: List of environments where this test has been flaky.
          example: prod
          items:
            description: An environment name where this test has been flaky.
            type: string
          type: array
        first_flaked_branch:
          description: The branch name where the test exhibited flakiness for the first time.
          example: main
          type: string
        first_flaked_sha:
          description: The commit SHA where the test exhibited flakiness for the first time.
          example: 0c6be03165b7f7ffe96e076ffb29afb2825616c3
          type: string
        first_flaked_ts:
          description: Unix timestamp when the test exhibited flakiness for the first time.
          example: 1757688149
          format: int64
          type: integer
        flaky_category:
          description: The category of a flaky test.
          example: Timeout
          nullable: true
          type: string
        flaky_state:
          $ref: '#/components/schemas/FlakyTestAttributesFlakyState'
        history:
          description: |-
            Chronological history of status changes for this flaky test, ordered from most recent to oldest.
            Includes state transitions like new -> quarantined -> fixed, along with the associated commit SHA when available.
          example:
            - commit_sha: abc123def456
              policy_id: ftm_policy.quarantine.failure_rate
              policy_meta:
                config:
                  failure_rate: 0.1
                  required_runs: 100
                failure_rate: 0.25
                total_runs: 200
              status: quarantined
              timestamp: 1704067200000
            - commit_sha: ''
              policy_id: unknown
              policy_meta: null
              status: new
              timestamp: 1703980800000
          items:
            $ref: '#/components/schemas/FlakyTestHistory'
          type: array
        impact_level:
          $ref: '#/components/schemas/FlakyTestImpactLevel'
          nullable: true
        impact_score:
          description: A score from 0 to 1 indicating the impact of this flaky test, based on factors such as how often it fails and how many pipelines it affects.
          example: 0.78
          format: double
          maximum: 1
          minimum: 0
          nullable: true
          type: number
        last_flaked_branch:
          description: The branch name where the test exhibited flakiness for the last time.
          example: main
          type: string
        last_flaked_sha:
          description: The commit SHA where the test exhibited flakiness for the last time.
          example: 0c6be03165b7f7ffe96e076ffb29afb2825616c3
          type: string
        last_flaked_ts:
          description: Unix timestamp when the test exhibited flakiness for the last time.
          example: 1757688149
          format: int64
          type: integer
        module:
          description: |-
            The name of the test module. The definition of module changes slightly per language:
            - In .NET, a test module groups every test that is run under the same unit test project.
            - In Swift, a test module groups every test that is run for a given bundle.
            - In JavaScript, the test modules map one-to-one to test sessions.
            - In Java, a test module groups every test that is run by the same Maven Surefire/Failsafe or Gradle Test task execution.
            - In Python, a test module groups every test that is run under the same `.py` file as part of a test suite, which is typically managed by a framework like `unittest` or `pytest`.
            - In Ruby, a test module groups every test that is run within the same test file, which is typically managed by a framework like `RSpec` or `Minitest`.
          example: TestModule
          nullable: true
          type: string
        name:
          description: The test name. A concise name for a test case. Defined in the test itself.
          example: TestName
          type: string
        pipeline_stats:
          $ref: '#/components/schemas/FlakyTestPipelineStats'
          nullable: true
        services:
          description: |-
            List of test service names where this test has been flaky.

            A test service is a group of tests associated with a project or repository. It contains all the individual tests for your code, optionally organized into test suites, which are like folders for your tests.
          example:
            - foo
            - bar
          items:
            description: A test service name where this test has been flaky.
            type: string
          type: array
        suite:
          description: The name of the test suite. A group of tests exercising the same unit of code depending on your language and testing framework.
          example: TestSuite
          type: string
        test_run_metadata:
          $ref: '#/components/schemas/FlakyTestRunMetadata'
        test_stats:
          $ref: '#/components/schemas/FlakyTestStats'
      type: object
    FlakyTestType:
      description: The type of the flaky test from Flaky Test Management.
      enum:
        - flaky_test
      type: string
      x-enum-varnames:
        - FLAKY_TEST
