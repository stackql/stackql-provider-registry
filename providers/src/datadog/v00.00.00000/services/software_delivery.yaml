openapi: 3.0.0
info:
  title: software_delivery API
  description: datadog software_delivery API
  version: '1.0'
paths:
  /api/v2/ci/github/accounts:
    get:
      description: |-
        Retrieve the list of GitHub accounts (organizations or users) available to this Datadog organization
        through its GitHub App installation, along with each account's and repository's CI Visibility opt-in status.
      operationId: ListCIAppGitHubAccounts
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          account: datadog
                          enabled: true
                          host: github.com
                          repo_count: 2
                          repositories:
                            - enabled: true
                              name: shopist
                            - enabled: false
                              name: dd-source
                        id: github.com/datadog
                        type: ci_github_account
              schema:
                $ref: '#/components/schemas/CIAppGitHubAccountsResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - integrations_read
      summary: List GitHub CI Visibility status
      tags:
        - CI Visibility GitHub Accounts
      x-permission:
        operator: OR
        permissions:
          - integrations_read
    patch:
      description: |-
        Enable or disable CI Visibility for a GitHub account, one of its repositories, or both in the same request.
        The account (and, optionally, repository) are identified by name. Account-level and repository-level
        changes are independent and may both be supplied in the same request. At least one of `enabled` or
        `repository.enabled` must be provided. If the account name matches installations on more than one host,
        `host` must be supplied to disambiguate, otherwise a 409 is returned. Returns a 404 if the CI Visibility
        GitHub integration is not enabled for this organization, or if the given account or repository cannot be
        found by name.
      operationId: UpdateCIAppGitHubAccount
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      account: datadog
                      enabled: true
                      host: github.com
                      repository:
                        enabled: true
                        name: shopist
                    type: ci_github_account
            schema:
              $ref: '#/components/schemas/CIAppGitHubAccountUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        account: datadog
                        enabled: true
                        host: github.com
                        repo_count: 2
                        repositories:
                          - enabled: true
                            name: shopist
                          - enabled: false
                            name: dd-source
                      id: github.com/datadog
                      type: ci_github_account
              schema:
                $ref: '#/components/schemas/CIAppGitHubAccountResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - ci_provider_settings_write
      summary: Update GitHub CI Visibility status
      tags:
        - CI Visibility GitHub Accounts
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - ci_provider_settings_write
  /api/v2/ci/pipeline:
    post:
      description: |-
        Send your pipeline event to your Datadog platform over HTTP. For details about how pipeline executions are modeled and what execution types we support, see [Pipeline Data Model And Execution Types](https://docs.datadoghq.com/continuous_integration/guides/pipeline_data_model/).

        Multiple events can be sent in an array (up to 1000).

        Pipeline events can be submitted with a timestamp that is up to 18 hours in the past.
        The duration between the event start and end times cannot exceed 1 year.
      operationId: CreateCIAppPipelineEvent
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      resource:
                        end: '2024-11-25T20:08:11.018Z'
                        git:
                          author_email: john.doe@email.com
                          repository_url: https://github.com/organization/example-repository
                          sha: 7f263865994b76066c4612fd1965215e7dcb4cd2
                        level: pipeline
                        name: Deploy to AWS
                        partial_retry: false
                        start: '2024-11-25T20:06:41.018Z'
                        status: success
                        unique_id: 3eacb6f3-ff04-4e10-8a9c-46e6d054024a
                        url: https://my-ci-provider.example/pipelines/my-pipeline/run/1
                    type: cipipeline_resource_request
            schema:
              $ref: '#/components/schemas/CIAppCreatePipelineEventRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              examples:
                default:
                  value: {}
              schema:
                type: string
                description: (opaque JSON object)
          description: Request accepted for processing
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPCIAppErrors'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPCIAppErrors'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPCIAppErrors'
          description: Forbidden
        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPCIAppErrors'
          description: Request Timeout
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPCIAppErrors'
          description: Payload Too Large
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPCIAppErrors'
          description: Too Many Requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPCIAppErrors'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPCIAppErrors'
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Send pipeline event
      tags:
        - CI Visibility Pipelines
      x-codegen-request-body-name: body
  /api/v2/ci/pipelines/analytics/aggregate:
    post:
      description: Use this API endpoint to aggregate CI Visibility pipeline events into buckets of computed metrics and timeseries.
      operationId: AggregateCIAppPipelineEvents
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  compute:
                    - aggregation: pc90
                      interval: 5m
                      metric: '@duration'
                      type: timeseries
                  filter:
                    from: now-15m
                    query: '@ci.provider.name:github AND @ci.status:error'
                    to: now
                  group_by:
                    - facet: '@ci.status'
                      histogram:
                        interval: 10
                        max: 100
                        min: 50
                      sort:
                        aggregation: count
                        order: asc
                  options:
                    timezone: GMT
            schema:
              $ref: '#/components/schemas/CIAppPipelinesAggregateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      buckets:
                        - by:
                            '@ci.status': error
                          computes:
                            pc90:
                              - time: '2020-06-08T11:55:00.123Z'
                                value: 2345
              schema:
                $ref: '#/components/schemas/CIAppPipelinesAnalyticsAggregateResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - ci_visibility_read
      summary: Aggregate pipelines events
      tags:
        - CI Visibility Pipelines
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - ci_visibility_read
  /api/v2/ci/pipelines/events:
    get:
      description: |-
        List endpoint returns CI Visibility pipeline events that match a [search query](https://docs.datadoghq.com/continuous_integration/explorer/search_syntax/).
        [Results are paginated similarly to logs](https://docs.datadoghq.com/logs/guide/collect-multiple-logs-with-pagination).

        Use this endpoint to see your latest pipeline events.
      operationId: ListCIAppPipelineEvents
      parameters:
        - description: Search query following log syntax.
          example: '@ci.provider.name:github @ci.pipeline.name:Pull Request Labeler'
          in: query
          name: filter[query]
          required: false
          schema:
            type: string
        - description: Minimum timestamp for requested events.
          example: '2019-01-02T09:42:36.320Z'
          in: query
          name: filter[from]
          required: false
          schema:
            format: date-time
            type: string
        - description: Maximum timestamp for requested events.
          example: '2019-01-03T09:42:36.320Z'
          in: query
          name: filter[to]
          required: false
          schema:
            format: date-time
            type: string
        - description: Order of events in results.
          in: query
          name: sort
          required: false
          schema:
            $ref: '#/components/schemas/CIAppSort'
        - description: List following results with a cursor provided in the previous query.
          example: eyJzdGFydEF0IjoiQVFBQUFYS2tMS3pPbm40NGV3QUFBQUJCV0V0clRFdDZVbG8zY3pCRmNsbHJiVmxDWlEifQ==
          in: query
          name: page[cursor]
          required: false
          schema:
            type: string
        - description: Maximum number of events in the response.
          example: 25
          in: query
          name: page[limit]
          required: false
          schema:
            default: 10
            format: int32
            maximum: 1000
            type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data: []
                    meta:
                      page: {}
              schema:
                $ref: '#/components/schemas/CIAppPipelineEventsResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - ci_visibility_read
      summary: Get a list of pipelines events
      tags:
        - CI Visibility Pipelines
      x-pagination:
        cursorParam: page[cursor]
        cursorPath: meta.page.after
        limitParam: page[limit]
        resultsPath: data
      x-permission:
        operator: OR
        permissions:
          - ci_visibility_read
  /api/v2/ci/pipelines/events/search:
    post:
      description: |-
        List endpoint returns CI Visibility pipeline events that match a [search query](https://docs.datadoghq.com/continuous_integration/explorer/search_syntax/).
        [Results are paginated similarly to logs](https://docs.datadoghq.com/logs/guide/collect-multiple-logs-with-pagination).

        Use this endpoint to build complex events filtering and search.
      operationId: SearchCIAppPipelineEvents
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  filter:
                    from: now-15m
                    query: '@ci.provider.name:github AND @ci.status:error'
                    to: now
                  options:
                    timezone: GMT
                  page:
                    cursor: eyJzdGFydEF0IjoiQVFBQUFYS2tMS3pPbm40NGV3QUFBQUJCV0V0clRFdDZVbG8zY3pCRmNsbHJiVmxDWlEifQ==
                    limit: 25
                  sort: timestamp
            schema:
              $ref: '#/components/schemas/CIAppPipelineEventsRequest'
        required: false
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          attributes:
                            duration: 2345
                          ci_level: pipeline
                          tags:
                            - team:backend
                        id: AAAAAWgN8Xwgr1vKDQAAAABBV2dOOFh3ZzZobm1mWXJFYTR0OA
                        type: cipipeline
                    meta:
                      elapsed: 132
                      request_id: MWlFUjVaWGZTTTZPYzM0VXp1OXU2d3xLSVpEMjZKQ0VKUTI0dEYtM3RSOFVR
                      status: done
              schema:
                $ref: '#/components/schemas/CIAppPipelineEventsResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - ci_visibility_read
      summary: Search pipelines events
      tags:
        - CI Visibility Pipelines
      x-codegen-request-body-name: body
      x-pagination:
        cursorParam: body.page.cursor
        cursorPath: meta.page.after
        limitParam: body.page.limit
        resultsPath: data
      x-permission:
        operator: OR
        permissions:
          - ci_visibility_read
  /api/v2/ci/test-optimization/settings/policies:
    patch:
      description: |-
        Partially update Flaky Tests Management repository-level policies for the given repository.
        Only provided policy blocks are updated; omitted blocks are left unchanged.
      operationId: UpdateFlakyTestsManagementPolicies
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      attempt_to_fix:
                        retries: 3
                      disabled:
                        enabled: false
                      quarantined:
                        auto_quarantine_rule:
                          enabled: true
                          window_seconds: 3600
                        branch_rule:
                          branches:
                            - main
                          enabled: true
                          excluded_branches: []
                          excluded_test_services: []
                        enabled: true
                        failure_rate_rule:
                          branches:
                            - main
                          enabled: true
                          min_runs: 10
                          threshold: 0.5
                      repository_id: github.com/example-org/example-repo
                    type: test_optimization_update_flaky_tests_management_policies_request
            schema:
              $ref: '#/components/schemas/TestOptimizationFlakyTestsManagementPoliciesUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        repository_id: github.com/datadog/test-service
                      id: github.com/datadog/test-service
                      type: test_optimization_flaky_tests_management_policies
              schema:
                $ref: '#/components/schemas/TestOptimizationFlakyTestsManagementPoliciesResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - test_optimization_settings_write
      summary: Update Flaky Tests Management policies
      tags:
        - Test Optimization
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - test_optimization_settings_write
    post:
      description: Retrieve Flaky Tests Management repository-level policies for the given repository.
      operationId: GetFlakyTestsManagementPolicies
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      repository_id: github.com/example-org/example-repo
                    type: test_optimization_get_flaky_tests_management_policies_request
            schema:
              $ref: '#/components/schemas/TestOptimizationFlakyTestsManagementPoliciesGetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        repository_id: github.com/datadog/test-service
                      id: github.com/datadog/test-service
                      type: test_optimization_flaky_tests_management_policies
              schema:
                $ref: '#/components/schemas/TestOptimizationFlakyTestsManagementPoliciesResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - test_optimization_read
      summary: Get Flaky Tests Management policies
      tags:
        - Test Optimization
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - test_optimization_read
  /api/v2/ci/test-optimization/settings/service:
    delete:
      description: Delete Test Optimization settings for a specific service identified by repository, service name, and environment.
      operationId: DeleteTestOptimizationServiceSettings
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      env: prod
                      repository_id: github.com/datadog/test-service
                      service_name: test-service
                    type: test_optimization_delete_service_settings_request
            schema:
              $ref: '#/components/schemas/TestOptimizationDeleteServiceSettingsRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - test_optimization_settings_write
      summary: Delete Test Optimization service settings
      tags:
        - Test Optimization
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - test_optimization_settings_write
    patch:
      description: |-
        Partially update Test Optimization settings for a specific service identified by repository, service name, and environment.
        Only provided fields are updated; setting a field to `null` is a no-op.
        To reset a setting to inherit from the repository level, use the corresponding `<setting>_inherit` field.
        The `pr_comments_enabled` field is ignored as it cannot be overridden at the service level.
      operationId: UpdateTestOptimizationServiceSettings
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      env: prod
                      repository_id: github.com/datadog/test-service
                      service_name: test-service
                      test_impact_analysis_enabled_inherit: true
                    type: test_optimization_update_service_settings_request
            schema:
              $ref: '#/components/schemas/TestOptimizationUpdateServiceSettingsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        auto_test_retries_enabled: false
                        auto_test_retries_enabled_is_overridden: false
                        code_coverage_enabled: false
                        code_coverage_enabled_is_overridden: false
                        early_flake_detection_enabled: false
                        early_flake_detection_enabled_is_overridden: false
                        env: prod
                        failed_test_replay_enabled: false
                        failed_test_replay_enabled_is_overridden: false
                        pr_comments_enabled: false
                        repository_id: github.com/datadog/test-service
                        service_name: test-service
                        test_impact_analysis_enabled: true
                        test_impact_analysis_enabled_is_overridden: true
                      id: 9b8a7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
                      type: test_optimization_service_settings
              schema:
                $ref: '#/components/schemas/TestOptimizationServiceSettingsResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - test_optimization_settings_write
      summary: Update Test Optimization service settings
      tags:
        - Test Optimization
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - test_optimization_settings_write
    post:
      description: Retrieve Test Optimization settings for a specific service identified by repository, service name, and environment.
      operationId: GetTestOptimizationServiceSettings
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      env: prod
                      repository_id: github.com/datadog/test-service
                      service_name: test-service
                    type: test_optimization_get_service_settings_request
            schema:
              $ref: '#/components/schemas/TestOptimizationGetServiceSettingsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        auto_test_retries_enabled: false
                        auto_test_retries_enabled_is_overridden: false
                        code_coverage_enabled: false
                        code_coverage_enabled_is_overridden: false
                        early_flake_detection_enabled: false
                        early_flake_detection_enabled_is_overridden: false
                        env: prod
                        failed_test_replay_enabled: false
                        failed_test_replay_enabled_is_overridden: false
                        pr_comments_enabled: false
                        repository_id: github.com/datadog/test-service
                        service_name: test-service
                        test_impact_analysis_enabled: true
                        test_impact_analysis_enabled_is_overridden: true
                      id: 9b8a7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
                      type: test_optimization_service_settings
              schema:
                $ref: '#/components/schemas/TestOptimizationServiceSettingsResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - test_optimization_read
      summary: Get Test Optimization service settings
      tags:
        - Test Optimization
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - test_optimization_read
  /api/v2/ci/tests/analytics/aggregate:
    post:
      description: The API endpoint to aggregate CI Visibility test events into buckets of computed metrics and timeseries.
      operationId: AggregateCIAppTestEvents
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  compute:
                    - aggregation: pc90
                      interval: 5m
                      metric: '@duration'
                      type: timeseries
                  filter:
                    from: now-15m
                    query: '@test.service:web-tests AND @test.status:fail'
                    to: now
                  group_by:
                    - facet: '@test.service'
                      histogram:
                        interval: 10
                        max: 100
                        min: 50
                      sort:
                        aggregation: count
                        order: asc
                  options:
                    timezone: GMT
            schema:
              $ref: '#/components/schemas/CIAppTestsAggregateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      buckets:
                        - by:
                            '@test.service': web-tests
                          computes:
                            pc90:
                              - time: '2020-06-08T11:55:00.123Z'
                                value: 2345
              schema:
                $ref: '#/components/schemas/CIAppTestsAnalyticsAggregateResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - ci_visibility_read
        - AuthZ:
            - test_optimization_read
      summary: Aggregate tests events
      tags:
        - CI Visibility Tests
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
