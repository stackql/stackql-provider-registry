              handle: my-handle
              inputSchema:
                parameters:
                  - defaultValue: default
                    name: input
                    type: STRING
              outputSchema:
                parameters:
                  - name: output
                    type: ARRAY_OBJECT
                    value: '{{ Steps.Step1 }}'
              steps:
                - actionId: com.datadoghq.dd.monitor.listMonitors
                  connectionLabel: INTEGRATION_DATADOG
                  name: Step1
                  outboundEdges:
                    - branchName: main
                      nextStepName: Step2
                  parameters:
                    - name: tags
                      value: service:monitoring
                - actionId: com.datadoghq.core.noop
                  name: Step2
              triggers:
                - monitorTrigger:
                    rateLimit:
                      count: 1
                      interval: 3600s
                  startStepNames:
                    - Step1
                - githubWebhookTrigger: {}
                  startStepNames:
                    - Step1
            tags:
