                value:
                  data:
                    attributes:
                      description: Customer reference data synced from S3
                      file_metadata:
                        access_details:
                          aws_detail:
                            aws_account_id: '924305315327'
                            aws_bucket_name: my-data-bucket
                            file_path: customers.csv
                        sync_enabled: true
                      schema:
                        fields:
                          - name: customer_id
                            type: STRING
                          - name: customer_name
                            type: STRING
                          - name: email
                            type: STRING
                        primary_keys:
                          - customer_id
                      source: S3
                      table_name: customer_reference_data
                      tags:
                        - team:data-platform
                    type: reference_table
              default:
                value:
                  data:
