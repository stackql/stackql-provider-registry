          description: The error message returned from the last operation (sync for cloud storage, upload for local file).
          type: string
        error_row_count:
          description: The number of rows that failed to process.
          format: int64
          type: integer
        error_type:
          $ref: '#/components/schemas/TableResultV2DataAttributesFileMetadataCloudStorageErrorType'
          description: The type of error that occurred during file processing. Only applicable for cloud storage sources.
        sync_enabled:
          description: Whether this table is synced automatically from cloud storage. Only applicable for cloud storage sources.
          type: boolean
      title: FileMetadataV2
      type: object
