    AWSAccount:
      description: Returns the AWS account associated with this integration.
      properties:
        access_key_id:
          description: Your AWS access key ID. Only required if your AWS account is a GovCloud or China account.
          type: string
        account_id:
          description: Your AWS Account ID without dashes.
          example: '123456789012'
          type: string
        account_specific_namespace_rules:
          additionalProperties:
            description: A list of additional properties.
            type: boolean
          description: |-
            An object (in the form `{"namespace1":true/false, "namespace2":true/false}`) containing user-supplied overrides
            for AWS namespace metric collection. **Important**: This field only contains namespaces explicitly configured through API calls,
            not the comprehensive enabled or disabled status of all namespaces. If a namespace is absent from this field, it uses Datadog's
            internal defaults (all namespaces enabled by default, except `AWS/SQS`, `AWS/ElasticMapReduce`, and `AWS/Usage`).
            For a complete view of all namespace statuses, use the V2 AWS Integration API instead.
          example:
            auto_scaling: false
            opswork: false
          type: object
        cspm_resource_collection_enabled:
          default: false
          description: Whether Datadog collects cloud security posture management resources from your AWS account. This includes additional resources not covered under the general `resource_collection`.
          example: true
          type: boolean
        excluded_regions:
          description: |-
            An array of [AWS regions](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints)
            to exclude from metrics collection.
          example:
            - us-east-1
            - us-west-2
          items:
            description: Regions to exclude.
            type: string
          type: array
        extended_resource_collection_enabled:
          default: false
          description: Whether Datadog collects additional attributes and configuration information about the resources in your AWS account. Required for `cspm_resource_collection`.
          example: true
          type: boolean
        filter_tags:
          description: |-
            The array of EC2 tags (in the form `key:value`) defines a filter that Datadog uses when collecting metrics from EC2.
            Wildcards, such as `?` (for single characters) and `*` (for multiple characters) can also be used.
            Only hosts that match one of the defined tags
            will be imported into Datadog. The rest will be ignored.
            Host matching a given tag can also be excluded by adding `!` before the tag.
            For example, `env:production,instance-type:c1.*,!region:us-east-1`
          example:
            - $KEY:$VALUE
          items:
            description: The list of the filter_tags.
            type: string
          type: array
        host_tags:
          description: |-
            Array of tags (in the form `key:value`) to add to all hosts
            and metrics reporting through this integration.
          example:
            - $KEY:$VALUE
          items:
            description: The list of the host_tags.
            type: string
          type: array
        metrics_collection_enabled:
          default: true
          description: Whether Datadog collects metrics for this AWS account.
          example: false
          type: boolean
        resource_collection_enabled:
          default: false
          deprecated: true
          description: Deprecated in favor of 'extended_resource_collection_enabled'. Whether Datadog collects a standard set of resources from your AWS account.
          example: true
          type: boolean
        role_name:
          description: Your Datadog role delegation name.
          example: DatadogAWSIntegrationRole
          type: string
        secret_access_key:
          description: Your AWS secret access key. Only required if your AWS account is a GovCloud or China account.
          type: string
      type: object
