openapi: 3.0.0
info:
  title: integrations API
  description: |-
    The Integrations API is used to list available integrations
    and retrieve information about their installation status.
  version: '1.0'
paths:
  /api/v2/cloud_auth/aws/persona_mapping:
    get:
      description: List all AWS cloud authentication persona mappings. This endpoint retrieves all configured persona mappings that associate AWS IAM principals with Datadog users.
      operationId: ListAWSCloudAuthPersonaMappings
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          account_identifier: test@example.com
                          account_uuid: 00000000-0000-0000-0000-000000000001
                          arn_pattern: arn:aws:iam::123456789012:user/testuser
                        id: abc-123
                        type: aws_cloud_auth_config
              schema:
                $ref: '#/components/schemas/AWSCloudAuthPersonaMappingsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: List AWS cloud authentication persona mappings
      tags:
        - Cloud Authentication
      x-unstable: |-
        **Note**: This endpoint is in public beta and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
    post:
      description: Create an AWS cloud authentication persona mapping. This endpoint associates an AWS IAM principal with a Datadog user.
      operationId: CreateAWSCloudAuthPersonaMapping
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      account_identifier: test@test.com
                      arn_pattern: arn:aws:iam::123456789012:user/testuser
                    type: aws_cloud_auth_config
            schema:
              $ref: '#/components/schemas/AWSCloudAuthPersonaMappingCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        account_identifier: test@example.com
                        account_uuid: 00000000-0000-0000-0000-000000000001
                        arn_pattern: arn:aws:iam::123456789012:user/testuser
                      id: abc-123
                      type: aws_cloud_auth_config
              schema:
                $ref: '#/components/schemas/AWSCloudAuthPersonaMappingResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Conflict
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Create an AWS cloud authentication persona mapping
      tags:
        - Cloud Authentication
      x-codegen-request-body-name: body
      x-unstable: |-
        **Note**: This endpoint is in public beta and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/cloud_auth/aws/persona_mapping/{persona_mapping_id}:
    delete:
      description: Delete an AWS cloud authentication persona mapping by ID. This removes the association between an AWS IAM principal and a Datadog user.
      operationId: DeleteAWSCloudAuthPersonaMapping
      parameters:
        - $ref: '#/components/parameters/PersonaMappingID'
      responses:
        '204':
          description: No Content
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Delete an AWS cloud authentication persona mapping
      tags:
        - Cloud Authentication
      x-unstable: |-
        **Note**: This endpoint is in public beta and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
    get:
      description: Get a specific AWS cloud authentication persona mapping by ID. This endpoint retrieves a single configured persona mapping that associates an AWS IAM principal with a Datadog user.
      operationId: GetAWSCloudAuthPersonaMapping
      parameters:
        - $ref: '#/components/parameters/PersonaMappingID'
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        account_identifier: test@example.com
                        account_uuid: 00000000-0000-0000-0000-000000000001
                        arn_pattern: arn:aws:iam::123456789012:user/testuser
                      id: abc-123
                      type: aws_cloud_auth_config
              schema:
