        - description: |-
            A comma separated list indicating what tags, if any, should be used to filter the list of monitors by scope.
            For example, `host:host0`.
          in: query
          name: tags
          required: false
          schema:
            example: host:host0
            type: string
        - description: |-
            A comma separated list indicating what service and/or custom tags, if any, should be used to filter the list of monitors.
            Tags created in the Datadog UI automatically have the service key prepended. For example, `service:my-app`.
          in: query
          name: monitor_tags
          required: false
          schema:
            example: service:my-app
            type: string
        - description: If this argument is set to true, then the returned data includes all current active downtimes for each monitor.
          in: query
          name: with_downtimes
          required: false
          schema:
            type: boolean
        - description: Use this parameter for paginating through large sets of monitors. Start with a value of zero, make a request, set the value to the last ID of result set, and then repeat until the response is empty.
