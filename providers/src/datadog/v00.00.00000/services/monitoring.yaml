openapi: 3.0.0
info:
  title: monitoring API
  description: datadog monitoring API
  version: '1.0'
paths:
  /api/v2/data-observability/monitors/runs/{run_id}/status:
    get:
      description: Retrieves the current status of a data observability monitor run. Poll this endpoint after triggering a run to determine when evaluation is complete.
      operationId: GetDataObservabilityMonitorRunStatus
      parameters:
        - description: The ID of the monitor run to retrieve status for.
          example: abc123def456
          in: path
          name: run_id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        status: ok
                      id: abc123def456
                      type: monitor_run
              schema:
                $ref: '#/components/schemas/GetDataObservabilityMonitorRunStatusResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - data_observability_monitors_write
            - monitors_write
      summary: Get data observability monitor run status
      tags:
        - Data Observability
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/data-observability/monitors/{monitor_id}/run:
    post:
      description: Manually triggers a run for a data observability monitor. Only monitors that are not scheduled (manually-runnable) can be triggered this way.
      operationId: RunDataObservabilityMonitor
      parameters:
        - description: The ID of the data observability monitor to run.
          example: 12345
          in: path
          name: monitor_id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      id: abc123def456
                      type: monitor_run
              schema:
                $ref: '#/components/schemas/RunDataObservabilityMonitorResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - data_observability_monitors_write
            - monitors_write
      summary: Run a data observability monitor
      tags:
        - Data Observability
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/monitor/notification_rule:
    get:
      description: Returns a list of all monitor notification rules.
      operationId: GetMonitorNotificationRules
      parameters:
        - description: The page to start paginating from. If `page` is not specified, the argument defaults to the first page.
          in: query
          name: page
          required: false
          schema:
            format: int32
            maximum: 1000000
            minimum: 0
            type: integer
        - description: The number of rules to return per page. If `per_page` is not specified, the argument defaults to 100.
          in: query
          name: per_page
          required: false
          schema:
            format: int32
            maximum: 1000
            minimum: 1
            type: integer
        - description: 'String for sort order, composed of field and sort order separated by a colon, for example `name:asc`. Supported sort directions: `asc`, `desc`. Supported fields: `name`, `created_at`.'
          in: query
          name: sort
          required: false
          schema:
            type: string
        - description: |-
            JSON-encoded filter object. Supported keys:
            * `text`: Free-text query matched against rule name, tags, and recipients.
            * `tags`: Array of strings. Return rules that have any of these tags.
            * `recipients`: Array of strings. Return rules that have any of these recipients.
          example: '{"text":"error","tags":["env:prod","team:my-team"],"recipients":["slack-monitor-app","email@example.com"]}'
          in: query
          name: filters
          required: false
          schema:
            type: string
        - description: |-
            Comma-separated list of resource paths for related resources to include in the response. Supported resource
            path is `created_by`.
          in: query
          name: include
          required: false
          schema:
            example: created_by
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          filter:
                            scope: team:product
                          name: A notification rule name
                          recipients:
                            - slack-test-channel
                        id: 00000000-0000-1234-0000-000000000000
                        type: monitor-notification-rule
              schema:
                $ref: '#/components/schemas/MonitorNotificationRuleListResponse'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - monitors_read
      summary: Get all monitor notification rules
      tags:
        - Monitors
      x-permission:
        operator: OR
        permissions:
          - monitors_read
    post:
      description: Creates a monitor notification rule.
      operationId: CreateMonitorNotificationRule
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      filter:
                        tags:
                          - team:product
                          - host:abc
                      name: A notification rule name
                      recipients:
                        - slack-test-channel
                        - jira-test
                    type: monitor-notification-rule
            schema:
              $ref: '#/components/schemas/MonitorNotificationRuleCreateRequest'
        description: Request body to create a monitor notification rule.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        filter:
                          scope: team:product
                        name: A notification rule name
                        recipients:
                          - slack-test-channel
                      id: 00000000-0000-1234-0000-000000000000
                      type: monitor-notification-rule
              schema:
                $ref: '#/components/schemas/MonitorNotificationRuleResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Create a monitor notification rule
      tags:
        - Monitors
      x-permission:
        operator: OR
        permissions:
          - monitor_config_policy_write
