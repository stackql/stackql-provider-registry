  /api/v2/monitor/template:
    get:
      description: Retrieve all monitor user templates.
      operationId: ListMonitorUserTemplates
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          created: '2024-01-01T00:00:00+00:00'
                          description: This is a template for monitoring user activity.
                          modified: '2024-01-01T00:00:00+00:00'
                          monitor_definition:
                            message: You may need to add web hosts if this is consistently high.
                            name: Bytes received on host0
                            query: avg(last_5m):sum:system.net.bytes_rcvd{host:host0} > 100
                            type: query alert
                          tags:
                            - product:Our Custom App
                            - integration:Azure
                          title: Postgres CPU Monitor
                          version: 1
                        id: 00000000-0000-1234-0000-000000000000
                        type: monitor-user-template
              schema:
                $ref: '#/components/schemas/MonitorUserTemplateListResponse'
          description: OK
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
