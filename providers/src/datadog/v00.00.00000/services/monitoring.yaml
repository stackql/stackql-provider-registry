        url:
          description: URL of the commit.
          example: https://github.com/DataDog/example/commit/9e107d9d372bb6826bd81d3542a419d6f0e1de56
          type: string
      type: object
    SyntheticsTestResultAssertionResult:
      description: An individual assertion result from a Synthetic test.
      properties:
        actual:
          description: Actual value observed during the test. Its type depends on the assertion type.
          example: 200
        error_message:
          description: Error message if the assertion failed.
          example: 'Assertion failed: expected 200 but got 500'
          type: string
        expected:
          description: Expected value for the assertion. Its type depends on the assertion type.
          example: '200'
        operator:
          description: Operator used for the assertion (for example, `is`, `contains`).
          example: is
          type: string
        property:
          description: Property targeted by the assertion, when applicable.
          example: content-type
          type: string
        target:
          description: Target value for the assertion. Its type depends on the assertion type.
          example: 200
        target_path:
          description: JSON path or XPath evaluated for the assertion.
          example: $.url
          type: string
        target_path_operator:
          description: Operator used for the target path assertion.
          example: contains
          type: string
        type:
          description: Type of the assertion (for example, `responseTime`, `statusCode`, `body`).
          example: statusCode
          type: string
        valid:
          description: Whether the assertion passed.
          example: true
          type: boolean
      type: object
    SyntheticsTestResultBucketKeys:
      description: Storage bucket keys for artifacts produced during a step or test.
      properties:
        after_step_screenshot:
          description: Key for the screenshot captured after the step (goal-based tests).
          example: screenshots/after-step-1-1.png
          type: string
        after_turn_screenshot:
          description: Key for the screenshot captured after the turn (goal-based tests).
          example: screenshots/after-turn-1.png
          type: string
        artifacts:
          description: Key for miscellaneous artifacts.
          example: 2/e2e-tests/equ-jku-twc/results/6989498452827932222/edge.laptop_large/artifacts__1724521416257.json
          type: string
        before_step_screenshot:
          description: Key for the screenshot captured before the step (goal-based tests).
          example: screenshots/before-step-1-1.png
          type: string
        before_turn_screenshot:
          description: Key for the screenshot captured before the turn (goal-based tests).
          example: screenshots/before-turn-1.png
          type: string
        crash_report:
          description: Key for a captured crash report.
          example: 2/e2e-tests/d2z-32s-iax/results/1340718101990858549/synthetics:mobile:device:iphone_se_2020_ios_14/crash_report.log
          type: string
        device_logs:
          description: Key for captured device logs.
          example: 2/e2e-tests/d2z-32s-iax/results/1340718101990858549/synthetics:mobile:device:iphone_se_2020_ios_14/d2z-32s-iax_1340718101990858549_device_logs.log
          type: string
        email_messages:
          description: Keys for email message payloads captured by the step.
          items:
            description: Storage bucket key for a captured email message.
            type: string
          type: array
        screenshot:
          description: Key for the captured screenshot.
          example: 2/e2e-tests/equ-jku-twc/results/6989498452827932222/edge.laptop_large/step-0__1724521416269.jpeg
          type: string
        snapshot:
          description: Key for the captured DOM snapshot.
          example: 2/e2e-tests/equ-jku-twc/results/6989498452827932222/edge.laptop_large/snapshot.html
          type: string
        source:
          description: Key for the page source or element source.
          example: 2/e2e-tests/d2z-32s-iax/results/1340718101990858549/synthetics:mobile:device:iphone_se_2020_ios_14/step-0__1724445301832.xml
          type: string
      type: object
    SyntheticsTestResultCertificate:
      description: SSL/TLS certificate information returned from an SSL test.
      properties:
        cipher:
          description: Cipher used for the TLS connection.
          example: TLS_AES_256_GCM_SHA384
          type: string
        exponent:
          description: RSA exponent of the certificate.
          example: 65537
          format: int64
          type: integer
        ext_key_usage:
          description: Extended key usage extensions for the certificate.
          example:
            - 1.3.6.1.5.5.7.3.1
          items:
            description: Extended key usage value.
            type: string
          type: array
        fingerprint:
          description: SHA-1 fingerprint of the certificate.
          example: D6:03:5A:9F:93:E1:B7:28:EC:90:C5:9F:72:30:55:7C:74:5F:53:92
          type: string
        fingerprint256:
          description: SHA-256 fingerprint of the certificate.
          example: 04:45:93:A9:4C:14:70:47:DB:3C:FC:05:F9:5A:50:4E:DA:DB:A1:C6:37:3D:15:C0:B2:7E:5D:93:5F:A2:02:C7
          type: string
        issuer:
          additionalProperties:
            type: string
          description: Certificate issuer details.
          example:
            C: US
            CN: WE2
            O: Google Trust Services
          type: object
        modulus:
          description: RSA modulus of the certificate.
          example: C0FCE9F9...
          type: string
        protocol:
          description: TLS protocol used (for example, `TLSv1.2`).
          example: TLSv1.3
          type: string
        serial_number:
          description: Serial number of the certificate.
          example: 7B584A1A6670A1EB0941A9A121569D60
          type: string
        subject:
          additionalProperties:
            type: string
          description: Certificate subject details.
          example:
            CN: '*.google.fr'
            altName: DNS:*.google.fr, DNS:google.fr
          type: object
        tls_version:
          description: TLS protocol version.
          example: 1.3
          format: double
          type: number
        valid:
          $ref: '#/components/schemas/SyntheticsTestResultCertificateValidity'
      type: object
    SyntheticsTestResultDnsResolution:
      description: DNS resolution details recorded during the test execution.
      properties:
        attempts:
          description: DNS resolution attempts made during the test.
          items:
            $ref: '#/components/schemas/SyntheticsTestResultDnsResolutionAttempt'
          type: array
        resolved_ip:
          description: Resolved IP address for the target host.
          example: 54.243.255.141
          type: string
        resolved_port:
          description: Resolved port for the target service.
          example: '443'
          type: string
        server:
          description: DNS server used for the resolution.
          example: 8.8.4.4
          type: string
      type: object
    SyntheticsTestResultFailure:
      description: Details about the failure of a Synthetic test.
      properties:
        code:
          description: Error code for the failure.
          example: TIMEOUT
          type: string
        internal_code:
          description: Internal error code used for debugging.
          example: INCORRECT_ASSERTION
          type: string
        internal_message:
          description: Internal error message used for debugging.
          example: Assertion failed on step 2
          type: string
        message:
          description: Error message for the failure.
          example: Connection timed out
          type: string
      type: object
    SyntheticsTestResultHandshake:
      description: Handshake request and response for protocol-level tests.
      properties:
        request:
          $ref: '#/components/schemas/SyntheticsTestResultRequestInfo'
        response:
          $ref: '#/components/schemas/SyntheticsTestResultResponseInfo'
      type: object
    SyntheticsTestResultNetpath:
      description: Network Path test result capturing the path between source and destination.
