    SyntheticsBasicAuth:
      description: Object to handle basic authentication when performing the test.
      properties:
        password:
          description: Password to use for the basic authentication.
          example: PaSSw0RD!
          type: string
        type:
          $ref: '#/components/schemas/SyntheticsBasicAuthWebType'
        username:
          description: Username to use for the basic authentication.
          example: my_username
          type: string
        accessKey:
          description: Access key for the `SIGV4` authentication.
          example: AKIAIOSFODNN7EXAMPLE
          type: string
        region:
          description: Region for the `SIGV4` authentication.
          example: us-east-1
          type: string
        secretKey:
          description: Secret key for the `SIGV4` authentication.
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYzEXAMPLEKEY
          type: string
        serviceName:
          description: Service name for the `SIGV4` authentication.
          example: execute-api
          type: string
        sessionToken:
          description: Session token for the `SIGV4` authentication.
          example: |-
            AQoEXAMPLEH4aoAH0gNCAPyJxz4BlCFFxWNE1OPTgk5TthT+FvwqnKwRcOIfrRh3c/L
            To6UDdyJwOOvEVPvLXCrrrUtdnniCEXAMPLE/IvU1dYUg2RVAJBanLiHb4IgRmpRV3z
            rkuWJOgQs8IZZaIv2BXIa2R4OlgkBN9bkUDNCJiBeb/AXlzBBko7b15fjrBs2+cTQtp
            Z3CYWFXG8C5zqx37wnOE49mRl/+OtkIKGO7fAE
          type: string
        domain:
          description: Domain for the authentication to use when performing the test.
          example: DOMAINNAME
          type: string
        workstation:
          description: Workstation for the authentication to use when performing the test.
          example: ''
          type: string
        accessTokenUrl:
          description: Access token URL to use when performing the authentication.
          example: https://example.com
          type: string
        audience:
          description: Audience to use when performing the authentication.
          example: audience
          type: string
        clientId:
          description: Client ID to use when performing the authentication.
          example: oauth-username
          type: string
        clientSecret:
          description: Client secret to use when performing the authentication.
          example: oauth-password
          type: string
        resource:
          description: Resource to use when performing the authentication.
          example: resource
          type: string
        scope:
          description: Scope to use when performing the authentication.
          example: scope
          type: string
        tokenApiAuthentication:
          $ref: '#/components/schemas/SyntheticsBasicAuthOauthTokenApiAuthentication'
        addClaims:
          $ref: '#/components/schemas/SyntheticsBasicAuthJWTAddClaims'
        algorithm:
          $ref: '#/components/schemas/SyntheticsBasicAuthJWTAlgorithm'
        expiresIn:
          description: Token time-to-live in seconds.
          example: 3600
          format: int64
          minimum: 1
          type: integer
        header:
          description: Custom JWT header as a JSON string.
          example: '{"kid": "my-key-id"}'
          type: string
        payload:
          description: JWT claims as a JSON string.
          example: '{"sub": "1234567890", "name": "John Doe"}'
          type: string
        secret:
          description: |-
            Signing key for the JWT authentication. Use the shared secret for `HS256`
            or the private key (PEM format) for `RS256` and `ES256`.
          example: mysecretkey
          type: string
        tokenPrefix:
          description: Prefix added before the token in the `Authorization` header. Defaults to `Bearer`.
          example: Bearer
          type: string
      type: object
      required:
        - accessKey
        - secretKey
        - type
        - password
        - username
        - accessTokenUrl
        - tokenApiAuthentication
        - clientId
        - clientSecret
        - algorithm
        - payload
        - secret
