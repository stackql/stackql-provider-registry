        $ref: '#/components/schemas/NotifyEndState'
      type: array
    NotifyEndTypes:
      default:
        - expired
      description: |-
        If set, notifies if a monitor is in an alert-worthy state (`ALERT`, `WARNING`, or `NO DATA`)
        when this downtime expires or is canceled. Applied to monitors that change states during
        the downtime (such as from `OK` to `ALERT`, `WARNING`, or `NO DATA`), and to monitors that
        already have an alert-worthy state when downtime begins.
      example:
        - canceled
        - expired
      items:
        $ref: '#/components/schemas/NotifyEndType'
      type: array
    DowntimeRecurrence:
      description: An object defining the recurrence of the downtime.
      nullable: true
      properties:
        period:
          description: |-
            How often to repeat as an integer.
            For example, to repeat every 3 days, select a type of `days` and a period of `3`.
          example: 1
          format: int32
          maximum: 2147483647
          type: integer
        rrule:
          description: |-
            The `RRULE` standard for defining recurring events (**requires to set "type" to rrule**)
            For example, to have a recurring event on the first day of each month, set the type to `rrule` and set the `FREQ` to `MONTHLY` and `BYMONTHDAY` to `1`.
            Most common `rrule` options from the [iCalendar Spec](https://tools.ietf.org/html/rfc5545) are supported.

            **Note**: Attributes specifying the duration in `RRULE` are not supported (for example, `DTSTART`, `DTEND`, `DURATION`).
            More examples available in this [downtime guide](https://docs.datadoghq.com/monitors/guide/suppress-alert-with-downtimes/?tab=api)
          example: FREQ=MONTHLY;BYSETPOS=3;BYDAY=WE;INTERVAL=1
          type: string
        type:
          description: The type of recurrence. Choose from `days`, `weeks`, `months`, `years`, `rrule`.
          example: weeks
          type: string
        until_date:
          description: |-
            The date at which the recurrence should end as a POSIX timestamp.
            `until_occurences` and `until_date` are mutually exclusive.
          example: 1447786293
          format: int64
          nullable: true
          type: integer
        until_occurrences:
          description: |-
            How many times the downtime is rescheduled.
            `until_occurences` and `until_date` are mutually exclusive.
          example: 2
          format: int32
          maximum: 2147483647
          nullable: true
          type: integer
        week_days:
          description: |-
            A list of week days to repeat on. Choose from `Mon`, `Tue`, `Wed`, `Thu`, `Fri`, `Sat` or `Sun`.
            Only applicable when type is weeks. First letter must be capitalized.
          example:
            - Mon
            - Tue
          items:
            description: A day of the week, formatted as `Mon`, `Tue`, `Wed`, `Thu`, `Fri`, `Sat` or `Sun`.
            type: string
          nullable: true
          type: array
      type: object
