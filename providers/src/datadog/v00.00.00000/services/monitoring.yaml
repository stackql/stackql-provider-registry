                      name: A notification rule name
                      recipients:
                        - slack-test-channel
                        - jira-test
                    id: 00000000-0000-1234-0000-000000000000
                    type: monitor-notification-rule
            schema:
              $ref: '#/components/schemas/MonitorNotificationRuleUpdateRequest'
        description: Request body to update the monitor notification rule.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
