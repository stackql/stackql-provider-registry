          description: Either the HTTP method/verb to use or a gRPC method available on the service set in the `service` field. Required if `subtype` is `HTTP` or if `subtype` is `grpc` and `callType` is `unary`.
          type: string
        noSavingResponseBody:
          description: Determines whether or not to save the response body.
          type: boolean
        numberOfPackets:
          description: Number of pings to use per test.
          format: int32
          maximum: 10
          minimum: 0
          type: integer
        persistCookies:
          description: Persist cookies across redirects.
          type: boolean
        port:
          $ref: '#/components/schemas/SyntheticsTestRequestPort'
        proxy:
          $ref: '#/components/schemas/SyntheticsTestRequestProxy'
        query:
          description: Query to use for the test. (opaque JSON object)
          type: string
        servername:
          description: |-
            For SSL tests, it specifies on which server you want to initiate the TLS handshake,
            allowing the server to present one of multiple possible certificates on
            the same IP address and TCP port number.
          type: string
        service:
          description: The gRPC service on which you want to perform the gRPC call.
          example: Greeter
          type: string
        shouldTrackHops:
          description: Turns on a traceroute probe to discover all gateways along the path to the host destination.
          type: boolean
        timeout:
          description: Timeout in seconds for the test.
          format: double
          type: number
        toolArgs:
          additionalProperties: {}
          description: Arguments to pass to the MCP tool. Free-form object whose shape depends on the tool. Used when `callType` is `tool_call`.
          type: object
        toolName:
          description: The name of the MCP tool to call. Required when `callType` is `tool_call`.
          example: search
          type: string
        url:
          description: URL to perform the test with.
          example: https://example.com
          type: string
      type: object
    SyntheticsAPIStep:
      description: The steps used in a Synthetic multi-step API test.
      properties:
        allowFailure:
          description: Determines whether or not to continue with test if this step fails.
          type: boolean
        assertions:
          default: []
          description: Array of assertions used for the test.
          example:
