          type: array
        extractedValuesFromScript:
          description: Generate variables using JavaScript.
          type: string
        id:
          description: ID of the step.
          example: abc-def-123
          readOnly: true
          type: string
        isCritical:
          description: |-
            Determines whether or not to consider the entire test as failed if this step fails.
