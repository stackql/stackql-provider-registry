  /api/v2/synthetics/variables/{variable_id}/jsonpatch:
    patch:
      description: |-
        Patch a global variable using JSON Patch (RFC 6902).
        This endpoint allows partial updates to a global variable by specifying only the fields to modify.

        Common operations include:
        - Replace field values: `{"op": "replace", "path": "/name", "value": "new_name"}`
        - Update nested values: `{"op": "replace", "path": "/value/value", "value": "new_value"}`
        - Add/update tags: `{"op": "add", "path": "/tags/-", "value": "new_tag"}`
        - Remove fields: `{"op": "remove", "path": "/description"}`
      operationId: PatchGlobalVariable
      parameters:
        - description: The ID of the global variable.
          in: path
          name: variable_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      json_patch:
                        - op: add
                          path: /name
                    type: global_variables_json_patch
            schema:
              $ref: '#/components/schemas/GlobalVariableJsonPatchRequest'
        description: JSON Patch document with operations to apply.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        description: Example description
                        name: MY_VARIABLE
                        tags:
                          - team:front
                        value:
                          secure: false
                          value: example-value
                      id: abc-123
                      type: global_variables
              schema:
                $ref: '#/components/schemas/GlobalVariableResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Patch a global variable
      tags:
        - Synthetics
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - synthetics_global_variable_write
