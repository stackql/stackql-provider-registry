    SyntheticsTestResultRequestInfo:
      description: Details of the outgoing request made during the test execution.
      properties:
        allow_insecure:
          description: Whether insecure certificates are allowed for this request.
          example: false
          type: boolean
        body:
          description: Body sent with the request.
          example: '{"key":"value"}'
          type: string
        call_type:
          description: gRPC call type (for example, `unary`, `healthCheck`, or `reflection`).
          example: unary
          type: string
        destination_service:
          description: Destination service for a Network Path test.
          example: my-service
          type: string
        dns_server:
          description: DNS server used to resolve the target host.
          example: 8.8.8.8
          type: string
        dns_server_port:
          description: Port of the DNS server used for resolution.
          example: 53
          format: int64
          type: integer
        e2e_queries:
          description: Number of end-to-end probe queries issued.
          example: 4
          format: int64
          type: integer
        files:
          description: Files attached to the request.
          items:
            $ref: '#/components/schemas/SyntheticsTestResultFileRef'
          type: array
        headers:
          additionalProperties: {}
          description: Headers sent with the request.
          example:
            content-type: application/json
          type: object
        host:
          description: Host targeted by the request.
          example: grpcbin.test.k6.io
          type: string
        max_ttl:
          description: Maximum TTL for network probe packets.
          example: 64
          format: int64
          type: integer
        message:
          description: Message sent with the request (for WebSocket/TCP/UDP tests).
          example: My message
          type: string
        method:
          description: HTTP method used for the request.
          example: GET
          type: string
        no_saving_response_body:
          description: Whether the response body was not saved.
          example: true
          type: boolean
        port:
          description: Port targeted by the request. Can be a number or a string variable reference.
          example: 9000
        service:
          description: Service name targeted by the request (for gRPC tests).
          example: addsvc.Add
          type: string
        source_service:
          description: Source service for a Network Path test.
          example: synthetics
          type: string
        timeout:
          description: Request timeout in milliseconds.
          example: 60
          format: int64
          type: integer
        tool_name:
          description: Name of the MCP tool called (MCP tests only).
          example: search
          type: string
        traceroute_queries:
          description: Number of traceroute probe queries issued.
          example: 2
          format: int64
          type: integer
        url:
          description: URL targeted by the request.
          example: https://httpbin.org/anything/lol valuehugo
          type: string
      type: object
    SyntheticsTestResultResponseInfo:
      description: Details of the response received during the test execution.
      properties:
        body:
          description: Body of the response.
          example: '{"status":"ok"}'
          type: string
        body_compressed:
          description: Compressed representation of the response body.
          example: eJzLSM3JyQcABiwCFQ==
          type: string
        body_hashes:
          description: Hashes computed over the response body.
          example: 9e107d9d372bb6826bd81d3542a419d6
          type: string
        body_size:
          description: Size of the response body in bytes.
          example: 793
          format: int64
          type: integer
        cache_headers:
          additionalProperties:
            type: string
          description: Cache-related response headers.
          example:
            server: gunicorn/19.9.0
          type: object
        cdn:
          $ref: '#/components/schemas/SyntheticsTestResultCdnProviderInfo'
        close:
          $ref: '#/components/schemas/SyntheticsTestResultWebSocketClose'
        compressed_message:
          description: Compressed representation of the response message.
          example: eJzLSM3JyQcABiwCFQ==
          type: string
        headers:
          additionalProperties: {}
          description: Response headers.
          example:
            content-type: application/json
          type: object
        healthcheck:
          $ref: '#/components/schemas/SyntheticsTestResultHealthCheck'
        http_version:
          description: HTTP version of the response.
          example: '2.0'
          type: string
        is_body_truncated:
          description: Whether the response body was truncated.
          example: false
          type: boolean
        is_message_truncated:
          description: Whether the response message was truncated.
          example: false
          type: boolean
        message:
          description: Message received in the response (for WebSocket/TCP/UDP tests).
          example: '{"f_string":"concat-STATIC_HIDDEN_VALUE"}'
          type: string
        metadata:
          additionalProperties:
            type: string
          description: Additional metadata returned with the response.
          type: object
        records:
          description: DNS records returned in the response (DNS tests only).
          items:
            $ref: '#/components/schemas/SyntheticsTestResultDnsRecord'
          type: array
        redirects:
          description: Redirect hops encountered while performing the request.
          items:
            $ref: '#/components/schemas/SyntheticsTestResultRedirect'
          type: array
        status_code:
          description: HTTP status code of the response.
          example: 200
          format: int64
          type: integer
      type: object
