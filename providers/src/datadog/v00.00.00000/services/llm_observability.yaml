      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/llm-obs/v1/annotated-interactions:
    get:
      description: |-
        Returns annotated interactions across all annotation queues for the given content IDs.
        Results include queue metadata (ID and name) for each interaction.
      operationId: GetLLMObsAnnotatedInteractionsByTraceIDs
      parameters:
        - description: One or more content IDs to retrieve annotated interactions for. At least one is required.
          in: query
          name: contentIds
          required: true
          schema:
            items:
              type: string
            type: array
        - description: Pagination offset. Must be >= 0. Defaults to 0.
          in: query
          name: offset
          schema:
            default: 0
            format: int32
            maximum: 2147483647
            minimum: 0
            type: integer
        - description: Maximum number of results to return. Must be > 0. Defaults to 100.
          in: query
          name: limit
          schema:
            default: 100
            format: int32
            maximum: 2147483647
            minimum: 1
            type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        annotated_interactions:
                          - annotations:
                              - created_at: '0001-01-01T00:00:00Z'
                                created_by: 00000000-0000-0000-0000-000000000002
                                id: annotation-789
                                interaction_id: interaction-456
                                label_values:
                                  - label_schema_id: abc-123
                                    value: good
                                modified_at: '0001-01-01T00:00:00Z'
                                modified_by: 00000000-0000-0000-0000-000000000002
                            content_id: trace-abc-123
                            created_at: '2025-06-01T12:00:00Z'
                            id: interaction-456
                            modified_at: '2025-06-01T12:00:00Z'
                            queue_id: queue-uuid-001
                            queue_name: My Annotation Queue
                            type: trace
                        total_count: 1
                      id: trace-query
                      type: annotated_interactions_by_trace
              schema:
                $ref: '#/components/schemas/LLMObsAnnotatedInteractionsByTraceResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Internal Server Error
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Get annotated interactions by content IDs
      tags:
        - Agent Observability
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/llm-obs/v1/annotation-queues:
    get:
      description: |-
        List annotation queues. Optionally filter by project ID or queue IDs. These parameters are mutually exclusive.
        If neither is provided, all queues in the organization are returned.
      operationId: ListLLMObsAnnotationQueues
      parameters:
        - description: Filter annotation queues by project ID. Cannot be used together with `queueIds`.
          in: query
          name: projectId
          schema:
            type: string
        - description: Filter annotation queues by queue IDs (comma-separated). Cannot be used together with `projectId`.
          in: query
          name: queueIds
          schema:
            items:
              type: string
            type: array
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          created_at: '2024-01-15T10:30:00Z'
                          created_by: 00000000-0000-0000-0000-000000000002
                          description: Queue for annotating customer support traces
                          modified_at: '2024-01-15T10:30:00Z'
                          modified_by: 00000000-0000-0000-0000-000000000002
                          name: My annotation queue
                          owned_by: 00000000-0000-0000-0000-000000000002
                          project_id: 00000000-0000-0000-0000-000000000002
                        id: 00000000-0000-0000-0000-000000000001
                        type: queues
              schema:
                $ref: '#/components/schemas/LLMObsAnnotationQueuesResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: List Agent Observability annotation queues
      tags:
        - Agent Observability
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
    post:
      description: |-
        Create an annotation queue. The `name` and `project_id` fields are required.
        An optional `annotation_schema` can be provided to define the labels for the queue.
        Fields such as `created_by`, `owned_by`, `created_at`, `modified_by`,
        and `modified_at` are inferred by the backend.
      operationId: CreateLLMObsAnnotationQueue
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      description: Queue for annotating customer support traces
                      name: My annotation queue
                      project_id: 00000000-0000-0000-0000-000000000002
                    type: queues
              with_schema:
                summary: Create queue with annotation schema
                value:
                  data:
                    attributes:
                      annotation_schema:
                        label_schemas:
                          - is_required: true
                            max: 5
                            min: 0
                            name: quality
                            type: score
                          - name: sentiment
                            type: categorical
                            values:
                              - positive
                              - negative
                              - neutral
                      description: Queue for annotating customer support traces
                      name: My annotation queue
                      project_id: 00000000-0000-0000-0000-000000000002
                    type: queues
            schema:
              $ref: '#/components/schemas/LLMObsAnnotationQueueRequest'
        description: Create annotation queue payload.
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        created_at: '2024-01-15T10:30:00Z'
                        created_by: 00000000-0000-0000-0000-000000000002
                        description: Queue for annotating customer support traces
                        modified_at: '2024-01-15T10:30:00Z'
                        modified_by: 00000000-0000-0000-0000-000000000002
                        name: My annotation queue
                        owned_by: 00000000-0000-0000-0000-000000000002
                        project_id: 00000000-0000-0000-0000-000000000002
                      id: 00000000-0000-0000-0000-000000000001
                      type: queues
              schema:
                $ref: '#/components/schemas/LLMObsAnnotationQueueResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Create an Agent Observability annotation queue
      tags:
        - Agent Observability
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
