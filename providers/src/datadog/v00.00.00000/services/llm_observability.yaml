          description: Maximum number of tokens to generate.
          example: 1024
          format: int64
          nullable: true
          type: integer
        messages:
          $ref: '#/components/schemas/LLMObsInferenceMessagesList'
        model_id:
          description: The model identifier to use for inference.
          example: gpt-4o
          type: string
        openai_metadata:
          $ref: '#/components/schemas/LLMObsOpenAIMetadata'
          nullable: true
        presence_penalty:
          description: Penalty for token presence to encourage topic diversity.
          example: 0
          format: double
          nullable: true
          type: number
        temperature:
          description: Sampling temperature between 0 and 2. Higher values produce more random output.
          example: 0.7
          format: double
          nullable: true
          type: number
        tools:
          $ref: '#/components/schemas/LLMObsInferenceToolsList'
        top_k:
          description: Top-K sampling parameter.
          example: 50
          format: int64
          nullable: true
          type: integer
        top_p:
          description: Nucleus sampling probability mass.
          example: 1
          format: double
          nullable: true
          type: number
