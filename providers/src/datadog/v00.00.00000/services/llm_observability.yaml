          in: query
          name: filter[metadata]
          schema:
            type: string
        - description: Filter experiments by the ID of their parent (baseline) experiment. Returns all experiments that were run against the given baseline. Can be specified multiple times.
          in: query
          name: filter[parent_experiment_id]
