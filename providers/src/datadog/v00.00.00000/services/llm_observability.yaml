openapi: 3.0.0
info:
  title: llm_observability API
  description: datadog llm_observability API
  version: '1.0'
paths:
  /api/unstable/llm-obs/config/evaluators/custom:
    get:
      description: List all custom Agent Observability evaluator configurations for the organization.
      operationId: ListLLMObsCustomEvalConfigs
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          category: Custom
                          created_at: '2024-01-15T10:30:00Z'
                          created_by:
                            email: user@example.com
                          eval_name: my-custom-evaluator
                          last_updated_by:
                            email: user@example.com
                          llm_judge_config:
                            inference_params:
                              max_tokens: 1024
                              temperature: 0.7
                            parsing_type: structured_output
                          llm_provider:
                            integration_provider: openai
                            model_name: gpt-4o
                          target:
                            application_name: my-llm-app
                            enabled: true
                            sampling_percentage: 50
                          updated_at: '2024-01-15T10:30:00Z'
                        id: my-custom-evaluator
                        type: evaluator_config
              schema:
                $ref: '#/components/schemas/LLMObsCustomEvalConfigListResponse'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: List custom evaluator configurations
      tags:
        - Agent Observability
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
