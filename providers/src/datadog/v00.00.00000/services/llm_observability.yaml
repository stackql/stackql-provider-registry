  /api/v2/llm-obs/v1/annotation-queues/{queue_id}/annotations:
    post:
      description: |-
        Create or update annotations on interactions in a queue. Each annotation is matched
        by `interaction_id` and the requesting user's identity.
        Results and errors in the response are linked to request items by `interaction_id`.
        Errors for individual items are returned in the `errors` field without blocking the rest of the batch.
      operationId: UpsertLLMObsAnnotations
      parameters:
        - $ref: '#/components/parameters/LLMObsAnnotationQueueIDPathParameter'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      annotations:
                        - interaction_id: 00000000-0000-0000-0000-000000000001
                          label_values:
                            - label_schema_id: abc-123
                              value: good
                            - label_schema_id: ef56gh78
                              value: positive
                    type: annotations
            schema:
              $ref: '#/components/schemas/LLMObsAnnotationsRequest'
        description: Payload for creating or updating annotations.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        annotations:
                          - created_at: '2024-01-15T10:30:00Z'
                            created_by: 00000000-0000-0000-0000-000000000002
                            id: 00000000-0000-0000-0000-000000000000
                            interaction_id: 00000000-0000-0000-0000-000000000001
                            label_values:
                              - label_schema_id: abc-123
                                value: good
                            modified_at: '2024-01-15T10:30:00Z'
                            modified_by: 00000000-0000-0000-0000-000000000002
                      id: 00000000-0000-0000-0000-000000000001
                      type: annotations
              schema:
                $ref: '#/components/schemas/LLMObsAnnotationsResponse'
          description: OK — annotations created or updated. Per-item errors are listed in `errors`.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found — the queue does not exist.
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Create or update annotations
      tags:
        - Agent Observability
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/llm-obs/v1/annotation-queues/{queue_id}/annotations/delete:
    post:
      description: Delete one or more annotations from an annotation queue.
      operationId: DeleteLLMObsAnnotations
      parameters:
        - $ref: '#/components/parameters/LLMObsAnnotationQueueIDPathParameter'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      annotation_ids:
                        - 00000000-0000-0000-0000-000000000000
                    type: annotations
            schema:
              $ref: '#/components/schemas/LLMObsDeleteAnnotationsRequest'
        description: Delete annotations payload.
