  /api/v2/llm-obs/v2/{project_id}/datasets/{dataset_id}/records/upload:
    post:
      description: |-
        Upload records to a dataset from a file. The request is a `multipart/form-data` upload containing a single `file` part.
        Currently only CSV is supported. The CSV must include an `input` column. Optional columns are `id`, `expected_output`, `metadata`, and `tags`.

        The response is a Server-Sent Events stream (`text/event-stream`) emitting progress updates while records are processed. The stream emits the following named events:
          - `progress`: incremental record counts written so far.
          - `completed`: terminal event with a JSON body containing `records_created`.
          - `error`: terminal event with a JSON body containing an error `message`.
      operationId: UploadLLMObsDatasetRecordsFile
      parameters:
        - description: The ID of the Agent Observability project.
          example: a33671aa-24fd-4dcd-9b33-a8ec7dde7751
          in: path
          name: project_id
          required: true
          schema:
            type: string
        - description: The ID of the Agent Observability dataset.
          example: 9f64e5c7-dc5a-45c8-a17c-1b85f0bec97d
          in: path
          name: dataset_id
          required: true
          schema:
            type: string
        - description: Whether to skip records whose `input` already exists in the dataset. Defaults to `false`.
          in: query
          name: deduplicate
          schema:
            default: false
            type: boolean
        - description: Whether to overwrite existing records that share the same user-provided `id`. Defaults to `true`.
          in: query
          name: overwrite
          schema:
            default: true
            type: boolean
        - description: Tags to apply to every uploaded record, in addition to any tags defined on individual rows. Can be repeated, e.g. `tags=env:prod&tags=team:ai`.
          in: query
          name: tags
          schema:
            items:
              type: string
            type: array
        - description: Whether to enrich the response with user metadata.
          in: query
          name: include[user_data]
          schema:
            type: boolean
      requestBody:
        content:
          multipart/form-data:
            examples:
              default:
                value:
                  file: records.csv
            schema:
              $ref: '#/components/schemas/LLMObsDatasetRecordsUploadFile'
