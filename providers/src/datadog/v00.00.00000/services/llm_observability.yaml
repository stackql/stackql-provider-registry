            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Unprocessable Entity
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Create or update a custom evaluator configuration
      tags:
