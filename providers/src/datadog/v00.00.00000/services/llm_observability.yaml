      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Get a custom evaluator configuration
      tags:
        - Agent Observability
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
    put:
      description: Create or update a custom Agent Observability evaluator configuration by its name.
      operationId: UpdateLLMObsCustomEvalConfig
      parameters:
        - $ref: '#/components/parameters/LLMObsEvalNamePathParameter'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      llm_judge_config:
                        inference_params:
                          max_tokens: 1024
                          temperature: 0.7
                        parsing_type: structured_output
                      llm_provider:
                        integration_provider: openai
                        model_name: gpt-4o
                      target:
                        application_name: my-llm-app
                        enabled: true
                        sampling_percentage: 50
                    id: my-custom-evaluator
                    type: evaluator_config
              full:
                summary: Full example with prompt template, output schema, and assessment criteria
                value:
                  data:
                    attributes:
                      category: Custom
                      eval_name: my-custom-evaluator
                      llm_judge_config:
                        assessment_criteria:
                          pass_when: false
                        inference_params:
                          frequency_penalty: 0
                          max_tokens: 4096
                          presence_penalty: 0
                          temperature: 1
                          top_p: 1
                        output_schema:
                          name: boolean_eval
                          strict: true
                        parsing_type: structured_output
                        prompt_template:
                          - content: You are a judge LLM.
                            role: system
                          - content: '{{span_output}}'
                            role: user
                      llm_provider:
                        integration_account_id: your-account-uuid
                        integration_provider: openai
                        model_name: gpt-4o
                      target:
                        application_name: my-llm-app
                        enabled: true
                        eval_scope: span
                        filter: '@meta.span.kind:llm'
                        root_spans_only: false
                        sampling_percentage: 100
                    id: my-custom-evaluator
                    type: evaluator_config
            schema:
              $ref: '#/components/schemas/LLMObsCustomEvalConfigUpdateRequest'
        description: Custom evaluator configuration payload.
        required: true
      responses:
        '200':
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '401':
