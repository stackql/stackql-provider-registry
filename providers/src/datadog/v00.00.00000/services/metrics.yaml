        points:
          description: Points relating to a metric. All points must be tuples with timestamp and a scalar value (cannot be a string). Timestamps should be in POSIX time in seconds, and cannot be more than ten minutes in the future or more than one hour in the past.
          example:
            - - 1575317847
              - 0.5
          items:
            $ref: '#/components/schemas/Point'
          type: array
        tags:
          description: A list of tags associated with the metric.
          example:
            - environment:test
          items:
            description: Individual tags.
            type: string
          type: array
        type:
          default: ''
          description: The type of the metric. Valid types are "",`count`, `gauge`, and `rate`.
          example: rate
          type: string
      required:
        - metric
        - points
      type: object
