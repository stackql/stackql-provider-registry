      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        name: Security Audit Dataset
                        principals:
                          - role:94172442-be03-11e9-a77a-3b7612558ac1
                        product_filters:
                          - filters:
                              - source:cloudtrail
                            product: logs
                      id: 00000000-0000-0000-0000-000000000001
                      type: dataset
              schema:
                $ref: '#/components/schemas/DatasetResponseSingle'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - user_access_read
      summary: Get a single dataset by ID
      tags:
        - Datasets
      x-permission:
        operator: OPEN
        permissions: []
      x-unstable: |-
        **Note: Data Access is in preview. If you have any feedback,
        contact [Datadog support](https://docs.datadoghq.com/help/).**
    put:
      description: Edits the dataset associated with the ID.
      operationId: UpdateDataset
      parameters:
