      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - user_access_manage
      summary: Edit a dataset
      tags:
        - Datasets
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - user_access_manage
      x-unstable: |-
        **Note: Data Access is in preview. If you have any feedback,
        contact [Datadog support](https://docs.datadoghq.com/help/).**
  /api/v2/ddsql/query/tabular:
    post:
      description: |-
        Submit a DDSQL statement and return either a `running` state with an opaque `query_id`
        for the client to poll, or a `completed` state with the column-major result set inlined
        when the query finishes quickly enough to be served synchronously.
      operationId: ExecuteDdsqlTabularQuery
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      query: SELECT cloud_provider, count(*) FROM dd.hosts group by cloud_provider
                      row_limit: 1000
                      time:
                        from_timestamp: 1736942400000
                        to_timestamp: 1736946000000
                    type: ddsql_query_request
            schema:
              $ref: '#/components/schemas/DdsqlTabularQueryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                completed:
                  summary: Query finished synchronously
                  value:
                    data:
                      attributes:
                        columns:
                          - name: service
                            type: VARCHAR
                            values:
                              - web-store
                              - checkout
                          - name: count
                            type: BIGINT
                            values:
                              - 1024
                              - 512
                        state: completed
                      id: 00000000-0000-0000-0000-000000000000
                      type: ddsql_query_response
                    meta:
                      elapsed: 318
                      request_id: req-7f3e7d2c-1a0b-4d3e-9b2a-3c4d5e6f7081
                default:
                  summary: Query finished synchronously
                  value:
                    data:
                      attributes:
                        columns:
                          - name: service
                            type: VARCHAR
                            values:
                              - web-store
                              - checkout
                          - name: count
                            type: BIGINT
                            values:
                              - 1024
                              - 512
                        state: completed
                      id: 00000000-0000-0000-0000-000000000000
                      type: ddsql_query_response
                    meta:
                      elapsed: 318
                      request_id: req-7f3e7d2c-1a0b-4d3e-9b2a-3c4d5e6f7081
                running:
                  summary: Query still executing
                  value:
                    data:
                      attributes:
                        query_id: eyJxdWVyeSI6ICJTRUxFQ1QgKiBGUk9NIGxvZ3MifQ==
                        state: running
                      id: 00000000-0000-0000-0000-000000000000
                      type: ddsql_query_response
                    meta:
                      elapsed: 42
                      request_id: req-7f3e7d2c-1a0b-4d3e-9b2a-3c4d5e6f7081
              schema:
                $ref: '#/components/schemas/DdsqlTabularQueryResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Internal Server Error
      summary: Execute a tabular DDSQL query
      tags:
        - DDSQL
  /api/v2/ddsql/query/tabular/fetch:
    post:
      description: |-
        Poll a previously submitted DDSQL query for results. Pass the opaque `query_id` returned
        by a prior `ExecuteDdsqlTabularQuery` (or by a prior `FetchDdsqlTabularQuery` that
        returned `state: running`) and the server returns either a `running` state to poll again
        or a `completed` state with the column-major result set inlined.
      operationId: FetchDdsqlTabularQuery
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      query_id: eyJxdWVyeSI6ICJTRUxFQ1QgKiBGUk9NIGxvZ3MifQ==
                    type: ddsql_query_fetch_request
            schema:
              $ref: '#/components/schemas/DdsqlTabularQueryFetchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                completed:
                  summary: Query finished
                  value:
                    data:
                      attributes:
                        columns:
                          - name: service
                            type: VARCHAR
                            values:
                              - web-store
                              - checkout
                          - name: count
                            type: BIGINT
                            values:
                              - 1024
                              - 512
                        state: completed
                      id: 00000000-0000-0000-0000-000000000000
                      type: ddsql_query_response
                    meta:
                      elapsed: 87
                      request_id: req-7f3e7d2c-1a0b-4d3e-9b2a-3c4d5e6f7082
                default:
                  summary: Query finished
                  value:
                    data:
                      attributes:
                        columns:
                          - name: service
                            type: VARCHAR
                            values:
                              - web-store
                              - checkout
                          - name: count
                            type: BIGINT
                            values:
                              - 1024
                              - 512
                        state: completed
                      id: 00000000-0000-0000-0000-000000000000
                      type: ddsql_query_response
                    meta:
                      elapsed: 87
                      request_id: req-7f3e7d2c-1a0b-4d3e-9b2a-3c4d5e6f7082
                running:
                  summary: Query still executing
                  value:
                    data:
                      attributes:
                        query_id: eyJxdWVyeSI6ICJTRUxFQ1QgKiBGUk9NIGxvZ3MifQ==
                        state: running
                      id: 00000000-0000-0000-0000-000000000000
                      type: ddsql_query_response
                    meta:
                      elapsed: 12
                      request_id: req-7f3e7d2c-1a0b-4d3e-9b2a-3c4d5e6f7082
              schema:
                $ref: '#/components/schemas/DdsqlTabularQueryResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Internal Server Error
      summary: Fetch the result of a DDSQL query
      tags:
        - DDSQL
  /api/v2/metrics:
    get:
      description: |-
        Get a list of actively reporting metrics for your organization. Pagination is optional using the `page[cursor]` and `page[size]` query parameters.

        Query parameters use bracket notation (for example, `filter[tags]`, `filter[queried][window][seconds]`). Pass them as standard URL query strings, URL-encoding the brackets if your client does not handle them. For example: `GET /api/v2/metrics?filter[tags]=env:prod&window[seconds]=86400&page[size]=500`.
      operationId: ListTagConfigurations
      parameters:
        - description: Only return custom metrics that have been configured (`true`) or not configured (`false`) with Metrics Without Limits.
          example: true
          in: query
          name: filter[configured]
          required: false
          schema:
            type: boolean
        - description: Only return metrics that are eligible (`true`) or ineligible (`false`) for configuration with Metrics Without Limits.
          example: true
          in: query
          name: filter[is_configurable]
          required: false
          schema:
            type: boolean
        - description: Only return metrics that have the given tag key(s) in their Metrics Without Limits configuration (included or excluded).
          example: app,env
          in: query
          name: filter[tags_configured]
          required: false
          schema:
            description: Tag keys to filter by.
            type: string
        - description: Only return metrics of the given metric type.
          in: query
          name: filter[metric_type]
          required: false
          schema:
            $ref: '#/components/schemas/MetricTagConfigurationMetricTypeCategory'
        - description: Only return distribution metrics that have percentile aggregations enabled (true) or disabled (false).
          example: true
          in: query
          name: filter[include_percentiles]
          required: false
          schema:
            type: boolean
        - description: Only return metrics that have been queried (true) or not queried (false) in the look back window. Set the window with `filter[queried][window][seconds]`; if omitted, a default window is used.
          example: true
          in: query
          name: filter[queried]
          required: false
          schema:
            type: boolean
        - description: 'This parameter has no effect unless `filter[queried]` is also set. Only return metrics that have been queried or not queried in the specified window. The default value is 2,592,000 seconds (30 days), the maximum value is 15,552,000 seconds (180 days), and the minimum value is 1 second. For example: `filter[queried]=true&filter[queried][window][seconds]=604800`.'
          example: 15552000
          in: query
          name: filter[queried][window][seconds]
          required: false
          schema:
            default: 2592000
            format: int64
            maximum: 15552000
            minimum: 1
            type: integer
        - description: 'Only return metrics that were submitted with tags matching this expression. You can use AND, OR, IN, and wildcards. For example: `filter[tags]=env IN (staging,test) AND service:web*`.'
          example: env IN (staging,test) AND service:web*
          in: query
          name: filter[tags]
          required: false
          schema:
            type: string
        - description: Only return metrics that are used in at least one dashboard, monitor, notebook, or SLO.
          example: true
          in: query
          name: filter[related_assets]
          required: false
          schema:
            type: boolean
        - description: Include related resources in the response. Set to `metric_volumes` to include indexed and ingested volume counts for each metric.
          example: metric_volumes
          in: query
          name: include
          required: false
          schema:
            type: string
        - description: 'Sort results by metric volume. Prefix a key with `-` for descending order. Supported keys: `metric_volumes.indexed_volume`, `metric_volumes.ingested_volume`, `metric_volumes.indexed_volume_delta`, `metric_volumes.ingested_volume_delta`. Requires a paginated request (`page[size]` or `page[cursor]`).'
          example: '-metric_volumes.indexed_volume'
          in: query
          name: sort
          required: false
          schema:
            type: string
        - description: Only return metrics that have been actively reporting in the specified window. The default value is 3600 seconds (1 hour), the maximum value is 2,592,000 seconds (30 days), and the minimum value is 1 second.
          example: 3600
          in: query
          name: window[seconds]
          required: false
          schema:
            default: 3600
            format: int64
            maximum: 2592000
            minimum: 1
            type: integer
        - description: Maximum number of results per page. Send `page[size]` on the first request to opt in to pagination. On each subsequent request, send `page[cursor]` set to the value of `meta.pagination.next_cursor` from the previous response. The default value is 10000, the maximum value is 10000, and the minimum value is 1.
          in: query
          name: page[size]
          required: false
          schema:
            default: 10000
            format: int32
            maximum: 10000
            minimum: 1
            type: integer
        - description: Cursor for pagination. Use `page[size]` to opt-in to pagination and get the first page; for subsequent pages, use the value from `meta.pagination.next_cursor` in the response. Pagination is complete when `next_cursor` is null.
          in: query
          name: page[cursor]
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - id: system.cpu.user
                        type: metrics
                      - attributes:
                          created_at: '2020-03-25T09:48:37.463835Z'
                          metric_type: gauge
                          modified_at: '2020-04-25T09:48:37.463835Z'
                          tags:
                            - app
                            - datacenter
                        id: http.endpoint.request
                        type: manage_tags
                    meta:
                      pagination:
                        next_cursor: eyJhZnRlciI6Imh0dHAuZW5kcG9pbnQucmVxdWVzdCJ9
                with_metric_volumes:
                  value:
                    data:
                      - id: user.custom.cpu.usage
                        relationships:
                          metric_volumes:
                            data:
                              id: user.custom.cpu.usage
                              type: metric_volumes
                        type: metrics
                      - id: user.custom.mem.usage
                        relationships:
                          metric_volumes:
                            data:
                              id: user.custom.mem.usage
                              type: metric_volumes
                        type: metrics
                    included:
                      - attributes:
                          indexed_volume: 1000
                          ingested_volume: 456
                        id: user.custom.cpu.usage
                        type: metric_volumes
                      - attributes:
                          indexed_volume: 250
                          ingested_volume: 1011
                        id: user.custom.mem.usage
                        type: metric_volumes
              schema:
                $ref: '#/components/schemas/MetricsAndMetricTagConfigurationsResponse'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Too Many Requests
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - metrics_read
      summary: Get a list of metrics
      tags:
        - Metrics
      x-pagination:
        cursorParam: page[cursor]
        cursorPath: meta.pagination.next_cursor
        limitParam: page[size]
        resultsPath: data
      x-permission:
        operator: OR
        permissions:
          - metrics_read
  /api/v2/metrics/config/bulk-tags:
    delete:
      deprecated: true
      description: |-
        **Note**: This endpoint is deprecated. Use [Tag Indexing Rules](/api/latest/metrics/#create-a-tag-indexing-rule) (`POST /api/v2/metrics/tag-indexing-rules`) instead.

        Delete all custom lists of queryable tag keys for a set of existing count, gauge, rate, and distribution metrics.
        Metrics are selected by passing a metric name prefix.
        Results can be sent to a set of account email addresses, just like the same operation in the Datadog web app.
        Can only be used with application keys of users with the `Manage Tags for Metrics` permission.
      operationId: DeleteBulkTagsMetricsConfiguration
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      emails:
                        - sue@example.com
                        - bob@example.com
                    id: kafka.lag
                    type: metric_bulk_configure_tags
            schema:
              $ref: '#/components/schemas/MetricBulkTagConfigDeleteRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        emails:
                          - test@example.com
                        status: Accepted
                      id: kafka.lag
                      type: metric_bulk_configure_tags
              schema:
                $ref: '#/components/schemas/MetricBulkTagConfigResponse'
          description: Accepted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Too Many Requests
      summary: Delete tags for multiple metrics
      tags:
        - Metrics
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - metric_tags_write
      x-sunset: '2027-01-01'
    post:
      deprecated: true
      description: |-
        **Note**: This endpoint is deprecated. Use [Tag Indexing Rules](/api/latest/metrics/#create-a-tag-indexing-rule) (`POST /api/v2/metrics/tag-indexing-rules`) instead.

        Create and define a list of queryable tag keys for a set of existing count, gauge, rate, and distribution metrics.
        Metrics are selected by passing a metric name prefix. Use the Delete method of this API path to remove tag configurations.
        Results can be sent to a set of account email addresses, just like the same operation in the Datadog web app.
        If multiple calls include the same metric, the last configuration applied (not by submit order) is used, do not
        expect deterministic ordering of concurrent calls. The `exclude_tags_mode` value will set all metrics that match the prefix to
        the same exclusion state, metric tag configurations do not support mixed inclusion and exclusion for tags on the same metric.
        Can only be used with application keys of users with the `Manage Tags for Metrics` permission.
      operationId: CreateBulkTagsMetricsConfiguration
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      emails:
                        - sue@example.com
                        - bob@example.com
                      tags:
                        - host
                        - pod_name
                        - is_shadow
                    id: kafka.lag
                    type: metric_bulk_configure_tags
            schema:
              $ref: '#/components/schemas/MetricBulkTagConfigCreateRequest'
        required: true
      responses:
        '202':
