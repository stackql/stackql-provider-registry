  /api/v2/series:
    post:
      description: |-
        The metrics end-point allows you to post time-series data that can be graphed on Datadog’s dashboards.
        The maximum payload size is 500 kilobytes (512000 bytes). Compressed payloads must have a decompressed size of less than 5 megabytes (5242880 bytes).

        If you’re submitting metrics directly to the Datadog API without using DogStatsD, expect:

        - 64 bits for the timestamp
        - 64 bits for the value
        - 20 bytes for the metric names
        - 50 bytes for the timeseries
        - The full payload is approximately 100 bytes.

        Host name is one of the resources in the Resources field.
      operationId: SubmitMetrics
      parameters:
        - description: HTTP header used to compress the media-type.
          in: header
          name: Content-Encoding
          required: false
          schema:
            $ref: '#/components/schemas/MetricContentEncoding'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  series:
                    - metric: system.load.1
                      points:
                        - timestamp: 1636629071
                          value: 1.1
                      resources:
                        - name: dummyhost
                          type: host
                      type: 0
              dynamic-points:
                description: Post time-series data that can be graphed on Datadog’s dashboards.
                externalValue: examples/metrics/dynamic-points.json.sh
                summary: Dynamic Points
                x-variables:
                  NOW: $(date +%s)
            schema:
              $ref: '#/components/schemas/MetricPayload'
        required: true
      responses:
        '202':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors: []
              schema:
                $ref: '#/components/schemas/IntakePayloadAccepted'
          description: Payload accepted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Authentication error
        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Request timeout
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Payload too large
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
      summary: Submit metrics
      tags:
        - Metrics
      x-codegen-request-body-name: body
  /api/v2/spans/analytics/aggregate:
    post:
      description: |-
        The API endpoint to aggregate spans into buckets and compute metrics and timeseries.
        This endpoint is rate limited to `300` requests per hour.
      operationId: AggregateSpans
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      compute:
                        - aggregation: pc90
                          interval: 5m
                          metric: '@duration'
                          type: timeseries
                      filter:
                        from: now-15m
                        query: service:web* AND @http.status_code:[200 TO 299]
                        to: now
                      group_by:
                        - facet: host
