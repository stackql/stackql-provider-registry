openapi: 3.0.0
info:
  title: metrics API
  description: |-
    The metrics endpoint allows you to:

    - Post metrics data so it can be graphed on Datadog’s dashboards
    - Query metrics from any time period (timeseries and scalar)
    - Modify tag configurations for metrics
    - View tags and volumes for metrics

    **Note**: A graph can only contain a set number of points
    and as the timeframe over which a metric is viewed increases,
    aggregation between points occurs to stay below that set number.

    The Post, Patch, and Delete `manage_tags` API methods can only be performed by
    a user who has the `Manage Tags for Metrics` permission.

    See the [Metrics page](https://docs.datadoghq.com/metrics/) for more information.
  version: '1.0'
paths:
  /api/v2/datasets:
    get:
      description: Get all datasets that have been configured for an organization.
      operationId: GetAllDatasets
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          name: Security Audit Dataset
                          principals:
                            - role:94172442-be03-11e9-a77a-3b7612558ac1
                          product_filters:
                            - filters:
                                - source:cloudtrail
                              product: logs
                        id: 00000000-0000-0000-0000-000000000003
                        type: dataset
              schema:
                $ref: '#/components/schemas/DatasetResponseMulti'
          description: OK
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - user_access_read
      summary: Get all datasets
      tags:
        - Datasets
      x-permission:
        operator: OR
        permissions:
          - user_access_read
      x-unstable: |-
        **Note: Data Access is in preview. If you have any feedback,
        contact [Datadog support](https://docs.datadoghq.com/help/).**
    post:
      description: Create a dataset with the configurations in the request.
      operationId: CreateDataset
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      name: Security Audit Dataset
                      principals:
                        - role:94172442-be03-11e9-a77a-3b7612558ac1
                      product_filters:
                        - filters:
                            - source:cloudtrail
                          product: logs
                      restriction_query_id: 00000000-0000-0000-0000-000000000001
                    type: dataset
            schema:
              $ref: '#/components/schemas/DatasetCreateRequest'
        description: Dataset payload
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        name: Security Audit Dataset
                        principals:
                          - role:abc-123
                        product_filters:
                          - filters:
                              - source:cloudtrail
                            product: logs
                      id: 00000000-0000-0000-0000-000000000004
                      type: dataset
              schema:
                $ref: '#/components/schemas/DatasetResponseSingle'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - user_access_manage
      summary: Create a dataset
      tags:
        - Datasets
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - user_access_manage
      x-unstable: |-
        **Note: Data Access is in preview. If you have any feedback,
        contact [Datadog support](https://docs.datadoghq.com/help/).**
