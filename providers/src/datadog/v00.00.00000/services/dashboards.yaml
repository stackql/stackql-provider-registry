          nullable: true
          type: object
        viewed_at:
          description: When the dashboard was most recently viewed. Populated only when Real User Monitoring (RUM) is active for the org; `null` in orgs without RUM.
          example: '2026-05-01T14:22:10.000Z'
          format: date-time
          nullable: true
          type: string
        viewer:
          $ref: '#/components/schemas/DashboardUsageUser'
        widget_count:
          description: The total number of widgets on the dashboard.
          example: 12
          format: int64
          nullable: true
          type: integer
        widget_count_by_type:
          additionalProperties:
            description: Widget count for that widget type.
            format: int64
            type: integer
          description: Widget counts keyed by widget type. The map includes group widgets and widgets without requests.
          nullable: true
          type: object
