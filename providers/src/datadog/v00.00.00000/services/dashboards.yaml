          description: Integer representing the number of elements to be returned in the results.
          example: 100
          format: int64
          type: integer
        next_offset:
          description: Integer representing the index of the first element in the next page of results. Equal to page size added to the current offset.
          example: 100
          format: int64
          nullable: true
          type: integer
        offset:
          description: Integer representing the index of the first element in the results.
          example: 0
          format: int64
          type: integer
        prev_offset:
          description: Integer representing the index of the first element in the previous page of results.
          example: 100
          format: int64
          nullable: true
          type: integer
        total:
