          description: When the dashboard was most recently edited.
          example: '2026-04-20T11:05:00.000Z'
          format: date-time
          nullable: true
          type: string
        org_id:
          description: The Datadog organization that owns the dashboard.
          example: 100
          format: int64
          type: integer
        teams:
          description: Teams the dashboard is tagged with.
          items:
            description: A team handle.
            type: string
          nullable: true
          type: array
        title:
          description: The dashboard title.
          example: My production overview
          type: string
        total_views:
          description: Total view count for the dashboard. Counts only views captured by Real User Monitoring (RUM); `0` in orgs without RUM.
          example: 42
          format: int64
          type: integer
        total_views_by_type:
          additionalProperties:
            description: View count for that view type.
            format: int64
            type: integer
