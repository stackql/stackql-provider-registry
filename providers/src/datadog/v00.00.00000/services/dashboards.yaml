openapi: 3.0.0
info:
  title: dashboards API
  description: |-
    Get usage statistics for the dashboards in your organization, including view
    counts, last-edit times, widget counts, and quality scores. See the
    [Dashboards documentation](https://docs.datadoghq.com/dashboards/) for more
    information.
  version: '1.0'
paths:
  /api/v2/annotation:
    get:
      description: Returns a flat list of annotations matching the given page, time window, and optional widget filter.
      operationId: ListAnnotations
      parameters:
        - description: |-
            ID of the page to list annotations for, prefixed with the page type and joined by a colon
            (for example, `dashboard:abc-def-xyz` or `notebook:1234567890`).
          example: dashboard:abc-def-xyz
          in: query
          name: page_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AnnotationStartTimeQueryParameter'
        - $ref: '#/components/parameters/AnnotationEndTimeQueryParameter'
        - description: Optional widget ID to restrict results to annotations on a specific widget.
          in: query
          name: widget_id
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          author_id: 00000000-0000-0000-0000-000000000001
                          color: blue
                          created_at: 1704067200000
                          description: Deployed v2.3.1 to production.
                          end_time: null
                          modified_at: 1704067200000
                          page_id: dashboard:abc-def-xyz
                          start_time: 1704067200000
                          type: pointInTime
                          widget_ids:
                            - '1234567890'
                        id: 00000000-0000-0000-0000-000000000000
                        type: annotation
              schema:
                $ref: '#/components/schemas/AnnotationsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Internal Server Error
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: List annotations
      tags:
        - Annotations
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
    post:
      description: |-
        Creates a new annotation on a dashboard or notebook page.
        Valid `color` values: `gray`, `blue`, `purple`, `green`, `yellow`, `red`.
        Valid `type` values: `pointInTime` (marks a single moment) or `timeRegion` (spans a range and requires `end_time`).
      operationId: CreateAnnotation
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      color: blue
                      description: Deployed v2.3.1 to production.
                      page_id: dashboard:abc-def-xyz
                      start_time: 1704067200000
                      type: pointInTime
                      widget_ids:
                        - '1234567890'
                    type: annotation
            schema:
              $ref: '#/components/schemas/AnnotationCreateRequest'
        description: Annotation to create.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        author_id: 00000000-0000-0000-0000-000000000001
                        color: blue
                        created_at: 1704067200000
                        description: Deployed v2.3.1 to production.
                        end_time: null
                        modified_at: 1704067200000
                        page_id: dashboard:abc-def-xyz
                        start_time: 1704067200000
                        type: pointInTime
                        widget_ids:
                          - '1234567890'
                      id: 00000000-0000-0000-0000-000000000000
                      type: annotation
              schema:
                $ref: '#/components/schemas/AnnotationResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Internal Server Error
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Create an annotation
      tags:
        - Annotations
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/annotation/page/{page_id}:
    get:
      description: |-
        Returns all annotations on a specific page for a given time window, grouped by widget.
        Unlike `ListAnnotations`, this endpoint returns a single structured object with annotations
        indexed by their ID and a widget-to-annotation mapping for easy UI rendering.
      operationId: GetPageAnnotations
      parameters:
        - $ref: '#/components/parameters/AnnotationPageIDPathParameter'
        - $ref: '#/components/parameters/AnnotationStartTimeQueryParameter'
        - $ref: '#/components/parameters/AnnotationEndTimeQueryParameter'
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        annotations:
                          00000000-0000-0000-0000-000000000000:
                            author_id: 00000000-0000-0000-0000-000000000001
                            color: blue
                            created_at: 1704067200000
                            description: Deployed v2.3.1 to production.
                            end_time: null
                            id: 00000000-0000-0000-0000-000000000000
                            modified_at: 1704067200000
                            page_id: dashboard:abc-def-xyz
                            start_time: 1704067200000
                            type: pointInTime
                            widget_ids:
                              - '1234567890'
                        global_annotations:
                          - 00000000-0000-0000-0000-000000000002
                        widget_mapping:
                          '1234567890':
                            - 00000000-0000-0000-0000-000000000000
                      id: dashboard:abc-def-xyz
                      type: page_annotations
              schema:
                $ref: '#/components/schemas/PageAnnotationsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Internal Server Error
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Get annotations for a page
      tags:
        - Annotations
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/annotation/{annotation_id}:
    delete:
      description: |-
        Deletes an existing annotation by ID.
        Returns `204 No Content` if the annotation does not exist (idempotent).
      operationId: DeleteAnnotation
      parameters:
        - $ref: '#/components/parameters/AnnotationIDPathParameter'
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Internal Server Error
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Delete an annotation
      tags:
        - Annotations
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
    put:
      description: |-
        Updates an existing annotation.
        Valid `color` values: `gray`, `blue`, `purple`, `green`, `yellow`, `red`.
        Valid `type` values: `pointInTime` (marks a single moment) or `timeRegion` (spans a range and requires `end_time`).
      operationId: UpdateAnnotation
      parameters:
        - $ref: '#/components/parameters/AnnotationIDPathParameter'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      color: green
                      description: Deployed v2.3.1 to production (updated).
                      page_id: dashboard:abc-def-xyz
                      start_time: 1704067200000
                      type: pointInTime
                      widget_ids:
                        - '1234567890'
                    type: annotation
            schema:
              $ref: '#/components/schemas/AnnotationUpdateRequest'
        description: Updated annotation payload.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        author_id: 00000000-0000-0000-0000-000000000001
                        color: green
                        created_at: 1704067200000
                        description: Deployed v2.3.1 to production (updated).
                        end_time: null
                        modified_at: 1704070800000
                        page_id: dashboard:abc-def-xyz
                        start_time: 1704067200000
                        type: pointInTime
                        widget_ids:
                          - '1234567890'
                      id: 00000000-0000-0000-0000-000000000000
                      type: annotation
              schema:
                $ref: '#/components/schemas/AnnotationResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Internal Server Error
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Update an annotation
      tags:
        - Annotations
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/dashboard/lists/manual/{dashboard_list_id}/dashboards:
    delete:
      description: Delete dashboards from an existing dashboard list.
      operationId: DeleteDashboardListItems
      parameters:
        - description: ID of the dashboard list to delete items from.
          in: path
          name: dashboard_list_id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  dashboards:
                    - id: q5j-nti-fv6
                      type: host_timeboard
            schema:
              $ref: '#/components/schemas/DashboardListDeleteItemsRequest'
        description: Dashboards to delete from the dashboard list.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    deleted_dashboards_from_list:
                      - id: q5j-nti-fv6
                        type: host_timeboard
              schema:
                $ref: '#/components/schemas/DashboardListDeleteItemsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Delete items from a dashboard list
      tags:
        - Dashboard Lists
      x-codegen-request-body-name: body
    get:
      description: Fetch the dashboard list’s dashboard definitions.
      operationId: GetDashboardListItems
      parameters:
        - description: ID of the dashboard list to get items from.
          in: path
          name: dashboard_list_id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    dashboards:
                      - id: q5j-nti-fv6
                        type: host_timeboard
                    total: 1
              schema:
                $ref: '#/components/schemas/DashboardListItems'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - dashboards_read
      summary: Get items of a Dashboard List
      tags:
        - Dashboard Lists
      x-permission:
        operator: OR
        permissions:
          - dashboards_read
    post:
      description: Add dashboards to an existing dashboard list.
      operationId: CreateDashboardListItems
      parameters:
        - description: ID of the dashboard list to add items to.
          in: path
          name: dashboard_list_id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  dashboards:
                    - id: q5j-nti-fv6
                      type: host_timeboard
            schema:
              $ref: '#/components/schemas/DashboardListAddItemsRequest'
        description: Dashboards to add to the dashboard list.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    added_dashboards_to_list:
                      - id: q5j-nti-fv6
                        type: host_timeboard
              schema:
                $ref: '#/components/schemas/DashboardListAddItemsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Add Items to a Dashboard List
      tags:
        - Dashboard Lists
      x-codegen-request-body-name: body
    put:
      description: Update dashboards of an existing dashboard list.
      operationId: UpdateDashboardListItems
      parameters:
        - description: ID of the dashboard list to update items from.
          in: path
          name: dashboard_list_id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  dashboards:
                    - id: q5j-nti-fv6
                      type: host_timeboard
            schema:
              $ref: '#/components/schemas/DashboardListUpdateItemsRequest'
        description: New dashboards of the dashboard list.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    dashboards:
                      - id: q5j-nti-fv6
                        type: host_timeboard
              schema:
                $ref: '#/components/schemas/DashboardListUpdateItemsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Update items of a dashboard list
      tags:
        - Dashboard Lists
      x-codegen-request-body-name: body
  /api/v2/dashboard/{dashboard_id}/shared:
    get:
      description: Retrieve shared dashboards associated with the specified dashboard.
      operationId: ListSharedDashboardsByDashboardId
      parameters:
        - $ref: '#/components/parameters/SharedDashboardDashboardIDPathParameter'
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          created_at: '2026-01-01T00:00:00.000Z'
                          embeddable_domains: []
                          expiration: null
                          global_time:
                            live_span: 1h
                          global_time_selectable: false
                          invitees:
                            - access_expiration: null
                              created_at: '2026-01-01T00:00:00.000Z'
                              email: jane.doe@example.com
                          last_accessed: null
                          selectable_template_vars: []
                          share_type: invite
                          sharer_disabled: false
                          status: active
                          title: Q1 Metrics Dashboard
                          token: abc-123-token
                          url: https://p.datadoghq.com/sb/abc-123-token
                          viewing_preferences:
                            high_density: false
                            theme: system
                        id: '12345'
                        relationships:
                          dashboard:
                            data:
                              id: abc-def-ghi
                              type: dashboard
                          sharer:
                            data:
                              id: 00000000-0000-0000-0000-000000000000
                              type: user
                        type: shared_dashboard
                    included:
                      - attributes:
                          title: Q1 Metrics Dashboard
                        id: abc-def-ghi
                        type: dashboard
                      - attributes:
                          handle: jane.doe@example.com
                          name: Jane Doe
                        id: 00000000-0000-0000-0000-000000000000
                        type: user
              schema:
                $ref: '#/components/schemas/ListSharedDashboardsResponse'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Dashboard Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - dashboards_read
      summary: List shared dashboards for a dashboard
      tags:
        - Dashboard Sharing
      x-permission:
        operator: OR
        permissions:
          - dashboards_read
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/dashboard/{dashboard_id}/shared/secure-embed:
    post:
      description: Create a secure embed share for a dashboard. The response includes a one-time `credential` used for HMAC-SHA256 signing. Store it securely — it cannot be retrieved again.
      operationId: CreateDashboardSecureEmbed
      parameters:
        - $ref: '#/components/parameters/DashboardIDPathParameter'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      global_time:
                        live_span: 1h
                      global_time_selectable: true
                      selectable_template_vars:
                        - default_values:
                            - '1'
                          name: org_id
                          prefix: org_id
                          visible_tags:
                            - '1'
                      status: active
                      title: Q1 Metrics Dashboard
                      viewing_preferences:
                        high_density: false
                        theme: system
                    type: secure_embed_request
            schema:
              $ref: '#/components/schemas/SecureEmbedCreateRequest'
        description: Secure embed creation request body.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        created_at: '2024-01-01T00:00:00+00:00'
                        credential: example-credential-value
                        dashboard_id: abc-def-ghi
                        global_time_selectable: true
                        id: '12345'
                        share_type: secure_embed
                        status: active
                        title: Q1 Metrics Dashboard
                        token: abc-123-token
                        url: https://p.datadoghq.com/sb/secure-embed/abc-123-token
                      id: '12345'
                      type: secure_embed_create_response
              schema:
                $ref: '#/components/schemas/SecureEmbedCreateResponse'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Dashboard Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Conflict — max 1000 share URLs per dashboard exceeded
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - dashboards_embed_share
      summary: Create a secure embed for a dashboard
      tags:
        - Dashboard Secure Embed
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
          - dashboards_embed_share
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/dashboard/{dashboard_id}/shared/secure-embed/{token}:
    delete:
      description: Delete a secure embed share for a dashboard.
      operationId: DeleteDashboardSecureEmbed
      parameters:
        - $ref: '#/components/parameters/DashboardIDPathParameter'
        - $ref: '#/components/parameters/SecureEmbedTokenPathParameter'
      responses:
        '204':
          description: No Content
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - dashboards_embed_share
      summary: Delete a secure embed for a dashboard
      tags:
        - Dashboard Secure Embed
      x-permission:
        operator: OR
        permissions:
          - dashboards_embed_share
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
    get:
      description: Retrieve an existing secure embed configuration for a dashboard.
      operationId: GetDashboardSecureEmbed
      parameters:
        - $ref: '#/components/parameters/DashboardIDPathParameter'
        - $ref: '#/components/parameters/SecureEmbedTokenPathParameter'
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        created_at: '2024-01-01T00:00:00+00:00'
                        credential_suffix: ab3f
                        dashboard_id: abc-def-ghi
                        global_time_selectable: true
                        id: '12345'
                        share_type: secure_embed
                        status: active
                        title: Q1 Metrics Dashboard
                        token: abc-123-token
                        url: https://p.datadoghq.com/sb/secure-embed/abc-123-token
                      id: '12345'
                      type: secure_embed_get_response
              schema:
                $ref: '#/components/schemas/SecureEmbedGetResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - dashboards_read
      summary: Get a secure embed for a dashboard
      tags:
        - Dashboard Secure Embed
      x-permission:
        operator: OR
        permissions:
          - dashboards_read
      x-unstable: |-
        **Note**: This endpoint is in preview and is subject to change.
