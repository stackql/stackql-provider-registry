        limit: 100
        next_offset: 100
        offset: 0
        prev_offset: 100
        total: 1000
        type: offset_limit
      properties:
        first_offset:
          description: Integer representing the offset to fetch the first page of results.
          example: 0
          format: int64
          type: integer
        last_offset:
          description: Integer representing the offset to fetch the last page of results.
          example: 900
          format: int64
          nullable: true
          type: integer
