          description: The operation name of the span.
          example: web.request
          type: string
        parentID:
          description: The ID of the parent span, or `0` when the span is the trace root.
          example: 0
          format: int64
          type: integer
        resource:
          description: The resource that the span describes.
          example: GET /products
          type: string
        service:
          description: The name of the service that emitted the span.
          example: web-store
          type: string
        spanID:
          description: The span ID, as an unsigned 64-bit integer.
          example: 9876543210987655000
          format: int64
          type: integer
        span_kind:
          description: |-
            The OpenTelemetry span kind, for example `INTERNAL`, `SERVER`, `CLIENT`,
            `PRODUCER`, or `CONSUMER`.
          example: SERVER
          type: string
        startTime:
          description: The start time of the span, in RFC3339 format.
          example: '2026-05-27T12:00:00Z'
          format: date-time
          type: string
      required:
        - service
        - name
        - resource
        - parentID
        - spanID
        - startTime
        - endTime
        - durationSeconds
        - error
        - meta
        - metrics
        - span_kind
        - hidden_child_spans_count
        - children
      type: object
    State:
      description: The state of the rule evaluation.
      enum:
        - pass
        - fail
        - skip
      example: pass
      type: string
      x-enum-varnames:
        - PASS
        - FAIL
        - SKIP
    RelationshipToOutcome:
      description: The JSON:API relationship to a scorecard outcome.
      properties:
        data:
          $ref: '#/components/schemas/RelationshipToOutcomeData'
      type: object
    EntityReference:
      description: The unique reference for an IDP entity.
      example: service:my-service
      type: string
    RelationshipToRuleDataObject:
      description: Rule relationship data.
      properties:
        id:
          description: The unique ID for a scorecard.
          example: q8MQxk8TCqrHnWkp
          type: string
        type:
          $ref: '#/components/schemas/ScorecardType'
      type: object
    ScorecardScoreRelationshipData:
      description: A relationship data object for a score.
      properties:
