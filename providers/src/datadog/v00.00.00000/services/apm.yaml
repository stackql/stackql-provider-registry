          example: ''
          type: string
        type:
          description: The type of the related resource.
          example: ''
          type: string
      required:
        - id
        - type
      type: object
    APMTraceSpan:
      description: A single APM span returned as part of a trace.
      properties:
        duration:
          description: The duration of the span, in nanoseconds.
          example: 500000000
          format: int64
          type: integer
        endTime:
          description: The end time of the span, in Unix nanoseconds.
          example: 1716800000500000000
          format: int64
          type: integer
        error:
          $ref: '#/components/schemas/APMSpanErrorFlag'
        meta:
          additionalProperties:
            type: string
          description: |-
            String-valued tags attached to the span. Tag keys starting with `_` are
            filtered out of the response.
          example:
            env: production
            http.method: GET
          type: object
        metrics:
          additionalProperties:
            format: double
            type: number
          description: |-
            Numeric metrics attached to the span. Metric keys starting with `_` are
            filtered out of the response.
          example:
            http.status_code: 200
          type: object
        name:
          description: The operation name of the span.
          example: web.request
          type: string
        parentID:
          description: The ID of the parent span, or `0` when the span is a trace root.
          example: 0
          format: int64
          type: integer
        resource:
          description: The resource that the span describes.
          example: GET /products
          type: string
        resourceHash:
          description: A hash of the resource field.
          example: 6a4e9b7f
          type: string
        restricted:
          description: Whether access to the span is restricted by the organization's data access policies.
          example: false
          type: boolean
        self_time:
          description: The time spent in the span itself, excluding time spent in child spans, in nanoseconds.
          example: 250000000
          format: double
          type: number
        service:
          description: The name of the service that emitted the span.
          example: web-store
          type: string
        spanID:
          description: The span ID, as an unsigned 64-bit integer.
          example: 9876543210987655000
          format: int64
          type: integer
        startTime:
          description: The start time of the span, in Unix nanoseconds.
          example: 1716800000000000000
          format: int64
          type: integer
        traceID:
          description: The lower 64 bits of the trace ID, as an unsigned 64-bit integer.
          example: 12345678901234567000
          format: int64
          type: integer
        traceIDFull:
          description: The full 128-bit trace ID, encoded as a 32-character hexadecimal string.
          example: 0000000000000000abc1230000000000
          type: string
        type:
          description: The type of the span (for example, `web`, `db`, or `rpc`).
          example: web
          type: string
      required:
        - service
        - name
        - resource
        - traceID
        - spanID
        - parentID
        - startTime
        - endTime
        - duration
        - error
        - type
        - meta
        - metrics
        - traceIDFull
      type: object
    APMSpanErrorFlag:
      description: Error flag for a span. `1` when the span is in error, `0` otherwise.
      enum:
