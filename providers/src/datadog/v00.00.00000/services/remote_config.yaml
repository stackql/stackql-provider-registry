  /api/v2/remote_config/products/asm/waf/exclusion_filters:
    get:
      description: Retrieve a list of WAF exclusion filters.
      operationId: ListApplicationSecurityWafExclusionFilters
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          description: Exclude false positives on a path
                          enabled: true
                          ip_list:
                            - 198.51.100.72
                          parameters:
                            - list.search.query
                          path_glob: /accounts/*
                        id: 00000000-0000-0000-0000-000000000003
                        type: exclusion_filter
              schema:
                $ref: '#/components/schemas/ApplicationSecurityWafExclusionFiltersResponse'
          description: OK
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: List all WAF exclusion filters
      tags:
        - Application Security
      x-permission:
        operator: AND
        permissions:
          - appsec_protect_read
      x-terraform-resource: appsec_waf_exclusion_filter
    post:
      description: |-
        Create a new WAF exclusion filter with the given parameters.

        A request matched by an exclusion filter will be ignored by the Application Security WAF product.
        Go to https://app.datadoghq.com/security/appsec/passlist to review existing exclusion filters (also called passlist entries).
      operationId: CreateApplicationSecurityWafExclusionFilter
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      description: Exclude false positives on a path
                      enabled: true
                      ip_list:
                        - 198.51.100.72
                      on_match: monitor
                      parameters:
                        - list.search.query
                      path_glob: /accounts/*
                      rules_target:
                        - rule_id: dog-913-009
                          tags:
                            category: attack_attempt
                            type: lfi
                      scope:
                        - env: www
                          service: prod
                    type: exclusion_filter
            schema:
              $ref: '#/components/schemas/ApplicationSecurityWafExclusionFilterCreateRequest'
        description: The definition of the new WAF exclusion filter.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        description: Exclude false positives on a path
                        enabled: true
                        ip_list:
                          - 198.51.100.72
                        parameters:
                          - list.search.query
                        path_glob: /accounts/*
                      id: 00000000-0000-0000-0000-000000000004
                      type: exclusion_filter
              schema:
                $ref: '#/components/schemas/ApplicationSecurityWafExclusionFilterResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '409':
          $ref: '#/components/responses/ConcurrentModificationResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Create a WAF exclusion filter
      tags:
        - Application Security
      x-codegen-request-body-name: body
      x-permission:
        operator: AND
        permissions:
          - appsec_protect_write
      x-terraform-resource: appsec_waf_exclusion_filter
