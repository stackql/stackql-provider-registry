            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          blocking: false
                          conditions:
                            - operator: match_regex
                              parameters:
                                inputs:
                                  - address: server.request.query
                                    key_path:
                                      - id
                                regex: path.*
                          enabled: false
                          name: Block request from bad useragent
