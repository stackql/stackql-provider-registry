      tags:
        - Application Security
    post:
      description: Create a new WAF custom rule with the given parameters.
      operationId: CreateApplicationSecurityWafCustomRule
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      action:
                        action: block_request
                        parameters:
                          location: /blocking
                          status_code: 403
                      blocking: false
                      conditions:
                        - operator: match_regex
                          parameters:
                            data: blocked_users
                            regex: path.*
                            value: custom_tag
                      enabled: false
                      name: Block request from a bad useragent
                      path_glob: /api/search/*
                      scope:
                        - env: prod
                          service: billing-service
                      tags:
                        category: business_logic
                        type: users.login.success
                    type: custom_rule
            schema:
              $ref: '#/components/schemas/ApplicationSecurityWafCustomRuleCreateRequest'
        description: The definition of the new WAF Custom Rule.
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        blocking: false
