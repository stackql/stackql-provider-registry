                      attributes:
                        dry_run:
                          config_validated: true
                          non_upgradable_hosts: 0
                        query: env:prod AND datacenter:us-east-1
                        total_hosts: 42
                      id: dry-run
                      type: deployment
              schema:
                $ref: '#/components/schemas/FleetDeploymentConfigureV2DryRunResponse'
          description: OK
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        author: alice@datadoghq.com
                        duration_seconds: 0
                        error_summary: ''
                        estimated_finished_at: 0
                        finished_at: 0
                        is_scheduled: false
                        query: env:prod AND datacenter:us-east-1
                        started_at: 1699990000
                        status: pending
                        target_versions: []
                        update_type: update_config_operations
                      id: k7Q-3mX-p9Z
                      type: deployment
              schema:
                $ref: '#/components/schemas/FleetDeploymentV2CreateResponse'
          description: CREATED
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Create a configuration deployment
      tags:
