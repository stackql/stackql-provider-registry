openapi: 3.0.0
info:
  title: fleet API
  description: datadog fleet API
  version: '1.0'
paths:
  /api/unstable/fleet/agents/{agent_key}/tracers:
    get:
      description: |-
        Retrieve a paginated list of tracers for a specific agent.

        This endpoint returns tracers associated with a given agent key, identified by the
        agent's hostname. Use this to discover telemetry-derived service names for a particular host.
      operationId: ListFleetAgentTracers
      parameters:
        - description: The unique identifier (agent key) for the Datadog Agent.
          in: path
          name: agent_key
          required: true
          schema:
            type: string
        - description: Page number for pagination (starts at 0).
          in: query
          name: page_number
          required: false
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
        - description: Number of results per page (must be greater than 0 and less than or equal to 100).
          in: query
          name: page_size
          required: false
          schema:
            default: 10
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Attribute to sort by.
          in: query
          name: sort_attribute
          required: false
          schema:
            type: string
        - description: Sort order (true for descending, false for ascending).
          in: query
          name: sort_descending
          required: false
          schema:
            default: true
            type: boolean
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        tracers:
                          - env: production
                            hostname: my-hostname
                            language: java
                            service: test-service
                            tracer_version: 1.32.0
                      id: done
                      type: status
                    meta:
                      total_filtered_count: 1
              schema:
                $ref: '#/components/schemas/FleetTracersResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: List tracers for a specific agent
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - hosts_read
      x-unstable: |-
        This endpoint is in Preview and may introduce breaking changes.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/unstable/fleet/schedules:
    post:
      description: |-
        Create a new schedule for automated package upgrades.

        Schedules define when and how often to automatically deploy package upgrades to a fleet
        of hosts. Each schedule includes:
        - A filter query to select target hosts
        - A recurrence rule defining maintenance windows
        - A version strategy (e.g., always latest, or N versions behind latest)

        When the schedule triggers during a maintenance window, it automatically creates a
        deployment that upgrades the Datadog Agent to the specified version on all matching hosts.
      operationId: CreateFleetSchedule
      requestBody:
        content:
          application/json:
            examples:
              conservative_staging:
                summary: Conservative staging updates (N-1 version)
                value:
                  data:
                    attributes:
                      name: Staging Environment - Conservative Updates
                      query: env:staging
                      rule:
                        days_of_week:
                          - Fri
                        maintenance_window_duration: 240
                        start_maintenance_window: '22:00'
                        timezone: UTC
                      status: active
                      version_to_latest: 1
                    type: schedule
              default:
                value:
                  data:
                    attributes:
                      name: Weekly Production Agent Updates
                      query: env:prod
                      rule:
                        days_of_week:
                          - Mon
                          - Wed
                        maintenance_window_duration: 180
                        start_maintenance_window: '02:00'
                        timezone: America/New_York
                      status: active
                      version_to_latest: 0
                    type: schedule
              weekly_production_update:
                summary: Weekly production agent updates
                value:
                  data:
                    attributes:
                      name: Weekly Production Agent Updates
                      query: env:prod
                      rule:
                        days_of_week:
                          - Mon
                          - Wed
                        maintenance_window_duration: 180
                        start_maintenance_window: '02:00'
                        timezone: America/New_York
                      status: active
                      version_to_latest: 0
                    type: schedule
            schema:
              $ref: '#/components/schemas/FleetScheduleCreateRequest'
        description: Request payload containing the schedule details.
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        name: Weekly Production Agent Updates
                        query: env:prod
                        rule:
                          days_of_week:
                            - Mon
                            - Wed
                          maintenance_window_duration: 180
                          start_maintenance_window: '02:00'
                          timezone: America/New_York
                        status: active
                        version_to_latest: 0
                      id: abc-123
                      type: schedule
              schema:
                $ref: '#/components/schemas/FleetScheduleResponse'
          description: CREATED
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Create a schedule
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - agent_upgrade_write
      x-unstable: |-
        This endpoint is in Preview and may introduce breaking changes.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/unstable/fleet/schedules/{id}:
    delete:
      description: |-
        Delete a schedule permanently.

        When you delete a schedule:
        - The schedule is permanently removed and will no longer create deployments
        - Any deployments already created by this schedule are not affected
        - This action cannot be undone

        If you want to temporarily stop a schedule from creating deployments, consider
        updating its status to "inactive" instead of deleting it.
      operationId: DeleteFleetSchedule
      parameters:
        - description: The unique identifier of the schedule to delete.
          example: abc-def-ghi-123
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Schedule successfully deleted.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Delete a schedule
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - agent_upgrade_write
      x-unstable: |-
        This endpoint is in Preview and may introduce breaking changes.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
    patch:
      description: |-
        Partially update a schedule by providing only the fields you want to change.

        This endpoint allows you to modify specific attributes of a schedule without
        affecting other fields. Common use cases include:
        - Changing the schedule status between active and inactive
        - Updating the maintenance window times
        - Modifying the filter query to target different hosts
        - Adjusting the version strategy

        Only include the fields you want to update in the request body. All fields
        are optional in a PATCH request.
      operationId: UpdateFleetSchedule
      parameters:
        - description: The unique identifier of the schedule to update.
          example: abc-def-ghi-123
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              change_maintenance_window:
                summary: Change maintenance window time
                value:
                  data:
                    attributes:
                      rule:
                        days_of_week:
                          - Mon
                          - Wed
                          - Fri
                        maintenance_window_duration: 240
                        start_maintenance_window: '03:00'
                        timezone: America/New_York
                    type: schedule
              default:
                value:
                  data:
                    attributes:
                      status: inactive
                    type: schedule
              pause_schedule:
                summary: Pause a schedule
                value:
                  data:
                    attributes:
                      status: inactive
                    type: schedule
              update_query:
                summary: Update target hosts query
                value:
                  data:
                    attributes:
                      query: env:prod AND service:api
                    type: schedule
            schema:
              $ref: '#/components/schemas/FleetSchedulePatchRequest'
        description: Request payload containing the fields to update.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        created_at_unix: 1699999999
                        created_by: test@example.com
                        name: Weekly Production Agent Updates
                        query: env:prod AND service:web
                        rule:
                          days_of_week:
                            - Mon
                            - Wed
                          maintenance_window_duration: 120
                          start_maintenance_window: '02:00'
                          timezone: America/New_York
                        status: inactive
                        updated_at_unix: 1699999999
                        updated_by: test@example.com
                        version_to_latest: 0
                      id: abc-def-ghi-123
                      type: schedule
              schema:
                $ref: '#/components/schemas/FleetScheduleResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Update a schedule
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - agent_upgrade_write
      x-unstable: |-
        This endpoint is in Preview and may introduce breaking changes.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/unstable/fleet/schedules/{id}/trigger:
    post:
      description: |-
        Manually trigger a schedule to immediately create and start a deployment.

        This endpoint allows you to manually initiate a deployment using the schedule's
        configuration, without waiting for the next scheduled maintenance window. This is
        useful for:
        - Testing a schedule before it runs automatically
        - Performing an emergency update outside the regular maintenance window
        - Creating an ad-hoc deployment with the same settings as a schedule

        The deployment is created immediately with:
        - The same filter query as the schedule
        - The package version determined by the schedule's version strategy
        - All matching hosts as targets

        The manually triggered deployment is independent of the schedule and does not
        affect the schedule's normal recurrence pattern.
      operationId: TriggerFleetSchedule
      parameters:
        - description: The unique identifier of the schedule to trigger.
          example: abc-def-ghi-123
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        filter_query: env:prod AND service:web
                        high_level_status: pending
                        packages:
                          - name: datadog-agent
                            version: 7.52.0
                        total_hosts: 10
                      id: abc-123
                      type: deployment
              schema:
                $ref: '#/components/schemas/FleetDeploymentResponse'
          description: CREATED - Deployment successfully created and started.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Trigger a schedule deployment
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - agent_upgrade_write
      x-unstable: |-
        This endpoint is in Preview and may introduce breaking changes.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/unstable/fleet/tracers:
    get:
      description: |-
        Retrieve a paginated list of all fleet tracers.

        This endpoint returns telemetry-derived service names from the SDK telemetry pipeline.
        These names may differ from span-derived names in APM and are useful for querying
        service library configurations.
        Use the `page_number` and `page_size` query parameters to paginate through results.
      operationId: ListFleetTracers
      parameters:
        - description: Page number for pagination (starts at 0).
          in: query
          name: page_number
          required: false
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
        - description: Number of results per page (must be greater than 0 and less than or equal to 100).
          in: query
          name: page_size
          required: false
          schema:
            default: 10
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Attribute to sort by.
          in: query
          name: sort_attribute
          required: false
          schema:
            type: string
        - description: Sort order (true for descending, false for ascending).
          in: query
          name: sort_descending
          required: false
          schema:
            default: true
            type: boolean
        - description: Filter string for narrowing down tracer results.
          example: hostname:my-host OR env:prod
          in: query
          name: filter
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        tracers:
                          - env: production
                            hostname: my-hostname
                            language: java
                            service: test-service
                            tracer_version: 1.32.0
                      id: done
                      type: status
                    meta:
                      total_filtered_count: 1
              schema:
                $ref: '#/components/schemas/FleetTracersResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: List all fleet tracers
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - hosts_read
      x-unstable: |-
        This endpoint is in Preview and may introduce breaking changes.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
  /api/v2/fleet/agent_versions:
    get:
      description: |-
        Retrieve the list of Datadog Agent versions available for deployment.

        Returns `200` with an empty `data` array if the Agent package exists in the catalog
        but has no available versions, and `404` only if the Agent package itself is absent
        from the catalog.
      operationId: ListFleetAgentVersionsV2
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          version: 7.80.4
                        id: 7.80.4
                        type: agent_version
                      - attributes:
                          version: 7.81.1
                        id: 7.81.1
                        type: agent_version
                    meta:
                      page:
                        total_count: 2
              schema:
                $ref: '#/components/schemas/FleetAgentVersionsV2Response'
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: List available Datadog Agent versions
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - hosts_read
  /api/v2/fleet/agents:
    get:
      description: |-
        Retrieve a paginated list of Datadog Agents.

        Returns agents with support for pagination, sorting, and filtering.
        Use `page_number` and `page_size` to navigate pages, `filter` to narrow by field values,
        and `tags` to filter by agent tags.
      operationId: ListFleetAgentsV2
      parameters:
        - description: Page number for pagination, starting at 0.
          in: query
          name: page_number
          required: false
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
        - description: Number of agents to return per page. Maximum value is 100. Defaults to 10.
          in: query
          name: page_size
          required: false
          schema:
            default: 10
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Filter string to narrow down agent results.
          example: hostname:my-hostname OR env:dev
          in: query
          name: filter
          required: false
          schema:
            type: string
        - description: Comma-separated list of tag keys to select which tags are included in each agent's `tags` attribute. Does not filter which agents are returned.
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: Agent attribute to sort results by. Must be a supported attribute name; unsupported values return a 400 error.
          in: query
          name: sort_attribute
          required: false
          schema:
            type: string
        - description: Set to `true` to sort results in descending order. Defaults to ascending.
          in: query
          name: sort_descending
          required: false
          schema:
            type: boolean
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          agent_version: 7.50.0
                          api_key_name: Production API Key
                          api_key_uuid: a1b2c3d4-e5f6-4321-a123-123456789abc
                          cloud_provider: aws
                          datadog_data_center: us1
                          enabled_products:
                            - apm
                            - logs
                          env:
                            - prod
                          first_seen_at: 1699900000
                          fleet_policies: []
                          hostname: my-hostname
                          integrations:
                            - mysql
                          ip_addresses:
                            - 10.0.0.1
                          is_single_step_instrumentation_enabled: false
                          last_restart_at: 1699999999
                          os: linux
                          otel_collector_versions: []
                          remote_agent_management: enabled
                          remote_config_status: connected
                          services:
                            - web
                          tags:
                            - key: team
                              value: platform
                        id: my-agent-hostname
                        type: agent
                    meta:
                      page:
                        total_count: 500
                        total_filtered_count: 1
              schema:
                $ref: '#/components/schemas/FleetAgentsV2Response'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: List all Datadog Agents
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - hosts_read
  /api/v2/fleet/agents/{agent_key}:
    get:
      description: |-
        Retrieve detailed information about a specific Datadog Agent.

        By default, only `agent_infos` is returned. Use the `include` query parameter to
        request additional data: `integrations` and/or `configuration_files`.
      operationId: GetFleetAgentDetailV2
      parameters:
        - description: The unique identifier (Agent key) for the Datadog Agent. Must be a 32-character lowercase hexadecimal string.
          example: a1b2c3d4e5f67890a1b2c3d4e5f67890
          in: path
          name: agent_key
          required: true
          schema:
            pattern: ^[0-9a-f]{32}$
            type: string
        - description: Comma-separated list of additional fields to include in the response. Valid values are `integrations` and `configuration_files`. Omitting this parameter returns only `agent_infos`. Unrecognized values are silently ignored rather than causing an error.
          example: integrations,configuration_files
          in: query
          name: include
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        agent_infos:
                          agent_version: 7.50.0
                          datadog_agent_key: a1b2c3d4e5f67890a1b2c3d4e5f67890
                          hostname: my-hostname
                          os: linux
                      id: a1b2c3d4e5f67890a1b2c3d4e5f67890
                      type: agent
              schema:
                $ref: '#/components/schemas/FleetAgentDetailV2Response'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Get detailed information about an agent
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - hosts_read
  /api/v2/fleet/deployments:
    get:
      description: Retrieve a paginated list of all deployments for fleet automation.
      operationId: ListFleetDeploymentsV2
      parameters:
        - description: Number of deployments to return per page. Maximum value is 100.
          in: query
          name: page_size
          required: false
          schema:
            default: 10
            format: int64
            maximum: 100
            type: integer
        - description: Page number for pagination, starting at 0.
          in: query
          name: page_number
          required: false
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
        - description: |-
            Field to sort results by (for example, `start_date`). Must be a supported field
            name; unsupported values return a 400 error.
          in: query
          name: sort
          required: false
          schema:
            type: string
        - description: |-
            Set to `true` to sort in ascending order. This setting has no effect unless `sort` is also set.
            Defaults to descending order.
          in: query
          name: ascending
          required: false
          schema:
            type: boolean
        - description: |-
            Query used to filter deployments. Uses the Datadog query syntax. Filtering on an
            unsupported field returns a 400 error. For example:
            - `status:failed` or `status:done_with_errors`: deployments that need investigation.
            - `status:running`: deployments currently in flight.
            - `update_type:update_package` or `update_type:update_config_operations`: deployments of a given type.
          example: status:failed
          in: query
          name: filter
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          author: alice@datadoghq.com
                          config_operations:
                            - file_op: merge-patch
                              file_path: /datadog.yaml
                              patch:
                                logs_enabled: true
                          duration_seconds: 0
                          error_summary: ''
                          estimated_finished_at: 1699999999
                          finished_at: 0
                          is_scheduled: true
                          query: env:prod AND service:web
                          schedule_id: sched-123
                          started_at: 1699990000
                          status: running
                          target_versions:
                            - 7.52.0
                          total_hosts: 10
                          update_type: update_config_operations
                        id: k7Q-3mX-p9Z
                        type: deployment
                    meta:
                      page:
                        total_count: 1
                        total_filtered_count: 1
              schema:
                $ref: '#/components/schemas/FleetDeploymentsV2Response'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: List all deployments
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - hosts_read
  /api/v2/fleet/deployments/configure:
    post:
      description: |-
        Create a new deployment to apply configuration changes
        to a fleet of hosts matching the specified filter query.

        This endpoint supports two types of configuration operations:
        - `merge-patch`: Merges the provided patch data with the existing configuration file,
          creating the file if it doesn't exist.
        - `delete`: Removes the specified configuration file from the target hosts.

        You can optionally use `target_packages` to apply the configuration change only to specific package versions.

        The deployment is created and started automatically. You can specify multiple configuration
        operations to execute in order on each target host. Use the filter query to target
        specific hosts using the Datadog query syntax.

        Set `dry_run` to `true` to validate the configuration and resolve target hosts and packages without deploying anything. A dry run returns a 200 with the validation result instead of creating and starting a deployment.

        Returns a 400 if `filter_query` or `config_operations` is missing, a target package is missing a name or version or cannot be resolved, the configuration fails validation, or the filter query does not match any host eligible for the deployment.
      operationId: CreateFleetDeploymentConfigureV2
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      config_operations:
                        - file_op: merge-patch
                          file_path: /datadog.yaml
                          patch:
                            apm_config:
                              enabled: true
                            log_level: info
                            logs_enabled: true
                      filter_query: env:prod AND datacenter:us-east-1
                    type: deployment
              dry_run:
                summary: Dry run
                value:
                  data:
                    attributes:
                      config_operations:
                        - file_op: merge-patch
                          file_path: /datadog.yaml
                          patch:
                            log_level: info
                      dry_run: true
                      filter_query: env:prod AND datacenter:us-east-1
                    type: deployment
            schema:
              $ref: '#/components/schemas/FleetDeploymentConfigureV2CreateRequest'
        description: Request payload containing the deployment details.
        required: true
