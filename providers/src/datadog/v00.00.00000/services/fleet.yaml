          type: integer
        source_index:
          description: Index in the configuration file.
          format: int64
          type: integer
        source_path:
          description: Path to the configuration file.
          type: string
        type:
          description: Integration type.
          example: postgres
          type: string
      type: object
    FleetDetectedIntegration:
