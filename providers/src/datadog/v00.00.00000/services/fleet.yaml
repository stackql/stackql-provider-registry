      x-permission:
        operator: AND
        permissions:
          - agent_upgrade_write
          - fleet_policies_write
  /api/v2/fleet/deployments/upgrade:
    post:
      description: |-
        Create and immediately start a new package upgrade
        on hosts matching the specified filter query.

        This endpoint allows you to upgrade the Datadog Agent to a specific version
        on hosts matching the specified filter query.

        The deployment is created and started automatically. The system:
        1. Identifies all hosts matching the filter query.
        2. Validates that the specified version is available.
        3. Begins rolling out the package upgrade to the target hosts.

        Returns a 400 if `filter_query` or `target_packages` is missing, a target package is missing a name or version, or the filter query does not match any host eligible for the upgrade. Returns a 409 if a conflicting upgrade is already running on one or more target hosts.
      operationId: CreateFleetDeploymentUpgradeV2
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      filter_query: env:prod AND service:web
                      target_packages:
                        - name: datadog-agent
                          version: 7.52.0
                    type: deployment
            schema:
              $ref: '#/components/schemas/FleetDeploymentPackageUpgradeV2CreateRequest'
        description: Request payload containing the package upgrade details.
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        author: alice@datadoghq.com
                        duration_seconds: 0
                        error_summary: ''
                        estimated_finished_at: 0
                        finished_at: 0
                        is_scheduled: false
                        query: env:prod AND service:web
                        started_at: 1699990000
                        status: pending
                        target_versions:
                          - 7.52.0
                        update_type: update_package
                      id: k7Q-3mX-p9Z
                      type: deployment
              schema:
                $ref: '#/components/schemas/FleetDeploymentV2CreateResponse'
          description: CREATED
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
