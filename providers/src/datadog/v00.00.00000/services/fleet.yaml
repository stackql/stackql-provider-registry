      type: object
    FleetDeploymentConfigureV2Package:
      description: A package and its target version to additionally deploy alongside a configuration change.
      properties:
        apm_instrumentation:
          description: APM auto-instrumentation mode to enable for this package, if applicable.
          example: host
          type: string
        name:
          description: The name of the package to deploy.
          example: datadog-agent
          type: string
        version:
          description: The target version of the package to deploy.
          example: 7.52.0
          type: string
      required:
        - name
        - version
      type: object
    FleetDeploymentConfigureV2DryRunResult:
      description: Validation result of a configuration deployment dry run.
      properties:
        config_validated:
          description: Whether the configuration passed schema validation.
          example: true
          type: boolean
        non_upgradable_by_reason:
          additionalProperties:
            format: int64
            type: integer
          description: |-
            Breakdown of ineligible host counts by reason. Only includes reasons with a
            non-zero count. Absent from the response when no targeted host is ineligible.
          example: {}
          type: object
        non_upgradable_hosts:
          description: Number of targeted hosts that are not eligible to receive this configuration.
          example: 0
          format: int64
          type: integer
      type: object
    FleetDeploymentV2DetailAgent:
      description: Per-host status entry for a deployment.
      properties:
        error:
          description: Error message if the deployment failed on this host.
          example: ''
          type: string
        hostname:
          description: Hostname of the agent.
          example: web-01.example.com
          type: string
        running_step:
          description: Name of the step currently executing on this host.
