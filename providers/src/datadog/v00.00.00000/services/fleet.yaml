  /api/v2/fleet/deployments/{deployment_id}/cancel:
    post:
      description: |-
        Cancel an active deployment and stop all pending operations.
        When you cancel a deployment:
        - All pending operations on hosts that haven't started yet are stopped.
        - Operations currently in progress on hosts may complete or be interrupted, depending on their current status.
        - Configuration changes or package upgrades already applied to hosts are not rolled back.

        After cancellation, you can view the final state of the deployment using the GET endpoint to see which hosts
        were successfully updated before the cancellation.

        Only deployments with a `pending` or `running` status can be canceled. Returns a 400 if the deployment is not in a cancelable status. Returns a 404 if no deployment matches the specified ID or if you do not have access to it.
      operationId: CancelFleetDeploymentV2
      parameters:
        - description: The unique identifier of the deployment to cancel.
          example: k7Q-3mX-p9Z
          in: path
          name: deployment_id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        message: Cancellation has been requested; the deployment is stopping.
                        status: stopping
                      id: k7Q-3mX-p9Z
                      type: deployment
              schema:
                $ref: '#/components/schemas/FleetDeploymentV2CancelResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
      summary: Cancel a deployment
      tags:
        - Fleet Automation
      x-permission:
        operator: AND
        permissions:
          - agent_upgrade_write
          - fleet_policies_write
  /api/v2/fleet/schedules:
    get:
      description: |-
        Retrieve all upgrade schedules for the organization.

        Schedules automate package upgrades by defining maintenance windows and recurrence rules.
        Each schedule automatically creates deployments based on its configuration.
      operationId: ListFleetSchedulesV2
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          created_at: '2023-11-14T22:13:19Z'
                          created_by: user@example.com
                          is_default: false
                          name: Weekly Production Agent Updates
                          next_run: '2025-01-06T02:00:00Z'
                          query: env:prod AND service:web
                          rule:
                            days_of_week:
                              - Mon
                              - Wed
                            interval: 1
                            maintenance_window_duration: 120
                            start_maintenance_window: '0200'
                            timezone: America/New_York
                          status: active
                          updated_at: '2023-11-14T22:13:19Z'
                          updated_by: user@example.com
                          version_to_latest: 0
                        id: abc-def-ghi-123
                        type: schedule
                    meta:
                      page:
                        total_count: 1
              schema:
                $ref: '#/components/schemas/FleetSchedulesV2Response'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
