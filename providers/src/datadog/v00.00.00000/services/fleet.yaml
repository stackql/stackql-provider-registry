      description: |-
        Notification configuration attached to a schedule.

        Included when available. If the notification rule cannot be retrieved, this field is
        omitted and the schedule is still returned. If the notification rule is retrieved but its
        handles cannot be resolved, it is still included with an empty `handles` array.
      properties:
        handles:
          description: Notification handles (for example, Slack channels or PagerDuty integrations).
          items:
            description: A notification handle.
            type: string
          type: array
        tags:
          description: Tags associated with the notification rule.
          items:
            description: A tag string.
            type: string
          type: array
      type: object
    FleetScheduleV2RecurrenceRule:
      description: Defines the recurrence pattern for the schedule.
      properties:
        days_of_week:
          description: |-
            Days of the week when the schedule triggers. Valid values are
            "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun".
          example:
            - Mon
            - Wed
            - Fri
          items:
            description: A day of the week (for example, "Mon").
            type: string
          type: array
        interval:
          description: |-
            Interval between schedule runs in weeks. 1 means the schedule runs every week
            on the specified days. Higher values repeat every N weeks.
          example: 1
          format: int64
          type: integer
        maintenance_window_duration:
          description: Duration of the maintenance window in minutes.
          example: 120
          format: int64
          type: integer
        start_maintenance_window:
          description: |-
            Start time of the maintenance window in 24-hour clock format (HHMM).
            Deployments are triggered at this time on the specified days.
          example: '0200'
          type: string
        timezone:
          description: Timezone in IANA Time Zone Database format.
          example: America/New_York
          type: string
      type: object
    FleetDeploymentFileOp:
      description: |-
        Type of file operation to perform on the target configuration file.
        - `merge-patch`: Merges the provided patch data with the existing configuration file.
          Creates the file if it doesn't exist.
        - `delete`: Removes the specified configuration file from the target hosts.
      enum:
        - merge-patch
        - delete
      example: merge-patch
      type: string
      x-enum-varnames:
        - MERGE_PATCH
        - DELETE
    FleetDeploymentHostPackage:
      description: |-
