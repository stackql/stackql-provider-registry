            type: string
        - description: Filter results to a specific provider. Common cloud values are `aws`, `azure`, `gcp`, `Oracle` (OCI), and `custom`. SaaS billing integrations (for example, `Snowflake`, `MongoDB`, `Databricks`) are also accepted using their display-name string. Values are case-sensitive.
          in: query
          name: filter[provider]
          schema:
            type: string
        - description: Filter results to a specific Cloud Cost Management metric (for example, `aws.cost.net.amortized`). When omitted, every available metric for the requested period is returned.
          in: query
          name: filter[metric]
          schema:
            type: string
        - description: Restrict results to a single tag key.
          in: query
          name: filter[tag_key]
          schema:
            type: string
        - description: When `true`, return one row per day with the day in the `date` attribute. Defaults to the monthly roll-up when omitted.
          in: query
