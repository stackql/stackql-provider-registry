          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        costs_to_allocate:
                          - condition: is
                            tag: account_id
                            value: '123456789'
                        created: '2024-01-01T00:00:00+00:00'
                        enabled: true
