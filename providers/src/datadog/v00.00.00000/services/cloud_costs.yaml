      operationId: GetBudget
      parameters:
        - $ref: '#/components/parameters/BudgetID'
        - description: When `true`, includes actual cost data in the response.
          in: query
          name: actual
          required: false
          schema:
            type: boolean
        - description: When `true`, includes forecast cost data in the response, including `ootb_forecast` and `custom_forecast` per entry.
          in: query
          name: forecast
          required: false
          schema:
            type: boolean
        - description: Start of the cost window in milliseconds since epoch. Must be used together with `end`.
          in: query
          name: start
          required: false
          schema:
            format: int64
            type: integer
        - description: End of the cost window in milliseconds since epoch. Must be used together with `start`.
          in: query
          name: end
          required: false
          schema:
            format: int64
            type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        costs:
                          actual: 850.25
                          amount: 1000
                          forecast: 1100.5
                          ootb_forecast: 1100.5
                        costs_period_end: 1740873600000
                        costs_period_start: 1738281600000
                        costs_unit:
                          family: currency
                          id: '1'
                          name: dollar
                          plural: dollars
                          scale_factor: 1
                          short_name: $
                        created_at: 1738258683590
                        created_by: 00000000-0a0a-0a0a-aaa0-00000000000a
                        end_month: 202502
                        entries:
                          - amount: 500
                            costs:
                              actual: 425.5
                              amount: 500
                              custom_forecast: null
                              forecast: 550.25
                              ootb_forecast: 550.25
                            month: 202501
                            tag_filters:
                              - tag_key: service
                                tag_value: ec2
                        metrics_query: aws.cost.amortized{service:ec2} by {service}
                        name: my budget
                        org_id: 123
                        start_month: 202501
                        total_amount: 1000
