  /api/v2/cost/arbitrary_rule:
    get:
      description: List all custom allocation rules - Retrieve a list of all custom allocation rules for the organization
      operationId: ListCustomAllocationRules
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          costs_to_allocate:
                            - condition: is
                              tag: account_id
                              value: '123456789'
                              values: null
                          created: '2024-01-01T00:00:00+00:00'
                          enabled: true
                          last_modified_user_uuid: user-example-uuid
                          order_id: 1
                          processing_status: done
                          provider:
                            - aws
                          rule_name: example-custom-allocation-rule
                          strategy:
                            allocated_by_tag_keys:
                              - team
                            granularity: daily
                            method: proportional
                          type: shared
                          updated: '2024-01-01T00:00:00+00:00'
                          version: 1
                        id: '123'
                        type: arbitrary_rule
              schema:
                $ref: '#/components/schemas/ArbitraryRuleResponseArray'
          description: OK
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - cloud_cost_management_read
      summary: List custom allocation rules
      tags:
        - Cloud Cost Management
    post:
      description: |-
        Create a new custom allocation rule with the specified filters and allocation strategy.

        **Strategy Methods:**
        - **PROPORTIONAL/EVEN**: Allocates costs proportionally/evenly based on existing costs. Requires: granularity, allocated_by_tag_keys. Optional: based_on_costs, allocated_by_filters, evaluate_grouped_by_tag_keys, evaluate_grouped_by_filters.
        - **PROPORTIONAL_TIMESERIES/EVEN_TIMESERIES**: Allocates based on timeseries data. Requires: granularity, based_on_timeseries. Optional: evaluate_grouped_by_tag_keys.
        - **PERCENT**: Allocates fixed percentages to specific tags. Requires: allocated_by (array of percentage allocations).

        **Filter Conditions:**
        - Use **value** for single-value conditions: "is", "is not", "contains", "=", "!=", "like", "not like"
        - Use **values** for multi-value conditions: "in", "not in"
        - Cannot use both value and values simultaneously.

        **Supported operators**: is, is not, contains, in, not in, =, !=, like, not like
      operationId: CreateCustomAllocationRule
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      costs_to_allocate:
                        - condition: is
                          tag: account_id
                          value: '123456789'
                        - condition: in
                          tag: environment
                          value: ''
                          values:
                            - production
                            - staging
                      enabled: true
                      order_id: 1
                      provider:
                        - aws
                        - gcp
                      rule_name: example-arbitrary-cost-rule
                      strategy:
                        allocated_by_tag_keys:
                          - team
                          - environment
                        based_on_costs:
                          - condition: is
                            tag: service
                            value: web-api
                          - condition: not in
                            tag: team
                            value: ''
                            values:
                              - legacy
                              - deprecated
                        granularity: daily
                        method: proportional
                      type: shared
                    type: upsert_arbitrary_rule
            schema:
              $ref: '#/components/schemas/ArbitraryCostUpsertRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        costs_to_allocate:
                          - condition: is
                            tag: account_id
                            value: '123456789'
                        created: '2024-01-01T00:00:00+00:00'
                        enabled: true
                        order_id: 1
                        provider:
                          - aws
                        rule_name: example-arbitrary-cost-rule
                        strategy:
                          allocated_by_tag_keys:
                            - team
                          granularity: daily
                          method: proportional
                        type: shared
                        updated: '2024-01-01T00:00:00+00:00'
                        version: 1
                      id: '123'
                      type: arbitrary_rule
              schema:
                $ref: '#/components/schemas/ArbitraryRuleResponse'
          description: OK
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - cloud_cost_management_write
      summary: Create custom allocation rule
      tags:
        - Cloud Cost Management
  /api/v2/cost/arbitrary_rule/reorder:
    post:
      description: |-
        Reorder custom allocation rules - Change the execution order of custom allocation rules.

        **Important**: You must provide the **complete list** of all rule IDs in the desired execution order. The API will reorder ALL rules according to the provided sequence.

        Rules are executed in the order specified, with lower indices (earlier in the array) having higher priority.

        **Example**: If you have rules with IDs [123, 456, 789] and want to change order from 123→456→789 to 456→123→789, send: [{"id": "456"}, {"id": "123"}, {"id": "789"}]
      operationId: ReorderCustomAllocationRules
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    - id: '456'
                      type: arbitrary_rule
                    - id: '123'
                      type: arbitrary_rule
                    - id: '789'
                      type: arbitrary_rule
            schema:
              $ref: '#/components/schemas/ReorderRuleResourceArray'
        required: true
      responses:
        '204':
          description: Successfully reordered rules
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - cloud_cost_management_write
      summary: Reorder custom allocation rules
      tags:
        - Cloud Cost Management
