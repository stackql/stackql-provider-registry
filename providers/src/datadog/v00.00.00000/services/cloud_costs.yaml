                        type: shared
                        updated: '2024-01-01T00:00:00+00:00'
                        version: 1
                      id: '123'
                      type: arbitrary_rule
              schema:
                $ref: '#/components/schemas/ArbitraryRuleResponse'
          description: OK
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - cloud_cost_management_read
      summary: Get custom allocation rule
      tags:
        - Cloud Cost Management
    patch:
      description: |-
        Update an existing custom allocation rule with new filters and allocation strategy.

        **Strategy Methods:**
