openapi: 3.0.0
info:
  title: cloud_costs API
  description: datadog cloud_costs API
  version: '1.0'
paths:
  /api/v2/cost/account_filters/{cloud_account_id}:
    get:
      description: Get the account filters for a cloud account (AWS CUR 1.0/2.0, OCI, and other clouds).
      operationId: GetCostAccountFilters
      parameters:
        - $ref: '#/components/parameters/CloudAccountID'
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  summary: Include new accounts and exclude specific accounts
                  value:
                    data:
                      attributes:
                        account_filters:
                          excluded_accounts:
                            - '123456789123'
                            - '123456789143'
                          include_new_accounts: true
                        account_id: '123456789123'
                        cloud: aws_cur2
                      id: '123'
                      type: account_filters
                include_accounts:
                  summary: Exclude new accounts and include specific accounts
                  value:
                    data:
                      attributes:
                        account_filters:
                          include_new_accounts: false
                          included_accounts:
                            - '123456789123'
                            - '123456789143'
                        account_id: '123456789123'
                        cloud: aws_cur2
                      id: '123'
                      type: account_filters
              schema:
                $ref: '#/components/schemas/AccountFiltersResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - cloud_cost_management_read
      summary: Get account filters
      tags:
        - Cloud Cost Management
      x-permission:
        operator: OR
        permissions:
          - cloud_cost_management_read
    patch:
      description: Update the account filters for a cloud account (AWS CUR 1.0/2.0, OCI, and other clouds).
      operationId: UpdateCostAccountFilters
      parameters:
        - $ref: '#/components/parameters/CloudAccountID'
      requestBody:
        content:
          application/json:
            examples:
              default:
                summary: Exclude new accounts and include specific accounts
                value:
                  data:
                    attributes:
                      account_filters:
                        include_new_accounts: false
                        included_accounts:
                          - '123456789123'
                          - '123456789143'
                    type: account_filters_patch_request
              exclude_accounts:
                summary: Include new accounts and exclude specific accounts
                value:
                  data:
                    attributes:
                      account_filters:
                        excluded_accounts:
                          - '123456789123'
                          - '123456789143'
                        include_new_accounts: true
                    type: account_filters_patch_request
            schema:
              $ref: '#/components/schemas/AccountFiltersPatchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  summary: Exclude new accounts and include specific accounts
                  value:
                    data:
                      attributes:
                        account_filters:
                          include_new_accounts: false
                          included_accounts:
                            - '123456789123'
                            - '123456789143'
                        account_id: '123456789123'
                        cloud: aws_cur2
                      id: '123'
                      type: account_filters
                exclude_accounts:
                  summary: Include new accounts and exclude specific accounts
                  value:
                    data:
                      attributes:
                        account_filters:
                          excluded_accounts:
                            - '123456789123'
                            - '123456789143'
                          include_new_accounts: true
                        account_id: '123456789123'
                        cloud: aws_cur2
                      id: '123'
                      type: account_filters
              schema:
                $ref: '#/components/schemas/AccountFiltersResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - cloud_cost_management_write
      summary: Update account filters
      tags:
        - Cloud Cost Management
      x-permission:
        operator: OR
        permissions:
          - cloud_cost_management_write
  /api/v2/cost/anomalies:
    get:
      description: List detected Cloud Cost Management anomalies for the organization.
      operationId: ListCostAnomalies
      parameters:
        - description: Start time as Unix milliseconds. Defaults to the start of the latest stable seven-day window.
          in: query
          name: start
          required: false
          schema:
            example: 1730259950000
            format: int64
            type: integer
        - description: End time as Unix milliseconds. Defaults to the end of the latest stable seven-day window.
          in: query
          name: end
          required: false
          schema:
            example: 1730429150000
            format: int64
            type: integer
        - description: Optional JSON object mapping cost tag keys to allowed values, for example `{"team":["payments"],"env":["prod"]}`. Filters match anomaly dimensions or correlated tags.
          in: query
          name: filter
          required: false
          schema:
            example: '{"team":["payments"]}'
            type: string
        - description: Minimum absolute anomalous cost change to include. Numeric value; defaults to `1`.
          in: query
          name: min_anomalous_threshold
          required: false
          schema:
            example: '1.0'
            type: string
        - description: Minimum absolute actual cost to include. Numeric value; defaults to `0`.
          in: query
          name: min_cost_threshold
          required: false
          schema:
            example: '0.0'
            type: string
        - description: Filter by resolution state. Use `none` for unresolved anomalies, `all` or `*` for resolved anomalies, or a comma-separated list of causes.
          in: query
          name: dismissal_cause
          required: false
          schema:
            example: none
            type: string
        - description: Sort field. One of `start_date`, `end_date`, `duration`, `max_cost`, `anomalous_cost`, or `dismissal_date`. Defaults to `anomalous_cost`.
          in: query
          name: order_by
          required: false
          schema:
            example: anomalous_cost
            type: string
        - description: Sort direction. One of `asc` or `desc`. Defaults to `desc`.
          in: query
          name: order
          required: false
          schema:
            example: desc
            type: string
        - description: Maximum number of anomalies to return. Defaults to `200`.
          in: query
          name: limit
          required: false
          schema:
            example: 200
            format: int64
            type: integer
        - description: Pagination offset. Defaults to `0`.
          in: query
          name: offset
          required: false
          schema:
            example: 0
            format: int64
            type: integer
        - description: Optional repeated cloud or SaaS provider filters, such as `aws`, `gcp`, `azure`, `Oracle`, `datadog`, `OpenAI`, or `Anthropic`.
          explode: true
          in: query
          name: provider_ids
          required: false
          schema:
            items:
              example: aws
              type: string
            type: array
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        anomalies:
                          - actual_cost: 3001.24
                            anomalous_cost_change: 1250.75
                            anomaly_end: 1730429150000
                            anomaly_start: 1730259950000
                            correlated_tags:
                              region:
                                - us-east-1
                                - us-west-2
                            dimensions:
                              service: ec2
                            max_cost: 5000.5
                            provider: aws
                            query: sum:aws.cost.net.amortized{aws_cost_type IN (Usage,DiscountedUsage,SavingsPlanCoveredUsage) AND aws_product NOT IN (supportenterprise) AND service:"ec2"}.rollup(sum, daily)
                            uuid: b0a6aaa9-3c4c-48cb-9447-a0d1338b3e09
                        avg_daily_anomalous_cost: 625.375
                        total_actual_cost: 3001.24
                        total_anomalous_cost: 1250.75
                        total_count: 1
                      id: anomalies
                      type: anomalies
              schema:
                $ref: '#/components/schemas/CostAnomaliesResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
        - apiKeyAuth: []
          appKeyAuth: []
        - AuthZ:
            - cloud_cost_management_read
      summary: List cost anomalies
      tags:
        - Cloud Cost Management
      x-unstable: |-
        **Note**: This endpoint is in Preview and is subject to change.
        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).
