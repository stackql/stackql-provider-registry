openapi: 3.0.0
info:
  title: infrastructure API
  description: datadog infrastructure API
  version: '1.0'
paths:
  /api/v2/app-builder/apps:
    delete:
      description: Delete multiple apps in a single request from a list of app IDs. This API requires a [registered application key](https://docs.datadoghq.com/api/latest/action-connection/#register-a-new-app-key). Alternatively, you can configure these permissions [in the UI](https://docs.datadoghq.com/account_management/api-app-keys/#actions-api-access).
      operationId: DeleteApps
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    - id: aea2ed17-b45f-40d0-ba59-c86b7972c901
                      type: appDefinitions
                    - id: f69bb8be-6168-4fe7-a30d-370256b6504a
                      type: appDefinitions
                    - id: ab1ed73e-13ad-4426-b0df-a0ff8876a088
                      type: appDefinitions
            schema:
              $ref: '#/components/schemas/DeleteAppsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - id: 00000000-0000-0000-0000-000000000001
                        type: appDefinitions
              schema:
                $ref: '#/components/schemas/DeleteAppsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Delete Multiple Apps
      tags:
        - App Builder
      x-permission:
        operator: OR
        permissions:
          - apps_write
    get:
      description: List all apps, with optional filters and sorting. This endpoint is paginated. Only basic app information such as the app ID, name, and description is returned by this endpoint. This API requires a [registered application key](https://docs.datadoghq.com/api/latest/action-connection/#register-a-new-app-key). Alternatively, you can configure these permissions [in the UI](https://docs.datadoghq.com/account_management/api-app-keys/#actions-api-access).
      operationId: ListApps
      parameters:
        - description: The number of apps to return per page.
          in: query
          name: limit
          required: false
          schema:
            format: int64
            type: integer
        - description: The page number to return.
          in: query
          name: page
          required: false
          schema:
            format: int64
            type: integer
        - description: Filter apps by the app creator. Usually the user's email.
          in: query
          name: filter[user_name]
          required: false
          schema:
            type: string
        - description: Filter apps by the app creator's UUID.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: query
          name: filter[user_uuid]
          required: false
          schema:
            format: uuid
            type: string
        - description: Filter by app name.
          in: query
          name: filter[name]
          required: false
          schema:
            type: string
        - description: Filter apps by the app name or the app creator.
          in: query
          name: filter[query]
          required: false
          schema:
            type: string
        - description: Filter apps by whether they are published.
          in: query
          name: filter[deployed]
          required: false
          schema:
            type: boolean
        - description: Filter apps by tags.
          in: query
          name: filter[tags]
          required: false
          schema:
            type: string
        - description: Filter apps by whether you have added them to your favorites.
          in: query
          name: filter[favorite]
          required: false
          schema:
            type: boolean
        - description: Filter apps by whether they are enabled for self-service.
          in: query
          name: filter[self_service]
          required: false
          schema:
            type: boolean
        - description: The fields and direction to sort apps by.
          explode: false
          in: query
          name: sort
          required: false
          schema:
            items:
              $ref: '#/components/schemas/AppsSortField'
            type: array
          style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - attributes:
                          description: A sample app
                          favorite: false
                          name: My App
                          selfService: false
                          tags:
                            - team:webshop
                        id: 00000000-0000-0000-0000-000000000001
                        type: appDefinitions
                    meta:
                      page:
                        totalCount: 1
                        totalFilteredCount: 1
              schema:
                $ref: '#/components/schemas/ListAppsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: List Apps
      tags:
        - App Builder
      x-permission:
        operator: OR
        permissions:
          - apps_run
    post:
      description: Create a new app, returning the app ID. This API requires a [registered application key](https://docs.datadoghq.com/api/latest/action-connection/#register-a-new-app-key). Alternatively, you can configure these permissions [in the UI](https://docs.datadoghq.com/account_management/api-app-keys/#actions-api-access).
      operationId: CreateApp
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      components: []
                      description: This is a simple example app
                      name: Example App
                      queries: []
                      rootInstanceName: grid0
                    type: appDefinitions
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      id: 00000000-0000-0000-0000-000000000001
                      type: appDefinitions
              schema:
                $ref: '#/components/schemas/CreateAppResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Create App
      tags:
        - App Builder
      x-permission:
        operator: AND
        permissions:
          - apps_write
          - connections_resolve
          - workflows_run
  /api/v2/app-builder/apps/{app_id}:
    delete:
      description: Delete a single app. This API requires a [registered application key](https://docs.datadoghq.com/api/latest/action-connection/#register-a-new-app-key). Alternatively, you can configure these permissions [in the UI](https://docs.datadoghq.com/account_management/api-app-keys/#actions-api-access).
      operationId: DeleteApp
      parameters:
        - description: The ID of the app to delete.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: path
          name: app_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      id: 00000000-0000-0000-0000-000000000002
                      type: appDefinitions
              schema:
                $ref: '#/components/schemas/DeleteAppResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Gone
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Delete App
      tags:
        - App Builder
      x-permission:
        operator: OR
        permissions:
          - apps_write
    get:
      description: Get the full definition of an app. This API requires a [registered application key](https://docs.datadoghq.com/api/latest/action-connection/#register-a-new-app-key). Alternatively, you can configure these permissions [in the UI](https://docs.datadoghq.com/account_management/api-app-keys/#actions-api-access).
      operationId: GetApp
      parameters:
        - description: The ID of the app to retrieve.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: path
          name: app_id
          required: true
          schema:
            format: uuid
            type: string
        - description: The version number of the app to retrieve. If not specified, the latest version is returned. Version numbers start at 1 and increment with each update. The special values `latest` and `deployed` can be used to retrieve the latest version or the published version, respectively.
          in: query
          name: version
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        components: []
                        description: A sample app
                        name: Example App
                        queries: []
                        rootInstanceName: grid0
                      id: 00000000-0000-0000-0000-000000000001
                      type: appDefinitions
              schema:
                $ref: '#/components/schemas/GetAppResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Gone
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Get App
      tags:
        - App Builder
      x-permission:
        operator: AND
        permissions:
          - apps_run
          - connections_read
    patch:
      description: Update an existing app. This creates a new version of the app. This API requires a [registered application key](https://docs.datadoghq.com/api/latest/action-connection/#register-a-new-app-key). Alternatively, you can configure these permissions [in the UI](https://docs.datadoghq.com/account_management/api-app-keys/#actions-api-access).
      operationId: UpdateApp
      parameters:
        - description: The ID of the app to update.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: path
          name: app_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      components: []
                      description: This is a simple example app
                      name: Example App
                      queries: []
                      rootInstanceName: grid0
                    id: 9e20cbaf-68da-45a6-9ccf-54193ac29fa5
                    type: appDefinitions
            schema:
              $ref: '#/components/schemas/UpdateAppRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        components: []
                        description: This is a simple example app
                        name: Example App
                        queries: []
                        rootInstanceName: grid0
                      id: 00000000-0000-0000-0000-000000000001
                      type: appDefinitions
              schema:
                $ref: '#/components/schemas/UpdateAppResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Update App
      tags:
        - App Builder
      x-permission:
        operator: AND
        permissions:
          - apps_write
          - connections_resolve
          - workflows_run
  /api/v2/app-builder/apps/{app_id}/deployment:
    delete:
      description: Unpublish an app, removing the live version of the app. Unpublishing creates a new instance of a `deployment` object on the app, with a nil `app_version_id` (`00000000-0000-0000-0000-000000000000`). The app can still be updated and published again in the future. This API requires a [registered application key](https://docs.datadoghq.com/api/latest/action-connection/#register-a-new-app-key). Alternatively, you can configure these permissions [in the UI](https://docs.datadoghq.com/account_management/api-app-keys/#actions-api-access).
      operationId: UnpublishApp
      parameters:
        - description: The ID of the app to unpublish.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: path
          name: app_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        app_version_id: 00000000-0000-0000-0000-000000000000
                      id: 00000000-0000-0000-0000-000000000001
                      type: deployment
              schema:
                $ref: '#/components/schemas/UnpublishAppResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Unpublish App
      tags:
        - App Builder
      x-permission:
        operator: OR
        permissions:
          - apps_write
    post:
      description: Publish an app for use by other users. To ensure the app is accessible to the correct users, you also need to set a [Restriction Policy](https://docs.datadoghq.com/api/latest/restriction-policies/) on the app if a policy does not yet exist. This API requires a [registered application key](https://docs.datadoghq.com/api/latest/action-connection/#register-a-new-app-key). Alternatively, you can configure these permissions [in the UI](https://docs.datadoghq.com/account_management/api-app-keys/#actions-api-access).
      operationId: PublishApp
      parameters:
        - description: The ID of the app to publish.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: path
          name: app_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        app_version_id: 00000000-0000-0000-0000-000000000001
                      id: 00000000-0000-0000-0000-000000000001
                      type: deployment
              schema:
                $ref: '#/components/schemas/PublishAppResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Publish App
      tags:
        - App Builder
      x-permission:
        operator: OR
        permissions:
          - apps_write
  /api/v2/app-builder/apps/{app_id}/favorite:
    patch:
      description: Add or remove an app from the current user's favorites. Favorited apps can be filtered for using the `filter[favorite]` query parameter on the [List Apps](https://docs.datadoghq.com/api/latest/app-builder/#list-apps) endpoint.
      operationId: UpdateAppFavorite
      parameters:
        - description: The ID of the app.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: path
          name: app_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      favorite: true
                    type: favorites
            schema:
              $ref: '#/components/schemas/UpdateAppFavoriteRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Update App Favorite Status
      tags:
        - App Builder
      x-permission:
        operator: OR
        permissions:
          - apps_run
  /api/v2/app-builder/apps/{app_id}/protection-level:
    patch:
      description: Update the publication protection level of an app. When set to `approval_required`, future publishes must go through an approval workflow before going live.
      operationId: UpdateProtectionLevel
      parameters:
        - description: The ID of the app.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: path
          name: app_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      protectionLevel: approval_required
                    type: protectionLevel
            schema:
              $ref: '#/components/schemas/UpdateAppProtectionLevelRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        components: []
                        description: This is a simple example app
                        favorite: false
                        name: Example App
                        queries: []
                        rootInstanceName: grid0
                        tags: []
                      id: 65bb1f25-52e1-4510-9f8d-22d1516ed693
                      type: appDefinitions
              schema:
                $ref: '#/components/schemas/UpdateAppResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Update App Protection Level
      tags:
        - App Builder
      x-permission:
        operator: OR
        permissions:
          - apps_write
  /api/v2/app-builder/apps/{app_id}/publish-request:
    post:
      description: Create a publish request to ask for approval to publish an app whose protection level is `approval_required`. Publishing happens automatically once the request is approved by a user with the appropriate permissions.
      operationId: CreatePublishRequest
      parameters:
        - description: The ID of the app.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: path
          name: app_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      description: Adds new dashboard widgets and a few bug fixes.
                      title: Release v1.2 to production
                    type: publishRequest
            schema:
              $ref: '#/components/schemas/CreatePublishRequestRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        app_version_id: 9e20cbaf-68da-45a6-9ccf-54193ac29fa5
                      id: 65bb1f25-52e1-4510-9f8d-22d1516ed693
                      meta:
                        created_at: '2026-04-01T12:00:00Z'
                        user_name: jane.doe@example.com
                        user_uuid: 65bb1f25-52e1-4510-9f8d-22d1516ed693
                      type: deployment
              schema:
                $ref: '#/components/schemas/PublishAppResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Create Publish Request
      tags:
        - App Builder
      x-permission:
        operator: OR
        permissions:
          - apps_write
  /api/v2/app-builder/apps/{app_id}/revert:
    post:
      description: Revert an app to a previous version. The version to revert to is selected through the `version` query parameter. The reverted version becomes the new latest version of the app.
      operationId: RevertApp
      parameters:
        - description: The ID of the app.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: path
          name: app_id
          required: true
          schema:
            format: uuid
            type: string
        - description: The version number of the app to revert to. Cannot be `latest`. The special value `deployed` can be used to revert to the currently published version.
          example: '2'
          in: query
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        components: []
                        description: This is a simple example app
                        favorite: false
                        name: Example App
                        queries: []
                        rootInstanceName: grid0
                        tags: []
                      id: 65bb1f25-52e1-4510-9f8d-22d1516ed693
                      type: appDefinitions
              schema:
                $ref: '#/components/schemas/UpdateAppResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Revert App
      tags:
        - App Builder
      x-permission:
        operator: OR
        permissions:
          - apps_write
  /api/v2/app-builder/apps/{app_id}/self-service:
    patch:
      description: Enable or disable self-service for an app. Self-service apps can be discovered and run by users in your organization without explicit access being granted.
      operationId: UpdateAppSelfService
      parameters:
        - description: The ID of the app.
          example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
          in: path
          name: app_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      selfService: true
                    type: selfService
            schema:
              $ref: '#/components/schemas/UpdateAppSelfServiceRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Update App Self-Service Status
