  /dedicated/nasha/{serviceName}/changeContact:
    post:
      summary: Change service contacts
      description: Change service contacts. Starts a procedure to change the admin, tech or billing contact of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your storage
