      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_nashaResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - NAS-HA@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nasHA:apiovh:get
          required: true
      x-expanded-response: DedicatedNashaStorageWithIAM
      operationId: get_v1_dedicated_nasha
      description: List available services
