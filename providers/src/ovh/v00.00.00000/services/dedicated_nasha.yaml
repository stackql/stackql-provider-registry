            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactAdmin:
                  type: string
                  description: The contact to set as admin contact
                contactBilling:
                  type: string
                  description: The contact to set as billing contact
                contactTech:
                  type: string
                  description: The contact to set as tech contact
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_dedicated_nasha_service_name_change_contactResponse'
