components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    dedicated.nasha.StorageWithIAM:
      type: object
      description: Storage nas HA
      properties:
        canCreatePartition:
          type: boolean
          description: True, if partition creation is allowed on this nas HA
          readOnly: true
        customName:
          type: string
          description: The name you give to the nas
          nullable: true
        datacenter:
          type: string
          description: area of nas
          nullable: true
          readOnly: true
        diskType:
          description: the disk type of the nasHa
          readOnly: true
          type: string
          enum:
            - hdd
            - nvme
            - ssd
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        ip:
          description: Access ip of nas
          nullable: true
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        monitored:
          type: boolean
          description: Send an email to customer if any issue is detected
        serviceName:
          type: string
          description: The storage service name
          readOnly: true
        zpoolCapacity:
          type: integer
          description: percentage of nas space used in %
          readOnly: true
        zpoolSize:
          type: integer
          description: the size of the nas
          readOnly: true
    dedicated.nasha.Storage:
      type: object
      description: Storage nas HA
      properties:
        canCreatePartition:
          type: boolean
          description: True, if partition creation is allowed on this nas HA
          readOnly: true
        customName:
          type: string
          description: The name you give to the nas
          nullable: true
        datacenter:
          type: string
          description: area of nas
          nullable: true
          readOnly: true
        diskType:
          description: the disk type of the nasHa
          readOnly: true
          type: string
          enum:
            - hdd
            - nvme
            - ssd
        ip:
          description: Access ip of nas
          nullable: true
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        monitored:
          type: boolean
          description: Send an email to customer if any issue is detected
        serviceName:
          type: string
          description: The storage service name
          readOnly: true
        zpoolCapacity:
          type: integer
          description: percentage of nas space used in %
          readOnly: true
        zpoolSize:
          type: integer
          description: the size of the nas
          readOnly: true
    service.TerminationFutureUseEnum:
      type: string
      description: All future uses you can provide for a service termination
      enum:
        - NOT_REPLACING_SERVICE
        - OTHER
        - SUBSCRIBE_AN_OTHER_SERVICE
        - SUBSCRIBE_OTHER_KIND_OF_SERVICE_WITH_COMPETITOR
        - SUBSCRIBE_SIMILAR_SERVICE_WITH_COMPETITOR
    service.TerminationReasonEnum:
      type: string
      description: All reasons you can provide for a service termination
      enum:
        - FEATURES_DONT_SUIT_ME
        - LACK_OF_PERFORMANCES
        - MIGRATED_TO_ANOTHER_OVH_PRODUCT
        - MIGRATED_TO_COMPETITOR
        - NOT_ENOUGH_RECOGNITION
        - NOT_NEEDED_ANYMORE
        - NOT_RELIABLE
        - NO_ANSWER
        - OTHER
        - PRODUCT_DIMENSION_DONT_SUIT_ME
        - PRODUCT_TOOLS_DONT_SUIT_ME
        - TOO_EXPENSIVE
        - TOO_HARD_TO_USE
        - UNSATIFIED_BY_CUSTOMER_SUPPORT
    dedicated.storage.MetricsTokenResult:
      type: object
      description: A structure describing the metrics token result
      properties:
        endpoint:
          type: string
          description: The url of the endpoint
        token:
          type: string
          description: The token value
          format: password
    dedicated.storage.ProtocolEnum:
      type: string
      description: Partition Protocol
      enum:
        - CIFS
        - NFS
        - NFS_CIFS
    dedicated.nasTask.Task:
      type: object
      description: Storage task
      properties:
        details:
          type: string
          description: information about operation
          nullable: true
          readOnly: true
        doneDate:
          type: string
          description: the date when the task finished
          nullable: true
          format: date-time
          readOnly: true
        lastUpdate:
          type: string
          description: last modification of task
          nullable: true
