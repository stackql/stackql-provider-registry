  /vrack/{serviceName}/eligibleServices:
    get:
      summary: List eligible services
      description: |-
        Returns, by service family, the services that can be attached to the vRack. The eligibility check runs asynchronously: the route can be called several times until all the eligible services are returned.

        While the `status` is set to `pending` the results are partial.

        Once the `status` is set to `done`, all the eligible services have been found.

        In the eventuality of errors getting specific service types, the errors will be listed in the `errors` field.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: serviceFamily
          description: serviceFamily allows to filter on a specific service family
          schema:
            $ref: '#/components/schemas/vrack.EligibleServicesEnum'
        - in: path
          name: serviceName
          description: The internal name of your vrack
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vrack.EligibleServicesResponse'
              examples:
                1. Partial result:
                  value:
                    createdAt: '2024-06-21 08:38:09'
                    errors: []
                    result:
                      ip:
                        - 123.123.123.123/24
                        - 234.234.234.234/28
                        - 34.34.34.34/30
                      ipv6:
                        - 2001:3000:b00::/56
                      legacyVrack: []
                    status: pending
                  summary: 1. Partial result
                2. Complete result:
                  value:
                    createdAt: '2024-06-21 08:38:09'
                    errors: []
                    result:
                      cloudProject: []
                      dedicatedCloud: []
                      dedicatedServer:
                        - nsxxxxxxx.ip-xxx-xxx-xxx.eu
                        - nsyyyyyy.ip-yyy-yy-yyy.eu
                      dedicatedServerInterface: []
                      ip:
                        - 123.123.123.123/24
                        - 234.234.234.234/28
                        - 34.34.34.34/30
                      ipLoadbalancing:
                        - loadbalancer-abcdef1234567890abcdef1234567890
                      ipv6:
                        - 2001:3000:b00::/56
                      legacyVrack: []
                      ovhCloudConnect: []
                      vmwareCloudDirectorVirtualDataCenter: []
                      vrackServices:
                        - vrs-xxx-xxx-xxx-xxx
                    status: done
                  summary: 2. Complete result
                3. Error in result:
                  value:
                    createdAt: '2024-06-21 08:38:09'
                    errors:
                      - cloudProject
                    result:
                      cloudProject: []
                      dedicatedCloud: []
                      dedicatedServer:
                        - nsxxxxxxx.ip-xxx-xxx-xxx.eu
                        - nsyyyyyy.ip-yyy-yy-yyy.eu
                      dedicatedServerInterface: []
                      ip:
                        - 123.123.123.123/24
                        - 234.234.234.234/28
                        - 34.34.34.34/30
                      ipLoadbalancing:
                        - loadbalancer-abcdef1234567890abcdef1234567890
                      ipv6:
                        - 2001:3000:b00::/56
                      legacyVrack: []
                      ovhCloudConnect: []
                      vmwareCloudDirectorVirtualDataCenter: []
                      vrackServices:
                        - vrs-xxx-xxx-xxx-xxx
                    status: done
                  summary: 3. Error in result
                4. Complete result with filter on ip serviceFamily:
                  value:
                    createdAt: '2024-06-21 08:38:09'
                    errors: []
                    result:
                      ip:
                        - 123.123.123.123/24
                        - 234.234.234.234/28
                        - 34.34.34.34/30
                    status: done
                  summary: 4. Complete result with filter on ip serviceFamily
