openapi: 3.0.0
info:
  title: OVHcloud vRack API
  description: vRack private networks and the services attached to them (dedicated servers, cloud projects, IP blocks, load balancers, ...).
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/vrack
paths:
  /vrack:
    get:
      summary: List vRacks. Returns the service names of the vRacks of the account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_vrackResponse'
      x-developer-hub-navigation:
        - - Network
          - vRack
          - Services@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vrack:apiovh:get
          required: true
      x-expanded-response: VrackVrackWithIAM
      operationId: get_v1_vrack
      description: List vRacks. Returns the service names of the vRacks of the account.
  /vrack/publicRoutingRegion:
    get:
      summary: List regions
      description: List regions. Returns the regions where an Additional IP block can be announced from a vRack, with the number of availability zones and the default public bandwidth of each.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: region
          description: Filter by region name
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_vrack_public_routing_regionResponse'
      x-developer-hub-navigation:
        - - Network
          - vRack
          - Public IP connectivity
          - Public bandwidth@@@10
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_vrack_public_routing_region
  /vrack/{serviceName}:
    get:
      summary: Get a vRack. Returns the name and description of the vRack.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your vrack
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vrack.vrackWithIAM'
      x-developer-hub-navigation:
        - - Network
          - vRack
          - Services@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vrack:apiovh:get
          required: true
      operationId: get_v1_vrack_service_name
      description: Get a vRack. Returns the name and description of the vRack.
    put:
      summary: Update a vRack. Updates the name or description of the vRack.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your vrack
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vrack.vrack'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Network
          - vRack
          - Services@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vrack:apiovh:put
          required: true
      operationId: put_v1_vrack_service_name
      description: Update a vRack. Updates the name or description of the vRack.
  /vrack/{serviceName}/allowedServices:
    get:
      summary: List allowed services (deprecated)
      description: 'List allowed services (deprecated). Returns, by service family, the services that can be attached to the vRack. Deprecated: use eligibleServices instead. (Deprecated, will be removed)'
      deprecated: true
      x-deprecation-date: '2025-09-02T00:00:00+01:00'
      x-deletion-date: '2025-12-02T00:00:00+01:00'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: serviceFamily
          description: Filter on a specific service family
          schema:
            $ref: '#/components/schemas/vrack.AllowedServiceEnum'
        - in: path
          name: serviceName
          description: The internal name of your vrack
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vrack.AllowedServices'
      x-developer-hub-navigation:
        - - Network
          - vRack
          - Attached services
          - Eligible services@@@20
      x-badges:
        - color: red
          label: Deprecated, will be removed
      x-iam-actions:
        - name: vrack:apiovh:allowedServices/get
          required: true
        - name: publicCloudProject:apiovh:vrack/attach
          description: Needed on the Cloud Project services to be listed in the response body
          required: false
        - name: legacyVrack:apiovh:vrack/attach
          description: Needed on the legacy vRack services to be listed in the response body
          required: false
        - name: ipLoadbalancing:apiovh:vrack/attach
          description: Needed on the IP Load Balancer services to be listed in the response body
          required: false
        - name: ovhCloudConnect:apiovh:vrack/attach
          description: Needed on the OVH Cloud Connect services to be listed in the response body
          required: false
        - name: dedicatedServer:apiovh:vrack/attach
          description: Needed on the Dedicated Server services to be listed in dedicatedServer and dedicatedServerInterface body entries
          required: false
        - name: pccVMware:apiovh:vrack/attach
          description: Needed on the Dedicated Cloud (VMware) services to be listed in the response body
          required: false
        - name: vrackServices:apiovh:vrack/attach
          description: Needed on the VrackServices services to be listed in the response body
          required: false
        - name: ip:apiovh:vrack/attach
          description: Needed on the IP services to be listed in the response body
          required: false
        - name: vmwareCloudDirector:apiovh:organization/virtualDataCenter/vrack/attach
          description: Needed on the VCD VirtualDataCenter services to be listed in the response body
          required: false
      operationId: get_v1_vrack_service_name_allowed_services
