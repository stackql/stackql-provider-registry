          - Failover priorities@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vrack:apiovh:publicRoutingPriority/get
          required: true
      x-expanded-response: VrackPublicRoutingPriority
      operationId: get_v1_vrack_service_name_public_routing_priority
      description: List priorities. Returns the identifiers of the 3-AZ failover priorities of the vRack.
    post:
      summary: Create a priority
      description: |-
        Create a priority.

        This endpoint will create a new 'custom' routing priority.

        You can create a new 'custom' routing priority if you have an additional IP block in your vRack in the same region or not.

        You do not have to create a 'custom' routing priority for RTvRack 3AZ to work. If you add an additional IP block in a 3AZ region without any routing priority and any additional IP block, a 'default' routing priority will automatically be chosen for you.

        Priorities must be set to `1`, `2` or `3` for each availability zone.

        `1` stands for the availability zone with highest priority, which will handle traffic by default.

        `2` is the availability zone with second-highest priority, which will handle traffic as soon as priority `1` availability zone is not available.

        `3` is the availability zone with lowest priority, it will handle traffic if neither the availability zone with priority `1` nor the availability zone with priority `2` are available.

        All availability zones in a 3AZ region must be set in the payload in order for the 'custom' routing priority to be created.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your vrack
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                availabilityZones:
                  type: array
                  description: Priority definition, every region's availability zones MUST be listed
                  items:
                    $ref: '#/components/schemas/vrack.PublicRoutingDefinition'
                region:
                  type: string
                  description: Name of the region where Public routing priority is defined
              required:
                - availabilityZones
                - region
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vrack.Task'
      x-developer-hub-navigation:
        - - Network
          - vRack
          - Public IP connectivity
          - Failover priorities@@@30
      x-badges:
        - color: green
          label: Stable production version
