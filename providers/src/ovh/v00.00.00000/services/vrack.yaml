          application/json:
            schema:
              type: object
              properties:
                project:
                  type: string
                  description: publicCloud project to add
              required:
                - project
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vrack.Task'
      x-developer-hub-navigation:
        - - Network
          - vRack
          - Attached services
          - Public Cloud@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
