components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    vrack.PublicRoutingRegion:
      type: object
      description: A structure describing a Region where a block can be announced to
      properties:
        defaultBandwidthLimit:
          type: integer
          description: Default bandwidth limit for blocks in your vRack (in Mbps)
        publicRoutingType:
          description: Type of public routing in the region. It indicates how many availability zones (one or three) can be configured to route blocks in this region. PublicRoutingPriority can be defined only on type PUBLIC-ROUTING-3-AZ.
          type: string
          enum:
            - PUBLIC-ROUTING-1-AZ
            - PUBLIC-ROUTING-3-AZ
        region:
          type: string
          description: Region name
    vrack.vrackWithIAM:
      type: object
      description: vrack
      properties:
        description:
          type: string
          description: Description of the vRack
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
