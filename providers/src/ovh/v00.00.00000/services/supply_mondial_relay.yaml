openapi: 3.0.0
info:
  title: OVHcloud Mondial Relay API
  description: Mondial Relay pick-up point search.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/supply/mondialRelay
paths:
  /supply/mondialRelay:
    post:
      summary: Find the 10 nearest MondialRelay points from address or city.
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: Address
                city:
                  type: string
                  description: City
                country:
                  description: ISO country code
                  $ref: '#/components/schemas/coreTypes.CountryEnum'
                zipcode:
                  type: string
                  description: Zip Code
              required:
                - country
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supply.MondialRelayReturn'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:supplyMondialRelay/create
          required: true
      operationId: post_v1_supply_mondial_relay
      description: Find the 10 nearest MondialRelay points from address or city.
