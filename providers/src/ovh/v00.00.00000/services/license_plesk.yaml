openapi: 3.0.0
info:
  title: OVHcloud Plesk Licenses API
  description: Plesk licenses and their options.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/license/plesk
paths:
  /license/plesk:
    get:
      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_pleskResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:get
          required: true
      x-expanded-response: LicensePleskPleskWithIAM
      operationId: get_v1_license_plesk
      description: List available services
  /license/plesk/orderableVersions:
    get:
      summary: Get the orderable Plesk versions and their associated compatibilities
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: ip
          description: Your license Ip
          required: true
          schema:
            $ref: '#/components/schemas/ipv4'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_plesk_orderable_versionsResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:licensePlesk/orderableVersions/get
          required: true
      operationId: get_v1_license_plesk_orderable_versions
      description: Get the orderable Plesk versions and their associated compatibilities
  /license/plesk/{serviceName}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.plesk.PleskWithIAM'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:get
          required: true
      operationId: get_v1_license_plesk_service_name
      description: Get this object properties
    put:
      summary: Alter this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.plesk.Plesk'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:put
          required: true
      operationId: put_v1_license_plesk_service_name
      description: Alter this object properties
  /license/plesk/{serviceName}/allowedDestinationIp:
    get:
      summary: Returns an array of ips where the license can be moved to
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_plesk_service_name_allowed_destination_ipResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:allowedDestinationIp/get
          required: true
      operationId: get_v1_license_plesk_service_name_allowed_destination_ip
      description: Returns an array of ips where the license can be moved to
  /license/plesk/{serviceName}/canLicenseBeMovedTo:
    get:
      summary: Will tell if the ip can accept the license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: destinationIp
          description: The Ip on which you want to move this license
          required: true
          schema:
            $ref: '#/components/schemas/ipv4'
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.ChangeIpStatus'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:canLicenseBeMovedTo/get
          required: true
      operationId: get_v1_license_plesk_service_name_can_license_be_moved_to
      description: Will tell if the ip can accept the license
  /license/plesk/{serviceName}/changeIp:
    post:
      summary: Move this license to another Ip
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destinationIp:
                  description: The Ip on which you want to move this license
                  $ref: '#/components/schemas/ipv4'
              required:
                - destinationIp
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:changeIp
          required: true
      operationId: post_v1_license_plesk_service_name_change_ip
      description: Move this license to another Ip
  /license/plesk/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:confirmTermination
          required: true
      operationId: post_v1_license_plesk_service_name_confirm_termination
  /license/plesk/{serviceName}/option:
    get:
      summary: options attached to this license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_plesk_service_name_optionResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:option/get
          required: true
      x-expanded-response: LicenseOption
      operationId: get_v1_license_plesk_service_name_option
      description: options attached to this license
  /license/plesk/{serviceName}/option/{label}:
    delete:
      summary: release this Option
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: label
          description: This option designation
          required: true
          schema:
            $ref: '#/components/schemas/license.OptionLabel'
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:option/delete
          required: true
      operationId: delete_v1_license_plesk_service_name_option_label
      description: release this Option
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: label
          description: This option designation
          required: true
          schema:
            $ref: '#/components/schemas/license.OptionLabel'
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Option'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:option/get
          required: true
      operationId: get_v1_license_plesk_service_name_option_label
      description: Get this object properties
  /license/plesk/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_license_plesk_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_license_plesk_service_name_service_infos
  /license/plesk/{serviceName}/tasks:
    get:
      summary: tasks linked to this license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: action
          description: Filter the value of action property (=)
          schema:
            $ref: '#/components/schemas/license.ActionType'
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
        - in: query
          name: status
          description: Filter the value of status property (=)
          schema:
            $ref: '#/components/schemas/license.TaskStateEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_plesk_service_name_tasksResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:tasks/get
          required: true
      x-expanded-response: LicenseTask
      operationId: get_v1_license_plesk_service_name_tasks
      description: tasks linked to this license
  /license/plesk/{serviceName}/tasks/{taskId}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          description: This Task id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:tasks/get
          required: true
      operationId: get_v1_license_plesk_service_name_tasks_task_id
      description: Get this object properties
  /license/plesk/{serviceName}/terminate:
    post:
      summary: Request service termination
      description: Request service termination. Starts the termination of the service. The admin contact receives a token by email, to confirm with the `confirmTermination` call.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Plesk license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licensePlesk:apiovh:terminate
          required: true
      operationId: post_v1_license_plesk_service_name_terminate
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    ipv4:
      type: string
      description: IPv4 address (e.g., 192.0.2.0)
      format: ipv4
      example: 192.0.2.0
    license.PleskOrderConfiguration:
      type: object
      description: The serviceTypes allowed to Order a plesk version and associated Versions
      properties:
        orderableVersions:
          type: array
          items:
            $ref: '#/components/schemas/license.OrderablePleskCompatibilityInfos'
        serviceType:
          $ref: '#/components/schemas/license.LicenseTypeEnum'
    license.plesk.PleskWithIAM:
      type: object
      description: Your Plesk license
      properties:
        creation:
          type: string
          description: This license creation date
          format: date-time
          readOnly: true
        deleteAtExpiration:
          type: boolean
          description: Shall we delete this on expiration ?
        domain:
          type: string
          description: The internal name of your license
          readOnly: true
        domainNumber:
          description: The amount of domain this license can manage
          nullable: true
          readOnly: true
          type: string
          enum:
            - '0'
            - '1'
            - '10'
            - '100'
            - '30'
            - '300'
            - unlimited
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        informationKey:
          type: string
          description: This license Information key
          nullable: true
          readOnly: true
        ip:
          description: The ip on which this license is attached
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        key:
          type: string
          description: This license key
          readOnly: true
        licenseId:
          type: string
          description: The license id on license provider side
          readOnly: true
        productKey:
          type: string
          description: This license product key
          nullable: true
          readOnly: true
        status:
          description: This license state
          readOnly: true
          type: string
          enum:
            - ok
            - released
            - terminated
            - toDeliver
        version:
          description: This license version
          readOnly: true
          type: string
          enum:
            - PLESK_10_AND_LATER
            - PLESK_10_AND_LATER_FOR_KVM
            - PLESK_10_AND_LATER_FOR_VMWARE
            - PLESK_10_AND_LATER_FOR_VZ
            - PLESK_10_AND_LATER_FOR_WIN
            - PLESK_10_AND_LATER_FOR_WIN_FOR_VMWARE
            - PLESK_10_AND_LATER_FOR_WIN_FOR_VZ
            - PLESK_10_AND_LATER_FOR_WIN_FOR_XEN
            - PLESK_10_AND_LATER_FOR_XEN
            - PLESK_12_VPS_WEB_ADMIN
            - PLESK_12_VPS_WEB_APP
            - PLESK_12_VPS_WEB_HOST
            - PLESK_12_VPS_WEB_HOST_CLNX
            - PLESK_12_VPS_WEB_PRO
            - PLESK_12_VPS_WEB_PRO_CLNX
            - PLESK_12_WEB_ADMIN
            - PLESK_12_WEB_APP
            - PLESK_12_WEB_HOST
            - PLESK_12_WEB_HOST_CLNX
            - PLESK_12_WEB_PRO
            - PLESK_12_WEB_PRO_CLNX
            - PLESK_75_RELOADED
            - PLESK_80
            - PLESK_80_FOR_VZ
            - PLESK_81_FOR_WIN
            - PLESK_9
            - PLESK_95
            - PLESK_95_FOR_VZ
            - PLESK_95_FOR_WIN
            - PLESK_9_FOR_VZ
            - PLESK_9_FOR_WIN
            - PLESK_ONYX_VPS_WEB_ADMIN
            - PLESK_ONYX_VPS_WEB_APP
            - PLESK_ONYX_VPS_WEB_HOST
            - PLESK_ONYX_VPS_WEB_HOST_CLNX
            - PLESK_ONYX_VPS_WEB_PRO
            - PLESK_ONYX_VPS_WEB_PRO_CLNX
            - PLESK_ONYX_WEB_ADMIN
            - PLESK_ONYX_WEB_APP
            - PLESK_ONYX_WEB_HOST
            - PLESK_ONYX_WEB_HOST_CLNX
            - PLESK_ONYX_WEB_PRO
            - PLESK_ONYX_WEB_PRO_CLNX
            - PLESK_VPS_WEB_ADMIN
            - PLESK_VPS_WEB_HOST
            - PLESK_VPS_WEB_PRO
            - PLESK_WEB_ADMIN
            - PLESK_WEB_HOST
            - PLESK_WEB_PRO
            - plesk-12-webadmin
            - plesk-12-webadmin-for-vps
            - plesk-12-webhost
            - plesk-12-webhost-for-vps
            - plesk-12-webpro
            - plesk-12-webpro-for-vps
            - plesk-webadmin
            - plesk-webadmin-for-vps
            - plesk-webhost
            - plesk-webhost-for-vps
            - plesk-webpro
            - plesk-webpro-for-vps
    license.plesk.Plesk:
