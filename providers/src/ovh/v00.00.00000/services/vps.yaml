openapi: 3.0.0
info:
  title: OVHcloud VPS API
  description: 'Virtual private servers: servers, disks, IPs, snapshots, automated backups, options, images, templates and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/vps
paths:
  /vps:
    get:
      operationId: listVPS
      summary: List your VPS
      description: Returns the names of the VPS of the account. Each name is the service name used by the other calls.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVPSResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Servers@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:get
          required: true
      x-expanded-response: VpsVPSWithIAM
  /vps/datacenter:
    get:
      operationId: listVpsDatacentersByCountry
      summary: List all VPS datacenters available for the given country
      parameters:
        - in: query
          name: country
          description: Country targeted
          schema:
            $ref: '#/components/schemas/nichandle.CountryEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVpsDatacentersByCountryResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Catalog@@@10
      x-badges:
        - color: green
          label: Stable production version
      description: List all VPS datacenters available for the given country
  /vps/order/rule/datacenter:
    get:
      operationId: listVpsOrderDatacentersRule
      summary: List datacenters with priority and stock status for a VPS order
      description: Returns the datacenters available for a VPS order, with their priority and stock status.
      parameters:
        - in: query
          name: os
          description: VPS OS selection in order api
          schema:
            type: string
        - in: query
          name: ovhSubsidiary
          description: Subsidiary to sort datacenters
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.OvhSubsidiaryEnum'
        - in: query
          name: planCode
          description: VPS plan code from order api
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.order.rule.Datacenters'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Catalog@@@20
      x-badges:
        - color: green
          label: Stable production version
  /vps/order/rule/datacenter/aggregated:
    get:
      operationId: listVpsOrderAggregatedDatacentersRule
      summary: List datacenters with priority and stock status for every VPS model and storage option
      description: Returns, for every VPS model, the datacenters available for an order with their priority and stock status.
      parameters:
        - in: query
          name: ovhSubsidiary
          description: Subsidiary to sort datacenters
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.OvhSubsidiaryEnum'
        - in: query
          name: planCodes
          description: Comma separated VPS plan codes from order api to answer for
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.order.rule.AggregatedDatacenters'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Catalog@@@30
      x-badges:
        - color: green
          label: Stable production version
  /vps/order/rule/osChoices:
    get:
      operationId: listVpsOrderOsChoicesRule
      summary: List OS choices and availability status for a VPS order
      description: Returns the operating systems that can be chosen for a VPS order, with their availability status.
      parameters:
        - in: query
          name: datacenter
          description: VPS datacenter
          required: true
          schema:
            type: string
        - in: query
          name: os
          description: VPS OS selection in order api
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.order.rule.OSChoices'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Images@@@30
      x-badges:
        - color: green
          label: Stable production version
  /vps/{serviceName}:
    get:
      operationId: getVPS
      summary: Get information about a specific VPS
      description: Returns the model, zone, state, netboot mode, keymap, lock status, vCore count, memory limit and IAM metadata of the VPS.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.VPSWithIAM'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Servers@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:get
          required: true
    put:
      operationId: editVPS
      summary: Edit properties of the given VPS
      description: Updates the display name, the KVM keyboard layout, the netboot mode and the SLA monitoring of the VPS. A keyboard layout change requires a reboot; a netboot change reboots a Cloud VPS automatically.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vps.VPS'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Servers@@@130
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:put
          required: true
  /vps/{serviceName}/abortSnapshot:
    post:
      operationId: abortVpsSnapshot
      summary: Abort an ongoing snapshot or automated backup operation for this VPS
      description: Stops the snapshot or automated backup operation in progress on the VPS.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Backups@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:abortSnapshot
          required: true
  /vps/{serviceName}/automatedBackup:
    get:
      operationId: getVpsAutomatedBackup
      summary: Retrieve automated backup settings for this VPS
      description: Returns whether the automated backup is enabled, its rotation and the time of the daily backup.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.AutomatedBackup'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Backups@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:automatedBackup/get
          required: true
  /vps/{serviceName}/automatedBackup/attachedBackup:
    get:
      operationId: getVpsAutomatedBackupAttached
      summary: List backups currently attached to this VPS
      description: Returns the backups currently attached to the VPS, with their restore point and access settings.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVpsAutomatedBackupAttachedResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Backups@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:automatedBackup/attachedBackup/get
          required: true
  /vps/{serviceName}/automatedBackup/detachBackup:
    post:
      operationId: detachVpsAutomatedBackup
      summary: Unmount a restored backup from this VPS and return an asynchronous task
      description: Unmounts the restored backup from the VPS and returns the task that performs it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vps.automatedBackup.detachBackup.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Backups@@@110
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:automatedBackup/detachBackup
          required: true
  /vps/{serviceName}/automatedBackup/reschedule:
    post:
      operationId: rescheduleVpsAutomatedBackup
      summary: Change the scheduled time of the daily automated backup and return an asynchronous task
      description: Changes the time of the daily automated backup and returns the task that performs it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vps.automatedBackup.reschedule.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Backups@@@90
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:automatedBackup/reschedule
          required: true
  /vps/{serviceName}/automatedBackup/restore:
    post:
      operationId: restoreVpsAutomatedBackup
      summary: Restore this VPS from a given restore point and return an asynchronous task
      description: Restores the VPS from the given restore point and returns the task that performs it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vps.automatedBackup.restore.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Backups@@@100
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:automatedBackup/restore
          required: true
  /vps/{serviceName}/automatedBackup/restorePoints:
    get:
      operationId: getVpsAutomatedBackupRestorePoints
      summary: List available restore points for the automated backup
      description: Returns the restore points available for the automated backup of the VPS.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: query
          name: state
          description: The state of the restore point
          required: true
          schema:
            $ref: '#/components/schemas/vps.RestoreStateEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVpsAutomatedBackupRestorePointsResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Backups@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:automatedBackup/restorePoints/get
          required: true
  /vps/{serviceName}/availableUpgrade:
    get:
      operationId: listVpsAvailableUpgrades
      summary: List models this VPS can be upgraded to
      description: Returns the models the VPS can be upgraded to, with their disk, memory, vCore and options.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVpsAvailableUpgradesResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Subscription@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:availableUpgrade/get
          required: true
  /vps/{serviceName}/backupftp:
    get:
      operationId: getVpsBackupFtp
      summary: Retrieve Backup FTP configuration for this VPS
      description: 'Returns the Backup FTP service of the VPS: its name, type, quota, usage and read-only date.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.BackupFtp'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:backupftp/get
          required: true
  /vps/{serviceName}/backupftp/access:
    get:
      operationId: listVpsBackupFtpAcls
      summary: List Backup FTP ACL entries for this VPS
      description: Returns the IP blocks allowed to connect to the Backup FTP of the VPS.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVpsBackupFtpAclsResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:backupftp/access/get
          required: true
      x-expanded-response: DedicatedServerBackupFtpAcl
    post:
      operationId: createVpsBackupFtpAcl
      summary: Create a new Backup FTP ACL entry and return an asynchronous task
      description: Adds an IP block to the Backup FTP ACL of the VPS and returns the task that performs it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vps.backupftp.access.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:backupftp/access/create
          required: true
  /vps/{serviceName}/backupftp/access/{ipBlock}:
    delete:
      operationId: deleteVpsBackupFtpAcl
      summary: Revoke a Backup FTP ACL entry and return an asynchronous task
      description: Removes an IP block from the Backup FTP ACL of the VPS and returns the task that performs it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ipBlock
          description: Ip block
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:backupftp/access/delete
          required: true
    get:
      operationId: getVpsBackupFtpAcl
      summary: Retrieve a specific Backup FTP ACL entry
      description: Returns the FTP, CIFS and NFS access settings of an IP block in the Backup FTP ACL of the VPS.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ipBlock
          description: Ip block
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.BackupFtpAcl'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:backupftp/access/get
          required: true
    put:
      operationId: editVpsBackupFtpAcl
      summary: Update a Backup FTP ACL entry
      description: Updates the FTP, CIFS and NFS access settings of an IP block in the Backup FTP ACL of the VPS.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ipBlock
          description: Ip block
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dedicated.server.BackupFtpAcl'
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:backupftp/access/edit
          required: true
  /vps/{serviceName}/backupftp/authorizableBlocks:
    get:
      operationId: listVpsBackupFtpAuthorizableBlocks
      summary: List IP blocks that can be used in the Backup FTP ACL
      description: Returns the IP blocks that can be added to the Backup FTP ACL of the VPS.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVpsBackupFtpAuthorizableBlocksResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:backupftp/authorizableBlocks/get
          required: true
  /vps/{serviceName}/backupftp/password:
    post:
      operationId: setVpsBackupFtpPassword
      summary: Change the Backup FTP password for this VPS and return an asynchronous task
      description: Sets a new password for the Backup FTP of the VPS and returns the task that performs it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:backupftp/password/set
          required: true
  /vps/{serviceName}/changeContact:
    post:
      operationId: changeVpsContact
      summary: Initiate a contact change procedure for this VPS service
      description: Starts a contact change procedure for the admin, billing or tech contact of the VPS and returns the IDs of the change tasks.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.changeContact'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeVpsContactResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Subscription@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:changeContact/create
          required: true
  /vps/{serviceName}/confirmTermination:
    post:
      operationId: confirmVpsTermination
      summary: Confirm the termination of this VPS service
      description: Confirms the termination of the VPS with the token sent by email to the admin contact.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.confirmTermination'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Subscription@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:confirmTermination
          required: true
  /vps/{serviceName}/createSnapshot:
    post:
      operationId: createVpsSnapshot
      summary: Create a snapshot of this VPS (requires the snapshot option and no existing snapshot); returns an asynchronous task
      description: Creates a snapshot of the VPS and returns the task that performs it. The snapshot option must be active and no snapshot can exist.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vps.createSnapshot.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Backups@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vps:apiovh:snapshot/create
          required: true
  /vps/{serviceName}/datacenter:
    get:
      operationId: getVpsDatacenter
      summary: Retrieve the datacenter information for this VPS
      description: Returns the name, long name and country of the datacenter of the VPS.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vps.Datacenter'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - VPS
          - Servers@@@50
