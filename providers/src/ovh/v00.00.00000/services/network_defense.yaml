    networkDefense.Vac.TargetState:
      type: object
      description: 'One target currently held by a policy, with the status of every IP prefix it protects. A target listed here but no longer present in the policy''s configuration is being taken down: its prefixes stay DELETING until they are cleared.'
      properties:
        id:
          type: string
          description: 'Read-only target identifier. It is not part of the policy configuration: a target is declared by its value.'
          format: uuid
          readOnly: true
        prefix:
          description: The IP range, set when the target type is PREFIX
          nullable: true
          readOnly: true
          type: object
          properties:
            cidr:
              description: CIDR notation, for example `192.0.2.0/24`
              type: string
              format: ip-block
              example: 192.0.2.0/24
        resolved:
          type: array
          description: The IP prefixes this target currently protects, each with its status. A PREFIX target always has exactly one entry.
          items:
            $ref: '#/components/schemas/networkDefense.Vac.ResolvedPrefix'
          readOnly: true
        type:
          description: Type of target, which determines which definition field is set
          readOnly: true
          type: string
          enum:
            - PREFIX
    networkDefense.Vac.TargetDefinition:
      type: object
      description: 'One target declared in a policy''s configuration: what the policy protects. A target is identified by its value, not by an identifier. Only the PREFIX type is available today, so the prefix field must be set.'
      properties:
        prefix:
          description: The IP range for the PREFIX target
          type: object
          properties:
            cidr:
              description: CIDR notation, for example `192.0.2.0/24`
              type: string
              format: ip-block
              example: 192.0.2.0/24
      required:
        - prefix
    networkDefense.Vac.PrefixDefinition:
      type: object
      description: 'A PREFIX target: a single IP range in CIDR notation'
      properties:
        cidr:
          description: CIDR notation, for example `192.0.2.0/24`
          type: string
          format: ip-block
          example: 192.0.2.0/24
    networkDefense.Vac.ResolvedPrefix:
      type: object
      description: One IP prefix protected by a target, with its current status
      properties:
        cidr:
          description: CIDR notation, for example `192.0.2.0/24`
          readOnly: true
          type: string
          format: ip-block
          example: 192.0.2.0/24
        status:
          description: Current status of this prefix
          readOnly: true
          type: string
          enum:
            - ACTIVE
            - DELETING
            - PENDING
    networkDefense.Vac.TargetTypeEnum:
      type: string
      description: Type of a policy target. Only PREFIX (a single CIDR range) is available today. Other types will be added in the future.
      enum:
        - PREFIX
    networkDefense.Vac.TargetStatusEnum:
      type: string
      description: Status of a single protected prefix within a policy. Each target protects one or more prefixes, each carrying this status.
      enum:
        - ACTIVE
        - DELETING
        - PENDING
