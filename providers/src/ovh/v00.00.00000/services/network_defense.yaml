          description: Unique identifier of the policy
          format: uuid
          readOnly: true
        resourceStatus:
          description: Current status of the policy
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
        targetSpec:
