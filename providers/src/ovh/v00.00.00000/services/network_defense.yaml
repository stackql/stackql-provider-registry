openapi: 3.0.0
info:
  title: OVHcloud Network Defense API
  description: 'Network Defense (anti-DDoS): events, traffic and reference data.'
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/networkDefense
paths:
  /networkDefense/vac/event:
    get:
      operationId: getVacEvents
      summary: List VAC detection events
      description: Returns the detection events of the VAC DDoS protection, with their start and end dates and attack vectors when available. Filter by date range, region or subnet. Ongoing events, not finished, can be requested on their own.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: after
          description: Query events which started after the given date
          schema:
            type: string
            format: date-time
        - in: query
          name: before
          description: Query events which ended before the given date
          schema:
            type: string
            format: date-time
        - in: query
          name: ongoingOnly
          description: Query for ongoing events only. If this is set, `after` and `before` parameters are ignored.
          schema:
            type: boolean
        - in: query
          name: region
          description: Query events for the given region
          schema:
            $ref: '#/components/schemas/networkDefense.RegionEnum'
        - in: query
          name: subnets
          description: Query events for the given subnets
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ipBlock'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkDefense.Vac.EventsResponse'
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - Observability
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ip:apiovh:networkDefense/vac/event/get
          required: false
  /networkDefense/vac/reference/profile:
    get:
      operationId: getAllVacProfiles
      summary: List VAC network traffic profiles
      description: Returns the list of VAC DDoS protection network traffic profiles available to the account. Every profile is an expert-curated configuration for a workload type, such as a VPN or a Web Server, with the sensitivity levels it offers. A RETIRED profile cannot be assigned to a policy.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllVacProfilesResponse'
      tags:
        - Reference
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - References@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: id
      x-expanded-response: NetworkDefenseVacProfile
  /networkDefense/vac/reference/profile/{profileId}:
    get:
      operationId: getVacProfile
      summary: Get a VAC network traffic profile
      description: Returns a VAC DDoS protection network traffic profile with its name, description, sensitivity levels and lifecycle state.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: profileId
          description: Profile ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkDefense.Vac.Profile'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::ProfileDoesNotExist:
                  value:
                    class: Client::NotFound::ProfileDoesNotExist
                    message: Profile {{.profileId}} does not exist.
      tags:
        - Reference
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - References@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: id
  /networkDefense/vac/resource:
    get:
      operationId: getAllVacResources
      summary: List VAC resources
      description: Returns the list of VAC DDoS protection resources within the account. Every resource groups policies, profile and sensitivity with target IP address prefixes in order to tune detection and mitigation rules.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllVacResourcesResponse'
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - Services@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vac:apiovh:resource/get
          required: true
      x-expanded-response: NetworkDefenseVacResourceWithIAM
  /networkDefense/vac/resource/{resourceName}:
    get:
      operationId: getVacResource
      summary: Get a VAC resource
      description: Returns a VAC DDoS protection resource with its name, status and creation and update dates. The status is READY, or DELETING while the resource is being removed.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: resourceName
          description: Resource name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkDefense.Vac.ResourceWithIAM'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::ServiceDoesNotExist:
                  value:
                    class: Client::NotFound::ServiceDoesNotExist
                    message: VAC service {{.serviceId}} does not exist.
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - Services@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vac:apiovh:resource/get
          required: true
    put:
      operationId: editVacResource
      summary: Rename a VAC resource
      description: Changes the name of a VAC DDoS protection resource. No other field can be updated through this call.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: resourceName
          description: Resource name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/networkDefense.Vac.ResourceUpdate'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkDefense.Vac.Resource'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::FieldTooLong:
                  value:
                    class: Client::BadRequest::FieldTooLong
                    message: Field {{.field}} must be at most {{.maxLength}} bytes.
                Client::BadRequest::ImmutableField:
                  value:
                    class: Client::BadRequest::ImmutableField
                    message: Field {{.field}} cannot be changed.
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::ServiceDoesNotExist:
                  value:
                    class: Client::NotFound::ServiceDoesNotExist
                    message: VAC service {{.serviceId}} does not exist.
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - Services@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vac:apiovh:resource/edit
          required: true
  /networkDefense/vac/resource/{resourceName}/policy:
    get:
      operationId: getAllVacPolicies
      summary: List VAC policies
      description: Returns the list of policies within a VAC DDoS protection resource. Every policy applies a profile and a sensitivity level to target IP address prefixes, and carries the configuration requested and the one currently enforced.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: path
          name: resourceName
          description: Resource name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllVacPoliciesResponse'
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - Configuration@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vac:apiovh:resource/policy/get
          required: true
      x-expanded-response: NetworkDefenseVacPolicyAsyncResourceWithIAM
    post:
      operationId: createVacPolicy
      summary: Create a VAC policy
      description: Creates a policy within a VAC DDoS protection resource, applying a profile and a sensitivity level to target IP address prefixes in order to tune detection and mitigation rules. Async call, follow resourceStatus for operation progress. A target whose prefix carries protection settings that were not set via a policy is refused, unless you send force=true to overwrite them.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: force
          description: 'Overwrite the protection settings that were not set via a policy on the targets this request adds. Without it, such a request is refused. The previous settings are lost: you cannot restore them yourself. The `force` flag is not stored in the policy spec.'
          schema:
            type: boolean
        - in: path
          name: resourceName
          description: Resource name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/networkDefense.Vac.PolicyAsyncAdd'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkDefense.Vac.PolicyAsyncResource'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::DuplicateTarget:
                  value:
                    class: Client::BadRequest::DuplicateTarget
                    message: Target {{.prefix}} is declared more than once.
                Client::BadRequest::InvalidPrefix:
                  value:
                    class: Client::BadRequest::InvalidPrefix
                    message: '''{{.prefix}}'' is not a valid prefix, e.g. 192.0.2.0/24.'
                Client::BadRequest::ProfileDoesNotExist:
                  value:
                    class: Client::BadRequest::ProfileDoesNotExist
                    message: Profile {{.profileId}} does not exist.
                Client::BadRequest::ProfileNotAssignable:
                  value:
                    class: Client::BadRequest::ProfileNotAssignable
                    message: The profile and sensitivity can no longer be assigned. Read the profile again and retry.
                Client::BadRequest::ProfileRetired:
                  value:
                    class: Client::BadRequest::ProfileRetired
                    message: Profile {{.profileId}} is retired and cannot be assigned to a policy.
                Client::BadRequest::RequiredField:
                  value:
                    class: Client::BadRequest::RequiredField
                    message: Field {{.field}} is required.
                Client::BadRequest::SensitivityNotDefined:
                  value:
                    class: Client::BadRequest::SensitivityNotDefined
                    message: Profile {{.profileId}} does not define sensitivity {{.sensitivity}}.
                Client::BadRequest::TooManyTargets:
                  value:
                    class: Client::BadRequest::TooManyTargets
                    message: A policy can declare at most {{.maxTargets}} targets.
        '403':
          description: Error 403 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Forbidden::DestinationNotAllowed:
                  value:
                    class: Client::Forbidden::DestinationNotAllowed
                    message: You are not allowed to protect the requested prefixes.
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::ServiceDoesNotExist:
                  value:
                    class: Client::NotFound::ServiceDoesNotExist
                    message: VAC service {{.serviceId}} does not exist.
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::PolicyNameAlreadyExists:
                  value:
                    class: Client::Conflict::PolicyNameAlreadyExists
                    message: A policy named '{{.name}}' already exists in this VAC service.
                Client::Conflict::PrefixAlreadyAssigned:
                  value:
                    class: Client::Conflict::PrefixAlreadyAssigned
                    message: Prefix {{.prefix}} is already protected by another policy.
                Client::Conflict::QuotaExceeded:
                  value:
                    class: Client::Conflict::QuotaExceeded
                    message: VAC service {{.serviceId}} already holds the maximum of {{.limit}} policies.
                Client::Conflict::ResourceBusy:
                  value:
                    class: Client::Conflict::ResourceBusy
                    message: Resource {{.resourceId}} is being applied or deleted.
                Client::Conflict::UnmanagedConfiguration:
                  value:
                    class: Client::Conflict::UnmanagedConfiguration
                    message: Prefixes {{.prefixes}} carry protection settings that were not set via a policy. Retry with force=true to overwrite them.
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - Configuration@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vac:apiovh:resource/policy/create
          required: true
        - name: ip:apiovh:networkDefense/vac/protect
          required: true
  /networkDefense/vac/resource/{resourceName}/policy/{policyId}:
    delete:
      operationId: deleteVacPolicy
      summary: Delete a VAC policy
      description: Deletes a policy from a VAC DDoS protection resource. All settings of linked target IP address prefixes return to their default states.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: policyId
          description: Policy ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: resourceName
          description: Resource name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkDefense.Vac.PolicyAsyncResource'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::PolicyDoesNotExist:
                  value:
                    class: Client::NotFound::PolicyDoesNotExist
                    message: Policy {{.policyId}} does not exist.
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::ResourceBusy:
                  value:
                    class: Client::Conflict::ResourceBusy
                    message: Resource {{.resourceId}} is being applied or deleted.
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - Configuration@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vac:apiovh:resource/policy/delete
          required: true
    get:
      operationId: getVacPolicy
      summary: Get a VAC policy
      description: Returns a policy with the configuration requested and the one currently enforced, including the status of every protected IP address prefix.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: policyId
          description: Policy ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: resourceName
          description: Resource name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkDefense.Vac.PolicyAsyncResourceWithIAM'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::PolicyDoesNotExist:
                  value:
                    class: Client::NotFound::PolicyDoesNotExist
                    message: Policy {{.policyId}} does not exist.
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - Configuration@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vac:apiovh:resource/policy/get
          required: true
    put:
      operationId: editVacPolicy
      summary: Update a VAC policy
      description: 'Updates the name, enabled state, targets, profile and sensitivity level of a policy. The targets sent fully replace the previous ones: an omitted or empty list of targets removes every target from the policy. Removed target IPs reset their VAC DDoS protection settings to the default state. Send the checksum from the last read. A stale value is rejected. A new target whose prefix carries protection settings that were not set via a policy is refused, unless you send force=true to overwrite them.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: force
          description: 'Overwrite the protection settings that were not set via a policy on the targets this request adds. Without it, such a request is refused. The previous settings are lost: you cannot restore them yourself. The `force` flag is not stored in the policy spec.'
          schema:
            type: boolean
        - in: path
          name: policyId
          description: Policy ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: resourceName
          description: Resource name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/networkDefense.Vac.PolicyAsyncUpdate'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkDefense.Vac.PolicyAsyncResource'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::DuplicateTarget:
                  value:
                    class: Client::BadRequest::DuplicateTarget
                    message: Target {{.prefix}} is declared more than once.
                Client::BadRequest::InvalidPrefix:
                  value:
                    class: Client::BadRequest::InvalidPrefix
                    message: '''{{.prefix}}'' is not a valid prefix, e.g. 192.0.2.0/24.'
                Client::BadRequest::ProfileDoesNotExist:
                  value:
                    class: Client::BadRequest::ProfileDoesNotExist
                    message: Profile {{.profileId}} does not exist.
                Client::BadRequest::ProfileNotAssignable:
                  value:
                    class: Client::BadRequest::ProfileNotAssignable
                    message: The profile and sensitivity can no longer be assigned. Read the profile again and retry.
                Client::BadRequest::ProfileRetired:
                  value:
                    class: Client::BadRequest::ProfileRetired
                    message: Profile {{.profileId}} is retired and cannot be assigned to a policy.
                Client::BadRequest::RequiredField:
                  value:
                    class: Client::BadRequest::RequiredField
                    message: Field {{.field}} is required.
                Client::BadRequest::SensitivityNotDefined:
                  value:
                    class: Client::BadRequest::SensitivityNotDefined
                    message: Profile {{.profileId}} does not define sensitivity {{.sensitivity}}.
                Client::BadRequest::TooManyTargets:
                  value:
                    class: Client::BadRequest::TooManyTargets
                    message: A policy can declare at most {{.maxTargets}} targets.
        '403':
          description: Error 403 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Forbidden::DestinationNotAllowed:
                  value:
                    class: Client::Forbidden::DestinationNotAllowed
                    message: You are not allowed to protect the requested prefixes.
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::PolicyDoesNotExist:
                  value:
                    class: Client::NotFound::PolicyDoesNotExist
                    message: Policy {{.policyId}} does not exist.
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::PolicyNameAlreadyExists:
                  value:
                    class: Client::Conflict::PolicyNameAlreadyExists
                    message: A policy named '{{.name}}' already exists in this VAC service.
                Client::Conflict::PrefixAlreadyAssigned:
                  value:
                    class: Client::Conflict::PrefixAlreadyAssigned
                    message: Prefix {{.prefix}} is already protected by another policy.
                Client::Conflict::ResourceBusy:
                  value:
                    class: Client::Conflict::ResourceBusy
                    message: Resource {{.resourceId}} is being applied or deleted.
                Client::Conflict::TargetAlreadyDeclared:
                  value:
                    class: Client::Conflict::TargetAlreadyDeclared
                    message: Target {{.prefix}} is already declared on this policy.
                Client::Conflict::UnmanagedConfiguration:
                  value:
                    class: Client::Conflict::UnmanagedConfiguration
                    message: Prefixes {{.prefixes}} carry protection settings that were not set via a policy. Retry with force=true to overwrite them.
        '412':
          description: Error 412 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::PreconditionFailed::InvalidChecksum:
                  value:
                    class: Client::PreconditionFailed::InvalidChecksum
                    message: The policy changed since it was read. Get it again and resend the update with its new checksum.
      x-developer-hub-navigation:
        - - Security
          - Anti-DDoS
          - Configuration@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vac:apiovh:resource/policy/edit
          required: true
        - name: ip:apiovh:networkDefense/vac/protect
          required: true
  /networkDefense/vac/traffic:
    get:
      operationId: getVacTraffic
      summary: Get VAC traffic statistics
      description: Returns the traffic dropped and passed by the VAC DDoS protection after a detection event. Request by subnet, IPv4 /32 or IPv6 /64 CIDR, in bits and packets per second, over a date range.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: after
          description: Query statistics after the given date
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: before
