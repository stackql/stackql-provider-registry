openapi: 3.0.0
info:
  title: OVHcloud Email Domains API
  description: 'MX Plan email on a domain: accounts, mailing lists, redirections, responders, ACLs and delegated accounts.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/email/domain
paths:
  /email/domain:
    get:
      summary: List MX Plan domains
      description: List MX Plan domains. Returns the domains of the account with an MX Plan email service. Filter them by IAM tags with `iamTags`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_domainResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Services@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:get
          required: true
      x-expanded-response: EmailDomainDomainServiceWithIAM
      operationId: get_v1_email_domain
  /email/domain/delegatedAccount:
    get:
      summary: List delegated accounts
      description: List delegated accounts. Returns the email addresses of the email accounts delegated to the customer account. Filter them by `domain` or `accountName`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: accountName
          description: Name of email address
          schema:
            type: string
        - in: query
          name: domain
          description: Domain of email address
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_domain_delegated_accountResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:emailDomain/delegatedAccount/get
          required: true
      x-expanded-response: EmailDomainAccountDelegated
      operationId: get_v1_email_domain_delegated_account
  /email/domain/delegatedAccount/{email}:
    get:
      summary: Get a delegated account
      description: Get a delegated account. Returns the email address, description, size in bytes, allowed sizes and blocked state of the delegated email account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.AccountDelegated'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:emailDomain/delegatedAccount/get
          required: true
      operationId: get_v1_email_domain_delegated_account_email
    put:
      summary: Update a delegated account
      description: Update a delegated account. Updates the description or the size in bytes of the delegated email account. The allowed sizes are in `allowedAccountSize`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email.domain.AccountDelegated'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:emailDomain/delegatedAccount/edit
          required: true
      operationId: put_v1_email_domain_delegated_account_email
  /email/domain/delegatedAccount/{email}/changePassword:
    post:
      summary: Change a delegated account password
      description: Change a delegated account password. Sets a new password and returns the task. The password needs 8 to 30 characters and no accents.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: New password
                  format: password
              required:
                - password
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.TaskPop'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/changePassword
          required: true
      operationId: post_v1_email_domain_delegated_account_email_change_password
  /email/domain/delegatedAccount/{email}/filter:
    get:
      summary: List filters
      description: List filters. Returns the names of the filters of the delegated email account. Get one to read its action, priority and state.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_domain_delegated_account_email_filterResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/filter/get
          required: true
      x-expanded-response: EmailDomainFilter
      operationId: get_v1_email_domain_delegated_account_email_filter
    post:
      summary: Create a filter
      description: Create a filter. Creates a filter with a rule on a `header` (`operand` and `value`), an `action`, a `priority` and an `active` state, and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  description: Action of filter
                  $ref: '#/components/schemas/domain.DomainFilterActionEnum'
                actionParam:
                  type: string
                  description: Action parameter of filter
                active:
                  type: boolean
                  description: If true filter is active
                header:
                  type: string
                  description: Header to be filtered
                name:
                  type: string
                  description: Filter name
                operand:
                  description: Rule of filter
                  $ref: '#/components/schemas/domain.DomainFilterOperandEnum'
                priority:
                  type: integer
                  description: Priority of filter
                value:
                  type: string
                  description: Rule parameter of filter
              required:
                - action
                - active
                - header
                - name
                - operand
                - priority
                - value
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.TaskFilter'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/filter/create
          required: true
      operationId: post_v1_email_domain_delegated_account_email_filter
  /email/domain/delegatedAccount/{email}/filter/{name}:
    delete:
      summary: Delete a filter
      description: Delete a filter. Removes the filter and its rules from the email account, and returns the tasks. Incoming emails are no longer filtered by it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: name
          description: Filter name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete_v1_email_domain_delegated_account_email_filter_nameResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@80
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/filter/delete
          required: true
      operationId: delete_v1_email_domain_delegated_account_email_filter_name
    get:
      summary: Get a filter
      description: Get a filter. Returns the account, priority, active state, action (accept, account, delete or redirect) and action parameter of the filter.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: name
          description: Filter name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.Filter'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/filter/get
          required: true
      operationId: get_v1_email_domain_delegated_account_email_filter_name
  /email/domain/delegatedAccount/{email}/filter/{name}/changeActivity:
    post:
      summary: Enable or disable a filter
      description: Enable or disable a filter. Set `activity` to true to apply the filter to incoming emails, or to false to suspend it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: name
          description: Filter name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activity:
                  type: boolean
                  description: New activity
              required:
                - activity
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.TaskFilter'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@90
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/filter/changeActivity
          required: true
      operationId: post_v1_email_domain_delegated_account_email_filter_name_change_activity
  /email/domain/delegatedAccount/{email}/filter/{name}/changePriority:
    post:
      summary: Change filter priority
      description: Change filter priority. Sets the `priority` of the filter, which gives the order the filters of the account are applied in.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: name
          description: Filter name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priority:
                  type: integer
                  description: New priority
              required:
                - priority
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.TaskFilter'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@100
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/filter/changePriority
          required: true
      operationId: post_v1_email_domain_delegated_account_email_filter_name_change_priority
  /email/domain/delegatedAccount/{email}/filter/{name}/rule:
    get:
      summary: List filter rules
      description: List filter rules. Returns the IDs of the rules of the filter. Get one to read the header it checks, its operand and its value.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: name
          description: Filter name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_domain_delegated_account_email_filter_name_ruleResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@110
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/filter/rule/get
          required: true
      x-expanded-response: EmailDomainRule
      operationId: get_v1_email_domain_delegated_account_email_filter_name_rule
    post:
      summary: Create a filter rule
      description: Create a filter rule. Adds a rule to the filter on a `header`, with an `operand` (checkspf, contains or noContains) and a `value`, and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: name
          description: Filter name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                header:
                  type: string
                  description: Header to be filtered
                operand:
                  description: Rule of filter
                  $ref: '#/components/schemas/domain.DomainFilterOperandEnum'
                value:
                  type: string
                  description: Rule parameter of filter
              required:
                - header
                - operand
                - value
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.TaskFilter'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@130
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/filter/rule/create
          required: true
      operationId: post_v1_email_domain_delegated_account_email_filter_name_rule
  /email/domain/delegatedAccount/{email}/filter/{name}/rule/{id}:
    delete:
      summary: Delete a filter rule
      description: Delete a filter rule. Removes the rule from the filter and returns the tasks. The filter keeps applying its other rules.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: name
          description: Filter name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete_v1_email_domain_delegated_account_email_filter_name_rule_idResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@140
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/filter/rule/delete
          required: true
      operationId: delete_v1_email_domain_delegated_account_email_filter_name_rule_id
    get:
      summary: Get a filter rule
      description: Get a filter rule. Returns the header, the operand (checkspf, contains or noContains) and the value of the rule.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: name
          description: Filter name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.Rule'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@120
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailDomain:apiovh:delegatedAccount/filter/rule/get
          required: true
      operationId: get_v1_email_domain_delegated_account_email_filter_name_rule_id
  /email/domain/delegatedAccount/{email}/responder:
    delete:
      summary: Delete a delegated account responder
      description: Delete a delegated account responder. Removes the automatic reply of the delegated email account and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.TaskSpecialAccount'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@170
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:emailDomain/delegatedAccount/responder/delete
          required: true
      operationId: delete_v1_email_domain_delegated_account_email_responder
    get:
      summary: Get a delegated account responder
      description: Get a delegated account responder. Returns the content, the start and end dates and the copy settings of the responder of the delegated email account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.ResponderAccount'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@150
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:emailDomain/delegatedAccount/responder/get
          required: true
      operationId: get_v1_email_domain_delegated_account_email_responder
    post:
      summary: Create a delegated account responder
      description: Create a delegated account responder. Creates the automatic reply of the delegated email account with its content and optional start and end dates, and returns the task. Set `copy` to true to copy the emails to `copyTo`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: Content of responder
                copy:
                  type: boolean
                  description: If true, emails will be copy to emailToCopy address
                copyTo:
                  type: string
                  description: Account where copy emails
                from:
                  type: string
                  description: Date of start responder
                  format: date-time
                to:
                  type: string
                  description: Date of end responder
                  format: date-time
              required:
                - content
                - copy
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.domain.TaskSpecialAccount'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@160
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:emailDomain/delegatedAccount/responder/create
          required: true
      operationId: post_v1_email_domain_delegated_account_email_responder
    put:
      summary: Update a delegated account responder
      description: Update a delegated account responder. Updates the content and the start and end dates of the responder.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email.domain.ResponderAccount'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@180
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:emailDomain/delegatedAccount/responder/edit
          required: true
      operationId: put_v1_email_domain_delegated_account_email_responder
  /email/domain/delegatedAccount/{email}/updateUsage:
    post:
      summary: Refresh delegated account usage
      description: Refresh delegated account usage. Asks for the figures returned by `usage` to be recomputed; they are updated asynchronously.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Roundcube platform
          - Delegated Accounts@@@190
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:emailDomain/delegatedAccount/updateUsage
          required: true
      operationId: post_v1_email_domain_delegated_account_email_update_usage
  /email/domain/delegatedAccount/{email}/usage:
    post:
      summary: Get delegated account usage
      description: Get delegated account usage. Returns the number of emails, the maximum size in bytes of the mailbox (`quota`) and the date of the measure.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.DomainUsageAccountStruct'
      x-developer-hub-navigation:
