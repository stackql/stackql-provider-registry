            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.mxplan.AccountAlias'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Zimbra platform
          - Aliases@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailMxplan:apiovh:account/alias/get
          required: true
      operationId: get_v1_email_mxplan_service_account_email_alias_alias
