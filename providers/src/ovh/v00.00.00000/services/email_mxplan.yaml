openapi: 3.0.0
info:
  title: OVHcloud MX Plan API
  description: 'MX Plan services: accounts, domains, external contacts and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/email/mxplan
paths:
  /email/mxplan:
    get:
      summary: List MX Plan services
      description: List MX Plan services. Returns the names of the MX Plan services of the account. Filter them by IAM tags with `iamTags`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_mxplanResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Zimbra platform
          - Services@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailMxplan:apiovh:get
          required: true
      x-expanded-response: EmailMxplanServiceWithIAM
      operationId: get_v1_email_mxplan
  /email/mxplan/{service}:
    get:
      summary: Get the MX Plan service
      description: Get the MX Plan service. Returns the state, offer, hostname and web interface URL of the service, its message size limits, its password and lockout policy, and its spam and virus configuration.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: service
          description: The internal name of your mxplan organization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.mxplan.ServiceWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Zimbra platform
          - Services@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailMxplan:apiovh:get
          required: true
      operationId: get_v1_email_mxplan_service
    put:
      summary: Update the MX Plan service
      description: Update the MX Plan service. Updates the display name, message size limits, password and lockout policy, and spam and virus configuration of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: service
          description: The internal name of your mxplan organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email.mxplan.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Zimbra platform
          - Services@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailMxplan:apiovh:put
          required: true
      operationId: put_v1_email_mxplan_service
  /email/mxplan/{service}/account:
    get:
      summary: List email accounts
      description: List email accounts. Returns the email addresses of the email accounts of the service. Filter them by `primaryEmailAddress` or `id`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: id
          description: Filter the value of id property (like)
          schema:
            type: integer
        - in: query
          name: primaryEmailAddress
          description: Filter the value of primaryEmailAddress property (like)
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your mxplan organization
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_mxplan_service_accountResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Zimbra platform
          - Accounts@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailMxplan:apiovh:account/get
          required: true
      x-expanded-response: EmailMxplanAccount
      operationId: get_v1_email_mxplan_service_account
  /email/mxplan/{service}/account/{email}:
    delete:
      summary: Delete an email account
      description: Delete an email account. Deletes the email account of the MX Plan service and returns the task. Follow it under `task/{id}`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your mxplan organization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Zimbra platform
          - Accounts@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailMxplan:apiovh:account/delete
          required: true
      operationId: delete_v1_email_mxplan_service_account_email
    get:
      summary: Get an email account
      description: Get an email account. Returns the login, names, domain, state, quota and usage of the email account, its renewal and expiration settings, and its spam and virus configuration.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your mxplan organization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.mxplan.Account'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Zimbra platform
          - Accounts@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailMxplan:apiovh:account/get
          required: true
      operationId: get_v1_email_mxplan_service_account_email
    put:
      summary: Update an email account
      description: Update an email account. Updates the login, names, domain, quota, renewal period, deletion at expiration, Global Address List visibility and spam and virus configuration of the email account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your mxplan organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email.mxplan.Account'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Zimbra platform
          - Accounts@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailMxplan:apiovh:account/edit
          required: true
      operationId: put_v1_email_mxplan_service_account_email
  /email/mxplan/{service}/account/{email}/alias:
    get:
      summary: List account aliases
      description: 'List account aliases. Returns the aliases of the email account: extra addresses that deliver to the same mailbox.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
