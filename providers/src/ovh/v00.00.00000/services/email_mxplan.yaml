      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Zimbra platform
          - Aliases@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailMxplan:apiovh:account/alias/get
          required: true
      x-expanded-response: EmailMxplanAccountAlias
      operationId: get_v1_email_mxplan_service_account_email_alias
    post:
      summary: Create an account alias
      description: Create an account alias. Adds the `alias` address to the email account, so that it receives its emails, and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your mxplan organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
                  description: Alias
              required:
                - alias
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - MX Plan
          - Zimbra platform
          - Aliases@@@30
      x-badges:
        - color: green
