openapi: 3.0.0
info:
  title: OVHcloud Veeam Cloud Connect API
  description: 'Veeam Cloud Connect services: backup repositories and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/veeamCloudConnect
paths:
  /veeamCloudConnect:
    get:
      summary: List Veeam Cloud Connect services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_veeam_cloud_connectResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:get
          required: true
      x-expanded-response: VeeamCloudConnectAccountWithIAM
      operationId: get_v1_veeam_cloud_connect
      description: List Veeam Cloud Connect services
  /veeamCloudConnect/{serviceName}:
    get:
      summary: Get Veeam Cloud Connect
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veeamCloudConnect.AccountWithIAM'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:get
          required: true
      operationId: get_v1_veeam_cloud_connect_service_name
      description: Get Veeam Cloud Connect
  /veeamCloudConnect/{serviceName}/backupRepository:
    get:
      summary: List Veeam backup repositories
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_veeam_cloud_connect_service_name_backup_repositoryResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:backupRepository/get
          required: true
      x-expanded-response: VeeamCloudConnectBackupRepository
      operationId: get_v1_veeam_cloud_connect_service_name_backup_repository
      description: List Veeam backup repositories
    post:
      summary: Create backup repository
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_veeam_cloud_connect_service_name_backup_repositoryResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:backupRepository/create
          required: true
      operationId: post_v1_veeam_cloud_connect_service_name_backup_repository
      description: Create backup repository
  /veeamCloudConnect/{serviceName}/backupRepository/{inventoryName}:
    delete:
      summary: Delete backup repository
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: inventoryName
          description: The inventory name of your backup repository
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete_v1_veeam_cloud_connect_service_name_backup_repository_inventory_nameResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:backupRepository/delete
          required: true
      operationId: delete_v1_veeam_cloud_connect_service_name_backup_repository_inventory_name
      description: Delete backup repository
    get:
      summary: Get Veeam backup repository
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: inventoryName
          description: The inventory name of your backup repository
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veeamCloudConnect.BackupRepository'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:backupRepository/get
          required: true
      operationId: get_v1_veeam_cloud_connect_service_name_backup_repository_inventory_name
      description: Get Veeam backup repository
  /veeamCloudConnect/{serviceName}/backupRepository/{inventoryName}/upgradeQuota:
    post:
      summary: Change quota
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: inventoryName
          description: The inventory name of your backup repository
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newQuota:
                  type: integer
                  description: New quota in GB
              required:
                - newQuota
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_veeam_cloud_connect_service_name_backup_repository_inventory_name_upgrade_quotaResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:backupRepository/upgradeQuota
          required: true
      operationId: post_v1_veeam_cloud_connect_service_name_backup_repository_inventory_name_upgrade_quota
      description: Change quota
  /veeamCloudConnect/{serviceName}/capabilities:
    get:
      summary: Get capabilities
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veeamCloudConnect.offerCapabilities'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:capabilities/get
          required: true
      operationId: get_v1_veeam_cloud_connect_service_name_capabilities
      description: Get capabilities
  /veeamCloudConnect/{serviceName}/orderableUpgrade:
    get:
      summary: Get available offer upgrades
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_veeam_cloud_connect_service_name_orderable_upgradeResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:orderableUpgrade/get
          required: true
      operationId: get_v1_veeam_cloud_connect_service_name_orderable_upgrade
      description: Get available offer upgrades
  /veeamCloudConnect/{serviceName}/resetPassword:
    post:
      summary: Reset password
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veeamCloudConnect.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:resetPassword
          required: true
      operationId: post_v1_veeam_cloud_connect_service_name_reset_password
      description: Reset password
  /veeamCloudConnect/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_veeam_cloud_connect_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_veeam_cloud_connect_service_name_service_infos
  /veeamCloudConnect/{serviceName}/task:
    get:
      summary: List operations
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: name
          description: Filter the value of name property (like)
          schema:
            type: string
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
        - in: query
          name: state
          description: Filter the value of state property (=)
          schema:
            $ref: '#/components/schemas/veeamCloudConnect.TaskStateEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_veeam_cloud_connect_service_name_taskResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:task/get
          required: true
      x-expanded-response: VeeamCloudConnectTask
      operationId: get_v1_veeam_cloud_connect_service_name_task
      description: List operations
  /veeamCloudConnect/{serviceName}/task/{taskId}:
    get:
      summary: Get operation
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veeamCloudConnect.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamCloudConnect:apiovh:task/get
          required: true
      operationId: get_v1_veeam_cloud_connect_service_name_task_task_id
      description: Get operation
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    veeamCloudConnect.AccountWithIAM:
      type: object
      description: Veeam Cloud Connect
      properties:
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        location:
          description: Datacenter where your Cloud is physically located
          readOnly: true
          type: string
          enum:
            - bhs1
            - rbx2
            - sbg1
        productOffer:
          description: The commercial offer linked to your veeam cloud connect
          readOnly: true
          type: string
          enum:
            - advanced
            - demo
            - starter
        serviceName:
          type: string
          description: Your login in the Veeam Cloud Connect interface
          readOnly: true
        vmCount:
          type: integer
          description: Backuped VMs quantity on your account
          nullable: true
          readOnly: true
    veeamCloudConnect.Task:
      type: object
      description: Operation
      properties:
        endDate:
          type: string
          description: Done task date and time
          nullable: true
          format: date-time
          readOnly: true
        name:
          type: string
          description: Task name
          readOnly: true
        progress:
          type: integer
          description: Current progress
          readOnly: true
        startDate:
          type: string
          description: Start task date and time
          nullable: true
          format: date-time
          readOnly: true
        state:
          description: Current Task state
          readOnly: true
          type: string
          enum:
            - canceled
            - doing
            - done
            - error
            - fixing
            - problem
            - toCreate
            - todo
            - unknown
            - waitingTodo
        taskId:
          type: integer
          readOnly: true
    veeamCloudConnect.BackupRepository:
      type: object
      description: Veeam backup repository
      properties:
        inventoryName:
          type: string
          description: The inventory name of your backup repository
          readOnly: true
        quota:
          description: The quota allowed on this Backup repository
          readOnly: true
          type: object
          properties:
            unit:
              type: string
            value:
              type: integer
        quotaUsed:
          description: The quota used on this Backup repository
          nullable: true
          readOnly: true
          type: object
          properties:
            unit:
              type: string
            value:
              type: integer
        replicationZone:
          description: The replication zone of your repository
          nullable: true
          readOnly: true
          type: string
          enum:
            - bhs1
            - rbx2
            - sbg1
        state:
          description: The state of your backup repository
          readOnly: true
          type: string
          enum:
            - configuring
            - delivered
            - disabled
            - disabling
            - error
            - migrating
            - removing
        usage:
          type: integer
          description: The usage in percent of this backup repository
          nullable: true
          readOnly: true
    veeamCloudConnect.offerCapabilities:
      type: object
      description: Details about Veeam Cloud Connect offer
      properties:
        defaultQuota:
          type: integer
          description: Default quota applied on new repositories in GB
        maxQuota:
          type: integer
          description: Maximum quota you can apply on your repositories in GB
        maxStoragesCount:
          type: integer
          description: Max number of repositories you can add on your account
        minimumUsage:
          type: integer
          description: Required usage on all repositories to add a new one (percent)
        multiStorages:
          type: boolean
          description: Is account allowed to add new repositories
        replication:
          type: boolean
          description: Are data replicated over two storages
        vmCapacity:
          type: integer
          description: Included storage per vm
        wanAccelerator:
          type: boolean
          description: Is wan accelerator enabled
    veeamCloudConnect.Offer:
      type: string
      description: All orderable Veeam Cloud Connect offers
      enum:
        - advanced
        - demo
        - starter
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - automaticV2024
            - manual
            - oneShot
            - option
        serviceId:
          type: integer
          readOnly: true
        status:
          readOnly: true
          type: string
          enum:
            - autorenewInProgress
            - expired
            - inCreation
            - ok
            - pendingDebt
            - unPaid
    veeamCloudConnect.TaskStateEnum:
      type: string
      description: All states a Cloud Tenant Task can be in
      enum:
        - canceled
        - doing
        - done
        - error
        - fixing
        - problem
        - toCreate
        - todo
        - unknown
        - waitingTodo
    iam.resource.TagFilter.OperatorEnum:
      type: string
      description: Operator that can be used in order to filter resources tags
      enum:
        - EQ
        - EXISTS
        - ILIKE
        - LIKE
        - NEQ
        - NEXISTS
    iam.ResourceMetadata:
      type: object
      description: IAM resource metadata embedded in services models
      properties:
        displayName:
          type: string
          description: Resource display name
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the resource
          format: uuid
          readOnly: true
        state:
          description: Resource state
          nullable: true
          readOnly: true
          type: string
          enum:
            - EXPIRED
            - IN_CREATION
            - OK
            - SUSPENDED
        tags:
          type: object
          description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
          nullable: true
          additionalProperties:
            type: string
          readOnly: true
        urn:
          type: string
          description: Unique resource name used in policies
          readOnly: true
    veeamCloudConnect.Location:
      type: string
      description: All Location where cloud can be physically located
      enum:
        - bhs1
        - rbx2
        - sbg1
    complexType.UnitAndValue_long:
      type: object
      description: A numeric value tagged with its unit
      properties:
        unit:
          type: string
        value:
          type: integer
    veeamCloudConnect.BackupRepositoryStateEnum:
      type: string
      description: All states a Cloud Tenant backup repository can be in
      enum:
        - configuring
        - delivered
        - disabled
        - disabling
        - error
        - migrating
        - removing
    service.RenewType:
      type: object
      description: Map a possible renew for a specific service
      properties:
        automatic:
          type: boolean
          description: The service is automatically renewed
        deleteAtExpiration:
          type: boolean
          description: The service will be deleted at expiration
        forced:
          type: boolean
          description: The service forced to be renewed
        manualPayment:
          type: boolean
          description: The service needs to be manually renewed and paid
          nullable: true
        period:
          type: integer
          description: period of renew in month
          nullable: true
    service.RenewalTypeEnum:
      type: string
      description: Detailed renewal type of a service
      enum:
        - automaticForcedProduct
        - automaticV2012
        - automaticV2014
        - automaticV2016
        - automaticV2024
        - manual
        - oneShot
        - option
    service.StateEnum:
      type: string
      enum:
        - autorenewInProgress
        - expired
        - inCreation
        - ok
        - pendingDebt
        - unPaid
    iam.ResourceMetadata.StateEnum:
      type: string
      description: Resource state
      enum:
        - EXPIRED
        - IN_CREATION
        - OK
        - SUSPENDED
    Get_v1_veeam_cloud_connect_service_name_orderable_upgradeResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
    Get_v1_veeam_cloud_connectResponse:
      type: object
      properties:
        v1_veeam_cloud_connect:
          type: array
          items:
            $ref: '#/components/schemas/veeamCloudConnect.AccountWithIAM'
    Get_v1_veeam_cloud_connect_service_name_backup_repositoryResponse:
      type: object
      properties:
        v1_veeam_cloud_connect_service_name_backup_repository:
          type: array
          items:
            $ref: '#/components/schemas/veeamCloudConnect.BackupRepository'
    Post_v1_veeam_cloud_connect_service_name_backup_repositoryResponse:
      type: object
      properties:
        post_v1_veeam_cloud_connect_service_name_backup_repository:
          type: array
          items:
            $ref: '#/components/schemas/veeamCloudConnect.Task'
    Delete_v1_veeam_cloud_connect_service_name_backup_repository_inventory_nameResponse:
      type: object
      properties:
        delete_v1_veeam_cloud_connect_service_name_backup_repository_inventory_name:
          type: array
          items:
            $ref: '#/components/schemas/veeamCloudConnect.Task'
    Post_v1_veeam_cloud_connect_service_name_backup_repository_inventory_name_upgrade_quotaResponse:
      type: object
      properties:
        post_v1_veeam_cloud_connect_service_name_backup_repository_inventory_name_upgrade_quota:
          type: array
          items:
            $ref: '#/components/schemas/veeamCloudConnect.Task'
    Get_v1_veeam_cloud_connect_service_name_taskResponse:
      type: object
      properties:
        v1_veeam_cloud_connect_service_name_task:
          type: array
          items:
            $ref: '#/components/schemas/veeamCloudConnect.Task'
  x-stackQL-resources:
    services:
      id: ovh.veeam_cloud_connect.services
      name: services
      title: Services
      methods:
        list:
          operation:
            $ref: '#/paths/~1veeamCloudConnect/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_veeam_cloud_connect
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/Get_v1_veeam_cloud_connectResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_veeam_cloud_connect\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
