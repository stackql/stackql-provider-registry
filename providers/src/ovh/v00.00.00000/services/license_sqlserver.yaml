openapi: 3.0.0
info:
  title: OVHcloud SQL Server Licenses API
  description: Microsoft SQL Server licenses.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/license/sqlserver
paths:
  /license/sqlserver:
    get:
      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_sqlserverResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseSqlServer:apiovh:get
          required: true
      x-expanded-response: LicenseSqlserverSqlServerWithIAM
      operationId: get_v1_license_sqlserver
      description: List available services
  /license/sqlserver/orderableVersions:
    get:
      summary: Get the orderable Sql Server versions
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: ip
          description: Your license Ip
          required: true
          schema:
            $ref: '#/components/schemas/ipv4'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_sqlserver_orderable_versionsResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:licenseSqlServer/orderableVersions/get
          required: true
      operationId: get_v1_license_sqlserver_orderable_versions
      description: Get the orderable Sql Server versions
  /license/sqlserver/{serviceName}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your SQL Server license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.sqlserver.SqlServerWithIAM'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseSqlServer:apiovh:get
          required: true
      operationId: get_v1_license_sqlserver_service_name
      description: Get this object properties
  /license/sqlserver/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your SQL Server license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseSqlServer:apiovh:confirmTermination
          required: true
      operationId: post_v1_license_sqlserver_service_name_confirm_termination
  /license/sqlserver/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your SQL Server license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseSqlServer:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_license_sqlserver_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your SQL Server license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseSqlServer:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_license_sqlserver_service_name_service_infos
  /license/sqlserver/{serviceName}/tasks:
    get:
      summary: Tasks linked to this license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: action
          description: Filter the value of action property (=)
          schema:
            $ref: '#/components/schemas/license.ActionType'
        - in: path
          name: serviceName
          description: The name of your SQL Server license
          required: true
          schema:
            type: string
        - in: query
          name: status
          description: Filter the value of status property (=)
          schema:
            $ref: '#/components/schemas/license.TaskStateEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_sqlserver_service_name_tasksResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseSqlServer:apiovh:tasks/get
          required: true
      x-expanded-response: LicenseTask
      operationId: get_v1_license_sqlserver_service_name_tasks
      description: Tasks linked to this license
  /license/sqlserver/{serviceName}/tasks/{taskId}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your SQL Server license
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          description: This Task id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseSqlServer:apiovh:tasks/get
          required: true
      operationId: get_v1_license_sqlserver_service_name_tasks_task_id
      description: Get this object properties
  /license/sqlserver/{serviceName}/terminate:
    post:
      summary: Request service termination
      description: Request service termination. Starts the termination of the service. The admin contact receives a token by email, to confirm with the `confirmTermination` call.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your SQL Server license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseSqlServer:apiovh:terminate
          required: true
      operationId: post_v1_license_sqlserver_service_name_terminate
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    ipv4:
      type: string
      description: IPv4 address (e.g., 192.0.2.0)
      format: ipv4
      example: 192.0.2.0
    license.SqlServerOrderConfiguration:
      type: object
      description: Allowed SQL Server versions and their compliant options per matching serviceTypes
      properties:
        orderableVersions:
          type: array
          items:
            $ref: '#/components/schemas/license.OrderableSqlServerCompatibilityInfos'
        serviceType:
          $ref: '#/components/schemas/license.LicenseTypeEnum'
    license.sqlserver.SqlServerWithIAM:
      type: object
      description: Your SQL Server license
      properties:
        creation:
          type: string
          description: This license creation date
          format: date-time
          readOnly: true
        domain:
          type: string
          description: The internal name of your license
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        ip:
          description: The ip on which this license is attached
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        licenseId:
          type: string
          description: The license id on license provider side
          readOnly: true
        status:
          description: This license state
          readOnly: true
          type: string
          enum:
            - ok
            - released
            - terminated
            - toDeliver
        version:
          description: This license version
          readOnly: true
          type: string
          enum:
            - SQL_SERVER_2008_STANDARD_EDITION_2_CPU
            - SQL_SERVER_2008_STANDARD_EDITION_4_CPU
            - SQL_SERVER_2008_WEB_EDITION_2_CPU
            - SQL_SERVER_2008_WEB_EDITION_4_CPU
