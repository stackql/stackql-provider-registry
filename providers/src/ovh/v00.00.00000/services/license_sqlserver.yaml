            - changeIp
            - changeOs
            - installLicense
            - optionUpgrade
            - releaseOption
            - versionUpgrade
        doneDate:
          type: string
          description: When was this Task done
          nullable: true
          format: date-time
          readOnly: true
        lastUpdate:
          type: string
          description: The last time this Task was updated
          format: date-time
          readOnly: true
        name:
          type: string
          description: This Task name
          readOnly: true
        status:
          description: Current Taks status
          readOnly: true
          type: string
          enum:
            - cancelled
            - doing
            - done
            - error
            - todo
        taskId:
          type: integer
          description: This Task id
          readOnly: true
        todoDate:
          type: string
          description: When was this Task created
          format: date-time
          readOnly: true
