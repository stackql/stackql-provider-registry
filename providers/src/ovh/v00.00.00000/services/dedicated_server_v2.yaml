openapi: 3.0.0
info:
  title: OVHcloud Dedicated Servers (v2) API
  description: Dedicated servers through API v2.
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/dedicated/server
paths:
  /dedicated/server:
    get:
      operationId: getAllDedicatedServers
      summary: List dedicated server resources
      description: Get the list of all my dedicated server resources. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllDedicatedServersResponse'
        '500':
          description: Error 500 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Server::InternalServerError::ResourceReferentialDesync:
                  value:
                    class: Server::InternalServerError::ResourceReferentialDesync
                    message: The dedicated server resource could not be read because of an internal inconsistency
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Server@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:get
          required: true
      x-expanded-response: DedicatedServerWithIAM
  /dedicated/server/{serviceName}:
    get:
      operationId: getDedicatedServer
      summary: Get dedicated server resource
      description: Get the details of the dedicated server resource. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: actions
          description: Also report, under currentState.actions, whether the server accepts each action it can be asked to perform
          schema:
            type: boolean
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.serverWithIAM'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::DedicatedServer:
                  value:
                    class: Client::NotFound::DedicatedServer
                    message: Dedicated server resource {{.id}} not found
                Client::NotFound::DedicatedServerMultiple:
                  value:
                    class: Client::NotFound::DedicatedServerMultiple
                    message: At least one of the dedicated server resource(s) requested was not found
        '500':
          description: Error 500 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Server::InternalServerError::ResourceReferentialDesync:
                  value:
                    class: Server::InternalServerError::ResourceReferentialDesync
                    message: The dedicated server resource could not be read because of an internal inconsistency
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Server@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:get
          required: true
  /dedicated/server/{serviceName}/log/kind:
    get:
      operationId: getAllDedicatedServerLogKinds
      summary: List log kinds
      description: Returns the names of the log kinds Dedicated Servers emits, which can be forwarded to a stream. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllDedicatedServerLogKindsResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Observability@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:log/kind/get
          required: true
      x-expanded-response: DbaasLogsLogKind
  /dedicated/server/{serviceName}/log/kind/{name}:
    get:
      operationId: getDedicatedServerLogKind
      summary: Get a log kind
      description: Returns a log kind and the additional fields its logs carry. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogKind'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Observability@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:log/kind/get
          required: true
      x-response-identifier: name
  /dedicated/server/{serviceName}/log/subscription:
    get:
      operationId: getAllDedicatedServerLogSubscriptions
      summary: List log subscriptions
      description: Returns the identifiers of the Dedicated Servers log subscriptions. Set `kind` to restrict the list to one log kind. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: kind
          description: Filter on a specific kind
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllDedicatedServerLogSubscriptionsResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Observability@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:log/subscription/get
          required: true
      x-expanded-response: DbaasLogsLogSubscription
    post:
      operationId: createDedicatedServerLogSubscription
      summary: Create a log subscription
      description: Forwards Dedicated Servers logs of one kind to a Logs Data Platform stream. The subscription is created asynchronously and the response returns the operation identifier. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dbaas.logs.LogSubscriptionCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscriptionResponse'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::InvalidPayload:
                  value:
                    class: Client::BadRequest::InvalidPayload
                    message: The request body is not valid for this operation on a dedicated server resource
        '503':
          description: Error 503 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Server::ServiceUnavailable::Logs:
                  value:
                    class: Server::ServiceUnavailable::Logs
                    message: The logs of the dedicated server resource {{.id}} are not available
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Observability@@@50
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:log/subscription
          required: true
        - name: ldp:apiovh:output/graylog/stream/forwardTo
          description: Required on the targeted LDP service
          required: true
  /dedicated/server/{serviceName}/log/subscription/{subscriptionId}:
    delete:
      operationId: deleteDedicatedServerLogSubscription
      summary: Delete a log subscription
      description: Deletes the subscription and stops forwarding Dedicated Servers logs to the stream. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: path
          name: subscriptionId
          description: Subscription ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscriptionResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Observability@@@90
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:log/subscription/delete
          required: true
    get:
      operationId: getDedicatedServerLogSubscription
      summary: Get a log subscription
      description: Returns the log kind and the destination stream of a subscription. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: path
          name: subscriptionId
          description: Subscription ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscription'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Observability@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:log/subscription/get
          required: true
      x-response-identifier: subscriptionId
  /dedicated/server/{serviceName}/log/url:
    post:
      operationId: createDedicatedServerLogUrl
      summary: Generate a temporary log URL
      description: Generates a temporary URL to read the logs of one kind. The URL expires. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dbaas.logs.LogUrlCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.TemporaryLogsLink'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::InvalidPayload:
                  value:
                    class: Client::BadRequest::InvalidPayload
                    message: The request body is not valid for this operation on a dedicated server resource
        '503':
          description: Error 503 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Server::ServiceUnavailable::Logs:
                  value:
                    class: Server::ServiceUnavailable::Logs
                    message: The logs of the dedicated server resource {{.id}} are not available
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Observability@@@60
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:log/url
          required: true
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value. Defaults to `EQ`.
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    dedicated.serverWithIAM:
      type: object
      description: Dedicated server resource
      properties:
        checksum:
          type: string
          description: Checksum of the target spec (mutable params). Send it back on update. Rejected if another caller changed the target since your read.
          readOnly: true
        currentState:
          description: State observed on the server
          readOnly: true
          type: object
          properties:
            actions:
              type: array
              description: Availability of each action the server can be asked to perform. Present only when the read asks for it with actions=true. Absence means it was not asked for.
              nullable: true
              items:
                $ref: '#/components/schemas/dedicated.server.AvailableAction'
              readOnly: true
            features:
              description: Features observed on the server
              readOnly: true
              type: object
              properties:
                encryptionAtRest:
                  description: Encryption of the data at rest on the server disks. Reported on every server, with `enabled` false when the encryption is not in force.
                  readOnly: true
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Whether the data at rest on the server disks is encrypted
                      readOnly: true
        currentTasks:
          type: array
          description: Asynchronous operations currently running. Omitted, never null, when no update is running, and always omitted from the server list.
          nullable: true
          items:
            $ref: '#/components/schemas/common.CurrentTask'
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        id:
          type: string
          description: Service name of the dedicated server resource
          readOnly: true
        resourceStatus:
          description: Reflects the readiness of the dedicated server resource. A new target specification request will be accepted only in `READY` status.
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
        targetSpec:
          description: Target specification last declared on the server
          readOnly: true
          type: object
          properties:
            features:
              description: Desired state of every feature of the server
              type: object
              properties:
                encryptionAtRest:
                  description: Desired encryption of the data at rest on the server disks
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Whether the data at rest on the server disks must be encrypted
                  required:
                    - enabled
              required:
                - encryptionAtRest
          required:
            - features
    dbaas.logs.LogKind:
      type: object
      description: A kind of log a service can emit, which you can subscribe to and forward into a stream
      properties:
        additionalReturnedFields:
          type: array
          description: List of additional log fields managed in this log kind
          items:
            type: string
          readOnly: true
        createdAt:
          type: string
          description: Creation date of the log kind
          format: date-time
          readOnly: true
        displayName:
          type: string
          description: Log kind display name
          readOnly: true
        kindId:
          type: string
          description: Identifier of the log kind
          format: uuid
          readOnly: true
        name:
          type: string
          description: Log kind name
          readOnly: true
        updatedAt:
          type: string
          description: Last update date of the log kind
          format: date-time
          readOnly: true
    dbaas.logs.LogSubscriptionCreation:
      type: object
      description: Log subscription creation payload
      properties:
        kind:
          type: string
          description: Log kind name to subscribe to
        streamId:
          type: string
          description: Identifier of the customer log stream
          format: uuid
      required:
        - kind
        - streamId
    dbaas.logs.LogSubscriptionResponse:
      type: object
      description: Asynchronous operation after subscribing or unsubscribing to a resource logs
      properties:
        operationId:
          type: string
          description: Identifier of the operation
          format: uuid
          readOnly: true
        serviceName:
          type: string
          description: Operation owner's service name
          readOnly: true
    dbaas.logs.LogSubscription:
      type: object
      description: A live forwarding of one kind of log from a service into a Logs Data Platform stream
      properties:
        createdAt:
          type: string
          description: Creation date of the subscription
          format: date-time
          readOnly: true
        kind:
          type: string
          description: Log kind name of this subscription
          readOnly: true
        resource:
          description: Subscribed resource, where the logs come from
          readOnly: true
          type: object
          properties:
            name:
              type: string
              description: Name of subscribed resource
              readOnly: true
            type:
              type: string
              description: Type of subscribed resource
              readOnly: true
        serviceName:
          type: string
          description: Name of the destination log service
          readOnly: true
        streamId:
          type: string
          description: Identifier of the destination log stream
          readOnly: true
        subscriptionId:
          type: string
          description: Unique identifier of the subscription, used to change or stop the forwarding
          format: uuid
          readOnly: true
        updatedAt:
          type: string
          description: Last update date of the subscription
          format: date-time
          readOnly: true
    dbaas.logs.LogUrlCreation:
      type: object
      description: Log temporary URL creation payload
      properties:
        kind:
          type: string
          description: Log kind name
      required:
        - kind
    dbaas.logs.TemporaryLogsLink:
      type: object
      description: Temporary url information
      properties:
        expirationDate:
          type: string
          description: Temporary url expiration date
          format: date-time
          readOnly: true
        url:
          type: string
          description: Temporary url
          readOnly: true
    iam.resource.TagFilter.OperatorEnum:
      type: string
      description: Operator that can be used in order to filter resources tags
      enum:
        - EQ
        - EXISTS
        - ILIKE
        - LIKE
        - NEQ
        - NEXISTS
    dedicated.server.CurrentState:
      type: object
      description: Current state of the dedicated server resource
      properties:
        actions:
          type: array
          description: Availability of each action the server can be asked to perform. Present only when the read asks for it with actions=true. Absence means it was not asked for.
          nullable: true
          items:
            $ref: '#/components/schemas/dedicated.server.AvailableAction'
          readOnly: true
        features:
          description: Features observed on the server
          readOnly: true
          type: object
          properties:
            encryptionAtRest:
              description: Encryption of the data at rest on the server disks. Reported on every server, with `enabled` false when the encryption is not in force.
              readOnly: true
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether the data at rest on the server disks is encrypted
                  readOnly: true
    common.CurrentTask:
      type: object
      description: Asynchronous operation currently running
      properties:
        errors:
          type: array
          description: Errors that occurred on the task
          nullable: true
          items:
            $ref: '#/components/schemas/common.TaskError'
          readOnly: true
        id:
          type: string
          description: Identifier of the current task
          format: uuid
          readOnly: true
        link:
          type: string
          description: Link to the task details
          readOnly: true
        status:
          description: Current global status of the current task
          nullable: true
          readOnly: true
          type: string
          enum:
            - ERROR
            - PENDING
            - RUNNING
            - SCHEDULED
            - WAITING_USER_INPUT
        type:
          type: string
          description: Type of the current task
          readOnly: true
    iam.ResourceMetadata:
      type: object
      description: IAM resource metadata embedded in services models
      properties:
        displayName:
          type: string
          description: Resource display name
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the resource
          format: uuid
          readOnly: true
        state:
          description: Resource state
          nullable: true
          readOnly: true
          type: string
          enum:
            - EXPIRED
            - IN_CREATION
            - OK
            - SUSPENDED
        tags:
          type: object
          description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
          nullable: true
          additionalProperties:
            type: string
          readOnly: true
        urn:
          type: string
          description: Unique resource name used in policies
          readOnly: true
    common.ResourceStatusEnum:
      type: string
      description: Current status of a resource
      enum:
        - CREATING
        - CREATION_PLANNED
        - DELETING
        - ERROR
        - OUT_OF_SYNC
        - READY
        - SUSPENDED
        - UNKNOWN
        - UPDATING
    dedicated.server.TargetSpec:
      type: object
      description: Target specification of the dedicated server resource
      properties:
        features:
          description: Desired state of every feature of the server
          type: object
          properties:
            encryptionAtRest:
              description: Desired encryption of the data at rest on the server disks
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether the data at rest on the server disks must be encrypted
              required:
                - enabled
          required:
            - encryptionAtRest
      required:
        - features
    dbaas.logs.LogSubscriptionResource:
      type: object
      description: The service a log subscription collects its logs from
      properties:
        name:
          type: string
          description: Name of subscribed resource
          readOnly: true
        type:
          type: string
          description: Type of subscribed resource
          readOnly: true
    dedicated.server.AvailableAction:
      type: object
      description: Whether the server accepts one action, and why it does not
      properties:
        action:
          description: Action whose availability this entry reports
          readOnly: true
          type: string
          enum:
            - ENABLE_ENCRYPTION_AT_REST
        blockedBy:
          type: array
          description: All reasons that make the action unavailable. Null unless status is UNAVAILABLE.
          nullable: true
          items:
            $ref: '#/components/schemas/dedicated.server.ActionReason'
          readOnly: true
        status:
          description: Whether the server accepts the action now
          readOnly: true
          type: string
          enum:
            - AVAILABLE
            - UNAVAILABLE
            - UNDETERMINED
    dedicated.server.Features:
      type: object
      description: Features of the dedicated server resource
      properties:
        encryptionAtRest:
          description: Encryption of the data at rest on the server disks. Reported on every server, with `enabled` false when the encryption is not in force.
          readOnly: true
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether the data at rest on the server disks is encrypted
              readOnly: true
    common.TaskError:
      type: object
      description: Errors that occurred on the task
      properties:
        message:
          type: string
          description: Error description
          readOnly: true
    common.CurrentTaskStatusEnum:
      type: string
      description: Current status of a task. A task in ERROR cannot be retried without your inputs. PENDING tasks will be executed as soon as possible. A RUNNING task is currently executing your original request. SCHEDULED is used for tasks that will be executed in the future.
