openapi: 3.0.0
info:
  title: OVHcloud Cloud Disk Array API
  description: 'Cloud Disk Array (Ceph) clusters: pools, users, ACLs, CephFS and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/dedicated/ceph
paths:
  /dedicated/ceph:
    get:
      summary: List clusters
      description: Returns the service names of the clusters, which are also their Ceph fsid.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_cephResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Cluster@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:get
          required: true
      x-expanded-response: DedicatedCephClusterGetResponseWithIAM
      operationId: get_v1_dedicated_ceph
  /dedicated/ceph/{serviceName}:
    get:
      summary: Get a cluster
      description: Returns the configuration and the current state of the cluster. The status is INSTALLED once all requested tasks are done.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.ceph.clusterGet.responseWithIAM'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Cluster@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:get
          required: true
      operationId: get_v1_dedicated_ceph_service_name
    put:
      summary: Update a cluster
      description: Updates the label and the CRUSH tunables of the cluster.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dedicated.ceph.UpdateClusterDetails'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Cluster@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:put
          required: true
      operationId: put_v1_dedicated_ceph_service_name
  /dedicated/ceph/{serviceName}/acl:
    get:
      summary: List IP ACLs
      description: Returns the IP ACLs of the cluster. Only the networks listed in an ACL can connect to the cluster.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_ceph_service_name_aclResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - ACL@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:acl/get
          required: true
      x-response-identifier: id
      x-expanded-response: DedicatedCephAclGetResponse
      operationId: get_v1_dedicated_ceph_service_name_acl
    post:
      summary: Create IP ACLs
      description: Creates one IP ACL for each network in aclList, to allow it to connect to the cluster. The ACLs also apply to CephFS.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dedicated.ceph.acl.Create'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - ACL@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:acl/create
          required: true
      operationId: post_v1_dedicated_ceph_service_name_acl
  /dedicated/ceph/{serviceName}/acl/{aclId}:
    delete:
      summary: Delete an IP ACL
      description: Deletes the IP ACL. Clients in its network can no longer connect to the cluster.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: aclId
          description: Acl ID
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - ACL@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:acl/delete
          required: true
      operationId: delete_v1_dedicated_ceph_service_name_acl_acl_id
    get:
      summary: Get an IP ACL
      description: Returns an IP ACL, which allows one network to connect to the cluster.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: aclId
          description: Acl ID
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.ceph.aclGet.response'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - ACL@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:acl/get
          required: true
      x-response-identifier: id
      operationId: get_v1_dedicated_ceph_service_name_acl_acl_id
  /dedicated/ceph/{serviceName}/cephfs:
    get:
      summary: List CephFS filesystems
      description: Returns the CephFS filesystems of the cluster. The list is empty until a filesystem is enabled.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_ceph_service_name_cephfsResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - CephFS@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:cephfs/get
          required: true
      x-response-identifier: fsName
      x-expanded-response: DedicatedCephCephfsGetResponse
      operationId: get_v1_dedicated_ceph_service_name_cephfs
  /dedicated/ceph/{serviceName}/cephfs/{fsName}:
    delete:
      summary: Delete a CephFS filesystem
      description: Permanently deletes the filesystem and all its data. Only a disabled filesystem can be deleted.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: fsName
          description: Fs name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - CephFS@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:cephfs/delete
          required: true
      operationId: delete_v1_dedicated_ceph_service_name_cephfs_fs_name
    get:
      summary: Get a CephFS filesystem
      description: Returns a CephFS filesystem of the cluster.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: fsName
          description: Fs name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.ceph.cephfsGet.response'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - CephFS@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:cephfs/get
          required: true
      x-response-identifier: fsName
      operationId: get_v1_dedicated_ceph_service_name_cephfs_fs_name
  /dedicated/ceph/{serviceName}/cephfs/{fsName}/disable:
    post:
      summary: Disable a CephFS filesystem
      description: Blocks access to the filesystem and keeps its data. The filesystem can be enabled again later.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: fsName
          description: Fs name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - CephFS@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:cephfs/disable
          required: true
      operationId: post_v1_dedicated_ceph_service_name_cephfs_fs_name_disable
  /dedicated/ceph/{serviceName}/cephfs/{fsName}/enable:
    post:
      summary: Enable a CephFS filesystem
      description: Enables the filesystem, which becomes available within a few minutes. Only one filesystem can be enabled, and it must be named fs-default.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: fsName
          description: Fs name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - CephFS@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:cephfs/enable
          required: true
      operationId: post_v1_dedicated_ceph_service_name_cephfs_fs_name_enable
  /dedicated/ceph/{serviceName}/changeContact:
    post:
      summary: Change contacts
      description: Starts the change of the admin, tech or billing contact and returns the request IDs.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.changeContact'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_dedicated_ceph_service_name_change_contactResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Actions@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:changeContact
          required: true
      operationId: post_v1_dedicated_ceph_service_name_change_contact
  /dedicated/ceph/{serviceName}/confirmTermination:
    post:
      summary: Confirm termination
      description: Confirms the termination with the token sent by email. The reason and comments are optional.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.confirmTermination'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Actions@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:confirmTermination
          required: true
      operationId: post_v1_dedicated_ceph_service_name_confirm_termination
  /dedicated/ceph/{serviceName}/health:
    get:
      summary: Get the cluster health
      description: Returns whether the cluster is working normally and how full it is.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.ceph.clusterHealth.response'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Observability@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:health/get
          required: true
      operationId: get_v1_dedicated_ceph_service_name_health
  /dedicated/ceph/{serviceName}/osd/blocklist:
    get:
      summary: List blocklist entries
      description: Returns the client sessions currently blocklisted by the OSDs. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.ceph.osd.blocklist'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Blocklist@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:osd/blocklist
          required: true
      operationId: get_v1_dedicated_ceph_service_name_osd_blocklist
  /dedicated/ceph/{serviceName}/osd/blocklist/{address}:
    delete:
      summary: Delete a blocklist entry
      description: 'Removes the client session from the OSD blocklist. This may corrupt data: read the Ceph documentation before calling. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: address
          description: Address
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Blocklist@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:osd/blocklist/delete
          required: true
      operationId: delete_v1_dedicated_ceph_service_name_osd_blocklist_address
  /dedicated/ceph/{serviceName}/pool:
    get:
      summary: List pools
      description: Returns the pools of the cluster.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_ceph_service_name_poolResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Pool@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:pool/get
          required: true
      x-response-identifier: name
      x-expanded-response: DedicatedCephPoolGetResponse
      operationId: get_v1_dedicated_ceph_service_name_pool
    post:
      summary: Create a pool
      description: Creates a pool whose data is replicated three times. The name must contain at least three characters.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dedicated.ceph.pool.Create'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Pool@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:pool/create
          required: true
      operationId: post_v1_dedicated_ceph_service_name_pool
  /dedicated/ceph/{serviceName}/pool/{poolName}:
    delete:
      summary: Delete a pool
      description: Deletes the pool from the cluster.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: poolName
          description: Pool name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Pool@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:pool/delete
          required: true
      operationId: delete_v1_dedicated_ceph_service_name_pool_pool_name
    get:
      summary: Get a pool
      description: Returns a pool of the cluster.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: poolName
          description: Pool name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.ceph.poolGet.response'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Pool@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:pool/get
          required: true
      x-response-identifier: name
      operationId: get_v1_dedicated_ceph_service_name_pool_pool_name
  /dedicated/ceph/{serviceName}/pool/{poolName}/allowDeletion:
    put:
      summary: Allow pool deletion
      description: 'Opens a 5-minute window for deleting the pool. This window is not enforced yet: a pool can currently be deleted at any time.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: poolName
          description: Pool name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Pool@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:pool/allowDeletion
          required: true
      operationId: put_v1_dedicated_ceph_service_name_pool_pool_name_allow_deletion
  /dedicated/ceph/{serviceName}/serviceInfos:
    get:
      summary: Get subscription
      description: Returns contacts, creation and expiration dates, and renewal settings.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Observability@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_dedicated_ceph_service_name_service_infos
    put:
      summary: Update renewal settings
      description: Changes how the service renews; `renew` is the only editable field.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Observability@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_dedicated_ceph_service_name_service_infos
  /dedicated/ceph/{serviceName}/task:
    get:
      summary: List running tasks
      description: Returns the tasks running on the cluster.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_ceph_service_name_taskResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Block Storage
          - Cloud Disk Array
          - Actions@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedCeph:apiovh:task/get
          required: true
      operationId: get_v1_dedicated_ceph_service_name_task
  /dedicated/ceph/{serviceName}/task/{taskId}:
    get:
      summary: List the subtasks of a task
      description: Returns the subtasks of the task, to follow its progress.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: path
