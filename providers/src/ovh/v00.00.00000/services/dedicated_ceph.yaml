components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    dedicated.ceph.clusterGet.responseWithIAM:
      type: object
      description: Details about ceph cluster
      properties:
        cephMons:
          type: array
          description: List of CEPH monitor IPs
          items:
            type: string
          readOnly: true
        cephVersion:
          type: string
          description: Used version of ceph
          readOnly: true
        createDate:
          type: string
          description: Creation date
          readOnly: true
        crushTunables:
          description: Tunables of cluster
          readOnly: true
          type: string
          enum:
            - ARGONAUT
            - BOBTAIL
            - DEFAULT
            - FIREFLY
            - HAMMER
            - JEWEL
            - LEGACY
            - OPTIMAL
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        label:
          type: string
          description: Name of cluster
          readOnly: true
        region:
          type: string
          description: Name of region where cluster is located
          readOnly: true
        serviceName:
          type: string
          description: ID of cluster
          readOnly: true
        size:
          type: integer
          description: Size of cluster in TB
          readOnly: true
        state:
          description: State of cluster
          readOnly: true
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
        status:
          description: Status of cluster
          readOnly: true
          type: string
          enum:
            - CREATING
            - DELETED
            - DELETING
            - INSTALLED
            - TASK_IN_PROGRESS
        updateDate:
          type: string
          description: Last update date
          readOnly: true
    dedicated.ceph.UpdateClusterDetails:
      type: object
      description: Update cluster details
