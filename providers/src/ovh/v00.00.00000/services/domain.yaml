    domain.extensions.registryConfigurations.TransferLifecycleRegistryConfiguration:
      type: object
      description: The registry configurations applied when transfering a domain name
      properties:
        allowedPeriodsInMonths:
          type: array
          description: The number of months allowed for a domain transfer
          nullable: true
          items:
            type: integer
          readOnly: true
        includeRenew:
          type: boolean
          description: Whether the transfer includes a renewal of the domain name, and therefore updates its expiration date
          readOnly: true
        incomingTransferDelayMaxDays:
          type: integer
          description: The maximum estimated number of days for an incoming domain transfer
          nullable: true
          readOnly: true
        incomingTransferDelayMinDays:
          type: integer
          description: The minimum estimated number of days for an incoming domain transfer
          nullable: true
          readOnly: true
        isAuthInfoRequired:
          type: boolean
          description: 'Whether an authInfo has to be provided to request an incoming transfer on this extension. Independent from domain.isAuthInfoSupported: an extension can have an authInfo managed at the registry, to take control of a contact for instance, while its transfer process does not use one at all'
