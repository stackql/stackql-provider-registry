  /domain/extensions:
    get:
      summary: List all extensions
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: geolocalizations
          description: Filter only extensions related to this list of geolocalization places (comma separated). Default to empty.
          schema:
            type: string
        - in: query
          name: orderBy
          description: Order results by name (alphabetical) or trending importance (trending). Default to alphabetical.
          schema:
            $ref: '#/components/schemas/domain.extensions.OrderByTypeEnum'
        - in: query
          name: ovhSubsidiary
          description: OVHcloud subsidiary targeted. Useful only when orderBy is equal to trending. Default to FR.
          schema:
            $ref: '#/components/schemas/nichandle.OvhSubsidiaryEnum'
        - in: query
          name: thematics
          description: Filter only extensions related to this list of thematics (comma separated). Default to empty.
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
