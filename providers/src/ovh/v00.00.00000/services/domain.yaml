openapi: 3.0.0
info:
  title: OVHcloud Domain Names API
  description: 'Domain names and DNS zones: domains, name servers, DNSSEC, contacts, zones, records, redirections and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/domain
paths:
  /domain:
    get:
      operationId: getDomains
      summary: Get the list of managed domain names
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: query
          name: whoisOwner
          description: Filter domain names by owner ID
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDomainsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Domains@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: domain:apiovh:get
          required: true
      x-expanded-response: DomainDomainServiceWithIAM
      description: Get the list of managed domain names
  /domain/configurationRule:
    get:
      summary: Get configuration rule applied for a domain in a given action
      parameters:
        - in: query
          name: action
          description: Depending on the action, the applied rule will change (transfer vs create)
          required: true
          schema:
            $ref: '#/components/schemas/domain.ActionEnum'
        - in: query
          name: domain
          description: The domain to get the configuration rule for
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.configuration.rules.Rule'
      x-developer-hub-navigation:
        - - Web Cloud
          - Domains
          - Extensions & ordering@@@70
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_domain_configuration_rule
      description: Get configuration rule applied for a domain in a given action
  /domain/configurationRule/check:
    post:
      summary: Validate a rule data for a specified domain
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: action
          description: Depending on the action, the applied rule will change (transfer vs create)
          required: true
          schema:
            $ref: '#/components/schemas/domain.ActionEnum'
        - in: query
          name: domain
          description: The domain to check the rule data for
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domain.configuration.rules.RuleData'
      responses:
        '200':
          description: successful operation
