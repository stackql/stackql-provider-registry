      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domain.Contact'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.Contact'
      x-developer-hub-navigation:
        - - Web Cloud
          - Domains
