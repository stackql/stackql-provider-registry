    domain.extensions.registryConfigurations.DNSRegistryConfiguration:
      type: object
      description: The registry configurations applied to the DNS of a domain name
      properties:
        isDNSSECSupported:
          type: boolean
          description: Whether DNSSEC is supported by the registry/backend and handled by OVHcloud
          readOnly: true
        maxNumber:
          type: integer
          description: The maximum required number of DNS
          nullable: true
          readOnly: true
        minNumber:
          type: integer
          description: The minimum required number of DNS
          nullable: true
          readOnly: true
    domain.extensions.registryConfigurations.DomainRegistryConfiguration:
      type: object
      description: The registry configurations applied to a domain name
      properties:
        extension_type:
          description: The type of an extension (cctld or gtld)
          readOnly: true
          type: string
          enum:
            - cctld
            - gtld
        isAuthInfoSupported:
          type: boolean
          description: 'Whether the registry uses an authInfo for this extension, whatever it is used for. This does not mean an incoming transfer is driven by an authInfo: some registries manage an authInfo to take control of a contact while their transfer process does not rely on one. See lifecycle.transfer.isAuthInfoRequired for the transfer requirement'
          readOnly: true
        isPremiumSupported:
          type: boolean
          description: Whether premium domains are supported by the registry and handled by OVHcloud
          readOnly: true
        label:
          description: The registry configurations applied to the domain name label
          readOnly: true
          type: object
          properties:
            isIDNSupported:
              type: boolean
              description: Whether International Domain Names are supported by the registry and handled by OVHcloud
              readOnly: true
            maxLength:
              type: integer
              description: The maximum length allowed for a domain name (without the extension)
              nullable: true
              readOnly: true
            minLength:
              type: integer
              description: The minimum length allowed for a domain name (without the extension)
              nullable: true
              readOnly: true
    domain.extensions.registryConfigurations.LifecycleRegistryConfiguration:
      type: object
      description: The registry configurations of the lifecycle of a domain name
      properties:
        create:
          description: The registry configurations applied when creating a domain name
          readOnly: true
          type: object
          properties:
            allowedPeriodsInMonths:
              type: array
              description: The number of months allowed for a domain creation
              nullable: true
              items:
                type: integer
              readOnly: true
        order:
          description: The registry configurations applied when ordering a domain name
          readOnly: true
          type: object
          properties:
            active:
              type: boolean
              description: True if the extension can be ordered from the website
              readOnly: true
            maxMonths:
              type: integer
              description: The maximum number of months a domain can be ordered for
              nullable: true
              readOnly: true
            minMonths:
              type: integer
              description: The minimum number of months a domain can be ordered for
              nullable: true
              readOnly: true
        renew:
          description: The registry configurations applied when renewing a domain name
          readOnly: true
          type: object
          properties:
            allowedPeriodsInMonths:
              type: array
              description: The number of months allowed for a domain renewal
              nullable: true
              items:
                type: integer
              readOnly: true
            gracePeriodInDays:
              type: integer
              description: The number of calendar days between the expiration date and the redemption period when a renew can be executed. During this period, the domain has expired and is suspended. It's the number of days before real deletion. The customer can still renew.
              nullable: true
              readOnly: true
        restore:
          description: The registry configurations applied when restoring a domain name
          readOnly: true
          type: object
          properties:
            gracePeriodInDays:
              type: integer
              description: The number of calendar days in which the customer still can restore their domain after expiration. During this period, the domain has been deleted. The customer can still restore it until these days are over. Then the domain is returned to public, if not restored.
              nullable: true
              readOnly: true
        transfer:
          description: The registry configurations applied when transfering a domain name
          readOnly: true
          type: object
          properties:
            allowedPeriodsInMonths:
              type: array
              description: The number of months allowed for a domain transfer
              nullable: true
              items:
                type: integer
              readOnly: true
            includeRenew:
              type: boolean
              description: Whether the transfer includes a renewal of the domain name, and therefore updates its expiration date
              readOnly: true
            incomingTransferDelayMaxDays:
              type: integer
              description: The maximum estimated number of days for an incoming domain transfer
              nullable: true
              readOnly: true
            incomingTransferDelayMinDays:
              type: integer
              description: The minimum estimated number of days for an incoming domain transfer
              nullable: true
              readOnly: true
            isAuthInfoRequired:
              type: boolean
              description: 'Whether an authInfo has to be provided to request an incoming transfer on this extension. Independent from domain.isAuthInfoSupported: an extension can have an authInfo managed at the registry, to take control of a contact for instance, while its transfer process does not use one at all'
              readOnly: true
            transferBlockDelayInDays:
              type: integer
              description: The minimum number of days after domain creation or last transfer before a new outgoing transfer is allowed. The ICANN default is 60 days, but this value can be overridden per registry. Null means no restriction applies.
              nullable: true
              readOnly: true
    domain.order.Contacts:
      type: object
      description: Admin, tech and owner contacts for a domain order. admin and tech are OVH NIC handles (e.g. xxxxx-ovh); owner is an OVH contact resource referenced by its numeric id (see /me/contact), not a NIC handle. Billing is forced to the customer code by the server and is not exposed.
      properties:
        admin:
          type: string
          description: Administrative contact, given as an OVH NIC handle (e.g. xxxxx-ovh). Defaults to the calling customer's NIC if omitted.
          nullable: true
        owner:
          description: Owner contact of the domain. Unlike admin/tech which are NIC handles, the owner is an OVH contact resource referenced by its numeric id.
          nullable: true
          type: object
          properties:
            id:
              type: integer
              description: Numeric identifier of the OVH contact resource (e.g. obtained from /me/contact). Distinct from a NIC handle such as xxxxx-ovh.
              nullable: true
        tech:
          type: string
          description: Technical contact, given as an OVH NIC handle (e.g. xxxxx-ovh). Defaults to the admin contact if omitted.
