openapi: 3.0.0
info:
  title: OVHcloud Video Center API
  description: Video Center resources.
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/videocenter
paths:
  /videocenter/resource:
    get:
      operationId: getAllVideocenterServices
      summary: Get all services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllVideocenterServicesResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Video Center
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: videocenter:apiovh:service/get
          required: true
      x-expanded-response: VideocenterServiceWithIAM
      description: Get all services (Alpha version)
  /videocenter/resource/{serviceId}:
    get:
      operationId: getVideocenterService
      summary: Get a service
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/videocenter.ServiceWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Video Center
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: videocenter:apiovh:service/get
          required: true
      description: Get a service (Alpha version)
  /videocenter/resource/{serviceId}/auth/token:
    post:
      operationId: createVideocenterAuthToken
      summary: Generate an Auth Token
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/videocenter.AuthTokenRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/videocenter.AuthTokenResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Video Center
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: videocenter:apiovh:service/auth/token
          required: true
      description: Generate an Auth Token (Alpha version)
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value. Defaults to `EQ`.
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    videocenter.ServiceWithIAM:
      type: object
      description: Video public service
      properties:
        currentState:
          description: What the service currently holds and how much of its offer is used
          readOnly: true
          type: object
          properties:
            createdAt:
              type: string
              description: Creation date of the service
              format: date-time
              readOnly: true
            offerName:
              type: string
              description: Commercial offer the service runs on, which sets the video count and duration it is allowed
              readOnly: true
            vodCount:
              description: Video count
              readOnly: true
              type: object
              properties:
                allocated:
                  type: integer
                  description: The total number of hosted videos (actual usage)
                  readOnly: true
                hostable:
                  type: integer
                  description: The total number of hostable videos (maximum capacity)
                  readOnly: true
            vodDurationMinutes:
              description: Video duration minutes
              readOnly: true
              type: object
              properties:
                allocated:
                  type: number
                  description: The total used duration of video (actual usage)
                  readOnly: true
                hostable:
                  type: integer
                  description: The total number of hostable minutes of videos (maximum capacity)
                  readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        id:
          type: string
          description: Unique identifier of the service
          format: uuid
          readOnly: true
        resourceStatus:
          description: Whether the service is ready to use, still being set up, or in error
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
    videocenter.AuthTokenRequest:
      type: object
      description: Request for a token granting access to the video player
      properties:
        language:
          type: string
          description: Language the player interface and its messages should be shown in
      required:
        - language
    videocenter.AuthTokenResponse:
      type: object
      description: Token granting access to the video player
      properties:
        token:
          type: string
          description: JWT
          readOnly: true
    iam.resource.TagFilter.OperatorEnum:
      type: string
      description: Operator that can be used in order to filter resources tags
      enum:
        - EQ
        - EXISTS
        - ILIKE
        - LIKE
        - NEQ
        - NEXISTS
    videocenter.ServiceCurrentState:
      type: object
      description: Current state of a public service
      properties:
        createdAt:
          type: string
          description: Creation date of the service
          format: date-time
          readOnly: true
        offerName:
          type: string
          description: Commercial offer the service runs on, which sets the video count and duration it is allowed
          readOnly: true
        vodCount:
          description: Video count
          readOnly: true
          type: object
          properties:
            allocated:
              type: integer
              description: The total number of hosted videos (actual usage)
              readOnly: true
            hostable:
              type: integer
              description: The total number of hostable videos (maximum capacity)
              readOnly: true
        vodDurationMinutes:
          description: Video duration minutes
          readOnly: true
          type: object
          properties:
            allocated:
              type: number
              description: The total used duration of video (actual usage)
              readOnly: true
            hostable:
              type: integer
              description: The total number of hostable minutes of videos (maximum capacity)
              readOnly: true
    iam.ResourceMetadata:
      type: object
      description: IAM resource metadata embedded in services models
      properties:
        displayName:
          type: string
          description: Resource display name
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the resource
          format: uuid
          readOnly: true
        state:
          description: Resource state
          nullable: true
          readOnly: true
          type: string
          enum:
            - EXPIRED
            - IN_CREATION
            - OK
            - SUSPENDED
        tags:
          type: object
          description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
          nullable: true
          additionalProperties:
            type: string
          readOnly: true
        urn:
          type: string
          description: Unique resource name used in policies
          readOnly: true
    common.ResourceStatusEnum:
      type: string
      description: Current status of a resource
      enum:
        - CREATING
        - CREATION_PLANNED
        - DELETING
        - ERROR
        - OUT_OF_SYNC
        - READY
        - SUSPENDED
        - UNKNOWN
        - UPDATING
    videocenter.ServiceCurrentStateVodCount:
      type: object
      description: Video count of current state
      properties:
        allocated:
          type: integer
          description: The total number of hosted videos (actual usage)
          readOnly: true
        hostable:
          type: integer
          description: The total number of hostable videos (maximum capacity)
          readOnly: true
    videocenter.ServiceCurrentStateVodDurationMinutes:
      type: object
      description: Video duration minutes of current state
      properties:
        allocated:
          type: number
          description: The total used duration of video (actual usage)
          readOnly: true
        hostable:
          type: integer
          description: The total number of hostable minutes of videos (maximum capacity)
          readOnly: true
    iam.ResourceMetadata.StateEnum:
      type: string
      description: Resource state
      enum:
        - EXPIRED
        - IN_CREATION
        - OK
        - SUSPENDED
    GetAllVideocenterServicesResponse:
      type: object
      properties:
        videocenter_services:
          type: array
          items:
            $ref: '#/components/schemas/videocenter.ServiceWithIAM'
  x-stackQL-resources:
    resources:
      id: ovh.videocenter.resources
      name: resources
      title: Resources
      methods:
        list:
          operation:
            $ref: '#/paths/~1videocenter~1resource/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.videocenter_services
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/GetAllVideocenterServicesResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"videocenter_services\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1videocenter~1resource~1{serviceId}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        auth_token:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1videocenter~1resource~1{serviceId}~1auth~1token/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/resources/methods/get'
          - $ref: '#/components/x-stackQL-resources/resources/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v2
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
