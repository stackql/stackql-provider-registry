openapi: 3.0.0
info:
  title: OVHcloud Logs Data Platform API
  description: 'Logs Data Platform services: streams, dashboards, indices, aliases, inputs, roles, tokens and clusters.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/dbaas/logs
paths:
  /dbaas/logs:
    get:
      summary: List Logs Data Platform services
      description: Returns the Logs Data Platform services of the account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dbaas_logsResponse'
      x-developer-hub-navigation:
        - - Manage & Operate
          - Logs Data Platform
          - Service@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ldp:apiovh:get
          required: true
      x-expanded-response: DbaasLogsServiceWithIAM
      operationId: get_v1_dbaas_logs
  /dbaas/logs/{serviceName}:
    get:
      summary: Get a Logs Data Platform service
      description: Returns the Logs Data Platform service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.ServiceWithIAM'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::ServiceNotFound:
                  value:
                    class: Client::NotFound::ServiceNotFound
                    message: Cannot find service, neither 'serviceId' nor 'serviceName' found
      x-developer-hub-navigation:
        - - Manage & Operate
          - Logs Data Platform
          - Service@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ldp:apiovh:get
          required: true
      operationId: get_v1_dbaas_logs_service_name
    put:
      summary: Update a Logs Data Platform service
      description: Updates the Logs Data Platform service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dbaas.logs.Update'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.Operation'
        '403':
          description: Error 403 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Forbidden::Busy:
                  value:
                    class: Client::Forbidden::Busy
                    message: 'An operation is already running for this service: {{.operations}}. Please retry later.'
                Client::Forbidden::IAMNoRevert:
                  value:
                    class: Client::Forbidden::IAMNoRevert
                    message: IAM has been already enabled on this service, you can't disable it.
                Client::Forbidden::IAMNotAllowed:
                  value:
                    class: Client::Forbidden::IAMNotAllowed
                    message: IAM migration is not allowed for this service
                Client::Forbidden::ServiceEligibilityIAM:
                  value:
                    class: Client::Forbidden::ServiceEligibilityIAM
                    message: This service still has {{.nb}} {{.type}}(s), please delete them before migrating
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::ServiceNotFound:
                  value:
                    class: Client::NotFound::ServiceNotFound
                    message: Cannot find service, neither 'serviceId' nor 'serviceName' found
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::ServiceAlreadyMigrated:
                  value:
                    class: Client::Conflict::ServiceAlreadyMigrated
                    message: Service already migrated, nothing to do!
      x-developer-hub-navigation:
        - - Manage & Operate
          - Logs Data Platform
          - Service@@@80
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ldp:apiovh:edit
          required: true
      operationId: put_v1_dbaas_logs_service_name
