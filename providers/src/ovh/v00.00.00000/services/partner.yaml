openapi: 3.0.0
info:
  title: OVHcloud Partner API
  description: Partner program registration.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/partner
paths:
  /partner:
    get:
      summary: Get partner status
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/partner2.Partner'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::PartnerNotFound:
                  value:
                    class: Client::NotFound::PartnerNotFound
                    message: Partner not found
        '500':
          description: Error 500 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Server::InternalServerError::PartnerError:
                  value:
                    class: Server::InternalServerError::PartnerError
                    message: Internal Server Error
      x-developer-hub-navigation:
        - - Misc
          - Partner
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:partner/get
          required: true
      operationId: get_v1_partner
      description: Get partner status
    post:
      summary: Register as a partner
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/partner2.Partner'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Misc
          - Partner
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:partner/create
          required: true
      operationId: post_v1_partner
      description: Register as a partner
