components:
  schemas:
    cloud.ColdArchiveContainer:
      type: object
      description: Container
      properties:
        automaticDeletionAt:
          type: string
          description: After restoring your archive, date when the restored files will be deleted
          nullable: true
          format: date-time
          readOnly: true
        createdAt:
          type: string
          description: The date when the resource was created
          format: date-time
          readOnly: true
        lockedUntil:
          type: string
          description: Archive is locked (cannot be deleted) until this date
          nullable: true
          format: date-time
          readOnly: true
        name:
          type: string
          description: Container name
          readOnly: true
        objects:
          type: array
          description: Container objects (deprecated)
          items:
            $ref: '#/components/schemas/cloud.StorageObjectList'
          readOnly: true
        objectsCount:
          type: integer
          description: Container total objects count
          readOnly: true
        objectsSize:
          type: integer
          description: Container total objects size (bytes)
          readOnly: true
        ownerId:
          type: integer
          description: Container owner user ID
          readOnly: true
        status:
          description: ColdArchive status
          readOnly: true
          type: string
          enum:
            - archived
            - archiving
            - deleting
            - flushed
            - none
            - restored
            - restoring
        virtualHost:
          type: string
          description: Container virtual host
          readOnly: true
    cloud.StorageContainerCreation:
      type: object
      description: Create an object storage container.
      properties:
        encryption:
          description: Encryption configuration.
          nullable: true
          type: object
          properties:
            sseAlgorithm:
              description: Encryption algorithm.
              nullable: true
              type: string
              enum:
                - AES256
                - plaintext
        lifecycle:
          description: Lifecycle configuration
          nullable: true
          type: object
          properties:
            rules:
              type: array
              description: Lifecycle rules
              nullable: true
              items:
                $ref: '#/components/schemas/cloud.storage.LifecycleRule'
          required:
            - rules
        name:
          type: string
          description: Container name.
        objectLock:
          description: Object lock configuration.
          nullable: true
          type: object
          properties:
            rule:
              description: Object lock default rule.
              nullable: true
              type: object
              properties:
                mode:
                  description: Object lock mode.
                  type: string
                  enum:
                    - compliance
                    - governance
                period:
                  type: string
                  description: The retention period that the default retention configuration must apply.
                  format: duration
            status:
              description: Object lock status.
              type: string
              enum:
                - disabled
                - enabled
        ownerId:
          type: integer
          description: Container owner user ID.
          nullable: true
        replication:
          description: Replication configuration.
          nullable: true
          type: object
          properties:
            rules:
              type: array
              description: Replication rules.
              nullable: true
              items:
                $ref: '#/components/schemas/cloud.storage.ReplicationRuleIn'
        tags:
          type: object
          description: Container tags.
          nullable: true
          additionalProperties:
            type: string
        versioning:
          description: Versioning configuration.
          nullable: true
          type: object
          properties:
            status:
              description: Versioning status.
              nullable: true
              type: string
              enum:
                - disabled
                - enabled
                - suspended
      required:
        - name
    cloud.storage.ArchiveColdArchiveContainer:
      type: object
      description: Archive a ColdArchiveContainer
      properties:
        lockedUntilDays:
          type: integer
          description: Archive is locked (cannot be deleted) for the given number of days
          nullable: true
    cloud.storage.AddContainerPolicy:
      type: object
      description: Add storage policy for container
      properties:
        objectKey:
          type: string
          description: Container object key
        roleName:
          description: Policy role
          type: string
          enum:
            - admin
            - deny
            - readOnly
            - readWrite
      required:
        - roleName
    cloud.storage.PresignedURLInput:
      type: object
      description: Inputs to generate a presigned URL.
      properties:
        expire:
          type: integer
          description: URL expiration in seconds.
        method:
          description: Presigned URL method.
          type: string
          enum:
            - DELETE
            - GET
            - PUT
        object:
          type: string
          description: Object key.
        storageClass:
          description: When using PUT method, specifies the created object storage class.
          type: string
          enum:
            - DEEP_ARCHIVE
            - GLACIER_IR
            - HIGH_PERF
            - STANDARD
            - STANDARD_IA
        versionId:
          type: string
          description: Version ID of the object to download or delete when using GET or DELETE methods.
    cloud.storage.PresignedURL:
      type: object
      description: Presigned URL.
      properties:
        method:
          description: Presigned URL method.
          readOnly: true
          type: string
          enum:
            - DELETE
            - GET
            - PUT
        signedHeaders:
          type: object
          description: Signed headers.
          additionalProperties:
            type: string
          readOnly: true
        url:
          type: string
          description: Presigned URL.
          readOnly: true
    cloud.share.Share:
      type: object
      description: Share
      properties:
        availabilityZone:
          type: string
          description: Availability zone
          nullable: true
          readOnly: true
        capabilities:
          type: array
          description: Share capabilities
          nullable: true
          items:
            $ref: '#/components/schemas/cloud.share.Capability'
          readOnly: true
        createdAt:
          type: string
          description: The date and timestamp when the resource was created
          format: date-time
          readOnly: true
        description:
          type: string
          description: Share description
          readOnly: true
        encryption:
          description: Encryption settings, null when the share is not encrypted
          nullable: true
          readOnly: true
          type: object
          properties:
            encrypted:
              type: boolean
              description: Create the share encrypted (auto-derives a LUKS share type)
        exportLocations:
          type: array
          description: Share export locations
          nullable: true
          items:
            $ref: '#/components/schemas/cloud.share.ExportLocationObject'
          readOnly: true
        id:
          type: string
          description: Share ID
          format: uuid
          readOnly: true
        isPublic:
          type: boolean
          description: Whether the share is public
          readOnly: true
        name:
          type: string
          description: Share name
          readOnly: true
        networkId:
          type: string
          description: Private network ID
          nullable: true
          format: uuid
          readOnly: true
        protocol:
          description: Share protocol
          readOnly: true
          type: string
          enum:
            - NFS
        region:
          type: string
          description: Region
          readOnly: true
        shareNetworkId:
          type: string
          description: Share network ID
          nullable: true
          format: uuid
          readOnly: true
        size:
          type: integer
          description: Share size in GB
          readOnly: true
        status:
          description: Share status
          readOnly: true
          type: string
          enum:
            - available
            - awaiting_transfer
            - backup_creating
            - backup_restoring
            - backup_restoring_error
            - creating
            - creating_from_snapshot
            - deleted
            - deleting
            - error
            - error_deleting
            - extending
            - extending_error
            - inactive
            - manage_error
            - manage_starting
            - migrating
            - migrating_to
            - replication_change
            - reverting
            - reverting_error
            - shrinking
            - shrinking_error
            - shrinking_possible_data_loss_error
            - unmanage_error
            - unmanage_starting
            - unmanaged
        subnetId:
          type: string
          description: Subnet ID
          nullable: true
          format: uuid
          readOnly: true
        type:
          description: Share type
          readOnly: true
          type: string
          enum:
            - standard-1az
            - standard-1az-luks
    cloud.share.Share.Create:
      type: object
      description: Create a share
      properties:
        availabilityZone:
          type: string
          description: Availability zone for the share (required in 3AZ regions)
          nullable: true
        description:
          type: string
          description: Share description
          nullable: true
        encryption:
          description: Optional encryption settings. Omit for an unencrypted share.
          nullable: true
          type: object
          properties:
            encrypted:
              type: boolean
              description: Create the share encrypted (auto-derives a LUKS share type)
        name:
          type: string
          description: Share name
          nullable: true
        networkId:
          type: string
          description: Network ID (required unless shareNetworkId is set)
          nullable: true
          format: uuid
        shareNetworkId:
          type: string
          description: Existing share network ID (alternative to networkId/subnetId)
          nullable: true
          format: uuid
        size:
          type: integer
          description: Share size in GB
        snapshotId:
          type: string
          description: Snapshot ID to create the share from
          nullable: true
          format: uuid
        subnetId:
          type: string
          description: Subnet ID (required unless shareNetworkId is set)
          nullable: true
          format: uuid
        type:
          description: Share type
          type: string
          enum:
            - standard-1az
            - standard-1az-luks
      required:
        - type
