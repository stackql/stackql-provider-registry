openapi: 3.0.0
info:
  title: OVHcloud AllDom API
  description: 'AllDom domain name packs: packs, their domains and service information.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/allDom
paths:
  /allDom:
    get:
      operationId: getAllDoms
      summary: List available AllDom services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllDomsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Domains
          - AllDom@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: alldom:apiovh:get
          required: true
      x-expanded-response: AllDomAllDomServiceWithIAM
      description: List available AllDom services
  /allDom/{serviceName}:
    get:
      operationId: getAllDom
      summary: Get this AllDom properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/allDom.AllDomServiceWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Domains
          - AllDom@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: alldom:apiovh:get
          required: true
      description: Get this AllDom properties
  /allDom/{serviceName}/domain:
    get:
      operationId: getAllDomDomains
      summary: List all domains attached to this allDom
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: domain
          description: Filter the value of domain property (like)
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllDomDomainsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Domains
          - AllDom@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: alldom:apiovh:domain/get
          required: true
      x-expanded-response: AllDomDomain
      description: List all domains attached to this allDom
  /allDom/{serviceName}/domain/{domain}:
    get:
      operationId: getAllDomDomain
      summary: Get this AllDom domain properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: domain
          description: Domain
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/allDom.Domain'
      x-developer-hub-navigation:
        - - Web Cloud
          - Domains
          - AllDom@@@80
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: alldom:apiovh:domain/get
          required: true
      x-response-identifier: domain
      description: Get this AllDom domain properties
  /allDom/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Web Cloud
          - Domains
          - AllDom@@@90
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: alldom:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_all_dom_service_name_service_infos
      description: Get service information
    put:
      summary: Update service information
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Domains
          - AllDom@@@100
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: alldom:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_all_dom_service_name_service_infos
      description: Update service information
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    allDom.AllDomServiceWithIAM:
      type: object
      description: General information about a alldom service
      properties:
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        name:
          type: string
          description: Name of the allDom
          readOnly: true
        offer:
          description: Offer of the allDom
          readOnly: true
          type: string
          enum:
            - diamond
            - gold
            - platinum
        type:
          description: Type of the allDom
          readOnly: true
          type: string
          enum:
            - french
            - french+international
            - international
    allDom.Domain:
      type: object
      description: Domain name of a allDom
      properties:
        domain:
          type: string
          description: Domain name
          readOnly: true
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - manual
            - oneShot
            - option
        serviceId:
          type: integer
          readOnly: true
        status:
          readOnly: true
          type: string
          description: service.StateEnum
          enum:
            - autorenewInProgress
            - expired
            - inCreation
            - ok
            - pendingDebt
            - unPaid
    iam.resource.TagFilter.OperatorEnum:
      type: string
      description: Operator that can be used in order to filter resources tags
      enum:
        - EQ
        - EXISTS
        - ILIKE
        - LIKE
        - NEQ
        - NEXISTS
    iam.ResourceMetadata:
      type: object
      description: IAM resource metadata embedded in services models
      properties:
        displayName:
          type: string
          description: Resource display name
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the resource
          format: uuid
          readOnly: true
        state:
          description: Resource state
          nullable: true
          readOnly: true
          type: string
          enum:
            - EXPIRED
            - IN_CREATION
            - OK
            - SUSPENDED
        tags:
          type: object
          description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
          nullable: true
          additionalProperties:
            type: string
          readOnly: true
        urn:
          type: string
          description: Unique resource name used in policies
          readOnly: true
    allDom.OfferEnum:
      type: string
      description: Offer of the allDom
      enum:
        - diamond
        - gold
        - platinum
    allDom.TypeEnum:
      type: string
      description: Type of the allDom
      enum:
        - french
        - french+international
        - international
    service.RenewType:
      type: object
      description: Map a possible renew for a specific service
      properties:
        automatic:
          type: boolean
          description: The service is automatically renewed
        deleteAtExpiration:
          type: boolean
          description: The service will be deleted at expiration
        forced:
          type: boolean
          description: The service forced to be renewed
        manualPayment:
          type: boolean
          description: The service needs to be manually renewed and paid
          nullable: true
        period:
          type: integer
          description: period of renew in month
          nullable: true
    service.RenewalTypeEnum:
      type: string
      description: Detailed renewal type of a service
      enum:
        - automaticForcedProduct
        - automaticV2012
        - automaticV2014
        - automaticV2016
        - manual
        - oneShot
        - option
    service.StateEnum:
      type: string
      description: service.StateEnum
      enum:
        - autorenewInProgress
        - expired
        - inCreation
        - ok
        - pendingDebt
        - unPaid
    iam.ResourceMetadata.StateEnum:
      type: string
      description: Resource state
      enum:
        - EXPIRED
        - IN_CREATION
        - OK
        - SUSPENDED
    GetAllDomsResponse:
      type: object
      properties:
        doms:
          type: array
          items:
            $ref: '#/components/schemas/allDom.AllDomServiceWithIAM'
    GetAllDomDomainsResponse:
      type: object
      properties:
        dom_domains:
          type: array
          items:
            $ref: '#/components/schemas/allDom.Domain'
  x-stackQL-resources:
    all_doms:
      id: ovh.all_dom.all_doms
      name: all_doms
      title: All Doms
      methods:
        list:
          operation:
            $ref: '#/paths/~1allDom/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.doms
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/GetAllDomsResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"doms\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1allDom~1{serviceName}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/all_doms/methods/get'
          - $ref: '#/components/x-stackQL-resources/all_doms/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    domains:
      id: ovh.all_dom.domains
      name: domains
      title: Domains
      methods:
        list:
          operation:
            $ref: '#/paths/~1allDom~1{serviceName}~1domain/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.dom_domains
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/GetAllDomDomainsResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"dom_domains\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1allDom~1{serviceName}~1domain~1{domain}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/domains/methods/get'
          - $ref: '#/components/x-stackQL-resources/domains/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    service_infos:
      id: ovh.all_dom.service_infos
      name: service_infos
      title: Service Infos
      methods:
        get:
          operation:
            $ref: '#/paths/~1allDom~1{serviceName}~1serviceInfos/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1allDom~1{serviceName}~1serviceInfos/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/service_infos/methods/get'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/service_infos/methods/update'
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v1
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
