openapi: 3.0.0
info:
  title: OVHcloud Locations API
  description: 'OVHcloud locations: regions, availability zones and their attributes.'
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/location
paths:
  /location:
    get:
      operationId: getAllLocations
      summary: List available regions and their availability zones
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: availabilityZone
          description: Filter by availability zone. Returns locations having this availability zone.
          schema:
            type: string
        - in: query
          name: cityCode
          description: Filter by city ISO code
          schema:
            type: string
        - in: query
          name: cityName
          description: Filter by city name
          schema:
            type: string
        - in: query
          name: code
          description: Filter by region code
          schema:
            type: string
        - in: query
          name: countryCode
          description: Filter by country ISO code
          schema:
            type: string
        - in: query
          name: countryName
          description: Filter by country name
          schema:
            type: string
        - in: query
          name: datacenter
          description: Filter by datacenter
          schema:
            type: string
        - in: query
          name: geographyCode
          description: Filter by geography code
          schema:
            type: string
        - in: query
          name: geographyName
          description: Filter by geography name
          schema:
            type: string
        - in: query
          name: ids
          description: Filter by region IDs
          schema:
            type: array
            items:
              type: integer
        - in: query
          name: language
          description: Locale name for translation
          schema:
            $ref: '#/components/schemas/common.LanguageEnum'
        - in: query
          name: location
          description: Filter by region location
          schema:
            type: string
        - in: query
          name: name
          description: Filter by region name
          schema:
            type: string
        - in: query
          name: services
          description: Filter by services. Returns locations having at least one of the services in the list.
          schema:
            $ref: '#/components/schemas/location.ServicesEnum'
        - in: query
          name: specificType
          description: Filter by specific region type
          schema:
            $ref: '#/components/schemas/location.SpecificTypeEnum'
        - in: query
          name: status
          description: Filter by status
          schema:
            $ref: '#/components/schemas/location.StatusEnum'
        - in: query
          name: type
          description: Filter by general region type
          schema:
            $ref: '#/components/schemas/location.TypeEnum'
        - in: query
          name: withNonOperational
          description: also return NON_OPERATIONAL regions that are planned
          schema:
            type: boolean
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllLocationsResponse'
      x-developer-hub-navigation:
        - - Manage & Operate
          - Locations
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: name
      x-expanded-response: LocationLocation
      description: List available regions and their availability zones
  /location/{name}:
    get:
      operationId: getLocation
      summary: Get available region and its availability zones
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/location.Location'
              examples:
                Get available region and its availability zones example:
                  value:
                    availabilityZoneDatacenters:
                      eu-west-par-a:
                        - par1
                      eu-west-par-b:
                        - par2
                      eu-west-par-c:
                        - par3
                    availabilityZones:
                      - eu-west-par-a
                      - eu-west-par-b
                      - eu-west-par-c
                    cardinalPoint: WEST
                    cityCode: PAR
                    cityLatitude: 48.85
                    cityLongitude: 2.35
                    cityName: Paris
                    code: par
                    countryCode: FR
                    countryName: France
                    geographyCode: eu
                    geographyName: Europe
                    location: Europe (France - Paris)
                    name: eu-west-par
                    openingYear: 2023
                    services:
                      - OCC
                      - PEERING
                    specificType: BACKUP
                    status: OPERATIONAL
                    type: REGION-3-AZ
      x-developer-hub-navigation:
        - - Manage & Operate
          - Locations
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: name
      description: Get available region and its availability zones
components:
  schemas:
    common.LanguageEnum:
      type: string
      description: Language and locale, as a language-country code
      enum:
        - cs_CZ
        - de_DE
        - en_AS
        - en_AU
        - en_CA
        - en_GB
        - en_IE
        - en_IN
        - en_SG
        - en_US
        - en_WW
        - es_ES
        - es_SA
        - fi_FI
        - fr_CA
        - fr_FR
        - fr_MA
        - fr_SN
        - fr_TN
        - it_IT
        - lt_LT
        - nl_NL
        - pl_PL
        - pt_PT
    location.ServicesEnum:
      type: string
      description: Services available in the region
      enum:
        - OCC
        - PEERING
    location.SpecificTypeEnum:
      type: string
      description: Typology of the region for non-standard types
      enum:
        - BACKUP
        - LZ
        - SNC
        - STANDARD
    location.StatusEnum:
      type: string
      description: Operational status of the region
      enum:
        - NON_OPERATIONAL
        - OPERATIONAL
    location.TypeEnum:
      type: string
      description: Typology of the region
      enum:
        - LOCAL-ZONE
        - REGION-1-AZ
        - REGION-3-AZ
    location.Location:
      type: object
      description: Region and its availability zones
      properties:
        availabilityZoneDatacenters:
          type: object
          description: List of datacenters by availability zone
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
          readOnly: true
        availabilityZones:
          type: array
          description: List of availability zones for the region
          nullable: true
          items:
            type: string
          readOnly: true
        cardinalPoint:
          type: string
          description: Localized cardinal direction where the region is located. The value depends on the language query parameter.
          readOnly: true
        cityCode:
          type: string
          description: ISO code of the city
          readOnly: true
        cityLatitude:
          type: number
          description: Geographical latitude of the city
          readOnly: true
        cityLongitude:
          type: number
          description: Geographical longitude of the city
          readOnly: true
        cityName:
          type: string
          description: Full name of the city
          readOnly: true
        code:
          type: string
          description: Region's short code
          readOnly: true
        countryCode:
          type: string
          description: ISO code of the country
          readOnly: true
        countryName:
          type: string
          description: Full name of the country
          readOnly: true
        geographyCode:
          type: string
          description: Short code representing the geographical area
          readOnly: true
        geographyName:
          type: string
          description: Name of the geographical area
          readOnly: true
        location:
          type: string
          description: Location of the region
          readOnly: true
        name:
          type: string
          description: Name of the region
          readOnly: true
        openingYear:
          type: integer
          description: Year the region was opened
          readOnly: true
        services:
          type: array
          description: List of services available in the region
          items:
            $ref: '#/components/schemas/location.ServicesEnum'
          readOnly: true
        specificType:
          description: Specific typology of the region
          readOnly: true
          type: string
          enum:
            - BACKUP
            - LZ
            - SNC
            - STANDARD
        status:
          description: Operational status of the region
          readOnly: true
          type: string
          enum:
            - NON_OPERATIONAL
            - OPERATIONAL
        type:
          description: General typology of the region
          readOnly: true
          type: string
          enum:
            - LOCAL-ZONE
            - REGION-1-AZ
            - REGION-3-AZ
    GetAllLocationsResponse:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/location.Location'
  x-stackQL-resources:
    locations:
      id: ovh.location.locations
      name: locations
      title: Locations
      methods:
        list:
          operation:
            $ref: '#/paths/~1location/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.locations
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/GetAllLocationsResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"locations\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1location~1{name}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/locations/methods/get'
          - $ref: '#/components/x-stackQL-resources/locations/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v2
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
