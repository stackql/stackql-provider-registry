openapi: 3.0.0
info:
  title: OVHcloud SMS API
  description: 'SMS accounts: senders, outgoing and incoming messages, jobs, phonebooks, templates, users, HLR lookups and virtual numbers.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/sms
paths:
  /sms:
    get:
      summary: List SMS accounts
      description: List SMS accounts. Returns the service names of the SMS accounts of the customer. Get an SMS account for its status, credits left and settings.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_smsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Account@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:get
          required: true
      x-expanded-response: SmsAccountWithIAM
      operationId: get_v1_sms
  /sms/estimate:
    post:
      summary: Estimate a message
      description: Estimate a message. Returns the encoding, the length and the number of SMS parts needed to send a text message.
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The message to send
                noStopClause:
                  type: boolean
                  description: Do not display STOP clause in the message, this requires that this is not an advertising message
                senderType:
                  description: Sender type that will be used to send the message
                  $ref: '#/components/schemas/sms.TypeSenderEnum'
              required:
                - message
                - noStopClause
                - senderType
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.JobEstimate'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Send & Receive@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:sms/estimate
          required: true
      operationId: post_v1_sms_estimate
  /sms/ptts:
    get:
      summary: Get a PTT code
      description: Get a PTT code. Returns the meaning of a PTT code. The PTT code is the delivery status code of an SMS, given in the ptt field of sent SMS and pending jobs.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: ptt
          description: The premium transaction tracking code
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.PttDetails'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Send & Receive
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_sms_ptts
  /sms/rates/destinations:
    get:
      summary: Get rates for a country
      description: Get rates for a country. Returns the credits consumed and the price of one SMS sent to a country, for credits bought in the billing country, with the VAT rate.
      parameters:
        - in: query
          name: billingCountry
          description: Country where you buy credits
          schema:
            $ref: '#/components/schemas/sms.BillingCountryEnum'
        - in: query
          name: country
          description: Country where you send SMS
          required: true
          schema:
            $ref: '#/components/schemas/sms.CountryEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.DestinationRates'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Account@@@10
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_sms_rates_destinations
  /sms/rates/packs:
    get:
      summary: List SMS pack prices
      description: 'List SMS pack prices. Returns the SMS packs that can be bought for a destination country: credit and SMS quantities, prices, discount and VAT rate.'
      parameters:
        - in: query
          name: billingCountry
          description: Country where you buy credits
          schema:
            $ref: '#/components/schemas/sms.BillingCountryEnum'
        - in: query
          name: country
          description: Country where you send SMS
          required: true
          schema:
            $ref: '#/components/schemas/sms.CountryEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_sms_rates_packsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Account@@@10
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_sms_rates_packs
  /sms/virtualNumbers:
    get:
      summary: List virtual numbers
      description: List virtual numbers. Returns the virtual numbers of the customer, as services. A virtual number receives SMS and lets receivers reply to the messages sent.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_sms_virtual_numbersResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - SMS Virtual Numbers@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: smsVirtualNumbers:apiovh:get
          required: true
      x-expanded-response: SmsVirtualNumberGenericServiceWithIAM
      operationId: get_v1_sms_virtual_numbers
  /sms/virtualNumbers/{number}:
    get:
      summary: Get a virtual number service
      description: Get a virtual number service. Returns the virtual number service, with the number and the ISO code of its country.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: number
          description: Your virtual number
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.VirtualNumberGenericServiceWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - SMS Virtual Numbers@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: smsVirtualNumbers:apiovh:get
          required: true
      operationId: get_v1_sms_virtual_numbers_number
  /sms/virtualNumbers/{number}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: number
          description: Your virtual number
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - SMS Virtual Numbers@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: smsVirtualNumbers:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_sms_virtual_numbers_number_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: number
          description: Your virtual number
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - SMS Virtual Numbers@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: smsVirtualNumbers:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_sms_virtual_numbers_number_service_infos
  /sms/{serviceName}:
    get:
      summary: Get an SMS account
      description: 'Get an SMS account. Returns the SMS account: status, credits left, callback URLs, automatic recredit settings and channel.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.AccountWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Account@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:get
          required: true
      operationId: get_v1_sms_service_name
    put:
      summary: Update an SMS account
      description: Update an SMS account. Updates the SMS account settings, such as the callback URLs, the templates and the automatic recredit.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sms.Account'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Account@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:put
          required: true
      operationId: put_v1_sms_service_name
  /sms/{serviceName}/batches:
    get:
      summary: List batches
      description: Returns the batches of the SMS account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_sms_service_name_batchesResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Send & Receive
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:batches/get
          required: true
      x-response-identifier: id
      x-expanded-response: SmsBatch
      operationId: get_v1_sms_service_name_batches
    post:
      summary: Create a batch
      description: Creates a batch that sends one message to a list of receivers or to a receiver list. Set a sender, or ask for one that allows replies. Sending can be deferred to a later date.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sms.BatchParams'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.Batch'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Send & Receive
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:batches/create
          required: true
      operationId: post_v1_sms_service_name_batches
  /sms/{serviceName}/batches/{id}:
    delete:
      summary: Delete a batch
      description: Deletes the batch.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Send & Receive
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:batches/delete
          required: true
      operationId: delete_v1_sms_service_name_batches_id
    get:
      summary: Get a batch
      description: 'Returns the batch: message, sender, receivers, status, estimated credits and errors.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.Batch'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Send & Receive
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:batches/get
          required: true
      x-response-identifier: id
      operationId: get_v1_sms_service_name_batches_id
    put:
      summary: Update a batch
      description: Updates the batch name.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sms.BatchUpdateParams'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.Batch'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Send & Receive
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:batches/edit
          required: true
      operationId: put_v1_sms_service_name_batches_id
  /sms/{serviceName}/batches/{id}/cancel:
    post:
      summary: Cancel a deferred batch
      description: Cancels a batch scheduled for later. Only possible if no SMS of the batch has been sent yet.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.Batch'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Send & Receive
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:batches/cancel
          required: true
      operationId: post_v1_sms_service_name_batches_id_cancel
  /sms/{serviceName}/batches/{id}/statistics:
    get:
      summary: Get batch statistics
      description: 'Returns the batch statistics: delivered, sent, pending, failed and stoplisted SMS, and the credits used.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.BatchStatistics'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Send & Receive
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:batches/statistics/get
          required: true
      operationId: get_v1_sms_service_name_batches_id_statistics
  /sms/{serviceName}/blacklists:
    get:
      summary: List blacklisted numbers
      description: List blacklisted numbers. Returns the numbers that replied STOP and no longer receive SMS from the account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: batchID
          description: Filter the value of batchID property (=)
          schema:
            type: string
            format: uuid
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
        - in: query
          name: smsOutgoingID
          description: Filter the value of smsOutgoingID property (=)
          schema:
            type: integer
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_sms_service_name_blacklistsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Options@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:blacklists/get
          required: true
      x-expanded-response: SmsBlacklist
      operationId: get_v1_sms_service_name_blacklists
  /sms/{serviceName}/blacklists/{number}:
    delete:
      summary: Delete a blacklisted number
      description: Delete a blacklisted number. Removes the number from the blacklist of the account, so it can receive SMS from the account again.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: number
          description: The sms number blacklisted
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Options@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:blacklists/delete
          required: true
      operationId: delete_v1_sms_service_name_blacklists_number
    get:
      summary: Get a blacklisted number
      description: Get a blacklisted number. Returns a blacklisted number, the date it was added, and the sent SMS or batch whose STOP reply added it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: number
          description: The sms number blacklisted
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sms.Blacklist'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Options@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:blacklists/get
          required: true
      operationId: get_v1_sms_service_name_blacklists_number
  /sms/{serviceName}/document:
    get:
      summary: Export SMS to a document
      description: Export SMS to a document. Generates a document with the SMS of the account, filtered by tag, date, direction or batch. Returns the identifier of the document in /me/document.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: batchID
          description: Filter SMSs with their batch ID (outgoing SMSs only)
          schema:
            type: string
            format: uuid
        - in: query
          name: creationDatetime.from
          description: Filter the value of creationDatetime property (>=)
          schema:
            type: string
            format: date-time
        - in: query
          name: creationDatetime.to
          description: Filter the value of creationDatetime property (<=)
          schema:
            type: string
            format: date-time
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
        - in: query
          name: tag
          description: Select sms with a specific identifier group tag
          schema:
            type: string
        - in: query
          name: wayType
          description: specify outgoing or incoming sms
          required: true
          schema:
            $ref: '#/components/schemas/sms.DocumentWayTypeEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Account@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:document/get
          required: true
      operationId: get_v1_sms_service_name_document
      x-stackQL-scalarWrap:
        column: value
        type: string
  /sms/{serviceName}/exceptions:
    get:
      summary: List sending restrictions for a number
      description: List sending restrictions for a number. Returns the operator restrictions and substitutions that apply when sending SMS to the given number.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: receiver
          description: The receiver number to check
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_sms_service_name_exceptionsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Account@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:exceptions/get
          required: true
      operationId: get_v1_sms_service_name_exceptions
  /sms/{serviceName}/hlr:
    get:
      summary: List HLR lookups
      description: List HLR lookups. Returns the identifiers of the HLR lookups. An HLR lookup checks whether a mobile number is valid, reachable, ported or roaming.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your SMS offer
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_sms_service_name_hlrResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - SMS
          - Send & Receive@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: sms:apiovh:hlr/get
          required: true
      x-expanded-response: SmsHlrLookupNumber
      operationId: get_v1_sms_service_name_hlr
