components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    ovhcloudconnect.ServiceWithIAM:
      type: object
      description: OVHcloud Connect Service
      properties:
        bandwidth:
          description: Service bandwidth
          readOnly: true
          type: string
          enum:
            - 100g
            - 100m
            - 10g
            - 1g
            - 200m
            - 20g
            - 2g
            - 500m
            - 50m
            - 5g
        description:
          type: string
          description: Service description
          readOnly: true
        family:
          type: string
          description: Service family
          nullable: true
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        interfaceList:
          type: array
          description: List of interfaces linked to a service
          items:
            type: integer
          readOnly: true
        pop:
          type: string
          description: Pop reference where the service is delivered
          readOnly: true
        portQuantity:
          description: Port quantity
          readOnly: true
          type: string
          enum:
            - '1'
            - '2'
        product:
          type: string
          description: Product name of the service
          readOnly: true
        provider:
          description: Service provider
          readOnly: true
          type: string
          enum:
            - OVHcloud
            - RISQ
            - consoleconnect
            - dcexp
            - digitalrealty
            - edge
            - equinix
            - fibrenoire
            - google
            - intercloud
            - internal
            - interxion
            - megaport
            - orange
        sector:
          type: string
          description: Service sector
          readOnly: true
        status:
          description: Service status
          readOnly: true
          type: string
          enum:
            - active
            - closed
        uuid:
          type: string
          description: Service UUID
          format: uuid
          readOnly: true
        vrack:
          type: string
          description: vrack linked to the service
          nullable: true
          readOnly: true
    ovhcloudconnect.Update:
      type: object
      description: Missing description
      properties:
        description:
          type: string
          description: New description for your service
          nullable: true
    services.changeContact:
      type: object
      description: Service change contact payload
      properties:
        contactAdmin:
          type: string
          description: The contact to set as admin contact
        contactBilling:
          type: string
          description: The contact to set as billing contact
        contactTech:
          type: string
          description: The contact to set as tech contact
    ovhcloudconnect.Task:
      type: object
      description: OVHcloud Connect Task
      properties:
        function:
          description: Task function
          readOnly: true
          type: string
          enum:
            - addDatacenterConfiguration
            - addDatacenterExtraConfiguration
            - addPopConfiguration
            - addVrack
            - consumePairingKey
            - delDatacenterConfiguration
            - delDatacenterExtraConfiguration
            - delPopConfiguration
            - deleteCircuit
            - diagAccessEdge
            - diagMacs
            - diagPeering
            - diagPeeringExtra
            - diagRoutes
            - lockInterface
            - removeVrack
            - resetEdgeConfiguration
            - unlockInterface
        id:
          type: integer
          description: Task id
          readOnly: true
        resourceId:
          type: integer
          description: Reference of the created resource
          readOnly: true
        status:
          description: Task status
          readOnly: true
          type: string
          enum:
            - denied
            - doing
            - done
            - error
            - pause
            - todo
    ovhcloudconnect.Circuit:
      type: object
      description: OVHcloud Connect Circuit
      properties:
        creationDate:
          type: string
          description: Creation date of the circuit
          format: date-time
          readOnly: true
        doneDate:
          type: string
          description: Date when the circuit was terminated
          nullable: true
          format: date-time
          readOnly: true
        id:
          type: integer
          description: Circuit id
          readOnly: true
        key:
          type: string
          description: Pairing key of the circuit
          nullable: true
          readOnly: true
        lastUpdate:
          type: string
          description: Last update date of the circuit
          nullable: true
          format: date-time
          readOnly: true
        name:
          type: string
          description: Circuit name
          readOnly: true
        operationalStatus:
          description: Operational status of the circuit
          readOnly: true
          type: string
          enum:
            - degraded
            - down
            - unknown
            - up
        status:
          description: Circuit status
          readOnly: true
          type: string
          enum:
            - active
            - pending
            - pending_customer
            - terminated
            - to_check
    ovhcloudconnect.PopConfig:
      type: object
      description: OVHcloud Connect Service Pop Configuration
      properties:
        customerBgpArea:
          type: integer
          description: Customer Private AS
          nullable: true
        id:
          type: integer
          description: ID of the Pop Configuration
          readOnly: true
        interfaceId:
          type: integer
          description: ID of the interface
        ovhBgpArea:
          type: integer
          description: OVH Private AS
          nullable: true
        status:
          description: Status of the pop configuration
          readOnly: true
          type: string
          enum:
            - active
            - init
            - toDelete
        subnet:
          description: Subnet should be a /30, first IP for OVH, second IP for customer
          nullable: true
          type: string
          format: ipv4-block
          example: 192.0.2.0/24
        type:
          description: Type of the pop configuration
          type: string
          enum:
            - l2
            - l3
      required:
        - interfaceId
        - type
    ovhcloudconnect.DatacenterConfig:
      type: object
      description: OVHcloud Connect Service Datacenter Configuration
      properties:
        datacenterId:
          type: integer
          description: ID of the datacenter linked
        id:
          type: integer
          description: ID of the Datacenter configuration
          readOnly: true
        ovhBgpArea:
          type: integer
          description: OVH Private AS
          nullable: true
        status:
          description: Status of the pop configuration
          readOnly: true
          type: string
          enum:
            - active
            - init
            - toDelete
        subnet:
          description: Subnet should be a /28 min
          nullable: true
          type: string
          format: ipv4-block
          example: 192.0.2.0/24
      required:
        - datacenterId
    ovhcloudconnect.DatacenterExtraConfig:
      type: object
      description: OVHcloud Connect Service Datacenter Extra Configuration
      properties:
        bgpNeighborArea:
          type: integer
          description: BGP AS number
          nullable: true
        bgpNeighborIp:
          description: Router IP for BGP
          nullable: true
          type: string
          format: ipv4
          example: 192.0.2.0
        id:
          type: integer
          description: 'ID of the extra configuration '
          readOnly: true
        nextHop:
          description: Static route next hop
          nullable: true
          type: string
          format: ipv4
          example: 192.0.2.0
        status:
          description: Status of the pop configuration
          readOnly: true
          type: string
          enum:
            - active
            - init
            - toDelete
        subnet:
          description: Static route ip
          nullable: true
          type: string
          format: ipv4-block
          example: 192.0.2.0/24
        type:
          description: Type of the configuration
          type: string
          enum:
            - bgp
            - network
      required:
        - type
    ovhcloudconnect.interface.MetricsPeriodEnum:
      type: string
      description: Enum values for the period of the statistics
      enum:
        - daily
        - hourly
        - weekly
    ovhcloudconnect.popConfig.MetricsTypeEnum:
      type: string
      description: Enum values for the type of the statistics
      enum:
        - prefix:accepted
        - prefix:limit
    ovhcloudconnect.Metrics:
      type: object
      description: OVHcloud Connect Metrics
      properties:
        timestamp:
          type: integer
          description: timestamp corresponding to the value
          readOnly: true
        value:
          readOnly: true
          type: object
          description: OVHcloud Connect Metrics value
          properties:
            unit:
              description: Unit in which the value is expressed
              readOnly: true
              type: string
              enum:
                - bits/s
                - bytes/s
                - dbm
                - error/s
                - prefix_accepted
                - prefix_limit
            value:
              type: number
              readOnly: true
    ovhcloudconnect.PopConfStatus:
      type: object
      description: OVHcloud Connect L3 peering current status
      properties:
        flapCount:
          type: number
          description: Number of flap since last UP
          nullable: true
          readOnly: true
        lastChange:
          type: string
          description: Last time the interface changed status
          nullable: true
          format: date-time
          readOnly: true
        lastDown:
          type: string
          description: Last time the interface status went from up to down
          nullable: true
          format: date-time
          readOnly: true
        lastFlap:
          type: string
          description: Last time the session flapped
          nullable: true
          format: date-time
          readOnly: true
        lastUp:
          type: string
          description: Last time the interface status went from down to up
          nullable: true
          format: date-time
          readOnly: true
        lastUpdate:
          type: string
          description: Last time the status was updated
          format: date-time
          readOnly: true
        status:
          description: Status of the peering
          readOnly: true
          type: string
          enum:
            - down
            - up
    services.confirmTermination:
      type: object
      description: Service confirm termination payload
      properties:
        commentary:
          type: string
          description: Commentary about your termination request
        commentaryFutureUse:
          type: string
          description: Commentary about your future use
        commentaryReason:
          type: string
          description: Commentary about your reason for termination request
        futureUse:
          description: All future uses you can provide for a service termination
          type: string
          enum:
            - NOT_REPLACING_SERVICE
            - OTHER
            - SUBSCRIBE_AN_OTHER_SERVICE
            - SUBSCRIBE_OTHER_KIND_OF_SERVICE_WITH_COMPETITOR
            - SUBSCRIBE_SIMILAR_SERVICE_WITH_COMPETITOR
        reason:
          description: All reasons you can provide for a service termination
          type: string
          enum:
            - FEATURES_DONT_SUIT_ME
            - LACK_OF_PERFORMANCES
            - MIGRATED_TO_ANOTHER_OVH_PRODUCT
            - MIGRATED_TO_COMPETITOR
            - NOT_ENOUGH_RECOGNITION
            - NOT_NEEDED_ANYMORE
            - NOT_RELIABLE
            - NO_ANSWER
            - OTHER
            - PRODUCT_DIMENSION_DONT_SUIT_ME
            - PRODUCT_TOOLS_DONT_SUIT_ME
            - TOO_EXPENSIVE
            - TOO_HARD_TO_USE
            - UNSATIFIED_BY_CUSTOMER_SUPPORT
        token:
          type: string
          description: The termination token sent by email to the admin contact
      required:
        - token
