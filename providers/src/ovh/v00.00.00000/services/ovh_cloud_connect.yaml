      operationId: get_v1_ovh_cloud_connect_service_name_circuit
  /ovhCloudConnect/{serviceName}/circuit/{id}:
    delete:
      summary: Delete circuit
      description: Dissociates the pairing key and removes the circuit (async task).
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ovhcloudconnect.Task'
      x-developer-hub-navigation:
        - - Network
          - OVHcloud Connect
          - 'Family : Provider@@@80'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ovhCloudConnect:apiovh:circuit/delete
          required: true
      operationId: delete_v1_ovh_cloud_connect_service_name_circuit_id
    get:
      summary: Get circuit
      description: Returns the circuit's pairing key, status and operational status.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ovhcloudconnect.Circuit'
      x-developer-hub-navigation:
        - - Network
          - OVHcloud Connect
          - 'Family : Provider@@@30'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ovhCloudConnect:apiovh:circuit/get
          required: true
      x-response-identifier: id
      operationId: get_v1_ovh_cloud_connect_service_name_circuit_id
