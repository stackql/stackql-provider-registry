            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_ovh_cloud_connect_service_name_circuitResponse'
      x-developer-hub-navigation:
        - - Network
          - OVHcloud Connect
          - 'Family : Provider@@@10'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ovhCloudConnect:apiovh:circuit/get
          required: true
