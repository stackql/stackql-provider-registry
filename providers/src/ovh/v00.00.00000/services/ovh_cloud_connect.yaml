openapi: 3.0.0
info:
  title: OVHcloud OVHcloud Connect API
  description: 'OVHcloud Connect services: point of presence and datacenter configurations, interfaces, service keys and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/ovhCloudConnect
paths:
  /ovhCloudConnect:
    get:
      summary: List services
      description: Returns the UUIDs of your OVHcloud Connect services, filterable by IAM tags.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_ovh_cloud_connectResponse'
      x-developer-hub-navigation:
        - - Network
          - OVHcloud Connect
          - Services@@@5
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ovhCloudConnect:apiovh:get
          required: true
      x-expanded-response: OvhcloudconnectServiceWithIAM
      operationId: get_v1_ovh_cloud_connect
  /ovhCloudConnect/{serviceName}:
    get:
      summary: Get service
      description: Returns the service's provider, PoP, bandwidth, port count, vRack and status.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ovhcloudconnect.ServiceWithIAM'
      x-developer-hub-navigation:
        - - Network
          - OVHcloud Connect
          - Services@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ovhCloudConnect:apiovh:get
          required: true
      operationId: get_v1_ovh_cloud_connect_service_name
    put:
      summary: Update service description
      description: Changes the service's free-text description, its only editable field.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ovhcloudconnect.Update'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Network
          - OVHcloud Connect
          - Services@@@90
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ovhCloudConnect:apiovh:edit
          required: true
      operationId: put_v1_ovh_cloud_connect_service_name
  /ovhCloudConnect/{serviceName}/changeContact:
    post:
      summary: Change contacts
      description: Starts the change of the admin, tech or billing contact and returns the request IDs.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
