    get:
      summary: List circuits
      description: Returns the IDs of the circuits created from Google pairing keys.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Pagination-Mode
