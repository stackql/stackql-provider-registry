openapi: 3.0.0
info:
  title: OVHcloud Managed CMS API
  description: Managed CMS (WordPress) resources, websites and tasks.
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/managedCMS
paths:
  /managedCMS/customerApproval:
    get:
      operationId: getAllManagedCmsCustomerApprovals
      summary: List customer approvals
      description: Returns the customer approvals of the account. Filter them by approval code, resource type or resource ID. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: approvalCode
          description: Code identifying the operation the customer approves
          schema:
            $ref: '#/components/schemas/managedCMS.CustomerApprovalCodeEnum'
        - in: query
          name: resourceId
          description: Identifier of the resource the approval targets
          schema:
            type: string
        - in: query
          name: resourceType
          description: Type of the resource the approval targets
          schema:
            $ref: '#/components/schemas/managedCMS.CustomerApprovalResourceTypeEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllManagedCmsCustomerApprovalsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@80
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: account:apiovh:managedCMS/customerApproval/get
          required: true
      x-response-identifier: id
      x-expanded-response: ManagedCMSCustomerApproval
    post:
      operationId: createManagedCmsCustomerApproval
      summary: Register a customer approval
      description: Registers whether the customer approves an operation on a resource. (Alpha version)
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/managedCMS.CustomerApprovalPostPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/managedCMS.CustomerApproval'
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@100
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: account:apiovh:managedCMS/customerApproval/create
          required: true
  /managedCMS/customerApproval/{customerApprovalId}:
    get:
      operationId: getManagedCmsCustomerApproval
      summary: Get a customer approval
      description: Returns the approved operation, the target resource, the decision and the registration date. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: customerApprovalId
          description: Customer approval ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/managedCMS.CustomerApproval'
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@90
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: account:apiovh:managedCMS/customerApproval/get
          required: true
      x-response-identifier: id
  /managedCMS/reference/availableCMS:
    get:
      operationId: getManagedCmsAvailableCms
      summary: List available CMS
      description: Returns the content management systems a website can be created with. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedCmsAvailableCmsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@20
      x-badges:
        - color: blue
          label: Alpha version
  /managedCMS/reference/availableLanguages:
    get:
      operationId: getManagedCmsAvailableLanguages
      summary: List available languages
      description: Returns the languages a website can be configured with at creation, with their display name. Filter them by CMS. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: cms
          description: For which content management system
          required: true
          schema:
            $ref: '#/components/schemas/managedCMS.CMSEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedCmsAvailableLanguagesResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@30
      x-badges:
        - color: blue
          label: Alpha version
  /managedCMS/reference/supportedPHPVersions:
    get:
      operationId: getManagedCmsSupportedPhpVersions
      summary: List supported PHP versions
      description: Returns the PHP versions a website can use. Filter them by CMS. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: cms
          description: For which content management system
          required: true
          schema:
            $ref: '#/components/schemas/managedCMS.CMSEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedCmsSupportedPhpVersionsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@40
      x-badges:
        - color: blue
          label: Alpha version
  /managedCMS/resource:
    get:
      operationId: getAllManagedCmsServices
      summary: List services
      description: Returns the Managed CMS services of the account. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllManagedCmsServicesResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: managedCMS:apiovh:get
          required: true
      x-expanded-response: ManagedCMSServiceWithIAM
  /managedCMS/resource/{serviceId}:
    get:
      operationId: getManagedCmsService
      summary: Get a service
      description: Returns the plan, dashboard URLs and disk, visits and websites quotas of the service, with its running tasks. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/managedCMS.ServiceWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@50
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: managedCMS:apiovh:get
          required: true
    put:
      operationId: editManagedCmsService
      summary: Update a service
      description: Updates the service. Set flushCDNDate to a new date to flush the CDN of all its websites. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/managedCMS.ServiceEditionBody'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/managedCMS.Service'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::WrongServiceStatus:
                  value:
                    class: Client::BadRequest::WrongServiceStatus
                    message: The service is not in a suitable status to perform this action, please wait for other on-going tasks to be finished before retrying
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::CurrentTaskAlreadyExists:
                  value:
                    class: Client::Conflict::CurrentTaskAlreadyExists
                    message: A similar task is already running, please wait for it to be finished before retrying
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@70
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: managedCMS:apiovh:edit
          required: true
  /managedCMS/resource/{serviceId}/dashboard/applicationPassword:
    post:
      operationId: createManagedCmsDashboardApplicationPassword
      summary: Create an application password on a dashboard of the service
      description: Each call creates a new application password on the existing administrator user. The previous ones stay valid. They can be revoked from the CMS administration. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/managedCMS.DashboardApplicationPasswordCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/managedCMS.ApplicationPassword'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::WrongServiceStatus:
                  value:
                    class: Client::BadRequest::WrongServiceStatus
                    message: The service is not in a suitable status to perform this action, please wait for other on-going tasks to be finished before retrying
                Client::BadRequest::WrongWebsiteStatus:
                  value:
                    class: Client::BadRequest::WrongWebsiteStatus
                    message: The website is not in a suitable status to perform this action, please wait for other on-going tasks to be finished before retrying
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::DashboardNotFound:
                  value:
                    class: Client::NotFound::DashboardNotFound
                    message: Service dashboard was not found
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@90
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: managedCMS:apiovh:dashboard/applicationPassword/create
          required: true
  /managedCMS/resource/{serviceId}/flushCDN:
    post:
      operationId: flushManagedCmsServiceCdn
      summary: Flush the CDN of all websites
      description: Flushes the CDN cache of all the websites of the service and returns the task. Fails if a task is already running on the service. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.CurrentTask'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::WrongServiceStatus:
                  value:
                    class: Client::BadRequest::WrongServiceStatus
                    message: The service is not in a suitable status to perform this action, please wait for other on-going tasks to be finished before retrying
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::CurrentTaskAlreadyExists:
                  value:
                    class: Client::Conflict::CurrentTaskAlreadyExists
                    message: A similar task is already running, please wait for it to be finished before retrying
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress@@@60
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: managedCMS:apiovh:cdn/flush
          required: true
  /managedCMS/resource/{serviceId}/log/kind:
    get:
      operationId: getAllManagedCmsLogKinds
      summary: List log kinds
      description: Returns the names of the log kinds the service emits, which can be forwarded to a stream. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllManagedCmsLogKindsResponse'
      tags:
        - Observability
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress
          - Observability@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: managedCMS:apiovh:log/kind/get
          required: true
      x-response-identifier: name
      x-expanded-response: DbaasLogsLogKind
  /managedCMS/resource/{serviceId}/log/kind/{name}:
    get:
      operationId: getManagedCmsLogKind
      summary: Get a log kind
      description: Returns a log kind and the additional fields its logs carry. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogKind'
      tags:
        - Observability
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress
          - Observability@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: managedCMS:apiovh:log/kind/get
          required: true
      x-response-identifier: name
  /managedCMS/resource/{serviceId}/log/subscription:
    get:
      operationId: getAllManagedCmsLogSubscriptions
      summary: List log subscriptions
      description: Returns the identifiers of the log subscriptions of the service. Filter them by log kind with the kind parameter. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: kind
          description: Filter on a specific kind, for example access
          schema:
            type: string
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllManagedCmsLogSubscriptionsResponse'
      tags:
        - Observability
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress
          - Observability@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: managedCMS:apiovh:log/subscription/get
          required: true
      x-response-identifier: subscriptionId
      x-expanded-response: DbaasLogsLogSubscription
    post:
      operationId: createManagedCmsLogSubscription
      summary: Create a log subscription
      description: Forwards the logs of one kind to a Logs Data Platform stream. The subscription is created asynchronously and the response returns the operation identifier. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dbaas.logs.LogSubscriptionCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscriptionResponse'
      tags:
        - Observability
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress
          - Observability@@@50
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: managedCMS:apiovh:log/subscription/create
          required: true
        - name: ldp:apiovh:output/graylog/stream/forwardTo
          description: Required on the targeted LDP service
          required: true
  /managedCMS/resource/{serviceId}/log/subscription/{subscriptionId}:
    delete:
      operationId: deleteManagedCmsLogSubscription
      summary: Delete a log subscription
      description: Stops forwarding logs to the stream. The deletion runs asynchronously and the response returns the operation identifier. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: subscriptionId
          description: Subscription ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscriptionResponse'
      tags:
        - Observability
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress
          - Observability@@@70
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: managedCMS:apiovh:log/subscription/delete
          required: true
    get:
      operationId: getManagedCmsLogSubscription
      summary: Get a log subscription
      description: Returns the log kind and the destination stream of a subscription. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: subscriptionId
          description: Subscription ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscription'
      tags:
        - Observability
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress
          - Observability@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: managedCMS:apiovh:log/subscription/get
          required: true
      x-response-identifier: subscriptionId
  /managedCMS/resource/{serviceId}/log/url:
    post:
      operationId: createManagedCmsLogUrl
      summary: Generate a temporary log URL
      description: Generates a temporary URL to read the logs of one kind. Returns the URL and its expiration date. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dbaas.logs.LogUrlCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.TemporaryLogsLink'
      tags:
        - Observability
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress
          - Observability@@@60
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: managedCMS:apiovh:log/url/create
          required: true
  /managedCMS/resource/{serviceId}/task:
    get:
      operationId: getAllManagedCmsTasks
      summary: List tasks
      description: Returns the current and recent tasks of the service. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllManagedCmsTasksResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress
          - Operations@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: managedCMS:apiovh:task/get
          required: true
      x-response-identifier: id
      x-expanded-response: CommonTask
  /managedCMS/resource/{serviceId}/task/{taskId}:
    get:
      operationId: getManagedCmsTask
      summary: Get a task
      description: Returns the details and status of the task. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          description: Task ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.Task'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::TaskNotFound:
                  value:
                    class: Client::NotFound::TaskNotFound
                    message: This task was not found
      x-developer-hub-navigation:
        - - Web Cloud
          - Managed WordPress
          - Operations@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: managedCMS:apiovh:task/get
          required: true
      x-response-identifier: id
    put:
      operationId: editManagedCmsTask
      summary: Provide task input
      description: 'Sends the input a task waits for. For a WordPress import, sends the elements to import: content, users, plugins, themes or the whole database. At least one active theme must be selected. (Alpha version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          description: Task ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
