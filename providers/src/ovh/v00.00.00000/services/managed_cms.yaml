                    - WORDPRESS
              required:
                - adminLogin
                - adminPassword
                - adminURL
                - cms
      required:
        - targetSpec
    managedCMS.WebsiteEditionBody:
      type: object
      description: Body to edit a website
      properties:
        targetSpec:
          description: Target specification to edit a website
          type: object
          properties:
            createBackupDate:
              type: string
              description: Modify this to trigger a manual backup of the website, files and database. Cannot be combined with any other field.
              nullable: true
              format: date-time
            deleteBackup:
              description: Set this to delete a manual backup of the website. Automatic backups cannot be deleted. Cannot be combined with any other field.
              nullable: true
              type: object
              properties:
                backupId:
                  type: string
                  description: Identifier of the backup to delete, which must be a manual backup of this website
                  format: uuid
              required:
                - backupId
            domains:
              type: array
              description: Domains attached to the website
              nullable: true
              items:
                $ref: '#/components/schemas/managedCMS.Domain'
            flushCDNDate:
              type: string
              description: Modify this to trigger a flush of CDN of the website
              nullable: true
              format: date-time
            phpMyAdminPassword:
              type: string
              description: Set this to reset the website's PhpMyAdmin password (9-30 alphanumeric characters, with at least one uppercase, one lowercase and one digit)
              nullable: true
              format: password
            plannedUpdate:
              description: Modify this to trigger an update on the website, if any
              nullable: true
              type: object
              properties:
                cmsVersion:
                  type: string
                  description: Target CMS version of the update
                  nullable: true
                dryRun:
                  description: Target specification of the dry run
                  nullable: true
                  type: object
                  properties:
                    date:
                      type: string
                      description: Date of the dry run
                      nullable: true
                      format: date-time
                plannedAt:
                  type: string
                  description: Planned date for the version update
                  nullable: true
                  format: date-time
                runtimeVersion:
                  type: string
                  description: Target runtime version of the update
                  nullable: true
            primaryFQDN:
              type: string
              description: Modify the primary FQDN of the website
              nullable: true
            resetDatabasePasswordDate:
              type: string
              description: Modify this to trigger a reset of the website's database password
              nullable: true
              format: date-time
            restoreBackup:
              description: Set this to restore a backup on the website, files and database together. Cannot be combined with any other field.
              nullable: true
              type: object
              properties:
                backupId:
                  type: string
                  description: Identifier of the backup to restore, which must be a READY backup of this website
                  format: uuid
              required:
                - backupId
            sftpPassword:
              type: string
              description: Set this to reset the website's SFTP password (9-30 alphanumeric characters, with at least one uppercase, one lowercase and one digit)
              nullable: true
              format: password
