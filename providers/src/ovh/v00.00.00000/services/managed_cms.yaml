                  type: string
                  description: Password to set when creating the administrator user
                  format: password
                cms:
                  description: Which content management system to install
                  type: string
                  enum:
                    - WORDPRESS
                cmsSpecific:
                  description: Parameters specific to the chosen content management system
                  nullable: true
                  type: object
                  properties:
                    wordpress:
                      description: Specific parameters to create a WordPress website
                      nullable: true
                      type: object
                      properties:
                        language:
                          description: Language to configure the website with
                          nullable: true
                          type: string
                          enum:
                            - de_DE
                            - en_GB
                            - en_US
                            - es_ES
                            - fr_CA
                            - fr_FR
                            - it_IT
                            - pl_PL
                            - pt_PT
                phpVersion:
                  type: string
                  description: 'Which PHP version to use, latest by default. The set grows as new PHP releases are supported: retrieve the current one with GET /managedCMS/reference/supportedPHPVersions.'
