    domain.task.DomainTask:
      type: object
      description: Domain-specific task with additional transfer details
      properties:
        additionalDetails:
          description: Operation-specific details, present for certain task types like DomainIncomingTransfer
          nullable: true
          readOnly: true
          type: object
          properties:
            dnssec:
              description: DNSSEC-related transfer analysis details
              nullable: true
              readOnly: true
              type: object
              properties:
                decision:
                  description: Decision taken regarding DNSSEC handling during the transfer
                  nullable: true
                  readOnly: true
                  type: object
                  properties:
                    autoHandling:
                      type: boolean
                      description: Whether DNSSEC handling is performed automatically
                      readOnly: true
                    preserveDnssec:
                      type: boolean
                      description: Whether DNSSEC records will be preserved after transfer
                      readOnly: true
                    reason:
                      type: string
                      description: Human-readable explanation of the decision
                      nullable: true
                      readOnly: true
                    status:
                      description: Status of the DNSSEC transfer decision
                      readOnly: true
                      type: string
                      enum:
                        - BLOCKED
                        - PROCEED
                    synchronizeDnsRecords:
                      type: boolean
                      description: Whether DNS records will be synchronized after transfer
                      readOnly: true
                preTransfer:
                  description: DNSSEC status detected before the transfer
                  nullable: true
                  readOnly: true
                  type: object
                  properties:
                    dnskeyCount:
                      type: integer
                      description: Number of DNSKEY records found
                      readOnly: true
                    dsCount:
                      type: integer
                      description: Number of DS records found
                      readOnly: true
                    hadDnssec:
                      type: boolean
                      description: Whether the domain had active DNSSEC before transfer
                      readOnly: true
                    hasDnskey:
                      type: boolean
                      description: Whether the domain had DNSKEY records
                      readOnly: true
                registry:
                  description: Registry capability information regarding DNSSEC
                  nullable: true
                  readOnly: true
                  type: object
                  properties:
                    supportsDnssec:
                      type: boolean
                      description: Whether the registry supports DNSSEC
                      readOnly: true
            dnssecRiskAcknowledged:
              type: boolean
              description: Set to true to accept the DNSSEC risk and proceed with the transfer
              nullable: true
            estimatedCompletionAt:
              type: string
              description: Estimated date when the task will complete
              nullable: true
              format: date-time
              readOnly: true
        createdAt:
          type: string
          description: Creation date of the task
          format: date-time
          readOnly: true
        errors:
          type: array
          description: Errors that occurred on the task
          nullable: true
          items:
            $ref: '#/components/schemas/common.TaskError'
          readOnly: true
        finishedAt:
          type: string
          description: Ending date of the task
          nullable: true
          format: date-time
          readOnly: true
        id:
          type: string
          description: Unique identifier of the task
          format: uuid
          readOnly: true
        link:
          type: string
          description: Link to the related resource
          readOnly: true
        message:
          type: string
          description: Description of the task
          readOnly: true
        progress:
          type: array
          description: Progress steps of the asynchronous operation
          items:
            $ref: '#/components/schemas/common.TaskProgress'
          readOnly: true
        startedAt:
          type: string
          description: Starting date of the task
          nullable: true
          format: date-time
          readOnly: true
        status:
          description: Current global status of the task
          readOnly: true
          type: string
          enum:
            - DONE
            - ERROR
            - PENDING
            - RUNNING
            - SCHEDULED
            - WAITING_USER_INPUT
        type:
          type: string
          description: Type of the task
          readOnly: true
        updatedAt:
          type: string
          description: Last update of the task
          format: date-time
          readOnly: true
