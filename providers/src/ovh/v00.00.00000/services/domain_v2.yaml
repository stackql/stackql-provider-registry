          type: boolean
          description: Whether the contact is visible via RDDS (displayed in WHOIS and RDAP directories)
          readOnly: true
    domain.resource.currentState.AlgorithmNameEnum:
      type: string
      description: The list of supported cryptographic algorithms for DNSSEC keys
      enum:
        - DSA
        - DSA-NSEC3-SHA1
        - ECC-GOST
        - ECDSAP256SHA256
        - ECDSAP384SHA384
        - ED25519
        - ED448
