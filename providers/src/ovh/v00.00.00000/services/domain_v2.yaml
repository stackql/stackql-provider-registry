    domain.Foa:
      type: object
      description: A Form of Authorization (FOA) attached to a domain name task. They are created by OVHcloud when a trade or an outgoing transfer is requested and validated by the involved contacts via email.
      properties:
        checksum:
          type: string
          description: Computed hash of the current state of the FOA. Reflects the latest observed state.
          readOnly: true
        currentState:
          description: Current state of the FOA
          readOnly: true
          type: object
          properties:
            answeredAt:
              type: string
              description: Date when the FOA was answered by the recipient. Null when the FOA has not been answered yet.
              nullable: true
              format: date-time
              readOnly: true
            choice:
              description: Recipient's decision on the FOA. Null when the FOA has not been answered yet.
              nullable: true
              readOnly: true
              type: string
              enum:
                - ACCEPT
                - REJECT
            contact:
              type: string
              description: Identifier of the contact the FOA has been sent to
              readOnly: true
            contactEmail:
              type: string
              description: Partially masked email address of the contact the FOA has been sent to
              readOnly: true
            domain:
              type: string
              description: Domain name this FOA is attached to
              readOnly: true
            expiresAt:
              type: string
              description: Date beyond which the FOA can no longer be answered
              format: date-time
              readOnly: true
            sentAt:
              type: string
              description: Date when the FOA was sent to the recipient
              format: date-time
              readOnly: true
            token:
              type: string
              description: Partially masked authorization token embedded in the FOA link
              readOnly: true
            type:
              description: Type of FOA (trade or outgoing transfer)
              readOnly: true
              type: string
              enum:
                - OUTGOING_TRANSFER
                - TRADE
        id:
          type: string
          description: Unique identifier of the FOA
          format: uuid
          readOnly: true
        resourceStatus:
          description: Readiness of the FOA resource
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
