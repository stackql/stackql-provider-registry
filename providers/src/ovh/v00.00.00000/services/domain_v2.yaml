        - DEDICATED
        - EMPTY
        - EXTERNAL
        - HOLD
        - HOSTING
        - MIXED
        - PARKING
    domain.resource.currentState.dnssecConfiguration.DsData:
      type: object
      description: Provides information about the domain DS data
      properties:
        algorithm:
          type: integer
          description: Identifies the cryptographic algorithm used for the public key
          readOnly: true
        flags:
          type: integer
          description: Indicates the type of the key, for example 257 for KSK, 256 for ZSK
          readOnly: true
        keyTag:
          type: integer
          description: Provides a unique identifier for the public key. From 0 to 65535.
          readOnly: true
        publicKey:
          type: string
          description: Contains the base64‑encoded representation of the public key
          readOnly: true
    domain.resource.currentState.dnssecConfiguration.SupportedAlgorithm:
      type: object
