      properties:
        name:
          description: Specifies the name of the cryptographic algorithm
          readOnly: true
          type: string
          enum:
            - DSA
            - DSA-NSEC3-SHA1
            - ECC-GOST
            - ECDSAP256SHA256
            - ECDSAP384SHA384
            - ED25519
            - ED448
            - RSASHA1
            - RSASHA1-NSEC3-SHA1
            - RSASHA256
            - RSASHA512
        number:
          type: integer
          description: Specifies the numeric value of the cryptographic algorithm
          readOnly: true
    domain.resource.currentState.hostsConfiguration.Host:
      type: object
      description: Information about a host
      properties:
        host:
          type: string
          description: The host name
          nullable: true
          readOnly: true
        ips:
          type: array
          description: IPs linked to a host
          nullable: true
          items:
            $ref: '#/components/schemas/ip'
          readOnly: true
    domain.resource.targetSpec.contactsConfiguration.ContactConfiguration:
      type: object
      description: Configuration of the administator, billing and technical contacts
      properties:
        disclosurePolicy:
          description: Indicates the data disclosure policy of the contact
          type: object
          properties:
            disclosureConfiguration:
              description: Indicates whether the contact data are disclosed or redacted
              type: string
              enum:
                - DISCLOSED
                - REDACTED
          required:
            - disclosureConfiguration
    domain.resource.targetSpec.contactsConfiguration.OwnerConfiguration:
      type: object
      description: Configuration for the owner contact
      properties:
        disclosurePolicy:
          description: Indicates the data disclosure policy of the contact
          nullable: true
          type: object
          properties:
            disclosureConfiguration:
              description: Indicates whether the contact data are disclosed or redacted
              type: string
              enum:
                - DISCLOSED
                - REDACTED
          required:
            - disclosureConfiguration
        id:
          type: string
          description: Identifier of the contact
          nullable: true
    domain.resource.targetSpec.dnsConfiguration.NameServer:
      type: object
      description: Information about a name server
      properties:
        ips:
          type: array
          description: IP addresses of the name server
          nullable: true
          items:
            $ref: '#/components/schemas/ip'
        ipv4:
          description: Deprecated. Use `ips` instead, which carries every address of the name server.
          nullable: true
          type: string
          format: ipv4
          example: 192.0.2.0
        ipv6:
          description: Deprecated. Use `ips` instead, which carries every address of the name server.
          nullable: true
          type: string
          format: ipv6
          example: 2001:41d0:1:1994::1
        nameServer:
          type: string
          description: Host name of the name server
      required:
        - nameServer
    domain.resource.targetSpec.dnssecConfiguration.DsData:
      type: object
      description: The DS data used in your DNSSEC configuration
      properties:
        algorithm:
          type: integer
          description: Identifies the cryptographic algorithm used for the public key
        flags:
          type: integer
          description: Indicates the type of the key, for example 257 for KSK, 256 for ZSK
        keyTag:
          type: integer
          description: Provides a unique identifier for the public key. From 0 to 65535.
        publicKey:
          type: string
          description: Contains the base64‑encoded representation of the public key
      required:
        - algorithm
        - flags
        - keyTag
        - publicKey
    domain.resource.targetSpec.hostsConfiguration.Host:
      type: object
      description: Provides information about a host
      properties:
        host:
          type: string
          description: Specifies the host name
        ips:
          type: array
          description: Lists the IP addresses linked to the host
          items:
            $ref: '#/components/schemas/ip'
      required:
        - host
        - ips
