openapi: 3.0.0
info:
  title: OVHcloud SSL Gateway API
  description: 'SSL Gateway services: domains, servers, NAT IPs and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/sslGateway
paths:
  /sslGateway:
    get:
      summary: List SSL Gateways
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_ssl_gatewayResponse'
      x-developer-hub-navigation:
        - - Network
          - SSL Gateway
          - Services@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: sslGateway:apiovh:get
          required: true
      x-expanded-response: SslGatewaySslGatewayWithIAM
      operationId: get_v1_ssl_gateway
      description: List SSL Gateways (Beta version)
  /sslGateway/availableZones:
