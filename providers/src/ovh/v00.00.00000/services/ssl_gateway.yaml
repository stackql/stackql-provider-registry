components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    sslGateway.EligibilityStatus:
      type: object
      description: A structure describing the eligibility status of a domain
      properties:
        domain:
          type: string
          description: Customer domain name
        ip6s:
          type: array
          description: Eligible IP(s) v6 for this domain
          items:
            $ref: '#/components/schemas/ipv6'
        ips:
          type: array
          description: Eligible IP(s) for this domain
          items:
            $ref: '#/components/schemas/ipv4'
        isHostedByOvh:
          type: boolean
          description: Whether this domain is hosted by Ovh or not
    sslGateway.SslGatewayWithIAM:
      type: object
      description: Your SSL Gateway
      properties:
        allowedSource:
          type: array
          description: Restrict SSL Gateway access to these ip block. No restriction if null
          nullable: true
          items:
            $ref: '#/components/schemas/ipBlock'
        displayName:
          type: string
          description: Custom name of your SSL Gateway
          nullable: true
        hsts:
          type: boolean
          description: Set to true to enable Strict-Transport-Security HTTP header
        httpsRedirect:
          type: boolean
          description: Set to true to enable https redirect
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        ipv4:
          description: The IPv4 you need to put in the A field of your domain name
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        ipv6:
          description: The IPv6 you need to put in the AAAA field of your domain name
          nullable: true
          readOnly: true
          type: string
          format: ipv6
          example: 2001:41d0:1:1994::1
        metricsToken:
          type: string
