components:
  schemas:
    cloud.project.ai.OrderEnum:
      type: string
      description: Possible value to order result
      enum:
        - asc
        - desc
    cloud.project.ai.app.AppStateEnum:
      type: string
      description: State of the application
      enum:
        - DELETED
        - DELETING
        - ERROR
        - FAILED
        - INITIALIZING
        - QUEUED
        - RUNNING
        - SCALING
        - STANDBY
        - STOPPED
        - STOPPING
    cloud.project.ai.app.App:
      type: object
      description: AI Solutions Platform App Object
      properties:
        createdAt:
          type: string
          description: App creation date
          format: date-time
          readOnly: true
        id:
          type: string
          description: App Id
          format: uuid
          readOnly: true
        spec:
          description: App spec
          readOnly: true
          type: object
          properties:
            command:
              type: array
              description: App command
              nullable: true
              items:
                type: string
              readOnly: true
            defaultHttpPort:
              type: integer
              description: Default port to access the http service inside the app
              nullable: true
              readOnly: true
            deploymentStrategy:
              description: AI App deployment strategy
              nullable: true
              readOnly: true
              type: object
              properties:
                maxSurge:
                  type: string
                  description: Maximum number of replicas that can be created over the desired number of Pods (can be expressed as a percentage of the desired pods, suffixed with '%')
                  nullable: true
                maxUnavailable:
                  type: string
                  description: Maximum number of replicas that can be unavailable during the update process (can be expressed as a percentage of the desired pods, suffixed with '%')
                  nullable: true
                progressDeadlineSeconds:
                  type: integer
                  description: Number of seconds you want to wait for your Deployment to progress before the system reports back that the Deployment has failed progressing
                  nullable: true
                terminationGracePeriodSeconds:
                  type: integer
                  description: Number of seconds we allow an app's replica to shutdown gracefully before we terminate it. Defaults to 30 seconds
                  nullable: true
            envVars:
              type: array
              description: List of environment variable to be set inside the app
              nullable: true
              items:
                $ref: '#/components/schemas/cloud.project.ai.job.JobEnv'
              readOnly: true
            grpcPort:
              type: integer
              description: GRPC Port that we want to expose in case workload HTTP & gRPC servers cannot be multiplexed to listen on the same port
              nullable: true
              readOnly: true
            image:
              type: string
              description: App image
              readOnly: true
            labels:
              type: object
              description: Labels for the app
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            livenessProbe:
              description: App liveness probe
              nullable: true
              readOnly: true
              type: object
              properties:
                failureThreshold:
                  type: integer
                  description: Minimum consecutive failures for the probe to be considered failed after having succeeded. Defaults to 3. Minimum value is 1.
                  nullable: true
                  readOnly: true
                initialDelaySeconds:
                  type: integer
                  description: Number of seconds after the container has started before liveness probes are initiated.
                  nullable: true
                  readOnly: true
                path:
                  type: string
                  description: Path to access to check for readiness
                  nullable: true
                  readOnly: true
                periodSeconds:
                  type: integer
                  description: How often (in seconds) to perform the probe. Default to 10 seconds. Minimum value is 1.
                  nullable: true
                  readOnly: true
                port:
                  type: integer
                  description: Port to access to check for readiness
                  nullable: true
                  readOnly: true
                successThreshold:
                  type: integer
                  description: Minimum consecutive successes for the probe to be considered successful after having failed. Defaults to 1. Must be 1 for liveness and startup. Minimum value is 1.
                  nullable: true
                  readOnly: true
                timeoutSeconds:
                  type: integer
                  description: Number of seconds after which the probe times out. Defaults to 1 second. Minimum value is 1.
                  nullable: true
                  readOnly: true
            name:
              type: string
              description: App name
              readOnly: true
            partnerId:
              type: string
              description: Partner ID
              nullable: true
              readOnly: true
            probe:
              description: App readiness probe
              nullable: true
              readOnly: true
              type: object
              properties:
                failureThreshold:
                  type: integer
                  description: Minimum consecutive failures for the probe to be considered failed after having succeeded. Defaults to 3. Minimum value is 1.
                  nullable: true
                  readOnly: true
                initialDelaySeconds:
                  type: integer
                  description: Number of seconds after the container has started before liveness probes are initiated.
                  nullable: true
                  readOnly: true
                path:
                  type: string
                  description: Path to access to check for readiness
                  nullable: true
                  readOnly: true
                periodSeconds:
                  type: integer
                  description: How often (in seconds) to perform the probe. Default to 10 seconds. Minimum value is 1.
                  nullable: true
                  readOnly: true
                port:
                  type: integer
                  description: Port to access to check for readiness
                  nullable: true
                  readOnly: true
                successThreshold:
                  type: integer
                  description: Minimum consecutive successes for the probe to be considered successful after having failed. Defaults to 1. Must be 1 for liveness and startup. Minimum value is 1.
                  nullable: true
                  readOnly: true
                timeoutSeconds:
                  type: integer
                  description: Number of seconds after which the probe times out. Defaults to 1 second. Minimum value is 1.
                  nullable: true
                  readOnly: true
            region:
              type: string
              description: Host region of the app
              readOnly: true
            resources:
              description: App resources
              readOnly: true
              type: object
              properties:
                cpu:
                  type: integer
                  description: Number of vCPU resources requested
                  readOnly: true
                ephemeralStorage:
                  type: integer
                  description: The amount of ephemeral storage in bytes
                  readOnly: true
                flavor:
                  type: string
                  description: Current instance flavor
                  readOnly: true
                flavorCount:
                  type: integer
                  description: Number of desired units of the chosen flavor
                  nullable: true
                  readOnly: true
                gpu:
                  type: integer
                  description: Number of GPU resources requested
                  readOnly: true
                gpuBrand:
                  type: string
                  description: The GPU Brand
                  nullable: true
                  readOnly: true
                gpuMemory:
                  type: integer
                  description: The GPU Memory in bits
                  nullable: true
                  readOnly: true
                gpuModel:
                  type: string
                  description: The GPU Model
                  nullable: true
                  readOnly: true
                memory:
                  type: integer
                  description: The amount of memory in bytes
                  readOnly: true
                privateNetwork:
                  type: integer
                  description: The guarantee private bandwidth in bytes per seconds
                  readOnly: true
                publicNetwork:
                  type: integer
                  description: The guarantee public bandwidth in bytes per seconds
                  readOnly: true
            scalingStrategy:
              description: App scaling strategy
              nullable: true
              readOnly: true
              type: object
              properties:
                automatic:
                  description: Strategy setting a variable number of replicas, based on an average resource usage threshold
                  nullable: true
                  readOnly: true
                  type: object
                  properties:
                    averageUsageTarget:
                      type: integer
                      description: The average resource usage threshold that the app upscale or downscale will be triggered from, in percent
                      nullable: true
                      readOnly: true
                    cooldownPeriodSeconds:
                      type: integer
                      description: Number of seconds to wait before scaling app to 0 whenever there are no more HTTP/gRPC requests made to it. Only applies when replicasMin=0
                      nullable: true
                      readOnly: true
                    customMetrics:
                      description: parameters to scale the AI Deploy App based on a custom metric provided by a customer-exposed API
                      nullable: true
                      readOnly: true
                      type: object
                      properties:
                        aggregationType:
                          description: aggregation type we apply on the custom metric used to scaled an AI Deploy App
                          readOnly: true
                          type: string
                          enum:
                            - AVERAGE
                            - MAX
                            - MIN
                            - SUM
                        apiUrl:
                          type: string
                          description: 'Full URL of the API operation to call to get the metric value. Specific <SELF> placeholder can be given whenever metrics API is served by the deployed app itself. e.g : "http://<SELF>:6000/metrics"'
                          readOnly: true
                        format:
                          description: format of the custom metric used to scaled an AI Deploy App
                          readOnly: true
                          type: string
                          enum:
                            - JSON
                            - PROMETHEUS
                            - XML
                            - YAML
                        targetValue:
                          type: number
                          description: Target value to scale on
                          readOnly: true
                        valueLocation:
                          type: string
                          description: The location of the metric value in the response payload. The value is format specific, see https://keda.sh/docs/2.16/scalers/metrics-api/#trigger-specification for details
                          readOnly: true
                    replicasMax:
                      type: integer
                      description: Maximum number of replicas
                      readOnly: true
                    replicasMin:
                      type: integer
                      description: Minimum number of replicas
                      nullable: true
                      readOnly: true
                    resourceType:
                      description: Type of the resource to base the automatic scaling on
                      nullable: true
                      readOnly: true
                      type: string
                      enum:
                        - CPU
                        - RAM
                    scaleDownStabilizationWindowSeconds:
                      type: integer
                      description: Number of seconds for which past recommendations should be considered while scaling down. Must be greater than or equal to zero and less than or equal to 3600 (one hour).
                      nullable: true
                      readOnly: true
                    scaleUpStabilizationWindowSeconds:
                      type: integer
                      description: Number of seconds for which past recommendations should be considered while scaling up. Must be greater than or equal to zero and less than or equal to 3600 (one hour).
                      nullable: true
                      readOnly: true
                fixed:
                  description: Strategy setting a fix number of replicas
                  nullable: true
                  readOnly: true
                  type: object
                  properties:
                    replicas:
                      type: integer
                      description: Number of wanted replicas
                      readOnly: true
            unsecureHttp:
              type: boolean
              description: True if app api port can be accessed without any authentication token, false otherwise
              nullable: true
              readOnly: true
            volumes:
              type: array
              description: App Data linked
              nullable: true
              items:
                $ref: '#/components/schemas/cloud.project.ai.volume.Volume'
              readOnly: true
