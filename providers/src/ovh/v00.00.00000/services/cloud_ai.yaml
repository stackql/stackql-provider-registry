openapi: 3.0.0
info:
  title: OVHcloud Public Cloud AI API
  description: 'AI and machine learning products of a Public Cloud project: AI Training jobs, AI Notebooks, AI Deploy apps, registries, tokens and capabilities.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/cloud
paths:
  /ai/app:
    get:
      summary: List apps
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: labelSelector
          description: Filter on app label (e.g. 'app_name=kind_of_magic')
          schema:
            type: string
        - in: query
          name: order
          description: Order the result set
          schema:
            $ref: '#/components/schemas/cloud.project.ai.OrderEnum'
        - in: query
          name: page
          description: Page of the result set
          schema:
            type: integer
        - in: query
          name: size
          description: Size of the result set
          schema:
            type: integer
        - in: query
          name: sort
          description: Sort the result with this field
          schema:
            type: string
        - in: query
          name: statusState
          description: Filter on status state
          schema:
            type: array
            items:
              $ref: '#/components/schemas/cloud.project.ai.app.AppStateEnum'
        - in: query
          name: updatedAfter
          description: Filter on updatedAt property (>)
          schema:
            type: string
            format: date-time
        - in: query
          name: updatedBefore
          description: Filter on updatedAt property (<)
          schema:
            type: string
            format: date-time
        - in: query
          name: userName
          description: User that submit the job
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_cloud_project_service_name_ai_appResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/app/get
          required: true
      x-response-identifier: id
      x-expanded-response: CloudProjectAiAppApp
      operationId: get_v1_cloud_project_service_name_ai_app
      description: List apps
    post:
      summary: Create a new app
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloud.project.ai.app.AppSpecInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.project.ai.app.App'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/app/create
          required: true
      operationId: post_v1_cloud_project_service_name_ai_app
      description: Create a new app
  /ai/app/command:
