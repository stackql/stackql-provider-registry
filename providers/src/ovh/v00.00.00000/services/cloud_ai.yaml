      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/app/edit
          required: true
      operationId: put_v1_cloud_project_service_name_ai_app_app_id
      description: Update several parts of an app's spec
