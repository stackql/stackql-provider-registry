          name: appId
          description: App ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dbaas.logs.LogSubscriptionCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscriptionResponse'
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - Observability@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/applog/subscription/create
          required: true
        - name: ldp:apiovh:output/graylog/stream/forwardTo
          description: Required on the targeted LDP service
          required: true
      operationId: post_v1_cloud_project_service_name_ai_app_app_id_log_subscription
