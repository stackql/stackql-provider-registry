openapi: 3.0.0
info:
  title: OVHcloud Web Cloud Databases API
  description: 'Web Cloud Databases (private SQL): databases, users, grants, dumps, whitelists, configuration and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/hosting/privateDatabase
paths:
  /hosting/privateDatabase:
    get:
      summary: List Web Cloud Databases
      description: Returns the service names of the Web Cloud Databases of the account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_private_databaseResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Instances
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:get
          required: true
      x-expanded-response: HostingPrivateDatabaseServiceWithIAM
      operationId: get_v1_hosting_private_database
  /hosting/privateDatabase/availableOrderCapacities:
    get:
      summary: Get available order capacities
      description: Returns the datacenters, RAM sizes and DBMS versions available for the requested offer.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: offer
          required: true
          schema:
            $ref: '#/components/schemas/hosting.privateDatabase.OfferEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.availableOrderCapacities'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Instances
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:webCloudDatabases/availableOrderCapacities/get
          required: true
      operationId: get_v1_hosting_private_database_available_order_capacities
  /hosting/privateDatabase/{serviceName}:
    get:
      summary: Get a Web Cloud Database
      description: Returns the service properties, such as offer, DBMS type and version, hostname and ports, RAM, quota and state.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.ServiceWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Instances
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:get
          required: true
      operationId: get_v1_hosting_private_database_service_name
    put:
      summary: Update a Web Cloud Database
      description: Updates the editable properties of the service, such as the display name (50 characters maximum).
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hosting.privateDatabase.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Instances
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:put
          required: true
      operationId: put_v1_hosting_private_database_service_name
  /hosting/privateDatabase/{serviceName}/availableVersions:
    get:
      summary: List available DBMS versions
      description: Returns the DBMS versions available for the service. Use one of them to change the DBMS version.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_private_database_service_name_available_versionsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Instances
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:availableVersions/get
          required: true
      operationId: get_v1_hosting_private_database_service_name_available_versions
  /hosting/privateDatabase/{serviceName}/changeContact:
    post:
      summary: Change the contacts
      description: Starts a change procedure for the admin, billing or tech contact of the service. Returns the IDs of the account contact change tasks, which are not listed in the service tasks.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.changeContact'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_hosting_private_database_service_name_change_contactResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Instances
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:changeContact
          required: true
      operationId: post_v1_hosting_private_database_service_name_change_contact
  /hosting/privateDatabase/{serviceName}/changeFtpPassword:
    post:
      summary: Change the FTP password
      description: Changes the FTP admin password of the service. The password must be alphanumeric and at least 8 characters long.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hosting.privateDatabase.ChangeFtpPasswordPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Instances
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:changeFtpPassword
          required: true
      operationId: post_v1_hosting_private_database_service_name_change_ftp_password
  /hosting/privateDatabase/{serviceName}/changeVersion:
    post:
      summary: Change the DBMS version
      description: Changes the DBMS version of the service to one of the available versions. Returns a task to follow the change.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hosting.privateDatabase.ChangeVersionPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Instances
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:changeVersion
          required: true
      operationId: post_v1_hosting_private_database_service_name_change_version
  /hosting/privateDatabase/{serviceName}/config:
    get:
      summary: Get the configuration
      description: Returns the configuration parameters with their current, default and available values, and whether the last update is applied.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Configs'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Configuration
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:config/get
          required: true
      operationId: get_v1_hosting_private_database_service_name_config
  /hosting/privateDatabase/{serviceName}/config/update:
    post:
      summary: Update the configuration
      description: Updates the given configuration parameters as key-value pairs. Returns the configuration, whose status stays at updating until the change is applied.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hosting.privateDatabase.ConfigUpdatePayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Configs'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Configuration
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:config/update
          required: true
      operationId: post_v1_hosting_private_database_service_name_config_update
  /hosting/privateDatabase/{serviceName}/confirmTermination:
    post:
      summary: Confirm the termination
      description: Confirms the termination of the service with the token sent by email to the admin contact.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.confirmTermination'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Instances
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:confirmTermination
          required: true
      operationId: post_v1_hosting_private_database_service_name_confirm_termination
  /hosting/privateDatabase/{serviceName}/cpuThrottle:
    get:
      summary: List CPU throttling events
      description: Returns the start and end dates of each period when the CPU of the service was throttled.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_private_database_service_name_cpu_throttleResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Resources consumption
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:cpuThrottle/get
          required: true
      operationId: get_v1_hosting_private_database_service_name_cpu_throttle
  /hosting/privateDatabase/{serviceName}/database:
    get:
      summary: List databases
      description: Returns the names of the databases of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_private_database_service_name_databaseResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/get
          required: true
      x-expanded-response: HostingPrivateDatabaseDatabase
      operationId: get_v1_hosting_private_database_service_name_database
    post:
      summary: Create a database
      description: Creates an empty database on the service and returns a task to follow the creation. To also create a user with access to it, use the database wizard.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hosting.privateDatabase.Database.CreatePayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/create
          required: true
      operationId: post_v1_hosting_private_database_service_name_database
  /hosting/privateDatabase/{serviceName}/database/{databaseName}:
    delete:
      summary: Delete a database
      description: Deletes the database and returns a task to follow the deletion. Its dumps are kept as orphan dumps.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: databaseName
          description: Database name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/delete
          required: true
      operationId: delete_v1_hosting_private_database_service_name_database_database_name
    get:
      summary: Get a database
      description: Returns the size and creation date of the database, its daily backup time and the users granted on it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: databaseName
          description: Database name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Database'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/get
          required: true
      x-response-identifier: databaseName
      operationId: get_v1_hosting_private_database_service_name_database_database_name
  /hosting/privateDatabase/{serviceName}/database/{databaseName}/copy:
    get:
      summary: List database copies
      description: Returns the IDs of the copies of the database.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: databaseName
          description: Database name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_private_database_service_name_database_database_name_copyResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
          - Copies
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/copy/get
          required: true
      x-expanded-response: HostingPrivateDatabaseDatabaseCopy
      operationId: get_v1_hosting_private_database_service_name_database_database_name_copy
    post:
      summary: Create a database copy
      description: Creates a copy of the database. The copy expires at the expiration date given in the response.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: databaseName
          description: Database name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Database.Copy'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
          - Copies
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/copy/create
          required: true
      operationId: post_v1_hosting_private_database_service_name_database_database_name_copy
  /hosting/privateDatabase/{serviceName}/database/{databaseName}/copy/{id}:
    delete:
      summary: Delete a database copy
      description: Deletes the copy immediately, before its expiration date. A deleted copy can no longer be restored.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: databaseName
          description: Database name
          required: true
          schema:
            type: string
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
          - Copies
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/copy/delete
          required: true
      operationId: delete_v1_hosting_private_database_service_name_database_database_name_copy_id
    get:
      summary: Get a database copy
      description: Returns the status, creation date and expiration date of the copy.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: databaseName
          description: Database name
          required: true
          schema:
            type: string
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Database.Copy'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
          - Copies
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/copy/get
          required: true
      x-response-identifier: id
      operationId: get_v1_hosting_private_database_service_name_database_database_name_copy_id
  /hosting/privateDatabase/{serviceName}/database/{databaseName}/copyRestore:
    post:
      summary: Restore a database copy
      description: Restores a copy into the database. The database is not flushed before the restore unless requested.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: databaseName
          description: Database name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hosting.privateDatabase.Database.CopyRestorePayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
          - Copies
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/copyRestore
          required: true
      operationId: post_v1_hosting_private_database_service_name_database_database_name_copy_restore
  /hosting/privateDatabase/{serviceName}/database/{databaseName}/dump:
    get:
      summary: List database dumps
      description: Returns the IDs of the dumps of the database. To include dumps of deleted databases, list the dumps of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: databaseName
          description: Database name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_private_database_service_name_database_database_name_dumpResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
          - Dumps, import and restore
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/dump/get
          required: true
      x-expanded-response: HostingPrivateDatabaseDatabaseDump
      operationId: get_v1_hosting_private_database_service_name_database_database_name_dump
    post:
      summary: Create a database dump
      description: Creates a dump of the database and returns a task to follow it. The download link is valid for 30 days and is sent by email only when requested.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: databaseName
          description: Database name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hosting.privateDatabase.Database.CreateDump'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.privateDatabase.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Cloud DB
          - Databases
          - Dumps, import and restore
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webCloudDatabases:apiovh:database/dump/create
          required: true
      operationId: post_v1_hosting_private_database_service_name_database_database_name_dump
  /hosting/privateDatabase/{serviceName}/database/{databaseName}/dump/{id}:
    delete:
      summary: Delete a database dump
      description: Deletes the dump before its automatic deletion date.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: databaseName
          description: Database name
          required: true
          schema:
            type: string
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
