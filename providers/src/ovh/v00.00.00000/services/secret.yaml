openapi: 3.0.0
info:
  title: OVHcloud Secret API
  description: One-time secret retrieval.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/secret
paths:
  /secret/retrieve:
    post:
      summary: Retrieve a secret sent by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The secret ID
                  format: password
              required:
                - id
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/secret.Secret'
      x-badges:
        - color: green
          label: Stable production version
      operationId: post_v1_secret_retrieve
      description: Retrieve a secret sent by email
components:
  schemas:
    secret.Secret:
      type: object
      description: A secret
      properties:
        expiration:
          type: string
          description: Expiration time of the secret
          format: date-time
        secret:
          type: string
          description: The secret
          format: password
  x-stackQL-resources:
    retrieves:
      id: ovh.secret.retrieves
      name: retrieves
      title: Retrieves
      methods:
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1secret~1retrieve/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select: []
        insert:
          - $ref: '#/components/x-stackQL-resources/retrieves/methods/create'
        update: []
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v1
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
