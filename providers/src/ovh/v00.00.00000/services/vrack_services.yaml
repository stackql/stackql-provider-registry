        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::ChecksumBadFormat:
                  value:
                    class: Client::BadRequest::ChecksumBadFormat
                    message: 'Invalid Checksum format: ''{{.providedChecksum}}'' is not a valid MD5 hash'
                Client::BadRequest::DHCPAssociationIPBadFormat:
                  value:
                    class: Client::BadRequest::DHCPAssociationIPBadFormat
                    message: 'Invalid DHCP on Subnet ''{{.subnetCidr}}'': DHCP association IP ''{{.dhcpAssociationIP}}'' is not a valid IP address'
                Client::BadRequest::DHCPAssociationIPDuplicated:
                  value:
                    class: Client::BadRequest::DHCPAssociationIPDuplicated
                    message: 'Invalid DHCP on Subnet ''{{.subnetCidr}}'': DHCP association IP ''{{.dhcpAssociationIP}}'' is duplicated within the subnet'
                Client::BadRequest::DHCPAssociationIPInBGPRange:
                  value:
                    class: Client::BadRequest::DHCPAssociationIPInBGPRange
                    message: 'Invalid DHCP on Subnet ''{{.subnetCidr}}'': DHCP association IP ''{{.dhcpAssociationIP}}'' must not be within the BGP range CIDR ''{{.bgpRangeCidr}}'''
                Client::BadRequest::DHCPAssociationIPInServiceRange:
                  value:
                    class: Client::BadRequest::DHCPAssociationIPInServiceRange
                    message: 'Invalid DHCP on Subnet ''{{.subnetCidr}}'': DHCP association IP ''{{.dhcpAssociationIP}}'' must not be within the ServiceRange CIDR ''{{.serviceRangeCidr}}'''
                Client::BadRequest::DHCPAssociationIPNotInSubnet:
                  value:
                    class: Client::BadRequest::DHCPAssociationIPNotInSubnet
                    message: 'Invalid DHCP on Subnet ''{{.subnetCidr}}'': DHCP association IP ''{{.dhcpAssociationIP}}'' is not contained within subnet CIDR ''{{.subnetCidr}}'''
                Client::BadRequest::DHCPAssociationIPReserved:
                  value:
                    class: Client::BadRequest::DHCPAssociationIPReserved
                    message: 'Invalid DHCP on Subnet ''{{.subnetCidr}}'': DHCP association IP ''{{.dhcpAssociationIP}}'' must not be the subnet''s first or last IP'
                Client::BadRequest::DHCPAssociationLimitExceeded:
                  value:
                    class: Client::BadRequest::DHCPAssociationLimitExceeded
                    message: 'Invalid DHCP on Subnet ''{{.subnetCidr}}'': DHCP associations count ({{.dhcpAssociationCount}}) exceeds the maximum of {{.dhcpAssociationLimit}} per subnet'
                Client::BadRequest::DHCPNetbootRequiresUntaggedSubnet:
                  value:
                    class: Client::BadRequest::DHCPNetbootRequiresUntaggedSubnet
                    message: 'Invalid DHCP on Subnet ''{{.subnetCidr}}'': DHCP/netboot requires an untagged subnet, VLAN {{.subnetVlan}} is not supported'
                Client::BadRequest::DHCPRequiresServiceRange:
                  value:
                    class: Client::BadRequest::DHCPRequiresServiceRange
                    message: 'Invalid DHCP on Subnet ''{{.subnetCidr}}'': DHCP requires a service range on the subnet'
                Client::BadRequest::DedicatedServerInterfaceAlreadyBound:
                  value:
                    class: Client::BadRequest::DedicatedServerInterfaceAlreadyBound
                    message: 'Dedicated server interface(s) ''{{.dedicatedServerInterfaceUUID}}'' already bound to a vRackServices: a dedicated server interface can be bound to only one vRackServices at a time'
                Client::BadRequest::DedicatedServerInterfaceDuplicated:
                  value:
                    class: Client::BadRequest::DedicatedServerInterfaceDuplicated
                    message: 'Dedicated server interface ''{{.dedicatedServerInterfaceUUID}}'' is requested multiple times: a dedicated server interface can be bound only once in a vRackServices specification'
                Client::BadRequest::DedicatedServerInterfaceNotEligible:
                  value:
                    class: Client::BadRequest::DedicatedServerInterfaceNotEligible
                    message: 'Dedicated server interface(s) ''{{.dedicatedServerInterfaceUUID}}'' not eligible: a dedicated server interface must be bootable, in the vRack of the vRackServices, in the AZ of its Subnet, and the requester needs the IAM action ''dedicatedServer:apiovh:vrackServices/vnicAttach'' on its dedicated server to be bound to the vRackServices'
                Client::BadRequest::DedicatedServerInterfaceUUIDEmpty:
                  value:
                    class: Client::BadRequest::DedicatedServerInterfaceUUIDEmpty
                    message: 'Invalid DHCP on Subnet ''{{.subnetCidr}}'': DHCP association dedicated server interface UUID must not be empty'
                Client::BadRequest::FeatureUnavailable:
                  value:
                    class: Client::BadRequest::FeatureUnavailable
                    message: 'Feature(s) ''{{.unavailableFeatures}}'' unavailable: a feature can only be used where GET /vrackServices/reference/featureAvailability lists it as available'
                Client::BadRequest::InvalidJSON:
                  value:
                    class: Client::BadRequest::InvalidJSON
                    message: The input that you provided isn't valid JSON or not well formatted
                Client::BadRequest::ManagedServiceAlreadyAttached:
                  value:
                    class: Client::BadRequest::ManagedServiceAlreadyAttached
                    message: 'Managed Service ''{{.managedServiceURN}}'' is already attached to VrackServices ''{{.vrackServicesID}}'': a Managed Service can be attached to only one vRackServices at a time'
                Client::BadRequest::ManagedServiceDuplicated:
                  value:
                    class: Client::BadRequest::ManagedServiceDuplicated
                    message: 'Managed Service ''{{.managedServiceURN}}'' is requested multiple times: a Managed Service can be referenced only once in a vRackServices specification'
                Client::BadRequest::ManagedServiceIncompatibleType:
                  value:
                    class: Client::BadRequest::ManagedServiceIncompatibleType
                    message: 'Managed Service ''{{.managedServiceURN}}'' has type ''{{.managedServiceType}}'': the type must be compatible with vRackServices'
                Client::BadRequest::ManagedServiceNotAvailable:
                  value:
                    class: Client::BadRequest::ManagedServiceNotAvailable
                    message: 'Managed Service ''{{.managedServiceURN}}'' is in state ''{{.managedServiceState}}'': the Managed Service must be active to be attached to the vRackServices'
                Client::BadRequest::ManagedServiceRegionMismatch:
                  value:
                    class: Client::BadRequest::ManagedServiceRegionMismatch
                    message: 'Managed Service ''{{.managedServiceURN}}'' is in region ''{{.managedServiceRegion}}'': a Managed Service must be in the vRackServices region ''{{.vrackServicesRegion}}'''
                Client::BadRequest::ManagedServiceURNBadFormat:
                  value:
                    class: Client::BadRequest::ManagedServiceURNBadFormat
                    message: 'Invalid Managed Service ''{{.managedServiceURN}}'': managedServiceURN must be a valid IAM resourceURN'
                Client::BadRequest::ServiceRangeCIDRNotInSubnetCIDR:
                  value:
                    class: Client::BadRequest::ServiceRangeCIDRNotInSubnetCIDR
                    message: 'Invalid Subnet ''{{.subnetCidr}}'': ServiceRange CIDR ''{{.serviceRangeCidr}}'' is not a sub-network of the Subnet CIDR'
                Client::BadRequest::ServiceRangeCIDRNotNetworkIP:
                  value:
                    class: Client::BadRequest::ServiceRangeCIDRNotNetworkIP
                    message: 'Invalid Subnet ''{{.subnetCidr}}'': ServiceRange CIDR ''{{.serviceRangeCidr}}'' is not a base IP (network address)'
                Client::BadRequest::ServiceRangeCIDRNotPrivateNetwork:
                  value:
                    class: Client::BadRequest::ServiceRangeCIDRNotPrivateNetwork
                    message: 'Invalid Subnet ''{{.subnetCidr}}'': ServiceRange CIDR ''{{.serviceRangeCidr}}'' is not a private network address (see RFC1918)'
                Client::BadRequest::ServiceRangeCIDRPrefixLengthOutOfRange:
                  value:
                    class: Client::BadRequest::ServiceRangeCIDRPrefixLengthOutOfRange
                    message: 'Invalid Subnet ''{{.subnetCidr}}'': ServiceRange CIDR ''{{.serviceRangeCidr}}'' prefix length is out of range [{{.serviceRangeCidrPrefixLengthMin}}, {{.serviceRangeCidrPrefixLengthMax}}]'
                Client::BadRequest::ServiceRangeIPsCapacityExceeded:
                  value:
                    class: Client::BadRequest::ServiceRangeIPsCapacityExceeded
                    message: 'Invalid Subnet ''{{.subnetCidr}}'': requested ServiceEndpoints require {{.serviceEndpointsRequiredIPsCount}} IPs, it exceeds the ServiceRange ''{{.serviceRangeCidr}}'' IPs capacity ({{.serviceRangeIPsCapacity}})'
                Client::BadRequest::SubnetCIDRNotNetworkIP:
                  value:
                    class: Client::BadRequest::SubnetCIDRNotNetworkIP
                    message: 'Invalid Subnet ''{{.subnetCidr}}'': Subnet CIDR ''{{.subnetCidr}}'' is not a base IP (network address)'
                Client::BadRequest::SubnetCIDRNotPrivateNetwork:
                  value:
                    class: Client::BadRequest::SubnetCIDRNotPrivateNetwork
                    message: 'Invalid Subnet ''{{.subnetCidr}}'': Subnet CIDR ''{{.subnetCidr}}'' must be a private network address (see RFC 1918 for IPv4, RFC 4193 for IPv6)'
                Client::BadRequest::SubnetCIDROverlap:
                  value:
                    class: Client::BadRequest::SubnetCIDROverlap
                    message: 'Subnet CIDR ''{{.subnetCidr}}'' overlaps ''{{.subnetCidr2}}'': Subnet CIDRs must not overlap each other'
                Client::BadRequest::SubnetCIDRPrefixLengthIncorrect:
                  value:
                    class: Client::BadRequest::SubnetCIDRPrefixLengthIncorrect
                    message: 'Invalid Subnet ''{{.subnetCidr}}'': Subnet CIDR ''{{.subnetCidr}}'' prefix length must be between {{.subnetCidrPrefixLengthMin}} and {{.subnetCidrPrefixLengthMax}} (''{{.ipVersion}}'')'
                Client::BadRequest::SubnetDisplayNameBadFormat:
                  value:
                    class: Client::BadRequest::SubnetDisplayNameBadFormat
                    message: 'Invalid Subnet ''{{.subnetCidr}}'': invalid displayName, expected pattern ^[ a-zA-Z0-9-_.]{0,40}$'
                Client::BadRequest::SubnetLimitExceeded:
                  value:
                    class: Client::BadRequest::SubnetLimitExceeded
                    message: 'Too many Subnets: at most {{.subnetLimit}} Subnets are allowed per vRackServices'
                Client::BadRequest::SubnetVLANOutOfRange:
                  value:
                    class: Client::BadRequest::SubnetVLANOutOfRange
                    message: 'Invalid Subnet ''{{.subnetCidr}}'': VLAN {{.subnetVlan}} is out of range [{{.subnetVlanMin}}, {{.subnetVlanMax}}]'
                Client::BadRequest::VrackServicesDHCPRequiresVrack:
                  value:
                    class: Client::BadRequest::VrackServicesDHCPRequiresVrack
                    message: 'VrackServices ''{{.vrackServicesID}}'' is not associated to a vRack: DHCP/netboot requires the vRack association'
