          enum:
            - DRAFT
            - READY
            - SUSPENDED
    vrackServices.VrackServicesConfigurationStatusReasonEnum:
      type: string
      description: vRack Services configuration status reasons
      enum:
        - MISSING_VRACK_ASSOCIATION
    vrackServices.VrackServicesConfigurationStatusEnum:
      type: string
      description: vRack Services configuration status
      enum:
        - DRAFT
        - READY
        - SUSPENDED
    vrackServices.ServiceRangeCurrentState:
      type: object
      description: Service range current state
      properties:
        cidr:
          description: Service range CIDR
          readOnly: true
          type: string
          format: ip-block
          example: 192.0.2.0/24
        dhcp:
          description: DHCP configuration. Beta feature. Null when the service range has no DHCP configuration.
          nullable: true
          readOnly: true
          type: object
          properties:
            dedicatedServerInterfaceAssociations:
              type: array
              description: List of associations between dedicatedServerInterfaces and private IPs
              items:
                $ref: '#/components/schemas/vrackServices.DedicatedServerInterfaceAssociationCurrentState'
              readOnly: true
            displayName:
              type: string
              description: DHCP displayName
              nullable: true
              readOnly: true
        dhcpConfigurationStatus:
          description: DHCP configuration status. Beta feature. Null when the service range has no DHCP configuration.
          nullable: true
          readOnly: true
          type: object
          properties:
            reason:
              description: Reason for the status. Omitted when status is READY.
              nullable: true
              readOnly: true
              type: string
              enum:
                - MISSING_DEDICATED_SERVER_INTERFACE_ASSOCIATIONS
            status:
              description: Configuration status
              nullable: true
              readOnly: true
              type: string
              enum:
                - DRAFT
                - READY
        remainingIps:
          type: integer
          description: Number of IPs in the service range still available for managed service endpoints. DHCP associations are outside the service range and never counted.
          readOnly: true
        remainingReservedIps:
          type: integer
          description: Number of OVHcloud-reserved IPs still free
          nullable: true
          readOnly: true
        reservedIps:
          type: integer
          description: 'Number of OVHcloud-reserved IPs in the Service range. Deprecated: use usedReservedIps and remainingReservedIps'
          nullable: true
          readOnly: true
        serviceEndpoints:
          type: array
          description: Service endpoints
          items:
            $ref: '#/components/schemas/vrackServices.ServiceEndpoint'
          readOnly: true
        serviceEndpointsConfigurationStatus:
          description: Service endpoints configuration status
          nullable: true
          readOnly: true
          type: object
          properties:
            reason:
              type: string
              description: Reason for the status
              nullable: true
              readOnly: true
            status:
              description: Configuration status
              nullable: true
              readOnly: true
              type: string
              enum:
                - DRAFT
                - READY
        subnetCidr:
          description: Subnet CIDR
          readOnly: true
          type: string
          format: ip-block
          example: 192.0.2.0/24
        usedIps:
          type: integer
          description: Number of IPs in the service range allocated to managed service endpoints. DHCP associations are outside the service range and never counted.
          readOnly: true
        usedReservedIps:
          type: integer
          description: Number of OVHcloud-reserved IPs in use
          nullable: true
          readOnly: true
    ipBlock:
      type: string
      description: IP (v4 or v6) CIDR notation (e.g., 192.0.2.0/24)
      format: ip-block
      example: 192.0.2.0/24
    vrackServices.BgpRangeTargetSpec:
      type: object
      description: Target specification of a BGP range
      properties:
        cidr:
          description: BGP range CIDR
          type: string
          format: ip-block
          example: 192.0.2.0/24
        clientPeers:
          type: array
          description: Client peer IPs within the BGP range CIDR. Must be same IP protocol version than the referenced Subnet.
          items:
            $ref: '#/components/schemas/ip'
        infrastructurePeers:
          type: array
          description: Infrastructure peer IPs within the BGP range CIDR. Must be same IP protocol version than the referenced Subnet.
          items:
            $ref: '#/components/schemas/ip'
        subnetCidr:
          description: 'Referenced subnet CIDR. The targeted subnet must be untagged: its `vlan` property must be `null`. Tagged subnets (`vlan` in `[2 - 4094]`) cannot host a BGP range.'
          type: string
          format: ip-block
          example: 192.0.2.0/24
      required:
        - cidr
        - clientPeers
        - infrastructurePeers
        - subnetCidr
    vrackServices.ServiceRangeTarget:
      type: object
      description: Service range target specification
      properties:
        cidr:
          description: Service range CIDR
          type: string
          format: ip-block
          example: 192.0.2.0/24
        dhcp:
          description: Target specification of the DHCP configuration (Beta)
          nullable: true
          type: object
          properties:
            dedicatedServerInterfaceAssociations:
              type: array
              description: List of associations between dedicatedServerInterfaces and private IPs
              items:
                $ref: '#/components/schemas/vrackServices.DedicatedServerInterfaceAssociationTarget'
            displayName:
              type: string
              description: DHCP displayName
              nullable: true
          required:
            - dedicatedServerInterfaceAssociations
        serviceEndpoints:
          type: array
          description: Service endpoint targets
          items:
            $ref: '#/components/schemas/vrackServices.ServiceEndpointTarget'
        subnetCidr:
          description: Referenced subnet CIDR
          type: string
          format: ip-block
          example: 192.0.2.0/24
      required:
        - cidr
        - serviceEndpoints
        - subnetCidr
    ip:
      type: string
      description: IP address (e.g., 192.0.2.0)
      format: ipv4
      example: 192.0.2.0
    vrackServices.BgpConfigurationStatusReasonEnum:
      type: string
      description: BGP configuration status reasons
      enum:
        - MISSING_ALLOWED_PREFIX
        - MISSING_ALLOWED_PREFIX,MISSING_BGP_RANGE
        - MISSING_BGP_RANGE
    vrackServices.BgpConfigurationStatusEnum:
      type: string
      description: BGP configuration status
      enum:
        - DRAFT
        - READY
        - SUSPENDED
    vrackServices.DHCPCurrentState:
      type: object
      description: Current state of the DHCP/netboot block. Present on untagged subnets only (netboot).
      properties:
        dedicatedServerInterfaceAssociations:
          type: array
          description: List of associations between dedicatedServerInterfaces and private IPs
          items:
            $ref: '#/components/schemas/vrackServices.DedicatedServerInterfaceAssociationCurrentState'
          readOnly: true
        displayName:
          type: string
          description: DHCP displayName
          nullable: true
          readOnly: true
    vrackServices.DHCPConfigurationStatus:
      type: object
      description: DHCP configuration status
      properties:
        reason:
          description: Reason for the status. Omitted when status is READY.
          nullable: true
          readOnly: true
          type: string
          enum:
            - MISSING_DEDICATED_SERVER_INTERFACE_ASSOCIATIONS
        status:
          description: Configuration status
          nullable: true
          readOnly: true
          type: string
          enum:
            - DRAFT
            - READY
    vrackServices.ServiceEndpoint:
      type: object
      description: A Service Endpoint provides an access to managed services directly from one or several private IPs in the associated vRack
      properties:
        endpoints:
          type: array
          description: Endpoints representing the IPs assigned to the managed services
          items:
            $ref: '#/components/schemas/vrackServices.Endpoint'
          readOnly: true
        managedServiceURN:
          type: string
          description: IAM Resource URN of the managed service. Compatible managed service types are listed by /reference/compatibleManagedServiceType call.
          readOnly: true
    vrackServices.ServiceEndpointsConfigurationStatus:
      type: object
      description: Service endpoints configuration status
      properties:
        reason:
          type: string
          description: Reason for the status
          nullable: true
          readOnly: true
        status:
          description: Configuration status
          nullable: true
          readOnly: true
          type: string
          enum:
            - DRAFT
            - READY
    vrackServices.DHCPTarget:
      type: object
      description: Target specification of DHCP/netboot. Accepted on an untagged subnet only (netboot). A tagged subnet is rejected.
      properties:
        dedicatedServerInterfaceAssociations:
          type: array
          description: List of associations between dedicatedServerInterfaces and private IPs
          items:
            $ref: '#/components/schemas/vrackServices.DedicatedServerInterfaceAssociationTarget'
        displayName:
          type: string
          description: DHCP displayName
          nullable: true
      required:
        - dedicatedServerInterfaceAssociations
    vrackServices.ServiceEndpointTarget:
      type: object
      description: Target specification of a Service Endpoint providing an access to one managed service directly from one or several private IPs in the associated vRack
      properties:
        managedServiceURN:
          type: string
          description: IAM Resource URN of the managed service
      required:
        - managedServiceURN
    vrackServices.DedicatedServerInterfaceAssociationCurrentState:
      type: object
      description: Association between a private IP and a dedicatedServerInterface UUID
      properties:
        ip:
          description: Private IP in the subnet
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        netboot:
          type: boolean
          description: Whether netboot is active or not
          readOnly: true
        uuid:
          type: string
          description: UUID that identifies a dedicatedServerInterface
          readOnly: true
    vrackServices.DHCPConfigurationStatusReasonEnum:
      type: string
      description: DHCP configuration status reasons
      enum:
        - MISSING_DEDICATED_SERVER_INTERFACE_ASSOCIATIONS
    vrackServices.DHCPConfigurationStatusEnum:
      type: string
      description: DHCP configuration status
      enum:
        - DRAFT
        - READY
    vrackServices.Endpoint:
      type: object
      description: Endpoint holding a managed service IP
      properties:
        description:
          type: string
          description: IP description defined in the managed service
          readOnly: true
        ip:
          description: IP address assigned by OVHcloud
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
    vrackServices.ServiceEndpointsConfigurationStatusEnum:
      type: string
      description: Service endpoints configuration status
      enum:
        - DRAFT
        - READY
    vrackServices.DedicatedServerInterfaceAssociationTarget:
      type: object
      description: Association between a private IP and a dedicatedServerInterface UUID
      properties:
        ip:
          description: Private IP of the dedicatedServerInterface. Must be within the subnet CIDR, outside the service range CIDR and outside any BGP range CIDR of that subnet. The subnet's first and last addresses are reserved. Unique within the subnet.
          type: string
          format: ipv4
          example: 192.0.2.0
        uuid:
          type: string
          description: UUID that identifies a dedicatedServerInterface
      required:
        - ip
        - uuid
    GetVrackServicesCompatibleManagedServiceTypesResponse:
      type: object
      properties:
        items:
          type: array
          items:
