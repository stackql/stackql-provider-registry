          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: dedicatedServerInterface
          description: Filter on a dedicatedServerInterface
          schema:
            type: string
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
