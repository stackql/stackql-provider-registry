openapi: 3.0.0
info:
  title: OVHcloud vRack Services API
  description: vRack Services resources (subnets, service endpoints) and reference data.
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/vrackServices
paths:
  /vrackServices/reference/compatibleManagedServiceType:
    get:
      operationId: getVrackServicesCompatibleManagedServiceTypes
      summary: List compatible service types
      description: Returns the types of managed services that can get a Service Endpoint, as IAM resource types.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVrackServicesCompatibleManagedServiceTypesResponse'
              examples:
                Example:
                  value:
                    - storageNetApp
                    - anotherManagedService
                  summary: Example
      tags:
        - Reference
      x-developer-hub-navigation:
        - - Network
          - vRack Services
          - References@@@20
      x-badges:
        - color: green
          label: Stable production version
  /vrackServices/reference/featureAvailability:
    get:
      operationId: getVrackServicesFeatureAvailability
      summary: List feature availability
      description: 'Returns, per region, the availability of each feature: bgp, netboot and each compatible managed service type, overall and in each availability zone. A feature missing from a region is not offered there.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: region
          description: Restrict the list to this region
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVrackServicesFeatureAvailabilityResponse'
              examples:
                Example:
                  value:
                    - features:
                        bgp:
                          availabilityZones:
                            - name: eu-west-gra-a
                              status: AVAILABLE
                          status: AVAILABLE
                        nasHA:
                          availabilityZones:
                            - name: eu-west-gra-a
                              status: AVAILABLE
                          status: AVAILABLE
                        netboot:
                          availabilityZones:
                            - name: eu-west-gra-a
                              status: AVAILABLE
                          status: AVAILABLE
                        storageNetApp:
                          availabilityZones:
                            - name: eu-west-gra-a
                              status: UNAVAILABLE
                          status: UNAVAILABLE
                      region: eu-west-gra
                  summary: Example
      tags:
        - Reference
      x-developer-hub-navigation:
        - - Network
          - vRack Services
          - References@@@30
      x-badges:
        - color: green
          label: Stable production version
  /vrackServices/reference/region:
    get:
      operationId: getVrackServicesRegions
      summary: List regions
      description: Returns the regions where vRack Services is available.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVrackServicesRegionsResponse'
              examples:
                Example:
                  value:
                    - name: eu-west-rbx
                    - name: eu-west-lim
                    - name: eu-west-gra
                  summary: Example
      tags:
        - Reference
      x-developer-hub-navigation:
        - - Network
          - vRack Services
          - References@@@10
      x-badges:
        - color: green
          label: Stable production version
