components:
  schemas:
    iam.AuthorizeBatchRequest:
      type: object
      description: Authorization request
      properties:
        actions:
          type: array
          description: List of actions to check authorizations for
          items:
            type: string
        resourceURNs:
          type: array
          description: Resources on which accesses should be checked
          items:
            type: string
      required:
        - actions
        - resourceURNs
    iam.AuthorizeBatchResponse:
      type: object
      description: Result of an authorization request
      properties:
        authorizedActions:
          type: array
          description: Actions from your request that the caller is allowed to perform on the resource
          items:
            type: string
          readOnly: true
        resourceURN:
          type: string
          description: URN of the resource
          readOnly: true
        unauthorizedActions:
          type: array
          description: Actions from your request that the caller is not allowed to perform on the resource
          items:
            type: string
          readOnly: true
    dbaas.logs.LogKind:
      type: object
      description: A kind of log a service can emit, which you can subscribe to and forward into a stream
      properties:
        additionalReturnedFields:
          type: array
          description: List of additional log fields managed in this log kind
          items:
            type: string
          readOnly: true
        createdAt:
          type: string
          description: Creation date of the log kind
          format: date-time
          readOnly: true
        displayName:
          type: string
          description: Log kind display name
          readOnly: true
        kindId:
          type: string
          description: Identifier of the log kind
          format: uuid
          readOnly: true
        name:
          type: string
          description: Log kind name
          readOnly: true
        updatedAt:
          type: string
          description: Last update date of the log kind
          format: date-time
