openapi: 3.0.0
info:
  title: OVHcloud Identity and Access Management API
  description: 'IAM: policies, resources, resource groups, permissions groups, reference actions, authorization checks and logs.'
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/iam
paths:
  /iam/authorization/check:
    post:
      operationId: checkIamAuthorizations
      summary: Check authorizations on resources
      description: |-
        Checks the listed actions against each `resourceURN`.
        Returns, per resource, which actions are authorized and which are not.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/iam.AuthorizeBatchRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIamAuthorizationsResponse'
      tags:
        - Authorization
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management@@@10
      x-badges:
        - color: green
          label: Stable production version
  /iam/log/kind:
    get:
      operationId: getAllIamLogKinds
      summary: List log kinds
      description: Returns the names of the log kinds IAM emits, which can be forwarded to a stream. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllIamLogKindsResponse'
      tags:
        - Logs
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Account Logs
          - Access Policy Logs@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:iam/log/kind/get
          required: true
      x-expanded-response: DbaasLogsLogKind
  /iam/log/kind/{name}:
    get:
      operationId: getIamLogKind
      summary: Get a log kind
      description: Returns a log kind and the additional fields its logs carry. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogKind'
      tags:
        - Logs
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Account Logs
          - Access Policy Logs@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:iam/log/kind/get
          required: true
      x-response-identifier: name
  /iam/log/subscription:
    get:
      operationId: getAllIamLogSubscriptions
      summary: List log subscriptions
      description: Returns the identifiers of the IAM log subscriptions. Set `kind` to restrict the list to one log kind. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: kind
          description: Filter on a specific kind, for example default
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllIamLogSubscriptionsResponse'
      tags:
        - Logs
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Account Logs
          - Access Policy Logs@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:iam/log/subscription/get
          required: true
      x-expanded-response: DbaasLogsLogSubscription
    post:
      operationId: createIamLogSubscription
      summary: Create a log subscription
      description: Forwards IAM logs of one kind to a Logs Data Platform stream. The subscription is created asynchronously and the response returns the operation identifier. (Beta version)
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dbaas.logs.LogSubscriptionCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscriptionResponse'
      tags:
        - Logs
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Account Logs
          - Access Policy Logs@@@50
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:iam/log/subscription/create
          required: true
        - name: ldp:apiovh:output/graylog/stream/forwardTo
          description: Required on the targeted LDP service
          required: true
  /iam/log/subscription/{subscriptionId}:
    delete:
      operationId: deleteIamLogSubscription
      summary: Delete a log subscription
      description: Deletes the subscription and stops forwarding IAM logs to the stream. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: subscriptionId
          description: Subscription ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscriptionResponse'
      tags:
        - Logs
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Account Logs
          - Access Policy Logs@@@70
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:iam/log/subscription/delete
          required: true
    get:
      operationId: getIamLogSubscription
      summary: Get a log subscription
      description: Returns the log kind and the destination stream of a subscription. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: subscriptionId
          description: Subscription ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscription'
      tags:
        - Logs
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Account Logs
          - Access Policy Logs@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:iam/log/subscription/get
          required: true
      x-response-identifier: subscriptionId
  /iam/log/url:
    post:
      operationId: createIamLogUrl
      summary: Generate a temporary log URL
      description: Generates a temporary URL to read the logs of one kind. The URL expires. (Beta version)
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dbaas.logs.LogUrlCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.TemporaryLogsLink'
      tags:
        - Logs
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Account Logs
          - Access Policy Logs@@@60
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:iam/log/url/create
          required: true
  /iam/permissionsGroup:
    get:
      operationId: getAllIamPermissionsGroups
      summary: List permissions groups
      description: Returns the permissions groups of the account, and the platform (`ovh`) groups reusable in policies.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllIamPermissionsGroupsResponse'
              examples:
                Get permissions groups:
                  value:
                    - createdAt: '2023-05-12T13:38:15.73892Z'
                      description: Set of actions required to manage vrack products
                      id: 6956639e-3848-11ee-ae3c-0050568ce122
                      name: vrackManagement
                      owner: ovh
                      permissions:
                        allow:
                          - action: '*:vrack:*'
                      updatedAt: '2023-06-19T13:13:34.642173Z'
                      urn: urn:v1:eu:permissionsGroup:ovh:vrackManagement
                  summary: Response body returned when listing permissions groups
      tags:
        - Permissions & policies
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Policies
          - Permissions Groups@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:iam/permissionsGroup/get
          required: true
      x-response-identifier: urn
      x-expanded-response: IamPermissionsGroup
    post:
      operationId: createIamPermissionsGroup
      summary: Create a permissions group
      description: Creates a reusable allow/deny action set to attach to policies via `permissionsGroups`.
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/iam.PermissionsGroup'
            examples:
              Create a permissions group:
                value:
                  description: My custom permissions group
                  name: myPermissions
                  permissions:
                    allow:
                      - action: '*:apiovh:*'
                summary: Request body used when creating a permissions group
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam.PermissionsGroup'
              examples:
                Get a permissions group:
                  value:
                    createdAt: '2023-05-12T13:38:15.73892Z'
                    description: My custom permissions group
                    id: 6956639e-3848-11ee-ae3c-0050568ce122
                    name: myPermissions
                    owner: aa1-ovh
                    permissions:
                      allow:
                        - action: '*:apiovh:*'
                    updatedAt: '2023-06-19T13:13:34.642173Z'
                    urn: urn:v1:eu:permissionsGroup:aa1-ovh:myPermissions
                  summary: Response body returned when creating a permissions group
      tags:
        - Permissions & policies
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Policies
          - Permissions Groups@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:iam/permissionsGroup/create
          required: true
  /iam/permissionsGroup/{permissionsGroupURN}:
    delete:
      operationId: deleteIamPermissionsGroup
      summary: Delete a permissions group
      description: Deletes the permissions group. Resources and policies linked to it are not affected.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: permissionsGroupURN
          description: Permissions groupurn
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      tags:
        - Permissions & policies
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Policies
          - Permissions Groups@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:iam/permissionsGroup/delete
          required: true
    get:
      operationId: getIamPermissionsGroup
      summary: Get a permissions group
      description: Returns the name, description and permissions of the group.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: permissionsGroupURN
          description: Permissions groupurn
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam.PermissionsGroup'
              examples:
                Get a permissions group:
                  value:
                    createdAt: '2023-05-12T13:38:15.73892Z'
                    description: Set of actions required to manage vrack products
                    id: 6956639e-3848-11ee-ae3c-0050568ce122
                    name: vrackManagement
                    owner: ovh
                    permissions:
                      allow:
                        - action: '*:vrack:*'
                    updatedAt: '2023-06-19T13:13:34.642173Z'
                    urn: urn:v1:eu:permissionsGroup:ovh:vrackManagement
                  summary: Response body returned when getting a permissions group
      tags:
        - Permissions & policies
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Policies
          - Permissions Groups@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:iam/permissionsGroup/get
          required: true
      x-response-identifier: urn
    put:
      operationId: editIamPermissionsGroup
      summary: Update a permissions group
      description: Replaces the group's name, description and permissions.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: permissionsGroupURN
          description: Permissions groupurn
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/iam.PermissionsGroup'
            examples:
              Update a permissions group:
                value:
                  description: My custom permissions group
                  name: myPermissions
                  permissions:
                    allow:
                      - action: '*:apiovh:*'
                summary: Request body used when updating a permissions group
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam.PermissionsGroup'
              examples:
                Update a permissions group:
                  value:
                    createdAt: '2023-05-12T13:38:15.73892Z'
                    description: My custom permissions group
                    id: 6956639e-3848-11ee-ae3c-0050568ce122
                    name: myPermissions
                    owner: aa1-ovh
                    permissions:
                      allow:
                        - action: '*:apiovh:*'
                    updatedAt: '2023-06-19T13:13:34.642173Z'
                    urn: urn:v1:eu:permissionsGroup:aa1-ovh:myPermissions
                  summary: Response body returned when updating a permissions group
      tags:
        - Permissions & policies
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Policies
          - Permissions Groups@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:iam/permissionsGroup/edit
          required: true
  /iam/policy:
    get:
      operationId: getAllIamPolicies
      summary: List policies
      description: |-
        Returns the policies of the account. Filter with `identity`, `resourceURN` and `action`.
        Set `readOnly` to true to include the read-only policies generated by OVHcloud.
        Set `details` to true to expand resource information.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: action
          description: Filter on policies embedding the given IAM action
          schema:
            type: array
            items:
              type: string
        - in: query
          name: details
          description: Add extra information about resources in output
          schema:
            type: boolean
        - in: query
          name: identity
          description: Filter on policies embedding the given identity
          schema:
            type: array
            items:
              type: string
        - in: query
          name: readOnly
          description: Filter on the readOnly attribute
          schema:
            type: boolean
        - in: query
          name: resourceURN
          description: Filter on policies embedding the given resource URN
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllIamPoliciesResponse'
              examples:
                Get policies:
                  value:
                    - conditions:
                        operator: MATCH
                        values:
                          date(Europe/Paris).WeekDay.In: monday,tuesday
                          resource.Tag(security_level): high
                      createdAt: '2023-05-12T13:38:15.73892Z'
                      description: Delegate DNS zone management to the development team
                      id: 6956639e-3848-11ee-ae3c-0050568ce122
                      identities:
                        - urn:v1:eu:identity:group:aa1-ovh/devs
                      name: dev-dns-delegation
                      owner: aa1-ovh
                      permissions:
                        allow:
                          - action: dnsZone:apiovh:get
                          - action: dnsZone:apiovh:record/*
                        except:
                          - action: dnsZone:apiovh:record/delete
                      permissionsGroups: []
                      readOnly: false
                      resources:
                        - urn: urn:v1:eu:resource:dnsZone:example.domain.dev
                      updatedAt: '2023-06-19T13:13:34.642173Z'
                  summary: Response body returned when listing policies
      tags:
        - Permissions & policies
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Policies
          - Policies@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:iam/policy/get
          required: true
      x-response-identifier: id
      x-expanded-response: IamPolicyResponse
    post:
      operationId: createIamPolicy
      summary: Create a policy
      description: |-
        Creates a policy that grants one or more identities access to a set of resources.

        `identities` are URNs: `account` (NIC), `user` (`account-id/username`) or `group` (`account-id/group-name`).
        `resources` are `resource` or `resourceGroup` URNs.
        Both actions and resource URNs may end with `*` to match several items at once.

        `permissions.allow` is the set of granted actions: everything else is denied by default.
        `permissions.except` subtracts actions from that allow set (useful with wildcards).
        `permissions.deny` forbids actions outright and always wins, including over allows from other policies.

        Optional `permissionsGroups` attach reusable allow/deny sets defined separately.
        Optional `conditions` (AND / OR / NOT / MATCH over resource type, tags, name, request IP, date/time) must evaluate true for the policy to apply.
        Optional `expiredAt` disables the policy after that date.

        A policy can target another OVHcloud account: the recipient can re-delegate only within the rights received, never beyond them.
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/iam.policy.Creation'
            examples:
              Create a policy:
                value:
                  conditions:
                    conditions:
                      - operator: MATCH
                        values:
                          date(Europe/Paris).WeekDay.In: monday,tuesday
                          resource.Tag(security_level): high
                      - operator: MATCH
                        values:
                          date(Europe/Paris).WeekDay: monday
                          request.IP: 192.72.0.1
                    operator: OR
                  description: Delegate DNS zone management to the development team
                  identities:
                    - urn:v1:eu:identity:group:aa1-ovh/devs
                  name: dev-dns-delegation
                  permissions:
                    allow:
                      - action: dnsZone:apiovh:get
                      - action: dnsZone:apiovh:record/*
                    except:
                      - action: dnsZone:apiovh:record/delete
                  resources:
                    - urn: urn:v1:eu:resource:dnsZone:example.domain.dev
                summary: Request body used to create a policy
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam.policy.Response'
              examples:
                Policy creation response:
                  value:
                    conditions:
                      conditions:
                        - operator: MATCH
                          values:
                            date(Europe/Paris).WeekDay.In: monday,tuesday
                            resource.Tag(security_level): high
                        - operator: MATCH
                          values:
                            date(Europe/Paris).WeekDay: monday
                            request.IP: 192.72.0.1
                      operator: OR
                    createdAt: '2023-05-12T13:38:15.73892Z'
                    description: Delegate DNS zone management to the development team
                    id: 6956639e-3848-11ee-ae3c-0050568ce122
                    identities:
                      - urn:v1:eu:identity:group:aa1-ovh/devs
                    name: dev-dns-delegation
                    owner: aa1-ovh
                    permissions:
                      allow:
                        - action: dnsZone:apiovh:get
                        - action: dnsZone:apiovh:record/*
                      except:
                        - action: dnsZone:apiovh:record/delete
                    permissionsGroups: []
                    readOnly: false
                    resources:
                      - urn: urn:v1:eu:resource:dnsZone:example.domain.dev
                  summary: Response body returned when creating a policy
      tags:
        - Permissions & policies
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Policies
          - Policies@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:iam/policy/create
          required: true
  /iam/policy/{policyId}:
    delete:
      operationId: deleteIamPolicy
      summary: Delete a policy
      description: Deletes the policy and the access it granted.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: policyId
          description: Policy ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
      tags:
        - Permissions & policies
      x-developer-hub-navigation:
        - - Manage & Operate
          - Identity & Access Management
          - Policies
          - Policies@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:iam/policy/delete
          required: true
    get:
      operationId: getIamPolicy
      summary: Get a policy
      description: Returns the policy definition. Set `details` to true to expand resource information.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: details
          description: Add extra information about resources in output
          schema:
            type: boolean
        - in: path
          name: policyId
          description: Policy ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iam.policy.Response'
              examples:
                Get a policy:
                  value:
                    conditions:
                      conditions:
                        - operator: MATCH
                          values:
                            date(Europe/Paris).WeekDay.In: monday,tuesday
                            resource.Tag(security_level): high
                        - operator: MATCH
                          values:
                            date(Europe/Paris).WeekDay: monday
                            request.IP: 192.72.0.1
                      operator: OR
                    createdAt: '2023-05-12T13:38:15.73892Z'
                    description: Delegate DNS zone management to the development team
                    id: 6956639e-3848-11ee-ae3c-0050568ce122
                    identities:
                      - urn:v1:eu:identity:group:aa1-ovh/devs
                    name: dev-dns-delegation
                    owner: aa1-ovh
                    permissions:
                      allow:
                        - action: dnsZone:apiovh:get
                        - action: dnsZone:apiovh:record/*
                      except:
                        - action: dnsZone:apiovh:record/delete
