components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    email.pro.ServiceNativeWithIAM:
      type: object
      description: Email pro service
      properties:
        complexityEnabled:
          type: boolean
          description: enable policy for strong and secure passwords
          readOnly: true
        displayName:
          type: string
          description: service displayName
          nullable: true
          readOnly: true
        domain:
          type: string
          description: Domain name of your service
          readOnly: true
        hostname:
          type: string
          description: Hostname of your service
          nullable: true
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        lastUpdateDate:
          type: string
          description: Update date
          nullable: true
          format: date-time
          readOnly: true
        lockoutDuration:
          type: integer
          description: number of minutes account will remain locked if it occurs
          readOnly: true
        lockoutObservationWindow:
          type: integer
          description: number of minutes that must elapse after a failed logon to reset lockout trigger
          readOnly: true
        lockoutThreshold:
          type: integer
          description: number of attempts before account to be locked
          nullable: true
          readOnly: true
        maxPasswordAge:
          type: integer
          description: maximum number of days that account's password is valid before expiration
          nullable: true
          readOnly: true
        maxReceiveSize:
          type: integer
          description: Maximum message size that You can receive in MB
          readOnly: true
        maxSendSize:
          type: integer
          description: Maximum message size that You can send in MB
          readOnly: true
        minPasswordAge:
          type: integer
          description: minimum number of days before able to change account's password
          nullable: true
          readOnly: true
        minPasswordLength:
          type: integer
          description: minimum number of characters password must contain
          nullable: true
          readOnly: true
        offer:
          description: Type of your offer
          readOnly: true
          type: string
          enum:
            - emailpro
        spamAndVirusConfiguration:
          description: Spam and Antivirus configuration
          readOnly: true
          type: object
          properties:
            checkDKIM:
              type: boolean
              description: Check DKIM of message
              readOnly: true
            checkSPF:
              type: boolean
              description: Check SPF of message
              readOnly: true
