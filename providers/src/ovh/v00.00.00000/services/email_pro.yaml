              schema:
                $ref: '#/components/schemas/Get_v1_email_pro_service_account_email_full_accessResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@110
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: emailPro:apiovh:account/fullAccess/get
          required: true
      x-expanded-response: EmailProAccountFullAccess
      operationId: get_v1_email_pro_service_account_email_full_access
    post:
      summary: Add a full access permission
      description: Add a full access permission. Gives the account `allowedAccountId` full access to the email account, and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowedAccountId:
                  type: integer
                  description: User to give full access
              required:
                - allowedAccountId
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@130
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailPro:apiovh:account/fullAccess/grant
          required: true
      operationId: post_v1_email_pro_service_account_email_full_access
  /email/pro/{service}/account/{email}/fullAccess/{allowedAccountId}:
    delete:
      summary: Remove a full access permission
      description: Remove a full access permission. Withdraws the access of the allowed account to the mailbox of this email account, and returns the task.
