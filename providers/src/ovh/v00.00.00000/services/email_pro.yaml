      operationId: get_v1_email_pro_service_account_email_full_access_allowed_account_id
  /email/pro/{service}/account/{email}/sendAs:
    get:
      summary: List send as permissions
      description: Returns the IDs of the accounts allowed to send emails as the email account. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
