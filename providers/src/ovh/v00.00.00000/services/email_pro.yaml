      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_pro_service_account_email_send_asResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@150
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: emailPro:apiovh:account/sendAs/get
          required: true
      x-expanded-response: EmailProAccountSendAs
      operationId: get_v1_email_pro_service_account_email_send_as
    post:
      summary: Add a send as permission
      description: Add a send as permission. Allows the account `allowAccountId` to send emails as the email account, and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowAccountId:
                  type: integer
                  description: Account id to allow to send mails from this mailbox
              required:
                - allowAccountId
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@170
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailPro:apiovh:account/sendAs/grant
          required: true
      operationId: post_v1_email_pro_service_account_email_send_as
  /email/pro/{service}/account/{email}/sendAs/{allowedAccountId}:
    delete:
      summary: Remove a send as permission
      description: Remove a send as permission. Withdraws the right of the allowed account to send emails as this email account, and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: allowedAccountId
          description: Account id to give send as
          required: true
          schema:
            type: integer
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@180
      x-badges:
        - color: green
