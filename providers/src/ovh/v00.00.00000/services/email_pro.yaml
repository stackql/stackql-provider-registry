openapi: 3.0.0
info:
  title: OVHcloud Email Pro API
  description: 'Email Pro services: accounts, domains, external contacts and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/email/pro
paths:
  /email/pro:
    get:
      summary: List Email Pro services
      description: Returns the names of the Email Pro services of the account. Filter them by IAM tags with `iamTags`. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_proResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - General Information@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: emailPro:apiovh:get
          required: true
      x-expanded-response: EmailProServiceNativeWithIAM
      operationId: get_v1_email_pro
  /email/pro/{service}:
    get:
      summary: Get the Email Pro service
      description: Returns the state, offer, hostname and web interface URL of the service, its message size limits, its password and lockout policy, and its spam and virus configuration. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: service
          description: Service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.ServiceNativeWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - General Information@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: emailPro:apiovh:get
          required: true
      operationId: get_v1_email_pro_service
    put:
      summary: Update the Email Pro service
      description: Update the Email Pro service. Updates the display name, message size limits, password and lockout policy, and spam and virus configuration of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email.pro.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - General Information@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailPro:apiovh:put
          required: true
      operationId: put_v1_email_pro_service
  /email/pro/{service}/account:
    get:
      summary: List email accounts
      description: Returns the email addresses of the email accounts of the service. Filter them by `primaryEmailAddress` or `id`. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: id
          description: Filter the value of id property (like)
          schema:
            type: integer
        - in: query
          name: primaryEmailAddress
          description: Filter the value of primaryEmailAddress property (like)
          schema:
            type: string
        - in: path
          name: service
          description: Service
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_pro_service_accountResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: emailPro:apiovh:account/get
          required: true
      x-expanded-response: EmailProAccountNative
      operationId: get_v1_email_pro_service_account
  /email/pro/{service}/account/{email}:
    delete:
      summary: Delete an email account
      description: Delete an email account. Deletes the email account of the Email Pro service and returns the task. Follow it under `task/{id}`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailPro:apiovh:account/delete
          required: true
      operationId: delete_v1_email_pro_service_account_email
    get:
      summary: Get an email account
      description: Returns the login, names, domain, state, quota and usage of the email account, its renewal and expiration settings, and its spam and virus configuration. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: Service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.AccountNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: emailPro:apiovh:account/get
          required: true
      x-response-identifier: primaryEmailAddress
      operationId: get_v1_email_pro_service_account_email
    put:
      summary: Update an email account
      description: Update an email account. Updates the login, names, domain, quota, renewal period, deletion at expiration, Global Address List visibility and spam and virus configuration of the email account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email.pro.Account'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailPro:apiovh:account/edit
          required: true
      operationId: put_v1_email_pro_service_account_email
  /email/pro/{service}/account/{email}/alias:
    get:
      summary: List account aliases
      description: 'Returns the aliases of the email account: extra addresses that deliver to the same mailbox. (Alpha version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: Service
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_pro_service_account_email_aliasResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@70
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: emailPro:apiovh:account/alias/get
          required: true
      x-expanded-response: EmailProAccountAlias
      operationId: get_v1_email_pro_service_account_email_alias
    post:
      summary: Create an account alias
      description: Create an account alias. Adds the `alias` address to the email account, so that it receives its emails, and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
                  description: Alias
              required:
                - alias
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@90
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailPro:apiovh:account/alias/create
          required: true
      operationId: post_v1_email_pro_service_account_email_alias
  /email/pro/{service}/account/{email}/alias/{alias}:
    delete:
      summary: Delete an account alias
      description: Delete an account alias. Removes the alias address from the email account, which no longer receives its emails, and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: alias
          description: Alias
          required: true
          schema:
            type: string
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@100
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailPro:apiovh:account/alias/delete
          required: true
      operationId: delete_v1_email_pro_service_account_email_alias_alias
    get:
      summary: Get an account alias
      description: Returns the alias address, its creation date and the ID of its pending task, if any (`taskPendingId`). (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: alias
          description: Alias
          required: true
          schema:
            type: string
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: Service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.AccountAlias'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@80
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: emailPro:apiovh:account/alias/get
          required: true
      operationId: get_v1_email_pro_service_account_email_alias_alias
  /email/pro/{service}/account/{email}/changePassword:
    post:
      summary: Change an email account password
      description: Change an email account password. Sets the new `password` of the email account and returns the task that applies it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: new password
                  format: password
              required:
                - password
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Email Accounts@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailPro:apiovh:account/changePassword
          required: true
      operationId: post_v1_email_pro_service_account_email_change_password
  /email/pro/{service}/account/{email}/diagnostics:
    get:
      summary: Get the account diagnosis
      description: 'Returns the results of the last diagnosis of the email account: account locked, suspended or flagged as spammer, login with its credentials, MX and SRV records, and sending and receiving of emails. (Alpha version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: Service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.AccountDiagnosis'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Diagnostics@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: emailPro:apiovh:account/diagnostics/get
          required: true
      operationId: get_v1_email_pro_service_account_email_diagnostics
    post:
      summary: Run an account diagnosis
      description: Run an account diagnosis. Starts a diagnosis of the email account, which requires the account `password`, and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Account password
              required:
                - password
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.pro.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Email Pro
          - Diagnostics@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailPro:apiovh:account/diagnostics/create
          required: true
      operationId: post_v1_email_pro_service_account_email_diagnostics
  /email/pro/{service}/account/{email}/fullAccess:
    get:
      summary: List full access permissions
      description: Returns the IDs of the accounts that have full access to the email account. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: Service
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
