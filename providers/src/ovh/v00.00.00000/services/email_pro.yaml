            type: integer
        - in: path
          name: email
          description: Default email for this mailbox
          required: true
          schema:
            type: string
        - in: path
          name: service
          description: The internal name of your pro organization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
