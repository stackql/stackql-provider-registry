openapi: 3.0.0
info:
  title: OVHcloud Public Cloud API
  description: 'Public Cloud projects and their core compute surface: projects, instances, flavors, images, SSH keys, regions, quotas, users, usage and billing, operations and project lifecycle actions.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/cloud
paths:
  /cloud/agreements:
    get:
      summary: Get agreements related to a product
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: product
          description: Name of a product supported by cloud projects
          required: true
          schema:
            $ref: '#/components/schemas/cloud.project.ProductNameEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.project.ProductAgreements'
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:publicCloudProject/agreements/get
          required: true
      operationId: get_v1_cloud_agreements
      description: Get agreements related to a product (Beta version)
    servers:
      - url: https://{api_host}/v1
        variables:
          api_host:
            description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
            default: api.eu.ovhcloud.com
            x-stackQL-envVarSelector:
              envVar: OVH_ENDPOINT
              default: ovh-eu
              values:
                ovh-eu: api.eu.ovhcloud.com
                ovh-ca: api.ca.ovhcloud.com
                ovh-us: api.us.ovhcloud.com
  /cloud/eligibility:
    get:
      summary: Check project order eligibility
      description: Check project order eligibility. Returns the actions required before ordering a project, the minimum credit and the accepted payment methods. Give a voucher code to check its credit at the same time. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: voucher
          description: Voucher code
          schema:
            type: string
            format: password
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.project.EligibilityInfo'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Lifecycle@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:publicCloudProject/eligibility/get
          required: true
      operationId: get_v1_cloud_eligibility
    servers:
      - url: https://{api_host}/v1
        variables:
          api_host:
            description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
            default: api.eu.ovhcloud.com
            x-stackQL-envVarSelector:
              envVar: OVH_ENDPOINT
              default: ovh-eu
              values:
                ovh-eu: api.eu.ovhcloud.com
                ovh-ca: api.ca.ovhcloud.com
                ovh-us: api.us.ovhcloud.com
  /cloud/order:
    get:
      summary: Get all cloud pending orders
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: planCode
          description: Order plan code
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_cloud_orderResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:cloud/order/get
          required: true
      operationId: get_v1_cloud_order
      description: Get all cloud pending orders
    servers:
      - url: https://{api_host}/v1
        variables:
          api_host:
            description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
            default: api.eu.ovhcloud.com
            x-stackQL-envVarSelector:
              envVar: OVH_ENDPOINT
              default: ovh-eu
              values:
                ovh-eu: api.eu.ovhcloud.com
                ovh-ca: api.ca.ovhcloud.com
                ovh-us: api.us.ovhcloud.com
  /cloud/order/rule/availability:
    get:
      summary: Get product availability
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: addonFamily
          description: Addon family filter
          schema:
            type: string
        - in: query
          name: ovhSubsidiary
          description: OVH subsidiary
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.OvhSubsidiaryEnum'
        - in: query
          name: planCode
          description: Plan code filter
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.order.rule.Availability'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:cloud/order/rule/availability/get
          required: true
      operationId: get_v1_cloud_order_rule_availability
      description: Get product availability
    servers:
      - url: https://{api_host}/v1
        variables:
          api_host:
            description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
            default: api.eu.ovhcloud.com
            x-stackQL-envVarSelector:
              envVar: OVH_ENDPOINT
              default: ovh-eu
              values:
                ovh-eu: api.eu.ovhcloud.com
                ovh-ca: api.ca.ovhcloud.com
                ovh-us: api.us.ovhcloud.com
  /cloud/project:
    get:
      operationId: getProjects
      summary: List available public cloud projects
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectsResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:get
          required: true
      x-expanded-response: CloudProjectWithIAM
      description: List available public cloud projects
    servers:
      - url: https://{api_host}/v1
        variables:
          api_host:
            description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
            default: api.eu.ovhcloud.com
            x-stackQL-envVarSelector:
              envVar: OVH_ENDPOINT
              default: ovh-eu
              values:
                ovh-eu: api.eu.ovhcloud.com
                ovh-ca: api.ca.ovhcloud.com
                ovh-us: api.us.ovhcloud.com
  /cloud/project/{serviceName}:
    get:
      operationId: getProject
      summary: Get a public cloud project properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.ProjectWithIAM'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:get
          required: true
      description: Get a public cloud project properties
    put:
      summary: Alter this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloud.Project'
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:edit
          required: true
      operationId: put_v1_cloud_project_service_name
      description: Alter this object properties
    servers:
      - url: https://{api_host}/v1
        variables:
          api_host:
            description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
            default: api.eu.ovhcloud.com
            x-stackQL-envVarSelector:
              envVar: OVH_ENDPOINT
              default: ovh-eu
              values:
                ovh-eu: api.eu.ovhcloud.com
                ovh-ca: api.ca.ovhcloud.com
                ovh-us: api.us.ovhcloud.com
  /acl:
    get:
      summary: List project ACLs
      description: List project ACLs. Returns the OVHcloud accounts that have access to the project. Filter by access type with the `type` parameter.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: type
          description: Filter the value of type property (=)
          schema:
            $ref: '#/components/schemas/cloud.AclTypeEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_cloud_project_service_name_aclResponse'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Access Control@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:acl/get
          required: true
      x-expanded-response: CloudAcl
      operationId: get_v1_cloud_project_service_name_acl
    post:
      summary: Grant access to the project
      description: Grant access to the project. Gives another OVHcloud account read-only or read-write access to the project.
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  description: Deleguates rights to
                type:
                  description: Acl type
                  $ref: '#/components/schemas/cloud.AclTypeEnum'
              required:
                - accountId
                - type
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.Acl'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Access Control@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:acl/create
          required: true
      operationId: post_v1_cloud_project_service_name_acl
  /acl/{accountId}:
    delete:
      summary: Revoke access to the project
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: accountId
          description: OVH customer unique identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Access Control@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:acl/delete
          required: true
      operationId: delete_v1_cloud_project_service_name_acl_account_id
      description: Revoke access to the project
    get:
      summary: Get a project ACL
      description: 'Get a project ACL. Returns the access type of one OVHcloud account on the project: read-only or read-write.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: accountId
          description: OVH customer unique identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.Acl'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Access Control@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:acl/get
          required: true
      operationId: get_v1_cloud_project_service_name_acl_account_id
  /activateMonthlyBilling:
    post:
      summary: Activate monthly billing on multiple instances
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloud.ProjectActivateMonthlyBillingCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_cloud_project_service_name_activate_monthly_billingResponse'
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:activateMonthlyBilling
          required: true
      operationId: post_v1_cloud_project_service_name_activate_monthly_billing
      description: Activate monthly billing on multiple instances (Beta version)
  /alerting:
    get:
      operationId: getAlertingConfigurations
      summary: List billing alerts
      description: Returns the IDs of the billing alerts configured on the project.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertingConfigurationsResponse'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Alerting@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:alerting/get
          required: true
      x-expanded-response: CloudAlertingAlerting
    post:
      operationId: addAlerting
      summary: Create a billing alert
      description: Creates a billing alert with a monthly threshold, for one service or for all services. Sends an email to the receivers when the monthly spend on the service exceeds the threshold. Use `emails`, as `email` is deprecated.
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloud.alerting.Alerting'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.alerting.Alerting'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Alerting@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:alerting/create
          required: true
  /alerting/{id}:
    delete:
      operationId: deleteAlerting
      summary: Delete a billing alert
      description: Deletes the billing alert configuration.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Alerting@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:alerting/delete
          required: true
    get:
      operationId: getAlertingConfiguration
      summary: Get a billing alert
      description: 'Returns the configuration of the billing alert: threshold, service, receivers and status.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.alerting.Alerting'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Alerting@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:alerting/get
          required: true
      x-response-identifier: id
    put:
      operationId: updateAlerting
      summary: Update a billing alert
      description: Updates the threshold, service, receivers, delay or status of the billing alert. Use `emails`, as `email` is deprecated.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloud.alerting.AlertingUpdate'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Alerting@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:alerting/edit
          required: true
  /alerting/{id}/alert:
    get:
      operationId: getAlerts
      summary: List sent alerts
      description: Returns the IDs of the alerts already sent for this billing alert.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertsResponse'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Alerting@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:alerting/alert/get
          required: true
      x-expanded-response: CloudAlertingAlert
  /alerting/{id}/alert/{alertId}:
    get:
      operationId: getAlert
      summary: Get a sent alert
      description: Returns when the alert was sent and to which email addresses.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: alertId
          description: Alert ID
          required: true
          schema:
            type: integer
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.alerting.Alert'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Alerting@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:alerting/alert/get
          required: true
      x-response-identifier: alertId
  /bill:
    get:
      summary: List project bills. Returns the bills of the project between the `from` and `to` dates.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: from
          description: Get bills from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          description: Get bills to
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_cloud_project_service_name_billResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:bill/get
          required: true
      operationId: get_v1_cloud_project_service_name_bill
      description: List project bills. Returns the bills of the project between the `from` and `to` dates.
  /cancel:
    post:
      summary: Cancel project creation
      security:
        - oAuth2AuthCode: []
      parameters: []
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:cancel
          required: true
      operationId: post_v1_cloud_project_service_name_cancel
      description: Cancel project creation
  /capabilities/productAvailability:
    get:
      summary: List product availability
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: addonFamily
          description: Addon family filter
          schema:
            type: string
        - in: query
          name: ovhSubsidiary
          description: OVH subsidiary
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.OvhSubsidiaryEnum'
        - in: query
          name: planCode
          description: Plan code filter
          schema:
            type: string
        - in: query
          name: planFamily
          description: Plan family filter (deprecated, use addonFamily instead)
          schema:
            type: string
        - in: query
          name: product
          description: Product filter
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.capabilities.Availability'
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:capabilities/productAvailability/get
          required: true
      operationId: get_v1_cloud_project_service_name_capabilities_product_availability
      description: List product availability (Beta version)
  /changeContact:
    post:
      summary: Change service contacts
      description: Change service contacts. Starts a procedure to change the admin, tech or billing contact of the service.
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactAdmin:
                  type: string
                  description: The contact to set as admin contact
                contactBilling:
                  type: string
                  description: The contact to set as billing contact
                contactTech:
                  type: string
                  description: The contact to set as tech contact
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_cloud_project_service_name_change_contactResponse'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Lifecycle@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:changeContact
          required: true
      operationId: post_v1_cloud_project_service_name_change_contact
  /confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given.
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Lifecycle@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:confirmTermination
          required: true
      operationId: post_v1_cloud_project_service_name_confirm_termination
  /credit:
    get:
      summary: List project credits. Returns the IDs of the credits added to the project.
