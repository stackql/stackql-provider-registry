                  description: Existing private network
                  nullable: true
                  type: object
                  properties:
                    id:
                      type: string
                      description: Network ID
                      format: uuid
                    subnetId:
                      type: string
                      description: Existing Subnet ID
                      format: uuid
                networkCreate:
                  description: Information to create a new private network
                  nullable: true
                  type: object
                  properties:
                    name:
                      type: string
                      description: Network name
