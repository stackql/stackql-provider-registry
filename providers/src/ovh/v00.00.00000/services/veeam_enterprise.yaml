openapi: 3.0.0
info:
  title: OVHcloud Veeam Enterprise API
  description: Veeam Backup and Replication Enterprise licenses.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/veeam/veeamEnterprise
paths:
  /veeam/veeamEnterprise:
    get:
      summary: List Veeam Enterprise Plus services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_veeam_veeam_enterpriseResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Backup & Disaster recovery solutions
          - Veeam Enterprise Plus
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamEnterprise:apiovh:get
          required: true
      x-expanded-response: VeeamVeeamEnterpriseAccountWithIAM
      operationId: get_v1_veeam_veeam_enterprise
      description: List Veeam Enterprise Plus services
  /veeam/veeamEnterprise/{serviceName}:
    get:
      summary: Get Veeam Enterprise Plus
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veeam.veeamEnterprise.AccountWithIAM'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Backup & Disaster recovery solutions
          - Veeam Enterprise Plus
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamEnterprise:apiovh:get
          required: true
      operationId: get_v1_veeam_veeam_enterprise_service_name
      description: Get Veeam Enterprise Plus
  /veeam/veeamEnterprise/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Backup & Disaster recovery solutions
          - Veeam Enterprise Plus
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamEnterprise:apiovh:confirmTermination
          required: true
      operationId: post_v1_veeam_veeam_enterprise_service_name_confirm_termination
  /veeam/veeamEnterprise/{serviceName}/register:
    post:
      summary: Register Veeam backup server
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ip:
                  description: Your Veeam Backup And Replication Server IP
                  $ref: '#/components/schemas/ip'
                password:
                  type: string
                  description: Your Veeam Backup And Replication associated password
                  format: password
                username:
                  type: string
                  description: Your Veeam Backup And Replication username
              required:
                - ip
                - password
                - username
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_veeam_veeam_enterprise_service_name_registerResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Backup & Disaster recovery solutions
          - Veeam Enterprise Plus
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamEnterprise:apiovh:register
          required: true
      operationId: post_v1_veeam_veeam_enterprise_service_name_register
      description: Register Veeam backup server
  /veeam/veeamEnterprise/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Backup & Disaster recovery solutions
          - Veeam Enterprise Plus
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamEnterprise:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_veeam_veeam_enterprise_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Storage & Backup
          - Backup & Disaster recovery solutions
          - Veeam Enterprise Plus
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamEnterprise:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_veeam_veeam_enterprise_service_name_service_infos
  /veeam/veeamEnterprise/{serviceName}/task:
    get:
      summary: List operations
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: name
          description: Filter the value of name property (like)
          schema:
            type: string
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
        - in: query
          name: state
          description: Filter the value of state property (=)
          schema:
            $ref: '#/components/schemas/veeamEnterprise.TaskStateEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_veeam_veeam_enterprise_service_name_taskResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Backup & Disaster recovery solutions
          - Veeam Enterprise Plus
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamEnterprise:apiovh:task/get
          required: true
      x-expanded-response: VeeamVeeamEnterpriseTask
      operationId: get_v1_veeam_veeam_enterprise_service_name_task
      description: List operations
  /veeam/veeamEnterprise/{serviceName}/task/{taskId}:
    get:
      summary: Get operation
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          description: Task id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veeam.veeamEnterprise.Task'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Backup & Disaster recovery solutions
          - Veeam Enterprise Plus
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamEnterprise:apiovh:task/get
          required: true
      operationId: get_v1_veeam_veeam_enterprise_service_name_task_task_id
      description: Get operation
  /veeam/veeamEnterprise/{serviceName}/terminate:
    post:
      summary: Request service termination
      description: Request service termination. Starts the termination of the service. The admin contact receives a token by email, to confirm with the `confirmTermination` call.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Storage & Backup
          - Backup & Disaster recovery solutions
          - Veeam Enterprise Plus
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamEnterprise:apiovh:terminate
          required: true
      operationId: post_v1_veeam_veeam_enterprise_service_name_terminate
  /veeam/veeamEnterprise/{serviceName}/update:
    post:
      summary: Update Veeam Enterprise Plus configuration
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Domain of the service
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ip:
                  description: Your Veeam Backup And Replication Server IP
                  $ref: '#/components/schemas/ip'
                password:
                  type: string
                  description: Your Veeam Backup And Replication associated password
                  format: password
                username:
                  type: string
                  description: Your Veeam Backup And Replication username
              required:
                - ip
                - password
                - username
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_veeam_veeam_enterprise_service_name_updateResponse'
      x-developer-hub-navigation:
        - - Storage & Backup
          - Backup & Disaster recovery solutions
          - Veeam Enterprise Plus
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: veeamEnterprise:apiovh:update
          required: true
      operationId: post_v1_veeam_veeam_enterprise_service_name_update
      description: Update Veeam Enterprise Plus configuration
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    veeam.veeamEnterprise.AccountWithIAM:
      type: object
      description: Veeam Enterprise Plus
      properties:
        activationStatus:
          description: Activation status for your Veeam backup server
          readOnly: true
          type: string
          enum:
            - cancelled
            - doing
            - done
            - todo
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        ip:
          description: This Backup Server IP
          nullable: true
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        serviceName:
          type: string
          description: Your Veeam Enterprise Service name
          readOnly: true
        sourceIp:
          description: OVH Enterprise Manager IP
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
    service.TerminationFutureUseEnum:
      type: string
      description: All future uses you can provide for a service termination
      enum:
        - NOT_REPLACING_SERVICE
        - OTHER
        - SUBSCRIBE_AN_OTHER_SERVICE
        - SUBSCRIBE_OTHER_KIND_OF_SERVICE_WITH_COMPETITOR
        - SUBSCRIBE_SIMILAR_SERVICE_WITH_COMPETITOR
    service.TerminationReasonEnum:
      type: string
      description: All reasons you can provide for a service termination
      enum:
        - FEATURES_DONT_SUIT_ME
        - LACK_OF_PERFORMANCES
        - MIGRATED_TO_ANOTHER_OVH_PRODUCT
        - MIGRATED_TO_COMPETITOR
        - NOT_ENOUGH_RECOGNITION
        - NOT_NEEDED_ANYMORE
        - NOT_RELIABLE
        - NO_ANSWER
        - OTHER
        - PRODUCT_DIMENSION_DONT_SUIT_ME
        - PRODUCT_TOOLS_DONT_SUIT_ME
        - TOO_EXPENSIVE
        - TOO_HARD_TO_USE
        - UNSATIFIED_BY_CUSTOMER_SUPPORT
    ip:
      type: string
      description: IP address (e.g., 192.0.2.0)
      format: ipv4
      example: 192.0.2.0
    veeam.veeamEnterprise.Task:
      type: object
      description: Operation with the Enterprise Account
      properties:
        endDate:
          type: string
          description: Task completion date
          nullable: true
          format: date-time
          readOnly: true
        name:
          type: string
          description: Task name
          readOnly: true
        progress:
          type: integer
          description: Current progress
          readOnly: true
        startDate:
          type: string
          description: Task creation date
          nullable: true
          format: date-time
          readOnly: true
        state:
          description: Current Task state
          readOnly: true
          type: string
          enum:
            - canceled
            - doing
            - done
            - error
            - toCreate
            - todo
            - unfixed
            - waiting
            - waitingForChilds
        taskId:
          type: integer
          description: Task id
          readOnly: true
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - automaticV2024
            - manual
            - oneShot
            - option
        serviceId:
          type: integer
          readOnly: true
        status:
          readOnly: true
          type: string
          enum:
            - autorenewInProgress
            - expired
            - inCreation
            - ok
            - pendingDebt
            - unPaid
    veeamEnterprise.TaskStateEnum:
      type: string
      description: All possible states for a Veeam Enterprise Task
      enum:
        - canceled
        - doing
        - done
        - error
        - toCreate
        - todo
        - unfixed
        - waiting
        - waitingForChilds
    iam.resource.TagFilter.OperatorEnum:
      type: string
      description: Operator that can be used in order to filter resources tags
      enum:
        - EQ
        - EXISTS
        - ILIKE
        - LIKE
        - NEQ
        - NEXISTS
    veeamEnterprise.ActivationStatusEnum:
      type: string
      description: All possible states for a Veeam Enterprise activation status
      enum:
        - cancelled
        - doing
        - done
        - todo
    iam.ResourceMetadata:
      type: object
      description: IAM resource metadata embedded in services models
      properties:
        displayName:
          type: string
          description: Resource display name
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the resource
          format: uuid
          readOnly: true
        state:
          description: Resource state
          nullable: true
          readOnly: true
          type: string
          enum:
            - EXPIRED
            - IN_CREATION
            - OK
            - SUSPENDED
        tags:
          type: object
          description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
          nullable: true
          additionalProperties:
            type: string
          readOnly: true
        urn:
          type: string
          description: Unique resource name used in policies
          readOnly: true
    service.RenewType:
      type: object
      description: Map a possible renew for a specific service
      properties:
        automatic:
          type: boolean
          description: The service is automatically renewed
        deleteAtExpiration:
          type: boolean
          description: The service will be deleted at expiration
        forced:
          type: boolean
          description: The service forced to be renewed
        manualPayment:
          type: boolean
          description: The service needs to be manually renewed and paid
          nullable: true
        period:
          type: integer
          description: period of renew in month
          nullable: true
    service.RenewalTypeEnum:
      type: string
      description: Detailed renewal type of a service
      enum:
        - automaticForcedProduct
        - automaticV2012
        - automaticV2014
        - automaticV2016
        - automaticV2024
        - manual
        - oneShot
        - option
    service.StateEnum:
      type: string
      enum:
        - autorenewInProgress
        - expired
        - inCreation
        - ok
        - pendingDebt
        - unPaid
    iam.ResourceMetadata.StateEnum:
      type: string
      description: Resource state
      enum:
        - EXPIRED
        - IN_CREATION
        - OK
        - SUSPENDED
    Get_v1_veeam_veeam_enterpriseResponse:
      type: object
      properties:
        v1_veeam_veeam_enterprise:
          type: array
          items:
            $ref: '#/components/schemas/veeam.veeamEnterprise.AccountWithIAM'
    Post_v1_veeam_veeam_enterprise_service_name_registerResponse:
      type: object
      properties:
        post_v1_veeam_veeam_enterprise_service_name_register:
          type: array
          items:
            $ref: '#/components/schemas/veeam.veeamEnterprise.Task'
    Get_v1_veeam_veeam_enterprise_service_name_taskResponse:
      type: object
      properties:
        v1_veeam_veeam_enterprise_service_name_task:
          type: array
          items:
            $ref: '#/components/schemas/veeam.veeamEnterprise.Task'
    Post_v1_veeam_veeam_enterprise_service_name_updateResponse:
      type: object
      properties:
        post_v1_veeam_veeam_enterprise_service_name_update:
          type: array
          items:
            $ref: '#/components/schemas/veeam.veeamEnterprise.Task'
