openapi: 3.0.0
info:
  title: OVHcloud Connectivity API
  description: Connectivity eligibility tests, maintenance and monitoring for network access offers.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/connectivity
paths:
  /connectivity/eligibility/recall:
    get:
      summary: List eligibility recalls
      description: Returns the eligibility recalls of the account, with their address or building reference, the requested fiber offers and whether each one is completed.
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_connectivity_eligibility_recallResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Recall@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/eligibility/recall/list
          required: true
      x-response-identifier: id
      x-expanded-response: ConnectivityEligibilityEligibilityRecall
      operationId: get_v1_connectivity_eligibility_recall
    post:
      summary: Create an eligibility recall
      description: Creates a recall on an address or building reference, to check again its eligibility to Pro Fiber FTTH or Dedicated Fiber FTTO/FTTE. Returns the created recall.
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.EligibilityRecall.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectivity.eligibility.EligibilityRecall'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Recall@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/eligibility/recall/create
          required: true
      operationId: post_v1_connectivity_eligibility_recall
  /connectivity/eligibility/recall/{id}:
    delete:
      summary: Delete an eligibility recall
      description: Deletes the eligibility recall of an address or building reference.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Recall@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/eligibility/recall/delete
          required: true
      operationId: delete_v1_connectivity_eligibility_recall_id
    get:
      summary: Get an eligibility recall
      description: 'Returns an eligibility recall: its address or building reference, the fiber offers it checks (Pro Fiber FTTH, Dedicated Fiber FTTO/FTTE), and its creation, update and completion dates.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectivity.eligibility.EligibilityRecall'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Recall@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/eligibility/recall/get
          required: true
      x-response-identifier: id
      operationId: get_v1_connectivity_eligibility_recall_id
    put:
      summary: Update an eligibility recall
      description: Updates the reference and the fiber offers to check of an eligibility recall. Returns the updated recall.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.EligibilityRecall.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectivity.eligibility.EligibilityRecall'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Recall@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/eligibility/recall/edit
          required: true
      operationId: put_v1_connectivity_eligibility_recall_id
  /connectivity/eligibility/search/addresses:
    post:
      operationId: eligibilitySearchAddresses
      summary: Search the addresses near a location
      description: Returns, as an asynchronous task, the addresses around a GPS location with their coordinates, street code, building reference and distance. The search radius is 10 meters by default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.search.addresses.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTaskArray_connectivity.eligibility.AddressWithCoordinates'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Search@@@10
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/search/buildingDetails:
    post:
      operationId: getBuildingDetails
      summary: Get the details of a building
      description: Returns, as an asynchronous task, the name, type, NRO and stairs of a building given by its identifier. Get the identifier with the search/buildings calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.search.buildingDetails.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTask_connectivity.eligibility.Building'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Search@@@20
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/search/buildings:
    post:
      operationId: getBuildings
      summary: Search the buildings of an address
      description: Returns, as an asynchronous task, the buildings at an address with their reference, name, type, NRO and stairs. The address needs at least a street code and street number, or a Hexacle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.search.buildings.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTaskArray_connectivity.eligibility.Building'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Search@@@30
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/search/buildingsByLine:
    post:
      operationId: getBuildingsByLine
      summary: Search the buildings of a line number
      description: Returns, as an asynchronous task, the buildings linked to a line number and its status, with their reference, name, type, NRO and stairs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.search.buildingsByLine.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTaskArray_connectivity.eligibility.Building'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Search@@@40
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/search/cities:
    post:
      operationId: getCities
      summary: Search the localities of a zip code
      description: Returns, as an asynchronous task, the cities and localities linked to a zip code with their INSEE code. Use the INSEE code to search the streets of a locality.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.search.Cities'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTaskArray_connectivity.eligibility.City'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Search@@@50
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/search/lines:
    post:
      operationId: getLines
      summary: Search the lines at an address
      description: '**Deprecated**: this endpoint is scheduled for deletion. Returns, as an asynchronous task, the inactive copper lines at an address, and the active ones when the owner name is given (at least its first three characters). (Deprecated, will be removed)'
      deprecated: true
      x-deprecation-date: '2026-04-08T00:00:00Z'
      x-deletion-date: '2026-07-08T00:00:00Z'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.search.lines.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTaskArray_connectivity.eligibility.Line'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Search@@@60
      x-badges:
        - color: red
          label: Deprecated, will be removed
  /connectivity/eligibility/search/meetings:
    post:
      operationId: getMeetings
      summary: Search the installation meeting slots
      description: Returns, as an asynchronous task, the available time slots for a copper line creation or a fiber installation meeting, for an eligibility test reference and a chosen offer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.search.meetings.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTask_connectivity.eligibility.Meetings'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Search@@@70
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/search/streetNumbers:
    post:
      operationId: getStreetNumbers
      summary: Search the numbers of a street
      description: Returns, as an asynchronous task, the available street numbers of a street given by its street code. Get the street code with search/streets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.search.streetNumbers.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTaskArray_string'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Search@@@80
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/search/streetNumbers/details:
    post:
      operationId: getStreetNumbersDetails
      summary: Search the numbers of a street with their details
      description: Returns, as an asynchronous task, the available street numbers of a street given by its street code, each with its Hexacle address identifier. Get the street code with search/streets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.search.streetNumbers.details.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTaskArray_connectivity.eligibility.StreetNumberDetails'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Search@@@90
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/search/streets:
    post:
      operationId: getStreets
      summary: Search the streets of a locality
      description: Returns, as an asynchronous task, the streets of a locality given by its INSEE code, with their name, street code and alternative code. Get the INSEE code with search/cities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.search.streets.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTaskArray_connectivity.eligibility.Street'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Search@@@100
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/test:
    get:
      operationId: getEligibility
      summary: Get an eligibility test
      description: 'Returns the result of an eligibility test from its reference: the tested endpoint (address, copper or fiber details, portability) and the offers with their eligibility, estimated rates and reasons when not eligible.'
      parameters:
        - in: query
          name: eligibilityReference
          description: Eligibility reference
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectivity.eligibility.EligibilityTest'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Test@@@10
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/test/address:
    post:
      operationId: testAddressEligibility
      summary: Test the eligibility of an address
      description: Starts an eligibility test on an address, given by its street code and street number or by its Hexacle. Get them with the search/streets and search/streetNumbers/details calls. Returns an asynchronous task, pending until its result holds the eligibility reference, the endpoint and the eligible offers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.test.address.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTask_connectivity.eligibility.EligibilityTest'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Test@@@20
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/test/address/partners:
    post:
      operationId: testPartnersAddressEligibility
      summary: Test the eligibility of an address for a partner
      description: Starts an eligibility test on an address, given by its street code and street number or by its Hexacle. Reserved for partners. Returns an asynchronous task, pending until its result holds the eligibility reference, the endpoint and the eligible offers.
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.test.address.partners.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTask_connectivity.eligibility.EligibilityTest'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Test@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/eligibility/test/address/partners/create
          required: true
  /connectivity/eligibility/test/building:
    post:
      operationId: testBuildingEligibility
      summary: Test the eligibility of a building
      description: Starts an eligibility test on a building, for fiber only. Get the building identifier with the search/buildings calls. Set productFamily to scope the test (ISP by default). Returns an asynchronous task, pending until its result holds the eligibility reference, the endpoint and the eligible offers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.test.building.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTask_connectivity.eligibility.EligibilityTest'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Test@@@40
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/test/building/partners:
    post:
      operationId: testPartnersBuildingEligibility
      summary: Test the eligibility of a building for a partner
      description: Starts an eligibility test on a building, for fiber only. Reserved for partners. Get the building identifier with the search/buildings calls. Returns an asynchronous task, pending until its result holds the eligibility reference, the endpoint and the eligible offers.
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.test.building.partners.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTask_connectivity.eligibility.EligibilityTest'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Test@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/eligibility/test/building/partners/create
          required: true
  /connectivity/eligibility/test/line:
    post:
      operationId: testLineEligibility
      summary: Test the eligibility of a copper line
      description: Starts an eligibility test on a line number, for copper only. Returns an asynchronous task, pending until its result holds the eligibility reference, the endpoint and the eligible offers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.test.line.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTask_connectivity.eligibility.EligibilityTest'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Test@@@60
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/test/line/partners:
    post:
      operationId: testPartnersLineEligibility
      summary: Test the eligibility of a copper line for a partner
      description: Starts an eligibility test on a line number, for copper only. Reserved for partners. Returns an asynchronous task, pending until its result holds the eligibility reference, the endpoint and the eligible offers.
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.test.line.partners.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTask_connectivity.eligibility.EligibilityTest'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Test@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/eligibility/test/line/partners/create
          required: true
  /connectivity/eligibility/test/otp:
    post:
      operationId: testOTPEligibility
      summary: Test the eligibility of an OTP
      description: Starts an eligibility test on an Optical Termination Panel (OTP) identifier, for fiber only. Returns an asynchronous task, pending until its result holds the eligibility reference, the endpoint and the eligible offers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.test.otp.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTask_connectivity.eligibility.EligibilityTest'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Test@@@80
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/eligibility/test/otp/partners:
    post:
      operationId: testPartnersOtpEligibility
      summary: Test the eligibility of an OTP for a partner
      description: Starts an eligibility test on an Optical Termination Panel (OTP) identifier, for fiber only. Reserved for partners. Returns an asynchronous task, pending until its result holds the eligibility reference, the endpoint and the eligible offers.
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectivity.eligibility.test.otp.partners.post'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/xdsl.AsyncTask_connectivity.eligibility.EligibilityTest'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Eligibility
          - Test@@@90
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/eligibility/test/otp/partners/create
          required: true
  /connectivity/maintenance/workPlanned/partners:
    get:
      operationId: getPartnersPlannedWork
      summary: List the work planned by operators for a partner
      description: Returns the planned work operations of network operators, with their dates, duration, impact, impacted NRA/NRO and departments. Reserved for partners.
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPartnersPlannedWorkResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Maintenance@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/maintenance/workPlanned/partners/get
          required: true
  /connectivity/maintenance/workPlanned/public:
    get:
      operationId: getPlannedWork
      summary: List the work planned by operators
      description: Returns the planned work operations of network operators, with their dates, duration, impact, impacted NRA/NRO and departments. Filter on the begin and end dates.
      parameters:
        - in: query
          name: beginDate
          description: List only work planned started after this date
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          description: List only work planned ending prior to this date
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlannedWorkResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Maintenance@@@20
      x-badges:
        - color: green
          label: Stable production version
  /connectivity/monitoring/genericIncident/partners:
    get:
      operationId: getPartnersGenericIncident
      summary: List the generic incidents for a partner
      description: Returns the detected, validated and recently closed generic incidents, with their impacted operators, technologies, NRA/NRO and departments, and their estimated resolution date. Reserved for partners.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: creationDate
          description: List only incidents created after this date
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          description: List only incidents closed prior to this date
          schema:
            type: string
            format: date-time
        - in: query
          name: status
          description: Filter by the status of the incident (detected, validated or closed)
          schema:
            $ref: '#/components/schemas/connectivity.monitoring.GenericIncidentStatusEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPartnersGenericIncidentResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Monitoring@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:connectivity/monitoring/genericIncident/partners/get
          required: true
  /connectivity/monitoring/genericIncident/public:
    get:
      operationId: getGenericIncident
      summary: List the generic incidents
      description: Returns the validated and recently closed generic incidents, with their impacted operators, technologies, NRA/NRO and departments, and their estimated resolution date. Filter on the dates and the status.
      parameters:
        - in: query
          name: creationDate
          description: List only incidents created after this date
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          description: List only incidents closed prior to this date
          schema:
            type: string
            format: date-time
        - in: query
          name: status
          description: Filter by the status of the incident (validated or closed)
          schema:
            $ref: '#/components/schemas/connectivity.monitoring.GenericIncidentStatusEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
