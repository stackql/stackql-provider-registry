openapi: 3.0.0
info:
  title: OVHcloud Service (legacy) API
  description: 'Legacy service management: services, renewals, reopening, suspension and termination.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/service
paths:
  /service:
    get:
      summary: Services
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_serviceResponse'
      x-developer-hub-navigation:
        - - Offers & Services
          - Services
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:service/get
          required: true
      x-expanded-response: ServiceListService
      operationId: get_v1_service
      parameters:
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      description: Services (Beta version)
  /service/{serviceId}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: The internal ID of your service
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceList.Service'
      x-developer-hub-navigation:
        - - Offers & Services
          - Services
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:service/get
          required: true
      operationId: get_v1_service_service_id
      description: Get this object properties (Beta version)
    put:
      summary: Alter this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: The internal ID of your service
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/serviceList.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Offers & Services
          - Services
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:service/edit
          required: true
      operationId: put_v1_service_service_id
      description: Alter this object properties (Beta version)
  /service/{serviceId}/renew:
    get:
      summary: List possible renews for this service
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: includeOptions
          description: Include service's option(s)
          schema:
            type: boolean
        - in: path
          name: serviceId
          description: Service Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_service_service_id_renewResponse'
      x-developer-hub-navigation:
        - - Offers & Services
          - Services
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:service/renew/get
          required: true
      operationId: get_v1_service_service_id_renew
      description: List possible renews for this service (Beta version)
    post:
      summary: Create a renew order
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service Id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  description: Indicates if renew order is generated
                duration:
                  type: string
                  description: Renew duration
                  format: duration
                services:
                  type: array
                  description: List of services to renew
                  items:
                    type: integer
              required:
                - duration
                - services
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/service.renew.RenewOrder'
      x-developer-hub-navigation:
        - - Offers & Services
          - Services
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:service/renew/create
          required: true
      operationId: post_v1_service_service_id_renew
      description: Create a renew order (Beta version)
  /service/{serviceId}/reopen:
    post:
      summary: Reopen a suspended service
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: The internal ID of your service
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Offers & Services
          - Services
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:service/reopen
          required: true
      operationId: post_v1_service_service_id_reopen
      description: Reopen a suspended service (Beta version)
  /service/{serviceId}/suspend:
    post:
      summary: Suspend the service. The service won't be accessible, but you will still be charged for it
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: The internal ID of your service
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Offers & Services
          - Services
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:service/suspend
          required: true
      operationId: post_v1_service_service_id_suspend
      description: Suspend the service. The service won't be accessible, but you will still be charged for it (Beta version)
  /service/{serviceId}/terminate:
    post:
      summary: Terminates a suspended service
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: The internal ID of your service
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Offers & Services
          - Services
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:service/terminate
          required: true
      operationId: post_v1_service_service_id_terminate
      description: Terminates a suspended service (Beta version)
components:
  schemas:
    serviceList.Service:
      type: object
      description: Details about a Service
      properties:
        creationDate:
          type: string
          description: Creation date
          format: date
          readOnly: true
        details:
          type: array
          description: Resource details
          items:
            $ref: '#/components/schemas/complexType.SafeKeyValue_string'
          readOnly: true
        engagementDate:
          type: string
          description: Engagement date
          nullable: true
          format: date
          readOnly: true
        expirationDate:
          type: string
          description: Expiration date
          nullable: true
          format: date
          readOnly: true
        nextBillingDate:
          type: string
          description: The next billing date
          nullable: true
          format: date
          readOnly: true
        plan:
          description: Plan service description
          readOnly: true
          type: object
          properties:
            code:
              type: string
              description: Product code
              nullable: true
            product:
              description: Product plan information
              type: object
              properties:
                name:
                  type: string
                  description: Product name
                  nullable: true
        quantity:
          type: integer
          description: Quantity
          readOnly: true
        renew:
          description: Renew service description
          nullable: true
          readOnly: true
          type: object
          properties:
            dayOfMonth:
              type: integer
              description: Renew day number
              nullable: true
            interval:
              description: Interval between each renewal
              nullable: true
              type: string
              enum:
                - P1M
                - P1Y
                - P2Y
                - P3M
                - P3Y
                - P6M
            mode:
              description: Renewal mode
              type: string
              enum:
                - automaticForcedProduct
                - automaticV2012
                - automaticV2014
                - automaticV2016
                - automaticV2024
                - deleteAtEndEngagement
                - deleteAtExpiration
                - manual
                - oneShot
                - option
            possibleIntervals:
              type: array
              description: Possible interval between each renewal
              nullable: true
              items:
                $ref: '#/components/schemas/service.renew.Interval'
            possibleModes:
              type: array
              description: Possible renewal mode
              items:
                $ref: '#/components/schemas/service.renew.Mode'
        resource:
          description: Resource service description
          type: object
          properties:
            displayName:
              type: string
              description: Custom display name of the service
            name:
              type: string
              description: Name of the service
              nullable: true
            state:
              description: Resource state
              nullable: true
              type: string
              enum:
                - deleted
                - deleting
                - ok
                - opening
                - suspended
                - suspending
                - toDelete
                - toOpen
                - toSuspend
        route:
          description: Route to use in API
          readOnly: true
          type: object
          properties:
            path:
              type: string
              description: Path to use in API
              nullable: true
            url:
              type: string
              description: Path with variables applyed
              nullable: true
            vars:
              type: array
              description: Variables to use in the path
              items:
                $ref: '#/components/schemas/complexType.SafeKeyValue_string'
        state:
          description: Billing state of your service
          readOnly: true
          type: string
          enum:
            - expired
            - ok
            - pending
            - unpaid
    service.renew.RenewDescription:
      type: object
      description: List possible renews for service
      properties:
        renewPeriod:
          type: string
          description: ISO8601 formatted renewal duration
          format: duration
          readOnly: true
        strategies:
          type: array
          description: List possible strategies
          items:
            $ref: '#/components/schemas/service.renew.RenewStrategy'
          readOnly: true
    service.renew.RenewOrder:
      type: object
      description: Details about a renew Order
      properties:
        date:
          type: string
          description: Creation date of the renew Order
          nullable: true
          format: date-time
          readOnly: true
        expirationDate:
          type: string
          description: Expiration date of the renew Order
          nullable: true
          format: date-time
          readOnly: true
        orderId:
          type: integer
          description: ID of the renew Order
          readOnly: true
        password:
          type: string
          description: Password
          readOnly: true
        pdfUrl:
          type: string
          description: Public pdf URL of the generated renew Order
          readOnly: true
        priceWithTax:
          description: Price of the product with tax
          readOnly: true
          type: object
          properties:
            currencyCode:
              $ref: '#/components/schemas/order.CurrencyCodeEnum'
            text:
              type: string
            value:
              type: number
        priceWithoutTax:
          description: Price of the product without tax
          readOnly: true
          type: object
          properties:
            currencyCode:
              $ref: '#/components/schemas/order.CurrencyCodeEnum'
            text:
              type: string
            value:
              type: number
        retractionDate:
          type: string
          description: Retraction date
          nullable: true
          format: date-time
          readOnly: true
        tax:
          description: Value of the tax
          readOnly: true
          type: object
          properties:
            currencyCode:
              $ref: '#/components/schemas/order.CurrencyCodeEnum'
            text:
              type: string
            value:
              type: number
        url:
          type: string
          description: Public URL to display generated renew Order
          readOnly: true
    complexType.SafeKeyValue_string:
      type: object
      description: Key and value, with proper key strings
      properties:
        key:
          type: string
        value:
          type: string
    service.Plan:
      type: object
      description: Plan information
      properties:
        code:
          type: string
          description: Product code
          nullable: true
        product:
          description: Product plan information
          type: object
          properties:
            name:
              type: string
              description: Product name
              nullable: true
    service.Renew:
      type: object
      description: Renew information
      properties:
        dayOfMonth:
          type: integer
          description: Renew day number
          nullable: true
        interval:
          description: Interval between each renewal
          nullable: true
          type: string
          enum:
            - P1M
            - P1Y
            - P2Y
            - P3M
            - P3Y
            - P6M
        mode:
          description: Renewal mode
          type: string
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - automaticV2024
            - deleteAtEndEngagement
            - deleteAtExpiration
            - manual
            - oneShot
            - option
        possibleIntervals:
          type: array
          description: Possible interval between each renewal
          nullable: true
          items:
            $ref: '#/components/schemas/service.renew.Interval'
        possibleModes:
          type: array
          description: Possible renewal mode
          items:
            $ref: '#/components/schemas/service.renew.Mode'
    service.Resource:
      type: object
      description: Resource service informations
      properties:
        displayName:
          type: string
          description: Custom display name of the service
        name:
          type: string
          description: Name of the service
          nullable: true
        state:
          description: Resource state
          nullable: true
          type: string
          enum:
            - deleted
            - deleting
            - ok
            - opening
            - suspended
            - suspending
            - toDelete
            - toOpen
            - toSuspend
    service.Route:
      type: object
      description: route of this service
      properties:
        path:
          type: string
          description: Path to use in API
          nullable: true
        url:
          type: string
          description: Path with variables applyed
          nullable: true
        vars:
          type: array
          description: Variables to use in the path
          items:
            $ref: '#/components/schemas/complexType.SafeKeyValue_string'
    service.BillingStateEnum:
      type: string
      description: Possible billing states
      enum:
        - expired
        - ok
        - pending
        - unpaid
    service.renew.RenewStrategy:
      type: object
      description: Representation of a product renew pricing
      properties:
        price:
          description: Price of the product
          readOnly: true
          type: object
          properties:
            currencyCode:
              $ref: '#/components/schemas/order.CurrencyCodeEnum'
            text:
              type: string
            value:
              type: number
        priceInUcents:
          type: integer
          description: Price of the product in micro-centims
          readOnly: true
        services:
          type: array
          description: Services renewed by strategy
          items:
            type: integer
          readOnly: true
        servicesDetails:
          type: array
          description: Details of services renewed by strategy
          items:
            $ref: '#/components/schemas/service.renew.Service'
          readOnly: true
    order.Price:
      type: object
      description: Price with it's currency and textual representation
      properties:
        currencyCode:
          $ref: '#/components/schemas/order.CurrencyCodeEnum'
        text:
          type: string
        value:
          type: number
    service.plan.Product:
      type: object
      description: Product plan information
      properties:
        name:
          type: string
          description: Product name
          nullable: true
    service.renew.Interval:
      type: string
      description: Interval enum information
      enum:
        - P1M
        - P1Y
        - P2Y
        - P3M
        - P3Y
        - P6M
    service.renew.Mode:
      type: string
      description: Mode enum informations
      enum:
        - automaticForcedProduct
        - automaticV2012
        - automaticV2014
        - automaticV2016
        - automaticV2024
        - deleteAtEndEngagement
        - deleteAtExpiration
        - manual
        - oneShot
        - option
    service.ResourceStateEnum:
      type: string
      description: Possible resource states
      enum:
        - deleted
        - deleting
        - ok
        - opening
        - suspended
        - suspending
        - toDelete
        - toOpen
        - toSuspend
    service.renew.Service:
      type: object
      description: Description of a service
      properties:
        serviceId:
          type: integer
          description: ID of the service
          readOnly: true
        serviceName:
          type: string
          description: Name of the service
          readOnly: true
        serviceType:
          type: string
          description: Type of the service
          readOnly: true
    order.CurrencyCodeEnum:
      type: string
      enum:
        - AUD
        - CAD
        - CZK
        - EUR
        - GBP
        - INR
        - LTL
        - MAD
        - N/A
        - PLN
        - SGD
        - TND
        - USD
        - XOF
        - points
    Get_v1_serviceResponse:
      type: object
      properties:
        v1_service:
          type: array
          items:
            $ref: '#/components/schemas/serviceList.Service'
    Get_v1_service_service_id_renewResponse:
      type: object
      properties:
        v1_service_service_id_renew:
          type: array
          items:
            $ref: '#/components/schemas/service.renew.RenewDescription'
  x-stackQL-resources:
    services:
      id: ovh.service.services
      name: services
      title: Services
      methods:
        list:
          operation:
            $ref: '#/paths/~1service/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_service
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/Get_v1_serviceResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_service\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1service~1{serviceId}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1service~1{serviceId}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        reopen:
          operation:
            $ref: '#/paths/~1service~1{serviceId}~1reopen/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        suspend:
          operation:
            $ref: '#/paths/~1service~1{serviceId}~1suspend/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        terminate:
          operation:
            $ref: '#/paths/~1service~1{serviceId}~1terminate/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/services/methods/get'
          - $ref: '#/components/x-stackQL-resources/services/methods/list'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/services/methods/update'
        delete: []
        replace: []
    renews:
      id: ovh.service.renews
      name: renews
      title: Renews
      methods:
        list:
          operation:
            $ref: '#/paths/~1service~1{serviceId}~1renew/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_service_service_id_renew
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/Get_v1_service_service_id_renewResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_service_service_id_renew\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1service~1{serviceId}~1renew/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/renews/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/renews/methods/create'
        update: []
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v1
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
