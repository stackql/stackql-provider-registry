components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    cluster.hadoop.OrderInformations:
      type: object
      description: Detailed information on the order of one Hadoop Cluster
      properties:
        maximumOrderableNodes:
          type: integer
          description: Maximal number of Node allowed in one order
        minimumOrderableNodes:
          type: integer
          description: Minimum number of Node allowed in one order
    cluster.hadoop.NodeBillingProfile:
      type: object
      description: Detailed information on a node billing profile
      properties:
        CPUFrequency:
          description: Frequency of one CPU core
          type: object
          properties:
            unit:
              type: string
            value:
              type: number
        diskCapacity:
          description: Total capacity available for HDFS
          type: object
          properties:
            unit:
              type: string
            value:
              type: integer
        nbCPUCores:
          type: integer
          description: Total number of the CPU cores
        nbCPUThreads:
          type: integer
          description: Total number of the CPU threads
        networkBandwidth:
          description: Network speed of the link used for the Hadoop process
          type: object
          properties:
            unit:
              type: string
            value:
              type: integer
        nodeProfile:
          type: string
          description: Name of the Node billing profile
        ramQuantity:
          description: Total amount of RAM
          type: object
          properties:
            unit:
              type: string
            value:
              type: integer
    cluster.hadoop.hadoopWithIAM:
      type: object
      description: Managed Hadoop Cluster
      properties:
        clouderaVersion:
          type: string
          description: CDH and Cloudera Manager version
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        maxOrderableNodes:
          type: integer
          description: Maximum quantity of nodes allowed to be ordered in the cluster
          readOnly: true
        name:
          type: string
          description: Service name of your Cluster
          readOnly: true
        state:
          description: State of the Hadoop Cluster
          readOnly: true
          type: string
          enum:
            - created
            - creating
            - deleted
            - deleting
            - delivered
            - delivering
            - toDeliver
    cluster.hadoop.ClusterConsumption:
      type: object
      description: Detailed information on a Hadoop Cluster consumption
      properties:
        quantity:
          description: Number of hours consummed
          type: object
          properties:
            unit:
              type: string
            value:
              type: integer
    ipBlock:
      type: string
      description: IP (v4 or v6) CIDR notation (e.g., 192.0.2.0/24)
      format: ip-block
      example: 192.0.2.0/24
    cluster.hadoop.Task:
      type: object
      description: Operation on a Hadoop Cluster component
      properties:
        name:
          type: string
          description: Operation name
          readOnly: true
        status:
          description: Current Task state
          readOnly: true
          type: string
          enum:
            - cancelled
            - doing
            - done
            - error
            - todo
        taskId:
          type: integer
          readOnly: true
    cluster.hadoop.NetworkAcl:
      type: object
      description: ACL for allowing ip blocks to access to your cluster
      properties:
        block:
          description: IP Block to allow
          readOnly: true
          type: string
          format: ip-block
          example: 192.0.2.0/24
        description:
          type: string
          description: description of this ACL
          nullable: true
        state:
          description: State of the NetworkAcl.
          readOnly: true
          type: string
          enum:
            - disabled
            - enabled
            - pending
    cluster.hadoop.NodeProfileEnum:
      type: string
      description: All profiles a Hadoop Cluster Node can be
      enum:
        - ApplicationServer
        - BasicNode
        - ClouderaManager
        - MasterServer
        - SecondaryServer
    cluster.hadoop.Node:
      type: object
      description: Physical or Virtual Node
      properties:
        billingProfileName:
          description: Name of the billing profile attached to the node
          readOnly: true
          type: string
          enum:
            - 100-small
            - 200-cpu-1
            - 220-cpu-3
            - 300-disk-1
            - 310-disk-3
            - 900-vm-1
        hostname:
          type: string
          description: Hostname of the node
          readOnly: true
        ip:
          description: IP of the Node
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        isRemovable:
          type: boolean
          description: Whether or not the Node is removable
          readOnly: true
        softwareProfile:
          description: Profile of the Node
          readOnly: true
          type: string
          enum:
            - ApplicationServer
            - BasicNode
            - ClouderaManager
            - MasterServer
            - SecondaryServer
        state:
          description: State of the Node
          readOnly: true
          type: string
          enum:
            - available
            - delivered
            - toDeploy
            - unavailable
    cluster.hadoop.RoleTypeEnum:
      type: string
      description: All roles a Hadoop Cluster Node can be
      enum:
        - cloudera_manager
        - data_node
        - elasticsearch_server
        - hbase_master
        - hbase_region_server
        - hive_server2
        - hue
        - impala_daemon
        - impala_server
        - map_reduce_history_server
        - name_node
        - oozie_server
        - open_tsdb
        - secondary_name_node
        - solr_server
        - spark_master
        - spark_worker
        - sqoop_server
        - yarn_node_manager
        - yarn_resource_manager
        - zoo_keeper
    cluster.hadoop.Role:
      type: object
      description: Role (ie set of Hadoop services) of the Node
      properties:
        id:
          type: integer
          description: ID of the Role
          readOnly: true
        type:
          description: Role name
          readOnly: true
          type: string
          enum:
            - cloudera_manager
            - data_node
            - elasticsearch_server
            - hbase_master
            - hbase_region_server
            - hive_server2
            - hue
            - impala_daemon
            - impala_server
            - map_reduce_history_server
            - name_node
            - oozie_server
            - open_tsdb
            - secondary_name_node
            - solr_server
            - spark_master
            - spark_worker
            - sqoop_server
            - yarn_node_manager
            - yarn_resource_manager
            - zoo_keeper
    cluster.hadoop.NodeConsumption:
      type: object
      description: Detailed information on a node consumption of a Hadoop Cluster
      properties:
        hostname:
          type: string
          description: Hostname of the consumed resource
        nodeProfile:
          description: Name of the node profile for the consumptions
          type: string
          enum:
            - 100-small
            - 200-cpu-1
            - 220-cpu-3
            - 300-disk-1
            - 310-disk-3
            - 900-vm-1
        quantity:
          description: Number of hours consummed
          type: object
          properties:
            unit:
              type: string
            value:
              type: integer
    cluster.hadoop.ClusterServiceNameEnum:
      type: string
      description: All services names in a Hadoop Cluster
      enum:
        - HBase
        - HDFS
        - HUE
        - Hive
        - Oozie
        - Solr
        - Spark
        - Sqoop
        - YARN
        - ZooKeeper
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - automaticV2024
            - manual
            - oneShot
            - option
