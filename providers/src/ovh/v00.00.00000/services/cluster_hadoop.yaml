openapi: 3.0.0
info:
  title: OVHcloud Hadoop Clusters API
  description: 'Hadoop cluster services: nodes, roles, network ACLs, users and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/cluster/hadoop
paths:
  /cluster/hadoop:
    get:
      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_cluster_hadoopResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: clusterHadoop:apiovh:get
          required: true
      x-expanded-response: ClusterHadoopHadoopWithIAM
      operationId: get_v1_cluster_hadoop
      description: List available services
  /cluster/hadoop/orderInformations:
    get:
      summary: Get informations about the order of one cluster
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster.hadoop.OrderInformations'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:clusterHadoop/orderInformations/get
          required: true
      operationId: get_v1_cluster_hadoop_order_informations
      description: Get informations about the order of one cluster
  /cluster/hadoop/orderableNodeProfiles:
    get:
      summary: Get the orderable node profiles and their characteristics
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_cluster_hadoop_orderable_node_profilesResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:clusterHadoop/orderableNodeProfiles/get
          required: true
      operationId: get_v1_cluster_hadoop_orderable_node_profiles
      description: Get the orderable node profiles and their characteristics
  /cluster/hadoop/{serviceName}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your cluster
          required: true
          schema:
            type: string
      responses:
