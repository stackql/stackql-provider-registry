          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_cluster_hadoop_service_name_network_aclResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: clusterHadoop:apiovh:networkAcl/get
          required: true
      x-expanded-response: ClusterHadoopNetworkAcl
      operationId: get_v1_cluster_hadoop_service_name_network_acl
      description: Network ACL associated with this Hadoop Cluster
    post:
      summary: Add an ACL to your cluster
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your cluster
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                block:
                  description: IP block to allow
                  $ref: '#/components/schemas/ipBlock'
                description:
                  type: string
                  description: Free description
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cluster.hadoop.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: clusterHadoop:apiovh:networkAcl/create
          required: true
      operationId: post_v1_cluster_hadoop_service_name_network_acl
      description: Add an ACL to your cluster
  /cluster/hadoop/{serviceName}/networkAcl/{block}:
    delete:
      summary: Remove this ACL
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: block
          description: IP Block to allow
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
