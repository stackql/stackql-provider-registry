          description: The internal name of your cluster
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cluster.hadoop.NetworkAcl'
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: clusterHadoop:apiovh:networkAcl/edit
          required: true
      operationId: put_v1_cluster_hadoop_service_name_network_acl_block
      description: Alter this object properties
