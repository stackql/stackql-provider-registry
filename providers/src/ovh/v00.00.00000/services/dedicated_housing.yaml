openapi: 3.0.0
info:
  title: OVHcloud Housing API
  description: 'Housing bays: features, backup FTP, tasks and service information.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/dedicated/housing
paths:
  /dedicated/housing:
    get:
      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_housingResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:get
          required: true
      x-expanded-response: DedicatedHousingHousingWithIAM
      operationId: get_v1_dedicated_housing
      description: List available services
  /dedicated/housing/{serviceName}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.housing.HousingWithIAM'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:get
          required: true
      operationId: get_v1_dedicated_housing_service_name
      description: Get this object properties
  /dedicated/housing/{serviceName}/features/backupFTP:
    delete:
      summary: Delete the backup FTP space
      description: Delete the backup FTP space. Terminates the backup FTP space and returns a task. All data stored on it is permanently deleted.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:features/backupFTP/delete
          required: true
      operationId: delete_v1_dedicated_housing_service_name_features_backup_ftp
    get:
      summary: Get the backup FTP space
      description: 'Get the backup FTP space. Returns the backup FTP space: its server name, type, available disk space and usage. readOnlyDate is set when the account was switched to read-only because the quota was exceeded.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.BackupFtp'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:features/backupFTP/get
          required: true
      operationId: get_v1_dedicated_housing_service_name_features_backup_ftp
    post:
      summary: Create the backup FTP space
      description: Create the backup FTP space. Creates the backup FTP space and returns a task. The IP blocks allowed to reach it, and their protocols, are managed with the access routes.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:features/backupFTP/create
          required: true
      operationId: post_v1_dedicated_housing_service_name_features_backup_ftp
  /dedicated/housing/{serviceName}/features/backupFTP/access:
    get:
      summary: List backup FTP ACLs
      description: 'List backup FTP ACLs. Returns the IP blocks authorized on the backup FTP space. Get an ACL to see the protocols it allows: FTP, NFS and CIFS (SMB).'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_housing_service_name_features_backup_ftp_accessResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:features/backupFTP/access/get
          required: true
      x-expanded-response: DedicatedServerBackupFtpAcl
      operationId: get_v1_dedicated_housing_service_name_features_backup_ftp_access
    post:
      summary: Create a backup FTP ACL
      description: Create a backup FTP ACL. Authorizes an IP block on the backup FTP space with the chosen protocols and returns a task. At least one of ftp, nfs and cifs must be enabled; ftp is false when omitted. authorizableBlocks lists the eligible blocks.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cifs:
                  type: boolean
                  description: Whether to allow the CIFS (SMB) protocol for this ACL
                ftp:
                  type: boolean
                  description: Whether to allow the FTP protocol for this ACL
                ipBlock:
                  description: The IP Block specific to this ACL. It musts belong to your server.
                  $ref: '#/components/schemas/ipBlock'
                nfs:
                  type: boolean
                  description: Whether to allow the NFS protocol for this ACL
              required:
                - cifs
                - ipBlock
                - nfs
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:features/backupFTP/access/create
          required: true
      operationId: post_v1_dedicated_housing_service_name_features_backup_ftp_access
  /dedicated/housing/{serviceName}/features/backupFTP/access/{ipBlock}:
    delete:
      summary: Delete a backup FTP ACL
      description: Delete a backup FTP ACL. Revokes the access of the IP block to the backup FTP space and returns a task. The task carries the status of the revocation.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ipBlock
          description: The IP Block specific to this ACL
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:features/backupFTP/access/delete
          required: true
      operationId: delete_v1_dedicated_housing_service_name_features_backup_ftp_access_ip_block
    get:
      summary: Get a backup FTP ACL
      description: Get a backup FTP ACL. Returns the protocols allowed for the IP block (FTP, NFS, CIFS), whether the rule is applied on the backup FTP space and its last update date.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ipBlock
          description: The IP Block specific to this ACL
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.BackupFtpAcl'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:features/backupFTP/access/get
          required: true
      operationId: get_v1_dedicated_housing_service_name_features_backup_ftp_access_ip_block
    put:
      summary: Update a backup FTP ACL
      description: 'Update a backup FTP ACL. Updates the protocols allowed for the IP block: ftp, nfs and cifs. The change is applied asynchronously: isApplied stays false until it is in effect.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ipBlock
          description: The IP Block specific to this ACL
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dedicated.server.BackupFtpAcl'
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:features/backupFTP/access/edit
          required: true
      operationId: put_v1_dedicated_housing_service_name_features_backup_ftp_access_ip_block
  /dedicated/housing/{serviceName}/features/backupFTP/authorizableBlocks:
    get:
      summary: List authorizable IP blocks
      description: List authorizable IP blocks. Returns the IP blocks of the account that can be authorized in a backup FTP ACL. They include blocks routed to other services of the account, not only to this server.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_housing_service_name_features_backup_ftp_authorizable_blocksResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:features/backupFTP/authorizableBlocks/get
          required: true
      operationId: get_v1_dedicated_housing_service_name_features_backup_ftp_authorizable_blocks
  /dedicated/housing/{serviceName}/features/backupFTP/password:
    post:
      summary: Reset the backup FTP password
      description: Reset the backup FTP password. Resets the backup FTP password and returns a task. The response does not contain the new password.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:features/backupFTP/password/create
          required: true
      operationId: post_v1_dedicated_housing_service_name_features_backup_ftp_password
  /dedicated/housing/{serviceName}/orderable/APC:
    get:
      summary: Is an APC orderable for this housing bay
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.housing.ApcOrderable'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:orderable/APC/get
          required: true
      operationId: get_v1_dedicated_housing_service_name_orderable_apc
      description: Is an APC orderable for this housing bay
  /dedicated/housing/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_dedicated_housing_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_dedicated_housing_service_name_service_infos
  /dedicated/housing/{serviceName}/task:
    get:
      summary: View task list
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: function
          description: Filter the value of function property (=)
          schema:
            $ref: '#/components/schemas/dedicated.housing.TaskFunctionEnum'
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
        - in: query
          name: status
          description: Filter the value of status property (=)
          schema:
            $ref: '#/components/schemas/dedicated.TaskStatusEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_housing_service_name_taskResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:task/get
          required: true
      x-expanded-response: DedicatedHousingTask
      operationId: get_v1_dedicated_housing_service_name_task
      description: View task list
  /dedicated/housing/{serviceName}/task/{taskId}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          description: the id of the task
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.housing.Task'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:task/get
          required: true
      operationId: get_v1_dedicated_housing_service_name_task_task_id
      description: Get this object properties
  /dedicated/housing/{serviceName}/task/{taskId}/cancel:
    post:
      summary: this action stop the task progression if it's possible
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your Housing bay
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          description: the id of the task
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedHousing:apiovh:task/cancel
          required: true
      operationId: post_v1_dedicated_housing_service_name_task_task_id_cancel
      description: this action stop the task progression if it's possible
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    dedicated.housing.HousingWithIAM:
      type: object
      description: Housing bay
      properties:
        datacenter:
          description: Housing bay datacenter
          nullable: true
          readOnly: true
          type: string
          enum:
            - gsw
            - pdc1
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        name:
          type: string
          description: The name you give to the bay
          readOnly: true
        network:
          type: array
          description: Housing bay network
          items:
            $ref: '#/components/schemas/dedicated.housing.NetworkInfo'
          readOnly: true
        options:
          description: Housing bay options
          readOnly: true
          type: object
          properties:
            apcCount:
              type: integer
              description: Number of APC connected to this housing bay
            handsneyes:
              type: boolean
              description: Is this housing bay have handsneyes service
            highAvailabilityRouting:
              type: string
              description: High Availability routing service offer
        rack:
          type: string
          description: The bay's description
          readOnly: true
        securityCode:
          type: string
          description: Bay Security code
          readOnly: true
    dedicated.server.Task:
      type: object
      description: Server tasks
      properties:
        changeUuid:
          type: string
          description: UUID of the change linked to this task
          nullable: true
          readOnly: true
        comment:
          type: string
          description: Details of this task
          nullable: true
          readOnly: true
        doneDate:
          type: string
          description: Completion date
          nullable: true
          format: date-time
          readOnly: true
        function:
          description: Function name
          readOnly: true
          type: string
          enum:
            - INFRA_002_VirtualNetworkInterface
            - INFRA_002_VirtualNetworkInterface_group
            - INFRA_002_VirtualNetworkInterface_ungroup
            - INFRA_ONE_NETWORK_ONEAPI_VirtualNetworkInterface_group
            - INFRA_ONE_NETWORK_ONEAPI_VirtualNetworkInterface_ungroup
            - INFRA_ONE_NETWORK_VirtualNetworkInterface_group
            - INFRA_ONE_NETWORK_VirtualNetworkInterface_ungroup
            - addVirtualMac
            - addWindowSplaFromExistingSerial
            - applyBackupFtpAcls
            - applyBackupFtpQuota
            - bypassAntiDDosGame
            - changePasswordBackupFTP
            - changeRipeOrg
            - checkAndReleaseIp
            - createBackupFTP
            - createOrUpdateRipeOrg
            - createPrivateNetwork
            - disableFirewall
            - enableFirewall
            - genericMoveFloatingIp
            - hardReboot
            - hardware_update
            - ipmi/configureSGX
            - migrateBackupFTP
            - moveFloatingIp
            - moveVirtualMac
            - reagregateBlock
            - rebootPower8To
            - reinstallServer
            - releaseIp
            - removeBackupFTP
            - removeVirtualMac
            - requestAccessIPMI
            - resetIPMI
            - resetIPMISession
            - testIPMIhttp
            - testIPMIpassword
            - testIPMIping
            - virtualMacAdd
            - virtualMacDelete
        lastUpdate:
          type: string
          description: last update
          nullable: true
          format: date-time
          readOnly: true
        needSchedule:
          type: boolean
          description: Whether this task need to be scheduled or not
          readOnly: true
        note:
          type: string
          description: Extra information about this task
          nullable: true
          readOnly: true
        plannedInterventionId:
          type: integer
          description: ID of the planned intervention for this task
          nullable: true
          readOnly: true
        startDate:
          type: string
          description: Task Creation date
          format: date-time
          readOnly: true
        status:
          description: Task status
          readOnly: true
          type: string
          enum:
            - cancelled
            - customerError
            - doing
            - done
            - init
            - ovhError
            - todo
        tags:
          type: array
          description: Task result tags output
          nullable: true
          items:
            $ref: '#/components/schemas/complexType.SafeKeyValueCanBeNull_string'
          readOnly: true
        taskId:
          type: integer
          description: the id of the task
          readOnly: true
        ticketReference:
          type: string
          description: Reference of the thread on the support tool
          nullable: true
          readOnly: true
    dedicated.server.BackupFtp:
      type: object
      description: Backup Ftp assigned to this server
      properties:
        ftpBackupName:
          type: string
          description: The backup FTP server name
          readOnly: true
        quota:
          description: The disk space available in gigabytes
          nullable: true
          readOnly: true
          type: object
          properties:
            unit:
              type: string
            value:
              type: integer
        readOnlyDate:
          type: string
          description: If not-null, gives the date since when your account was set in read-only mode because the quota was exceeded
          nullable: true
          format: date-time
          readOnly: true
        type:
          description: The backup FTP type
          readOnly: true
          type: string
          enum:
            - included
            - storage
        usage:
          description: The disk space currently used on your backup FTP in percent
          nullable: true
          readOnly: true
          type: object
          properties:
            unit:
              type: string
            value:
              type: integer
    ipBlock:
      type: string
      description: IP (v4 or v6) CIDR notation (e.g., 192.0.2.0/24)
      format: ip-block
      example: 192.0.2.0/24
    dedicated.server.BackupFtpAcl:
      type: object
      description: Backup Ftp ACL for this server and Backup Ftp
      properties:
        cifs:
          type: boolean
          description: Whether to allow the CIFS (SMB) protocol for this ACL
        ftp:
          type: boolean
          description: Whether to allow the FTP protocol for this ACL
        ipBlock:
          description: The IP Block specific to this ACL
          readOnly: true
          type: string
          format: ip-block
          example: 192.0.2.0/24
        isApplied:
          type: boolean
          description: Whether the rule has been applied on the Backup Ftp
          readOnly: true
        lastUpdate:
          type: string
          description: Date of the last object modification
          format: date-time
          readOnly: true
        nfs:
          type: boolean
          description: Whether to allow the NFS protocol for this ACL
    dedicated.housing.ApcOrderable:
      type: object
      description: A structure describing informations for APC orderable for this housing bay
      properties:
        free:
          type: boolean
          description: Is this APC free
        orderable:
          type: boolean
          description: Is an APC is orderable for this housing bay
    services.Service:
