      type: string
      description: IP (v4 or v6) CIDR notation (e.g., 192.0.2.0/24)
      format: ip-block
      example: 192.0.2.0/24
    license.ChangeIpStatus:
      type: object
      description: License change ip status return
      properties:
        message:
          $ref: '#/components/schemas/license.ChangeIpMessageEnum'
        success:
          type: boolean
    license.Task:
      type: object
      description: licenses Todos
      properties:
        action:
          description: This Task description
          readOnly: true
          type: string
          enum:
            - addWindowFromExistingSerial
            - changeIp
            - changeOs
            - installLicense
            - optionUpgrade
            - releaseOption
            - versionUpgrade
        doneDate:
          type: string
          description: When was this Task done
          nullable: true
          format: date-time
          readOnly: true
        lastUpdate:
          type: string
          description: The last time this Task was updated
          format: date-time
          readOnly: true
        name:
          type: string
          description: This Task name
          readOnly: true
        status:
          description: Current Taks status
          readOnly: true
          type: string
          enum:
            - cancelled
            - doing
            - done
            - error
            - todo
        taskId:
          type: integer
          description: This Task id
          readOnly: true
        todoDate:
          type: string
          description: When was this Task created
          format: date-time
          readOnly: true
    service.TerminationFutureUseEnum:
      type: string
      description: All future uses you can provide for a service termination
      enum:
        - NOT_REPLACING_SERVICE
        - OTHER
        - SUBSCRIBE_AN_OTHER_SERVICE
        - SUBSCRIBE_OTHER_KIND_OF_SERVICE_WITH_COMPETITOR
        - SUBSCRIBE_SIMILAR_SERVICE_WITH_COMPETITOR
    service.TerminationReasonEnum:
      type: string
      description: All reasons you can provide for a service termination
      enum:
        - FEATURES_DONT_SUIT_ME
        - LACK_OF_PERFORMANCES
        - MIGRATED_TO_ANOTHER_OVH_PRODUCT
        - MIGRATED_TO_COMPETITOR
        - NOT_ENOUGH_RECOGNITION
        - NOT_NEEDED_ANYMORE
        - NOT_RELIABLE
        - NO_ANSWER
        - OTHER
        - PRODUCT_DIMENSION_DONT_SUIT_ME
        - PRODUCT_TOOLS_DONT_SUIT_ME
        - TOO_EXPENSIVE
        - TOO_HARD_TO_USE
        - UNSATIFIED_BY_CUSTOMER_SUPPORT
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - automaticV2024
            - manual
            - oneShot
            - option
        serviceId:
          type: integer
          readOnly: true
        status:
          readOnly: true
          type: string
          enum:
            - autorenewInProgress
            - expired
            - inCreation
            - ok
            - pendingDebt
            - unPaid
    license.ActionType:
      type: string
      description: A short description of what does the Task on your license
      enum:
        - addWindowFromExistingSerial
        - changeIp
        - changeOs
        - installLicense
        - optionUpgrade
        - releaseOption
        - versionUpgrade
    license.TaskStateEnum:
      type: string
      description: All states a license Task can be in
      enum:
        - cancelled
        - doing
        - done
        - error
        - todo
