openapi: 3.0.0
info:
  title: OVHcloud Nutanix API
  description: Nutanix on OVHcloud clusters, availabilities and requirements.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/nutanix
paths:
  /nutanix:
    get:
      summary: Get list of owned Nutanix Clusters
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_nutanixResponse'
      x-developer-hub-navigation:
        - - Private Cloud
          - Nutanix@@@3
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nutanix:apiovh:get
          required: true
      x-expanded-response: NutanixStateDetailsWithIAM
      operationId: get_v1_nutanix
      description: Get list of owned Nutanix Clusters
  /nutanix/availabilities:
    get:
      summary: Fetch the availabilities for a given cluster configuration
      parameters:
        - in: query
          name: erasureCoding
          schema:
            type: boolean
        - in: query
          name: memory
          description: The name of the memory hardware part
          schema:
            type: string
        - in: query
          name: planCode
          description: The plan code in which the hardware is involved
          schema:
            type: string
        - in: query
          name: quantity
          description: Node quantity
          required: true
          schema:
            type: integer
        - in: query
          name: rackAwareness
          schema:
            type: boolean
        - in: query
          name: redundancyFactor
          schema:
            $ref: '#/components/schemas/nutanix.RedundancyFactorEnum'
        - in: query
          name: server
          description: The name of the base hardware
          schema:
            type: string
        - in: query
          name: storage
          description: The name of the storage hardware part
          schema:
            type: string
        - in: query
          name: systemStorage
          description: The name of the system storage hardware part
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_nutanix_availabilitiesResponse'
      x-developer-hub-navigation:
        - - Private Cloud
          - Nutanix@@@12
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: fqn
      operationId: get_v1_nutanix_availabilities
      description: Fetch the availabilities for a given cluster configuration
  /nutanix/availabilities/raw:
    get:
      summary: List the raw availability for Nutanix cluster
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: datacenters
          description: The names of datacenters separated by commas
          schema:
            type: string
        - in: query
          name: deploymentType
          schema:
            $ref: '#/components/schemas/nutanix.DeploymentTypeEnum'
        - in: query
          name: erasureCoding
          schema:
            type: boolean
        - in: query
          name: excludeDatacenters
          description: If true, all datacenters are returned except those listed in datacenters parameter
          schema:
            type: boolean
        - in: query
          name: excludeRegions
          description: If true, all regions are returned except those listed in regions parameter
          schema:
            type: boolean
        - in: query
          name: memory
          description: The name of the memory hardware part
          schema:
            type: string
        - in: query
          name: planCode
          description: The plan code in which the hardware is involved
          schema:
            type: string
        - in: query
          name: quantity
          description: Node quantity
          required: true
          schema:
            type: integer
        - in: query
          name: redundancyFactor
          schema:
            $ref: '#/components/schemas/nutanix.RedundancyFactorEnum'
        - in: query
          name: regions
          description: The names of regions separated by commas
          schema:
            type: string
        - in: query
          name: server
          description: The name of the base hardware
          schema:
            type: string
        - in: query
          name: storage
          description: The name of the storage hardware part
          schema:
            type: string
        - in: query
          name: systemStorage
          description: The name of the system storage hardware part
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_nutanix_availabilities_rawResponse'
      x-developer-hub-navigation:
        - - Private Cloud
          - Nutanix@@@13
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: fqn
      operationId: get_v1_nutanix_availabilities_raw
      description: List the raw availability for Nutanix cluster
  /nutanix/availableVersions:
    get:
      summary: Fetch the available Nutanix versions to install
      parameters:
        - in: query
          name: fqn
          description: Fully qualified name and unique name of the hardware
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
