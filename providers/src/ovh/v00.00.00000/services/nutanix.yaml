components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    nutanix.RedundancyFactorEnum:
      type: integer
      description: Cluster redundancy factor
      enum:
        - 2
        - 3
    nutanix.availability:
      type: object
      description: Cluster availability
      properties:
        datacenters:
          type: array
          description: A structure describing the hardware availability for each datacenter
          items:
            $ref: '#/components/schemas/nutanix.DatacenterAvailability'
          readOnly: true
        deploymentType:
          description: Deployment type
          nullable: true
          readOnly: true
          type: string
          enum:
            - NodeAwareness
        erasureCoding:
          type: boolean
          description: Erasure coding activation
          nullable: true
          readOnly: true
        fqn:
          type: string
          description: Fully qualified name and unique name of the hardware
          readOnly: true
        memory:
          type: string
          description: Name of the memory hardware part
          readOnly: true
        planCode:
          type: string
          description: Plan code in which the hardware is involved
          readOnly: true
        redundancyFactor:
          description: Redundancy factor
          nullable: true
          readOnly: true
          type: integer
          enum:
            - 2
            - 3
        server:
          type: string
          description: Name of the base hardware
          readOnly: true
        storage:
          type: string
          description: Name of the storage hardware part
          readOnly: true
        systemStorage:
          type: string
          description: Name of the system storage hardware part
          nullable: true
          readOnly: true
    nutanix.DeploymentTypeEnum:
      type: string
      description: Cluster deployment type
      enum:
        - NodeAwareness
    nutanix.AvailabilitiesRaw:
      type: object
      description: Cluster availability
      properties:
        datacenters:
          type: array
          description: A structure describing the hardware availability for each datacenter
          items:
            $ref: '#/components/schemas/nutanix.AvailabilitiesRawDatacenter'
          readOnly: true
        deploymentType:
          description: Deployment type
          nullable: true
          readOnly: true
          type: string
          enum:
            - NodeAwareness
        erasureCoding:
          type: boolean
          description: Erasure coding activation
          nullable: true
          readOnly: true
        fqn:
          type: string
          description: Fully qualified name and unique name of the hardware
          readOnly: true
        memory:
          type: string
          description: Name of the memory hardware part
          readOnly: true
        planCode:
          type: string
          description: Plan code in which the hardware is involved
          readOnly: true
        redundancyFactor:
          description: Redundancy factor
          nullable: true
          readOnly: true
          type: integer
          enum:
            - 2
            - 3
        server:
          type: string
          description: Name of the base hardware
          readOnly: true
        storage:
          type: string
          description: Name of the storage hardware part
          readOnly: true
        systemStorage:
          type: string
          description: Name of the system storage hardware part
          nullable: true
          readOnly: true
    nutanix.Requirements:
      type: object
      description: Return the needed requirements for a given cluster configuration
      properties:
        maxNodes:
          type: integer
          description: Maximum number of nodes
          readOnly: true
        minNodes:
          type: integer
          description: Minimum number of nodes
          readOnly: true
        scaleFactor:
          type: integer
          description: Number of added/removed nodes in case of scaling up/down
          readOnly: true
    nutanix.stateDetailsWithIAM:
      type: object
      description: Nutanix Cluster State
      properties:
        allowedRedundancyFactor:
          type: array
          description: Available redundancy Factor
          items:
            type: integer
          readOnly: true
        availableVersions:
          type: array
          description: Available versions to install
          items:
            type: string
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        serviceName:
          type: string
          description: Cluster name
          readOnly: true
        status:
          description: Current cluster's status
          readOnly: true
          type: string
          enum:
            - Active
            - Deploying
            - Error
        targetSpec:
          description: Target Spec after deployment
          readOnly: true
          type: object
          properties:
            controlPanelURL:
              type: string
              description: Control Panel URL
              readOnly: true
            dataserviceIp:
              description: dataservice IP
              readOnly: true
              type: string
              format: ipv4
              example: 192.0.2.0
            erasureCoding:
              type: boolean
              description: Erasure coding activation
              readOnly: true
            gatewayCidr:
              description: Internal Gateway IP, with mask
              readOnly: true
              type: string
              format: ip-block
              example: 192.0.2.0/24
            infraVlanNumber:
              type: integer
              description: Infra-Vlan number
              readOnly: true
            ipfo:
              description: External Gateway IP, with mask
              readOnly: true
              type: string
              format: ip-block
              example: 192.0.2.0/24
            iplb:
              type: string
              description: IPLB ID
              readOnly: true
            license:
              type: string
              description: Cluster license
              readOnly: true
            metadata:
              description: Cluster metadata
              readOnly: true
              type: object
              properties:
                initialCommitmentSize:
                  type: integer
                  description: Cluster initial commitment size
                  readOnly: true
            name:
              type: string
              description: Cluster name
              readOnly: true
            nodes:
              type: array
              description: Cluster node list
              items:
                $ref: '#/components/schemas/nutanix.nodeDetails'
              readOnly: true
            prismCentral:
              description: Prism Central Configuration
              readOnly: true
              type: object
              properties:
                ips:
                  type: array
                  description: Prism Central IPs
                  items:
                    $ref: '#/components/schemas/ipv4'
                size:
                  description: Prism Central size
                  type: string
                  enum:
                    - large
                    - small
                    - xlarge
                    - xsmall
                type:
                  description: Prism Central type
                  type: string
                  enum:
                    - alone
                    - scale
