      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_nutanix_available_versions
      description: Fetch the available Nutanix versions to install
  /nutanix/requirements:
    get:
      summary: Fetch the requirements for a given cluster configuration
      parameters:
        - in: query
          name: erasureCoding
          required: true
          schema:
            type: boolean
        - in: query
          name: rackAwareness
          required: true
          schema:
            type: boolean
        - in: query
          name: redundancyFactor
          required: true
          schema:
            $ref: '#/components/schemas/nutanix.RedundancyFactorEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nutanix.Requirements'
      x-developer-hub-navigation:
        - - Private Cloud
          - Nutanix@@@16
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_nutanix_requirements
      description: Fetch the requirements for a given cluster configuration
  /nutanix/{serviceName}:
    get:
      summary: Get nutanix cluster info
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nutanix.stateDetailsWithIAM'
      x-developer-hub-navigation:
        - - Private Cloud
          - Nutanix@@@11
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nutanix:apiovh:get
          required: true
      operationId: get_v1_nutanix_service_name
      description: Get nutanix cluster info
    put:
      summary: Update nutanix cluster info
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: redeploycluster
          description: I am aware that I am going to make changes that will reinstall my cluster
          schema:
            type: boolean
        - in: query
          name: scaleOut
          description: I am aware that I am going to make changes that will scale-out my cluster
          schema:
            type: boolean
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nutanix.cluster'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nutanix.state'
      x-developer-hub-navigation:
        - - Private Cloud
          - Nutanix@@@35
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nutanix:apiovh:edit
          required: true
      operationId: put_v1_nutanix_service_name
      description: Update nutanix cluster info
  /nutanix/{serviceName}/changeContact:
    post:
      summary: Launch a contact change procedure
      security:
