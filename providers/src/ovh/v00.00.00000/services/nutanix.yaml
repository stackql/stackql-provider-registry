      x-developer-hub-navigation:
        - - Private Cloud
          - Nutanix@@@15
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nutanix:apiovh:nodes/get
          required: true
      x-response-identifier: server
