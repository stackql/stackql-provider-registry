          nullable: true
          type: string
          enum:
            - cookie
            - sourceIp
        vrackNetworkId:
          type: integer
          description: Internal Load Balancer identifier of the vRack private network attached to your farm, mandatory when your Load Balancer is attached to a vRack
          nullable: true
