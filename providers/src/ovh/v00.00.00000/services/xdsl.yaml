      summary: Get an xDSL Email Pro account
      description: Returns the login, names, primary address, quota and usage, state and last logon and logoff dates of an Email Pro account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
