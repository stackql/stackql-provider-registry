      description: Changes the first name, last name, initials and display name of the Email Pro account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/xdsl.xdslEmailPro'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Email
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: xdslEmail:apiovh:edit
          required: true
      operationId: put_v1_xdsl_email_pro_email
