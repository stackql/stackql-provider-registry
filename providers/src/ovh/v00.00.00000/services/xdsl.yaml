openapi: 3.0.0
info:
  title: OVHcloud xDSL API
  description: 'xDSL and fibre accesses: lines, modems, IPs, incidents, diagnostics, email accounts and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/xdsl
paths:
  /xdsl:
    get:
      summary: List xDSL accesses
      description: Returns the names of the xDSL accesses of the account. Each name is the serviceName used by the other xDSL calls.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_xdslResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Access
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: xdsl:apiovh:get
          required: true
      x-expanded-response: XdslAccessWithIAM
      operationId: get_v1_xdsl
  /xdsl/email/pro:
    get:
      summary: List xDSL Email Pro accounts
      description: Returns the email addresses of the Email Pro accounts provided with the xDSL accesses.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_xdsl_email_proResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Email
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: xdslEmail:apiovh:get
          required: true
