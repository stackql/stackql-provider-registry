      summary: Delete an xDSL Email Pro account
      description: Deletes the Email Pro account and its mailbox.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: email
          description: Email
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
