          description: Filter the value of creationDate property (>)
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          description: Filter the value of endDate property (<)
          schema:
            type: string
            format: date-time
        - in: header
          name: X-Pagination-Mode
