openapi: 3.0.0
info:
  title: OVHcloud Virtuozzo Licenses API
  description: Virtuozzo licenses and their options.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/license/virtuozzo
paths:
  /license/virtuozzo:
    get:
      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_virtuozzoResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:get
          required: true
      x-expanded-response: LicenseVirtuozzoVirtuozzoWithIAM
      operationId: get_v1_license_virtuozzo
      description: List available services
  /license/virtuozzo/orderableVersions:
    get:
      summary: Get the orderable Virtuozzo versions
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: ip
          description: Your license Ip
          required: true
          schema:
            $ref: '#/components/schemas/ipv4'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_virtuozzo_orderable_versionsResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:licenseVirtuozzo/orderableVersions/get
          required: true
      operationId: get_v1_license_virtuozzo_orderable_versions
      description: Get the orderable Virtuozzo versions
  /license/virtuozzo/{serviceName}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.virtuozzo.VirtuozzoWithIAM'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:get
          required: true
      operationId: get_v1_license_virtuozzo_service_name
      description: Get this object properties
    put:
      summary: Alter this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.virtuozzo.Virtuozzo'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:put
          required: true
      operationId: put_v1_license_virtuozzo_service_name
      description: Alter this object properties
  /license/virtuozzo/{serviceName}/allowedDestinationIp:
    get:
      summary: Returns an array of ips where the license can be moved to
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_virtuozzo_service_name_allowed_destination_ipResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:allowedDestinationIp/get
          required: true
      operationId: get_v1_license_virtuozzo_service_name_allowed_destination_ip
      description: Returns an array of ips where the license can be moved to
  /license/virtuozzo/{serviceName}/canLicenseBeMovedTo:
    get:
      summary: Will tell if the ip can accept the license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: destinationIp
          description: The Ip on which you want to move this license
          required: true
          schema:
            $ref: '#/components/schemas/ipv4'
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.ChangeIpStatus'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:canLicenseBeMovedTo/get
          required: true
      operationId: get_v1_license_virtuozzo_service_name_can_license_be_moved_to
      description: Will tell if the ip can accept the license
  /license/virtuozzo/{serviceName}/changeIp:
    post:
      summary: Move this license to another Ip
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destinationIp:
                  description: The Ip on which you want to move this license
                  $ref: '#/components/schemas/ipv4'
              required:
                - destinationIp
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:changeIp
          required: true
      operationId: post_v1_license_virtuozzo_service_name_change_ip
      description: Move this license to another Ip
  /license/virtuozzo/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:confirmTermination
          required: true
      operationId: post_v1_license_virtuozzo_service_name_confirm_termination
  /license/virtuozzo/{serviceName}/option:
    get:
      summary: Options linked to this license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: label
          description: Filter the value of label property (=)
          schema:
            $ref: '#/components/schemas/license.OptionLabel'
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_virtuozzo_service_name_optionResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:option/get
          required: true
      x-expanded-response: LicenseOption
      operationId: get_v1_license_virtuozzo_service_name_option
      description: Options linked to this license
  /license/virtuozzo/{serviceName}/option/{label}:
    delete:
      summary: release this Option
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: label
          description: This option designation
          required: true
          schema:
            $ref: '#/components/schemas/license.OptionLabel'
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:option/delete
          required: true
      operationId: delete_v1_license_virtuozzo_service_name_option_label
      description: release this Option
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: label
          description: This option designation
          required: true
          schema:
            $ref: '#/components/schemas/license.OptionLabel'
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Option'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:option/get
          required: true
      operationId: get_v1_license_virtuozzo_service_name_option_label
      description: Get this object properties
  /license/virtuozzo/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_license_virtuozzo_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_license_virtuozzo_service_name_service_infos
  /license/virtuozzo/{serviceName}/tasks:
    get:
      summary: tasks linked to this license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: action
          description: Filter the value of action property (=)
          schema:
            $ref: '#/components/schemas/license.ActionType'
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
        - in: query
          name: status
          description: Filter the value of status property (=)
          schema:
            $ref: '#/components/schemas/license.TaskStateEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_virtuozzo_service_name_tasksResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:tasks/get
          required: true
      x-expanded-response: LicenseTask
      operationId: get_v1_license_virtuozzo_service_name_tasks
      description: tasks linked to this license
  /license/virtuozzo/{serviceName}/tasks/{taskId}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          description: This Task id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:tasks/get
          required: true
      operationId: get_v1_license_virtuozzo_service_name_tasks_task_id
      description: Get this object properties
  /license/virtuozzo/{serviceName}/terminate:
    post:
      summary: Request service termination
      description: Request service termination. Starts the termination of the service. The admin contact receives a token by email, to confirm with the `confirmTermination` call.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Virtuozzo license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseVirtuozzo:apiovh:terminate
          required: true
      operationId: post_v1_license_virtuozzo_service_name_terminate
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    ipv4:
      type: string
      description: IPv4 address (e.g., 192.0.2.0)
      format: ipv4
      example: 192.0.2.0
    license.VirtuozzoOrderConfiguration:
      type: object
      description: The serviceTypes allowed to Order a Virtuozzo version
      properties:
        orderableVersions:
          type: array
          items:
            $ref: '#/components/schemas/license.OrderableVirtuozzoCompatibilityInfos'
        serviceType:
          $ref: '#/components/schemas/license.LicenseTypeEnum'
    license.virtuozzo.VirtuozzoWithIAM:
      type: object
      description: Your Virtuozzo license
      properties:
        containerNumber:
          description: The amount of containers this license can manage
          readOnly: true
          type: string
          enum:
            - 2_CPU_001_CONTAINER
            - 2_CPU_003_CONTAINER
            - 2_CPU_010_CONTAINER
            - 2_CPU_030_CONTAINER
            - 2_CPU_060_CONTAINER
            - 2_CPU_100_CONTAINER
        creation:
          type: string
          description: This license creation date
          format: date-time
          readOnly: true
        deleteAtExpiration:
          type: boolean
          description: Shall we delete this on expiration ?
        domain:
          type: string
          description: The internal name of your license
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        informationKey:
          type: string
          description: This license Information key
          nullable: true
          readOnly: true
        ip:
          description: The ip on which this license is attached
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        licenseId:
          type: string
          description: The license id on license provider side
          readOnly: true
        productKey:
          type: string
          description: This license product key
          nullable: true
          readOnly: true
        status:
          description: This license state
          readOnly: true
          type: string
          enum:
            - ok
            - released
            - terminated
            - toDeliver
        version:
          description: This license version
          readOnly: true
          type: string
          enum:
            - VIRTUOZZO_CONTAINERS_4_FOR_LINUX
            - VIRTUOZZO_CONTAINERS_4_FOR_WINDOWS
    license.virtuozzo.Virtuozzo:
      type: object
      description: Your Virtuozzo license
      properties:
        containerNumber:
          description: The amount of containers this license can manage
          readOnly: true
          type: string
          enum:
            - 2_CPU_001_CONTAINER
            - 2_CPU_003_CONTAINER
            - 2_CPU_010_CONTAINER
            - 2_CPU_030_CONTAINER
            - 2_CPU_060_CONTAINER
            - 2_CPU_100_CONTAINER
        creation:
          type: string
          description: This license creation date
          format: date-time
          readOnly: true
        deleteAtExpiration:
          type: boolean
          description: Shall we delete this on expiration ?
        domain:
          type: string
          description: The internal name of your license
          readOnly: true
        informationKey:
          type: string
          description: This license Information key
          nullable: true
          readOnly: true
        ip:
          description: The ip on which this license is attached
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        licenseId:
          type: string
          description: The license id on license provider side
          readOnly: true
        productKey:
          type: string
          description: This license product key
          nullable: true
          readOnly: true
        status:
          description: This license state
          readOnly: true
          type: string
          enum:
            - ok
            - released
            - terminated
            - toDeliver
        version:
          description: This license version
          readOnly: true
          type: string
          enum:
            - VIRTUOZZO_CONTAINERS_4_FOR_LINUX
            - VIRTUOZZO_CONTAINERS_4_FOR_WINDOWS
    ipBlock:
      type: string
      description: IP (v4 or v6) CIDR notation (e.g., 192.0.2.0/24)
      format: ip-block
      example: 192.0.2.0/24
    license.ChangeIpStatus:
      type: object
      description: License change ip status return
      properties:
        message:
          $ref: '#/components/schemas/license.ChangeIpMessageEnum'
        success:
          type: boolean
    license.Task:
      type: object
      description: licenses Todos
      properties:
        action:
          description: This Task description
          readOnly: true
          type: string
          enum:
            - addWindowFromExistingSerial
            - changeIp
            - changeOs
            - installLicense
            - optionUpgrade
            - releaseOption
            - versionUpgrade
        doneDate:
          type: string
          description: When was this Task done
          nullable: true
          format: date-time
          readOnly: true
        lastUpdate:
          type: string
          description: The last time this Task was updated
          format: date-time
          readOnly: true
        name:
          type: string
          description: This Task name
          readOnly: true
        status:
          description: Current Taks status
          readOnly: true
          type: string
          enum:
            - cancelled
            - doing
            - done
            - error
            - todo
        taskId:
          type: integer
          description: This Task id
          readOnly: true
        todoDate:
          type: string
          description: When was this Task created
          format: date-time
          readOnly: true
    service.TerminationFutureUseEnum:
      type: string
      description: All future uses you can provide for a service termination
      enum:
        - NOT_REPLACING_SERVICE
        - OTHER
        - SUBSCRIBE_AN_OTHER_SERVICE
        - SUBSCRIBE_OTHER_KIND_OF_SERVICE_WITH_COMPETITOR
        - SUBSCRIBE_SIMILAR_SERVICE_WITH_COMPETITOR
    service.TerminationReasonEnum:
      type: string
      description: All reasons you can provide for a service termination
      enum:
        - FEATURES_DONT_SUIT_ME
        - LACK_OF_PERFORMANCES
        - MIGRATED_TO_ANOTHER_OVH_PRODUCT
        - MIGRATED_TO_COMPETITOR
        - NOT_ENOUGH_RECOGNITION
        - NOT_NEEDED_ANYMORE
        - NOT_RELIABLE
        - NO_ANSWER
        - OTHER
        - PRODUCT_DIMENSION_DONT_SUIT_ME
        - PRODUCT_TOOLS_DONT_SUIT_ME
        - TOO_EXPENSIVE
        - TOO_HARD_TO_USE
        - UNSATIFIED_BY_CUSTOMER_SUPPORT
    license.OptionLabel:
      type: string
      description: The name of an option currently enabled on your license
      enum:
        - ANTISPAM_SPAMASSASSIN
        - ANTIVIRUS_DRWEB
        - ANTIVIRUS_KASPERSKY
        - DOMAINS
        - LANGUAGE_PACK
        - POWERPACK
        - SQL_SERVER
        - VIRTUOZZO_CONTAINERS
    license.Option:
      type: object
      description: Your License options
      properties:
        amount:
          type: string
          description: Quantity or corresponding label of the designated option enabled on your license
          nullable: true
          readOnly: true
        canBeDeleted:
          type: boolean
          description: Specifies whether this option can be released or not
          readOnly: true
        expirationDate:
          type: string
          description: This option expiration date
          format: date-time
          readOnly: true
        label:
          description: This option designation
          readOnly: true
          type: string
          enum:
            - ANTISPAM_SPAMASSASSIN
            - ANTIVIRUS_DRWEB
            - ANTIVIRUS_KASPERSKY
            - DOMAINS
            - LANGUAGE_PACK
            - POWERPACK
            - SQL_SERVER
            - VIRTUOZZO_CONTAINERS
        version:
