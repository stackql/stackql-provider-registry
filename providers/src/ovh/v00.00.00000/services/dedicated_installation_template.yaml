openapi: 3.0.0
info:
  title: OVHcloud Dedicated Server Installation Templates API
  description: Operating system installation templates for dedicated servers.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/dedicated/installationTemplate
paths:
  /dedicated/installationTemplate:
    get:
      summary: List installation templates
      description: List installation templates. Returns the names of the operating system installation templates. This call does not require authentication. To get the templates compatible with a server, use GET /dedicated/server/{serviceName}/install/compatibleTemplates.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_installation_templateResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@120
      x-badges:
        - color: green
          label: Stable production version
      x-expanded-response: DedicatedInstallationTemplateTemplates
      operationId: get_v1_dedicated_installation_template
      parameters:
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
  /dedicated/installationTemplate/templateInfos:
    get:
      summary: List installation template details
      description: 'List installation template details. Returns the details of the available operating system templates: name, category, family, subfamily, end of install date, project and license. This call does not require authentication.'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_installation_template_template_infosResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@130
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_dedicated_installation_template_template_infos
  /dedicated/installationTemplate/{templateName}:
    get:
      summary: Get an installation template
      description: Get an installation template. Returns the details of an installation template, such as its distribution, family, filesystems and inputs. After its endOfInstall date, the template can no longer be installed. This call does not require authentication.
      parameters:
        - in: path
          name: templateName
          description: This template name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.installationTemplate.Templates'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@140
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_dedicated_installation_template_template_name
  /dedicated/installationTemplate/{templateName}/partitionScheme:
    get:
      summary: List partitioning schemes
      description: List partitioning schemes. Returns the names of the partitioning schemes of the template. On a reinstall without a partitioning scheme, the compatible scheme with the highest priority is used.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: templateName
          description: This template name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_installation_template_template_name_partition_schemeResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@150
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:dedicatedInstallationTemplate/partitionScheme/get
          required: true
      x-expanded-response: DedicatedInstallationTemplateTemplatePartitioningSchemes
      operationId: get_v1_dedicated_installation_template_template_name_partition_scheme
  /dedicated/installationTemplate/{templateName}/partitionScheme/{schemeName}:
    get:
      summary: Get a partitioning scheme
      description: Get a partitioning scheme. Returns the name and priority of a partitioning scheme. On a reinstall without a partitioning scheme, the compatible scheme with the highest priority is used.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: schemeName
          description: This partitioning scheme name
          required: true
          schema:
            type: string
        - in: path
          name: templateName
          description: This template name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.installationTemplate.templatePartitioningSchemes'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@160
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:dedicatedInstallationTemplate/partitionScheme/get
          required: true
      operationId: get_v1_dedicated_installation_template_template_name_partition_scheme_scheme_name
  /dedicated/installationTemplate/{templateName}/partitionScheme/{schemeName}/hardwareRaid:
    get:
      summary: List hardware RAIDs
      description: List hardware RAIDs. Returns the names of the hardware RAIDs defined in the partitioning scheme. Each one has a RAID mode, a disk list and a creation order.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: schemeName
          description: This partitioning scheme name
          required: true
          schema:
            type: string
        - in: path
          name: templateName
          description: This template name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_installation_template_template_name_partition_scheme_scheme_name_hardware_raidResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@170
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:dedicatedInstallationTemplate/partitionScheme/hardwareRaid/get
          required: true
      x-expanded-response: DedicatedInstallationTemplateHardwareRaid
      operationId: get_v1_dedicated_installation_template_template_name_partition_scheme_scheme_name_hardware_raid
  /dedicated/installationTemplate/{templateName}/partitionScheme/{schemeName}/hardwareRaid/{name}:
    get:
      summary: Get a hardware RAID
      description: Get a hardware RAID. Returns the RAID mode, the disks and the creation order of a hardware RAID defined in the partitioning scheme.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Hardware RAID name
          required: true
          schema:
            type: string
        - in: path
          name: schemeName
          description: This partitioning scheme name
          required: true
          schema:
            type: string
        - in: path
          name: templateName
          description: This template name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.installationTemplate.hardwareRaid'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@180
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:dedicatedInstallationTemplate/partitionScheme/hardwareRaid/get
          required: true
      operationId: get_v1_dedicated_installation_template_template_name_partition_scheme_scheme_name_hardware_raid_name
  /dedicated/installationTemplate/{templateName}/partitionScheme/{schemeName}/partition:
    get:
      summary: List partitions
      description: List partitions. Returns the mount points of the partitions defined in the partitioning scheme. Each partition has a filesystem, a type, a size and a creation order on the disk.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: schemeName
          description: This partitioning scheme name
          required: true
          schema:
            type: string
        - in: path
          name: templateName
          description: This template name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_installation_template_template_name_partition_scheme_scheme_name_partitionResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@190
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:dedicatedInstallationTemplate/partitionScheme/partition/get
          required: true
      x-expanded-response: DedicatedInstallationTemplateTemplatePartitions
      operationId: get_v1_dedicated_installation_template_template_name_partition_scheme_scheme_name_partition
  /dedicated/installationTemplate/{templateName}/partitionScheme/{schemeName}/partition/{mountpoint}:
    get:
      summary: Get a partition
      description: Get a partition. Returns the filesystem, type, size, RAID level and creation order of a partition of the partitioning scheme. A size of 0 means the rest of the disk space.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: mountpoint
          description: Partition mount point
          required: true
          schema:
            type: string
        - in: path
          name: schemeName
          description: This partitioning scheme name
          required: true
          schema:
            type: string
        - in: path
          name: templateName
          description: This template name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.installationTemplate.templatePartitions'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@200
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:dedicatedInstallationTemplate/partitionScheme/partition/get
          required: true
      operationId: get_v1_dedicated_installation_template_template_name_partition_scheme_scheme_name_partition_mountpoint
components:
  schemas:
    dedicated.TemplateOsInfo:
      type: object
      description: A structure describing some interesting facts about an OS template
      properties:
        category:
          description: OS Category (also called OS usage)
          type: string
          enum:
            - backup
            - basic
            - customer
            - database
            - erp
            - hosting
            - management
            - other
            - readyToUse
            - virtualisation
            - virtualization
        description:
          type: string
          description: OS long name
        endOfInstall:
          type: string
          description: OS template end of install at OVH date
          nullable: true
          format: date
        family:
          description: OS family (also called OS type)
          type: string
          enum:
            - bsd
            - custom
            - ibm
            - linux
            - solaris
            - unix
            - windows
        license:
          description: OS template license details
          nullable: true
          type: object
          properties:
            os:
              description: OS template license OS details
              nullable: true
              type: object
              properties:
                name:
                  type: array
                  description: OS template license item names
                  nullable: true
                  items:
                    $ref: '#/components/schemas/dedicated.TemplateOsInfoLicenseItemEnum'
                url:
                  type: string
                  description: OS template license item url
                  nullable: true
            usage:
              description: OS template license usage details
              nullable: true
              type: object
              properties:
                name:
                  type: array
                  description: OS template license item names
                  nullable: true
                  items:
                    $ref: '#/components/schemas/dedicated.TemplateOsInfoLicenseItemEnum'
                url:
                  type: string
                  description: OS template license item url
                  nullable: true
        project:
          description: OS template project details
          nullable: true
          type: object
          properties:
            os:
              description: OS template project OS details
              nullable: true
              type: object
              properties:
                governance:
                  type: array
                  description: OS template project item governance
                  nullable: true
                  items:
                    type: string
                name:
                  type: string
                  description: OS template project item name
                  nullable: true
                releaseNotes:
                  type: string
                  description: OS template project item release notes
                  nullable: true
                url:
                  type: string
                  description: OS template project item url
                  nullable: true
                version:
                  type: string
                  description: OS template project item version
                  nullable: true
            usage:
              description: OS template project usage details
              nullable: true
              type: object
              properties:
                governance:
                  type: array
                  description: OS template project item governance
                  nullable: true
                  items:
                    type: string
                name:
                  type: string
                  description: OS template project item name
                  nullable: true
                releaseNotes:
                  type: string
                  description: OS template project item release notes
                  nullable: true
                url:
                  type: string
                  description: OS template project item url
                  nullable: true
                version:
                  type: string
                  description: OS template project item version
                  nullable: true
        subfamily:
          description: OS subfamily
          type: string
          enum:
            - alma
            - aos
            - arch
            - byoi
            - byolinux
            - centos
            - cloudlinux
            - coreos
            - debian
            - dgx
            - esxi
            - fedora
            - freebsd
            - gentoo
            - hyperv
            - omnios
            - openio
            - openmediavault
            - opensuse
            - ovh
            - pcs
            - power
            - proxmox
            - rhel
            - rocky
            - slackware
            - sles-sap
            - smartos
            - solusvm
            - ubuntu
            - windows-server-core
            - windows-server-desktop-exp
            - xcp
            - xen
        templateName:
          type: string
          description: OS template name
    dedicated.installationTemplate.Templates:
      type: object
      description: Available installation templates
      properties:
        bitFormat:
          description: this template bit format
          readOnly: true
          type: integer
          enum:
            - 32
            - 64
        category:
          description: category of this template (informative only)
          readOnly: true
          type: string
          enum:
            - backup
            - basic
            - customer
            - database
            - erp
            - hosting
            - management
            - other
            - readyToUse
            - virtualisation
            - virtualization
        description:
          type: string
          description: information about this template
          readOnly: true
        distribution:
          type: string
          description: the distribution this template is based on
          readOnly: true
        endOfInstall:
          type: string
          description: after this date, install of this template will not be possible at OVH
          format: date
          readOnly: true
        family:
          description: this template family type
          readOnly: true
          type: string
          enum:
            - bsd
            - custom
            - ibm
            - linux
            - solaris
            - unix
            - windows
        filesystems:
          type: array
          description: list of all filesystems available for this template
          items:
            $ref: '#/components/schemas/dedicated.server.FileSystemEnum'
          readOnly: true
        inputs:
          type: array
          description: Inputs
          nullable: true
          items:
            $ref: '#/components/schemas/dedicated.TemplateOsInput'
          readOnly: true
        license:
          description: This distribution licensing details
          nullable: true
          readOnly: true
          type: object
          properties:
            os:
              description: OS template license OS details
              nullable: true
              type: object
              properties:
                name:
                  type: array
                  description: OS template license item names
                  nullable: true
                  items:
                    $ref: '#/components/schemas/dedicated.TemplateOsInfoLicenseItemEnum'
                url:
                  type: string
                  description: OS template license item url
                  nullable: true
            usage:
              description: OS template license usage details
              nullable: true
              type: object
              properties:
                name:
                  type: array
                  description: OS template license item names
                  nullable: true
                  items:
                    $ref: '#/components/schemas/dedicated.TemplateOsInfoLicenseItemEnum'
                url:
                  type: string
                  description: OS template license item url
                  nullable: true
        lvmReady:
          type: boolean
          description: This distribution supports Logical Volumes (Linux LVM)
          nullable: true
          readOnly: true
        noPartitioning:
          type: boolean
          description: Partitioning customization is not available for this OS template
          readOnly: true
        project:
          description: This distribution project details
          nullable: true
          readOnly: true
          type: object
          properties:
            os:
              description: OS template project OS details
              nullable: true
              type: object
              properties:
                governance:
                  type: array
                  description: OS template project item governance
                  nullable: true
                  items:
                    type: string
                name:
                  type: string
                  description: OS template project item name
                  nullable: true
                releaseNotes:
                  type: string
                  description: OS template project item release notes
                  nullable: true
                url:
                  type: string
                  description: OS template project item url
                  nullable: true
                version:
                  type: string
                  description: OS template project item version
                  nullable: true
            usage:
              description: OS template project usage details
              nullable: true
              type: object
              properties:
                governance:
                  type: array
                  description: OS template project item governance
                  nullable: true
                  items:
                    type: string
                name:
                  type: string
                  description: OS template project item name
                  nullable: true
                releaseNotes:
                  type: string
                  description: OS template project item release notes
                  nullable: true
                url:
                  type: string
                  description: OS template project item url
                  nullable: true
                version:
                  type: string
                  description: OS template project item version
                  nullable: true
        rootMountpoint:
          type: string
          description: The mandatory mount point of the root filesystem on this OS
          nullable: true
          readOnly: true
        softRaidOnlyMirroring:
          type: boolean
          description: Partitioning customization is available but limited to mirroring for this OS template
          readOnly: true
        subfamily:
          description: this template subfamily type
          readOnly: true
          type: string
          enum:
            - alma
            - aos
            - arch
            - byoi
            - byolinux
            - centos
            - cloudlinux
            - coreos
            - debian
            - dgx
            - esxi
            - fedora
            - freebsd
            - gentoo
            - hyperv
            - omnios
            - openio
            - openmediavault
            - opensuse
            - ovh
            - pcs
            - power
            - proxmox
            - rhel
            - rocky
            - slackware
            - sles-sap
            - smartos
            - solusvm
            - ubuntu
            - windows-server-core
            - windows-server-desktop-exp
            - xcp
            - xen
        templateName:
          type: string
          description: This template name
          readOnly: true
    dedicated.installationTemplate.templatePartitioningSchemes:
      type: object
      description: Partitioning schemes available on this template
      properties:
        name:
          type: string
          description: This partitioning scheme name
          readOnly: true
        priority:
          type: integer
          description: on a reinstall, if a partitioning scheme is not specified, the one with the higher priority will be used by default, among all the compatible partitioning schemes (given the underlying hardware specifications)
          readOnly: true
    dedicated.installationTemplate.hardwareRaid:
      type: object
      description: Hardware RAID defined in this partitioning scheme
      properties:
        disks:
          type: array
          description: Disk list
          items:
            type: string
          readOnly: true
        mode:
          description: RAID mode
          readOnly: true
          type: string
          enum:
            - raid0
            - raid1
            - raid10
            - raid5
            - raid50
            - raid6
            - raid60
        name:
          type: string
          description: Hardware RAID name
          readOnly: true
        step:
          type: integer
          description: Specifies the creation order of the hardware RAID
          readOnly: true
    dedicated.installationTemplate.templatePartitions:
      type: object
      description: ' Partitions defined in this partitioning scheme'
      properties:
        filesystem:
          description: Partition filesytem
          readOnly: true
          type: string
          enum:
            - btrfs
            - ext3
            - ext4
            - fat16
            - none
            - ntfs
            - reiserfs
            - swap
            - ufs
            - vmfs5
            - vmfs6
            - vmfsl
            - xfs
            - zfs
        mountpoint:
          type: string
          description: Partition mount point
          readOnly: true
        order:
          type: integer
          description: specifies the creation order of the partition on the disk
          readOnly: true
        raid:
          description: Partition raid
          nullable: true
          readOnly: true
          type: string
          enum:
            - '0'
            - '1'
            - '10'
            - '5'
            - '6'
            - '7'
        size:
          description: 'Partition size (unit: MB GB TB, MB by default), 0 => rest of the space'
          readOnly: true
          type: object
          properties:
            unit:
              type: string
            value:
              type: integer
        type:
          description: Partition type
          readOnly: true
          type: string
          enum:
            - logical
            - lv
            - primary
        volumeName:
          type: string
          description: Logical volume name (required if type is lv) or optional zpool name if filesystem is ZFS
          nullable: true
          readOnly: true
    dedicated.TemplateOsUsageEnum:
      type: string
      description: Os usage definition
      enum:
        - backup
        - basic
        - customer
        - database
        - erp
        - hosting
        - management
        - other
        - readyToUse
        - virtualisation
        - virtualization
    dedicated.TemplateOsTypeEnum:
      type: string
      description: Os type
      enum:
        - bsd
        - custom
        - ibm
        - linux
        - solaris
        - unix
        - windows
    dedicated.TemplateOsInfoLicense:
      type: object
      description: A structure describing some interesting facts about an OS template licensing
      properties:
        os:
          description: OS template license OS details
          nullable: true
          type: object
          properties:
            name:
              type: array
              description: OS template license item names
              nullable: true
              items:
                $ref: '#/components/schemas/dedicated.TemplateOsInfoLicenseItemEnum'
            url:
              type: string
              description: OS template license item url
              nullable: true
        usage:
          description: OS template license usage details
          nullable: true
          type: object
          properties:
            name:
              type: array
              description: OS template license item names
              nullable: true
              items:
                $ref: '#/components/schemas/dedicated.TemplateOsInfoLicenseItemEnum'
            url:
              type: string
              description: OS template license item url
              nullable: true
    dedicated.TemplateOsInfoProject:
      type: object
      description: A structure describing some interesting facts about an OS template project
      properties:
        os:
          description: OS template project OS details
          nullable: true
          type: object
          properties:
            governance:
              type: array
              description: OS template project item governance
              nullable: true
              items:
                type: string
            name:
              type: string
              description: OS template project item name
              nullable: true
            releaseNotes:
              type: string
              description: OS template project item release notes
              nullable: true
            url:
              type: string
              description: OS template project item url
              nullable: true
            version:
              type: string
              description: OS template project item version
              nullable: true
        usage:
          description: OS template project usage details
          nullable: true
          type: object
          properties:
            governance:
              type: array
              description: OS template project item governance
              nullable: true
              items:
                type: string
            name:
              type: string
              description: OS template project item name
              nullable: true
            releaseNotes:
              type: string
              description: OS template project item release notes
              nullable: true
            url:
              type: string
              description: OS template project item url
              nullable: true
            version:
              type: string
              description: OS template project item version
              nullable: true
    dedicated.TemplateOsSubfamilyEnum:
      type: string
      description: Os subfamily definition
      enum:
        - alma
        - aos
        - arch
        - byoi
        - byolinux
        - centos
        - cloudlinux
        - coreos
        - debian
        - dgx
        - esxi
        - fedora
        - freebsd
        - gentoo
        - hyperv
        - omnios
        - openio
        - openmediavault
        - opensuse
        - ovh
        - pcs
        - power
        - proxmox
        - rhel
        - rocky
        - slackware
        - sles-sap
        - smartos
        - solusvm
        - ubuntu
        - windows-server-core
        - windows-server-desktop-exp
        - xcp
        - xen
    dedicated.server.BitFormatEnum:
      type: integer
      description: Available os bit format
      enum:
        - 32
