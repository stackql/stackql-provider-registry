openapi: 3.0.0
info:
  title: OVHcloud Dedicated Servers API
  description: 'Bare metal dedicated servers: servers, hardware specifications, installations, network interfaces, IPMI, interventions, backup storage, features and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/dedicated/server
paths:
  /dedicated/server:
    get:
      summary: List servers
      description: List servers. Returns the names of the dedicated servers the account can access. Each name is the serviceName used by the other calls on a server.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_serverResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Server@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:get
          required: true
      x-expanded-response: DedicatedServerDedicatedWithIAM
      operationId: get_v1_dedicated_server
  /dedicated/server/datacenter/availabilities:
    get:
      summary: List server availability by datacenter
      description: Returns the availability of each server hardware configuration in each datacenter. Filter by plan code or hardware part, and choose datacenters with datacenters and excludeDatacenters. This call does not require authentication.
      parameters:
        - in: query
          name: datacenters
          description: The names of datacenters separated by commas
          schema:
            type: string
        - in: query
          name: excludeDatacenters
          description: If true, all datacenters are returned except those listed in datacenters parameter
          schema:
            type: boolean
        - in: query
          name: gpu
          description: The name of the gpu hardware part
          schema:
            type: string
        - in: query
          name: memory
          description: The name of the memory hardware part
          schema:
            type: string
        - in: query
          name: planCode
          description: The plan code in which the hardware is involved
          schema:
            type: string
        - in: query
          name: server
          description: The name of the base hardware
          schema:
            type: string
        - in: query
          name: storage
          description: The name of the storage hardware part
          schema:
            type: string
        - in: query
          name: systemStorage
          description: The name of the system storage hardware part
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_server_datacenter_availabilitiesResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Availability & Ordering@@@110
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_dedicated_server_datacenter_availabilities
  /dedicated/server/log:
    get:
      summary: List public server logs
      description: List public server logs. Returns public log entries for servers, page by page, optionally restricted to one server or one datacenter. Each entry gives the server name, a short text and a timestamp. This route is deprecated. (Deprecated, will be removed)
      deprecated: true
      x-deprecation-date: '0001-01-01T00:00:00Z'
      x-deletion-date: '0001-01-01T00:00:00Z'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: datacenter
          description: Restrict on the given datacenter
          schema:
            $ref: '#/components/schemas/dedicated.DatacenterEnum'
        - in: query
          name: limit
          description: Amount of rows per page
          schema:
            type: integer
        - in: query
          name: page
          description: Page to display
          schema:
            type: integer
        - in: query
          name: server
          description: Restrict on the given server
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.PublicLog'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Observability@@@100
      x-badges:
        - color: red
          label: Deprecated, will be removed
      x-iam-actions:
        - name: dedicatedServer:apiovh:log/get
          required: true
      operationId: get_v1_dedicated_server_log
  /dedicated/server/osAvailabilities:
    get:
      summary: List operating systems by hardware
      description: Returns the names of the operating systems available for the hardware reference given in the hardware parameter. This call does not require authentication.
      parameters:
        - in: query
          name: hardware
          description: Hardware reference requested
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_server_os_availabilitiesResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@110
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_dedicated_server_os_availabilities
  /dedicated/server/region/availabilities:
    get:
      summary: List server availability by region
      description: Returns the availability of each server hardware configuration in each region and its availability zones. Filter by plan code or hardware part, and choose regions with regions and excludeRegions. Unlike the datacenter route, this call requires authentication. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: excludeRegions
          description: If true, all regions are returned except those listed in regions parameter
          schema:
            type: boolean
        - in: query
          name: gpu
          description: The name of the gpu hardware part
          schema:
            type: string
        - in: query
          name: memory
          description: The name of the memory hardware part
          schema:
            type: string
        - in: query
          name: planCode
          description: The plan code in which the hardware is involved
          schema:
            type: string
        - in: query
          name: regions
          description: The names of regions
          schema:
            type: array
            items:
              $ref: '#/components/schemas/dedicated.server.AvailabilityRegionalizationEnum'
        - in: query
          name: server
          description: The name of the base hardware
          schema:
            type: string
        - in: query
          name: storage
          description: The name of the storage hardware part
          schema:
            type: string
        - in: query
          name: systemStorage
          description: The name of the system storage hardware part
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_server_region_availabilitiesResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Availability & Ordering@@@120
      x-badges:
        - color: blue
          label: Beta version
      operationId: get_v1_dedicated_server_region_availabilities
  /dedicated/server/virtualNetworkInterface/{uuid}:
    get:
      summary: Get a virtual network interface
      description: Returns a virtual network interface from its UUID alone, without the server name in the path. The response includes the server it is bound to, its mode, its vRack and its network interface controllers.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: uuid
          description: Uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.VirtualNetworkInterface'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Network@@@200
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: uuid
      operationId: get_v1_dedicated_server_virtual_network_interface_uuid
  /dedicated/server/{serviceName}:
    get:
      summary: Get a server
      description: Get a server. Returns the properties of the server, such as its datacenter, IP address, operating system, power state, and boot and rescue settings. The response also contains the IAM metadata of the server.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.DedicatedWithIAM'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Server@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:get
          required: true
      operationId: get_v1_dedicated_server_service_name
    put:
      summary: Update a server
      description: Update a server. Updates the writable properties of the server, such as its boot, rescue, monitoring and datacenter intervention settings. The other properties are read-only.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dedicated.server.Dedicated'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Server@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:put
          required: true
      operationId: put_v1_dedicated_server_service_name
  /dedicated/server/{serviceName}/authenticationSecret:
    post:
      summary: Get access credentials
      description: Get access credentials. Returns the credentials to connect to the server or to an application installed on it, such as SSH, RDP, SQL Server or a web control panel. Each entry gives the access type, URL, login and password.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_dedicated_server_service_name_authentication_secretResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Server@@@240
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:authenticationSecret/create
          required: true
      operationId: post_v1_dedicated_server_service_name_authentication_secret
  /dedicated/server/{serviceName}/backupCloudOfferDetails:
    get:
      summary: Get the cloud backup offer
      description: 'Get the cloud backup offer. Returns the cloud backup offer available for the server: the maximum size and the monthly read/write volume of the storage and archive containers. When no offer is available, the call returns an error. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.backup.BackupOffer'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Features@@@250
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:backupCloudOfferDetails/get
          required: true
      operationId: get_v1_dedicated_server_service_name_backup_cloud_offer_details
  /dedicated/server/{serviceName}/biosSettings:
    get:
      summary: Get the BIOS settings
      description: Get the BIOS settings. Returns the configurable BIOS settings of the server. The response states whether SGX is supported and lists the SGX statuses and PRMRR sizes the server accepts. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.biosSettings.BiosSettings'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - System@@@80
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:biosSettings/get
          required: true
      operationId: get_v1_dedicated_server_service_name_bios_settings
  /dedicated/server/{serviceName}/biosSettings/sgx:
    get:
      summary: Get the SGX settings
      description: 'Get the SGX settings. Returns the SGX configuration of the server: the SGX status and the size of the Processor Reserved Memory (PRMRR). To change it, use the configure operation. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.biosSettingsSgx.BiosSettingsSgx'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - System@@@90
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:biosSettings/sgx/get
          required: true
      operationId: get_v1_dedicated_server_service_name_bios_settings_sgx
  /dedicated/server/{serviceName}/biosSettings/sgx/configure:
    post:
      summary: Configure SGX
      description: Configure SGX. Enables or disables SGX and sets the size of the Processor Reserved Memory (PRMRR). The server reboots one or several times. On a server without SGX BIOS settings, the call returns an error. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prmrr:
                  description: Size of the Processor Reserved Memory
                  $ref: '#/components/schemas/dedicated.server.BiosSettingsSgxPrmrrEnum'
                status:
                  description: Desired SGX status
                  $ref: '#/components/schemas/dedicated.server.BiosSettingsSgxStatusEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - System@@@100
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: dedicatedServer:apiovh:biosSettings/sgx/configure
          required: true
      operationId: post_v1_dedicated_server_service_name_bios_settings_sgx_configure
  /dedicated/server/{serviceName}/boot:
    get:
      summary: List compatible netboots
      description: List compatible netboots. Returns the identifiers of the netboots compatible with the server. Filter them by boot type (harddisk, network, rescue, internal or power) with the bootType parameter.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: bootType
          description: Filter the value of bootType property (=)
          schema:
            $ref: '#/components/schemas/dedicated.server.BootTypeEnum'
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_server_service_name_bootResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:boot/get
          required: true
      x-expanded-response: DedicatedServerNetboot
      operationId: get_v1_dedicated_server_service_name_boot
  /dedicated/server/{serviceName}/boot/{bootId}:
    get:
      summary: Get a netboot
      description: 'Get a netboot. Returns a netboot compatible with the server: its boot type, its kernel and its description.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: bootId
          description: boot id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.Netboot'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:boot/get
          required: true
      operationId: get_v1_dedicated_server_service_name_boot_boot_id
  /dedicated/server/{serviceName}/boot/{bootId}/option:
    get:
      summary: List netboot options
      description: List netboot options. Returns the options activated on the netboot, among cpufamily, grsec, ipv6 and smp.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: bootId
          description: boot id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_server_service_name_boot_boot_id_optionResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@80
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:boot/option/get
          required: true
      x-expanded-response: DedicatedServerNetbootOption
      operationId: get_v1_dedicated_server_service_name_boot_boot_id_option
  /dedicated/server/{serviceName}/boot/{bootId}/option/{option}:
    get:
      summary: Get a netboot option
      description: Get a netboot option. Returns the value of an option activated on the netboot. The option is one of cpufamily, grsec, ipv6 or smp.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: bootId
          description: boot id
          required: true
          schema:
            type: integer
        - in: path
          name: option
          description: The option of this boot
          required: true
          schema:
            $ref: '#/components/schemas/dedicated.server.BootOptionEnum'
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.netbootOption'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Deployments@@@90
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:boot/option/get
          required: true
      operationId: get_v1_dedicated_server_service_name_boot_boot_id_option_option
  /dedicated/server/{serviceName}/burst:
    get:
      summary: Get the bandwidth burst
      description: Get the bandwidth burst. Returns the burst status of the server bandwidth and its burst capacity. The status is active, inactive, or inactiveLocked when burst is temporarily disabled due to overuse.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.server.ServerBurst'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Network@@@260
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:burst/get
          required: true
      operationId: get_v1_dedicated_server_service_name_burst
    put:
      summary: Update the bandwidth burst
      description: Update the bandwidth burst. Updates the burst status of the server bandwidth. When active, the bandwidth can temporarily exceed the included OvhToInternet amount, within the burst capacity.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dedicated.server.ServerBurst'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Network@@@270
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:burst/edit
          required: true
      operationId: put_v1_dedicated_server_service_name_burst
  /dedicated/server/{serviceName}/changeContact:
    post:
      summary: Change service contacts
      description: Change service contacts. Starts a procedure to change the admin, tech or billing contact of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactAdmin:
                  type: string
                  description: The contact to set as admin contact
                contactBilling:
                  type: string
                  description: The contact to set as billing contact
                contactTech:
                  type: string
                  description: The contact to set as tech contact
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_dedicated_server_service_name_change_contactResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Server@@@250
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:changeContact
          required: true
      operationId: post_v1_dedicated_server_service_name_change_contact
  /dedicated/server/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Server@@@270
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: dedicatedServer:apiovh:confirmTermination
          required: true
