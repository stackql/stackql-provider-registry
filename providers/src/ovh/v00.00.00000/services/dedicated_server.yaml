  /dedicated/server/{serviceName}/secondaryDnsDomains:
    get:
      summary: List secondary DNS domains
      description: List secondary DNS domains. Returns the names of the domains declared on the secondary DNS of the server.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_server_service_name_secondary_dns_domainsResponse'
