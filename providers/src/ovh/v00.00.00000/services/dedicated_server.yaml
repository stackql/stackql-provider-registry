      operationId: get_v1_dedicated_server_service_name_secondary_dns_domains
    post:
      summary: Create a secondary DNS domain
      description: Create a secondary DNS domain. Adds a domain to the secondary DNS of the server, with its ip, which is required. The domain must first be verified with the TXT record given by secondaryDnsNameDomainToken.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your dedicated server
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  description: The domain to add
                ip:
                  $ref: '#/components/schemas/ipv4'
              required:
                - domain
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Network@@@290
      x-badges:
        - color: green
          label: Stable production version
