                    message: Resource cannot be modified in its current state
      tags:
        - Network
      x-developer-hub-navigation:
        - - Public Cloud
          - Network
          - Gateway@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
