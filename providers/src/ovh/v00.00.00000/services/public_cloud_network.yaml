              description: When true, inserts X-Forwarded-Port header with the listener port
              nullable: true
            xForwardedProto:
              type: boolean
              description: When true, inserts X-Forwarded-Proto header with the listener protocol
              nullable: true
            xSslClientDn:
              type: boolean
              description: When true, inserts X-SSL-Client-DN header with the client certificate distinguished name
              nullable: true
            xSslClientHasCert:
