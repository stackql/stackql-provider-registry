  /loadbalancer:
    get:
      operationId: getLoadBalancers
      summary: List load balancers
      description: |-
        Returns the load balancers of the project.

        ### Filters
        The optional `name`, `flavor` and `region` query parameters narrow the list. Each one can be repeated (for example `?flavor=SMALL&flavor=MEDIUM`): repeated values of the same parameter are combined with OR, and different parameters are combined with AND. An unknown `flavor` value, or an unavailable `region`, is rejected with a `400 InvalidParameter`. The `resourceStatus` is computed from the live state of each resource, so it is not a filter: a `status` query parameter is rejected with a `400 InvalidParameter`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: flavor
          description: Filter by load balancer flavor name. Repeatable.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/publicCloud.loadbalancer.LoadbalancerFlavorNameEnum'
        - in: query
          name: name
          description: Filter by load balancer name (case-insensitive substring match). Repeatable.
          schema:
            type: array
            items:
              type: string
        - in: query
          name: region
          description: Filter by load balancer region. An unavailable region is rejected. Repeatable.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLoadBalancersResponse'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::InvalidParameter:
                  value:
                    class: Client::BadRequest::InvalidParameter
                    message: Invalid parameter in the request
      tags:
        - Loadbalancer
      x-developer-hub-navigation:
        - - Public Cloud
          - Network
          - Load Balancer@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:loadbalancer/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudLoadbalancerLoadbalancer
    post:
      operationId: createLoadBalancer
      summary: Create a load balancer
      description: Creates a load balancer with the given Octavia flavor, attaching its virtual IP to a private network and subnet.
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.loadbalancer.LoadbalancerCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.loadbalancer.Loadbalancer'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::InvalidParameter:
                  value:
                    class: Client::BadRequest::InvalidParameter
                    message: Invalid parameter in the request
                Client::BadRequest::ServiceNotAvailableInRegion:
                  value:
                    class: Client::BadRequest::ServiceNotAvailableInRegion
                    message: This service is not available in the selected region
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::FlavorDoesNotExist:
                  value:
                    class: Client::NotFound::FlavorDoesNotExist
                    message: Flavor not found
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::RegionInMaintenance:
                  value:
                    class: Client::Conflict::RegionInMaintenance
                    message: This region is currently in maintenance
      tags:
        - Loadbalancer
      x-developer-hub-navigation:
        - - Public Cloud
          - Network
          - Load Balancer@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:loadbalancer/create
          required: true
        - name: publicCloudProject:apiovh:loadbalancer/usePublicIP
          description: Required when network carries an IP outside the subnet CIDR, which designates an existing floating IP to associate with the VIP port
          required: false
