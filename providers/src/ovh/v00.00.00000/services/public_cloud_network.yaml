              description: Health monitor configuration for this pool. Clearing it deletes the pool's health monitor.
              nullable: true
              type: object
              properties:
                delay:
                  type: integer
                  description: Time in seconds between sending health check probes to members
                domainName:
                  type: string
                  description: Domain name injected into the HTTP Host header for HTTP/HTTPS health checks
                  nullable: true
                expectedCodes:
                  type: string
                  description: Expected HTTP status codes for HTTP/HTTPS health checks, for example 200, 200-202, 200-202,401
                  nullable: true
                httpMethod:
                  description: HTTP method used for HTTP/HTTPS health checks
                  nullable: true
                  type: string
                  enum:
                    - CONNECT
                    - DELETE
                    - GET
                    - HEAD
                    - OPTIONS
                    - PATCH
                    - POST
                    - PUT
                    - TRACE
                httpVersion:
                  type: string
                  description: HTTP version for HTTP/HTTPS health checks (1.0 or 1.1)
                  nullable: true
                maxRetries:
                  type: integer
                  description: Number of consecutive health check failures before marking a member as INACTIVE. From 1 to 10.
                maxRetriesDown:
                  type: integer
                  description: Number of consecutive health check failures before marking a member as ERROR. From 1 to 10.
                  nullable: true
                name:
                  type: string
                  description: Human-readable name for the health monitor
                  nullable: true
                timeout:
                  type: integer
                  description: Maximum time in seconds to wait for a health check reply (must be less than or equal to delay)
                type:
