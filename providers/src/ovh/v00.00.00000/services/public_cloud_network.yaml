          readOnly: true
        id:
          type: string
          description: Identifier of the private network the VIP port lives in
          format: uuid
          readOnly: true
        subnetId:
          type: string
          description: Identifier of the subnet the VIP port draws its fixed address from
          format: uuid
          readOnly: true
