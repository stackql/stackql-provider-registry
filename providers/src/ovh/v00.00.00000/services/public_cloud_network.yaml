  /loadbalancer/{loadbalancerId}/listener:
    get:
      operationId: getLoadBalancerListeners
      summary: List listeners
      description: |-
        Returns the listeners of the load balancer.

        ### Filters
        The optional `name` and `protocol` query parameters narrow the list. Each one can be repeated (for example `?protocol=HTTP&protocol=HTTPS`): repeated values of the same parameter are combined with OR, and different parameters are combined with AND. An unknown `protocol` value is rejected with a `400 InvalidParameter`. The `resourceStatus` is computed from the live state of each resource, so it is not a filter: a `status` query parameter is rejected with a `400 InvalidParameter`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: loadbalancerId
          description: Loadbalancer ID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: name
          description: Filter by listener name (case-insensitive substring match). Repeatable.
          schema:
            type: array
            items:
              type: string
        - in: query
          name: protocol
          description: Filter by listener protocol. Repeatable.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/publicCloud.loadbalancer.ListenerProtocolEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLoadBalancerListenersResponse'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
