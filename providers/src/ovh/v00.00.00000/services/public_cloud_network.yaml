                  type: string
                  enum:
                    - L
                    - M
                    - S
              required:
                - name
                - tier
            subnet:
              description: Subnet to allocate the endpoint port in. Provide one of network or subnet. The subnet must belong to the given network when both are supplied, otherwise the request is rejected. If subnet is the only reference, its parent network is used. Required when vipAddress is set.
              nullable: true
              type: object
              properties:
                id:
                  type: string
                  description: Identifier of the subnet
                  format: uuid
              required:
                - id
            vipAddress:
              description: Optional private IP address to assign to the endpoint inside the subnet. It must belong to the subnet CIDR and to one of its allocation pools, must not be the subnet gateway address, and must not already be in use by another port. Setting it requires subnet to be set in the same request. When omitted, an address is picked automatically from the subnet allocation pool. Immutable after creation.
              nullable: true
              type: string
              format: ipv4
              example: 192.0.2.0
          required:
            - location
            - name
            - service
        updatedAt:
          type: string
          description: Last update date of the private endpoint
          format: date-time
          readOnly: true
