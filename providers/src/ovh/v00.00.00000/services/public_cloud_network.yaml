          description: Private endpoint readiness in the system
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
        targetSpec:
          description: Last target specification of the private endpoint
          readOnly: true
          type: object
          properties:
            description:
              type: string
              description: Private endpoint description
              nullable: true
            location:
              description: Target location. Only the region is used, availability zones are not supported.
              type: object
              properties:
                availabilityZone:
                  type: string
                  description: Availability zone within the region
                  nullable: true
                region:
                  type: string
                  description: Region code
              required:
                - region
            name:
              type: string
              description: Private endpoint name, unique in the project for a given subnet (case-insensitive)
            network:
              description: Network to allocate the endpoint port in. Provide one of network or subnet. Whichever references are supplied must be mutually consistent (the given subnet must belong to this network) or the request is rejected, and any omitted reference is derived from those given. If network is the only reference, it must have exactly one IPv4 subnet.
              nullable: true
              type: object
              properties:
                id:
                  type: string
                  description: Identifier of the network
                  format: uuid
              required:
