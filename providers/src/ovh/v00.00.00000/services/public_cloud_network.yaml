    get:
      operationId: getGateways
      summary: List gateways
      description: Returns the gateways of the project. Filter by region with the `region` query parameter.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: region
          description: Optional region filter
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGatewaysResponse'
      tags:
        - Network
      x-developer-hub-navigation:
        - - Public Cloud
          - Network
          - Gateway@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:gateway/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudGatewayGateway
    post:
      operationId: createGateway
      summary: Create a gateway
      description: Creates a gateway. An external gateway is required. Subnets can be attached as router interfaces.
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.gateway.GatewayCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.gateway.Gateway'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::InvalidParameter:
                  value:
                    class: Client::BadRequest::InvalidParameter
                    message: Invalid parameter in the request
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::RegionInMaintenance:
                  value:
                    class: Client::Conflict::RegionInMaintenance
                    message: This region is currently in maintenance
      tags:
        - Network
      x-developer-hub-navigation:
        - - Public Cloud
          - Network
          - Gateway@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:gateway/create
          required: true
