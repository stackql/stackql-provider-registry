openapi: 3.0.0
info:
  title: OVHcloud Public Cloud Network (v2) API
  description: 'Networking of a Public Cloud project through API v2: networks, gateways, public IPs, load balancers, security groups and private endpoints.'
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/publicCloud
paths:
