        - ONLINE
    publicCloud.loadbalancer.LoadbalancerProvisioningStatusEnum:
      type: string
      description: Provisioning status of a load balancer in OpenStack
      enum:
        - ACTIVE
        - DELETED
        - ERROR
        - PENDING_CREATE
        - PENDING_DELETE
        - PENDING_UPDATE
    publicCloud.loadbalancer.LoadbalancerNetworkRef:
      type: object
      description: 'Load balancer VIP network reference (desired). User-controlled declaration of the load balancer frontend network: the private network and subnet the virtual IP (VIP) port is created in, and therefore the network the listeners are reachable from. subnetId is mandatory. id is optional: when omitted, the network of the subnet is used, and when given, the subnet must belong to it. The optional IP refines how the VIP is addressed: * omitted. The fixed VIP address is assigned by IPAM inside the subnet. * an address inside the subnet CIDR. Pins the fixed VIP address to that value. * an address outside the subnet CIDR. Designates an EXISTING floating IP to associate with the VIP port. No address is ever allocated on your behalf. The VIP network is set at creation and is IMMUTABLE afterward: it is not part of the update target spec, and neither the network, the subnet, nor the IP can be changed on a load balancer that already exists.'
      properties:
        id:
          type: string
          description: Identifier of the private network the VIP port is created in. This is the load balancer frontend network, from which its listeners are reachable. When omitted, the network of subnetId is used. Immutable after creation.
          nullable: true
          format: uuid
        ip:
          description: 'Address of the virtual IP, whose meaning depends on where it falls relative to the subnet CIDR. Inside the subnet CIDR: pins the fixed VIP address instead of letting IPAM assign it. The address must lie in the subnet allocation pool, must not be the subnet gateway address, and must not already be held by another port. Outside the subnet CIDR: designates an EXISTING floating IP of the project to associate with the VIP port. The floating IP is never created for you, must not already be associated with another port, and the subnet must be attached to a router with an external gateway. A public address requires the optional loadbalancer/usePublicIP IAM action. When omitted, the fixed VIP address is assigned by IPAM. Immutable after creation.'
          nullable: true
          type: string
          format: ipv4
          example: 192.0.2.0
        subnetId:
          type: string
          description: Identifier of the subnet the VIP port draws its fixed address from. When id is given, the subnet must belong to that network. Immutable after creation.
          format: uuid
      required:
        - subnetId
