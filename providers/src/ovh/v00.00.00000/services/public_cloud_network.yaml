        The create-only field `location` cannot be changed once the floating IP exists. It is deliberately absent from the update model, and sending it is rejected with a 400.

        The optional `checksum` guards against a lost update: when supplied it must match the floating IP's current checksum or the request is rejected with a 409 checksum mismatch. Omitting it skips the check and forces the write (last-write-wins).
