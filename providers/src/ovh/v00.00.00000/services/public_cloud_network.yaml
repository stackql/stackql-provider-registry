                  type: string
                  enum:
                    - HTTP
                    - HTTPS
                    - PING
                    - SCTP
                    - TCP
                    - TLS_HELLO
                    - UDP_CONNECT
                urlPath:
                  type: string
                  description: URI path for HTTP/HTTPS health checks (must start with /)
                  nullable: true
              required:
                - delay
                - maxRetries
                - timeout
                - type
            name:
              type: string
              description: Pool name
              nullable: true
            persistence:
