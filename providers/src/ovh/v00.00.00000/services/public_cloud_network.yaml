          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:loadbalancer/get
          required: true
      x-response-identifier: id
    put:
      operationId: editLoadBalancer
      summary: Update a load balancer
      description: 'Updates the load balancer''s name, description or flavor. A flavor other than the current one resizes the load balancer in place: it is failed over onto amphorae of the new flavor, which takes several minutes and can briefly interrupt traffic. The VIP network is immutable after creation.'
      security:
        - oAuth2AuthCode: []
      parameters:
