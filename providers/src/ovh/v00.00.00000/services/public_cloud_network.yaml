    publicCloud.loadbalancer.LoadbalancerTargetSpec:
      type: object
      description: Desired specification for a load balancer
      properties:
        description:
          type: string
          description: Load balancer description
          nullable: true
        flavor:
          description: Octavia flavor reference
          type: object
          properties:
            name:
              description: Octavia flavor name
              type: string
              enum:
                - LARGE
                - MEDIUM
                - SMALL
                - XL
          required:
            - name
        location:
          description: Target location
          type: object
          properties:
            availabilityZone:
              type: string
              description: Availability zone within the region
              nullable: true
            region:
              type: string
              description: Region code
          required:
            - region
        name:
          type: string
          description: Load balancer name
        network:
          description: 'Frontend network of the load balancer: the private network and subnet the virtual IP port is created in, and therefore the network its listeners are reachable from. The optional IP either pins the fixed VIP address (address inside the subnet CIDR) or designates an EXISTING floating IP to associate with the VIP port (address outside it). A public address requires the optional loadbalancer/usePublicIP IAM action. Immutable after creation.'
          type: object
          properties:
            id:
              type: string
              description: Identifier of the private network the VIP port is created in. This is the load balancer frontend network, from which its listeners are reachable. When omitted, the network of subnetId is used. Immutable after creation.
              nullable: true
              format: uuid
            ip:
              description: 'Address of the virtual IP, whose meaning depends on where it falls relative to the subnet CIDR. Inside the subnet CIDR: pins the fixed VIP address instead of letting IPAM assign it. The address must lie in the subnet allocation pool, must not be the subnet gateway address, and must not already be held by another port. Outside the subnet CIDR: designates an EXISTING floating IP of the project to associate with the VIP port. The floating IP is never created for you, must not already be associated with another port, and the subnet must be attached to a router with an external gateway. A public address requires the optional loadbalancer/usePublicIP IAM action. When omitted, the fixed VIP address is assigned by IPAM. Immutable after creation.'
              nullable: true
              type: string
              format: ipv4
              example: 192.0.2.0
            subnetId:
              type: string
              description: Identifier of the subnet the VIP port draws its fixed address from. When id is given, the subnet must belong to that network. Immutable after creation.
              format: uuid
          required:
            - subnetId
      required:
        - flavor
        - location
        - name
        - network
    publicCloud.loadbalancer.LoadbalancerPutTargetSpec:
      type: object
      description: Desired specification for updating a load balancer (excludes immutable fields)
      properties:
        description:
          type: string
          description: Load balancer description
          nullable: true
        flavor:
          description: 'Octavia flavor reference. Size of the load balancer. When it differs from the current flavor, the load balancer is resized: Octavia fails it over onto amphorae of the new flavor, which can briefly interrupt traffic. When omitted, the current flavor is kept.'
          nullable: true
          type: object
          properties:
            name:
              description: Octavia flavor name
              type: string
              enum:
                - LARGE
                - MEDIUM
                - SMALL
                - XL
          required:
            - name
        name:
          type: string
          description: Load balancer name
      required:
        - name
