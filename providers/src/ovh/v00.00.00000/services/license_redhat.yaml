openapi: 3.0.0
info:
  title: OVHcloud Red Hat Licenses API
  description: Red Hat licenses.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/license/redhat
paths:
  /license/redhat:
    get:
      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_redhatResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseRedHat:apiovh:get
          required: true
      x-expanded-response: LicenseRedhatRedHatWithIAM
      operationId: get_v1_license_redhat
      description: List available services (Beta version)
  /license/redhat/{serviceName}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your RedHat license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.redhat.RedHatWithIAM'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseRedHat:apiovh:get
          required: true
      operationId: get_v1_license_redhat_service_name
      description: Get this object properties (Beta version)
    put:
      summary: Alter this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your RedHat license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.redhat.RedHat'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseRedHat:apiovh:put
          required: true
      operationId: put_v1_license_redhat_service_name
      description: Alter this object properties (Beta version)
  /license/redhat/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your RedHat license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseRedHat:apiovh:confirmTermination
          required: true
      operationId: post_v1_license_redhat_service_name_confirm_termination
  /license/redhat/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your RedHat license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseRedHat:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_license_redhat_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your RedHat license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseRedHat:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_license_redhat_service_name_service_infos
  /license/redhat/{serviceName}/tasks:
    get:
      summary: tasks linked to this license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: action
          description: Filter the value of action property (=)
          schema:
            $ref: '#/components/schemas/license.ActionType'
        - in: path
          name: serviceName
          description: The name of your RedHat license
          required: true
          schema:
            type: string
        - in: query
          name: status
          description: Filter the value of status property (=)
          schema:
            $ref: '#/components/schemas/license.TaskStateEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_redhat_service_name_tasksResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseRedHat:apiovh:tasks/get
          required: true
      x-expanded-response: LicenseTask
      operationId: get_v1_license_redhat_service_name_tasks
      description: tasks linked to this license (Beta version)
  /license/redhat/{serviceName}/tasks/{taskId}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your RedHat license
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          description: This Task id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseRedHat:apiovh:tasks/get
          required: true
      operationId: get_v1_license_redhat_service_name_tasks_task_id
      description: Get this object properties (Beta version)
  /license/redhat/{serviceName}/terminate:
    post:
      summary: Request service termination
      description: Request service termination. Starts the termination of the service. The admin contact receives a token by email, to confirm with the `confirmTermination` call. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your RedHat license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseRedHat:apiovh:terminate
          required: true
      operationId: post_v1_license_redhat_service_name_terminate
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    license.redhat.RedHatWithIAM:
      type: object
      description: Your RedHat license
      properties:
        creation:
          type: string
          description: This license creation date
          format: date-time
          readOnly: true
        deleteAtExpiration:
          type: boolean
          description: Shall we delete this on expiration ?
        domain:
          type: string
          description: The internal name of your license
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        ip:
          description: The ip on which this license is attached
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        licenseId:
          type: string
          description: The license id on license provider side
          readOnly: true
        status:
          description: This license state
          readOnly: true
          type: string
          enum:
            - ok
            - released
            - terminated
            - toDeliver
        version:
          description: This license version
          readOnly: true
          type: string
          enum:
            - redhat-enterprise-datacenter
            - redhat-enterprise-standard
    license.redhat.RedHat:
      type: object
      description: Your RedHat license
      properties:
        creation:
          type: string
          description: This license creation date
          format: date-time
          readOnly: true
        deleteAtExpiration:
          type: boolean
          description: Shall we delete this on expiration ?
        domain:
          type: string
          description: The internal name of your license
          readOnly: true
        ip:
          description: The ip on which this license is attached
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        licenseId:
          type: string
          description: The license id on license provider side
          readOnly: true
        status:
          description: This license state
          readOnly: true
          type: string
          enum:
            - ok
            - released
            - terminated
            - toDeliver
        version:
          description: This license version
          readOnly: true
          type: string
          enum:
            - redhat-enterprise-datacenter
            - redhat-enterprise-standard
    service.TerminationFutureUseEnum:
      type: string
      description: All future uses you can provide for a service termination
      enum:
        - NOT_REPLACING_SERVICE
        - OTHER
        - SUBSCRIBE_AN_OTHER_SERVICE
        - SUBSCRIBE_OTHER_KIND_OF_SERVICE_WITH_COMPETITOR
        - SUBSCRIBE_SIMILAR_SERVICE_WITH_COMPETITOR
    service.TerminationReasonEnum:
      type: string
      description: All reasons you can provide for a service termination
      enum:
        - FEATURES_DONT_SUIT_ME
        - LACK_OF_PERFORMANCES
        - MIGRATED_TO_ANOTHER_OVH_PRODUCT
        - MIGRATED_TO_COMPETITOR
        - NOT_ENOUGH_RECOGNITION
        - NOT_NEEDED_ANYMORE
        - NOT_RELIABLE
        - NO_ANSWER
        - OTHER
        - PRODUCT_DIMENSION_DONT_SUIT_ME
        - PRODUCT_TOOLS_DONT_SUIT_ME
        - TOO_EXPENSIVE
        - TOO_HARD_TO_USE
        - UNSATIFIED_BY_CUSTOMER_SUPPORT
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - automaticV2024
            - manual
            - oneShot
            - option
        serviceId:
          type: integer
          readOnly: true
        status:
          readOnly: true
          type: string
          enum:
            - autorenewInProgress
            - expired
            - inCreation
            - ok
            - pendingDebt
            - unPaid
    license.ActionType:
      type: string
      description: A short description of what does the Task on your license
      enum:
        - addWindowFromExistingSerial
        - changeIp
        - changeOs
        - installLicense
        - optionUpgrade
        - releaseOption
        - versionUpgrade
    license.TaskStateEnum:
      type: string
      description: All states a license Task can be in
      enum:
        - cancelled
        - doing
        - done
        - error
        - todo
    license.Task:
      type: object
      description: licenses Todos
      properties:
        action:
          description: This Task description
          readOnly: true
          type: string
          enum:
            - addWindowFromExistingSerial
            - changeIp
            - changeOs
            - installLicense
            - optionUpgrade
            - releaseOption
            - versionUpgrade
        doneDate:
          type: string
          description: When was this Task done
          nullable: true
          format: date-time
          readOnly: true
        lastUpdate:
          type: string
          description: The last time this Task was updated
          format: date-time
          readOnly: true
        name:
          type: string
          description: This Task name
          readOnly: true
        status:
          description: Current Taks status
          readOnly: true
          type: string
          enum:
            - cancelled
            - doing
            - done
            - error
            - todo
        taskId:
          type: integer
          description: This Task id
          readOnly: true
        todoDate:
          type: string
          description: When was this Task created
          format: date-time
          readOnly: true
    iam.resource.TagFilter.OperatorEnum:
      type: string
      description: Operator that can be used in order to filter resources tags
      enum:
        - EQ
        - EXISTS
        - ILIKE
        - LIKE
        - NEQ
        - NEXISTS
    iam.ResourceMetadata:
      type: object
      description: IAM resource metadata embedded in services models
      properties:
        displayName:
          type: string
          description: Resource display name
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the resource
          format: uuid
          readOnly: true
        state:
          description: Resource state
          nullable: true
          readOnly: true
          type: string
          enum:
            - EXPIRED
            - IN_CREATION
            - OK
            - SUSPENDED
        tags:
          type: object
          description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
          nullable: true
          additionalProperties:
            type: string
          readOnly: true
        urn:
          type: string
          description: Unique resource name used in policies
          readOnly: true
    ipv4:
      type: string
      description: IPv4 address (e.g., 192.0.2.0)
      format: ipv4
      example: 192.0.2.0
    license.StateEnum:
      type: string
      description: All states a license can be in
      enum:
        - ok
        - released
        - terminated
        - toDeliver
    license.RedHatVersionEnum:
      type: string
      description: All versions for RedHat products
      enum:
        - redhat-enterprise-datacenter
        - redhat-enterprise-standard
    service.RenewType:
      type: object
      description: Map a possible renew for a specific service
      properties:
        automatic:
          type: boolean
          description: The service is automatically renewed
        deleteAtExpiration:
          type: boolean
          description: The service will be deleted at expiration
        forced:
          type: boolean
          description: The service forced to be renewed
        manualPayment:
          type: boolean
          description: The service needs to be manually renewed and paid
          nullable: true
        period:
          type: integer
          description: period of renew in month
          nullable: true
    service.RenewalTypeEnum:
      type: string
      description: Detailed renewal type of a service
      enum:
        - automaticForcedProduct
        - automaticV2012
        - automaticV2014
        - automaticV2016
        - automaticV2024
        - manual
        - oneShot
        - option
    service.StateEnum:
      type: string
      enum:
        - autorenewInProgress
        - expired
        - inCreation
        - ok
        - pendingDebt
        - unPaid
    iam.ResourceMetadata.StateEnum:
      type: string
      description: Resource state
      enum:
        - EXPIRED
        - IN_CREATION
        - OK
        - SUSPENDED
    Get_v1_license_redhatResponse:
      type: object
      properties:
        v1_license_redhat:
          type: array
          items:
            $ref: '#/components/schemas/license.redhat.RedHatWithIAM'
    Get_v1_license_redhat_service_name_tasksResponse:
      type: object
      properties:
        v1_license_redhat_service_name_tasks:
          type: array
          items:
            $ref: '#/components/schemas/license.Task'
  x-stackQL-resources:
    licenses:
      id: ovh.license_redhat.licenses
      name: licenses
      title: Licenses
      methods:
        list:
          operation:
            $ref: '#/paths/~1license~1redhat/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_license_redhat
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/Get_v1_license_redhatResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_license_redhat\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1license~1redhat~1{serviceName}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1license~1redhat~1{serviceName}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        confirm_termination:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1license~1redhat~1{serviceName}~1confirmTermination/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        terminate:
          operation:
            $ref: '#/paths/~1license~1redhat~1{serviceName}~1terminate/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/licenses/methods/get'
          - $ref: '#/components/x-stackQL-resources/licenses/methods/list'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/licenses/methods/update'
        delete: []
        replace: []
    service_infos:
      id: ovh.license_redhat.service_infos
      name: service_infos
      title: Service Infos
      methods:
        get:
          operation:
            $ref: '#/paths/~1license~1redhat~1{serviceName}~1serviceInfos/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1license~1redhat~1{serviceName}~1serviceInfos/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/service_infos/methods/get'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/service_infos/methods/update'
        delete: []
        replace: []
    tasks:
      id: ovh.license_redhat.tasks
      name: tasks
      title: Tasks
      methods:
        list:
          operation:
            $ref: '#/paths/~1license~1redhat~1{serviceName}~1tasks/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_license_redhat_service_name_tasks
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/Get_v1_license_redhat_service_name_tasksResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_license_redhat_service_name_tasks\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1license~1redhat~1{serviceName}~1tasks~1{taskId}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/tasks/methods/get'
          - $ref: '#/components/x-stackQL-resources/tasks/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v1
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
