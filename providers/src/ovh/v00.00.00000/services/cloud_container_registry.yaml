components:
  schemas:
    cloud.containerRegistry.Capability:
      type: object
      description: The container registry capability for a single region
      properties:
        plans:
          type: array
          description: Available plans in the region
          items:
            $ref: '#/components/schemas/cloud.containerRegistry.Plan'
          readOnly: true
        regionName:
          type: string
          description: The region name
          readOnly: true
        regionType:
          description: The type of region ("REGION-1-AZ" or "REGION-3-AZ")
          readOnly: true
          type: string
          enum:
            - LOCAL-ZONE
            - REGION-1-AZ
            - REGION-3-AZ
    cloud.containerRegistry.Registry:
      type: object
      description: Managed docker registry
      properties:
        createdAt:
          type: string
          description: Registry creation date
          format: date-time
          readOnly: true
        iamEnabled:
          type: boolean
          description: OVHcloud IAM enabled
          readOnly: true
        id:
          type: string
          description: Registry ID
          readOnly: true
        name:
          type: string
          description: Registry name
          readOnly: true
        projectID:
          type: string
          description: Project ID of your registry
          readOnly: true
        region:
          type: string
          description: Region of the registry.
          readOnly: true
        size:
          type: integer
          description: Current size of the registry (bytes)
          readOnly: true
        status:
          description: Registry status
          readOnly: true
          type: string
          enum:
            - DELETED
            - DELETING
            - ERROR
            - INSTALLING
            - READY
            - RESTORING
            - SUSPENDED
            - SUSPENDING
            - UPDATING
        updatedAt:
          type: string
          description: Registry last update date
          format: date-time
          readOnly: true
        url:
          type: string
          description: Access url of the registry
          readOnly: true
        version:
          type: string
          description: Version of your registry
          readOnly: true
    cloud.ProjectContainerRegistryCreation:
      type: object
      description: Missing description
      properties:
        name:
          type: string
          description: Name of the new registry
        planID:
          type: string
          description: ID of the plan to use for the new registry
        region:
          type: string
          description: Region where to deploy the registry.  Get available regions with /cloud/project/{serviceName}/capabilities/containerRegistry.
      required:
        - name
        - region
    cloud.ProjectContainerRegistryUpdate:
      type: object
      description: Missing description
      properties:
        name:
          type: string
          description: New registry name
      required:
        - name
    cloud.containerRegistry.Plan:
      type: object
      description: Plan of the registry
      properties:
        code:
          type: string
          description: Plan code from catalog
          readOnly: true
        createdAt:
          type: string
          description: Plan creation date
          format: date-time
          readOnly: true
        features:
          description: Features of the plan
          readOnly: true
          type: object
          properties:
            vulnerability:
              type: boolean
              description: Vulnerability scanning
              readOnly: true
        id:
          type: string
          description: Plan ID
          readOnly: true
        name:
          type: string
          description: Plan name
          readOnly: true
        registryLimits:
          description: Container registry limits
          readOnly: true
          type: object
          properties:
            imageStorage:
              type: integer
              description: Docker image storage limits in bytes
              readOnly: true
            parallelRequest:
              type: integer
              description: Parallel requests on Docker image API (/v2 Docker registry API)
              readOnly: true
        updatedAt:
          type: string
          description: Plan last update date
          format: date-time
          readOnly: true
    cloud.containerRegistry.iamPost:
      type: object
      description: Docker registry Post IAM configuration
      properties:
        deleteUsers:
          type: boolean
          description: Delete all previously created users to allow IAM activation
          nullable: true
    cloud.containerRegistry.IPRestrictions:
      type: object
      description: Container registry Get IP Restrictions
      properties:
        createdAt:
          type: string
          description: IP Restrictions creation date
          format: date-time
          readOnly: true
        description:
          type: string
          description: The Description of Whitelisted IpBlock
        ipBlock:
          description: Whitelisted IpBlock
          type: string
          format: ip-block
          example: 192.0.2.0/24
        updatedAt:
          type: string
          description: IP Restrictions update date
          format: date-time
          readOnly: true
    cloud.containerRegistry.OIDCConfiguration:
      type: object
      description: Docker registry OIDC Configuration
      properties:
        adminGroup:
          type: string
          description: The OIDC Configuration AdminGroup
          nullable: true
        autoOnboard:
          type: boolean
          description: The OIDC Configuration AutoOnboard
          nullable: true
        clientId:
          type: string
          description: The OIDC Configuration ClientID
        clientSecret:
          type: string
          description: The OIDC Configuration Client Secret
          nullable: true
          format: password
        createdAt:
          type: string
          description: The OIDC Configuration creation date
          format: date-time
          readOnly: true
        endpoint:
          type: string
          description: The OIDC Configuration Endpoint
        groupFilter:
          type: string
          description: The OIDC Configuration GroupFilter
          nullable: true
        groupsClaim:
          type: string
          description: The OIDC Configuration GroupsClaim
          nullable: true
        id:
          type: string
          description: The OIDC Configuration ID
          readOnly: true
        name:
          type: string
          description: The OIDC Configuration Name
        scope:
          type: string
          description: The OIDC Configuration comma-separated list of Scopes
        status:
          description: The OIDC Configuration status
          readOnly: true
          type: string
          enum:
            - DELETING
            - ERROR
            - INSTALLING
            - PATCHING
            - READY
