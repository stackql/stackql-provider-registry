openapi: 3.0.0
info:
  title: OVHcloud Web Hosting (v2) API
  description: 'Web hosting resources through API v2: websites and attached domains.'
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/webhosting
paths:
  /webhosting/attachedDomain:
    get:
      operationId: getAccountWebHostingAttachedDomains
      summary: List attached domains
      description: Returns the domains attached to all the web hostings of the account. Filter them by name with the domain parameter. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: domain
          description: Optional query param to only filter domain name
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountWebHostingAttachedDomainsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@180
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:webHosting/attachedDomain/get
          required: true
      x-response-identifier: id
  /webhosting/customerApproval:
    get:
      operationId: getAllWebHostingCustomerApprovals
      summary: List customer approvals, optionally filtered by approval code, resource type and resource id
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: approvalCode
          description: Code identifying the operation the customer approves
          schema:
            $ref: '#/components/schemas/webhosting.CustomerApprovalCodeEnum'
        - in: query
          name: resourceId
          description: Identifier of the resource the approval targets
          schema:
            type: string
        - in: query
          name: resourceType
          description: Type of the resource the approval targets
          schema:
            $ref: '#/components/schemas/webhosting.CustomerApprovalResourceTypeEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllWebHostingCustomerApprovalsResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:webHosting/customerApproval/get
          required: true
      x-response-identifier: id
      x-expanded-response: WebhostingCustomerApproval
      description: List customer approvals, optionally filtered by approval code, resource type and resource id
    post:
      operationId: createWebHostingCustomerApproval
      summary: Register a customer approval
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webhosting.CustomerApprovalPostPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhosting.CustomerApproval'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:webHosting/customerApproval/create
          required: true
      description: Register a customer approval
  /webhosting/customerApproval/{customerApprovalId}:
    get:
      operationId: getWebHostingCustomerApproval
      summary: Get a customer approval
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: customerApprovalId
          description: Customer approval ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhosting.CustomerApproval'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:webHosting/customerApproval/get
          required: true
      x-response-identifier: id
      description: Get a customer approval
  /webhosting/resource:
    get:
      operationId: getAllWebHostings
      summary: List web hostings
      description: Returns the web hostings of the account. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllWebHostingsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:get
          required: true
      x-expanded-response: WebhostingWebWithIAM
  /webhosting/resource/{name}:
    get:
      operationId: getWebHosting
      summary: Get a web hosting
      description: Returns the web hosting, identified by its service name, with its current state and running tasks. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhosting.WebWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting@@@240
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:get
          required: true
  /webhosting/resource/{name}/attachedDomain:
    get:
      operationId: getWebHostingAttachedDomains
      summary: List attached domains
      description: Returns the domains attached to the hosting, with their path and their SSL, CDN, firewall and Git settings. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebHostingAttachedDomainsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@190
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:attachedDomain/get
          required: true
      x-response-identifier: id
  /webhosting/resource/{name}/certificate:
    get:
      operationId: getWebHostingCertificates
      summary: List SSL certificates
      description: Returns the SSL certificates of the hosting, with their type, domains and expiration date. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebHostingCertificatesResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - SSL@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:ssl/get
          required: true
      x-response-identifier: id
  /webhosting/resource/{name}/spoofing:
    get:
      operationId: getWebHostingSpoofingAllowedDomains
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebHostingSpoofingAllowedDomainsResponse'
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:spoofing/get
          required: true
      description: (Beta version)
  /webhosting/resource/{name}/spoofing/{senderDomain}:
    delete:
      operationId: deleteWebHostingSpoofingAllowedDomain
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
        - in: path
          name: senderDomain
          description: Sender domain
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:spoofing/delete
          required: true
      description: (Beta version)
  /webhosting/resource/{name}/website:
    get:
      operationId: getAllWebHostingWebsites
      summary: List websites
      description: Returns the websites of the hosting. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllWebHostingWebsitesResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:website/get
          required: true
      x-response-identifier: id
      x-expanded-response: WebhostingWebsite
    post:
      operationId: createWebHostingWebsite
      summary: Create a website
      description: 'Creates a website on a domain, with its root folder, and can install a WordPress, Joomla, Drupal or PrestaShop module. Creation is asynchronous: follow resourceStatus until READY. Set bypassDNSConfiguration to true to leave the DNS zone unchanged. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webhosting.WebsitePostPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhosting.Website'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@290
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:website/create
          required: true
  /webhosting/resource/{name}/website/{websiteId}:
    get:
      operationId: getWebHostingWebsite
      summary: Get a website
      description: Returns the website name, root folder, number of linked domains and its Git and module status. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
        - in: path
          name: websiteId
          description: Website ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhosting.Website'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@200
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:website/get
          required: true
      x-response-identifier: id
    put:
      operationId: editWebHostingWebsite
      summary: Update a website
      description: Updates the name and root folder of the website. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
        - in: path
          name: websiteId
          description: Website ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webhosting.WebsitePutPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhosting.Website'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@360
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:website/edit
          required: true
  /webhosting/resource/{name}/website/{websiteId}/domain:
    get:
      operationId: getWebHostingWebsiteDomains
      summary: List website domains
      description: Returns the domains linked to the website, with their path, CDN and firewall status. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
        - in: path
          name: websiteId
          description: Website ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebHostingWebsiteDomainsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@210
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: webHosting:apiovh:website/domain/get
          required: true
      x-response-identifier: id
components:
  schemas:
    webhosting.AttachedDomain:
      type: object
      description: Webhosting attached domain
      properties:
        checksum:
          type: string
          description: Computed hash used to control concurrent modification requests. Here, it represents the current target specification value.
          readOnly: true
        currentState:
          description: Current state of the attached domain
          readOnly: true
          type: object
          properties:
            cdn:
              description: CDN related to the attached domain
              readOnly: true
              type: object
              properties:
                status:
                  description: CDN status
                  type: string
                  enum:
                    - ACTIVE
                    - NONE
              required:
                - status
            firewall:
              description: Firewall of the attached domain
              readOnly: true
              type: object
              properties:
                status:
                  description: Firewall status
                  type: string
                  enum:
                    - ACTIVE
                    - NONE
              required:
                - status
            fqdn:
              type: string
              description: FQDN of the attached domain
              readOnly: true
            git:
              description: Git details of the attached domain
              readOnly: true
              type: object
              properties:
                status:
                  description: Git status
                  readOnly: true
                  type: string
                  enum:
                    - CREATED
                    - CREATING
                    - DELETING
                    - DEPLOYING
                    - DISABLED
                    - ERROR
                    - INITIAL_ERROR
                vcsBranch:
                  type: string
                  description: Branch of the repository containing the website source code to deploy
                  nullable: true
                  readOnly: true
                vcsUrl:
                  type: string
                  description: URL of the repository containing the website source code to deploy
                  nullable: true
                  readOnly: true
            hosting:
              description: Hosting details of the attached domain
              readOnly: true
              type: object
              properties:
                boostOffer:
                  type: string
                  description: Boost offer of the hosting related to the attached domain
                  nullable: true
                  readOnly: true
                displayName:
                  type: string
                  description: Display name of the hosting related to the attached domain
                  readOnly: true
                offer:
                  type: string
                  description: Offer of the hosting related to the attached domain
                  readOnly: true
                serviceName:
                  type: string
                  description: Service name of the hosting related to the attached domain
                  readOnly: true
            isDefault:
              type: boolean
              description: Default attached domain can't be updated and can't support SSL
              nullable: true
              readOnly: true
            ownLog:
              type: string
              description: Domain to separate the logs from the others attached domains
              nullable: true
              readOnly: true
            path:
              type: string
              description: Path of the attached domain
              readOnly: true
            ssl:
              description: SSL details
              readOnly: true
              type: object
              properties:
                status:
                  description: SSL status
                  readOnly: true
                  type: string
                  enum:
                    - ACTIVE
                    - NONE
        currentTasks:
          type: array
          description: Ongoing asynchronous tasks related to the attached domain
          nullable: true
          items:
            $ref: '#/components/schemas/common.CurrentTask'
          readOnly: true
        id:
          type: string
          description: Unique identifier of the attached domain
          format: uuid
          readOnly: true
        ipLocation:
          description: IP Location for the attached domain
          nullable: true
          readOnly: true
          type: string
          enum:
            - BE
            - CA
            - CZ
            - DE
            - ES
            - FI
            - FR
            - IE
            - IT
            - LT
            - NL
            - PL
            - PT
            - UK
        resourceStatus:
          description: Webhosting attached domain readiness in the system
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
    webhosting.CustomerApprovalCodeEnum:
      type: string
      description: Customer approval code enum
      enum:
        - CLOUDWEB_MIGRATION
    webhosting.CustomerApprovalResourceTypeEnum:
      type: string
      description: Customer approval resource type enum
      enum:
        - WEB
    webhosting.CustomerApproval:
      type: object
      description: Customer approval given for an operation on a target resource
      properties:
        approvalCode:
          description: Code identifying the operation the customer approves
          readOnly: true
          type: string
          enum:
            - CLOUDWEB_MIGRATION
        approved:
          type: boolean
          description: Whether the customer approved the operation
          readOnly: true
        createdAt:
          type: string
          description: Date when the customer approval was registered
          format: date-time
          readOnly: true
        id:
          type: integer
          description: Unique identifier of the customer approval
          readOnly: true
        resourceId:
          type: string
          description: Identifier of the resource the approval targets
          readOnly: true
        resourceType:
          description: Type of the resource the approval targets
          readOnly: true
          type: string
          enum:
            - WEB
    webhosting.CustomerApprovalPostPayload:
      type: object
      description: Customer approval post payload
      properties:
        approvalCode:
          description: Code identifying the operation the customer approves
          type: string
          enum:
            - CLOUDWEB_MIGRATION
        approved:
          type: boolean
          description: Whether the customer approved the operation
        resourceId:
          type: string
          description: Identifier of the resource the approval targets
        resourceType:
          description: Type of the resource the approval targets
          type: string
          enum:
            - WEB
      required:
        - approvalCode
        - approved
        - resourceId
        - resourceType
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value. Defaults to `EQ`.
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    webhosting.WebWithIAM:
      type: object
      description: Webhosting Web
      properties:
        checksum:
          type: string
          description: Computed hash used to control concurrent modification requests. Here, it represents the current target specification value.
          readOnly: true
        currentState:
          description: Current state of the hosting plan
          readOnly: true
          type: object
          properties:
            name:
              type: string
              description: Name of the hosting
              readOnly: true
        currentTasks:
          type: array
          description: Ongoing asynchronous tasks related to the hosting plan
          nullable: true
          items:
            $ref: '#/components/schemas/common.CurrentTask'
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        id:
          type: string
          description: Unique identifier of the resource. Here, the service name is used as an identifier.
          readOnly: true
        resourceStatus:
          description: Webhosting resource readiness in the system
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
    webhosting.SSL:
      type: object
      description: Webhosting SSL
      properties:
        checksum:
          type: string
          description: Computed hash used to control concurrent modification requests. Here, it represents the current target specification value.
          readOnly: true
        currentState:
          description: Current state of the SSL
          readOnly: true
          type: object
          properties:
            additionalDomains:
              type: array
              description: Additional domains of the SSL
              items:
                type: string
              readOnly: true
            certificateType:
              description: Certificate type of the SSL
              readOnly: true
              type: string
              enum:
                - COMODO
                - CUSTOM
                - LETSENCRYPT
                - SECTIGO
            createdAt:
              type: string
              description: Date of creation of the SSL
              format: date-time
              readOnly: true
            expiredAt:
              type: string
              description: Date of expiration of the SSL
              nullable: true
              format: date-time
              readOnly: true
            mainDomain:
              type: string
              description: Main domain of the SSL
              readOnly: true
            state:
              description: State of the SSL
              readOnly: true
              type: string
              enum:
                - ACTIVE
                - CREATING
                - DELETING
                - EXPIRED
                - IMPORTING
                - REGENERATING
        currentTasks:
          type: array
          description: Ongoing asynchronous tasks related to the SSL
          nullable: true
          items:
            $ref: '#/components/schemas/common.CurrentTask'
          readOnly: true
        id:
          type: string
          description: Unique identifier of the SSL
          format: uuid
          readOnly: true
        resourceStatus:
          description: Webhosting SSL readiness in the system
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
    webhosting.SpoofingAllowedDomain:
      type: object
      description: Allowed sender domain for email spoofing
      properties:
        lastAccessAt:
          type: string
          description: Last time this sender domain was used
          nullable: true
          format: date-time
          readOnly: true
