openapi: 3.0.0
info:
  title: OVHcloud Support API
  description: Support tickets and their messages.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/support
paths:
  /support/tickets:
    get:
      summary: List support tickets identifiers for this service
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: archived
          description: Search archived tickets
          schema:
            type: boolean
        - in: query
          name: category
          description: Search by ticket category
          schema:
            $ref: '#/components/schemas/support.TicketCategoryEnum'
        - in: query
          name: customerReplyNeeded
          description: Tickets pending a customer reply
          schema:
            type: boolean
        - in: query
          name: excludeAutogenerated
          description: Exclude auto-generated tickets
          schema:
            type: boolean
        - in: query
          name: maxCreationDate
          description: Maximum creation date
          schema:
            type: string
            format: date-time
        - in: query
          name: minCreationDate
          description: Minimum creation date
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          description: Page of tickets to fetch (only if pageSize is defined)
          schema:
            type: integer
        - in: query
          name: pageSize
          description: Number of ticket to fetch
          schema:
            type: integer
        - in: query
          name: product
          description: Search by ticket product
          schema:
            $ref: '#/components/schemas/support.TicketProductEnum'
        - in: query
          name: serviceName
          description: Ticket message service name
          schema:
            type: string
        - in: query
          name: status
          description: Status of ticket
          schema:
            $ref: '#/components/schemas/support.TicketStatusEnum'
        - in: query
          name: subject
          description: Search by ticket subject
          schema:
            type: string
        - in: query
          name: ticketNumber
          description: Search by ticket number
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_support_ticketsResponse'
      x-developer-hub-navigation:
        - - Misc
          - Support
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:support/tickets/get
          required: true
      x-expanded-response: SupportTicket
      operationId: get_v1_support_tickets
      description: List support tickets identifiers for this service
  /support/tickets/create:
    post:
      summary: Create a new ticket
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: Ticket message body
                category:
                  description: Ticket message category
                  $ref: '#/components/schemas/support.TicketCategoryEnum'
                impact:
                  description: Ticket impact (reserved for Business or Enterprise support level accounts)
                  $ref: '#/components/schemas/support.TicketImpactUrgencyEnum'
                product:
                  description: Ticket message product
                  $ref: '#/components/schemas/support.TicketProductEnum'
                serviceName:
                  type: string
                  description: Ticket message service name
                subcategory:
                  description: Ticket message subcategory
                  $ref: '#/components/schemas/support.TicketSubCategoryEnum'
                subject:
                  type: string
                  description: Ticket message subject
                type:
                  description: DEPRECATED - Ticket type (criticalIntervention requires VIP support level)
                  $ref: '#/components/schemas/support.TicketTypeEnum'
                urgency:
                  description: Ticket urgency (reserved for Business or Enterprise support level accounts)
                  $ref: '#/components/schemas/support.TicketImpactUrgencyEnum'
                watchers:
                  type: array
                  description: List of e-mail addresses to notify on ticket updates (max. 10)
                  items:
                    type: string
              required:
                - body
                - subject
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/support.NewMessageInfo'
      x-developer-hub-navigation:
        - - Misc
          - Support
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:support/tickets/create
          required: true
      operationId: post_v1_support_tickets_create
      description: Create a new ticket
  /support/tickets/{ticketId}:
    get:
      summary: Get ticket
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ticketId
          description: internal identifier ticket
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/support.Ticket'
      x-developer-hub-navigation:
        - - Misc
          - Support
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:support/tickets/get
          required: true
      operationId: get_v1_support_tickets_ticket_id
      description: Get ticket
  /support/tickets/{ticketId}/canBeScored:
    get:
      summary: Checks whether ticket can be scored
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ticketId
          description: internal ticket identifier
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: boolean
      x-developer-hub-navigation:
        - - Misc
          - Support
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:support/tickets/canBeScored/get
          required: true
      operationId: get_v1_support_tickets_ticket_id_can_be_scored
      x-stackQL-scalarWrap:
        column: value
        type: boolean
      description: Checks whether ticket can be scored
  /support/tickets/{ticketId}/close:
    post:
      summary: Close ticket
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ticketId
          description: internal ticket identifier
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Misc
          - Support
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:support/tickets/close
          required: true
      operationId: post_v1_support_tickets_ticket_id_close
      description: Close ticket
  /support/tickets/{ticketId}/messages:
    get:
      summary: Get ticket messages
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ticketId
          description: internal ticket identifier
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_support_tickets_ticket_id_messagesResponse'
      x-developer-hub-navigation:
        - - Misc
          - Support
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:support/tickets/messages/get
          required: true
      operationId: get_v1_support_tickets_ticket_id_messages
      description: Get ticket messages
  /support/tickets/{ticketId}/reopen:
    post:
      summary: Reopen a ticket
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ticketId
          description: internal ticket identifier
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: ticket reopen reason
              required:
                - body
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Misc
          - Support
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:support/tickets/reopen
          required: true
      operationId: post_v1_support_tickets_ticket_id_reopen
      description: Reopen a ticket
  /support/tickets/{ticketId}/reply:
    post:
      summary: Reply to ticket
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ticketId
          description: internal ticket identifier
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: text body of ticket response
              required:
                - body
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Misc
          - Support
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:support/tickets/reply
          required: true
      operationId: post_v1_support_tickets_ticket_id_reply
      description: Reply to ticket
  /support/tickets/{ticketId}/score:
    post:
      summary: Set ticket score
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ticketId
          description: internal ticket identifier
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: string
                  description: ticket score
                scoreComment:
                  type: string
                  description: ticket comment about the score
              required:
                - score
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Misc
          - Support
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:support/tickets/score
          required: true
      operationId: post_v1_support_tickets_ticket_id_score
      description: Set ticket score
components:
  schemas:
    support.TicketCategoryEnum:
      type: string
      description: Ticket request category
      enum:
        - assistance
        - billing
        - incident
    support.TicketProductEnum:
      type: string
      description: Ticket product
      enum:
        - adsl
        - cdn
        - dedicated
        - dedicated-billing
        - dedicated-other
        - dedicatedcloud
        - domain
        - exchange
        - fax
        - hosting
        - housing
        - iaas
        - mail
        - network
        - publiccloud
        - sms
        - ssl
        - storage
        - telecom-billing
        - telecom-other
        - vac
        - voip
        - vps
        - web-billing
        - web-other
    support.TicketStatusEnum:
      type: string
      description: Support ticket statuses
      enum:
        - closed
        - open
        - unknown
    support.TicketImpactUrgencyEnum:
      type: string
      description: Ticket level of impact or urgency (reserved for Business or Enterprise support level accounts)
      enum:
        - high
        - low
        - medium
    support.TicketSubCategoryEnum:
      type: string
      description: Ticket request subcategory
      enum:
        - alerts
        - autorenew
        - bill
        - down
        - inProgress
        - new
        - other
        - perfs
        - start
        - usage
    support.TicketTypeEnum:
      type: string
      description: DEPRECATED - Ticket type (criticalIntervention requires VIP support level)
      enum:
        - criticalIntervention
        - genericRequest
    support.NewMessageInfo:
      type: object
      description: Newly created support identifiers
      properties:
        additionalNotice:
          type: string
          description: Notice or warning
          nullable: true
        messageId:
          type: integer
          description: Message identifier
        ticketId:
          type: integer
          description: Ticket identifier
        ticketNumber:
          type: integer
          description: Ticket external number
    support.Ticket:
      type: object
      description: Support Ticket
      properties:
        accountId:
          type: string
          description: Customer account identifier
        canBeClosed:
          type: boolean
          description: Can this ticket be closed or not
        category:
          description: Ticket request category
          nullable: true
          type: string
          enum:
            - assistance
            - billing
            - incident
        creationDate:
          type: string
          description: Ticket creation date
          format: date-time
        lastMessageFrom:
          description: Sender type of last message
          type: string
          enum:
            - customer
            - support
        product:
          description: Product service concerned by ticket
          nullable: true
          type: string
          enum:
            - adsl
            - cdn
            - dedicated
            - dedicated-billing
            - dedicated-other
            - dedicatedcloud
            - domain
            - exchange
            - fax
            - hosting
            - housing
            - iaas
            - mail
            - network
            - publiccloud
            - sms
            - ssl
            - storage
            - telecom-billing
            - telecom-other
            - vac
            - voip
            - vps
            - web-billing
            - web-other
        score:
          type: string
          description: Ticket score
        serviceName:
          type: string
          description: Name of service concerned by ticket
          nullable: true
        state:
          description: State of ticket
          type: string
          enum:
            - closed
            - open
            - unknown
        subject:
          type: string
          description: Ticket subject
        ticketId:
          type: integer
          description: Ticket identifier
        ticketNumber:
          type: integer
          description: Ticket external number
        type:
          description: Ticket type
          type: string
          enum:
            - criticalIntervention
            - genericRequest
        updateDate:
          type: string
          description: Ticket last update date
          format: date-time
    support.Message:
      type: object
      description: Support ticket message
      properties:
        body:
          type: string
          description: Message body
        creationDate:
          type: string
          description: Message creation date
          format: date-time
        from:
          description: Message sender type
          type: string
          enum:
            - customer
            - support
        messageId:
          type: integer
          description: Message identifier
        ticketId:
          type: integer
          description: Ticket identifier
        updateDate:
          type: string
          description: Message last update date
          format: date-time
    support.MessageSenderEnum:
      type: string
      description: Message sender type
      enum:
        - customer
        - support
    Get_v1_support_ticketsResponse:
      type: object
      properties:
        v1_support_tickets:
          type: array
          items:
            $ref: '#/components/schemas/support.Ticket'
    Get_v1_support_tickets_ticket_id_messagesResponse:
      type: object
      properties:
        v1_support_tickets_ticket_id_messages:
          type: array
          items:
            $ref: '#/components/schemas/support.Message'
  x-stackQL-resources:
    tickets:
      id: ovh.support.tickets
      name: tickets
      title: Tickets
      methods:
        list:
          operation:
            $ref: '#/paths/~1support~1tickets/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_support_tickets
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/Get_v1_support_ticketsResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_support_tickets\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1support~1tickets~1create/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1support~1tickets~1{ticketId}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        close:
          operation:
            $ref: '#/paths/~1support~1tickets~1{ticketId}~1close/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        reopen:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1support~1tickets~1{ticketId}~1reopen/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        reply:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1support~1tickets~1{ticketId}~1reply/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        score:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1support~1tickets~1{ticketId}~1score/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/tickets/methods/get'
          - $ref: '#/components/x-stackQL-resources/tickets/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    tickets_can_be_scoreds:
      id: ovh.support.tickets_can_be_scoreds
      name: tickets_can_be_scoreds
      title: Tickets Can Be Scoreds
      methods:
        get:
          operation:
            $ref: '#/paths/~1support~1tickets~1{ticketId}~1canBeScored/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            overrideMediaType: application/json
            schema_override:
              type: object
              properties:
                value:
                  type: boolean
            transform:
              type: golang_template_text_v0.3.0
              body: '{"value": {{ . }}}'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/tickets_can_be_scoreds/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
    tickets_messages:
      id: ovh.support.tickets_messages
      name: tickets_messages
      title: Tickets Messages
      methods:
        list:
          operation:
            $ref: '#/paths/~1support~1tickets~1{ticketId}~1messages/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_support_tickets_ticket_id_messages
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/Get_v1_support_tickets_ticket_id_messagesResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_support_tickets_ticket_id_messages\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/tickets_messages/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v1
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
