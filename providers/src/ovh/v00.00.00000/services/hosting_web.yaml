openapi: 3.0.0
info:
  title: OVHcloud Web Hosting API
  description: 'Web hosting plans: attached domains, databases, FTP users, crons, modules, SSL, CDN, runtimes, environment variables and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/hosting/web
paths:
  /hosting/web:
    get:
      summary: List web hostings
      description: Returns the service names of the web hostings of the account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_webResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:get
          required: true
      x-expanded-response: HostingWebServiceWithIAM
      operationId: get_v1_hosting_web
  /hosting/web/attachedDomain:
    get:
      summary: Find hostings by attached domain
      description: Returns the service names of the hostings that have the given domain attached.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: domain
          description: Domain used into web hosting attached domains
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_web_attached_domainResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:webHosting/attachedDomain/get
          required: true
      operationId: get_v1_hosting_web_attached_domain
  /hosting/web/availableOffer:
    get:
      summary: List available offers
      description: List available offers. Returns the offers that can be ordered for the given domain, to create a new hosting or upgrade an existing one.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: domain
          description: Domain you want to add or upgrade a hosting
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_web_available_offerResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:webHosting/availableOffer/get
          required: true
      operationId: get_v1_hosting_web_available_offer
  /hosting/web/cdn/log/kind:
    get:
      summary: List available log kinds
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_web_cdn_log_kindResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - CDN
      x-badges:
        - color: green
          label: Stable production version
      x-expanded-response: DbaasLogsLogKind
      operationId: get_v1_hosting_web_cdn_log_kind
      parameters:
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      description: List available log kinds
  /hosting/web/cdn/log/kind/{name}:
    get:
      summary: Get a log kind
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogKind'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - CDN
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: name
      operationId: get_v1_hosting_web_cdn_log_kind_name
      description: Get a log kind
  /hosting/web/incident:
    get:
      summary: List current incidents
      description: List current incidents. Returns the incidents in progress on the web hosting platform that can affect the hosting services.
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_web_incidentResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:webHosting/incident/get
          required: true
      operationId: get_v1_hosting_web_incident
  /hosting/web/localSeo/directoriesList:
    get:
      summary: List local SEO directories
      description: List local SEO directories. Returns the search engines, navigation systems and social networks covered by a local SEO offer in a country.
      parameters:
        - in: query
          name: country
          description: Country of the location
          required: true
          schema:
            $ref: '#/components/schemas/hosting.web.localSeo.location.CountryEnum'
        - in: query
          name: offer
          description: Local SEO offer
          required: true
          schema:
            $ref: '#/components/schemas/hosting.web.localSeo.location.OfferEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.localSeo.DirectoriesList'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - Visibility Pro@@@10
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_hosting_web_local_seo_directories_list
  /hosting/web/localSeo/emailAvailability:
    get:
      summary: Check local SEO email availability
      description: Check local SEO email availability. Returns whether an email address can be used for a local SEO order, and the hosting already using it.
      parameters:
        - in: query
          name: email
          description: The email address to check
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.localSeo.EmailAvailability'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - Visibility Pro@@@10
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_hosting_web_local_seo_email_availability
  /hosting/web/localSeo/visibilityCheck:
    post:
      summary: Check location visibility
      description: Check location visibility. Starts a visibility check for a location from its name, street, zip code and country. Returns whether the location is already managed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country:
                  description: Country of the location
                  $ref: '#/components/schemas/hosting.web.localSeo.location.CountryEnum'
                name:
                  type: string
                  description: Name of the location
                street:
                  type: string
                  description: Address line 1 of the location
                zip:
                  type: string
                  description: Zipcode of the location
              required:
                - country
                - name
                - street
                - zip
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.localSeo.VisibilityCheckResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - Visibility Pro@@@30
      x-badges:
        - color: green
          label: Stable production version
      operationId: post_v1_hosting_web_local_seo_visibility_check
  /hosting/web/localSeo/visibilityCheckResult:
    get:
      summary: Get visibility check results
      description: Get visibility check results. Returns the listings found for the location in each directory, with the sync status of each field.
      parameters:
        - in: query
          name: directory
          description: Get the result only for one directory
          required: true
          schema:
            type: string
        - in: query
          name: id
          description: Id of the check
          required: true
          schema:
            type: integer
        - in: query
          name: token
          description: Token received when requesting the check
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_web_local_seo_visibility_check_resultResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - Visibility Pro@@@10
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_hosting_web_local_seo_visibility_check_result
  /hosting/web/moduleList:
    get:
      summary: List available modules
      description: List available modules. Returns the IDs of the modules that can be installed. Filter them by active, branch or latest.
      parameters:
        - in: query
          name: active
          description: Filter the value of active property (=)
          schema:
            type: boolean
        - in: query
          name: branch
          description: Filter the value of branch property (=)
          schema:
            $ref: '#/components/schemas/hosting.web.module.BranchEnum'
        - in: query
          name: latest
          description: Filter the value of latest property (=)
          schema:
            type: boolean
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_web_module_listResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - Modules@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-expanded-response: HostingWebModuleList
      operationId: get_v1_hosting_web_module_list
  /hosting/web/moduleList/{id}:
    get:
      summary: Get an available module
      description: Get an available module. Returns the name, version, branch, languages and requirements of the module, and the modules it can be upgraded to.
      parameters:
        - in: path
          name: id
          description: The ID of the module
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.ModuleList'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - Modules@@@10
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_hosting_web_module_list_id
  /hosting/web/offerCapabilities:
    get:
      summary: Get offer capabilities
      description: 'Get offer capabilities. Returns what an offer includes: attached domains, databases, disk, traffic, SSH, cron, modules and runtimes.'
      parameters:
        - in: query
          name: offer
          description: Describe offer capabilities
          required: true
          schema:
            $ref: '#/components/schemas/hosting.web.OfferCapabilitiesEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.Capabilities'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting@@@70
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_hosting_web_offer_capabilities
  /hosting/web/vcs/supported:
    get:
      summary: List supported VCS platforms
      description: Returns the VCS platforms a website can be deployed from.
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_web_vcs_supportedResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@130
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_hosting_web_vcs_supported
  /hosting/web/{serviceName}:
    get:
      summary: Get a web hosting
      description: Returns the offer, state, cluster, recommended IPs, disk and traffic quotas, and PHP versions of the web hosting.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.ServiceWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:get
          required: true
      operationId: get_v1_hosting_web_service_name
    put:
      summary: Update a web hosting
      description: Updates the display name of the web hosting.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hosting.web.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting@@@400
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:edit
          required: true
      operationId: put_v1_hosting_web_service_name
  /hosting/web/{serviceName}/abuseState:
    get:
      summary: Get the abuse state
      description: Returns the access, web, outgoing email and outgoing TCP states of the hosting.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.AbuseState'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting@@@80
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:abuseState/get
          required: true
      operationId: get_v1_hosting_web_service_name_abuse_state
  /hosting/web/{serviceName}/attachedDomain:
    get:
      summary: List attached domains
      description: Returns the domains and subdomains attached to the hosting. Filter them by domain or path.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: domain
          description: Filter the value of domain property (like)
          schema:
            type: string
        - in: query
          name: path
          description: Filter the value of path property (like)
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_hosting_web_service_name_attached_domainResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:attachedDomain/get
          required: true
      x-expanded-response: HostingWebAttachedDomainPublicAttachedDomain
      operationId: get_v1_hosting_web_service_name_attached_domain
    post:
      summary: Attach a domain
      description: Attaches a domain to a folder of the hosting, with its CDN, firewall, SSL and IP location settings, and returns the task. Set bypassDNSConfiguration to true to leave the DNS zone unchanged.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hosting.web.AttachedDomain'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.PublicTask'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@220
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:attachedDomain/create
          required: true
      operationId: post_v1_hosting_web_service_name_attached_domain
  /hosting/web/{serviceName}/attachedDomain/{domain}:
    delete:
      summary: Detach a domain
      description: Detaches the domain from the hosting and returns the task. Set bypassDNSConfiguration to true to leave the DNS zone unchanged.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: bypassDNSConfiguration
          description: If set to true, DNS zone will not be updated by the operation
          schema:
            type: boolean
        - in: path
          name: domain
          description: Domain
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.PublicTask'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@300
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:attachedDomain/delete
          required: true
      operationId: delete_v1_hosting_web_service_name_attached_domain_domain
    get:
      summary: Get an attached domain
      description: Returns the path, CDN, firewall, SSL, IP location and status of the attached domain.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: domain
          description: Domain
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.attachedDomain.PublicAttachedDomain'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:attachedDomain/get
          required: true
      x-response-identifier: domain
      operationId: get_v1_hosting_web_service_name_attached_domain_domain
    put:
      summary: Update an attached domain
      description: Updates the path, CDN, firewall, SSL, IP location or log domain of the attached domain.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: domain
          description: Domain
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hosting.web.AttachedDomain'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@330
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:attachedDomain/edit
          required: true
      operationId: put_v1_hosting_web_service_name_attached_domain_domain
  /hosting/web/{serviceName}/attachedDomain/{domain}/digStatus:
    get:
      summary: Get attached domain DNS status
      description: Returns the DNS records of the attached domain, their status and the recommended IPs to point them to.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: domain
          description: Domain
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.attachedDomain.DigStatus'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@80
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:attachedDomain/digStatus/get
          required: true
      x-response-identifier: domain
      operationId: get_v1_hosting_web_service_name_attached_domain_domain_dig_status
  /hosting/web/{serviceName}/attachedDomain/{domain}/purgeCache:
    post:
      summary: Purge the attached domain cache
      description: Purge the attached domain cache. Purges the CDN cache of the attached domain and returns the task. Available when isFlushable is true on the attached domain.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: domain
          description: Domain linked (fqdn)
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: The internal name of your hosting
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@250
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:attachedDomain/purgeCache
          required: true
      operationId: post_v1_hosting_web_service_name_attached_domain_domain_purge_cache
  /hosting/web/{serviceName}/attachedDomain/{domain}/restart:
    post:
      summary: Restart the attached domain virtual host
      description: Restart the attached domain virtual host. Restarts the virtual host serving the attached domain and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: domain
          description: Domain linked (fqdn)
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: The internal name of your hosting
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Web Hosting
          - My sites@@@260
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: webHosting:apiovh:attachedDomain/restart
          required: true
      operationId: post_v1_hosting_web_service_name_attached_domain_domain_restart
  /hosting/web/{serviceName}/attachedDomain/{domain}/ssl:
    delete:
      summary: Delete the SSL certificate
      description: Deletes the SSL certificate of the attached domain.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: domain
          description: Domain
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hosting.web.SSL'
      x-developer-hub-navigation:
        - - Web Cloud
