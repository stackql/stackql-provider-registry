openapi: 3.0.0
info:
  title: OVHcloud Startup Program API
  description: Startup program registration.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/startup
paths:
  /startup:
    get:
      summary: Get startup status
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/startup.startup'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::StartupNotFound:
                  value:
                    class: Client::NotFound::StartupNotFound
                    message: Startup not found
      x-developer-hub-navigation:
        - - Misc
          - Startup Program
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:startup/get
          required: true
      operationId: get_v1_startup
      description: Get startup status
    post:
      summary: Register a startup
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/startup.startup'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Misc
          - Startup Program
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:startup/create
          required: true
      operationId: post_v1_startup
      description: Register a startup
