components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    ipBlock:
      type: string
      description: IP (v4 or v6) CIDR notation (e.g., 192.0.2.0/24)
      format: ip-block
      example: 192.0.2.0/24
    ip.IpTypeEnum:
      type: string
      description: Possible values for ip type
      enum:
        - cdn
        - cloud
        - dedicated
        - failover
        - hosted_ssl
        - housing
        - loadBalancing
        - mail
        - overthebox
        - pcc
        - pci
        - private
        - vpn
        - vps
        - vrack
        - xdsl
    ip.IpVersionEnum:
      type: integer
      description: Possible values for IP version
      enum:
        - 4
        - 6
    ip.Campus:
      type: object
      description: Campus of an IP address
      properties:
        bringYourOwnIpSupportedRirForIp:
          type: array
          description: List of RIRs whose IPs can be imported in the campus
