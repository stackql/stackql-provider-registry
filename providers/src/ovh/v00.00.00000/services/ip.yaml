openapi: 3.0.0
info:
  title: OVHcloud IP Addresses API
  description: 'IP addresses and blocks: reverse DNS, firewall, mitigation, game firewall, moves, licenses and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/ip
paths:
  /ip:
    get:
      summary: List IPs
      description: List IPs. Returns your IP blocks, filterable by routed service, type, version, campus, Additional IP or IAM tags.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: campus
          description: Filter the value of campus property (ilike) (alpha)
          schema:
            type: string
        - in: query
          name: description
          description: Filter the value of description property (like)
          schema:
            type: string
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: query
          name: ip
          description: Filter the value of ip property (contains or equals)
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: query
          name: isAdditionalIp
          description: Filter the value of isAdditionalIp property (=) (alpha)
          schema:
            type: boolean
        - in: query
          name: routedTo.serviceName
          description: Filter the value of routedTo.serviceName property (like)
          schema:
            type: string
        - in: query
          name: type
          description: Filter the value of type property (=)
          schema:
            $ref: '#/components/schemas/ip.IpTypeEnum'
        - in: query
          name: version
          description: Filter the value of version property (=) (alpha)
          schema:
            $ref: '#/components/schemas/ip.IpVersionEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_ipResponse'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Configuration@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ip:apiovh:get
          required: true
      x-expanded-response: IpIp
      operationId: get_v1_ip
  /ip/campus:
    get:
      summary: List campuses
      description: List campuses. Returns each campus with its name, description, datacenters and the RIRs whose IP ranges it can import. (Beta version)
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_ip_campusResponse'
      x-badges:
        - color: blue
          label: Beta version
      operationId: get_v1_ip_campus
  /ip/service:
    get:
      summary: List IP services
      description: List IP services. Returns the service names of your IP subscriptions, filterable by IAM tags. Each name is the serviceName of the other service calls. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_ip_serviceResponse'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Services@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/get
          required: true
      x-expanded-response: IpServiceIpWithIAM
      operationId: get_v1_ip_service
  /ip/service/{serviceName}:
    get:
      summary: Get an IP service
      description: Get an IP service. Returns the service's IP block, type, routed service, organization, country, IAM metadata and whether it can be terminated. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ip.ServiceIpWithIAM'
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/get
          required: true
      operationId: get_v1_ip_service_service_name
    put:
      summary: Update the service description
      description: Update the service description. Changes the free-text description of the service's IP block, its only editable field. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ip.ServiceIp'
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/edit
          required: true
      operationId: put_v1_ip_service_service_name
  /ip/service/{serviceName}/bringYourOwnIp/importedRange:
    get:
      summary: Get the imported range
      description: Get the imported range. Returns the imported range, its RIR and region, and the AS number that announces it. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ip.BringYourOwnIpImportedRange'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Bring Your Own IP@@@63
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/bringYourOwnIp/importedRange/get
          required: true
      operationId: get_v1_ip_service_service_name_bring_your_own_ip_imported_range
  /ip/service/{serviceName}/bringYourOwnIp/subRange:
    get:
      summary: List sub-ranges
      description: List sub-ranges. Returns the IPv4 and IPv6 sub-ranges of the imported range, as IP blocks in CIDR notation. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_ip_service_service_name_bring_your_own_ip_sub_rangeResponse'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Bring Your Own IP@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/bringYourOwnIp/subRange/get
          required: true
      x-expanded-response: IpByoipFailoverSubRange
      operationId: get_v1_ip_service_service_name_bring_your_own_ip_sub_range
    post:
      summary: Create an IPv6 sub-range
      description: Create an IPv6 sub-range. Creates an IPv6 /56 sub-range of the imported range, with an optional description. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Sub range description
                ip:
                  description: IP sub range to create
                  $ref: '#/components/schemas/ipBlock'
              required:
                - ip
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ip.byoipFailoverSubRange'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Bring Your Own IP@@@70
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/bringYourOwnIp/subRange/create
          required: true
      operationId: post_v1_ip_service_service_name_bring_your_own_ip_sub_range
  /ip/service/{serviceName}/bringYourOwnIp/subRange/{ip}:
    delete:
      summary: Delete an IPv6 sub-range
      description: Delete an IPv6 sub-range. Deletes the IPv6 sub-range from the imported range. The call returns no content. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Bring Your Own IP@@@100
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/bringYourOwnIp/subRange/delete
          required: true
      operationId: delete_v1_ip_service_service_name_bring_your_own_ip_sub_range_ip
    get:
      summary: Get a sub-range
      description: Get a sub-range. Returns the IPv4 or IPv6 sub-range, as an IP block, and the custom description set when it was created. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ip.byoipFailoverSubRange'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Bring Your Own IP@@@66
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/bringYourOwnIp/subRange/get
          required: true
      operationId: get_v1_ip_service_service_name_bring_your_own_ip_sub_range_ip
  /ip/service/{serviceName}/changeContact:
    post:
      summary: Change service contacts
      description: Change service contacts. Starts a procedure to change the admin, tech or billing contact of the service. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactAdmin:
                  type: string
                  description: The contact to set as admin contact
                contactBilling:
                  type: string
                  description: The contact to set as billing contact
                contactTech:
                  type: string
                  description: The contact to set as tech contact
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_ip_service_service_name_change_contactResponse'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Services@@@50
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/changeContact
          required: true
      operationId: post_v1_ip_service_service_name_change_contact
  /ip/service/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Services@@@80
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/confirmTermination
          required: true
      operationId: post_v1_ip_service_service_name_confirm_termination
  /ip/service/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Services@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/serviceInfos/get
          required: true
      operationId: get_v1_ip_service_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Services@@@100
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/serviceInfos/edit
          required: true
      operationId: put_v1_ip_service_service_name_service_infos
  /ip/service/{serviceName}/terminate:
    post:
      summary: Request service termination
      description: Request service termination. Starts the termination of the service. The admin contact receives a token by email, to confirm with the `confirmTermination` call. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your IP services
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Services@@@70
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: ip:apiovh:service/terminate
          required: true
      operationId: post_v1_ip_service_service_name_terminate
  /ip/{ip}:
    get:
      summary: Get an IP
      description: Get an IP. Returns the block's type, routed service, regions, RIR, organization, and BYOIP / Additional IP flags.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ip.IpWithIAM'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Configuration@@@45
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ip:apiovh:get
          required: true
      operationId: get_v1_ip_ip
    put:
      summary: Update the IP description
      description: Update the IP description. Changes the block's free-text description, its only editable field. List IPs can filter on this description.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ip.Ip'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Configuration@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ip:apiovh:edit
          required: true
      operationId: put_v1_ip_ip
  /ip/{ip}/antihack:
    get:
      summary: List hack blocks
      description: List hack blocks. Returns the addresses of the block blocked for outgoing attacks, filterable by state.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: query
          name: state
          description: Filter the value of state property (=)
          schema:
            $ref: '#/components/schemas/ip.BlockedIpStateEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_ip_ip_antihackResponse'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Abuse@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ip:apiovh:antihack/get
          required: true
      x-expanded-response: IpBlockedIp
      operationId: get_v1_ip_ip_antihack
  /ip/{ip}/antihack/{ipBlocked}:
    get:
      summary: Get a hack block
      description: Get a hack block. Returns the block date, logs, state, and the seconds left before you can ask to unblock.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: ipBlocked
          description: your IP
          required: true
          schema:
            $ref: '#/components/schemas/ipv4'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ip.BlockedIp'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Abuse@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ip:apiovh:antihack/get
          required: true
      operationId: get_v1_ip_ip_antihack_ip_blocked
  /ip/{ip}/antihack/{ipBlocked}/unblock:
    post:
      summary: Lift a hack block
      description: Lift a hack block. Unblocks the address once the waiting time is over. Get the hack block to see the seconds left.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: ipBlocked
          description: your IP
          required: true
          schema:
            $ref: '#/components/schemas/ipv4'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Abuse@@@100
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ip:apiovh:antihack/unblock
          required: true
      operationId: post_v1_ip_ip_antihack_ip_blocked_unblock
  /ip/{ip}/arp:
    get:
      summary: List ARP blocks
      description: 'List ARP blocks. Returns the addresses of the block blocked for ARP spoofing, filterable by state: blocked or unblocking.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: query
          name: state
          description: Filter the value of state property (=)
          schema:
            $ref: '#/components/schemas/ip.ArpStateEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_ip_ip_arpResponse'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Abuse@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ip:apiovh:arp/get
          required: true
      x-expanded-response: IpArpBlockedIp
      operationId: get_v1_ip_ip_arp
  /ip/{ip}/arp/{ipBlocked}:
    get:
      summary: Get an ARP block
      description: Get an ARP block. Returns the block date, ARP logs, and the seconds left before you can ask to unblock.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: ipBlocked
          description: your IP
          required: true
          schema:
            $ref: '#/components/schemas/ipv4'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ip.ArpBlockedIp'
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Abuse@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ip:apiovh:arp/get
          required: true
      operationId: get_v1_ip_ip_arp_ip_blocked
  /ip/{ip}/arp/{ipBlocked}/unblock:
    post:
      summary: Lift an ARP block
      description: Lift an ARP block. Unblocks the address once the waiting time is over. Get the ARP block to see the seconds left.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
        - in: path
          name: ipBlocked
          description: your IP
          required: true
          schema:
            $ref: '#/components/schemas/ipv4'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Network
          - IP addresses
          - Abuse@@@110
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ip:apiovh:arp/unblock
          required: true
      operationId: post_v1_ip_ip_arp_ip_blocked_unblock
  /ip/{ip}/bringYourOwnIp/aggregate:
    get:
      summary: List aggregation options
      description: List aggregation options. Returns the larger Additional IPs this one can merge into, with the neighbors each would absorb. Aggregation applies to IPv4 blocks only. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            $ref: '#/components/schemas/ipBlock'
      responses:
        '200':
