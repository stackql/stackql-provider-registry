    dedicatedCloud.sap.applicationServers:
      type: object
      description: This section contains the configuration details for setting up the SAP Application servers.
      properties:
        datastoreName:
          type: string
          description: Defines the name of the datastore where the SAP Application server's virtual machine will be stored.
        gateway:
          description: Defines the IPv4 address of the default gateway that the SAP Application server will use to access external networks.
          type: string
          format: ipv4
          example: 192.0.2.0
        instanceNumber:
          type: string
          description: Represents the unique instance number assigned to the SAP Application server within the SAP system landscape.
        ipAddress:
          description: Defines the static IPv4 address for the SAP Application server, which must be unique within the specified network.
          type: string
          format: ipv4
          example: 192.0.2.0
        memory:
          type: integer
          description: Allocates the amount of RAM (in gigabytes) to be assigned to the SAP Application server for optimal performance.
        name:
          type: string
          description: Defines the hostname of the SAP Application server's virtual machine, which should be unique.
        netmask:
          description: Defines the netmask for the SAP Application server, which defines the network range it belongs to.
          type: string
          format: ipv4
          example: 192.0.2.0
        network:
          type: string
          description: Defines the network name to which the SAP Application server will be connected.
        ovaTemplate:
          description: Selects the OVA template that will be used to deploy the SAP Application server.
          type: string
          enum:
            - SLES SLE-15-SP4-Full-x86_64 (BYOL)
            - SLES SLE-15-SP5-Full-x86_64 (BYOL)
            - SLES SLE-15-SP6-Full-x86_64 (BYOL)
            - SLES SLE-15-SP7-Full-x86_64 (BYOL)
            - SLES for SAP SLE-15-SP4-Full-x86_64 (BYOL)
            - SLES for SAP SLE-15-SP5-Full-x86_64 (BYOL)
            - SLES for SAP SLE-15-SP6-Full-x86_64 (BYOL)
            - SLES for SAP SLE-15-SP7-Full-x86_64 (BYOL)
        role:
          description: Assigns a specific role to the SAP Application server, based on its intended function within the SAP environment.
          type: string
          enum:
            - CI
            - DI
            - ERS
            - SCS
        rootPassword:
          type: string
          description: Defines the password for the root user account of the SAP Application server's virtual machine.
          format: password
        vcpus:
          type: integer
          description: Defines the number of virtual CPUs (vCPUs) that will be allocated to the SAP Application server.
      required:
        - datastoreName
        - gateway
        - instanceNumber
        - ipAddress
        - memory
        - name
        - netmask
        - network
        - ovaTemplate
        - role
        - rootPassword
        - vcpus
    dedicatedCloud.sap.applicationVersionEnum:
      type: string
