    dedicatedCloud.sap.firewall:
      type: object
      description: This configuration allows you to manage and control the firewall settings specifically for SAP Central Services, SAP Application servers, and SAP HANA databases at the operating system level. By enabling or disabling the firewall for each component, you can enhance the security of your SAP environment while ensuring that necessary communication channels remain open.
      properties:
        applicationServers:
          type: boolean
          description: Controls the firewall status for the SAP Application servers at the operating system level. Set to 'true' to enable the firewall, or 'false' to disable it.
        centralServices:
          type: boolean
          description: Controls the firewall status for the SAP Central Services server at the operating system level. Set to 'true' to enable the firewall, or 'false' to disable it.
        hanaDatabase:
          type: boolean
          description: Controls the firewall status for the SAP HANA servers at the operating system level. Set to 'true' to enable the firewall, or 'false' to disable it.
      required:
        - applicationServers
        - centralServices
        - hanaDatabase
    dedicatedCloud.sap.hanaServers:
      type: object
      description: This section contains the configuration details required for setting up and managing SAP HANA servers.
      properties:
        datastoreName:
          type: string
          description: Defines the name of the datastore where the SAP HANA server's virtual machine will be stored.
        gateway:
          description: Defines the IPv4 address of the default gateway that the SAP HANA server will use to access external networks.
          type: string
          format: ipv4
          example: 192.0.2.0
        instanceNumber:
          type: string
          description: Represents the unique instance number assigned to the SAP HANA server within the SAP system landscape.
        ipAddress:
          description: Defines the IPv4 address that will be assigned to the SAP HANA server's virtual machine.
          type: string
          format: ipv4
          example: 192.0.2.0
        memory:
          type: integer
          description: Allocates the amount of RAM (in gigabytes) to be assigned to the SAP HANA server for optimal performance.
        name:
          type: string
          description: Defines the hostname that will be assigned to the SAP HANA server's virtual machine.
        netmask:
          description: Defines the netmask for the SAP HANA server, which defines the network range it belongs to.
          type: string
          format: ipv4
          example: 192.0.2.0
        network:
          type: string
          description: Defines the network name to which the SAP HANA server will be connected.
        ovaTemplate:
          description: Selects the OVA template that will be used to deploy the SAP HANA server.
          type: string
          enum:
            - SLES SLE-15-SP4-Full-x86_64 (BYOL)
            - SLES SLE-15-SP5-Full-x86_64 (BYOL)
            - SLES SLE-15-SP6-Full-x86_64 (BYOL)
            - SLES SLE-15-SP7-Full-x86_64 (BYOL)
            - SLES for SAP SLE-15-SP4-Full-x86_64 (BYOL)
            - SLES for SAP SLE-15-SP5-Full-x86_64 (BYOL)
            - SLES for SAP SLE-15-SP6-Full-x86_64 (BYOL)
            - SLES for SAP SLE-15-SP7-Full-x86_64 (BYOL)
        rootPassword:
          type: string
          description: Defines the password for the root user account of the SAP HANA server's virtual machine.
          format: password
        thickDatastorePolicy:
          type: string
          description: Defines the thick provisioning policy that will be applied to the SAP HANA server's storage allocation.
        vcpus:
          type: integer
          description: Defines the number of virtual CPUs (vCPUs) that will be allocated to the SAP HANA server.
      required:
        - datastoreName
        - gateway
        - instanceNumber
        - ipAddress
        - memory
        - name
        - netmask
        - network
        - ovaTemplate
        - rootPassword
        - thickDatastorePolicy
