    dedicatedCloud.sapWithIAM:
      type: object
      description: This schema provides detailed information about the pre-installation tasks related to SAP deployments.
      properties:
        applicationType:
          description: Describes the type of SAP application that is being installed as part of the pre-installation tasks.
          readOnly: true
          type: string
          enum:
            - ABAP
            - JAVA
        applicationVersion:
          type: string
          description: Describes the specific version of the SAP application that is being installed during the pre-installation process.
          readOnly: true
        cleanStatus:
          description: Provides the current status of the clean-up operations performed as part of the pre-installation tasks.
          readOnly: true
          type: string
          enum:
            - FAILURE
            - PENDING
            - RETRY
            - REVOKED
            - STARTED
            - SUCCESS
        deploymentType:
          description: Describes the type of deployment strategy being used for the SAP installation during the pre-installation process.
          readOnly: true
          type: string
          enum:
            - Distributed
            - High-Availability
            - Standard
        endTime:
          type: string
          description: Records the date and time when the pre-installation tasks were finished.
          nullable: true
          readOnly: true
        errorMessage:
          type: string
          description: Contains a detailed error message if any issues or failures occurred during the execution of the pre-installation tasks.
          nullable: true
          readOnly: true
        gatewayStatus:
          description: Provides the current operational state of the Gateway component during the pre-installation process.
          readOnly: true
          type: string
          enum:
            - FAILURE
            - PENDING
            - RETRY
            - REVOKED
            - STARTED
            - SUCCESS
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        sapHanaInstallationStatus:
          description: Provides the current operational state of the SAP HANA installation during the pre-installation process.
          readOnly: true
          type: string
          enum:
            - FAILURE
            - PENDING
            - RETRY
            - REVOKED
            - STARTED
            - SUCCESS
        sapHanaSid:
          type: string
          description: Describes the System ID (SID) assigned to the SAP HANA instance being installed as part of the pre-installation tasks.
          readOnly: true
        sapSid:
          type: string
          description: Describes the System ID (SID) assigned to the SAP system being installed as part of the pre-installation tasks.
          readOnly: true
        sapSystemInstallationStatus:
          description: Provides the current operational state of the SAP system installation during the pre-installation process.
          readOnly: true
          type: string
          enum:
            - FAILURE
            - PENDING
            - RETRY
            - REVOKED
            - STARTED
            - SUCCESS
        startTime:
          type: string
          description: Records the date and time when the pre-installation tasks were initiated.
          readOnly: true
        status:
          description: Provides an overview of the current overall status of the pre-installation tasks.
          readOnly: true
          type: string
          enum:
            - FAILURE
            - PENDING
            - RETRY
            - REVOKED
            - STARTED
            - SUCCESS
        taskId:
          type: string
          description: Uniquely identifies each set of pre-installation tasks.
          format: uuid
          readOnly: true
        vmDeploymentStatus:
          description: Provides the current operational state of virtual machines deployment during the pre-installation process.
          readOnly: true
          type: string
          enum:
            - FAILURE
            - PENDING
            - RETRY
            - REVOKED
            - STARTED
            - SUCCESS
    dedicatedCloud.sap.params:
      type: object
      description: This object defines the parameters required to initiate a pre-installation task for an SAP environment.
      properties:
        applicationServers:
          type: array
          description: An array containing the configuration details for each SAP Application Server (such as SCS, ERS, PAS, AAS) virtual machine that will be deployed.
          items:
            $ref: '#/components/schemas/dedicatedCloud.sap.applicationServers'
        applicationType:
          description: Selects the type of SAP application that will be installed, such as NetWeaver 7.50 or S/4HANA.
          type: string
          enum:
            - ABAP
            - JAVA
        applicationVersion:
          description: Selects the specific version of the SAP application that will be deployed.
          type: string
          enum:
            - NetWeaver 7.50
            - S/4HANA 2021
            - S/4HANA 2022
            - S/4HANA 2023
        bucketBackint:
          description: Configuration settings for the storage bucket used by the OVHcloud Backint Agent to store SAP HANA backup files.
          type: object
          properties:
            accessKey:
              type: string
              description: A unique alphanumeric string used as part of the authentication process to access the bucket.
            endpoint:
              type: string
              description: The URL where the bucket can be accessed over the internet.
            id:
              type: string
              description: A unique identifier assigned to the bucket.
            secretKey:
              type: string
              description: Confidential string used with access key for bucket authentication.
              format: password
          required:
            - accessKey
            - endpoint
            - id
            - secretKey
        bucketSources:
          description: Configuration settings for the storage bucket that contains the necessary SAP installation sources.
          type: object
          properties:
            accessKey:
              type: string
              description: A unique alphanumeric string used as part of the authentication process to access the bucket.
            endpoint:
              type: string
              description: The URL where the bucket can be accessed over the internet.
            id:
              type: string
              description: A unique identifier assigned to the bucket.
            secretKey:
              type: string
              description: Confidential string used with access key for bucket authentication.
              format: password
          required:
            - accessKey
            - endpoint
            - id
            - secretKey
        clusterName:
          type: string
          description: A user-defined name for the cluster that will host the SAP environment, usually 'Cluster1'.
        datacenterId:
          type: integer
          description: The unique identifier for the datacenter where the SAP environment will be deployed.
        deploymentType:
          description: Selects the type of SAP deployment, such as Standard, Distributed or High-Availability.
          type: string
          enum:
            - Distributed
            - High-Availability
            - Standard
        domainName:
          type: string
          description: The fully qualified domain name (FQDN) that will be used for the SAP environment.
        firewall:
          description: Configuration settings for the firewall to protect the SAP environment.
          type: object
          properties:
            applicationServers:
              type: boolean
              description: Controls the firewall status for the SAP Application servers at the operating system level. Set to 'true' to enable the firewall, or 'false' to disable it.
            centralServices:
              type: boolean
              description: Controls the firewall status for the SAP Central Services server at the operating system level. Set to 'true' to enable the firewall, or 'false' to disable it.
            hanaDatabase:
              type: boolean
              description: Controls the firewall status for the SAP HANA servers at the operating system level. Set to 'true' to enable the firewall, or 'false' to disable it.
          required:
            - applicationServers
            - centralServices
            - hanaDatabase
        hanaServers:
          type: array
          description: An array containing the configuration details for each SAP HANA virtual machine that will be deployed.
          items:
            $ref: '#/components/schemas/dedicatedCloud.sap.hanaServers'
        logsDataPlatform:
          description: Configuration settings for the Logs Data Platform that will be used to collect and externalize operating system and SAP logs.
          type: object
          properties:
            certificate:
              type: string
              description: A certificate to authenticate and establish a trusted connection with the entrypoint of the SAP Logs Data Platform.
              format: password
            entrypoint:
              type: string
              description: The specific URL endpoint provided by Logs Data Platform for pushing logs.
          required:
            - certificate
            - entrypoint
        osLicense:
          type: string
          description: The license key or identifier for the operating system that will be used for the SAP environment.
        osUpdate:
          type: boolean
          description: A boolean value indicating whether the operating system should be updated during the pre-installation process.
        passwords:
          description: Configuration settings for the various passwords required for the SAP environment, including database, administrator, and service accounts.
          type: object
          properties:
            masterSap:
              type: string
              description: The password for the SAP master account, which is used for installation tasks related to the SAP system.
              format: password
            masterSapHana:
              type: string
              description: The password for the SAP HANA master account, which is used for installation tasks related to the SAP HANA database.
              format: password
            sidadm:
              type: string
              description: The password for the sidadm account, which is the system administrator account for the SAP installation.
              format: password
            system:
              type: string
              description: The password for the SAP HANA SYSTEM account, which is a privileged user account used for managing the SAP HANA database.
              format: password
          required:
            - masterSap
            - masterSapHana
            - sidadm
            - system
        serviceName:
          type: string
          description: The name of the Hosted Private Cloud service. This field is primarily used by the OVHcloud Manager during the import process.
        sids:
          description: Configuration settings for the System IDs (SIDs) that will be used for the SAP environment.
          type: object
          properties:
            sapHanaSid:
              type: string
              description: A unique alphanumeric identifier assigned to the SAP HANA system.
            sapSid:
              type: string
              description: A unique alphanumeric identifier assigned to the SAP system.
          required:
            - sapHanaSid
            - sapSid
        systemUsage:
          description: Selects the intended usage of the SAP system, such as custom, development, production or test.
          type: string
          enum:
            - custom
            - development
            - production
            - test
      required:
        - applicationServers
        - applicationType
        - applicationVersion
        - bucketSources
        - clusterName
        - datacenterId
        - deploymentType
        - domainName
        - firewall
        - hanaServers
        - osUpdate
        - passwords
        - sids
        - systemUsage
