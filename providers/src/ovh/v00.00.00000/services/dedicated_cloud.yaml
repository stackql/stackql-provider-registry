components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    dedicatedCloud.CommercialRange:
      type: object
      description: Commercial ranges
      properties:
        allowedHypervisorVersions:
          type: array
          description: The hypervisor versions compliant with this commercial Range
          items:
            $ref: '#/components/schemas/dedicatedCloud.HypervisorVersionEnum'
          readOnly: true
        allowedNetworkRoles:
          type: array
          description: The list of NetworkRoles allowed for one user in this commercial range
          items:
            $ref: '#/components/schemas/dedicatedCloud.right.NetworkRoleEnum'
          readOnly: true
        commercialRangeName:
          type: string
          description: The name of this commercial range
          readOnly: true
        dedicatedCloudVersion:
          type: string
          description: The name of the dedicated Cloud version associated to this commercial range
          readOnly: true
        range:
          type: string
          description: The range of this Datacenter in this VMware on OVHcloud version
          nullable: true
          readOnly: true
    dedicatedCloud.PccZone:
      type: object
      description: Hosting location
      properties:
        city:
          type: string
          description: Name of City
          readOnly: true
        countryCode:
          description: Country code
          readOnly: true
          type: string
          enum:
            - AC
            - AD
            - AE
            - AF
            - AG
            - AI
            - AL
            - AM
            - AO
            - AQ
            - AR
            - AS
            - AT
            - AU
            - AW
            - AX
            - AZ
            - BA
            - BB
            - BD
            - BE
            - BF
