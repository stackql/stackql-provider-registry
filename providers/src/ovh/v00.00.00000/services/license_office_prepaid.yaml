openapi: 3.0.0
info:
  title: OVHcloud Microsoft Office Prepaid Licenses API
  description: Microsoft Office prepaid licenses.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/license/officePrepaid
paths:
  /license/officePrepaid:
    get:
      summary: List prepaid users
      description: Returns the service names of the prepaid users. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_office_prepaidResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@70
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:get
          required: true
      x-expanded-response: LicenseOfficePrepaidOfficeUserNativeWithIAM
      operationId: get_v1_license_office_prepaid
  /license/officePrepaid/{serviceName}:
    get:
      summary: Get a prepaid user
      description: Returns the names, activation email, licenses and state of the prepaid user, and the service names of the user and of its tenant. `isVirtual` tells whether it is a user slot or a real user. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.officePrepaid.OfficeUserNativeWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@80
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:get
          required: true
      operationId: get_v1_license_office_prepaid_service_name
    put:
      summary: Update a prepaid user
      description: Updates the first name, last name and activation email of the prepaid user. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.officePrepaid.PutOfficeUserNative'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@90
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:put
          required: true
      operationId: put_v1_license_office_prepaid_service_name
  /license/officePrepaid/{serviceName}/changePassword:
    post:
      summary: Change a prepaid user password
      description: Changes the password of the prepaid user and returns the task. Leave `password` empty to receive a generated password by email. Set `shouldSendMail` to send the new password to `notifyEmail`, the admin contact email by default. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.officePrepaid.OfficeTenantPostChangePassword'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.officePrepaid.OfficeTaskNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@100
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:changePassword
          required: true
      operationId: post_v1_license_office_prepaid_service_name_change_password
  /license/officePrepaid/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The service name of your office account
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@150
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:confirmTermination
          required: true
      operationId: post_v1_license_office_prepaid_service_name_confirm_termination
  /license/officePrepaid/{serviceName}/parentTenant:
    get:
      summary: Get the parent tenant
      description: 'Returns the tenant of the prepaid user: display name, contact details, service type, status, and whether the Microsoft Customer Agreement (MCA) is accepted. (Alpha version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.officePrepaid.OfficeTenantNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - General Information@@@60
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:parentTenant/get
          required: true
      operationId: get_v1_license_office_prepaid_service_name_parent_tenant
    put:
      summary: Update the parent tenant
      description: Updates the display name of the tenant of the prepaid user. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.officePrepaid.OfficeTenantPutParentTenant'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - General Information@@@70
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:parentTenant/edit
          required: true
      operationId: put_v1_license_office_prepaid_service_name_parent_tenant
  /license/officePrepaid/{serviceName}/parentTenant/acceptAgreement:
    post:
      summary: Accept the Microsoft Customer Agreement
      description: Accepts the Microsoft Customer Agreement (MCA) for the parent tenant. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Contract Signing@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:acceptAgreement
          required: true
      operationId: post_v1_license_office_prepaid_service_name_parent_tenant_accept_agreement
  /license/officePrepaid/{serviceName}/parentTenant/createAttestation:
    post:
      summary: Create an MCA attestation
      description: Creates a Microsoft Customer Agreement attestation for the parent tenant from the signatory company, names, email address, phone number, country and language. Returns the attestation ID and a link to the attestation that can be embedded in an iframe. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.officePrepaid.createAttestationPostPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.officePrepaid.createAttestationResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Contract Signing@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:createAttestation
          required: true
      operationId: post_v1_license_office_prepaid_service_name_parent_tenant_create_attestation
  /license/officePrepaid/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The service name of your office account
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@110
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_license_office_prepaid_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The service name of your office account
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@120
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_license_office_prepaid_service_name_service_infos
  /license/officePrepaid/{serviceName}/tenantPendingTask:
    get:
      summary: List parent tenant tasks
      description: Returns the IDs of the pending tasks of the parent tenant. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_office_prepaid_service_name_tenant_pending_taskResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Tasks@@@30
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:tenantPendingTask/get
          required: true
      x-expanded-response: LicenseOfficePrepaidOfficeTaskNative
      operationId: get_v1_license_office_prepaid_service_name_tenant_pending_task
  /license/officePrepaid/{serviceName}/tenantPendingTask/{id}:
    get:
      summary: Get a parent tenant task
      description: Returns the function, status, creation date and completion date of the task. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.officePrepaid.OfficeTaskNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Tasks@@@40
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:tenantPendingTask/get
          required: true
      x-response-identifier: id
      operationId: get_v1_license_office_prepaid_service_name_tenant_pending_task_id
  /license/officePrepaid/{serviceName}/tenantUsageStatistics:
    get:
      summary: Get parent tenant usage statistics
      description: Returns, for each day between `from` and `to`, the peak and end-of-day counts of activated licenses of the parent tenant, by license type. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: from
          description: Period's start point.
          schema:
            type: string
            format: date-time
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: query
          name: to
          description: Period's end point.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_office_prepaid_service_name_tenant_usage_statisticsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Usage@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:tenantUsageStatistics/get
          required: true
      operationId: get_v1_license_office_prepaid_service_name_tenant_usage_statistics
  /license/officePrepaid/{serviceName}/terminate:
    post:
      summary: Request service termination
      description: Request service termination. Starts the termination of the service. The admin contact receives a token by email, to confirm with the `confirmTermination` call. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The service name of your office account
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@140
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:terminate
          required: true
      operationId: post_v1_license_office_prepaid_service_name_terminate
  /license/officePrepaid/{serviceName}/unconfigure:
    post:
      summary: Unconfigure a prepaid user
      description: Removes the configuration of the prepaid user and turns it back into an unassigned license slot, and returns the task. The prepaid license is kept.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.officePrepaid.OfficeTaskNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@130
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseOfficePrepaid:apiovh:unconfigure
          required: true
      operationId: post_v1_license_office_prepaid_service_name_unconfigure
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    license.officePrepaid.OfficeUserNativeWithIAM:
      type: object
      description: Office tenant
      properties:
        activationEmail:
          type: string
          description: Email used to activate Microsoft Office
          readOnly: true
        firstName:
          type: string
          description: User's first name
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        isVirtual:
          type: boolean
          description: Specify if the user is actually a user slot (configureme) or a real user
          readOnly: true
        lastName:
          type: string
          description: User's last name
          readOnly: true
        licences:
          type: array
          description: Licenses attributed to the user
          items:
            $ref: '#/components/schemas/license.officePrepaid.LicenseEnum'
          readOnly: true
        serviceName:
          type: string
          description: User service name, used in invoices
          readOnly: true
        status:
          description: User state
          readOnly: true
          type: string
          enum:
            - creating
            - deleting
            - ok
            - suspended
            - unspending
        taskPendingId:
          type: integer
          description: Pending task id
          readOnly: true
        tenantServiceName:
