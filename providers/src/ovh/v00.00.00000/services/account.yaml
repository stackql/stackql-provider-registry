openapi: 3.0.0
info:
  title: OVHcloud Account (v2) API
  description: Account level API v2 resources.
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/account
paths:
  /account/api/revision:
    get:
      operationId: getApiRevision
      summary: Get the current and available API revisions
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/revisions.revision.AccountRevision'
              examples:
                Get the current API revision:
                  value:
                    availableRevisions:
                      - 2026-06
                      - 2026-09
                    currentState:
                      revision: 2026-06
                    targetSpec:
                      revision: 2026-06
                  summary: Response body containing the current and available API revisions
      x-developer-hub-navigation:
        - - Account
          - Profile
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: account:apiovh:revision/get
          required: true
      description: Get the current and available API revisions (Alpha version)
    put:
      operationId: editApiRevision
      summary: Update the current API revision
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/revisions.revision.AccountRevisionInput'
            examples:
              Switch to API revision 2026-09:
                value:
                  targetSpec:
                    revision: 2026-09
                summary: Request body to switch to API revision 2026-09
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/revisions.revision.AccountRevision'
              examples:
                Switch to API revision 2026-09:
                  value:
                    availableRevisions:
                      - 2026-06
                      - 2026-09
                    currentState:
                      revision: 2026-06
                    targetSpec:
                      revision: 2026-09
                  summary: Response body after switching to API revision 2026-09
      x-developer-hub-navigation:
        - - Account
          - Profile
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: account:apiovh:revision/edit
          required: true
      description: Update the current API revision (Alpha version)
components:
  schemas:
    revisions.revision.AccountRevision:
      type: object
      description: API revision resource
      properties:
        availableRevisions:
          type: array
          description: Available API revisions to transition to
          items:
            type: string
          readOnly: true
        currentState:
          description: Current state of the API revision
          readOnly: true
          type: object
          properties:
            revision:
              type: string
              description: Currently active API revision
              readOnly: true
        targetSpec:
          description: Target specification for the API revision
          readOnly: true
          type: object
          properties:
            revision:
              type: string
              description: API revision to set as active
          required:
            - revision
    revisions.revision.AccountRevisionInput:
      type: object
      description: Input payload to update the API revision
      properties:
        targetSpec:
          description: Requested target specification
          type: object
          properties:
            revision:
              type: string
              description: API revision to set as active
          required:
            - revision
      required:
        - targetSpec
    revisions.revision.AccountRevisionCurrentState:
      type: object
      description: Current state of the API revision
      properties:
        revision:
          type: string
          description: Currently active API revision
          readOnly: true
    revisions.revision.AccountRevisionTargetSpec:
      type: object
      description: Target specification for the API revision
      properties:
        revision:
          type: string
          description: API revision to set as active
      required:
        - revision
  x-stackQL-resources:
    api_revisions:
      id: ovh.account.api_revisions
      name: api_revisions
      title: Api Revisions
      methods:
        get:
          operation:
            $ref: '#/paths/~1account~1api~1revision/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1account~1api~1revision/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/api_revisions/methods/get'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/api_revisions/methods/update'
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v2
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
