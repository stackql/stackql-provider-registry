openapi: 3.0.0
info:
  title: OVHcloud Commercial Catalog API
  description: The commercial catalog of offers.
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/commercialCatalog
paths:
  /commercialCatalog/offers:
    get:
      operationId: getAllCatalogOffers
      summary: List all offers
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: merchants
          description: Offer merchant
          schema:
            type: array
            items:
              $ref: '#/components/schemas/commercialCatalog.MerchantEnum'
        - in: query
          name: nature
          description: Offer nature
          schema:
            $ref: '#/components/schemas/commercialCatalog.OfferNatureEnum'
        - in: query
          name: productCode
          description: Commercial product code
          schema:
            type: string
        - in: query
          name: state
          description: Offer state
          schema:
            type: array
            items:
              $ref: '#/components/schemas/commercialCatalog.OfferStateEnum'
        - in: query
          name: technicalRequirements
          description: Offer config fields
          schema:
            type: array
            items:
              type: string
        - in: query
          name: type
          description: Offer type
          schema:
            $ref: '#/components/schemas/commercialCatalog.OfferTypeEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCatalogOffersResponse'
      x-developer-hub-navigation:
        - - Offers & Services
          - Commercial Catalog
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: id
      x-expanded-response: CommercialCatalogOffer
      description: List all offers
  /commercialCatalog/offers/{id}:
    get:
      operationId: getCatalogOffer
      summary: Get details of an offer
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commercialCatalog.Offer'
      x-developer-hub-navigation:
        - - Offers & Services
          - Commercial Catalog
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: id
      description: Get details of an offer
components:
  schemas:
    commercialCatalog.MerchantEnum:
      type: string
      description: Merchants where offers are available
      enum:
        - ASIA
        - AU
        - CA
        - DE
        - ES
        - FR
        - GB
        - IE
        - IN
        - IT
        - MA
        - NL
        - PL
        - PT
        - QC
        - SG
        - SN
        - TN
        - US
        - WE
        - WS
    commercialCatalog.OfferNatureEnum:
      type: string
      description: Nature of a commercial catalog offer. It represents the commercial purpose of the offer. REGULAR represents an offer with standard pricing on product consumption. BILLING_PLAN represents an offer which allows savings on product consumption. STRUCTURAL represents an offer to hold a list of offers and information to share across them, which can't be purchased by itself.
      enum:
        - BILLING_PLAN
        - PACK
        - REGULAR
        - STRUCTURAL
    commercialCatalog.OfferStateEnum:
      type: string
      description: Offer state. DEPRECATED means that offer is not sold anymore but services are still active.
      enum:
        - ACTIVE
        - DEPRECATED
    commercialCatalog.OfferTypeEnum:
      type: string
      description: Type of a commercial catalog offer. An atomic offer is a basic commercial offer, for example C3-8 instance offer with 1 month commitment. A composite offer is a kind of offer composed by multiple atomic offers.
      enum:
        - ATOMIC
        - COMPOSITE
    commercialCatalog.Offer:
      type: object
      description: Defines a commercial catalog offer
      properties:
        code:
          type: string
          description: Unique code for the offer
          readOnly: true
        commercialRatingValues:
          type: array
          description: Applicable commercial rating values
          items:
            $ref: '#/components/schemas/commercialCatalog.CommercialRatingValue'
          readOnly: true
        descriptions:
          type: array
          description: Offer description
          items:
            $ref: '#/components/schemas/commercialCatalog.Description'
          readOnly: true
        engagements:
          type: array
          description: List of engagements available to subscribe the offer to
          items:
            $ref: '#/components/schemas/commercialCatalog.Engagement'
          readOnly: true
        id:
          type: string
          description: Unique identifier of the offer
          readOnly: true
        legacy:
          description: Offer information based on previous model used for migration to the new model
          nullable: true
          readOnly: true
          type: object
          properties:
            blobs:
              description: Contains content from previous model
              nullable: true
              readOnly: true
              type: object
              properties:
                content:
                  description: Blob content
                  readOnly: true
                  type: object
                  properties:
                    technical:
                      description: Technical information
                      readOnly: true
                      type: object
                      properties:
                        bandwidth:
                          description: Public network bandwidth included with the offer
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            guaranteed:
                              type: boolean
                              description: Whether the stated bandwidth is held under load, rather than reached only when capacity is free
                              nullable: true
                              readOnly: true
                            isMax:
                              type: boolean
                              description: Whether level should be read as a ceiling the product may reach, rather than a rate it always gets
                              nullable: true
                              readOnly: true
                            level:
                              type: number
                              description: Bandwidth included with the offer, counted in unit
                              nullable: true
                              readOnly: true
                            max:
                              type: number
                              description: Highest bandwidth the product can reach in a burst, counted in maxUnit. Null when it cannot exceed level.
                              nullable: true
                              readOnly: true
                            maxUnit:
                              type: string
                              description: Unit that max is expressed in
                              nullable: true
                              readOnly: true
                            unit:
                              type: string
                              description: Unit that level is expressed in
                              nullable: true
                              readOnly: true
                            unlimited:
                              type: boolean
                              description: Whether traffic is uncapped, so no volume limit applies however much is transferred
                              nullable: true
                              readOnly: true
                        connection:
                          description: Characteristics of the network link the product is delivered on
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            clients:
                              description: Connection information per client
                              readOnly: true
                              type: object
                              properties:
                                concurrency:
                                  type: integer
                                  description: Number of allowed concurrent clients
                                  readOnly: true
                                number:
                                  type: integer
                                  description: Number of allowed concurrent connections per client
                                  readOnly: true
                            total:
                              type: integer
                              description: Total of allowed connections
                              readOnly: true
                        connectionPerSeconds:
                          description: How many new connections per second the product is rated for
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            total:
                              type: integer
                              description: How many are handled per second, counted in unit
                              readOnly: true
                            unit:
                              type: string
                              description: Unit that total is expressed in
                              nullable: true
                              readOnly: true
                        cpu:
                          description: 'Processor the product runs on: model, core count and frequency'
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            brand:
                              type: string
                              description: CPU Brand
                              nullable: true
                              readOnly: true
                            cores:
                              type: integer
                              description: Number of cores
                              readOnly: true
                            frequency:
                              type: number
                              description: Frequency of CPU in GHz
                              nullable: true
                              readOnly: true
                            maxFrequency:
                              type: number
                              description: Maximum frequency of CPU in GHz
                              nullable: true
                              readOnly: true
                            model:
                              type: string
                              description: Displayable name
                              nullable: true
                              readOnly: true
                            threads:
                              type: integer
                              description: Number of threads
                              nullable: true
                              readOnly: true
                            type:
                              type: string
                              description: Type of CPU
                              nullable: true
                              readOnly: true
                        ephemeralLocalStorage:
                          description: Storage attached directly to the host, which does not survive the product being stopped or moved
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            disks:
                              type: array
                              description: Disk properties
                              items:
                                $ref: '#/components/schemas/commercialCatalog.BlobContentTechnicalDisk'
                              readOnly: true
                        gpu:
                          description: Graphics or compute accelerator included with the offer
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            memory:
                              description: GPU memory size
                              readOnly: true
                              type: object
                              properties:
                                interface:
                                  type: string
                                  description: Memory technology used, for example DDR4 or DDR5. Null when the offer does not state it.
                                  nullable: true
                                  readOnly: true
                                size:
                                  type: number
                                  description: How much RAM is included, counted in sizeUnit. Read it as gigabytes when sizeUnit is not set.
                                  readOnly: true
                                sizeUnit:
                                  type: string
                                  description: Unit that size is expressed in. Null means gigabytes.
                                  nullable: true
                                  readOnly: true
                            model:
                              type: string
                              description: GPU model
                              readOnly: true
                            number:
                              type: integer
                              description: GPU number
                              readOnly: true
                            performance:
                              type: number
                              description: GPU performance
                              nullable: true
                              readOnly: true
                        memory:
                          description: Amount and type of RAM included with the offer
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            interface:
                              type: string
                              description: Memory technology used, for example DDR4 or DDR5. Null when the offer does not state it.
                              nullable: true
                              readOnly: true
                            size:
                              type: number
                              description: How much RAM is included, counted in sizeUnit. Read it as gigabytes when sizeUnit is not set.
                              readOnly: true
                            sizeUnit:
                              type: string
                              description: Unit that size is expressed in. Null means gigabytes.
                              nullable: true
                              readOnly: true
                        name:
                          type: string
                          description: Commercial name of the hardware configuration this describes
                          nullable: true
                          readOnly: true
                        nodes:
                          description: How many nodes the offer is made of, for products delivered as a cluster
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            number:
                              type: integer
                              description: Number of nodes
                              readOnly: true
                        nvme:
                          description: NVMe storage included with the offer, when it is listed separately from the main disks
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            disks:
                              type: array
                              description: Disk properties
                              items:
                                $ref: '#/components/schemas/commercialCatalog.BlobContentTechnicalDisk'
                              readOnly: true
                        os:
                          description: Operating system the product ships with
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            family:
                              type: string
                              description: Operating system family installed on the product, for example Linux or Windows
                              readOnly: true
                        requestPerSeconds:
                          description: How many requests per second the product is rated for
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            total:
                              type: integer
                              description: How many are handled per second, counted in unit
                              readOnly: true
                            unit:
                              type: string
                              description: Unit that total is expressed in
                              nullable: true
                              readOnly: true
                        storage:
                          description: Disks included with the offer, and how they are arranged
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            disks:
                              type: array
                              description: Each kind of disk included with the offer, with its capacity and technology
                              items:
                                $ref: '#/components/schemas/commercialCatalog.BlobContentTechnicalDisk'
                              readOnly: true
                            raid:
                              type: string
                              description: RAID arrangement the disks are delivered in, which determines usable capacity and redundancy. Null when the disks are not arranged in RAID.
                              nullable: true
                              readOnly: true
                        throughput:
                          description: Data throughput the product is rated for
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            level:
                              type: integer
                              description: Throughput tier of the offer. A higher tier means more data can move through the product per second.
                              readOnly: true
                        volume:
                          description: Block storage volume included with the offer
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            capacity:
                              description: Disk capacity details
                              readOnly: true
                              type: object
                              properties:
                                max:
                                  type: integer
                                  description: Maximum volume capacity in GB
                                  readOnly: true
                            iops:
                              description: Input/Output operations per second details
                              readOnly: true
                              type: object
                              properties:
                                guaranteed:
                                  type: boolean
                                  description: Whether the rated level is held under load, rather than reached only when capacity is free
                                  readOnly: true
                                level:
                                  type: integer
                                  description: Rate of disk operations per second the volume is rated for, counted in unit
                                  readOnly: true
                                max:
                                  type: integer
                                  description: Highest rate the volume can reach in a burst, counted in maxUnit. Null when it cannot exceed its rated level.
                                  nullable: true
                                  readOnly: true
                                maxUnit:
                                  type: string
                                  description: Unit that max is expressed in
                                  nullable: true
                                  readOnly: true
                                unit:
                                  type: string
                                  description: Unit that level is expressed in
                                  nullable: true
                                  readOnly: true
                        vrack:
                          description: Private network (vRack) bandwidth included with the offer
                          nullable: true
                          readOnly: true
                          type: object
                          properties:
                            guaranteed:
                              type: boolean
                              description: Whether the stated bandwidth is held under load, rather than reached only when capacity is free
                              nullable: true
                              readOnly: true
                            isMax:
                              type: boolean
                              description: Whether level should be read as a ceiling the product may reach, rather than a rate it always gets
                              nullable: true
                              readOnly: true
                            level:
                              type: number
                              description: Bandwidth included with the offer, counted in unit
                              nullable: true
                              readOnly: true
                            max:
                              type: number
                              description: Highest bandwidth the product can reach in a burst, counted in maxUnit. Null when it cannot exceed level.
                              nullable: true
                              readOnly: true
                            maxUnit:
                              type: string
                              description: Unit that max is expressed in
                              nullable: true
                              readOnly: true
                            unit:
                              type: string
                              description: Unit that level is expressed in
                              nullable: true
                              readOnly: true
                            unlimited:
                              type: boolean
                              description: Whether traffic is uncapped, so no volume limit applies however much is transferred
                              nullable: true
                              readOnly: true
            catalog:
              description: Catalog used to generate the offer
              nullable: true
              readOnly: true
              type: object
              properties:
                id:
                  type: integer
                  description: Identifier of the catalog
                  readOnly: true
                name:
                  type: string
                  description: Catalog name
                  readOnly: true
            plan:
              type: string
              description: Previous model identifier
              readOnly: true
        nature:
          description: Offer nature
          readOnly: true
          type: string
          enum:
            - BILLING_PLAN
            - PACK
            - REGULAR
            - STRUCTURAL
        offers:
          type: array
          description: Sub offers when type is composite
          nullable: true
          items:
            $ref: '#/components/schemas/commercialCatalog.CompositeOfferCommercialOffer'
          readOnly: true
        product:
          description: Product linked to the offer
          nullable: true
          readOnly: true
          type: object
          properties:
            commercialProduct:
              description: Commercial product to be linked
              readOnly: true
              type: object
              properties:
                code:
                  type: string
                  description: Product code
                  readOnly: true
                descriptions:
                  type: array
                  description: Description of the commercial product
                  items:
                    $ref: '#/components/schemas/commercialCatalog.Description'
                  readOnly: true
            max:
              type: integer
              description: Maximum number of product to be included in the offer
              nullable: true
              readOnly: true
            min:
              type: integer
              description: Minimum number of product to be included in the offer
              readOnly: true
        technicalRequirements:
          type: array
          description: List of technical requirements of the product linked to the offer
          items:
            $ref: '#/components/schemas/commercialCatalog.TechnicalRequirement'
          readOnly: true
        type:
          description: Offer type
          readOnly: true
          type: string
          enum:
            - ATOMIC
            - COMPOSITE
        validity:
          description: Offer validity information
          readOnly: true
          type: object
          properties:
            eolDate:
              type: string
              description: End-of-life datetime of the offer upon which nor offer or service is active
              nullable: true
              format: date-time
              readOnly: true
            eosDate:
              type: string
              description: End-of-sale datetime of the offer upon which offer is not sold anymore but associated service stays active
              nullable: true
              format: date-time
              readOnly: true
            startDate:
              type: string
              description: Start datetime of the offer upon which offer and service is available
              format: date-time
              readOnly: true
        version:
          type: integer
          description: Offer version, increase on update
          readOnly: true
    commercialCatalog.CommercialRatingValue:
      type: object
      description: Defines the applicable rating values
      properties:
        invoiceLabels:
          type: array
          description: Label of the invoice
          items:
            $ref: '#/components/schemas/commercialCatalog.InvoiceLabel'
          readOnly: true
        ratingValue:
          description: Rating value to link the offer to
          readOnly: true
          type: object
          properties:
            prices:
              type: array
              description: Price list
              nullable: true
              items:
                $ref: '#/components/schemas/commercialCatalog.Price'
              readOnly: true
            type:
              description: Type of type rating value
              readOnly: true
              type: string
              enum:
                - PRICE
    commercialCatalog.Description:
      type: object
      description: Commercial wording of an offer in one language. The catalog returns one entry per language it is translated into.
      properties:
        language:
          description: Language this wording is written in
          readOnly: true
          type: string
          enum:
            - cs_CZ
            - de_DE
            - en_AS
            - en_AU
            - en_CA
            - en_GB
            - en_IE
            - en_IN
            - en_SG
            - en_US
            - en_WW
            - es_ES
            - es_SA
            - fi_FI
            - fr_CA
            - fr_FR
            - fr_MA
            - fr_SN
            - fr_TN
            - it_IT
            - lt_LT
            - nl_NL
            - pl_PL
            - pt_PT
        longLabel:
          type: string
          description: Full commercial description of the offer, for a product page or a detailed view
          readOnly: true
        shortLabel:
          type: string
          description: Brief commercial name of the offer, for a list or a summary line
          readOnly: true
    commercialCatalog.Engagement:
      type: object
      description: Describes engagement information
      properties:
        autoReactivation:
          type: boolean
          description: Whether the engagement reactivates itself
          readOnly: true
        validDuration:
          type: string
          description: Engagement duration following ISO8601 format
          format: duration
          readOnly: true
    commercialCatalog.Legacy:
      type: object
      description: Describes legacy information, used for transition between offer models
      properties:
        blobs:
          description: Contains content from previous model
          nullable: true
          readOnly: true
          type: object
          properties:
            content:
              description: Blob content
              readOnly: true
              type: object
              properties:
                technical:
                  description: Technical information
                  readOnly: true
                  type: object
                  properties:
                    bandwidth:
                      description: Public network bandwidth included with the offer
                      nullable: true
                      readOnly: true
                      type: object
                      properties:
                        guaranteed:
                          type: boolean
                          description: Whether the stated bandwidth is held under load, rather than reached only when capacity is free
                          nullable: true
                          readOnly: true
                        isMax:
                          type: boolean
                          description: Whether level should be read as a ceiling the product may reach, rather than a rate it always gets
                          nullable: true
                          readOnly: true
                        level:
                          type: number
                          description: Bandwidth included with the offer, counted in unit
                          nullable: true
                          readOnly: true
                        max:
                          type: number
                          description: Highest bandwidth the product can reach in a burst, counted in maxUnit. Null when it cannot exceed level.
                          nullable: true
                          readOnly: true
                        maxUnit:
                          type: string
                          description: Unit that max is expressed in
                          nullable: true
                          readOnly: true
                        unit:
                          type: string
                          description: Unit that level is expressed in
                          nullable: true
                          readOnly: true
                        unlimited:
                          type: boolean
                          description: Whether traffic is uncapped, so no volume limit applies however much is transferred
                          nullable: true
                          readOnly: true
                    connection:
                      description: Characteristics of the network link the product is delivered on
                      nullable: true
                      readOnly: true
                      type: object
                      properties:
                        clients:
                          description: Connection information per client
                          readOnly: true
                          type: object
                          properties:
                            concurrency:
                              type: integer
                              description: Number of allowed concurrent clients
                              readOnly: true
                            number:
                              type: integer
                              description: Number of allowed concurrent connections per client
                              readOnly: true
                        total:
                          type: integer
                          description: Total of allowed connections
                          readOnly: true
                    connectionPerSeconds:
                      description: How many new connections per second the product is rated for
                      nullable: true
                      readOnly: true
                      type: object
                      properties:
                        total:
                          type: integer
                          description: How many are handled per second, counted in unit
                          readOnly: true
                        unit:
                          type: string
                          description: Unit that total is expressed in
                          nullable: true
                          readOnly: true
                    cpu:
                      description: 'Processor the product runs on: model, core count and frequency'
                      nullable: true
                      readOnly: true
                      type: object
                      properties:
                        brand:
                          type: string
                          description: CPU Brand
                          nullable: true
                          readOnly: true
                        cores:
                          type: integer
                          description: Number of cores
                          readOnly: true
                        frequency:
                          type: number
                          description: Frequency of CPU in GHz
                          nullable: true
                          readOnly: true
                        maxFrequency:
                          type: number
                          description: Maximum frequency of CPU in GHz
                          nullable: true
                          readOnly: true
                        model:
                          type: string
                          description: Displayable name
                          nullable: true
                          readOnly: true
                        threads:
                          type: integer
                          description: Number of threads
                          nullable: true
                          readOnly: true
                        type:
                          type: string
                          description: Type of CPU
                          nullable: true
                          readOnly: true
                    ephemeralLocalStorage:
                      description: Storage attached directly to the host, which does not survive the product being stopped or moved
                      nullable: true
                      readOnly: true
                      type: object
                      properties:
                        disks:
                          type: array
                          description: Disk properties
                          items:
                            $ref: '#/components/schemas/commercialCatalog.BlobContentTechnicalDisk'
                          readOnly: true
                    gpu:
                      description: Graphics or compute accelerator included with the offer
                      nullable: true
                      readOnly: true
                      type: object
                      properties:
                        memory:
                          description: GPU memory size
                          readOnly: true
                          type: object
                          properties:
                            interface:
                              type: string
                              description: Memory technology used, for example DDR4 or DDR5. Null when the offer does not state it.
                              nullable: true
                              readOnly: true
                            size:
                              type: number
                              description: How much RAM is included, counted in sizeUnit. Read it as gigabytes when sizeUnit is not set.
                              readOnly: true
                            sizeUnit:
                              type: string
                              description: Unit that size is expressed in. Null means gigabytes.
                              nullable: true
                              readOnly: true
                        model:
                          type: string
                          description: GPU model
                          readOnly: true
                        number:
                          type: integer
                          description: GPU number
                          readOnly: true
                        performance:
                          type: number
                          description: GPU performance
                          nullable: true
                          readOnly: true
                    memory:
                      description: Amount and type of RAM included with the offer
                      nullable: true
                      readOnly: true
                      type: object
                      properties:
                        interface:
                          type: string
                          description: Memory technology used, for example DDR4 or DDR5. Null when the offer does not state it.
                          nullable: true
                          readOnly: true
                        size:
                          type: number
                          description: How much RAM is included, counted in sizeUnit. Read it as gigabytes when sizeUnit is not set.
                          readOnly: true
                        sizeUnit:
                          type: string
                          description: Unit that size is expressed in. Null means gigabytes.
                          nullable: true
                          readOnly: true
                    name:
                      type: string
                      description: Commercial name of the hardware configuration this describes
                      nullable: true
                      readOnly: true
