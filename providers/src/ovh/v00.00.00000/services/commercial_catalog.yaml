          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.catalog_offers
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/GetAllCatalogOffersResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"catalog_offers\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1commercialCatalog~1offers~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/offers/methods/get'
          - $ref: '#/components/x-stackQL-resources/offers/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v2
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
