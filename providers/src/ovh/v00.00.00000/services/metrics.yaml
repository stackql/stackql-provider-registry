components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    metrics.api.ServiceWithIAM:
      type: object
      description: Structure holding the elements about a service
      properties:
        description:
          type: string
          description: Description of a service
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        name:
          type: string
          description: Name of a service
          readOnly: true
        offer:
          type: string
          description: Offer used for the service
          readOnly: true
        quota:
          description: Quota used for the service
          readOnly: true
          type: object
          properties:
            ddp:
              type: integer
              description: Daily data points
              readOnly: true
            lastModification:
              type: string
              description: Time of last modification
              format: date-time
              readOnly: true
            mads:
              type: integer
              description: Monthly active device streams
              readOnly: true
        region:
          description: Region holding the service
          readOnly: true
          type: object
          properties:
            description:
              type: string
              description: Description of a region
              readOnly: true
            name:
              type: string
              description: Name of a region
              readOnly: true
        shouldUpgrade:
          type: boolean
          description: Indicator if the service should be upgraded based on current quota and offer
          readOnly: true
        status:
          description: Status of a service
          readOnly: true
          type: string
          enum:
            - alive
            - dead
            - disabled
            - new
        type:
          description: 'Type of the service: cloud or live'
          readOnly: true
          type: string
          enum:
            - cloud
            - live
    metrics.Update:
      type: object
      description: Missing description
      properties:
        description:
          type: string
          description: New description for your service
          nullable: true
    metrics.api.Service:
      type: object
      description: Structure holding the elements about a service
      properties:
        description:
          type: string
          description: Description of a service
          readOnly: true
        name:
          type: string
          description: Name of a service
          readOnly: true
        offer:
          type: string
          description: Offer used for the service
          readOnly: true
        quota:
          description: Quota used for the service
          readOnly: true
          type: object
          properties:
            ddp:
              type: integer
              description: Daily data points
              readOnly: true
            lastModification:
              type: string
              description: Time of last modification
              format: date-time
              readOnly: true
            mads:
              type: integer
              description: Monthly active device streams
              readOnly: true
        region:
          description: Region holding the service
          readOnly: true
          type: object
          properties:
            description:
              type: string
              description: Description of a region
              readOnly: true
            name:
              type: string
              description: Name of a region
              readOnly: true
        shouldUpgrade:
          type: boolean
          description: Indicator if the service should be upgraded based on current quota and offer
          readOnly: true
        status:
          description: Status of a service
          readOnly: true
          type: string
          enum:
            - alive
            - dead
            - disabled
            - new
        type:
          description: 'Type of the service: cloud or live'
          readOnly: true
          type: string
          enum:
            - cloud
            - live
    services.changeContact:
      type: object
      description: Service change contact payload
      properties:
        contactAdmin:
          type: string
          description: The contact to set as admin contact
        contactBilling:
          type: string
          description: The contact to set as billing contact
        contactTech:
          type: string
          description: The contact to set as tech contact
    services.confirmTermination:
      type: object
      description: Service confirm termination payload
      properties:
        commentary:
          type: string
          description: Commentary about your termination request
        commentaryFutureUse:
          type: string
          description: Commentary about your future use
        commentaryReason:
          type: string
          description: Commentary about your reason for termination request
        futureUse:
          description: All future uses you can provide for a service termination
          type: string
          enum:
            - NOT_REPLACING_SERVICE
            - OTHER
            - SUBSCRIBE_AN_OTHER_SERVICE
            - SUBSCRIBE_OTHER_KIND_OF_SERVICE_WITH_COMPETITOR
            - SUBSCRIBE_SIMILAR_SERVICE_WITH_COMPETITOR
        reason:
          description: All reasons you can provide for a service termination
          type: string
          enum:
            - FEATURES_DONT_SUIT_ME
            - LACK_OF_PERFORMANCES
            - MIGRATED_TO_ANOTHER_OVH_PRODUCT
            - MIGRATED_TO_COMPETITOR
            - NOT_ENOUGH_RECOGNITION
            - NOT_NEEDED_ANYMORE
            - NOT_RELIABLE
            - NO_ANSWER
            - OTHER
            - PRODUCT_DIMENSION_DONT_SUIT_ME
            - PRODUCT_TOOLS_DONT_SUIT_ME
            - TOO_EXPENSIVE
            - TOO_HARD_TO_USE
            - UNSATIFIED_BY_CUSTOMER_SUPPORT
        token:
          type: string
          description: The termination token sent by email to the admin contact
      required:
        - token
    metrics.api.Consumption:
      type: object
      description: Structure holding the consumption
      properties:
        ddp:
          type: integer
          description: Current Daily data points
          readOnly: true
        mads:
          type: integer
          description: Current monthly active data streams
          readOnly: true
    metrics.LookupTokenCreation:
      type: object
      description: Missing description
      properties:
        accessToken:
          type: string
          description: access token
      required:
        - accessToken
    metrics.QuotaUpdate:
      type: object
      description: Missing description
      properties:
        quota:
          type: integer
          description: New value for overquota
      required:
        - quota
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - manual
            - oneShot
            - option
        serviceId:
          type: integer
          readOnly: true
        status:
          readOnly: true
          type: string
          description: service.StateEnum
          enum:
            - autorenewInProgress
            - expired
            - inCreation
            - ok
            - pendingDebt
            - unPaid
    metrics.TokenCreation:
      type: object
      description: Missing description
      properties:
        description:
          type: string
          description: Description for the new token
          nullable: true
        labels:
          type: array
          description: Labels for the new token
          nullable: true
          items:
            $ref: '#/components/schemas/metrics.api.Label'
        permission:
          description: Type of the new token. Read or Write
          type: string
          enum:
            - read
            - write
      required:
        - permission
    metrics.api.Token:
      type: object
      description: Structure holding the elements about a token
      properties:
        access:
          type: string
          description: The actual access token
          format: password
