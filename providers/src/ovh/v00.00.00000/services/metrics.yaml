openapi: 3.0.0
info:
  title: OVHcloud Metrics Data Platform API
  description: Metrics Data Platform services, consumption and tokens.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/metrics
paths:
  /metrics:
    get:
      operationId: listMetricsServices
      summary: List available services
      deprecated: true
      x-deprecation-date: '2026-10-17T00:00:00Z'
      x-deletion-date: '2026-12-17T00:00:00Z'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
