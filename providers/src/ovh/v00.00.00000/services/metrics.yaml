  /metrics/{serviceName}/token:
    get:
      operationId: listMetricsTokens
      summary: Get list of tokens
      deprecated: true
      x-deprecation-date: '2026-10-17T00:00:00Z'
      x-deletion-date: '2026-12-17T00:00:00Z'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
