          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMetricsServicesResponse'
      x-badges:
        - color: red
          label: Deprecated, will be removed
      x-iam-actions:
        - name: metrics:apiovh:get
          required: true
      x-expanded-response: MetricsApiServiceWithIAM
      description: List available services (Deprecated, will be removed)
