components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    horizonView.DatacenterWithIAM:
      type: object
      description: Cloud Desktop Infrastructure Datacenter
      properties:
        activeDirectoryIP:
          description: IP of the VDI Active Directory
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        adminDomain:
          type: string
          description: Domain of the admin infrastructure
          readOnly: true
        adminNetworkNextHop:
          type: string
          description: Next hop to contact the private admin network
          readOnly: true
        adminPrivateNetwork:
          description: Private network of the admin infrastructure
          readOnly: true
          type: string
          format: ip-block
          example: 192.0.2.0/24
        customerIntercoIP:
          description: Customer interco IP allows you to communicate between your private infrastructure and your CDI infrastructure throw the vrack.
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        customerIntercoMask:
          description: Customer interco netmask allows you to communicate between your private infrastructure and your CDI infrastructure throw the vrack.
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        customerIntercoVlanId:
          type: integer
          description: Customer interco vlan allows you to communicate between your private infrastructure and your CDI infrastructure throw the vrack.
          readOnly: true
        datacenterId:
          type: integer
          description: Datacenter ids
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        name:
          type: string
          description: Name of the datacenter
          readOnly: true
        serviceName:
          type: string
          description: Domain of your Horizon
          readOnly: true
    horizonView.PoolType:
      type: string
      description: Pool type the customer can deploy
      enum:
        - hybridPool
        - privatePool
        - publicPool
    ipBlock:
      type: string
      description: IP (v4 or v6) CIDR notation (e.g., 192.0.2.0/24)
      format: ip-block
      example: 192.0.2.0/24
    ip:
      type: string
      description: IP address (e.g., 192.0.2.0)
      format: ipv4
      example: 192.0.2.0
    horizonView.Task:
      type: object
      description: Operation on a Horizon View component
      properties:
        description:
          type: string
          description: Current progress description
          nullable: true
          readOnly: true
        lastModificationDate:
          type: string
          description: Task last modification date
          nullable: true
          format: date-time
          readOnly: true
        name:
          type: string
          description: Task name
          readOnly: true
        progress:
          type: integer
          description: Current progress
          readOnly: true
        state:
          description: Current Task state
          readOnly: true
          type: string
          enum:
            - canceled
            - doing
            - done
            - error
            - fixing
            - toCancel
            - toCreate
            - todo
            - unknown
            - waitingForChilds
            - waitingTodo
        taskId:
          type: integer
          description: Task id
          readOnly: true
    horizonView.Pool:
      type: object
      description: All informations about access point
      properties:
        accessPointId:
          type: integer
          description: Pool id
          readOnly: true
        dhcpNetmask:
          description: DHCP netmask in this port group
          readOnly: true
