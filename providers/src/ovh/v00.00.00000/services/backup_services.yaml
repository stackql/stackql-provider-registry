      type: object
      description: Protection state of a virtual machine of the Hosted Private Cloud covered by the Managed Backup service
      properties:
        id:
          type: string
          description: vSphere managed object reference of the virtual machine, vm- prefix included, for example vm-4021. A restored virtual machine is a new vSphere object with a new identifier.
          readOnly: true
        lastBackupAt:
          type: string
          description: Date and time of the last backup cycle that included the virtual machine. Null when it has never been backed up.
          nullable: true
          format: date-time
          readOnly: true
        name:
          type: string
          description: Name of the virtual machine in vSphere at the last refresh
          readOnly: true
        protectionStatus:
          description: Indicates whether the virtual machine carries a valid vault tag. Independent of the result of its backups.
          readOnly: true
          type: string
          enum:
            - PROTECTED
            - UNPROTECTED
        refreshedAt:
          type: string
          description: Date and time when this entry was last refreshed from the backup platform
          format: date-time
          readOnly: true
        restorePointCount:
          type: integer
          description: Number of restore points currently held for the virtual machine. 0 when it has never been backed up.
          readOnly: true
        sizeBand:
          description: Billing size band validated at the last backup of the virtual machine. Null when no backup has been validated yet.
          nullable: true
          readOnly: true
          type: string
          enum:
            - MAX_1TB
            - MAX_250GB
            - MAX_2TB
            - MAX_4TB
            - MAX_6TB
            - MAX_8TB
        vaultLevel:
          description: Vault level resolved from the vSphere tag of the virtual machine at the last backup cycle. The tag category allows a single vault tag per virtual machine. Null when the virtual machine is unprotected.
          nullable: true
          readOnly: true
          type: string
          enum:
            - ADVANCED
            - PREMIUM
            - STANDARD
        vmSizeGb:
          type: integer
          description: Used size of the virtual machine in GB, measured at the last backup and used to compute its sizeBand. Null when no measurement is available yet.
          nullable: true
          readOnly: true
