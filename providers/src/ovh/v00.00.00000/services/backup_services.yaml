components:
  schemas:
    backup.reference.ManagedBackupVaultRegion:
      type: object
      description: Regions hosting the vaults of the Managed Backup service of a Hosted Private Cloud located in a given region, and the regions allowed for their replica. Static reference data, identical for every customer.
      properties:
        primaryRegionName:
          description: Region hosting the backup stack and the primary copy of the vaults for a Hosted Private Cloud located in this region, as reported in the vaultRegion of a Managed Backup service
          readOnly: true
          type: string
          enum:
            - af-north-lz-rba
            - ap-south-mum
            - ap-southeast-sgp
            - ap-southeast-syd
            - ca-east-bhs
            - ca-east-tor
            - eu-central-lz-buh
            - eu-central-lz-prg
            - eu-central-lz-sof
            - eu-central-waw
            - eu-north-lz-cph
            - eu-north-lz-hel
            - eu-north-lz-osl
