            - eu-south-lz-lis
            - eu-south-lz-mad
            - eu-south-lz-mil
            - eu-south-mil
            - eu-west-eri
            - eu-west-gra
            - eu-west-gra-snc
            - eu-west-lim
            - eu-west-lz-ams
            - eu-west-lz-bru
            - eu-west-lz-dln
            - eu-west-lz-lux
            - eu-west-lz-mnc
            - eu-west-lz-mrs
            - eu-west-lz-vie
            - eu-west-lz-zrh
            - eu-west-par
            - eu-west-rbx
            - eu-west-rbx-snc
            - eu-west-sbg
            - eu-west-sbg-snc
            - us-central-lz-slc
            - us-central-lz-stl
            - us-east-lz-atl
            - us-east-lz-bos
            - us-east-lz-chi
            - us-east-lz-dal
            - us-east-lz-mia
            - us-east-lz-nyc
            - us-east-vin
            - us-west-hil
            - us-west-lz-den
            - us-west-lz-lax
            - us-west-lz-pao
            - us-west-lz-phx
            - us-west-lz-sea
        secondaryRegions:
          type: array
          description: Regions that can be chosen as replication secondary site when ordering a Managed Backup service for a Hosted Private Cloud located in this region
          items:
            $ref: '#/components/schemas/backup.reference.ManagedBackupVaultRegionCandidate'
          readOnly: true
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value. Defaults to `EQ`.
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    backup.tenantWithIAM:
      type: object
      description: Backup tenant resource
      properties:
        createdAt:
          type: string
          description: Date and time the backup tenant is created
          format: date-time
          readOnly: true
        currentState:
          description: Current operational state of the backup tenant
          readOnly: true
          type: object
          properties:
            id:
              type: string
              description: Identifier of the backup tenant
              format: uuid
              readOnly: true
            name:
