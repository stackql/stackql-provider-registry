            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_cloud_project_service_name_kubeResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:kube/get
          required: true
      x-expanded-response: CloudKubeCluster
      operationId: get_v1_cloud_project_service_name_kube
      description: List your managed Kubernetes clusters
    post:
      summary: Create a new managed Kubernetes cluster
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloud.ProjectKubeCreation'
            examples:
              1-simple-cluster:
                value:
                  name: my-simple-kubernetes-cluster-gra11
                  nodepool:
                    desiredNodes: 3
                    flavorName: b3-8
                    name: my-nodepool
                  region: GRA11
                summary: Simple cluster on GRA11 with one nodepool, 3 nodes, latest version and default update policy (ALWAYS_UPDATE)
              2-intermediate-cluster:
                value:
                  name: my-intermediate-kubernetes-cluster-bhs5
                  nodepools:
                    - antiAffinity: true
                      desiredNodes: 3
                      flavorName: c3-64
                      maxNodes: 5
                      minNodes: 2
                      name: my-nodepool-cpu-workers
                    - antiAffinity: true
                      autoscale: true
                      desiredNodes: 3
                      flavorName: r3-128
                      name: my-nodepool-ram-workers
                  region: BHS5
                  updatePolicy: MINIMAL_DOWNTIME
                  version: '1.34'
                summary: Intermediate cluster on BHS5 with two nodepools, 3 nodes each at creation with anti-affinity and autoscaling, specific version and minimal downtime update policy
              3-complex-use-case-cluster:
                value:
                  customization:
                    apiServer:
                      admissionPlugins:
                        disabled:
                          - AlwaysPullImages
                        enabled:
                          - AlwaysPullImages
                    kubeProxy:
                      iptables:
                        minSyncPeriod: PT1S
                        syncPeriod: PT30S
                      ipvs:
                        minSyncPeriod: PT1S
                        scheduler: rr
                        syncPeriod: PT30S
                        tcpFinTimeout: PT1M
                        tcpTimeout: PT1M
                        udpTimeout: PT1M
                  kubeProxyMode: iptables
                  loadBalancersSubnetId: 19ae8a32-3a10-4000-8c58-fc25381faf80
                  name: my-multi-az-kubernetes-cluster
                  nodepools:
                    - antiAffinity: true
                      attachFloatingIps:
                        enabled: true
                      autoscale: true
                      autoscaling:
                        scaleDownUnneededTimeSeconds: 600
                        scaleDownUnreadyTimeSeconds: 1200
                        scaleDownUtilizationThreshold: 0.5
                      availabilityZones:
                        - eu-west-par-a
                      desiredNodes: 3
                      flavorName: c3-16
                      maxNodes: 5
                      minNodes: 1
                      monthlyBilled: false
                      name: my-nodepool-a
                      template:
                        metadata:
                          annotations:
                            my-annotation: my-value
                          finalizers: []
                          labels:
                            my-label: my-value
                        spec:
                          taints:
                            - effect: NoExecute
                              key: my-taint
                              value: my-value
                          unschedulable: false
                    - antiAffinity: true
                      autoscale: true
                      autoscaling:
                        scaleDownUnneededTimeSeconds: 600
                        scaleDownUnreadyTimeSeconds: 1200
                        scaleDownUtilizationThreshold: 0.5
                      availabilityZones:
                        - eu-west-par-b
                      desiredNodes: 3
                      flavorName: c3-16
                      maxNodes: 5
                      minNodes: 1
                      monthlyBilled: false
                      name: my-nodepool-b
                      template:
                        metadata:
                          annotations:
                            my-annotation: my-value
                          finalizers: []
                          labels:
                            my-label: my-value
                        spec:
                          taints:
                            - effect: NoExecute
                              key: my-taint
                              value: my-value
                          unschedulable: false
                    - antiAffinity: true
                      autoscale: true
                      autoscaling:
                        scaleDownUnneededTimeSeconds: 600
                        scaleDownUnreadyTimeSeconds: 1200
                        scaleDownUtilizationThreshold: 0.5
                      availabilityZones:
                        - eu-west-par-c
                      desiredNodes: 3
                      flavorName: c3-16
                      maxNodes: 5
                      minNodes: 1
                      monthlyBilled: false
                      name: my-nodepool-c
                      template:
                        metadata:
                          annotations:
                            my-annotation: my-value
                          finalizers:
                            - my-custom-finalizer
                          labels:
                            my-label: my-value
                        spec:
                          taints:
                            - effect: NoExecute
                              key: my-taint
                              value: my-value
                          unschedulable: false
                  nodesSubnetId: afe2b2a1-a706-4e18-88db-8cf101f0db98
                  plan: standard
                  privateNetworkConfiguration:
                    defaultVrackGateway: 192.168.1.1
                    privateNetworkRoutingAsDefault: true
                  privateNetworkId: 89368992-0468-481f-af9c-78fb9b066a6d
                  region: EU-WEST-PAR
                  updatePolicy: ALWAYS_UPDATE
                  version: '1.34'
                summary: Complex multi AZ Kubernetes cluster on EU-WEST-PAR with autoscaling, public node exposition and many parameters customized
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cloud.kube.Cluster'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
