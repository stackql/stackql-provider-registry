components:
  schemas:
    cloud.ProjectKubeCustomizationAPIServerAdmissionPluginsEnum:
      type: string
      description: Enum admission plugins
      enum:
        - AlwaysPullImages
        - NodeRestriction
    cloud.kube.Flavor:
      type: object
      description: a flavor kind
      properties:
        category:
          description: Flavor family
          readOnly: true
          type: string
          enum:
            - a
            - b
            - c
            - d
            - g
            - h
            - i
            - l
            - r
            - t
        gpus:
          type: integer
          description: Number of GPUs
          readOnly: true
        name:
          type: string
          description: Flavor name
          readOnly: true
        ram:
          type: integer
          description: Ram quantity (GB)
          readOnly: true
        state:
          description: Flavor state
          readOnly: true
          type: string
          enum:
            - available
            - unavailable
        vCPUs:
          type: integer
          description: Number of VCPUs
          readOnly: true
    dbaas.logs.LogKind:
      type: object
      description: Log kind
      properties:
        additionalReturnedFields:
          type: array
          description: List of additional log fields managed in this log kind
          items:
            type: string
          readOnly: true
        createdAt:
          type: string
          description: Creation date of the log kind
          format: date-time
          readOnly: true
        displayName:
          type: string
          description: Log kind display name
          readOnly: true
        kindId:
          type: string
          description: Log kind ID
          format: uuid
          readOnly: true
        name:
          type: string
          description: Log kind name
          readOnly: true
        updatedAt:
          type: string
          description: Last update date of the log kind
          format: date-time
          readOnly: true
    cloud.ProjectKubeCreation:
      type: object
      description: Missing description
      properties:
        customization:
          description: Kubernetes cluster customization
          nullable: true
          type: object
          properties:
            apiServer:
              description: Kubernetes cluster api server customization
              nullable: true
              type: object
              properties:
                admissionPlugins:
                  description: Kubernetes cluster api server admission plugins customization
                  nullable: true
                  type: object
                  properties:
                    disabled:
                      type: array
                      description: Array of disabled admission plugins
                      nullable: true
                      items:
                        $ref: '#/components/schemas/cloud.ProjectKubeCustomizationAPIServerAdmissionPluginsEnum'
                    enabled:
                      type: array
                      description: Array of enabled admission plugins
                      nullable: true
                      items:
                        $ref: '#/components/schemas/cloud.ProjectKubeCustomizationAPIServerAdmissionPluginsEnum'
            cilium:
              description: Kubernetes cluster cilium customization
              nullable: true
              type: object
              properties:
                clusterId:
                  type: integer
                  description: 'Cilium''s clusterID: must be between 1 and 255 if set (mandatory when using clusterMesh feature)'
                  nullable: true
                clusterMesh:
                  description: ClusterMesh customization.
                  nullable: true
                  type: object
                  properties:
                    apiServer:
                      description: API server customization
                      nullable: true
                      type: object
                      properties:
                        nodePort:
                          type: integer
                          description: Node port
                          nullable: true
                        serviceType:
                          description: Service type
