components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    saas.csp2.OfficeTenantWithIAM:
      type: object
      description: Office tenant
      properties:
        address:
          type: string
          description: Contact's address line
        city:
          type: string
          description: Contact's city
        creationDate:
          type: string
          description: Creation date
          format: date-time
          readOnly: true
        displayName:
          type: string
          description: Tenant's display name
        email:
          type: string
          description: Contact's email address
        firstName:
          type: string
          description: Contact's first name
        hasAcceptedNewMCA:
          type: boolean
          description: Whether or not the 2025 Microsoft Customer Agreement was properly accepted
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        lastName:
          type: string
          description: Contact's last name
        mpnId:
          type: string
          description: Microsoft Partner Network identifier linked to this tenant
          nullable: true
        mpnIssueFlag:
          type: string
          description: Code of any detected issue regarding the MPN Id
          nullable: true
          readOnly: true
        phone:
          description: Primary phone number
          type: string
          format: phone-number
        serviceName:
          type: string
          description: Internal service name
          readOnly: true
        status:
          description: Tenant's status
          readOnly: true
          type: string
          enum:
            - creating
            - inMaintenance
            - ok
            - reopening
            - suspended
            - suspending
        zipCode:
          type: string
          description: Contact's zip code
    saas.csp2.OfficeTenant:
      type: object
      description: Office tenant
      properties:
        address:
          type: string
          description: Contact's address line
        city:
          type: string
          description: Contact's city
        creationDate:
          type: string
          description: Creation date
          format: date-time
          readOnly: true
        displayName:
          type: string
          description: Tenant's display name
        email:
          type: string
          description: Contact's email address
        firstName:
          type: string
          description: Contact's first name
        hasAcceptedNewMCA:
          type: boolean
          description: Whether or not the 2025 Microsoft Customer Agreement was properly accepted
          readOnly: true
        lastName:
          type: string
          description: Contact's last name
        mpnId:
          type: string
          description: Microsoft Partner Network identifier linked to this tenant
          nullable: true
        mpnIssueFlag:
          type: string
          description: Code of any detected issue regarding the MPN Id
          nullable: true
          readOnly: true
        phone:
          description: Primary phone number
          type: string
          format: phone-number
        serviceName:
          type: string
          description: Internal service name
          readOnly: true
        status:
          description: Tenant's status
          readOnly: true
          type: string
          enum:
            - creating
            - inMaintenance
            - ok
            - reopening
            - suspended
            - suspending
        zipCode:
          type: string
          description: Contact's zip code
