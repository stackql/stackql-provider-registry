openapi: 3.0.0
info:
  title: OVHcloud Microsoft 365 (CSP2) API
  description: 'Microsoft 365 CSP2 tenants: subscriptions, usage statistics and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/saas/csp2
paths:
  /saas/csp2:
    get:
      summary: List tenants
      description: Returns the service names of the tenants. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_saas_csp2Response'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - General Information@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:get
          required: true
      x-expanded-response: SaasCsp2OfficeTenantWithIAM
      operationId: get_v1_saas_csp2
  /saas/csp2/{serviceName}:
    get:
      summary: Get a tenant
      description: Returns the display name, contact details, Microsoft Partner Network ID, status and creation date of the tenant, and whether the 2025 Microsoft Customer Agreement is accepted. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saas.csp2.OfficeTenantWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - General Information@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:get
          required: true
      operationId: get_v1_saas_csp2_service_name
    put:
      summary: Update a tenant
      description: Updates the display name, the contact details and the Microsoft Partner Network ID (`mpnId`) of the tenant. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/saas.csp2.OfficeTenant'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - General Information@@@30
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:put
          required: true
      operationId: put_v1_saas_csp2_service_name
  /saas/csp2/{serviceName}/billingPeriodPeaks:
    get:
      summary: Get billing period peaks
      description: Returns the start and end dates of the current billing period and, for each license, the maximum count of simultaneously activated licenses. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saas.csp2.BillingStatistics'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Usage@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:billingPeriodPeaks/get
          required: true
      operationId: get_v1_saas_csp2_service_name_billing_period_peaks
  /saas/csp2/{serviceName}/orderableLicenses:
    get:
      summary: List orderable licenses
      description: Returns the IDs of the licenses that can be ordered for the tenant. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_saas_csp2_service_name_orderable_licensesResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Licenses@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:orderableLicenses/get
          required: true
      x-expanded-response: SaasCsp2OfficeLicence
      operationId: get_v1_saas_csp2_service_name_orderable_licenses
  /saas/csp2/{serviceName}/orderableLicenses/{id}:
    get:
      summary: Get an orderable license
      description: Returns the name and type of the license, standalone or add-on, the maximum quantity that can be purchased, and whether it allows new subscriptions and new seats. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saas.csp2.OfficeLicence'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Licenses@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:orderableLicenses/get
          required: true
      operationId: get_v1_saas_csp2_service_name_orderable_licenses_id
  /saas/csp2/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The unique identifier of your Office service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - General Information@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: cspReseller:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_saas_csp2_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The unique identifier of your Office service
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - General Information@@@50
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: cspReseller:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_saas_csp2_service_name_service_infos
  /saas/csp2/{serviceName}/subscription:
    get:
      summary: List subscriptions
      description: Returns the IDs of the subscriptions of the tenant. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_saas_csp2_service_name_subscriptionResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Subscriptions@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:subscription/get
          required: true
      x-expanded-response: SaasCsp2OfficeSubscription
      operationId: get_v1_saas_csp2_service_name_subscription
    post:
      summary: Create a subscription
      description: Creates a subscription for `quantity` licenses of the license `licenseId`, and returns the task. Get the license IDs from orderableLicenses. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/saas.csp2.SubscriptionCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saas.csp2.OfficeTask'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Subscriptions@@@30
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:subscription/create
          required: true
      operationId: post_v1_saas_csp2_service_name_subscription
  /saas/csp2/{serviceName}/subscription/{id}:
    delete:
      summary: Delete a subscription
      description: Deletes the subscription from the tenant and returns the task. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saas.csp2.OfficeTask'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Subscriptions@@@40
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:subscription/delete
          required: true
      operationId: delete_v1_saas_csp2_service_name_subscription_id
    get:
      summary: Get a subscription
      description: Returns the license ID, number of licenses, status, and creation and last update dates of the subscription. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saas.csp2.OfficeSubscription'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Subscriptions@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:subscription/get
          required: true
      operationId: get_v1_saas_csp2_service_name_subscription_id
  /saas/csp2/{serviceName}/subscription/{id}/addonsSubscriptionIds:
    get:
      summary: List add-on subscriptions
      description: Returns the IDs of the add-on subscriptions attached to the subscription. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_saas_csp2_service_name_subscription_id_addons_subscription_idsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Subscriptions@@@50
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:subscription/addonsSubscriptionIds/get
          required: true
      operationId: get_v1_saas_csp2_service_name_subscription_id_addons_subscription_ids
  /saas/csp2/{serviceName}/subscription/{id}/availableAddonLicenses:
    get:
      summary: List available add-on licenses
      description: Returns the IDs of the licenses that can be ordered as an add-on for the subscription. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_saas_csp2_service_name_subscription_id_available_addon_licensesResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Subscriptions@@@60
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:subscription/availableAddonLicenses/get
          required: true
      operationId: get_v1_saas_csp2_service_name_subscription_id_available_addon_licenses
  /saas/csp2/{serviceName}/subscription/{id}/changeQuantity:
    post:
      summary: Change a subscription quantity
      description: Sets the number of seats of the subscription to `quantity`, and returns the task. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/saas.csp2.SubscriptionChangeQuantityCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saas.csp2.OfficeTask'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Subscriptions@@@70
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:subscription/changeQuantity
          required: true
      operationId: post_v1_saas_csp2_service_name_subscription_id_change_quantity
  /saas/csp2/{serviceName}/subscription/{id}/orderAddon:
    post:
      summary: Order an add-on subscription
      description: Creates an add-on subscription for the subscription, with `quantity` seats of the license `licenseId`, and returns the task. Get the license IDs from availableAddonLicenses. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/saas.csp2.SubscriptionOrderAddonCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saas.csp2.OfficeTask'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Subscriptions@@@80
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:subscription/orderAddon
          required: true
      operationId: post_v1_saas_csp2_service_name_subscription_id_order_addon
  /saas/csp2/{serviceName}/task:
    get:
      summary: List tasks
      description: Returns the IDs of the pending tasks of the tenant. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_saas_csp2_service_name_taskResponse'
      x-developer-hub-navigation:
