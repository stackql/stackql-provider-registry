      operationId: get_v1_saas_csp2_service_name_task
  /saas/csp2/{serviceName}/task/{id}:
    get:
      summary: Get a task
      description: Returns the function, status, creation date and completion date of the task. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saas.csp2.OfficeTask'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365 Resellers
          - Tasks@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: cspReseller:apiovh:task/get
          required: true
      operationId: get_v1_saas_csp2_service_name_task_id
  /saas/csp2/{serviceName}/usageStatistics:
    get:
      summary: Get usage statistics
      description: Returns, for each day of the `timePeriod` (last week, month, quarter or year), the peak and end-of-day counts of activated licenses, by license. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: query
          name: timePeriod
          description: The period to query
          required: true
          schema:
            $ref: '#/components/schemas/msServices.LicensePeriodEnum'
      responses:
        '200':
