          type: string
          description: key ID parameter used to match a specific key
          nullable: true
        kty:
          description: Key type parameter identifies the cryptographic algorithm family used with the key, such as RSA or EC
          type: string
          enum:
            - EC
            - RSA
            - oct
        'n':
          type: string
          description: The modulus value for the RSA public key
          nullable: true
        p:
          type: string
          description: The first prime factor of the RSA private key
          nullable: true
          format: password
        q:
          type: string
          description: The second prime factor of the RSA private key
          nullable: true
          format: password
        qi:
          type: string
          description: The CRT coefficient of the second factor of the RSA private key
          nullable: true
          format: password
        use:
          description: The intended use of the public key
          nullable: true
          type: string
          enum:
            - enc
            - sig
        x:
          type: string
          description: The x coordinate for the Elliptic Curve point
          nullable: true
        'y':
          type: string
          description: The y coordinate for the Elliptic Curve point
          nullable: true
      required:
        - kty
    okms.KeyDeactivationReasonEnum:
      type: string
      description: Key deactivation reason
      enum:
        - AFFILIATION_CHANGED
        - CA_COMPROMISE
        - CESSATION_OF_OPERATION
        - KEY_COMPROMISE
        - PRIVILEGE_WITHDRAWN
        - SUPERSEDED
        - UNSPECIFIED
    okms.KeyStateUpdateEnum:
      type: string
      description: The desired state of a key
      enum:
        - ACTIVE
        - COMPROMISED
        - DEACTIVATED
    iam.ResourceMetadata.StateEnum:
      type: string
      description: Resource state
      enum:
        - EXPIRED
        - IN_CREATION
        - OK
        - SUSPENDED
    okms.KeyAlgEnum:
      type: string
      description: Key algorithm
      enum:
        - ES256
        - ES384
        - ES512
        - PS256
        - PS384
        - PS512
        - RS256
        - RS384
        - RS512
    okms.KeyUseEnum:
