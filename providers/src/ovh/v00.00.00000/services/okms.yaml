        - in: path
          name: keyId
          description: Key ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: okmsId
          description: Okms ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/okms.serviceKey.Update'
            examples:
              Activate:
                value:
                  state: ACTIVE
              Deactivate:
                value:
                  deactivationReason: UNSPECIFIED
                  state: DEACTIVATED
              Deactivate (compromise):
                value:
                  deactivationReason: KEY_COMPROMISE
                  state: COMPROMISED
              Make the key extractable:
                value:
                  extractable: true
              Update name:
                value:
                  name: key name
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/okms.serviceKey.Response'
              examples:
                Simple example:
                  value:
                    alwaysSensitive: true
                    class: SECRET_KEY
                    consumerCount: 0
                    createdAt: '2024-10-10T15:20:23.337051+01:00'
                    extractable: false
                    id: 53b7b57c-fff7-45c3-8267-c32cd060577b
                    name: encryption-key
                    neverExtractable: true
                    operations:
                      - encrypt
                      - decrypt
                    protectionLevel: SOFTWARE
                    sensitive: true
                    size: 256
                    state: ACTIVE
                    type: oct
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::OKMSExpired:
                  value:
                    class: Client::BadRequest::OKMSExpired
                    message: This service is expired
                Client::BadRequest::ServiceKeyDeactivationReasonIncompatible:
                  value:
                    class: Client::BadRequest::ServiceKeyDeactivationReasonIncompatible
                    message: Parameter 'deactivationReason' is forbidden unless 'state' is COMPROMISED or DEACTIVATED
                Client::BadRequest::ServiceKeyDeactivationReasonIncompatibleReason:
                  value:
                    class: Client::BadRequest::ServiceKeyDeactivationReasonIncompatibleReason
                    message: Invalid combination of parameters 'state' and 'deactivationReason'
                Client::BadRequest::ServiceKeyDeactivationReasonRequired:
                  value:
                    class: Client::BadRequest::ServiceKeyDeactivationReasonRequired
                    message: Parameter 'deactivationReason' is required for 'state' COMPROMISED or DEACTIVATED
                Client::BadRequest::ServiceKeyNameInvalidCharacter:
                  value:
                    class: Client::BadRequest::ServiceKeyNameInvalidCharacter
                    message: Invalid parameter 'name', expected only ASCII characters
                Client::BadRequest::ServiceKeyNameMaxExceeded:
                  value:
                    class: Client::BadRequest::ServiceKeyNameMaxExceeded
                    message: Invalid parameter 'name', it should not exceed '{{.paramValue}}' characters
                Client::BadRequest::ServiceKeyNameMinRequired:
                  value:
                    class: Client::BadRequest::ServiceKeyNameMinRequired
                    message: Invalid parameter 'name', it should have at least '{{.paramValue}}' characters
      tags:
        - Service Keys
      x-developer-hub-navigation:
        - - Security
          - Key and Secret Manager
          - Keys@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: okms:apiovh:serviceKey/update
          required: true
        - name: okms:apiovh:serviceKey/activate
          description: Required when activating the service key
          required: false
        - name: okms:apiovh:serviceKey/deactivate
          description: Required when deactivating the service key
          required: false
