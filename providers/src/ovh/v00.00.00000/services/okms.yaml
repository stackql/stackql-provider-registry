openapi: 3.0.0
info:
  title: OVHcloud Key Management Service API
  description: 'OVHcloud Key Management Service (OKMS): resources, service keys, credentials and secrets.'
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/okms
paths:
  /okms/reference/regions:
    get:
      operationId: getOkmsReferenceRegions
      summary: List regions
      description: Returns the regions where a service can be ordered, with their certifications and the KMIP and REST endpoints of each.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOkmsReferenceRegionsResponse'
              examples:
                Get region information example:
                  value:
                    - certifications:
                        - PCI_DSS
                      id: eu-west-rbx
                      kmipEndpoint: example.org:5697
                      restEndpoint: https://example.org
                      type: REGION-1-AZ
                  summary: Response body containing region information
      tags:
        - Reference
      x-developer-hub-navigation:
        - - Security
          - Key and Secret Manager
          - References@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: id
  /okms/reference/secretConfig:
    get:
      operationId: getOkmsReferenceSecretConfig
      summary: Get the default secret configuration
      description: 'Returns the default secret settings of a region: whether `cas` is required and the number of versions to keep.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: region
          description: OKMS Region
          required: true
          schema:
            $ref: '#/components/schemas/okms.RegionEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/okms.reference.secretConfig.Response'
              examples:
                Get secret engine default configuration:
                  value:
                    casRequired: false
                    maxVersions: 10
                  summary: Response body containing secret engine default configuration
      tags:
        - Reference
      x-developer-hub-navigation:
        - - Security
          - Key and Secret Manager
          - References@@@20
      x-badges:
        - color: green
          label: Stable production version
  /okms/reference/serviceKey:
    get:
      operationId: getOkmsReferenceServiceKey
      summary: Get valid service key parameters combinations
      description: Returns the valid combinations of key type, size, curve, operations and protection level for a region. Use it before creating or importing a service key.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: region
          description: OKMS Region
          required: true
          schema:
            $ref: '#/components/schemas/okms.RegionEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOkmsReferenceServiceKeyResponse'
              examples:
                Get service key type, size, curve and operations combination:
                  value:
                    - curves: []
                      default: true
                      operations:
                        - default: true
                          value:
                            - encrypt
                            - decrypt
                        - default: false
                          value:
                            - wrapKey
                            - unwrapKey
                      protectionLevel:
                        - default: true
                          value: SOFTWARE
                        - default: false
                          value: HSM
                      sizes:
                        - default: false
                          value: 128
                        - default: false
                          value: 192
                        - default: true
                          value: 256
                      type: oct
                    - curves:
                        - default: true
                          value: P-256
                        - default: false
                          value: P-384
                        - default: false
                          value: P-521
                      default: false
                      operations:
                        - default: true
                          value:
                            - sign
                            - verify
                      protectionLevel:
                        - default: true
                          value: SOFTWARE
                        - default: false
                          value: HSM
                      sizes: []
                      type: EC
                    - curves: []
                      default: false
                      operations:
                        - default: true
                          value:
                            - sign
                            - verify
                      protectionLevel:
                        - default: true
                          value: SOFTWARE
                        - default: false
                          value: HSM
                      sizes:
                        - default: true
                          value: 2048
                        - default: false
                          value: 3072
                        - default: false
                          value: 4096
                      type: RSA
                  summary: Response body containing service key type, size, curve and operations combination
      tags:
        - Reference
      x-developer-hub-navigation:
        - - Security
          - Key and Secret Manager
          - References@@@30
      x-badges:
        - color: green
          label: Stable production version
  /okms/resource:
    get:
      operationId: getAllOkmsServices
      summary: List OKMS services
      description: Returns the OKMS services of the account, with their region, KMIP and REST endpoints, and counts of keys, secrets and KMIP objects.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllOkmsServicesResponse'
              examples:
                Simple example:
                  value:
                    - id: 699048b5-e49e-4869-98a6-5bae91444db1
                      kmipEndpoint: example.org:5696
                      kmipObjectCount: 5
                      kmipRsaEndpoint: example.org:5697
                      pciDssEnabled: false
                      region: eu-west-rbx
                      restEndpoint: https://example.org
                      secretCount: 2
                      secretVersionCount: 3
                      serviceKeyCount: 3
                      serviceKeyCountDetails:
                        hsm: 1
                        software: 2
                      swaggerEndpoint: https://swagger.example.org
                    - id: a39652b2-5e02-4fef-9d78-ae67fec4d46e
                      kmipEndpoint: example.org:5696
                      kmipObjectCount: 0
                      kmipRsaEndpoint: example.org:5697
                      pciDssEnabled: false
                      region: eu-west-sbg
                      restEndpoint: https://example.org
                      secretCount: 0
                      secretVersionCount: 0
                      serviceKeyCount: 1
                      serviceKeyCountDetails:
                        hsm: 0
                        software: 1
                      swaggerEndpoint: https://swagger.example.org
      tags:
        - Resources
      x-developer-hub-navigation:
        - - Security
          - Key and Secret Manager@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: okms:apiovh:resource/get
          required: true
      x-expanded-response: OkmsResourceResponseWithIAM
  /okms/resource/{okmsId}:
    get:
      operationId: getOkmsService
      summary: Get an OKMS service
      description: Returns the OKMS service with its endpoints and resource counts. Set `publicCA` to true to include the KMS public CA certificate.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: okmsId
          description: Okms ID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: publicCA
          description: Add KMS public CA (Certificate Authority) in the output
          schema:
            type: boolean
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/okms.resource.ResponseWithIAM'
              examples:
                Simple example:
                  value:
                    id: 699048b5-e49e-4869-98a6-5bae91444db1
                    kmipEndpoint: example.org:5696
                    kmipObjectCount: 5
                    kmipRsaEndpoint: example.org:5697
                    pciDssEnabled: false
                    region: eu-west-rbx
                    restEndpoint: https://example.org
                    secretCount: 2
                    secretVersionCount: 8
                    serviceKeyCount: 3
                    serviceKeyCountDetails:
                      hsm: 1
                      software: 2
                    swaggerEndpoint: https://swagger.example.org
      tags:
        - Resources
      x-developer-hub-navigation:
        - - Security
          - Key and Secret Manager@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: okms:apiovh:resource/get
          required: true
    put:
      operationId: editOkmsService
      summary: Update an OKMS service
      description: Enables or disables PCI-DSS enforcement on the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: okmsId
          description: Okms ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/okms.resource.UpdateRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/okms.resource.Response'
              examples:
                Simple example:
                  value:
                    id: 699048b5-e49e-4869-98a6-5bae91444db1
                    kmipEndpoint: example.org:5696
                    kmipObjectCount: 5
                    kmipRsaEndpoint: example.org:5697
                    pciDssEnabled: true
                    pciDssEnabledAt: '2025-10-10T15:20:23.337051+01:00'
                    region: eu-west-rbx
                    restEndpoint: https://example.org
                    secretCount: 2
                    secretVersionCount: 8
                    serviceKeyCount: 3
                    serviceKeyCountDetails:
                      hsm: 1
                      software: 2
                    swaggerEndpoint: https://swagger.example.org
      tags:
        - Resources
      x-developer-hub-navigation:
        - - Security
          - Key and Secret Manager@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: okms:apiovh:resource/update
          required: true
  /okms/resource/{okmsId}/credential:
    get:
      operationId: getAllOkmsCredentials
      summary: List access credentials
      description: Returns the access credentials of the service, with their identity, status and expiry. Private keys are never returned.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: okmsId
          description: Okms ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
