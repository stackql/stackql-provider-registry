openapi: 3.0.0
info:
  title: OVHcloud New Account API
  description: Customer account creation and its reference data (countries, legal forms, creation rules, contracts).
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/newAccount
paths:
  /newAccount:
    post:
      summary: Create a new OVH identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                area:
                  type: string
                birthCity:
                  type: string
                birthDay:
                  type: string
                city:
                  type: string
                companyNationalIdentificationNumber:
                  type: string
                corporationType:
                  type: string
                country:
                  $ref: '#/components/schemas/nichandle.CountryEnum'
                einvoicingBillingAddress:
                  type: string
                email:
                  type: string
                fax:
                  type: string
                firstname:
                  type: string
                italianSDI:
                  type: string
                language:
                  $ref: '#/components/schemas/nichandle.LanguageEnum'
                legalform:
                  $ref: '#/components/schemas/nichandle.LegalFormEnum'
                name:
                  type: string
                nationalIdentificationNumber:
                  type: string
                organisation:
                  type: string
                ovhCompany:
                  $ref: '#/components/schemas/nichandle.OvhCompanyEnum'
                ovhSubsidiary:
                  $ref: '#/components/schemas/nichandle.OvhSubsidiaryEnum'
                phone:
                  type: string
                phoneCountry:
                  $ref: '#/components/schemas/nichandle.CountryEnum'
                phoneType:
                  $ref: '#/components/schemas/nichandle.PhoneTypeEnum'
                purposeOfPurchase:
                  type: string
                sex:
                  $ref: '#/components/schemas/nichandle.GenderEnum'
                spareEmail:
                  type: string
                vat:
                  type: string
                zip:
                  type: string
              required:
                - country
                - email
                - legalform
                - ovhCompany
                - ovhSubsidiary
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nichandle.NewAccountAndToken'
      x-badges:
        - color: green
          label: Stable production version
      operationId: post_v1_new_account
      description: Create a new OVH identifier
  /newAccount/area:
    get:
      summary: All available areas for a given country
      parameters:
        - in: query
          name: country
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.CountryEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_new_account_areaResponse'
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_new_account_area
      description: All available areas for a given country
  /newAccount/contracts:
    get:
      summary: Returns the contracts that governs the creation of an OVH identifier
      parameters:
        - in: query
          name: company
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.OvhCompanyEnum'
        - in: query
          name: subsidiary
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.OvhSubsidiaryEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_new_account_contractsResponse'
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_new_account_contracts
      description: Returns the contracts that governs the creation of an OVH identifier
  /newAccount/corporationType:
    get:
      summary: All available corporation types for a given country
      parameters:
        - in: query
          name: country
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.CountryEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_new_account_corporation_typeResponse'
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_new_account_corporation_type
      description: All available corporation types for a given country
  /newAccount/countries:
    get:
      summary: All available countries for an ovh company and an ovh subsidiary
      parameters:
        - in: query
          name: ovhCompany
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.OvhCompanyEnum'
        - in: query
          name: ovhSubsidiary
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.OvhSubsidiaryEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_new_account_countriesResponse'
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_new_account_countries
      description: All available countries for an ovh company and an ovh subsidiary
  /newAccount/creationRules:
    get:
      summary: Give all the rules to follow in order to create an OVH identifier
      parameters:
        - in: query
          name: country
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.CountryEnum'
        - in: query
          name: legalform
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.LegalFormEnum'
        - in: query
          name: ovhCompany
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.OvhCompanyEnum'
        - in: query
          name: ovhSubsidiary
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.OvhSubsidiaryEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nichandle.CreationRules'
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_new_account_creation_rules
      description: Give all the rules to follow in order to create an OVH identifier
  /newAccount/legalform:
    get:
      summary: All available legal forms for a given country
      parameters:
        - in: query
          name: country
          required: true
          schema:
            $ref: '#/components/schemas/nichandle.CountryEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_new_account_legalformResponse'
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_new_account_legalform
      description: All available legal forms for a given country
  /newAccount/rules:
    post:
      summary: Give all the rules to follow in order to create and update an OVH identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  $ref: '#/components/schemas/nichandle.CreationRulesActionEnum'
                address:
                  type: string
                area:
                  type: string
                birthCity:
                  type: string
                birthDay:
                  type: string
                city:
                  type: string
                companyNationalIdentificationNumber:
                  type: string
                corporationType:
                  type: string
                country:
                  $ref: '#/components/schemas/nichandle.CountryEnum'
                einvoicingBillingAddress:
                  type: string
                email:
                  type: string
                fax:
                  type: string
                firstname:
                  type: string
                italianSDI:
                  type: string
                language:
                  $ref: '#/components/schemas/nichandle.LanguageEnum'
                legalform:
                  $ref: '#/components/schemas/nichandle.LegalFormEnum'
                name:
                  type: string
                nationalIdentificationNumber:
                  type: string
                organisation:
                  type: string
                ovhCompany:
                  $ref: '#/components/schemas/nichandle.OvhCompanyEnum'
                ovhSubsidiary:
                  $ref: '#/components/schemas/nichandle.OvhSubsidiaryEnum'
                phone:
                  type: string
                phoneCountry:
                  $ref: '#/components/schemas/nichandle.CountryEnum'
                phoneType:
                  $ref: '#/components/schemas/nichandle.PhoneTypeEnum'
                purposeOfPurchase:
                  type: string
                sex:
                  $ref: '#/components/schemas/nichandle.GenderEnum'
                spareEmail:
                  type: string
                vat:
                  type: string
                zip:
                  type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_new_account_rulesResponse'
      x-badges:
        - color: green
          label: Stable production version
      operationId: post_v1_new_account_rules
      description: Give all the rules to follow in order to create and update an OVH identifier
