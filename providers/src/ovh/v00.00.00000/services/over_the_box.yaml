openapi: 3.0.0
info:
  title: OVHcloud OverTheBox API
  description: 'OverTheBox services: devices, remote accesses, backups, logs and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/overTheBox
paths:
  /overTheBox:
    get:
      summary: List OverTheBox services
      description: Returns the names of the OverTheBox services of the account. Each name is the serviceName used by the other OverTheBox calls.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_over_the_boxResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Service@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:get
          required: true
      x-expanded-response: OtbServiceWithIAM
      operationId: get_v1_over_the_box
  /overTheBox/availableOffers:
    get:
      summary: List the OverTheBox offers available to order
      description: List the OverTheBox offers available to order. Returns the names of the offers that can be ordered for a new OverTheBox service.
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_over_the_box_available_offersResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Offer@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:overTheBox/availableOffers/get
          required: true
      operationId: get_v1_over_the_box_available_offers
  /overTheBox/devices:
    post:
      summary: List the devices available for registration
      description: List the devices available for registration. Returns the devices seen from the IP address of the call, with their ID, last seen date and whether each one is already activated.
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_over_the_box_devicesResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:overTheBox/devices/create
          required: true
      operationId: post_v1_over_the_box_devices
  /overTheBox/hardware:
    get:
      summary: List OverTheBox hardware
      description: List OverTheBox hardware. Returns the names of the OverTheBox hardware of the account. Get a hardware for its model, serial and MAC address.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_over_the_box_hardwareResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Hardware@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBoxHardware:apiovh:get
          required: true
      x-expanded-response: OverTheBoxHardwareWithIAM
      operationId: get_v1_over_the_box_hardware
  /overTheBox/hardware/available:
    get:
      summary: List the hardware available for a service
      description: List the hardware available for a service. Returns the names of the OverTheBox hardware of the account that can be linked to a service.
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_over_the_box_hardware_availableResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Hardware@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:overTheBoxHardware/available/get
          required: true
      operationId: get_v1_over_the_box_hardware_available
  /overTheBox/hardware/{hardwareName}:
    get:
      summary: Get an OverTheBox hardware
      description: Get an OverTheBox hardware. Returns the name, model, serial and MAC address of a hardware, and whether it can be linked to a service without a device ID.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: hardwareName
          description: The internal name of your hardware
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/overTheBox.HardwareWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Hardware@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBoxHardware:apiovh:get
          required: true
      operationId: get_v1_over_the_box_hardware_hardware_name
  /overTheBox/{serviceName}:
    delete:
      summary: Resiliate an OverTheBox service
      description: Resiliate an OverTheBox service. Requests the resiliation of the service. Cancel it with cancelResiliation while it is not effective.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Service@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:delete
          required: true
      operationId: delete_v1_over_the_box_service_name
    get:
      summary: Get an OverTheBox service
      description: Returns the service status, offer and bandwidth, its operation, tunnel and configuration modes, release channel, IPv6, autoMTU and auto upgrade settings, and the endpoint to query its metrics.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/otb.serviceWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Service@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:get
          required: true
      operationId: get_v1_over_the_box_service_name
    put:
      summary: Update an OverTheBox service
      description: 'Update an OverTheBox service. Changes the settings that can be modified: the customer description, the release channel and the device auto upgrade.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/overTheBox.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Service@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:put
          required: true
      operationId: put_v1_over_the_box_service_name
  /overTheBox/{serviceName}/autoMTU:
    put:
      summary: Update the autoMTU of an OverTheBox service
      description: Update the autoMTU of an OverTheBox service. Enables or disables the automatic detection of the MTU on the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mtuAuto:
                  description: Enable or disable autoMTU
                  $ref: '#/components/schemas/overTheBox.AvailableStatusEnum'
              required:
                - mtuAuto
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Service
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:autoMTU/edit
          required: true
      operationId: put_v1_over_the_box_service_name_auto_mtu
  /overTheBox/{serviceName}/availableOperationModes:
    get:
      summary: List the operation modes of an OverTheBox service
      description: List the operation modes of an OverTheBox service. Returns the operation modes the service can switch to with the operationMode call. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_over_the_box_service_name_available_operation_modesResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Service
          - Operation Mode@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: overTheBox:apiovh:availableOperationModes/get
          required: true
      operationId: get_v1_over_the_box_service_name_available_operation_modes
  /overTheBox/{serviceName}/availableReleaseChannels:
    get:
      summary: List the release channels of an OverTheBox service
      description: List the release channels of an OverTheBox service. Returns the release channels the service can use to receive the device updates.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_over_the_box_service_name_available_release_channelsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Service
          - Release Channel
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:availableReleaseChannels/get
          required: true
      operationId: get_v1_over_the_box_service_name_available_release_channels
  /overTheBox/{serviceName}/backups:
    get:
      summary: List the backups of an OverTheBox service
      description: List the backups of an OverTheBox service. Returns the IDs of the configuration backups of the device of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_over_the_box_service_name_backupsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device
          - Backups@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:backups/get
          required: true
      x-expanded-response: OverTheBoxBackup
      operationId: get_v1_over_the_box_service_name_backups
  /overTheBox/{serviceName}/backups/{backupId}:
    delete:
      summary: Delete a backup of an OverTheBox service
      description: Delete a backup of an OverTheBox service. Removes the configuration backup. It can no longer be restored on the device.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: backupId
          description: The id of the backup
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device
          - Backups@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:backups/delete
          required: true
      operationId: delete_v1_over_the_box_service_name_backups_backup_id
    get:
      summary: Get a backup of an OverTheBox service
      description: Get a backup of an OverTheBox service. Returns the creation date of a configuration backup and the ID of the device action that triggered it.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: backupId
          description: The id of the backup
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/overTheBox.Backup'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device
          - Backups@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:backups/get
          required: true
      operationId: get_v1_over_the_box_service_name_backups_backup_id
  /overTheBox/{serviceName}/cancelResiliation:
    post:
      summary: Cancel the resiliation of an OverTheBox service
      description: Cancel the resiliation of an OverTheBox service. Cancels the resiliation requested on the service, which stays active.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Offer@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:cancelResiliation
          required: true
      operationId: post_v1_over_the_box_service_name_cancel_resiliation
  /overTheBox/{serviceName}/changeContact:
    post:
      summary: Change service contacts
      description: Change service contacts. Starts a procedure to change the admin, tech or billing contact of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactAdmin:
                  type: string
                  description: The contact to set as admin contact
                contactBilling:
                  type: string
                  description: The contact to set as billing contact
                contactTech:
                  type: string
                  description: The contact to set as tech contact
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_over_the_box_service_name_change_contactResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Offer@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:changeContact
          required: true
      operationId: post_v1_over_the_box_service_name_change_contact
  /overTheBox/{serviceName}/device:
    delete:
      summary: Unlink the device of an OverTheBox service
      description: Unlink the device of an OverTheBox service. Removes the association between the device and the service. Link another device with linkDevice.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:device/delete
          required: true
      operationId: delete_v1_over_the_box_service_name_device
    get:
      summary: Get the device of an OverTheBox service
      description: Get the device of an OverTheBox service. Returns the device ID, version, system information, public IP, network interfaces, last seen date and whether an update is available.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/overTheBox.Device'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:device/get
          required: true
      operationId: get_v1_over_the_box_service_name_device
  /overTheBox/{serviceName}/device/actions:
    get:
      summary: List the actions of an OverTheBox device
      description: List the actions of an OverTheBox device. Returns the IDs of the actions scheduled on the device, which can be filtered by status and name.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: name
          description: Filter the value of name property (=)
          schema:
            type: string
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
        - in: query
          name: status
          description: Filter the value of status property (=)
          schema:
            $ref: '#/components/schemas/overTheBox.ActionStatusEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_over_the_box_service_name_device_actionsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device
          - Actions@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:device/actions/get
          required: true
      x-expanded-response: OverTheBoxDeviceAction
      operationId: get_v1_over_the_box_service_name_device_actions
    post:
      summary: Create an action on an OverTheBox device
      description: Create an action on an OverTheBox device. Schedules one of the available device actions, given by its name, and returns the created action.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the action
              required:
                - name
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/overTheBox.DeviceAction'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device
          - Actions@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:device/actions/create
          required: true
      operationId: post_v1_over_the_box_service_name_device_actions
  /overTheBox/{serviceName}/device/actions/{actionId}:
    get:
      summary: Get an action of an OverTheBox device
      description: Get an action of an OverTheBox device. Returns the name, status, details and the creation, update and execution dates of an action of the device.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: actionId
          description: The id of the action
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/overTheBox.DeviceAction'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device
          - Actions@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:device/actions/get
          required: true
      operationId: get_v1_over_the_box_service_name_device_actions_action_id
  /overTheBox/{serviceName}/device/availableActions:
    get:
      summary: List the actions available on an OverTheBox device
      description: List the actions available on an OverTheBox device. Returns the name and description of each action that can be created on the device.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_over_the_box_service_name_device_available_actionsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device
          - Actions@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:device/availableActions/get
          required: true
      operationId: get_v1_over_the_box_service_name_device_available_actions
  /overTheBox/{serviceName}/device/backup:
    post:
      summary: Back up an OverTheBox device
      description: Back up an OverTheBox device. Creates the device action that generates a configuration backup of the device, and returns that action.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/overTheBox.DeviceAction'
      x-developer-hub-navigation:
        - - Web Cloud
          - OverTheBox
          - Device
          - Backups@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: overTheBox:apiovh:device/backup/create
          required: true
      operationId: post_v1_over_the_box_service_name_device_backup
  /overTheBox/{serviceName}/device/hardware:
    get:
      summary: Get an OverTheBox hardware
      description: Get an OverTheBox hardware. Returns the name, model, serial and MAC address of a hardware, and whether it can be linked to a service without a device ID.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your overTheBox offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/overTheBox.Hardware'
