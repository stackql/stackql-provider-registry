openapi: 3.0.0
info:
  title: OVHcloud Zimbra API
  description: 'Zimbra email platforms: organizations, domains, accounts, aliases, redirections and mailing lists.'
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/zimbra
paths:
  /zimbra/platform:
    get:
      operationId: getAllZimbraPlatforms
      summary: List platforms
      description: Returns the platforms of the account with their current state. Filter them by `projectId`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: query
          name: projectId
          description: Identifier of the project
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllZimbraPlatformsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Platforms@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/get
          required: true
      x-expanded-response: ZimbraPlatformResponseWithIAM
  /zimbra/platform/{platformId}:
    get:
      operationId: getZimbraPlatform
      summary: Get a platform
      description: Returns the name and description of the platform, its number of organizations, its storage quota per account and its account statistics per offer.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zimbra.PlatformResponseWithIAM'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::PlatformNotFound:
                  value:
                    class: Client::NotFound::PlatformNotFound
                    message: The platform was not found
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Platforms@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/get
          required: true
    put:
      operationId: editZimbraPlatform
      summary: Update a platform
      description: Updates the name or description of the platform. When set, `checksum` must match the current checksum of the platform, otherwise the update is rejected.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/zimbra.PlatformPutPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zimbra.PlatformResponse'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::PlatformNotFound:
                  value:
                    class: Client::NotFound::PlatformNotFound
                    message: The platform was not found
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::UndesiredObjectStatus:
                  value:
                    class: Client::Conflict::UndesiredObjectStatus
                    message: The object is in an undesired status
        '412':
          description: Error 412 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::PreconditionFailed::InvalidChecksum:
                  value:
                    class: Client::PreconditionFailed::InvalidChecksum
                    message: The checksum is invalid because the object has expired
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Platforms@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/edit
          required: true
  /zimbra/platform/{platformId}/account:
    get:
      operationId: getAllZimbraAccounts
      summary: List email accounts
      description: Returns the email accounts of the platform with their current state. Filter them by `organizationId`, `organizationLabel`, `domainId`, `email` or `offer`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: domainId
          description: Filter by Domain identifier
          schema:
            type: string
            format: uuid
        - in: query
          name: email
          description: Filter by email
          schema:
            type: string
        - in: query
          name: offer
          description: Filter by offer
          schema:
            $ref: '#/components/schemas/zimbra.OfferEnum'
        - in: query
          name: organizationId
          description: Filter by organization identifier
          schema:
            type: string
            format: uuid
        - in: query
          name: organizationLabel
          description: Filter by organization label
          schema:
            type: string
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllZimbraAccountsResponse'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::CannotFilterByOffer:
                  value:
                    class: Client::BadRequest::CannotFilterByOffer
                    message: Filtering by this offer is not yet possible
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::PlatformNotFound:
                  value:
                    class: Client::NotFound::PlatformNotFound
                    message: The platform was not found
      tags:
        - Account
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Accounts@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/account/get
          required: true
      x-response-identifier: id
      x-expanded-response: ZimbraAccountResponse
    post:
      operationId: createZimbraAccount
      summary: Create an email account
      description: 'Creates an email account from its `email`, `password`, `offer` and `slotId`. The domain must be ready and the slot must match the offer. Creation is asynchronous: follow `resourceStatus` and `currentTasks`.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/zimbra.AccountPostPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zimbra.AccountResponse'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::AccountEmailContainForbiddenCharacter:
                  value:
                    class: Client::BadRequest::AccountEmailContainForbiddenCharacter
                    message: 'The account name contains one or more forbidden characters; it should match: {{.REGEX_EMAIL}}'
                Client::BadRequest::AccountSlotHasWrongOffer:
                  value:
                    class: Client::BadRequest::AccountSlotHasWrongOffer
                    message: The account slot offer does not correspond to the requested offer
                Client::BadRequest::DomainNotReady:
                  value:
                    class: Client::BadRequest::DomainNotReady
                    message: The domain is not in ready status
                Client::BadRequest::InvalidPasswordNotMatchingPolicy:
                  value:
                    class: Client::BadRequest::InvalidPasswordNotMatchingPolicy
                    message: Your password does not match the policy
                Client::BadRequest::NoSlotAvailable:
                  value:
                    class: Client::BadRequest::NoSlotAvailable
                    message: There is no available slot to create an account
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::DomainNotFound:
                  value:
                    class: Client::NotFound::DomainNotFound
                    message: The domain was not found with the provided criteria
                Client::NotFound::OrganizationNotFound:
                  value:
                    class: Client::NotFound::OrganizationNotFound
                    message: The organization was not found
                Client::NotFound::SlotNotFound:
                  value:
                    class: Client::NotFound::SlotNotFound
                    message: The slot was not found
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::AccountEmailAddressAlreadyUsed:
                  value:
                    class: Client::Conflict::AccountEmailAddressAlreadyUsed
                    message: The email address for your account is already used; check existing mailbox, alias, redirection, or mailing list name
                Client::Conflict::AccountSlotInUndesiredStatus:
                  value:
                    class: Client::Conflict::AccountSlotInUndesiredStatus
                    message: The chosen slot is in an undesired status
                Client::Conflict::AccountSlotIsAlreadyUsed:
                  value:
                    class: Client::Conflict::AccountSlotIsAlreadyUsed
                    message: The chosen slot for an account was already reserved by another request; please retry
      tags:
        - Account
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Accounts@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/account/create
          required: true
  /zimbra/platform/{platformId}/account/{accountId}:
    delete:
      operationId: deleteZimbraAccount
      summary: Delete an email account
      description: Deletes the email account. An account blocked for spam cannot be deleted.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: accountId
          description: Account ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
      tags:
        - Account
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Accounts@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/account/delete
          required: true
    get:
      operationId: getZimbraAccount
      summary: Get an email account
      description: Returns the email address, offer, slot, quota usage, contact information and detailed status of the email account, with its ongoing tasks.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: accountId
          description: Account ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zimbra.AccountResponse'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::MultipleAccountsFoundWithSameID:
                  value:
                    class: Client::BadRequest::MultipleAccountsFoundWithSameID
                    message: Multiple accounts were found with the requested ID
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::AccountNotFound:
                  value:
                    class: Client::NotFound::AccountNotFound
                    message: The account was not found
                Client::NotFound::PlatformNotFound:
                  value:
                    class: Client::NotFound::PlatformNotFound
                    message: The platform was not found
      tags:
        - Account
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Accounts@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/account/get
          required: true
      x-response-identifier: id
    put:
      operationId: editZimbraAccount
      summary: Update an email account
      description: Updates the email address, password, names, contact information, visibility in the global address list (`hideInGal`) or quota limit of the email account. When set, `checksum` must match the current checksum of the account, otherwise the update is rejected.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: accountId
          description: Account ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/zimbra.AccountPutPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zimbra.AccountResponse'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::MultipleDomainsFound:
                  value:
                    class: Client::BadRequest::MultipleDomainsFound
                    message: Multiple domains were found when only one was expected
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::AccountNotFound:
                  value:
                    class: Client::NotFound::AccountNotFound
                    message: The account was not found
                Client::NotFound::DomainNotFound:
                  value:
                    class: Client::NotFound::DomainNotFound
                    message: The domain was not found with the provided criteria
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::Conflict::AccountEmailAddressAlreadyUsed:
                  value:
                    class: Client::Conflict::AccountEmailAddressAlreadyUsed
                    message: The email address for your account is already used; check existing mailbox, alias, redirection, or mailing list name
                Client::Conflict::DomainNotReady:
                  value:
                    class: Client::Conflict::DomainNotReady
                    message: The domain is not in ready status
                Client::Conflict::UndesiredObjectStatus:
                  value:
                    class: Client::Conflict::UndesiredObjectStatus
                    message: The object is in an undesired status
        '412':
          description: Error 412 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::PreconditionFailed::InvalidChecksum:
                  value:
                    class: Client::PreconditionFailed::InvalidChecksum
                    message: The checksum is invalid because the object has expired
      tags:
        - Account
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Accounts@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/account/edit
          required: true
  /zimbra/platform/{platformId}/alias:
    get:
      operationId: getAllZimbraAliases
      summary: List aliases
      description: Returns the aliases of the platform with their target. Filter them by `alias`, `aliasTargetId`, `aliasOrganizationId` or `aliasOrganizationLabel`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: alias
          description: Filter by the alias email
          schema:
            type: string
        - in: query
          name: aliasOrganizationId
          description: Filter by organization identifier of the aliases
          schema:
            type: string
        - in: query
          name: aliasOrganizationLabel
          description: Filter by organization label of the aliases
          schema:
            type: string
        - in: query
          name: aliasTargetId
          description: Filter by the targeted email account identifier
          schema:
            type: string
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllZimbraAliasesResponse'
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::OrganizationNotFound:
                  value:
                    class: Client::NotFound::OrganizationNotFound
                    message: The organization was not found
                Client::NotFound::PlatformNotFound:
                  value:
                    class: Client::NotFound::PlatformNotFound
                    message: The platform was not found
      tags:
        - Account
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Aliases@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/alias/get
          required: true
      x-response-identifier: id
      x-expanded-response: ZimbraAliasResponse
    post:
      operationId: createZimbraAlias
      summary: Create an alias
      description: Creates an alias address from `alias` and the ID of its target in `targetId`. The alias domain and the target domain must be in the same organization.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/zimbra.AliasPostPayload'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zimbra.AliasResponse'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::AliasAlreadyUsed:
                  value:
                    class: Client::BadRequest::AliasAlreadyUsed
                    message: The alias name is already used
                Client::BadRequest::AliasDomainOrganizationDiffers:
                  value:
                    class: Client::BadRequest::AliasDomainOrganizationDiffers
                    message: The alias domain and target domain are not in the same organization
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::AliasDomainNotFound:
                  value:
                    class: Client::NotFound::AliasDomainNotFound
                    message: The alias domain name cannot be found
                Client::NotFound::AliasTargetNotFound:
                  value:
                    class: Client::NotFound::AliasTargetNotFound
                    message: The alias target cannot be found
                Client::NotFound::OrganizationNotFound:
                  value:
                    class: Client::NotFound::OrganizationNotFound
                    message: The organization was not found
                Client::NotFound::PlatformNotFound:
                  value:
                    class: Client::NotFound::PlatformNotFound
                    message: The platform was not found
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                'Client::Conflict::AliasDomainNotReady  ':
                  value:
                    class: 'Client::Conflict::AliasDomainNotReady  '
                    message: The alias domain is not in READY status
                Client::Conflict::AliasTargetObjectNotReady:
                  value:
                    class: Client::Conflict::AliasTargetObjectNotReady
                    message: The alias target object is not in READY status
      tags:
        - Account
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Aliases@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/alias/create
          required: true
  /zimbra/platform/{platformId}/alias/{aliasId}:
    delete:
      operationId: deleteZimbraAlias
      summary: Delete an alias
      description: Deletes the alias address. The alias, its domain and its target must be ready.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: aliasId
          description: Alias ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
      tags:
        - Account
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Zimbra
          - Aliases@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: zimbra:apiovh:platform/alias/delete
          required: true
    get:
      operationId: getZimbraAlias
      summary: Get an alias
      description: 'Returns the alias address, its domain and organization, and its target: an email account or a mailing list.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: aliasId
          description: Alias ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: platformId
          description: Platform ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zimbra.AliasResponse'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::MultipleAliasesFoundWithSameID:
                  value:
                    class: Client::BadRequest::MultipleAliasesFoundWithSameID
