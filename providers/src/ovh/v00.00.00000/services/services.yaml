      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:services/get
          required: true
      x-response-identifier: serviceId
      operationId: get_v1_services_service_id
      description: Get details about a service (Beta version)
    put:
      summary: Update service information
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.update.Service'
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:services/edit
          required: true
      operationId: put_v1_services_service_id
      description: Update service information (Beta version)
