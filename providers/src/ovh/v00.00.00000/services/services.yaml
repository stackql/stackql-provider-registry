openapi: 3.0.0
info:
  title: OVHcloud Services API
  description: 'Service management and billing: services, engagement, renewal and termination, consumption, options, upgrades and detachment.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/services
paths:
  /services:
    get:
      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: orderBy
          description: Order services by services.expanded.Service properties
          schema:
            type: string
        - in: query
          name: resourceName
          description: Filter services by their resourceName (resource.name)
          schema:
            type: string
        - in: query
          name: routes
          description: Filter services by API route path (comma separated)
          schema:
            type: string
        - in: query
          name: sort
          description: Sort results generated by 'orderBy'
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_servicesResponse'
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:services/get
          required: true
      x-expanded-response: ServicesExpandedService
      operationId: get_v1_services
      description: List available services (Beta version)
  /services/{serviceId}:
    delete:
      summary: Delete a service without asking for confirmation
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.terminate.TerminationAnswer'
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:services/terminateWithoutConfirmation
          required: true
      operationId: delete_v1_services_service_id
      description: Delete a service without asking for confirmation (Beta version)
    get:
      summary: Get details about a service
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
