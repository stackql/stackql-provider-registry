openapi: 3.0.0
info:
  title: OVHcloud Notifications API
  description: Notification contact means, routing rules and history.
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/notification
paths:
  /notification/contactMean:
    get:
      operationId: getAllContactMeans
      summary: Retrieve every contact mean
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllContactMeansResponse'
              examples:
                List the contact means:
                  value:
                    - createdAt: '2025-02-01T12:00:00+00:00'
                      currentTasks:
                        - id: f106647f-3750-4500-abb9-923386eb9d0b
                          link: /v2/notification/contactMean/019817d2-78b6-7ca3-91fc-efe1872cbe2c/tasks/f106647f-3750-4500-abb9-923386eb9d0b
                          status: WAITING_USER_INPUT
                          type: ContactMeanOTPValidation
                      default: false
                      description: Email1
                      email: email1@example.com
                      error: null
                      id: 2c94ebf4-5818-478d-a4d2-186e96e58412
                      status: VALID
                      type: EMAIL
                    - createdAt: '2025-02-01T12:00:00+00:00'
                      currentTasks: []
                      default: false
                      description: Email2
                      email: email2@example.com
                      error: null
                      id: b202eff2-4885-4133-85c8-6a7f887e2cc8
                      status: VALID
                      type: EMAIL
                    - createdAt: '2025-03-01T12:00:00+00:00'
                      currentTasks: []
                      default: false
                      description: Email3
                      email: email3@example.com
                      error: null
                      id: 6c31ab9f-7a5b-490a-95f4-0f99791cd998
                      status: DISABLED
                      type: EMAIL
                  summary: Dump of the contact means
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::CursorParametersConflict:
                  value:
                    class: Client::BadRequest::CursorParametersConflict
                    message: Provided cursor and received parameters are conflicting
                Client::BadRequest::InvalidCursor:
                  value:
                    class: Client::BadRequest::InvalidCursor
                    message: Provided cursor is invalid
      x-developer-hub-navigation:
        - - Misc
          - Notifications
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:notification/contactMean/get
          required: true
      x-response-identifier: id
      x-expanded-response: NotificationContactMeanContactMean
      description: Retrieve every contact mean
    post:
      operationId: createContactMean
      summary: Create a contact mean
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notification.contactMean.PostInput'
            examples:
              Create an email contact mean:
                value:
                  description: The boss' email
                  email: boss@example.com
                  type: EMAIL
                summary: Input needed to create the contact mean
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notification.contactMean.ContactMean'
              examples:
                Created contact mean:
                  value:
                    createdAt: '2025-04-01T12:00:00+00:00'
                    currentTasks: []
                    default: false
                    description: The boss' email
                    email: boss@example.com
                    error: null
                    id: f106647f-3750-4500-abb9-923386eb9d0b
                    status: TO_VALIDATE
                    type: EMAIL
                  summary: Created contact mean using the input payload
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::ContactMeanAlreadyExists:
                  value:
                    class: Client::BadRequest::ContactMeanAlreadyExists
                    message: You already have a contact mean with type {{.type}} and destination {{.destination}}
                Client::BadRequest::ContactMeanCreationMissingDestination:
                  value:
                    class: Client::BadRequest::ContactMeanCreationMissingDestination
                    message: Cannot create a {{.type}} contact mean without filling the {{.missingKey}} key
                Client::BadRequest::ContactMeanInvalidDescription:
                  value:
                    class: Client::BadRequest::ContactMeanInvalidDescription
                    message: The contact mean description is not valid (it cannot be empty)
                Client::BadRequest::ContactMeanValidationThresholdReached:
                  value:
                    class: Client::BadRequest::ContactMeanValidationThresholdReached
                    message: You cannot process another validation yet
                Client::BadRequest::InvalidEmailAddress:
                  value:
                    class: Client::BadRequest::InvalidEmailAddress
                    message: Invalid email address provided
      x-developer-hub-navigation:
        - - Misc
          - Notifications
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:notification/contactMean/create
          required: true
      description: Create a contact mean
  /notification/contactMean/{contactMeanId}:
