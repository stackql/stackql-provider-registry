components:
  schemas:
    notification.contactMean.ContactMean:
      type: object
      description: A contact mean
      properties:
        createdAt:
          type: string
          description: Date at which the contact mean was created
          format: date-time
          readOnly: true
        currentTasks:
          type: array
          description: Task to do on this contact mean
          items:
            $ref: '#/components/schemas/common.CurrentTask'
          readOnly: true
        default:
          type: boolean
          description: Is this the default contact mean
          readOnly: true
        description:
          type: string
          description: Arbitrary description for this contact mean
          nullable: true
        email:
          type: string
          description: When type is EMAIL, the email address this contact mean uses
          nullable: true
          readOnly: true
        error:
          type: string
          description: When status is ERROR, details about the error
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the contact mean
          format: uuid
          readOnly: true
        status:
          description: Status of the contact mean
          type: string
          enum:
            - DISABLED
            - ERROR
            - TO_VALIDATE
            - VALID
        type:
          description: Type of the contact mean
          readOnly: true
          type: string
          enum:
            - EMAIL
    notification.contactMean.PostInput:
      type: object
      description: Payload to create a new contact mean
      properties:
        description:
          type: string
          description: Arbitrary description for this contact mean
          nullable: true
        email:
          type: string
          description: When type is EMAIL, the email address that will be used
        type:
          description: Type of the contact mean to create
          type: string
          enum:
            - EMAIL
      required:
        - type
    common.Task:
      type: object
      description: Asynchronous operation
      properties:
        createdAt:
          type: string
          description: Creation date of the task
          format: date-time
          readOnly: true
