                    class: Client::NotFound::ContactMeanNotFound
                    message: Contact mean {{.contactMeanID}} not found
      x-developer-hub-navigation:
        - - Misc
          - Notifications
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:notification/contactMean/get
          required: true
      x-response-identifier: id
      description: Retrieve information about a contact mean
    put:
      operationId: editContactMean
      summary: Update a contact mean
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: contactMeanId
          description: Contact mean ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notification.contactMean.ContactMean'
            examples:
              Update a contact mean status:
                value:
                  description: New description
                  status: DISABLED
                summary: Input needed to update a contact mean
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notification.contactMean.ContactMean'
              examples:
                Updated contact mean:
                  value:
                    createdAt: '2025-04-01T12:00:00+00:00'
                    currentTasks: []
                    default: false
                    description: The boss' email
                    email: boss@example.com
                    error: null
                    id: f106647f-3750-4500-abb9-923386eb9d0b
                    status: DISABLED
                    type: EMAIL
                  summary: Updated contact mean using the input payload
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::ContactMeanDefaultRO:
                  value:
                    class: Client::BadRequest::ContactMeanDefaultRO
                    message: Cannot alter the default contact mean
                Client::BadRequest::ContactMeanInvalidDescription:
                  value:
                    class: Client::BadRequest::ContactMeanInvalidDescription
                    message: The contact mean description is not valid (it cannot be empty)
                Client::BadRequest::ContactMeanStatusChangeForbidden:
                  value:
                    class: Client::BadRequest::ContactMeanStatusChangeForbidden
                    message: Status change is only possible between VALID and DISABLED
        '404':
          description: Error 404 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::NotFound::ContactMeanNotFound:
                  value:
                    class: Client::NotFound::ContactMeanNotFound
                    message: Contact mean {{.contactMeanID}} not found
      x-developer-hub-navigation:
        - - Misc
          - Notifications
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:notification/contactMean/edit
          required: true
      description: Update a contact mean
