      properties:
        operator:
          description: Operator to use in order to filter on the value. Defaults to `EQ`.
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    notification.history.Notification:
      type: object
      description: Notification sent to this account
      properties:
        attachments:
          type: array
          description: Attachments linked to this notification
          items:
            $ref: '#/components/schemas/notification.history.Attachment'
          readOnly: true
        categories:
          type: array
          description: Categories of the notification
          items:
            type: string
          readOnly: true
        contacts:
          type: array
          description: Contact attempts made for this notification
          items:
            $ref: '#/components/schemas/notification.history.Contact'
          readOnly: true
        createdAt:
          type: string
          description: Date at which the notification was sent
          format: date-time
          readOnly: true
        html:
          type: string
          description: HTML text of the notification
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the notification
          format: uuid
          readOnly: true
        priority:
          description: Priority of the notification
          readOnly: true
          type: string
          enum:
            - HIGH
            - LOW
            - MEDIUM
        summary:
          type: string
          description: Summary of the notification
          nullable: true
          readOnly: true
        tags:
          type: object
          description: Tags of the notification
          nullable: true
          additionalProperties:
            type: string
          readOnly: true
        text:
          type: string
          description: Raw text of the notification
          nullable: true
          readOnly: true
        title:
          type: string
          description: Title of the notification
          readOnly: true
    notification.history.Attachment:
      type: object
      description: Attachment linked to a notification (full version)
      properties:
        contentType:
          type: string
          description: Content type of the attachment
          readOnly: true
        name:
          type: string
          description: Name of the attachment
          readOnly: true
        sizeBytes:
          type: integer
          description: Size of the attachment in bytes
          readOnly: true
        url:
          type: string
          description: URL to use to download the attachment
          nullable: true
          readOnly: true
    notification.reference.Reference:
      type: object
      description: Reference data for /notification
      properties:
        categories:
          type: array
          description: Available notification categories
          items:
            $ref: '#/components/schemas/notification.reference.ReferenceCategory'
          readOnly: true
        priorities:
          type: array
          description: Available notification priorities
          items:
            $ref: '#/components/schemas/notification.reference.ReferencePriority'
          readOnly: true
    notification.routing.Routing:
      type: object
      description: A routing
      properties:
        active:
          type: boolean
          description: Whether this routing is currently active
        createdAt:
          type: string
          description: Date at which the routing was created
          format: date-time
          readOnly: true
        id:
          type: string
          description: Unique identifier of the routing
          format: uuid
          readOnly: true
        name:
          type: string
          description: Name of the routing
        rules:
          type: array
          description: Type of the contact mean
          items:
            $ref: '#/components/schemas/notification.routing.Rule'
    notification.routing.PostInput:
      type: object
      description: A routing
      properties:
        active:
          type: boolean
          description: Whether this routing is currently active
        name:
          type: string
          description: Name of the routing
        rules:
          type: array
          description: Type of the contact mean
          items:
            $ref: '#/components/schemas/notification.routing.Rule'
      required:
        - active
        - name
        - rules
    common.CurrentTask:
      type: object
      description: Asynchronous operation currently running
      properties:
        errors:
          type: array
          description: Errors that occurred on the task
          nullable: true
          items:
            $ref: '#/components/schemas/common.TaskError'
          readOnly: true
        id:
          type: string
          description: Identifier of the current task
          format: uuid
          readOnly: true
        link:
          type: string
          description: Link to the task details
          readOnly: true
        status:
          description: Current global status of the current task
          nullable: true
          readOnly: true
          type: string
          enum:
            - ERROR
            - PENDING
            - RUNNING
            - SCHEDULED
            - WAITING_USER_INPUT
        type:
          type: string
          description: Type of the current task
          readOnly: true
    notification.contactMean.StatusEnum:
      type: string
      description: Status of a contact mean
      enum:
        - DISABLED
        - ERROR
        - TO_VALIDATE
        - VALID
    notification.contactMean.TypeEnum:
      type: string
      description: Type of a contact mean
      enum:
        - EMAIL
    common.TaskError:
      type: object
      description: Errors that occurred on the task
      properties:
        message:
          type: string
          description: Error description
          readOnly: true
    common.TaskProgress:
      type: object
      description: Detailed information about an asynchronous operation progress steps
      properties:
        name:
          type: string
          description: Progress step name
          readOnly: true
        status:
          description: Current status of the progress step
          readOnly: true
          type: string
          enum:
            - DONE
            - ERROR
            - PENDING
            - RUNNING
            - SCHEDULED
            - WAITING_USER_INPUT
    common.TaskStatusEnum:
      type: string
      description: Current status of a task
      enum:
        - DONE
        - ERROR
        - PENDING
        - RUNNING
        - SCHEDULED
        - WAITING_USER_INPUT
    notification.contactMean.TaskInputs:
      type: object
      description: Contact mean task input
      properties:
        otp:
          type: string
          description: The OTP received by your contact mean to validate it
        resendOTP:
          type: string
          description: Specify a new date in order to request a new OTP (for terraform compatibility)
          format: date-time
    notification.history.TagFilter.OperatorEnum:
      type: string
      description: Operator that can be used in order to filter resources tags
      enum:
        - EQ
        - EXISTS
        - ILIKE
        - LIKE
        - NEQ
        - NEXISTS
    notification.history.Contact:
      type: object
      description: Contact attempt made for a notification
      properties:
        error:
          type: string
          description: Error encountered when attempting this contact
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the contact
          format: uuid
          readOnly: true
        sentAt:
          type: string
          description: Date at which this contact happened
          nullable: true
          format: date-time
          readOnly: true
        status:
          description: Status of the contact
          readOnly: true
          type: string
          enum:
            - BOUNCED
            - DELIVERED
            - DROPPED
            - QUEUED
            - SENT
        to:
          type: string
          description: Destination of this contact attempt
          readOnly: true
        type:
          description: Type of the contact mean used
          readOnly: true
          type: string
          enum:
            - EMAIL
    notification.reference.ReferenceCategory:
      type: object
      description: Category of a notification
      properties:
        description:
          type: string
          description: Category description
          readOnly: true
        name:
          type: string
          description: Category name
          readOnly: true
    notification.reference.ReferencePriority:
      type: object
      description: Priority of a notification
      properties:
        description:
          type: string
          description: Priority description
          readOnly: true
        name:
          description: Priority name
          readOnly: true
          type: string
          enum:
            - HIGH
            - LOW
            - MEDIUM
    notification.routing.Rule:
      type: object
      description: A routing
      properties:
        condition:
          description: Condition for the route to match
          type: object
          properties:
            category:
              type: array
              description: Notification categories, the rule will be valid if one of the categories matches, if not empty
              items:
                type: string
            priority:
              type: array
              description: Notification priorities, the rule will be valid if one of the priorities matches, if not empty
              items:
                type: string
        contactMeans:
          type: array
          description: Contact means to route the nofitications to
          items:
            $ref: '#/components/schemas/notification.routing.RuleContactMean'
        continue:
          type: boolean
          description: Wheter the processing stops at this rule, if it matches
      required:
        - condition
        - contactMeans
        - continue
    common.CurrentTaskStatusEnum:
      type: string
      description: Current status of a task. A task in ERROR cannot be retried without your inputs. PENDING tasks will be executed as soon as possible. A RUNNING task is currently executing your original request. SCHEDULED is used for tasks that will be executed in the future.
      enum:
        - ERROR
        - PENDING
        - RUNNING
        - SCHEDULED
        - WAITING_USER_INPUT
    notification.history.ContactStatusEnum:
      type: string
      description: Status of a notification contact attempt
      enum:
        - BOUNCED
        - DELIVERED
        - DROPPED
        - QUEUED
        - SENT
    notification.contactMean.ContactMeanTypeEnum:
      type: string
      description: Type of a contact mean
      enum:
        - EMAIL
    notification.routing.RuleCondition:
      type: object
      description: A routing
      properties:
        category:
          type: array
          description: Notification categories, the rule will be valid if one of the categories matches, if not empty
          items:
            type: string
        priority:
          type: array
          description: Notification priorities, the rule will be valid if one of the priorities matches, if not empty
          items:
            type: string
    notification.routing.RuleContactMean:
      type: object
      description: A routing
      properties:
        email:
          type: string
          description: When type is EMAIL, the email address this contact mean uses
          readOnly: true
        error:
          type: string
          description: When status is ERROR, details about the error
          nullable: true
          readOnly: true
        id:
          type: string
          description: Identifier of the contact mean
          format: uuid
        status:
          description: Status of the contact mean
          readOnly: true
          type: string
          enum:
            - DISABLED
            - ERROR
            - TO_VALIDATE
            - VALID
        type:
          description: Type of the contact mean
          readOnly: true
          type: string
          enum:
            - EMAIL
      required:
        - id
