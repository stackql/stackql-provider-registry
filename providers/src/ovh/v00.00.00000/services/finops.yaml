openapi: 3.0.0
info:
  title: OVHcloud FinOps API
  description: FinOps exports of billing data to object storage buckets.
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/finops
paths:
  /finops/bucketExport:
    get:
      operationId: getAllFinopsBucketExports
      summary: List FinOps bucket export configurations. The target bucket must be S3™*-compatible.
      description: <sup>*</sup> S3 is a trademark filed by Amazon Technologies,Inc. OVHcloud's service is not sponsored by, endorsed by, or otherwise affiliated with Amazon Technologies,Inc. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllFinopsBucketExportsResponse'
              examples:
                List of bucket exports:
                  value:
                    - checksum: '12345678901234567890123456789012'
                      currentState:
                        bucketConfiguration:
                          accessKey: abcdef1234567890
                          bucketName: my-finops
                          endpointURL: s3.gra.io.cloud.ovh.net
                          pathPrefix: /finops-reports/
                          region: gra
                          secretKey: abcdef1234567890
                        exportHour: 7
                        filePolicy: CREATE
                        period: DAILY
                        scope: urn:nichandle:nic1
                      currentTasks: []
                      id: 1241b431-2a13-4974-835f-78f0e231a9b1
                      resourceStatus: READY
                      targetSpec:
                        bucketConfiguration:
                          accessKey: abcdef1234567890
                          bucketName: my-finops
                          endpointURL: s3.gra.io.cloud.ovh.net
                          pathPrefix: /finops-reports/
                          region: gra
                          secretKey: abcdef1234567890
                        exportHour: 7
                        filePolicy: CREATE
                        period: DAILY
                        scope: urn:nichandle:nic1
                  summary: List containing a single ready bucket export
      x-developer-hub-navigation:
        - - Manage & Operate
          - Cost Center
          - Export FOCUS@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:finops/bucketExport/get
          required: true
      x-response-identifier: id
      x-expanded-response: FinopsBucketExportAsyncConfiguration
    post:
      operationId: createFinopsBucketExport
      summary: Create a FinOps bucket export configuration. The target bucket must be S3™*-compatible.
      description: <sup>*</sup> S3 is a trademark filed by Amazon Technologies,Inc. OVHcloud's service is not sponsored by, endorsed by, or otherwise affiliated with Amazon Technologies,Inc. (Beta version)
      security:
        - oAuth2AuthCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/finops.bucketExport.AsyncCreateConfiguration'
            examples:
              Create bucket export:
                value:
                  targetSpec:
                    bucketConfiguration:
                      accessKey: abcdef1234567890
                      bucketName: my-finops
                      endpointURL: s3.gra.io.cloud.ovh.net
                      pathPrefix: /finops-reports/
                      region: gra
                      secretKey: abcdef1234567890
                    exportHour: 7
                    filePolicy: CREATE
                    period: DAILY
                summary: Creation payload pointing at a GRA bucket
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/finops.bucketExport.AsyncConfiguration'
              examples:
                Created bucket export:
                  value:
                    checksum: '12345678901234567890123456789012'
                    currentState:
                      bucketConfiguration:
                        accessKey: abcdef1234567890
                        bucketName: my-finops
                        endpointURL: s3.gra.io.cloud.ovh.net
                        pathPrefix: /finops-reports/
                        region: gra
                        secretKey: abcdef1234567890
                      exportHour: 7
                      filePolicy: CREATE
                      period: DAILY
                      scope: urn:nichandle:nic1
                    currentTasks:
                      - id: 9a1f7d2e-3c4b-4f5a-8d6e-7f8a9b0c1d2e
                        link: /finops/bucketExport/1241b431-2a13-4974-835f-78f0e231a9b1/task/9a1f7d2e-3c4b-4f5a-8d6e-7f8a9b0c1d2e
                        type: CreateBucketExport
                    id: 1241b431-2a13-4974-835f-78f0e231a9b1
                    resourceStatus: CREATING
                    targetSpec:
                      bucketConfiguration:
                        accessKey: abcdef1234567890
                        bucketName: my-finops
                        endpointURL: s3.gra.io.cloud.ovh.net
                        pathPrefix: /finops-reports/
                        region: gra
                        secretKey: abcdef1234567890
                      exportHour: 7
                      filePolicy: CREATE
                      period: DAILY
                      scope: urn:nichandle:nic1
                  summary: Configuration in CREATING state with a creation task
      x-developer-hub-navigation:
        - - Manage & Operate
          - Cost Center
          - Export FOCUS@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:finops/bucketExport/create
          required: true
  /finops/bucketExport/{id}:
    delete:
      operationId: deleteFinopsBucketExport
      summary: Delete a FinOps bucket export configuration. The target bucket must be S3™*-compatible.
      description: <sup>*</sup> S3 is a trademark filed by Amazon Technologies,Inc. OVHcloud's service is not sponsored by, endorsed by, or otherwise affiliated with Amazon Technologies,Inc. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/finops.bucketExport.AsyncConfiguration'
              examples:
                Deleting bucket export:
                  value:
                    checksum: '12345678901234567890123456789012'
                    currentState:
                      bucketConfiguration:
                        accessKey: abcdef1234567890
                        bucketName: my-finops
                        endpointURL: s3.gra.io.cloud.ovh.net
                        pathPrefix: /finops-reports/
                        region: gra
                        secretKey: abcdef1234567890
                      exportHour: 7
                      filePolicy: CREATE
                      period: DAILY
                      scope: urn:nichandle:nic1
                    currentTasks:
                      - id: 7e3f2a1b-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                        link: /finops/bucketExport/1241b431-2a13-4974-835f-78f0e231a9b1/task/7e3f2a1b-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                        type: DeleteBucketExport
                    id: 1241b431-2a13-4974-835f-78f0e231a9b1
                    resourceStatus: DELETING
                    targetSpec:
                      bucketConfiguration:
                        accessKey: abcdef1234567890
                        bucketName: my-finops
                        endpointURL: s3.gra.io.cloud.ovh.net
                        pathPrefix: /finops-reports/
                        region: gra
                        secretKey: abcdef1234567890
                      exportHour: 7
                      filePolicy: CREATE
                      period: DAILY
                      scope: urn:nichandle:nic1
                  summary: Configuration transitioning to DELETING with a delete task
      x-developer-hub-navigation:
        - - Manage & Operate
          - Cost Center
          - Export FOCUS@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:finops/bucketExport/delete
          required: true
    get:
      operationId: getFinopsBucketExport
      summary: Get a FinOps bucket export configuration. The target bucket must be S3™*-compatible.
      description: <sup>*</sup> S3 is a trademark filed by Amazon Technologies,Inc. OVHcloud's service is not sponsored by, endorsed by, or otherwise affiliated with Amazon Technologies,Inc. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/finops.bucketExport.AsyncConfiguration'
              examples:
                Ready bucket export:
                  value:
                    checksum: '12345678901234567890123456789012'
                    currentState:
                      bucketConfiguration:
                        accessKey: abcdef1234567890
                        bucketName: my-finops
                        endpointURL: s3.gra.io.cloud.ovh.net
                        pathPrefix: /finops-reports/
                        region: gra
                        secretKey: abcdef1234567890
                      exportHour: 7
                      filePolicy: CREATE
                      period: DAILY
                      scope: urn:nichandle:nic1
                    currentTasks: []
                    id: 1241b431-2a13-4974-835f-78f0e231a9b1
                    resourceStatus: READY
                    targetSpec:
                      bucketConfiguration:
                        accessKey: abcdef1234567890
                        bucketName: my-finops
                        endpointURL: s3.gra.io.cloud.ovh.net
                        pathPrefix: /finops-reports/
                        region: gra
                        secretKey: abcdef1234567890
                      exportHour: 7
                      filePolicy: CREATE
                      period: DAILY
                      scope: urn:nichandle:nic1
                  summary: A bucket export configuration in READY state
      x-developer-hub-navigation:
        - - Manage & Operate
          - Cost Center
          - Export FOCUS@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:finops/bucketExport/get
          required: true
      x-response-identifier: id
    put:
      operationId: editFinopsBucketExport
      summary: Modify a FinOps bucket export configuration. The target bucket must be S3™*-compatible.
      description: <sup>*</sup> S3 is a trademark filed by Amazon Technologies,Inc. OVHcloud's service is not sponsored by, endorsed by, or otherwise affiliated with Amazon Technologies,Inc. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/finops.bucketExport.AsyncConfiguration'
            examples:
              Update bucket export:
                value:
                  checksum: '12345678901234567890123456789012'
                  targetSpec:
                    bucketConfiguration:
                      accessKey: abcdef1234567890
                      bucketName: my-finops
                      endpointURL: s3.gra.io.cloud.ovh.net
                      pathPrefix: /finops-reports/
                      region: gra
                      secretKey: abcdef1234567890
                    exportHour: 9
                    filePolicy: REPLACE
                summary: Update changing the export hour and file policy
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/finops.bucketExport.AsyncConfiguration'
              examples:
                Updated bucket export:
                  value:
                    checksum: '12345678901234567890123456789012'
                    currentState:
                      bucketConfiguration:
                        accessKey: abcdef1234567890
                        bucketName: my-finops
                        endpointURL: s3.gra.io.cloud.ovh.net
                        pathPrefix: /finops-reports/
                        region: gra
                        secretKey: abcdef1234567890
                      exportHour: 7
                      filePolicy: CREATE
                      period: DAILY
                      scope: urn:nichandle:nic1
                    currentTasks:
                      - id: 5b2c8e4f-1a9d-4e6b-9c7f-0d3e1a2b3c4d
                        link: /finops/bucketExport/1241b431-2a13-4974-835f-78f0e231a9b1/task/5b2c8e4f-1a9d-4e6b-9c7f-0d3e1a2b3c4d
                        type: UpdateBucketExport
                    id: 1241b431-2a13-4974-835f-78f0e231a9b1
                    resourceStatus: UPDATING
                    targetSpec:
                      bucketConfiguration:
                        accessKey: abcdef1234567890
                        bucketName: my-finops
                        endpointURL: s3.gra.io.cloud.ovh.net
                        pathPrefix: /finops-reports/
                        region: gra
                        secretKey: abcdef1234567890
                      exportHour: 9
                      filePolicy: REPLACE
                      period: DAILY
                      scope: urn:nichandle:nic1
                  summary: Configuration transitioning to UPDATING with an update task
      x-developer-hub-navigation:
        - - Manage & Operate
          - Cost Center
          - Export FOCUS@@@50
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:finops/bucketExport/edit
          required: true
  /finops/bucketExport/{id}/event:
    get:
      operationId: getFinopsBucketExportEvents
      summary: Get a list of events
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFinopsBucketExportEventsResponse'
              examples:
                Update event:
                  value:
                    - createdAt: '2026-05-07T08:00:00Z'
                      kind: UPDATE_BUCKET_EXPORT
                      link: /v2/finops/bucketExport/1241b431-2a13-4974-835f-78f0e231a9b1/task/5b2c8e4f-1a9d-4e6b-9c7f-0d3e1a2b3c4d
                      message: Task started to update FinOps bucket export configuration '1241b431-2a13-4974-835f-78f0e231a9b1'
                      type: TASK_START
                  summary: Event emitted when a bucket export update task starts
      x-developer-hub-navigation:
        - - Manage & Operate
          - Cost Center
          - Export FOCUS
          - Event
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:finops/bucketExport/event/get
          required: true
      description: Get a list of events (Beta version)
  /finops/bucketExport/{id}/task:
    get:
      operationId: getAllFinopsBucketExportTasks
      summary: Get a list of tasks
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllFinopsBucketExportTasksResponse'
              examples:
                List of tasks:
                  value:
                    - createdAt: '2026-05-07T08:00:00Z'
                      errors: []
                      id: 5b2c8e4f-1a9d-4e6b-9c7f-0d3e1a2b3c4d
                      link: /v2/finops/bucketExport/1241b431-2a13-4974-835f-78f0e231a9b1
                      message: Updating FinOps bucket export configuration '1241b431-2a13-4974-835f-78f0e231a9b1'
                      progress:
                        - name: validating bucket configuration
                          status: DONE
                        - name: applying new configuration
                          status: RUNNING
                      startedAt: '2026-05-07T08:01:00Z'
                      status: RUNNING
                      type: UPDATE_BUCKET_EXPORT
                      updatedAt: '2026-05-07T08:01:00Z'
                  summary: List containing a single running update task
      x-developer-hub-navigation:
        - - Manage & Operate
          - Cost Center
          - Export FOCUS
          - Task@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:finops/bucketExport/task/get
          required: true
      x-response-identifier: id
      x-expanded-response: CommonTask
      description: Get a list of tasks (Beta version)
  /finops/bucketExport/{id}/task/{taskId}:
    get:
      operationId: getFinopsBucketExportTask
      summary: Get a single task
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          description: Task ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.Task'
              examples:
                Running update task:
                  value:
                    createdAt: '2026-05-07T08:00:00Z'
                    errors: []
                    id: 5b2c8e4f-1a9d-4e6b-9c7f-0d3e1a2b3c4d
                    link: /v2/finops/bucketExport/1241b431-2a13-4974-835f-78f0e231a9b1
                    message: Updating FinOps bucket export configuration '1241b431-2a13-4974-835f-78f0e231a9b1'
                    progress:
                      - name: validating bucket configuration
                        status: DONE
                      - name: applying new configuration
                        status: RUNNING
                    startedAt: '2026-05-07T08:01:00Z'
                    status: RUNNING
                    type: UPDATE_BUCKET_EXPORT
                    updatedAt: '2026-05-07T08:01:00Z'
                  summary: Update task currently applying a new bucket configuration
      x-developer-hub-navigation:
        - - Manage & Operate
          - Cost Center
          - Export FOCUS
          - Task@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: account:apiovh:finops/bucketExport/task/get
          required: true
      x-response-identifier: id
      description: Get a single task (Beta version)
components:
  schemas:
    finops.bucketExport.AsyncConfiguration:
      type: object
      description: Bucket Export Configuration
      properties:
        checksum:
          type: string
          description: Checksum of the Bucket Export Configuration
        currentState:
          description: Current state of the billing account
          readOnly: true
          type: object
          properties:
            bucketConfiguration:
              description: Configuration of the target bucket, which must be S3™*-compatible
              type: object
              properties:
                accessKey:
                  type: string
                  description: S3™* access key
                  format: password
                bucketName:
                  type: string
                  description: Name of the bucket where the file will be put
                endpointURL:
                  type: string
                  description: Hostname used to reach the S3™* cluster
                pathPrefix:
                  type: string
                  description: Folder where the files will be created
                region:
                  type: string
                  description: S3™* region name
                secretKey:
                  type: string
                  description: S3™* secret key
                  format: password
              required:
                - accessKey
                - bucketName
                - endpointURL
                - region
                - secretKey
            exportHour:
              type: integer
              description: The hour (in UTC) we will deposit the file at. For example, if set to 7, the export will be triggered starting at 7:00 UTC. Only applicable to period=DAILY.
            filePolicy:
              description: Strategy for file creation
              type: string
              enum:
                - CREATE
                - REPLACE
            period:
              description: The period at which your finops data will be exported. Defaults to DAILY.
              nullable: true
              type: string
              enum:
                - DAILY
                - HOURLY
            scope:
              type: string
              description: Scope of this export
              readOnly: true
        currentTasks:
          type: array
          description: Task to do on this billing account
          items:
            $ref: '#/components/schemas/common.CurrentTask'
          readOnly: true
        id:
          type: string
          description: Unique identifier of the billing account
          readOnly: true
        resourceStatus:
          description: Billing account readiness in the system
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
        targetSpec:
          description: Target Spec for the FinOps Bucket Export Configuration
          type: object
          properties:
            bucketConfiguration:
              description: Configuration of the target bucket, which must be S3™*-compatible
              type: object
              properties:
                accessKey:
                  type: string
                  description: S3™* access key
                  format: password
                bucketName:
                  type: string
                  description: Name of the bucket where the file will be put
                endpointURL:
                  type: string
                  description: Hostname used to reach the S3™* cluster
                pathPrefix:
                  type: string
                  description: Folder where the files will be created
                region:
                  type: string
                  description: S3™* region name
                secretKey:
                  type: string
                  description: S3™* secret key
                  format: password
              required:
                - accessKey
                - bucketName
                - endpointURL
                - region
                - secretKey
            exportHour:
              type: integer
              description: The hour (in UTC) we will deposit the file at. For example, if set to 7, the export will be triggered starting at 7:00 UTC. Only applicable to period=DAILY.
            filePolicy:
              description: Strategy for file creation
              type: string
              enum:
                - CREATE
                - REPLACE
            period:
              description: The period at which your finops data will be exported. Defaults to DAILY.
              nullable: true
              type: string
              enum:
                - DAILY
                - HOURLY
            scope:
              type: string
              description: Scope of this export
              readOnly: true
    finops.bucketExport.AsyncCreateConfiguration:
      type: object
      description: FinOps Bucket Export creation parameters
      properties:
        targetSpec:
          description: Target Spec for the bucket export configuration
          type: object
          properties:
            bucketConfiguration:
              description: Configuration of the target bucket, which must be S3™*-compatible
              type: object
              properties:
                accessKey:
                  type: string
                  description: S3™* access key
                  format: password
                bucketName:
                  type: string
                  description: Name of the bucket where the file will be put
                endpointURL:
                  type: string
                  description: Hostname used to reach the S3™* cluster
                pathPrefix:
                  type: string
                  description: Folder where the files will be created
                region:
                  type: string
                  description: S3™* region name
                secretKey:
                  type: string
                  description: S3™* secret key
                  format: password
              required:
                - accessKey
                - bucketName
                - endpointURL
                - region
                - secretKey
            exportHour:
              type: integer
              description: The hour (in UTC) we will deposit the file at. For example, if set to 7, the export will be triggered starting at 7:00 UTC. Only applicable to period=DAILY.
            filePolicy:
              description: Strategy for file creation
              type: string
              enum:
                - CREATE
                - REPLACE
            period:
              description: The period at which your finops data will be exported. Defaults to DAILY.
              nullable: true
              type: string
              enum:
                - DAILY
                - HOURLY
            scope:
              type: string
              description: Scope of this export
              readOnly: true
      required:
        - targetSpec
    common.Event:
      type: object
      description: Represents an event for an async envelope
      properties:
        createdAt:
          type: string
          description: Creation date of the event
          format: date-time
          readOnly: true
        kind:
          type: string
          description: Nature of the event
          readOnly: true
        link:
          type: string
          description: Link to the event related resource
          nullable: true
          readOnly: true
        message:
          type: string
          description: Description of what happened on the event
          readOnly: true
        type:
          description: Type of the event
          readOnly: true
          type: string
          enum:
            - TARGET_SPEC_UPDATE
            - TASK_ERROR
            - TASK_START
            - TASK_SUCCESS
    common.Task:
      type: object
      description: Asynchronous operation
      properties:
        createdAt:
          type: string
          description: Creation date of the task
          format: date-time
          readOnly: true
        errors:
          type: array
          description: Errors that occurred on the task
          nullable: true
          items:
            $ref: '#/components/schemas/common.TaskError'
          readOnly: true
        finishedAt:
          type: string
          description: Ending date of the task
          nullable: true
          format: date-time
          readOnly: true
        id:
          type: string
          description: Unique identifier of the task
          format: uuid
          readOnly: true
        link:
          type: string
          description: Link to the related resource
          readOnly: true
        message:
          type: string
          description: Description of the task
          readOnly: true
        progress:
          type: array
          description: Progress steps of the asynchronous operation
          items:
            $ref: '#/components/schemas/common.TaskProgress'
          readOnly: true
        startedAt:
          type: string
          description: Starting date of the task
          nullable: true
          format: date-time
          readOnly: true
        status:
          description: Current global status of the task
          readOnly: true
          type: string
          enum:
            - DONE
            - ERROR
            - PENDING
            - RUNNING
            - SCHEDULED
            - WAITING_USER_INPUT
        type:
          type: string
