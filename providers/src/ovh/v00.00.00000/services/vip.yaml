openapi: 3.0.0
info:
  title: OVHcloud VIP Support API
  description: VIP support services.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/vip
paths:
  /vip:
    get:
      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_vipResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vip:apiovh:get
          required: true
      x-expanded-response: VipSupportVipWithIAM
      operationId: get_v1_vip
      description: List available services
  /vip/{serviceName}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your VIP support offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vip.SupportVipWithIAM'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vip:apiovh:get
          required: true
      operationId: get_v1_vip_service_name
      description: Get this object properties
  /vip/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your VIP support offer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vip:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_vip_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The internal name of your VIP support offer
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: vip:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_vip_service_name_service_infos
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    vip.SupportVipWithIAM:
      type: object
      description: Vip Service
      properties:
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        serviceName:
          type: string
          description: Name of the VIP offer
          readOnly: true
        universe:
          type: array
          description: VIP universes of this service
          items:
            $ref: '#/components/schemas/vip.UniverseEnum'
          readOnly: true
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - automaticV2024
            - manual
            - oneShot
            - option
        serviceId:
          type: integer
          readOnly: true
        status:
          readOnly: true
          type: string
          enum:
            - autorenewInProgress
            - expired
            - inCreation
            - ok
            - pendingDebt
            - unPaid
    iam.resource.TagFilter.OperatorEnum:
      type: string
      description: Operator that can be used in order to filter resources tags
      enum:
        - EQ
        - EXISTS
        - ILIKE
        - LIKE
        - NEQ
        - NEXISTS
    iam.ResourceMetadata:
      type: object
      description: IAM resource metadata embedded in services models
      properties:
        displayName:
          type: string
          description: Resource display name
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the resource
          format: uuid
          readOnly: true
        state:
          description: Resource state
          nullable: true
          readOnly: true
          type: string
          enum:
            - EXPIRED
            - IN_CREATION
            - OK
            - SUSPENDED
        tags:
          type: object
          description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
          nullable: true
          additionalProperties:
            type: string
          readOnly: true
        urn:
          type: string
          description: Unique resource name used in policies
          readOnly: true
    vip.UniverseEnum:
      type: string
      description: Available universe for VIP service
      enum:
        - cloud
        - dedicated
        - telecom
        - web
    service.RenewType:
      type: object
      description: Map a possible renew for a specific service
      properties:
        automatic:
          type: boolean
          description: The service is automatically renewed
        deleteAtExpiration:
          type: boolean
          description: The service will be deleted at expiration
        forced:
          type: boolean
          description: The service forced to be renewed
        manualPayment:
          type: boolean
          description: The service needs to be manually renewed and paid
          nullable: true
        period:
          type: integer
          description: period of renew in month
          nullable: true
    service.RenewalTypeEnum:
      type: string
      description: Detailed renewal type of a service
      enum:
        - automaticForcedProduct
        - automaticV2012
        - automaticV2014
        - automaticV2016
        - automaticV2024
        - manual
        - oneShot
        - option
    service.StateEnum:
      type: string
      enum:
        - autorenewInProgress
        - expired
        - inCreation
        - ok
        - pendingDebt
        - unPaid
    iam.ResourceMetadata.StateEnum:
      type: string
      description: Resource state
      enum:
        - EXPIRED
        - IN_CREATION
        - OK
        - SUSPENDED
    Get_v1_vipResponse:
      type: object
      properties:
        v1_vip:
          type: array
          items:
            $ref: '#/components/schemas/vip.SupportVipWithIAM'
  x-stackQL-resources:
    vips:
      id: ovh.vip.vips
      name: vips
      title: Vips
      methods:
        list:
          operation:
            $ref: '#/paths/~1vip/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_vip
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/Get_v1_vipResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_vip\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1vip~1{serviceName}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/vips/methods/get'
          - $ref: '#/components/x-stackQL-resources/vips/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    service_infos:
      id: ovh.vip.service_infos
      name: service_infos
      title: Service Infos
      methods:
        get:
          operation:
            $ref: '#/paths/~1vip~1{serviceName}~1serviceInfos/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1vip~1{serviceName}~1serviceInfos/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/service_infos/methods/get'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/service_infos/methods/update'
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v1
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
