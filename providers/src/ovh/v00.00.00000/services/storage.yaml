openapi: 3.0.0
info:
  title: OVHcloud Enterprise File Storage API
  description: 'Enterprise File Storage (NetApp) services: volumes, snapshots, snapshot policies, access rules and shares.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/storage
paths:
  /storage/nasha:
    get:
      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_storage_nashaResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nasHA:apiovh:storage/get
          required: true
      x-expanded-response: void
      operationId: get_v1_storage_nasha
      description: List available services
  /storage/nasha/{serviceName}:
    get:
      summary: Void
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The nasha storage id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nasHA:apiovh:storage/get
          required: true
      operationId: get_v1_storage_nasha_service_name
      description: Void
  /storage/nasha/{serviceName}/changeContact:
    post:
      summary: Change service contacts
      description: Change service contacts. Starts a procedure to change the admin, tech or billing contact of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The nasha storage id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactAdmin:
                  type: string
                  description: The contact to set as admin contact
                contactBilling:
                  type: string
                  description: The contact to set as billing contact
                contactTech:
                  type: string
                  description: The contact to set as tech contact
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_storage_nasha_service_name_change_contactResponse'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nasHA:apiovh:storage/changeContact
          required: true
      operationId: post_v1_storage_nasha_service_name_change_contact
  /storage/nasha/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The nasha storage id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nasHA:apiovh:storage/confirmTermination
          required: true
      operationId: post_v1_storage_nasha_service_name_confirm_termination
  /storage/nasha/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The nasha storage id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nasHA:apiovh:storage/serviceInfos/get
          required: true
      operationId: get_v1_storage_nasha_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The nasha storage id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nasHA:apiovh:storage/serviceInfos/edit
          required: true
      operationId: put_v1_storage_nasha_service_name_service_infos
  /storage/nasha/{serviceName}/terminate:
    post:
      summary: Request service termination
      description: Request service termination. Starts the termination of the service. The admin contact receives a token by email, to confirm with the `confirmTermination` call.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The nasha storage id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: nasHA:apiovh:storage/terminate
          required: true
      operationId: post_v1_storage_nasha_service_name_terminate
  /storage/netapp:
    get:
      summary: List Enterprise File Storage services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_storage_netappResponse'
      tags:
        - service management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Service Management@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:get
          required: true
      x-expanded-response: StorageNetAppServiceWithIAM
      operationId: get_v1_storage_netapp
      description: List Enterprise File Storage services
  /storage/netapp/capabilities/product:
    get:
      summary: Get product capabilities
      description: Returns product capabilities such as features, supported protocols, and limits.
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.NetAppCapabilitiesProduct'
      tags:
        - capabilities
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Capabilities@@@10
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_storage_netapp_capabilities_product
  /storage/netapp/{serviceName}:
    get:
      summary: Get an Enterprise File Storage service
      description: Returns the service, including its region, performance level, quota and status.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.NetAppServiceWithIAM'
      tags:
        - service management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Service Management@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:get
          required: true
      operationId: get_v1_storage_netapp_service_name
    put:
      summary: Update an Enterprise File Storage service
      description: Updates the service name, the only property that can be changed. The change applies immediately, whatever the service status.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/storage.NetAppServiceUpdate'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.NetAppService'
      tags:
        - service management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Service Management@@@80
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:edit
          required: true
      operationId: put_v1_storage_netapp_service_name
  /storage/netapp/{serviceName}/changeContact:
    post:
      summary: Launch a contact change procedure
      description: Starts the change of the admin, tech or billing contact and returns the request IDs.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.changeContact'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_storage_netapp_service_name_change_contactResponse'
      tags:
        - service management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Service Management@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:changeContact
          required: true
      operationId: post_v1_storage_netapp_service_name_change_contact
  /storage/netapp/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirms the termination with the emailed token and records your reason.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.confirmTermination'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      tags:
        - service management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Service Management@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:confirmTermination
          required: true
      operationId: post_v1_storage_netapp_service_name_confirm_termination
  /storage/netapp/{serviceName}/metricsToken:
    get:
      summary: Get a metrics token
      description: Returns a new token and the endpoint used to query the service metrics. Each call creates a new token, valid until the returned expiry date. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.MetricsToken'
      tags:
        - monitoring
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Monitoring@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: storageNetApp:apiovh:metricsToken/get
          required: true
      operationId: get_v1_storage_netapp_service_name_metrics_token
  /storage/netapp/{serviceName}/network:
    get:
      summary: List networks
      description: Returns the networks of the service, with only their IDs unless `detail` is true. A service on the public network has no network, so the list is empty.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: detail
          description: Get detailed information about each network
          schema:
            type: boolean
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_storage_netapp_service_name_networkResponse'
      tags:
        - network
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Network@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:network/get
          required: true
      x-response-identifier: id
      x-expanded-response: StorageNetAppNetwork
      operationId: get_v1_storage_netapp_service_name_network
  /storage/netapp/{serviceName}/network/{networkId}:
    get:
      summary: Get a network
      description: Returns the network status and the URN of the vRack Services it is attached to. The status moves to associated only after an endpoint is created on the vRack Services, and share access paths are returned only in that status.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: networkId
          description: Network ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.NetAppNetwork'
      tags:
        - network
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Network@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:network/get
          required: true
      x-response-identifier: id
      operationId: get_v1_storage_netapp_service_name_network_network_id
  /storage/netapp/{serviceName}/productUpdateOptions:
    get:
      summary: List upgrade and downgrade options
      description: Returns the product offers this service can change to (upgrade or downgrade), including plan code, quota, performance level, and the constraints that apply to the change. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.NetAppServiceProductUpdateOptions'
      tags:
        - service management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Service Management@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: storageNetApp:apiovh:productUpdateOptions/get
          required: true
      operationId: get_v1_storage_netapp_service_name_product_update_options
  /storage/netapp/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Returns contacts, creation and expiration dates, and renewal settings.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      tags:
        - service management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Service Management@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_storage_netapp_service_name_service_infos
    put:
      summary: Update service information
      description: Changes how the service renews; `renew` is the only editable field.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      tags:
        - service management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Service Management@@@90
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_storage_netapp_service_name_service_infos
  /storage/netapp/{serviceName}/share:
    get:
      summary: List shares
      description: Returns the ID and name of each share of the service. Set `detail` to true to get all share properties.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: detail
          description: Get detailed information about each share
          schema:
            type: boolean
        - in: query
          name: mountPointName
          description: If specified, returns only shares with given mount point name
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_storage_netapp_service_name_shareResponse'
      tags:
        - share management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Share Management@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:share/get
          required: true
      x-response-identifier: id
      x-expanded-response: StorageNetAppShare
      operationId: get_v1_storage_netapp_service_name_share
    post:
      summary: Create a share
      description: 'Creates an NFS share, empty or from a manual snapshot, in which case the share must be at least the size of the snapshot. Creation is asynchronous: the share is returned with status creating, follow its status until available. The total size of the shares cannot exceed the service capacity.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/storage.NetAppShare'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.NetAppShare'
      tags:
        - share management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Share Management@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:share/create
          required: true
      operationId: post_v1_storage_netapp_service_name_share
  /storage/netapp/{serviceName}/share/{shareId}:
    delete:
      summary: Delete a share
      description: Permanently deletes the share and its ACLs. Deletion is asynchronous. Delete the snapshots and replications of the share first.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: shareId
          description: Share ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
      tags:
        - share management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Share Management@@@70
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:share/delete
          required: true
      operationId: delete_v1_storage_netapp_service_name_share_share_id
    get:
      summary: Get a share
      description: Returns the share properties, its status and its access mode. To get the paths used to mount the share, list its access paths.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: shareId
          description: Share ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.NetAppShare'
      tags:
        - share management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Share Management@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:share/get
          required: true
      x-response-identifier: id
      operationId: get_v1_storage_netapp_service_name_share_share_id
    put:
      summary: Update a share
      description: Updates the share name and description. To change the size, use *Extend a share* or *Shrink a share*.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: shareId
          description: Share ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/storage.NetAppShareUpdate'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/storage.NetAppShare'
      tags:
        - share management
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Share Management@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: storageNetApp:apiovh:share/edit
          required: true
      operationId: put_v1_storage_netapp_service_name_share_share_id
  /storage/netapp/{serviceName}/share/{shareId}/accessPath:
    get:
      summary: List access paths
      description: Returns the paths used to mount the share, with the preferred one first. The list stays empty until the network status of the service is associated.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: shareId
          description: Share ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_storage_netapp_service_name_share_share_id_access_pathResponse'
      tags:
        - access control
      x-developer-hub-navigation:
        - - Storage & Backup
          - File Storage
          - Enterprise File Storage
          - Access Control@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
