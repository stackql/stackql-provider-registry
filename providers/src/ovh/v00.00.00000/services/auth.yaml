openapi: 3.0.0
info:
  title: OVHcloud Authentication API
  description: 'API authentication: credential requests, the current credential, API server time and logout.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/auth
paths:
  /auth/credential:
    post:
      summary: Request a new credential for your application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.ApiCredentialRequestParams'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.ApiCredentialRequest'
      x-badges:
        - color: green
          label: Stable production version
      operationId: post_v1_auth_credential
      description: Request a new credential for your application
  /auth/currentCredential:
    get:
      summary: Get the current credential details
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.ApiCredential'
      x-badges:
        - color: green
          label: Stable production version
      x-response-identifier: credentialId
      operationId: get_v1_auth_current_credential
      description: Get the current credential details
  /auth/details:
    get:
      summary: Details about the current authentication
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.Details'
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_auth_details
      description: Details about the current authentication
  /auth/logout:
    post:
      summary: Expire current credential
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
      x-badges:
        - color: green
          label: Stable production version
      operationId: post_v1_auth_logout
      description: Expire current credential
  /auth/time:
    get:
      summary: Get the current time of the OVH servers, since UNIX epoch
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: integer
      x-badges:
        - color: green
          label: Stable production version
      operationId: get_v1_auth_time
      x-stackQL-scalarWrap:
        column: value
        type: integer
      description: Get the current time of the OVH servers, since UNIX epoch
  /auth/token:
    post:
      summary: Generate a one-time token to authenticate on OVHcloud's applications (only supported by chatbot for the moment)
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.Token'
      x-badges:
        - color: green
          label: Stable production version
      operationId: post_v1_auth_token
      description: Generate a one-time token to authenticate on OVHcloud's applications (only supported by chatbot for the moment)
components:
  schemas:
    auth.ApiCredentialRequestParams:
      type: object
      description: Credential request to get access to the API
      properties:
        accessRules:
          type: array
          description: Wanted API routes
          items:
            $ref: '#/components/schemas/auth.AccessRuleRequest'
        allowedIPs:
          type: array
          description: If defined, list of IP blocks that can use the credential
          nullable: true
          items:
            $ref: '#/components/schemas/ipBlock'
        redirection:
          type: string
          description: Address where the customer will be redirected after authentication
          nullable: true
      required:
        - accessRules
    auth.ApiCredentialRequest:
      type: object
      description: Credential request to get access to the API
      properties:
        consumerKey:
          type: string
          description: Consumer Key to use for further authenticated calls
          format: password
          readOnly: true
        state:
          description: State of the credential
          readOnly: true
          type: string
          enum:
            - expired
            - pendingValidation
            - refused
            - validated
        validationUrl:
          type: string
          description: Address where to redirect the client to validate the access
          readOnly: true
    auth.ApiCredential:
      type: object
      description: API Credential
      properties:
        allowedIPs:
          type: array
          description: If defined, list of ip blocks which are allowed to call API with this credential
          nullable: true
          items:
            $ref: '#/components/schemas/ipBlock'
        applicationId:
          type: integer
          description: ID of associated API Application
          readOnly: true
        creation:
          type: string
          description: Creation date of this credential
          format: date-time
          readOnly: true
        credentialId:
          type: integer
          description: ID of this credential
          readOnly: true
        expiration:
          type: string
          description: Expiration date of this credential
          nullable: true
          format: date-time
          readOnly: true
        lastUse:
          type: string
          description: Last use date of this credential
          nullable: true
          format: date-time
          readOnly: true
        ovhSupport:
          type: boolean
          description: States whether this credential has been created by yourself or by the OVH support team
          readOnly: true
        rules:
          type: array
          description: API routes allowed to this credential
          items:
            $ref: '#/components/schemas/auth.AccessRule'
          readOnly: true
        status:
          description: State of to this credential
          readOnly: true
          type: string
          enum:
            - expired
            - pendingValidation
            - refused
            - validated
    auth.Details:
      type: object
      description: Details about the authentication used
      properties:
        account:
          type: string
          description: Customer identifier
          readOnly: true
        allowedRoutes:
          type: array
          description: Allowed API routes, null means everything
          nullable: true
          items:
            $ref: '#/components/schemas/auth.AccessRule'
          readOnly: true
        description:
          type: string
          description: Description of the authenticated identity
          nullable: true
          readOnly: true
        identities:
          type: array
          description: 'Identities of the current session: corresponds to all the authentication provider identities that could be used to match IAM policies'
          items:
            type: string
          readOnly: true
        method:
          description: Authentication method
          readOnly: true
          type: string
          enum:
            - account
            - oauth2_client_credentials
            - provider
            - user
        roles:
          type: array
          description: Roles of the authenticated identity
          nullable: true
          items:
            type: string
          readOnly: true
        user:
          type: string
          description: Username of the authenticated identity
          nullable: true
          readOnly: true
    auth.Token:
      type: object
      description: One-time token usable on OVHcloud's applications (only supported by chatbot for the moment)
      properties:
        token:
          type: string
          description: One-time token
          format: password
          readOnly: true
    auth.AccessRuleRequest:
      type: object
      description: Access rule requested for the application
      properties:
        method:
          description: Allowed Method
          type: string
          enum:
            - DELETE
            - GET
            - PATCH
            - POST
            - PUT
        path:
          type: string
          description: Allowed path
    ipBlock:
      type: string
      description: IP (v4 or v6) CIDR notation (e.g., 192.0.2.0/24)
      format: ip-block
      example: 192.0.2.0/24
    auth.CredentialStateEnum:
      type: string
      description: All states a Credential can be in
      enum:
        - expired
        - pendingValidation
        - refused
        - validated
    auth.AccessRule:
      type: object
      description: Access rule allowed to an application
      properties:
        method:
          description: Allowed Method
          readOnly: true
          type: string
          enum:
            - DELETE
            - GET
            - PATCH
            - POST
            - PUT
        path:
          type: string
          description: Allowed path
          readOnly: true
    auth.MethodEnum:
      type: string
      description: All authentication methods available
      enum:
        - account
        - oauth2_client_credentials
        - provider
        - user
    auth.HTTPMethodEnum:
      type: string
      description: All HTTP methods available
      enum:
        - DELETE
        - GET
        - PATCH
        - POST
        - PUT
  x-stackQL-resources:
    credentials:
      id: ovh.auth.credentials
      name: credentials
      title: Credentials
      methods:
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1auth~1credential/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select: []
        insert:
          - $ref: '#/components/x-stackQL-resources/credentials/methods/create'
        update: []
        delete: []
        replace: []
    current_credentials:
      id: ovh.auth.current_credentials
      name: current_credentials
      title: Current Credentials
      methods:
        get:
          operation:
            $ref: '#/paths/~1auth~1currentCredential/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/current_credentials/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
    details:
      id: ovh.auth.details
      name: details
      title: Details
      methods:
        get:
          operation:
            $ref: '#/paths/~1auth~1details/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/details/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
    logouts:
      id: ovh.auth.logouts
      name: logouts
      title: Logouts
      methods:
        create:
          operation:
            $ref: '#/paths/~1auth~1logout/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select: []
        insert:
          - $ref: '#/components/x-stackQL-resources/logouts/methods/create'
        update: []
        delete: []
        replace: []
    times:
      id: ovh.auth.times
      name: times
      title: Times
      methods:
        get:
          operation:
            $ref: '#/paths/~1auth~1time/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            overrideMediaType: application/json
            schema_override:
              type: object
              properties:
                value:
                  type: integer
            transform:
              type: golang_template_text_v0.3.0
              body: '{"value": {{ . }}}'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/times/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
    tokens:
      id: ovh.auth.tokens
      name: tokens
      title: Tokens
      methods:
        create:
          operation:
            $ref: '#/paths/~1auth~1token/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select: []
        insert:
          - $ref: '#/components/x-stackQL-resources/tokens/methods/create'
        update: []
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v1
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
