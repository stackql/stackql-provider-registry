openapi: 3.0.0
info:
  title: OVHcloud Dedicated Clusters API
  description: Dedicated server clusters and their availabilities.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/dedicated/cluster
paths:
  /dedicated/cluster:
    get:
      summary: List dedicated clusters
      description: Returns the IDs of the dedicated clusters of the account. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_clusterResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Cluster
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: clusterDelivery:apiovh:get
          required: true
      x-expanded-response: DedicatedClusterClusterWithIAM
      operationId: get_v1_dedicated_cluster
  /dedicated/cluster/availabilities:
    get:
      summary: List cluster configuration availability
      description: Returns the cluster configurations that match the requested quantity, hardware parts and plan code, with their availability for each region. This call does not require authentication. (Deprecated, will be removed)
      deprecated: true
      x-deprecation-date: '2025-09-23T00:00:00Z'
      x-deletion-date: '2025-12-02T00:00:00Z'
      parameters:
        - in: query
          name: memory
          description: The name of the memory hardware part
          schema:
            type: string
        - in: query
          name: planCode
          description: The plan code in which the hardware is involved
          schema:
            type: string
        - in: query
          name: quantity
          description: Cluster quantity
          required: true
          schema:
            type: integer
        - in: query
          name: server
          description: The name of the base hardware
          schema:
            type: string
        - in: query
          name: storage
          description: The name of the storage hardware part
          schema:
            type: string
        - in: query
          name: systemStorage
          description: The name of the system storage hardware part
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_cluster_availabilitiesResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Cluster
      x-badges:
        - color: red
          label: Deprecated, will be removed
      operationId: get_v1_dedicated_cluster_availabilities
  /dedicated/cluster/availabilities/raw:
    get:
      summary: List the raw cluster hardware availability
      description: 'Returns the raw availability of cluster hardware: for each region, the real stock, the real stock including parent references, and the last rule applied. Filter by quantity, hardware parts, plan code and regions, and set excludeRegions to return every region except those listed. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: excludeRegions
          description: If true, all regions are returned except those listed in regions parameter
          schema:
            type: boolean
        - in: query
          name: memory
          description: The name of the memory hardware part
          schema:
            type: string
        - in: query
          name: planCode
          description: The plan code in which the hardware is involved
          schema:
            type: string
        - in: query
          name: quantity
          description: Node quantity
          required: true
          schema:
            type: integer
        - in: query
          name: regions
          description: The names of regions separated by commas
          schema:
            $ref: '#/components/schemas/dedicated.server.AvailabilityRegionalizationEnum'
        - in: query
          name: server
          description: The name of the base hardware
          schema:
            type: string
        - in: query
          name: storage
          description: The name of the storage hardware part
          schema:
            type: string
        - in: query
          name: systemStorage
          description: The name of the system storage hardware part
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_dedicated_cluster_availabilities_rawResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Cluster
      x-badges:
        - color: blue
          label: Beta version
      operationId: get_v1_dedicated_cluster_availabilities_raw
  /dedicated/cluster/{serviceName}:
    get:
      summary: Get a dedicated cluster
      description: Returns the ID, model, region and status of a dedicated cluster, and its nodes. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated.cluster.ClusterWithIAM'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Cluster
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: clusterDelivery:apiovh:get
          required: true
      operationId: get_v1_dedicated_cluster_service_name
  /dedicated/cluster/{serviceName}/changeContact:
    post:
      summary: Launch a contact change procedure
      description: Starts a contact change procedure for the admin, billing or tech contact of the cluster. Returns the IDs of the contact change tasks. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.changeContact'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_dedicated_cluster_service_name_change_contactResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Cluster
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: clusterDelivery:apiovh:changeContact
          required: true
      operationId: post_v1_dedicated_cluster_service_name_change_contact
  /dedicated/cluster/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirms the termination of the cluster with the token sent by email to the admin contact. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.confirmTermination'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Cluster
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: clusterDelivery:apiovh:confirmTermination
          required: true
      operationId: post_v1_dedicated_cluster_service_name_confirm_termination
  /dedicated/cluster/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Returns the billing information of the cluster, such as creation and expiration dates, contacts and renewal settings. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Cluster
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: clusterDelivery:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_dedicated_cluster_service_name_service_infos
    put:
      summary: Update service information
      description: Updates the renewal settings of the cluster. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Cluster
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: clusterDelivery:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_dedicated_cluster_service_name_service_infos
  /dedicated/cluster/{serviceName}/terminate:
    post:
      summary: Ask for the termination of your service
      description: Starts the termination of the cluster and sends a confirmation token by email to the admin contact. Confirm it with the termination confirmation. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Dedicated Servers
          - Cluster
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: clusterDelivery:apiovh:terminate
          required: true
      operationId: post_v1_dedicated_cluster_service_name_terminate
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    dedicated.cluster.availability:
      type: object
      description: Cluster availability
      properties:
        clusterPlanCode:
          type: string
          description: Plan code in which the hardware is involved
          readOnly: true
        fqn:
          type: string
          description: Fully qualified name and unique name of the hardware
          readOnly: true
        memory:
          type: string
          description: Name of the memory hardware part
          readOnly: true
        planCode:
          type: string
          description: Plan code in which the hardware is involved
          readOnly: true
        regions:
          type: array
          description: A structure describing the hardware availability for each datacenter
          items:
            $ref: '#/components/schemas/dedicated.cluster.RegionAvailability'
          readOnly: true
        server:
          type: string
          description: Name of the base hardware
          readOnly: true
        storage:
          type: string
          description: Name of the storage hardware part
          readOnly: true
        systemStorage:
          type: string
          description: Name of the system storage hardware part
          nullable: true
          readOnly: true
    dedicated.server.AvailabilityRegionalizationEnum:
      type: string
      description: The region
      enum:
        - ap-south-1
        - ap-southeast-sgp
        - ap-southeast-syd
        - ca-east-1
        - ca-east-bhs
        - eu-central-waw
        - eu-west-eri
        - eu-west-gra
        - eu-west-lim
        - eu-west-par
        - eu-west-rbx
        - eu-west-sbg
        - us-east-vin
        - us-west-hil
    dedicated.cluster.AvailabilitiesRaw:
      type: object
      description: Cluster availability
      properties:
        clusterPlanCode:
          type: string
          description: Plan code in which the hardware is involved
          readOnly: true
        fqn:
          type: string
          description: Fully qualified name and unique name of the hardware
          readOnly: true
        memory:
          type: string
          description: Name of the memory hardware part
          readOnly: true
        planCode:
          type: string
          description: Plan code in which the hardware is involved
          readOnly: true
        regions:
          type: array
          description: A structure describing the hardware availability for each region
          items:
            $ref: '#/components/schemas/dedicated.cluster.AvailabilitiesRawRegion'
          readOnly: true
        server:
          type: string
          description: Name of the base hardware
          readOnly: true
        storage:
          type: string
          description: Name of the storage hardware part
          readOnly: true
        systemStorage:
          type: string
          description: Name of the system storage hardware part
          nullable: true
          readOnly: true
    dedicated.cluster.ClusterWithIAM:
      type: object
      description: A structure describing the dedicated cluster
      properties:
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        id:
          type: string
          description: Cluster's ID
          format: uuid
          readOnly: true
        model:
          type: string
          description: Model of the cluster
          readOnly: true
        nodes:
          type: array
          description: Cluster's nodes
          items:
            $ref: '#/components/schemas/dedicated.cluster.Node'
          readOnly: true
        region:
          type: string
          description: Region where cluster is located
          readOnly: true
        status:
          type: string
          description: Cluster status
          readOnly: true
    services.changeContact:
      type: object
      description: Service change contact payload
      properties:
        contactAdmin:
          type: string
          description: The contact to set as admin contact
        contactBilling:
          type: string
          description: The contact to set as billing contact
        contactTech:
          type: string
          description: The contact to set as tech contact
    services.confirmTermination:
      type: object
      description: Service confirm termination payload
      properties:
        commentary:
          type: string
          description: Commentary about your termination request
        commentaryFutureUse:
          type: string
          description: Commentary about your future use
        commentaryReason:
          type: string
          description: Commentary about your reason for termination request
        futureUse:
          description: All future uses you can provide for a service termination
          type: string
          enum:
            - NOT_REPLACING_SERVICE
            - OTHER
            - SUBSCRIBE_AN_OTHER_SERVICE
            - SUBSCRIBE_OTHER_KIND_OF_SERVICE_WITH_COMPETITOR
            - SUBSCRIBE_SIMILAR_SERVICE_WITH_COMPETITOR
        reason:
          description: All reasons you can provide for a service termination
          type: string
          enum:
            - FEATURES_DONT_SUIT_ME
            - LACK_OF_PERFORMANCES
            - MIGRATED_TO_ANOTHER_OVH_PRODUCT
            - MIGRATED_TO_COMPETITOR
            - NOT_ENOUGH_RECOGNITION
            - NOT_NEEDED_ANYMORE
            - NOT_RELIABLE
            - NO_ANSWER
            - OTHER
            - PRODUCT_DIMENSION_DONT_SUIT_ME
            - PRODUCT_TOOLS_DONT_SUIT_ME
            - TOO_EXPENSIVE
            - TOO_HARD_TO_USE
            - UNSATIFIED_BY_CUSTOMER_SUPPORT
        token:
          type: string
          description: The termination token sent by email to the admin contact
      required:
        - token
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - manual
            - oneShot
            - option
        serviceId:
          type: integer
          readOnly: true
        status:
          readOnly: true
          type: string
          description: service.StateEnum
          enum:
            - autorenewInProgress
            - expired
            - inCreation
            - ok
            - pendingDebt
            - unPaid
    iam.resource.TagFilter.OperatorEnum:
      type: string
      description: Operator that can be used in order to filter resources tags
      enum:
        - EQ
        - EXISTS
        - ILIKE
        - LIKE
        - NEQ
        - NEXISTS
    dedicated.cluster.RegionAvailability:
      type: object
      description: A structure describing the availabilities of dedicated server
      properties:
        availability:
          description: The availability
          readOnly: true
          type: string
          enum:
            - 120H
            - 1440H
            - 1H-high
            - 1H-low
            - 2160H
            - 240H
            - 24H
            - 480H
            - 720H
            - 72H
            - comingSoon
            - unavailable
            - unknown
        region:
          description: The region
          readOnly: true
          type: string
          enum:
            - ap-south-1
            - ap-southeast-sgp
            - ap-southeast-syd
            - ca-east-1
            - ca-east-bhs
            - eu-central-waw
            - eu-west-eri
            - eu-west-gra
            - eu-west-lim
            - eu-west-par
            - eu-west-rbx
            - eu-west-sbg
            - us-east-vin
            - us-west-hil
    dedicated.cluster.AvailabilitiesRawRegion:
      type: object
      description: A structure describing the hardware raw availability for each region
      properties:
        availability:
          description: The availability
          readOnly: true
          type: string
          enum:
            - 120H
            - 1440H
            - 1H-high
            - 1H-low
            - 2160H
            - 240H
            - 24H
            - 480H
            - 720H
            - 72H
            - comingSoon
            - unavailable
            - unknown
        lastRule:
          type: string
          description: Last availability rule applied
          nullable: true
          readOnly: true
        parentAvailable:
          type: integer
          description: Real stock including parent references
          readOnly: true
        region:
          description: The region code
          readOnly: true
          type: string
          enum:
            - 120H
            - 1440H
            - 1H-high
            - 1H-low
            - 2160H
            - 240H
            - 24H
            - 480H
            - 720H
            - 72H
            - comingSoon
            - unavailable
            - unknown
        trueAvailable:
          type: integer
          description: Real stock
          readOnly: true
    iam.ResourceMetadata:
      type: object
      description: IAM resource metadata embedded in services models
      properties:
        displayName:
          type: string
          description: Resource display name
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the resource
          format: uuid
          readOnly: true
        state:
          description: Resource state
          nullable: true
          readOnly: true
          type: string
          enum:
            - EXPIRED
            - IN_CREATION
            - OK
            - SUSPENDED
        tags:
          type: object
          description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
          nullable: true
          additionalProperties:
            type: string
          readOnly: true
        urn:
          type: string
          description: Unique resource name used in policies
          readOnly: true
    dedicated.cluster.Node:
      type: object
      description: A structure describing the nodes of the cluster
      properties:
        id:
          type: string
          description: ID of the node
          format: uuid
          readOnly: true
        serverId:
          type: integer
          description: ID of the server
          readOnly: true
        serverName:
          type: string
          description: Name of the server
          readOnly: true
    service.TerminationFutureUseEnum:
      type: string
      description: All future uses you can provide for a service termination
      enum:
        - NOT_REPLACING_SERVICE
        - OTHER
        - SUBSCRIBE_AN_OTHER_SERVICE
        - SUBSCRIBE_OTHER_KIND_OF_SERVICE_WITH_COMPETITOR
        - SUBSCRIBE_SIMILAR_SERVICE_WITH_COMPETITOR
    service.TerminationReasonEnum:
      type: string
      description: All reasons you can provide for a service termination
      enum:
        - FEATURES_DONT_SUIT_ME
        - LACK_OF_PERFORMANCES
        - MIGRATED_TO_ANOTHER_OVH_PRODUCT
        - MIGRATED_TO_COMPETITOR
        - NOT_ENOUGH_RECOGNITION
        - NOT_NEEDED_ANYMORE
        - NOT_RELIABLE
        - NO_ANSWER
        - OTHER
        - PRODUCT_DIMENSION_DONT_SUIT_ME
        - PRODUCT_TOOLS_DONT_SUIT_ME
        - TOO_EXPENSIVE
        - TOO_HARD_TO_USE
        - UNSATIFIED_BY_CUSTOMER_SUPPORT
    service.RenewType:
      type: object
      description: Map a possible renew for a specific service
      properties:
        automatic:
          type: boolean
          description: The service is automatically renewed
        deleteAtExpiration:
          type: boolean
          description: The service will be deleted at expiration
        forced:
          type: boolean
          description: The service forced to be renewed
        manualPayment:
          type: boolean
          description: The service needs to be manually renewed and paid
          nullable: true
        period:
          type: integer
          description: period of renew in month
          nullable: true
    service.RenewalTypeEnum:
      type: string
      description: Detailed renewal type of a service
      enum:
        - automaticForcedProduct
        - automaticV2012
        - automaticV2014
        - automaticV2016
        - manual
        - oneShot
        - option
    service.StateEnum:
      type: string
      description: service.StateEnum
      enum:
        - autorenewInProgress
        - expired
        - inCreation
        - ok
        - pendingDebt
        - unPaid
    dedicated.server.AvailabilityEnum:
      type: string
      description: The availability
      enum:
        - 120H
        - 1440H
        - 1H-high
        - 1H-low
        - 2160H
        - 240H
        - 24H
        - 480H
        - 720H
        - 72H
        - comingSoon
        - unavailable
        - unknown
    iam.ResourceMetadata.StateEnum:
      type: string
      description: Resource state
      enum:
        - EXPIRED
        - IN_CREATION
        - OK
        - SUSPENDED
    Get_v1_dedicated_clusterResponse:
      type: object
      properties:
        v1_dedicated_cluster:
          type: array
          items:
            $ref: '#/components/schemas/dedicated.cluster.ClusterWithIAM'
    Get_v1_dedicated_cluster_availabilitiesResponse:
      type: object
      properties:
        v1_dedicated_cluster_availabilities:
          type: array
          items:
            $ref: '#/components/schemas/dedicated.cluster.availability'
    Get_v1_dedicated_cluster_availabilities_rawResponse:
      type: object
      properties:
        v1_dedicated_cluster_availabilities_raw:
          type: array
          items:
            $ref: '#/components/schemas/dedicated.cluster.AvailabilitiesRaw'
    Post_v1_dedicated_cluster_service_name_change_contactResponse:
      type: object
      properties:
        post_v1_dedicated_cluster_service_name_change_contact:
          type: array
          items:
            type: object
