openapi: 3.0.0
info:
  title: OVHcloud Windows Licenses API
  description: Microsoft Windows licenses and their options.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/license/windows
paths:
  /license/windows:
    get:
      summary: List available services
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_windowsResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:get
          required: true
      x-expanded-response: LicenseWindowsWindowsWithIAM
      operationId: get_v1_license_windows
      description: List available services
  /license/windows/orderableVersions:
    get:
      summary: Get the orderable Windows versions
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: ip
          description: Your license Ip
          required: true
          schema:
            $ref: '#/components/schemas/ipv4'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_windows_orderable_versionsResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: account:apiovh:licenseWindows/orderableVersions/get
          required: true
      operationId: get_v1_license_windows_orderable_versions
      description: Get the orderable Windows versions
  /license/windows/{serviceName}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.windows.WindowsWithIAM'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:get
          required: true
      operationId: get_v1_license_windows_service_name
      description: Get this object properties
    put:
      summary: Alter this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.windows.Windows'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:put
          required: true
      operationId: put_v1_license_windows_service_name
      description: Alter this object properties
  /license/windows/{serviceName}/confirmTermination:
    post:
      summary: Confirm service termination
      description: Confirm service termination. Terminates the service with the token sent by email to the admin contact. A reason, a future use and a comment can be given.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentary:
                  type: string
                  description: Commentary about your termination request
                futureUse:
                  description: What next after your termination request
                  $ref: '#/components/schemas/service.TerminationFutureUseEnum'
                reason:
                  description: Reason of your termination request
                  $ref: '#/components/schemas/service.TerminationReasonEnum'
                token:
                  type: string
                  description: The termination token sent by email to the admin contact
              required:
                - token
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:confirmTermination
          required: true
      operationId: post_v1_license_windows_service_name_confirm_termination
  /license/windows/{serviceName}/option:
    get:
      summary: options attached to this license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_windows_service_name_optionResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:option/get
          required: true
      x-expanded-response: LicenseOption
      operationId: get_v1_license_windows_service_name_option
      description: options attached to this license
  /license/windows/{serviceName}/option/{label}:
    delete:
      summary: release this Option
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: label
          description: This option designation
          required: true
          schema:
            $ref: '#/components/schemas/license.OptionLabel'
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:option/delete
          required: true
      operationId: delete_v1_license_windows_service_name_option_label
      description: release this Option
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: label
          description: This option designation
          required: true
          schema:
            $ref: '#/components/schemas/license.OptionLabel'
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Option'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:option/get
          required: true
      operationId: get_v1_license_windows_service_name_option_label
      description: Get this object properties
  /license/windows/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_license_windows_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_license_windows_service_name_service_infos
  /license/windows/{serviceName}/sqlServer:
    post:
      summary: Link your own sql server license to this Windows license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                licenseId:
                  type: string
                  description: Your license serial number
                version:
                  description: Your license version
                  $ref: '#/components/schemas/license.WindowsSqlVersionEnum'
              required:
                - licenseId
                - version
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:sqlServer/create
          required: true
      operationId: post_v1_license_windows_service_name_sql_server
      description: Link your own sql server license to this Windows license
  /license/windows/{serviceName}/tasks:
    get:
      summary: tasks linked to this license
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: action
          description: Filter the value of action property (=)
          schema:
            $ref: '#/components/schemas/license.ActionType'
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
        - in: query
          name: status
          description: Filter the value of status property (=)
          schema:
            $ref: '#/components/schemas/license.TaskStateEnum'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_windows_service_name_tasksResponse'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:tasks/get
          required: true
      x-expanded-response: LicenseTask
      operationId: get_v1_license_windows_service_name_tasks
      description: tasks linked to this license
  /license/windows/{serviceName}/tasks/{taskId}:
    get:
      summary: Get this object properties
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          description: This Task id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.Task'
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:tasks/get
          required: true
      operationId: get_v1_license_windows_service_name_tasks_task_id
      description: Get this object properties
  /license/windows/{serviceName}/terminate:
    post:
      summary: Request service termination
      description: Request service termination. Starts the termination of the service. The admin contact receives a token by email, to confirm with the `confirmTermination` call.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The name of your Windows license
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
      x-developer-hub-navigation:
        - - Bare Metal Cloud
          - Licenses
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseWindows:apiovh:terminate
          required: true
      operationId: post_v1_license_windows_service_name_terminate
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    ipv4:
      type: string
      description: IPv4 address (e.g., 192.0.2.0)
      format: ipv4
      example: 192.0.2.0
    license.WindowsOrderConfiguration:
      type: object
      description: Allowed windows versions and their compliant options per matching serviceTypes
      properties:
        orderableVersions:
          type: array
          items:
            $ref: '#/components/schemas/license.OrderableWindowsCompatibilityInfos'
        serviceType:
          $ref: '#/components/schemas/license.LicenseTypeEnum'
    license.windows.WindowsWithIAM:
      type: object
      description: Your Windows license
      properties:
        creation:
          type: string
          description: This license creation date
          format: date-time
          readOnly: true
        deleteAtExpiration:
          type: boolean
          description: Shall we delete this on expiration ?
        domain:
          type: string
          description: The internal name of your license
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        ip:
          description: The ip on which this license is attached
          readOnly: true
          type: string
          format: ipv4
          example: 192.0.2.0
        licenseId:
          type: string
          description: The license id on license provider side
          readOnly: true
        status:
          description: This license state
          readOnly: true
          type: string
          enum:
            - ok
            - released
            - terminated
            - toDeliver
        version:
          description: This license version
          readOnly: true
          type: string
          enum:
            - WINDOWS_SERVER_2003_ENTERPRISE_EDITION
            - WINDOWS_SERVER_2003_ENTERPRISE_EDITION_2_CPU
            - WINDOWS_SERVER_2003_STANDARD_EDITION
            - WINDOWS_SERVER_2003_WEB_EDITION
