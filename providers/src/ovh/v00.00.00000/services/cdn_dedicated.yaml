components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    dbaas.logs.LogKind:
      type: object
      description: Log kind
      properties:
        additionalReturnedFields:
          type: array
          description: List of additional log fields managed in this log kind
          items:
            type: string
          readOnly: true
        createdAt:
          type: string
          description: Creation date of the log kind
          format: date-time
          readOnly: true
        displayName:
          type: string
          description: Log kind display name
          readOnly: true
        kindId:
          type: string
          description: Log kind ID
          format: uuid
          readOnly: true
        name:
          type: string
          description: Log kind name
          readOnly: true
        updatedAt:
          type: string
          description: Last update date of the log kind
          format: date-time
          readOnly: true
    cdnanycast.Pop:
      type: object
      description: CDN Pop
      properties:
        city:
          type: string
          readOnly: true
        comment:
          type: string
          readOnly: true
        name:
          type: string
          description: Name of the pop
          readOnly: true
        status:
          readOnly: true
          type: string
          description: All Pop status
          enum:
            - down
            - ok
            - rerouted
            - unknown
    cdnanycast.AnycastWithIAM:
      type: object
      description: Anycast IP of a CDN customer
      properties:
        anycast:
          readOnly: true
          type: string
          description: IPv4 address (e.g., 192.0.2.0)
          format: ipv4
          example: 192.0.2.0
        backendLimit:
          type: integer
          readOnly: true
        backendUse:
          type: integer
          readOnly: true
        cacheRuleLimitPerDomain:
          type: integer
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
