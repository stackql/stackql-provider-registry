openapi: 3.0.0
info:
  title: OVHcloud Microsoft Office Licenses API
  description: 'Microsoft Office license tenants: domains, users and usage statistics.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/license/office
paths:
  /license/office:
    get:
      summary: List tenants
      description: Returns the service names of the tenants. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_officeResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - General Information@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOffice:apiovh:get
          required: true
      x-expanded-response: LicenseOfficeOfficeTenantNativeWithIAM
      operationId: get_v1_license_office
  /license/office/{serviceName}:
    get:
      summary: Get a tenant
      description: Returns the display name, contact details, service type, status and creation date of the tenant, and whether the Microsoft Customer Agreement (MCA) is accepted. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.office.OfficeTenantNativeWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - General Information@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOffice:apiovh:get
          required: true
      operationId: get_v1_license_office_service_name
    put:
      summary: Update a tenant
      description: 'Updates the display name and the contact details of the tenant: first name, last name, address, zip code, city and phone number. (Alpha version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.office.OfficeTenantNative'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - General Information@@@30
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOffice:apiovh:edit
          required: true
      operationId: put_v1_license_office_service_name
  /license/office/{serviceName}/domain:
    get:
      summary: List domains
      description: Returns the names of the domains of the tenant. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_office_service_name_domainResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Domains@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOffice:apiovh:domain/get
          required: true
      x-expanded-response: LicenseOfficeDomainNative
      operationId: get_v1_license_office_service_name_domain
  /license/office/{serviceName}/domain/{domainName}:
    get:
      summary: Get a domain
      description: Returns the status of the domain, `ok` or `unverified`, and the TXT record required to validate it. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: domainName
          description: Domain name
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.office.DomainNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Domains@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOffice:apiovh:domain/get
          required: true
      x-response-identifier: domainName
      operationId: get_v1_license_office_service_name_domain_domain_name
  /license/office/{serviceName}/pendingTask:
    get:
      summary: List tenant tasks
      description: Returns the IDs of the pending tasks of the tenant. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_office_service_name_pending_taskResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Tasks@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOffice:apiovh:pendingTask/get
          required: true
      x-expanded-response: LicenseOfficeOfficeTaskNative
      operationId: get_v1_license_office_service_name_pending_task
  /license/office/{serviceName}/pendingTask/{id}:
    get:
      summary: Get a tenant task
      description: Returns the function, status, creation date and completion date of the task. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: id
          description: Id
          required: true
          schema:
            type: integer
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.office.OfficeTaskNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Tasks@@@20
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOffice:apiovh:pendingTask/get
          required: true
      x-response-identifier: id
      operationId: get_v1_license_office_service_name_pending_task_id
  /license/office/{serviceName}/serviceInfos:
    get:
      summary: Get service information
      description: Get service information. Returns the status, creation and expiration dates, contacts and renewal settings of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The unique identifier of your Office service
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - General Information@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseOffice:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_license_office_service_name_service_infos
    put:
      summary: Update service information
      description: 'Update service information. Updates the renewal settings of the service: automatic renewal, period, or deletion at expiration.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: The unique identifier of your Office service
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - General Information@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseOffice:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_license_office_service_name_service_infos
  /license/office/{serviceName}/usageStatistics:
    get:
      summary: Get tenant usage statistics
      description: Returns, for each day between `from` and `to`, the peak and end-of-day counts of activated licenses of the tenant, by license type. (Alpha version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: from
          description: Period's start point
          schema:
            type: string
            format: date-time
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: query
          name: to
          description: Period's end point
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_office_service_name_usage_statisticsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Usage@@@10
      x-badges:
        - color: blue
          label: Alpha version
      x-iam-actions:
        - name: licenseOffice:apiovh:usageStatistics/get
          required: true
      operationId: get_v1_license_office_service_name_usage_statistics
  /license/office/{serviceName}/user:
    get:
      summary: List users
      description: Returns the activation emails of the users of the tenant. Filter them by `activationEmail`, `firstName`, `lastName` or `licences`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: activationEmail
          schema:
            type: string
        - in: query
          name: firstName
          schema:
            type: string
        - in: query
          name: lastName
          schema:
            type: string
        - in: query
          name: licences
          schema:
            type: array
            items:
              $ref: '#/components/schemas/license.office.LicenseEnum'
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_license_office_service_name_userResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseOffice:apiovh:user/get
          required: true
      x-expanded-response: LicenseOfficeOfficeUserNative
      operationId: get_v1_license_office_service_name_user
    post:
      summary: Create a user
      description: Creates a user from a `login` on a `domain` of the tenant, with a license, optional first and last names and a usage location, and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.office.PostUserNative'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.office.OfficeTaskNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseOffice:apiovh:user/create
          required: true
      operationId: post_v1_license_office_service_name_user
  /license/office/{serviceName}/user/{activationEmail}:
    delete:
      summary: Delete a user
      description: Deletes the user and returns the task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: activationEmail
          description: Activation email
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.office.OfficeTaskNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@50
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseOffice:apiovh:user/delete
          required: true
      operationId: delete_v1_license_office_service_name_user_activation_email
    get:
      summary: Get a user
      description: Returns the names, activation email, licenses and state of the user. `isVirtual` tells whether it is a user slot or a real user.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: activationEmail
          description: Activation email
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.office.OfficeUserNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseOffice:apiovh:user/get
          required: true
      x-response-identifier: activationEmail
      operationId: get_v1_license_office_service_name_user_activation_email
    put:
      summary: Update a user
      description: Updates the first name, last name and activation email of the user, and `deleteAtExpiration`, which ends the user slot at the next renewal.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: activationEmail
          description: Activation email
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.office.OfficeUserNativeUpdate'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseOffice:apiovh:user/edit
          required: true
      operationId: put_v1_license_office_service_name_user_activation_email
  /license/office/{serviceName}/user/{activationEmail}/changePassword:
    post:
      summary: Change a user password
      description: Changes the password of the user and returns the task. Leave `password` empty to receive a generated password by email. Set `shouldSendMail` to send the new password to `notifyEmail`, the admin contact email by default.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: activationEmail
          description: Activation email
          required: true
          schema:
            type: string
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/license.office.OfficeTenantPostChangePassword'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/license.office.OfficeTaskNative'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft 365
          - Licenses@@@60
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: licenseOffice:apiovh:user/changePassword
          required: true
      operationId: post_v1_license_office_service_name_user_activation_email_change_password
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    license.office.OfficeTenantNativeWithIAM:
      type: object
      description: Office tenant
      properties:
        address:
          type: string
          description: Contact's address line
        city:
          type: string
          description: Contact's city
        creationDate:
          type: string
          description: Creation date
          format: date-time
          readOnly: true
        displayName:
          type: string
          description: Tenant's display name
        firstName:
          type: string
          description: Contact's first name
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        lastName:
          type: string
          description: Contact's last name
        mcaAgreed:
          type: boolean
          description: MCA acceptance status
        phone:
          description: Primary phone number
          type: string
          format: phone-number
        serviceName:
          type: string
          description: Internal service name
          readOnly: true
        serviceType:
          description: Tenant's service type
          readOnly: true
          type: string
          enum:
            - payAsYouGo
            - prepaid
        status:
          description: Tenant's status
          readOnly: true
          type: string
          enum:
            - creating
            - inMaintenance
            - ok
            - reopening
            - suspended
            - suspending
        zipCode:
          type: string
          description: Contact's zip code
    license.office.OfficeTenantNative:
      type: object
      description: Office tenant
      properties:
        address:
          type: string
          description: Contact's address line
        city:
          type: string
          description: Contact's city
        creationDate:
          type: string
          description: Creation date
          format: date-time
          readOnly: true
        displayName:
          type: string
          description: Tenant's display name
        firstName:
          type: string
          description: Contact's first name
        lastName:
          type: string
          description: Contact's last name
        mcaAgreed:
          type: boolean
          description: MCA acceptance status
        phone:
          description: Primary phone number
          type: string
          format: phone-number
        serviceName:
          type: string
          description: Internal service name
          readOnly: true
        serviceType:
          description: Tenant's service type
          readOnly: true
          type: string
          enum:
            - payAsYouGo
            - prepaid
        status:
          description: Tenant's status
          readOnly: true
          type: string
          enum:
            - creating
            - inMaintenance
            - ok
            - reopening
            - suspended
            - suspending
        zipCode:
          type: string
          description: Contact's zip code
    license.office.DomainNative:
      type: object
      description: Office tenant
      properties:
        domainName:
          type: string
          description: Domain name
          readOnly: true
        status:
          description: Domain status
          readOnly: true
          type: string
          enum:
            - ok
            - unverified
        txtEntry:
          type: string
          description: Domain status
          readOnly: true
    license.office.OfficeTaskNative:
      type: object
      description: Office tenant
      properties:
        finishDate:
          type: string
          description: Completion date
          nullable: true
          format: date-time
          readOnly: true
        function:
          type: string
          description: Function name
          readOnly: true
        id:
          type: integer
          description: Task's unique identifier
          readOnly: true
        status:
          description: Task's unique identifier
          readOnly: true
          type: string
          enum:
            - cancelled
            - doing
            - done
            - error
            - todo
        todoDate:
          type: string
          description: Creation date
          format: date-time
          readOnly: true
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - automaticV2024
            - manual
            - oneShot
            - option
        serviceId:
          type: integer
          readOnly: true
        status:
          readOnly: true
          type: string
          enum:
            - autorenewInProgress
            - expired
            - inCreation
            - ok
            - pendingDebt
            - unPaid
    license.office.OfficeCurrentStatisticsNative:
      type: object
      description: Office Current Statisitics
      properties:
        date:
          type: string
          description: Date of the statistics
          format: date
          readOnly: true
        lines:
          type: array
          description: List of lines associated to this statistics entity.
          items:
            $ref: '#/components/schemas/license.office.StatisticsLineNative'
          readOnly: true
    license.office.LicenseEnum:
      type: string
      description: Office tenant type
      enum:
        - officeBusiness
        - officeProPlus
    license.office.PostUserNative:
      type: object
      description: Office user
      properties:
        domain:
          type: string
          description: Office domain
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        licence:
          description: Licenses attributed to the user
          type: string
          enum:
            - officeBusiness
            - officeProPlus
        login:
          type: string
