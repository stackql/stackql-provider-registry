    publicCloud.instance.InstanceNetworkAddressTypeEnum:
      type: string
      description: 'Instance network address type. Nature of an IP address observed on an instance network interface, telling how the address reaches the instance. `FIXED`: An address assigned to the interface itself: the fixed address of a private interface (whether assigned by IPAM or pinned), or the platform-assigned or pinned Ext-Net address of the public interface. `FLOATING`: A floating IP NAT''d onto this interface: the address is not configured on the interface, the network translates it to the interface''s fixed address. `ADDITIONAL`: An additional IP (also known as a failover IP, implemented as an ipalias) routed to the instance''s public interface.'
      enum:
        - ADDITIONAL
        - FIXED
        - FLOATING
