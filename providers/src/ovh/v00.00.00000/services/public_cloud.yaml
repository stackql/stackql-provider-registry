  /reference/gateway/model:
    get:
      operationId: getGatewayModels
      summary: List gateway models
      description: 'Returns the gateway models with their bandwidth in Mbit/s, read from the OVHcloud commercial catalog. The list holds one entry per model and region: a model sold in several regions appears once per region, with the bandwidth of that region and the region in `location`. The regions already activated on the project and those the project can activate where a model is sold are both listed. `location.regionActivated` on each entry tells which regions must be activated on the project before use. `location.availabilityZones` lists the availability zones of the region, for example eu-west-par-a, eu-west-par-b and eu-west-par-c, and is empty for a single-AZ region. Models come smallest first, each sorted by region name. Use `name` as the model when creating a gateway.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: name
          description: Optional model filter, for example S
          schema:
            $ref: '#/components/schemas/publicCloud.gateway.ExternalGatewayModelEnum'
        - in: query
          name: region
          description: Optional region filter, case-insensitive. Keeps the entries of this region only. A region that does not exist is rejected. One the project can neither use nor activate returns an empty list.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
