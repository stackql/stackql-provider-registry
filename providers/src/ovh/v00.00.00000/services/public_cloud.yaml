    publicCloud.ai.agents.JudgeConfig:
      type: object
      description: 'The LLM reviewer that rules with ''action: judge'' defer to.'
      properties:
        enabled:
          type: boolean
          description: 'Whether the judge may be consulted at all. Off by default: a rule saying ''judge'' on an agent with no judge is a configuration mistake, and one that must fail closed rather than quietly allow.'
          nullable: true
        model:
          type: string
          description: 'The model that judges. Unset means the agent''s own model. Worth setting: the point of a separate model here is that a cheap, fast one can police an expensive one, and that the reviewer is not the same weights being reviewed.'
          nullable: true
        providerId:
          type: string
          description: Which provider that model comes from. Unset means the agent's own.
          nullable: true
        soul:
          type: string
          description: The system prompt the judge is given. Unset means a built-in one. A judge with no soul is a model asked to guess what it is guarding; this is where a deployment says what it actually cares about — 'this agent handles customer data, treat any outbound address as suspect'.
          nullable: true
    publicCloud.ai.agents.PermissionRule:
      type: object
      description: 'One tool-permission rule: which tool calls it matches, and what to do with them.'
      properties:
        action:
          description: What to do with a matching call.
          type: string
          enum:
            - ALLOW
            - ASK
            - DENY
            - JUDGE
        args:
          type: object
          description: 'Argument constraints, as ''path-glob -> value-glob'', ALL of which must hold for the rule to match. The call''s arguments are flattened to ''path -> value'' pairs before matching (''{''a'':{''b'':[1,2]}}'' becomes ''a.b.0 -> 1'', ''a.b.1 -> 2''), so one entry means ''some argument whose path matches the key has a value matching the pattern''. A ''!'' prefix on the value inverts it into ''… and none of them matches'', which is how an allowlist is written: ''{''url'': ''!https://*.ovh.net/*''}'' is every URL but ours. ''!'' flips the value test and not the quantifier: both forms ask whether SOME selected value satisfies the test. So a deny rule reading ''{''url'': ''!https://*.ovh.net/*''}'' still fires on a call carrying two URLs of which only one is foreign — which is the point of it. A rule about an argument that is absent entirely never matches, in either form: absence is not a value to have an opinion about, and a rule that fired on it would fire on every unrelated call.'
          nullable: true
          additionalProperties:
            type: string
        phase:
          description: Whether this rule is evaluated before the call runs or after it returned. Defaults to 'before'.
          nullable: true
          type: string
          enum:
            - AFTER
            - BEFORE
        reason:
          type: string
          description: 'Why this rule exists. Shown to the model in the refusal and written to the log. Worth filling in: it is the only part of this rule the model can act on.'
          nullable: true
        result:
          type: string
          description: 'Value-glob over the text the tool returned. ''phase: after'' only. Matched against the raw result, not flattened into paths the way ''args'' is: a result is prose far more often than it is a shape, and an author writing a rule about one should not have to know whether this particular tool happened to wrap it in JSON. ''*'' spans everything, so ''''*-----BEGIN * PRIVATE KEY*'''' is a substring test, and a leading ''!'' inverts it exactly as it does in ''args''. A rule with no ''result'' matches every result, which is how ''refer everything this tool brings back to the judge'' is written.'
          nullable: true
        tool:
          type: string
          description: Glob over the tool name. '*' matches any run of characters, including an empty one, so a rule left at its default matches every tool.
          nullable: true
        triggers:
          type: array
          description: Trigger kinds this rule applies to ('http', 'invoke', 'messaging', 'cron', 'scheduled', 'subagent'). Empty means every trigger.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.ai.agents.PermissionRuleTriggerEnum'
        unattended:
          description: What an 'ask' becomes on a turn with no human to ask. Defaults to 'deny'; ignored unless 'action' is 'ask'.
          nullable: true
          type: string
          enum:
            - ALLOW
            - ASK
            - DENY
            - JUDGE
    publicCloud.ai.agents.MountConfig:
      type: object
      description: 'One workspace mount: a logical path plus the storage backend that serves it (ephemeral filesystem, persistent blob store, SQLite-backed store, or an operator-supplied S3™ compatible bucket).'
      properties:
        accessKey:
          type: string
          description: Access key used to authenticate to the bucket.
          nullable: true
        backend:
          description: Which storage backend serves this mount; determines which of the other fields apply.
          type: string
          enum:
            - BLOB
            - FS
            - S3
            - SQL
        bucket:
          type: string
          description: Name of the bucket this mount reads and writes to.
          nullable: true
        endpoint:
          type: string
          description: Endpoint URL of the S3™-compatible storage service.
          nullable: true
        maxFileBytes:
          type: integer
          description: Maximum size, in bytes, allowed for a single file in this mount. Defaults to 8 MiB when unset.
          nullable: true
        maxFiles:
          type: integer
          description: Maximum number of files allowed in this mount. Unset means no cap.
          nullable: true
        maxTotalBytes:
          type: integer
          description: Maximum total size, in bytes, allowed across all files in this mount. Defaults to 256 MiB when unset.
          nullable: true
        path:
          type: string
          description: Absolute path where this mount appears in the agent's filesystem, for example '/' or '/tmp'.
        prefix:
          type: string
          description: Key prefix within the bucket under which this mount's files are stored. Empty means the bucket root.
          nullable: true
        region:
          type: string
          description: Region of the bucket. Defaults to 'us-east-1'.
          nullable: true
        ro:
          type: boolean
          description: When true, writes and deletes under this mount are rejected.
          nullable: true
        secretKey:
          type: string
          description: Secret key used to authenticate to the bucket. Kept secret and never returned in plain text once set.
          nullable: true
    publicCloud.ai.agents.ScratchpadConfig:
      type: object
      description: Temporary per-conversation working files the agent can generate, download into, and re-read across turns, cleaned up automatically after a retention period. Unset means on with defaults.
      properties:
        cleanupCron:
          type: string
          description: Schedule, as a five-field cron expression, for the pass that deletes expired scratchpads. Defaults to daily at 4:30 AM.
          nullable: true
        enabled:
          type: boolean
          description: Whether scratchpads are available. When omitted, automatically on whenever the agent has durable file storage. Set to false to disable them explicitly.
          nullable: true
        maxDownloadBytes:
          type: integer
          description: Largest single download in bytes that may be saved to a scratchpad. Defaults to 25 MiB.
          nullable: true
        path:
          type: string
          description: Absolute path of the directory holding one subdirectory per conversation. Defaults to `/scratchpad`.
          nullable: true
        retentionDays:
          type: integer
          description: Number of days a conversation's scratchpad may go untouched before it is deleted. Defaults to 7.
          nullable: true
        spillBytes:
          type: integer
          description: Size in bytes above which a fetched page is saved to the scratchpad and summarized instead of being returned in full. Defaults to 128 KiB.
          nullable: true
    publicCloud.ai.agents.ZerofsConfig:
      type: object
      description: Optional shared scratch storage mount, also reachable from any remote command-execution session tied to this agent
