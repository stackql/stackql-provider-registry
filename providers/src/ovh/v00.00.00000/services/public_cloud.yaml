openapi: 3.0.0
info:
  title: OVHcloud Public Cloud (v2) API
  description: 'Public Cloud projects through API v2: projects, compute instances, SSH keys, key management, AI endpoints, quotas and reference data.'
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/publicCloud
paths:
  /publicCloud/project:
    get:
      operationId: getAllProjects
      summary: List projects
      description: Returns the projects of the account with their current state.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllProjectsResponse'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:get
          required: true
      x-expanded-response: PublicCloudProjectProjectAsyncWithIAM
    servers:
      - url: https://{api_host}/v2
        variables:
          api_host:
            description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
            default: api.eu.ovhcloud.com
            x-stackQL-envVarSelector:
              envVar: OVH_ENDPOINT
              default: ovh-eu
              values:
                ovh-eu: api.eu.ovhcloud.com
                ovh-ca: api.ca.ovhcloud.com
                ovh-us: api.us.ovhcloud.com
  /publicCloud/project/{projectId}:
    get:
      operationId: getProject
      summary: Get a project
      description: Returns the project, its current state and its ongoing tasks.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: projectId
          description: Project ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.project.ProjectAsyncWithIAM'
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:get
          required: true
    servers:
      - url: https://{api_host}/v2
        variables:
          api_host:
            description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
            default: api.eu.ovhcloud.com
            x-stackQL-envVarSelector:
              envVar: OVH_ENDPOINT
              default: ovh-eu
              values:
                ovh-eu: api.eu.ovhcloud.com
                ovh-ca: api.ca.ovhcloud.com
                ovh-us: api.us.ovhcloud.com
  /ai/agents/agent:
    get:
      summary: List AI agents
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v2_public_cloud_project_project_id_ai_agents_agentResponse'
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/agent/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudAiAgentsAgent
      operationId: get_v2_public_cloud_project_project_id_ai_agents_agent
      description: List AI agents
    post:
      summary: Create an AI agent
      description: 'Creates an AI agent: a hosted assistant that answers on its own URL, given by `currentState.endpointUrl`, and reached with a token from the `token` action. An agent runs a model with a persona, plus whatever tools, memory and channels its configuration gives it. That configuration can come from a ready-made one published by OVHcloud, from a template of your own, or from settings supplied here — or from none of them, leaving an agent that cannot answer until it is given a model. Parts of it that OVHcloud manages are rejected here; the `globalSettings` preset says which. This is the only point at which this API sets an agent''s configuration: from here on the agent holds its own and is configured through its endpoint. Create it paused to finish preparing it before it answers anyone.'
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.ai.agents.AgentCreation'
            examples:
              Example:
                value:
                  targetSpec:
                    enabled: true
                    name: scout
                    template:
                      id: demo-assistant
                summary: Create an AI agent
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.Agent'
              examples:
                Example:
                  value:
                    createdAt: '2026-07-20T09:00:00Z'
                    currentState: null
                    id: 0659cc01b8ef6326d33a2ba0ae7a0317e529d925
                    resourceStatus: CREATING
                    targetSpec:
                      enabled: true
                      name: scout
                    updatedAt: '2026-07-20T09:05:00Z'
                  summary: The created AI agent
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/agent/create
          required: true
      operationId: post_v2_public_cloud_project_project_id_ai_agents_agent
  /ai/agents/agent/{agentId}:
    delete:
      summary: Delete an AI agent
      description: 'Deletion is asynchronous: the response describes the agent with `resourceStatus: DELETING`.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: agentId
          description: Agent ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.Agent'
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/agent/delete
          required: true
      operationId: delete_v2_public_cloud_project_project_id_ai_agents_agent_agent_id
    get:
      summary: Get an AI agent
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: agentId
          description: Agent ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.Agent'
              examples:
                Example:
                  value:
                    createdAt: '2026-07-20T09:00:00Z'
                    currentState:
                      enabled: true
                      endpointUrl: https://agents.example.ovhcloud.example/v1/kapp/0659cc01b8ef6326d33a2ba0ae7a0317e529d925
                      name: scout
                    id: 0659cc01b8ef6326d33a2ba0ae7a0317e529d925
                    resourceStatus: READY
                    targetSpec:
                      enabled: true
                      name: scout
                    updatedAt: '2026-07-20T09:05:00Z'
                  summary: A ready AI agent
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/agent/get
          required: true
      x-response-identifier: id
      operationId: get_v2_public_cloud_project_project_id_ai_agents_agent_agent_id
      description: Get an AI agent
    put:
      summary: Update an AI agent
      description: '`targetSpec.enabled` is mandatory, including on an update whose only intent is a rename. Restating the agent''s current running state changes nothing; stating the other one pauses or resumes it. `targetSpec.name` is optional: omitting it, or restating the current name, leaves it untouched. Any other name renames the agent and redeploys it, keeping its identifier, its access tokens, its configuration and its data, and re-applying its paused state. A name another agent in the project already holds is rejected. The configuration is not settable here; it is read and changed through the agent itself.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: agentId
          description: Agent ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.ai.agents.AgentUpdate'
            examples:
              Example:
                value:
                  targetSpec:
                    enabled: true
                summary: Update the AI agent
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.Agent'
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/agent/edit
          required: true
      operationId: put_v2_public_cloud_project_project_id_ai_agents_agent_agent_id
  /ai/agents/agent/{agentId}/redeploy:
    post:
      summary: Redeploy an AI agent, refreshing its runtime while keeping its data
      description: Refreshes the agent's runtime without touching its configuration or the data it holds.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: agentId
          description: Agent ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.Agent'
              examples:
                Example:
                  value:
                    createdAt: '2026-07-20T09:00:00Z'
                    currentState:
                      enabled: true
                      endpointUrl: https://agents.example.ovhcloud.example/v1/kapp/0659cc01b8ef6326d33a2ba0ae7a0317e529d925
                      name: scout
                    id: 0659cc01b8ef6326d33a2ba0ae7a0317e529d925
                    resourceStatus: UPDATING
                    targetSpec:
                      enabled: true
                      name: scout
                    updatedAt: '2026-07-20T09:05:00Z'
                  summary: The AI agent being updated
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/agent/redeploy
          required: true
      operationId: post_v2_public_cloud_project_project_id_ai_agents_agent_agent_id_redeploy
  /ai/agents/agent/{agentId}/token:
    post:
      summary: Issue a scoped access token for an AI agent
      description: 'Returns a bearer token to present to the agent at `currentState.endpointUrl`. The token is returned once, here, and is never readable afterwards. Both body fields are optional: send `{}` for the defaults, which are the VIEWER role and the agent''s own default lifetime. A lifetime longer than the agent''s own maximum is rejected.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: agentId
          description: Agent ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.ai.agents.AgentTokenCreation'
            examples:
              Example:
                value:
                  lifetimeSeconds: 3600
                  role: VIEWER
                summary: Issue a read-only token valid for one hour
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.AgentToken'
              examples:
                Example:
                  value:
                    expiresAt: '2026-07-20T10:00:00Z'
                    role: VIEWER
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.token
                  summary: Issue a read-only token valid for one hour
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/agent/token/create
          required: true
      operationId: post_v2_public_cloud_project_project_id_ai_agents_agent_agent_id_token
  /ai/agents/preset/globalSettings:
    get:
      summary: Get the AI agent configuration settings fixed by OVHcloud
      description: 'Part of an AI agent''s configuration is managed by OVHcloud rather than by you: how callers authenticate to the agent, and whether the agent can run code. This route says which parts those are, so a configuration can be prepared knowing what will be accepted — anything OVHcloud manages is rejected if you set it yourself, whether on an agent or on a template. What it reports does not change from one agent to the next.'
      security:
        - oAuth2AuthCode: []
      parameters: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.GlobalSettings'
              examples:
                Example:
                  value:
                    agentConfig:
                      auth:
                        managed: true
                      exec:
                        enabled: false
                  summary: A ready AI agent configuration policy
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/preset/globalSettings/get
          required: true
      operationId: get_v2_public_cloud_project_project_id_ai_agents_preset_global_settings
  /ai/agents/preset/model/aiEndpointsProvider:
    get:
      operationId: getAiAgentAiEndpointsProviderPreset
      summary: Get the OVHcloud AI Endpoints provider preset
      description: States whether the OVHcloud AI Endpoints provider preset can be selected, whether OVHcloud provisions its credential so the caller need not supply one, the base URL whose `/models` sub-path lists the models available, and the model used when the caller names none.
      security:
        - oAuth2AuthCode: []
      parameters: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.AIEndpointsPreset'
              examples:
                Example:
                  value:
                    apiBase: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
                    defaultModel: Qwen3.6-27B
                    enabled: true
                    integratedAuth: true
                  summary: A ready OVHcloud AI Endpoints provider preset
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/preset/model/aiEndpointsProvider/get
          required: true
  /ai/agents/preset/template:
    get:
      operationId: getAllAiAgentTemplatePresets
      summary: List built-in AI agent template presets
      description: Presets are ready-made configurations OVHcloud publishes, offered alongside the templates a caller writes for themselves. Pass a preset's `id` as `targetSpec.template.id` on an agent creation to build an agent from it. Identifiers carry a reserved prefix, so a client can tell a preset from a template of its own.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllAiAgentTemplatePresetsResponse'
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/preset/template/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudAiAgentsTemplatePreset
  /ai/agents/preset/template/{templatePresetId}:
    get:
      operationId: getAiAgentTemplatePreset
      summary: Get an AI agent template preset
      description: A preset is a ready-made configuration OVHcloud publishes, offered alongside the templates a caller writes for themselves. Pass its `id` as `targetSpec.template.id` on an agent creation to build an agent from it. The identifier carries a reserved prefix, so a client can tell a preset from a template of its own.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: templatePresetId
          description: Template preset ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.TemplatePreset'
              examples:
                Example:
                  value:
                    aiEndpoints: true
                    aiEndpointsIntegratedAuth: true
                    description: A blank agent on the managed AI Endpoints provider, credential included
                    id: ovhcloud-managed-starter
                    name: starter
                  summary: A ready AI agent template preset
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/preset/template/get
          required: true
      x-response-identifier: id
  /ai/agents/template:
    get:
      operationId: getAllAiAgentTemplates
      summary: List AI agent templates
      description: The ready-made configurations OVHcloud publishes are absent from this list. They are served by the `preset/template` node.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllAiAgentTemplatesResponse'
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/template/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudAiAgentsTemplate
    post:
      operationId: createAiAgentTemplate
      summary: Create an AI agent template
      description: Registers a reusable configuration that a later agent creation can name through `targetSpec.template.id`. A template stores a configuration. It runs nothing by itself. `targetSpec.name` must be unique within the project's namespace.
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.ai.agents.TemplateCreation'
            examples:
              Example:
                value:
                  targetSpec:
                    config:
                      llm:
                        model: Qwen3.6-27B
                        providerId: ovhcloud
                        temperature: 0.7
                      version: '1.0'
                    description: A ready-to-use assistant configuration
                    name: Starter assistant
                summary: Create an AI agent template
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.Template'
              examples:
                Example:
                  value:
                    createdAt: '2026-07-20T09:00:00Z'
                    id: tpl-0a1b2c3d4e5f6071
                    resourceStatus: READY
                    source: USER
                    targetSpec:
                      config:
                        llm:
                          model: Qwen3.6-27B
                          providerId: ovhcloud
                          temperature: 0.7
                        version: '1.0'
                      description: A ready-to-use assistant configuration
                      name: Starter assistant
                    updatedAt: '2026-07-20T09:05:00Z'
                  summary: The created AI agent template
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/template/create
          required: true
  /ai/agents/template/{templateId}:
    delete:
      operationId: deleteAiAgentTemplate
      summary: Delete an AI agent template
      description: 'Deletion is asynchronous: the response describes the template with `resourceStatus: DELETING`. Agents already created from it are unaffected, since a template is read once, at agent creation time.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: templateId
          description: Template ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.Template'
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/template/delete
          required: true
    get:
      operationId: getAiAgentTemplate
      summary: Get an AI agent template
      description: The ready-made configurations OVHcloud publishes are not returned here. They are served by the `preset/template` node.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: templateId
          description: Template ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.Template'
              examples:
                Example:
                  value:
                    createdAt: '2026-07-20T09:00:00Z'
                    id: tpl-0a1b2c3d4e5f6071
                    resourceStatus: READY
                    source: USER
                    targetSpec:
                      config:
                        llm:
                          model: Qwen3.6-27B
                          providerId: ovhcloud
                          temperature: 0.7
                        version: '1.0'
                      description: A ready-to-use assistant configuration
                      name: Starter assistant
                    updatedAt: '2026-07-20T09:05:00Z'
                  summary: A ready AI agent template
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
          - AI
          - AI Agents
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:ai/agents/template/get
          required: true
      x-response-identifier: id
    put:
      operationId: editAiAgentTemplate
      summary: Update an AI agent template
      description: 'Replaces the template''s target spec as a whole: a field left out of the body is not preserved, and `targetSpec.config` is mandatory. Secrets inside that configuration read back as `[REDACTED]`. Send the sentinel back unchanged to keep the stored value. Configuration blocks OVHcloud reserves or does not offer are left out of a read, and a body that does not restate them drops them from the stored template. Agents already created from this template are unaffected, since a template is read once, at agent creation time.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: templateId
          description: Template ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.ai.agents.TemplateUpdate'
            examples:
              Example:
                value:
                  targetSpec:
                    config:
                      llm:
                        model: Qwen3.6-27B
                        providerId: ovhcloud
                        temperature: 0.7
                      version: '1.0'
                    description: An updated assistant configuration
                    name: Starter assistant
                summary: Update the AI agent template
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.ai.agents.Template'
      tags:
        - AI Agents
      x-developer-hub-navigation:
        - - Public Cloud
