    publicCloud.instance.ImageOSTypeEnum:
      type: string
      description: 'Image operating system type. Operating system family of an instance image, as tagged on the image in OpenStack Glance. It decides which flavors can boot the image, and Windows images carry a license. `LINUX`: A Linux (or other non-Windows) image for virtual instances. `WINDOWS`: A Microsoft Windows image. It can only boot on Windows flavors. `BAREMETAL_LINUX`: A Linux image for bare-metal instances.'
      enum:
        - BAREMETAL_LINUX
        - LINUX
        - WINDOWS
    publicCloud.instance.ImageStatusEnum:
      type: string
      description: 'Lifecycle status of an instance image as reported by OpenStack Glance. It describes where the image is in its upload and availability lifecycle. `QUEUED`: The image identifier has been reserved in the image registry, but no image data has been uploaded yet. `SAVING`: The raw image data is currently being uploaded to the image store. `IMPORTING`: The uploaded image data is being imported and processed through the Glance import workflow. `ACTIVE`: The image is fully available and can be used to boot instances. `DEACTIVATED`: Access to the image has been disabled by an administrator. The data is preserved but the image cannot be used to launch instances until reactivated. `KILLED`: An error occurred during upload or import and the image data is not usable. `PENDING_DELETE`: The image has been marked for deletion but its data has not been removed yet. It may still be restorable during the retention delay. `DELETED`: The image has been deleted and its data is scheduled for removal.'
      enum:
        - ACTIVE
        - DEACTIVATED
        - DELETED
        - IMPORTING
        - KILLED
        - PENDING_DELETE
        - QUEUED
        - SAVING
    publicCloud.instance.ImageVisibilityEnum:
      type: string
      description: 'Image visibility. Controls which projects can see and use an instance image, as defined by OpenStack Glance. `PUBLIC`: The image is visible to and usable by every project. `PRIVATE`: The image is visible only to the project that owns it. `SHARED`: The image is visible only to the owning project and the specific projects it has been explicitly shared with (image members). `COMMUNITY`: The image is usable by every project but is hidden from default image listings, so it must be requested explicitly.'
      enum:
        - COMMUNITY
        - PRIVATE
        - PUBLIC
        - SHARED
