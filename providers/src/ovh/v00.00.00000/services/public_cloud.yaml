          readOnly: true
        connectionsPerSecond:
          type: integer
          description: Number of new connections per second the load balancer handles
          readOnly: true
        location:
          description: Region where the flavor is sold to the project, whether that region is already activated on the project (regionActivated), and the availability zones of that region (availabilityZones), empty for a single-AZ region
