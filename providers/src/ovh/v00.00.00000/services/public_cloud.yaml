    publicCloud.ai.agents.Config:
      type: object
      description: Templated AI agent configuration
      properties:
        agent:
          description: The agent's identity settings, such as its display name.
          nullable: true
          type: object
          properties:
            name:
              type: string
              description: Display name for the agent, shown in the interface. Empty falls back to a generic label.
              nullable: true
        auth:
          description: Authentication settings for the agent's HTTP API. Unset falls back to requiring a token issued by the agent itself.
          nullable: true
          type: object
          properties:
            kagentJwt:
              description: Settings for tokens the agent issues and validates itself. Unset or disabled means the agent does not accept self-issued tokens.
              nullable: true
              type: object
              properties:
                allowUnlimited:
                  type: boolean
                  description: Whether requests for a token with no expiry are honored. Set to false to require every token to expire. Defaults to true.
                  nullable: true
                enabled:
                  type: boolean
                  description: Master switch for self-issued tokens. When false, minting new tokens is refused. Defaults to true.
                  nullable: true
                maxTtlSeconds:
                  type: integer
                  description: Maximum lifetime in seconds allowed for a newly issued token. Requests for a longer lifetime are rejected. When omitted, no cap.
                  nullable: true
                secretB64:
                  type: string
                  description: Signing key used to issue and validate self-issued tokens. Kept secret and never returned in plain text once set. When empty, no key is provisioned, so token minting and validation both fail.
                  nullable: true
            mode:
              description: Which authentication mode is enforced on the agent's HTTP API.
              nullable: true
              type: string
              enum:
                - KAGENT_JWT
                - NONE
                - OAUTH2
            oauth2:
              description: External identity provider settings, used when the authentication mode accepts an external OAuth2 token.
              nullable: true
              type: object
              properties:
                audience:
                  type: string
                  description: Expected audience value that a presented token must carry to be accepted
                issuer:
                  type: string
                  description: Base URL of the external identity provider that issues tokens for this agent
                jwksUri:
                  type: string
                  description: Explicit JWKS endpoint used to verify token signatures. Unset falls back to the identity provider's well-known JWKS location.
                  nullable: true
                ownerSub:
                  type: string
                  description: Stable identifier of the agent's owner at the identity provider. A presented token's subject must match this value to be accepted.
                  nullable: true
                requiredScopes:
                  type: array
                  description: Scopes a presented token must carry to be accepted. When empty, no scope is required.
                  nullable: true
                  items:
                    type: string
        builtins:
          description: Toggles for the agent's built-in capabilities, such as network access and web search.
          nullable: true
          type: object
          properties:
            network:
              type: boolean
              description: Whether the agent can make outbound network requests. Defaults to true.
              nullable: true
            search:
              type: boolean
              description: Whether the agent can perform web searches. Defaults to true.
              nullable: true
            searchApiKey:
              type: string
              description: API key for the configured search provider, when the provider requires one.
              nullable: true
            searchProvider:
              type: string
              description: Which search engine the agent uses for web searches. Defaults to 'duckduckgo'.
              nullable: true
            toolsDeny:
              type: array
              description: 'Tools this agent must not be offered, as glob patterns matched against the tool name (''*'' = any run of characters). The ''builtins'' flags above are all-or-nothing per subsystem — ''relay'' exposes twenty ''relay_*'' tools or none. A product built on kadk routinely wants *most* of a subsystem plus a composite of its own, and then finds the model reaching past the composite for the primitives it wraps: offered both ''revision_room'' and ''relay_create_room'', a model will happily assemble the room by hand and skip everything the composite also did. Naming the primitives here is how the product says ''that path is mine to own''.'
              nullable: true
              items:
                type: string
            wizard:
              type: boolean
              description: Whether the agent can reconfigure its own settings, such as its model or memory, from within a conversation. Off by default; only available to an administrator caller when enabled.
              nullable: true
        channels:
          description: Messaging-platform integrations, such as Telegram and Webex, the agent can send and receive messages through.
          nullable: true
          type: object
          properties:
            telegram:
              description: Telegram integration settings. When omitted, Telegram is not connected.
              nullable: true
              type: object
              properties:
                botToken:
                  type: string
                  description: Bot token issued by Telegram's BotFather. Kept secret and never returned in plain text once set.
                  nullable: true
                enabled:
                  type: boolean
                  description: Master switch for the Telegram integration. When false, this channel is unavailable to the agent.
                  nullable: true
                webhookSecret:
                  type: string
                  description: Shared secret used to verify that incoming Telegram messages genuinely come from Telegram. Leaving it empty disables this verification, which is not recommended.
                  nullable: true
            webex:
              description: Webex integration settings. When omitted, Webex is not connected.
              nullable: true
              type: object
              properties:
                accessToken:
                  type: string
                  description: Bot access token issued by Webex. Kept secret and never returned in plain text once set.
                  nullable: true
                enabled:
                  type: boolean
                  description: Master switch for the Webex integration. When false, this channel is unavailable to the agent.
                  nullable: true
                webhookSecret:
                  type: string
                  description: Shared secret used to verify that incoming Webex messages genuinely come from Webex. Leaving it empty skips this verification.
                  nullable: true
        exec:
          description: Remote command-execution settings. Unset or disabled means the agent cannot run shell commands.
          nullable: true
          type: object
          properties:
            apiKey:
              type: string
              description: API key used to authenticate to the remote command-execution service. Kept secret and never returned in plain text once set.
              nullable: true
            autoSuspendIdleSeconds:
              type: integer
              description: Number of seconds of inactivity before a sandboxed compute session is automatically suspended. Defaults to 60 seconds.
              nullable: true
            baseUrl:
              type: string
              description: Base URL of the remote command-execution service. No trailing slash.
              nullable: true
            defaultImage:
              type: string
              description: Default machine image used when the agent provisions a new sandboxed compute session
              nullable: true
            enabled:
              type: boolean
              description: Master switch for remote command execution. When false, the agent cannot run shell commands.
              nullable: true
        llm:
          description: The language model this agent uses to respond, including sampling settings and failover targets.
          nullable: true
          type: object
          properties:
            failover:
              description: Which kinds of call failures trigger switching to a backup model instead of surfacing the error.
              nullable: true
              type: object
              properties:
                'on':
                  type: array
                  description: Failure reasons that trigger switching to the next backup model. A failure reason not listed here is reported as an error instead of triggering failover.
                  nullable: true
                  items:
                    $ref: '#/components/schemas/publicCloud.ai.agents.FailoverPolicyOnEnum'
            fallbacks:
              type: array
              description: Ordered list of backup models tried, in turn, when the primary model fails. Empty means no failover.
              nullable: true
              items:
                $ref: '#/components/schemas/publicCloud.ai.agents.LlmFallback'
            maxContextMessages:
              type: integer
              description: 'How many trailing messages of a conversation go into the payload. ''None'' keeps the historical 50. That number predates context windows measured in the hundreds of thousands of tokens: on a 262k-token model a 50-message cap uses a fraction of what is available, and everything older is dropped without a summary — the conversation quietly forgets rather than compacting. Raising it hands the ceiling back to the compaction path, which now has a declared budget to compare against.'
              nullable: true
            maxTokens:
              type: integer
              description: Maximum number of tokens the model may generate in a single response. Unset uses the provider's default.
              nullable: true
            model:
              type: string
              description: Identifier of the model to call, for example 'gpt-5'.
              nullable: true
            providerId:
              type: string
              description: Id of the connected provider to call for this model. Must reference an entry in the shared provider pool.
              nullable: true
            temperature:
              type: number
              description: 'Sampling temperature controlling response randomness: lower values are more deterministic, higher values are more varied. Unset uses the provider''s default.'
              nullable: true
            vision:
              description: Optional secondary model used to describe images when the primary model cannot see them. Unset means images are not described for a text-only model.
              nullable: true
              type: object
              properties:
                maxTokens:
                  type: integer
                  description: Maximum response tokens for this backup target. Unset falls back to the primary model's setting.
                  nullable: true
                model:
                  type: string
                  description: Model identifier to use for this backup target. Empty reuses the primary model's identifier against this provider.
                  nullable: true
                providerId:
                  type: string
                  description: Id of the connected provider to call for this backup target
                  nullable: true
                temperature:
                  type: number
                  description: Sampling temperature for this backup target. Unset falls back to the primary model's temperature.
                  nullable: true
        mcpIndexer:
          description: Settings for searchable tool indexing, required when any connected tool server uses indexed mode instead of listing all its tools directly.
          nullable: true
          type: object
          properties:
            embedderBatchSize:
              type: integer
              description: Number of tool descriptions embedded per request when building the search index. Defaults to 16 when unset.
              nullable: true
            embedderModel:
              type: string
              description: Identifier of the embedding model used to index tool descriptions for search, for example 'text-embedding-3-small'.
            providerId:
              type: string
              description: Id of the connected provider used to generate embeddings for tool search. Required as soon as any tool server uses indexed mode.
              nullable: true
        mcpServers:
          type: object
          description: Connected MCP tool servers, keyed by a caller-chosen server name.
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/publicCloud.ai.agents.McpServer'
        memory:
          description: Long-term memory settings that let the agent retain and later recall facts across conversations.
          nullable: true
          type: object
          properties:
            consolidateOnTurnEnd:
              type: boolean
              description: Whether the agent reviews each conversation turn to capture any durable facts it did not already record. Defaults to true.
              nullable: true
            consolidationCron:
              type: string
              description: Schedule, as a five-field cron expression, for the periodic pass that merges duplicate facts and promotes frequently reinforced ones. Defaults to daily at 3 AM.
              nullable: true
            consolidationMaxRounds:
              type: integer
              description: Maximum number of internal steps the end-of-turn memory review may take. Defaults to 3.
              nullable: true
            corePredicates:
              type: array
              description: Fact categories eligible for automatic promotion to permanent status when reinforced. Empty disables automatic promotion; facts can still be promoted manually.
              nullable: true
              items:
                type: string
            embedderBatchSize:
              type: integer
              description: Number of facts embedded per request when building the memory index. Defaults to 16.
              nullable: true
            embedderModel:
              type: string
              description: Identifier of the embedding model used to index remembered facts for recall. Required when memory is enabled.
              nullable: true
            enabled:
              type: boolean
              description: Master switch for the memory feature. When false, the agent retains no long-term facts.
              nullable: true
            gcCron:
              type: string
              description: Schedule, as a five-field cron expression, for the periodic cleanup pass that evicts low-value facts once storage exceeds its soft limit. Defaults to hourly.
              nullable: true
            gcMaxSize:
              type: integer
              description: Hard upper bound on the number of stored facts, used as a safety cap against runaway growth. Defaults to 20000.
              nullable: true
            gcMinRetention:
              type: number
              description: Minimum retention score, from 0 to 1 with no unit, a non-permanent fact must keep to survive cleanup; facts scoring below this are marked for eviction. Defaults to 0.15.
              nullable: true
            gcSoftLimit:
              type: integer
              description: Number of stored facts above which cleanup starts evicting low-value ones, stopping once storage is back down to 90% of this value. Defaults to 10000.
              nullable: true
            halfLifeDays:
              type: integer
              description: Number of days after which a fact's retention score decays by half. Higher values make facts fade more slowly. Defaults to 45.
              nullable: true
            identityPromotionThreshold:
              type: integer
              description: Number of times a fact in a core category must be reinforced before it is promoted to permanent status and never evicted. Defaults to 5.
              nullable: true
            inferenceLlmFallback:
              type: boolean
              description: Whether the model is consulted to classify facts the automatic pass could not resolve on its own. Defaults to true; set to false to keep consolidation fully automatic.
              nullable: true
            mergeSimilarityThreshold:
              type: number
              description: Similarity threshold, from 0 to 1, above which two facts about the same subject are merged during cleanup. Defaults to 0.92.
              nullable: true
            providerId:
              type: string
              description: Id of the connected provider used to generate embeddings for stored facts. Required when memory is enabled.
              nullable: true
            ruleIdleGcDays:
              type: integer
              description: Number of days a derived rule may go unused before cleanup removes it. Defaults to 60.
              nullable: true
            rulesMax:
              type: integer
              description: Maximum number of derived rules retained. Older or unused rules are cleaned up during consolidation. Defaults to 256.
              nullable: true
        profiles:
          description: Specialized sub-personas this agent can delegate tasks to.
          nullable: true
          type: object
          properties:
            enabled:
              type: boolean
              description: Master switch for the delegated-agents feature. When false, this agent cannot delegate to a named sub-persona.
              nullable: true
            items:
              type: object
              description: Sub-personas defined directly in this configuration, keyed by name
              nullable: true
              additionalProperties:
                $ref: '#/components/schemas/publicCloud.ai.agents.AgentSeed'
        providers:
          type: object
          description: Shared pool of language-model provider connections, keyed by a caller-chosen provider id and referenced by name elsewhere in this configuration.
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/publicCloud.ai.agents.ProviderConfig'
        relay:
          description: Settings for hosting a local messaging relay that other participants can join.
          nullable: true
          type: object
          properties:
            enabled:
              type: boolean
              description: Master switch for hosting a relay. When false, the relay and its rooms are not available.
              nullable: true
            maxMessagesPerRoom:
              type: integer
              description: Maximum number of messages retained per room. Unset means unlimited.
              nullable: true
            maxRooms:
              type: integer
              description: Maximum number of rooms this relay may host. Unset means unlimited.
              nullable: true
            roomCreation:
              description: 'Controls who may create a new room on this relay: by default only the host can create rooms, but this can be relaxed so that any authenticated member creates one simply by joining a room that does not yet exist.'
              nullable: true
              type: string
              enum:
                - OPEN
                - OWNER
        skills:
          description: 'Reusable skills the agent can invoke: named bundles of instructions it can follow on demand.'
          nullable: true
          type: object
          properties:
            builtins:
              type: array
              description: Ids of built-in skills to enable, or '-id' to disable one that is on by default.
              nullable: true
              items:
                type: string
            enabled:
              type: boolean
              description: Whether the agent's skills are offered to the model. Absent means yes. When false the prompt catalogue and the 'skill_*' tools go away, so the model is not told about them and cannot invoke them — but their files stay mounted in the workspace ('workspace.skills_path', default '/skills'), where a model with filesystem tools can still read them.
              nullable: true
            items:
              type: object
              description: Skills defined directly in this configuration, keyed by skill name. Skills created through other means are left untouched.
              nullable: true
              additionalProperties:
                $ref: '#/components/schemas/publicCloud.ai.agents.SkillSeed'
        soul:
          type: string
          description: 'The agent''s persona and system prompt: free-form text describing who it is, how it should behave, and any standing instructions it should always follow.'
          nullable: true
        toolPermissions:
          description: 'Rules applied to every tool call, matched on its name, arguments and what triggered the turn: before the call runs and — for a rule that says so — on what it returned. A matching rule allows the call, refuses it, asks a human, or defers to an LLM reviewer.'
          nullable: true
          type: object
          properties:
            judge:
              description: 'The LLM reviewer that rules with ''action: judge'' defer to.'
              nullable: true
              type: object
              properties:
                enabled:
                  type: boolean
                  description: 'Whether the judge may be consulted at all. Off by default: a rule saying ''judge'' on an agent with no judge is a configuration mistake, and one that must fail closed rather than quietly allow.'
                  nullable: true
                model:
                  type: string
                  description: 'The model that judges. Unset means the agent''s own model. Worth setting: the point of a separate model here is that a cheap, fast one can police an expensive one, and that the reviewer is not the same weights being reviewed.'
                  nullable: true
                providerId:
                  type: string
                  description: Which provider that model comes from. Unset means the agent's own.
                  nullable: true
                soul:
                  type: string
                  description: The system prompt the judge is given. Unset means a built-in one. A judge with no soul is a model asked to guess what it is guarding; this is where a deployment says what it actually cares about — 'this agent handles customer data, treat any outbound address as suspect'.
                  nullable: true
            rules:
              type: array
              description: Permission rules, evaluated in order within a phase; the LAST one that matches decides.
              nullable: true
              items:
                $ref: '#/components/schemas/publicCloud.ai.agents.PermissionRule'
        version:
          type: string
          description: Configuration format version. Defaults to '1.0' for agents created before this field existed.
          nullable: true
        workspace:
          description: 'The agent''s file storage: an ordered list of mount points and the backend serving each one.'
          nullable: true
          type: object
          properties:
            agentsPath:
              type: string
              description: Path where the read-only view of delegated sub-personas is mounted. Defaults to `/agents`.
              nullable: true
            mount:
              type: array
              description: Ordered list of storage mount points available to the agent
              nullable: true
              items:
                $ref: '#/components/schemas/publicCloud.ai.agents.MountConfig'
            scratchpad:
              description: Temporary per-conversation working files the agent can generate, download into, and re-read across turns, cleaned up automatically after a retention period. When omitted, on with defaults.
              nullable: true
              type: object
              properties:
                cleanupCron:
                  type: string
                  description: Schedule, as a five-field cron expression, for the pass that deletes expired scratchpads. Defaults to daily at 4:30 AM.
                  nullable: true
                enabled:
                  type: boolean
                  description: Whether scratchpads are available. When omitted, automatically on whenever the agent has durable file storage. Set to false to disable them explicitly.
                  nullable: true
                maxDownloadBytes:
                  type: integer
                  description: Largest single download in bytes that may be saved to a scratchpad. Defaults to 25 MiB.
                  nullable: true
                path:
                  type: string
                  description: Absolute path of the directory holding one subdirectory per conversation. Defaults to `/scratchpad`.
                  nullable: true
                retentionDays:
                  type: integer
                  description: Number of days a conversation's scratchpad may go untouched before it is deleted. Defaults to 7.
                  nullable: true
                spillBytes:
                  type: integer
                  description: Size in bytes above which a fetched page is saved to the scratchpad and summarized instead of being returned in full. Defaults to 128 KiB.
                  nullable: true
            skillsPath:
              type: string
              description: Path where the read-only view of the agent's skills is mounted. Defaults to `/skills`.
              nullable: true
            zerofs:
              description: Optional shared scratch storage mount, also reachable from any remote command-execution session tied to this agent
              nullable: true
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether this mount is active. When omitted, automatically on whenever remote command execution is configured. Set to false to disable it explicitly.
                  nullable: true
                mountPath:
                  type: string
                  description: Absolute path where this mount appears in the agent's filesystem. Defaults to `/wrk`.
                  nullable: true
    publicCloud.ai.agents.AgentTemplateRef:
      type: object
      description: Reference to a template used to seed the AI agent configuration once, at creation time
      properties:
        id:
          type: string
          description: Identifier of the template to seed the AI agent configuration from. Honored only at creation time.
      required:
        - id
    publicCloud.ai.agents.GlobalAgentConfigAuth:
      type: object
      description: Reservation covering the agent's authentication block
      properties:
        managed:
          type: boolean
          description: Whether the agent's auth block is reserved by the deployment, and so neither settable at creation nor editable afterward
          readOnly: true
    publicCloud.ai.agents.GlobalAgentConfigExec:
      type: object
      description: Availability of the agent's code-execution blocks
      properties:
        enabled:
          type: boolean
          description: Whether an agent's configuration may carry the code-execution blocks (config.exec and config.workspace.zerofs). When false, a creation or template naming either is refused.
          readOnly: true
    publicCloud.instance.InstanceAvailableAction:
      type: object
      description: Instance action availability. One instance action type and whether it can currently be triggered on the instance through the action endpoint.
      properties:
        available:
          type: boolean
          description: Whether the action can currently be triggered through the action endpoint. A call with an unavailable action is refused.
          readOnly: true
        name:
          description: Action type, as accepted by the action endpoint
          readOnly: true
          type: string
          enum:
            - LOCK
            - PAUSE
            - REBOOT
            - RESCUE
            - RESUME
            - SHELVE
            - START
            - STOP
            - SUSPEND
            - UNLOCK
            - UNPAUSE
            - UNRESCUE
            - UNSHELVE
    publicCloud.instance.InstanceFlavor:
      type: object
      description: Observed flavor of an instance, carrying the full sizing details as reported by the backend. Used in currentState. The creation/update side references a flavor by id through InstanceFlavorRef.
      properties:
        bandwidth:
          description: Network bandwidth of the flavor in Mbit/s. Null when the flavor is not in the catalog.
          nullable: true
          readOnly: true
          type: object
          properties:
            private:
              type: integer
              description: Bandwidth on private networks (vRack) in Mbit/s. Null when the flavor does not declare it.
              nullable: true
              readOnly: true
            publicInbound:
              type: integer
              description: Inbound bandwidth on the public network in Mbit/s. Null when the flavor does not declare it.
              nullable: true
              readOnly: true
            publicOutbound:
              type: integer
              description: Outbound bandwidth on the public network in Mbit/s. Null when the flavor does not declare it.
              nullable: true
              readOnly: true
        disk:
          type: integer
          description: Size of the flavor's local root disk in GB
          readOnly: true
        gpus:
          type: integer
          description: Number of physical GPUs provided by the flavor, 0 for flavors without GPU
          readOnly: true
        id:
          type: string
          description: Unique identifier of the flavor
          format: uuid
          readOnly: true
        name:
          type: string
          description: Human-readable flavor name, for example the commercial flavor label
          readOnly: true
        ram:
          type: integer
          description: Amount of RAM provided by the flavor in MB
          readOnly: true
        vcpus:
          type: integer
          description: Number of virtual CPUs provided by the flavor
          readOnly: true
    publicCloud.instance.InstanceGroupRef:
      type: object
      description: Reference to the instance (placement) group the instance belongs to, controlling affinity/anti-affinity placement. Used in targetSpec to place the instance at creation and echoed in currentState. The group is set only at creation time and is immutable afterward. OpenStack/Nova server groups cannot be changed, so membership cannot be modified on a running instance.
      properties:
        id:
          type: string
          description: Identifier of the instance group. Honored only at creation time. The group cannot be changed afterward.
          format: uuid
      required:
        - id
    publicCloud.instance.InstanceImage:
      type: object
      description: Observed image an instance was booted from, carrying the full details as reported by OpenStack Glance. Used in currentState. The creation/update side references an image by id through InstanceImageRef.
      properties:
        defaultUser:
          type: string
          description: Default login user of the image, as set by its publisher, for example almalinux or ubuntu. Null when the image declares none.
          nullable: true
          readOnly: true
        deprecated:
          type: boolean
          description: Whether the image is flagged as deprecated. A deprecated image can still boot existing instances but is no longer recommended for new ones.
          readOnly: true
        id:
          type: string
          description: Unique identifier of the image
          format: uuid
          readOnly: true
        name:
          type: string
          description: Human-readable image name. Null when not reported by the backend.
          nullable: true
          readOnly: true
        size:
          type: integer
          description: Size of the image in bytes. Null when the backend does not report it.
          nullable: true
          readOnly: true
        status:
          description: Lifecycle status of the image as reported by Glance (see ImageStatusEnum). Null when not reported.
          nullable: true
          readOnly: true
          type: string
          enum:
            - ACTIVE
            - DEACTIVATED
            - DELETED
            - IMPORTING
            - KILLED
            - PENDING_DELETE
            - QUEUED
            - SAVING
    publicCloud.instance.InstanceLocation:
      type: object
      description: 'Instance location. Geographic placement of an instance: the region and, optionally, the availability zone within that region. In targetSpec it is the desired placement (immutable after creation). In currentState it is the observed placement.'
      properties:
        availabilityZone:
          type: string
          description: Availability zone within the region where the instance is placed. When omitted at creation the backend selects a zone automatically. Immutable after creation.
          nullable: true
        region:
          type: string
          description: Code of the region where the instance is provisioned, for example GRA11, BHS5. Immutable after creation. An instance cannot be moved to another region.
      required:
        - region
    publicCloud.instance.InstanceNetwork:
      type: object
      description: Observed network interface attached to an instance, with full details as reported by the backend. Used in currentState. The creation/update side declares interfaces through InstanceNetworkRef.
      properties:
        addresses:
          type: array
          description: Every IP address through which the instance is reachable on this interface, each with its type, IP version and MAC address. It carries the interface's fixed addresses and, where applicable, the floating IP associated with it and any additional IPs routed to it. This is the single source of truth for the instance's observed addresses. Null or empty only while no address has been assigned yet. See InstanceNetworkAddress.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceNetworkAddress'
          readOnly: true
        gatewayId:
          type: string
          description: Identifier of the gateway providing egress for this interface. Null when none applies.
          nullable: true
          format: uuid
          readOnly: true
        id:
          type: string
          description: 'Identifier of the network this interface is attached to, or null for the public (Ext-Net) interface. There is at most one entry without an id: additional IPs are reported as ADDITIONAL addresses of that public entry instead of forming their own entry.'
          nullable: true
          format: uuid
          readOnly: true
        subnetId:
          type: string
          description: Identifier of the subnet this interface draws its fixed address from, or null for an entry without a network id
          nullable: true
          format: uuid
          readOnly: true
    publicCloud.instance.PowerStateEnum:
      type: string
      description: 'Power state of an instance as reported by OpenStack Nova, also used to express the desired power state when driving the instance. `ACTIVE`: The instance is running and powered on. `PAUSED`: The instance is paused: its state is frozen in the memory of the host, which keeps its resources allocated. `SHUTOFF`: The instance is powered off (stopped) but its resources remain allocated. `SHELVED`: The instance is shelved: it is powered off and its compute resources are released, so it can be unshelved later to resume it. `SUSPENDED`: The instance is suspended: its memory state is saved to disk and it stops running, but its resources remain allocated. `RESCUE`: The instance is booted in rescue mode from a rescue image.'
      enum:
        - ACTIVE
        - PAUSED
        - RESCUE
        - SHELVED
        - SHUTOFF
        - SUSPENDED
    publicCloud.securityGroup.SecurityGroupRef:
      type: object
      description: Reference to a security group
      properties:
        id:
          type: string
          description: Identifier of the security group
          format: uuid
      required:
        - id
    publicCloud.instance.InstanceShare:
      type: object
      description: Observed instance-side share attachment, describing the Manila IP access rule that grants the instance access to a file storage (share). This list is only populated on a GET of a single instance. It is never returned in the LIST response. Mixing per-share access rules managed directly on the share resource with instance-side attach on the SAME share is unsupported and will make the share report OUT_OF_SYNC.
      properties:
        accessLevel:
          description: 'Observed access level of the access rule for this instance (see FileStorageAccessLevelEnum: READ_ONLY, READ_WRITE)'
          readOnly: true
          type: string
          enum:
            - READ_ONLY
            - READ_WRITE
        accessTo:
          type: string
          description: The instance IP address the Manila access rule targets. The instance's fixed IPv4 address on the share's network.
          readOnly: true
        id:
          type: string
          description: Identifier of the attached file storage (share)
          format: uuid
          readOnly: true
        state:
          description: 'Observed state of the underlying access rule (see FileStorageAccessRuleStateEnum: ACTIVE, APPLYING, DENYING, ERROR). Null while no state has been reported yet.'
          nullable: true
          readOnly: true
          type: string
          enum:
            - ACTIVE
            - APPLYING
            - DENYING
            - ERROR
    publicCloud.instance.InstanceVolume:
      type: object
      description: Observed block volume attached to an instance, carrying the details reported by the backend. Used in currentState. The creation/update side references a volume by id through InstanceVolumeRef.
      properties:
        id:
          type: string
          description: Unique identifier of the attached volume
          format: uuid
          readOnly: true
        name:
          type: string
          description: Display name of the attached volume
          readOnly: true
        size:
          type: integer
          description: Size of the attached volume in GB
          readOnly: true
    publicCloud.instance.InstanceFlavorRef:
      type: object
      description: User-controlled reference to the flavor that sizes the instance, used in targetSpec. It carries only the flavor id. The full observed sizing is exposed in currentState through InstanceFlavor.
      properties:
        id:
          type: string
          description: Identifier of the flavor to size the instance with. Changing it on update triggers a resize.
          format: uuid
      required:
        - id
    publicCloud.instance.InstanceImageRef:
      type: object
      description: User-controlled reference to the image the instance boots from, used in targetSpec. It carries only the image id. The full observed image is exposed in currentState through InstanceImage.
      properties:
        id:
          type: string
          description: Identifier of the image to boot from. Changing it on update triggers a rebuild of the instance.
          format: uuid
      required:
        - id
    publicCloud.instance.InstanceNetworkRef:
      type: object
      description: 'Instance network reference (desired). User-controlled entry declaring one network interface to attach to the instance in targetSpec. Which fields are set determines the meaning of the entry: * autoAssignPublicIp alone. A public (Ext-Net) interface with a platform-assigned public IP. At most one entry of the list may set it. * ip alone, without an id and without a subnetId. A public IP the project already owns: either an additional IP, or an Ext-Net IP of the project in the instance''s region. Any other address is rejected. Such an entry implicitly attaches the public (Ext-Net) interface. Several of them are allowed, and they may coexist with an autoAssignPublicIp entry. * subnetId, with an optional id. A private interface whose fixed address is assigned by IPAM. * subnetId and ip, with an optional id. A private interface where ip pins the fixed address when it falls inside the subnet CIDR, and otherwise designates an EXISTING floating IP to associate with that interface. When id is omitted on a private interface, the network of subnetId is used. When id is given, subnetId must belong to it. The enclosing networks list is declarative: adding or removing an entry attaches or detaches the corresponding interface on update.'
      properties:
        autoAssignPublicIp:
          type: boolean
          description: Auto-assign public IP. Whether to attach a public (Ext-Net) interface with a public IP assigned by the platform. Only allowed on an entry that has no id, no subnetId and no ip, and at most one entry of the networks list may set it. Requires the optional instance/usePublicIP IAM action.
          nullable: true
        id:
          type: string
          description: 'Identifier of the private network to attach to. Optional on a private interface: when omitted, the network of subnetId is used. Omit it on an entry declaring public connectivity through autoAssignPublicIp or ip.'
          nullable: true
          format: uuid
        ip:
          description: 'Address of this interface, whose meaning depends on the sibling fields. Without an id and a subnetId: a public IP the project already owns. An additional IP, or an Ext-Net IP of the project in the instance''s region. Any other address is rejected, and the entry implicitly attaches the public (Ext-Net) interface. On a private entry (subnetId, with an optional id): pins the interface''s fixed address when the address falls inside the subnet CIDR, and otherwise designates an EXISTING floating IP to associate with that interface. A public address requires the optional instance/usePublicIP IAM action.'
          nullable: true
          type: string
          format: ipv4
          example: 192.0.2.0
        subnetId:
          type: string
          description: Identifier of the subnet the interface draws its fixed address from. Required for a private interface. Leave unset on an entry declaring public connectivity.
          nullable: true
          format: uuid
    publicCloud.instance.InstanceShareRef:
      type: object
      description: User-controlled reference declaring a file storage (share) to attach to the instance, used within the declarative shares list of targetSpec. It carries the share id and the desired access level for the attachment. Attaching creates a Manila IP access rule for the instance's interface on the share's network. The enclosing shares list is diffed on update to drive attach/detach, exactly like volumes.
      properties:
        accessLevel:
          description: 'Desired access level granted to the instance for this share (see FileStorageAccessLevelEnum: READ_ONLY, READ_WRITE). Defaults to READ_WRITE.'
          nullable: true
          type: string
          enum:
            - READ_ONLY
            - READ_WRITE
        id:
          type: string
          description: Identifier of the file storage (share) to attach. Adding this reference attaches the share to the instance. Removing it from the shares list detaches it.
          format: uuid
      required:
        - id
    publicCloud.instance.InstanceVolumeRef:
      type: object
      description: User-controlled reference to a block volume attached to the instance, used within the declarative volumes list of targetSpec. It carries only the volume id. The full observed volume is exposed in currentState through InstanceVolume.
      properties:
        id:
          type: string
          description: Identifier of the volume to attach. Adding this reference attaches the volume. Removing it from the volumes list detaches it.
          format: uuid
      required:
        - id
    publicCloud.instanceGroup.InstanceGroupMemberRef:
      type: object
      description: 'Reference to a single instance that is a member of an instance group. It appears in the group''s currentState.members list and identifies the member by its instance id. Membership is established at instance-creation time via the instance''s targetSpec.group field and is immutable: an instance cannot be added to or removed from a group afterward.'
      properties:
        id:
          type: string
          description: Unique identifier of the instance that belongs to the group. Use it to look up the full instance on the compute instance route.
          format: uuid
          readOnly: true
    publicCloud.instanceGroup.PolicyEnum:
      type: string
      description: 'Instance group placement policy. Scheduling policy that governs how the members of an instance group are placed relative to one another on the underlying hypervisors. `AFFINITY`: Group members are placed onto the same hypervisor host, keeping them physically close together. `ANTI_AFFINITY`: Group members are forced onto different hypervisor hosts, spreading them apart for higher availability.'
      enum:
        - AFFINITY
        - ANTI_AFFINITY
    publicCloud.instance.SnapshotInstanceRef:
      type: object
      description: Reference to the source instance for a snapshot
      properties:
        id:
          type: string
          description: Unique identifier of the instance
          format: uuid
      required:
        - id
    publicCloud.keyManager.ContainerSecretRef:
      type: object
      description: A secret reference within a key manager container
      properties:
        name:
          type: string
          description: Role name of the secret reference, for example private_key, certificate, public_key
        secret:
          description: Reference to the secret
          type: object
          properties:
            id:
              type: string
              description: Unique identifier of the referenced secret
              format: uuid
          required:
            - id
      required:
        - name
        - secret
    publicCloud.keyManager.ContainerStatusEnum:
      type: string
      description: Status of a Key Manager container in OpenStack
      enum:
        - ACTIVE
        - ERROR
    publicCloud.keyManager.ContainerTypeEnum:
      type: string
      description: Possible types for a key manager container
      enum:
        - CERTIFICATE
        - GENERIC
        - RSA
    publicCloud.keyManager.AlgorithmEnum:
      type: string
      description: Algorithm associated with a Key Manager secret
      enum:
        - AES
        - DH
        - DSA
        - EC
        - RSA
    publicCloud.keyManager.BitLengthEnum:
      type: integer
      description: Bit length of a Key Manager secret
      enum:
        - 128
        - 256
        - 512
        - 1024
        - 2048
        - 4096
    publicCloud.keyManager.ModeEnum:
      type: string
      description: Block cipher mode associated with a Key Manager secret
      enum:
        - CBC
        - CTR
    publicCloud.keyManager.PayloadContentTypeEnum:
      type: string
      description: Content type of a Key Manager secret payload
      enum:
        - APPLICATION_OCTET_STREAM
        - APPLICATION_PKCS8
        - APPLICATION_PKIX_CERT
        - TEXT_PLAIN
    publicCloud.keyManager.SecretTypeEnum:
      type: string
      description: Type of a Key Manager secret
      enum:
        - CERTIFICATE
        - OPAQUE
        - PASSPHRASE
        - PRIVATE
        - PUBLIC
        - SYMMETRIC
    publicCloud.keyManager.SecretStatusEnum:
      type: string
      description: Status of a Key Manager secret in OpenStack
      enum:
        - ACTIVE
        - ERROR
    publicCloud.quota.QuotaProfile:
      type: object
      description: A Public Cloud quota profile (read-only reference data)
      properties:
        compute:
          description: Compute limits
          nullable: true
          readOnly: true
          type: object
          properties:
            cores:
              type: integer
              description: Maximum allowed CPU cores
              readOnly: true
            instances:
              type: integer
              description: Maximum allowed instances
              readOnly: true
            memory:
              type: integer
              description: Maximum allowed memory in MB
              readOnly: true
        keyManager:
          description: Key manager limits
          nullable: true
          readOnly: true
          type: object
          properties:
            containers:
              type: integer
              description: Maximum allowed containers
              readOnly: true
            secrets:
              type: integer
              description: Maximum allowed secrets
              readOnly: true
        keypair:
          description: Keypair limits
          nullable: true
          readOnly: true
          type: object
          properties:
