    publicCloud.reference.instance.Image:
      type: object
      description: 'Instance image (catalog entry). A single OS image as advertised by the backend (OpenStack/Glance) for a given region. This is read-only reference data served under /reference: it describes a bootable image the project can create instances from, not an existing resource. The image catalog is read-only in APIv2. There is no create, update or delete on images. The catalog is per-region: an image returned for one region is not guaranteed to exist in another (see location).'
      properties:
        createdAt:
          type: string
          description: Creation date. Timestamp at which the image was created on the backend, in RFC 3339 format.
          format: date-time
          readOnly: true
        defaultUser:
          type: string
          description: Default login user of the image, as set by its publisher, for example almalinux or ubuntu. Null when the image declares none.
          nullable: true
          readOnly: true
        id:
          type: string
          description: Identifier. The OpenStack/Glance image ID. Stable within a region and used to reference the image when creating an instance.
          format: uuid
          readOnly: true
        location:
          description: 'Location. Region (and, where applicable, availability zone) where this image is offered. The image catalog is per-region: an image returned for one region is not guaranteed to exist in another.'
          readOnly: true
          type: object
          properties:
            availabilityZone:
              type: string
              description: Availability zone within the region
              nullable: true
            region:
              type: string
              description: Region code
          required:
            - region
        minDisk:
          type: integer
          description: Minimum root disk size in GB that an instance must provide to boot from this image. A flavor whose disk is smaller than this value cannot be used with the image.
          readOnly: true
        minRam:
          type: integer
          description: Minimum amount of memory in MB that an instance must provide to boot from this image. A flavor whose RAM is below this value cannot be used with the image.
          readOnly: true
        name:
          type: string
          description: Display name of the image as reported by the backend, for example the distribution and version, such as Debian 12
          readOnly: true
        osType:
          description: Operating system type. Operating system family of the image (see ImageOSTypeEnum). Windows images can only boot on Windows flavors.
          readOnly: true
          type: string
          enum:
            - BAREMETAL_LINUX
            - LINUX
            - WINDOWS
        size:
          type: integer
          description: Size of the image on the backend, expressed in bytes
          readOnly: true
        status:
          description: Availability status of the image as reported by the backend (see ImageStatusEnum). Only images in an active status can be used to create an instance.
          readOnly: true
          type: string
          enum:
            - ACTIVE
            - DEACTIVATED
            - DELETED
            - IMPORTING
            - KILLED
            - PENDING_DELETE
            - QUEUED
            - SAVING
        updatedAt:
          type: string
          description: Last update date. Timestamp of the last modification of the image on the backend, in RFC 3339 format.
          format: date-time
          readOnly: true
        visibility:
          description: Visibility scope of the image (see ImageVisibilityEnum), for example whether it is a public OVHcloud-provided image or private to the project
          readOnly: true
          type: string
          enum:
            - COMMUNITY
            - PRIVATE
            - PUBLIC
            - SHARED
    publicCloud.reference.loadbalancer.Flavor:
      type: object
      description: A load balancer flavor and its performance in one region. A flavor sold in several regions appears once per region.
      properties:
        bandwidth:
