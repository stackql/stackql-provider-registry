        name:
          type: string
          description: Name of the cloud project
          readOnly: true
    common.CurrentTask:
      type: object
      description: Asynchronous operation currently running
      properties:
        errors:
          type: array
          description: Errors that occurred on the task
          nullable: true
          items:
            $ref: '#/components/schemas/common.TaskError'
          readOnly: true
        id:
          type: string
          description: Identifier of the current task
          format: uuid
          readOnly: true
        link:
          type: string
          description: Link to the task details
