        status:
          description: Current global status of the current task
          nullable: true
          readOnly: true
          type: string
          enum:
            - ERROR
            - PENDING
            - RUNNING
            - SCHEDULED
            - WAITING_USER_INPUT
        type:
          type: string
          description: Type of the current task
          readOnly: true
    iam.ResourceMetadata:
