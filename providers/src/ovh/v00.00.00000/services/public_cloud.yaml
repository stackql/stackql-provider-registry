                  description: Id of the connected provider to call for this model. Must reference an entry in the shared provider pool.
                  nullable: true
                temperature:
                  type: number
                  description: 'Sampling temperature controlling response randomness: lower values are more deterministic, higher values are more varied. Unset uses the provider''s default.'
                  nullable: true
                vision:
                  description: Optional secondary model used to describe images when the primary model cannot see them. Unset means images are not described for a text-only model.
                  nullable: true
                  type: object
                  properties:
                    maxTokens:
                      type: integer
                      description: Maximum response tokens for this backup target. Unset falls back to the primary model's setting.
                      nullable: true
                    model:
                      type: string
                      description: Model identifier to use for this backup target. Empty reuses the primary model's identifier against this provider.
                      nullable: true
                    providerId:
                      type: string
                      description: Id of the connected provider to call for this backup target
                      nullable: true
                    temperature:
                      type: number
                      description: Sampling temperature for this backup target. Unset falls back to the primary model's temperature.
                      nullable: true
            mcpIndexer:
              description: Settings for searchable tool indexing, required when any connected tool server uses indexed mode instead of listing all its tools directly.
              nullable: true
              type: object
              properties:
                embedderBatchSize:
                  type: integer
                  description: Number of tool descriptions embedded per request when building the search index. Defaults to 16 when unset.
                  nullable: true
                embedderModel:
                  type: string
                  description: Identifier of the embedding model used to index tool descriptions for search, for example 'text-embedding-3-small'.
                providerId:
                  type: string
                  description: Id of the connected provider used to generate embeddings for tool search. Required as soon as any tool server uses indexed mode.
                  nullable: true
            mcpServers:
              type: object
              description: Connected MCP tool servers, keyed by a caller-chosen server name.
              nullable: true
              additionalProperties:
                $ref: '#/components/schemas/publicCloud.ai.agents.McpServer'
            memory:
              description: Long-term memory settings that let the agent retain and later recall facts across conversations.
              nullable: true
              type: object
              properties:
                consolidateOnTurnEnd:
                  type: boolean
                  description: Whether the agent reviews each conversation turn to capture any durable facts it did not already record. Defaults to true.
                  nullable: true
                consolidationCron:
                  type: string
                  description: Schedule, as a five-field cron expression, for the periodic pass that merges duplicate facts and promotes frequently reinforced ones. Defaults to daily at 3 AM.
                  nullable: true
                consolidationMaxRounds:
                  type: integer
                  description: Maximum number of internal steps the end-of-turn memory review may take. Defaults to 3.
                  nullable: true
                corePredicates:
                  type: array
                  description: Fact categories eligible for automatic promotion to permanent status when reinforced. Empty disables automatic promotion; facts can still be promoted manually.
                  nullable: true
                  items:
                    type: string
                embedderBatchSize:
                  type: integer
                  description: Number of facts embedded per request when building the memory index. Defaults to 16.
                  nullable: true
                embedderModel:
                  type: string
                  description: Identifier of the embedding model used to index remembered facts for recall. Required when memory is enabled.
                  nullable: true
                enabled:
                  type: boolean
                  description: Master switch for the memory feature. When false, the agent retains no long-term facts.
                  nullable: true
                gcCron:
                  type: string
                  description: Schedule, as a five-field cron expression, for the periodic cleanup pass that evicts low-value facts once storage exceeds its soft limit. Defaults to hourly.
                  nullable: true
                gcMaxSize:
                  type: integer
                  description: Hard upper bound on the number of stored facts, used as a safety cap against runaway growth. Defaults to 20000.
                  nullable: true
                gcMinRetention:
                  type: number
                  description: Minimum retention score, from 0 to 1 with no unit, a non-permanent fact must keep to survive cleanup; facts scoring below this are marked for eviction. Defaults to 0.15.
                  nullable: true
                gcSoftLimit:
                  type: integer
                  description: Number of stored facts above which cleanup starts evicting low-value ones, stopping once storage is back down to 90% of this value. Defaults to 10000.
                  nullable: true
                halfLifeDays:
                  type: integer
                  description: Number of days after which a fact's retention score decays by half. Higher values make facts fade more slowly. Defaults to 45.
                  nullable: true
                identityPromotionThreshold:
                  type: integer
                  description: Number of times a fact in a core category must be reinforced before it is promoted to permanent status and never evicted. Defaults to 5.
                  nullable: true
                inferenceLlmFallback:
                  type: boolean
                  description: Whether the model is consulted to classify facts the automatic pass could not resolve on its own. Defaults to true; set to false to keep consolidation fully automatic.
                  nullable: true
                mergeSimilarityThreshold:
                  type: number
                  description: Similarity threshold, from 0 to 1, above which two facts about the same subject are merged during cleanup. Defaults to 0.92.
                  nullable: true
                providerId:
                  type: string
                  description: Id of the connected provider used to generate embeddings for stored facts. Required when memory is enabled.
                  nullable: true
                ruleIdleGcDays:
                  type: integer
                  description: Number of days a derived rule may go unused before cleanup removes it. Defaults to 60.
                  nullable: true
                rulesMax:
                  type: integer
                  description: Maximum number of derived rules retained. Older or unused rules are cleaned up during consolidation. Defaults to 256.
                  nullable: true
            profiles:
              description: Specialized sub-personas this agent can delegate tasks to.
              nullable: true
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Master switch for the delegated-agents feature. When false, this agent cannot delegate to a named sub-persona.
                  nullable: true
                items:
                  type: object
                  description: Sub-personas defined directly in this configuration, keyed by name
                  nullable: true
                  additionalProperties:
                    $ref: '#/components/schemas/publicCloud.ai.agents.AgentSeed'
            providers:
              type: object
              description: Shared pool of language-model provider connections, keyed by a caller-chosen provider id and referenced by name elsewhere in this configuration.
              nullable: true
              additionalProperties:
                $ref: '#/components/schemas/publicCloud.ai.agents.ProviderConfig'
            relay:
              description: Settings for hosting a local messaging relay that other participants can join.
              nullable: true
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Master switch for hosting a relay. When false, the relay and its rooms are not available.
                  nullable: true
                maxMessagesPerRoom:
                  type: integer
                  description: Maximum number of messages retained per room. Unset means unlimited.
                  nullable: true
                maxRooms:
                  type: integer
                  description: Maximum number of rooms this relay may host. Unset means unlimited.
                  nullable: true
                roomCreation:
                  description: 'Controls who may create a new room on this relay: by default only the host can create rooms, but this can be relaxed so that any authenticated member creates one simply by joining a room that does not yet exist.'
                  nullable: true
                  type: string
                  enum:
                    - OPEN
                    - OWNER
            skills:
              description: 'Reusable skills the agent can invoke: named bundles of instructions it can follow on demand.'
              nullable: true
              type: object
              properties:
                builtins:
                  type: array
                  description: Ids of built-in skills to enable, or '-id' to disable one that is on by default.
                  nullable: true
                  items:
                    type: string
                enabled:
                  type: boolean
                  description: Whether the agent's skills are offered to the model. Absent means yes. When false the prompt catalogue and the 'skill_*' tools go away, so the model is not told about them and cannot invoke them — but their files stay mounted in the workspace ('workspace.skills_path', default '/skills'), where a model with filesystem tools can still read them.
                  nullable: true
                items:
                  type: object
                  description: Skills defined directly in this configuration, keyed by skill name. Skills created through other means are left untouched.
                  nullable: true
                  additionalProperties:
                    $ref: '#/components/schemas/publicCloud.ai.agents.SkillSeed'
            soul:
              type: string
              description: 'The agent''s persona and system prompt: free-form text describing who it is, how it should behave, and any standing instructions it should always follow.'
              nullable: true
            toolPermissions:
              description: 'Rules applied to every tool call, matched on its name, arguments and what triggered the turn: before the call runs and — for a rule that says so — on what it returned. A matching rule allows the call, refuses it, asks a human, or defers to an LLM reviewer.'
              nullable: true
              type: object
              properties:
                judge:
                  description: 'The LLM reviewer that rules with ''action: judge'' defer to.'
                  nullable: true
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: 'Whether the judge may be consulted at all. Off by default: a rule saying ''judge'' on an agent with no judge is a configuration mistake, and one that must fail closed rather than quietly allow.'
                      nullable: true
                    model:
                      type: string
                      description: 'The model that judges. Unset means the agent''s own model. Worth setting: the point of a separate model here is that a cheap, fast one can police an expensive one, and that the reviewer is not the same weights being reviewed.'
                      nullable: true
                    providerId:
                      type: string
                      description: Which provider that model comes from. Unset means the agent's own.
                      nullable: true
                    soul:
                      type: string
                      description: The system prompt the judge is given. Unset means a built-in one. A judge with no soul is a model asked to guess what it is guarding; this is where a deployment says what it actually cares about — 'this agent handles customer data, treat any outbound address as suspect'.
                      nullable: true
                rules:
                  type: array
                  description: Permission rules, evaluated in order within a phase; the LAST one that matches decides.
                  nullable: true
                  items:
                    $ref: '#/components/schemas/publicCloud.ai.agents.PermissionRule'
            version:
              type: string
              description: Configuration format version. Defaults to '1.0' for agents created before this field existed.
              nullable: true
            workspace:
              description: 'The agent''s file storage: an ordered list of mount points and the backend serving each one.'
              nullable: true
              type: object
              properties:
                agentsPath:
                  type: string
                  description: Path where the read-only view of delegated sub-personas is mounted. Defaults to `/agents`.
                  nullable: true
                mount:
                  type: array
                  description: Ordered list of storage mount points available to the agent
                  nullable: true
                  items:
                    $ref: '#/components/schemas/publicCloud.ai.agents.MountConfig'
                scratchpad:
                  description: Temporary per-conversation working files the agent can generate, download into, and re-read across turns, cleaned up automatically after a retention period. When omitted, on with defaults.
                  nullable: true
                  type: object
                  properties:
                    cleanupCron:
                      type: string
                      description: Schedule, as a five-field cron expression, for the pass that deletes expired scratchpads. Defaults to daily at 4:30 AM.
                      nullable: true
                    enabled:
                      type: boolean
                      description: Whether scratchpads are available. When omitted, automatically on whenever the agent has durable file storage. Set to false to disable them explicitly.
                      nullable: true
                    maxDownloadBytes:
                      type: integer
                      description: Largest single download in bytes that may be saved to a scratchpad. Defaults to 25 MiB.
                      nullable: true
                    path:
                      type: string
                      description: Absolute path of the directory holding one subdirectory per conversation. Defaults to `/scratchpad`.
                      nullable: true
                    retentionDays:
                      type: integer
                      description: Number of days a conversation's scratchpad may go untouched before it is deleted. Defaults to 7.
                      nullable: true
                    spillBytes:
                      type: integer
                      description: Size in bytes above which a fetched page is saved to the scratchpad and summarized instead of being returned in full. Defaults to 128 KiB.
                      nullable: true
                skillsPath:
                  type: string
                  description: Path where the read-only view of the agent's skills is mounted. Defaults to `/skills`.
                  nullable: true
                zerofs:
                  description: Optional shared scratch storage mount, also reachable from any remote command-execution session tied to this agent
                  nullable: true
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Whether this mount is active. When omitted, automatically on whenever remote command execution is configured. Set to false to disable it explicitly.
                      nullable: true
                    mountPath:
                      type: string
                      description: Absolute path where this mount appears in the agent's filesystem. Defaults to `/wrk`.
                      nullable: true
        description:
          type: string
          description: Optional human-readable description
          nullable: true
        name:
          type: string
          description: Name of the template, unique within the namespace
      required:
        - config
        - name
    publicCloud.instance.InstanceCurrentState:
      type: object
      description: Current observed state of the instance as reported by the compute backend (OpenStack/Nova). It is read-only and reflects what actually exists, as opposed to targetSpec which holds what was requested. Some collections (notably shares) are only populated on a GET of a single instance and are omitted from the LIST response.
      properties:
        availableActions:
          type: array
          description: Availability of every instance action type given the current state of the instance. Always contains exactly one entry per InstanceActionTypeEnum value, in the order of that enum, each flagged with whether it can currently be triggered through the action endpoint. For example, when the instance is locked only UNLOCK is available. While a task is in progress on the instance or when it is in error, none is available.
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceAvailableAction'
          readOnly: true
        flavor:
          description: Observed flavor of the instance with full details (name, vCPUs, RAM, local disk). See InstanceFlavor.
          readOnly: true
          type: object
          properties:
            bandwidth:
              description: Network bandwidth of the flavor in Mbit/s. Null when the flavor is not in the catalog.
              nullable: true
              readOnly: true
              type: object
              properties:
                private:
                  type: integer
                  description: Bandwidth on private networks (vRack) in Mbit/s. Null when the flavor does not declare it.
                  nullable: true
                  readOnly: true
                publicInbound:
                  type: integer
                  description: Inbound bandwidth on the public network in Mbit/s. Null when the flavor does not declare it.
                  nullable: true
                  readOnly: true
                publicOutbound:
                  type: integer
                  description: Outbound bandwidth on the public network in Mbit/s. Null when the flavor does not declare it.
                  nullable: true
                  readOnly: true
            disk:
              type: integer
              description: Size of the flavor's local root disk in GB
              readOnly: true
            gpus:
              type: integer
              description: Number of physical GPUs provided by the flavor, 0 for flavors without GPU
              readOnly: true
            id:
              type: string
              description: Unique identifier of the flavor
              format: uuid
              readOnly: true
            name:
              type: string
              description: Human-readable flavor name, for example the commercial flavor label
              readOnly: true
            ram:
              type: integer
              description: Amount of RAM provided by the flavor in MB
              readOnly: true
            vcpus:
              type: integer
              description: Number of virtual CPUs provided by the flavor
              readOnly: true
        group:
          description: Reference to the instance (placement) group the instance belongs to. Null when it is not part of any group. Immutable after creation.
          nullable: true
          readOnly: true
          type: object
          properties:
            id:
              type: string
              description: Identifier of the instance group. Honored only at creation time. The group cannot be changed afterward.
              format: uuid
          required:
            - id
        hostId:
          type: string
          description: Opaque identifier of the physical host the instance is running on, as exposed by OpenStack. Null when not available.
          nullable: true
          readOnly: true
        image:
          description: Observed image the instance was booted from, with full details (name, size, status). Null for boot-from-volume instances, which have no image. See InstanceImage.
          nullable: true
          readOnly: true
          type: object
          properties:
            defaultUser:
              type: string
              description: Default login user of the image, as set by its publisher, for example almalinux or ubuntu. Null when the image declares none.
              nullable: true
              readOnly: true
            deprecated:
              type: boolean
              description: Whether the image is flagged as deprecated. A deprecated image can still boot existing instances but is no longer recommended for new ones.
              readOnly: true
            id:
              type: string
              description: Unique identifier of the image
              format: uuid
              readOnly: true
            name:
              type: string
              description: Human-readable image name. Null when not reported by the backend.
              nullable: true
              readOnly: true
            size:
              type: integer
              description: Size of the image in bytes. Null when the backend does not report it.
              nullable: true
              readOnly: true
            status:
              description: Lifecycle status of the image as reported by Glance (see ImageStatusEnum). Null when not reported.
              nullable: true
              readOnly: true
              type: string
              enum:
                - ACTIVE
                - DEACTIVATED
                - DELETED
                - IMPORTING
                - KILLED
                - PENDING_DELETE
                - QUEUED
                - SAVING
        location:
          description: Location. Observed region and availability zone where the instance is provisioned. See InstanceLocation.
          readOnly: true
          type: object
          properties:
            availabilityZone:
              type: string
              description: Availability zone within the region where the instance is placed. When omitted at creation the backend selects a zone automatically. Immutable after creation.
              nullable: true
            region:
              type: string
              description: Code of the region where the instance is provisioned, for example GRA11, BHS5. Immutable after creation. An instance cannot be moved to another region.
          required:
            - region
        locked:
          type: boolean
          description: Lock state. Whether the instance is locked against modifications. When locked, mutating actions are refused until it is unlocked (see the LOCK/UNLOCK actions in InstanceActionTypeEnum).
          readOnly: true
        name:
          type: string
          description: Observed display name of the instance
          readOnly: true
        networks:
          type: array
          description: Observed network interfaces of the instance, with full details (network, subnet, gateway and per-interface addresses). One entry per network, plus at most one entry without an id for the public (Ext-Net) interface. Every address of the instance is reported through the entry's addresses list, each address typed FIXED, FLOATING or ADDITIONAL. There is no separate scalar address field. See InstanceNetwork.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceNetwork'
          readOnly: true
        powerState:
          description: Actual administrative power state of the instance as reported by OpenStack (see PowerStateEnum). This may transiently differ from targetSpec.powerState while a power transition is in progress.
          readOnly: true
          type: string
          enum:
            - ACTIVE
            - PAUSED
            - RESCUE
            - SHELVED
            - SHUTOFF
            - SUSPENDED
        projectId:
          type: string
          description: Identifier of the Public Cloud project the instance belongs to
          readOnly: true
        securityGroups:
          type: array
          description: References to the security groups currently attached to the instance's ports
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.securityGroup.SecurityGroupRef'
          readOnly: true
        shares:
          type: array
          description: Observed instance-side share attachments. Only populated on a GET of a single instance (never in list responses). Mixing per-share access rules (managed directly on the share resource) with instance-side attach on the same share is unsupported and will show the share OUT_OF_SYNC. See InstanceShare.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceShare'
          readOnly: true
        sshKeyName:
          type: string
          description: Name of the SSH key pair injected into the instance at boot. Null when none was provided.
          nullable: true
          readOnly: true
        userId:
          type: string
          description: Identifier of the OpenStack user that owns the instance
          readOnly: true
        volumes:
          type: array
          description: Observed block volumes attached to the instance, with details (name, size). See InstanceVolume.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceVolume'
          readOnly: true
    publicCloud.instance.InstanceReadTargetSpec:
      type: object
      description: 'Desired instance specification as returned on read. Last target specification requested for the instance, as returned on read (GET/LIST). It mirrors InstanceTargetSpec but relaxes the create-only constraints: fields that are mandatory at creation are not required here, and image is nullable because boot-from-volume instances have no image.'
      properties:
        flavor:
          description: Reference to the flavor that sizes the instance (vCPUs, RAM, local disk). Carries only the flavor id. Changing the referenced flavor on PUT triggers a resize of the instance.
          readOnly: true
          type: object
          properties:
            id:
              type: string
              description: Identifier of the flavor to size the instance with. Changing it on update triggers a resize.
              format: uuid
          required:
            - id
        group:
          description: 'Optional reference to the instance (placement) group the instance is created into, controlling affinity/anti-affinity placement. Immutable: the group is set only at creation time. OpenStack/Nova server groups are immutable. There is no group change on PUT and membership cannot be changed after the instance exists.'
          nullable: true
          readOnly: true
          type: object
          properties:
            id:
              type: string
              description: Identifier of the instance group. Honored only at creation time. The group cannot be changed afterward.
              format: uuid
          required:
            - id
        image:
          description: Reference to the image the instance boots from. Carries only the image id. Changing the referenced image on PUT triggers a rebuild of the instance from the new image. Null for boot-from-volume instances, which have no backing image.
          nullable: true
          readOnly: true
          type: object
          properties:
            id:
              type: string
              description: Identifier of the image to boot from. Changing it on update triggers a rebuild of the instance.
              format: uuid
          required:
            - id
        location:
          description: Target location. Region (and optional availability zone) where the instance is provisioned. Immutable after creation. An instance cannot be moved to another region/zone, which is why location is absent from InstanceUpdateTargetSpec.
          readOnly: true
          type: object
          properties:
            availabilityZone:
              type: string
              description: Availability zone within the region where the instance is placed. When omitted at creation the backend selects a zone automatically. Immutable after creation.
              nullable: true
            region:
              type: string
              description: Code of the region where the instance is provisioned, for example GRA11, BHS5. Immutable after creation. An instance cannot be moved to another region.
          required:
            - region
        name:
          type: string
          description: Desired display name of the instance. Changing it on PUT triggers a rename.
          readOnly: true
        networks:
          type: array
          description: 'Declarative list of network interfaces the instance is attached to. An entry with a subnetId, and an optional id, is a private interface, optionally carrying an ip to pin its fixed address or to associate an existing floating IP. An entry with autoAssignPublicIp alone requests a public (Ext-Net) interface with a platform-assigned public IP. An entry with ip alone attaches a public IP the project already owns, either an additional IP or an Ext-Net IP of the project in the instance''s region. See InstanceNetworkRef. The list drives the desired network topology: adding or removing an entry attaches or detaches the corresponding interface on update.'
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceNetworkRef'
          readOnly: true
        powerState:
          description: 'Desired administrative power state of the instance (see PowerStateEnum: ACTIVE, PAUSED, RESCUE, SHELVED, SHUTOFF, SUSPENDED). Changing it on PUT drives the corresponding power transition (start, stop, shelve, rescue, pause, suspend). Defaults to ACTIVE.'
          nullable: true
          readOnly: true
          type: string
          enum:
            - ACTIVE
            - PAUSED
            - RESCUE
            - SHELVED
            - SHUTOFF
            - SUSPENDED
        securityGroups:
          type: array
          description: Optional list of references to the security groups applied to all of the instance's ports. Each entry carries the security group id. Changing this list on PUT re-applies the resulting set of security groups to every instance port.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.securityGroup.SecurityGroupRef'
          readOnly: true
        shares:
          type: array
          description: 'Declarative list of file storage (shares) attached to the instance, managed exactly like volumes: the diff of this list on PUT drives attach/detach. Attaching a share creates a Manila IP access rule for the instance''s interface on the share''s network. The instance must have an interface on that network or the operation errors. Detaching (removing an entry from this list) deletes the matching access rule and is idempotent. Each entry''s accessLevel defaults to READ_WRITE when omitted (see InstanceShareRef).'
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceShareRef'
          readOnly: true
        sshKeyName:
          type: string
          description: 'Name of the SSH key pair injected into the instance at boot for initial access. Immutable / create-only: the key is injected once during provisioning and cannot be changed afterward, which is why sshKeyName is absent from InstanceUpdateTargetSpec.'
          nullable: true
          readOnly: true
        volumes:
          type: array
          description: Declarative list of block volumes attached to the instance, each referencing a volume by id (see InstanceVolumeRef). Attach/detach is driven by diffing this list on PUT. There is no imperative attach/detach sub-route. Adding a volume reference attaches that volume. Removing one detaches it.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceVolumeRef'
          readOnly: true
    publicCloud.instance.InstanceTargetSpec:
      type: object
      description: 'Desired instance specification (creation). User-controlled specification of a compute instance, as supplied on creation (POST). It carries every settable field, including fields that become immutable once the instance exists (location, sshKeyName, group). Networks, volumes and shares are declarative lists: on update, the requested topology is reconciled by diffing these lists against the current attachments. The PUT route uses a reduced InstanceUpdateTargetSpec that only exposes the mutable fields.'
      properties:
        flavor:
          description: Reference to the flavor that sizes the instance (vCPUs, RAM, local disk). Carries only the flavor id. Changing the referenced flavor on PUT triggers a resize of the instance.
          type: object
          properties:
            id:
              type: string
              description: Identifier of the flavor to size the instance with. Changing it on update triggers a resize.
              format: uuid
          required:
            - id
        group:
          description: Optional reference to the instance (placement) group the instance is created into, controlling affinity/anti-affinity placement. Immutable after creation. The group is set only at creation time. OpenStack/Nova server groups are immutable. There is no group change on PUT and membership cannot be changed after the instance exists.
          nullable: true
          type: object
          properties:
            id:
              type: string
              description: Identifier of the instance group. Honored only at creation time. The group cannot be changed afterward.
              format: uuid
          required:
            - id
        image:
          description: Reference to the image the instance boots from. Carries only the image id. Changing the referenced image on PUT triggers a rebuild of the instance from the new image.
          nullable: true
          type: object
          properties:
            id:
              type: string
              description: Identifier of the image to boot from. Changing it on update triggers a rebuild of the instance.
              format: uuid
          required:
            - id
        location:
          description: Target location. Region (and optional availability zone) where the instance is provisioned. Immutable after creation. An instance cannot be moved to another region/zone, which is why location is absent from InstanceUpdateTargetSpec.
          type: object
          properties:
            availabilityZone:
              type: string
              description: Availability zone within the region where the instance is placed. When omitted at creation the backend selects a zone automatically. Immutable after creation.
              nullable: true
            region:
              type: string
              description: Code of the region where the instance is provisioned, for example GRA11, BHS5. Immutable after creation. An instance cannot be moved to another region.
          required:
            - region
        name:
          type: string
          description: Desired display name of the instance. Changing it on PUT triggers a rename.
        networks:
          type: array
          description: 'Declarative list of network interfaces the instance is attached to. An entry with a subnetId, and an optional id, is a private interface, optionally carrying an ip to pin its fixed address or to associate an existing floating IP. An entry with autoAssignPublicIp alone requests a public (Ext-Net) interface with a platform-assigned public IP. An entry with ip alone attaches a public IP the project already owns, either an additional IP or an Ext-Net IP of the project in the instance''s region. See InstanceNetworkRef. The list drives the desired network topology: adding or removing an entry attaches or detaches the corresponding interface on update.'
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceNetworkRef'
        powerState:
          description: 'Desired administrative power state of the instance (see PowerStateEnum: ACTIVE, PAUSED, RESCUE, SHELVED, SHUTOFF, SUSPENDED). Changing it on PUT drives the corresponding power transition (start, stop, shelve, rescue, pause, suspend). Defaults to ACTIVE.'
          nullable: true
          type: string
          enum:
            - ACTIVE
            - PAUSED
            - RESCUE
            - SHELVED
            - SHUTOFF
            - SUSPENDED
        securityGroups:
          type: array
          description: Optional list of references to the security groups applied to all of the instance's ports. Each entry carries the security group id. Changing this list on PUT re-applies the resulting set of security groups to every instance port.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.securityGroup.SecurityGroupRef'
        shares:
          type: array
          description: 'Declarative list of file storage (shares) attached to the instance, managed exactly like volumes: the diff of this list on PUT drives attach/detach. Attaching a share creates a Manila IP access rule for the instance''s interface on the share''s network. The instance must have an interface on that network or the operation errors. Detaching (removing an entry from this list) deletes the matching access rule and is idempotent. Each entry''s accessLevel defaults to READ_WRITE when omitted (see InstanceShareRef).'
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceShareRef'
        sshKeyName:
          type: string
          description: Name of the SSH key pair injected into the instance at boot for initial access. Immutable after creation. The key is injected once during provisioning and cannot be changed afterward, which is why sshKeyName is absent from InstanceUpdateTargetSpec.
          nullable: true
        userData:
          type: string
          description: 'User data (cloud-init). Base64-encoded (strict standard encoding) cloud-init payload handed to the instance at boot through the OpenStack metadata service / config drive, and interpreted by cloud-init inside the guest image. The submitted string itself must be at most 65535 bytes once base64-encoded. Write-only: never returned by GET/LIST. Deliberately absent from InstanceReadTargetSpec and InstanceCurrentState. Not persisted or stored by the Public Cloud API: the payload is handed to the compute service, which makes it available to the instance via the metadata service. Only a non-reversible fingerprint of the value is retained, for change detection. Mutable, but destructively: changing userData on PUT REINSTALLS the instance (a Nova rebuild on the current image), wiping the root disk and all data on it. See InstanceUpdateTargetSpec for the tri-state update semantics.'
          nullable: true
        volumes:
          type: array
          description: Declarative list of block volumes attached to the instance, each referencing a volume by id (see InstanceVolumeRef). Attach/detach is driven by diffing this list on PUT. There is no imperative attach/detach sub-route. Adding a volume reference attaches that volume. Removing one detaches it.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceVolumeRef'
      required:
        - flavor
        - location
        - name
    publicCloud.instance.InstanceUpdateTargetSpec:
      type: object
      description: 'Desired instance specification (update). Reduced target specification used on the PUT route, exposing only the fields that can change after creation. Immutable, create-only fields are intentionally absent: location, sshKeyName and the placement group cannot be changed once the instance exists. Networks, volumes and shares remain declarative: the requested topology is reconciled by diffing these lists against the current attachments.'
      properties:
        flavor:
          description: Reference to the desired flavor (vCPUs, RAM, local disk). Carries only the flavor id. Sending a different flavor triggers a resize of the instance.
          type: object
          properties:
            id:
              type: string
              description: Identifier of the flavor to size the instance with. Changing it on update triggers a resize.
              format: uuid
          required:
            - id
        image:
          description: Reference to the desired image. Carries only the image id. Sending a different image triggers a rebuild of the instance from the new image.
          nullable: true
          type: object
          properties:
            id:
              type: string
              description: Identifier of the image to boot from. Changing it on update triggers a rebuild of the instance.
              format: uuid
          required:
            - id
        name:
          type: string
          description: Desired display name of the instance. Changing it triggers a rename.
        networks:
          type: array
          description: 'Declarative list of network interfaces the instance is attached to (see InstanceNetworkRef). The list drives the desired network topology: adding or removing an entry attaches or detaches the corresponding interface.'
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceNetworkRef'
        powerState:
          description: 'Desired administrative power state (see PowerStateEnum: ACTIVE, PAUSED, RESCUE, SHELVED, SHUTOFF, SUSPENDED). Changing it drives the corresponding power transition (start, stop, shelve, rescue, pause, suspend). A move OpenStack cannot make in one step, such as PAUSED to SHUTOFF, is rejected with ResourceInInvalidState before anything changes. The error message gives the route through ACTIVE. Defaults to ACTIVE.'
          nullable: true
          type: string
          enum:
            - ACTIVE
            - PAUSED
            - RESCUE
            - SHELVED
            - SHUTOFF
            - SUSPENDED
        securityGroups:
          type: array
          description: Optional list of references to the security groups applied to all of the instance's ports. Changing this list re-applies the resulting set of security groups to every instance port.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.securityGroup.SecurityGroupRef'
        shares:
          type: array
          description: 'Declarative list of file storage (shares) attached to the instance, managed exactly like volumes: the diff of this list drives attach/detach. Attaching a share creates a Manila IP access rule for the instance''s interface on the share''s network. The instance must have an interface on that network or the operation errors. Detaching (removing an entry from this list) deletes the matching access rule and is idempotent. Each entry''s accessLevel defaults to READ_WRITE when omitted (see InstanceShareRef).'
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceShareRef'
        userData:
          type: string
          description: 'User data (cloud-init). Base64-encoded (strict standard encoding) cloud-init payload, at most 65535 bytes once base64-encoded. Write-only: never returned by GET/LIST. Not persisted or stored by the Public Cloud API: the payload is handed to the compute service, which makes it available to the instance via the metadata service on boot/rebuild. Only a non-reversible fingerprint of the value is retained, for change detection. Tri-state: omitted or null keeps the current value unchanged. An empty string clears it. A non-empty value replaces it. Destructive: any change (clear or replace) REINSTALLS the instance — a Nova rebuild on the current image — wiping the root disk and all data on it.'
          nullable: true
        volumes:
          type: array
          description: Declarative list of block volumes attached to the instance (see InstanceVolumeRef). Attach/detach is driven by diffing this list. Adding a reference attaches the volume, removing one detaches it. There is no imperative attach/detach sub-route.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instance.InstanceVolumeRef'
      required:
        - flavor
        - name
    publicCloud.instance.InstanceActionParameters:
      type: object
      description: Optional parameters refining an imperative instance action. Each field applies only to a specific action type (see InstanceActionTypeEnum) and is ignored for other actions.
      properties:
        hard:
          type: boolean
          description: Applies only to the REBOOT action. When true, performs a hard reboot (power cycle) instead of a graceful, soft reboot. Defaults to a soft reboot.
          nullable: true
        imageId:
          type: string
          description: Applies only to the RESCUE action. Identifier of the image to boot the instance from while in rescue mode. When omitted, the backend selects a default rescue image.
          nullable: true
    publicCloud.instance.InstanceActionTypeEnum:
      type: string
      description: 'Instance action type. Imperative action that can be triggered on an instance to change its administrative or operational state. `LOCK`: Lock the instance to prevent further actions on it, protecting it from accidental or unauthorized operations. `UNLOCK`: Remove a previously set lock, re-enabling actions on the instance. `REBOOT`: Restart the instance. `RESCUE`: Boot the instance into rescue mode from a rescue image so its root disk can be inspected or repaired. `UNRESCUE`: Return the instance from rescue mode to normal operation. `STOP`: Power off the instance. Its resources remain allocated. `START`: Power on a stopped instance. `SHELVE`: Power off the instance and release its compute resources so it can be resumed later. `UNSHELVE`: Resume a shelved instance. `PAUSE`: Freeze a running instance, keeping its memory state in the RAM of the host. `UNPAUSE`: Return a paused instance to normal operation. `SUSPEND`: Save the memory state of a running instance to disk and stop it. Its resources remain allocated. `RESUME`: Restore a suspended instance from its saved memory state.'
      enum:
        - LOCK
        - PAUSE
        - REBOOT
        - RESCUE
        - RESUME
        - SHELVE
        - START
        - STOP
        - SUSPEND
        - UNLOCK
        - UNPAUSE
        - UNRESCUE
        - UNSHELVE
    publicCloud.instance.FlavorBandwidth:
      type: object
      description: Network bandwidth of a flavor. The bandwidth an instance of the flavor gets in Mbit/s.
      properties:
        private:
          type: integer
          description: Bandwidth on private networks (vRack) in Mbit/s. Null when the flavor does not declare it.
          nullable: true
          readOnly: true
        publicInbound:
          type: integer
          description: Inbound bandwidth on the public network in Mbit/s. Null when the flavor does not declare it.
          nullable: true
          readOnly: true
        publicOutbound:
          type: integer
          description: Outbound bandwidth on the public network in Mbit/s. Null when the flavor does not declare it.
          nullable: true
          readOnly: true
    publicCloud.reference.Location:
      type: object
      description: 'Location of a reference entry: the region it applies to, its availability zones and whether it is activated on the project'
      properties:
        availabilityZones:
          type: array
          description: Availability zones of the region, for example eu-west-par-a, eu-west-par-b and eu-west-par-c. Empty for a single-AZ region.
          items:
            type: string
          readOnly: true
        region:
          type: string
          description: Region name, for example GRA11
          readOnly: true
        regionActivated:
          type: boolean
          description: Whether the region is already activated on the project. When false, the region must be activated on the project before use.
          readOnly: true
    publicCloud.instance.RemoteConsoleProtocolEnum:
      type: string
      description: 'Underlying protocol used to reach an instance''s remote console. `VNC`: VNC remote framebuffer protocol, giving graphical access to the instance console. `SPICE`: SPICE remote display protocol, offering richer graphical console access. `SERIAL`: Serial console protocol, giving text-based access to the instance''s serial port.'
      enum:
        - SERIAL
        - SPICE
        - VNC
    publicCloud.instance.RemoteConsoleTypeEnum:
      type: string
      description: 'Concrete console client/endpoint type returned when requesting access to an instance''s remote console, combining a display technology with its transport. `NOVNC`: Browser-based VNC client (noVNC) served over the VNC protocol. `XVPVNC`: Xen VNC Proxy (xvpvnc) console, accessed with a dedicated VNC client. `SPICE_HTML5`: Browser-based SPICE client (spice-html5) served over the SPICE protocol. `SERIAL`: Serial console exposed over a websocket connection.'
      enum:
        - NOVNC
        - SERIAL
        - SPICE_HTML5
        - XVPVNC
    common.EventTypeEnum:
      type: string
      description: Nature of an event
      enum:
        - TARGET_SPEC_UPDATE
        - TASK_ERROR
        - TASK_START
        - TASK_SUCCESS
    publicCloud.instanceGroup.InstanceGroupCurrentState:
      type: object
      description: 'Actual state of an instance group as reported by the backend (OpenStack/Nova server group). This is read-only: it reflects what the backend observes, in contrast to the desired InstanceGroupTargetSpec supplied on creation. Besides the group''s name, location and placement policy, it exposes the current membership. Membership is fixed once instances are created: instances join a group only at instance-creation time via the instance''s targetSpec.group field, and there is no route to add or remove members afterward.'
      properties:
        location:
          description: Location. Region (and, where applicable, availability zone) where the instance group and its member instances are deployed, as observed on the backend.
          readOnly: true
          type: object
          properties:
            availabilityZone:
              type: string
              description: Availability zone within the region
              nullable: true
            region:
              type: string
              description: Region code
          required:
            - region
        members:
          type: array
          description: Instances currently belonging to this group, each referenced by its identifier (see InstanceGroupMemberRef). Membership is determined at instance-creation time via the instance's targetSpec.group field and cannot be changed afterward. Null or empty when the group has no member instances.
          nullable: true
          items:
            $ref: '#/components/schemas/publicCloud.instanceGroup.InstanceGroupMemberRef'
          readOnly: true
        name:
          type: string
          description: Display name of the instance group as reported by the backend. Fixed for the lifetime of the group, since instance groups cannot be updated.
          readOnly: true
        policy:
          description: 'Placement policy currently enforced for the group''s members (see PolicyEnum): AFFINITY packs members onto the same hypervisor, ANTI_AFFINITY spreads them across distinct hypervisors. Mirrors the underlying OpenStack/Nova server group policy and is fixed at creation.'
          readOnly: true
          type: string
          enum:
            - AFFINITY
            - ANTI_AFFINITY
    publicCloud.instanceGroup.InstanceGroupTargetSpec:
      type: object
      description: 'Desired instance group specification (creation). User-controlled specification of an instance group, as supplied on creation (POST). It carries every settable field: name, location and placement policy. All of these fields are immutable once the group exists. An instance group has no update (PUT) route, so this specification is fixed for the lifetime of the group. Membership is not part of this spec: instances join the group only at instance-creation time via the instance''s targetSpec.group field.'
      properties:
        location:
          description: Target location. Region (and optional availability zone) where the instance group, and therefore its member instances, are placed. Immutable after creation. A group cannot be moved to another region/zone, and its members must be created in this same location.
          type: object
          properties:
            availabilityZone:
              type: string
              description: Availability zone within the region
              nullable: true
            region:
              type: string
              description: Region code
          required:
            - region
        name:
          type: string
          description: Desired display name of the instance group. Immutable after creation, as instance groups cannot be updated.
        policy:
          description: 'Placement policy applied to the group''s member instances (see PolicyEnum): AFFINITY packs members onto the same hypervisor, while ANTI_AFFINITY spreads members across distinct hypervisors. This maps to the underlying OpenStack/Nova server group policy and is immutable after creation.'
          type: string
          enum:
            - AFFINITY
            - ANTI_AFFINITY
      required:
        - location
        - name
        - policy
