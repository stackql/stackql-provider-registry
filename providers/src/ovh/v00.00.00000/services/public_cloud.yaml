              type: string
              enum:
                - CLASSIC
                - DISCOVERY
            name:
              type: string
              description: Name of the public cloud project
          required:
            - mode
            - name
        updatedAt:
          type: string
          description: Date of the last cloud project update
          format: date-time
          readOnly: true
    publicCloud.ai.agents.Agent:
      type: object
      description: A managed AI agent
      properties:
        createdAt:
          type: string
          description: Date of the AI agent creation
          format: date-time
          readOnly: true
        currentState:
          description: Current state of the AI agent
          nullable: true
          readOnly: true
          type: object
          properties:
            aiEndpoints:
              type: boolean
              description: Whether this AI agent carries the OVHcloud AI Endpoints provider preset
              nullable: true
              readOnly: true
            aiEndpointsIntegratedAuth:
              type: boolean
              description: Whether OVHcloud provisioned the AI Endpoints credential for this agent, so the caller did not have to supply one
              nullable: true
              readOnly: true
            enabled:
              type: boolean
              description: Actual running state of the AI agent. False when the agent is paused.
              readOnly: true
            endpointUrl:
              type: string
              description: URL to invoke the AI agent
              nullable: true
              readOnly: true
            name:
              type: string
              description: Name of the AI agent
              readOnly: true
        id:
          type: string
          description: Unique identifier of the AI agent
          readOnly: true
        resourceStatus:
          description: 'Reflects the readiness of the AI agent: READY, SUSPENDED when it is paused, or DELETING on the response to its deletion'
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
        targetSpec:
          description: Last target specification of the AI agent
          readOnly: true
          type: object
          properties:
            enabled:
              type: boolean
              description: Desired running state of the AI agent. False when the agent is paused.
              readOnly: true
            name:
              type: string
              description: Name of the AI agent
              readOnly: true
        updatedAt:
          type: string
          description: Date of the last AI agent update
          format: date-time
          readOnly: true
    publicCloud.ai.agents.AgentCreation:
      type: object
      description: Input parameters for creating an AI agent
      properties:
        targetSpec:
          description: Desired specification of the AI agent to create
          type: object
          properties:
            config:
              description: Optional AI agent configuration seeded at creation, combinable with or used instead of template. Set only here, at creation time; read and changed afterward through the AI agent itself, not through this resource.
              nullable: true
              type: object
              properties:
                agent:
                  description: The agent's identity settings, such as its display name.
                  nullable: true
                  type: object
                  properties:
                    name:
                      type: string
                      description: Display name for the agent, shown in the interface. Empty falls back to a generic label.
                      nullable: true
                auth:
                  description: Authentication settings for the agent's HTTP API. Unset falls back to requiring a token issued by the agent itself.
                  nullable: true
                  type: object
                  properties:
                    kagentJwt:
                      description: Settings for tokens the agent issues and validates itself. Unset or disabled means the agent does not accept self-issued tokens.
                      nullable: true
                      type: object
                      properties:
                        allowUnlimited:
                          type: boolean
                          description: Whether requests for a token with no expiry are honored. Set to false to require every token to expire. Defaults to true.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Master switch for self-issued tokens. When false, minting new tokens is refused. Defaults to true.
                          nullable: true
                        maxTtlSeconds:
                          type: integer
                          description: Maximum lifetime in seconds allowed for a newly issued token. Requests for a longer lifetime are rejected. When omitted, no cap.
                          nullable: true
                        secretB64:
                          type: string
                          description: Signing key used to issue and validate self-issued tokens. Kept secret and never returned in plain text once set. When empty, no key is provisioned, so token minting and validation both fail.
                          nullable: true
                    mode:
                      description: Which authentication mode is enforced on the agent's HTTP API.
                      nullable: true
                      type: string
                      enum:
                        - KAGENT_JWT
                        - NONE
                        - OAUTH2
                    oauth2:
                      description: External identity provider settings, used when the authentication mode accepts an external OAuth2 token.
                      nullable: true
                      type: object
                      properties:
                        audience:
                          type: string
                          description: Expected audience value that a presented token must carry to be accepted
                        issuer:
                          type: string
                          description: Base URL of the external identity provider that issues tokens for this agent
                        jwksUri:
                          type: string
                          description: Explicit JWKS endpoint used to verify token signatures. Unset falls back to the identity provider's well-known JWKS location.
                          nullable: true
                        ownerSub:
                          type: string
                          description: Stable identifier of the agent's owner at the identity provider. A presented token's subject must match this value to be accepted.
                          nullable: true
                        requiredScopes:
                          type: array
                          description: Scopes a presented token must carry to be accepted. When empty, no scope is required.
                          nullable: true
                          items:
                            type: string
                builtins:
                  description: Toggles for the agent's built-in capabilities, such as network access and web search.
                  nullable: true
                  type: object
                  properties:
                    network:
                      type: boolean
                      description: Whether the agent can make outbound network requests. Defaults to true.
                      nullable: true
                    search:
                      type: boolean
                      description: Whether the agent can perform web searches. Defaults to true.
                      nullable: true
                    searchApiKey:
                      type: string
                      description: API key for the configured search provider, when the provider requires one.
                      nullable: true
                    searchProvider:
                      type: string
                      description: Which search engine the agent uses for web searches. Defaults to 'duckduckgo'.
                      nullable: true
                    toolsDeny:
                      type: array
                      description: 'Tools this agent must not be offered, as glob patterns matched against the tool name (''*'' = any run of characters). The ''builtins'' flags above are all-or-nothing per subsystem — ''relay'' exposes twenty ''relay_*'' tools or none. A product built on kadk routinely wants *most* of a subsystem plus a composite of its own, and then finds the model reaching past the composite for the primitives it wraps: offered both ''revision_room'' and ''relay_create_room'', a model will happily assemble the room by hand and skip everything the composite also did. Naming the primitives here is how the product says ''that path is mine to own''.'
                      nullable: true
                      items:
                        type: string
                    wizard:
                      type: boolean
                      description: Whether the agent can reconfigure its own settings, such as its model or memory, from within a conversation. Off by default; only available to an administrator caller when enabled.
                      nullable: true
                channels:
                  description: Messaging-platform integrations, such as Telegram and Webex, the agent can send and receive messages through.
                  nullable: true
                  type: object
                  properties:
                    telegram:
                      description: Telegram integration settings. When omitted, Telegram is not connected.
                      nullable: true
                      type: object
                      properties:
                        botToken:
                          type: string
                          description: Bot token issued by Telegram's BotFather. Kept secret and never returned in plain text once set.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Master switch for the Telegram integration. When false, this channel is unavailable to the agent.
                          nullable: true
                        webhookSecret:
                          type: string
                          description: Shared secret used to verify that incoming Telegram messages genuinely come from Telegram. Leaving it empty disables this verification, which is not recommended.
                          nullable: true
                    webex:
                      description: Webex integration settings. When omitted, Webex is not connected.
                      nullable: true
                      type: object
                      properties:
                        accessToken:
                          type: string
                          description: Bot access token issued by Webex. Kept secret and never returned in plain text once set.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Master switch for the Webex integration. When false, this channel is unavailable to the agent.
                          nullable: true
                        webhookSecret:
                          type: string
                          description: Shared secret used to verify that incoming Webex messages genuinely come from Webex. Leaving it empty skips this verification.
                          nullable: true
                exec:
                  description: Remote command-execution settings. Unset or disabled means the agent cannot run shell commands.
                  nullable: true
                  type: object
                  properties:
                    apiKey:
                      type: string
                      description: API key used to authenticate to the remote command-execution service. Kept secret and never returned in plain text once set.
                      nullable: true
                    autoSuspendIdleSeconds:
                      type: integer
                      description: Number of seconds of inactivity before a sandboxed compute session is automatically suspended. Defaults to 60 seconds.
                      nullable: true
                    baseUrl:
                      type: string
                      description: Base URL of the remote command-execution service. No trailing slash.
                      nullable: true
                    defaultImage:
                      type: string
                      description: Default machine image used when the agent provisions a new sandboxed compute session
                      nullable: true
                    enabled:
                      type: boolean
                      description: Master switch for remote command execution. When false, the agent cannot run shell commands.
                      nullable: true
                llm:
                  description: The language model this agent uses to respond, including sampling settings and failover targets.
                  nullable: true
                  type: object
                  properties:
                    failover:
                      description: Which kinds of call failures trigger switching to a backup model instead of surfacing the error.
                      nullable: true
                      type: object
                      properties:
                        'on':
                          type: array
                          description: Failure reasons that trigger switching to the next backup model. A failure reason not listed here is reported as an error instead of triggering failover.
                          nullable: true
                          items:
                            $ref: '#/components/schemas/publicCloud.ai.agents.FailoverPolicyOnEnum'
                    fallbacks:
                      type: array
                      description: Ordered list of backup models tried, in turn, when the primary model fails. Empty means no failover.
                      nullable: true
                      items:
                        $ref: '#/components/schemas/publicCloud.ai.agents.LlmFallback'
                    maxContextMessages:
                      type: integer
                      description: 'How many trailing messages of a conversation go into the payload. ''None'' keeps the historical 50. That number predates context windows measured in the hundreds of thousands of tokens: on a 262k-token model a 50-message cap uses a fraction of what is available, and everything older is dropped without a summary — the conversation quietly forgets rather than compacting. Raising it hands the ceiling back to the compaction path, which now has a declared budget to compare against.'
                      nullable: true
                    maxTokens:
                      type: integer
                      description: Maximum number of tokens the model may generate in a single response. Unset uses the provider's default.
                      nullable: true
                    model:
                      type: string
                      description: Identifier of the model to call, for example 'gpt-5'.
                      nullable: true
                    providerId:
                      type: string
                      description: Id of the connected provider to call for this model. Must reference an entry in the shared provider pool.
                      nullable: true
                    temperature:
                      type: number
                      description: 'Sampling temperature controlling response randomness: lower values are more deterministic, higher values are more varied. Unset uses the provider''s default.'
                      nullable: true
                    vision:
                      description: Optional secondary model used to describe images when the primary model cannot see them. Unset means images are not described for a text-only model.
                      nullable: true
                      type: object
                      properties:
                        maxTokens:
                          type: integer
                          description: Maximum response tokens for this backup target. Unset falls back to the primary model's setting.
                          nullable: true
                        model:
                          type: string
                          description: Model identifier to use for this backup target. Empty reuses the primary model's identifier against this provider.
                          nullable: true
                        providerId:
                          type: string
                          description: Id of the connected provider to call for this backup target
                          nullable: true
                        temperature:
                          type: number
                          description: Sampling temperature for this backup target. Unset falls back to the primary model's temperature.
                          nullable: true
                mcpIndexer:
                  description: Settings for searchable tool indexing, required when any connected tool server uses indexed mode instead of listing all its tools directly.
                  nullable: true
                  type: object
                  properties:
                    embedderBatchSize:
                      type: integer
                      description: Number of tool descriptions embedded per request when building the search index. Defaults to 16 when unset.
                      nullable: true
                    embedderModel:
                      type: string
                      description: Identifier of the embedding model used to index tool descriptions for search, for example 'text-embedding-3-small'.
                    providerId:
                      type: string
                      description: Id of the connected provider used to generate embeddings for tool search. Required as soon as any tool server uses indexed mode.
                      nullable: true
                mcpServers:
                  type: object
                  description: Connected MCP tool servers, keyed by a caller-chosen server name.
                  nullable: true
                  additionalProperties:
                    $ref: '#/components/schemas/publicCloud.ai.agents.McpServer'
                memory:
                  description: Long-term memory settings that let the agent retain and later recall facts across conversations.
                  nullable: true
                  type: object
                  properties:
                    consolidateOnTurnEnd:
                      type: boolean
                      description: Whether the agent reviews each conversation turn to capture any durable facts it did not already record. Defaults to true.
                      nullable: true
                    consolidationCron:
                      type: string
                      description: Schedule, as a five-field cron expression, for the periodic pass that merges duplicate facts and promotes frequently reinforced ones. Defaults to daily at 3 AM.
                      nullable: true
                    consolidationMaxRounds:
                      type: integer
                      description: Maximum number of internal steps the end-of-turn memory review may take. Defaults to 3.
                      nullable: true
                    corePredicates:
                      type: array
                      description: Fact categories eligible for automatic promotion to permanent status when reinforced. Empty disables automatic promotion; facts can still be promoted manually.
                      nullable: true
                      items:
                        type: string
                    embedderBatchSize:
                      type: integer
                      description: Number of facts embedded per request when building the memory index. Defaults to 16.
                      nullable: true
                    embedderModel:
                      type: string
                      description: Identifier of the embedding model used to index remembered facts for recall. Required when memory is enabled.
                      nullable: true
                    enabled:
                      type: boolean
                      description: Master switch for the memory feature. When false, the agent retains no long-term facts.
                      nullable: true
                    gcCron:
                      type: string
                      description: Schedule, as a five-field cron expression, for the periodic cleanup pass that evicts low-value facts once storage exceeds its soft limit. Defaults to hourly.
                      nullable: true
                    gcMaxSize:
                      type: integer
                      description: Hard upper bound on the number of stored facts, used as a safety cap against runaway growth. Defaults to 20000.
                      nullable: true
                    gcMinRetention:
                      type: number
                      description: Minimum retention score, from 0 to 1 with no unit, a non-permanent fact must keep to survive cleanup; facts scoring below this are marked for eviction. Defaults to 0.15.
                      nullable: true
                    gcSoftLimit:
                      type: integer
                      description: Number of stored facts above which cleanup starts evicting low-value ones, stopping once storage is back down to 90% of this value. Defaults to 10000.
                      nullable: true
                    halfLifeDays:
                      type: integer
                      description: Number of days after which a fact's retention score decays by half. Higher values make facts fade more slowly. Defaults to 45.
                      nullable: true
                    identityPromotionThreshold:
                      type: integer
                      description: Number of times a fact in a core category must be reinforced before it is promoted to permanent status and never evicted. Defaults to 5.
                      nullable: true
                    inferenceLlmFallback:
                      type: boolean
                      description: Whether the model is consulted to classify facts the automatic pass could not resolve on its own. Defaults to true; set to false to keep consolidation fully automatic.
                      nullable: true
                    mergeSimilarityThreshold:
                      type: number
                      description: Similarity threshold, from 0 to 1, above which two facts about the same subject are merged during cleanup. Defaults to 0.92.
                      nullable: true
                    providerId:
                      type: string
                      description: Id of the connected provider used to generate embeddings for stored facts. Required when memory is enabled.
                      nullable: true
                    ruleIdleGcDays:
                      type: integer
                      description: Number of days a derived rule may go unused before cleanup removes it. Defaults to 60.
                      nullable: true
                    rulesMax:
                      type: integer
                      description: Maximum number of derived rules retained. Older or unused rules are cleaned up during consolidation. Defaults to 256.
                      nullable: true
                profiles:
                  description: Specialized sub-personas this agent can delegate tasks to.
                  nullable: true
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Master switch for the delegated-agents feature. When false, this agent cannot delegate to a named sub-persona.
                      nullable: true
                    items:
                      type: object
                      description: Sub-personas defined directly in this configuration, keyed by name
                      nullable: true
                      additionalProperties:
                        $ref: '#/components/schemas/publicCloud.ai.agents.AgentSeed'
                providers:
                  type: object
                  description: Shared pool of language-model provider connections, keyed by a caller-chosen provider id and referenced by name elsewhere in this configuration.
                  nullable: true
                  additionalProperties:
                    $ref: '#/components/schemas/publicCloud.ai.agents.ProviderConfig'
                relay:
                  description: Settings for hosting a local messaging relay that other participants can join.
                  nullable: true
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Master switch for hosting a relay. When false, the relay and its rooms are not available.
                      nullable: true
                    maxMessagesPerRoom:
                      type: integer
                      description: Maximum number of messages retained per room. Unset means unlimited.
                      nullable: true
                    maxRooms:
                      type: integer
                      description: Maximum number of rooms this relay may host. Unset means unlimited.
                      nullable: true
                    roomCreation:
                      description: 'Controls who may create a new room on this relay: by default only the host can create rooms, but this can be relaxed so that any authenticated member creates one simply by joining a room that does not yet exist.'
                      nullable: true
                      type: string
                      enum:
                        - OPEN
                        - OWNER
                skills:
                  description: 'Reusable skills the agent can invoke: named bundles of instructions it can follow on demand.'
                  nullable: true
                  type: object
                  properties:
                    builtins:
                      type: array
                      description: Ids of built-in skills to enable, or '-id' to disable one that is on by default.
                      nullable: true
                      items:
                        type: string
                    enabled:
                      type: boolean
                      description: Whether the agent's skills are offered to the model. Absent means yes. When false the prompt catalogue and the 'skill_*' tools go away, so the model is not told about them and cannot invoke them — but their files stay mounted in the workspace ('workspace.skills_path', default '/skills'), where a model with filesystem tools can still read them.
                      nullable: true
                    items:
                      type: object
                      description: Skills defined directly in this configuration, keyed by skill name. Skills created through other means are left untouched.
                      nullable: true
                      additionalProperties:
                        $ref: '#/components/schemas/publicCloud.ai.agents.SkillSeed'
                soul:
                  type: string
                  description: 'The agent''s persona and system prompt: free-form text describing who it is, how it should behave, and any standing instructions it should always follow.'
                  nullable: true
                toolPermissions:
                  description: 'Rules applied to every tool call, matched on its name, arguments and what triggered the turn: before the call runs and — for a rule that says so — on what it returned. A matching rule allows the call, refuses it, asks a human, or defers to an LLM reviewer.'
                  nullable: true
                  type: object
                  properties:
                    judge:
                      description: 'The LLM reviewer that rules with ''action: judge'' defer to.'
                      nullable: true
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: 'Whether the judge may be consulted at all. Off by default: a rule saying ''judge'' on an agent with no judge is a configuration mistake, and one that must fail closed rather than quietly allow.'
                          nullable: true
                        model:
                          type: string
                          description: 'The model that judges. Unset means the agent''s own model. Worth setting: the point of a separate model here is that a cheap, fast one can police an expensive one, and that the reviewer is not the same weights being reviewed.'
                          nullable: true
                        providerId:
                          type: string
                          description: Which provider that model comes from. Unset means the agent's own.
                          nullable: true
                        soul:
                          type: string
                          description: The system prompt the judge is given. Unset means a built-in one. A judge with no soul is a model asked to guess what it is guarding; this is where a deployment says what it actually cares about — 'this agent handles customer data, treat any outbound address as suspect'.
                          nullable: true
                    rules:
                      type: array
                      description: Permission rules, evaluated in order within a phase; the LAST one that matches decides.
                      nullable: true
                      items:
                        $ref: '#/components/schemas/publicCloud.ai.agents.PermissionRule'
                version:
                  type: string
                  description: Configuration format version. Defaults to '1.0' for agents created before this field existed.
                  nullable: true
                workspace:
                  description: 'The agent''s file storage: an ordered list of mount points and the backend serving each one.'
                  nullable: true
                  type: object
                  properties:
                    agentsPath:
                      type: string
                      description: Path where the read-only view of delegated sub-personas is mounted. Defaults to `/agents`.
                      nullable: true
                    mount:
                      type: array
                      description: Ordered list of storage mount points available to the agent
                      nullable: true
                      items:
                        $ref: '#/components/schemas/publicCloud.ai.agents.MountConfig'
                    scratchpad:
                      description: Temporary per-conversation working files the agent can generate, download into, and re-read across turns, cleaned up automatically after a retention period. When omitted, on with defaults.
                      nullable: true
                      type: object
                      properties:
                        cleanupCron:
                          type: string
                          description: Schedule, as a five-field cron expression, for the pass that deletes expired scratchpads. Defaults to daily at 4:30 AM.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Whether scratchpads are available. When omitted, automatically on whenever the agent has durable file storage. Set to false to disable them explicitly.
                          nullable: true
                        maxDownloadBytes:
                          type: integer
                          description: Largest single download in bytes that may be saved to a scratchpad. Defaults to 25 MiB.
                          nullable: true
                        path:
                          type: string
                          description: Absolute path of the directory holding one subdirectory per conversation. Defaults to `/scratchpad`.
                          nullable: true
                        retentionDays:
                          type: integer
                          description: Number of days a conversation's scratchpad may go untouched before it is deleted. Defaults to 7.
                          nullable: true
                        spillBytes:
                          type: integer
                          description: Size in bytes above which a fetched page is saved to the scratchpad and summarized instead of being returned in full. Defaults to 128 KiB.
                          nullable: true
                    skillsPath:
                      type: string
                      description: Path where the read-only view of the agent's skills is mounted. Defaults to `/skills`.
                      nullable: true
                    zerofs:
                      description: Optional shared scratch storage mount, also reachable from any remote command-execution session tied to this agent
                      nullable: true
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: Whether this mount is active. When omitted, automatically on whenever remote command execution is configured. Set to false to disable it explicitly.
                          nullable: true
                        mountPath:
                          type: string
                          description: Absolute path where this mount appears in the agent's filesystem. Defaults to `/wrk`.
                          nullable: true
            enabled:
              type: boolean
              description: Desired running state of the AI agent. When false the agent is created paused. Defaults to true
              nullable: true
            name:
              type: string
              description: 'Name of the AI agent, at most 192 bytes of UTF-8, free of control characters. Unique among this project''s agents, with one exception: an agent created before this API enforced uniqueness may share its name with a newer one. Can be changed afterwards through the update endpoint'
            template:
              description: Reference to a template used to seed the AI agent configuration once, at creation time
              nullable: true
              type: object
              properties:
                id:
                  type: string
                  description: Identifier of the template to seed the AI agent configuration from. Honored only at creation time.
              required:
                - id
          required:
            - name
      required:
        - targetSpec
    publicCloud.ai.agents.AgentUpdate:
      type: object
      description: Input for AI agent update
      properties:
        targetSpec:
          description: Desired specification to reconcile the AI agent toward
          type: object
          properties:
            enabled:
              type: boolean
              description: Desired running state of the AI agent. Set to false to pause it, true to resume it
            name:
              type: string
              description: New name for the AI agent, at most 192 bytes of UTF-8, free of control characters. Omitted or null leaves the current name untouched, and so does restating the name the agent already has. Rejected if another agent in this project already has it, with the same exception as at creation. Renaming redeploys the agent on its current runtime component
              nullable: true
          required:
            - enabled
      required:
        - targetSpec
    publicCloud.ai.agents.AgentTokenCreation:
      type: object
      description: Input parameters for issuing an AI agent access token
      properties:
        lifetimeSeconds:
          type: integer
          description: Token lifetime in seconds. Defaults to the agent's default.
          nullable: true
        role:
          description: Role granted to the minted token. Defaults to VIEWER.
          nullable: true
          type: string
          enum:
            - ADMIN
            - OPERATOR
            - USER
            - VIEWER
    publicCloud.ai.agents.AgentToken:
      type: object
      description: An issued AI agent access token
      properties:
        expiresAt:
          type: string
          description: Expiration date of the token. Null when the token does not expire.
          nullable: true
          format: date-time
          readOnly: true
        role:
          description: Role granted to the token
          readOnly: true
          type: string
          enum:
            - ADMIN
            - OPERATOR
            - USER
            - VIEWER
        token:
          type: string
          description: Bearer token used to authenticate against the AI agent. Returned only once, at mint time.
          readOnly: true
    publicCloud.ai.agents.GlobalSettings:
      type: object
      description: What OVHcloud reserves of an AI agent's own configuration. A client reads it to know which parts of an agent's configuration it may change, before offering the change.
      properties:
        agentConfig:
          description: What this deployment reserves of, and offers of, an agent's own configuration
          readOnly: true
          type: object
          properties:
            auth:
              description: Reservation covering the agent's authentication block
              readOnly: true
              type: object
              properties:
                managed:
                  type: boolean
                  description: Whether the agent's auth block is reserved by the deployment, and so neither settable at creation nor editable afterward
                  readOnly: true
            exec:
              description: Availability of the agent's code-execution blocks
              readOnly: true
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether an agent's configuration may carry the code-execution blocks (config.exec and config.workspace.zerofs). When false, a creation or template naming either is refused.
                  readOnly: true
    publicCloud.ai.agents.AIEndpointsPreset:
      type: object
      description: 'What OVHcloud offers of the AI Endpoints provider preset: whether the preset can be selected at all, whether its authentication can be provisioned for the agent, the base URL to list available models from, and the model used when the caller states none'
      properties:
        apiBase:
          type: string
          description: OpenAI-compatible base URL, published so a client can list models from its /models sub-path
          readOnly: true
        defaultModel:
          type: string
          description: Model seeded when the caller states none. Empty when this deployment states no default.
          nullable: true
          readOnly: true
        enabled:
          type: boolean
          description: Whether the OVHcloud AI Endpoints provider preset is available on this deployment
          readOnly: true
        integratedAuth:
          type: boolean
          description: Whether OVHcloud provisions the AI Endpoints credential for the agent, so the caller does not have to supply one
          readOnly: true
    publicCloud.ai.agents.TemplatePreset:
      type: object
      description: One ready-made AI agent configuration OVHcloud publishes, offered alongside the templates a caller writes for themselves. Its identifier is what a creation names to build an agent from it, and carries a reserved prefix that distinguishes it from a caller's own template.
      properties:
        aiEndpoints:
          type: boolean
          description: Whether an agent created from this preset uses the OVHcloud AI Endpoints provider preset
          nullable: true
          readOnly: true
        aiEndpointsIntegratedAuth:
          type: boolean
          description: Whether the AI Endpoints credential is minted by this service rather than supplied by the caller
          nullable: true
          readOnly: true
        description:
          type: string
          description: What this preset is for. Empty when the deployment states none.
          nullable: true
          readOnly: true
        id:
          type: string
          description: Identifier to pass as targetSpec.template.id when creating an agent from this preset
          readOnly: true
        name:
          type: string
          description: Human-readable name of the preset
          readOnly: true
    publicCloud.ai.agents.Template:
      type: object
      description: An AI agent configuration template
      properties:
        createdAt:
          type: string
          description: Date of the template creation
          format: date-time
          readOnly: true
        id:
          type: string
          description: Unique identifier of the template
          readOnly: true
        resourceStatus:
          description: 'Reflects the readiness of the template: READY, or DELETING on the response to its deletion'
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
        source:
          description: Distinguishes built-in (code-defined) from user-authored templates
          readOnly: true
          type: string
          enum:
            - BUILTIN
            - USER
        targetSpec:
          description: Desired specification to replace the template with
          readOnly: true
          type: object
          properties:
            config:
              description: Templated AI agent configuration
              nullable: true
              type: object
              properties:
                agent:
                  description: The agent's identity settings, such as its display name.
                  nullable: true
                  type: object
                  properties:
                    name:
                      type: string
                      description: Display name for the agent, shown in the interface. Empty falls back to a generic label.
                      nullable: true
                auth:
                  description: Authentication settings for the agent's HTTP API. Unset falls back to requiring a token issued by the agent itself.
                  nullable: true
                  type: object
                  properties:
                    kagentJwt:
                      description: Settings for tokens the agent issues and validates itself. Unset or disabled means the agent does not accept self-issued tokens.
                      nullable: true
                      type: object
                      properties:
                        allowUnlimited:
                          type: boolean
                          description: Whether requests for a token with no expiry are honored. Set to false to require every token to expire. Defaults to true.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Master switch for self-issued tokens. When false, minting new tokens is refused. Defaults to true.
                          nullable: true
                        maxTtlSeconds:
                          type: integer
                          description: Maximum lifetime in seconds allowed for a newly issued token. Requests for a longer lifetime are rejected. When omitted, no cap.
                          nullable: true
                        secretB64:
                          type: string
                          description: Signing key used to issue and validate self-issued tokens. Kept secret and never returned in plain text once set. When empty, no key is provisioned, so token minting and validation both fail.
                          nullable: true
                    mode:
                      description: Which authentication mode is enforced on the agent's HTTP API.
                      nullable: true
                      type: string
                      enum:
                        - KAGENT_JWT
                        - NONE
                        - OAUTH2
                    oauth2:
                      description: External identity provider settings, used when the authentication mode accepts an external OAuth2 token.
                      nullable: true
                      type: object
                      properties:
                        audience:
                          type: string
                          description: Expected audience value that a presented token must carry to be accepted
                        issuer:
                          type: string
                          description: Base URL of the external identity provider that issues tokens for this agent
                        jwksUri:
                          type: string
                          description: Explicit JWKS endpoint used to verify token signatures. Unset falls back to the identity provider's well-known JWKS location.
                          nullable: true
                        ownerSub:
                          type: string
                          description: Stable identifier of the agent's owner at the identity provider. A presented token's subject must match this value to be accepted.
                          nullable: true
                        requiredScopes:
                          type: array
                          description: Scopes a presented token must carry to be accepted. When empty, no scope is required.
                          nullable: true
                          items:
                            type: string
                builtins:
                  description: Toggles for the agent's built-in capabilities, such as network access and web search.
                  nullable: true
                  type: object
                  properties:
                    network:
                      type: boolean
                      description: Whether the agent can make outbound network requests. Defaults to true.
                      nullable: true
                    search:
                      type: boolean
                      description: Whether the agent can perform web searches. Defaults to true.
                      nullable: true
                    searchApiKey:
                      type: string
                      description: API key for the configured search provider, when the provider requires one.
                      nullable: true
                    searchProvider:
                      type: string
                      description: Which search engine the agent uses for web searches. Defaults to 'duckduckgo'.
                      nullable: true
                    toolsDeny:
                      type: array
                      description: 'Tools this agent must not be offered, as glob patterns matched against the tool name (''*'' = any run of characters). The ''builtins'' flags above are all-or-nothing per subsystem — ''relay'' exposes twenty ''relay_*'' tools or none. A product built on kadk routinely wants *most* of a subsystem plus a composite of its own, and then finds the model reaching past the composite for the primitives it wraps: offered both ''revision_room'' and ''relay_create_room'', a model will happily assemble the room by hand and skip everything the composite also did. Naming the primitives here is how the product says ''that path is mine to own''.'
                      nullable: true
                      items:
                        type: string
                    wizard:
                      type: boolean
                      description: Whether the agent can reconfigure its own settings, such as its model or memory, from within a conversation. Off by default; only available to an administrator caller when enabled.
                      nullable: true
                channels:
                  description: Messaging-platform integrations, such as Telegram and Webex, the agent can send and receive messages through.
                  nullable: true
                  type: object
                  properties:
                    telegram:
                      description: Telegram integration settings. When omitted, Telegram is not connected.
                      nullable: true
                      type: object
                      properties:
                        botToken:
                          type: string
                          description: Bot token issued by Telegram's BotFather. Kept secret and never returned in plain text once set.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Master switch for the Telegram integration. When false, this channel is unavailable to the agent.
                          nullable: true
                        webhookSecret:
                          type: string
                          description: Shared secret used to verify that incoming Telegram messages genuinely come from Telegram. Leaving it empty disables this verification, which is not recommended.
                          nullable: true
                    webex:
                      description: Webex integration settings. When omitted, Webex is not connected.
                      nullable: true
                      type: object
                      properties:
                        accessToken:
                          type: string
                          description: Bot access token issued by Webex. Kept secret and never returned in plain text once set.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Master switch for the Webex integration. When false, this channel is unavailable to the agent.
                          nullable: true
                        webhookSecret:
                          type: string
                          description: Shared secret used to verify that incoming Webex messages genuinely come from Webex. Leaving it empty skips this verification.
                          nullable: true
                exec:
                  description: Remote command-execution settings. Unset or disabled means the agent cannot run shell commands.
                  nullable: true
                  type: object
                  properties:
                    apiKey:
                      type: string
                      description: API key used to authenticate to the remote command-execution service. Kept secret and never returned in plain text once set.
                      nullable: true
                    autoSuspendIdleSeconds:
                      type: integer
                      description: Number of seconds of inactivity before a sandboxed compute session is automatically suspended. Defaults to 60 seconds.
                      nullable: true
                    baseUrl:
                      type: string
                      description: Base URL of the remote command-execution service. No trailing slash.
                      nullable: true
                    defaultImage:
                      type: string
                      description: Default machine image used when the agent provisions a new sandboxed compute session
                      nullable: true
                    enabled:
                      type: boolean
                      description: Master switch for remote command execution. When false, the agent cannot run shell commands.
                      nullable: true
                llm:
                  description: The language model this agent uses to respond, including sampling settings and failover targets.
                  nullable: true
                  type: object
                  properties:
                    failover:
                      description: Which kinds of call failures trigger switching to a backup model instead of surfacing the error.
                      nullable: true
                      type: object
                      properties:
                        'on':
                          type: array
                          description: Failure reasons that trigger switching to the next backup model. A failure reason not listed here is reported as an error instead of triggering failover.
                          nullable: true
                          items:
                            $ref: '#/components/schemas/publicCloud.ai.agents.FailoverPolicyOnEnum'
                    fallbacks:
                      type: array
                      description: Ordered list of backup models tried, in turn, when the primary model fails. Empty means no failover.
                      nullable: true
                      items:
                        $ref: '#/components/schemas/publicCloud.ai.agents.LlmFallback'
                    maxContextMessages:
                      type: integer
                      description: 'How many trailing messages of a conversation go into the payload. ''None'' keeps the historical 50. That number predates context windows measured in the hundreds of thousands of tokens: on a 262k-token model a 50-message cap uses a fraction of what is available, and everything older is dropped without a summary — the conversation quietly forgets rather than compacting. Raising it hands the ceiling back to the compaction path, which now has a declared budget to compare against.'
                      nullable: true
                    maxTokens:
                      type: integer
                      description: Maximum number of tokens the model may generate in a single response. Unset uses the provider's default.
                      nullable: true
                    model:
                      type: string
                      description: Identifier of the model to call, for example 'gpt-5'.
                      nullable: true
                    providerId:
                      type: string
                      description: Id of the connected provider to call for this model. Must reference an entry in the shared provider pool.
                      nullable: true
                    temperature:
                      type: number
                      description: 'Sampling temperature controlling response randomness: lower values are more deterministic, higher values are more varied. Unset uses the provider''s default.'
                      nullable: true
                    vision:
                      description: Optional secondary model used to describe images when the primary model cannot see them. Unset means images are not described for a text-only model.
                      nullable: true
                      type: object
                      properties:
                        maxTokens:
                          type: integer
                          description: Maximum response tokens for this backup target. Unset falls back to the primary model's setting.
                          nullable: true
                        model:
                          type: string
                          description: Model identifier to use for this backup target. Empty reuses the primary model's identifier against this provider.
                          nullable: true
                        providerId:
                          type: string
                          description: Id of the connected provider to call for this backup target
                          nullable: true
                        temperature:
                          type: number
                          description: Sampling temperature for this backup target. Unset falls back to the primary model's temperature.
                          nullable: true
                mcpIndexer:
                  description: Settings for searchable tool indexing, required when any connected tool server uses indexed mode instead of listing all its tools directly.
                  nullable: true
                  type: object
                  properties:
                    embedderBatchSize:
                      type: integer
                      description: Number of tool descriptions embedded per request when building the search index. Defaults to 16 when unset.
                      nullable: true
                    embedderModel:
                      type: string
                      description: Identifier of the embedding model used to index tool descriptions for search, for example 'text-embedding-3-small'.
                    providerId:
                      type: string
                      description: Id of the connected provider used to generate embeddings for tool search. Required as soon as any tool server uses indexed mode.
                      nullable: true
                mcpServers:
                  type: object
                  description: Connected MCP tool servers, keyed by a caller-chosen server name.
                  nullable: true
                  additionalProperties:
                    $ref: '#/components/schemas/publicCloud.ai.agents.McpServer'
                memory:
                  description: Long-term memory settings that let the agent retain and later recall facts across conversations.
                  nullable: true
                  type: object
                  properties:
                    consolidateOnTurnEnd:
                      type: boolean
                      description: Whether the agent reviews each conversation turn to capture any durable facts it did not already record. Defaults to true.
                      nullable: true
                    consolidationCron:
                      type: string
                      description: Schedule, as a five-field cron expression, for the periodic pass that merges duplicate facts and promotes frequently reinforced ones. Defaults to daily at 3 AM.
                      nullable: true
                    consolidationMaxRounds:
                      type: integer
                      description: Maximum number of internal steps the end-of-turn memory review may take. Defaults to 3.
                      nullable: true
                    corePredicates:
                      type: array
                      description: Fact categories eligible for automatic promotion to permanent status when reinforced. Empty disables automatic promotion; facts can still be promoted manually.
                      nullable: true
                      items:
                        type: string
                    embedderBatchSize:
                      type: integer
                      description: Number of facts embedded per request when building the memory index. Defaults to 16.
                      nullable: true
                    embedderModel:
                      type: string
                      description: Identifier of the embedding model used to index remembered facts for recall. Required when memory is enabled.
                      nullable: true
                    enabled:
                      type: boolean
                      description: Master switch for the memory feature. When false, the agent retains no long-term facts.
                      nullable: true
                    gcCron:
                      type: string
                      description: Schedule, as a five-field cron expression, for the periodic cleanup pass that evicts low-value facts once storage exceeds its soft limit. Defaults to hourly.
                      nullable: true
                    gcMaxSize:
                      type: integer
                      description: Hard upper bound on the number of stored facts, used as a safety cap against runaway growth. Defaults to 20000.
                      nullable: true
                    gcMinRetention:
                      type: number
                      description: Minimum retention score, from 0 to 1 with no unit, a non-permanent fact must keep to survive cleanup; facts scoring below this are marked for eviction. Defaults to 0.15.
                      nullable: true
                    gcSoftLimit:
                      type: integer
                      description: Number of stored facts above which cleanup starts evicting low-value ones, stopping once storage is back down to 90% of this value. Defaults to 10000.
                      nullable: true
                    halfLifeDays:
                      type: integer
                      description: Number of days after which a fact's retention score decays by half. Higher values make facts fade more slowly. Defaults to 45.
                      nullable: true
                    identityPromotionThreshold:
                      type: integer
                      description: Number of times a fact in a core category must be reinforced before it is promoted to permanent status and never evicted. Defaults to 5.
                      nullable: true
                    inferenceLlmFallback:
                      type: boolean
                      description: Whether the model is consulted to classify facts the automatic pass could not resolve on its own. Defaults to true; set to false to keep consolidation fully automatic.
                      nullable: true
                    mergeSimilarityThreshold:
                      type: number
                      description: Similarity threshold, from 0 to 1, above which two facts about the same subject are merged during cleanup. Defaults to 0.92.
                      nullable: true
                    providerId:
                      type: string
                      description: Id of the connected provider used to generate embeddings for stored facts. Required when memory is enabled.
                      nullable: true
                    ruleIdleGcDays:
                      type: integer
                      description: Number of days a derived rule may go unused before cleanup removes it. Defaults to 60.
                      nullable: true
                    rulesMax:
                      type: integer
                      description: Maximum number of derived rules retained. Older or unused rules are cleaned up during consolidation. Defaults to 256.
                      nullable: true
                profiles:
                  description: Specialized sub-personas this agent can delegate tasks to.
                  nullable: true
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Master switch for the delegated-agents feature. When false, this agent cannot delegate to a named sub-persona.
                      nullable: true
                    items:
                      type: object
                      description: Sub-personas defined directly in this configuration, keyed by name
                      nullable: true
                      additionalProperties:
                        $ref: '#/components/schemas/publicCloud.ai.agents.AgentSeed'
                providers:
                  type: object
                  description: Shared pool of language-model provider connections, keyed by a caller-chosen provider id and referenced by name elsewhere in this configuration.
                  nullable: true
                  additionalProperties:
                    $ref: '#/components/schemas/publicCloud.ai.agents.ProviderConfig'
                relay:
                  description: Settings for hosting a local messaging relay that other participants can join.
                  nullable: true
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Master switch for hosting a relay. When false, the relay and its rooms are not available.
                      nullable: true
                    maxMessagesPerRoom:
                      type: integer
                      description: Maximum number of messages retained per room. Unset means unlimited.
                      nullable: true
                    maxRooms:
                      type: integer
                      description: Maximum number of rooms this relay may host. Unset means unlimited.
                      nullable: true
                    roomCreation:
                      description: 'Controls who may create a new room on this relay: by default only the host can create rooms, but this can be relaxed so that any authenticated member creates one simply by joining a room that does not yet exist.'
                      nullable: true
                      type: string
                      enum:
                        - OPEN
                        - OWNER
                skills:
                  description: 'Reusable skills the agent can invoke: named bundles of instructions it can follow on demand.'
                  nullable: true
                  type: object
                  properties:
                    builtins:
                      type: array
                      description: Ids of built-in skills to enable, or '-id' to disable one that is on by default.
                      nullable: true
                      items:
                        type: string
                    enabled:
                      type: boolean
                      description: Whether the agent's skills are offered to the model. Absent means yes. When false the prompt catalogue and the 'skill_*' tools go away, so the model is not told about them and cannot invoke them — but their files stay mounted in the workspace ('workspace.skills_path', default '/skills'), where a model with filesystem tools can still read them.
                      nullable: true
                    items:
                      type: object
                      description: Skills defined directly in this configuration, keyed by skill name. Skills created through other means are left untouched.
                      nullable: true
                      additionalProperties:
                        $ref: '#/components/schemas/publicCloud.ai.agents.SkillSeed'
                soul:
                  type: string
                  description: 'The agent''s persona and system prompt: free-form text describing who it is, how it should behave, and any standing instructions it should always follow.'
                  nullable: true
                toolPermissions:
                  description: 'Rules applied to every tool call, matched on its name, arguments and what triggered the turn: before the call runs and — for a rule that says so — on what it returned. A matching rule allows the call, refuses it, asks a human, or defers to an LLM reviewer.'
                  nullable: true
                  type: object
                  properties:
                    judge:
                      description: 'The LLM reviewer that rules with ''action: judge'' defer to.'
                      nullable: true
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: 'Whether the judge may be consulted at all. Off by default: a rule saying ''judge'' on an agent with no judge is a configuration mistake, and one that must fail closed rather than quietly allow.'
                          nullable: true
                        model:
                          type: string
                          description: 'The model that judges. Unset means the agent''s own model. Worth setting: the point of a separate model here is that a cheap, fast one can police an expensive one, and that the reviewer is not the same weights being reviewed.'
                          nullable: true
                        providerId:
                          type: string
                          description: Which provider that model comes from. Unset means the agent's own.
                          nullable: true
                        soul:
                          type: string
                          description: The system prompt the judge is given. Unset means a built-in one. A judge with no soul is a model asked to guess what it is guarding; this is where a deployment says what it actually cares about — 'this agent handles customer data, treat any outbound address as suspect'.
                          nullable: true
                    rules:
                      type: array
                      description: Permission rules, evaluated in order within a phase; the LAST one that matches decides.
                      nullable: true
                      items:
                        $ref: '#/components/schemas/publicCloud.ai.agents.PermissionRule'
                version:
                  type: string
                  description: Configuration format version. Defaults to '1.0' for agents created before this field existed.
                  nullable: true
                workspace:
                  description: 'The agent''s file storage: an ordered list of mount points and the backend serving each one.'
                  nullable: true
                  type: object
                  properties:
                    agentsPath:
                      type: string
                      description: Path where the read-only view of delegated sub-personas is mounted. Defaults to `/agents`.
                      nullable: true
                    mount:
                      type: array
                      description: Ordered list of storage mount points available to the agent
                      nullable: true
                      items:
                        $ref: '#/components/schemas/publicCloud.ai.agents.MountConfig'
                    scratchpad:
                      description: Temporary per-conversation working files the agent can generate, download into, and re-read across turns, cleaned up automatically after a retention period. When omitted, on with defaults.
                      nullable: true
                      type: object
                      properties:
                        cleanupCron:
                          type: string
                          description: Schedule, as a five-field cron expression, for the pass that deletes expired scratchpads. Defaults to daily at 4:30 AM.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Whether scratchpads are available. When omitted, automatically on whenever the agent has durable file storage. Set to false to disable them explicitly.
                          nullable: true
                        maxDownloadBytes:
                          type: integer
                          description: Largest single download in bytes that may be saved to a scratchpad. Defaults to 25 MiB.
                          nullable: true
                        path:
                          type: string
                          description: Absolute path of the directory holding one subdirectory per conversation. Defaults to `/scratchpad`.
                          nullable: true
                        retentionDays:
                          type: integer
                          description: Number of days a conversation's scratchpad may go untouched before it is deleted. Defaults to 7.
                          nullable: true
                        spillBytes:
                          type: integer
                          description: Size in bytes above which a fetched page is saved to the scratchpad and summarized instead of being returned in full. Defaults to 128 KiB.
                          nullable: true
                    skillsPath:
                      type: string
                      description: Path where the read-only view of the agent's skills is mounted. Defaults to `/skills`.
                      nullable: true
                    zerofs:
                      description: Optional shared scratch storage mount, also reachable from any remote command-execution session tied to this agent
                      nullable: true
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: Whether this mount is active. When omitted, automatically on whenever remote command execution is configured. Set to false to disable it explicitly.
                          nullable: true
                        mountPath:
                          type: string
                          description: Absolute path where this mount appears in the agent's filesystem. Defaults to `/wrk`.
                          nullable: true
            description:
              type: string
              description: Optional human-readable description
              nullable: true
            name:
              type: string
              description: Name of the template
          required:
            - name
        updatedAt:
          type: string
          description: Date of the last template update
          format: date-time
          readOnly: true
    publicCloud.ai.agents.TemplateCreation:
      type: object
      description: Input parameters for creating an AI agent template
      properties:
        targetSpec:
          description: Desired specification of the template to create
          type: object
          properties:
            config:
              description: Templated AI agent configuration
              type: object
              properties:
                agent:
                  description: The agent's identity settings, such as its display name.
                  nullable: true
                  type: object
                  properties:
                    name:
                      type: string
                      description: Display name for the agent, shown in the interface. Empty falls back to a generic label.
                      nullable: true
                auth:
                  description: Authentication settings for the agent's HTTP API. Unset falls back to requiring a token issued by the agent itself.
                  nullable: true
                  type: object
                  properties:
                    kagentJwt:
                      description: Settings for tokens the agent issues and validates itself. Unset or disabled means the agent does not accept self-issued tokens.
                      nullable: true
                      type: object
                      properties:
                        allowUnlimited:
                          type: boolean
                          description: Whether requests for a token with no expiry are honored. Set to false to require every token to expire. Defaults to true.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Master switch for self-issued tokens. When false, minting new tokens is refused. Defaults to true.
                          nullable: true
                        maxTtlSeconds:
                          type: integer
                          description: Maximum lifetime in seconds allowed for a newly issued token. Requests for a longer lifetime are rejected. When omitted, no cap.
                          nullable: true
                        secretB64:
                          type: string
                          description: Signing key used to issue and validate self-issued tokens. Kept secret and never returned in plain text once set. When empty, no key is provisioned, so token minting and validation both fail.
                          nullable: true
                    mode:
                      description: Which authentication mode is enforced on the agent's HTTP API.
                      nullable: true
                      type: string
                      enum:
                        - KAGENT_JWT
                        - NONE
                        - OAUTH2
                    oauth2:
                      description: External identity provider settings, used when the authentication mode accepts an external OAuth2 token.
                      nullable: true
                      type: object
                      properties:
                        audience:
                          type: string
                          description: Expected audience value that a presented token must carry to be accepted
                        issuer:
                          type: string
                          description: Base URL of the external identity provider that issues tokens for this agent
                        jwksUri:
                          type: string
                          description: Explicit JWKS endpoint used to verify token signatures. Unset falls back to the identity provider's well-known JWKS location.
                          nullable: true
                        ownerSub:
                          type: string
                          description: Stable identifier of the agent's owner at the identity provider. A presented token's subject must match this value to be accepted.
                          nullable: true
                        requiredScopes:
                          type: array
                          description: Scopes a presented token must carry to be accepted. When empty, no scope is required.
                          nullable: true
                          items:
                            type: string
                builtins:
                  description: Toggles for the agent's built-in capabilities, such as network access and web search.
                  nullable: true
                  type: object
                  properties:
                    network:
                      type: boolean
                      description: Whether the agent can make outbound network requests. Defaults to true.
                      nullable: true
                    search:
                      type: boolean
                      description: Whether the agent can perform web searches. Defaults to true.
                      nullable: true
                    searchApiKey:
                      type: string
                      description: API key for the configured search provider, when the provider requires one.
                      nullable: true
                    searchProvider:
                      type: string
                      description: Which search engine the agent uses for web searches. Defaults to 'duckduckgo'.
                      nullable: true
                    toolsDeny:
                      type: array
                      description: 'Tools this agent must not be offered, as glob patterns matched against the tool name (''*'' = any run of characters). The ''builtins'' flags above are all-or-nothing per subsystem — ''relay'' exposes twenty ''relay_*'' tools or none. A product built on kadk routinely wants *most* of a subsystem plus a composite of its own, and then finds the model reaching past the composite for the primitives it wraps: offered both ''revision_room'' and ''relay_create_room'', a model will happily assemble the room by hand and skip everything the composite also did. Naming the primitives here is how the product says ''that path is mine to own''.'
                      nullable: true
                      items:
                        type: string
                    wizard:
                      type: boolean
                      description: Whether the agent can reconfigure its own settings, such as its model or memory, from within a conversation. Off by default; only available to an administrator caller when enabled.
                      nullable: true
                channels:
                  description: Messaging-platform integrations, such as Telegram and Webex, the agent can send and receive messages through.
                  nullable: true
                  type: object
                  properties:
                    telegram:
                      description: Telegram integration settings. When omitted, Telegram is not connected.
                      nullable: true
                      type: object
                      properties:
                        botToken:
                          type: string
                          description: Bot token issued by Telegram's BotFather. Kept secret and never returned in plain text once set.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Master switch for the Telegram integration. When false, this channel is unavailable to the agent.
                          nullable: true
                        webhookSecret:
                          type: string
                          description: Shared secret used to verify that incoming Telegram messages genuinely come from Telegram. Leaving it empty disables this verification, which is not recommended.
                          nullable: true
                    webex:
                      description: Webex integration settings. When omitted, Webex is not connected.
                      nullable: true
                      type: object
                      properties:
                        accessToken:
                          type: string
                          description: Bot access token issued by Webex. Kept secret and never returned in plain text once set.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Master switch for the Webex integration. When false, this channel is unavailable to the agent.
                          nullable: true
                        webhookSecret:
                          type: string
                          description: Shared secret used to verify that incoming Webex messages genuinely come from Webex. Leaving it empty skips this verification.
                          nullable: true
                exec:
                  description: Remote command-execution settings. Unset or disabled means the agent cannot run shell commands.
                  nullable: true
                  type: object
                  properties:
                    apiKey:
                      type: string
                      description: API key used to authenticate to the remote command-execution service. Kept secret and never returned in plain text once set.
                      nullable: true
                    autoSuspendIdleSeconds:
                      type: integer
                      description: Number of seconds of inactivity before a sandboxed compute session is automatically suspended. Defaults to 60 seconds.
                      nullable: true
                    baseUrl:
                      type: string
                      description: Base URL of the remote command-execution service. No trailing slash.
                      nullable: true
                    defaultImage:
                      type: string
                      description: Default machine image used when the agent provisions a new sandboxed compute session
                      nullable: true
                    enabled:
                      type: boolean
                      description: Master switch for remote command execution. When false, the agent cannot run shell commands.
                      nullable: true
                llm:
                  description: The language model this agent uses to respond, including sampling settings and failover targets.
                  nullable: true
                  type: object
                  properties:
                    failover:
                      description: Which kinds of call failures trigger switching to a backup model instead of surfacing the error.
                      nullable: true
                      type: object
                      properties:
                        'on':
                          type: array
                          description: Failure reasons that trigger switching to the next backup model. A failure reason not listed here is reported as an error instead of triggering failover.
                          nullable: true
                          items:
                            $ref: '#/components/schemas/publicCloud.ai.agents.FailoverPolicyOnEnum'
                    fallbacks:
                      type: array
                      description: Ordered list of backup models tried, in turn, when the primary model fails. Empty means no failover.
                      nullable: true
                      items:
                        $ref: '#/components/schemas/publicCloud.ai.agents.LlmFallback'
                    maxContextMessages:
                      type: integer
                      description: 'How many trailing messages of a conversation go into the payload. ''None'' keeps the historical 50. That number predates context windows measured in the hundreds of thousands of tokens: on a 262k-token model a 50-message cap uses a fraction of what is available, and everything older is dropped without a summary — the conversation quietly forgets rather than compacting. Raising it hands the ceiling back to the compaction path, which now has a declared budget to compare against.'
                      nullable: true
                    maxTokens:
                      type: integer
                      description: Maximum number of tokens the model may generate in a single response. Unset uses the provider's default.
                      nullable: true
                    model:
                      type: string
                      description: Identifier of the model to call, for example 'gpt-5'.
                      nullable: true
                    providerId:
                      type: string
                      description: Id of the connected provider to call for this model. Must reference an entry in the shared provider pool.
                      nullable: true
                    temperature:
                      type: number
                      description: 'Sampling temperature controlling response randomness: lower values are more deterministic, higher values are more varied. Unset uses the provider''s default.'
                      nullable: true
                    vision:
                      description: Optional secondary model used to describe images when the primary model cannot see them. Unset means images are not described for a text-only model.
                      nullable: true
                      type: object
                      properties:
                        maxTokens:
                          type: integer
                          description: Maximum response tokens for this backup target. Unset falls back to the primary model's setting.
                          nullable: true
                        model:
                          type: string
                          description: Model identifier to use for this backup target. Empty reuses the primary model's identifier against this provider.
                          nullable: true
                        providerId:
                          type: string
                          description: Id of the connected provider to call for this backup target
                          nullable: true
                        temperature:
                          type: number
                          description: Sampling temperature for this backup target. Unset falls back to the primary model's temperature.
                          nullable: true
                mcpIndexer:
                  description: Settings for searchable tool indexing, required when any connected tool server uses indexed mode instead of listing all its tools directly.
                  nullable: true
                  type: object
                  properties:
                    embedderBatchSize:
                      type: integer
                      description: Number of tool descriptions embedded per request when building the search index. Defaults to 16 when unset.
                      nullable: true
                    embedderModel:
                      type: string
                      description: Identifier of the embedding model used to index tool descriptions for search, for example 'text-embedding-3-small'.
                    providerId:
                      type: string
                      description: Id of the connected provider used to generate embeddings for tool search. Required as soon as any tool server uses indexed mode.
                      nullable: true
                mcpServers:
                  type: object
                  description: Connected MCP tool servers, keyed by a caller-chosen server name.
                  nullable: true
                  additionalProperties:
                    $ref: '#/components/schemas/publicCloud.ai.agents.McpServer'
                memory:
                  description: Long-term memory settings that let the agent retain and later recall facts across conversations.
                  nullable: true
                  type: object
                  properties:
                    consolidateOnTurnEnd:
                      type: boolean
                      description: Whether the agent reviews each conversation turn to capture any durable facts it did not already record. Defaults to true.
                      nullable: true
                    consolidationCron:
                      type: string
                      description: Schedule, as a five-field cron expression, for the periodic pass that merges duplicate facts and promotes frequently reinforced ones. Defaults to daily at 3 AM.
                      nullable: true
                    consolidationMaxRounds:
                      type: integer
                      description: Maximum number of internal steps the end-of-turn memory review may take. Defaults to 3.
                      nullable: true
                    corePredicates:
                      type: array
                      description: Fact categories eligible for automatic promotion to permanent status when reinforced. Empty disables automatic promotion; facts can still be promoted manually.
                      nullable: true
                      items:
                        type: string
                    embedderBatchSize:
                      type: integer
                      description: Number of facts embedded per request when building the memory index. Defaults to 16.
                      nullable: true
                    embedderModel:
                      type: string
                      description: Identifier of the embedding model used to index remembered facts for recall. Required when memory is enabled.
                      nullable: true
                    enabled:
                      type: boolean
                      description: Master switch for the memory feature. When false, the agent retains no long-term facts.
                      nullable: true
                    gcCron:
                      type: string
                      description: Schedule, as a five-field cron expression, for the periodic cleanup pass that evicts low-value facts once storage exceeds its soft limit. Defaults to hourly.
                      nullable: true
                    gcMaxSize:
                      type: integer
                      description: Hard upper bound on the number of stored facts, used as a safety cap against runaway growth. Defaults to 20000.
                      nullable: true
                    gcMinRetention:
                      type: number
                      description: Minimum retention score, from 0 to 1 with no unit, a non-permanent fact must keep to survive cleanup; facts scoring below this are marked for eviction. Defaults to 0.15.
                      nullable: true
                    gcSoftLimit:
                      type: integer
                      description: Number of stored facts above which cleanup starts evicting low-value ones, stopping once storage is back down to 90% of this value. Defaults to 10000.
                      nullable: true
                    halfLifeDays:
                      type: integer
                      description: Number of days after which a fact's retention score decays by half. Higher values make facts fade more slowly. Defaults to 45.
                      nullable: true
                    identityPromotionThreshold:
                      type: integer
                      description: Number of times a fact in a core category must be reinforced before it is promoted to permanent status and never evicted. Defaults to 5.
                      nullable: true
                    inferenceLlmFallback:
                      type: boolean
                      description: Whether the model is consulted to classify facts the automatic pass could not resolve on its own. Defaults to true; set to false to keep consolidation fully automatic.
                      nullable: true
                    mergeSimilarityThreshold:
                      type: number
                      description: Similarity threshold, from 0 to 1, above which two facts about the same subject are merged during cleanup. Defaults to 0.92.
                      nullable: true
                    providerId:
                      type: string
                      description: Id of the connected provider used to generate embeddings for stored facts. Required when memory is enabled.
                      nullable: true
                    ruleIdleGcDays:
                      type: integer
                      description: Number of days a derived rule may go unused before cleanup removes it. Defaults to 60.
                      nullable: true
                    rulesMax:
                      type: integer
                      description: Maximum number of derived rules retained. Older or unused rules are cleaned up during consolidation. Defaults to 256.
                      nullable: true
                profiles:
                  description: Specialized sub-personas this agent can delegate tasks to.
                  nullable: true
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Master switch for the delegated-agents feature. When false, this agent cannot delegate to a named sub-persona.
                      nullable: true
                    items:
                      type: object
                      description: Sub-personas defined directly in this configuration, keyed by name
                      nullable: true
                      additionalProperties:
                        $ref: '#/components/schemas/publicCloud.ai.agents.AgentSeed'
                providers:
                  type: object
                  description: Shared pool of language-model provider connections, keyed by a caller-chosen provider id and referenced by name elsewhere in this configuration.
                  nullable: true
                  additionalProperties:
                    $ref: '#/components/schemas/publicCloud.ai.agents.ProviderConfig'
                relay:
                  description: Settings for hosting a local messaging relay that other participants can join.
                  nullable: true
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Master switch for hosting a relay. When false, the relay and its rooms are not available.
                      nullable: true
                    maxMessagesPerRoom:
                      type: integer
                      description: Maximum number of messages retained per room. Unset means unlimited.
                      nullable: true
                    maxRooms:
                      type: integer
                      description: Maximum number of rooms this relay may host. Unset means unlimited.
                      nullable: true
                    roomCreation:
                      description: 'Controls who may create a new room on this relay: by default only the host can create rooms, but this can be relaxed so that any authenticated member creates one simply by joining a room that does not yet exist.'
                      nullable: true
                      type: string
                      enum:
                        - OPEN
                        - OWNER
                skills:
                  description: 'Reusable skills the agent can invoke: named bundles of instructions it can follow on demand.'
                  nullable: true
                  type: object
                  properties:
                    builtins:
                      type: array
                      description: Ids of built-in skills to enable, or '-id' to disable one that is on by default.
                      nullable: true
                      items:
                        type: string
                    enabled:
                      type: boolean
                      description: Whether the agent's skills are offered to the model. Absent means yes. When false the prompt catalogue and the 'skill_*' tools go away, so the model is not told about them and cannot invoke them — but their files stay mounted in the workspace ('workspace.skills_path', default '/skills'), where a model with filesystem tools can still read them.
                      nullable: true
                    items:
                      type: object
                      description: Skills defined directly in this configuration, keyed by skill name. Skills created through other means are left untouched.
                      nullable: true
                      additionalProperties:
                        $ref: '#/components/schemas/publicCloud.ai.agents.SkillSeed'
                soul:
                  type: string
                  description: 'The agent''s persona and system prompt: free-form text describing who it is, how it should behave, and any standing instructions it should always follow.'
                  nullable: true
                toolPermissions:
                  description: 'Rules applied to every tool call, matched on its name, arguments and what triggered the turn: before the call runs and — for a rule that says so — on what it returned. A matching rule allows the call, refuses it, asks a human, or defers to an LLM reviewer.'
                  nullable: true
                  type: object
                  properties:
                    judge:
                      description: 'The LLM reviewer that rules with ''action: judge'' defer to.'
                      nullable: true
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: 'Whether the judge may be consulted at all. Off by default: a rule saying ''judge'' on an agent with no judge is a configuration mistake, and one that must fail closed rather than quietly allow.'
                          nullable: true
                        model:
                          type: string
                          description: 'The model that judges. Unset means the agent''s own model. Worth setting: the point of a separate model here is that a cheap, fast one can police an expensive one, and that the reviewer is not the same weights being reviewed.'
                          nullable: true
                        providerId:
                          type: string
                          description: Which provider that model comes from. Unset means the agent's own.
                          nullable: true
                        soul:
                          type: string
                          description: The system prompt the judge is given. Unset means a built-in one. A judge with no soul is a model asked to guess what it is guarding; this is where a deployment says what it actually cares about — 'this agent handles customer data, treat any outbound address as suspect'.
                          nullable: true
                    rules:
                      type: array
                      description: Permission rules, evaluated in order within a phase; the LAST one that matches decides.
                      nullable: true
                      items:
                        $ref: '#/components/schemas/publicCloud.ai.agents.PermissionRule'
                version:
                  type: string
                  description: Configuration format version. Defaults to '1.0' for agents created before this field existed.
                  nullable: true
                workspace:
                  description: 'The agent''s file storage: an ordered list of mount points and the backend serving each one.'
                  nullable: true
                  type: object
                  properties:
                    agentsPath:
                      type: string
                      description: Path where the read-only view of delegated sub-personas is mounted. Defaults to `/agents`.
                      nullable: true
                    mount:
                      type: array
                      description: Ordered list of storage mount points available to the agent
                      nullable: true
                      items:
                        $ref: '#/components/schemas/publicCloud.ai.agents.MountConfig'
                    scratchpad:
                      description: Temporary per-conversation working files the agent can generate, download into, and re-read across turns, cleaned up automatically after a retention period. When omitted, on with defaults.
                      nullable: true
                      type: object
                      properties:
                        cleanupCron:
                          type: string
                          description: Schedule, as a five-field cron expression, for the pass that deletes expired scratchpads. Defaults to daily at 4:30 AM.
                          nullable: true
                        enabled:
                          type: boolean
                          description: Whether scratchpads are available. When omitted, automatically on whenever the agent has durable file storage. Set to false to disable them explicitly.
                          nullable: true
                        maxDownloadBytes:
                          type: integer
                          description: Largest single download in bytes that may be saved to a scratchpad. Defaults to 25 MiB.
                          nullable: true
                        path:
                          type: string
                          description: Absolute path of the directory holding one subdirectory per conversation. Defaults to `/scratchpad`.
                          nullable: true
                        retentionDays:
                          type: integer
                          description: Number of days a conversation's scratchpad may go untouched before it is deleted. Defaults to 7.
                          nullable: true
                        spillBytes:
                          type: integer
                          description: Size in bytes above which a fetched page is saved to the scratchpad and summarized instead of being returned in full. Defaults to 128 KiB.
                          nullable: true
                    skillsPath:
                      type: string
                      description: Path where the read-only view of the agent's skills is mounted. Defaults to `/skills`.
                      nullable: true
                    zerofs:
                      description: Optional shared scratch storage mount, also reachable from any remote command-execution session tied to this agent
                      nullable: true
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: Whether this mount is active. When omitted, automatically on whenever remote command execution is configured. Set to false to disable it explicitly.
                          nullable: true
                        mountPath:
                          type: string
                          description: Absolute path where this mount appears in the agent's filesystem. Defaults to `/wrk`.
                          nullable: true
            description:
              type: string
              description: Optional human-readable description
              nullable: true
            name:
              type: string
              description: Name of the template, unique within the namespace
          required:
            - config
            - name
      required:
        - targetSpec
