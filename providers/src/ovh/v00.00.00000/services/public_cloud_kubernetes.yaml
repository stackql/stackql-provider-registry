              nullable: true
            maxNodes:
              type: integer
              description: Maximum number of nodes the autoscaler provisions
              nullable: true
            minNodes:
              type: integer
              description: Minimum number of nodes the autoscaler maintains. Lower bound of desiredNodes.
              nullable: true
