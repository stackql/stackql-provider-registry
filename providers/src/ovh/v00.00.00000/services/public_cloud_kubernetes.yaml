                    clusterId:
                      type: integer
                      description: ClusterMesh cluster identifier, between 1 and 255
                      nullable: true
                    clusterMesh:
                      description: ClusterMesh multi-cluster connectivity configuration
                      nullable: true
                      type: object
                      properties:
                        apiServer:
