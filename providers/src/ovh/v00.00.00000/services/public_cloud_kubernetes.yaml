        desiredNodes:
          type: integer
          description: Observed desired number of nodes in the nodepool
          nullable: true
          readOnly: true
        name:
          type: string
          description: Observed nodepool name
          nullable: true
          readOnly: true
        nodeConfig:
          description: Observed hardware configuration of the nodepool nodes
          nullable: true
          readOnly: true
