  /managedKubernetes/{managedKubernetesId}/capabilities/version:
    get:
      operationId: getKubernetesClusterVersions
      summary: Get the versions of a managed Kubernetes cluster
      description: Returns the full version deployed on the cluster, the patch versions of the current minor it can update to, and the versions of the next minor it can upgrade to. Multi-minor jumps are never returned. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: managedKubernetesId
          description: Managed kubernetes ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.managedKubernetes.ClusterVersions'
              examples:
                Example:
                  value:
                    availableUpdates:
                      - status: SUPPORTED
                        version: 1.32.8-2
                    availableUpgrades:
                      - status: SUPPORTED
                        version: 1.33.1-2
                    currentVersion: 1.32.8-1
                  summary: Deployed version, available patch updates, and available minor upgrades.
      tags:
