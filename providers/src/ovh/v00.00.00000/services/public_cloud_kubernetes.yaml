openapi: 3.0.0
info:
  title: OVHcloud Public Cloud Managed Kubernetes (v2) API
  description: Managed Kubernetes and Managed Rancher Service of a Public Cloud project through API v2.
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/publicCloud
paths:
  /managedKubernetes:
    get:
      operationId: getAllKubernetesClusters
      summary: List managed Kubernetes clusters
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllKubernetesClustersResponse'
          headers:
            X-Pagination-Elements:
              description: Total number of elements available for pagination
              schema:
                type: integer
                format: int64
      tags:
        - Managed Kubernetes Service
      x-developer-hub-navigation:
        - - Public Cloud
          - Container
          - Managed Kubernetes Service
          - Clusters@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:managedKubernetes/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudManagedKubernetesCluster
      description: List managed Kubernetes clusters (Beta version)
    post:
      operationId: createKubernetesCluster
      summary: Create a managed Kubernetes cluster
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.managedKubernetes.ClusterCreation'
            examples:
              Create a FREE cluster on a private network:
                value:
                  targetSpec:
                    cni:
                      type: CANAL
                    name: my-free-private-cluster
                    network:
                      type: VRACK
                      vrack:
                        privateNetworkId: 00000000-0000-0000-0000-000000000000
                        subnetId: 00000000-0000-0000-0000-000000000000
                    plan: FREE
                    region: GRA11
                summary: Request body for a cluster on the FREE plan, with its nodes on a vRack private network. The private network and the subnet must exist in the target region.
              Create a FREE cluster on the public network:
                value:
                  targetSpec:
                    cni:
                      type: CANAL
                    name: my-free-cluster
                    network:
                      type: PUBLIC
                    plan: FREE
                    region: GRA11
                summary: Request body for a cluster on the FREE plan, with its nodes on the public network. The FREE plan requires the CANAL CNI.
              Create a STANDARD cluster on a private network:
                value:
                  targetSpec:
                    cni:
                      type: CILIUM
                    name: my-standard-private-cluster
                    network:
                      type: VRACK
                      vrack:
                        privateNetworkId: 00000000-0000-0000-0000-000000000000
                        subnetId: 00000000-0000-0000-0000-000000000000
                    plan: STANDARD
                    region: EU-WEST-PAR
                summary: Request body for a cluster on the STANDARD plan, with its nodes on a vRack private network. The STANDARD plan requires the CILIUM CNI.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.managedKubernetes.Cluster'
      tags:
        - Managed Kubernetes Service
      x-developer-hub-navigation:
        - - Public Cloud
          - Container
          - Managed Kubernetes Service
          - Clusters@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:managedKubernetes/create
          required: true
      description: Create a managed Kubernetes cluster (Beta version)
