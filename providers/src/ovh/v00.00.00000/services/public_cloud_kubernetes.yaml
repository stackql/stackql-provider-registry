  /managedKubernetes/{managedKubernetesId}/nodepool/{nodePoolId}/node:
    get:
      operationId: getAllKubernetesNodepoolNodes
      summary: List nodes of a managed Kubernetes cluster nodepool
      description: Deleted nodes kept in retention are excluded unless includeDeleted is true. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: includeDeleted
          description: Include deleted nodes still kept in retention
          schema:
            type: boolean
        - in: path
          name: managedKubernetesId
          description: Managed kubernetes ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: nodePoolId
          description: Node pool ID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: resourceStatus
          description: Return only the nodes in this lifecycle status. Filtering on DELETED requires includeDeleted set to true, otherwise the request returns 400.
          schema:
            $ref: '#/components/schemas/publicCloud.managedKubernetes.NodeResourceStatusEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllKubernetesNodepoolNodesResponse'
          headers:
            X-Pagination-Elements:
              description: Total number of elements available for pagination
              schema:
                type: integer
                format: int64
      tags:
