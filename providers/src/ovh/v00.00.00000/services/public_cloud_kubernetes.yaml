                                      nullable: true
                                    memory:
                                      type: string
                                      description: Memory resource quantity, for example 128Mi or 1Gi
                                      nullable: true
                                requests:
                                  description: Minimum compute resources guaranteed
                                  nullable: true
                                  type: object
                                  properties:
                                    cpu:
                                      type: string
                                      description: CPU resource quantity, for example 250m or 1
                                      nullable: true
                                    memory:
                                      type: string
                                      description: Memory resource quantity, for example 128Mi or 1Gi
                                      nullable: true
                            enabled:
                              type: boolean
                              description: Whether the Hubble UI is enabled
                              nullable: true
                            frontendResources:
                              description: Compute resource requirements of the Hubble UI frontend
                              nullable: true
                              type: object
                              properties:
                                limits:
                                  description: Maximum compute resources allowed
                                  nullable: true
                                  type: object
                                  properties:
                                    cpu:
                                      type: string
                                      description: CPU resource quantity, for example 250m or 1
                                      nullable: true
                                    memory:
                                      type: string
                                      description: Memory resource quantity, for example 128Mi or 1Gi
                                      nullable: true
                                requests:
                                  description: Minimum compute resources guaranteed
                                  nullable: true
                                  type: object
                                  properties:
                                    cpu:
                                      type: string
                                      description: CPU resource quantity, for example 250m or 1
                                      nullable: true
                                    memory:
                                      type: string
                                      description: Memory resource quantity, for example 128Mi or 1Gi
                                      nullable: true
            name:
              type: string
              description: Cluster name. Not an identifier. Can be changed after creation.
            network:
