              properties:
                canal:
                  description: Mutable Canal settings. Present on the FREE plan. The kube-proxy mode is immutable.
                  nullable: true
                  type: object
                  properties:
                    kubeProxy:
                      description: Mutable kube-proxy settings
                      nullable: true
                      type: object
                      properties:
                        iptables:
                          description: iptables mode payload. Provided when the cluster runs in IPTABLES mode. Must be absent otherwise.
                          nullable: true
                          type: object
                          properties:
                            minSyncPeriod:
                              type: string
                              description: The minimum period that iptables rules are refreshed, in RFC3339 duration format, for example `PT60S`
                              nullable: true
                              format: duration
                            syncPeriod:
                              type: string
                              description: The period that iptables rules are refreshed, in RFC3339 duration format, for example `PT60S`. Must be greater than 0.
                              nullable: true
                              format: duration
                        ipvs:
                          description: IPVS mode payload. Provided when the cluster runs in IPVS mode. Must be absent otherwise.
                          nullable: true
                          type: object
                          properties:
                            minSyncPeriod:
                              type: string
                              description: The minimum period that ipvs rules are refreshed in RFC3339 duration format, for example `PT60S`
                              nullable: true
                              format: duration
                            scheduler:
                              description: IPVS scheduling algorithm
                              nullable: true
                              type: string
                              enum:
                                - DESTINATION_HASHING
                                - LEAST_CONNECTION
                                - NEVER_QUEUE
                                - ROUND_ROBIN
                                - SHORTEST_EXPECTED_DELAY
                                - SOURCE_HASHING
                            syncPeriod:
                              type: string
                              description: The period that ipvs rules are refreshed in RFC3339 duration format, for example `PT60S`. Must be greater than 0.
                              nullable: true
                              format: duration
                            tcpFinTimeout:
                              type: string
                              description: The timeout value used for IPVS TCP sessions after receiving a FIN in RFC3339 duration format, for example `PT60S`. Defaults to `PT0S`, which preserves the current timeout value on the system.
                              nullable: true
                              format: duration
                            tcpTimeout:
                              type: string
                              description: The timeout value used for idle IPVS TCP sessions in RFC3339 duration format, for example `PT60S`. Defaults to `PT0S`, which preserves the current timeout value on the system. Cannot be set between `PT0S` and `PT5S`, in order to prevent in-cluster networking issues.
                              nullable: true
                              format: duration
                            udpTimeout:
                              type: string
                              description: The timeout value used for IPVS UDP packets in RFC3339 duration format, for example `PT60S`. Defaults to `PT0S`, which preserves the current timeout value on the system.
                              nullable: true
                              format: duration
                cilium:
                  description: Mutable Cilium settings. Present on the STANDARD plan.
                  nullable: true
                  type: object
