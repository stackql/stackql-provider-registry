    publicCloud.managedKubernetes.TaintEffectEnum:
      type: string
      description: Effect a taint has on pods that do not tolerate it. NoSchedule blocks scheduling new pods. PreferNoSchedule avoids scheduling when possible. NoExecute also evicts running pods that do not tolerate it. Refer to the Kubernetes documentation to get more information.
      enum:
        - NoExecute
        - NoSchedule
        - PreferNoSchedule
    publicCloud.managedKubernetes.KubeProxyIpvsSchedulerEnum:
      type: string
      description: Algorithm IPVS uses to pick the backend pod for a new connection. ROUND_ROBIN cycles through backends. LEAST_CONNECTION picks the backend with the fewest active connections. SHORTEST_EXPECTED_DELAY and NEVER_QUEUE weight the choice on expected latency. DESTINATION_HASHING and SOURCE_HASHING pin a connection to a backend based on the destination or source address.
      enum:
        - DESTINATION_HASHING
        - LEAST_CONNECTION
        - NEVER_QUEUE
        - ROUND_ROBIN
        - SHORTEST_EXPECTED_DELAY
        - SOURCE_HASHING
