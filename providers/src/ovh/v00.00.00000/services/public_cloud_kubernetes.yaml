components:
  schemas:
    publicCloud.managedKubernetes.Cluster:
      type: object
      description: A managed Kubernetes cluster
      properties:
        checksum:
          type: string
          description: Concurrency control hash of the target specification
          readOnly: true
        createdAt:
          type: string
          description: Cluster creation timestamp
          format: date-time
          readOnly: true
        currentState:
          description: Actual cluster state
          readOnly: true
          type: object
          properties:
            apiServer:
              description: 'Observed API server state: configuration and resolved control-plane URL'
              nullable: true
              readOnly: true
              type: object
              properties:
                access:
                  description: Observed exposure and IP filtering of the API server
                  nullable: true
                  readOnly: true
                  type: object
                  properties:
                    authorizedIps:
                      description: Observed IP allowlist for the API server
                      nullable: true
                      readOnly: true
                      type: object
                      properties:
                        rules:
                          type: array
                          description: Authorization rules for the API server
                          nullable: true
                          items:
                            $ref: '#/components/schemas/publicCloud.managedKubernetes.AuthorizedIpRule'
                    publicEndpoint:
                      description: Observed public endpoint of the API server
                      nullable: true
                      readOnly: true
                      type: object
                      properties:
                        url:
                          type: string
                          description: URL of the control plane, available once the cluster is ready
                          nullable: true
                          readOnly: true
                admissionPlugins:
                  type: object
                  description: Observed admission plugin configurations
                  nullable: true
                  additionalProperties:
                    $ref: '#/components/schemas/publicCloud.managedKubernetes.AdmissionPlugin'
                  readOnly: true
            authentication:
              description: Observed control-plane authentication state
              nullable: true
              readOnly: true
              type: object
              properties:
                oidc:
                  description: Observed OpenID Connect configuration, present when type is OIDC
                  nullable: true
                  readOnly: true
                  type: object
                  properties:
                    caContent:
                      type: string
                      description: CA certificate of the OIDC provider, PEM-encoded
                      nullable: true
                      readOnly: true
                    clientId:
                      type: string
                      description: Identifier of the OIDC client
                      nullable: true
                      readOnly: true
                    groupsClaim:
                      type: array
                      description: JWT claims used as Kubernetes groups
                      nullable: true
                      items:
                        type: string
                      readOnly: true
                    groupsPrefix:
                      type: string
                      description: Prefix prepended to group claims
                      nullable: true
                      readOnly: true
                    issuerUrl:
                      type: string
                      description: OIDC issuer URL
                      nullable: true
                      readOnly: true
                    requiredClaim:
                      type: array
                      description: Claims that must be present in the JWT token
                      nullable: true
                      items:
                        type: string
                      readOnly: true
                    signingAlgs:
                      type: array
                      description: Accepted signing algorithms for OIDC tokens
                      nullable: true
                      items:
                        $ref: '#/components/schemas/publicCloud.managedKubernetes.OidcSigningAlgEnum'
                      readOnly: true
                    usernameClaim:
                      type: string
                      description: JWT claim used as the Kubernetes username
                      nullable: true
                      readOnly: true
                    usernamePrefix:
                      type: string
                      description: Prefix prepended to username claims
                      nullable: true
                      readOnly: true
                type:
                  description: Observed active authentication variant
                  nullable: true
                  readOnly: true
                  type: string
                  enum:
                    - OIDC
            autoUpgrade:
              description: Observed automatic Kubernetes version upgrade policy
              nullable: true
              readOnly: true
              type: object
              properties:
                patch:
                  description: Automatic upgrade track for patch versions, for example 1.34.1-1 to 1.34.2-1. Enabled by default.
                  nullable: true
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Whether automatic upgrade is enabled for this track
                      nullable: true
            cni:
              description: Observed Container Network Interface plugin and its settings
              nullable: true
              readOnly: true
              type: object
              properties:
                canal:
                  description: Canal payload, valid only on the FREE plan. Present when type is CANAL, absent otherwise.
                  nullable: true
                  type: object
                  properties:
                    kubeProxy:
                      description: kube-proxy configuration
                      nullable: true
                      type: object
                      properties:
                        iptables:
                          description: iptables mode payload. Provided when mode is IPTABLES. Must be absent otherwise.
                          nullable: true
                          type: object
                          properties:
                            minSyncPeriod:
                              type: string
                              description: The minimum period that iptables rules are refreshed, in RFC3339 duration format, for example `PT60S`
                              nullable: true
                              format: duration
                            syncPeriod:
                              type: string
                              description: The period that iptables rules are refreshed, in RFC3339 duration format, for example `PT60S`. Must be greater than 0.
                              nullable: true
                              format: duration
                        ipvs:
                          description: IPVS mode payload. Provided when mode is IPVS. Must be absent otherwise.
                          nullable: true
                          type: object
                          properties:
                            minSyncPeriod:
                              type: string
                              description: The minimum period that ipvs rules are refreshed in RFC3339 duration format, for example `PT60S`
                              nullable: true
                              format: duration
                            scheduler:
                              description: IPVS scheduling algorithm
                              nullable: true
                              type: string
                              enum:
                                - DESTINATION_HASHING
                                - LEAST_CONNECTION
                                - NEVER_QUEUE
                                - ROUND_ROBIN
                                - SHORTEST_EXPECTED_DELAY
                                - SOURCE_HASHING
                            syncPeriod:
                              type: string
                              description: The period that ipvs rules are refreshed in RFC3339 duration format, for example `PT60S`. Must be greater than 0.
                              nullable: true
                              format: duration
                            tcpFinTimeout:
                              type: string
                              description: The timeout value used for IPVS TCP sessions after receiving a FIN in RFC3339 duration format, for example `PT60S`. Defaults to `PT0S`, which preserves the current timeout value on the system.
                              nullable: true
                              format: duration
                            tcpTimeout:
                              type: string
                              description: The timeout value used for idle IPVS TCP sessions in RFC3339 duration format, for example `PT60S`. Defaults to `PT0S`, which preserves the current timeout value on the system. Cannot be set between `PT0S` and `PT5S`, in order to prevent in-cluster networking issues.
                              nullable: true
                              format: duration
                            udpTimeout:
                              type: string
                              description: The timeout value used for IPVS UDP packets in RFC3339 duration format, for example `PT60S`. Defaults to `PT0S`, which preserves the current timeout value on the system.
                              nullable: true
                              format: duration
                        mode:
                          description: Selected kube-proxy mode. Immutable after creation.
                          type: string
                          enum:
                            - IPTABLES
                            - IPVS
                      required:
                        - mode
                cilium:
                  description: Cilium payload, valid only on the STANDARD plan. Present when type is CILIUM, absent otherwise.
                  nullable: true
                  type: object
                  properties:
                    clusterId:
                      type: integer
                      description: ClusterMesh cluster identifier, between 1 and 255
                      nullable: true
                    clusterMesh:
                      description: ClusterMesh multi-cluster connectivity configuration
                      nullable: true
                      type: object
                      properties:
                        apiServer:
                          description: ClusterMesh API server exposure settings
                          nullable: true
                          type: object
                          properties:
                            nodePort:
                              type: integer
                              description: Node port exposing the ClusterMesh API server
                              nullable: true
                            serviceType:
                              description: Kubernetes service type exposing the ClusterMesh API server
                              nullable: true
                              type: string
                              enum:
                                - LoadBalancer
                                - NodePort
                        enabled:
                          type: boolean
                          description: Whether ClusterMesh is enabled
                          nullable: true
                    hubble:
                      description: Hubble observability configuration
                      nullable: true
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: Whether Hubble observability is enabled
                          nullable: true
                        relay:
                          description: Hubble relay configuration
                          nullable: true
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              description: Whether the Hubble relay is enabled
                              nullable: true
                        ui:
                          description: Hubble UI configuration
                          nullable: true
                          type: object
                          properties:
                            backendResources:
                              description: Compute resource requirements of the Hubble UI backend
                              nullable: true
                              type: object
                              properties:
                                limits:
                                  description: Maximum compute resources allowed
                                  nullable: true
                                  type: object
                                  properties:
                                    cpu:
                                      type: string
                                      description: CPU resource quantity, for example 250m or 1
                                      nullable: true
                                    memory:
                                      type: string
                                      description: Memory resource quantity, for example 128Mi or 1Gi
                                      nullable: true
                                requests:
                                  description: Minimum compute resources guaranteed
                                  nullable: true
                                  type: object
                                  properties:
                                    cpu:
                                      type: string
                                      description: CPU resource quantity, for example 250m or 1
                                      nullable: true
                                    memory:
                                      type: string
                                      description: Memory resource quantity, for example 128Mi or 1Gi
                                      nullable: true
                            enabled:
                              type: boolean
                              description: Whether the Hubble UI is enabled
                              nullable: true
                            frontendResources:
                              description: Compute resource requirements of the Hubble UI frontend
                              nullable: true
                              type: object
                              properties:
                                limits:
                                  description: Maximum compute resources allowed
                                  nullable: true
                                  type: object
                                  properties:
                                    cpu:
                                      type: string
                                      description: CPU resource quantity, for example 250m or 1
                                      nullable: true
                                    memory:
                                      type: string
                                      description: Memory resource quantity, for example 128Mi or 1Gi
                                      nullable: true
                                requests:
                                  description: Minimum compute resources guaranteed
                                  nullable: true
                                  type: object
                                  properties:
                                    cpu:
                                      type: string
                                      description: CPU resource quantity, for example 250m or 1
                                      nullable: true
                                    memory:
                                      type: string
                                      description: Memory resource quantity, for example 128Mi or 1Gi
                                      nullable: true
                type:
                  description: Selected CNI variant
                  type: string
                  enum:
                    - CANAL
                    - CILIUM
              required:
                - type
            deployedVersion:
              type: string
              description: Full Kubernetes version currently deployed on the cluster, for example 1.34.1-2
              nullable: true
              readOnly: true
            ipAllocationPolicy:
              description: Observed internal pod and service CIDRs allocated by the backend, including any applied platform defaults
              nullable: true
              readOnly: true
              type: object
              properties:
                pods:
                  description: IPv4 CIDR block allocated for pod networking, for example 10.0.0.0/16. Immutable after creation. A non-IPv4, invalid or overlapping CIDR is rejected with 400.
                  nullable: true
                  type: string
                  format: ipv4-block
                  example: 192.0.2.0/24
                services:
                  description: IPv4 CIDR block allocated for service networking, for example 10.96.0.0/12. Immutable after creation. A non-IPv4, invalid or overlapping CIDR is rejected with 400.
                  nullable: true
                  type: string
                  format: ipv4-block
                  example: 192.0.2.0/24
            name:
              type: string
              description: Observed cluster name
              nullable: true
              readOnly: true
            network:
              description: Observed network topology and resolved network identifiers
              nullable: true
              readOnly: true
              type: object
              properties:
                type:
                  description: Selected network topology variant
                  type: string
                  enum:
                    - PUBLIC
                    - VRACK
                vrack:
                  description: Private network (vRack) payload. Required when type is VRACK. Must be absent otherwise.
                  nullable: true
                  type: object
                  properties:
                    defaultEgress:
                      description: Default egress route for the cluster nodes. Defaults is MANAGED_GATEWAY for STANDARD plan, NODE_PUBLIC_INTERFACE for FREE plan.
                      nullable: true
                      type: object
                      properties:
                        type:
                          description: Default egress route type for the cluster nodes
                          type: string
                          enum:
                            - MANAGED_GATEWAY
                            - NODE_PUBLIC_INTERFACE
                            - USER_GATEWAY
                        userGateway:
                          description: User-provided egress gateway. Required if and only if type is USER_GATEWAY.
                          nullable: true
                          type: object
                          properties:
                            ip:
                              description: IP address of the user-provided egress gateway
                              type: string
                              format: ipv4
                              example: 192.0.2.0
                          required:
                            - ip
                      required:
                        - type
                    loadBalancerSubnetId:
                      type: string
                      description: Subnet identifier used by load balancers. Immutable after creation.
                      nullable: true
                      format: uuid
                    privateNetworkId:
                      type: string
                      description: Identifier of the target private network. Immutable after creation.
                      format: uuid
                    subnetId:
                      type: string
                      description: Subnet identifier used by cluster nodes. Immutable after creation.
                      format: uuid
                  required:
                    - privateNetworkId
                    - subnetId
              required:
                - type
            plan:
              description: Observed platform tier (FREE or STANDARD)
              nullable: true
              readOnly: true
              type: string
              enum:
                - FREE
                - STANDARD
            region:
              type: string
              description: Observed deployment region identifier
              nullable: true
              readOnly: true
            version:
              type: string
