                  nullable: true
                minNodes:
                  type: integer
                  description: Minimum number of nodes the autoscaler maintains. Lower bound of desiredNodes.
                  nullable: true
                scaleDown:
                  description: Thresholds governing when the autoscaler removes underused nodes
                  nullable: true
