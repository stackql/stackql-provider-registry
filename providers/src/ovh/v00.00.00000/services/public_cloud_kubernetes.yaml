    publicCloud.managedKubernetes.Cni:
      type: object
      description: Container Network Interface plugin. FREE requires CANAL, STANDARD requires CILIUM. A mismatch is rejected with 400. The variant and the Canal kube-proxy mode are immutable after creation. Other internal settings stay mutable.
      properties:
        canal:
          description: Canal payload, valid only on the FREE plan. Present when type is CANAL, absent otherwise.
          nullable: true
          type: object
          properties:
            kubeProxy:
              description: kube-proxy configuration
              nullable: true
              type: object
              properties:
                iptables:
                  description: iptables mode payload. Provided when mode is IPTABLES. Must be absent otherwise.
                  nullable: true
                  type: object
                  properties:
                    minSyncPeriod:
                      type: string
                      description: The minimum period that iptables rules are refreshed, in RFC3339 duration format, for example `PT60S`
                      nullable: true
                      format: duration
                    syncPeriod:
                      type: string
                      description: The period that iptables rules are refreshed, in RFC3339 duration format, for example `PT60S`. Must be greater than 0.
                      nullable: true
                      format: duration
                ipvs:
                  description: IPVS mode payload. Provided when mode is IPVS. Must be absent otherwise.
                  nullable: true
                  type: object
                  properties:
                    minSyncPeriod:
                      type: string
                      description: The minimum period that ipvs rules are refreshed in RFC3339 duration format, for example `PT60S`
                      nullable: true
                      format: duration
                    scheduler:
                      description: IPVS scheduling algorithm
                      nullable: true
                      type: string
                      enum:
                        - DESTINATION_HASHING
                        - LEAST_CONNECTION
                        - NEVER_QUEUE
                        - ROUND_ROBIN
                        - SHORTEST_EXPECTED_DELAY
                        - SOURCE_HASHING
                    syncPeriod:
                      type: string
                      description: The period that ipvs rules are refreshed in RFC3339 duration format, for example `PT60S`. Must be greater than 0.
                      nullable: true
                      format: duration
                    tcpFinTimeout:
                      type: string
                      description: The timeout value used for IPVS TCP sessions after receiving a FIN in RFC3339 duration format, for example `PT60S`. Defaults to `PT0S`, which preserves the current timeout value on the system.
                      nullable: true
                      format: duration
                    tcpTimeout:
                      type: string
                      description: The timeout value used for idle IPVS TCP sessions in RFC3339 duration format, for example `PT60S`. Defaults to `PT0S`, which preserves the current timeout value on the system. Cannot be set between `PT0S` and `PT5S`, in order to prevent in-cluster networking issues.
                      nullable: true
                      format: duration
                    udpTimeout:
                      type: string
                      description: The timeout value used for IPVS UDP packets in RFC3339 duration format, for example `PT60S`. Defaults to `PT0S`, which preserves the current timeout value on the system.
                      nullable: true
                      format: duration
                mode:
                  description: Selected kube-proxy mode. Immutable after creation.
                  type: string
                  enum:
                    - IPTABLES
                    - IPVS
              required:
                - mode
        cilium:
          description: Cilium payload, valid only on the STANDARD plan. Present when type is CILIUM, absent otherwise.
          nullable: true
          type: object
          properties:
