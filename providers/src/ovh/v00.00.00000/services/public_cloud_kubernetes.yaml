          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudManagedKubernetesNode
  /managedKubernetes/{managedKubernetesId}/nodepool/{nodePoolId}/node/{nodeId}:
    get:
      operationId: getKubernetesNodepoolNode
      summary: Get a node of a managed Kubernetes cluster nodepool
      description: A deleted node kept in retention is returned with resourceStatus DELETED until it expires, after which the call returns 404. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: managedKubernetesId
          description: Managed kubernetes ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: nodeId
          description: Node ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: nodePoolId
          description: Node pool ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.managedKubernetes.Node'
              examples:
                Deleted node in retention:
                  value:
                    createdAt: '2026-08-02T10:11:00Z'
                    currentState:
                      deletedAt: '2026-09-05T08:22:45Z'
