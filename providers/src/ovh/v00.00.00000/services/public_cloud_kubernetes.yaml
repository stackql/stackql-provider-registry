                  description: Minimum number of nodes the autoscaler maintains. Lower bound of desiredNodes.
                  nullable: true
                scaleDown:
                  description: Thresholds governing when the autoscaler removes underused nodes
                  nullable: true
                  type: object
                  properties:
                    unneededTimeSeconds:
                      type: integer
                      description: Time in seconds a node must stay below the utilization threshold before it is removed
                      nullable: true
                    unreadyTimeSeconds:
                      type: integer
                      description: Time in seconds an unready node is kept before it is removed
                      nullable: true
                    utilizationThreshold:
                      type: number
                      description: Node utilization ratio below which a node becomes a scale-down candidate, as a fraction between 0 and 1. Defaults to 0.5.
                      nullable: true
            availabilityZone:
              type: string
              description: Availability zone the nodepool nodes are placed in. Immutable after creation.
              nullable: true
            billingType:
              description: Billing period applied to the nodepool nodes. Immutable after creation.
              nullable: true
              type: string
              enum:
