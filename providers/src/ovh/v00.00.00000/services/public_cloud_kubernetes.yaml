                format: int64
      tags:
        - Managed Kubernetes Service
      x-developer-hub-navigation:
        - - Public Cloud
          - Container
          - Managed Kubernetes Service
          - Node Pools@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:managedKubernetes/nodepool/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudManagedKubernetesNodepool
      description: List nodepools of a managed Kubernetes cluster (Beta version)
    post:
      operationId: createKubernetesNodepool
      summary: Create a nodepool in a managed Kubernetes cluster
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: managedKubernetesId
          description: Managed kubernetes ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.managedKubernetes.NodepoolCreation'
            examples:
              Create a dedicated nodepool with labels and taints:
                value:
                  targetSpec:
                    desiredNodes: 2
                    name: my-gpu-nodepool
                    nodeConfig:
                      flavor: t2-45
                    template:
                      metadata:
                        labels:
                          workload: gpu
                      spec:
                        taints:
                          - effect: NoSchedule
                            key: workload
                            value: gpu
                summary: 'Request body for a nodepool reserved to specific workloads: its nodes carry a label to select them and a taint that keeps away the pods not tolerating it.'
              Create a fixed-size nodepool:
                value:
                  targetSpec:
                    desiredNodes: 3
                    name: my-nodepool
                    nodeConfig:
                      flavor: b3-8
                summary: Request body for a nodepool with a fixed number of nodes. Only the node count and the flavor are required.
              Create a monthly-billed nodepool with anti-affinity:
                value:
                  targetSpec:
                    antiAffinity:
                      enabled: true
                      policy: HARD
                    billingType: MONTHLY
                    desiredNodes: 3
                    name: my-monthly-nodepool
                    nodeConfig:
                      flavor: b2-7
                summary: Request body for a nodepool billed monthly, with its nodes spread across distinct hypervisors. Both settings are immutable after creation, and anti-affinity caps the nodepool size.
              Create a nodepool in an availability zone:
                value:
                  targetSpec:
                    availabilityZone: eu-west-par-a
                    desiredNodes: 3
                    name: my-nodepool-zone-a
                    nodeConfig:
                      flavor: b3-8
                summary: Request body for a nodepool placed in one availability zone of a 3-AZ region. Create one nodepool per zone to spread the nodes across the region.
              Create an autoscaled nodepool:
                value:
                  targetSpec:
                    autoscaler:
                      enabled: true
                      maxNodes: 10
                      minNodes: 2
                    desiredNodes: 2
                    name: my-autoscaled-nodepool
                    nodeConfig:
                      flavor: b3-8
                summary: Request body for a nodepool whose node count varies between minNodes and maxNodes with the cluster load. desiredNodes must be at least minNodes.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.managedKubernetes.Nodepool'
      tags:
        - Managed Kubernetes Service
      x-developer-hub-navigation:
        - - Public Cloud
          - Container
          - Managed Kubernetes Service
          - Node Pools@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:managedKubernetes/nodepool/create
          required: true
      description: Create a nodepool in a managed Kubernetes cluster (Beta version)
