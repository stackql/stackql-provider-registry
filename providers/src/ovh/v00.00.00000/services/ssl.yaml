openapi: 3.0.0
info:
  title: OVHcloud SSL Certificates API
  description: SSL certificates and their tasks.
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/ssl
paths:
  /ssl:
    get:
      summary: List SSL certificates
      description: Returns the identifiers of the SSL certificates of the account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_sslResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - SSL certificates
          - Services@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ssl:apiovh:get
          required: true
      x-expanded-response: SslCertificateWithIAM
      operationId: get_v1_ssl
  /ssl/{serviceName}:
    get:
      summary: Get an SSL certificate
      description: 'Returns an SSL certificate: status, type (DV, OV or EV), issuing authority, common name, alternative names, validity dates, and the certificate and its issuer chain once issued.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ssl.CertificateWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - SSL certificates
          - Services@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ssl:apiovh:get
          required: true
      operationId: get_v1_ssl_service_name
  /ssl/{serviceName}/serviceInfos:
    get:
      summary: Get subscription
      description: 'Returns the subscription of an SSL certificate: creation and expiration dates, and contacts.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.Service'
      x-developer-hub-navigation:
        - - Web Cloud
          - SSL certificates
          - Subscription@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ssl:apiovh:serviceInfos/get
          required: true
      operationId: get_v1_ssl_service_name_service_infos
    put:
      summary: Update subscription
      description: Updates the subscription of an SSL certificate. Certificates are not renewed automatically.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/services.Service'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - SSL certificates
          - Subscription@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ssl:apiovh:serviceInfos/edit
          required: true
      operationId: put_v1_ssl_service_name_service_infos
  /ssl/{serviceName}/tasks:
    get:
      summary: List tasks
      description: Returns the identifiers of the tasks of an SSL certificate.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_ssl_service_name_tasksResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - SSL certificates
          - Operations@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ssl:apiovh:tasks/get
          required: true
      x-expanded-response: SslOperation
      operationId: get_v1_ssl_service_name_tasks
  /ssl/{serviceName}/tasks/{taskId}:
    get:
      summary: Get a task
      description: 'Returns a task of an SSL certificate: function, status (todo, doing, done, error or cancelled), and creation, update and completion dates.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceName
          description: Service name
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          description: Task ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ssl.Operation'
      x-developer-hub-navigation:
        - - Web Cloud
          - SSL certificates
          - Operations@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: ssl:apiovh:tasks/get
          required: true
      operationId: get_v1_ssl_service_name_tasks_task_id
components:
  schemas:
    iam.resource.TagFilter:
      type: object
      description: Resource tag filter
      properties:
        operator:
          description: Operator to use in order to filter on the value (defaults to 'EQ')
          nullable: true
          readOnly: true
          type: string
          enum:
            - EQ
            - EXISTS
            - ILIKE
            - LIKE
            - NEQ
            - NEXISTS
        value:
          type: string
          description: Value to use in order to filter tags
          readOnly: true
    ssl.CertificateWithIAM:
      type: object
      description: Certificate of an SSL customer
      properties:
        authority:
          description: The authority your certificate is issued from
          readOnly: true
          type: string
          enum:
            - comodo
            - sectigo
        certificate:
          type: string
          description: Your certificate
          nullable: true
          readOnly: true
        chain:
          type: string
          description: The issuer chain of your certificate
          nullable: true
          readOnly: true
        commonName:
          type: string
          description: The CN field in your certificate
          readOnly: true
        csr:
          type: string
          description: The CSR used to create your certificate
          readOnly: true
        iam:
          description: IAM resource metadata
          nullable: true
          readOnly: true
          type: object
          properties:
            displayName:
              type: string
              description: Resource display name
              nullable: true
              readOnly: true
            id:
              type: string
              description: Unique identifier of the resource
              format: uuid
              readOnly: true
            state:
              description: Resource state
              nullable: true
              readOnly: true
              type: string
              enum:
                - EXPIRED
                - IN_CREATION
                - OK
                - SUSPENDED
            tags:
              type: object
              description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
              nullable: true
              additionalProperties:
                type: string
              readOnly: true
            urn:
              type: string
              description: Unique resource name used in policies
              readOnly: true
        serviceName:
          type: string
          description: The internal name of your certificate offer
          readOnly: true
        status:
          description: Current status of your certificate
          readOnly: true
          type: string
          enum:
            - creating
            - error
            - ok
            - validating
        subjectAltName:
          type: array
          description: The SAN field for multidomain certificate
          items:
            type: string
          readOnly: true
        type:
          description: Type of your certificate
          readOnly: true
          type: string
          enum:
            - DV
            - EV
            - OV
        validityEnd:
          type: string
          description: Your certificate is invalid from this date
          nullable: true
          format: date-time
          readOnly: true
        validityStart:
          type: string
          description: Your certificate is valid from this date
          nullable: true
          format: date-time
          readOnly: true
    services.Service:
      type: object
      description: Details about a Service
      properties:
        canDeleteAtExpiration:
          type: boolean
          description: Indicates that the service can be set up to be deleted at expiration
          readOnly: true
        contactAdmin:
          type: string
          readOnly: true
        contactBilling:
          type: string
          readOnly: true
        contactTech:
          type: string
          readOnly: true
        creation:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          readOnly: true
        engagedUpTo:
          type: string
          nullable: true
          format: date
          readOnly: true
        expiration:
          type: string
          format: date
          readOnly: true
        possibleRenewPeriod:
          type: array
          description: All the possible renew period of your service in month
          nullable: true
          items:
            type: integer
          readOnly: true
        renew:
          description: Way of handling the renew
          nullable: true
          type: object
          properties:
            automatic:
              type: boolean
              description: The service is automatically renewed
            deleteAtExpiration:
              type: boolean
              description: The service will be deleted at expiration
            forced:
              type: boolean
              description: The service forced to be renewed
            manualPayment:
              type: boolean
              description: The service needs to be manually renewed and paid
              nullable: true
            period:
              type: integer
              description: period of renew in month
              nullable: true
        renewalType:
          readOnly: true
          type: string
          description: Detailed renewal type of a service
          enum:
            - automaticForcedProduct
            - automaticV2012
            - automaticV2014
            - automaticV2016
            - manual
            - oneShot
            - option
        serviceId:
          type: integer
          readOnly: true
        status:
          readOnly: true
          type: string
          description: service.StateEnum
          enum:
            - autorenewInProgress
            - expired
            - inCreation
            - ok
            - pendingDebt
            - unPaid
    ssl.Operation:
      type: object
      description: Task on a SSL
      properties:
        doneDate:
          type: string
          description: Completion date
          nullable: true
          format: date-time
          readOnly: true
        function:
          description: Task function name
          readOnly: true
          type: string
          enum:
            - acme_order_certificate
            - sectigo_deliver_certificate
            - sectigo_deliver_certificate_from_api
            - sectigo_order_certificate
        lastUpdate:
          type: string
          description: Task last update
          format: date-time
          readOnly: true
        startDate:
          type: string
          description: Task Creation date
          format: date-time
          readOnly: true
        status:
          description: Task status
          readOnly: true
          type: string
          enum:
            - cancelled
            - doing
            - done
            - error
            - todo
        taskId:
          type: integer
          description: Task Id
          readOnly: true
    iam.resource.TagFilter.OperatorEnum:
      type: string
      description: Operator that can be used in order to filter resources tags
      enum:
        - EQ
        - EXISTS
        - ILIKE
        - LIKE
        - NEQ
        - NEXISTS
    ssl.CertificateAuthorityEnum:
      type: string
      description: All authorities from which an SSL certificate can be issued
      enum:
        - comodo
        - sectigo
    iam.ResourceMetadata:
      type: object
      description: IAM resource metadata embedded in services models
      properties:
        displayName:
          type: string
          description: Resource display name
          nullable: true
          readOnly: true
        id:
          type: string
          description: Unique identifier of the resource
          format: uuid
          readOnly: true
        state:
          description: Resource state
          nullable: true
          readOnly: true
          type: string
          enum:
            - EXPIRED
            - IN_CREATION
            - OK
            - SUSPENDED
        tags:
          type: object
          description: 'Resource tags. Tags that were internally computed are prefixed with ovh:'
          nullable: true
          additionalProperties:
            type: string
          readOnly: true
        urn:
          type: string
          description: Unique resource name used in policies
          readOnly: true
    ssl.CertificateStatusEnum:
      type: string
      description: All statuses an SSL certificate can be in
      enum:
        - creating
        - error
        - ok
        - validating
    ssl.CertificateTypeEnum:
      type: string
      description: All types an SSL certificate can be
      enum:
        - DV
        - EV
        - OV
    service.RenewType:
      type: object
      description: Map a possible renew for a specific service
      properties:
        automatic:
          type: boolean
          description: The service is automatically renewed
        deleteAtExpiration:
          type: boolean
          description: The service will be deleted at expiration
        forced:
          type: boolean
          description: The service forced to be renewed
        manualPayment:
          type: boolean
          description: The service needs to be manually renewed and paid
          nullable: true
        period:
          type: integer
          description: period of renew in month
          nullable: true
    service.RenewalTypeEnum:
      type: string
      description: Detailed renewal type of a service
      enum:
        - automaticForcedProduct
        - automaticV2012
        - automaticV2014
        - automaticV2016
        - manual
        - oneShot
        - option
    service.StateEnum:
      type: string
      description: service.StateEnum
      enum:
        - autorenewInProgress
        - expired
        - inCreation
        - ok
        - pendingDebt
        - unPaid
    ssl.OperationFunctionEnum:
      type: string
      description: All functions an SSL operation can handle
      enum:
        - acme_order_certificate
        - sectigo_deliver_certificate
        - sectigo_deliver_certificate_from_api
        - sectigo_order_certificate
    ssl.OperationStatusEnum:
      type: string
      description: All statuses an SSL operation can be in
      enum:
        - cancelled
        - doing
        - done
        - error
        - todo
    iam.ResourceMetadata.StateEnum:
      type: string
      description: Resource state
      enum:
        - EXPIRED
        - IN_CREATION
        - OK
        - SUSPENDED
    Get_v1_sslResponse:
      type: object
      properties:
        v1_ssl:
          type: array
          items:
            $ref: '#/components/schemas/ssl.CertificateWithIAM'
    Get_v1_ssl_service_name_tasksResponse:
      type: object
      properties:
        v1_ssl_service_name_tasks:
          type: array
          items:
            $ref: '#/components/schemas/ssl.Operation'
  x-stackQL-resources:
    certificates:
      id: ovh.ssl.certificates
      name: certificates
      title: Certificates
      methods:
        list:
          operation:
            $ref: '#/paths/~1ssl/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_ssl
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/Get_v1_sslResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_ssl\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1ssl~1{serviceName}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/certificates/methods/get'
          - $ref: '#/components/x-stackQL-resources/certificates/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    service_infos:
      id: ovh.ssl.service_infos
      name: service_infos
      title: Service Infos
      methods:
        get:
          operation:
            $ref: '#/paths/~1ssl~1{serviceName}~1serviceInfos/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1ssl~1{serviceName}~1serviceInfos/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/service_infos/methods/get'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/service_infos/methods/update'
        delete: []
        replace: []
    tasks:
      id: ovh.ssl.tasks
      name: tasks
      title: Tasks
      methods:
        list:
          operation:
            $ref: '#/paths/~1ssl~1{serviceName}~1tasks/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.v1_ssl_service_name_tasks
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/Get_v1_ssl_service_name_tasksResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"v1_ssl_service_name_tasks\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1ssl~1{serviceName}~1tasks~1{taskId}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/tasks/methods/get'
          - $ref: '#/components/x-stackQL-resources/tasks/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://{api_host}/v1
    variables:
      api_host:
        description: The OVHcloud API host. Selected by OVH_ENDPOINT (ovh-eu, ovh-ca or ovh-us; default ovh-eu).
        default: api.eu.ovhcloud.com
        x-stackQL-envVarSelector:
          envVar: OVH_ENDPOINT
          default: ovh-eu
          values:
            ovh-eu: api.eu.ovhcloud.com
            ovh-ca: api.ca.ovhcloud.com
            ovh-us: api.us.ovhcloud.com
