        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: packName
          description: The internal name of your pack
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  description: Domain action
                  $ref: '#/components/schemas/pack.xdsl.DomainActionEnum'
                authInfo:
                  type: string
                  description: Needed for transfer from another registrar
                domain:
                  type: string
                  description: Domain name
                tld:
                  type: string
                  description: TLD of the domain
              required:
                - action
                - domain
                - tld
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pack.xdsl.Task'
      x-developer-hub-navigation:
