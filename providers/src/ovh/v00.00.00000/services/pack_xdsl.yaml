openapi: 3.0.0
info:
  title: OVHcloud xDSL Packs API
  description: xDSL packs and the services they bundle (domains, email, hosted email, VoIP lines, ...).
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/pack/xdsl
paths:
  /pack/xdsl:
    get:
      summary: List xDSL packs
      description: List xDSL packs. Returns the names of the xDSL packs of the account. Each name is the packName used by the other pack calls.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_pack_xdslResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Pack
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: packXdsl:apiovh:get
          required: true
      x-expanded-response: PackXdslPackAdslWithIAM
      operationId: get_v1_pack_xdsl
  /pack/xdsl/{packName}:
    get:
      summary: Get an xDSL pack
      description: Get an xDSL pack. Returns the pack name, its offer description and price, the customer description and the pack capabilities.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: packName
          description: The internal name of your pack
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pack.xdsl.PackAdslWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Pack
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: packXdsl:apiovh:get
          required: true
      operationId: get_v1_pack_xdsl_pack_name
    put:
      summary: Update an xDSL pack
      description: 'Update an xDSL pack. Changes the settings that can be modified: the customer description of the pack.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: packName
          description: The internal name of your pack
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pack.xdsl.PackAdsl'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Pack
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: packXdsl:apiovh:put
          required: true
      operationId: put_v1_pack_xdsl_pack_name
  /pack/xdsl/{packName}/addressMove/moveOffer:
    post:
      summary: Move an xDSL pack to another address
      description: Move an xDSL pack to another address. Starts the move to the new address with the chosen offer, modem, installation details and services to keep or delete. Returns an asynchronous task.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: packName
          description: The internal name of your pack
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acceptContracts:
                  type: boolean
                  description: You explicitly accept the terms of the contract corresponding to your new offer
                building:
                  type: string
                  description: Building identifier, "null" if no identifier is available
                buildingReference:
                  type: string
                  description: Building reference for FTTH and FTTE offers
                contactPhone:
                  type: string
                  description: Customer contact phone number
                door:
                  type: string
                  description: Door identifier, "null" if no identifier is available
                eligibilityReference:
                  type: string
                  description: Eligibility reference
                engageMonths:
                  type: integer
                  description: Number of months of re-engagement
                floor:
                  type: string
                  description: Floor identifier, "null" if no identifier is available
                installationType:
                  description: Installation type, only on FTTH technology
                  $ref: '#/components/schemas/connectivity.eligibility.InstallationTypeEnum'
                keepCurrentNumber:
                  type: boolean
                  description: Whether or not the current number should be kept
                meeting:
                  description: Data to book a meeting slot
                  $ref: '#/components/schemas/xdsl.eligibility.BookMeetingSlot'
                modem:
                  description: Modem option chosen for the new offer
                  $ref: '#/components/schemas/pack.xdsl.ModemOptionEnum'
                mondialRelayId:
                  type: integer
                  description: Mondial relay ID if a shipping is needed
                moveOutDate:
                  type: string
                  description: The date when the customer is no longer at the current address. Must be between now and +30 days. The default date will be the one in 30 days from now.
                  format: date-time
                nicShipping:
                  type: string
                  description: nicShipping if a shipping is needed
                offerName:
                  type: string
                  description: Reference of the new offer
                ontShippingContact:
                  type: string
                  description: Allows you to personalize a delivery address for the ONT. If empty, the address will be that of the installation
                options:
                  type: array
                  description: Options wanted in the new offer
                  items:
                    $ref: '#/components/schemas/pack.xdsl.migration.OfferOption'
                otp:
                  type: boolean
                  description: Whether an Optical Termination Point (OTP) is already installed at the address
                otpReference:
                  type: string
                  description: Reference of the Optical Termination Point
                productCode:
                  type: string
                  description: Product code, an unique identifier for the product from addressMove/offer
                residence:
                  type: string
                  description: Residence identifier, "null" if no identifier is available
                stair:
                  type: string
                  description: Stair identifier, "null" if no identifier is available
                subServicesToDelete:
                  type: array
                  description: List of domains of services to delete if needed
                  items:
                    $ref: '#/components/schemas/pack.xdsl.migration.OfferServiceToDelete'
                subServicesToKeep:
                  type: array
                  description: List of domains of services to keep if needed
                  items:
                    $ref: '#/components/schemas/pack.xdsl.migration.OfferServiceToKeep'
              required:
                - acceptContracts
                - eligibilityReference
                - keepCurrentNumber
                - modem
                - offerName
                - otp
                - productCode
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pack.xdsl.AsyncTask_long'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Pack
          - Order & Installation@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: packXdsl:apiovh:addressMove/moveOffer
          required: true
      operationId: post_v1_pack_xdsl_pack_name_address_move_move_offer
  /pack/xdsl/{packName}/addressMove/offers:
    post:
      summary: Search the address move offers of an xDSL pack
      description: Search the address move offers of an xDSL pack. Returns, as an asynchronous task, the offers available at the new address for the given eligibility reference.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: packName
          description: The internal name of your pack
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eligibilityReference:
                  type: string
                  description: Eligibility reference
              required:
                - eligibilityReference
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pack.xdsl.AsyncTask_pack.xdsl.addressMove.MoveOfferResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Pack
          - Order & Installation@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: packXdsl:apiovh:addressMove/offers/create
          required: true
      operationId: post_v1_pack_xdsl_pack_name_address_move_offers
  /pack/xdsl/{packName}/addressMove/servicesToDeleteUnpackTerms:
    post:
      summary: List the services to delete to move an xDSL pack
      description: List the services to delete to move an xDSL pack. Returns, by service type, the number of services to delete and their unpack terms for the offer at the new address.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: packName
          description: The internal name of your pack
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eligibilityReference:
                  type: string
                  description: Eligibility reference
                offerName:
                  type: string
                  description: Reference of the new offer
                options:
                  type: array
                  description: Options wanted in the new offer
                  items:
                    $ref: '#/components/schemas/pack.xdsl.migration.OfferOption'
              required:
                - eligibilityReference
                - offerName
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post_v1_pack_xdsl_pack_name_address_move_services_to_delete_unpack_termsResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Internet
          - Pack
          - Order & Installation@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: packXdsl:apiovh:addressMove/servicesToDeleteUnpackTerms/create
          required: true
      operationId: post_v1_pack_xdsl_pack_name_address_move_services_to_delete_unpack_terms
  /pack/xdsl/{packName}/canCancelResiliation:
    get:
      summary: Get whether a pack resiliation can be canceled
      description: Get whether a pack resiliation can be canceled. Returns whether the ongoing resiliation of the xDSL pack can still be canceled.
      security:
