      operationId: get_v1_pack_xdsl_pack_name_can_cancel_resiliation
      x-stackQL-scalarWrap:
        column: value
        type: boolean
  /pack/xdsl/{packName}/cancelResiliation:
    post:
      summary: Cancel the resiliation of an xDSL pack
      description: Cancel the resiliation of an xDSL pack. Cancels the ongoing resiliation of the pack. Check first that it can be canceled with canCancelResiliation.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: packName
          description: The internal name of your pack
          required: true
