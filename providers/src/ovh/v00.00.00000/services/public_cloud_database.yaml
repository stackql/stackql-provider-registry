openapi: 3.0.0
info:
  title: OVHcloud Public Cloud Databases (v2) API
  description: Managed databases of a Public Cloud project through API v2 (MySQL, PostgreSQL, MongoDB, Valkey).
  version: '1.0'
  x-stackQL-apiVersion: v2
  x-stackQL-specFamily: v2/publicCloud
paths:
  /managedDatabase/availability:
    get:
      operationId: getManagedDatabaseAvailabilities
      summary: List Databases availabilities
      description: Returns the combinations of Databases engine, version, plan and region that can be ordered, with their specifications. Use clusterId with action and target to get the options available for an existing service, for example the plans it can be updated to. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: action
          description: Filter availabilities by action type
          schema:
            $ref: '#/components/schemas/publicCloud.database.availability.ActionEnum'
        - in: query
          name: clusterId
          description: Restrict availabilities to a specific cluster
          schema:
            type: string
            format: uuid
        - in: query
          name: target
          description: Filter availabilities by target type
          schema:
            $ref: '#/components/schemas/publicCloud.database.availability.TargetEnum'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedDatabaseAvailabilitiesResponse'
      tags:
        - Managed Databases
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Databases
        - - Public Cloud
          - Databases
          - Service references@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/availability/get
          required: true
  /managedDatabase/availability/suggestion:
    get:
      operationId: getManagedDatabaseAvailabilitySuggestions
      summary: List Databases availability suggestions
      description: Returns suggested combinations of Databases engine, version, plan, flavor and region. The default suggestion is marked. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedDatabaseAvailabilitySuggestionsResponse'
      tags:
        - Managed Databases
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Databases
        - - Public Cloud
          - Databases
          - Service references@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/availability/get
          required: true
  /managedDatabase/backup:
    get:
      operationId: getAllManagedDatabaseBackups
      summary: List backups
      description: Returns the backups of all database services of the project, across engines. Filter them by service with the serviceId parameter. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: serviceId
          description: Filter backups by service identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllManagedDatabaseBackupsResponse'
      tags:
        - Managed Databases
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - Valkey
          - Backups@@@10
        - - Public Cloud
          - Databases
          - MongoDB
          - Backups@@@10
        - - Public Cloud
          - Databases
          - MySQL
          - Backups@@@10
        - - Public Cloud
          - Databases
          - PostgreSQL
          - Backups@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/backup/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudDatabaseBackup
  /managedDatabase/backup/{backupId}:
    get:
      operationId: getManagedDatabaseBackup
      summary: Get a backup
      description: Returns the backup type, size, status and storage regions, and the date until which point-in-time recovery is available. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: backupId
          description: Backup ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Backup'
      tags:
        - Managed Databases
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - Valkey
          - Backups@@@20
        - - Public Cloud
          - Databases
          - MongoDB
          - Backups@@@20
        - - Public Cloud
          - Databases
          - MySQL
          - Backups@@@20
        - - Public Cloud
          - Databases
          - PostgreSQL
          - Backups@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/backup/get
          required: true
      x-response-identifier: id
  /managedDatabase/capabilities/disks:
    get:
      operationId: getManagedDatabaseDisks
      summary: List Databases disk types
      description: Returns the disk types available for Databases services, with their IOPS and throughput specifications. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedDatabaseDisksResponse'
      tags:
        - Managed Databases
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Databases
        - - Public Cloud
          - Databases
          - Service references@@@70
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/capabilities/get
          required: true
  /managedDatabase/capabilities/engines:
    get:
      operationId: getManagedDatabaseEngines
      summary: List Databases engines
      description: Returns the available Databases engines with their versions, default version and supported TLS modes. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedDatabaseEnginesResponse'
      tags:
        - Managed Databases
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Databases
        - - Public Cloud
          - Databases
          - Service references@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/capabilities/get
          required: true
  /managedDatabase/capabilities/flavors:
    get:
      operationId: getManagedDatabaseFlavors
      summary: List Databases flavors
      description: Returns the compute flavors available for Databases services, with their technical specifications and lifecycle. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedDatabaseFlavorsResponse'
      tags:
        - Managed Databases
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Databases
        - - Public Cloud
          - Databases
          - Service references@@@60
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/capabilities/get
          required: true
  /managedDatabase/capabilities/options:
    get:
      operationId: getManagedDatabaseOptions
      summary: List Databases options
      description: Returns the options available for Databases services and their data type. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedDatabaseOptionsResponse'
      tags:
        - Managed Databases
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Databases
        - - Public Cloud
          - Databases
          - Service references@@@80
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/capabilities/get
          required: true
  /managedDatabase/capabilities/plans:
    get:
      operationId: getManagedDatabasePlans
      summary: List Databases plans
      description: Returns the plans available for Databases services, with their description and automatic backup retention. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedDatabasePlansResponse'
      tags:
        - Managed Databases
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Databases
        - - Public Cloud
          - Databases
          - Service references@@@50
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/capabilities/get
          required: true
  /managedDatabase/capabilities/regions:
    get:
      operationId: getManagedDatabaseRegions
      summary: List Databases regions
      description: Returns the regions available for Databases services, with their type and lifecycle. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagedDatabaseRegionsResponse'
      tags:
        - Managed Databases
        - Capabilities & availability
      x-developer-hub-navigation:
        - - Public Cloud
          - Project Management
          - Service references
          - Databases
        - - Public Cloud
          - Databases
          - Service references@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/capabilities/get
          required: true
  /managedDatabase/mongodb:
    get:
      operationId: getAllMongodbServices
      summary: List MongoDB services
      description: Returns the MongoDB services of the project. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllMongodbServicesResponse'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudDatabaseService
    post:
      operationId: createMongodbService
      summary: Create a MongoDB service
      description: 'Creates a MongoDB service from a plan, a flavor and an engine version. Creation is asynchronous: follow resourceStatus until READY. Set forkSourceServiceId to create it from a backup of another service. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.database.ServiceCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Service'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB@@@30
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/create
          required: true
  /managedDatabase/mongodb/{serviceId}:
    delete:
      operationId: deleteMongodbService
      summary: Delete a MongoDB service
      description: Deletes the service. A service with deletion protection enabled cannot be deleted. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Service'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/delete
          required: true
    get:
      operationId: getMongodbService
      summary: Get a MongoDB service
      description: Returns the target specification of the service, its current state and its running tasks. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Service'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/get
          required: true
      x-response-identifier: id
    patch:
      operationId: updateMongodbService
      summary: Partially update a MongoDB service
      description: Partially updates the target specification of the service, for example its plan, flavor, version or number of nodes. Omitted fields keep their current value. A new target specification is accepted only in READY status. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.database.ServiceUpdate'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Service'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB@@@60
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/edit
          required: true
    put:
      operationId: editMongodbService
      summary: Update a MongoDB service
      description: 'Updates the target specification of the service, for example its plan, flavor, version or number of nodes. Every field is required: the request describes the whole configuration. A new target specification is accepted only in READY status. (Beta version)'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.database.ServiceReplace'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.database.Service'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB@@@50
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/edit
          required: true
  /managedDatabase/mongodb/{serviceId}/log/kind:
    get:
      operationId: getAllMongodbLogKinds
      summary: List log kinds
      description: Returns the names of the log kinds MongoDB emits, which can be forwarded to a stream. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllMongodbLogKindsResponse'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB
          - Observability@@@10
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/log/kind/get
          required: true
      x-expanded-response: DbaasLogsLogKind
  /managedDatabase/mongodb/{serviceId}/log/kind/{name}:
    get:
      operationId: getMongodbLogKind
      summary: Get a log kind
      description: Returns a log kind and the additional fields its logs carry. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: name
          description: Name
          required: true
          schema:
            type: string
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogKind'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB
          - Observability@@@40
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/log/kind/get
          required: true
      x-response-identifier: name
  /managedDatabase/mongodb/{serviceId}/log/subscription:
    get:
      operationId: getAllMongodbLogSubscriptions
      summary: List log subscriptions
      description: Returns the identifiers of the MongoDB log subscriptions. Set `kind` to restrict the list to one log kind. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: kind
          description: Filter subscriptions by log kind
          schema:
            $ref: '#/components/schemas/publicCloud.database.KindEnum'
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllMongodbLogSubscriptionsResponse'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB
          - Observability@@@20
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/log/subscription/get
          required: true
      x-expanded-response: DbaasLogsLogSubscription
    post:
      operationId: createMongodbLogSubscription
      summary: Create a log subscription
      description: Forwards MongoDB logs of one kind to a Logs Data Platform stream. The subscription is created asynchronously and the response returns the operation identifier. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dbaas.logs.LogSubscriptionCreation'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscriptionResponse'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB
          - Observability@@@80
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/log/subscription/create
          required: true
  /managedDatabase/mongodb/{serviceId}/log/subscription/{subscriptionId}:
    delete:
      operationId: deleteMongodbLogSubscription
      summary: Delete a log subscription
      description: Deletes the subscription and stops forwarding MongoDB logs to the stream. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: subscriptionId
          description: Subscription ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dbaas.logs.LogSubscriptionResponse'
      tags:
        - Managed Databases
        - MongoDB
      x-developer-hub-navigation:
        - - Public Cloud
          - Databases
          - MongoDB
          - Observability@@@110
      x-badges:
        - color: blue
          label: Beta version
      x-iam-actions:
        - name: publicCloudProject:apiovh:database/mongodb/log/subscription/delete
          required: true
    get:
      operationId: getMongodbLogSubscription
      summary: Get a log subscription
      description: Returns the log kind and the destination stream of a subscription. (Beta version)
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: serviceId
          description: Service ID
          required: true
          schema:
            type: string
            format: uuid
