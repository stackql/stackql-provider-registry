components:
  schemas:
    publicCloud.database.availability.ActionEnum:
      type: string
      description: Action type to filter availabilities
      enum:
        - FORK
        - READ
        - UPDATE
    publicCloud.database.availability.TargetEnum:
      type: string
      description: Target type to filter availabilities
      enum:
        - FLAVOR
        - PLAN
        - SELF
        - VERSION
    publicCloud.database.Availability:
      type: object
      description: Availability of a database engine configuration
      properties:
        backups:
          description: Backup strategy for this availability
          readOnly: true
          type: object
          properties:
            available:
              type: boolean
              description: Whether backups are available for this offer
              readOnly: true
            retentionDays:
              type: integer
              description: Number of retention days for the backups
              nullable: true
              readOnly: true
        category:
          description: Category of the engine (database or analytics)
          readOnly: true
          type: string
          enum:
            - ANALYTICS
            - DATABASE
        default:
          type: boolean
          description: Whether this availability can be used by default
          readOnly: true
        engine:
          description: Database engine name
          readOnly: true
          type: string
          enum:
            - CLICKHOUSE
            - GRAFANA
            - KAFKA
            - KAFKA_CONNECT
            - KAFKA_MIRROR_MAKER
            - MONGODB
            - MYSQL
            - OPENSEARCH
            - POSTGRESQL
            - VALKEY
        lifecycle:
          description: Lifecycle information
          readOnly: true
          type: object
          properties:
            endOfLifeAt:
              type: string
              description: End of life date
              nullable: true
              format: date
              readOnly: true
            endOfSaleAt:
              type: string
              description: End of sale date
              nullable: true
              format: date
              readOnly: true
            startedAt:
              type: string
              description: Release date
              format: date
              readOnly: true
            status:
              description: Current status
              readOnly: true
              type: string
              enum:
                - BETA
                - DEPRECATED
                - END_OF_LIFE
                - END_OF_SALE
                - STABLE
                - UNAVAILABLE
        plan:
          type: string
          description: Plan name
          readOnly: true
        planCode:
          type: string
          description: Billing plan code
          readOnly: true
        planCodeStorage:
          type: string
          description: Billing plan code for storage
          nullable: true
          readOnly: true
        region:
          description: Region name
          readOnly: true
          type: string
          enum:
            - af-north-lz-rba
            - ap-south-mum
            - ap-southeast-sgp
            - ap-southeast-syd
            - ca-east-bhs
            - ca-east-tor
            - eu-central-lz-buh
            - eu-central-lz-prg
            - eu-central-lz-sof
            - eu-central-waw
            - eu-north-lz-cph
            - eu-north-lz-hel
            - eu-north-lz-osl
            - eu-north-lz-sto
            - eu-south-lz-lis
            - eu-south-lz-mad
            - eu-south-lz-mil
            - eu-south-mil
            - eu-west-eri
            - eu-west-gra
            - eu-west-gra-snc
            - eu-west-lim
            - eu-west-lz-ams
            - eu-west-lz-bru
            - eu-west-lz-dln
            - eu-west-lz-lux
            - eu-west-lz-mnc
            - eu-west-lz-mrs
            - eu-west-lz-vie
            - eu-west-lz-zrh
            - eu-west-par
            - eu-west-rbx
            - eu-west-rbx-snc
            - eu-west-sbg
            - eu-west-sbg-snc
            - us-central-lz-slc
            - us-central-lz-stl
            - us-east-lz-atl
            - us-east-lz-bos
            - us-east-lz-chi
            - us-east-lz-dal
            - us-east-lz-mia
            - us-east-lz-nyc
            - us-east-vin
            - us-west-hil
            - us-west-lz-den
            - us-west-lz-lax
            - us-west-lz-pao
            - us-west-lz-phx
            - us-west-lz-sea
        specifications:
          description: Technical specifications
          readOnly: true
          type: object
          properties:
            flavor:
              type: string
              description: Flavor name
              readOnly: true
            network:
              description: Type of network (public or private)
              readOnly: true
              type: string
              enum:
                - PRIVATE
                - PUBLIC
            nodes:
              description: Node count specifications
              readOnly: true
              type: object
              properties:
                maximum:
                  type: integer
                  description: Maximum number of nodes
                  readOnly: true
                minimum:
                  type: integer
                  description: Minimum number of nodes
                  readOnly: true
            storage:
              description: Storage specifications
              nullable: true
              readOnly: true
              type: object
              properties:
