    publicCloud.database.valkey.User:
      type: object
      description: A user account on a managed Valkey service
      properties:
        admin:
          type: boolean
          description: Whether this is the service administrator, the user created automatically at provisioning time, which cannot be deleted
          readOnly: true
        categories:
          type: array
          description: Command category rules granted to the user, each written as a category name prefixed with `+@` when it is allowed or `-@` when it is denied, for example `+@read`, `-@dangerous`
          items:
            type: string
          readOnly: true
        channels:
          type: array
          description: Glob patterns of the Pub/Sub channels the user can subscribe to and publish on, for example `news:*`, `chat:room1`. `*` means every channel, and an empty list means the user cannot use any channel.
          items:
            type: string
          readOnly: true
        checksum:
          type: string
          description: Hash of the resource used for concurrency control
          readOnly: true
        commands:
          type: array
          description: Individual command rules refining the permissions granted through the categories, each written as a Valkey command name prefixed with `+` when it is allowed or `-` when it is denied, for example `+get`, `-flushall`
          items:
            type: string
          readOnly: true
        createdAt:
          type: string
          description: Date at which the user was created
          format: date-time
          readOnly: true
        credentialsLastUpdatedAt:
          type: string
          description: Date at which the user credentials were last updated
          format: date-time
          readOnly: true
        id:
          type: string
          description: Unique identifier of the user
          format: uuid
          readOnly: true
        keys:
          type: array
          description: Glob patterns of the keys the user can access, for example `cache:*`, `session:user:42`. `*` means every key, and an empty list means the user cannot access any key.
          items:
            type: string
          readOnly: true
        password:
          type: string
          description: Password of the user. Returned only on creation or password reset.
          nullable: true
          format: password
          readOnly: true
        status:
          description: Current readiness status of the user
          readOnly: true
          type: string
          enum:
            - CREATING
            - DELETING
            - ERROR
            - READY
            - UPDATING
        username:
          type: string
          description: Login name of the user
          readOnly: true
    publicCloud.database.valkey.UserCreation:
      type: object
      description: Input parameters for creating a user on a managed Valkey service
      properties:
        categories:
          type: array
          description: Command category rules granted to the user, each written as a category name prefixed with `+@` to allow it or `-@` to deny it, for example `+@read`, `-@dangerous`. Available categories are all, admin, bitmap, blocking, connection, dangerous, fast, geo, hash, hyperloglog, keyspace, list, pubsub, read, scripting, set, slow, sortedset, stream, string, transaction and write.
          items:
            type: string
        channels:
          type: array
          description: Glob patterns of the Pub/Sub channels the user can subscribe to and publish on, for example `news:*`, `chat:room1`. Use `*` to allow every channel. When the list is empty, the user cannot use any channel.
          items:
            type: string
        commands:
          type: array
          description: Individual command rules that refine the permissions granted through the categories, each written as a Valkey command name in lowercase prefixed with `+` to allow it or `-` to deny it, for example `+get`, `-flushall`
          items:
            type: string
        keys:
          type: array
          description: Glob patterns of the keys the user can access, for example `cache:*`, `session:user:42`. Use `*` to allow every key. When the list is empty, the user cannot access any key.
          items:
            type: string
        name:
          type: string
          description: Login name of the new user, unique on the service. It must be 1 to 32 characters long, start with a letter, a digit or an underscore, and contain only letters, digits, underscores, dots and hyphens.
      required:
        - name
    publicCloud.database.valkey.UserUpdate:
      type: object
      description: Input parameters for updating a Valkey user
      properties:
        categories:
          type: array
          description: Command category rules granted to the user, each written as a category name prefixed with `+@` to allow it or `-@` to deny it, for example `+@read`, `-@dangerous`. Available categories are all, admin, bitmap, blocking, connection, dangerous, fast, geo, hash, hyperloglog, keyspace, list, pubsub, read, scripting, set, slow, sortedset, stream, string, transaction and write. The list replaces the one currently set on the user.
          items:
            type: string
        channels:
          type: array
          description: Glob patterns of the Pub/Sub channels the user can subscribe to and publish on, for example `news:*`, `chat:room1`. Use `*` to allow every channel. The list replaces the one currently set on the user, and an empty list revokes access to every channel.
          items:
            type: string
        commands:
          type: array
          description: Individual command rules that refine the permissions granted through the categories, each written as a Valkey command name in lowercase prefixed with `+` to allow it or `-` to deny it, for example `+get`, `-flushall`. The list replaces the one currently set on the user.
          items:
            type: string
        credentialsLastUpdatedAt:
          type: string
          description: Date at which the user credentials were last updated. Setting this field triggers a credential reset and returns the new password.
          format: date-time
        keys:
          type: array
          description: Glob patterns of the keys the user can access, for example `cache:*`, `session:user:42`. Use `*` to allow every key. The list replaces the one currently set on the user, and an empty list revokes access to every key.
          items:
            type: string
    publicCloud.database.valkey.UserReplace:
      type: object
      description: 'Input parameters for replacing a Valkey user. Every field is required: the request describes the whole user.'
      properties:
        categories:
          type: array
          description: Command category rules granted to the user, each written as a category name prefixed with `+@` to allow it or `-@` to deny it, for example `+@read`, `-@dangerous`. Available categories are all, admin, bitmap, blocking, connection, dangerous, fast, geo, hash, hyperloglog, keyspace, list, pubsub, read, scripting, set, slow, sortedset, stream, string, transaction and write. The list replaces the one currently set on the user.
          items:
            type: string
        channels:
          type: array
          description: Glob patterns of the Pub/Sub channels the user can subscribe to and publish on, for example `news:*`, `chat:room1`. Use `*` to allow every channel. The list replaces the one currently set on the user, and an empty list revokes access to every channel.
          items:
            type: string
        commands:
          type: array
          description: Individual command rules that refine the permissions granted through the categories, each written as a Valkey command name in lowercase prefixed with `+` to allow it or `-` to deny it, for example `+get`, `-flushall`. The list replaces the one currently set on the user.
          items:
            type: string
        keys:
          type: array
          description: Glob patterns of the keys the user can access, for example `cache:*`, `session:user:42`. Use `*` to allow every key. The list replaces the one currently set on the user, and an empty list revokes access to every key.
          items:
            type: string
      required:
        - categories
