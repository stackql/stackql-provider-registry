              description: Optional source to create the file storage from. Immutable after creation. When omitted, an empty file storage is created.
              nullable: true
              type: object
              properties:
                snapshotId:
                  type: string
                  description: Identifier of a file storage snapshot of the same project to create the file storage from. The snapshot must be available, otherwise the request is rejected with a 409, and must be in the region set in `location.region`. The file storage type and encryption are taken from the snapshot's source file storage.
                  format: uuid
              required:
                - snapshotId
            description:
              type: string
              description: Description of the file storage
              nullable: true
