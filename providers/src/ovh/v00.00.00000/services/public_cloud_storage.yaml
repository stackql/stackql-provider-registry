          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:volume/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudBlockStorageBlock
    post:
      operationId: createVolume
      summary: Create a volume
      description: Creates a volume, blank or from a backup, a snapshot or an image. `volumeType` is required for a blank volume or one created from an image. The source and the encryption can only be set at creation.
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.blockStorage.BlockCreation'
            examples:
              Create block storage:
                value:
                  targetSpec:
                    location:
                      region: GRA1
                    name: test-volume
                    size: 10
                    volumeType: CLASSIC
                summary: Create a block storage volume with minimal target spec
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.blockStorage.Block'
        '400':
          description: Error 400 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
                  message:
                    type: string
                    description: Error message
              examples:
                Client::BadRequest::CustomerManagedKeyNotAccessible:
                  value:
                    class: Client::BadRequest::CustomerManagedKeyNotAccessible
                    message: The OVH KMS key {{.serviceKeyId}} does not exist in the OVH KMS domain {{.domainId}}, or no IAM policy on the key grants the Public Cloud identity {{.identityUrn}} the IAM action(s) {{.missingActions}}
                Client::BadRequest::CustomerManagedKeyRegionMismatch:
                  value:
                    class: Client::BadRequest::CustomerManagedKeyRegionMismatch
                    message: The OVH KMS key {{.serviceKeyId}} belongs to an OVH KMS domain in region {{.kmsDomainRegion}} and cannot encrypt a volume in region {{.region}}. Use a key from an OVH KMS domain in the region of the volume
                Client::BadRequest::CustomerManagedKeyUnsuitable:
                  value:
                    class: Client::BadRequest::CustomerManagedKeyUnsuitable
                    message: 'The OVH KMS key {{.serviceKeyId}} cannot encrypt a volume: the key {{.violations}}. Volume encryption requires an AES key of 256 bits that allows wrap and unwrap'
                Client::BadRequest::InvalidParameter:
                  value:
                    class: Client::BadRequest::InvalidParameter
                    message: Invalid parameter in the request
        '409':
          description: Error 409 response
          content:
            application/json:
              schema:
                type: object
                description: Common error model
                properties:
                  class:
                    type: string
                    description: Class of the error
