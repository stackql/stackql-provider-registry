          readOnly: true
        staticUrl:
          type: string
          description: Public URL of the container, only set when type is PUBLIC or STATIC. Built from the URL-encoded container name, the project's Swift account and the region's object-store endpoint.
          nullable: true
          readOnly: true
        type:
          description: 'Access type of the container, derived from its read ACL and static website metadata: STATIC when the website metadata is set, PUBLIC when only the public read ACL is set, PRIVATE otherwise'
          readOnly: true
          type: string
          enum:
            - PRIVATE
            - PUBLIC
            - STATIC
    publicCloud.storage.swift.ContainerTargetSpec:
      type: object
      description: Target specification for a Swift object storage container. name, location and archive are set at creation and cannot be changed afterward. type and cors can be updated.
      properties:
        archive:
          type: boolean
          description: 'Create the container with the Public Cloud Archive storage policy (X-Storage-Policy: PCA) instead of the standard policy. Objects in an archive container are sealed after upload and must be unsealed (retrieval) before download. Immutable after creation. Defaults to false.'
          nullable: true
        cors:
          type: array
          description: Origins allowed to access the container from a browser (Access-Control-Allow-Origin container metadata), for example https://www.example.com. Duplicates are removed. Defaults to no origin, which blocks cross-origin browser requests.
          nullable: true
          items:
            type: string
        location:
          description: Region hosting the container. Only region is used. availabilityZone is ignored because Swift is region-wide. The region is part of the container identifier and cannot be changed.
          type: object
          properties:
            availabilityZone:
              type: string
              description: Availability zone within the region
              nullable: true
            region:
              type: string
              description: Region code
          required:
            - region
        name:
          type: string
          description: Container name, unique within the region. At most 256 bytes and must not contain a slash (/). Immutable after creation.
        type:
          description: 'Access type of the container. PRIVATE requires a token or a presigned URL to read objects. PUBLIC lets anyone read and list objects. STATIC also serves the container as a static website: index.html as the index page, error.html on errors and listing.css to style listings. Default versions of these three files are pushed to the container when it is switched to STATIC. Defaults to PRIVATE.'
          nullable: true
          type: string
          enum:
            - PRIVATE
            - PUBLIC
            - STATIC
      required:
        - location
        - name
    publicCloud.storage.swift.ContainerUpdateTargetSpec:
      type: object
      description: Target specification for updating a Swift object storage container (mutable fields only). name, location and archive cannot be changed after creation.
      properties:
        cors:
          type: array
          description: Origins allowed to access the container from a browser (Access-Control-Allow-Origin container metadata), for example https://www.example.com. The list replaces the current origins. Duplicates are removed. An empty list or null removes every origin.
          nullable: true
          items:
            type: string
        type:
          description: 'Access type of the container. A null or missing type resets the container to PRIVATE. PRIVATE requires a token or a presigned URL to read objects. PUBLIC lets anyone read and list objects. STATIC also serves the container as a static website: index.html as the index page, error.html on errors and listing.css to style listings. Default versions of these three files are pushed to the container when it is switched to STATIC. Switching back to PRIVATE removes the public read ACL and the static website settings but keeps the objects.'
          nullable: true
          type: string
          enum:
            - PRIVATE
            - PUBLIC
            - STATIC
    publicCloud.storage.swift.ObjectRetrievalStateEnum:
      type: string
      description: 'Possible retrieval states of an object stored in an archive container (Public Cloud Archive policy). `SEALED`: the object is in cold storage and must be unsealed before it can be downloaded. `UNSEALING`: a retrieval is in progress. The object becomes readable after retrievalDelay seconds. `UNSEALED`: the object can be downloaded.'
      enum:
        - SEALED
        - UNSEALED
        - UNSEALING
    publicCloud.storage.swift.ContainerPresignedURLMethodEnum:
