    publicCloud.storage.file.FileStorageTargetSpec:
      type: object
      description: Target specification for a file storage
      properties:
        createFrom:
          description: Optional source to create the file storage from. Immutable after creation. When omitted, an empty file storage is created.
          nullable: true
          type: object
          properties:
            snapshotId:
              type: string
              description: Identifier of a file storage snapshot of the same project to create the file storage from. The snapshot must be available, otherwise the request is rejected with a 409, and must be in the region set in `location.region`. The file storage type and encryption are taken from the snapshot's source file storage.
              format: uuid
          required:
            - snapshotId
        description:
          type: string
          description: Description of the file storage
          nullable: true
        encryption:
          description: 'Encryption configuration for the file storage. Immutable after creation. When `createFrom` is set, the encryption of the snapshot''s source file storage is used and returned here: requesting `enabled` true from a snapshot of an unencrypted file storage is rejected as an invalid parameter, and requesting `enabled` false from a snapshot of an encrypted file storage is ignored, so the new file storage is encrypted.'
          nullable: true
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether the file storage is encrypted at rest with LUKS
          required:
            - enabled
        location:
          description: Desired resource location. When `createFrom` is set, `region` must be the region of the snapshot.
          type: object
          properties:
            availabilityZone:
              type: string
              description: Availability zone within the region
              nullable: true
            region:
              type: string
              description: Region code
          required:
            - region
        name:
          type: string
          description: Desired file storage name
        protocol:
          description: File sharing protocol
          type: string
          enum:
            - NFS
        shareNetwork:
          description: 'Reference to a pre-existing share network to attach the file storage to. Required when `createFrom` is not set. When `createFrom` is set, it is optional: when omitted, the share network of the snapshot''s source file storage is used and returned here. When sent, it must be that same share network, otherwise the request is rejected as an invalid parameter.'
          nullable: true
          type: object
          properties:
            id:
              type: string
              description: Identifier of the share network to attach the file storage to
              format: uuid
          required:
            - id
        shareType:
          description: 'File storage type (performance tier). Required when `createFrom` is not set. When `createFrom` is set, it is optional: the type of the snapshot''s source file storage is used and returned here.'
          nullable: true
          type: string
          enum:
            - STANDARD_1AZ
        size:
          type: integer
          description: 'Size of the file storage in GB. Required when `createFrom` is not set. When `createFrom` is set, it is optional: when omitted, the size of the snapshot is used and returned here. A size smaller than the snapshot''s size is rejected as an invalid parameter.'
          nullable: true
      required:
        - location
        - name
        - protocol
    publicCloud.storage.file.FileStorageUpdateTargetSpec:
