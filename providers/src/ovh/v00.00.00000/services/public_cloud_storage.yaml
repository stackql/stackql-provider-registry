          type: string
          description: Computed hash representing the current target specification value
          readOnly: true
        createdAt:
          type: string
          description: Creation date of the volume
          format: date-time
          readOnly: true
        currentState:
          description: Current observed state of the volume from the infrastructure
          nullable: true
          readOnly: true
          type: object
          properties:
            attachedInstances:
              type: array
              description: Instances currently attached to this volume
              nullable: true
              items:
                $ref: '#/components/schemas/publicCloud.blockStorage.BlockAttachedInstance'
              readOnly: true
            bootable:
              type: boolean
              description: Whether the volume is bootable
              readOnly: true
            description:
              type: string
              description: Volume description
              nullable: true
              readOnly: true
            encryption:
              description: Encryption configuration of the volume
              readOnly: true
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether the volume is encrypted at rest with LUKS
                kms:
                  description: Customer-managed OVH Key Management Service (OKMS) key used to encrypt the volume. When omitted and enabled is true, the volume is encrypted with an OVH-managed key (OMK). Ignored (must be absent) when enabled is false. Immutable after creation.
                  nullable: true
                  type: object
                  properties:
                    domainId:
                      type: string
                      description: Identifier of the OKMS domain that owns the service key
                      format: uuid
                    serviceKeyId:
                      type: string
                      description: Identifier of the OKMS service key used to encrypt the volume
                      format: uuid
                  required:
                    - domainId
                    - serviceKeyId
              required:
                - enabled
            location:
              description: Current location
              readOnly: true
              type: object
              properties:
                availabilityZone:
                  type: string
                  description: Availability zone within the region
                  nullable: true
                region:
                  type: string
                  description: Region code
              required:
                - region
            locked:
              type: boolean
              description: Whether the volume is locked
              readOnly: true
            name:
              type: string
              description: Current volume name
              readOnly: true
            size:
              type: integer
              description: Current size of the volume in GB
              readOnly: true
            status:
              description: OpenStack volume status
              readOnly: true
              type: string
              enum:
                - ATTACHING
                - AVAILABLE
                - AWAITING_TRANSFER
                - BACKING_UP
                - CREATING
                - DELETING
                - DETACHING
                - DOWNLOADING
                - ERROR
                - ERROR_BACKING_UP
                - ERROR_DELETING
                - ERROR_EXTENDING
                - ERROR_RESTORING
                - EXTENDING
                - IN_USE
                - MAINTENANCE
                - RESERVED
                - RESTORING_BACKUP
                - RETYPING
                - UPLOADING
            volumeType:
              description: Current volume type
              readOnly: true
              type: string
              enum:
                - CLASSIC
                - HIGH_SPEED
                - HIGH_SPEED_GEN2
        currentTasks:
          type: array
          description: Ongoing asynchronous tasks related to the volume
          nullable: true
          items:
            $ref: '#/components/schemas/common.CurrentTask'
          readOnly: true
        id:
          type: string
          description: Unique identifier of the volume
          format: uuid
          readOnly: true
        resourceStatus:
          description: Volume readiness in the system
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
        targetSpec:
          description: Last target specification of the volume
          readOnly: true
          type: object
          properties:
            createFrom:
              description: Optional source to create the volume from (backup or snapshot). Immutable after creation.
              nullable: true
              type: object
              properties:
                backupId:
                  type: string
                  description: UUID of a backup to restore from. `volumeType` and `encryption` may be specified explicitly. When omitted, they are inferred from the source volume when known.
                  nullable: true
                  format: uuid
                imageId:
                  type: string
                  description: UUID of a Glance image to create the volume from. The resulting volume will be bootable. `volumeType` is required when using this field.
                  nullable: true
                  format: uuid
                snapshotId:
                  type: string
                  description: UUID of a snapshot to create from. `volumeType` and `encryption` may be specified explicitly. When omitted, they are inferred from the source volume when known.
                  nullable: true
                  format: uuid
            encryption:
              description: Encryption configuration for the volume. When omitted on a create from a backup or snapshot, the source volume's encryption is used when known.
              nullable: true
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether the volume is encrypted at rest with LUKS
                kms:
                  description: Customer-managed OVH Key Management Service (OKMS) key used to encrypt the volume. When omitted and enabled is true, the volume is encrypted with an OVH-managed key (OMK). Ignored (must be absent) when enabled is false. Immutable after creation.
                  nullable: true
                  type: object
                  properties:
                    domainId:
                      type: string
                      description: Identifier of the OKMS domain that owns the service key
                      format: uuid
                    serviceKeyId:
                      type: string
                      description: Identifier of the OKMS service key used to encrypt the volume
                      format: uuid
                  required:
                    - domainId
                    - serviceKeyId
              required:
                - enabled
            location:
              description: Target location
              type: object
              properties:
                availabilityZone:
                  type: string
                  description: Availability zone within the region
                  nullable: true
                region:
                  type: string
                  description: Region code
              required:
                - region
            name:
              type: string
              description: Desired volume name
            size:
              type: integer
              description: Size of the volume in GB
            volumeType:
              description: 'Type of the volume. Required when creating a blank volume or from an image. Optional when creating from a backup or snapshot: an explicit value is honored, and when omitted the type is inferred from the source volume when known.'
              nullable: true
              type: string
              enum:
                - CLASSIC
                - HIGH_SPEED
                - HIGH_SPEED_GEN2
          required:
            - location
            - name
            - size
        updatedAt:
          type: string
          description: Last update date of the volume
          format: date-time
          readOnly: true
