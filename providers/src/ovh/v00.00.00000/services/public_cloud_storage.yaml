    publicCloud.storage.swift.Container:
      type: object
      description: A Swift object storage container. Its identifier is <REGION>_<name>, for example GRA_my-container, where REGION is the region of the container.
      properties:
        checksum:
          type: string
          description: Computed hash representing the current target specification value
          readOnly: true
        createdAt:
          type: string
          description: Creation date of the container
          format: date-time
          readOnly: true
        currentState:
          description: Current observed state of the container, read from the Swift backend
          nullable: true
          readOnly: true
          type: object
          properties:
            archive:
              type: boolean
              description: 'Whether the container uses the Public Cloud Archive storage policy (X-Storage-Policy: PCA). Objects in an archive container are sealed after upload and must be unsealed before download.'
              readOnly: true
            cors:
              type: array
              description: Origins currently allowed to access the container from a browser (Access-Control-Allow-Origin container metadata). Empty when no origin is allowed.
              items:
                type: string
              readOnly: true
            location:
              description: Region hosting the container
              readOnly: true
              type: object
              properties:
                availabilityZone:
                  type: string
                  description: Availability zone within the region
                  nullable: true
                region:
                  type: string
                  description: Region code
              required:
                - region
            name:
              type: string
              description: Container name
              readOnly: true
            objectsCount:
              type: integer
              description: Number of objects stored in the container
              readOnly: true
            objectsSize:
              type: integer
              description: Total size of the objects stored in the container in bytes
              readOnly: true
            staticUrl:
              type: string
              description: Public URL of the container, only set when type is PUBLIC or STATIC. Built from the URL-encoded container name, the project's Swift account and the region's object-store endpoint.
              nullable: true
              readOnly: true
            type:
              description: 'Access type of the container, derived from its read ACL and static website metadata: STATIC when the website metadata is set, PUBLIC when only the public read ACL is set, PRIVATE otherwise'
              readOnly: true
              type: string
              enum:
                - PRIVATE
                - PUBLIC
                - STATIC
        currentTasks:
          type: array
          description: Ongoing asynchronous tasks related to the container
          nullable: true
          items:
            $ref: '#/components/schemas/common.CurrentTask'
          readOnly: true
        id:
          type: string
          description: Container identifier, built as <REGION>_<name>, for example GRA_my-container. A container name is unique within a region of the project, so the pair identifies it.
          readOnly: true
        resourceStatus:
          description: Container readiness in the system
          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
        targetSpec:
          description: Last target specification of the container
          readOnly: true
          type: object
          properties:
            archive:
              type: boolean
              description: 'Create the container with the Public Cloud Archive storage policy (X-Storage-Policy: PCA) instead of the standard policy. Objects in an archive container are sealed after upload and must be unsealed (retrieval) before download. Immutable after creation. Defaults to false.'
              nullable: true
            cors:
              type: array
              description: Origins allowed to access the container from a browser (Access-Control-Allow-Origin container metadata), for example https://www.example.com. Duplicates are removed. Defaults to no origin, which blocks cross-origin browser requests.
              nullable: true
              items:
                type: string
            location:
              description: Region hosting the container. Only region is used. availabilityZone is ignored because Swift is region-wide. The region is part of the container identifier and cannot be changed.
              type: object
              properties:
                availabilityZone:
                  type: string
                  description: Availability zone within the region
                  nullable: true
                region:
                  type: string
                  description: Region code
              required:
                - region
            name:
              type: string
              description: Container name, unique within the region. At most 256 bytes and must not contain a slash (/). Immutable after creation.
            type:
              description: 'Access type of the container. PRIVATE requires a token or a presigned URL to read objects. PUBLIC lets anyone read and list objects. STATIC also serves the container as a static website: index.html as the index page, error.html on errors and listing.css to style listings. Default versions of these three files are pushed to the container when it is switched to STATIC. Defaults to PRIVATE.'
              nullable: true
              type: string
              enum:
                - PRIVATE
                - PUBLIC
                - STATIC
          required:
            - location
            - name
        updatedAt:
          type: string
          description: Last update date of the container
          format: date-time
          readOnly: true
