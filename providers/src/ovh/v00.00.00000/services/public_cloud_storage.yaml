          nullable: true
          readOnly: true
        retrievalState:
          description: 'Retrieval state of the object, only meaningful in an archive container: SEALED objects must be unsealed before download, UNSEALING objects are being retrieved, UNSEALED objects can be downloaded. Absent in a standard container.'
          nullable: true
          readOnly: true
          type: string
          enum:
            - SEALED
            - UNSEALED
            - UNSEALING
        size:
          type: integer
          description: Object size in bytes
          readOnly: true
    publicCloud.storage.swift.ContainerPresignedURLCreation:
