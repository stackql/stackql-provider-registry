          readOnly: true
          type: string
          enum:
            - CREATING
            - CREATION_PLANNED
            - DELETING
            - ERROR
            - OUT_OF_SYNC
            - READY
            - SUSPENDED
            - UNKNOWN
            - UPDATING
        targetSpec:
          description: Last target specification of the file storage
          readOnly: true
          type: object
          properties:
