  /storage/block/volume:
    get:
      operationId: getVolumes
      summary: List volumes
      description: Returns the volumes of the project.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
