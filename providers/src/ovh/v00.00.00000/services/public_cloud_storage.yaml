      description: Returns the volume backups of the project.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: header
          name: X-Pagination-Cursor
          description: Pagination cursor
          schema:
            type: string
        - in: header
          name: X-Pagination-Size
          description: Pagination size
          schema:
            type: integer
        - in: query
          name: volumeId
          description: Filter by source volume ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVolumeBackupsResponse'
      tags:
        - Storage
        - Block
      x-developer-hub-navigation:
        - - Public Cloud
          - Storage
          - Volume Backup@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: publicCloudProject:apiovh:volume/backup/get
          required: true
      x-response-identifier: id
      x-expanded-response: PublicCloudBlockStorageBackup
    post:
      operationId: createVolumeBackup
      summary: Create a backup
      description: Creates a backup of a volume in the given region.
      security:
        - oAuth2AuthCode: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCloud.blockStorage.BackupCreation'
            examples:
              Create block storage backup:
                value:
                  targetSpec:
                    description: Daily backup
                    location:
                      region: GRA1
                    name: my-backup
                    volumeId: a53bbebb-2366-4d4e-b074-5cb81515173e
                summary: Create a backup from an existing volume
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicCloud.blockStorage.Backup'
        '409':
          description: Error 409 response
          content:
            application/json:
