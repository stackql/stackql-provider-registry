    publicCloud.storage.swift.ContainerUpdate:
      type: object
      description: Payload to update a Swift object storage container
      properties:
        checksum:
          type: string
          description: Optional concurrency-control checksum. When supplied, it must match the resource's current checksum or the request is rejected with a 409 checksum-mismatch conflict. When omitted or empty, the concurrency check is skipped and the write is forced (last-write-wins).
          nullable: true
        targetSpec:
          description: Desired target specification for the container
          type: object
          properties:
            cors:
              type: array
              description: Origins allowed to access the container from a browser (Access-Control-Allow-Origin container metadata), for example https://www.example.com. The list replaces the current origins. Duplicates are removed. An empty list or null removes every origin.
              nullable: true
              items:
                type: string
            type:
              description: 'Access type of the container. A null or missing type resets the container to PRIVATE. PRIVATE requires a token or a presigned URL to read objects. PUBLIC lets anyone read and list objects. STATIC also serves the container as a static website: index.html as the index page, error.html on errors and listing.css to style listings. Default versions of these three files are pushed to the container when it is switched to STATIC. Switching back to PRIVATE removes the public read ACL and the static website settings but keeps the objects.'
              nullable: true
              type: string
              enum:
                - PRIVATE
                - PUBLIC
                - STATIC
      required:
        - targetSpec
    publicCloud.storage.swift.ContainerObject:
      type: object
      description: An object stored in a Swift object storage container
      properties:
        contentType:
          type: string
          description: MIME type of the object content (Content-Type header), for example image/png
          readOnly: true
        etag:
          type: string
          description: 'Entity tag of the object: the MD5 hash of its content, or a hash of the segment hashes for a large object'
          readOnly: true
