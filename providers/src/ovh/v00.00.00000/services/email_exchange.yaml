        - name: emailExchange:apiovh:service/account/edit
          required: true
      operationId: put_v1_email_exchange_organization_name_service_exchange_service_account_primary_email_address
  /email/exchange/{organizationName}/service/{exchangeService}/account/{primaryEmailAddress}/alias:
