          required: true
      operationId: delete_v1_email_exchange_organization_name_service_exchange_service_account_primary_email_address_archive
    get:
      summary: Get the archive mailbox
      description: Get the archive mailbox. Returns the quota in GB, the usage, the state and the creation date of the archive mailbox.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: exchangeService
          description: The internal name of your exchange service
          required: true
          schema:
            type: string
        - in: path
          name: organizationName
          description: The internal name of your exchange organization
          required: true
          schema:
            type: string
