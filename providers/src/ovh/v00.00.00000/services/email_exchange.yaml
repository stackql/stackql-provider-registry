openapi: 3.0.0
info:
  title: OVHcloud Exchange API
  description: 'Microsoft Exchange organizations and services: accounts, domains, mailing lists, shared accounts, resources, public folders and tasks.'
  version: '1.0'
  x-stackQL-apiVersion: v1
  x-stackQL-specFamily: v1/email/exchange
paths:
  /email/exchange:
    get:
      summary: List Exchange organizations
      description: List Exchange organizations. Returns the names of the Exchange organizations of the account. Each organization holds one or more services.
      security:
        - oAuth2AuthCode: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_exchangeResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Hosted Exchange
          - General Information@@@10
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Private Exchange
          - General Information@@@10
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Trusted Exchange
          - General Information@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailExchange:apiovh:get
          required: true
      operationId: get_v1_email_exchange
  /email/exchange/{organizationName}/service:
    get:
      summary: List Exchange services
      description: List Exchange services. Returns the names of the Exchange services of the organization. Filter them by IAM tags with `iamTags`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: iamTags
          description: Filter resources on IAM tags
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/iam.resource.TagFilter'
        - in: path
          name: organizationName
          description: The internal name of your exchange organization
          required: true
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_exchange_organization_name_serviceResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Hosted Exchange
          - General Information@@@20
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Private Exchange
          - General Information@@@20
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Trusted Exchange
          - General Information@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailExchange:apiovh:service/get
          required: true
      x-expanded-response: EmailExchangeExchangeServiceWithIAM
      operationId: get_v1_email_exchange_organization_name_service
  /email/exchange/{organizationName}/service/{exchangeService}:
    get:
      summary: Get the Exchange service
      description: Get the Exchange service. Returns the offer, state, hostname, display name, password and lockout policy, message size limits, spam and virus settings and SSL expiration date of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: exchangeService
          description: The internal name of your exchange service
          required: true
          schema:
            type: string
        - in: path
          name: organizationName
          description: The internal name of your exchange organization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.exchange.ExchangeServiceWithIAM'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Hosted Exchange
          - General Information@@@30
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Private Exchange
          - General Information@@@30
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Trusted Exchange
          - General Information@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailExchange:apiovh:service/get
          required: true
      operationId: get_v1_email_exchange_organization_name_service_exchange_service
    put:
      summary: Update the Exchange service
      description: Update the Exchange service. Updates the display name, password and lockout policy, message size limits, spam and virus settings, ADFS password change and default authentication policy of the service.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: exchangeService
          description: The internal name of your exchange service
          required: true
          schema:
            type: string
        - in: path
          name: organizationName
          description: The internal name of your exchange organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email.exchange.ExchangeService'
      responses:
        '200':
          description: successful operation
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Hosted Exchange
          - General Information@@@40
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Private Exchange
          - General Information@@@40
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Trusted Exchange
          - General Information@@@40
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailExchange:apiovh:service/edit
          required: true
      operationId: put_v1_email_exchange_organization_name_service_exchange_service
  /email/exchange/{organizationName}/service/{exchangeService}/account:
    get:
      summary: List email accounts
      description: List email accounts. Returns the primary email addresses of the email accounts. Filter them by `primaryEmailAddress`, `id`, `accountLicense` or `company`.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: query
          name: accountLicense
          description: Filter the value of accountLicense property (=)
          schema:
            $ref: '#/components/schemas/email.exchange.OvhLicenceEnum'
        - in: query
          name: company
          description: Filter the value of company property (like)
          schema:
            type: string
        - in: path
          name: exchangeService
          description: The internal name of your exchange service
          required: true
          schema:
            type: string
        - in: query
          name: id
          description: Filter the value of id property (like)
          schema:
            type: integer
        - in: path
          name: organizationName
          description: The internal name of your exchange organization
          required: true
          schema:
            type: string
        - in: query
          name: primaryEmailAddress
          description: Filter the value of primaryEmailAddress property (like)
          schema:
            type: string
        - in: header
          name: X-Pagination-Mode
          description: Sent as CachedObjectList-Pages by default so the list returns the full objects rather than their identifiers.
          required: false
          schema:
            type: string
            default: CachedObjectList-Pages
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_v1_email_exchange_organization_name_service_exchange_service_accountResponse'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Hosted Exchange
          - Email Accounts@@@10
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Private Exchange
          - Email Accounts@@@10
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Trusted Exchange
          - Email Accounts@@@10
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailExchange:apiovh:service/account/get
          required: true
      x-expanded-response: EmailExchangeAccount
      operationId: get_v1_email_exchange_organization_name_service_exchange_service_account
    post:
      summary: Create an email account
      description: Create an email account. Creates an email account from a `login`, a `domain`, a `password` and a `license`, and returns the task. Set `quota` in GB.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: exchangeService
          description: The internal name of your exchange service
          required: true
          schema:
            type: string
        - in: path
          name: organizationName
          description: The internal name of your exchange organization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                SAMAccountName:
                  type: string
                  description: SAM account name (exchange 2010 login)
                authenticationPolicyId:
                  type: integer
                  description: ID of the authentication policy
                city:
                  type: string
                  description: City
                company:
                  type: string
                  description: Company name
                countryCode:
                  description: Country code
                  $ref: '#/components/schemas/email.exchange.CountryCodeEnum'
                description:
                  type: string
                  description: Description
                displayName:
                  type: string
                  description: Account display name
                domain:
                  type: string
                  description: Email domain
                fax:
                  description: Fax number
                  $ref: '#/components/schemas/phoneNumber'
                firstName:
                  type: string
                  description: Account first name
                forwardingEmail:
                  type: string
                  description: Email address to forward email
                hiddenFromGAL:
                  type: boolean
                  description: Hide the account in Global Address List
                initials:
                  type: string
                  description: Account initials
                jobDepartment:
                  type: string
                  description: Job department
                jobTitle:
                  type: string
                  description: Job title
                lastName:
                  type: string
                  description: Account last name
                license:
                  description: Exchange license
                  $ref: '#/components/schemas/email.exchange.OvhLicenceEnum'
                litigation:
                  type: boolean
                  description: Litigation status
                litigationPeriod:
                  type: integer
                  description: Litigation length in days, 0 means unlimited
                login:
                  type: string
                  description: Account login
                mailSenderDisplay:
                  type: string
                  description: Email display as sender
                mailingFilter:
                  type: array
                  description: Enable mailing filtrering
                  items:
                    $ref: '#/components/schemas/email.exchange.MailingFilterEnum'
                mobile:
                  description: Mobile phone number
                  $ref: '#/components/schemas/phoneNumber'
                office:
                  type: string
                  description: office
                outlookLicense:
                  type: boolean
                  description: Buy outlook license
                password:
                  type: string
                  description: Account password
                  format: password
                phone:
                  description: Phone Number
                  $ref: '#/components/schemas/phoneNumber'
                postalCode:
                  type: string
                  description: Postal code
                quota:
                  type: integer
                  description: Quota specified in GB. Check pricing table before use
                region:
                  type: string
                  description: Region
                sbrDestination:
                  type: string
                  description: Sender base routing destination domain
                sendConnectorId:
                  type: integer
                  description: Send connector id used to send mails when SBR is defined
                spamAndVirusConfiguration:
                  description: Antispam and Antivirus configuration
                  $ref: '#/components/schemas/email.exchange.spamAndVirusConfiguration'
                storeCopyOfEmail:
                  type: boolean
                  description: Store copy of email when forward is enable
                streetAddress:
                  type: string
                  description: Street address
              required:
                - domain
                - license
                - login
                - password
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.exchange.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Private Exchange
          - Email Accounts@@@30
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Trusted Exchange
          - Email Accounts@@@30
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailExchange:apiovh:service/account/create
          required: true
      operationId: post_v1_email_exchange_organization_name_service_exchange_service_account
  /email/exchange/{organizationName}/service/{exchangeService}/account/{primaryEmailAddress}:
    delete:
      summary: Delete an email account
      description: 'Delete an email account. Deletes the email account and returns the task. On Hosted Exchange, the account is reset instead: its content is deleted and it becomes an unconfigured slot in `configureme.me` that keeps its subscription.'
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: exchangeService
          description: The internal name of your exchange service
          required: true
          schema:
            type: string
        - in: path
          name: organizationName
          description: The internal name of your exchange organization
          required: true
          schema:
            type: string
        - in: path
          name: primaryEmailAddress
          description: Default email for this mailbox
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.exchange.Task'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Hosted Exchange
          - Email Accounts@@@30
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Private Exchange
