      operationId: delete_v1_email_exchange_organization_name_service_exchange_service_account_primary_email_address
    get:
      summary: Get an email account
      description: Get an email account. Returns the login, names, license, quota, usage, state, spam settings, forwarding, litigation hold and contact details of the email account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: exchangeService
          description: The internal name of your exchange service
          required: true
          schema:
            type: string
        - in: path
          name: organizationName
          description: The internal name of your exchange organization
          required: true
          schema:
            type: string
        - in: path
          name: primaryEmailAddress
          description: Default email for this mailbox
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.exchange.Account'
      x-developer-hub-navigation:
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Hosted Exchange
          - Email Accounts@@@20
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Private Exchange
          - Email Accounts@@@20
        - - Web Cloud
          - Email and Collaborative Solutions
          - Microsoft Exchange
          - Trusted Exchange
          - Email Accounts@@@20
      x-badges:
        - color: green
          label: Stable production version
      x-iam-actions:
        - name: emailExchange:apiovh:service/account/get
          required: true
      operationId: get_v1_email_exchange_organization_name_service_exchange_service_account_primary_email_address
    put:
      summary: Update an email account
      description: Update an email account. Updates the names, license, quota, renewal, forwarding, litigation hold, spam settings, authentication policy and contact details of the email account.
      security:
        - oAuth2AuthCode: []
      parameters:
        - in: path
          name: exchangeService
          description: The internal name of your exchange service
          required: true
          schema:
            type: string
        - in: path
          name: organizationName
          description: The internal name of your exchange organization
          required: true
          schema:
            type: string
        - in: path
          name: primaryEmailAddress
