          name: organizationName
          description: The internal name of your exchange organization
          required: true
          schema:
            type: string
        - in: path
          name: primaryEmailAddress
          description: Default email for this mailbox
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
                  description: Alias
              required:
                - alias
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email.exchange.Task'
