openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Drive Labels API
  description: An API for managing Drive Labels
  version: v2
  x-discovery-doc-revision: '20260728'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://developers.google.com/workspace/drive/labels
servers:
  - url: https://drivelabels.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/drive.admin.labels: >-
              See, edit, create, and delete all Google Drive labels in your
              organization, and see your organization's label-related admin
              policies
            https://www.googleapis.com/auth/drive.labels: See, edit, create, and delete your Google Drive labels
            https://www.googleapis.com/auth/drive.labels.readonly: See your Google Drive labels
            https://www.googleapis.com/auth/drive.admin.labels.readonly: >-
              See all Google Drive labels and label-related admin policies in
              your organization
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestCreateFieldRequest:
      description: Request to create a field within a label.
      type: object
      properties:
        field:
          description: Required. Field to create.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2Field'
      id: GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestCreateFieldRequest
    GoogleAppsDriveLabelsV2FieldSelectionOptionsChoiceDisplayHints:
      id: GoogleAppsDriveLabelsV2FieldSelectionOptionsChoiceDisplayHints
      description: UI display hints for rendering an option.
      type: object
      properties:
        disabled:
          type: boolean
          description: Whether the option should be shown in the UI as disabled.
        hiddenInSearch:
          description: >-
            This option should be hidden in the search menu when searching for
            Drive items.
          type: boolean
        shownInApply:
          description: >-
            This option should be shown in the apply menu when applying values
            to a Drive item.
          type: boolean
        badgeColors:
          description: >-
            The colors to use for the badge. Changed to Google Material colors
            based on the chosen `properties.badge_config.color`.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2BadgeColors'
        darkBadgeColors:
          description: >-
            The dark-mode color to use for the badge. Changed to Google Material
            colors based on the chosen `properties.badge_config.color`.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2BadgeColors'
        badgePriority:
          description: >-
            The priority of this badge. Used to compare and sort between
            multiple badges. A lower number means the badge should be shown
            first. When a badging configuration is not present, this will be 0.
            Otherwise, this will be set to `BadgeConfig.priority_override` or
            the default heuristic which prefers creation date of the label, and
            field and option priority.
          type: string
          format: int64
    GoogleAppsDriveLabelsV2LabelPermission:
      id: GoogleAppsDriveLabelsV2LabelPermission
      type: object
      properties:
        group:
          description: Group resource name.
          type: string
        role:
          description: The role the principal should have.
          enumDescriptions:
            - Unknown role.
            - >-
              A reader can read the label and associated metadata applied to
              Drive items.
            - >-
              An applier can write associated metadata on Drive items in which
              they also have write access to. Implies `READER`.
            - >-
              An organizer can pin this label in shared drives they manage and
              add new appliers to the label.
            - >-
              Editors can make any update including deleting the label which
              also deletes the associated Drive item metadata. Implies
              `APPLIER`.
          enum:
            - LABEL_ROLE_UNSPECIFIED
            - READER
            - APPLIER
            - ORGANIZER
            - EDITOR
          type: string
        person:
          description: Person resource name.
          type: string
        audience:
          description: >-
            Audience to grant a role to. The magic value of `audiences/default`
            may be used to apply the role to the default audience in the context
            of the organization that owns the label.
          type: string
        name:
          description: Resource name of this permission.
          type: string
        email:
          description: >-
            Specifies the email address for a user or group principal. Not
            populated for audience principals. User and group permissions may
            only be inserted using an email address. On update requests, if
            email address is specified, no principal should be specified.
          type: string
      description: >-
        The permission that applies to a principal (user, group, audience) on a
        label.
    GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseDisableFieldResponse:
      id: GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseDisableFieldResponse
      description: Response following field disable.
      type: object
      properties: {}
    GoogleAppsDriveLabelsV2FieldLimits:
      id: GoogleAppsDriveLabelsV2FieldLimits
      type: object
      properties:
        integerLimits:
          description: Integer field limits.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2IntegerLimits'
        maxDisplayNameLength:
          type: integer
          format: int32
          description: Limits for field title.
        dateLimits:
          description: Date field limits.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2DateLimits'
        userLimits:
          description: User field limits.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2UserLimits'
        maxIdLength:
          description: Maximum length for the id.
          type: integer
          format: int32
        textLimits:
          description: The relevant limits for the specified Field.Type. Text field limits.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2TextLimits'
        maxDescriptionLength:
          description: Limits for field description, also called help text.
          type: integer
          format: int32
        selectionLimits:
          description: Selection field limits.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2SelectionLimits'
        longTextLimits:
          description: Long text field limits.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2LongTextLimits'
      description: >-
        Field constants governing the structure of a field; such as, the maximum
        title length, minimum and maximum field values or length, etc.
    GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestUpdateFieldTypeRequest:
      type: object
      properties:
        selectionOptions:
          description: Update field to Selection.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldSelectionOptions'
        dateOptions:
          description: Update field to Date.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldDateOptions'
        updateMask:
          description: >-
            The fields that should be updated. At least one field must be
            specified. The root of `type_options` is implied and should not be
            specified. A single `*` can be used as a short-hand for updating
            every field.
          type: string
          format: google-fieldmask
        id:
          description: Required. The field to update.
          type: string
        textOptions:
          description: Update field to Text.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldTextOptions'
        userOptions:
          description: Update field to User.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldUserOptions'
        integerOptions:
          description: Update field to Integer.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldIntegerOptions'
      description: Request to change the type of a field.
      id: GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestUpdateFieldTypeRequest
    GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestDeleteFieldRequest:
      description: Request to delete the field.
      type: object
      properties:
        id:
          description: Required. ID of the field to delete.
          type: string
      id: GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestDeleteFieldRequest
    GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseDeleteSelectionChoiceResponse:
      description: Response following choice delete.
      type: object
      properties: {}
      id: >-
        GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseDeleteSelectionChoiceResponse
    GoogleAppsDriveLabelsV2BatchUpdateLabelPermissionsRequest:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleAppsDriveLabelsV2UpdateLabelPermissionRequest
          description: Required. The request message specifying the resources to update.
        useAdminAccess:
          description: >-
            Set to `true` in order to use the user's admin credentials. The
            server will verify the user is an admin for the label before
            allowing access. If this is set, the `use_admin_access` field in the
            `UpdateLabelPermissionRequest` messages must either be empty or
            match this field.
          type: boolean
      description: Updates one or more label permissions.
      id: GoogleAppsDriveLabelsV2BatchUpdateLabelPermissionsRequest
    GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseResponse:
      id: GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseResponse
      description: A single response from an update.
      type: object
      properties:
        createSelectionChoice:
          description: Creates a selection list option to add to a selection field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseCreateSelectionChoiceResponse
        enableField:
          description: Enables field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseEnableFieldResponse
        deleteField:
          description: Deletes a field from the label.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseDeleteFieldResponse
        disableSelectionChoice:
          description: Disables a choice within a selection field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseDisableSelectionChoiceResponse
        updateLabel:
          description: Updates basic properties of a label.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseUpdateLabelPropertiesResponse
        disableField:
          description: Disables field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseDisableFieldResponse
        enableSelectionChoice:
          description: Enables a choice within a selection field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseEnableSelectionChoiceResponse
        deleteSelectionChoice:
          description: Deletes a choice from a selection field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseDeleteSelectionChoiceResponse
        updateField:
          description: Updates basic properties of a field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseUpdateFieldPropertiesResponse
        updateSelectionChoiceProperties:
          description: Updates a choice within a selection field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseUpdateSelectionChoicePropertiesResponse
        updateFieldType:
          description: Updates field type and/or type options.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseUpdateFieldTypeResponse
        createField:
          description: Creates a field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseCreateFieldResponse
    GoogleAppsDriveLabelsV2LabelLimits:
      id: GoogleAppsDriveLabelsV2LabelLimits
      description: >-
        Label constraints governing the structure of a label; such as, the
        maximum number of fields allowed and maximum length of the label title.
      type: object
      properties:
        maxDescriptionLength:
          description: The maximum number of characters allowed for the description.
          type: integer
          format: int32
        maxDeletedFields:
          type: integer
          format: int32
          description: The maximum number of published fields that can be deleted.
        maxTitleLength:
          type: integer
          format: int32
          description: The maximum number of characters allowed for the title.
        name:
          type: string
          description: Resource name.
        maxFields:
          description: The maximum number of fields allowed within the label.
          type: integer
          format: int32
        fieldLimits:
          description: The limits for fields.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldLimits'
        maxDraftRevisions:
          type: integer
          format: int32
          description: >-
            The maximum number of draft revisions that will be kept before
            deleting old drafts.
    GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseUpdateSelectionChoicePropertiesResponse:
      description: Response following update to selection choice properties.
      type: object
      properties:
        priority:
          description: >-
            The priority of the updated choice. The priority may change from
            what was specified to assure contiguous priorities between choices
            (1-n).
          type: integer
          format: int32
      id: >-
        GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseUpdateSelectionChoicePropertiesResponse
    GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseDisableSelectionChoiceResponse:
      type: object
      properties: {}
      description: Response following choice disable.
      id: >-
        GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseDisableSelectionChoiceResponse
    GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseUpdateFieldPropertiesResponse:
      description: Response following update to field properties.
      type: object
      properties:
        priority:
          type: integer
          format: int32
          description: >-
            The priority of the updated field. The priority may change from what
            was specified to assure contiguous priorities between fields (1-n).
      id: >-
        GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseUpdateFieldPropertiesResponse
    GoogleAppsDriveLabelsV2DateLimits:
      id: GoogleAppsDriveLabelsV2DateLimits
      description: Limits for date field type.
      type: object
      properties:
        minValue:
          description: Minimum value for the date field type.
          $ref: '#/components/schemas/GoogleTypeDate'
        maxValue:
          description: Maximum value for the date field type.
          $ref: '#/components/schemas/GoogleTypeDate'
    GoogleAppsDriveLabelsV2FieldSelectionOptionsChoiceSchemaCapabilities:
      type: object
      properties:
        canUpdate:
          type: boolean
          description: Whether the user can update this choice.
        canDelete:
          description: Whether the user can delete this choice.
          type: boolean
        canDisable:
          type: boolean
          description: Whether the user can disable this choice.
        canEnable:
          description: Whether the user can enable this choice.
          type: boolean
      description: The capabilities related to this choice when editing the choice.
      id: GoogleAppsDriveLabelsV2FieldSelectionOptionsChoiceSchemaCapabilities
    GoogleAppsDriveLabelsV2SelectionLimits:
      id: GoogleAppsDriveLabelsV2SelectionLimits
      type: object
      properties:
        maxChoices:
          type: integer
          format: int32
          description: Maximum number of choices.
        maxDeletedChoices:
          description: Maximum number of deleted choices.
          type: integer
          format: int32
        listLimits:
          description: Limits for list-variant of a field type.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2ListLimits'
        maxIdLength:
          description: Maximum ID length for a selection option.
          type: integer
          format: int32
        maxDisplayNameLength:
          description: Maximum length for display name.
          type: integer
          format: int32
      description: Limits for selection field type.
    GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestRequest:
      id: GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestRequest
      type: object
      properties:
        updateLabel:
          description: Updates the label properties.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestUpdateLabelPropertiesRequest
        disableField:
          description: Disables the field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestDisableFieldRequest
        deleteField:
          description: Deletes a field from the label.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestDeleteFieldRequest
        disableSelectionChoice:
          description: Disable a choice within a selection field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestDisableSelectionChoiceRequest
        enableField:
          description: Enables the field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestEnableFieldRequest
        createSelectionChoice:
          description: Create a choice within a selection field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestCreateSelectionChoiceRequest
        updateFieldType:
          description: Update field type and/or type options.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestUpdateFieldTypeRequest
        createField:
          description: Creates a field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestCreateFieldRequest
        updateSelectionChoiceProperties:
          description: Update a choice property within a selection field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestUpdateSelectionChoicePropertiesRequest
        updateField:
          description: Updates basic properties of a field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestUpdateFieldPropertiesRequest
        enableSelectionChoice:
          description: Enable a choice within a selection field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestEnableSelectionChoiceRequest
        deleteSelectionChoice:
          description: Delete a choice within a selection field.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestDeleteSelectionChoiceRequest
      description: A single kind of update to apply to a label.
    GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseEnableSelectionChoiceResponse:
      type: object
      properties: {}
      description: Response following choice enable.
      id: >-
        GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseEnableSelectionChoiceResponse
    GoogleAppsDriveLabelsV2FieldDateOptions:
      type: object
      properties:
        minValue:
          description: Output only. Minimum valid value (year, month, day).
          $ref: '#/components/schemas/GoogleTypeDate'
          readOnly: true
        maxValue:
          readOnly: true
          description: Output only. Maximum valid value (year, month, day).
          $ref: '#/components/schemas/GoogleTypeDate'
        dateFormatType:
          description: >-
            Localized date formatting option. Field values are rendered in this
            format according to their locale.
          enumDescriptions:
            - Date format unspecified.
            - >-
              Includes full month name. For example, January 12, 1999 (MMMM d,
              y)
            - Short, numeric, representation. For example, 12/13/99 (M/d/yy)
          enum:
            - DATE_FORMAT_UNSPECIFIED
            - LONG_DATE
            - SHORT_DATE
          type: string
        dateFormat:
          readOnly: true
          type: string
          description: Output only. ICU date format.
      description: Options for the date field type.
      id: GoogleAppsDriveLabelsV2FieldDateOptions
    GoogleAppsDriveLabelsV2FieldAppliedCapabilities:
      description: The capabilities related to this field on applied metadata.
      type: object
      properties:
        canRead:
          type: boolean
          description: Whether the user can read related applied metadata on items.
        canSearch:
          description: Whether the user can search for Drive items referencing this field.
          type: boolean
        canWrite:
          type: boolean
          description: Whether the user can set this field on Drive items.
      id: GoogleAppsDriveLabelsV2FieldAppliedCapabilities
    GoogleAppsDriveLabelsV2BadgeColors:
      description: >-
        The color derived from BadgeConfig and changed to the closest
        recommended supported color.
      type: object
      properties:
        backgroundColor:
          description: Output only. Badge background that pairs with the foreground.
          $ref: '#/components/schemas/GoogleTypeColor'
          readOnly: true
        foregroundColor:
          description: Output only. Badge foreground that pairs with the background.
          $ref: '#/components/schemas/GoogleTypeColor'
          readOnly: true
        soloColor:
          readOnly: true
          description: Output only. Color that can be used for text without a background.
          $ref: '#/components/schemas/GoogleTypeColor'
      id: GoogleAppsDriveLabelsV2BadgeColors
    GoogleAppsDriveLabelsV2TextLimits:
      type: object
      properties:
        minLength:
          description: Minimum length allowed for a text field type.
          type: integer
          format: int32
        maxLength:
          description: Maximum length allowed for a text field type.
          type: integer
          format: int32
      description: Limits for text field type.
      id: GoogleAppsDriveLabelsV2TextLimits
    GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestUpdateLabelPropertiesRequest:
      id: >-
        GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestUpdateLabelPropertiesRequest
      description: Updates basic properties of a label.
      type: object
      properties:
        updateMask:
          description: >-
            The fields that should be updated. At least one field must be
            specified. The root `label_properties` is implied and should not be
            specified. A single `*` can be used as a short-hand for updating
            every field.
          type: string
          format: google-fieldmask
        properties:
          description: Required. Label properties to update.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2LabelProperties'
    GoogleAppsDriveLabelsV2UpdateLabelCopyModeRequest:
      type: object
      properties:
        copyMode:
          description: >-
            Required. Indicates how the applied label and field values should be
            copied when a Drive item is copied.
          enumDescriptions:
            - Copy mode unspecified.
            - >-
              The applied label and field values aren't copied by default when
              the Drive item it's applied to is copied.
            - >-
              The applied label and field values are always copied when the
              Drive item it's applied to is copied. Only admins can use this
              mode.
            - >-
              The applied label and field values are copied if the label is
              appliable by the user making the copy.
          enum:
            - COPY_MODE_UNSPECIFIED
            - DO_NOT_COPY
            - ALWAYS_COPY
            - COPY_APPLIABLE
          type: string
        useAdminAccess:
          description: >-
            Set to `true` in order to use the user's admin credentials. The
            server will verify the user is an admin for the label before
            allowing access.
          type: boolean
        languageCode:
          type: string
          description: >-
            The BCP-47 language code to use for evaluating localized field
            labels. When not specified, values in the default configured
            language will be used.
        view:
          type: string
          description: >-
            When specified, only certain fields belonging to the indicated view
            will be returned.
          enumDescriptions:
            - >-
              Implies the field mask:
              `name,id,revision_id,label_type,properties.*`
            - All possible fields.
          enum:
            - LABEL_VIEW_BASIC
            - LABEL_VIEW_FULL
      description: >-
        Request to update the `CopyMode` of the given label. Changes to this
        policy aren't revisioned, don't require publishing, and take effect
        immediately. \
      id: GoogleAppsDriveLabelsV2UpdateLabelCopyModeRequest
    GoogleAppsDriveLabelsV2FieldSelectionOptions:
      id: GoogleAppsDriveLabelsV2FieldSelectionOptions
      type: object
      properties:
        choices:
          description: >-
            The options available for this selection field. The list order is
            consistent, and modified with `insert_before_choice`.
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleAppsDriveLabelsV2FieldSelectionOptionsChoice
        listOptions:
          description: >-
            When specified, indicates this field supports a list of values. Once
            the field is published, this cannot be changed.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldListOptions'
      description: Options for the selection field type.
    GoogleAppsDriveLabelsV2FieldSelectionOptionsChoiceAppliedCapabilities:
      description: The capabilities related to this choice on applied metadata.
      type: object
      properties:
        canRead:
          type: boolean
          description: Whether the user can read related applied metadata on items.
        canSearch:
          type: boolean
          description: Whether the user can use this choice in search queries.
        canSelect:
          type: boolean
          description: Whether the user can select this choice on an item.
      id: GoogleAppsDriveLabelsV2FieldSelectionOptionsChoiceAppliedCapabilities
    GoogleAppsDriveLabelsV2UserLimits:
      description: Limits for Field.Type.USER.
      type: object
      properties:
        listLimits:
          description: Limits for list-variant of a field type.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2ListLimits'
      id: GoogleAppsDriveLabelsV2UserLimits
    GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseEnableFieldResponse:
      id: GoogleAppsDriveLabelsV2DeltaUpdateLabelResponseEnableFieldResponse
      type: object
      properties: {}
      description: Response following field enable.
    GoogleAppsDriveLabelsV2WriteControl:
      id: GoogleAppsDriveLabelsV2WriteControl
      description: >-
        Provides control over how write requests are executed. When not
        specified, the last write wins.
      type: object
      properties:
        requiredRevisionId:
          type: string
          description: >-
            The revision ID of the label that the write request will be applied
            to. If this isn't the latest revision of the label, the request will
            not be processed and will return a 400 Bad Request error.
    GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestCreateSelectionChoiceRequest:
      type: object
      properties:
        fieldId:
          type: string
          description: Required. The selection field in which a choice will be created.
        choice:
          description: Required. The choice to create.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2FieldSelectionOptionsChoice
      description: Request to create a selection choice.
      id: >-
        GoogleAppsDriveLabelsV2DeltaUpdateLabelRequestCreateSelectionChoiceRequest
    GoogleAppsDriveLabelsV2Field:
      description: >-
        Defines a field that has a display name, data type, and other
        configuration options. This field defines the kind of metadata that may
        be set on a Drive item.
      type: object
      properties:
        textOptions:
          description: Text field options.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldTextOptions'
        userOptions:
          description: User field options.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldUserOptions'
        lockStatus:
          readOnly: true
          description: Output only. The `LockStatus` of this field.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2LockStatus'
        createTime:
          description: Output only. The time this field was created.
          readOnly: true
          type: string
          format: google-datetime
        integerOptions:
          description: Integer field options.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldIntegerOptions'
        appliedCapabilities:
          description: >-
            Output only. The capabilities this user has on this field and its
            value when the label is applied on Drive items.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldAppliedCapabilities'
          readOnly: true
        dateOptions:
          description: Date field options.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldDateOptions'
        selectionOptions:
          description: Selection field options.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2FieldSelectionOptions'
        lifecycle:
          description: Output only. The lifecycle of this field.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2Lifecycle'
          readOnly: true
        updater:
          description: Output only. The user who modified this field.
