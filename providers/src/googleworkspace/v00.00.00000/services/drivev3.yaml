        proposalId:
          description: The ID of the access proposal.
          type: string
        requesterEmailAddress:
          description: The email address of the requesting user.
          type: string
        requestMessage:
          description: The message that the requester added to the proposal.
          type: string
        recipientEmailAddress:
          description: >-
            The email address of the user that will receive permissions, if
            accepted.
          type: string
        rolesAndViews:
          type: array
          items:
            $ref: '#/components/schemas/AccessProposalRoleAndView'
          description: >-
            A wrapper for the role and view of an access proposal. For more
            information, see [Roles and
            permissions](https://developers.google.com/workspace/drive/api/guides/ref-roles).
        createTime:
          description: The creation time.
          format: google-datetime
          type: string
      type: object
    CommentList:
      id: CommentList
      description: A list of comments on a file.
      properties:
        kind:
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#commentList"`.
          default: drive#commentList
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          description: >-
            The list of comments. If nextPageToken is populated, then this list
            may be incomplete and an additional page of results should be
            fetched.
        nextPageToken:
          description: >-
            The page token for the next page of comments. This will be absent if
            the end of the comments list has been reached. If the token is
            rejected for any reason, it should be discarded, and pagination
            should be restarted from the first page of results. The page token
            is typically valid for several hours. However, if new items are
            added or removed, your expected results might differ.
          type: string
      type: object
    StartApprovalRequest:
      type: object
      properties:
        message:
          description: >-
            Optional. A message to send to reviewers when notifying them of the
            approval request.
          type: string
        lockFile:
          description: Optional. Whether to lock the file when starting the approval.
          type: boolean
        reviewerEmails:
          type: array
          items:
            type: string
          description: >-
            Required. The emails of the users who are set to review the
            approval.
        dueTime:
          description: Optional. The time that the approval is due.
          format: google-datetime
          type: string
        fileContentChangeBehavior:
          description: >-
            Optional. The behavior of the approval when the file content
            changes.
          enumDescriptions:
            - The behavior is unspecified.
            - >-
              Any ReviewerResponse with a Response of APPROVED will be reset to
              NO_DECISION when the file content changes while the approval has a
              Status of IN_PROGRESS. When the approval has a Status of APPROVED
              and RESET_APPROVAL is selected, the file is locked.
            - No action is taken when the file content changes.
          enum:
            - FILE_CONTENT_CHANGE_BEHAVIOR_UNSPECIFIED
            - RESET_APPROVAL
            - NO_APPROVAL_ACTION
          type: string
      id: StartApprovalRequest
      description: Allows creating an approval on a file.
    Permission:
      id: Permission
      description: >-
        A permission for a file. A permission grants a user, group, domain, or
        the world access to a file or a folder hierarchy. For more information,
        see [Share files, folders, and
        drives](https://developers.google.com/workspace/drive/api/guides/manage-sharing).
        By default, permission requests only return a subset of fields.
        Permission `kind`, `ID`, `type`, and `role` are always returned. To
        retrieve specific fields, see [Return specific
        fields](https://developers.google.com/workspace/drive/api/guides/fields-parameter).
        Some resource methods (such as `permissions.update`) require a
        `permissionId`. Use the `permissions.list` method to retrieve the ID for
        a file, folder, or shared drive.
      properties:
        teamDrivePermissionDetails:
          description: >-
            Output only. Deprecated: Output only. Use `permissionDetails`
            instead.
          type: array
          items:
            type: object
            properties:
              teamDrivePermissionType:
                deprecated: true
                description: >-
                  Deprecated: Output only. Use
                  `permissionDetails/permissionType` instead.
                type: string
              inheritedFrom:
                type: string
                deprecated: true
                description: >-
                  Deprecated: Output only. Use `permissionDetails/inheritedFrom`
                  instead.
              role:
                deprecated: true
                description: 'Deprecated: Output only. Use `permissionDetails/role` instead.'
                type: string
              inherited:
                description: >-
                  Deprecated: Output only. Use `permissionDetails/inherited`
                  instead.
                deprecated: true
                type: boolean
          deprecated: true
          readOnly: true
        kind:
          description: >-
            Output only. Identifies what kind of resource this is. Value: the
            fixed string `"drive#permission"`.
          type: string
          default: drive#permission
        pendingOwner:
          description: >-
            Whether the account associated with this permission is a pending
            owner. Only populated for permissions of type `user` for files that
            aren't in a shared drive.
          type: boolean
        type:
          description: >-
            The type of the grantee. Supported values include: * `user` *
            `group` * `domain` * `anyone` When creating a permission, if `type`
            is `user` or `group`, you must provide an `emailAddress` for the
            user or group. If `type` is `domain`, you must provide a `domain`.
            If `type` is `anyone`, no extra information is required.
          annotations:
            required:
              - drive.permissions.create
          type: string
        deleted:
          description: >-
            Output only. Whether the account associated with this permission has
            been deleted. This field only pertains to permissions of type `user`
            or `group`.
          type: boolean
        view:
          description: >-
            Indicates the view for this permission. Only populated for
            permissions that belong to a view. The only supported values are
            `published` and `metadata`: * `published`: The permission's role is
            `publishedReader`. * `metadata`: The item is only visible to the
            `metadata` view because the item has limited access and the scope
            has at least read access to the parent. The `metadata` view is only
            supported on folders. For more information, see
            [Views](https://developers.google.com/workspace/drive/api/guides/ref-roles#views).
          type: string
        inheritedPermissionsDisabled:
          description: >-
            When `true`, only organizers, owners, and users with permissions
            added directly on the item can access it.
          type: boolean
        photoLink:
          description: Output only. A link to the user's profile photo, if available.
          type: string
        emailAddress:
          description: >-
            Output only. The email address of the user or group to which this
            permission refers.
          readOnly: true
          type: string
        allowFileDiscovery:
          description: >-
            Whether the permission allows the file to be discovered through
            search. This is only applicable for permissions of type `domain` or
            `anyone`.
          type: boolean
        permissionDetails:
          type: array
          items:
            type: object
            properties:
              permissionType:
                description: >-
                  Output only. The permission type for this user. Supported
                  values include: * `file` * `member`
                type: string
              inheritedFrom:
                type: string
                description: >-
                  Output only. The ID of the item from which this permission is
                  inherited. This is only populated for items in shared drives.
                readOnly: true
              role:
                description: >-
                  Output only. The primary role for this user. Supported values
                  include: * `owner` * `organizer` * `fileOrganizer` * `writer`
                  * `commenter` * `reader` For more information, see [Roles and
                  permissions](https://developers.google.com/workspace/drive/api/guides/ref-roles).
                type: string
              inherited:
                description: >-
                  Output only. Whether this permission is inherited. This field
                  is always populated. This is an output-only field.
                type: boolean
          description: >-
            Output only. Details of whether the permissions on this item are
            inherited or are directly on this item.
          readOnly: true
        displayName:
          description: >-
            Output only. The "pretty" name of the value of the permission. The
            following is a list of examples for each type of permission: *
            `user` - User's full name, as defined for their Google Account, such
            as "Dana A." * `group` - Name of the Google Group, such as "The
            Company Administrators." * `domain` - String domain name, such as
            "cymbalgroup.com." * `anyone` - No `displayName` is present.
          type: string
        expirationTime:
          type: string
          description: >-
            The time at which this permission will expire (RFC 3339 date-time).
            Expiration times have the following restrictions: - They can only be
            set on user and group permissions - The time must be in the future -
            The time cannot be more than a year in the future
          format: date-time
        role:
          description: >-
            The role granted by this permission. Supported values include: *
            `owner` * `organizer` * `fileOrganizer` * `writer` * `commenter` *
            `reader` For more information, see [Roles and
            permissions](https://developers.google.com/workspace/drive/api/guides/ref-roles).
          annotations:
            required:
              - drive.permissions.create
          type: string
        id:
          description: >-
            Output only. The ID of this permission. This is a unique identifier
            for the grantee, and is published in the [User
            resource](https://developers.google.com/workspace/drive/api/reference/rest/v3/User)
            as `permissionId`. IDs should be treated as opaque values.
          type: string
        domain:
          description: Output only. The domain to which this permission refers.
          readOnly: true
          type: string
      type: object
    Change:
      properties:
        file:
          description: >-
            The updated state of the file. Present if the type is file and the
            file has not been removed from this list of changes.
          $ref: '#/components/schemas/File'
        type:
          type: string
          deprecated: true
          description: 'Deprecated: Use `changeType` instead.'
        kind:
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#change"`.
          default: drive#change
          type: string
        removed:
          description: >-
            Whether the file or shared drive has been removed from this list of
            changes, for example by deletion or loss of access.
          type: boolean
        driveId:
          description: The ID of the shared drive associated with this change.
          type: string
        changeType:
          description: The type of the change. Possible values are `file` and `drive`.
          type: string
        time:
          type: string
          description: The time of this change (RFC 3339 date-time).
          format: date-time
        drive:
          description: >-
            The updated state of the shared drive. Present if the changeType is
            drive, the user is still a member of the shared drive, and the
            shared drive has not been deleted.
          $ref: '#/components/schemas/Drive'
        teamDrive:
          deprecated: true
          description: 'Deprecated: Use `drive` instead.'
          $ref: '#/components/schemas/TeamDrive'
        fileId:
          description: The ID of the file which has changed.
          type: string
        teamDriveId:
          deprecated: true
          description: 'Deprecated: Use `driveId` instead.'
          type: string
      id: Change
      description: A change to a file or shared drive.
      type: object
    LabelFieldModification:
      id: LabelFieldModification
      description: A modification to a label's field.
      properties:
        fieldId:
          description: The ID of the field to be modified.
          type: string
        setUserValues:
          description: >-
            Replaces a `user` field with these new values. The values must be a
            valid email addresses.
          type: array
          items:
            type: string
        setTextValues:
          description: Sets the value of a `text` field.
          type: array
          items:
            type: string
        unsetValues:
          description: Unsets the values for this field.
          type: boolean
        kind:
          description: This is always `"drive#labelFieldModification"`.
          type: string
        setSelectionValues:
          description: Replaces a `selection` field with these new values.
          type: array
          items:
            type: string
        setIntegerValues:
          type: array
          items:
            type: string
            format: int64
          description: Replaces the value of an `integer` field with these new values.
        setDateValues:
          type: array
          items:
            type: string
            format: date
          description: >-
            Replaces the value of a dateString Field with these new values. The
            string must be in the RFC 3339 full-date format: YYYY-MM-DD.
      type: object
    App:
      properties:
        id:
          description: The ID of the app.
          type: string
        supportsOfflineCreate:
          description: Whether this app supports creating files when offline.
          type: boolean
        supportsCreate:
          description: Whether this app supports creating objects.
          type: boolean
        productUrl:
          description: A link to the product listing for this app.
          type: string
        useByDefault:
          description: >-
            Whether the app is selected as the default handler for the types it
            supports.
          type: boolean
        supportsImport:
          description: Whether this app supports importing from Google Docs.
          type: boolean
        supportsMultiOpen:
          description: Whether this app supports opening more than one file.
          type: boolean
        name:
          description: The name of the app.
          type: string
        primaryFileExtensions:
          type: array
          items:
            type: string
          description: The list of primary file extensions.
        createUrl:
          description: The URL to create a file with this app.
          type: string
        secondaryMimeTypes:
          type: array
          items:
            type: string
          description: The list of secondary MIME types.
        primaryMimeTypes:
          type: array
          items:
            type: string
          description: The list of primary MIME types.
        authorized:
          description: Whether the app is authorized to access data on the user's Drive.
          type: boolean
        shortDescription:
          description: A short description of the app.
          type: string
        icons:
          description: The various icons for the app.
          type: array
          items:
            $ref: '#/components/schemas/AppIcons'
        secondaryFileExtensions:
          type: array
          items:
            type: string
          description: The list of secondary file extensions.
        kind:
          default: drive#app
          type: string
          description: >-
            Output only. Identifies what kind of resource this is. Value: the
            fixed string "drive#app".
        openUrlTemplate:
          description: >-
            The template URL for opening files with this app. The template
            contains {ids} or {exportIds} to be replaced by the actual file IDs.
            For more information, see Open Files for the full documentation.
          type: string
        createInFolderTemplate:
          description: >-
            The template URL to create a file with this app in a given folder.
            The template contains the {folderId} to be replaced by the folder ID
            house the new file.
          type: string
        productId:
          description: The ID of the product listing for this app.
          type: string
        installed:
          description: Whether the app is installed.
          type: boolean
        longDescription:
          description: A long description of the app.
          type: string
        hasDriveWideScope:
          description: >-
            Whether the app has Drive-wide scope. An app with Drive-wide scope
            can access all files in the user's Drive.
          type: boolean
        objectType:
          description: >-
            The type of object this app creates such as a Chart. If empty, the
            app name should be used instead.
          type: string
      id: App
      description: >-
        The `apps` resource provides a list of apps that a user has installed,
        with information about each app's supported MIME types, file extensions,
        and other details. Some resource methods (such as `apps.get`) require an
        `appId`. Use the `apps.list` method to retrieve the ID for an installed
        application.
      type: object
    DownloadRestrictionsMetadata:
      properties:
        itemDownloadRestriction:
          description: >-
            The download restriction of the file applied directly by the owner
            or organizer. This doesn't take into account shared drive settings
            or DLP rules.
          $ref: '#/components/schemas/DownloadRestriction'
        effectiveDownloadRestrictionWithContext:
          description: >-
            Output only. The effective download restriction applied to this
            file. This considers all restriction settings and DLP rules.
          $ref: '#/components/schemas/DownloadRestriction'
      id: DownloadRestrictionsMetadata
      description: Download restrictions applied to the file.
      type: object
    GeneratedIds:
      id: GeneratedIds
      description: A list of generated file IDs which can be provided in create requests.
      properties:
        ids:
          description: The IDs generated for the requesting user in the specified space.
          type: array
          items:
            type: string
        space:
          description: The type of file that can be created with these IDs.
          type: string
        kind:
          type: string
          default: drive#generatedIds
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#generatedIds"`.
      type: object
    FileList:
      properties:
        kind:
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#fileList"`.
          type: string
          default: drive#fileList
        incompleteSearch:
          description: >-
            Whether the search process was incomplete. If true, then some search
            results might be missing, since all documents were not searched.
            This can occur when searching multiple drives with the `allDrives`
            corpora, but all corpora couldn't be searched. When this happens,
            it's suggested that clients narrow their query by choosing a
            different corpus such as `user` or `drive`.
          type: boolean
        files:
          description: >-
            The list of files. If `nextPageToken` is populated, then this list
            may be incomplete and an additional page of results should be
            fetched.
          type: array
          items:
            $ref: '#/components/schemas/File'
        nextPageToken:
          description: >-
            The page token for the next page of files. This will be absent if
            the end of the files list has been reached. If the token is rejected
            for any reason, it should be discarded, and pagination should be
            restarted from the first page of results. The page token is
            typically valid for several hours. However, if new items are added
            or removed, your expected results might differ.
          type: string
      id: FileList
      description: A list of files.
      type: object
    ReplaceReviewer:
      properties:
        addedReviewerEmail:
          description: Required. The email of the reviewer to add.
          type: string
        removedReviewerEmail:
          description: Required. The email of the reviewer to remove.
          type: string
      id: ReplaceReviewer
      description: Representation of a reviewer replacement.
      type: object
    Drive:
      id: Drive
      description: >-
        Representation of a shared drive. Some resource methods (such as
        `drives.update`) require a `driveId`. Use the `drives.list` method to
        retrieve the ID for a shared drive.
      properties:
        backgroundImageLink:
          description: >-
            Output only. A short-lived link to this shared drive's background
            image.
          type: string
        createdTime:
          type: string
          description: The time at which the shared drive was created (RFC 3339 date-time).
          format: date-time
        colorRgb:
          description: >-
            The color of this shared drive as an RGB hex string. It can only be
            set on a `drive.drives.update` request that does not set `themeId`.
          type: string
        capabilities:
          type: object
          properties:
            canDeleteDrive:
              description: >-
                Output only. Whether the current user can delete this shared
                drive. Attempting to delete the shared drive may still fail if
                there are untrashed items inside the shared drive.
              type: boolean
            canChangeCopyRequiresWriterPermissionRestriction:
              description: >-
                Output only. Whether the current user can change the
                `copyRequiresWriterPermission` restriction of this shared drive.
              type: boolean
            canManageMembers:
              description: >-
                Output only. Whether the current user can add members to this
                shared drive or remove them or change their role.
              type: boolean
            canRenameDrive:
              description: >-
                Output only. Whether the current user can rename this shared
                drive.
              type: boolean
            canChangeDriveMembersOnlyRestriction:
              description: >-
                Output only. Whether the current user can change the
                `driveMembersOnly` restriction of this shared drive.
              type: boolean
            canAddChildren:
              description: >-
                Output only. Whether the current user can add children to
                folders in this shared drive.
              type: boolean
            canEdit:
              description: >-
                Output only. Whether the current user can edit files in this
                shared drive
              type: boolean
            canTrashChildren:
              description: >-
                Output only. Whether the current user can trash children from
                folders in this shared drive.
              type: boolean
            canResetDriveRestrictions:
              description: >-
                Output only. Whether the current user can reset the shared drive
                restrictions to defaults.
              type: boolean
            canDownload:
              description: >-
                Output only. Whether the current user can download files in this
                shared drive.
              type: boolean
            canChangeDownloadRestriction:
              description: >-
                Output only. Whether the current user can change
                organizer-applied download restrictions of this shared drive.
              type: boolean
            canListChildren:
              description: >-
                Output only. Whether the current user can list the children of
                folders in this shared drive.
              type: boolean
            canChangeDomainUsersOnlyRestriction:
              description: >-
                Output only. Whether the current user can change the
                `domainUsersOnly` restriction of this shared drive.
              type: boolean
            canReadRevisions:
              description: >-
                Output only. Whether the current user can read the revisions
                resource of files in this shared drive.
              type: boolean
            canRename:
              description: >-
                Output only. Whether the current user can rename files or
                folders in this shared drive.
              type: boolean
            canCopy:
              description: >-
                Output only. Whether the current user can copy files in this
                shared drive.
              type: boolean
            canShare:
              description: >-
                Output only. Whether the current user can share files or folders
                in this shared drive.
              type: boolean
            canDeleteChildren:
              description: >-
                Output only. Whether the current user can delete children from
                folders in this shared drive.
              type: boolean
            canChangeDriveBackground:
              description: >-
                Output only. Whether the current user can change the background
                of this shared drive.
              type: boolean
            canChangeSharingFoldersRequiresOrganizerPermissionRestriction:
              description: >-
                Output only. Whether the current user can change the
                `sharingFoldersRequiresOrganizerPermission` restriction of this
                shared drive.
              type: boolean
            canComment:
              description: >-
                Output only. Whether the current user can comment on files in
                this shared drive.
              type: boolean
          description: Output only. Capabilities the current user has on this shared drive.
        name:
          description: The name of this shared drive.
          type: string
        restrictions:
          description: >-
            A set of restrictions that apply to this shared drive or items
            inside this shared drive. Note that restrictions can't be set when
            creating a shared drive. To add a restriction, first create a shared
            drive and then use `drives.update` to add restrictions.
          properties:
            downloadRestriction:
              description: Download restrictions applied by shared drive managers.
              $ref: '#/components/schemas/DownloadRestriction'
            copyRequiresWriterPermission:
              description: >-
                Whether the options to copy, print, or download files inside
                this shared drive, should be disabled for readers and
                commenters. When this restriction is set to `true`, it will
                override the similarly named field to `true` for any file inside
                this shared drive.
              type: boolean
            sharingFoldersRequiresOrganizerPermission:
              description: >-
                If true, only users with the organizer role can share folders.
                If false, users with either the organizer role or the file
                organizer role can share folders.
              type: boolean
            adminManagedRestrictions:
              description: >-
                Whether administrative privileges on this shared drive are
                required to modify restrictions.
              type: boolean
            driveMembersOnly:
              description: >-
                Whether access to items inside this shared drive is restricted
                to its members.
              type: boolean
            domainUsersOnly:
              description: >-
                Whether access to this shared drive and items inside this shared
                drive is restricted to users of the domain to which this shared
                drive belongs. This restriction may be overridden by other
                sharing policies controlled outside of this shared drive.
              type: boolean
          type: object
        themeId:
          description: >-
            The ID of the theme from which the background image and color will
            be set. The set of possible `driveThemes` can be retrieved from a
            `drive.about.get` response. When not specified on a
            `drive.drives.create` request, a random theme is chosen from which
            the background image and color are set. This is a write-only field;
            it can only be set on requests that don't set `colorRgb` or
            `backgroundImageFile`.
          type: string
        kind:
          description: >-
            Output only. Identifies what kind of resource this is. Value: the
            fixed string `"drive#drive"`.
          default: drive#drive
          type: string
        hidden:
          description: Whether the shared drive is hidden from default view.
          type: boolean
        orgUnitId:
          description: >-
            Output only. The organizational unit of this shared drive. This
            field is only populated on `drives.list` responses when the
            `useDomainAdminAccess` parameter is set to `true`.
          type: string
        id:
          description: >-
            Output only. The ID of this shared drive which is also the ID of the
            top level folder of this shared drive.
          type: string
        backgroundImageFile:
          description: >-
            An image file and cropping parameters from which a background image
            for this shared drive is set. This is a write only field; it can
            only be set on `drive.drives.update` requests that don't set
            `themeId`. When specified, all fields of the `backgroundImageFile`
            must be set.
          properties:
            width:
              type: number
              description: >-
                The width of the cropped image in the closed range of 0 to 1.
                This value represents the width of the cropped image divided by
                the width of the entire image. The height is computed by
                applying a width to height aspect ratio of 80 to 9. The
                resulting image must be at least 1280 pixels wide and 144 pixels
                high.
              format: float
            id:
              description: >-
                The ID of an image file in Google Drive to use for the
                background image.
              type: string
            yCoordinate:
              description: >-
                The Y coordinate of the upper left corner of the cropping area
                in the background image. This is a value in the closed range of
                0 to 1. This value represents the vertical distance from the top
                side of the entire image to the top side of the cropping area
                divided by the height of the entire image.
              format: float
              type: number
            xCoordinate:
              type: number
              description: >-
                The X coordinate of the upper left corner of the cropping area
                in the background image. This is a value in the closed range of
                0 to 1. This value represents the horizontal distance from the
                left side of the entire image to the left side of the cropping
                area divided by the width of the entire image.
              format: float
          type: object
      type: object
  parameters:
