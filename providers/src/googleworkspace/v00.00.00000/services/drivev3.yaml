openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Google Drive API
  description: The Google Drive API allows clients to access resources from Google Drive.
  version: v3
  x-discovery-doc-revision: '20260723'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://developers.google.com/workspace/drive/
servers:
  - url: https://www.googleapis.com/drive/v3
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/drive.meet.readonly: >-
              See and download your Google Drive files that were created or
              edited by Google Meet.
            https://www.googleapis.com/auth/drive.photos.readonly: View the photos, videos and albums in your Google Photos
            https://www.googleapis.com/auth/drive.metadata: View and manage metadata of files in your Google Drive
            https://www.googleapis.com/auth/drive.metadata.readonly: See information about your Google Drive files
            https://www.googleapis.com/auth/drive: See, edit, create, and delete all of your Google Drive files
            https://www.googleapis.com/auth/drive.scripts: Modify your Google Apps Script scripts' behavior
            https://www.googleapis.com/auth/drive.apps.readonly: View your Google Drive apps
            https://www.googleapis.com/auth/drive.file: >-
              See, edit, create, and delete only the specific Google Drive files
              you use with this app
            https://www.googleapis.com/auth/drive.appdata: >-
              See, create, and delete its own configuration data in your Google
              Drive
            https://www.googleapis.com/auth/drive.readonly: See and download all your Google Drive files
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    AppIcons:
      type: object
      properties:
        iconUrl:
          description: URL for the icon.
          type: string
        size:
          type: integer
          description: >-
            Size of the icon. Represented as the maximum of the width and
            height.
          format: int32
        category:
          description: >-
            Category of the icon. Allowed values are: * `application` - The icon
            for the application. * `document` - The icon for a file associated
            with the app. * `documentShared` - The icon for a shared file
            associated with the app.
          type: string
      id: AppIcons
    Status:
      type: object
      id: Status
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      properties:
        details:
          type: array
          items:
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
            type: object
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
    Approval:
      properties:
        targetFileId:
          description: Target file id of the approval.
          type: string
        status:
          enumDescriptions:
            - >-
              The approval status has not been set or was set to an invalid
              value.
            - The approval process has started and not finished.
            - The approval process is finished and the target was approved.
            - The approval process was cancelled before it finished.
            - The approval process is finished and the target was declined.
          enum:
            - STATUS_UNSPECIFIED
            - IN_PROGRESS
            - APPROVED
            - CANCELLED
            - DECLINED
          readOnly: true
          type: string
          description: >-
            Output only. The status of the approval at the time this resource
            was requested.
        initiator:
          description: The user that requested the approval.
          $ref: '#/components/schemas/User'
        dueTime:
          type: string
          description: The time that the approval is due.
          format: google-datetime
        fileContentChangeBehavior:
          type: string
          description: >-
            Output only. The behavior of the approval when the file content
            changes.
          enumDescriptions:
            - The behavior is unspecified.
            - >-
              Any ReviewerResponse with a Response of APPROVED will be reset to
              NO_DECISION when the file content changes while the approval has a
              Status of IN_PROGRESS. When the approval has a Status of APPROVED
              and RESET_APPROVAL is selected, the file is locked.
            - No action is taken when the file content changes.
          enum:
            - FILE_CONTENT_CHANGE_BEHAVIOR_UNSPECIFIED
            - RESET_APPROVAL
            - NO_APPROVAL_ACTION
          readOnly: true
        reviewerResponses:
          type: array
          items:
            $ref: '#/components/schemas/ReviewerResponse'
          description: The responses made on the approval by reviewers.
        createTime:
          description: Output only. The time the approval was created.
          readOnly: true
          format: google-datetime
          type: string
        completeTime:
          description: Output only. The time the approval was completed.
          readOnly: true
          format: google-datetime
          type: string
        approvalId:
          description: The approval ID.
          type: string
        kind:
          description: This is always drive#approval.
          type: string
        modifyTime:
          description: Output only. The most recent time the approval was modified.
          readOnly: true
          format: google-datetime
          type: string
      id: Approval
      description: >-
        Metadata for an approval. An approval is a review or approve process for
        a Drive item.
      type: object
    ResolveAccessProposalRequest:
      type: object
      properties:
        role:
          description: >-
            Optional. The roles that the approver has allowed, if any. For more
            information, see [Roles and
            permissions](https://developers.google.com/workspace/drive/api/guides/ref-roles).
            Note: This field is required for the `ACCEPT` action.
          type: array
          items:
            type: string
        view:
          description: >-
            Optional. Indicates the view for this access proposal. This should
            only be set when the proposal belongs to a view. Only `published` is
            supported.
          type: string
        action:
          description: Required. The action to take on the access proposal.
          enumDescriptions:
            - Unspecified action
            - >-
              The user accepts the access proposal. Note: If this action is
              used, the `role` field must have at least one value.
            - The user denies the access proposal.
          enum:
            - ACTION_UNSPECIFIED
            - ACCEPT
            - DENY
          type: string
        sendNotification:
          description: >-
            Optional. Whether to send an email to the requester when the access
            proposal is denied or accepted.
          type: boolean
      id: ResolveAccessProposalRequest
      description: Request message for resolving an AccessProposal on a file.
    ApprovalList:
      id: ApprovalList
      description: The response of an approvals list request.
      properties:
        kind:
          description: This is always drive#approvalList
          type: string
        items:
          description: >-
            The list of approvals. If `nextPageToken` is populated, then this
            list may be incomplete and an additional page of results should be
            fetched.
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        nextPageToken:
          description: >-
            The page token for the next page of approvals. This is absent if the
            end of the approvals list has been reached. If the token is rejected
            for any reason, it should be discarded, and pagination should be
            restarted from the first page of results.
          type: string
      type: object
    User:
      type: object
      properties:
        emailAddress:
          type: string
          description: >-
            Output only. The email address of the user. This may not be present
            in certain contexts if the user has not made their email address
            visible to the requester.
          readOnly: true
        permissionId:
          description: Output only. The user's ID as visible in Permission resources.
          readOnly: true
          type: string
        photoLink:
          type: string
          description: Output only. A link to the user's profile photo, if available.
          readOnly: true
        displayName:
          type: string
          description: Output only. A plain text displayable name for this user.
          readOnly: true
        kind:
          default: drive#user
          type: string
          description: >-
            Output only. Identifies what kind of resource this is. Value: the
            fixed string `drive#user`.
          readOnly: true
        me:
          description: Output only. Whether this user is the requesting user.
          readOnly: true
          type: boolean
      id: User
      description: Information about a Drive user.
    ModifyLabelsResponse:
      type: object
      id: ModifyLabelsResponse
      description: >-
        Response to a `ModifyLabels` request. This contains only those labels
        which were added or updated by the request.
      properties:
        modifiedLabels:
          description: The list of labels which were added or updated by the request.
          type: array
          items:
            $ref: '#/components/schemas/Label'
        kind:
          description: This is always `"drive#modifyLabelsResponse"`.
          type: string
    RevisionList:
      id: RevisionList
      description: A list of revisions of a file.
      properties:
        nextPageToken:
          description: >-
            The page token for the next page of revisions. This will be absent
            if the end of the revisions list has been reached. If the token is
            rejected for any reason, it should be discarded, and pagination
            should be restarted from the first page of results. The page token
            is typically valid for several hours. However, if new items are
            added or removed, your expected results might differ.
          type: string
        revisions:
          description: >-
            The list of revisions. If nextPageToken is populated, then this list
            may be incomplete and an additional page of results should be
            fetched.
          type: array
          items:
            $ref: '#/components/schemas/Revision'
        kind:
          default: drive#revisionList
          type: string
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#revisionList"`.
      type: object
    Operation:
      properties:
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        response:
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
      id: Operation
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      type: object
    File:
      type: object
      id: File
      description: >-
        The metadata for a file. Some resource methods (such as `files.update`)
        require a `fileId`. Use the `files.list` method to retrieve the ID for a
        file.
      properties:
        kind:
          description: >-
            Output only. Identifies what kind of resource this is. Value: the
            fixed string `"drive#file"`.
          type: string
          default: drive#file
        sharingUser:
          description: >-
            Output only. The user who shared the file with the requesting user,
            if applicable.
          $ref: '#/components/schemas/User'
        thumbnailLink:
          description: >-
            Output only. A short-lived link to the file's thumbnail, if
            available. Typically lasts on the order of hours. Not intended for
            direct usage on web applications due to [Cross-Origin Resource
            Sharing
            (CORS)](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS)
            policies. Consider using a proxy server. Only populated when the
            requesting app can access the file's content. If the file isn't
            shared publicly, the URL returned in `files.thumbnailLink` must be
            fetched using a credentialed request.
          type: string
        viewedByMeTime:
          description: The last time the file was viewed by the user (RFC 3339 date-time).
          format: date-time
          type: string
        webViewLink:
          description: >-
            Output only. A link for opening the file in a relevant Google editor
            or viewer in a browser.
          type: string
        modifiedByMeTime:
          type: string
          description: >-
            The last time the file was modified by the user (RFC 3339
            date-time).
          format: date-time
        fullFileExtension:
          description: >-
            Output only. The full file extension extracted from the `name`
            field. May contain multiple concatenated extensions, such as
            "tar.gz". This is only available for files with binary content in
            Google Drive. This is automatically updated when the `name` field
            changes, however it's not cleared if the new name doesn't contain a
            valid extension.
          type: string
        trashingUser:
          description: >-
            Output only. If the file has been explicitly trashed, the user who
            trashed it. Only populated for items in shared drives.
          $ref: '#/components/schemas/User'
        size:
          type: string
          description: >-
            Output only. Size in bytes of blobs and Google Workspace editor
            files. Won't be populated for files that have no size, like
            shortcuts and folders.
          format: int64
        trashed:
          description: >-
            Whether the file has been trashed, either explicitly or from a
            trashed parent folder. Only the owner may trash a file, but other
            users can still access the file in the owner's trash until it's
            permanently deleted.
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: >-
            Output only. The full list of permissions for the file. This is only
            available if the requesting user can share the file. Not populated
            for items in shared drives.
        videoMediaMetadata:
          properties:
            height:
              type: integer
              description: Output only. The height of the video in pixels.
              format: int32
            durationMillis:
              description: Output only. The duration of the video in milliseconds.
              format: int64
              type: string
            width:
              description: Output only. The width of the video in pixels.
              format: int32
              type: integer
          description: >-
            Output only. Additional metadata about video media. This may not be
            available immediately upon upload.
          type: object
        id:
          description: The ID of the file.
          type: string
        isAppAuthorized:
          description: >-
            Output only. Whether the file was created or opened by the
            requesting app.
          type: boolean
        contentRestrictions:
          type: array
          items:
            $ref: '#/components/schemas/ContentRestriction'
          description: >-
            Restrictions for accessing the content of the file. Only populated
            if such a restriction exists.
        shared:
          description: >-
            Output only. Whether the file has been shared. Not populated for
            items in shared drives.
          type: boolean
        lastModifyingUser:
          description: >-
            Output only. The last user to modify the file. This field is only
            populated when the last modification was performed by a signed-in
            user.
          $ref: '#/components/schemas/User'
        sha256Checksum:
          description: >-
            Output only. The SHA256 checksum associated with this file, if
            available. This field is only populated for files with content
            stored in Google Drive; it's not populated for Docs Editors or
            shortcut files.
          type: string
        iconLink:
          description: Output only. A static, unauthenticated link to the file's icon.
          type: string
        properties:
          description: >-
            A collection of arbitrary key-value pairs which are visible to all
            apps.

            Entries with null values are cleared in update and copy requests.
          type: object
          additionalProperties:
            type: string
        driveId:
          description: >-
            Output only. ID of the shared drive the file resides in. Only
            populated for items in shared drives.
          type: string
        parents:
          type: array
          items:
            type: string
          description: >-
            The ID of the parent folder containing the file. A file can only
            have one parent folder; specifying multiple parents isn't supported.
            If not specified as part of a create request, the file is placed
            directly in the user's My Drive folder. If not specified as part of
            a copy request, the file inherits any discoverable parent of the
            source file. Update requests must use the `addParents` and
            `removeParents` parameters to modify the parents list.
        inheritedPermissionsDisabled:
          description: >-
            Whether this file has inherited permissions disabled. Inherited
            permissions are enabled by default.
          type: boolean
        starred:
          description: Whether the user has starred the file.
          type: boolean
        version:
          description: >-
            Output only. A monotonically increasing version number for the file.
            This reflects every change made to the file on the server, even
            those not visible to the user.
          format: int64
          type: string
        trashedTime:
          type: string
          description: >-
            The time that the item was trashed (RFC 3339 date-time). Only
            populated for items in shared drives.
          format: date-time
        contentHints:
          properties:
            indexableText:
              description: >-
                Text to be indexed for the file to improve fullText queries.
                This is limited to 128 KB in length and may contain HTML
                elements.
              type: string
            thumbnail:
              description: >-
                A thumbnail for the file. This will only be used if Google Drive
                cannot generate a standard thumbnail.
              properties:
                image:
                  type: string
                  description: >-
                    The thumbnail data encoded with URL-safe Base64 ([RFC 4648
                    section
                    5](https://datatracker.ietf.org/doc/html/rfc4648#section-5)).
                  format: byte
                mimeType:
                  description: The MIME type of the thumbnail.
                  type: string
              type: object
          description: >-
            Additional information about the content of the file. These fields
            are never populated in responses.
          type: object
        quotaBytesUsed:
          description: >-
            Output only. The number of storage quota bytes used by the file.
            This includes the head revision as well as previous revisions with
            `keepForever` enabled.
          format: int64
          type: string
        clientEncryptionDetails:
          description: >-
            Client Side Encryption related details. Contains details about the
            encryption state of the file and details regarding the encryption
            mechanism that clients need to use when decrypting the contents of
            this item. This will only be present on files and not on folders or
            shortcuts.
          $ref: '#/components/schemas/ClientEncryptionDetails'
        hasThumbnail:
          description: >-
            Output only. Whether this file has a thumbnail. This doesn't
            indicate whether the requesting app has access to the thumbnail. To
            check access, look for the presence of the thumbnailLink field.
          type: boolean
        copyRequiresWriterPermission:
          description: >-
            Whether the options to copy, print, or download this file should be
            disabled for readers and commenters.
          type: boolean
        headRevisionId:
          description: >-
            Output only. The ID of the file's head revision. This is currently
            only available for files with binary content in Google Drive.
          type: string
        sha1Checksum:
          description: >-
            Output only. The SHA1 checksum associated with this file, if
            available. This field is only populated for files with content
            stored in Google Drive; it's not populated for Docs Editors or
            shortcut files.
          type: string
        explicitlyTrashed:
          description: >-
            Output only. Whether the file has been explicitly trashed, as
            opposed to recursively trashed from a parent folder.
          type: boolean
        createdTime:
          description: The time at which the file was created (RFC 3339 date-time).
          format: date-time
          type: string
        permissionIds:
          type: array
          items:
            type: string
          description: >-
            Output only. List of permission IDs for users with access to this
            file.
        md5Checksum:
          description: >-
            Output only. The MD5 checksum for the content of the file. This is
            only applicable to files with binary content in Google Drive.
          type: string
        ownedByMe:
          description: >-
            Output only. Whether the user owns the file. Not populated for items
            in shared drives.
          type: boolean
        imageMediaMetadata:
          type: object
          description: Output only. Additional metadata about image media, if available.
          properties:
            sensor:
              description: Output only. The type of sensor used to create the photo.
              type: string
            rotation:
              description: >-
                Output only. The number of clockwise 90 degree rotations applied
                from the image's original orientation.
              format: int32
              type: integer
            cameraModel:
              description: Output only. The model of the camera used to create the photo.
              type: string
            exposureBias:
              description: Output only. The exposure bias of the photo (APEX value).
              format: float
              type: number
            time:
              description: >-
                Output only. The date and time the photo was taken (EXIF
                DateTime).
              type: string
            focalLength:
              description: >-
                Output only. The focal length used to create the photo, in
                millimeters.
              format: float
              type: number
            location:
              properties:
                altitude:
                  type: number
                  description: Output only. The altitude stored in the image.
                  format: double
                latitude:
                  description: Output only. The latitude stored in the image.
                  format: double
                  type: number
                longitude:
                  type: number
                  description: Output only. The longitude stored in the image.
                  format: double
              description: >-
                Output only. Geographic location information stored in the
                image.
              type: object
            flashUsed:
              description: Output only. Whether a flash was used to create the photo.
              type: boolean
            meteringMode:
              description: Output only. The metering mode used to create the photo.
              type: string
            exposureTime:
              description: Output only. The length of the exposure, in seconds.
              format: float
              type: number
            aperture:
              description: Output only. The aperture used to create the photo (f-number).
              format: float
              type: number
            exposureMode:
              description: Output only. The exposure mode used to create the photo.
              type: string
            isoSpeed:
              type: integer
              description: Output only. The ISO speed used to create the photo.
              format: int32
            maxApertureValue:
              type: number
              description: >-
                Output only. The smallest f-number of the lens at the focal
                length used to create the photo (APEX value).
              format: float
            width:
              description: Output only. The width of the image in pixels.
              format: int32
              type: integer
            subjectDistance:
              type: integer
              description: >-
                Output only. The distance to the subject of the photo, in
                meters.
              format: int32
            lens:
              description: Output only. The lens used to create the photo.
              type: string
            cameraMake:
              description: Output only. The make of the camera used to create the photo.
              type: string
            colorSpace:
              description: Output only. The color space of the photo.
              type: string
            whiteBalance:
              description: Output only. The white balance mode used to create the photo.
              type: string
            height:
              description: Output only. The height of the image in pixels.
              format: int32
              type: integer
        hasAugmentedPermissions:
          description: >-
            Output only. Whether there are permissions directly on this file.
            This field is only populated for items in shared drives.
          type: boolean
        modifiedByMe:
          description: Output only. Whether the file has been modified by this user.
          type: boolean
        labelInfo:
          type: object
          description: Label information on the file.
          properties:
            labels:
              type: array
              items:
                $ref: '#/components/schemas/Label'
              description: >-
                Output only. The set of labels on the file as requested by the
                label IDs in the `includeLabels` parameter. By default, no
                labels are returned.
        linkShareMetadata:
          description: >-
            Contains details about the link URLs that clients are using to refer
            to this item.
          properties:
            securityUpdateEligible:
              description: Output only. Whether the file is eligible for security update.
              type: boolean
            securityUpdateEnabled:
              description: >-
                Output only. Whether the security update is enabled for this
                file.
              type: boolean
          type: object
        downloadRestrictions:
          description: Download restrictions applied on the file.
          $ref: '#/components/schemas/DownloadRestrictionsMetadata'
        originalFilename:
          description: >-
            The original filename of the uploaded content if available, or else
            the original value of the `name` field. This is only available for
            files with binary content in Google Drive.
          type: string
        teamDriveId:
          type: string
          deprecated: true
          description: 'Deprecated: Output only. Use `driveId` instead.'
        sharedWithMeTime:
          description: >-
            The time at which the file was shared with the user, if applicable
            (RFC 3339 date-time).
          format: date-time
          type: string
        owners:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: >-
            Output only. The owner of this file. Only certain legacy files may
            have more than one owner. This field isn't populated for items in
            shared drives.
        writersCanShare:
          description: >-
            Whether users with only `writer` permission can modify the file's
            permissions. Not populated for items in shared drives.
          type: boolean
        shortcutDetails:
          description: Information about a shortcut file.
          properties:
            targetId:
              description: >-
                The ID of the file that this shortcut points to. Can only be set
                on `files.create` requests.
              type: string
            targetMimeType:
              description: >-
                Output only. The MIME type of the file that this shortcut points
                to. The value of this field is a snapshot of the target's MIME
                type, captured when the shortcut is created.
              type: string
            targetResourceKey:
              description: Output only. The `resourceKey` for the target file.
              type: string
          type: object
        exportLinks:
          description: >-
            Output only. Links for exporting Docs Editors files to specific
            formats.
          readOnly: true
          type: object
          additionalProperties:
            type: string
        description:
          description: A short description of the file.
          type: string
        mimeType:
          description: >-
            The MIME type of the file. Google Drive attempts to automatically
            detect an appropriate value from uploaded content, if no value is
            provided. The value cannot be changed unless a new revision is
            uploaded. If a file is created with a Google Doc MIME type, the
            uploaded content is imported, if possible. The supported import
            formats are published in the
            [`about`](/workspace/drive/api/reference/rest/v3/about) resource.
          type: string
        webContentLink:
          description: >-
            Output only. A link for downloading the content of the file in a
            browser. This is only available for files with binary content in
            Google Drive.
          type: string
        capabilities:
          type: object
          properties:
            canTrash:
              description: >-
                Output only. Whether the current user can move this file to
                trash.
              type: boolean
            canChangeViewersCanCopyContent:
              type: boolean
              deprecated: true
              description: 'Deprecated: Output only.'
            canAddMyDriveParent:
              description: >-
                Output only. Whether the current user can add a parent for the
                item without removing an existing parent in the same request.
                Not populated for shared drive files.
              type: boolean
            canChangeSecurityUpdateEnabled:
              description: >-
                Output only. Whether the current user can change the
                `securityUpdateEnabled` field on link share metadata.
              type: boolean
            canRemoveMyDriveParent:
              description: >-
                Output only. Whether the current user can remove a parent from
                the item without adding another parent in the same request. Not
                populated for shared drive files.
              type: boolean
            canComment:
              description: Output only. Whether the current user can comment on this file.
              type: boolean
            canModifyContentRestriction:
              type: boolean
              deprecated: true
              description: >-
                Deprecated: Output only. Use one of
                `canModifyEditorContentRestriction`,
                `canModifyOwnerContentRestriction`, or
                `canRemoveContentRestriction`.
            canModifyLabels:
              description: >-
                Output only. Whether the current user can modify the labels on
                the file.
              type: boolean
            canReadRevisions:
              description: >-
                Output only. Whether the current user can read the revisions
                resource of this file. For a shared drive item, whether
                revisions of non-folder descendants of this item, or this item
                if it's not a folder, can be read.
              type: boolean
            canMoveChildrenOutOfTeamDrive:
              type: boolean
              description: >-
                Deprecated: Output only. Use `canMoveChildrenOutOfDrive`
                instead.
              deprecated: true
            canShare:
              description: >-
                Output only. Whether the current user can modify the sharing
                settings for this file.
              type: boolean
            canRemoveChildren:
              description: >-
                Output only. Whether the current user can remove children from
                this folder. This is always `false` when the item isn't a
                folder. For a folder in a shared drive, use `canDeleteChildren`
                or `canTrashChildren` instead.
              type: boolean
            canMoveTeamDriveItem:
              type: boolean
              description: >-
                Deprecated: Output only. Use `canMoveItemWithinDrive` or
                `canMoveItemOutOfDrive` instead.
              deprecated: true
            canModifyContent:
              description: >-
                Output only. Whether the current user can modify the content of
                this file.
              type: boolean
            canModifyOwnerContentRestriction:
              description: >-
                Output only. Whether the current user can add or modify content
                restrictions which are owner restricted.
              type: boolean
            canMoveItemOutOfTeamDrive:
              type: boolean
              description: 'Deprecated: Output only. Use `canMoveItemOutOfDrive` instead.'
              deprecated: true
            canReadTeamDrive:
              deprecated: true
              description: 'Deprecated: Output only. Use `canReadDrive` instead.'
              type: boolean
            canDisableInheritedPermissions:
              description: Whether a user can disable inherited permissions.
              type: boolean
            canAcceptOwnership:
              description: >-
                Output only. Whether the current user is the pending owner of
                the file. Not populated for shared drive files.
              type: boolean
            canMoveChildrenWithinTeamDrive:
              description: >-
                Deprecated: Output only. Use `canMoveChildrenWithinDrive`
                instead.
              deprecated: true
              type: boolean
            canMoveItemWithinTeamDrive:
              description: 'Deprecated: Output only. Use `canMoveItemWithinDrive` instead.'
              deprecated: true
              type: boolean
            canAddChildren:
              description: >-
                Output only. Whether the current user can add children to this
                folder. This is always `false` when the item isn't a folder.
              type: boolean
            canMoveItemIntoTeamDrive:
              type: boolean
              description: 'Deprecated: Output only. Use `canMoveItemOutOfDrive` instead.'
              deprecated: true
            canStartApproval:
              description: Whether the current user can start an approval on the file.
              type: boolean
            canEdit:
              description: >-
                Output only. Whether the current user can edit this file. Other
                factors may limit the type of changes a user can make to a file.
                For example, see `canChangeCopyRequiresWriterPermission` or
                `canModifyContent`.
              type: boolean
            canModifyEditorContentRestriction:
              description: >-
                Output only. Whether the current user can add or modify content
                restrictions on the file which are editor restricted.
              type: boolean
            canReadLabels:
              description: >-
                Output only. Whether the current user can read the labels on the
                file.
              type: boolean
            canChangeItemDownloadRestriction:
              description: >-
                Output only. Whether the current user can change the owner or
                organizer-applied download restrictions of the file.
              type: boolean
            canAddFolderFromAnotherDrive:
              description: >-
                Output only. Whether the current user can add a folder from
                another drive (different shared drive or My Drive) to this
                folder. This is `false` when the item isn't a folder. Only
                populated for items in shared drives.
              type: boolean
            canUntrash:
              description: >-
                Output only. Whether the current user can restore this file from
                trash.
              type: boolean
            canDelete:
              description: Output only. Whether the current user can delete this file.
              type: boolean
            canAccessViaGenAi:
              description: >-
                Whether the current user can access this file via Gen AI
                features. For more information, see [Drive MCP file
                eligibility](https://developers.google.com/workspace/drive/api/guides/drive-mcp-server-file-eligibility).
              type: boolean
            canRename:
              description: Output only. Whether the current user can rename this file.
              type: boolean
            canMoveItemWithinDrive:
              description: >-
                Output only. Whether the current user can move this item within
                this drive. Note that a request to change the parent of the item
                may still fail depending on the new parent that's being added
                and the parent that is being removed.
              type: boolean
            canCopy:
              description: >-
                Output only. Whether the current user can copy this file. For an
                item in a shared drive, whether the current user can copy
                non-folder descendants of this item, or this item if it's not a
                folder.
              type: boolean
            canDeleteChildren:
              description: >-
                Output only. Whether the current user can delete children of
                this folder. This is `false` when the item isn't a folder. Only
                populated for items in shared drives.
              type: boolean
            canMoveChildrenWithinDrive:
              description: >-
                Output only. Whether the current user can move children of this
                folder within this drive. This is `false` when the item isn't a
                folder. Note that a request to move the child may still fail
                depending on the current user's access to the child and to the
                destination folder.
              type: boolean
            canDownload:
              description: Output only. Whether the current user can download this file.
              type: boolean
            canEnableInheritedPermissions:
              description: Whether a user can re-enable inherited permissions.
              type: boolean
            canRemoveContentRestriction:
              description: >-
                Output only. Whether there's a content restriction on the file
                that can be removed by the current user.
              type: boolean
            canReadDrive:
              description: >-
                Output only. Whether the current user can read the shared drive
                to which this file belongs. Only populated for items in shared
                drives.
              type: boolean
            canListChildren:
              description: >-
                Output only. Whether the current user can list the children of
                this folder. This is always `false` when the item isn't a
                folder.
              type: boolean
            canChangeCopyRequiresWriterPermission:
              description: >-
                Output only. Whether the current user can change the
                `copyRequiresWriterPermission` restriction of this file.
              type: boolean
            canMoveChildrenOutOfDrive:
              description: >-
                Output only. Whether the current user can move children of this
                folder outside of the shared drive. This is `false` when the
                item isn't a folder. Only populated for items in shared drives.
              type: boolean
            canTrashChildren:
              description: >-
                Output only. Whether the current user can trash children of this
                folder. This is `false` when the item isn't a folder. Only
                populated for items in shared drives.
              type: boolean
            canMoveItemOutOfDrive:
              description: >-
                Output only. Whether the current user can move this item outside
                of this drive by changing its parent. Note that a request to
                change the parent of the item may still fail depending on the
                new parent that's being added.
              type: boolean
          description: >-
            Output only. Capabilities the current user has on this file. Each
            capability corresponds to a fine-grained action that a user may
            take. For more information, see [Understand file
            capabilities](https://developers.google.com/workspace/drive/api/guides/manage-sharing#capabilities).
        viewedByMe:
          description: Output only. Whether the file has been viewed by this user.
          type: boolean
        spaces:
          description: >-
            Output only. The list of spaces which contain the file. The
            currently supported values are `drive`, `appDataFolder`, and
            `photos`.
          type: array
          items:
            type: string
        appProperties:
          type: object
          additionalProperties:
            type: string
          description: >-
            A collection of arbitrary key-value pairs which are private to the
            requesting app.

            Entries with null values are cleared in update and copy requests.
            These properties can only be retrieved using an authenticated
            request. An authenticated request uses an access token obtained with
            a OAuth 2 client ID. You cannot use an API key to retrieve private
            properties.
        folderColorRgb:
          description: >-
            The color for a folder or a shortcut to a folder as an RGB hex
            string. The supported colors are published in the
            `folderColorPalette` field of the
            [`about`](/workspace/drive/api/reference/rest/v3/about) resource. If
            an unsupported color is specified, the closest color in the palette
            is used instead.
          type: string
        thumbnailVersion:
          type: string
          description: >-
            Output only. The thumbnail version for use in thumbnail cache
            invalidation.
          format: int64
        resourceKey:
          description: Output only. A key needed to access the item via a shared link.
          type: string
        fileExtension:
          description: >-
            Output only. The final component of `fullFileExtension`. This is
            only available for files with binary content in Google Drive.
          type: string
        viewersCanCopyContent:
          description: 'Deprecated: Use `copyRequiresWriterPermission` instead.'
          deprecated: true
          type: boolean
        modifiedTime:
          description: >-
            he last time the file was modified by anyone (RFC 3339 date-time).
            Note that setting modifiedTime will also update modifiedByMeTime for
            the user.
          format: date-time
          type: string
        name:
          description: >-
            The name of the file. This isn't necessarily unique within a folder.
            Note that for immutable items such as the top-level folders of
            shared drives, the My Drive root folder, and the Application Data
            folder, the name is constant.
          type: string
    AccessProposalRoleAndView:
      type: object
      id: AccessProposalRoleAndView
      description: >-
        A wrapper for the role and view of an access proposal. For more
        information, see [Roles and
        permissions](https://developers.google.com/workspace/drive/api/guides/ref-roles).
      properties:
        role:
          description: >-
            The role that was proposed by the requester. The supported values
            are: * `writer` * `commenter` * `reader`
          type: string
        view:
          description: >-
            Indicates the view for this access proposal. Only populated for
            proposals that belong to a view. Only `published` is supported.
          type: string
    DeclineApprovalRequest:
      type: object
      id: DeclineApprovalRequest
      description: Request for declining an approval as a reviewer.
      properties:
        message:
          description: >-
            Optional. A message to accompany the reviewer response on the
            approval. This message is included in notifications for the action
            and in the approval activity log.
          type: string
    GenerateCseTokenResponse:
      properties:
        currentKaclsName:
          description: Name of the KACLs that the returned KACLs ID points to.
          type: string
        fileId:
          description: The fileId for which the JWT was generated.
          type: string
        jwt:
          description: The signed JSON Web Token (JWT) for the file.
          type: string
        currentKaclsId:
          description: The current Key ACL Service (KACLS) ID associated with the JWT.
          format: int64
          type: string
        kind:
          description: >-
            Output only. Identifies what kind of resource this is. Value: the
            fixed string `"drive#generateCseTokenResponse"`.
          type: string
      id: GenerateCseTokenResponse
      description: JWT and associated metadata used to generate CSE files.
      type: object
    ReplyList:
      type: object
      properties:
        kind:
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#replyList"`.
          default: drive#replyList
          type: string
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Reply'
          description: >-
            The list of replies. If `nextPageToken` is populated, then this list
            may be incomplete and an additional page of results should be
            fetched.
        nextPageToken:
          description: >-
            The page token for the next page of replies. This will be absent if
            the end of the replies list has been reached. If the token is
            rejected for any reason, it should be discarded, and pagination
            should be restarted from the first page of results. The page token
            is typically valid for several hours. However, if new items are
            added or removed, your expected results might differ.
          type: string
      id: ReplyList
      description: A list of replies to a comment on a file.
    ListAccessProposalsResponse:
      type: object
      properties:
        accessProposals:
          type: array
          items:
            $ref: '#/components/schemas/AccessProposal'
          description: >-
            The list of access proposals. This field is only populated in Drive
            API v3.
        nextPageToken:
          description: >-
            The continuation token for the next page of results. This will be
            absent if the end of the results list has been reached. If the token
            is rejected for any reason, it should be discarded, and pagination
            should be restarted from the first page of results.
          type: string
      id: ListAccessProposalsResponse
      description: The response to an access proposal list request.
    TeamDrive:
      type: object
      properties:
        id:
          description: >-
            The ID of this Team Drive which is also the ID of the top level
            folder of this Team Drive.
          type: string
        backgroundImageFile:
          properties:
            xCoordinate:
              type: number
              description: >-
                The X coordinate of the upper left corner of the cropping area
                in the background image. This is a value in the closed range of
                0 to 1. This value represents the horizontal distance from the
                left side of the entire image to the left side of the cropping
                area divided by the width of the entire image.
              format: float
            id:
              description: >-
                The ID of an image file in Drive to use for the background
                image.
              type: string
            yCoordinate:
              description: >-
                The Y coordinate of the upper left corner of the cropping area
                in the background image. This is a value in the closed range of
                0 to 1. This value represents the vertical distance from the top
                side of the entire image to the top side of the cropping area
                divided by the height of the entire image.
              format: float
              type: number
            width:
              type: number
              description: >-
                The width of the cropped image in the closed range of 0 to 1.
                This value represents the width of the cropped image divided by
                the width of the entire image. The height is computed by
                applying a width to height aspect ratio of 80 to 9. The
                resulting image must be at least 1280 pixels wide and 144 pixels
                high.
              format: float
          description: The background image file for a Team Drive.
          type: object
        orgUnitId:
          description: >-
            The organizational unit of this shared drive. This field is only
            populated on `drives.list` responses when the `useDomainAdminAccess`
            parameter is set to `true`.
          type: string
        kind:
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#teamDrive"`.
          default: drive#teamDrive
          type: string
        themeId:
          description: >-
            The ID of the theme from which the background image and color will
            be set. The set of possible `teamDriveThemes` can be retrieved from
            a `drive.about.get` response. When not specified on a
            `drive.teamdrives.create` request, a random theme is chosen from
            which the background image and color are set. This is a write-only
            field; it can only be set on requests that don't set `colorRgb` or
            `backgroundImageFile`.
          type: string
        restrictions:
          description: >-
            A set of restrictions that apply to this Team Drive or items inside
            this Team Drive.
          properties:
            domainUsersOnly:
              description: >-
                Whether access to this Team Drive and items inside this Team
                Drive is restricted to users of the domain to which this Team
                Drive belongs. This restriction may be overridden by other
                sharing policies controlled outside of this Team Drive.
              type: boolean
            teamMembersOnly:
              description: >-
                Whether access to items inside this Team Drive is restricted to
                members of this Team Drive.
              type: boolean
            adminManagedRestrictions:
              description: >-
                Whether administrative privileges on this Team Drive are
                required to modify restrictions.
              type: boolean
            copyRequiresWriterPermission:
              description: >-
                Whether the options to copy, print, or download files inside
                this Team Drive, should be disabled for readers and commenters.
                When this restriction is set to `true`, it will override the
                similarly named field to `true` for any file inside this Team
                Drive.
              type: boolean
            sharingFoldersRequiresOrganizerPermission:
              description: >-
                If true, only users with the organizer role can share folders.
                If false, users with either the organizer role or the file
                organizer role can share folders.
              type: boolean
            downloadRestriction:
              description: Download restrictions applied by shared drive managers.
              $ref: '#/components/schemas/DownloadRestriction'
          type: object
        name:
          description: The name of this Team Drive.
          type: string
        capabilities:
          type: object
          properties:
            canChangeSharingFoldersRequiresOrganizerPermissionRestriction:
              description: >-
                Whether the current user can change the
                `sharingFoldersRequiresOrganizerPermission` restriction of this
                Team Drive.
              type: boolean
            canComment:
              description: >-
                Whether the current user can comment on files in this Team
                Drive.
              type: boolean
            canResetTeamDriveRestrictions:
              description: >-
                Whether the current user can reset the Team Drive restrictions
                to defaults.
              type: boolean
            canCopy:
              description: Whether the current user can copy files in this Team Drive.
              type: boolean
            canShare:
              description: >-
                Whether the current user can share files or folders in this Team
                Drive.
              type: boolean
            canDeleteChildren:
              description: >-
                Whether the current user can delete children from folders in
                this Team Drive.
              type: boolean
            canRename:
              description: >-
                Whether the current user can rename files or folders in this
                Team Drive.
              type: boolean
            canReadRevisions:
              description: >-
                Whether the current user can read the revisions resource of
                files in this Team Drive.
              type: boolean
            canChangeTeamMembersOnlyRestriction:
              description: >-
                Whether the current user can change the `teamMembersOnly`
                restriction of this Team Drive.
              type: boolean
            canListChildren:
              description: >-
                Whether the current user can list the children of folders in
                this Team Drive.
              type: boolean
            canChangeDomainUsersOnlyRestriction:
              description: >-
                Whether the current user can change the `domainUsersOnly`
                restriction of this Team Drive.
              type: boolean
            canChangeDownloadRestriction:
              description: >-
                Output only. Whether the current user can change
                organizer-applied download restrictions of this shared drive.
              readOnly: true
              type: boolean
            canRenameTeamDrive:
              description: Whether the current user can rename this Team Drive.
              type: boolean
            canDeleteTeamDrive:
              description: >-
                Whether the current user can delete this Team Drive. Attempting
                to delete the Team Drive may still fail if there are untrashed
                items inside the Team Drive.
              type: boolean
            canDownload:
              description: Whether the current user can download files in this Team Drive.
              type: boolean
            canChangeTeamDriveBackground:
              description: >-
                Whether the current user can change the background of this Team
                Drive.
              type: boolean
            canRemoveChildren:
              type: boolean
              description: >-
                Deprecated: Use `canDeleteChildren` or `canTrashChildren`
                instead.
              deprecated: true
            canEdit:
              description: Whether the current user can edit files in this Team Drive
              type: boolean
            canTrashChildren:
              description: >-
                Whether the current user can trash children from folders in this
                Team Drive.
              type: boolean
            canAddChildren:
              description: >-
                Whether the current user can add children to folders in this
                Team Drive.
              type: boolean
            canManageMembers:
              description: >-
                Whether the current user can add members to this Team Drive or
                remove them or change their role.
              type: boolean
            canChangeCopyRequiresWriterPermissionRestriction:
              description: >-
                Whether the current user can change the
                `copyRequiresWriterPermission` restriction of this Team Drive.
              type: boolean
          description: Capabilities the current user has on this Team Drive.
        colorRgb:
          description: >-
            The color of this Team Drive as an RGB hex string. It can only be
            set on a `drive.teamdrives.update` request that does not set
            `themeId`.
          type: string
        backgroundImageLink:
          description: A short-lived link to this Team Drive's background image.
          type: string
        createdTime:
          type: string
          description: The time at which the Team Drive was created (RFC 3339 date-time).
          format: date-time
      id: TeamDrive
      description: 'Deprecated: use the drive collection instead. Next ID: 33'
    CommentApprovalRequest:
      type: object
      id: CommentApprovalRequest
      description: Request for commenting on an approval.
      properties:
        message:
          description: >-
            Required. A message to comment on the approval. This message is
            included in notifications for the action and in the approval
            activity log.
          type: string
    CancelApprovalRequest:
      properties:
        message:
          description: >-
            Optional. A message to accompany the cancellation of the approval.
            This message is included in notifications for the action and in the
            approval activity log.
          type: string
      id: CancelApprovalRequest
      description: Request for cancelling an approval as an initiator.
      type: object
    AppList:
      id: AppList
      description: >-
        A list of third-party applications which the user has installed or given
        access to Google Drive.
      properties:
        kind:
          description: >-
            Output only. Identifies what kind of resource this is. Value: the
            fixed string "drive#appList".
          type: string
          default: drive#appList
        selfLink:
          description: A link back to this list.
          type: string
        items:
          description: The list of apps.
          type: array
          items:
            $ref: '#/components/schemas/App'
        defaultAppIds:
          type: array
          items:
            type: string
          description: >-
            The list of app IDs that the user has specified to use by default.
            The list is in reverse-priority order (lowest to highest).
      type: object
    LabelField:
      type: object
      properties:
        selection:
          description: Only present if `valueType` is `selection`
          type: array
          items:
            type: string
        valueType:
          description: >-
            The field type. While new values may be supported in the future, the
            following are currently allowed: * `dateString` * `integer` *
            `selection` * `text` * `user`
          type: string
        text:
          description: Only present if `valueType` is `text`.
          type: array
          items:
            type: string
        user:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: Only present if `valueType` is `user`.
        kind:
          description: This is always drive#labelField.
          type: string
        id:
          description: The identifier of this label field.
          type: string
        integer:
          description: Only present if `valueType` is `integer`.
          type: array
          items:
            type: string
            format: int64
        dateString:
          description: >-
            Only present if valueType is dateString. RFC 3339 formatted date:
            YYYY-MM-DD.
          type: array
          items:
            type: string
            format: date
      id: LabelField
      description: Representation of field, which is a typed key-value pair.
    ReassignApprovalRequest:
      properties:
        replaceReviewers:
          type: array
          items:
            $ref: '#/components/schemas/ReplaceReviewer'
          description: Optional. The list of reviewer replacements.
        message:
          description: >-
            Optional. A message to send to the new reviewers. This message is
            included in notifications for the action and in the approval
            activity log.
          type: string
        addReviewers:
          type: array
          items:
            $ref: '#/components/schemas/AddReviewer'
          description: Optional. The list of reviewers to add.
      id: ReassignApprovalRequest
      description: >-
        Request for reassigning an approval. Reviewers can be added or replaced,
        but not removed.
      type: object
    About:
      id: About
      description: Information about the user, the user's Drive, and system capabilities.
      properties:
        storageQuota:
          properties:
            usageInDriveTrash:
              description: The usage by trashed files in Google Drive.
              format: int64
              type: string
            usage:
              type: string
              description: >-
                The total usage across all services. For users that are part of
                an organization with pooled storage, this is the usage across
                all services for the organization, rather than the individual
                user.
              format: int64
            limit:
              description: >-
                The usage limit, if applicable. This will not be present if the
                user has unlimited storage. For users that are part of an
                organization with pooled storage, this is the limit for the
                organization, rather than the individual user.
              format: int64
              type: string
            usageInDrive:
              type: string
              description: The usage by all files in Google Drive.
              format: int64
          description: >-
            The user's storage quota limits and usage. For users that are part
            of an organization with pooled storage, information about the limit
            and usage across all services is for the organization, rather than
            the individual user. All fields are measured in bytes.
          type: object
        appInstalled:
          description: Whether the user has installed the requesting app.
          type: boolean
        maxUploadSize:
          type: string
          description: The maximum upload size in bytes.
          format: int64
        folderColorPalette:
          description: The currently supported folder colors as RGB hex strings.
          type: array
          items:
            type: string
        maxImportSizes:
          description: A map of maximum import sizes by MIME type, in bytes.
          additionalProperties:
            type: string
            format: int64
          type: object
        teamDriveThemes:
          type: array
          items:
            type: object
            properties:
              backgroundImageLink:
                description: 'Deprecated: Use `driveThemes/backgroundImageLink` instead.'
                deprecated: true
                type: string
              colorRgb:
                description: 'Deprecated: Use `driveThemes/colorRgb` instead.'
                deprecated: true
                type: string
              id:
                deprecated: true
                description: 'Deprecated: Use `driveThemes/id` instead.'
                type: string
          description: 'Deprecated: Use `driveThemes` instead.'
          deprecated: true
        driveThemes:
          description: A list of themes that are supported for shared drives.
          type: array
          items:
            type: object
            properties:
              backgroundImageLink:
                description: A link to this theme's background image.
                type: string
              colorRgb:
                description: The color of this theme as an RGB hex string.
                type: string
              id:
                description: The ID of the theme.
                type: string
        canCreateDrives:
          description: Whether the user can create shared drives.
          type: boolean
        importFormats:
          additionalProperties:
            type: array
            items:
              type: string
          type: object
          description: >-
            A map of source MIME type to possible targets for all supported
            imports.
        user:
          description: The authenticated user.
          $ref: '#/components/schemas/User'
        kind:
          type: string
          default: drive#about
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#about"`.
        canCreateTeamDrives:
          type: boolean
          description: 'Deprecated: Use `canCreateDrives` instead.'
          deprecated: true
        exportFormats:
          description: >-
            A map of source MIME type to possible targets for all supported
            exports.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      type: object
    TeamDriveList:
      type: object
      id: TeamDriveList
      description: A list of Team Drives.
      properties:
        nextPageToken:
          description: >-
            The page token for the next page of Team Drives. This will be absent
            if the end of the Team Drives list has been reached. If the token is
            rejected for any reason, it should be discarded, and pagination
            should be restarted from the first page of results. The page token
            is typically valid for several hours. However, if new items are
            added or removed, your expected results might differ.
          type: string
        teamDrives:
          type: array
          items:
            $ref: '#/components/schemas/TeamDrive'
          description: >-
            The list of Team Drives. If nextPageToken is populated, then this
            list may be incomplete and an additional page of results should be
            fetched.
        kind:
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#teamDriveList"`.
          type: string
          default: drive#teamDriveList
    Channel:
      properties:
        token:
          description: >-
            An arbitrary string delivered to the target address with each
            notification delivered over this channel. Optional.
          type: string
        params:
          type: object
          additionalProperties:
            type: string
          description: >-
            Additional parameters controlling delivery channel behavior.
            Optional.
        address:
          description: The address where notifications are delivered for this channel.
          type: string
        payload:
          description: A Boolean value to indicate whether payload is wanted. Optional.
          type: boolean
        resourceId:
          description: >-
            An opaque ID that identifies the resource being watched on this
            channel. Stable across different API versions.
          type: string
        id:
          description: A UUID or similar unique string that identifies this channel.
          type: string
        kind:
          default: api#channel
          type: string
          description: >-
            Identifies this as a notification channel used to watch for changes
            to a resource, which is `api#channel`.
        type:
          description: >-
            The type of delivery mechanism used for this channel. Valid values
            are "web_hook" or "webhook".
          type: string
        resourceUri:
          description: A version-specific identifier for the watched resource.
          type: string
        expiration:
          description: >-
            Date and time of notification channel expiration, expressed as a
            Unix timestamp, in milliseconds. Optional.
          format: int64
          type: string
      id: Channel
      description: A notification channel used to watch for resource changes.
      type: object
    ChangeList:
      id: ChangeList
      description: A list of changes for a user.
      properties:
        kind:
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#changeList"`.
          type: string
          default: drive#changeList
        newStartPageToken:
          description: >-
            The starting page token for future changes. This will be present
            only if the end of the current changes list has been reached. The
            page token doesn't expire.
          type: string
        changes:
          description: >-
            The list of changes. If nextPageToken is populated, then this list
            may be incomplete and an additional page of results should be
            fetched.
          type: array
          items:
            $ref: '#/components/schemas/Change'
        nextPageToken:
          description: >-
            The page token for the next page of changes. This will be absent if
            the end of the changes list has been reached. The page token doesn't
            expire.
          type: string
      type: object
    ModifyLabelsRequest:
      id: ModifyLabelsRequest
      description: >-
        A request to modify the set of labels on a file. This request may
        contain many modifications that will either all succeed or all fail
        atomically.
      properties:
        labelModifications:
          description: The list of modifications to apply to the labels on the file.
          type: array
          items:
            $ref: '#/components/schemas/LabelModification'
        kind:
          description: This is always `"drive#modifyLabelsRequest"`.
          type: string
      type: object
    LabelModification:
      id: LabelModification
      description: >-
        A modification to a label on a file. A `LabelModification` can be used
        to apply a label to a file, update an existing label on a file, or
        remove a label from a file.
      properties:
        labelId:
          annotations:
            required:
              - drive.files.modifyLabels
          type: string
          description: The ID of the label to modify.
        fieldModifications:
          description: The list of modifications to this label's fields.
          type: array
          items:
            $ref: '#/components/schemas/LabelFieldModification'
        removeLabel:
          description: If true, the label will be removed from the file.
          type: boolean
        kind:
          description: This is always `"drive#labelModification"`.
          type: string
      type: object
    StartPageToken:
      type: object
      id: StartPageToken
      properties:
        startPageToken:
          description: >-
            The starting page token for listing future changes. The page token
            doesn't expire.
          type: string
        kind:
          type: string
          default: drive#startPageToken
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#startPageToken"`.
    DecryptionMetadata:
      properties:
        jwt:
          description: >-
            The signed JSON Web Token (JWT) which can be used to authorize the
            requesting user with the Key ACL Service (KACLS). The JWT asserts
            that the requesting user has at least read permissions on the file.
          type: string
        wrappedKey:
          description: >-
            The URL-safe Base64 encoded wrapped key used to encrypt the contents
            of the file.
          type: string
        kaclsName:
          description: The name of the KACLS (Key ACL Service) used to encrypt the file.
          type: string
        aes256GcmChunkSize:
          description: >-
            Chunk size used if content was encrypted with the AES 256 GCM
            Cipher. Possible values are: - default - small 
          type: string
        encryptionResourceKeyHash:
          description: >-
            The URL-safe Base64 encoded HMAC-SHA256 digest of the resource
            metadata with its DEK (Data Encryption Key); see
            https://developers.google.com/workspace/cse/reference
          type: string
        kaclsId:
          type: string
          description: The ID of the KACLS (Key ACL Service) used to encrypt the file.
          format: int64
        keyFormat:
          description: Key format for the unwrapped key. Must be `tinkAesGcmKey`.
          type: string
      id: DecryptionMetadata
      description: Representation of the CSE DecryptionMetadata.
      type: object
    ClientEncryptionDetails:
      id: ClientEncryptionDetails
      description: Details about the client-side encryption applied to the file.
      properties:
        encryptionState:
          description: >-
            The encryption state of the file. The values expected here are: -
            encrypted - unencrypted 
          type: string
        decryptionMetadata:
          description: The metadata used for client-side operations.
          $ref: '#/components/schemas/DecryptionMetadata'
      type: object
    LabelList:
      id: LabelList
      description: A list of labels applied to a file.
      properties:
        kind:
          description: This is always `"drive#labelList"`.
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
          description: The list of labels.
        nextPageToken:
          description: >-
            The page token for the next page of labels. This field will be
            absent if the end of the list has been reached. If the token is
            rejected for any reason, it should be discarded, and pagination
            should be restarted from the first page of results. The page token
            is typically valid for several hours. However, if new items are
            added or removed, your expected results might differ.
          type: string
      type: object
    AddReviewer:
      type: object
      id: AddReviewer
      description: Representation of a reviewer addition.
      properties:
        addedReviewerEmail:
          description: Required. The email of the reviewer to add.
          type: string
    ContentRestriction:
      type: object
      id: ContentRestriction
      description: A restriction for accessing the content of the file.
      properties:
        ownerRestricted:
          description: >-
            Whether the content restriction can only be modified or removed by a
            user who owns the file. For files in shared drives, any user with
            `organizer` capabilities can modify or remove this content
            restriction.
          type: boolean
        type:
          description: >-
            Output only. The type of the content restriction. Currently the only
            possible value is `globalContentRestriction`.
          type: string
        restrictingUser:
          description: >-
            Output only. The user who set the content restriction. Only
            populated if `readOnly=true`.
          $ref: '#/components/schemas/User'
        systemRestricted:
          description: >-
            Output only. Whether the content restriction was applied by the
            system, for example due to an esignature. Users cannot modify or
            remove system restricted content restrictions.
          type: boolean
        restrictionTime:
          type: string
          description: >-
            The time at which the content restriction was set (formatted RFC
            3339 timestamp). Only populated if readOnly is true.
          format: date-time
        reason:
          description: >-
            Reason for why the content of the file is restricted. This is only
            mutable on requests that also set `readOnly=true`.
          type: string
        readOnly:
          description: >-
            Whether the content of the file is read-only. If a file is
            read-only, a new revision of the file may not be added, comments may
            not be added or modified, and the title of the file may not be
            modified.
          type: boolean
    Reply:
      id: Reply
      description: >-
        A reply to a comment on a file. Some resource methods (such as
        `replies.update`) require a `replyId`. Use the `replies.list` method to
        retrieve the ID for a reply.
      properties:
        modifiedTime:
          description: The last time the reply was modified (RFC 3339 date-time).
          format: date-time
          type: string
        htmlContent:
          description: Output only. The content of the reply with HTML formatting.
          type: string
        createdTime:
          description: The time at which the reply was created (RFC 3339 date-time).
          format: date-time
          type: string
        assigneeEmailAddress:
          type: string
          description: >-
            Output only. The email address of the user assigned to this comment.
            If no user is assigned, the field is unset.
          readOnly: true
        content:
          annotations:
            required:
              - drive.replies.update
          type: string
          description: >-
            The plain text content of the reply. This field is used for setting
            the content, while `htmlContent` should be displayed. This field is
            required by the `create` method if no `action` value is specified.
        author:
          description: >-
            Output only. The author of the reply. The author's email address and
            permission ID won't be populated.
          $ref: '#/components/schemas/User'
        action:
          description: >-
            The action the reply performed to the parent comment. The supported
            values are: * `resolve` * `reopen`
          type: string
        id:
          description: Output only. The ID of the reply.
          type: string
        kind:
          default: drive#reply
          type: string
          description: >-
            Output only. Identifies what kind of resource this is. Value: the
            fixed string `"drive#reply"`.
        deleted:
          description: >-
            Output only. Whether the reply has been deleted. A deleted reply has
            no content.
          type: boolean
        mentionedEmailAddresses:
          type: array
          items:
            type: string
          description: >-
            Output only. A list of email addresses for users mentioned in this
            comment. If no users are mentioned, the list is empty.
          readOnly: true
      type: object
    DriveList:
      type: object
      properties:
        kind:
          type: string
          default: drive#driveList
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#driveList"`.
        drives:
          type: array
          items:
            $ref: '#/components/schemas/Drive'
          description: >-
            The list of shared drives. If nextPageToken is populated, then this
            list may be incomplete and an additional page of results should be
            fetched.
        nextPageToken:
          description: >-
            The page token for the next page of shared drives. This will be
            absent if the end of the list has been reached. If the token is
            rejected for any reason, it should be discarded, and pagination
            should be restarted from the first page of results. The page token
            is typically valid for several hours. However, if new items are
            added or removed, your expected results might differ.
          type: string
      id: DriveList
      description: A list of shared drives.
    PermissionList:
      properties:
        kind:
          type: string
          default: drive#permissionList
          description: >-
            Identifies what kind of resource this is. Value: the fixed string
            `"drive#permissionList"`.
        permissions:
          description: >-
            The list of permissions. If `nextPageToken` is populated, then this
            list may be incomplete and an additional page of results should be
            fetched.
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        nextPageToken:
          description: >-
            The page token for the next page of permissions. This field will be
            absent if the end of the permissions list has been reached. If the
            token is rejected for any reason, it should be discarded, and
            pagination should be restarted from the first page of results. The
            page token is typically valid for several hours. However, if new
            items are added or removed, your expected results might differ.
          type: string
      id: PermissionList
      description: A list of permissions for a file.
      type: object
    DownloadRestriction:
      type: object
      id: DownloadRestriction
      description: A restriction for copy and download of the file.
      properties:
        restrictedForReaders:
          description: Whether download and copy is restricted for readers.
          type: boolean
        restrictedForWriters:
          description: >-
            Whether download and copy is restricted for writers. If true,
            download is also restricted for readers.
          type: boolean
    ApproveApprovalRequest:
      properties:
        message:
          description: >-
            Optional. A message to accompany the reviewer response on the
            approval. This message is included in notifications for the action
            and in the approval activity log.
          type: string
      id: ApproveApprovalRequest
      description: Request for approving an approval as a reviewer.
      type: object
    Revision:
      type: object
      properties:
        lastModifyingUser:
          description: >-
            Output only. The last user to modify this revision. This field is
            only populated when the last modification was performed by a
            signed-in user.
          $ref: '#/components/schemas/User'
        originalFilename:
          description: >-
            Output only. The original filename used to create this revision.
            This is only applicable to files with binary content in Drive.
          type: string
        modifiedTime:
          type: string
          description: The last time the revision was modified (RFC 3339 date-time).
          format: date-time
        exportLinks:
          type: object
          additionalProperties:
            type: string
          description: >-
            Output only. Links for exporting Docs Editors files to specific
            formats.
        published:
          description: >-
            Whether this revision is published. This is only applicable to Docs
            Editors files.
          type: boolean
        id:
          description: Output only. The ID of the revision.
          type: string
        md5Checksum:
          description: >-
            Output only. The MD5 checksum of the revision's content. This is
            only applicable to files with binary content in Drive.
          type: string
        publishedOutsideDomain:
          description: >-
            Whether this revision is published outside the domain. This is only
            applicable to Docs Editors files.
          type: boolean
        publishAuto:
          description: >-
            Whether subsequent revisions will be automatically republished. This
            is only applicable to Docs Editors files.
          type: boolean
        size:
          description: >-
            Output only. The size of the revision's content in bytes. This is
            only applicable to files with binary content in Drive.
          format: int64
          type: string
        kind:
          type: string
          default: drive#revision
          description: >-
            Output only. Identifies what kind of resource this is. Value: the
            fixed string `"drive#revision"`.
        keepForever:
          description: >-
            Whether to keep this revision forever, even if it is no longer the
            head revision. If not set, the revision will be automatically purged
            30 days after newer content is uploaded. This can be set on a
            maximum of 200 revisions for a file. This field is only applicable
            to files with binary content in Drive.
          type: boolean
        mimeType:
          description: Output only. The MIME type of the revision.
          type: string
        publishedLink:
          description: >-
            Output only. A link to the published revision. This is only
            populated for Docs Editors files.
          type: string
      id: Revision
      description: >-
        The metadata for a revision to a file. Some resource methods (such as
        `revisions.update`) require a `revisionId`. Use the `revisions.list`
        method to retrieve the ID for a revision.
    ReviewerResponse:
      type: object
      properties:
        response:
          type: string
          enumDescriptions:
            - The response was set to an unrecognized value.
            - The reviewer hasn't responded.
            - The reviewer has approved the item.
            - The reviewer has declined the item.
          enum:
            - RESPONSE_UNSPECIFIED
            - NO_RESPONSE
            - APPROVED
            - DECLINED
          description: A reviewer’s response for the approval.
        kind:
          description: This is always drive#reviewerResponse.
          type: string
        reviewer:
          description: The user that's responsible for this response.
          $ref: '#/components/schemas/User'
      id: ReviewerResponse
      description: A response on an approval made by a specific reviewer.
    Label:
      properties:
        id:
          description: The ID of the label.
          type: string
        revisionId:
          description: The revision ID of the label.
          type: string
        fields:
          additionalProperties:
            $ref: '#/components/schemas/LabelField'
          type: object
          description: A map of the fields on the label, keyed by the field's ID.
        kind:
          description: This is always drive#label
          type: string
      id: Label
      description: Representation of label and label fields.
      type: object
    Comment:
      type: object
      id: Comment
      description: >-
        A comment on a file. Some resource methods (such as `comments.update`)
        require a `commentId`. Use the `comments.list` method to retrieve the ID
        for a comment in a file.
      properties:
        assigneeEmailAddress:
          description: >-
            Output only. The email address of the user assigned to this comment.
            If no user is assigned, the field is unset.
          readOnly: true
          type: string
        quotedFileContent:
          properties:
            mimeType:
              description: The MIME type of the quoted content.
              type: string
            value:
              description: >-
                The quoted content itself. This is interpreted as plain text if
                set through the API.
              type: string
          description: >-
            The file content to which the comment refers, typically within the
            anchor region. For a text file, for example, this would be the text
            at the location of the comment.
          type: object
        createdTime:
          description: The time at which the comment was created (RFC 3339 date-time).
          format: date-time
          type: string
        replies:
          description: >-
            Output only. The full list of replies to the comment in
            chronological order.
          type: array
          items:
            $ref: '#/components/schemas/Reply'
        deleted:
          description: >-
            Output only. Whether the comment has been deleted. A deleted comment
            has no content.
          type: boolean
        mentionedEmailAddresses:
          type: array
          items:
            type: string
          description: >-
            Output only. A list of email addresses for users mentioned in this
            comment. If no users are mentioned, the list is empty.
          readOnly: true
        kind:
          description: >-
            Output only. Identifies what kind of resource this is. Value: the
            fixed string `"drive#comment"`.
          type: string
          default: drive#comment
        htmlContent:
          description: Output only. The content of the comment with HTML formatting.
          type: string
        anchor:
          description: >-
            A region of the document represented as a JSON string. For details
            on defining anchor properties, refer to [Manage comments and
            replies](https://developers.google.com/workspace/drive/api/v3/manage-comments).
          type: string
        modifiedTime:
          type: string
          description: >-
            The last time the comment or any of its replies was modified (RFC
            3339 date-time).
          format: date-time
        resolved:
          description: >-
            Output only. Whether the comment has been resolved by one of its
            replies.
          type: boolean
        content:
          description: >-
            The plain text content of the comment. This field is used for
            setting the content, while `htmlContent` should be displayed.
          annotations:
            required:
              - drive.comments.create
              - drive.comments.update
          type: string
        id:
          description: Output only. The ID of the comment.
          type: string
        author:
          description: >-
            Output only. The author of the comment. The author's email address
            and permission ID will not be populated.
          $ref: '#/components/schemas/User'
    AccessProposal:
      id: AccessProposal
      description: Manage outstanding access proposals on a file.
