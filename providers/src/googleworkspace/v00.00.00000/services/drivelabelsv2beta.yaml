openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Drive Labels API
  description: An API for managing Drive Labels
  version: v2beta
  x-discovery-doc-revision: '20260728'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://developers.google.com/workspace/drive/labels
servers:
  - url: https://drivelabels.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/drive.admin.labels.readonly: >-
              See all Google Drive labels and label-related admin policies in
              your organization
            https://www.googleapis.com/auth/drive.labels: See, edit, create, and delete your Google Drive labels
            https://www.googleapis.com/auth/drive.admin.labels: >-
              See, edit, create, and delete all Google Drive labels in your
              organization, and see your organization's label-related admin
              policies
            https://www.googleapis.com/auth/drive.labels.readonly: See your Google Drive labels
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestEnableFieldRequest:
      description: Request to enable the field.
      id: GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestEnableFieldRequest
      type: object
      properties:
        id:
          type: string
          description: Required. ID of the field to enable.
    GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoice:
      description: Selection field choice.
      id: GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoice
      type: object
      properties:
        lockStatus:
          readOnly: true
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaLockStatus'
          description: Output only. The `LockStatus` of this choice.
        displayHints:
          description: Output only. UI display hints for rendering a choice.
          readOnly: true
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoiceDisplayHints
        schemaCapabilities:
          readOnly: true
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoiceSchemaCapabilities
          description: >-
            Output only. The capabilities related to this option when editing
            the option.
        appliedCapabilities:
          readOnly: true
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoiceAppliedCapabilities
          description: >-
            Output only. The capabilities related to this choice on applied
            metadata.
        id:
          type: string
          description: >-
            The unique value of the choice. This ID is autogenerated. Matches
            the regex: `([a-zA-Z0-9_])+`.
        publishTime:
          description: >-
            Output only. The time this choice was published. This value has no
            meaning when the choice is not published.
          type: string
          format: google-datetime
          readOnly: true
        disabler:
          description: >-
            Output only. The user who disabled this choice. This value has no
            meaning when the option is not disabled.
          readOnly: true
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaUserInfo'
        lifecycle:
          readOnly: true
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaLifecycle'
          description: Output only. Lifecycle of the choice.
        disableTime:
          type: string
          description: >-
            Output only. The time this choice was disabled. This value has no
            meaning when the choice is not disabled.
          readOnly: true
          format: google-datetime
        updater:
          description: Output only. The user who updated this choice last.
          readOnly: true
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaUserInfo'
        creator:
          description: Output only. The user who created this choice.
          readOnly: true
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaUserInfo'
        updateTime:
          description: Output only. The time this choice was updated last.
          type: string
          format: google-datetime
          readOnly: true
        createTime:
          type: string
          description: Output only. The time this choice was created.
          readOnly: true
          format: google-datetime
        properties:
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoiceProperties
          description: Basic properties of the choice.
        publisher:
          description: >-
            Output only. The user who published this choice. This value has no
            meaning when the choice is not published.
          readOnly: true
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaUserInfo'
    GoogleAppsDriveLabelsV2betaDeleteLabelPermissionRequest:
      properties:
        name:
          description: Required. Label permission resource name.
          type: string
        useAdminAccess:
          description: >-
            Set to `true` in order to use the user's admin credentials. The
            server will verify the user is an admin for the label before
            allowing access.
          type: boolean
      description: >-
        Deletes a label permission. Permissions affect the label resource as a
        whole, aren't revisioned, and don't require publishing.
      id: GoogleAppsDriveLabelsV2betaDeleteLabelPermissionRequest
      type: object
    GoogleAppsDriveLabelsV2betaEnableLabelRequest:
      id: GoogleAppsDriveLabelsV2betaEnableLabelRequest
      type: object
      description: Request to enable a label.
      properties:
        useAdminAccess:
          type: boolean
          description: >-
            Set to `true` in order to use the user's admin credentials. The
            server will verify the user is an admin for the label before
            allowing access.
        languageCode:
          description: >-
            The BCP-47 language code to use for evaluating localized field
            labels. When not specified, values in the default configured
            language will be used.
          type: string
        writeControl:
          description: >-
            Provides control over how write requests are executed. Defaults to
            unset, which means the last write wins.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaWriteControl'
    GoogleAppsDriveLabelsV2betaWriteControl:
      properties:
        requiredRevisionId:
          type: string
          description: >-
            The revision ID of the label that the write request will be applied
            to. If this isn't the latest revision of the label, the request will
            not be processed and will return a 400 Bad Request error.
      description: >-
        Provides control over how write requests are executed. When not
        specified, the last write wins.
      id: GoogleAppsDriveLabelsV2betaWriteControl
      type: object
    GoogleAppsDriveLabelsV2betaDisableLabelRequest:
      properties:
        writeControl:
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaWriteControl'
          description: >-
            Provides control over how write requests are executed. Defaults to
            unset, which means the last write wins.
        updateMask:
          type: string
          description: >-
            The fields that should be updated. At least one field must be
            specified. The root `disabled_policy` is implied and should not be
            specified. A single `*` can be used as a short-hand for updating
            every field.
          format: google-fieldmask
        disabledPolicy:
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2betaLifecycleDisabledPolicy
          description: Disabled policy to use.
        useAdminAccess:
          type: boolean
          description: >-
            Set to `true` in order to use the user's admin credentials. The
            server will verify the user is an admin for the label before
            allowing access.
        languageCode:
          type: string
          description: >-
            The BCP-47 language code to use for evaluating localized field
            labels. When not specified, values in the default configured
            language will be used.
      description: Request to deprecate a published label.
      id: GoogleAppsDriveLabelsV2betaDisableLabelRequest
      type: object
    GoogleAppsDriveLabelsV2betaBadgeColors:
      id: GoogleAppsDriveLabelsV2betaBadgeColors
      type: object
      description: >-
        The color derived from BadgeConfig and changed to the closest
        recommended supported color.
      properties:
        soloColor:
          description: Output only. Color that can be used for text without a background.
          readOnly: true
          $ref: '#/components/schemas/GoogleTypeColor'
        backgroundColor:
          readOnly: true
          $ref: '#/components/schemas/GoogleTypeColor'
          description: Output only. Badge background that pairs with the foreground.
        foregroundColor:
          description: Output only. Badge foreground that pairs with the background.
          readOnly: true
          $ref: '#/components/schemas/GoogleTypeColor'
    GoogleAppsDriveLabelsV2betaLabelLockCapabilities:
      properties:
        canViewPolicy:
          description: True if the user is authorized to view the policy.
          type: boolean
      id: GoogleAppsDriveLabelsV2betaLabelLockCapabilities
      type: object
      description: A description of a user's capabilities on a label lock.
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestDisableSelectionChoiceRequest:
      id: >-
        GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestDisableSelectionChoiceRequest
      type: object
      description: Request to disable a choice.
      properties:
        updateMask:
          format: google-fieldmask
          description: >-
            The fields that should be updated. At least one field must be
            specified. The root `disabled_policy` is implied and should not be
            specified. A single `*` can be used as a short-hand for updating
            every field.
          type: string
        fieldId:
          type: string
          description: Required. The selection field in which a choice will be disabled.
        id:
          description: Required. Choice to disable.
          type: string
        disabledPolicy:
          description: Required. The disabled policy to update.
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2betaLifecycleDisabledPolicy
    GoogleTypeDate:
      id: GoogleTypeDate
      type: object
      description: >-
        Represents a whole or partial calendar date, such as a birthday. The
        time of day and time zone are either specified elsewhere or are
        insignificant. The date is relative to the Gregorian Calendar. This can
        represent one of the following: * A full date, with non-zero year,
        month, and day values. * A month and day, with a zero year (for example,
        an anniversary). * A year on its own, with a zero month and a zero day.
        * A year and month, with a zero day (for example, a credit card
        expiration date). Related types: * google.type.TimeOfDay *
        google.type.DateTime * google.protobuf.Timestamp
      properties:
        year:
          format: int32
          description: >-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date
            without a year.
          type: integer
        day:
          format: int32
          type: integer
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0 to specify a year by itself or a year and month where
            the day isn't significant.
        month:
          type: integer
          description: >-
            Month of a year. Must be from 1 to 12, or 0 to specify a year
            without a month and day.
          format: int32
    GoogleAppsDriveLabelsV2betaListLimits:
      properties:
        maxEntries:
          format: int32
          description: Maximum number of values allowed for the field type.
          type: integer
      id: GoogleAppsDriveLabelsV2betaListLimits
      type: object
      description: Limits for list-variant of a field type.
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestUpdateFieldPropertiesRequest:
      description: Request to update field properties.
      id: >-
        GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestUpdateFieldPropertiesRequest
      type: object
      properties:
        updateMask:
          type: string
          description: >-
            The fields that should be updated. At least one field must be
            specified. The root `properties` is implied and should not be
            specified. A single `*` can be used as a short-hand for updating
            every field.
          format: google-fieldmask
        properties:
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaFieldProperties'
          description: Required. Basic field properties.
        id:
          type: string
          description: Required. The field to update.
    GoogleAppsDriveLabelsV2betaIntegerLimits:
      description: Limits for integer field type.
      id: GoogleAppsDriveLabelsV2betaIntegerLimits
      type: object
      properties:
        minValue:
          type: string
          description: Minimum value for an integer field type.
          format: int64
        maxValue:
          type: string
          description: Maximum value for an integer field type.
          format: int64
    GoogleAppsDriveLabelsV2betaUpdateLabelCopyModeRequest:
      description: >-
        Request to update the `CopyMode` of the given label. Changes to this
        policy aren't revisioned, don't require publishing, and take effect
        immediately. \
      id: GoogleAppsDriveLabelsV2betaUpdateLabelCopyModeRequest
      type: object
      properties:
        useAdminAccess:
          type: boolean
          description: >-
            Set to `true` in order to use the user's admin credentials. The
            server will verify the user is an admin for the label before
            allowing access.
        languageCode:
          type: string
          description: >-
            The BCP-47 language code to use for evaluating localized field
            labels. When not specified, values in the default configured
            language will be used.
        view:
          enumDescriptions:
            - >-
              Implies the field mask:
              `name,id,revision_id,label_type,properties.*`
            - All possible fields.
          enum:
            - LABEL_VIEW_BASIC
            - LABEL_VIEW_FULL
          description: >-
            When specified, only certain fields belonging to the indicated view
            will be returned.
          type: string
        copyMode:
          description: >-
            Required. Indicates how the applied label and field values should be
            copied when a Drive item is copied.
          type: string
          enumDescriptions:
            - Copy mode unspecified.
            - >-
              The applied label and field values aren't copied by default when
              the Drive item it's applied to is copied.
            - >-
              The applied label and field values are always copied when the
              Drive item it's applied to is copied. Only admins can use this
              mode.
            - >-
              The applied label and field values are copied if the label is
              appliable by the user making the copy.
          enum:
            - COPY_MODE_UNSPECIFIED
            - DO_NOT_COPY
            - ALWAYS_COPY
            - COPY_APPLIABLE
    GoogleAppsDriveLabelsV2betaBatchDeleteLabelPermissionsRequest:
      properties:
        requests:
          description: Required. The request message specifying the resources to update.
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleAppsDriveLabelsV2betaDeleteLabelPermissionRequest
        useAdminAccess:
          description: >-
            Set to `true` in order to use the user's admin credentials. The
            server will verify the user is an admin for the label before
            allowing access. If this is set, the `use_admin_access` field in the
            `DeleteLabelPermissionRequest` messages must either be empty or
            match this field.
          type: boolean
      id: GoogleAppsDriveLabelsV2betaBatchDeleteLabelPermissionsRequest
      type: object
      description: Deletes one or more label permissions.
    GoogleAppsDriveLabelsV2betaLabelPermission:
      properties:
        role:
          enumDescriptions:
            - Unknown role.
            - >-
              A reader can read the label and associated metadata applied to
              Drive items.
            - >-
              An applier can write associated metadata on Drive items in which
              they also have write access to. Implies `READER`.
            - >-
              An organizer can pin this label in shared drives they manage and
              add new appliers to the label.
            - >-
              Editors can make any update including deleting the label which
              also deletes the associated Drive item metadata. Implies
              `APPLIER`.
          enum:
            - LABEL_ROLE_UNSPECIFIED
            - READER
            - APPLIER
            - ORGANIZER
            - EDITOR
          description: The role the principal should have.
          type: string
        name:
          description: Resource name of this permission.
          type: string
        person:
          type: string
          description: Person resource name.
        audience:
          description: >-
            Audience to grant a role to. The magic value of `audiences/default`
            may be used to apply the role to the default audience in the context
            of the organization that owns the label.
          type: string
        email:
          type: string
          description: >-
            Specifies the email address for a user or group principal. Not
            populated for audience principals. User and group permissions may
            only be inserted using an email address. On update requests, if
            email address is specified, no principal should be specified.
        group:
          description: Group resource name.
          type: string
      id: GoogleAppsDriveLabelsV2betaLabelPermission
      type: object
      description: >-
        The permission that applies to a principal (user, group, audience) on a
        label.
    GoogleAppsDriveLabelsV2betaTextLimits:
      id: GoogleAppsDriveLabelsV2betaTextLimits
      type: object
      description: Limits for text field type.
      properties:
        minLength:
          description: Minimum length allowed for a text field type.
          type: integer
          format: int32
        maxLength:
          format: int32
          description: Maximum length allowed for a text field type.
          type: integer
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponse:
      id: GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponse
      type: object
      description: Response for label update.
      properties:
        responses:
          items:
            $ref: >-
              #/components/schemas/GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponseResponse
          description: >-
            The reply of the updates. This maps 1:1 with the updates, although
            responses to some requests may be empty.
          type: array
        updatedLabel:
          description: >-
            The label after updates were applied. This is only set if
            `include_label_in_response` is `true` and there were no errors.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaLabel'
    GoogleAppsDriveLabelsV2betaLabelSchemaCapabilities:
      properties:
        canUpdate:
          type: boolean
          description: Whether the user can change this label.
        canDelete:
          type: boolean
          description: >-
            Whether the user can delete this label. The user must have
            permission and the label must be disabled.
        canDisable:
          description: >-
            Whether the user can disable this label. The user must have
            permission and this label must not already be disabled.
          type: boolean
        canEnable:
          description: >-
            Whether the user can enable this label. The user must have
            permission and this label must be disabled.
          type: boolean
      description: The capabilities related to this label when editing the label.
      id: GoogleAppsDriveLabelsV2betaLabelSchemaCapabilities
      type: object
    GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoiceAppliedCapabilities:
      id: >-
        GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoiceAppliedCapabilities
      type: object
      description: The capabilities related to this choice on applied metadata.
      properties:
        canRead:
          description: Whether the user can read related applied metadata on items.
          type: boolean
        canSearch:
          description: Whether the user can use this choice in search queries.
          type: boolean
        canSelect:
          description: Whether the user can select this choice on an item.
          type: boolean
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestDeleteSelectionChoiceRequest:
      id: >-
        GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestDeleteSelectionChoiceRequest
      type: object
      description: Request to delete a choice.
      properties:
        id:
          description: Required. Choice to delete.
          type: string
        fieldId:
          type: string
          description: Required. The selection field from which a choice will be deleted.
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponseEnableSelectionChoiceResponse:
      properties: {}
      id: >-
        GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponseEnableSelectionChoiceResponse
      type: object
      description: Response following choice enable.
    GoogleAppsDriveLabelsV2betaListLabelPermissionsResponse:
      id: GoogleAppsDriveLabelsV2betaListLabelPermissionsResponse
      type: object
      description: Response for listing the permissions on a label.
      properties:
        nextPageToken:
          type: string
          description: The token of the next page in the response.
        labelPermissions:
          items:
            $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaLabelPermission'
          type: array
          description: Label permissions.
    GoogleAppsDriveLabelsV2betaLifecycleDisabledPolicy:
      properties:
        showInApply:
          description: >-
            Whether to show this disabled object in the apply menu on Drive
            items. * When `true`, the object is generally shown in the UI as
            disabled and is unselectable. * When `false`, the object is
            generally hidden in the UI.
          type: boolean
        hideInSearch:
          type: boolean
          description: >-
            Whether to hide this disabled object in the search menu for Drive
            items. * When `false`, the object is generally shown in the UI as
            disabled but it appears in the search results when searching for
            Drive items. * When `true`, the object is generally hidden in the UI
            when searching for Drive items.
      id: GoogleAppsDriveLabelsV2betaLifecycleDisabledPolicy
      type: object
      description: >-
        The policy that governs how to treat a disabled label, field, or
        selection choice in different contexts.
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequest:
      description: >-
        The set of requests for updating aspects of a label. If any request
        isn't valid, no requests will be applied.
      id: GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequest
      type: object
      properties:
        view:
          enumDescriptions:
            - >-
              Implies the field mask:
              `name,id,revision_id,label_type,properties.*`
            - All possible fields.
          enum:
            - LABEL_VIEW_BASIC
            - LABEL_VIEW_FULL
          description: >-
            When specified, only certain fields belonging to the indicated view
            will be returned.
          type: string
        requests:
          type: array
          description: >-
            A list of updates to apply to the label. Requests will be applied in
            the order they are specified.
          items:
            $ref: >-
              #/components/schemas/GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestRequest
        useAdminAccess:
          type: boolean
          description: >-
            Set to `true` in order to use the user's admin credentials. The
            server will verify the user is an admin for the label before
            allowing access.
        languageCode:
          description: >-
            The BCP-47 language code to use for evaluating localized field
            labels when `include_label_in_response` is `true`.
          type: string
        writeControl:
          description: Provides control over how write requests are executed.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaWriteControl'
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestCreateFieldRequest:
      properties:
        field:
          description: Required. Field to create.
          $ref: '#/components/schemas/GoogleAppsDriveLabelsV2betaField'
      description: Request to create a field within a label.
      id: GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestCreateFieldRequest
      type: object
    GoogleAppsDriveLabelsV2betaLockStatus:
      description: >-
        Contains information about whether a label component should be
        considered locked.
      id: GoogleAppsDriveLabelsV2betaLockStatus
      type: object
      properties:
        locked:
          type: boolean
          description: >-
            Output only. Indicates whether this label component is the (direct)
            target of a label lock. A label component can be implicitly locked
            even if it's not the direct target of a label lock, in which case
            this field is set to false.
          readOnly: true
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponseDeleteSelectionChoiceResponse:
      description: Response following choice delete.
      id: >-
        GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponseDeleteSelectionChoiceResponse
      type: object
      properties: {}
    GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoiceSchemaCapabilities:
      id: GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoiceSchemaCapabilities
      type: object
      description: The capabilities related to this choice when editing the choice.
      properties:
        canUpdate:
          type: boolean
          description: Whether the user can update this choice.
        canEnable:
          type: boolean
          description: Whether the user can enable this choice.
        canDelete:
          description: Whether the user can delete this choice.
          type: boolean
        canDisable:
          type: boolean
          description: Whether the user can disable this choice.
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponseDeleteFieldResponse:
      properties: {}
      description: Response following field delete.
      id: GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponseDeleteFieldResponse
      type: object
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponseUpdateFieldPropertiesResponse:
      properties:
        priority:
          format: int32
          description: >-
            The priority of the updated field. The priority may change from what
            was specified to assure contiguous priorities between fields (1-n).
          type: integer
      description: Response following update to field properties.
      id: >-
        GoogleAppsDriveLabelsV2betaDeltaUpdateLabelResponseUpdateFieldPropertiesResponse
      type: object
    GoogleAppsDriveLabelsV2betaUserCapabilities:
      properties:
        canCreateAdminLabels:
          type: boolean
          description: Output only. Whether the user is allowed to create admin labels.
          readOnly: true
        canAdministrateLabels:
          type: boolean
          description: >-
            Output only. Whether the user is an administrator for the shared
            labels feature.
          readOnly: true
        canCreateSharedLabels:
          type: boolean
          description: Output only. Whether the user is allowed to create shared labels.
          readOnly: true
        name:
          description: Output only. Resource name for the user capabilities.
          type: string
          readOnly: true
        canAccessLabelManager:
          readOnly: true
          type: boolean
          description: >-
            Output only. Whether the user is allowed access to the label
            manager.
      description: The capabilities of a user.
      id: GoogleAppsDriveLabelsV2betaUserCapabilities
      type: object
    GoogleAppsDriveLabelsV2betaFieldIntegerOptions:
      properties:
        minValue:
          readOnly: true
          format: int64
          type: string
          description: Output only. The minimum valid value for the integer field.
        maxValue:
          type: string
          description: Output only. The maximum valid value for the integer field.
          readOnly: true
          format: int64
      id: GoogleAppsDriveLabelsV2betaFieldIntegerOptions
      type: object
      description: Options for the Integer field type.
    GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestUpdateSelectionChoicePropertiesRequest:
      id: >-
        GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequestUpdateSelectionChoicePropertiesRequest
      type: object
      description: Request to update a choice property.
      properties:
        id:
          type: string
          description: Required. The choice to update.
        fieldId:
          type: string
          description: Required. The selection field to update.
        updateMask:
          format: google-fieldmask
          description: >-
            The fields that should be updated. At least one field must be
            specified. The root `properties` is implied and should not be
            specified. A single `*` can be used as a short-hand for updating
            every field.
          type: string
        properties:
          $ref: >-
            #/components/schemas/GoogleAppsDriveLabelsV2betaFieldSelectionOptionsChoiceProperties
          description: Required. The choice properties to update.
    GoogleAppsDriveLabelsV2betaFieldDateOptions:
      description: Options for the date field type.
      id: GoogleAppsDriveLabelsV2betaFieldDateOptions
      type: object
      properties:
