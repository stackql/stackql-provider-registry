  /v2beta/labels/{labelsId}:publish:
    parameters: *ref_1
    post:
      description: >-
        Publish all draft changes to the label. Once published, the label may
        not return to its draft state. For more information, see [Create and
        publish a
        label](https://developers.google.com/workspace/drive/labels/guides/create-label).
        Publishing a label will result in a new published revision. All previous
        draft revisions will be deleted. Previous published revisions will be
        kept but are subject to automated deletion as needed. For more
        information, see [Label
        lifecycle](https://developers.google.com/workspace/drive/labels/guides/label-lifecycle).
        Once published, some changes are no longer permitted. Generally, any
        change that would invalidate or cause new restrictions on existing
        metadata related to the label will be rejected. For example, the
        following changes to a label will be rejected after the label is
        published: * The label cannot be directly deleted. It must be disabled
        first, then deleted. * `Field.FieldType` cannot be changed. * Changes to
        field validation options cannot reject something that was previously
        accepted. * Reducing the maximum entries.
      operationId: drivelabels.labels.publish
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/GoogleAppsDriveLabelsV2betaPublishLabelRequest
