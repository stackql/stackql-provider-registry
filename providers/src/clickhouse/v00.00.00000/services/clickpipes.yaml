              type: string
              nullable: true
          type: object
        kinesis:
          properties:
            authentication:
              description: Authentication method to use with the Kinesis stream.
              type: string
              enum:
                - IAM_ROLE
                - IAM_USER
              nullable: true
            iamRole:
              description: IAM role to use for authentication. Required if IAM_ROLE is used.
              type: string
              example: arn:aws:iam::123456789012:role/MyRole
              nullable: true
            accessKey:
              properties:
                accessKeyId:
                  description: IAM access key ID.
                  type: string
                secretKey:
                  description: IAM secret key.
                  type: string
              type: object
          type: object
        pubsub:
          properties:
            authentication:
              description: Authentication method to use with GCP Pub/Sub. Currently only SERVICE_ACCOUNT is supported.
              type: string
              enum:
                - SERVICE_ACCOUNT
              example: SERVICE_ACCOUNT
              nullable: true
            ackDeadline:
              description: Acknowledgement deadline for messages, in seconds. Must be between 10 and 600.
              type: integer
              minimum: 10
              maximum: 600
              nullable: true
            serviceAccountKey:
              properties:
                serviceAccountFile:
                  description: Google Cloud service account JSON key file content, base64 encoded.
                  type: string
              type: object
          required:
            - authentication
            - serviceAccountKey
          type: object
        postgres:
          $ref: '#/components/schemas/ClickPipePatchPostgresSource'
        mysql:
          properties:
            credentials:
              $ref: '#/components/schemas/PLAIN'
            host:
              description: MySQL server hostname or IP address. To use a reverse private endpoint, pass the endpoint hostname here.
              type: string
              format: hostname
              example: my-mysql-server.example.com
              nullable: true
            port:
              description: MySQL server port.
              type: integer
              minimum: 1
              maximum: 65535
              example: 3306
              nullable: true
            authentication:
              description: Authentication method for MySQL connection.
              type: string
              enum:
                - basic
                - IAM_ROLE
              example: basic
              nullable: true
            iamRole:
              description: IAM role ARN for IAM authentication (required for IAM_ROLE authentication).
              type: string
              example: arn:aws:iam::123456789012:role/MyApplicationRole
              nullable: true
            tlsHost:
              description: TLS/SSL host for secure connections.
              type: string
              example: my-mysql-server.example.com
              nullable: true
            caCertificate:
              description: PEM encoded CA certificate to validate the MySQL server certificate.
              type: string
              example: |-
                -----BEGIN CERTIFICATE-----
                ...
              nullable: true
            disableTls:
              description: Disable TLS for the MySQL connection. Use with caution in production environments.
              type: boolean
              example: false
              nullable: true
            skipCertVerification:
              description: Skip TLS certificate verification for the MySQL connection. Use with caution in production environments.
              type: boolean
              example: false
              nullable: true
            serverId:
              description: Optional MySQL server_id the pipe declares itself as in the MySQL replication topology. Must be unique across replicas connected to the source. If omitted, one is assigned automatically.
              type: integer
              minimum: 1
              maximum: 4294967295
              example: 4242
              nullable: true
            settings:
              $ref: '#/components/schemas/ClickPipePatchMySQLPipeSettings'
            tableMappingsToAdd:
              type: array
              description: Table mappings to add to the pipe. Can be an empty array if no tables are being added.
              items:
                $ref: '#/components/schemas/ClickPipeMySQLPipeTableMapping'
              minItems: 0
            tableMappingsToRemove:
              type: array
              description: Table mappings to remove from the pipe. Only sourceSchemaName, sourceTable, and targetTable are required for removal.
              items:
                $ref: '#/components/schemas/ClickPipePatchMySQLPipeRemoveTableMapping'
              minItems: 0
          required:
            - host
            - port
          type: object
        mongodb:
          properties:
            credentials:
              $ref: '#/components/schemas/PLAIN'
            uri:
              description: MongoDB connection URI. Supports both standard URIs (mongodb://...) and SRV URIs (mongodb+srv://...). Embedded credentials are redacted from API responses, so the returned value can differ from what was submitted.
              type: string
              example: mongodb+srv://cluster0.example.mongodb.net/mydb
              nullable: true
            readPreference:
              description: MongoDB read preference for replica set reads.
              type: string
              enum:
                - primary
                - primaryPreferred
                - secondary
                - secondaryPreferred
                - nearest
              example: secondaryPreferred
              nullable: true
            tlsHost:
              description: TLS/SSL host for secure connections.
              type: string
              example: cluster0.example.mongodb.net
              nullable: true
            disableTls:
              description: Disable TLS for the MongoDB connection. Defaults to false (TLS enabled).
              type: boolean
              example: false
              nullable: true
            skipCertVerification:
              description: Skip TLS certificate verification for the MongoDB connection. Use with caution in production environments.
              type: boolean
              example: false
              nullable: true
            caCertificate:
              description: PEM encoded CA certificate to validate the MongoDB server certificate.
              type: string
              example: |-
                -----BEGIN CERTIFICATE-----
                ...
              nullable: true
            settings:
              $ref: '#/components/schemas/ClickPipePatchMongoDBPipeSettings'
            tableMappingsToAdd:
              type: array
              description: Collection mappings to add to the pipe. Can be an empty array if no collections are being added.
              items:
                $ref: '#/components/schemas/ClickPipeMongoDBPipeTableMapping'
              minItems: 0
            tableMappingsToRemove:
              type: array
              description: Collection mappings to remove from the pipe. Only sourceDatabaseName, sourceCollection, and targetTable are required for removal.
              items:
                $ref: '#/components/schemas/ClickPipePatchMongoDBPipeRemoveTableMapping'
              minItems: 0
          required:
            - uri
            - readPreference
          type: object
        validateSamples:
          description: Validate data samples received from data source. It will validate the connection and data availability and correctness. If not enabled, only connection will be validated. This has no effect on Postgres or MySQL pipes, they always only validate the connection and table definitions. This is experimental and can be removed in the future.
          type: boolean
      type: object
    ClickPipePatchDestination:
      properties:
        columns:
          type: array
          description: Columns of the destination table. This will not update the table schema, only the ClickPipe configuration.
          items:
            $ref: '#/components/schemas/ClickPipeDestinationColumn'
      type: object
    ClickPipeSchemaDiscoverySource:
      properties:
        kafka:
          properties:
            type:
              description: Type of the Kafka source.
              type: string
              enum:
                - kafka
                - redpanda
                - msk
                - gcmk
                - confluent
                - warpstream
                - azureeventhub
                - dokafka
            format:
              description: Format of the Kafka source.
              type: string
              enum:
                - JSONEachRow
                - Avro
                - AvroConfluent
                - Protobuf
            brokers:
              description: Brokers of the Kafka source.
              type: string
            topics:
              description: Topics of the Kafka source.
              type: string
            consumerGroup:
              description: Consumer group of the Kafka source. If not provided "clickpipes-<<ID>>" will be used.
              type: string
              example: my-clickpipe-consumer-group
              nullable: true
            authentication:
              description: 'Authentication method of the Kafka source. Supported authentication methods: kafka: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512, MUTUAL_TLS, msk: SCRAM-SHA-512, IAM_ROLE, IAM_USER, MUTUAL_TLS, gcmk: PLAIN, MUTUAL_TLS, confluent: PLAIN, MUTUAL_TLS, warpstream: PLAIN, azureeventhub: PLAIN, redpanda: SCRAM-SHA-256, SCRAM-SHA-512, MUTUAL_TLS, dokafka: SCRAM-SHA-256, MUTUAL_TLS'
              type: string
              enum:
                - PLAIN
                - SCRAM-SHA-256
                - SCRAM-SHA-512
                - IAM_ROLE
                - IAM_USER
                - MUTUAL_TLS
            iamRole:
              description: 'IAM role for the Kafka source. Use with IAM role authentication. Read more in ClickPipes documentation: https://clickhouse.com/docs/en/integrations/clickpipes/kafka#iam'
              type: string
              example: arn:aws:iam::123456789012:role/MyRole
              nullable: true
            offset:
              properties:
                strategy:
                  description: Offset strategy.
                  type: string
                  enum:
                    - from_beginning
                    - from_latest
                    - from_timestamp
                timestamp:
                  description: A minute precision UTC timestamp to start from. Required for "from_timestamp" strategy.
                  type: string
                  example: 2021-01-01T00:00
                  nullable: true
              type: object
            schemaRegistry:
              properties:
                url:
                  description: Schema URL. HTTPS required.
                  type: string
                  example: https://psrc-aa00.us-east-2.aws.confluent.cloud/schemas/ids/100004
                authentication:
                  description: Authentication type of the schema registry.
                  type: string
                  enum:
                    - PLAIN
                caCertificate:
                  description: PEM encoded CA certificates to validate the schema registry's certificate.
                  type: string
                  nullable: true
                credentials:
                  $ref: '#/components/schemas/ClickPipeKafkaSchemaRegistryCredentials'
              type: object
            caCertificate:
              description: PEM encoded CA certificates to validate the broker's certificate.
              type: string
              nullable: true
            reversePrivateEndpointIds:
              type: array
              description: Reverse private endpoint UUIDs used for a secure private connection to the Kafka source.
              items:
                type: string
            exactlyOnce:
              description: Enable exactly-once delivery. Guarantees every Kafka record is inserted exactly once across restarts and rebalances. Can only be set at pipe creation.
              type: boolean
              nullable: true
            credentials:
              description: Credentials for Kafka source. Choose one that is supported by the authentication method.
              properties:
                username:
                  description: Database username.
                  type: string
                  example: postgres_user
                password:
                  description: Database password.
                  type: string
                  format: password
                  example: your_secure_password
                accessKeyId:
                  description: IAM access key ID.
                  type: string
                secretKey:
                  description: IAM secret key.
                  type: string
                connectionString:
                  description: Connection string for Azure EventHub source.
                  type: string
                certificate:
                  description: PEM encoded client certificate for mTLS authentication.
                  type: string
                privateKey:
                  description: PEM encoded client private key for mTLS authentication.
                  type: string
                  format: password
              type: object
          type: object
        kinesis:
          properties:
            format:
              description: Format of the Kinesis stream.
              type: string
              enum:
                - JSONEachRow
                - Avro
                - AvroConfluent
            streamName:
              description: Name of the Kinesis stream.
              type: string
              example: my-stream
            region:
              description: AWS region of the Kinesis stream.
              type: string
              example: us-east-1
            useEnhancedFanOut:
              description: Use enhanced fan-out for the Kinesis stream.
              type: boolean
              nullable: true
            iteratorType:
              description: Type of iterator to use when reading from the Kinesis stream. If AT_TIMESTAMP is used, the timestamp field must be provided.
              type: string
              enum:
                - TRIM_HORIZON
                - LATEST
                - AT_TIMESTAMP
            timestamp:
              description: UNIX timestamp to start reading from the Kinesis stream. Required if iteratorType is AT_TIMESTAMP.
              type: integer
              example: 1615766400
              nullable: true
            authentication:
              description: Authentication method to use with the Kinesis stream.
              type: string
              enum:
                - IAM_ROLE
                - IAM_USER
            iamRole:
              description: IAM role to use for authentication. Required if IAM_ROLE is used.
              type: string
              example: arn:aws:iam::123456789012:role/MyRole
              nullable: true
            accessKey:
              properties:
                accessKeyId:
                  description: IAM access key ID.
                  type: string
                secretKey:
                  description: IAM secret key.
                  type: string
              type: object
          type: object
        pubsub:
          properties:
            format:
              description: Format of messages in the Pub/Sub topic. GCP Pub/Sub ClickPipes are in limited preview — contact support to enable this feature for your organization.
              type: string
              enum:
                - JSONEachRow
                - Avro
                - Protobuf
              example: JSONEachRow
            projectId:
              description: GCP project ID that owns the Pub/Sub topic.
              type: string
              example: my-gcp-project
            topic:
              description: Pub/Sub topic name (not the fully-qualified path).
              type: string
              example: my-topic
            authentication:
              description: Authentication method to use with GCP Pub/Sub. Currently only SERVICE_ACCOUNT is supported.
              type: string
              enum:
                - SERVICE_ACCOUNT
              example: SERVICE_ACCOUNT
            seekType:
              description: Starting position strategy for consuming the subscription. The seekTimestamp companion is required only when seekType is "timestamp"; setting it for a mismatched seek type is rejected.
              type: string
              enum:
                - latest
                - earliest
                - timestamp
              example: earliest
            seekTimestamp:
              description: RFC 3339 / ISO 8601 timestamp to seek to. Required when seekType is "timestamp"; must be omitted otherwise.
              type: string
              format: date-time
              example: '2026-04-10T12:00:00Z'
              nullable: true
            filter:
              description: Optional Pub/Sub subscription filter expression (CEL). Maximum 256 characters.
              type: string
              maxLength: 256
              nullable: true
            enableOrdering:
              description: Whether to enable ordered delivery of messages (requires messages to be published with ordering keys).
              type: boolean
              nullable: true
            ackDeadline:
              description: Acknowledgement deadline for messages, in seconds. Must be between 10 and 600.
              type: integer
              minimum: 10
              maximum: 600
              nullable: true
            serviceAccountKey:
              $ref: '#/components/schemas/ServiceAccount'
          required:
            - format
            - projectId
            - topic
            - authentication
            - seekType
            - serviceAccountKey
          type: object
        objectStorage:
          properties:
            type:
              description: Type of the ObjectStorage source.
              type: string
              enum:
                - s3
                - gcs
                - dospaces
                - azureblobstorage
                - cloudflarer2
                - ovhobjectstorage
            format:
              description: Format of the files.
              type: string
              enum:
                - JSONEachRow
                - JSONAsObject
                - CSV
                - CSVWithNames
                - TabSeparated
                - TabSeparatedWithNames
                - Parquet
                - Avro
            url:
              description: 'Provide a path to the file(s) you want to ingest. You can specify multiple files using bash-like wildcards. For more information, see the documentation on using wildcards in path: https://clickhouse.com/docs/en/integrations/clickpipes/object-storage#limitations'
              type: string
              example: https://datasets-documentation.s3.eu-west-3.amazonaws.com/http/**.ndjson.gz
            delimiter:
              description: Delimiter used in the files.
              type: string
              example: ','
              nullable: true
            compression:
              description: Compression algorithm used for the files.
              type: string
              enum:
                - none
                - gzip
                - gz
                - brotli
                - br
                - xz
                - LZMA
                - zstd
                - auto
              example: auto
              nullable: true
            isContinuous:
              description: If set to true, the pipe will continuously read new files from the source. If set to false, the pipe will read the files only once. New files have to be uploaded lexically order.
              type: boolean
              nullable: true
            queueUrl:
              description: Queue URL for event-based continuous ingestion. For S3, provide an SQS queue URL. For GCS, provide a Pub/Sub subscription (e.g. projects/{project}/subscriptions/{name}). When provided, files are ingested based on event notifications rather than lexicographical order. Only applicable when isContinuous is true and authentication is not public.
              type: string
              example: https://sqs.us-east-1.amazonaws.com/123456789012/MyQueue
              nullable: true
            skipInitialLoad:
              description: If set to true, skips the initial load and only ingests files delivered by queue notifications. Only applicable when queueUrl is provided.
              type: boolean
              nullable: true
            startAfter:
              description: Skip all files up to and including this object key during the initial load. Cannot be provided when skipInitialLoad is true.
              type: string
              example: events/2026-06-01/
              nullable: true
            authentication:
              description: Authentication method. IAM_USER is for S3, GCS, and DigitalOcean Spaces. IAM_ROLE is for S3 only. SERVICE_ACCOUNT is for GCS only. CONNECTION_STRING is for Azure Blob Storage. PUBLIC uses no authentication.
              type: string
              enum:
                - IAM_ROLE
                - IAM_USER
                - CONNECTION_STRING
                - SERVICE_ACCOUNT
              nullable: true
            iamRole:
              description: 'IAM role to be used with IAM role authentication. Read more in ClickPipes documentation: https://clickhouse.com/docs/en/integrations/clickpipes/object-storage#authentication'
              type: string
              example: arn:aws:iam::123456789012:role/MyRole
              nullable: true
            connectionString:
              description: Connection string for Azure Blob Storage authentication. Required when authentication is CONNECTION_STRING.
              type: string
              example: DefaultEndpointsProtocol=https;AccountName=myaccount;AccountKey=mykey;EndpointSuffix=core.windows.net
              nullable: true
            path:
              description: 'Path to the file(s) within the Azure container. Used for Azure Blob Storage sources. You can specify multiple files using bash-like wildcards. For more information, see the documentation on using wildcards in path: https://clickhouse.com/docs/en/integrations/clickpipes/object-storage#limitations'
              type: string
              example: data/logs/*.json
              nullable: true
            azureContainerName:
              description: Container name for Azure Blob Storage. Required when type is azureblobstorage.
              type: string
              example: mycontainer
              nullable: true
            accessKey:
              properties:
                accessKeyId:
                  description: IAM access key ID.
                  type: string
                secretKey:
                  description: IAM secret key.
                  type: string
              type: object
            serviceAccountKey:
              description: Base64-encoded GCP service account JSON key. Required when authentication is SERVICE_ACCOUNT.
              type: string
              nullable: true
          type: object
      type: object
