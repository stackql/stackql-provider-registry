openapi: 3.1.1
info:
  title: backups API
  description: clickhouse backups API
  version: '1.0'
paths:
  /services/{serviceId}/backups:
    get:
      summary: List of service backups
      description: Returns a list of all backups for the service. The most recent backups comes first in the list.
      operationId: backupGetList
      parameters:
        - in: path
          name: serviceId
          description: ID of the service the backup was created from.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 200
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Backup'
        '400':
          description: The request cannot be processed due to a client error. Please verify your request parameters and try again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 400
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
        '500':
          description: An internal server error has occurred. If this issue persists, please contact ClickHouse Cloud support for assistance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code.
                    example: 500
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
      tags:
        - Backup
  /services/{serviceId}/backups/{backupId}:
    get:
      summary: Get backup details
      description: Returns a single backup info.
      operationId: backupGet
      parameters:
        - in: path
          name: serviceId
          description: ID of the service the backup was created from.
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: backupId
          description: ID of the requested backup.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 200
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
