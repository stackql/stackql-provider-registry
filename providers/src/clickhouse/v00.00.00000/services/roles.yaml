openapi: 3.1.1
info:
  title: roles API
  description: clickhouse roles API
  version: '1.0'
paths:
  /roles:
    get:
      summary: List all available roles for an organization
      description: Returns all available roles (system + custom) for an organization.
      operationId: organizationRolesGetList
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 200
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/RBACRole'
        '400':
          description: The request cannot be processed due to a client error. Please verify your request parameters and try again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 400
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
        '500':
          description: An internal server error has occurred. If this issue persists, please contact ClickHouse Cloud support for assistance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code.
                    example: 500
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
      tags:
        - Role Management
    post:
      summary: Create a new role
      description: Creates a new custom role for an organization with specified policies and actors.
      operationId: organizationRolePost
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 200
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
                  result:
                    $ref: '#/components/schemas/RBACRole'
        '400':
          description: The request cannot be processed due to a client error. Please verify your request parameters and try again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 400
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
        '500':
          description: An internal server error has occurred. If this issue persists, please contact ClickHouse Cloud support for assistance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code.
                    example: 500
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
      tags:
        - Role Management
  /roles/{roleId}:
    get:
      summary: Get role details
      description: Returns details for a specific role.
      operationId: organizationRoleGet
      parameters:
        - in: path
          name: roleId
          description: ID of the requested role.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 200
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
                  result:
                    $ref: '#/components/schemas/RBACRole'
        '400':
          description: The request cannot be processed due to a client error. Please verify your request parameters and try again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 400
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
        '500':
          description: An internal server error has occurred. If this issue persists, please contact ClickHouse Cloud support for assistance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code.
                    example: 500
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
      tags:
        - Role Management
    patch:
      summary: Update a role
      description: Updates an existing custom role. System roles cannot be updated. All fields are optional - only provided fields will be updated.
      operationId: organizationRolePatch
      parameters:
        - in: path
          name: roleId
          description: ID of the requested role.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 200
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
                  result:
                    $ref: '#/components/schemas/RBACRole'
        '400':
          description: The request cannot be processed due to a client error. Please verify your request parameters and try again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 400
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
        '500':
          description: An internal server error has occurred. If this issue persists, please contact ClickHouse Cloud support for assistance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code.
                    example: 500
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
      tags:
        - Role Management
    delete:
      summary: Delete a role
      description: Deletes an existing custom role. System roles cannot be deleted. This operation will remove the role and all its associated policies.
      operationId: organizationRoleDelete
      parameters:
        - in: path
          name: roleId
          description: ID of the requested role.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 200
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
        '400':
          description: The request cannot be processed due to a client error. Please verify your request parameters and try again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code.
                    example: 400
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
        '500':
          description: An internal server error has occurred. If this issue persists, please contact ClickHouse Cloud support for assistance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code.
                    example: 500
                  error:
                    type: string
                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
      tags:
        - Role Management
components:
  schemas:
    RBACRole:
      properties:
        id:
          description: Unique role identifier
          type: string
        tenantId:
          description: Tenant resource ID (e.g., organization/uuid)
          type: string
        ownerId:
          description: Owner resource ID (e.g., organization/uuid)
          type: string
        name:
          description: Name of the role
          type: string
        type:
          description: Whether this is a system role or a custom role
          type: string
          enum:
            - system
            - custom
        actors:
          type: array
          description: List of actor resource IDs assigned to this role (e.g., user/uuid, apiKey/uuid)
          items:
            type: string
        policies:
          type: array
          description: List of policies associated with this role
          items:
            $ref: '#/components/schemas/RBACPolicy'
        createdAt:
          description: Timestamp when the role was created. ISO-8601.
          type: string
          format: date-time
        updatedAt:
          description: Timestamp when the role was last updated. ISO-8601.
          type: string
          format: date-time
      type: object
    RoleCreateRequest:
      properties:
        name:
          description: Name of the role
          type: string
        actors:
          type: array
          description: List of actor resource IDs to assign to this role (e.g., ["user/uuid", "apiKey/uuid"])
          items:
            type: string
        policies:
          type: array
          description: List of policies to create for this role
          items:
            $ref: '#/components/schemas/RBACPolicyCreateRequest'
      required:
        - name
        - actors
        - policies
      type: object
    RoleUpdateRequest:
      properties:
        name:
          description: New name for the role
          type: string
        actors:
          type: array
          description: New list of actor resource IDs (replaces existing actors)
          items:
            type: string
        policies:
          type: array
          description: New list of policies (replaces existing policies)
          items:
            $ref: '#/components/schemas/RBACPolicyCreateRequest'
      type: object
    RBACPolicy:
      properties:
        id:
          description: Unique policy identifier
          type: string
        roleId:
          description: ID of the role this policy belongs to
          type: string
        tenantId:
          description: Tenant resource ID (e.g., organization/uuid)
          type: string
        allowDeny:
          description: Whether this policy allows or denies access
          type: string
          enum:
            - ALLOW
            - DENY
        permissions:
          type: array
          description: List of permissions granted or denied by this policy
          items:
            type: string
        resources:
          type: array
          description: List of resource IDs this policy applies to (e.g., instance/uuid, instance/*)
          items:
            type: string
        tags:
          $ref: '#/components/schemas/RBACPolicyTags'
      type: object
    RBACPolicyCreateRequest:
      properties:
        allowDeny:
          description: Whether this policy allows or denies access
          type: string
          enum:
            - ALLOW
            - DENY
        permissions:
          type: array
          description: List of permissions to grant or deny (e.g., ["control-plane:organization:view"])
          items:
            type: string
        resources:
          type: array
          description: List of resource IDs this policy applies to (e.g., ["instance/uuid", "instance/*"])
          items:
            type: string
        tags:
          $ref: '#/components/schemas/RBACPolicyTags'
      required:
        - allowDeny
        - permissions
        - resources
      type: object
    RBACPolicyTags:
      properties:
        grants:
          type: array
          description: Optional list of database grants (e.g., database names)
          items:
            type: string
        roleV2:
          description: Optional SQL console role type
          type: string
          enum:
            - sql-console-readonly
            - sql-console-admin
      type: object
  x-stackQL-resources:
    roles:
      id: clickhouse.roles.roles
      name: roles
      title: Roles
      methods:
        list:
          operation:
            $ref: '#/paths/~1roles/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.result
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1roles/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1roles~1{roleId}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.result
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1roles~1{roleId}/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        delete:
          operation:
            $ref: '#/paths/~1roles~1{roleId}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/roles/methods/get'
          - $ref: '#/components/x-stackQL-resources/roles/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/roles/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/roles/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/roles/methods/delete'
        replace: []
servers:
  - url: https://api.clickhouse.cloud/v1/organizations/{organization_id}
    variables:
      organization_id:
        description: ClickHouse Cloud organization ID. Resolved from the CLICKHOUSE_ORG_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every query as WHERE organization_id = <uuid>. A WHERE value always takes precedence over the environment.
        x-stackQL-envVar: CLICKHOUSE_ORG_ID
