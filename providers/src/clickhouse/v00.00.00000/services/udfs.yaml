                  error:
                    description: Error message.
                    type: string
                  issues:
                    description: Validation issues that caused the request to be rejected.
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          description: Path to the invalid field.
                          type: array
                          items:
                            anyOf:
                              - type: string
                              - type: number
                        code:
                          description: Validation issue code.
                          type: string
