openapi: 3.1.1
info:
  title: udfs API
  description: clickhouse udfs API
  version: '1.0'
paths:
  /udfs/{functionName}/attachments/{serviceId}:
    put:
      operationId: udfAttach
      summary: Attach UDF to service
      description: '**Disclaimer:** This beta endpoint is evolving; the API contract may change. <br /><br /> Attaches one UDF version to a service, replacing the current version when necessary. When version is omitted, the latest ready version is attached.'
      tags:
        - UDF
      parameters:
        - in: path
          name: functionName
          schema:
            description: Name of the UDF.
            type: string
            pattern: ^[A-Za-z][A-Za-z0-9_]*$
          required: true
          description: Name of the UDF.
        - in: path
          name: serviceId
          schema:
            description: ID of the requested service.
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
          required: true
          description: ID of the requested service.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  description: Version to attach. When omitted, the latest ready version is attached.
                  example: 1
                  type: integer
                  exclusiveMinimum: true
                  minimum: 0
      responses:
        '200':
          description: Current attachment state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: HTTP status code.
                    example: 200
                    type: integer
                  requestId:
                    description: Unique id assigned to every request. UUIDv4
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                  result:
                    $ref: '#/components/schemas/UdfAttachment'
                required:
                  - status
                  - requestId
                  - result
                additionalProperties: false
        '400':
          description: The service does not support UDFs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: Human-readable error message.
                    type: string
                  status:
                    description: HTTP status code.
                    example: 400
                    type: integer
                  requestId:
                    description: Unique id assigned to every request. UUIDv4
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                required:
                  - error
                  - status
                  - requestId
                additionalProperties: false
        '404':
          description: UDF, version, or service not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: Human-readable error message.
                    type: string
                  status:
                    description: HTTP status code.
                    example: 404
                    type: integer
                  requestId:
                    description: Unique id assigned to every request. UUIDv4
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                required:
                  - error
                  - status
                  - requestId
                additionalProperties: false
        '409':
          description: The requested version is not ready or another attachment transition is in progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: Human-readable error message.
                    type: string
                  status:
                    description: HTTP status code.
                    example: 409
                    type: integer
                  requestId:
                    description: Unique id assigned to every request. UUIDv4
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                required:
                  - error
                  - status
                  - requestId
                additionalProperties: false
        '422':
          description: Service UDF attachment limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: Human-readable error message.
                    type: string
                  status:
                    description: HTTP status code.
                    example: 422
                    type: integer
                  requestId:
                    description: Unique id assigned to every request. UUIDv4
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                required:
                  - error
                  - status
                  - requestId
                additionalProperties: false
        '424':
          description: The service must be running before the UDF can be attached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: Human-readable error message.
                    type: string
                  code:
                    description: Reason the attachment could not be started.
                    type: string
                    enum:
                      - SERVICE_IDLE
                      - SERVICE_NOT_RUNNING
                      - SERVICE_STOPPED
                  serviceState:
                    description: Current state of the service.
                    type: string
                    enum:
                      - starting
                      - stopping
                      - terminating
                      - softdeleting
                      - awaking
                      - partially_running
                      - provisioning
                      - running
                      - stopped
                      - terminated
                      - softdeleted
                      - degraded
                      - failed
                      - idle
                  canWake:
                    description: Whether the service can be woken before retrying the attachment.
                    type: boolean
                  status:
                    description: HTTP status code.
                    example: 424
                    type: integer
                  requestId:
                    description: Unique id assigned to every request. UUIDv4
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                required:
                  - error
                  - code
                  - serviceState
                  - canWake
                  - status
                  - requestId
                additionalProperties: false
        '500':
          description: An internal server error has occurred. If this issue persists, please contact ClickHouse Cloud support for assistance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: Error message.
                    type: string
                  status:
                    description: HTTP status code.
                    example: 500
                    type: integer
                  requestId:
                    description: Unique id assigned to every request. UUIDv4
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                required:
                  - error
                  - status
                  - requestId
                additionalProperties: {}
      x-badges:
        - name: Beta
          position: after
