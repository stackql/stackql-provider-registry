components:
  schemas:
    UdfAttachment:
      type: object
      properties:
        functionName:
          description: Name of the UDF.
          type: string
        serviceId:
          description: ID of the attached service.
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
        status:
          description: Current attachment lifecycle state.
          type: string
          enum:
            - deployed
            - deprovisioning
            - error
            - provisioning
            - standby
        version:
          description: Attached UDF version.
          example: 1
          type: integer
          exclusiveMinimum: true
          minimum: 0
      required:
        - functionName
        - serviceId
        - status
        - version
      additionalProperties: false
    UdfAttachmentListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UdfAttachment'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - items
        - pagination
      additionalProperties: false
    UdfCreateRequest:
      type: object
      properties:
        uploadId:
          description: Identifier of the uploaded source archive.
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
        runtime:
          type: string
          enum:
            - python3.11
            - native
        arguments:
          type: array
          items:
            type: object
            properties:
              name:
                description: Name of the argument. Required for Native and JSONEachRow formats.
                type: string
                pattern: ^[A-Za-z][A-Za-z0-9_]*$
              type:
                description: ClickHouse data type of the argument.
                type: string
            required:
              - name
              - type
        returnType:
          type: string
        returnName:
          default: null
          anyOf:
            - type: string
              pattern: ^[A-Za-z][A-Za-z0-9_]*$
            - type: 'null'
        commandReadTimeout:
          default: 10000
          type: integer
          exclusiveMinimum: true
          minimum: 0
        commandWriteTimeout:
          default: 10000
          type: integer
          exclusiveMinimum: true
          minimum: 0
        memoryLimitMib:
          default: null
          anyOf:
            - type: integer
              minimum: 1
              maximum: 1048576
            - type: 'null'
        sendChunkHeader:
          default: false
          type: boolean
        format:
          default: TabSeparated
          type: string
        sandboxType:
          default: basic
          type: string
          enum:
            - basic
            - netenable
        sandboxVersion:
          default: v2
          type: string
          enum:
            - v1
            - v2
            - v3
        type:
          type: string
          const: executable
        poolSize:
          default: null
          type: 'null'
        maxCommandExecutionTime:
          default: 10
          anyOf:
            - type: integer
              exclusiveMinimum: true
              minimum: 0
            - type: 'null'
        functionName:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]*$
      required:
        - uploadId
        - runtime
        - arguments
        - returnType
        - type
        - functionName
    Udf:
      type: object
      properties:
        functionName:
          description: Name of the UDF. Unique within the organization.
          type: string
        version:
          description: Version number of the UDF.
          example: 1
          type: integer
          exclusiveMinimum: true
          minimum: 0
        status:
          description: Build state of this UDF version.
          type: string
          enum:
            - building
            - error
            - ready
        runtime:
          description: Runtime used to execute the UDF command.
          type: string
          enum:
            - python3.11
            - native
        type:
          description: Executable UDF type.
          type: string
          enum:
            - executable
            - executable_pool
        arguments:
          description: Arguments passed to the UDF command.
          type: array
          items:
            type: object
            properties:
              name:
                description: Name of the argument. Required for Native and JSONEachRow formats.
                type: string
                pattern: ^[A-Za-z][A-Za-z0-9_]*$
              type:
                description: ClickHouse data type of the argument.
                type: string
            required:
              - name
              - type
            additionalProperties: false
        returnType:
          description: ClickHouse data type of the returned value.
          type: string
        returnName:
          description: Name of the returned value, or null when unnamed.
          type: string
        poolSize:
          description: Command pool size for executable_pool UDFs.
          type: integer
          exclusiveMinimum: true
          minimum: 0
        commandReadTimeout:
          description: Command stdout read timeout in milliseconds.
          type: integer
          exclusiveMinimum: true
          minimum: 0
        commandWriteTimeout:
          description: Command stdin write timeout in milliseconds.
          type: integer
          exclusiveMinimum: true
          minimum: 0
        maxCommandExecutionTime:
          description: Maximum command execution time in seconds for executable_pool UDFs.
          type: integer
          exclusiveMinimum: true
          minimum: 0
        memoryLimitMib:
          description: Maximum memory, in MiB, available to each UDF sandbox process. Null uses the sandbox default.
          default: null
          type: integer
          minimum: 1
          maximum: 1048576
        sendChunkHeader:
          description: Whether ClickHouse sends a row-count chunk header.
          type: boolean
        format:
          description: Input and output format used by the UDF command.
          type: string
        sandboxType:
          description: Sandbox isolation level.
          type: string
          enum:
            - basic
            - netenable
        sandboxVersion:
          description: Sandbox runtime version.
          type: string
          enum:
            - v1
            - v2
            - v3
        error:
          description: Build error, or null when no build error is present.
          type: string
        createdAt:
          description: Creation timestamp.
          type: string
          format: date-time
        updatedAt:
          description: Last-update timestamp.
          type: string
          format: date-time
      required:
        - functionName
        - version
        - status
        - runtime
        - type
        - arguments
        - returnType
        - returnName
        - poolSize
        - commandReadTimeout
        - commandWriteTimeout
        - maxCommandExecutionTime
        - memoryLimitMib
        - sendChunkHeader
        - format
        - sandboxType
        - sandboxVersion
        - error
        - createdAt
        - updatedAt
      additionalProperties: false
