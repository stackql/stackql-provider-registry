        - in: query
          name: cursor
          schema:
            description: Cursor returned in `pagination.nextCursor` from the previous page.
            type: string
          description: Cursor returned in `pagination.nextCursor` from the previous page.
        - in: query
          name: limit
          schema:
            description: Maximum number of records to return per page. Defaults to 100. Maximum is 100.
            default: 100
