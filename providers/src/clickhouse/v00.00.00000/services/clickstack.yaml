          example: High
      required:
        - operator
        - value
        - color
      type: object
    ClickStackBackgroundChart:
      properties:
        type:
          description: Sparkline shape.
          type: string
          enum:
            - line
            - area
          example: line
        color:
          description: Optional palette-token override for the sparkline. When unset the sparkline inherits the tile's static color.
          type: string
          enum:
            - chart-blue
            - chart-orange
            - chart-red
            - chart-cyan
            - chart-green
            - chart-pink
            - chart-purple
            - chart-light-blue
            - chart-brown
            - chart-gray
            - chart-success
            - chart-warning
            - chart-error
      required:
        - type
      type: object
    ClickStackOnClickSearch:
      properties:
        type:
          description: OnClick variant discriminator. Must be "search" for search link-outs.
          type: string
          enum:
            - search
          example: search
        target:
          $ref: '#/components/schemas/ClickStackOnClickTarget'
        whereTemplate:
          description: Optional WHERE clause template applied to the destination search.
          type: string
          example: ServiceName = '{{ServiceName}}'
        whereLanguage:
          description: Language of the rendered whereTemplate.
          type: string
          enum:
            - sql
            - lucene
        filters:
          type: array
          description: Optional dashboard filter templates rendered against the clicked row.
          items:
            $ref: '#/components/schemas/ClickStackOnClickFilterTemplate'
      required:
        - type
        - target
      type: object
    ClickStackOnClickDashboard:
      properties:
        type:
          description: OnClick variant discriminator. Must be "dashboard" for dashboard link-outs.
          type: string
          enum:
            - dashboard
          example: dashboard
        target:
          $ref: '#/components/schemas/ClickStackOnClickTarget'
        whereTemplate:
          description: Optional WHERE clause template applied to the destination dashboard.
          type: string
          example: ServiceName = '{{ServiceName}}'
        whereLanguage:
          description: Language of the rendered whereTemplate.
          type: string
          enum:
            - sql
            - lucene
        filters:
          type: array
          description: Optional dashboard filter templates rendered against the clicked row.
          items:
            $ref: '#/components/schemas/ClickStackOnClickFilterTemplate'
      required:
        - type
        - target
      type: object
    ClickStackOnClickExternal:
      properties:
        type:
          description: OnClick variant discriminator. Must be "external" for external link-outs.
          type: string
          enum:
            - external
          example: external
        urlTemplate:
          description: Handlebars template rendered against the clicked row; supports `{{column}}` variables. The rendered value must be an absolute http(s) URL.
          type: string
          example: https://example.com/d/abc?var-service={{ServiceName}}
      required:
        - type
        - urlTemplate
      type: object
    ClickStackNumericColorCondition:
      properties:
        operator:
          description: Numeric comparison operator.
          type: string
          enum:
            - gt
            - gte
            - lt
            - lte
          example: gt
        value:
          description: Numeric bound the displayed value is compared against. Only finite numbers are accepted (Infinity and NaN are rejected).
          type: number
          example: 100
        color:
          description: Color applied when the rule matches.
          type: string
          enum:
            - chart-blue
            - chart-orange
            - chart-red
            - chart-cyan
            - chart-green
            - chart-pink
            - chart-purple
            - chart-light-blue
            - chart-brown
            - chart-gray
            - chart-success
            - chart-warning
            - chart-error
        label:
          description: Optional label describing the rule.
          type: string
          example: High
      required:
        - operator
        - value
        - color
      type: object
    ClickStackBetweenColorCondition:
      properties:
        operator:
          description: Range comparison operator.
          type: string
          enum:
            - between
          example: between
        value:
          type: array
          description: Inclusive [min, max] range. Both bounds must be finite numbers.
          items:
            type: number
          example:
            - 100
            - 500
        color:
          description: Color applied when the rule matches.
          type: string
          enum:
            - chart-blue
            - chart-orange
            - chart-red
            - chart-cyan
            - chart-green
            - chart-pink
            - chart-purple
            - chart-light-blue
            - chart-brown
            - chart-gray
            - chart-success
            - chart-warning
            - chart-error
        label:
          description: Optional label describing the rule.
          type: string
          example: Warning
      required:
        - operator
        - value
        - color
      type: object
    ClickStackEqualityColorCondition:
      properties:
        operator:
          description: Equality comparison operator.
          type: string
          enum:
            - eq
            - neq
          example: eq
        value:
          description: A finite number, or a string up to 200 characters, to compare for equality.
          type: number
        color:
          description: Color applied when the rule matches.
          type: string
          enum:
            - chart-blue
            - chart-orange
            - chart-red
            - chart-cyan
            - chart-green
            - chart-pink
            - chart-purple
            - chart-light-blue
            - chart-brown
            - chart-gray
            - chart-success
            - chart-warning
            - chart-error
        label:
          description: Optional label describing the rule.
          type: string
          example: Healthy
      required:
        - operator
        - value
        - color
      type: object
    ClickStackOnClickTarget:
      properties:
        mode:
          description: Target is a single dashboard or log/trace source
          type: string
          enum:
            - id
          example: id
        id:
          description: ID of the target source (for search) or dashboard (for dashboard).
          type: string
          example: 65f5e4a3b9e77c001a567890
        template:
          description: Name template rendered against the clicked row; supports `{{column}}` variables.
          type: string
          example: '{{ServiceName}}'
      required:
        - mode
        - id
        - template
      type: object
    ClickStackOnClickFilterTemplate:
      properties:
        kind:
          description: Filter template kind. Currently only "expressionTemplate" is supported.
          type: string
          enum:
            - expressionTemplate
          example: expressionTemplate
        expression:
          description: The column/expression to filter the destination by (e.g. "ServiceName").
          type: string
          example: ServiceName
        template:
          description: Value template rendered against the clicked row; supports row column variables in `{{column}}` form (e.g. `{{ServiceName}}`).
          type: string
          example: '{{ServiceName}}'
      required:
        - kind
        - expression
        - template
      type: object
    ClickStackOnClickTargetIdVariant:
      properties:
        mode:
          description: Target is a single dashboard or log/trace source
          type: string
          enum:
            - id
          example: id
        id:
          description: ID of the target source (for search) or dashboard (for dashboard).
          type: string
          example: 65f5e4a3b9e77c001a567890
      required:
        - mode
        - id
      type: object
    ClickStackOnClickTargetTemplateVariant:
      properties:
        mode:
          description: Target is matched by name against the template.
          type: string
          enum:
            - template
          example: template
        template:
          description: Name template rendered against the clicked row; supports `{{column}}` variables.
          type: string
          example: '{{ServiceName}}'
      required:
        - mode
        - template
      type: object
