components:
  schemas:
    ClickStackDashboardResponse:
      properties:
        id:
          description: Dashboard ID
          type: string
          example: 65f5e4a3b9e77c001a567890
        name:
          description: Dashboard name
          type: string
          example: Service Overview
        tiles:
          type: array
          description: List of tiles/charts in the dashboard
          items:
            $ref: '#/components/schemas/ClickStackTileOutput'
        tags:
          type: array
          description: Tags for organizing and filtering dashboards
          items:
            type: string
          example:
            - production
            - monitoring
        filters:
          type: array
          description: Dashboard filter keys added to the dashboard and applied to all tiles
          items:
            $ref: '#/components/schemas/ClickStackFilter'
        savedQuery:
          description: Optional default dashboard query restored when loading the dashboard.
          type: string
          example: service.name = 'api'
          nullable: true
        savedQueryLanguage:
          description: Query language used by savedQuery.
          type: string
          enum:
            - sql
            - lucene
          example: sql
          nullable: true
        savedFilterValues:
          type: array
          description: Optional default dashboard filter values restored when loading the dashboard.
          items:
            $ref: '#/components/schemas/ClickStackSavedFilterValue'
        containers:
          type: array
          description: Optional grouping containers. Each tile may join a container via tile.containerId, and a tab inside it via tile.tabId.
          items:
            $ref: '#/components/schemas/ClickStackDashboardContainer'
      type: object
    ClickStackCreateDashboardRequest:
      properties:
        name:
          description: Dashboard name.
          type: string
          example: New Dashboard
        tiles:
          type: array
          description: List of tiles/charts to include in the dashboard.
          items:
            $ref: '#/components/schemas/ClickStackTileInput'
        tags:
          type: array
          description: Tags for organizing and filtering dashboards.
          items:
            type: string
          example:
            - development
        filters:
          type: array
          description: Dashboard filter keys to add to the dashboard and apply across all tiles
          items:
            $ref: '#/components/schemas/ClickStackFilterInput'
        savedQuery:
          description: Optional default dashboard query to persist on the dashboard.
          type: string
          example: service.name = 'api'
          nullable: true
        savedQueryLanguage:
          description: Query language used by savedQuery.
          type: string
          enum:
            - sql
            - lucene
          example: sql
          nullable: true
        savedFilterValues:
          type: array
          description: Optional default dashboard filter values to persist on the dashboard.
          items:
            $ref: '#/components/schemas/ClickStackSavedFilterValue'
        containers:
          type: array
          description: Optional grouping containers. Each tile may join a container via tile.containerId, and a tab inside it via tile.tabId.
          items:
            $ref: '#/components/schemas/ClickStackDashboardContainer'
      required:
        - name
        - tiles
      type: object
    ClickStackUpdateDashboardRequest:
      properties:
        name:
          description: Dashboard name.
          type: string
          example: Updated Dashboard Name
        tiles:
          type: array
          description: Full list of tiles for the dashboard. Existing tiles are matched by ID; tiles with an ID that does not match an existing tile will be assigned a new generated ID.
          items:
            $ref: '#/components/schemas/ClickStackTileInput'
        tags:
          type: array
          description: Tags for organizing and filtering dashboards.
          items:
            type: string
          example:
            - production
            - updated
        filters:
          type: array
          description: Dashboard filter keys on the dashboard, applied across all tiles
          items:
            $ref: '#/components/schemas/ClickStackFilter'
        savedQuery:
          description: Optional default dashboard query to persist on the dashboard.
          type: string
          example: service.name = 'api'
          nullable: true
        savedQueryLanguage:
          description: Query language used by savedQuery.
          type: string
          enum:
            - sql
            - lucene
          example: sql
          nullable: true
        savedFilterValues:
          type: array
          description: Optional default dashboard filter values to persist on the dashboard.
          items:
            $ref: '#/components/schemas/ClickStackSavedFilterValue'
        containers:
          type: array
          description: Optional grouping containers. Each tile may join a container via tile.containerId, and a tab inside it via tile.tabId.
          items:
            $ref: '#/components/schemas/ClickStackDashboardContainer'
      required:
        - name
        - tiles
      type: object
    ClickStackValidateDashboardResponse:
      properties:
        valid:
          description: True when the body passes all validation rules.
          type: boolean
        errors:
          type: array
          description: Validation errors. Empty when valid is true.
          items:
            $ref: '#/components/schemas/ClickStackValidateDashboardError'
        normalized:
          properties: {}
          type: object
      required:
        - valid
        - errors
        - normalized
      type: object
    ClickStackAlertResponse:
      properties:
        dashboardId:
          description: Dashboard ID for tile-based alerts.
          type: string
          example: 65f5e4a3b9e77c001a567890
          nullable: true
        tileId:
          description: Tile ID for tile-based alerts. Must be a line, stacked bar, or number type tile.
          type: string
          example: 65f5e4a3b9e77c001a901234
          nullable: true
        savedSearchId:
          description: Saved search ID for saved_search alerts.
          type: string
          example: 65f5e4a3b9e77c001a345678
          nullable: true
        groupBy:
          description: Group-by key for saved search alerts.
          type: string
          example: ServiceName
          nullable: true
        threshold:
          description: Threshold value for triggering the alert. For between and not_between threshold types, this is the lower bound.
          type: number
          example: 100
        thresholdMax:
          description: Upper bound for between and not_between threshold types. Required when thresholdType is between or not_between, must be >= threshold.
          type: number
          example: 500
          nullable: true
        interval:
          description: Evaluation interval for the alert.
          type: string
          enum:
            - 1m
            - 5m
            - 15m
            - 30m
            - 1h
            - 6h
            - 12h
            - 1d
          example: 1h
        scheduleOffsetMinutes:
          description: Offset from the interval boundary in minutes. For example, 2 with a 5m interval evaluates windows at :02, :07, :12, etc. (UTC).
          type: integer
          example: 2
          nullable: true
        scheduleStartAt:
          description: Absolute UTC start time anchor. Alert windows start from this timestamp and repeat every interval.
          type: string
          format: date-time
          example: '2026-02-08T10:00:00.000Z'
          nullable: true
        source:
          description: Alert source type (tile-based or saved search).
          type: string
          enum:
            - saved_search
            - tile
          example: tile
        thresholdType:
          description: Threshold comparison direction.
          type: string
          enum:
            - above
            - below
            - above_exclusive
            - below_or_equal
            - equal
            - not_equal
            - between
            - not_between
          example: above
        channel:
          $ref: '#/components/schemas/ClickStackAlertChannel'
        name:
          description: Human-friendly alert name.
          type: string
          example: Test Alert
          nullable: true
        message:
          description: Alert message template.
          type: string
          example: Test Alert Message
          nullable: true
        note:
          description: Freeform note for the alert. Supports markdown formatting.
          type: string
          example: Threshold raised from 50 to 100 on 2026-01-15. See [runbook](https://wiki.example.com/runbook).
          nullable: true
        numConsecutiveWindows:
          description: Fire the alert only after its condition has been met for this many consecutive evaluation windows. While the condition is met but fewer than this many consecutive windows have violated, the alert is in the PENDING state.
          type: integer
          example: 3
          nullable: true
        id:
          description: Unique alert identifier.
          type: string
          example: 65f5e4a3b9e77c001a123456
        state:
          description: Current alert state.
          type: string
          enum:
            - ALERT
            - OK
            - INSUFFICIENT_DATA
            - DISABLED
            - PENDING
          example: ALERT
        teamId:
          description: Team identifier.
          type: string
          example: 65f5e4a3b9e77c001a345678
        silenced:
          properties:
            by:
              description: User ID who silenced the alert.
              type: string
              example: 65f5e4a3b9e77c001a234567
              nullable: true
            at:
              description: Silence start timestamp.
              type: string
              format: date-time
              example: '2026-03-19T08:00:00.000Z'
            until:
              description: Silence end timestamp.
              type: string
              format: date-time
              example: '2026-03-20T08:00:00.000Z'
          type: object
        executionErrors:
          type: array
          description: Errors recorded during the most recent alert execution, if any.
          items:
            $ref: '#/components/schemas/ClickStackAlertExecutionError'
        createdAt:
          description: Creation timestamp.
          type: string
          format: date-time
          example: '2023-01-01T00:00:00.000Z'
          nullable: true
        updatedAt:
          description: Last update timestamp.
          type: string
          format: date-time
          example: '2023-01-01T00:00:00.000Z'
          nullable: true
      type: object
    ClickStackCreateAlertRequest:
      properties:
        dashboardId:
          description: Dashboard ID for tile-based alerts.
          type: string
          example: 65f5e4a3b9e77c001a567890
          nullable: true
        tileId:
