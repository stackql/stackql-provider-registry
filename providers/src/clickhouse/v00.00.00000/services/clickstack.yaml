    ClickStackTileConfig:
      properties:
        displayType:
          description: Display type discriminator. Must be "line" for line charts.
          type: string
          enum:
            - line
          example: line
        sourceId:
          description: ID of the data source to query.
          type: string
          example: 65f5e4a3b9e77c001a111111
        select:
          type: array
          description: One or more aggregated values to plot. When asRatio is true, exactly two select items are required.
          items:
            $ref: '#/components/schemas/ClickStackSelectItem'
        groupBy:
          description: Field expression to group results by (creates separate lines per group value).
          type: string
          example: host
        asRatio:
          description: Plot select[0] / select[1] as a ratio. Requires exactly two select items.
          type: boolean
        alignDateRangeToGranularity:
          description: Expand date range boundaries to the query granularity interval.
          type: boolean
        fillNulls:
          description: Fill missing time buckets with zero instead of leaving gaps.
          type: boolean
        fitYAxisToData:
          description: Set the y-axis lower bound to the minimum of the displayed data instead of zero, making small fluctuations between series easier to see.
          type: boolean
        numberFormat:
          $ref: '#/components/schemas/ClickStackNumberFormat'
        compareToPreviousPeriod:
          description: Overlay the equivalent previous time period for comparison.
          type: boolean
        configType:
          description: Must be "sql" to use the Raw SQL chart config variant.
          type: string
          enum:
            - sql
          example: sql
        connectionId:
          description: ID of the ClickHouse connection to execute the query against.
          type: string
          example: 65f5e4a3b9e77c001a567890
        sqlTemplate:
          description: SQL query template to execute. Supports HyperDX template variables.
          type: string
          example: SELECT count() FROM otel_logs WHERE timestamp > now() - INTERVAL 1 HOUR
        having:
          description: Post-aggregation SQL HAVING condition.
          type: string
          example: count > 100
        orderBy:
          description: SQL ORDER BY expression for sorting table rows.
          type: string
          example: count DESC
        groupByColumnsOnLeft:
          description: When true, render Group By columns to the left of series columns in the table. Defaults to false (Group By columns on the right).
          type: boolean
          example: false
        onClick:
          $ref: '#/components/schemas/ClickStackOnClick'
        color:
          description: Optional static color applied to the displayed number.
          type: string
          enum:
            - chart-blue
            - chart-orange
            - chart-red
            - chart-cyan
            - chart-green
            - chart-pink
            - chart-purple
            - chart-light-blue
            - chart-brown
            - chart-gray
            - chart-success
            - chart-warning
            - chart-error
        colorRules:
          type: array
          description: Ordered conditional color rules evaluated against the displayed value (last match wins). Falls back to color, then the default text color when no rule matches.
          items:
            $ref: '#/components/schemas/ClickStackNumberTileColorCondition'
        backgroundChart:
          $ref: '#/components/schemas/ClickStackBackgroundChart'
        limit:
          description: Maximum number of slices (SQL LIMIT). Without a custom "orderBy" the query keeps the groups with the largest aggregated values; with an "orderBy" it keeps the first slices in that order. Omit to fetch all groups.
          type: integer
          example: 10
        where:
          description: Row-level filter (syntax depends on whereLanguage).
          type: string
          example: ServiceName = 'api'
        whereLanguage:
          description: Query language for the where clause.
          type: string
          enum:
            - sql
            - lucene
        markdown:
          description: Markdown content to render inside the tile.
          type: string
          example: |-
            # Dashboard Title

            This is a markdown widget.
      required:
        - displayType
        - sourceId
        - select
        - configType
        - connectionId
        - sqlTemplate
        - whereLanguage
      type: object
