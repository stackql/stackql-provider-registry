      type: object
    ClickStackSource:
      properties:
        id:
          description: Unique source ID. Server-generated; ignored if sent in create/update requests.
          type: string
          example: 507f1f77bcf86cd799439011
        name:
          description: Display name for the source.
          type: string
          example: Logs
        section:
          description: Optional grouping label used to organize sources in the source selector. Sources that share a section value are displayed together.
          type: string
          example: Billing
        disabled:
          description: When true, the source is hidden from source selectors in the UI. Defaults to false.
          type: boolean
          example: false
          nullable: true
        kind:
          description: Source kind discriminator. Must be "log" for log sources.
          type: string
          enum:
            - log
          example: log
        connection:
          description: ID of the ClickHouse connection used by this source.
          type: string
          example: 507f1f77bcf86cd799439012
        from:
          $ref: '#/components/schemas/ClickStackSourceFrom'
        querySettings:
          type: array
          description: Optional ClickHouse query settings applied when querying this source.
          items:
            $ref: '#/components/schemas/ClickStackQuerySetting'
        filterSettings:
          properties:
            databaseName:
              description: ClickHouse database name
              type: string
              example: default
            tableName:
              description: ClickHouse table name
              type: string
              example: otel_logs
            columns:
              type: array
              description: Columns to expose as filters (max 10)
              items:
                $ref: '#/components/schemas/ClickStackFilterSettingsColumn'
          required:
            - databaseName
            - tableName
            - columns
          type: object
        defaultTableSelectExpression:
          description: Default columns selected in search results (this can be customized per search later)
          type: string
          example: Timestamp, ServiceName, SeverityText, Body
        timestampValueExpression:
          description: DateTime column or expression that is part of your table's primary key.
          type: string
          example: Timestamp
        serviceNameExpression:
          description: Expression to extract the service name from log rows.
          type: string
          example: ServiceName
          nullable: true
        severityTextExpression:
          description: Expression to extract the severity/log level text.
          type: string
          example: SeverityText
          nullable: true
        bodyExpression:
          description: Expression to extract the log message body.
          type: string
          example: Body
          nullable: true
        eventAttributesExpression:
          description: Expression to extract event-level attributes.
          type: string
          example: LogAttributes
          nullable: true
        resourceAttributesExpression:
          description: Expression to extract resource-level attributes.
          type: string
          example: ResourceAttributes
          nullable: true
        displayedTimestampValueExpression:
          description: This DateTime column is used to display and order search results.
          type: string
          example: TimestampTime
          nullable: true
        metricSourceId:
          description: HyperDX Source for metrics associated with logs. Optional
          type: string
          example: 507f1f77bcf86cd799439013
          nullable: true
        traceSourceId:
          description: HyperDX Source for traces associated with logs. Optional
          type: string
          example: 507f1f77bcf86cd799439014
          nullable: true
        traceIdExpression:
          description: Expression to extract the trace ID for correlating logs with traces.
          type: string
          example: TraceId
          nullable: true
        spanIdExpression:
          description: Expression to extract the span ID for correlating logs with traces.
          type: string
          example: SpanId
          nullable: true
        implicitColumnExpression:
          description: Column used for full text search if no property is specified in a Lucene-based search. Typically the message body of a log.
          type: string
          example: Body
          nullable: true
        knownColumnsListExpression:
          description: For Distributed table sources whose target tables have non-matching column sets. A list of columns supported across all target tables, used instead of SELECT * when fetching full row data. Leave blank to select all columns.
          type: string
          example: Timestamp, Body, ServiceName
          nullable: true
        useTextIndexForImplicitColumn:
          description: Controls whether lucene rendering uses ClickHouse text indices via hasAllTokens() against the implicit column. "auto" detects a covering index at query time, "enabled" forces text index usage, "disabled" forces a LIKE/hasToken fallback.
          type: string
          enum:
            - auto
            - enabled
            - disabled
          example: auto
          nullable: true
        highlightedTraceAttributeExpressions:
          type: array
          description: Expressions defining trace-level attributes which are displayed in the trace view for the selected trace.
          items:
            $ref: '#/components/schemas/ClickStackHighlightedAttributeExpression'
        highlightedRowAttributeExpressions:
          type: array
          description: Expressions defining row-level attributes which are displayed in the row side panel for the selected row.
          items:
            $ref: '#/components/schemas/ClickStackHighlightedAttributeExpression'
        materializedViews:
          type: array
          description: Configure materialized views for query optimization. These pre-aggregated views can significantly improve query performance on aggregation queries.
          items:
            $ref: '#/components/schemas/ClickStackMaterializedView'
        metadataMaterializedViews:
          properties:
            keyRollupTable:
              description: ClickHouse table name for the key rollup (field discovery).
              type: string
              example: otel_logs_key_rollup_15m
            kvRollupTable:
              description: ClickHouse table name for the key-value rollup (value autocomplete).
              type: string
              example: otel_logs_kv_rollup_15m
            granularity:
              description: The time granularity of the rollup tables.
              type: string
              example: 15m
          type: object
        durationExpression:
          description: Expression to extract span duration.
          type: string
          example: Duration
        durationPrecision:
          description: Number of decimal digits in the duration value (e.g., 3 for milliseconds, 6 for microseconds, 9 for nanoseconds).
          type: integer
        parentSpanIdExpression:
          description: Expression to extract the parent span ID.
          type: string
          example: ParentSpanId
        spanNameExpression:
          description: Expression to extract the span name.
          type: string
          example: SpanName
        spanKindExpression:
          description: Expression to extract the span kind (e.g., client, server, internal).
          type: string
          example: SpanKind
        logSourceId:
          description: HyperDX Source for logs associated with traces. Optional
          type: string
          example: 507f1f77bcf86cd799439011
          nullable: true
        sessionSourceId:
          description: HyperDX Source for sessions associated with traces. Optional
          type: string
          example: 507f1f77bcf86cd799439031
          nullable: true
        statusCodeExpression:
          description: Expression to extract the span status code.
          type: string
          example: StatusCode
          nullable: true
        statusMessageExpression:
          description: Expression to extract the span status message.
          type: string
          example: StatusMessage
          nullable: true
        spanEventsValueExpression:
          description: Expression to extract span events. Used to capture events associated with spans. Expected to be Nested ( Timestamp DateTime64(9), Name LowCardinality(String), Attributes Map(LowCardinality(String), String)
          type: string
          example: Events
          nullable: true
        metricTables:
          $ref: '#/components/schemas/ClickStackMetricTables'
      required:
        - name
        - kind
        - connection
        - from
        - defaultTableSelectExpression
        - timestampValueExpression
        - durationExpression
        - durationPrecision
        - traceIdExpression
        - spanIdExpression
        - parentSpanIdExpression
        - spanNameExpression
        - spanKindExpression
        - metricTables
        - resourceAttributesExpression
        - traceSourceId
      type: object
    ClickStackUpdateAlertRequest:
      properties:
        dashboardId:
          description: Dashboard ID for tile-based alerts.
          type: string
          example: 65f5e4a3b9e77c001a567890
          nullable: true
        tileId:
          description: Tile ID for tile-based alerts. Must be a line, stacked bar, or number type tile.
          type: string
          example: 65f5e4a3b9e77c001a901234
          nullable: true
        savedSearchId:
          description: Saved search ID for saved_search alerts.
          type: string
          example: 65f5e4a3b9e77c001a345678
          nullable: true
        groupBy:
          description: Group-by key for saved search alerts.
          type: string
          example: ServiceName
          nullable: true
        threshold:
          description: Threshold value for triggering the alert. For between and not_between threshold types, this is the lower bound.
          type: number
          example: 100
        thresholdMax:
          description: Upper bound for between and not_between threshold types. Required when thresholdType is between or not_between, must be >= threshold.
          type: number
          example: 500
          nullable: true
        interval:
          description: Evaluation interval for the alert.
          type: string
          enum:
            - 1m
            - 5m
            - 15m
            - 30m
            - 1h
            - 6h
            - 12h
            - 1d
          example: 1h
        scheduleOffsetMinutes:
          description: Offset from the interval boundary in minutes. For example, 2 with a 5m interval evaluates windows at :02, :07, :12, etc. (UTC).
          type: integer
          example: 2
          nullable: true
        scheduleStartAt:
          description: Absolute UTC start time anchor. Alert windows start from this timestamp and repeat every interval.
          type: string
          format: date-time
          example: '2026-02-08T10:00:00.000Z'
          nullable: true
        source:
          description: Alert source type (tile-based or saved search).
          type: string
          enum:
            - saved_search
            - tile
          example: tile
        thresholdType:
          description: Threshold comparison direction.
          type: string
          enum:
            - above
            - below
            - above_exclusive
            - below_or_equal
            - equal
            - not_equal
            - between
            - not_between
          example: above
        channel:
          $ref: '#/components/schemas/ClickStackAlertChannel'
        name:
          description: Human-friendly alert name.
          type: string
          example: Test Alert
          nullable: true
        message:
          description: Alert message template.
          type: string
          example: Test Alert Message
          nullable: true
        note:
          description: Freeform note for the alert. Supports markdown formatting.
          type: string
          example: Threshold raised from 50 to 100 on 2026-01-15. See [runbook](https://wiki.example.com/runbook).
          nullable: true
        numConsecutiveWindows:
          description: Fire the alert only after its condition has been met for this many consecutive evaluation windows. While the condition is met but fewer than this many consecutive windows have violated, the alert is in the PENDING state.
          type: integer
          example: 3
          nullable: true
      type: object
