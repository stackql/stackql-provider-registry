            - us-east-1
            - us-east-2
            - us-west-2
            - us-east1
            - us-central1
            - europe-west2
            - europe-west4
            - asia-southeast1
            - asia-northeast1
            - eastus
            - eastus2
            - westus3
            - germanywestcentral
            - centralus
      type: object
    ScalingSchedule:
      properties:
        entries:
          type: array
          description: List of schedule entries.
