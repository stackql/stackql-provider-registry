      type: object
    ScalingSchedulePostRequest:
      properties:
        entries:
          type: array
          description: List of schedule entries. Pass an empty array to clear the schedule.
          items:
            $ref: '#/components/schemas/ScalingScheduleEntryRequest'
      required:
        - entries
      type: object
    UpgradeWindow:
      properties:
        weekday:
          description: Day of the week the upgrade window starts. 0 = Sunday, 1 = Monday, …, 6 = Saturday.
          type: integer
          minimum: 0
          maximum: 6
          example: 3
        startHourUtc:
          description: UTC hour when the upgrade window starts. Must be one of 0, 6, 12, or 18.
          type: integer
          enum:
            - 0
            - 6
            - 12
            - 18
          example: 12
        duration:
          description: Length of the upgrade window in hours. Currently only a 6-hour window is supported.
          type: integer
          enum:
            - 6
          example: 6
      required:
        - weekday
        - startHourUtc
        - duration
      type: object
    UpgradeWindowPutRequest:
      properties:
        weekday:
          description: Day of the week the upgrade window starts. 0 = Sunday, 1 = Monday, …, 6 = Saturday.
          type: integer
          minimum: 0
          maximum: 6
          example: 3
        startHourUtc:
          description: UTC hour when the upgrade window starts. Must be one of 0, 6, 12, or 18. The upgrade window currently lasts 6 hours from this start time.
          type: integer
          enum:
            - 0
            - 6
            - 12
            - 18
          example: 12
      required:
        - weekday
        - startHourUtc
      type: object
    ServiceClickhouseSettingsList:
      properties:
        settings:
          type: array
          description: List of ClickHouse settings with their current values.
          items:
            $ref: '#/components/schemas/ServiceClickhouseSetting'
      type: object
    ServiceClickhouseSettingsPatchRequest:
      properties:
        settings:
          description: 'JSON object of setting names to values. Example: {"compatibility": "24.8"}'
          type: string
          example: '{"compatibility": "24.8"}'
      required:
        - settings
      type: object
    ServiceClickhouseSettingsPatchResponse:
      properties:
        settings:
          description: 'JSON object of setting names to their applied values. Example: {"compatibility": "24.8"}'
          type: string
          example: '{"compatibility": "24.8"}'
        warnings:
          type: array
          description: Warnings for settings that may have disruptive effects.
          items:
            $ref: '#/components/schemas/ServiceClickhouseSettingWarning'
      type: object
    ServiceClickhouseSettingsSchema:
      properties:
        settings:
          type: array
          description: List of all configurable ClickHouse settings with their types, descriptions, and constraints.
          items:
            $ref: '#/components/schemas/ServiceClickhouseSettingSchemaEntry'
      type: object
    ServiceClickhouseSetting:
      properties:
        name:
          description: Name of the setting.
          type: string
          example: compatibility
        value:
          description: Current value of the setting. Returned as a string for all setting types.
          type: string
          example: '24.8'
      type: object
    ServiceEndpoint:
      properties:
        protocol:
          description: 'Endpoint protocol: ''https'', ''nativesecure'', ''mysql''.'
          type: string
          enum:
            - https
            - nativesecure
            - mysql
          example: mysql
        host:
          description: Service host name
          type: string
        port:
          description: Numeric port
          type: number
        username:
          description: Optional username for the endpoint
          type: string
          nullable: true
      type: object
    IpAccessListEntry:
      properties:
        source:
          description: IP or CIDR
          type: string
        description:
          description: Optional description of IPv4 address or IPv4 CIDR to allow access from
          type: string
      type: object
    ResourceTagsV1:
      type: object
      properties:
        key:
          type: string
          description: Tag key. Must be alphanumeric with dashes, underscores and dots.
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9._-]+$
        value:
          type: string
          description: Tag value. Must be alphanumeric with dashes, underscores and dots.
          maxLength: 256
          pattern: ^[a-zA-Z0-9._-]+$
      required:
        - key
      example:
        key: Environment
        value: staging
    CurrentScaling:
      properties:
        effectiveAutoscalingMode:
          description: Autoscaling mode currently in effect on the running service. May diverge from the configured baseline mode while a schedule entry is active.
          type: string
          enum:
            - vertical
            - horizontal
        effectiveMinReplicaMemoryGb:
          description: Minimum memory per replica (Gb) currently applied to the running service. May diverge from the top-level `minReplicaMemoryGb` baseline while a schedule entry is active.
          type: number
        effectiveMaxReplicaMemoryGb:
          description: 'Maximum memory per replica (Gb) currently applied to the running service. May diverge from the top-level `maxReplicaMemoryGb` baseline while a schedule entry is active. Reflects the stored value: normally equal to `effectiveMinReplicaMemoryGb` in horizontal mode, but a legacy service stored with an unequal memory range reports the stored bounds as-is.'
          type: number
        effectiveMinReplicas:
          description: 'Minimum number of replicas currently applied to the running service. May diverge from the baseline while a schedule entry is active. Reflects the stored value: normally equal to `effectiveMaxReplicas` in vertical mode (a fixed replica count), but a legacy service stored with an unequal replica range reports the stored bounds as-is.'
          type: integer
        effectiveMaxReplicas:
          description: Maximum number of replicas currently applied to the running service. May diverge from the baseline while a schedule entry is active.
          type: integer
        effectiveIdleScaling:
          description: Whether idle scaling is currently in effect on the service. May diverge from the top-level `idleScaling` baseline while a schedule entry is active.
          type: boolean
        effectiveIdleTimeoutMinutes:
          description: Idle timeout in minutes currently in effect on the service. May diverge from the top-level `idleTimeoutMinutes` baseline while a schedule entry is active.
          type: integer
        activeEntryId:
          description: ID of the schedule entry whose values are currently applied to the service. Absent when no entry is active.
          type: string
          format: uuid
      type: object
    ServiceEndpointChange:
      properties:
        protocol:
          description: Endpoint protocol
          type: string
          enum:
            - mysql
          example: mysql
        enabled:
          description: Enable or disable the endpoint
          type: boolean
      type: object
    IpAccessListPatch:
      properties:
        add:
          type: array
          description: Elements to add. Executed after "remove" part is processed.
          items:
            $ref: '#/components/schemas/IpAccessListEntry'
        remove:
          type: array
          description: Elements to remove. Executed before "add" part is processed.
          items:
            $ref: '#/components/schemas/IpAccessListEntry'
      type: object
    InstancePrivateEndpointsPatch:
      properties:
        add:
          type: array
          description: Elements to add. Executed after "remove" part is processed.
          items:
            type: string
        remove:
          type: array
          description: Elements to remove. Executed before "add" part is processed.
          items:
            type: string
      type: object
    InstanceTagsPatch:
      properties:
        add:
          type: array
          description: Elements to add. Executed after "remove" part is processed.
          items:
            $ref: '#/components/schemas/ResourceTagsV1'
          maxItems: 50
        remove:
          type: array
          description: Elements to remove. Executed before "add" part is processed.
          items:
            $ref: '#/components/schemas/ResourceTagsV1'
          maxItems: 50
      type: object
    ScalingScheduleEntry:
      properties:
        id:
          description: Unique identifier for this schedule entry.
          type: string
          format: uuid
        name:
          description: Human-readable label for this schedule entry.
          type: string
        weekdays:
          type: array
          description: Days of the week this entry applies to. 0 = Sunday, 1 = Monday, …, 6 = Saturday.
          items:
            type: integer
          minItems: 1
        startHourUtc:
          description: UTC hour (0–23) when this entry becomes active (inclusive).
          type: integer
          minimum: 0
          maximum: 23
        endHourUtc:
          description: UTC hour (1–24) when this entry deactivates (exclusive). Must differ from startHourUtc. Set to 24 to end at midnight. Values less than startHourUtc create an overnight window spanning midnight.
          type: integer
          minimum: 1
          maximum: 24
        autoscalingMode:
          description: Autoscaling mode for this entry. "vertical" runs a fixed replica count while memory scales; "horizontal" scales the replica count at a fixed per-replica memory. Defaults to "vertical" for entries persisted before the mode was exposed.
          type: string
          enum:
            - vertical
            - horizontal
        minReplicaMemoryGb:
          description: Minimum memory per replica (Gb) during this window. A range in vertical; in horizontal it equals maxReplicaMemoryGb (memory is fixed while the replica count scales).
          type: number
        maxReplicaMemoryGb:
          description: Maximum memory per replica (Gb) during this window. A range in vertical; in horizontal it equals minReplicaMemoryGb (memory is fixed while the replica count scales).
          type: number
        minReplicas:
          description: Minimum number of replicas during this window. For a horizontal entry the replica count scales between minReplicas and maxReplicas; for a vertical entry minReplicas and maxReplicas are equal and report the fixed replica count (both omitted when the entry stored no count).
          type: integer
        maxReplicas:
          description: Maximum number of replicas during this window. For a horizontal entry the replica count scales between minReplicas and maxReplicas; for a vertical entry minReplicas and maxReplicas are equal and report the fixed replica count (both omitted when the entry stored no count).
          type: integer
        idleScaling:
          description: Whether idle scaling is enabled during this window.
          type: boolean
        idleTimeoutMinutes:
          description: Idle timeout in minutes during this window.
          type: integer
        isActiveNow:
          description: Whether this entry is currently active. Scheduled times are indicative — actions are applied on a best-effort basis and may be delayed by a few minutes.
          type: boolean
      required:
        - id
        - name
        - weekdays
        - startHourUtc
        - endHourUtc
        - autoscalingMode
        - isActiveNow
      type: object
    ScalingScheduleBaseConfig:
      properties:
        autoscalingMode:
          description: Autoscaling mode applied when no schedule entry is active. "vertical" runs a fixed replica count while memory scales; "horizontal" scales the replica count at a fixed per-replica memory.
          type: string
          enum:
            - vertical
            - horizontal
        minReplicaMemoryGb:
          description: Minimum memory per replica (Gb) when no schedule entry is active.
          type: number
        maxReplicaMemoryGb:
          description: Maximum memory per replica (Gb) when no schedule entry is active.
          type: number
        minReplicas:
          description: Minimum number of replicas when no schedule entry is active.
          type: integer
        maxReplicas:
          description: Maximum number of replicas when no schedule entry is active.
          type: integer
        idleScaling:
          description: Whether idle scaling is enabled when no schedule entry is active.
          type: boolean
        idleTimeoutMinutes:
          description: Idle timeout in minutes when no schedule entry is active.
          type: integer
      type: object
    ScalingScheduleEntryRequest:
      properties:
        name:
          description: Human-readable label for this schedule entry.
          type: string
          example: Business hours
        weekdays:
          type: array
          description: Days of the week this entry applies to. 0 = Sunday, 1 = Monday, …, 6 = Saturday.
          items:
            type: integer
          example:
            - 1
            - 2
            - 3
            - 4
            - 5
          minItems: 1
        startHourUtc:
          description: UTC hour (0–23) when this entry becomes active (inclusive).
          type: integer
          minimum: 0
          maximum: 23
          example: 9
        endHourUtc:
          description: UTC hour (1–24) when this entry deactivates (exclusive). Must differ from startHourUtc. Set to 24 to end at midnight. Values less than startHourUtc create an overnight window spanning midnight.
          type: integer
          minimum: 1
          maximum: 24
          example: 17
        autoscalingMode:
          description: Autoscaling mode for this entry. "vertical" (the default when omitted) runs a fixed replica count while memory scales between minReplicaMemoryGb and maxReplicaMemoryGb; "horizontal" scales the replica count between minReplicas and maxReplicas at a fixed per-replica memory (minReplicaMemoryGb equal to maxReplicaMemoryGb). Horizontal requires the feature to be enabled for the organization.
          type: string
          enum:
            - vertical
            - horizontal
          example: vertical
        minReplicaMemoryGb:
          description: Minimum memory per replica (Gb). Optional for vertical entries — provide both bounds for a memory range, or omit both to inherit memory from the base scaling config. Required for horizontal (both bounds, equal to maxReplicaMemoryGb — memory is fixed while the replica count scales). The upper bound is tier-dependent (lower for non-paid organizations) and enforced when the entry is applied.
          type: number
          minimum: 8
          maximum: 356
          multipleOf: 4
          example: 16
        maxReplicaMemoryGb:
          description: Maximum memory per replica (Gb). Optional for vertical entries — provide both bounds for a memory range, or omit both to inherit memory from the base scaling config. Required for horizontal (both bounds, equal to minReplicaMemoryGb — memory is fixed while the replica count scales). The upper bound is tier-dependent (lower for non-paid organizations) and enforced when the entry is applied.
          type: number
          minimum: 8
          maximum: 356
          multipleOf: 4
          example: 16
        numReplicas:
          description: Fixed replica count for a vertical entry (autoscalingMode "vertical" or omitted). Mutually exclusive with minReplicas/maxReplicas. The per-service replica maximum is variable (tier-dependent, configurable per service) and enforced when the entry is applied, not at request time.
          type: integer
          minimum: 1
          example: 3
        minReplicas:
          description: Minimum number of replicas. A minReplicas/maxReplicas band scales the replica count in a horizontal entry (autoscalingMode "horizontal"); when autoscalingMode is omitted or "vertical", an equal band (minReplicas === maxReplicas) is instead an accepted vertical fixed count and needs no horizontal entitlement. Must be provided together with maxReplicas. The per-service replica maximum is variable (tier-dependent, configurable per service) and enforced when the entry is applied, not at request time.
          type: integer
          minimum: 1
          example: 2
        maxReplicas:
          description: Maximum number of replicas. A minReplicas/maxReplicas band scales the replica count in a horizontal entry (autoscalingMode "horizontal"); when autoscalingMode is omitted or "vertical", an equal band (minReplicas === maxReplicas) is instead an accepted vertical fixed count and needs no horizontal entitlement. Must be provided together with minReplicas. The per-service replica maximum is variable (tier-dependent, configurable per service) and enforced when the entry is applied, not at request time.
          type: integer
          minimum: 1
          example: 3
        idleScaling:
          description: Whether idle scaling is enabled during this window.
          type: boolean
        idleTimeoutMinutes:
          description: Idle timeout in minutes during this window.
          type: integer
      required:
        - name
        - weekdays
        - startHourUtc
        - endHourUtc
      type: object
    ServiceClickhouseSettingWarning:
      properties:
        name:
          description: Name of the setting the warning applies to.
          type: string
          example: compatibility
        message:
          description: Warning message.
          type: string
          example: Changing the compatibility version without comprehensive testing can cause query failures or instability.
      type: object
    ServiceClickhouseSettingSchemaEntry:
      properties:
        name:
          description: Name of the setting.
          type: string
          example: compatibility
        type:
          description: Data type of the setting value.
          type: string
          example: string
        description:
          description: Description of the setting.
          type: string
          example: ClickHouse version compatibility setting.
        enum:
          type: array
          description: List of allowed values, if the setting is an enum.
          items:
            type: integer
          example:
            - 0
            - 1
        warning:
          description: Warning message about potential disruptive effects of changing this setting.
          type: string
          example: Changing this setting without comprehensive testing can cause instability.
        deprecationNotice:
          description: Deprecation notice, if applicable.
          type: string
          example: This setting may become obsolete with Cloud v2 stateless workers.
        example:
          description: Example value for the setting.
          type: string
          example: '24.8'
      type: object
