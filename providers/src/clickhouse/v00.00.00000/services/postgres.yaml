    pgHaType:
      type: string
      description: 'Type of high availability: “none” for no replication, “async” for asynchronous replication to a single standby, and “sync” for synchronous replication to two standbys.'
      enum:
        - none
        - async
        - sync
    pgTags:
      type: array
      items:
        $ref: '#/components/schemas/ResourceTagsV1'
      maxItems: 50
      title: Postgres Tags
      description: Tags associated with the Postgres service. Tag keys starting with “chc_” are reserved for internal use.
    pgConfig:
      type: object
      title: Postgres Configuration
      description: Postgres [runtime configuration](https://www.postgresql.org/docs/current/runtime-config.html) configuration.
      properties:
        max_connections:
          type: string
          description: Sets the maximum number of concurrent connections to the database server.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/max_connections/
          example: 500
          minimum: 1
        default_transaction_isolation:
          type: string
          description: Sets the default transaction isolation level for new transactions.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/default_transaction_isolation/
          example: read committed
          enum:
            - read committed
            - repeatable read
            - serializable
        ssl_min_protocol_version:
          type: string
          description: Sets the minimum SSL/TLS protocol version allowed for client connections.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/ssl_min_protocol_version/
          example: TLSv1.3
          enum:
            - TLSv1
            - TLSv1.1
            - TLSv1.2
            - TLSv1.3
        maintenance_work_mem:
          type: string
          description: Sets the maximum memory to be used for maintenance operations.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/maintenance_work_mem/
          example: 64MB
          minimum: 64
        work_mem:
          type: string
          description: Sets the amount of memory Postgres will use for internal operations like sorting and hashing as part of executing a query.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/work_mem/
          example: 4MB
          minimum: 64
        effective_cache_size:
          type: string
          description: Sets the planner's assumption about the total size of data caches.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/effective_cache_size/
          example: 4GB
          minimum: 8
        random_page_cost:
          type: string
          description: Sets the planner's estimate of the cost of a non-sequentially-fetched disk page. Lower values (1.1-1.5) are better for SSDs.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/random_page_cost/
          example: 1.1
          minimum: 0
        effective_io_concurrency:
          type: string
          description: Number of concurrent disk I/O operations the planner expects. Higher values (100-200) benefit SSDs.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/effective_io_concurrency/
          example: 200
          minimum: 0
        max_worker_processes:
          type: string
          description: Maximum number of background processes the system can support. Includes parallel query workers, logical replication, and more.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/max_worker_processes/
          example: 8
          minimum: 0
        max_parallel_workers:
          type: string
          description: Maximum number of workers that can be used for parallel operations. Cannot exceed max_worker_processes.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/max_parallel_workers/
          example: 4
          minimum: 0
        max_parallel_workers_per_gather:
          type: string
          description: Maximum number of parallel workers per executor node for parallel queries. Use 0 to disable parallel queries.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/max_parallel_workers_per_gather/
          example: 2
          minimum: 0
        max_parallel_maintenance_workers:
          type: string
          description: Maximum number of parallel workers for maintenance operations like CREATE INDEX and VACUUM.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/max_parallel_maintenance_workers/
          example: 2
          minimum: 0
        statement_timeout:
          type: string
          description: Abort any statement that runs longer than the specified time. Use 0 to disable.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/statement_timeout/
          example: 60s
          minimum: 0
        lock_timeout:
          type: string
          description: Abort any statement that waits longer than the specified time while attempting to acquire a lock. Use 0 to disable.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/lock_timeout/
          example: 10s
          minimum: 0
        idle_session_timeout:
          type: string
          description: Terminate any session that has been idle for longer than the specified time. Use 0 to disable.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/idle_session_timeout/
          example: 2m
          minimum: 0
        idle_in_transaction_session_timeout:
          type: string
          description: Terminate any session that has been idle within an open transaction for longer than the specified time. Use 0 to disable.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/idle_in_transaction_session_timeout/
          example: 2h
          minimum: 0
        transaction_timeout:
          type: string
          description: Terminate any statement that takes more than the specified time, even while active. Use 0 to disable.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/transaction_timeout/
          example: 120s
          minimum: 0
        wal_sender_timeout:
          type: string
          description: Terminate replication connections that are inactive for longer than this time. Use 0 to disable.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/wal_sender_timeout/
          example: 120m
          minimum: 0
        wal_keep_size:
          type: string
          description: Minimum size of past WAL files kept in pg_wal for standby servers. Use 0 to disable.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/wal_keep_size/
          example: 1GB
          minimum: 0
        min_wal_size:
          type: string
          description: Minimum size to shrink the WAL to. WAL files are recycled rather than removed when below this size.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/min_wal_size/
          example: 80MB
          minimum: 32768
        max_wal_size:
          type: string
          description: Maximum size WAL can grow between checkpoints. Larger values improve write performance but increase crash recovery time.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/max_wal_size/
          example: 5GB
          minimum: 32768
        max_slot_wal_keep_size:
          type: string
          description: Specifies the maximum size of WAL files that replication slots are allowed to retain. Use -1 for unlimited.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/max_slot_wal_keep_size/
          example: '-1'
          minimum: 0
        wal_compression:
          type: string
          description: Compress full-page writes in WAL. Reduces I/O at the cost of CPU. Options vary by PostgreSQL version.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/wal_compression/
          example: 'off'
          enum:
            - 'off'
            - 'on'
            - lz4
            - zstd
        autovacuum_max_workers:
          type: string
          description: Maximum number of autovacuum worker processes that can run at the same time. Workers share a single cost-limit budget, so raising this alone may not speed up vacuuming.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/autovacuum_max_workers/
          example: 8
          minimum: 1
        autovacuum_naptime:
          type: string
          description: Minimum delay between autovacuum runs. Lower values make autovacuum check for work more frequently.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/autovacuum_naptime/
          example: 5s
          minimum: 1
        autovacuum_work_mem:
          type: string
          description: Maximum memory each autovacuum worker uses to track dead tuples. Higher values reduce repeated index-vacuum passes on large tables. Use -1 to fall back to maintenance_work_mem.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/autovacuum_work_mem/
          example: 64000kB
          minimum: 1024
        autovacuum_vacuum_scale_factor:
          type: string
          description: Fraction of a table's rows that must change before autovacuum runs. Lower values vacuum large tables more frequently.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/autovacuum_vacuum_scale_factor/
          example: 0.2
          minimum: 0
        autovacuum_analyze_scale_factor:
          type: string
          description: Fraction of a table's rows that must change before autovacuum runs ANALYZE to refresh planner statistics.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/autovacuum_analyze_scale_factor/
          example: 0.1
          minimum: 0
        autovacuum_vacuum_insert_scale_factor:
          type: string
          description: Fraction of a table's rows that must be inserted before autovacuum runs. Helps vacuum insert-heavy, rarely-updated tables.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/autovacuum_vacuum_insert_scale_factor/
          example: 0.2
          minimum: 0
        autovacuum_vacuum_cost_limit:
          type: string
          description: Cost-accounting limit shared across all autovacuum workers before they pause. Use -1 to inherit vacuum_cost_limit.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/autovacuum_vacuum_cost_limit/
          example: '-1'
          minimum: 1
        autovacuum_vacuum_cost_delay:
          type: string
          description: Time autovacuum sleeps when the cost limit is reached. Lower values speed up vacuuming at the cost of more I/O.
          externalDocs:
            url: https://postgresqlco.nf/doc/en/param/autovacuum_vacuum_cost_delay/
          example: 2ms
          minimum: 0
      additionalProperties: false
      minProperties: 1
      example:
        max_connections: 100
    pgBouncerConfig:
      type: object
      title: PgBouncer Configuration
      description: PgBouncer [runtime configuration](https://www.pgbouncer.org/config.html) configuration.
      additionalProperties:
        type: string
        description: Any PgBouncer configuration parameter.
      minProperties: 1
      maxProperties: 64
      example:
        default_pool_size: '16'
    pgIdProperty:
      type: string
      title: Unique Postgres service ID
      format: uuid
      example: f71df78e-ddad-82d0-8dfa-abbec741b82e
    pgStorageSize:
      type: integer
      title: Storage Size
      description: The storage size, in GiB, which must be supported by the specified `size`.
    pgStateProperty:
      type: string
      title: Postgres Service State
      description: Current state of the service
      enum:
        - creating
        - restarting
        - running
        - replaying_wal
        - restoring_backup
        - finalizing_restore
        - unavailable
        - stopped
        - deleting
    pgCreatedAtProperty:
      type: string
      format: date-time
      title: Postgres Service creation timestamp
      example: '2026-03-26T20:51:16.384Z'
    pgIsPrimaryProperty:
      type: boolean
      title: Postgres Service is Primary
      description: True if this service is the primary service in the data warehouse
      default: false
    pgPitrRestoreTargetProperty:
      type: string
      format: date-time
      title: PITR Restore Target as an RFC 3339-formatted timestamp in UTC time.
      example: '2026-03-31T18:17:37Z'
      description: The point in time at which to recover, as either date/time, named restore point, or a specific transaction ID.
    pgPassword:
      title: Password
      type: string
      description: |
        Optional password. If not provided a new password is generated and provided in the response. Must contain:

        * At least one lowercase letter
        * At least one uppercase letter
        * At least one digit
      minLength: 12
      maxLength: 1024
      pattern: '[a-z]'
    PostgresMetric:
      properties:
        key:
          description: Stable metric identifier (for example cpu_usage, connection_count, cache_hit_ratio).
          type: string
        name:
          description: Human-readable metric name.
          type: string
        unit:
          description: Unit of the metric values (for example %, IOPS, bytes/s, count).
          type: string
        description:
          description: Human-readable description of what the metric measures.
          type: string
        series:
          type: array
          description: One series per label dimension of the metric.
          items:
            $ref: '#/components/schemas/PostgresMetricSeries'
      required:
        - key
        - name
        - unit
        - description
        - series
      type: object
    PostgresQueryExecution:
      properties:
        timestamp:
          description: Execution timestamp (RFC 3339).
          type: string
          format: date-time
        queryId:
          description: Stable identifier for the query pattern.
          type: string
        dbName:
          description: Database the query ran in.
          type: string
        dbUser:
          description: Database user that executed the query.
          type: string
        dbOperation:
          description: Top-level SQL operation type.
          type: string
        app:
          description: Value of the Postgres `application_name` for this execution.
          type: string
        queryText:
          description: Normalized query text for this execution.
          type: string
        pid:
          description: Postgres backend process ID that executed the query.
          type: string
        durationUs:
          description: Execution duration in microseconds.
          type: integer
        rows:
          description: Rows returned or affected.
          type: integer
        sharedBlksHit:
          description: Shared buffer blocks hit.
          type: integer
        sharedBlksRead:
          description: Shared buffer blocks read from disk.
          type: integer
        sharedBlksWritten:
          description: Shared buffer blocks written.
          type: integer
        sharedBlksDirtied:
          description: Shared buffer blocks dirtied.
          type: integer
        sharedBlkReadTimeUs:
          description: Time spent reading shared blocks, in microseconds.
          type: integer
        sharedBlkWriteTimeUs:
          description: Time spent writing shared blocks, in microseconds.
          type: integer
        localBlksHit:
          description: Local buffer blocks hit (temp tables).
          type: integer
        localBlksRead:
          description: Local buffer blocks read (temp tables).
          type: integer
        localBlksWritten:
          description: Local buffer blocks written (temp tables).
          type: integer
        localBlksDirtied:
          description: Local buffer blocks dirtied (temp tables).
          type: integer
        tempBlksRead:
          description: Temp blocks read (spills to disk).
          type: integer
        tempBlksWritten:
          description: Temp blocks written (spills to disk).
          type: integer
        tempBlkReadTimeUs:
          description: Time spent reading temp blocks, in microseconds.
          type: integer
        tempBlkWriteTimeUs:
          description: Time spent writing temp blocks, in microseconds.
          type: integer
        walRecords:
          description: Number of WAL records produced.
          type: integer
        walBytes:
          description: Number of WAL bytes produced.
          type: integer
        walFpi:
          description: Number of WAL full-page images produced.
          type: integer
        cpuUserTimeUs:
          description: CPU time spent in user mode, in microseconds.
          type: integer
        cpuSysTimeUs:
          description: CPU time spent in kernel mode, in microseconds.
          type: integer
        jitFunctions:
          description: Number of JIT-compiled functions.
          type: integer
        jitGenerationTimeUs:
          description: JIT generation time, in microseconds.
          type: integer
        jitInliningTimeUs:
          description: JIT inlining time, in microseconds.
          type: integer
        jitOptimizationTimeUs:
          description: JIT optimization time, in microseconds.
          type: integer
        jitEmissionTimeUs:
          description: JIT emission time, in microseconds.
          type: integer
        jitDeformTimeUs:
          description: JIT deform time, in microseconds.
          type: integer
        parallelWorkersPlanned:
          description: Parallel workers planned for this execution.
          type: integer
        parallelWorkersLaunched:
          description: Parallel workers actually launched for this execution.
          type: integer
        errMessage:
          description: Error message if the execution raised an error.
          type: string
        errSqlstate:
          description: Postgres SQLSTATE code if the execution raised an error.
          type: string
        errElevel:
          description: Postgres error severity level if the execution raised an error.
          type: integer
        serverRole:
          description: Role of the server that executed the query (for example, primary or standby).
          type: string
        traceId:
          description: OpenTelemetry trace ID associated with the execution.
          type: string
        spanId:
          description: OpenTelemetry span ID associated with the execution.
          type: string
      required:
        - timestamp
        - queryId
        - dbName
        - dbUser
        - dbOperation
        - app
        - queryText
        - pid
        - durationUs
        - rows
        - sharedBlksHit
        - sharedBlksRead
        - sharedBlksWritten
        - sharedBlksDirtied
        - sharedBlkReadTimeUs
        - sharedBlkWriteTimeUs
        - localBlksHit
        - localBlksRead
        - localBlksWritten
        - localBlksDirtied
        - tempBlksRead
        - tempBlksWritten
        - tempBlkReadTimeUs
        - tempBlkWriteTimeUs
        - walRecords
        - walBytes
        - walFpi
        - cpuUserTimeUs
        - cpuSysTimeUs
        - jitFunctions
        - jitGenerationTimeUs
        - jitInliningTimeUs
        - jitOptimizationTimeUs
        - jitEmissionTimeUs
        - jitDeformTimeUs
        - parallelWorkersPlanned
        - parallelWorkersLaunched
        - serverRole
      type: object
    ResourceTagsV1:
      type: object
      properties:
        key:
          type: string
          description: Tag key. Must be alphanumeric with dashes, underscores and dots.
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9._-]+$
        value:
          type: string
          description: Tag value. Must be alphanumeric with dashes, underscores and dots.
          maxLength: 256
          pattern: ^[a-zA-Z0-9._-]+$
      required:
        - key
      example:
        key: Environment
        value: staging
    PostgresMetricSeries:
      properties:
        label:
          description: Distinguishing label for this series within the metric (for example a CPU mode, a database name, or "Reads").
          type: string
        dataPoints:
          type: array
          description: Time-ordered data points, one per bucket.
          items:
            $ref: '#/components/schemas/PostgresMetricDataPoint'
      required:
        - label
        - dataPoints
      type: object
    PostgresMetricDataPoint:
      properties:
        timestamp:
          description: Bucket start time as a Unix timestamp in seconds.
          type: integer
        value:
          description: Metric value for the bucket.
          type: number
      required:
        - timestamp
        - value
      type: object
