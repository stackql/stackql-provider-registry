                    description: Detailed error description.
                  requestId:
                    type: string
                    description: Unique id assigned to every request. UUIDv4
                    format: uuid
      tags:
        - OpenAPI
components:
  schemas:
    ApiKey:
      properties:
        id:
          description: Unique API key ID.
          type: string
          format: uuid
        name:
          description: Name of the key
          type: string
        state:
          description: 'State of the key: ''enabled'', ''disabled''.'
          type: string
          enum:
            - enabled
            - disabled
        roles:
          type: array
          description: DEPRECATED. Use `assignedRoles` instead. List of roles assigned to the key. For organizations that have migrated to custom roles, this field is frozen at the pre-migration value and does not reflect current role assignments.
          items:
            type: string
            enum:
              - admin
              - developer
              - query_endpoints
          deprecated: true
        assignedRoles:
          type: array
          description: Custom roles and System roles assigned to this API key
          items:
            $ref: '#/components/schemas/AssignedRole'
        keySuffix:
          description: Last 4 letters of the key.
          type: string
        createdAt:
          description: Timestamp the key was created. ISO-8601.
          type: string
          format: date-time
        expireAt:
          description: Timestamp the key expires. If not present, `null` or is empty the key never expires. ISO-8601.
          type: string
          format: date-time
          nullable: true
        usedAt:
          description: Timestamp the key was used last time, with one-minute precision. If not present the key was never used. ISO-8601.
          type: string
          format: date-time
        ipAccessList:
          type: array
          description: List of IP addresses allowed to access the API using this key
          items:
            $ref: '#/components/schemas/IpAccessListEntry'
      type: object
    ApiKeyPostRequest:
      properties:
        name:
          description: Name of the key.
          type: string
        expireAt:
          description: Timestamp the key expires. If not present, `null` or is empty the key never expires. ISO-8601.
          type: string
          format: date-time
          nullable: true
        state:
          description: 'Initial state of the key: ''enabled'', ''disabled''. If not provided the new key will be ''enabled''.'
          type: string
          enum:
            - enabled
            - disabled
        hashData:
          $ref: '#/components/schemas/ApiKeyHashData'
        roles:
          type: array
          description: DEPRECATED. Use `assignedRoleIds` instead. List of roles assigned to the key. Contains at least 1 element.
          items:
            type: string
            enum:
              - admin
              - developer
              - query_endpoints
          deprecated: true
        assignedRoleIds:
          type: array
          description: Array of role UUIDs to assign to the API key
          items:
            type: string
            format: uuid
        ipAccessList:
          type: array
          description: List of IP addresses allowed to access the API using this key
          items:
            $ref: '#/components/schemas/IpAccessListEntry'
      type: object
    ApiKeyPostResponse:
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        keyId:
          description: Generated key ID. Provided only if there was no 'hashData' in the request.
          type: string
        keySecret:
          description: Generated key secret. Provided only if there was no 'hashData' in the request.
          type: string
      type: object
    ApiKeyPatchRequest:
      properties:
        name:
          description: Name of the key
          type: string
        roles:
          type: array
          description: DEPRECATED. Use `assignedRoleIds` instead. List of roles assigned to the key.
          items:
            type: string
            enum:
              - admin
              - developer
              - query_endpoints
          deprecated: true
        assignedRoleIds:
          type: array
          description: Array of role UUIDs to assign to the API key
          items:
            type: string
            format: uuid
        expireAt:
          description: Timestamp the key expires. If `null` or is empty the key never expires. ISO-8601.
          type: string
          format: date-time
          nullable: true
        state:
          description: 'State of the key: ''enabled'', ''disabled''.'
          type: string
          enum:
            - enabled
            - disabled
        ipAccessList:
          type: array
          description: List of IP addresses allowed to access the API using this key
          items:
            $ref: '#/components/schemas/IpAccessListEntry'
      type: object
    AssignedRole:
      properties:
        roleId:
          description: Unique identifier of the role
          type: string
          format: uuid
        roleName:
          description: Human-readable name of the role
          type: string
        roleType:
          description: 'Type of role: system (predefined) or custom (organization-defined)'
          type: string
          enum:
            - system
            - custom
      type: object
    IpAccessListEntry:
      properties:
        source:
          description: IP or CIDR
          type: string
        description:
          description: Optional description of IPv4 address or IPv4 CIDR to allow access from
          type: string
      type: object
    ApiKeyHashData:
      properties:
        keyIdHash:
          description: 'Hash of the key ID. '
          type: string
        keyIdSuffix:
          description: 'Last 4 digits of the key ID. Algorithm: echo -n "yourpassword" | sha256sum | tr -d ''-'' | xxd -r -p | base64'
          type: string
        keySecretHash:
          description: 'Hash of the key secret. Algorithm: echo -n "yourpassword" | sha256sum | tr -d ''-'' | xxd -r -p | base64'
          type: string
      type: object
  x-stackQL-resources:
    keys:
      id: clickhouse.keys.keys
      name: keys
      title: Keys
      methods:
        list:
          operation:
            $ref: '#/paths/~1keys/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.result
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1keys/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1keys~1{keyId}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.result
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1keys~1{keyId}/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        delete:
          operation:
            $ref: '#/paths/~1keys~1{keyId}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/keys/methods/get'
          - $ref: '#/components/x-stackQL-resources/keys/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/keys/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/keys/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/keys/methods/delete'
        replace: []
servers:
  - url: https://api.clickhouse.cloud/v1/organizations/{organization_id}
    variables:
      organization_id:
        description: ClickHouse Cloud organization ID. Resolved from the CLICKHOUSE_ORG_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every query as WHERE organization_id = <uuid>. A WHERE value always takes precedence over the environment.
        x-stackQL-envVar: CLICKHOUSE_ORG_ID
