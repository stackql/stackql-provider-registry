openapi: 3.0.0
info:
  title: addons API
  description: digitalocean API
  version: '2.0'
paths:
  /v2/add-ons/apps:
    get:
      operationId: addons_get_app
      summary: List Available Add-On Applications
      description: >
        To fetch details of all available Add-On Applications, send a GET
        request to `/v2/add-ons/apps`.
      tags:
        - Add-Ons
      responses:
        '200':
          $ref: '#/components/responses/addons_get_app'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/add-ons/apps" 
      security:
        - bearer_auth: []
  /v2/add-ons/apps/{app_slug}/metadata:
    get:
      operationId: addons_get_app_metadata
      summary: Get Metadata for an Add-On Application
      description: >
        To find out what metadata is required for a specific add-on, send a GET
        request to `/v2/add-ons/apps/{app_slug}/metadata`.

        Metadata varies by application.
      tags:
        - Add-Ons
      parameters:
        - name: app_slug
          in: path
          required: true
          example: example_app
          schema:
            type: string
          description: >-
            The slug identifier for the application whose metadata is being
            requested.
      responses:
        '200':
          $ref: '#/components/responses/addons_get_app_metadata'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/add-ons/apps/example-app/metadata" 
      security:
        - bearer_auth: []
  /v2/add-ons/saas:
    get:
      operationId: addons_list
      summary: List all Add-On Resources
      description: >
        To fetch all Add-On Resources under your team, send a GET request to
        `/v2/add-ons/saas`.
      tags:
        - Add-Ons
      responses:
        '200':
          $ref: '#/components/responses/addons_list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/add-ons/saas" 
      security:
        - bearer_auth:
            - addon:read
    post:
      operationId: addons_create
      summary: Create/Provision a New Add-on Resource
      description: >
        To create an add-on resource, send a POST request to `/v2/add-ons/saas`
        with required parameters.

        Some add-ons require additional metadata to be provided in the request
        body. To find out

        what metadata is required for a specific add-on, send a GET request to
        `/v2/add-ons/apps/{app_slug}/metadata`.
      tags:
        - Add-Ons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - app_slug
                - plan_slug
                - metadata
              type: object
              properties:
                app_slug:
                  title: app_slug
                  type: string
                  example: example-app
                  description: >-
                    The slug identifier for the application associated with the
                    resource.
                plan_slug:
                  title: plan_slug
                  type: string
                  example: basic_plan
                  description: >-
                    The slug identifier for the plan associated with the
                    resource.
                name:
                  title: name
                  type: string
                  example: my-resource-01
                  description: The name of the addon resource.
                metadata:
                  title: metadata
                  type: array
                  items:
                    $ref: '#/components/schemas/addons_resource_metadata'
                  description: >-
                    Metadata associated with the resource, set by the user.
                    Metadata expected varies per app, and can be verified with a
                    GET request to "/v2/add-ons/apps/{app_slug}/metadata"
                linked_droplet_id:
                  title: linked_droplet_id
                  type: integer
                  example: 12345678
                  description: >-
                    ID of the droplet to be linked to this resource, if
                    applicable.
                fleet_uuid:
                  title: fleet_uuid
                  type: string
                  example: f1234567-89ab-cdef-0123-456789abcdef01
                  description: >-
                    UUID of the fleet/project to which this resource will
                    belong.
      responses:
        '200':
          $ref: '#/components/responses/addons_create'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -d '{"name":"my-addon-resource", "app_slug": "example-app", "plan_slug": "basic_plan", "metadata": [{"name": "company_name", "value": "Sample Company"}]}' \
              "https://api.digitalocean.com/v2/add-ons/saas"
      security:
        - bearer_auth:
            - addon:create
  /v2/add-ons/saas/{resource_uuid}:
    get:
      operationId: addons_get
      summary: Get details on an Add-On Resource
      description: >
        To fetch details of a specific Add-On Resource, send a GET request to
        `/v2/add-ons/saas/{resource_uuid}`.

        Replace `{resource_uuid}` with the UUID of the resource you want to
        retrieve.
      tags:
        - Add-Ons
      parameters:
        - name: resource_uuid
          in: path
          required: true
          example: 123e4567-e89b-12d3-a456-426614174000
          schema:
            type: string
          description: The UUID of the add-on resource to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/addons_get'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/add-ons/saas/123e4567-e89b-12d3-a456-4266141" 
      security:
        - bearer_auth:
            - addon:read
    delete:
      operationId: addons_delete
      summary: Delete/Deprovision an Add-on Resource
      description: >
        To delete an add-on resource, send a DELETE request to
        `/v2/add-ons/saas/{resource_uuid}` with the UUID of the resource to
        delete. 

        You cannot retrieve the resource after it has been deleted. The response
        indicates a request was sent to the 3rd party add-on provider to delete
        the resource.

        You will no longer be billed for this resource.
      tags:
        - Add-Ons
      parameters:
        - $ref: '#/components/parameters/resource_uuid'
      responses:
        '200':
          $ref: '#/components/responses/no_content'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X DELETE \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/add-ons/saas/123e4567-e89b-12d3-a456-426614174000"
      security:
        - bearer_auth:
            - addon:delete
    patch:
      operationId: addons_patch
      summary: Update the name for an Add-On Resource
      description: >
        To change the name of an Add-On Resource, send a PATCH request to
        `/v2/add-ons/saas/{resource_uuid}`.

        Replace `{resource_uuid}` with the UUID of the resource for which you
        want to change the name.
      tags:
        - Add-Ons
      parameters:
        - name: resource_uuid
          in: path
          required: true
          example: 123e4567-e89b-12d3-a456-426614174000
          schema:
            type: string
          description: The UUID of the add-on resource to rename.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new name for the add-on resource.
                  example: new-name
              required:
                - name
      responses:
        '200':
          $ref: '#/components/responses/addons_update'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X PATCH \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -d '{"name":"new-name"}' \
              "https://api.digitalocean.com/v2/add-ons/saas/abc12345-6789-0123-4567-89abcdef0123"
      security:
        - bearer_auth:
            - addon:update
  /v2/add-ons/saas/{resource_uuid}/plan:
    patch:
      operationId: addons_patch_plan
      summary: Update the plan for an Add-On Resource
      description: >
        To change the plan associated with an Add-On Resource, send a PATCH
        request to `/v2/add-ons/saas/{resource_uuid}/plan`.

        Replace `{resource_uuid}` with the UUID of the resource for which you
        want to change the plan.
      tags:
        - Add-Ons
      parameters:
        - name: resource_uuid
          in: path
          required: true
          example: 123e4567-e89b-12d3-a456-426614174000
          schema:
            type: string
          description: The UUID of the add-on resource to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_slug:
                  type: string
                  description: >-
                    The slug identifier for the new plan to apply to the add-on
                    resource.
                  example: basic_plan
              required:
                - plan_slug
      responses:
        '200':
          $ref: '#/components/responses/addons_update'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X PATCH \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -d '{"plan_slug":"new-plan"}' \
              "https://api.digitalocean.com/v2/add-ons/saas/abc12345-6789-0123-4567-89abcdef0123/plan"
      security:
        - bearer_auth:
            - addon:update
components:
  schemas:
    addons_resource_new:
      type: object
      properties:
        app_slug:
          title: app_slug
          type: string
          example: example-app
          description: >-
            The slug identifier for the application associated with the
            resource.
        plan_slug:
          title: plan_slug
          type: string
          example: basic_plan
          description: The slug identifier for the plan associated with the resource.
        name:
          title: name
          type: string
          example: my-resource-01
          description: The name of the addon resource.
        metadata:
          title: metadata
          type: array
          items:
            $ref: '#/components/schemas/addons_resource_metadata'
          description: >-
            Metadata associated with the resource, set by the user. Metadata
            expected varies per app, and can be verified with a GET request to
            "/v2/add-ons/apps/{app_slug}/metadata"
        linked_droplet_id:
          title: linked_droplet_id
          type: integer
          example: 12345678
          description: ID of the droplet to be linked to this resource, if applicable.
        fleet_uuid:
          title: fleet_uuid
          type: string
          example: f1234567-89ab-cdef-0123-456789abcdef01
          description: UUID of the fleet/project to which this resource will belong.
      required:
        - app_slug
        - plan_slug
        - name
        - metadata
    addons_app_info:
      type: object
      properties:
        app_slug:
          title: app_slug
          type: string
          example: example-app
          description: >-
            The slug identifier for the application associated with the
            resource.
        tos:
          title: tos
          type: string
          example: https://example.com/tos
          description: The Terms of Service URL for the resource.
        eula:
          title: eula
          type: string
          example: https://example.com/eula
          description: The End User License Agreement URL for the resource.
        plans:
          title: plans
          type: array
          description: A list of plans available for the resource.
          items:
            $ref: '#/components/schemas/addons_plan'
      required:
        - app_slug
        - tos
        - eula
        - plans
    error:
      type: object
      properties:
        id:
          description: >-
            A short identifier corresponding to the HTTP status code returned.
            For  example, the ID for a response returning a 404 status code
            would be "not_found."
          type: string
          example: not_found
        message:
          description: >-
            A message providing additional information about the error,
            including  details to help resolve it when possible.
          type: string
          example: The resource you were accessing could not be found.
        request_id:
          description: >-
            Optionally, some endpoints may include a request ID that should be 
            provided when reporting bugs or opening support tickets to help 
            identify the issue.
          type: string
          example: 4d9d8375-3c56-4925-a3e7-eb137fed17e9
      required:
        - id
        - message
    addons_app_metadata:
      type: object
      properties:
        id:
          title: id
          type: integer
          example: 1
          description: Unique identifier for the addon metadata item.
        name:
          title: name
          type: string
          example: country_of_origin
          description: The name of the metadata item.
        display_name:
          title: display_name
          type: string
          example: Country of Origin
          description: The display name of the metadata item.
        description:
          title: description
          type: string
          example: Country for localization
          description: A brief description of the metadata item.
        type:
          title: type
          type: string
          enum:
            - string
            - boolean
          example: string
          description: The data type of the metadata value.
        options:
          title: options
          type: array
          example:
            - US
            - UK
            - CA
          items:
            type: string
            example: UK
            description: An option available for the addon metadata, if applicable.
      required:
        - id
        - name
        - display_name
        - description
        - type
    addons_resource:
      type: object
      properties:
        uuid:
          title: uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier for the addon resource.
        name:
          title: name
          type: string
          example: my-resource-01
          description: The name of the addon resource.
        state:
          title: state
          type: string
          enum:
            - pending
            - provisioning
            - provisioned
            - deprovisioning
            - deprovisioned
            - provisioning-failed
            - deprovisioning-failed
            - suspended
          example: provisioned
          description: The state the resource is currently in.
        app_name:
          title: app_name
          type: string
          example: Example App
          description: The name of the application associated with the resource.
        app_slug:
          title: app_slug
          type: string
          example: example_app
          description: >-
            The slug identifier for the application associated with the
            resource.
        plan_name:
          title: plan_name
          type: string
          example: Basic Plan
          description: The name of the plan associated with the resource.
        plan_slug:
          title: plan_slug
          type: string
          example: basic_plan
          description: The slug identifier for the plan associated with the resource.
        plan_price_per_month:
          title: plan_price_per_month
          type: integer
          example: 10
          description: The price of the plan per month in US dollars.
        has_config:
          title: has_config
          type: boolean
          example: true
          description: >-
            Indicates if the resource has configuration values set by the
            vendor.
        metadata:
          title: metadata
          type: array
          description: Metadata associated with the resource, set by the user.
          items:
            $ref: '#/components/schemas/addons_resource_metadata'
        sso_url:
          title: sso_url
          type: string
          example: https://example.com/sso
          description: The Single Sign-On URL for the resource, if applicable.
        message:
          title: message
          type: string
          example: Resource is provisioned successfully.
          description: A message related to the resource, if applicable.
      required:
        - uuid
        - name
        - state
        - app_slug
        - plan_slug
        - has_config
    addons_resource_metadata:
      type: object
      properties:
        name:
          title: name
          type: string
          example: property_name
          description: The name of the metadata item to be set.
        value:
          example: example_value
          description: >-
            The value to be set for the metadata item, which can be a string or
            boolean.
          title: string_value
          type: string
      required:
        - name
        - value
    addons_plan:
      type: object
      properties:
        id:
          title: id
          type: integer
          example: 1
          description: ID of a given plan.
        app_id:
          title: app_id
          type: integer
          example: 2
          description: ID of the app associated with this plan.
        display_name:
          title: display_name
          type: string
          example: Basic Plan
          description: Display name for a given plan.
        description:
          title: description
          type: string
          example: Description of the app plan.
          description: Description of an app plan.
        slug:
          title: slug
          type: string
          example: plan_basic
          description: Slug identifier for the plan.
        price_per_month:
          title: price_per_month
          type: integer
          example: 10
          description: Price of a month's usage of the plan in US dollars.
        active:
          title: active
          type: boolean
          example: true
          description: Indicates if the plan is currently active.
        state:
          title: state
          type: string
          enum:
            - unknown
            - draft
            - in_review
            - approved
            - suspended
            - archived
          example: approved
          description: Current state of the plan.
        features:
          title: features
          type: array
          items:
            $ref: '#/components/schemas/addons_feature'
          example: []
          description: List of features included in the plan.
        created_at:
          title: created_at
          type: string
          format: date-time
          example: '2023-10-01T12:00:00Z'
          description: Timestamp when the plan was created.
        updated_at:
          title: updated_at
          type: string
          format: date-time
          example: '2023-10-01T12:00:00Z'
          description: Timestamp when the plan was last updated.
        available:
          title: available
          type: boolean
          example: true
          description: Indicates if the plan is available for selection.
        uuid:
          title: uuid
          type: string
          example: 123e4567-e89b-12d3-a456-426 614174000
          description: Unique identifier for the plan.
        by_default:
          title: by_default
          type: boolean
          example: false
          description: Indicates if this plan is the default option for the app.
        dimensions:
          title: dimensions
          type: array
          description: >-
            List of dimensions associated with the plan, each with its own
            pricing.
          items:
            $ref: '#/components/schemas/addons_dimension_with_price'
      required:
        - id
        - app_id
        - display_name
        - slug
        - price_per_month
        - active
        - state
        - created_at
        - updated_at
        - available
        - uuid
        - by_default
    addons_feature:
      type: object
      properties:
        id:
          title: id
          type: integer
          example: 1
          description: Unique identifier for the app feature.
        name:
          title: name
          type: string
          example: Support
          description: Name of the feature.
        type:
          title: type
          type: string
          enum:
            - unknown
            - string
            - boolean
            - allowance
          example: string
          description: Feature type, indicating the kind of data it holds.
        unit:
          title: unit
          type: string
          enum:
            - unit_unknown
            - GB
            - GIB
            - count
            - byte
            - byte_second
          example: GB
          description: >-
            Unit of measurement for the feature, if applicable. Units apply to
            allowance features.
        value:
          example: Unlimited
          description: Value of the feature, which can vary based on the type.
          title: string_value
          type: string
        created_at:
          title: created_at
          type: string
          format: date-time
          example: '2023-10-01T12:00:00Z'
          description: Timestamp when the feature was created.
        updated_at:
          title: updated_at
          type: string
          format: date-time
          example: '2023-10-01T12:00:00Z'
          description: Timestamp when the feature was last updated.
      required:
        - id
        - name
        - type
        - value
        - created_at
        - updated_at
    addons_dimension_with_price:
      type: object
      properties:
        id:
          title: id
          type: integer
          example: 1
          description: Unique identifier for the dimension.
        sku:
          title: sku
          type: string
          example: addon_sku_123
          description: Unique string identifier for the dimension, tied to a price.
        slug:
          title: slug
          type: string
          example: addon_dimension_slug
          description: Slug identifier for the dimension.
        display_name:
          title: display_name
          type: string
          example: Addon Dimension Display Name
          description: Display name for the dimension.
        feature_name:
          title: feature_name
          type: string
          example: Feature Name
          description: Name of the feature associated with the dimension.
        volumes:
          title: volumes
          type: array
          description: >-
            A list of volumes associated with the dimension, each with its own
            price.
          items:
            $ref: '#/components/schemas/addons_dimension_volume_with_price'
      required:
        - id
        - sku
        - slug
        - display_name
        - feature_name
        - volumes
    addons_dimension_volume_with_price:
      type: object
      properties:
        id:
          title: id
          type: integer
          example: 123
          description: Unique identifier for the addon.
        low_volume:
          title: low_volume
          type: integer
          example: 1
          description: The minimum volume for the volume pricing tier.
        max_volume:
          title: max_volume
          type: integer
          example: 100
          description: The maximum volume for the volume pricing tier.
        price_per_unit:
          title: price_per_unit
          type: string
          example: '0.10'
          description: The price per unit for the volume tier in US dollars.
      required:
        - id
        - low_volume
        - max_volume
        - price_per_unit
  responses:
    addons_get_app:
      description: >-
        The response will be a JSON object with a key called `apps`. `apps` will
