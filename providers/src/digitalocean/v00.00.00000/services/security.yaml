openapi: 3.0.0
info:
  title: security API
  description: digitalocean API
  version: '2.0'
paths:
  /v2/security/scans:
    get:
      operationId: security_list_scans
      summary: List Scans
      description: To list all CSPM scans, send a GET request to `/v2/security/scans`.
      tags:
        - Security
      parameters:
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          $ref: '#/components/responses/scans'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/security/scans"
      security:
        - bearer_auth:
            - security:read
    post:
      operationId: security_create_scan
      summary: Create Scan
      description: To create a CSPM scan, send a POST request to `/v2/security/scans`.
      tags:
        - Security
      responses:
        '201':
          $ref: '#/components/responses/scan'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/security/scans"
      security:
        - bearer_auth:
            - security:create
  /v2/security/scans/{scan_id}:
    get:
      operationId: security_get_scan
      summary: Get Scan
      description: >-
        To get a CSPM scan by ID, send a GET request to
        `/v2/security/scans/{scan_id}`.
      tags:
        - Security
      parameters:
        - $ref: '#/components/parameters/scan_id'
        - $ref: '#/components/parameters/severity'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
        - in: query
          name: type
          required: false
          description: The finding type to include.
          schema:
            type: string
          example: CSPM
      responses:
        '200':
          $ref: '#/components/responses/scan'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/security/scans/497dcba3-ecbf-4587-a2dd-5eb0665e6880"
      security:
        - bearer_auth:
            - security:read
  /v2/security/scans/latest:
    get:
      operationId: security_get_latest_scan
      summary: Get Latest Scan
      description: >-
        To get the latest CSPM scan, send a GET request to
        `/v2/security/scans/latest`.
      tags:
        - Security
      parameters:
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/severity'
        - in: query
          name: type
          required: false
          description: The finding type to include.
          schema:
            type: string
          example: CSPM
      responses:
        '200':
          $ref: '#/components/responses/scan'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/security/scans/latest"
      security:
        - bearer_auth:
            - security:read
  /v2/security/scans/rules:
    post:
      operationId: security_create_scan_rule
      summary: Create Scan Rule
      description: |-
        To mark a scan finding as a false positive, send a POST request to
        `/v2/security/scans/rules` to create a new scan rule.
      tags:
        - Security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resource:
                  type: string
                  example: do:droplet:fe3a2fd7-903d-46e6-ada3-3e4f285fb89d
                  description: The URN of a resource to exclude from future scans.
      responses:
        '201':
          $ref: '#/components/responses/no_content'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -d '{"resource": "do:droplet:fe3a2fd7-903d-46e6-ada3-3e4f285fb89d"}' \
              "https://api.digitalocean.com/v2/security/scans/rules"
      security:
        - bearer_auth:
            - security:create
  /v2/security/scans/{scan_id}/findings/{finding_uuid}/affected_resources:
    get:
      operationId: security_list_scan_finding_affected_resources
      summary: List Finding Affected Resources
      description: >-
        To get affected resources for a scan finding, send a GET request to
        `/v2/security/scans/{scan_id}/findings/{finding_uuid}/affected_resources`.
      tags:
        - Security
      parameters:
        - $ref: '#/components/parameters/scan_id'
        - $ref: '#/components/parameters/finding_uuid'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          $ref: '#/components/responses/affected_resources'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/security/scans/497dcba3-ecbf-4587-a2dd-5eb0665e6880/findings/50e14f43-dd4e-412f-864d-78943ea28d91/affected_resources"
      security:
        - bearer_auth:
            - security:read
  /v2/security/settings:
    get:
      operationId: security_list_settings
      summary: List Settings
      description: >-
        To list CSPM scan settings, send a GET request to
        `/v2/security/settings`.
      tags:
        - Security
      parameters:
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          $ref: '#/components/responses/settings'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/security/settings"
      security:
        - bearer_auth:
            - security:read
  /v2/security/settings/plan:
    put:
      operationId: security_update_settings_plan
      summary: Update Plan
      description: >-
        To update CSPM plan coverage, send a PUT request to
        `/v2/security/settings/plan`.
      tags:
        - Security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier_coverage:
                  type: object
                  description: Scan coverage for each available plan tier.
                  additionalProperties:
                    type: object
                    properties:
                      resources:
                        type: array
                        items:
                          type: string
                        description: The URNs of resources to scan for the tier.
                        default: []
                        example:
                          - do:droplet:fe3a2fd7-903d-46e6-ada3-3e4f285fb89d
                      tags:
                        type: array
                        items:
                          type: string
                        description: Resource tags to scan for the tier.
                        default: []
                        example:
                          - production
                  example:
                    basic:
                      resources:
                        - do:droplet:fe3a2fd7-903d-46e6-ada3-3e4f285fb89d
                      tags:
                        - production
      responses:
        '200':
          $ref: '#/components/responses/tier_coverage'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X PUT \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -d '{"tier_coverage":{"basic":{"resources":["do:droplet:fe3a2fd7-903d-46e6-ada3-3e4f285fb89d"],"tags":["production"]}}}' \
              "https://api.digitalocean.com/v2/security/settings/plan"
      security:
        - bearer_auth:
            - security:update
  /v2/security/settings/suppressions:
    post:
      operationId: security_create_suppression
      summary: Create Suppression
      description: >-
        To suppress scan findings, send a POST request to
        `/v2/security/settings/suppressions`.
      tags:
        - Security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rule_uuid:
                  type: string
                  description: The rule UUID to suppress for the listed resources.
                resources:
                  type: array
                  items:
                    type: string
                  example:
                    - do:droplet:fe3a2fd7-903d-46e6-ada3-3e4f285fb89d
                  description: The URNs of resources to suppress for the rule.
      responses:
        '201':
          $ref: '#/components/responses/suppressed_resources'
        '400':
          $ref: '#/components/responses/bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -d '{"rule_uuid":"497dcba3-ecbf-4587-a2dd-5eb0665e6880","resources":["do:droplet:fe3a2fd7-903d-46e6-ada3-3e4f285fb89d"]}' \
              "https://api.digitalocean.com/v2/security/settings/suppressions"
      security:
        - bearer_auth:
            - security:create
  /v2/security/settings/suppressions/{suppression_uuid}:
    delete:
      operationId: security_delete_suppression
      summary: Delete Suppression
      description: >-
        To remove a suppression, send a DELETE request to
        `/v2/security/settings/suppressions/{suppression_uuid}`.
      tags:
        - Security
      parameters:
        - $ref: '#/components/parameters/suppression_uuid'
      responses:
        '204':
          $ref: '#/components/responses/no_content'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X DELETE \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/security/settings/suppressions/5b3b2b2d-5c9c-4a61-9e2f-4d8f80f30a12"
      security:
        - bearer_auth:
            - security:delete
components:
  schemas:
    scan:
      type: object
      properties:
        id:
          title: id
          type: string
          example: 760e09ef-dc84-11e8-981e-3cfdfeaae000
          description: The unique identifier for the scan.
        status:
          title: status
          type: string
          enum:
            - IN_PROGRESS
            - COMPLETED
            - FAILED
            - CSPM_NOT_ENABLED
            - SCAN_NOT_RUN
          example: COMPLETED
          description: The status of the scan.
        created_at:
          title: created_at
          type: string
          format: date-time
          example: '2025-12-04T00:00:00Z'
          description: When scan was created.
        findings:
          title: findings
          type: array
          items:
            type: object
            description: The results of the scan.
            properties:
              rule_uuid:
                title: rule_uuid
                type: string
                example: 760e09ef-dc84-11e8-981e-3cfdfeaae000
                description: The unique identifier for the rule that triggered the finding.
              name:
                title: name
                type: string
                example: All Firewall Ports Exposed to a Source
                description: The name of the rule that triggered the finding.
              details:
                title: details
                type: string
                example: >-
                  The Cloud Firewall protecting this Droplet includes a rule
                  that allows traffic on all

                  ports for one or more protocols. Even if sources are
                  restricted, this overly

                  permissive configuration can expose sensitive internal or
                  administrative services.
                description: A description of the risk associated with the finding.
              found_at:
                title: found_at
                type: string
                format: date-time
                example: '2025-12-04T00:00:00Z'
                description: When the finding was discovered.
              severity:
                title: severity
                type: string
                enum:
                  - CRITICAL
                  - HIGH
                  - MEDIUM
                  - LOW
                example: CRITICAL
                description: The severity of the finding.
              business_impact:
                title: business_impact
                type: string
                example: >-
                  Without at least one completed backup, any critical event such
                  as hardware failure,

                  ransomware, or accidental deletion could result in permanent
                  data loss. This can lead

                  to downtime, expensive recovery efforts, and loss of customer
                  trust. Until a backup

                  successfully completes, your environment remains unprotected.
                description: A description of the business impact of the finding.
              technical_details:
                title: technical_details
                type: string
                example: >-
                  DigitalOcean's backup service automatically runs on a weekly
                  schedule. This condition

                  can occur for two main reasons:\n- The Droplet is newly
                  created and its first scheduled

                  backup window hasn't run yet, or\n- A previous backup attempt
                  failed. In both cases,

                  no backup image currently exists in your account, leaving the
                  Droplet without a

                  restorable recovery point managed by the platform.
                description: A description of the technical details related to the finding.
              mitigation_steps:
                title: mitigation_steps
                type: array
                items:
                  type: object
                  properties:
                    step:
                      title: step
                      type: integer
                      example: 1
                    title:
                      title: title
                      type: string
                      example: Enable backups
                    description:
                      title: description
                      type: string
                      example: Turn on automated backups for this Droplet.
                description: The mitigation steps to resolve the finding.
              affected_resources_count:
                title: affected_resources_count
                type: integer
                example: 12
                description: The number of affected resources for the finding.
    pagination:
      type: object
      properties:
        links:
          $ref: '#/components/schemas/page_links'
    meta:
      type: object
      properties:
        meta:
          type: object
          description: Information about the response itself.
          properties:
            total:
              description: Number of objects returned by the request.
              type: integer
              example: 1
          required:
            - total
      required:
        - meta
    error:
      type: object
      properties:
        id:
          description: >-
            A short identifier corresponding to the HTTP status code returned.
            For  example, the ID for a response returning a 404 status code
            would be "not_found."
          type: string
          example: not_found
        message:
          description: >-
            A message providing additional information about the error,
            including  details to help resolve it when possible.
          type: string
          example: The resource you were accessing could not be found.
        request_id:
          description: >-
            Optionally, some endpoints may include a request ID that should be 
            provided when reporting bugs or opening support tickets to help 
            identify the issue.
          type: string
          example: 4d9d8375-3c56-4925-a3e7-eb137fed17e9
      required:
        - id
        - message
    affected_resource:
      type: object
      properties:
        urn:
          title: urn
          type: string
          example: do:droplet:760e09ef-dc84-11e8-981e-3cfdfeaae000
          description: The URN for the affected resource.
        name:
          title: name
          type: string
          example: Test Droplet
          description: The name of the affected resource.
        type:
          title: type
          type: string
          example: Droplet
          description: The type of the affected resource.
    settings:
      type: object
      properties:
        settings:
          type: object
          properties:
            suppressions:
              $ref: '#/components/schemas/suppressed_resource_root'
        tier_coverage:
          type: object
          additionalProperties:
            type: object
            properties:
              resources:
                type: array
                items:
                  type: string
                example:
                  - do:droplet:fe3a2fd7-903d-46e6-ada3-3e4f285fb89d
              tags:
                type: array
                items:
                  type: string
                example:
                  - production
        plan_downgrades:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/plan_downgrades'
    suppressed_resource_root:
      type: object
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/suppressed_resource'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            pages:
              type: integer
              example: 3
            total:
              type: integer
              example: 25
        links:
          type: object
          properties:
            pages:
              type: object
              properties:
                first:
                  type: string
                  example: >-
                    https://api.digitalocean.com/v2/security/settings/suppressions?page=1
                prev:
                  type: string
                  example: >-
                    https://api.digitalocean.com/v2/security/settings/suppressions?page=1
                next:
                  type: string
                  example: >-
                    https://api.digitalocean.com/v2/security/settings/suppressions?page=2
                last:
                  type: string
                  example: >-
                    https://api.digitalocean.com/v2/security/settings/suppressions?page=3
    page_links:
      type: object
      properties:
        pages:
          example:
            pages:
              first: https://api.digitalocean.com/v2/account/keys?page=1
              prev: https://api.digitalocean.com/v2/account/keys?page=2
          type: object
          properties:
            last:
              description: URI of the last page of the results.
              type: string
              example: https://api.digitalocean.com/v2/images?page=2
            next:
              description: URI of the next page of the results.
              type: string
              example: https://api.digitalocean.com/v2/images?page=2
            first:
              description: URI of the first page of the results.
              type: string
              example: https://api.digitalocean.com/v2/images?page=1
            prev:
              description: URI of the previous page of the results.
              type: string
              example: https://api.digitalocean.com/v2/images?page=1
    meta_properties:
      type: object
      description: Information about the response itself.
      properties:
        total:
          description: Number of objects returned by the request.
          type: integer
          example: 1
    plan_downgrades:
      type: object
      description: Resources moving to a tier at a given effective time.
      properties:
        resources:
          type: array
          items:
            type: string
          description: URNs of resources that will be downgraded.
          example:
            - do:droplet:fe3a2fd7-903d-46e6-ada3-3e4f285fb89d
        effective_at:
          type: string
          format: date-time
          description: When the coverage downgrade takes effect.
          example: '2025-12-01T00:00:00Z'
    suppressed_resource:
      type: object
      properties:
        id:
          title: id
          type: string
          example: 760e09ef-dc84-11e8-981e-3cfdfeaae000
          description: Unique identifier for the suppressed resource.
        rule_uuid:
          title: rule_uuid
          type: string
          example: 460e09ef-dc84-11e8-981e-3cfdfeaae000
          description: Unique identifier for the suppressed rule.
        rule_name:
          title: rule_name
          type: string
          example: Droplet Backups Not Enabled
          description: Human-readable rule name for the suppressed rule.
        resource_id:
          title: resource_id
          type: string
          example: '123'
          description: Unique identifier for the resource suppressed.
        resource_type:
          title: resource_type
          type: string
          example: Droplet
          description: Resource type for the resource suppressed.
    forward_links:
      type: object
      properties:
        last:
          description: URI of the last page of the results.
          type: string
          example: https://api.digitalocean.com/v2/images?page=2
        next:
          description: URI of the next page of the results.
          type: string
          example: https://api.digitalocean.com/v2/images?page=2
    backward_links:
      type: object
      properties:
        first:
          description: URI of the first page of the results.
          type: string
          example: https://api.digitalocean.com/v2/images?page=1
        prev:
          description: URI of the previous page of the results.
          type: string
          example: https://api.digitalocean.com/v2/images?page=1
    link_to_last_page:
      type: object
      properties:
        last:
          description: URI of the last page of the results.
          type: string
          example: https://api.digitalocean.com/v2/images?page=2
    link_to_next_page:
      type: object
      properties:
        next:
          description: URI of the next page of the results.
          type: string
          example: https://api.digitalocean.com/v2/images?page=2
    link_to_first_page:
      type: object
      properties:
        first:
          description: URI of the first page of the results.
          type: string
          example: https://api.digitalocean.com/v2/images?page=1
    link_to_prev_page:
      type: object
      properties:
        prev:
          description: URI of the previous page of the results.
          type: string
