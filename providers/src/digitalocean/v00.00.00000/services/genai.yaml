            type: string
          type: array
        name:
          example: example name
          type: string
        preset_name:
          example: example name
          type: string
        preset_save_sections:
          description: >-
            Which sections of this run's resolved configuration to persist as a

            reusable preset. Each selected section saves only its own fields;
            the

            remaining sections stay empty on the preset and must be supplied
            inline

            on future runs that reference it. Empty means do not save a preset

            (unless the deprecated `save_as_preset` boolean is true, in which
            case

            all sections are saved). Ignored when `eval_preset_uuid` is set. Use

            `preset_name` to label the saved preset.
          example:
            - PRESET_SAVE_SECTION_CANDIDATE
            - PRESET_SAVE_SECTION_METRICS
          items:
            $ref: '#/components/schemas/apiPresetSaveSection'
          type: array
        save_as_preset:
          description: >-
            Deprecated: use `preset_save_sections`. When `true` and

            `preset_save_sections` is empty, all five sections of the resolved

            configuration are saved as a reusable preset (legacy behavior).
            Ignored

            when `eval_preset_uuid` is set.
          example: true
          type: boolean
