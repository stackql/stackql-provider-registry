openapi: 3.0.0
info:
  title: genai API
  description: digitalocean API
  version: '2.0'
paths:
  /v2/gen-ai/agents:
    get:
      description: To list all agents, send a GET request to `/v2/gen-ai/agents`.
      operationId: genai_list_agents
      parameters:
        - description: Only list agents that are deployed.
          example: true
          in: query
          name: only_deployed
          schema:
            type: boolean
        - description: Page number.
          example: 1
          in: query
          name: page
          schema:
            type: integer
        - description: Items per page.
          example: 1
          in: query
          name: per_page
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiListAgentsOutputPublic'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:read
      summary: List Agents
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json"  \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/gen-ai/agents"
    post:
      description: >-
        To create a new agent, send a POST request to `/v2/gen-ai/agents`. The
        response body contains a JSON object with the newly created agent
        object.
      operationId: genai_create_agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiCreateAgentInputPublic'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiCreateAgentOutput'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:create
      summary: Create an Agent
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
                -H "Content-Type: application/json"  \
                -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
                "https://api.digitalocean.com/v2/gen-ai/agents" \
                -d '{
                  "name": "api-create",
                  "model_uuid": "95ea6652-75ed-11ef-bf8f-4e013e2ddde4",
                  "instruction": "be a weather reporter",
                  "description": "weather-agent",
                  "project_id": "37455431-84bd-4fa2-94cf-e8486f8f8c5e",
                  "tags": [
                    "tag1"
                  ],
                  "region": "tor1",
                  "knowledge_base_uuid": [
                    "9758a232-b351-11ef-bf8f-4e013e2ddde4"
                  ]
                }'
  /v2/gen-ai/agents/{agent_uuid}/api_keys:
    get:
      description: >-
        To list all agent API keys, send a GET request to
        `/v2/gen-ai/agents/{agent_uuid}/api_keys`.
      operationId: genai_list_agent_api_keys
      parameters:
        - description: Agent id
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: agent_uuid
          required: true
          schema:
            type: string
        - description: Page number.
          example: 1
          in: query
          name: page
          schema:
            type: integer
        - description: Items per page.
          example: 1
          in: query
          name: per_page
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiListAgentAPIKeysOutput'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:read
      summary: List Agent API Keys
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json"  \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/gen-ai/agents/c441bf77-81d6-11ef-bf8f-4e013e2ddde4/api_keys"
    post:
      description: >-
        To create an agent API key, send a POST request to
        `/v2/gen-ai/agents/{agent_uuid}/api_keys`.
      operationId: genai_create_agent_api_key
      parameters:
        - description: Agent id
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: agent_uuid
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiCreateAgentAPIKeyInputPublic'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiCreateAgentAPIKeyOutput'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:create
      summary: Create an Agent API Key
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json"  \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/gen-ai/agents/1b418231-b7d6-11ef-bf8f-4e013e2ddde4/api_keys" \
              -d '{
                "agent_uuid": "1b418231-b7d6-11ef-bf8f-4e013e2ddde4",
                "name": "test-key"
              }'
  /v2/gen-ai/agents/{agent_uuid}/api_keys/{api_key_uuid}:
    put:
      description: >-
        To update an agent API key, send a PUT request to
        `/v2/gen-ai/agents/{agent_uuid}/api_keys/{api_key_uuid}`.
      operationId: genai_update_agent_api_key
      parameters:
        - description: Agent id
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: agent_uuid
          required: true
          schema:
            type: string
        - description: API key ID
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: api_key_uuid
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiUpdateAgentAPIKeyInputPublic'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiUpdateAgentAPIKeyOutput'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:update
      summary: Update API Key for an Agent
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X PUT \
              -H "Content-Type: application/json"  \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/gen-ai/agents/1b418231-b7d6-11ef-bf8f-4e013e2ddde4/api_keys/11efb7d6-cdb5-6388-bf8f-4e013e2ddde4" \
              -d '{
                "agent_uuid": "1b418231-b7d6-11ef-bf8f-4e013e2ddde4",
                "api_key_uuid": "11efb7d6-cdb5-6388-bf8f-4e013e2ddde4",
                "name": "test-key2"
              }'
    delete:
      description: >-
        To delete an API key for an agent, send a DELETE request to
        `/v2/gen-ai/agents/{agent_uuid}/api_keys/{api_key_uuid}`.
      operationId: genai_delete_agent_api_key
      parameters:
        - description: A unique identifier for your agent.
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: agent_uuid
          required: true
          schema:
            type: string
        - description: API key for an agent.
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: api_key_uuid
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiDeleteAgentAPIKeyOutput'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:delete
      summary: 'Delete API Key for an Agent '
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X DELETE \
              -H "Content-Type: application/json"  \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/gen-ai/agents/1b418231-b7d6-11ef-bf8f-4e013e2ddde4/api_keys/11efb7d6-cdb5-6388-bf8f-4e013e2ddde4"
  /v2/gen-ai/agents/{agent_uuid}/api_keys/{api_key_uuid}/regenerate:
    put:
      description: >-
        To regenerate an agent API key, send a PUT request to
        `/v2/gen-ai/agents/{agent_uuid}/api_keys/{api_key_uuid}/regenerate`.
      operationId: genai_regenerate_agent_api_key
      parameters:
        - description: Agent id
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: agent_uuid
          required: true
          schema:
            type: string
        - description: API key ID
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: api_key_uuid
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiRegenerateAgentAPIKeyOutput'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:update
      summary: Regenerate API Key for an Agent
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X PUT \
              -H "Content-Type: application/json"  \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/gen-ai/agents/1b418231-b7d6-11ef-bf8f-4e013e2ddde4/api_keys/11efcf7e-824d-2808-bf8f-4e013e2ddde4/regenerate"
  /v2/gen-ai/agents/{agent_uuid}/functions:
    post:
      description: >-
        To create a function route for an agent, send a POST request to
        `/v2/gen-ai/agents/{agent_uuid}/functions`.
      operationId: genai_attach_agent_function
      parameters:
        - description: Agent id
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: agent_uuid
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiLinkAgentFunctionInputPublic'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiLinkAgentFunctionOutput'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:create
      summary: Add Function Route to an Agent
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json"  \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/gen-ai/agents/1b418231-b7d6-11ef-bf8f-4e013e2ddde4/functions" \
              -d '{
                "agent_uuid": "1b418231-b7d6-11ef-bf8f-4e013e2ddde4",
                "function_name": "funzip",
                "description": "Use when you need the zipcode for a city",
                "input_schema": {
                  "city": {
                    "description": "the city you want a zipcode for",
                    "required": true,
                    "type": "string"
                  }
                },
                "output_schema": {
                  "zip_code": {
                    "description": "The zipcode of the desired city",
                    "type": "number"
                  }
                },
                "faas_namespace": "fn-2014dc98-faa1-45f4-ba1f-59910cb3d399",
                "faas_name": "default/get-zipcode"
              }'
             
  /v2/gen-ai/agents/{agent_uuid}/functions/{function_uuid}:
    put:
      description: >-
        To update the function route, send a PUT request to
        `/v2/gen-ai/agents/{agent_uuid}/functions/{function_uuid}`.
      operationId: genai_update_agent_function
      parameters:
        - description: Agent id
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: agent_uuid
          required: true
          schema:
            type: string
        - description: Function id
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: function_uuid
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiUpdateAgentFunctionInputPublic'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiUpdateAgentFunctionOutput'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:update
      summary: Update Function Route for an Agent
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X PUT \
              -H "Content-Type: application/json"  \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/gen-ai/agents/1b418231-b7d6-11ef-bf8f-4e013e2ddde4/functions/b00e74f6-985c-11ef-bf8f-4e013e2ddde4" \
              -d '{
                "agent_uuid": "1b418231-b7d6-11ef-bf8f-4e013e2ddde4",
                "function_uuid": "6cc5cda5-9ac3-11ef-bf8f-4e013e2ddde4",
                "function_name": "func-rename"
              }'
    delete:
      description: >-
        To delete a function route from an agent, send a DELETE request to
        `/v2/gen-ai/agents/{agent_uuid}/functions/{function_uuid}`.
      operationId: genai_detach_agent_function
      parameters:
        - description: The id of the agent the function route belongs to.
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: agent_uuid
          required: true
          schema:
            type: string
        - description: >-
            The function route to be destroyed. This does not destroy the
            function itself.
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: function_uuid
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiUnlinkAgentFunctionOutput'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:delete
      summary: Delete Function Route for an Agent
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X DELETE \
              -H "Content-Type: application/json"  \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/gen-ai/agents/ff47f5b7-96e5-11ef-bf8f-4e013e2ddde4/functions/6cc5cda5-9ac3-11ef-bf8f-4e013e2ddde4"
  /v2/gen-ai/agents/{agent_uuid}/guardrails:
    post:
      description: >-
        To attach guardrails to an agent, send a POST request to
        `/v2/gen-ai/agents/{agent_uuid}/guardrails`.
      operationId: genai_attach_agent_guardrails
      parameters:
        - description: The UUID of the agent.
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: agent_uuid
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiLinkAgentGuardrailsInputPublic'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiLinkAgentGuardrailOutput'
          description: A successful response.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - genai:create
      summary: Attach Guardrails to an Agent
      tags:
        - GradientAI Platform
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/gen-ai/agents/1c8be326-00fe-11f1-b542-ca68c578b05c/guardrails" \
              -d '{
                "guardrails": [
                  {
                    "guardrail_uuid": "69bcc61c-2bb2-49fd-b6ed-7c1bd73d6442",
                    "priority": 1
                  },
                  {
                    "guardrail_uuid": "dc72b12b-bd45-46c9-bca1-00a6624aac3a",
                    "priority": 2
                  }
                ]
              }'
  /v2/gen-ai/agents/{agent_uuid}/guardrails/{guardrail_uuid}:
    delete:
      description: >-
        To detach a guardrail from an agent, send a DELETE request to
        `/v2/gen-ai/agents/{agent_uuid}/guardrails/{guardrail_uuid}`.
      operationId: genai_detach_agent_guardrail
      parameters:
        - description: The UUID of the agent.
          example: '"123e4567-e89b-12d3-a456-426614174000"'
          in: path
          name: agent_uuid
          required: true
