          description: Optional Model Provider uuid for use with provider models
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        model_router_uuid:
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        model_uuid:
          description: Identifier for the foundation model.
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        name:
          description: Agent name
          example: '"My New Agent Name"'
          type: string
        open_ai_key_uuid:
          description: Optional OpenAI key uuid for use with OpenAI models
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        project_id:
          description: The id of the DigitalOcean project this agent will belong to
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        provide_citations:
          example: true
          type: boolean
        reasoning_effort:
          example: '"low"'
          type: string
        retrieval_method:
          $ref: '#/components/schemas/apiRetrievalMethod'
        router_preset_slug:
          example: '"general"'
          type: string
        tags:
          description: A set of abitrary tags to organize your agent
          example:
            - example string
          items:
            example: example string
            type: string
          type: array
        temperature:
          description: >-
            Controls the model’s creativity, specified as a number between 0 and
            1. Lower values produce more predictable and conservative responses,
            while higher values encourage creativity and variation.
          example: 0.7
          format: float
          type: number
        thinking_token_budget:
          example: 123
          format: int64
          type: integer
        top_p:
          description: >-
            Defines the cumulative probability threshold for word selection,
            specified as a number between 0 and 1. Higher values allow for more
            diverse outputs, while lower values ensure focused and coherent
            responses.
          example: 0.9
          format: float
          type: number
        uuid:
          description: Unique agent id
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        web_fetch_enabled:
          description: >-
            Optional. Set to true to let the agent use the built-in web_fetch
            tool to retrieve content from public web pages, or false to disable
            it.
          example: true
          type: boolean
        web_search_enabled:
          description: >-
            Optional. Set to true to let the agent use the built-in web_search
            tool to search the public web for current information, or false to
            disable it.
          example: true
          type: boolean
