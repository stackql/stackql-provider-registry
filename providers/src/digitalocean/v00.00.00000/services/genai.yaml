          description: Optional update of conversation logs enabled
          example: true
          type: boolean
        description:
          description: Agent description
          example: '"My Agent Description"'
          type: string
        instruction:
          description: >-
            Agent instruction. Instructions help your agent to perform its job
            effectively. See [Write Effective Agent
            Instructions](https://docs.digitalocean.com/products/genai-platform/concepts/best-practices/#agent-instructions)
            for best practices.
          example: '"You are an agent who thinks deeply about the world"'
          type: string
        k:
          description: >-
            How many results should be considered from an attached knowledge
            base
          example: 5
          format: int64
          type: integer
        max_tokens:
          description: >-
            Specifies the maximum number of tokens the model can process in a
            single input or output, set as a number between 1 and 512. This
            determines the length of each response.
          example: 100
          format: int64
          type: integer
        mcp_servers:
          description: MCP (Model Context Protocol) servers to attach to the agent
          items:
            $ref: '#/components/schemas/apiMcpServer'
          type: array
