          $ref: '#/components/schemas/apiSpanCommon'
      type: object
    apiToolSpan:
      description: Tool span
      properties:
        common:
          $ref: '#/components/schemas/apiSpanCommon'
        tool_call_id:
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
      type: object
    apiWorkflowSpan:
      description: Workflow span - can contain child spans (agent, llm, tool, retriever)
      properties:
        common:
          $ref: '#/components/schemas/apiSpanCommon'
        spans:
          description: |-
            Child spans - must contain between 1 and 999 spans
            Allowed types: agent, llm, tool, retriever (not workflow)
          items:
            $ref: '#/components/schemas/apiTraceSpan'
          type: array
      type: object
    apiPerModelResultSummary:
      description: |-
        Aggregated evaluation results for a single underlying model in a router
        evaluation run.
      properties:
        metric_summaries:
          description: |-
            Pass/fail rate for each metric, computed over only the prompts
            routed to this model.
          items:
            $ref: '#/components/schemas/apiMetricResultSummary'
          type: array
        model_name:
          description: |-
            The underlying model these results are for, such as
            `Llama 3.3 Instruct (70B)`.
          example: example name
          type: string
        performance_metrics:
          $ref: '#/components/schemas/apiPerformanceMetrics'
        prompt_count:
          description: Number of prompts in the run that were routed to this model.
          example: 123
          format: int64
          type: integer
      type: object
    apiPerTaskResultSummary:
      description: |-
        Aggregated evaluation results for a single routing task category in a
        router evaluation run.
      properties:
        metric_summaries:
          description: |-
            Pass/fail rate for each metric, computed over only the prompts in
            this task category.
          items:
            $ref: '#/components/schemas/apiMetricResultSummary'
          type: array
        performance_metrics:
          $ref: '#/components/schemas/apiPerformanceMetrics'
        prompt_count:
          description: |-
            Number of prompts in the run that were classified into this task
            category.
          example: 123
          format: int64
          type: integer
        task_name:
          description: |-
            The routing task category these results are for, such as
            `Coding & brainstorming` or `Summarization`.
          example: example name
          type: string
      type: object
    apiLatencyMetrics:
      description: Latency metrics for candidate model invocations (in milliseconds).
      properties:
        avg_e2e_latency_ms:
          description: Average end-to-end latency across all invocations.
          example: 123
          format: double
          type: number
        max_e2e_latency_ms:
          description: Maximum end-to-end latency observed.
          example: 123
          format: double
          type: number
        min_e2e_latency_ms:
          description: Minimum end-to-end latency observed.
          example: 123
          format: double
          type: number
        p50_latency_ms:
          description: P50 (median) latency.
          example: 123
          format: double
          type: number
        p90_latency_ms:
          description: P90 latency.
          example: 123
          format: double
          type: number
        p95_latency_ms:
          description: P95 latency.
          example: 123
          format: double
          type: number
      type: object
    apiTokenUsage:
      properties:
        total_candidate_input_tokens:
          example: '12345'
          format: uint64
          type: string
        total_candidate_output_tokens:
          example: '12345'
          format: uint64
          type: string
        total_candidate_tokens:
          example: '12345'
          format: uint64
          type: string
        total_judge_input_tokens:
          example: '12345'
          format: uint64
          type: string
        total_judge_output_tokens:
          example: '12345'
          format: uint64
          type: string
        total_judge_tokens:
          example: '12345'
          format: uint64
          type: string
      type: object
    apiTokenPricing:
      description: Token pricing breakdown for a single model.
      properties:
        input_cost:
          description: Cost of input tokens.
          example: 123
          format: double
          type: number
        output_cost:
          description: Cost of output tokens.
          example: 123
          format: double
          type: number
        total_cost:
          description: Total cost (input + output).
          example: 123
          format: double
          type: number
      type: object
    apiModelPricingEntry:
      description: Pricing entry for a specific model.
      properties:
        model_name:
          description: Model name (for display purposes).
          example: example name
          type: string
        model_uuid:
          description: Model UUID.
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        pricing:
          $ref: '#/components/schemas/apiTokenPricing'
        prompt_count:
          description: Number of prompts/rows routed to this model.
          example: 123
          format: int64
          type: integer
      type: object
    apiModelBillingMode:
      default: MODEL_BILLING_MODE_UNSPECIFIED
      description: |-
        Whether rates apply to real-time or batch requests.

         - MODEL_BILLING_MODE_INTERACTIVE: Real-time request pricing.
         - MODEL_BILLING_MODE_BATCH: Discounted pricing for asynchronous batch requests.
      enum:
        - MODEL_BILLING_MODE_UNSPECIFIED
        - MODEL_BILLING_MODE_INTERACTIVE
        - MODEL_BILLING_MODE_BATCH
      example: MODEL_BILLING_MODE_UNSPECIFIED
      type: string
    apiModelScaledPricing:
      description: >-
        Pricing that varies over time. When present, the rates move between the
        low

        and high bounds below across the intervals in the schedule.
      properties:
        intervals:
          description: >-
            The pricing schedule as a series of consecutive time intervals,
            ordered by

            start time. Neighboring hours with the same rates are combined, so
            each

            interval represents a distinct price.
          items:
            $ref: '#/components/schemas/apiModelPricingInterval'
          type: array
        max_prices:
          $ref: '#/components/schemas/apiModelPricing'
        min_prices:
          $ref: '#/components/schemas/apiModelPricing'
      type: object
    apiModelPricingTier:
      default: MODEL_PRICING_TIER_UNSPECIFIED
      description: >-
        A pricing variant of a model, such as a faster serving option or a
        larger

        context window.

         - MODEL_PRICING_TIER_STANDARD: Default pricing.
         - MODEL_PRICING_TIER_FAST_MODE: Faster, higher-priority serving at a premium price.
         - MODEL_PRICING_TIER_EXTENDED_1M: Pricing for the 1M-token context window.
         - MODEL_PRICING_TIER_EXTENDED_272K: Pricing for the 272K-token context window.
         - MODEL_PRICING_TIER_BYOK: Pricing when using your own model API key.
      enum:
        - MODEL_PRICING_TIER_UNSPECIFIED
        - MODEL_PRICING_TIER_STANDARD
        - MODEL_PRICING_TIER_FAST_MODE
        - MODEL_PRICING_TIER_EXTENDED_1M
        - MODEL_PRICING_TIER_EXTENDED_272K
        - MODEL_PRICING_TIER_BYOK
      example: MODEL_PRICING_TIER_UNSPECIFIED
      type: string
    apiAgentType:
      default: AGENT_TYPE_UNSPECIFIED
      description: Agent span
      enum:
        - AGENT_TYPE_UNSPECIFIED
        - AGENT_TYPE_DEFAULT
        - AGENT_TYPE_PLANNER
        - AGENT_TYPE_REACT
        - AGENT_TYPE_REFLECTION
        - AGENT_TYPE_ROUTER
        - AGENT_TYPE_CLASSIFIER
        - AGENT_TYPE_SUPERVISOR
        - AGENT_TYPE_JUDGE
      example: AGENT_TYPE_UNSPECIFIED
      type: string
    apiSpanCommon:
      description: Common optional fields shared by all span types
      properties:
        created_at:
          example: '2023-01-01T00:00:00Z'
          format: date-time
          type: string
        duration_ns:
          example: '12345'
          format: int64
          type: string
        metadata:
          additionalProperties:
            example: example string
            type: string
          description: Arbitrary structured metadata
          type: object
        status_code:
          example: 123
          format: int32
          type: integer
        tags:
          description: Free-form tags for filtering/grouping
          example:
            - example string
          items:
            example: example string
            type: string
          type: array
      type: object
    apiModelPricingInterval:
      description: >-
        A time window during which the model's rates stay the same. Together
        these

        intervals show how pricing changes over the course of a day.
      properties:
        end_time:
          description: End of the interval, exclusive. Always on the hour.
          example: '2021-01-01T15:00:00Z'
          format: date-time
          type: string
        prices:
          $ref: '#/components/schemas/apiModelPricing'
        start_time:
          description: Start of the interval, inclusive. Always on the hour.
          example: '2021-01-01T13:00:00Z'
          format: date-time
          type: string
      type: object
  responses:
    unauthorized:
      description: Authentication failed due to invalid credentials.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit-limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit-remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            id: unauthorized
            message: Unable to authenticate you.
    not_found:
      description: The resource was not found.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit-limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit-remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            id: not_found
            message: The resource you requested could not be found.
    too_many_requests:
      description: The API rate limit has been exceeded.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit-limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit-remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            id: too_many_requests
            message: API rate limit exceeded.
    server_error:
      description: There was a server error.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit-limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit-remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            id: server_error
            message: Unexpected server-side error
    unexpected_error:
      description: There was an unexpected error.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit-limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit-remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            id: example_error
            message: some error message
  headers:
    ratelimit-limit:
      schema:
        type: integer
      example: 5000
      description: >-
        The default limit on number of requests that can be made per hour and
        per minute. Current rate limits are 5000 requests per hour and 250
        requests per minute.
    ratelimit-remaining:
      schema:
        type: integer
      example: 4816
      description: >-
        The number of requests in your hourly quota that remain before you hit
        your request limit. See
        https://developers.digitalocean.com/documentation/v2/#rate-limit for
        information about how requests expire.
    ratelimit-reset:
      schema:
        type: integer
      example: 1444931833
      description: >-
        The time when the oldest request will expire. The value is given in Unix
        epoch time. See
        https://developers.digitalocean.com/documentation/v2/#rate-limit for
        information about how requests expire.
