components:
  schemas:
    apiListAgentsOutputPublic:
      description: List of Agents
      properties:
        agents:
          description: Agents
          items:
            $ref: '#/components/schemas/apiAgentPublic'
          type: array
        links:
          $ref: '#/components/schemas/apiLinks'
        meta:
          $ref: '#/components/schemas/apiMeta'
      type: object
    apiCreateAgentInputPublic:
      description: Parameters for Agent Creation
      properties:
        anthropic_key_uuid:
          description: Optional Anthropic API key ID to use with Anthropic models
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        description:
          description: A text description of the agent, not used in inference
          example: '"My Agent Description"'
          type: string
        instruction:
          description: >-
            Agent instruction. Instructions help your agent to perform its job
            effectively. See [Write Effective Agent
            Instructions](https://docs.digitalocean.com/products/genai-platform/concepts/best-practices/#agent-instructions)
            for best practices.
          example: '"You are an agent who thinks deeply about the world"'
          type: string
        knowledge_base_uuid:
          description: Ids of the knowledge base(s) to attach to the agent
          example:
            - example string
          items:
            example: example string
            type: string
          type: array
        mcp_servers:
          description: MCP (Model Context Protocol) servers to attach to the agent
          items:
            $ref: '#/components/schemas/apiMcpServer'
          type: array
        model_provider_key_uuid:
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        model_router_uuid:
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        model_uuid:
          description: Identifier for the foundation model.
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        name:
          description: Agent name
          example: '"My Agent"'
          type: string
        open_ai_key_uuid:
          description: Optional OpenAI API key ID to use with OpenAI models
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        project_id:
          description: The id of the DigitalOcean project this agent will belong to
          example: '"12345678-1234-1234-1234-123456789012"'
          type: string
        reasoning_effort:
          example: '"low"'
          type: string
        region:
          description: The DigitalOcean region to deploy your agent in
          example: '"tor1"'
          type: string
        router_preset_slug:
          example: '"general"'
          type: string
        tags:
          description: Agent tag to organize related resources
          example:
            - example string
          items:
            example: example string
            type: string
          type: array
        thinking_token_budget:
          example: 123
          format: int64
          type: integer
        web_fetch_enabled:
          description: >-
            Whether the agent can use the built-in web_fetch tool to retrieve
            content from public web pages.
          example: true
          type: boolean
        web_search_enabled:
          description: >-
            Whether the agent can use the built-in web_search tool to search the
            public web for current information.
          example: true
          type: boolean
        workspace_uuid:
          description: Identifier for the workspace
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
      type: object
    apiCreateAgentOutput:
      description: Information about a newly created Agent
      properties:
        agent:
          $ref: '#/components/schemas/apiAgent'
      type: object
