    apiModelPricing:
      description: Pricing per million tokens (aligns with existing ModelPrice pattern)
      properties:
        cache_read_input_price_per_million:
          description: >-
            Per-million cache read rate for standard chat models (token_type
            "cache read input").

            Multimodal models use text_cache_read_input_price_per_million /
            image_cache_read_input_price_per_million instead.
          example: 0.15
          format: double
          type: number
        cache_write_1h_input_price_per_million:
          description: >-
            Price per million tokens written to the prompt cache with a 1-hour
            lifetime.
          example: 10
          format: double
          type: number
        cache_write_5m_input_price_per_million:
          description: >-
            Price per million tokens written to the prompt cache with a 5-minute
            lifetime.
          example: 6.25
          format: double
          type: number
        image_cache_read_input_price_per_million:
          example: 0.08
          format: double
          type: number
        image_input_price_per_million:
          example: 0.3
          format: double
          type: number
        image_output_price_per_million:
          example: 0.4
          format: double
          type: number
        input_cache_read:
          description: |-
            Cache read input price per single token. Equivalent to
            cache_read_input_price_per_million.
          example: 0.15
          format: double
          type: number
        input_price_per_million:
          example: 0.6
          format: double
          type: number
        output_price_per_million:
          example: 0.9
          format: double
          type: number
        price_per_audio:
          example: 0.002
          format: double
          type: number
        price_per_image:
          description: >-
            Unit-based pricing for non-token models (e.g., Fal AI
            image/video/audio

            generation, speech models). At most one of these is typically
            populated

            per model. Token-based models (chat, embeddings) leave all of these
            at 0

            and populate input_price_per_million / output_price_per_million
            instead.
          example: 0.003
          format: double
          type: number
        price_per_megapixel:
          example: 0.00003
          format: double
          type: number
        price_per_second:
          example: 0.0001
          format: double
          type: number
        price_per_thousand_characters:
          example: 0.015
          format: double
          type: number
        price_per_video:
          example: 0.05
          format: double
          type: number
        reasoning_price_per_million:
          description: |-
            Price per million reasoning tokens. 0 if the model does not charge
            separately for reasoning tokens.
          example: 0
          format: double
          type: number
        text_cache_read_input_price_per_million:
          example: 0.05
          format: double
          type: number
        text_input_price_per_million:
          description: >-
            Per-million token rates for models that bill text vs image tokens
            separately

            (e.g. OpenAI gpt-image-2). Standard chat models leave these at 0 and
            use

            input_price_per_million / output_price_per_million instead. Values
            align

            with usage token_type / internal/usage.Type string values for each
            meter.
          example: 0.1
          format: double
          type: number
        text_output_price_per_million:
          example: 0.2
          format: double
          type: number
      type: object
