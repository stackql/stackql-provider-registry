          description: >-
            Model slug used to call the candidate model API. Empty when the
            CANDIDATE

            section was not saved.
          example: example name
          type: string
        candidate_model_source:
          $ref: '#/components/schemas/apiCandidateModelSource'
        candidate_model_uuid:
          description: >-
            UUID of the candidate model stored on this preset. Empty when the

            CANDIDATE section was not saved. For DEDICATED candidates this is
            the

            dedicated inference deployment UUID.
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        candidate_system_prompt:
          description: >-
            System prompt / instructions to send to the candidate model. Empty
            when

            the SYSTEM_PROMPT section was not saved (check `saved_sections`).
          example: '2023-01-01'
          type: string
        created_at:
          description: Timestamp when the preset was created.
          example: '2023-01-01T00:00:00Z'
          format: date-time
          type: string
        dataset_name:
          description: >-
            Display name of the dataset stored on this preset. Empty when the
            DATASET

            section was not saved or the dataset no longer exists.
          example: example name
          type: string
        dataset_uuid:
          description: >-
            UUID of the dataset stored on this preset. Empty when the DATASET
            section

            was not saved (check `saved_sections`).
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        eval_preset_uuid:
          description: UUID of the evaluation preset.
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        judge_model_name:
          description: >-
            Display name of the judge model stored on this preset. Empty when
            the

            JUDGE section was not saved or the model no longer exists.
          example: example name
          type: string
        judge_model_uuid:
          description: |-
            UUID of the judge model stored on this preset. Empty when the JUDGE
            section was not saved (check `saved_sections`).
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        metrics:
          description: >-
            Metrics selected for this preset. Empty when the METRICS section was
            not

            saved.
          items:
            $ref: '#/components/schemas/apiEvaluationMetric'
          type: array
        name:
          description: Name of the evaluation preset.
          example: example name
          type: string
        saved_sections:
          description: >-
            Sections of the inline evaluation config that were persisted when
            this

            preset was created. Use this to tell "section was saved with an
            empty

            value" apart from "section was not saved" — scalar fields like

            `dataset_uuid` or `candidate_system_prompt` are always emitted as
            the

            empty string when the section was not saved.
          example:
            - PRESET_SAVE_SECTION_CANDIDATE
            - PRESET_SAVE_SECTION_METRICS
          items:
            $ref: '#/components/schemas/apiPresetSaveSection'
          type: array
        star_metric:
          $ref: '#/components/schemas/apiStarMetric'
      type: object
