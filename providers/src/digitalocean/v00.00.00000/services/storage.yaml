openapi: 3.0.0
info:
  title: storage API
  description: digitalocean API
  version: '2.0'
paths:
  /v2/nfs:
    post:
      operationId: nfs_create
      summary: Create a new NFS share
      description: |
        To create a new NFS share, send a POST request to `/v2/nfs`.
      tags:
        - NFS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nfs_request'
            examples:
              Basic NFS Share:
                value:
                  name: sammy-share-drive
                  size_gib: 1024
                  region: atl1
                  vpc_ids:
                    - 796c6fe3-2a1d-4da2-9f3e-38239827dc91
                  performance_tier: standard
      responses:
        '201':
          $ref: '#/components/responses/nfs_create'
        '400':
          $ref: '#/components/responses/bad_request-2'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -d '{"name": "sammy-share-drive", "size_gib": 1024, "region": "atl1", "vpc_ids": ["796c6fe3-2a1d-4da2-9f3e-38239827dc91"]}' \
              "https://api.digitalocean.com/v2/nfs"
      security:
        - bearer_auth:
            - nfs:create
    get:
      operationId: nfs_list
      summary: List NFS shares per region
      description: |
        To list NFS shares, send a GET request to `/v2/nfs?region=${region}`.

        A successful request will return all NFS shares belonging to the authenticated user.
      tags:
        - NFS
      parameters:
        - $ref: '#/components/parameters/parameters_region'
      responses:
        '200':
          $ref: '#/components/responses/nfs_list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/nfs?region=atl1"
      security:
        - bearer_auth:
            - nfs:list
  /v2/nfs/{nfs_id}:
    get:
      operationId: nfs_get
      summary: Get an NFS share
      description: |
        To get an NFS share, send a GET request to `/v2/nfs/{nfs_id}?region=${region}`.

        A successful request will return the NFS share.
      tags:
        - NFS
      parameters:
        - $ref: '#/components/parameters/nfs_id'
        - $ref: '#/components/parameters/parameters_region'
      responses:
        '200':
          $ref: '#/components/responses/nfs_get'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/nfs/{share_id}?region=atl1"
      security:
        - bearer_auth:
            - nfs:read
    delete:
      operationId: nfs_delete
      summary: Delete an NFS share
      description: |
        To delete an NFS share, send a DELETE request to `/v2/nfs/{nfs_id}?region=${region}`.

        A successful request will return a `204 No Content` status code.
      tags:
        - NFS
      parameters:
        - $ref: '#/components/parameters/nfs_id'
        - $ref: '#/components/parameters/parameters_region'
      responses:
        '204':
          $ref: '#/components/responses/no_content'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X DELETE \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/nfs/{share_id}?region=atl1"
      security:
        - bearer_auth:
            - nfs:delete
  /v2/nfs/{nfs_id}/actions:
    post:
      operationId: nfs_create_action
      summary: Initiate an NFS action
      description: |
        To execute an action (such as resize) on a specified NFS share, 
        send a POST request to `/v2/nfs/{nfs_id}/actions`. In the JSON body 
        to the request, set the `type` attribute to on of the supported action types:

        | Action                           | Details |
        | -------------------------------- | ----------- |
        | <nobr>`resize`</nobr>            | Resizes an NFS share. Set the size_gib attribute to a desired value in GiB |
        | <nobr>`snapshot`</nobr>          | Takes a snapshot of an NFS share |
        | <nobr>`attach`</nobr>            | Attaches an NFS share to a VPC. Set the vpc_id attribute to the desired VPC ID |
        | <nobr>`detach`</nobr>            | Detaches an NFS share from a VPC. Set the vpc_id attribute to the desired VPC ID |
        | <nobr>`reassign`</nobr>          | Reassigns an NFS share from one VPC to another. Set the old_vpc_id and new_vpc_id attributes to the desired VPC IDs |
        | <nobr>`switch_performance_tier`</nobr> | Switches the performance tier of an NFS share. Set the performance_tier attribute to the desired tier (e.g., standard, high) |
      tags:
        - NFS Actions
      parameters:
        - $ref: '#/components/parameters/nfs_id'
      requestBody:
        required: true
        description: |
          The `type` attribute set in the request body will specify the  action that
          will be taken on the NFS share. Some actions will require additional
          attributes to be set as well.
        content:
          application/json:
            schema:
              discriminator:
                propertyName: type
                mapping:
                  resize: '#/components/schemas/nfs_action_resize'
                  snapshot: '#/components/schemas/nfs_action_snapshot'
                  attach: '#/components/schemas/nfs_action_attach'
                  detach: '#/components/schemas/nfs_action_detach'
                  reassign: '#/components/schemas/nfs_action_reassign'
                  switch_performance_tier: '#/components/schemas/nfs_action_switch_performance_tier'
              required:
                - type
              type: object
              description: Specifies the action that will be taken on the NFS share.
              properties:
                type:
                  type: string
                  enum:
                    - resize
                    - snapshot
                    - attach
                    - detach
                    - reassign
                    - switch_performance_tier
                  example: resize
                  description: The type of action to initiate for the NFS share (such as resize or snapshot).
                region:
                  type: string
                  description: The DigitalOcean region slug (e.g. atl1, nyc2) where the NFS snapshot resides.
                  example: atl1
                params:
                  type: object
                  properties:
                    size_gib:
                      type: integer
                      example: 2048
                      description: The new size for the NFS share.
                  required:
                    - size_gib
      responses:
        '201':
          $ref: '#/components/responses/nfs_actions'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -d '{"type": "resize", "params": {"size_gib": 1024}, "region": "atl1"}' \
              "https://api.digitalocean.com/v2/nfs/${nfs_id}/actions"
      security:
        - bearer_auth:
            - nfs:create
  /v2/nfs/snapshots:
    get:
      operationId: nfs_list_snapshot
      summary: List NFS snapshots per region
      description: |
        To list all NFS snapshots, send a GET request to `/v2/nfs/snapshots?region=${region}&share_id={share_id}`.

        A successful request will return all NFS snapshots belonging to the authenticated user in the specified region.

        Optionally, you can filter snapshots by a specific NFS share by including the `share_id` query parameter.
      tags:
        - NFS
      parameters:
        - $ref: '#/components/parameters/parameters_region'
        - $ref: '#/components/parameters/share_id'
      responses:
        '200':
          $ref: '#/components/responses/nfs_snapshot_list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/nfs/snapshots?region=atl1"
      security:
        - bearer_auth:
            - nfs:list
  /v2/nfs/snapshots/{nfs_snapshot_id}:
    get:
      operationId: nfs_get_snapshot
      summary: Get an NFS snapshot by ID
      description: |
        To get an NFS snapshot, send a GET request to `/v2/nfs/snapshots/{nfs_snapshot_id}?region=${region}`.

        A successful request will return the NFS snapshot.
      tags:
        - NFS
      parameters:
        - $ref: '#/components/parameters/nfs_snapshot_id'
        - $ref: '#/components/parameters/parameters_region'
      responses:
        '200':
          $ref: '#/components/responses/nfs_snapshot_get'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/nfs/snapshots/{snapshot_id}?region=atl1"
      security:
        - bearer_auth:
            - nfs:read
    delete:
      operationId: nfs_delete_snapshot
      summary: Delete an NFS snapshot
      description: |
        To delete an NFS snapshot, send a DELETE request to `/v2/nfs/snapshots/{nfs_snapshot_id}?region=${region}`.

        A successful request will return a `204 No Content` status code.
      tags:
        - NFS
      parameters:
        - $ref: '#/components/parameters/nfs_snapshot_id'
        - $ref: '#/components/parameters/parameters_region'
      responses:
        '204':
          $ref: '#/components/responses/no_content'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X DELETE \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/nfs/snapshots/{snapshot_id}?region=atl1"
      security:
        - bearer_auth:
            - nfs:delete
  /v2/nfs/shares/{share_id}/access_points:
    post:
      operationId: nfs_create_access_point
      summary: Create an NFS access point
      description: |
        To create a new access point on an NFS share, send a POST request to
        `/v2/nfs/shares/{share_id}/access_points`.

        A successful request will return the newly created access point and an action object.

        The parent share must be in `ACTIVE` or `INACTIVE` status. Validation failures and
        precondition errors (such as an ineligible share state) return `400 Bad Request`.
        Duplicate name or path conflicts return `409 Conflict`.
      tags:
        - NFS
      parameters:
        - $ref: '#/components/parameters/share_id_path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/access_point_request'
            examples:
              Basic Access Point:
                value:
                  name: other-vpc
                  path: /other-vpc
                  vpc_id: 3f34cdb2-1e4f-4100-b5c7-f55f2762085f
                  access_policy:
                    anonuid: 65534
                    anongid: 65534
                    protocols:
                      - NFS4
                      - NFS
                    squash_config: ROOT_SQUASH
                    identity_enforcement_enabled: false
      responses:
        '201':
          $ref: '#/components/responses/access_point_create'
        '400':
          $ref: '#/components/responses/access_point_bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/access_point_conflict'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -d '{"name": "other-vpc", "path": "/other-vpc", "vpc_id": "3f34cdb2-1e4f-4100-b5c7-f55f2762085f", "access_policy": {"anonuid": 65534, "anongid": 65534, "protocols": ["NFS4", "NFS"], "squash_config": "ROOT_SQUASH", "identity_enforcement_enabled": false}}' \
              "https://api.digitalocean.com/v2/nfs/shares/baf4827c-6fa9-456f-9dbd-9ddfcacd0720/access_points"
      security:
        - bearer_auth:
            - nfs:create
    get:
      operationId: nfs_list_access_points
      summary: List NFS access points for a share
      description: |
        To list access points for an NFS share, send a GET request to
        `/v2/nfs/shares/{share_id}/access_points`. You may use query parameters to filter
        by status.

        A successful request will return a list of NFS access points ordered with the default
        access point first, then by `created_at` ascending.
      tags:
        - NFS
      parameters:
        - $ref: '#/components/parameters/share_id_path'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - ACCESS_POINT_CREATING
              - ACCESS_POINT_ACTIVE
              - ACCESS_POINT_FAILED
              - ACCESS_POINT_DELETED
          description: Filter access points by status.
          example: ACCESS_POINT_ACTIVE
      responses:
        '200':
          $ref: '#/components/responses/access_point_list'
        '400':
          $ref: '#/components/responses/access_point_bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/nfs/shares/baf4827c-6fa9-456f-9dbd-9ddfcacd0720/access_points"
      security:
        - bearer_auth:
            - nfs:list
  /v2/nfs/access_points/{access_point_id}:
    get:
      operationId: nfs_get_access_point
      summary: Get an NFS access point
      description: |
        To get an NFS access point, send a GET request to `/v2/nfs/access_points/{access_point_id}`.

        A successful request will return the NFS access point.
      tags:
        - NFS
      parameters:
        - $ref: '#/components/parameters/access_point_id'
      responses:
        '200':
          $ref: '#/components/responses/access_point_get'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/nfs/access_points/becd9f04-8afa-4ccd-b03e-9676447df603"
      security:
        - bearer_auth:
            - nfs:read
    delete:
      operationId: nfs_delete_access_point
      summary: Delete an NFS access point
      description: |
        To delete an NFS access point, send a DELETE request to
        `/v2/nfs/access_points/{access_point_id}`.

        A successful request will soft-delete the access point and return the deleted access point
        with status `ACCESS_POINT_DELETED` and an action object indicating the delete operation.

        The default access point (`is_default: true`) cannot be deleted. Access points already
        in `ACCESS_POINT_DELETED` or `ACCESS_POINT_FAILED` status return `400 Bad Request`.
      tags:
        - NFS
      parameters:
        - $ref: '#/components/parameters/access_point_id'
      responses:
        '200':
          $ref: '#/components/responses/access_point_delete'
        '400':
          $ref: '#/components/responses/access_point_bad_request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X DELETE \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/nfs/access_points/7659ce91-354d-4f61-9cda-ae2c7feb61d9"
      security:
        - bearer_auth:
            - nfs:delete
  /v2/nfs/{nfs_id}/actions?__type=resize:
    post:
      operationId: shares_resize_lifecycle
      summary: 'Initiate an NFS action: resize'
      description: Invokes the `resize` action. Fabricated lifecycle operation over `POST /v2/nfs/{nfs_id}/actions`.
      tags:
        - NFS Actions
      parameters:
        - in: path
          name: nfs_id
          description: The unique ID of the NFS share
          required: true
          schema:
            type: string
          example: 0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                region:
                  type: string
                  description: The slug identifier for the region.
                params:
                  type: object
                  description: Action-specific parameters (e.g. size_gib for resize, name for snapshot, vpc_ids for attach/detach).
      responses:
        '201':
          $ref: '#/components/responses/nfs_actions'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - nfs:create
  /v2/nfs/{nfs_id}/actions?__type=snapshot:
    post:
      operationId: shares_snapshot_lifecycle
      summary: 'Initiate an NFS action: snapshot'
      description: Invokes the `snapshot` action. Fabricated lifecycle operation over `POST /v2/nfs/{nfs_id}/actions`.
      tags:
        - NFS Actions
      parameters:
        - in: path
          name: nfs_id
          description: The unique ID of the NFS share
          required: true
          schema:
            type: string
          example: 0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                region:
                  type: string
                  description: The slug identifier for the region.
                params:
                  type: object
                  description: Action-specific parameters (e.g. size_gib for resize, name for snapshot, vpc_ids for attach/detach).
      responses:
        '201':
          $ref: '#/components/responses/nfs_actions'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - nfs:create
  /v2/nfs/{nfs_id}/actions?__type=attach:
    post:
      operationId: shares_attach_lifecycle
      summary: 'Initiate an NFS action: attach'
      description: Invokes the `attach` action. Fabricated lifecycle operation over `POST /v2/nfs/{nfs_id}/actions`.
      tags:
        - NFS Actions
      parameters:
        - in: path
          name: nfs_id
          description: The unique ID of the NFS share
          required: true
          schema:
            type: string
          example: 0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                region:
                  type: string
                  description: The slug identifier for the region.
                params:
                  type: object
                  description: Action-specific parameters (e.g. size_gib for resize, name for snapshot, vpc_ids for attach/detach).
      responses:
        '201':
          $ref: '#/components/responses/nfs_actions'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      security:
        - bearer_auth:
            - nfs:create
  /v2/nfs/{nfs_id}/actions?__type=detach:
    post:
      operationId: shares_detach_lifecycle
      summary: 'Initiate an NFS action: detach'
      description: Invokes the `detach` action. Fabricated lifecycle operation over `POST /v2/nfs/{nfs_id}/actions`.
      tags:
        - NFS Actions
      parameters:
        - in: path
          name: nfs_id
          description: The unique ID of the NFS share
          required: true
          schema:
