components:
  schemas:
    nfs_request:
      type: object
      properties:
        name:
          type: string
          description: The human-readable name of the share.
          example: my-nfs-share
        size_gib:
          type: integer
          description: The desired/provisioned size of the share in GiB (Gibibytes). Must be >= 50.
          example: 50
        region:
          type: string
          description: The DigitalOcean region slug (e.g., nyc2, atl1) where the NFS share resides.
          example: atl1
        vpc_ids:
          type: array
          items:
            type: string
          description: List of VPC IDs that should be able to access the share.
          example:
            - 796c6fe3-2a1d-4da2-9f3e-38239827dc91
        performance_tier:
          type: string
          description: The performance tier of the share.
          example: standard
      required:
        - name
        - size_gib
        - region
        - vpc_ids
    nfs_action_resize:
      required:
        - type
      type: object
      description: Specifies the action that will be taken on the NFS share.
      properties:
        type:
          type: string
          enum:
            - resize
            - snapshot
            - attach
            - detach
            - reassign
            - switch_performance_tier
          example: resize
          description: The type of action to initiate for the NFS share (such as resize or snapshot).
        region:
          type: string
          description: The DigitalOcean region slug (e.g. atl1, nyc2) where the NFS snapshot resides.
          example: atl1
        params:
          type: object
          properties:
            size_gib:
              type: integer
              example: 2048
              description: The new size for the NFS share.
          required:
            - size_gib
    nfs_action_snapshot:
      required:
        - type
      type: object
      description: Specifies the action that will be taken on the NFS share.
      properties:
        type:
          type: string
          enum:
            - resize
            - snapshot
            - attach
            - detach
            - reassign
            - switch_performance_tier
          example: resize
          description: The type of action to initiate for the NFS share (such as resize or snapshot).
        region:
          type: string
          description: The DigitalOcean region slug (e.g. atl1, nyc2) where the NFS snapshot resides.
          example: atl1
        params:
          type: object
          properties:
            name:
              type: string
              example: daily-backup
              description: Snapshot name of the NFS share
          required:
            - name
    nfs_action_attach:
      required:
        - type
      type: object
      description: Specifies the action that will be taken on the NFS share.
      properties:
        type:
          type: string
          enum:
            - resize
            - snapshot
            - attach
            - detach
            - reassign
            - switch_performance_tier
          example: resize
          description: The type of action to initiate for the NFS share (such as resize or snapshot).
        region:
          type: string
          description: The DigitalOcean region slug (e.g. atl1, nyc2) where the NFS snapshot resides.
          example: atl1
        params:
          type: object
          properties:
            vpc_id:
              type: string
              example: vpc-id-123
              description: The ID of the VPC to which the NFS share will be attached
          required:
            - vpc_id
    nfs_action_detach:
      required:
        - type
      type: object
      description: Specifies the action that will be taken on the NFS share.
      properties:
        type:
          type: string
          enum:
            - resize
            - snapshot
            - attach
            - detach
            - reassign
            - switch_performance_tier
          example: resize
          description: The type of action to initiate for the NFS share (such as resize or snapshot).
        region:
          type: string
          description: The DigitalOcean region slug (e.g. atl1, nyc2) where the NFS snapshot resides.
          example: atl1
        params:
          type: object
          properties:
            vpc_id:
              type: string
              example: vpc-id-123
              description: The ID of the VPC from which the NFS share will be detached
          required:
            - vpc_id
    nfs_action_reassign:
      required:
        - type
      type: object
      description: Specifies the action that will be taken on the NFS share.
      properties:
        type:
          type: string
          enum:
            - resize
            - snapshot
            - attach
            - detach
            - reassign
            - switch_performance_tier
          example: resize
          description: The type of action to initiate for the NFS share (such as resize or snapshot).
        region:
          type: string
          description: The DigitalOcean region slug (e.g. atl1, nyc2) where the NFS snapshot resides.
          example: atl1
        params:
          type: object
          properties:
            old_vpc_id:
              type: string
              example: vpc-id-123
              description: The ID of the VPC from which the NFS share will be reassigned
            new_vpc_id:
              type: string
              example: vpc-id-456
              description: The ID of the VPC to which the NFS share will be reassigned
          required:
            - old_vpc_id
            - new_vpc_id
    nfs_action_switch_performance_tier:
      required:
        - type
      type: object
      description: Specifies the action that will be taken on the NFS share.
      properties:
        type:
          type: string
          enum:
            - resize
            - snapshot
            - attach
            - detach
            - reassign
            - switch_performance_tier
          example: resize
          description: The type of action to initiate for the NFS share (such as resize or snapshot).
        region:
          type: string
          description: The DigitalOcean region slug (e.g. atl1, nyc2) where the NFS snapshot resides.
          example: atl1
        params:
          type: object
          properties:
            performance_tier:
              type: string
              example: standard
              description: The performance tier to which the NFS share will be switched (e.g., standard, high).
          required:
            - performance_tier
    access_point_request:
      type: object
      description: Payload for creating a new access point on a share.
      properties:
        name:
          type: string
          description: |
            The name for the access point. Must be unique per share. Must be 2–63
            characters and match `^[a-zA-Z0-9][a-zA-Z0-9-]{1,61}[a-zA-Z0-9]$`.
            The name `default` is reserved (case-insensitive) for the implicit default
            access point created with each share.
          example: other-vpc
        path:
          type: string
          description: |
            The export sub-path. Must start with `/`, must not be exactly `/` (reserved
            for the default access point), must be at most 1024 characters, may contain
            only alphanumerics, `-`, `_`, `.`, and `/`, and must not contain `..` path
            segments.
          example: /other-vpc
        access_policy:
          $ref: '#/components/schemas/access_policy'
        vpc_id:
          type: string
          description: |
            Required. The VPC this access point will be pinned to. A storage gateway is
            provisioned (or reused) in this VPC, and the access point becomes mountable from
            this VPC regardless of whether the parent share is currently attached to it.
          example: 3f34cdb2-1e4f-4100-b5c7-f55f2762085f
      required:
        - name
        - path
        - access_policy
        - vpc_id
    nfs_create_response:
      type: object
      properties:
        share:
          $ref: '#/components/schemas/nfs_response'
    error:
      type: object
      properties:
        id:
          description: A short identifier corresponding to the HTTP status code returned. For  example, the ID for a response returning a 404 status code would be "not_found."
          type: string
          example: not_found
        message:
          description: A message providing additional information about the error, including  details to help resolve it when possible.
          type: string
          example: The resource you were accessing could not be found.
        request_id:
          description: Optionally, some endpoints may include a request ID that should be  provided when reporting bugs or opening support tickets to help  identify the issue.
          type: string
          example: 4d9d8375-3c56-4925-a3e7-eb137fed17e9
      required:
        - id
        - message
    nfs_list_response:
      type: object
      properties:
        shares:
          type: array
          items:
            $ref: '#/components/schemas/nfs_response'
    nfs_get_response:
      type: object
      properties:
        share:
          $ref: '#/components/schemas/nfs_response'
    nfs_action:
      required:
        - type
      type: object
      description: Specifies the action that will be taken on the NFS share.
      properties:
        type:
          type: string
          enum:
            - resize
            - snapshot
            - attach
            - detach
            - reassign
            - switch_performance_tier
          example: resize
          description: The type of action to initiate for the NFS share (such as resize or snapshot).
        region:
          type: string
          description: The DigitalOcean region slug (e.g. atl1, nyc2) where the NFS snapshot resides.
          example: atl1
    nfs_actions_response:
      type: object
      description: Action response of an NFS share.
      properties:
        action:
          $ref: '#/components/schemas/nfs_action-2'
      required:
        - action
    nfs_snapshot_list_response:
      type: object
      properties:
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/nfs_snapshot_response'
    nfs_snapshot_get_response:
      type: object
      properties:
        snapshot:
          $ref: '#/components/schemas/nfs_snapshot_response'
    access_policy:
      type: object
      description: |
        Provider-agnostic NFS access policy for an access point. Network CIDRs are
        managed by attach, detach, and managed-access workflows and are not part of
        this policy.
      properties:
        anonuid:
          type: integer
          description: UID used for squashed users. Currently only 65534 is supported.
          example: 65534
        anongid:
          type: integer
          description: GID used for squashed users. Currently only 65534 is supported.
          example: 65534
        protocols:
          type: array
          items:
            type: string
            enum:
              - NFS4
              - NFS
          description: Allowed NFS protocols for this export.
          example:
            - NFS4
            - NFS
        squash_config:
          type: string
          enum:
            - NO_SQUASH
            - ROOT_SQUASH
            - ALL_SQUASH
          description: The squash mode applied to the access point export.
          example: ROOT_SQUASH
        identity_enforcement_enabled:
          type: boolean
          description: Whether identity enforcement is enabled for this export.
          example: false
      required:
        - anonuid
        - anongid
        - protocols
        - squash_config
        - identity_enforcement_enabled
    access_point_action_response:
      type: object
      description: Response returned after starting an access point mutation.
      properties:
        access_point:
          $ref: '#/components/schemas/access_point_response'
        action:
          $ref: '#/components/schemas/nfs_action-2'
      required:
        - access_point
        - action
    nfs_api_error:
      type: object
      description: A standard NFS API error response object.
      properties:
        code:
          type: string
          description: A service-defined error code.
          example: MISSING_NAME
        message:
          type: string
          description: A human-readable description of the error.
          example: name is required
      required:
        - code
        - message
    access_point_list_response:
      type: object
      description: Response containing a list of access points.
      properties:
        access_points:
          type: array
          items:
            $ref: '#/components/schemas/access_point_response'
          description: Array of access point objects.
      required:
        - access_points
    access_point_get_response:
      type: object
      description: Response containing a single access point.
      properties:
        access_point:
          $ref: '#/components/schemas/access_point_response'
      required:
        - access_point
    nfs_response:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the NFS share.
          readOnly: true
          example: 0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
        name:
          type: string
          description: The human-readable name of the share.
          example: sammy-share-drive
        size_gib:
          type: integer
          description: The desired/provisioned size of the share in GiB (Gibibytes). Must be >= 50.
          example: 1024
        region:
          type: string
          description: The DigitalOcean region slug (e.g., nyc2, atl1) where the NFS share resides.
          example: atl1
        status:
          type: string
          enum:
            - CREATING
            - ACTIVE
            - INACTIVE
            - FAILED
            - DELETED
          description: |
            The current status of the share. `INACTIVE` means the share exists but is
            not attached to any VPC.
          readOnly: true
          example: ACTIVE
        created_at:
          type: string
          format: date-time
          description: Timestamp for when the NFS share was created.
          readOnly: true
          example: '2023-01-01T00:00:00Z'
        vpc_ids:
          type: array
          items:
            type: string
          description: List of VPC IDs that should be able to access the share.
          example:
            - 796c6fe3-2a1d-4da2-9f3e-38239827dc91
        performance_tier:
          type: string
          description: The performance tier of the share.
          example: PERFORMANCE_TIER_HIGH
        mount_path:
          type: string
          description: Path at which the share will be available, to be mounted at a target of the user's choice within the client
          example: /123456/your-nfs-share-uuid
        host:
          type: string
          description: The host IP of the NFS server that will be accessible from the associated VPC
          example: 10.128.32.2
        access_points:
          type: array
          items:
            $ref: '#/components/schemas/access_point_response'
          description: Access points configured on this share. The default access point is returned first.
      required:
        - id
        - name
        - size_gib
        - region
        - status
        - created_at
    nfs_action-2:
      type: object
      description: The action that was submitted.
      properties:
        id:
          type: string
          description: The unique identifier of the action.
          example: 084c3b9c-2382-441b-92d4-10b095bb5d7c
        region_slug:
          type: string
          description: The DigitalOcean region slug where the resource is located.
          example: s2r1
        resource_id:
          type: string
          format: uuid
          description: The unique identifier of the resource on which the action is being performed.
          example: 7659ce91-354d-4f61-9cda-ae2c7feb61d9
        resource_type:
          type: string
          enum:
            - SHARE
            - SNAPSHOT
          description: |
            The type of resource on which the action is being performed. Access point
            mutations return `SHARE` with `resource_id` set to the access point UUID.
          example: SHARE
        started_at:
          type: string
          format: date-time
          description: The timestamp when the action was started.
          example: '2026-06-25T08:11:12Z'
        status:
          type: string
          enum:
            - IN_PROGRESS
            - COMPLETED
            - ACTION_FAILED
          description: The current status of the action.
          example: IN_PROGRESS
        type:
          type: string
          description: |
            The type of action being performed. Share actions use values such as
            `RESIZE_SHARE` and `CREATE_SHARE`. Access point mutations use
            `CREATE_ACCESS_POINT` and `DELETE_ACCESS_POINT`.
          example: CREATE_ACCESS_POINT
      required:
        - region_slug
        - resource_id
        - resource_type
        - started_at
        - status
        - type
    nfs_snapshot_response:
      type: object
      description: Represents an NFS snapshot.
      properties:
        id:
          type: string
          description: The unique identifier of the snapshot.
          example: 0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
        name:
          type: string
          description: The human-readable name of the snapshot.
          example: daily-backup
        size_gib:
          type: integer
          format: uint64
          description: The size of the snapshot in GiB.
          example: 1024
        region:
          type: string
          description: The DigitalOcean region slug where the snapshot is located.
          example: atl1
        status:
          type: string
          enum:
            - UNKNOWN
            - CREATING
            - ACTIVE
            - FAILED
            - DELETED
          description: The current status of the snapshot.
          example: CREATING
        created_at:
          type: string
          format: date-time
          description: The timestamp when the snapshot was created.
          example: '2023-11-14T16:29:21Z'
        share_id:
          type: string
          format: uuid
          description: The unique identifier of the share from which this snapshot was created.
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
      required:
        - id
        - name
        - region
        - size_gib
        - status
        - created_at
        - share_id
    access_point_response:
      type: object
      description: Represents an NFS access point resource.
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the access point.
          readOnly: true
          example: a1b2c3d4-e5f6-4a5b-9c8d-1e2f3a4b5c6d
        name:
          type: string
          description: The human-readable name of the access point. Must be unique per share.
          example: other-vpc
        share_id:
          type: string
          format: uuid
          description: The unique identifier of the share this access point belongs to.
          readOnly: true
          example: 0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
        path:
          type: string
          description: The export sub-path for this access point (always starts with `/`).
          example: /other-vpc
        status:
          type: string
          enum:
            - ACCESS_POINT_CREATING
            - ACCESS_POINT_ACTIVE
            - ACCESS_POINT_FAILED
            - ACCESS_POINT_DELETED
          description: |
            The current lifecycle status of an access point. There is no ACCESS_POINT_DELETING state:
            DELETE soft-deletes the access point synchronously (mirroring share deletion);
            the response of a delete request returns the access point already in ACCESS_POINT_DELETED.
          readOnly: true
          example: ACCESS_POINT_ACTIVE
        access_policy:
          $ref: '#/components/schemas/access_policy'
        created_at:
          type: string
          format: date-time
          description: The timestamp when the access point was created.
          readOnly: true
          example: '2023-01-01T00:00:00Z'
        updated_at:
          type: string
          description: |
            The timestamp when the access point was last updated. May be empty while the
            access point is still being created.
          readOnly: true
          example: '2026-06-25T08:11:16Z'
        is_default:
          type: boolean
          description: Whether this is the share's default access point.
          readOnly: true
          example: false
        vpc_id:
          type: string
          description: |
            The VPC this access point is pinned to. Omitted on the default access point.
            Every non-default access point owns its own storage gateway in this VPC and
            is independent of the parent share's VPC lifecycle.
          example: 3f34cdb2-1e4f-4100-b5c7-f55f2762085f
      required:
        - id
        - name
        - share_id
        - path
        - status
        - access_policy
        - created_at
        - updated_at
        - is_default
  responses:
    nfs_create:
      description: A JSON response containing details about the new NFS share.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit-limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit-remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/nfs_create_response'
    bad_request-2:
      description: Size must be greater than or equal to 50Gib
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit-limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit-remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            id: bad_request
            message: The value for 'size_gib' must be greater than or equal to 50Gib.
    unauthorized:
      description: Authentication failed due to invalid credentials.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit-limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit-remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            id: unauthorized
            message: Unable to authenticate you.
    too_many_requests:
      description: The API rate limit has been exceeded.
      headers:
        ratelimit-limit:
          $ref: '#/components/headers/ratelimit-limit'
        ratelimit-remaining:
          $ref: '#/components/headers/ratelimit-remaining'
        ratelimit-reset:
          $ref: '#/components/headers/ratelimit-reset'
      content:
