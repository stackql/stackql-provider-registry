openapi: 3.0.0
info:
  title: inference API
  description: digitalocean API
  version: '2.0'
paths:
  /v2/dedicated-inferences/{dedicated_inference_id}:
    get:
      operationId: dedicatedInferences_get
      summary: Get a Dedicated Inference
      description: |
        Retrieve an existing Dedicated Inference by ID. Send a GET request to
        `/v2/dedicated-inferences/{dedicated_inference_id}`. The status in the response
        is one of active, new, provisioning, updating, deleting, or error.
      tags:
        - Dedicated Inference
      parameters:
        - $ref: '#/components/parameters/dedicated_inference_id'
      responses:
        '200':
          $ref: '#/components/responses/dedicated_inference'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X GET "https://api.digitalocean.com/v2/dedicated-inferences/6b5c619c-359c-44ca-87e2-47e98170c01d" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN"
      security:
        - bearer_auth:
            - dedicated_inference:read
    patch:
      operationId: dedicatedInferences_patch
      summary: Update a Dedicated Inference
      description: |
        Update an existing Dedicated Inference. Send a PATCH request to
        `/v2/dedicated-inferences/{dedicated_inference_id}` with updated `spec` and/or
        `access_tokens`. Status will move to updating and return to active when done.
      tags:
        - Dedicated Inference
      parameters:
        - $ref: '#/components/parameters/dedicated_inference_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dedicated_inference_update_request'
      responses:
        '202':
          $ref: '#/components/responses/dedicated_inference_update_accepted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X PATCH "https://api.digitalocean.com/v2/dedicated-inferences/6b5c619c-359c-44ca-87e2-47e98170c01d" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN" \
              -d '{
                "spec": {
                  "version": 1,
                  "name": "renamed-dedicated-inference",
                  "region": "atl1",
                  "vpc": { "uuid": "997615ce-132d-4bae-9270-9ee21b395e5d" },
                  "enable_public_endpoint": true,
                  "model_deployments": [{
                    "model_slug": "mistral/mistral-7b-instruct-v3",
                    "model_provider": "hugging_face",
                    "workload_config": {},
                    "accelerators": [{
                      "scale": 2,
                      "type": "prefill_decode",
                      "accelerator_slug": "gpu-mi300x1-192gb"
                    }]
                  }]
                },
                "access_tokens": { "hugging_face_token": "$HF_TOKEN" }
              }'
      security:
        - bearer_auth:
            - dedicated_inference:update
    delete:
      operationId: dedicatedInferences_delete
      summary: Delete a Dedicated Inference
      description: |
        Delete an existing Dedicated Inference. Send a DELETE request to
        `/v2/dedicated-inferences/{dedicated_inference_id}`. The response 202 Accepted
        indicates the request was accepted for processing.
      tags:
        - Dedicated Inference
      parameters:
        - $ref: '#/components/parameters/dedicated_inference_id'
      responses:
        '202':
          $ref: '#/components/responses/accepted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X DELETE "https://api.digitalocean.com/v2/dedicated-inferences/6b5c619c-359c-44ca-87e2-47e98170c01d" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN"
      security:
        - bearer_auth:
            - dedicated_inference:delete
  /v2/dedicated-inferences:
    get:
      operationId: dedicatedInferences_list
      summary: List Dedicated Inferences
      description: |
        List all Dedicated Inference instances for your team. Send a GET request to
        `/v2/dedicated-inferences`. You may filter by region and use page and per_page
        for pagination.
      tags:
        - Dedicated Inference
      parameters:
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/region'
      responses:
        '200':
          $ref: '#/components/responses/all_dedicated_inferences'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X GET "https://api.digitalocean.com/v2/dedicated-inferences?region=nyc2&page=1&per_page=20" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN"
      security:
        - bearer_auth:
            - dedicated_inference:read
    post:
      operationId: dedicatedInferences_create
      summary: Create a Dedicated Inference
      description: |
        Create a new Dedicated Inference for your team. Send a POST request to
        `/v2/dedicated-inferences` with a `spec` object (version, name, region, vpc,
        enable_public_endpoint, model_deployments) and optional `access_tokens` (e.g.
        hugging_face_token for gated models). The response code 202 Accepted indicates
        the request was accepted for processing; it does not indicate success or failure.
        The token value is returned only on create; store it securely.
      tags:
        - Dedicated Inference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dedicated_inference_create_request'
      responses:
        '202':
          $ref: '#/components/responses/dedicated_inference_provisioning'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X POST "https://api.digitalocean.com/v2/dedicated-inferences" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN" \
              -d '{
                "spec": {
                  "version": 1,
                  "name": "new-dedicated-inference",
                  "region": "atl1",
                  "vpc": { "uuid": "7e5c619c-359c-44ca-87e2-47e98170c012" },
                  "enable_public_endpoint": true,
                  "model_deployments": [{
                    "model_slug": "mistral/mistral-7b-instruct-v3",
                    "model_provider": "hugging_face",
                    "workload_config": {},
                    "accelerators": [{
                      "scale": 2,
                      "type": "prefill_decode",
                      "accelerator_slug": "gpu-mi300x1-192gb"
                    }]
                  }]
                },
                "access_tokens": { "hugging_face_token": "$HF_TOKEN" }
              }'
      security:
        - bearer_auth:
            - dedicated_inference:create
  /v2/dedicated-inferences/{dedicated_inference_id}/accelerators:
    get:
      operationId: dedicatedInferences_list_accelerators
      summary: List Dedicated Inference Accelerators
      description: |
        List all accelerators (GPUs) in use by a Dedicated Inference instance. Send a
        GET request to `/v2/dedicated-inferences/{dedicated_inference_id}/accelerators`.
        Optionally filter by slug and use page/per_page for pagination.
      tags:
        - Dedicated Inference
      parameters:
        - name: dedicated_inference_id
          in: path
          required: true
          description: A unique identifier for a Dedicated Inference instance.
          schema:
            type: string
            format: uuid
          example: 6b5c619c-359c-44ca-87e2-47e98170c01d
        - name: per_page
          in: query
          required: false
          description: Number of items returned per page
          schema:
            type: integer
            minimum: 1
            default: 20
            maximum: 200
          example: 20
        - name: page
          in: query
          required: false
          description: Which 'page' of paginated results to return.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: slug
          in: query
          required: false
          description: Filter accelerators by GPU slug.
          schema:
            type: string
          example: gpu-mi300x1-192gb
      responses:
        '200':
          $ref: '#/components/responses/accelerators_list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X GET "https://api.digitalocean.com/v2/dedicated-inferences/6b5c619c-359c-44ca-87e2-47e98170c01d/accelerators" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN"
      security:
        - bearer_auth:
            - dedicated_inference:read
  /v2/dedicated-inferences/{dedicated_inference_id}/accelerators/{accelerator_id}:
    get:
      operationId: dedicatedInferences_get_accelerator
      summary: Get a Dedicated Inference Accelerator
      description: |
        Retrieve a single accelerator by ID for a Dedicated Inference instance. Send a
        GET request to `/v2/dedicated-inferences/{dedicated_inference_id}/accelerators/{accelerator_id}`.
      tags:
        - Dedicated Inference
      parameters:
        - $ref: '#/components/parameters/dedicated_inference_id'
        - $ref: '#/components/parameters/accelerator_id'
      responses:
        '200':
          description: Single accelerator object.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated_inference_accelerator'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X GET "https://api.digitalocean.com/v2/dedicated-inferences/6b5c619c-359c-44ca-87e2-47e98170c01d/accelerators/5b5c619c-359c-44ca-87e2-47e98170c02f" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN"
      security:
        - bearer_auth:
            - dedicated_inference:read
  /v2/dedicated-inferences/{dedicated_inference_id}/ca:
    get:
      operationId: dedicatedInferences_get_ca
      summary: Get Dedicated Inference CA Certificate
      description: |
        Get the CA certificate for a Dedicated Inference instance (base64-encoded).
        Required for private endpoint connectivity. Send a GET request to
        `/v2/dedicated-inferences/{dedicated_inference_id}/ca`.
      tags:
        - Dedicated Inference
      parameters:
        - $ref: '#/components/parameters/dedicated_inference_id'
      responses:
        '200':
          $ref: '#/components/responses/ca_certificate'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X GET "https://api.digitalocean.com/v2/dedicated-inferences/6b5c619c-359c-44ca-87e2-47e98170c01d/ca" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN"
      security:
        - bearer_auth:
            - dedicated_inference:read
  /v2/dedicated-inferences/{dedicated_inference_id}/tokens:
    get:
      operationId: dedicatedInferences_list_tokens
      summary: List Dedicated Inference Tokens
      description: |
        List all access tokens for a Dedicated Inference instance. Token values are
        not returned; only id, name, created_at, and is_managed. Send a GET request to
        `/v2/dedicated-inferences/{dedicated_inference_id}/tokens`.
      tags:
        - Dedicated Inference
      parameters:
        - $ref: '#/components/parameters/dedicated_inference_id'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          $ref: '#/components/responses/tokens_list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X GET "https://api.digitalocean.com/v2/dedicated-inferences/6b5c619c-359c-44ca-87e2-47e98170c01d/tokens?page=1&per_page=20" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN"
      security:
        - bearer_auth:
            - dedicated_inference_tokens:read
    post:
      operationId: dedicatedInferences_create_tokens
      summary: Create a Dedicated Inference Token
      description: |
        Create a new access token for a Dedicated Inference instance. Send a POST
        request to `/v2/dedicated-inferences/{dedicated_inference_id}/tokens` with a
        `name`. The token value is returned only once in the response; store it securely.
      tags:
        - Dedicated Inference
      parameters:
        - $ref: '#/components/parameters/dedicated_inference_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dedicated_inference_token_create_request'
      responses:
        '202':
          $ref: '#/components/responses/token_created'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X POST "https://api.digitalocean.com/v2/dedicated-inferences/6b5c619c-359c-44ca-87e2-47e98170c01d/tokens" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN" \
              -d '{"name": "new-inference-token"}'
      security:
        - bearer_auth:
            - dedicated_inference_tokens:create
  /v2/dedicated-inferences/{dedicated_inference_id}/tokens/{token_id}:
    delete:
      operationId: dedicatedInferences_delete_tokens
      summary: Revoke a Dedicated Inference Token
      description: |
        Revoke (delete) an access token for a Dedicated Inference instance. Send a
        DELETE request to `/v2/dedicated-inferences/{dedicated_inference_id}/tokens/{token_id}`.
      tags:
        - Dedicated Inference
      parameters:
        - $ref: '#/components/parameters/dedicated_inference_id'
        - $ref: '#/components/parameters/token_id'
      responses:
        '204':
          description: Token revoked.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X DELETE "https://api.digitalocean.com/v2/dedicated-inferences/6b5c619c-359c-44ca-87e2-47e98170c01d/tokens/f11d4795-c1db-4ac3-9aa6-a0ea3c58877e" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN"
      security:
        - bearer_auth:
            - dedicated_inference_tokens:delete
  /v2/dedicated-inferences/sizes:
    get:
      operationId: dedicatedInferences_list_sizes
      summary: List Dedicated Inference Sizes
      description: |
        Get available Dedicated Inference sizes and pricing for supported GPUs. Send a
        GET request to `/v2/dedicated-inferences/sizes`.
      tags:
        - Dedicated Inference
      responses:
        '200':
          description: Enabled regions and sizes with pricing.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated_inference_sizes_response'
              example:
                enabled_regions:
                  - nyc2
                  - atl1
                sizes:
                  - gpu_slug: gpu-mi300x1-192gb
                    price_per_hour: '2'
                    region: nyc2
                    currency: USD
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X GET "https://api.digitalocean.com/v2/dedicated-inferences/sizes" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN"
      security:
        - bearer_auth:
            - dedicated_inference:read
  /v2/dedicated-inferences/gpu-model-config:
    get:
      operationId: dedicatedInferences_get_gpu_model_config
      summary: Get Dedicated Inference GPU Model Config
      description: |
        Get supported GPU and model configurations for Dedicated Inference. Use this to
        discover supported GPU slugs and model slugs (e.g. Hugging Face). Send a GET
        request to `/v2/dedicated-inferences/gpu-model-config`.
      tags:
        - Dedicated Inference
      responses:
        '200':
          description: GPU model configs (gpu_slugs, model_slug, model_name, is_gated_model).
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dedicated_inference_gpu_model_configs_response'
              example:
                gpu_model_configs:
                  - gpu_slugs:
                      - gpu-mi300x1-192gb
                    model_slug: mistral/mistral-7b-instruct-v3
                    model_name: Mistral-7B-Instruct-v0.3
                    is_gated_model: true
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -i -X GET "https://api.digitalocean.com/v2/dedicated-inferences/gpu-model-config" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DO_TOKEN"
      security:
        - bearer_auth:
            - dedicated_inference:read
  /v1/chat/completions:
    post:
      operationId: inference_create_chat_completion
      summary: Create a model response for the given chat conversation
      description: Creates a model response for the given chat conversation.
      tags:
        - Serverless Inference
      x-inference-base-url: https://inference.do-ai.run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chat_completion_request'
      responses:
        '200':
          description: Successful chat completion. When stream is true, response is sent as Server-Sent Events (text/event-stream); otherwise a single JSON object (application/json) is returned.
          headers:
            ratelimit-limit:
              $ref: '#/components/headers/ratelimit-limit'
            ratelimit-remaining:
              $ref: '#/components/headers/ratelimit-remaining'
            ratelimit-reset:
              $ref: '#/components/headers/ratelimit-reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chat_completion_response'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/chat_completion_chunk'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/too_many_requests'
        '500':
          $ref: '#/components/responses/server_error'
        default:
          $ref: '#/components/responses/unexpected_error'
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -d '{"messages": [{"role": "user", "content": "What is the capital of Portugal?"}], "model": "meta-llama/Meta-Llama-3.1-8B-Instruct"}' \
              "https://inference.do-ai.run/v1/chat/completions"
        - lang: Python
          source: |-
            import os
            from pydo import Client

            client = Client(token=os.environ.get("DIGITALOCEAN_TOKEN"))

            resp = client.chat.completions.create(
                model="llama3.3-70b-instruct",
                messages=[
                    {"role": "user", "content": "What is the capital of Portugal?"},
                ],
            )

            print(resp.choices[0].message.content)
        - lang: JavaScript
          source: |-
            import { InferenceClient } from "@digitalocean/dots";

            const client = new InferenceClient({
                apiKey: process.env.DIGITALOCEAN_TOKEN,
            });

            const completion = await client.chat.completions.create({
                model: "llama3.3-70b-instruct",
                messages: [
                    { role: "user", content: "What is the capital of Portugal?" },
                ],
            });

            console.log(completion.choices[0].message.content);
      security:
        - inference_bearer_auth: []
      servers:
        - url: https://inference.do-ai.run
  /v1/messages:
    post:
      operationId: inference_create_messages
      summary: Create the next assistant message
      description: |
