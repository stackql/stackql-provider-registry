openapi: 3.0.0
info:
  title: Databricks Supervisoragents API (workspace)
  description: >-
    OpenAPI specification for the Databricks supervisoragents service
    (workspace-level APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-07-31'
  x-stackql-sdk-namespace: databricks.sdk.service.supervisoragents
servers:
  - url: https://{deployment_name}.cloud.databricks.com
    variables:
      deployment_name:
        description: The Databricks Workspace Deployment Name
        default: dbc-abcd0123-a1bc
paths:
  /api/2.1/{parent}/examples:
    post:
      operationId: supervisor_agents_create_example
      summary: Creates an example for a Supervisor Agent.
      tags:
        - supervisoragents
        - supervisor_agents
      description: |-
        Creates an example for a Supervisor Agent.

        :param parent: str
          Parent resource where this example will be created. Format: supervisor-agents/{supervisor_agent_id}
        :param example: :class:`Example`
          The example to create under the parent Supervisor Agent.

        :returns: :class:`Example`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            Parent resource where this example will be created. Format:
            supervisor-agents/{supervisor_agent_id}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                example:
                  type: object
                  properties:
                    question:
                      type: string
                      description: The example question.
                    guidelines:
                      type: array
                      items:
                        type: string
                      description: Guidelines for answering the question.
                    example_id:
                      type: string
                      description: The universally unique identifier (UUID) of the example.
                    name:
                      type: string
                      description: >-
                        Full resource name:
                        supervisor-agents/{supervisor_agent_id}/examples/{example_id}
                  required:
                    - question
                    - guidelines
                  description: The example to create under the parent Supervisor Agent.
              required:
                - example
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: SupervisorAgentsAPI
    get:
      operationId: supervisor_agents_list_examples
      summary: Lists examples under a Supervisor Agent.
      tags:
        - supervisoragents
        - supervisor_agents
      description: |-
        Lists examples under a Supervisor Agent.

        :param parent: str
          Parent resource to list from. Format: supervisor-agents/{supervisor_agent_id}
        :param page_size: int (optional)
          The maximum number of examples to return. If unspecified, at most 100 examples will be returned. The
          maximum value is 100; values above 100 will be coerced to 100.
        :param page_token: str (optional)
          A page token, received from a previous ``ListExamples`` call. Provide this to retrieve the
          subsequent page. If unspecified, the first page will be returned.

        :returns: Iterator over :class:`Example`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            Parent resource to list from. Format:
            supervisor-agents/{supervisor_agent_id}
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of examples to return. If unspecified, at most
            100 examples will be returned. The maximum value is 100; values
            above 100 will be coerced to 100.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ``ListExamples`` call.
            Provide this to retrieve the subsequent page. If unspecified, the
            first page will be returned.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListExamplesResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: SupervisorAgentsAPI
  /api/2.1/supervisor-agents:
    post:
      operationId: supervisor_agents_create_supervisor_agent
      summary: Creates a new Supervisor Agent.
      tags:
        - supervisoragents
        - supervisor_agents
      description: |-
        Creates a new Supervisor Agent.

        :param supervisor_agent: :class:`SupervisorAgent`
          The Supervisor Agent to create.

        :returns: :class:`SupervisorAgent`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                supervisor_agent:
                  type: object
                  properties:
                    display_name:
                      type: string
                    create_time:
                      type: string
                      format: date-time
                      description: Creation timestamp.
                    creator:
                      type: string
                      description: The creator of the Supervisor Agent.
                    description:
                      type: string
                      description: Description of what this agent can do (user-facing).
                    endpoint_name:
                      type: string
                      description: The name of the supervisor agent's serving endpoint.
                    experiment_id:
                      type: string
                      description: The MLflow experiment ID.
                    id:
                      type: string
                      description: 'Deprecated: Use supervisor_agent_id instead.'
                    instructions:
                      type: string
                      description: >-
                        Optional natural-language instructions for the
                        supervisor agent.
                    name:
                      type: string
                      description: >-
                        The resource name of the SupervisorAgent. Format:
                        supervisor-agents/{supervisor_agent_id}
                    supervisor_agent_id:
                      type: string
                      description: >-
                        The universally unique identifier (UUID) of the
                        Supervisor Agent.
                  required:
                    - display_name
                  description: The Supervisor Agent to create.
              required:
                - supervisor_agent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorAgent'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: SupervisorAgentsAPI
    get:
      operationId: supervisor_agents_list_supervisor_agents
      summary: Lists Supervisor Agents.
      tags:
        - supervisoragents
        - supervisor_agents
      description: |-
        Lists Supervisor Agents.

        :param page_size: int (optional)
          The maximum number of supervisor agents to return. If unspecified, at most 100 supervisor agents
          will be returned. The maximum value is 100; values above 100 will be coerced to 100.
        :param page_token: str (optional)
          A page token, received from a previous ``ListSupervisorAgents`` call. Provide this to retrieve the
          subsequent page. If unspecified, the first page will be returned.

        :returns: Iterator over :class:`SupervisorAgent`
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of supervisor agents to return. If unspecified,
            at most 100 supervisor agents will be returned. The maximum value is
            100; values above 100 will be coerced to 100.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ``ListSupervisorAgents``
            call. Provide this to retrieve the subsequent page. If unspecified,
            the first page will be returned.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSupervisorAgentsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
