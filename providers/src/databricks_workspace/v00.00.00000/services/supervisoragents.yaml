          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of examples to return. If unspecified, at most
            100 examples will be returned. The maximum value is 100; values
            above 100 will be coerced to 100.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ``ListExamples`` call.
            Provide this to retrieve the subsequent page. If unspecified, the
            first page will be returned.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListExamplesResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
