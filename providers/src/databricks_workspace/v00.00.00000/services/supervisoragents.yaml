      description: >-
        Creates a Tool under a Supervisor Agent. Specify one of "genie_space",
        "knowledge_assistant",

        "uc_function", "uc_connection", "app", "volume", "dashboard", "table",
        "vector_search_index",

        "catalog", "schema", "supervisor_agent", "databricks_web_search",
        "skill" in the request body. The

        legacy values "lakeview_dashboard", "uc_table", and "web_search" are
        also accepted and remain

        equivalent to "dashboard", "table", and "databricks_web_search"
        respectively. The

        "databricks_web_search" tool_type maps to the ``web_search`` spec field.


        :param parent: str
          Parent resource where this tool will be created. Format: supervisor-agents/{supervisor_agent_id}
        :param tool: :class:`Tool`

        :param tool_id: str
          The ID to use for the tool, which will become the final component of the tool's resource name.

        :returns: :class:`Tool`
      parameters:
        - name: supervisor_agent_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `supervisor_agent_id` segment of the `parent` resource name
            (`supervisor-agents/{supervisor_agent_id}`). Parent resource where
            this tool will be created. Format:
            supervisor-agents/{supervisor_agent_id}
        - name: tool_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            The ID to use for the tool, which will become the final component of
            the tool's resource name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tool_type:
                  type: string
                app:
                  type: object
                  properties:
                    name:
                      type: string
                      description: App name
                  required:
                    - name
                  description: 'Databricks app. Supported app: custom mcp, custom agent.'
                description:
                  type: string
                  description: Description of what this tool does (user-facing).
                genie_space:
                  type: object
                  properties:
                    id:
                      type: string
                  required:
                    - id
                id:
                  type: string
                  description: 'Deprecated: Use tool_id instead.'
                knowledge_assistant:
                  type: object
                  properties:
                    knowledge_assistant_id:
                      type: string
                    serving_endpoint_name:
                      type: string
                      description: 'Deprecated: use knowledge_assistant_id instead.'
                  required:
                    - knowledge_assistant_id
                name:
                  type: string
                  description: >-
                    Full resource name:
                    supervisor-agents/{supervisor_agent_id}/tools/{tool_id}
                tool_id:
                  type: string
                  description: User specified id of the Tool.
                uc_connection:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  description: >-
                    Databricks UC connection. Supported connection: external mcp
                    server.
                uc_function:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                volume:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
              required:
                - tool_type
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        default:
          description: Error response
          content:
            application/json:
