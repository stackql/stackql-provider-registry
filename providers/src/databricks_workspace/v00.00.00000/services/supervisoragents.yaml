components:
  schemas:
    App:
      type: object
      properties:
        name:
          type: string
          description: App name
      required:
        - name
      description: 'Databricks app. Supported app: custom mcp, custom agent.'
    Catalog:
      type: object
      properties:
        name:
          type: string
          description: Bare UC catalog name this tool is authorized to search (no ``.``).
      required:
        - name
      description: >-
        UC catalog asset_search scope. One tool authorizes asset_search over one
        catalog. Multiple
            catalog tools widen the scope; the backend merges them into a single CATALOG entry in
            asset_search's scoped_assets.
    Example:
      type: object
      properties:
        question:
          type: string
          description: The example question.
        guidelines:
          type: array
          items:
            type: string
          description: Guidelines for answering the question.
        example_id:
          type: string
          description: The universally unique identifier (UUID) of the example.
        name:
          type: string
          description: >-
            Full resource name:
            supervisor-agents/{supervisor_agent_id}/examples/{example_id}
      required:
        - question
        - guidelines
      description: >-
        An example associated with a Supervisor Agent. Contains a question and
        guidelines for how the
            agent should respond.
    GenieSpace:
      type: object
      properties:
        id:
          type: string
        space_id:
          type: string
          description: The ID of the genie space.
      required:
        - id
    GetSupervisorAgentPermissionLevelsResponse:
      type: object
      properties:
        permission_levels:
          type: array
          items:
            $ref: '#/components/schemas/SupervisorAgentPermissionsDescription'
    KnowledgeAssistant:
      type: object
      properties:
        knowledge_assistant_id:
          type: string
        serving_endpoint_name:
          type: string
          description: 'Deprecated: use knowledge_assistant_id instead.'
      required:
        - knowledge_assistant_id
    LakeviewDashboard:
      type: object
      properties:
        dashboard_id:
          type: string
          description: The unique identifier of the Lakeview dashboard.
      required:
        - dashboard_id
      description: Lakeview Dashboard tool scoped to a specific published dashboard.
    ListExamplesResponse:
      type: object
      properties:
        examples:
          type: array
          items:
            $ref: '#/components/schemas/Example'
        next_page_token:
          type: string
      description: A list of Supervisor Agent examples.
    ListSupervisorAgentsResponse:
      type: object
      properties:
        next_page_token:
          type: string
        supervisor_agents:
          type: array
          items:
            $ref: '#/components/schemas/SupervisorAgent'
    ListToolsResponse:
      type: object
      properties:
        next_page_token:
          type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
    Schema:
      type: object
      properties:
        name:
          type: string
          description: >-
            Full UC schema name (catalog.schema) this tool is authorized to
            search.
      required:
        - name
      description: >-
        UC schema asset_search scope. One tool authorizes asset_search over one
        schema. Multiple schema
            tools widen the scope.
    ServingEndpoint:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    Skill:
      type: object
      properties:
        path:
          type: string
          description: >-
            Absolute WSFS path to a folder containing skill subdirectories.
            Example: /Workspace/Users/creator@company.com/.assistant/skills
      required:
        - path
      description: >-
        Skill tool. Points to a folder containing skill subdirectories with
        SKILL.md files (YAML
            frontmatter with name + description, followed by markdown instructions). Skills are discovered
            from the folder at runtime and loaded on demand via a read_skill tool registered by the
            supervisor.
    SupervisorAgent:
      type: object
      properties:
        display_name:
          type: string
        create_time:
          type: string
          format: date-time
          description: Creation timestamp.
        creator:
          type: string
          description: The creator of the Supervisor Agent.
        description:
          type: string
          description: Description of what this agent can do (user-facing).
        endpoint_name:
          type: string
          description: The name of the supervisor agent's serving endpoint.
        experiment_id:
          type: string
          description: The MLflow experiment ID.
        id:
          type: string
          description: 'Deprecated: Use supervisor_agent_id instead.'
        instructions:
          type: string
          description: Optional natural-language instructions for the supervisor agent.
        name:
          type: string
          description: >-
            The resource name of the SupervisorAgent. Format:
            supervisor-agents/{supervisor_agent_id}
        supervisor_agent_id:
          type: string
          description: The universally unique identifier (UUID) of the Supervisor Agent.
      required:
        - display_name
    SupervisorAgentAccessControlRequest:
      type: object
      properties:
        group_name:
          type: string
        permission_level:
          $ref: '#/components/schemas/SupervisorAgentPermissionLevel'
        service_principal_name:
          type: string
          description: application ID of a service principal
        user_name:
          type: string
          description: name of the user
    SupervisorAgentAccessControlResponse:
      type: object
      properties:
        all_permissions:
          type: array
          items:
            $ref: '#/components/schemas/SupervisorAgentPermission'
        display_name:
          type: string
          description: Display name of the user or service principal.
        group_name:
          type: string
          description: name of the group
        service_principal_name:
          type: string
          description: Name of the service principal.
        user_name:
          type: string
          description: name of the user
    SupervisorAgentPermission:
      type: object
      properties:
        inherited:
          type: boolean
        inherited_from_object:
          type: array
          items:
            type: string
        permission_level:
          $ref: '#/components/schemas/SupervisorAgentPermissionLevel'
    SupervisorAgentPermissions:
      type: object
      properties:
        access_control_list:
          type: array
          items:
            $ref: '#/components/schemas/SupervisorAgentAccessControlResponse'
        object_id:
          type: string
        object_type:
          type: string
    SupervisorAgentPermissionsDescription:
      type: object
      properties:
        description:
          type: string
        permission_level:
          $ref: '#/components/schemas/SupervisorAgentPermissionLevel'
    SupervisorAgentTool:
      type: object
      properties:
        supervisor_agent_id:
          type: string
          description: The ID of the supervisor agent (tile ID).
      required:
        - supervisor_agent_id
      description: Nested Supervisor Agent tool.
    Tool:
      type: object
      properties:
        tool_type:
          type: string
        app:
          $ref: '#/components/schemas/App'
        catalog:
          $ref: '#/components/schemas/Catalog'
          description: Configuration for a UC catalog asset_search scope tool.
        dashboard:
          $ref: '#/components/schemas/LakeviewDashboard'
          description: >-
            Lakeview dashboard tool. Replaces the deprecated
            ``lakeview_dashboard`` field.
        description:
          type: string
          description: Description of what this tool does (user-facing).
        genie_space:
          $ref: '#/components/schemas/GenieSpace'
        id:
          type: string
          description: 'Deprecated: Use tool_id instead.'
        knowledge_assistant:
          $ref: '#/components/schemas/KnowledgeAssistant'
        lakeview_dashboard:
          $ref: '#/components/schemas/LakeviewDashboard'
          description: 'Deprecated: use ``dashboard`` instead.'
        name:
          type: string
          description: >-
            Full resource name:
            supervisor-agents/{supervisor_agent_id}/tools/{tool_id}
        schema:
          $ref: '#/components/schemas/Schema'
          description: Configuration for a UC schema asset_search scope tool.
        serving_endpoint:
          $ref: '#/components/schemas/ServingEndpoint'
        skill:
          $ref: '#/components/schemas/Skill'
          description: >-
            Skill tool. Points to a folder containing skill subdirectories with
            SKILL.md files. Skills are discovered from the folder at runtime and
            loaded on demand via a read_skill tool.
        supervisor_agent:
          $ref: '#/components/schemas/SupervisorAgentTool'
        table:
          $ref: '#/components/schemas/UcTable'
          description: >-
            Unity Catalog table tool. Replaces the deprecated ``uc_table``
            field.
        tool_id:
          type: string
          description: User specified id of the Tool.
        uc_connection:
          $ref: '#/components/schemas/UcConnection'
        uc_function:
          $ref: '#/components/schemas/UcFunction'
        uc_mcp:
          $ref: '#/components/schemas/UcMcpService'
          description: >-
            UC-registered MCP service tool. The ``name`` field on UcMcpService
            is the three-level UC FQN (catalog.schema.mcp_service); the
            supervisor resolves it at request build time, calls ``tools/list``
            against the AI Gateway mcp-services proxy, and dynamically registers
            every discovered MCP sub-tool as a separately-callable tool.
        uc_table:
          $ref: '#/components/schemas/UcTable'
          description: 'Deprecated: use ``table`` instead.'
        vector_search_index:
          $ref: '#/components/schemas/VectorSearchIndex'
          description: Configuration for a Vector Search index tool.
        volume:
          $ref: '#/components/schemas/Volume'
        web_search:
          $ref: '#/components/schemas/WebSearch'
          description: >-
            Configuration for a public-web search tool. The supervisor collapses
            multiple web_search tools on the same agent into a single registered
            ``web_search`` tool at runtime.
      required:
        - tool_type
    UcConnection:
      type: object
      properties:
        name:
          type: string
      required:
        - name
      description: 'Databricks UC connection. Supported connection: external mcp server.'
    UcFunction:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    UcMcpService:
      type: object
      properties:
        name:
          type: string
          description: >-
            Three-level UC FQN of the registered MCP service
            (catalog.schema.mcp_service).
      required:
        - name
      description: >-
        UC-registered MCP service tool. The ``name`` field is the three-level UC
        FQN of the MCP service
            (``catalog.schema.mcp_service``). At request build time the supervisor calls ``tools/list``
            against the AI Gateway mcp-services proxy and dynamically registers every discovered MCP
            sub-tool as a separately-callable tool. Per-sub-tool config is not stored here — discovery is
            dynamic so newly published MCP functions are picked up without redeploying the agent.
    UcTable:
      type: object
      properties:
        name:
          type: string
          description: >-
            Full UC table name (catalog.schema.table) this tool is authorized to
            access.
      required:
        - name
      description: >-
        Unity Catalog table. One tool represents one authorized table; the
        backend collapses all
            uc_table tools on a supervisor agent into a single subagent that can access the union of their
            tables.
    VectorSearchIndex:
      type: object
      properties:
        name:
          type: string
          description: Full Vector Search index name (catalog.schema.index).
        columns:
          type: array
          items:
            type: string
          description: >-
            Optional columns to return from the index. If unset, discovered from
            index schema at query time.
      required:
        - name
      description: Vector Search index tool authorizing access to a single index.
    Volume:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    WebSearch:
      type: object
      properties: {}
      description: >-
        Public-web search tool. Empty body — backend, model registration, and
        client_id are not
            customer-tunable. The display name and description for this tool come from the parent
            ``Tool.name`` / ``Tool.description`` fields. Reserved for future scoping (allowed domains,
            region overrides).
    SupervisorAgentPermissionLevel:
      type: string
      x-enum:
        - CAN_MANAGE
        - CAN_QUERY
      description: Permission level
