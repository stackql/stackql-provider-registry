        :param parent: str
          Parent resource where this example will be created. Format: supervisor-agents/{supervisor_agent_id}
        :param example: :class:`Example`
          The example to create under the parent Supervisor Agent.

        :returns: :class:`Example`
      parameters:
        - name: supervisor_agent_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `supervisor_agent_id` segment of the `parent` resource name
            (`supervisor-agents/{supervisor_agent_id}`). Parent resource where
            this example will be created. Format:
            supervisor-agents/{supervisor_agent_id}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  description: The example question.
                guidelines:
                  type: array
                  items:
                    type: string
                  description: Guidelines for answering the question.
                example_id:
                  type: string
                  description: The universally unique identifier (UUID) of the example.
                name:
                  type: string
                  description: >-
                    Full resource name:
                    supervisor-agents/{supervisor_agent_id}/examples/{example_id}
              required:
                - question
                - guidelines
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: SupervisorAgentsAPI
    get:
      operationId: supervisor_agents_list_examples
      summary: Lists examples under a Supervisor Agent.
      tags:
        - supervisoragents
        - supervisor_agents
      description: |-
        Lists examples under a Supervisor Agent.

        :param parent: str
          Parent resource to list from. Format: supervisor-agents/{supervisor_agent_id}
        :param page_size: int (optional)
          The maximum number of examples to return. If unspecified, at most 100 examples will be returned. The
          maximum value is 100; values above 100 will be coerced to 100.
        :param page_token: str (optional)
          A page token, received from a previous ``ListExamples`` call. Provide this to retrieve the
          subsequent page. If unspecified, the first page will be returned.

        :returns: Iterator over :class:`Example`
      parameters:
        - name: supervisor_agent_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `supervisor_agent_id` segment of the `parent` resource name
            (`supervisor-agents/{supervisor_agent_id}`). Parent resource to list
            from. Format: supervisor-agents/{supervisor_agent_id}
