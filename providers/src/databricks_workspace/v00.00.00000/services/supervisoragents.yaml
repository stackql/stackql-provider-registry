  /api/2.1/{parent}/tools:
    post:
      operationId: supervisor_agents_create_tool
      summary: >-
        Creates a Tool under a Supervisor Agent. Specify one of "genie_space",
        "knowledge_assistant",
      tags:
        - supervisoragents
        - supervisor_agents
      description: >-
        Creates a Tool under a Supervisor Agent. Specify one of "genie_space",
        "knowledge_assistant",

        "uc_function", "uc_connection", "app", "volume", "dashboard", "table",
        "vector_search_index",

        "catalog", "schema", "supervisor_agent", "databricks_web_search",
        "skill" in the request body. The

        legacy values "lakeview_dashboard", "uc_table", and "web_search" are
        also accepted and remain

        equivalent to "dashboard", "table", and "databricks_web_search"
        respectively. The

        "databricks_web_search" tool_type maps to the ``web_search`` spec field.


        :param parent: str
          Parent resource where this tool will be created. Format: supervisor-agents/{supervisor_agent_id}
        :param tool: :class:`Tool`

        :param tool_id: str
          The ID to use for the tool, which will become the final component of the tool's resource name.

        :returns: :class:`Tool`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            Parent resource where this tool will be created. Format:
            supervisor-agents/{supervisor_agent_id}
        - name: tool_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            The ID to use for the tool, which will become the final component of
            the tool's resource name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tool:
                  type: object
                  properties:
                    tool_type:
                      type: string
                    app:
                      type: object
                      properties:
                        name:
                          type: string
                          description: App name
                      required:
                        - name
                      description: 'Databricks app. Supported app: custom mcp, custom agent.'
                    catalog:
                      type: object
                      properties:
                        name:
                          type: string
                          description: >-
                            Bare UC catalog name this tool is authorized to
                            search (no ``.``).
                      required:
                        - name
                      description: Configuration for a UC catalog asset_search scope tool.
                    dashboard:
                      type: object
                      properties:
                        dashboard_id:
                          type: string
                          description: The unique identifier of the Lakeview dashboard.
                      required:
                        - dashboard_id
                      description: >-
                        Lakeview dashboard tool. Replaces the deprecated
                        ``lakeview_dashboard`` field.
                    description:
                      type: string
                      description: Description of what this tool does (user-facing).
                    genie_space:
                      type: object
                      properties:
                        id:
                          type: string
                        space_id:
                          type: string
                          description: The ID of the genie space.
                      required:
                        - id
                    id:
                      type: string
                      description: 'Deprecated: Use tool_id instead.'
                    knowledge_assistant:
                      type: object
                      properties:
                        knowledge_assistant_id:
                          type: string
                        serving_endpoint_name:
                          type: string
                          description: 'Deprecated: use knowledge_assistant_id instead.'
                      required:
                        - knowledge_assistant_id
                    lakeview_dashboard:
                      type: object
                      properties:
                        dashboard_id:
                          type: string
                          description: The unique identifier of the Lakeview dashboard.
                      required:
                        - dashboard_id
                      description: 'Deprecated: use ``dashboard`` instead.'
                    name:
                      type: string
                      description: >-
                        Full resource name:
                        supervisor-agents/{supervisor_agent_id}/tools/{tool_id}
                    schema:
                      type: object
                      properties:
                        name:
                          type: string
                          description: >-
                            Full UC schema name (catalog.schema) this tool is
                            authorized to search.
                      required:
                        - name
                      description: Configuration for a UC schema asset_search scope tool.
                    serving_endpoint:
                      type: object
                      properties:
                        name:
                          type: string
                      required:
                        - name
                    skill:
                      type: object
                      properties:
                        path:
                          type: string
                          description: >-
                            Absolute WSFS path to a folder containing skill
                            subdirectories. Example:
                            /Workspace/Users/creator@company.com/.assistant/skills
                      required:
                        - path
                      description: >-
                        Skill tool. Points to a folder containing skill
                        subdirectories with SKILL.md files. Skills are
                        discovered from the folder at runtime and loaded on
                        demand via a read_skill tool.
                    supervisor_agent:
                      type: object
                      properties:
                        supervisor_agent_id:
                          type: string
                          description: The ID of the supervisor agent (tile ID).
                      required:
                        - supervisor_agent_id
                      description: Nested Supervisor Agent tool.
                    table:
                      type: object
                      properties:
                        name:
                          type: string
                          description: >-
                            Full UC table name (catalog.schema.table) this tool
                            is authorized to access.
                      required:
                        - name
                      description: >-
                        Unity Catalog table tool. Replaces the deprecated
                        ``uc_table`` field.
                    tool_id:
                      type: string
                      description: User specified id of the Tool.
                    uc_connection:
                      type: object
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      description: >-
                        Databricks UC connection. Supported connection: external
                        mcp server.
                    uc_function:
                      type: object
                      properties:
                        name:
                          type: string
                      required:
                        - name
                    uc_mcp:
                      type: object
                      properties:
                        name:
                          type: string
                          description: >-
                            Three-level UC FQN of the registered MCP service
                            (catalog.schema.mcp_service).
                      required:
                        - name
                      description: >-
                        UC-registered MCP service tool. The ``name`` field on
                        UcMcpService is the three-level UC FQN
                        (catalog.schema.mcp_service); the supervisor resolves it
                        at request build time, calls ``tools/list`` against the
                        AI Gateway mcp-services proxy, and dynamically registers
                        every discovered MCP sub-tool as a separately-callable
                        tool.
                    uc_table:
                      type: object
                      properties:
                        name:
                          type: string
                          description: >-
                            Full UC table name (catalog.schema.table) this tool
                            is authorized to access.
                      required:
                        - name
                      description: 'Deprecated: use ``table`` instead.'
                    vector_search_index:
                      type: object
                      properties:
                        name:
                          type: string
                          description: >-
                            Full Vector Search index name
                            (catalog.schema.index).
                        columns:
                          type: array
                          items:
                            type: string
                          description: >-
                            Optional columns to return from the index. If unset,
                            discovered from index schema at query time.
                      required:
                        - name
                      description: Configuration for a Vector Search index tool.
                    volume:
                      type: object
                      properties:
                        name:
                          type: string
                      required:
                        - name
                    web_search:
                      type: object
                      properties: {}
                      description: >-
                        Configuration for a public-web search tool. The
                        supervisor collapses multiple web_search tools on the
                        same agent into a single registered ``web_search`` tool
                        at runtime.
                  required:
                    - tool_type
              required:
                - tool
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: SupervisorAgentsAPI
    get:
