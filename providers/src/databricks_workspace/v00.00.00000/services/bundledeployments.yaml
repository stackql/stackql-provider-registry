        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_CATALOG
        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_DATABASE
        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_ENDPOINT
        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_PROJECT
        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_ROLE
        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_SYNCED_TABLE
        - DEPLOYMENT_RESOURCE_TYPE_QUALITY_MONITOR
