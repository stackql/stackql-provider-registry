components:
  schemas:
    DashboardMetadata:
      type: object
      properties:
        definition_path:
          type: string
          description: >-
            Path of the file that declares this dashboard, relative to the
            bundle's workspace.file_path (Version.workspace_info.file_path) —
            join the two to get the file's absolute workspace path. For now this
            lives only on the dashboard metadata, and is a single string because
            it was a single string (``relative_path``) in the legacy bundle
            metadata.json. We may generalize it in the future: lifting it to a
            top-level field on Resource/Operation (every resource type has a
            definition location) and converting it to a repeated field, since a
            resource can be declared across multiple files/locations.
        source_path:
          type: string
          description: >-
            Path of the dashboard's source artifact (its ``.lvdash.json``),
            relative to the deployment root.
      description: >-
        Dashboard-specific per-resource metadata. Set only for dashboard
        resources.
    Deployment:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
          description: When the deployment was created.
        created_by:
          type: string
          description: The user who created the deployment (email or principal name).
        deployment_mode:
          $ref: '#/components/schemas/DeploymentMode'
          description: >-
            Bundle target deployment mode (development or production), derived
            from the most recent version's mode.
        destroy_time:
          type: string
          format: date-time
          description: >-
            When deletion was recorded. Unset if deletion has not been recorded.
            This response metadata does not determine the deployment's lifecycle
            status.
        destroyed_by:
          type: string
          description: >-
            The user who destroyed the deployment (email or principal name).
            Unset if the deployment has not been destroyed.
        display_name:
          type: string
          description: >-
            Human-readable name for the deployment, up to 256 characters. Output
            only: clients update it by setting ``display_name`` when creating a
            version.
        git_info:
          $ref: '#/components/schemas/GitInfo'
          description: >-
            Git provenance of the deployment's source, derived from the latest
            version.
        initial_parent_path:
          type: string
          description: >-
            The workspace path of the existing folder where the deployment is
            initially created. Must be absolute and canonical, with single
            separators, no ``.`` or ``..`` segments, and no trailing slash
            unless the path is ``/``. It may contain at most 24 path segments,
            excluding an optional leading ``/Workspace`` segment. The complete
            path may contain up to 1,024 characters, and each segment may
            contain up to 511 characters. This field is input only and is not
            returned in create, get, or list responses.
        last_successful_version_id:
          type: string
          description: >-
            The version_id of the most recent version that completed
            successfully. Unset until a version has completed successfully.
            Unlike last_version_id, it is not advanced when a version fails, so
            it always points at the last known-good deployment state (or is
            unset if there has never been one).
        last_version_id:
          type: string
          description: The version_id of the most recent deployment version.
        name:
          type: string
          description: 'Resource name of the deployment. Format: deployments/{deployment_id}'
        status:
          $ref: '#/components/schemas/DeploymentStatus'
          description: Current status of the deployment.
        target_name:
          type: string
          description: >-
            The bundle target name associated with this deployment. Output only:
            it is denormalized from the latest version, not set directly on the
            deployment.
        update_time:
          type: string
          format: date-time
          description: When the deployment was last updated.
        updated_by:
          type: string
          description: >-
            The user who most recently updated the deployment (email or
            principal name).
        workspace_info:
          $ref: '#/components/schemas/WorkspaceInfo'
          description: >-
            Workspace location of the deployment, derived from the latest
            version.
      description: A bundle deployment registered with the control plane.
    GitInfo:
      type: object
      properties:
        branch:
          type: string
          description: Branch the source was deployed from.
        commit:
          type: string
          description: Commit SHA of the deployed source.
        origin_url:
          type: string
          description: URL of the git remote the source was deployed from.
      description: >-
        Git provenance of a bundle's source, captured at deploy time. Lets
        consumers link a deployed
            resource back to its source in version control.
    HeartbeatResponse:
      type: object
      properties:
        expire_time:
          type: string
          format: date-time
          description: The new lock expiry time after renewal.
      description: Response for Heartbeat.
    ListDeploymentsResponse:
      type: object
      properties:
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
          description: The deployments from the queried workspace.
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as ``page_token`` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
      description: Response for ListDeployments.
    ListOperationsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as ``page_token`` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
          description: The resource operations under the specified version.
      description: Response for ListOperations.
    ListResourcesResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as ``page_token`` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
          description: The resources under the specified deployment.
      description: Response for ListResources.
    ListVersionsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as ``page_token`` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/Version'
          description: The versions under the specified deployment.
      description: Response for ListVersions.
    Operation:
      type: object
      properties:
        action_type:
          $ref: '#/components/schemas/OperationActionType'
          description: The type of operation performed on this resource.
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: >-
            Whether the operation succeeded or failed. Mutable: may be updated
            after creation via UpdateOperation, e.g. when an operation recorded
            as failed is retried and eventually succeeds. A succeeded operation
            cannot carry an ``error_message``.
        create_time:
          type: string
          format: date-time
          description: When the operation was recorded.
        dashboard_metadata:
          $ref: '#/components/schemas/DashboardMetadata'
          description: Dashboard-specific metadata; set only for dashboard resources.
        error_message:
          type: string
          description: >-
            Error message if the operation failed. Set when status is
            OPERATION_STATUS_FAILED. Captures the error encountered while
            applying the resource to the workspace. Mutable: may be updated
            after creation via UpdateOperation; setting it to an empty string
            clears it. After an update is applied, an operation whose status is
            OPERATION_STATUS_SUCCEEDED cannot carry an error_message.
        name:
          type: string
          description: >-
            Resource name of the operation. Format:
            deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}
        resource_id:
          type: string
          description: >-
            ID of the actual resource in the workspace (e.g. the job ID,
            pipeline ID). Optional at creation: CREATE and RECREATE operations
            produce a new resource whose ID is not yet known when the operation
            is recorded. Mutable: may be filled in (or corrected) later via
            UpdateOperation once the ID is known.
        resource_key:
          type: string
          description: >-
            Resource identifier within the bundle (e.g. "jobs.foo",
            "pipelines.bar", "jobs.foo.permissions", "files.<rel-path>"). Can be
            an arbitrary UTF-8 encoded string key. This key links the operation
            to the corresponding deployment-level Resource.
        resource_type:
          $ref: '#/components/schemas/DeploymentResourceType'
          description: >-
            The type of the deployment resource this operation applies to.
            Derived from the ``resource_key`` prefix (e.g. "jobs" → JOB); the
            caller does not set this field.
        sequence_id:
          type: integer
          description: >-
            Monotonically increasing revision used for optimistic concurrency
            control (the AIP-154 concurrency token for this resource, realized
            as a sequence number rather than an opaque etag). The server assigns
            1 on creation and increments it on every successful UpdateOperation.
            It is OPTIONAL rather than OUTPUT_ONLY because it is dual-purpose:
            CreateOperation/GetOperation return the current value, and
            UpdateOperation reads the caller-supplied value as a precondition.
            The caller must echo the value it last observed; if it no longer
            matches the server's value, the update is rejected with ABORTED so
            the caller can re-read and retry. Ignored on CreateOperation.
        state:
          type: object
          description: >-
            Serialized local config state after the operation. Should be unset
            for delete operations. Mutable: may be updated after creation via
            UpdateOperation. When updating, the caller must echo the
            last-observed ``sequence_id`` as a concurrency precondition.
        update_time:
          type: string
          format: date-time
          description: >-
            When the operation was last updated. Set to ``create_time`` when the
            operation is created and to the server timestamp on each successful
            UpdateOperation.
      required:
        - action_type
        - status
      description: >-
        An operation on a single resource performed during a version. Operations
        record the result of
            applying a resource change to the workspace. Most fields are immutable once recorded; ``state``,
            ``error_message``, ``resource_id``, and ``status`` may be updated afterwards (via
            UpdateOperation), guarded by ``sequence_id`` for optimistic concurrency control.
    Resource:
      type: object
      properties:
        resource_type:
          $ref: '#/components/schemas/DeploymentResourceType'
          description: The type of the deployment resource.
        dashboard_metadata:
          $ref: '#/components/schemas/DashboardMetadata'
          description: Dashboard-specific metadata; set only for dashboard resources.
        last_action_type:
          $ref: '#/components/schemas/OperationActionType'
          description: The action performed on this resource during the last version.
        last_version_id:
          type: string
          description: The version_id of the last version where this resource was updated.
        name:
          type: string
          description: >-
            Resource name. Format:
            deployments/{deployment_id}/resources/{resource_key}
        resource_id:
          type: string
          description: >-
            ID that references the actual resource in the workspace (e.g. the
            job ID, pipeline ID).
        resource_key:
          type: string
          description: >-
            Resource identifier within the bundle (e.g. "jobs.foo",
            "pipelines.bar", "jobs.foo.permissions").
        state:
          type: object
          description: Serialized local config state (what the CLI deployed).
        update_time:
          type: string
          format: date-time
          description: >-
            When the last operation that updated this resource's recorded state
            was applied. Pairs with last_action_type and last_version_id (all
            three advance together on that write).
      required:
        - resource_type
      description: >-
        A resource managed by a deployment. Resources are implicitly created,
        updated, or deleted when
            operations are recorded on a version.
    Version:
      type: object
      properties:
        cli_version:
          type: string
          description: CLI version used to initiate the version.
        version_type:
          $ref: '#/components/schemas/VersionType'
          description: Type of version (deploy or destroy).
        complete_time:
          type: string
          format: date-time
          description: When the version completed. Unset while the version is in progress.
        completed_by:
          type: string
          description: >-
            The user who completed the version (email or principal name). May
            differ from ``created_by`` when another user force-completes the
            version.
        completion_reason:
          $ref: '#/components/schemas/VersionComplete'
          description: >-
            Why the version was completed. Unset while in progress. Set when
            status transitions to COMPLETED.
        create_time:
          type: string
          format: date-time
          description: When the version was created.
        created_by:
          type: string
          description: The user who created the version (email or principal name).
        deployment_mode:
          $ref: '#/components/schemas/DeploymentMode'
          description: >-
            Bundle target deployment mode (development or production), captured
            at the time of this version.
        display_name:
          type: string
          description: >-
            Display name for the deployment, captured at the time of this
            version. Up to 256 characters. When present, creating the version
            updates the deployment display name. An empty value clears it; an
            absent value leaves the current deployment display name unchanged.
        git_info:
          $ref: '#/components/schemas/GitInfo'
          description: Git provenance of the source, captured at the time of this version.
        name:
          type: string
          description: >-
            Resource name of the version. Format:
            deployments/{deployment_id}/versions/{version_id}
        previous_version_id:
          type: string
          description: >-
            The version_id this version was created on top of — the deployment's
            most recent version at creation time. Leave unset when creating the
            first version (the deployment has no prior versions). Set by the
            client on creation and immutable thereafter. Acts as an
            optimistic-concurrency precondition: the server requires it to equal
            the deployment's current most-recent version (and to be unset when
            the deployment has no versions) and returns
            ``INVALID_PARAMETER_VALUE`` on mismatch, so a deploy racing against
            a concurrent deploy is rejected rather than silently overwriting it.
        status:
          $ref: '#/components/schemas/VersionStatus'
          description: 'Status of the version: IN_PROGRESS or COMPLETED.'
        target_name:
          type: string
          description: Target name of the deployment, captured at the time of this version.
        version_id:
          type: string
          description: >-
            Version identifier within the parent deployment, assigned by the
            client on creation. A numeric string (base-10, fits in a signed
            64-bit integer) that is greater than or equal to 1. Version IDs are
            strictly increasing within a deployment but are not required to
            start at 1 or to be contiguous.
        workspace_info:
          $ref: '#/components/schemas/WorkspaceInfo'
          description: >-
            Workspace location of the deployment, captured at the time of this
            version.
      required:
        - cli_version
        - version_type
      description: >-
        A single invocation of a deploy or destroy command against a deployment.
        Creating a version
            acquires an exclusive lock on the parent deployment.
    WorkspaceInfo:
      type: object
      properties:
        bundle_root_path:
          type: string
          description: >-
            Path of the bundle root (the directory containing databricks.yml)
            relative to git_folder_path. Empty when the deployment is not from a
            Databricks Git folder.
        file_path:
          type: string
          description: >-
            Absolute workspace path where the deployed bundle files live.
            Mirrors the workspace.file_path field in DABs bundle config.
        git_folder_path:
          type: string
          description: >-
            When deployed from a Databricks Git folder, the absolute workspace
            path of that folder; empty for local deploys.
        root_path:
          type: string
          description: >-
            Absolute workspace path of the deployment root — the base path the
            deployed files live under. Mirrors workspace.root_path in the DABs
            bundle config; file_path is its files subdirectory.
        source_linked:
          type: boolean
          description: >-
            Whether files are served directly from the source sync root instead
            of being copied into file_path.
      description: Workspace location of a bundle deployment, captured at deploy time.
    DeploymentMode:
      type: string
      x-enum:
        - DEPLOYMENT_MODE_DEVELOPMENT
        - DEPLOYMENT_MODE_PRODUCTION
      description: >-
        Bundle target deployment mode. Mirrors the ``mode`` field on a bundle
        target in

        ``databricks.yml`` (see
        https://docs.databricks.com/dev-tools/bundles/deployment-modes).
    DeploymentResourceType:
      type: string
      x-enum:
        - DEPLOYMENT_RESOURCE_TYPE_ALERT
        - DEPLOYMENT_RESOURCE_TYPE_APP
        - DEPLOYMENT_RESOURCE_TYPE_CATALOG
        - DEPLOYMENT_RESOURCE_TYPE_CLUSTER
        - DEPLOYMENT_RESOURCE_TYPE_DASHBOARD
        - DEPLOYMENT_RESOURCE_TYPE_DATABASE_CATALOG
        - DEPLOYMENT_RESOURCE_TYPE_DATABASE_INSTANCE
        - DEPLOYMENT_RESOURCE_TYPE_EXPERIMENT
        - DEPLOYMENT_RESOURCE_TYPE_EXTERNAL_LOCATION
        - DEPLOYMENT_RESOURCE_TYPE_JOB
        - DEPLOYMENT_RESOURCE_TYPE_MODEL
        - DEPLOYMENT_RESOURCE_TYPE_MODEL_SERVING_ENDPOINT
        - DEPLOYMENT_RESOURCE_TYPE_PIPELINE
        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_BRANCH
        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_ENDPOINT
        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_PROJECT
        - DEPLOYMENT_RESOURCE_TYPE_QUALITY_MONITOR
        - DEPLOYMENT_RESOURCE_TYPE_REGISTERED_MODEL
        - DEPLOYMENT_RESOURCE_TYPE_SCHEMA
        - DEPLOYMENT_RESOURCE_TYPE_SECRET_SCOPE
        - DEPLOYMENT_RESOURCE_TYPE_SQL_WAREHOUSE
        - DEPLOYMENT_RESOURCE_TYPE_SYNCED_DATABASE_TABLE
        - DEPLOYMENT_RESOURCE_TYPE_VOLUME
      description: Type of a deployment resource.
    DeploymentStatus:
      type: string
      x-enum:
        - DEPLOYMENT_STATUS_ACTIVE
        - DEPLOYMENT_STATUS_DELETED
        - DEPLOYMENT_STATUS_FAILED
        - DEPLOYMENT_STATUS_IN_PROGRESS
      description: Status of a deployment.
    OperationActionType:
      type: string
      x-enum:
        - OPERATION_ACTION_TYPE_BIND
        - OPERATION_ACTION_TYPE_BIND_AND_UPDATE
        - OPERATION_ACTION_TYPE_CREATE
        - OPERATION_ACTION_TYPE_DELETE
        - OPERATION_ACTION_TYPE_INITIAL_REGISTER
        - OPERATION_ACTION_TYPE_RECREATE
        - OPERATION_ACTION_TYPE_RESIZE
        - OPERATION_ACTION_TYPE_UPDATE
        - OPERATION_ACTION_TYPE_UPDATE_WITH_ID
      description: Type of action performed on a resource during a deployment.
    OperationStatus:
      type: string
      x-enum:
        - OPERATION_STATUS_FAILED
        - OPERATION_STATUS_SUCCEEDED
      description: Status of a resource operation.
    VersionComplete:
      type: string
      x-enum:
        - VERSION_COMPLETE_FAILURE
        - VERSION_COMPLETE_FORCE_ABORT
        - VERSION_COMPLETE_LEASE_EXPIRED
        - VERSION_COMPLETE_SUCCESS
      description: Reason why a version was completed.
    VersionStatus:
      type: string
      x-enum:
        - VERSION_STATUS_COMPLETED
        - VERSION_STATUS_IN_PROGRESS
      description: Status of a version.
    VersionType:
      type: string
      x-enum:
        - VERSION_TYPE_DEPLOY
        - VERSION_TYPE_DESTROY
      description: Type of version.
