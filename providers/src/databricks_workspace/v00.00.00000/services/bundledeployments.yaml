openapi: 3.0.0
info:
  title: Databricks Bundledeployments API (workspace)
  description: >-
    OpenAPI specification for the Databricks bundledeployments service
    (workspace-level APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-07-31'
  x-stackql-sdk-namespace: databricks.sdk.service.bundledeployments
servers:
  - url: https://{deployment_name}.cloud.databricks.com
    variables:
      deployment_name:
        description: The Databricks Workspace Deployment Name
        default: dbc-abcd0123-a1bc
paths:
  /api/2.0/bundle/{name}/complete:
    post:
      operationId: bundle_deployments_complete_version
      summary: Marks a version as complete and releases the deployment lock.
      tags:
        - bundledeployments
        - bundle_deployments
      description: |-
        Marks a version as complete and releases the deployment lock.

        The server atomically:

        1. Sets the version status to the provided terminal status.
        2. Sets ``complete_time`` to the current server timestamp.
        3. Releases the lock on the parent deployment.
        4. Updates the parent deployment's ``status`` and ``last_version_id``.

        :param name: str
          The name of the version to complete. Format: deployments/{deployment_id}/versions/{version_id}
        :param completion_reason: :class:`VersionComplete`
          The reason for completing the version. Must be a terminal reason: VERSION_COMPLETE_SUCCESS,
          VERSION_COMPLETE_FAILURE, or VERSION_COMPLETE_FORCE_ABORT.
        :param force: bool (optional)
          If true, force-completes the version even if the caller is not the original creator. The
          completion_reason must be VERSION_COMPLETE_FORCE_ABORT when force is true.

        :returns: :class:`Version`
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: >-
            The name of the version to complete. Format:
            deployments/{deployment_id}/versions/{version_id}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                completion_reason:
                  type: string
                  x-enum:
                    - VERSION_COMPLETE_FAILURE
                    - VERSION_COMPLETE_FORCE_ABORT
                    - VERSION_COMPLETE_LEASE_EXPIRED
                    - VERSION_COMPLETE_SUCCESS
                  description: >-
                    The reason for completing the version. Must be a terminal
                    reason: VERSION_COMPLETE_SUCCESS, VERSION_COMPLETE_FAILURE,
                    or VERSION_COMPLETE_FORCE_ABORT.
                force:
                  type: boolean
                  description: >-
                    If true, force-completes the version even if the caller is
                    not the original creator. The completion_reason must be
                    VERSION_COMPLETE_FORCE_ABORT when force is true.
              required:
                - completion_reason
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
  /api/2.0/bundle/deployments:
    post:
      operationId: bundle_deployments_create_deployment
      summary: Creates a new deployment in the workspace.
      tags:
        - bundledeployments
        - bundle_deployments
      description: |-
        Creates a new deployment in the workspace.

        :param deployment: :class:`Deployment`
          The deployment to create. The caller must set ``initial_parent_path``. Other fields are ignored on
          input and populated by the service.

        :returns: :class:`Deployment`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deployment:
                  type: object
                  properties:
                    create_time:
                      type: string
                      format: date-time
                      description: When the deployment was created.
                    created_by:
                      type: string
                      description: >-
                        The user who created the deployment (email or principal
                        name).
                    deployment_mode:
                      type: string
                      x-enum:
                        - DEPLOYMENT_MODE_DEVELOPMENT
                        - DEPLOYMENT_MODE_PRODUCTION
                      description: >-
                        Bundle target deployment mode (development or
                        production), derived from the most recent version's
                        mode.
                    destroy_time:
                      type: string
                      format: date-time
                      description: >-
                        When deletion was recorded. Unset if deletion has not
                        been recorded. This response metadata does not determine
                        the deployment's lifecycle status.
                    destroyed_by:
                      type: string
                      description: >-
                        The user who destroyed the deployment (email or
                        principal name). Unset if the deployment has not been
                        destroyed.
                    display_name:
                      type: string
                      description: >-
                        Human-readable name for the deployment, up to 256
                        characters. Output only: clients update it by setting
                        ``display_name`` when creating a version.
                    git_info:
                      type: object
                      properties:
                        branch:
                          type: string
                          description: Branch the source was deployed from.
                        commit:
                          type: string
                          description: Commit SHA of the deployed source.
                        origin_url:
                          type: string
                          description: URL of the git remote the source was deployed from.
                      description: >-
                        Git provenance of the deployment's source, derived from
                        the latest version.
                    initial_parent_path:
                      type: string
                      description: >-
                        The workspace path of the existing folder where the
                        deployment is initially created. Must be absolute and
                        canonical, with single separators, no ``.`` or ``..``
                        segments, and no trailing slash unless the path is
                        ``/``. It may contain at most 24 path segments,
                        excluding an optional leading ``/Workspace`` segment.
                        The complete path may contain up to 1,024 characters,
                        and each segment may contain up to 511 characters. This
                        field is input only and is not returned in create, get,
                        or list responses.
                    last_successful_version_id:
                      type: string
                      description: >-
                        The version_id of the most recent version that completed
                        successfully. Unset until a version has completed
                        successfully. Unlike last_version_id, it is not advanced
                        when a version fails, so it always points at the last
                        known-good deployment state (or is unset if there has
                        never been one).
                    last_version_id:
                      type: string
                      description: The version_id of the most recent deployment version.
                    name:
                      type: string
                      description: >-
                        Resource name of the deployment. Format:
                        deployments/{deployment_id}
                    status:
                      type: string
                      x-enum:
                        - DEPLOYMENT_STATUS_ACTIVE
                        - DEPLOYMENT_STATUS_DELETED
                        - DEPLOYMENT_STATUS_FAILED
                        - DEPLOYMENT_STATUS_IN_PROGRESS
                      description: Current status of the deployment.
                    target_name:
                      type: string
                      description: >-
                        The bundle target name associated with this deployment.
                        Output only: it is denormalized from the latest version,
                        not set directly on the deployment.
                    update_time:
                      type: string
                      format: date-time
                      description: When the deployment was last updated.
                    updated_by:
                      type: string
                      description: >-
                        The user who most recently updated the deployment (email
                        or principal name).
                    workspace_info:
                      type: object
                      properties:
                        bundle_root_path:
                          type: string
                          description: >-
                            Path of the bundle root (the directory containing
                            databricks.yml) relative to git_folder_path. Empty
                            when the deployment is not from a Databricks Git
                            folder.
                        file_path:
                          type: string
                          description: >-
                            Absolute workspace path where the deployed bundle
                            files live. Mirrors the workspace.file_path field in
                            DABs bundle config.
                        git_folder_path:
                          type: string
                          description: >-
                            When deployed from a Databricks Git folder, the
                            absolute workspace path of that folder; empty for
                            local deploys.
                        root_path:
                          type: string
                          description: >-
                            Absolute workspace path of the deployment root — the
                            base path the deployed files live under. Mirrors
                            workspace.root_path in the DABs bundle config;
                            file_path is its files subdirectory.
                        source_linked:
                          type: boolean
                          description: >-
                            Whether files are served directly from the source
                            sync root instead of being copied into file_path.
                      description: >-
                        Workspace location of the deployment, derived from the
                        latest version.
                  description: >-
                    The deployment to create. The caller must set
                    ``initial_parent_path``. Other fields are ignored on input
                    and populated by the service.
              required:
                - deployment
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
    get:
      operationId: bundle_deployments_list_deployments
      summary: Lists deployments in the workspace.
      tags:
        - bundledeployments
        - bundle_deployments
      description: |-
        Lists deployments in the workspace.

        :param filter: str (optional)
          A filter expression restricting which deployments are returned, in the style of AIP-160
          (https://google.aip.dev/160). The expression is a conjunction of one or more ``field operator
          value`` terms joined by ``AND`` (case-insensitive); a deployment is returned only when it matches
          every term. Whitespace around terms is ignored, and a value containing spaces must be wrapped in
          double quotes. An unset or empty filter returns all deployments. Filtering applies only to live
          deployments; deleted deployments are never returned regardless of the filter.

          Supported terms:

          - ``status = <STATUS>``: exact match on the deployment status. The value is a ``DeploymentStatus``
            enum value, with or without the ``DEPLOYMENT_STATUS_`` prefix and case-insensitive (e.g. ``status
            = ACTIVE``).
          - ``deployment_mode = <MODE>``: exact match on the deployment mode. The value is a
            ``DeploymentMode`` enum value, with or without the ``DEPLOYMENT_MODE_`` prefix and
            case-insensitive (e.g. ``deployment_mode = DEVELOPMENT``).
          - ``display_name = "<name>"``: exact match on the display name.
          - ``display_name : "<substring>"``: case-insensitive substring match on the display name.

          For example: ``status = ACTIVE AND display_name : "etl"``.
        :param page_size: int (optional)
          The maximum number of deployments to return. The service may return fewer than this value. If
          unspecified, at most 20 deployments will be returned. The maximum value is 100; values above 100
          will be coerced to 100.
        :param page_token: str (optional)
          A page token, received from a previous ``ListDeployments`` call. Provide this to retrieve the
          subsequent page.

        :returns: Iterator over :class:`Deployment`
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: >-
            A filter expression restricting which deployments are returned, in
            the style of AIP-160 (https://google.aip.dev/160). The expression is
            a conjunction of one or more ``field operator value`` terms joined
            by ``AND`` (case-insensitive); a deployment is returned only when it
            matches every term. Whitespace around terms is ignored, and a value
            containing spaces must be wrapped in double quotes. An unset or
            empty filter returns all deployments. Filtering applies only to live
            deployments; deleted deployments are never returned regardless of
            the filter. Supported terms: - ``status = <STATUS>``: exact match on
            the deployment status. The value is a ``DeploymentStatus`` enum
            value, with or without the ``DEPLOYMENT_STATUS_`` prefix and
            case-insensitive (e.g. ``status = ACTIVE``). - ``deployment_mode =
            <MODE>``: exact match on the deployment mode. The value is a
            ``DeploymentMode`` enum value, with or without the
            ``DEPLOYMENT_MODE_`` prefix and case-insensitive (e.g.
            ``deployment_mode = DEVELOPMENT``). - ``display_name = "<name>"``:
            exact match on the display name. - ``display_name : "<substring>"``:
            case-insensitive substring match on the display name. For example:
            ``status = ACTIVE AND display_name : "etl"``.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of deployments to return. The service may return
            fewer than this value. If unspecified, at most 20 deployments will
            be returned. The maximum value is 100; values above 100 will be
            coerced to 100.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ``ListDeployments`` call.
            Provide this to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeploymentsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
  /api/2.0/bundle/{parent}/operations:
    post:
      operationId: bundle_deployments_create_operation
      summary: Creates a resource operation under a version.
      tags:
        - bundledeployments
        - bundle_deployments
      description: >-
        Creates a resource operation under a version.


        The caller must provide a ``resource_key`` which becomes the final
        component of the operation's name.

        If an operation with the same key already exists under the version, the
        server returns

        ``ALREADY_EXISTS``.


        On success the server also updates the corresponding deployment-level
        Resource (creating it if this is

        the first operation for that resource_key, or removing it if action_type
        is DELETE).


        :param parent: str
          The parent version where this operation will be recorded. Format:
          deployments/{deployment_id}/versions/{version_id}
        :param operation: :class:`Operation`
          The resource operation to create.
        :param resource_key: str
          The key identifying the resource this operation applies to. Becomes the final component of the
          operation's name.

        :returns: :class:`Operation`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            The parent version where this operation will be recorded. Format:
            deployments/{deployment_id}/versions/{version_id}
        - name: resource_key
          in: query
          required: true
          schema:
            type: string
          description: >-
            The key identifying the resource this operation applies to. Becomes
            the final component of the operation's name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: object
                  properties:
                    action_type:
                      type: string
                      x-enum:
                        - OPERATION_ACTION_TYPE_BIND
                        - OPERATION_ACTION_TYPE_BIND_AND_UPDATE
                        - OPERATION_ACTION_TYPE_CREATE
                        - OPERATION_ACTION_TYPE_DELETE
                        - OPERATION_ACTION_TYPE_INITIAL_REGISTER
                        - OPERATION_ACTION_TYPE_RECREATE
                        - OPERATION_ACTION_TYPE_RESIZE
                        - OPERATION_ACTION_TYPE_UPDATE
                        - OPERATION_ACTION_TYPE_UPDATE_WITH_ID
                      description: The type of operation performed on this resource.
                    status:
                      type: string
                      x-enum:
                        - OPERATION_STATUS_FAILED
                        - OPERATION_STATUS_SUCCEEDED
                      description: >-
                        Whether the operation succeeded or failed. Mutable: may
                        be updated after creation via UpdateOperation, e.g. when
                        an operation recorded as failed is retried and
                        eventually succeeds. A succeeded operation cannot carry
                        an ``error_message``.
                    create_time:
                      type: string
                      format: date-time
                      description: When the operation was recorded.
                    dashboard_metadata:
                      type: object
                      properties:
                        definition_path:
                          type: string
                          description: >-
                            Path of the file that declares this dashboard,
                            relative to the bundle's workspace.file_path
                            (Version.workspace_info.file_path) — join the two to
                            get the file's absolute workspace path. For now this
                            lives only on the dashboard metadata, and is a
                            single string because it was a single string
                            (``relative_path``) in the legacy bundle
                            metadata.json. We may generalize it in the future:
                            lifting it to a top-level field on
                            Resource/Operation (every resource type has a
                            definition location) and converting it to a repeated
                            field, since a resource can be declared across
                            multiple files/locations.
                        source_path:
                          type: string
                          description: >-
                            Path of the dashboard's source artifact (its
                            ``.lvdash.json``), relative to the deployment root.
                      description: >-
                        Dashboard-specific metadata; set only for dashboard
                        resources.
                    error_message:
                      type: string
                      description: >-
                        Error message if the operation failed. Set when status
                        is OPERATION_STATUS_FAILED. Captures the error
                        encountered while applying the resource to the
                        workspace. Mutable: may be updated after creation via
                        UpdateOperation; setting it to an empty string clears
                        it. After an update is applied, an operation whose
                        status is OPERATION_STATUS_SUCCEEDED cannot carry an
                        error_message.
                    name:
                      type: string
                      description: >-
                        Resource name of the operation. Format:
                        deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}
                    resource_id:
                      type: string
                      description: >-
                        ID of the actual resource in the workspace (e.g. the job
                        ID, pipeline ID). Optional at creation: CREATE and
                        RECREATE operations produce a new resource whose ID is
                        not yet known when the operation is recorded. Mutable:
                        may be filled in (or corrected) later via
                        UpdateOperation once the ID is known.
                    resource_key:
                      type: string
                      description: >-
                        Resource identifier within the bundle (e.g. "jobs.foo",
                        "pipelines.bar", "jobs.foo.permissions",
                        "files.<rel-path>"). Can be an arbitrary UTF-8 encoded
                        string key. This key links the operation to the
                        corresponding deployment-level Resource.
                    resource_type:
                      type: string
                      x-enum:
                        - DEPLOYMENT_RESOURCE_TYPE_ALERT
                        - DEPLOYMENT_RESOURCE_TYPE_APP
                        - DEPLOYMENT_RESOURCE_TYPE_CATALOG
                        - DEPLOYMENT_RESOURCE_TYPE_CLUSTER
                        - DEPLOYMENT_RESOURCE_TYPE_DASHBOARD
                        - DEPLOYMENT_RESOURCE_TYPE_DATABASE_CATALOG
                        - DEPLOYMENT_RESOURCE_TYPE_DATABASE_INSTANCE
                        - DEPLOYMENT_RESOURCE_TYPE_EXPERIMENT
                        - DEPLOYMENT_RESOURCE_TYPE_EXTERNAL_LOCATION
                        - DEPLOYMENT_RESOURCE_TYPE_JOB
                        - DEPLOYMENT_RESOURCE_TYPE_MODEL
                        - DEPLOYMENT_RESOURCE_TYPE_MODEL_SERVING_ENDPOINT
                        - DEPLOYMENT_RESOURCE_TYPE_PIPELINE
                        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_BRANCH
                        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_ENDPOINT
                        - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_PROJECT
                        - DEPLOYMENT_RESOURCE_TYPE_QUALITY_MONITOR
                        - DEPLOYMENT_RESOURCE_TYPE_REGISTERED_MODEL
                        - DEPLOYMENT_RESOURCE_TYPE_SCHEMA
                        - DEPLOYMENT_RESOURCE_TYPE_SECRET_SCOPE
                        - DEPLOYMENT_RESOURCE_TYPE_SQL_WAREHOUSE
                        - DEPLOYMENT_RESOURCE_TYPE_SYNCED_DATABASE_TABLE
                        - DEPLOYMENT_RESOURCE_TYPE_VOLUME
                      description: >-
                        The type of the deployment resource this operation
                        applies to. Derived from the ``resource_key`` prefix
                        (e.g. "jobs" → JOB); the caller does not set this field.
                    sequence_id:
                      type: integer
                      description: >-
                        Monotonically increasing revision used for optimistic
                        concurrency control (the AIP-154 concurrency token for
                        this resource, realized as a sequence number rather than
                        an opaque etag). The server assigns 1 on creation and
                        increments it on every successful UpdateOperation. It is
                        OPTIONAL rather than OUTPUT_ONLY because it is
                        dual-purpose: CreateOperation/GetOperation return the
                        current value, and UpdateOperation reads the
                        caller-supplied value as a precondition. The caller must
                        echo the value it last observed; if it no longer matches
                        the server's value, the update is rejected with ABORTED
                        so the caller can re-read and retry. Ignored on
                        CreateOperation.
                    state:
                      type: object
                      description: >-
                        Serialized local config state after the operation.
                        Should be unset for delete operations. Mutable: may be
                        updated after creation via UpdateOperation. When
                        updating, the caller must echo the last-observed
                        ``sequence_id`` as a concurrency precondition.
                    update_time:
                      type: string
                      format: date-time
                      description: >-
                        When the operation was last updated. Set to
                        ``create_time`` when the operation is created and to the
                        server timestamp on each successful UpdateOperation.
                  required:
                    - action_type
                    - status
                  description: The resource operation to create.
              required:
                - operation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
    get:
      operationId: bundle_deployments_list_operations
      summary: Lists resource operations under a version.
      tags:
        - bundledeployments
        - bundle_deployments
      description: |-
        Lists resource operations under a version.

        :param parent: str
          The parent version. Format: deployments/{deployment_id}/versions/{version_id}
        :param page_size: int (optional)
          The maximum number of operations to return. The service may return fewer than this value. If
          unspecified, at most 50 operations will be returned. The maximum value is 1000; values above 1000
          will be coerced to 1000.
        :param page_token: str (optional)
          A page token, received from a previous ``ListOperations`` call. Provide this to retrieve the
          subsequent page.

        :returns: Iterator over :class:`Operation`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            The parent version. Format:
            deployments/{deployment_id}/versions/{version_id}
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of operations to return. The service may return
            fewer than this value. If unspecified, at most 50 operations will be
            returned. The maximum value is 1000; values above 1000 will be
            coerced to 1000.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ``ListOperations`` call.
            Provide this to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOperationsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
  /api/2.0/bundle/{parent}/versions:
    post:
      operationId: bundle_deployments_create_version
      summary: Creates a new version under a deployment.
      tags:
        - bundledeployments
        - bundle_deployments
      description: >-
        Creates a new version under a deployment.


        Creating a version acquires an exclusive lock on the deployment,
        preventing concurrent deploys. The

        caller provides a ``version_id``, a numeric string that must be
        numerically greater than the

        deployment's most recent version, and sets the version's
        ``previous_version_id`` to the deployment's

        most recent version (leaving it unset for the first version), which the
        server validates to detect

        concurrent deploys.


        :param parent: str
          The parent deployment where this version will be created. Format: deployments/{deployment_id}
        :param version: :class:`Version`
          The version to create.
        :param version_id: str
          The ID to use for the version, which becomes the final component of the version's resource name. A
          numeric string (base-10, fits in a signed 64-bit integer) chosen by the caller; must be greater than
          or equal to 1. Must be numerically greater than the deployment's most recent version (see
          ``version.previous_version_id``); it does not need to start at 1 or increase by exactly 1. If the
          value is not numerically greater, the server returns ``INVALID_PARAMETER_VALUE``.

        :returns: :class:`Version`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            The parent deployment where this version will be created. Format:
            deployments/{deployment_id}
        - name: version_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            The ID to use for the version, which becomes the final component of
            the version's resource name. A numeric string (base-10, fits in a
            signed 64-bit integer) chosen by the caller; must be greater than or
            equal to 1. Must be numerically greater than the deployment's most
            recent version (see ``version.previous_version_id``); it does not
            need to start at 1 or increase by exactly 1. If the value is not
            numerically greater, the server returns ``INVALID_PARAMETER_VALUE``.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: object
                  properties:
                    cli_version:
                      type: string
                      description: CLI version used to initiate the version.
                    version_type:
                      type: string
                      x-enum:
                        - VERSION_TYPE_DEPLOY
                        - VERSION_TYPE_DESTROY
                      description: Type of version (deploy or destroy).
                    complete_time:
                      type: string
                      format: date-time
                      description: >-
                        When the version completed. Unset while the version is
                        in progress.
                    completed_by:
                      type: string
                      description: >-
                        The user who completed the version (email or principal
                        name). May differ from ``created_by`` when another user
                        force-completes the version.
                    completion_reason:
                      type: string
                      x-enum:
                        - VERSION_COMPLETE_FAILURE
                        - VERSION_COMPLETE_FORCE_ABORT
                        - VERSION_COMPLETE_LEASE_EXPIRED
                        - VERSION_COMPLETE_SUCCESS
                      description: >-
                        Why the version was completed. Unset while in progress.
                        Set when status transitions to COMPLETED.
                    create_time:
                      type: string
                      format: date-time
                      description: When the version was created.
                    created_by:
                      type: string
                      description: >-
                        The user who created the version (email or principal
                        name).
                    deployment_mode:
                      type: string
                      x-enum:
                        - DEPLOYMENT_MODE_DEVELOPMENT
                        - DEPLOYMENT_MODE_PRODUCTION
                      description: >-
                        Bundle target deployment mode (development or
                        production), captured at the time of this version.
                    display_name:
                      type: string
                      description: >-
                        Display name for the deployment, captured at the time of
                        this version. Up to 256 characters. When present,
                        creating the version updates the deployment display
                        name. An empty value clears it; an absent value leaves
                        the current deployment display name unchanged.
                    git_info:
                      type: object
                      properties:
                        branch:
                          type: string
                          description: Branch the source was deployed from.
                        commit:
                          type: string
                          description: Commit SHA of the deployed source.
                        origin_url:
                          type: string
                          description: URL of the git remote the source was deployed from.
                      description: >-
                        Git provenance of the source, captured at the time of
                        this version.
                    name:
                      type: string
                      description: >-
                        Resource name of the version. Format:
                        deployments/{deployment_id}/versions/{version_id}
                    previous_version_id:
                      type: string
                      description: >-
                        The version_id this version was created on top of — the
                        deployment's most recent version at creation time. Leave
                        unset when creating the first version (the deployment
                        has no prior versions). Set by the client on creation
                        and immutable thereafter. Acts as an
                        optimistic-concurrency precondition: the server requires
                        it to equal the deployment's current most-recent version
                        (and to be unset when the deployment has no versions)
                        and returns ``INVALID_PARAMETER_VALUE`` on mismatch, so
                        a deploy racing against a concurrent deploy is rejected
                        rather than silently overwriting it.
                    status:
                      type: string
                      x-enum:
                        - VERSION_STATUS_COMPLETED
                        - VERSION_STATUS_IN_PROGRESS
                      description: 'Status of the version: IN_PROGRESS or COMPLETED.'
                    target_name:
                      type: string
                      description: >-
                        Target name of the deployment, captured at the time of
                        this version.
                    version_id:
                      type: string
                      description: >-
                        Version identifier within the parent deployment,
                        assigned by the client on creation. A numeric string
                        (base-10, fits in a signed 64-bit integer) that is
                        greater than or equal to 1. Version IDs are strictly
                        increasing within a deployment but are not required to
                        start at 1 or to be contiguous.
                    workspace_info:
                      type: object
                      properties:
                        bundle_root_path:
                          type: string
                          description: >-
                            Path of the bundle root (the directory containing
                            databricks.yml) relative to git_folder_path. Empty
                            when the deployment is not from a Databricks Git
                            folder.
                        file_path:
                          type: string
                          description: >-
                            Absolute workspace path where the deployed bundle
                            files live. Mirrors the workspace.file_path field in
                            DABs bundle config.
                        git_folder_path:
                          type: string
                          description: >-
                            When deployed from a Databricks Git folder, the
                            absolute workspace path of that folder; empty for
                            local deploys.
                        root_path:
                          type: string
                          description: >-
                            Absolute workspace path of the deployment root — the
                            base path the deployed files live under. Mirrors
                            workspace.root_path in the DABs bundle config;
                            file_path is its files subdirectory.
                        source_linked:
                          type: boolean
                          description: >-
                            Whether files are served directly from the source
                            sync root instead of being copied into file_path.
                      description: >-
                        Workspace location of the deployment, captured at the
                        time of this version.
                  required:
                    - cli_version
                    - version_type
                  description: The version to create.
              required:
                - version
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
