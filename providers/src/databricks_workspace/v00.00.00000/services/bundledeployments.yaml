components:
  schemas:
    DashboardMetadata:
      type: object
      properties:
        definition_path:
          type: string
          description: >-
            Path of the file that declares this dashboard, relative to the
            bundle's workspace.file_path (Deployment.workspace_info.file_path) —
            join the two to get the file's absolute workspace path. For now this
            lives only on the dashboard metadata, and is a single string because
            it was a single string (``relative_path``) in the legacy bundle
            metadata.json. We may generalize it in the future: lifting it to a
            top-level field on Resource/Operation (every resource type has a
            definition location) and converting it to a repeated field, since a
            resource can be declared across multiple files/locations.
        source_path:
          type: string
          description: >-
            Path of the dashboard's source artifact (its ``.lvdash.json``),
            relative to the deployment root.
      description: >-
        Dashboard-specific per-resource metadata. Set only for dashboard
        resources.
    Deployment:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
          description: When the deployment was created.
        created_by:
          type: string
          description: >-
            The user who created the deployment (email or principal name). Empty
            if authoritative deployment metadata does not identify a creator or
            the principal cannot be resolved.
        deployment_mode:
          $ref: '#/components/schemas/DeploymentMode'
          description: Bundle target deployment mode (development or production).
        destroy_time:
          type: string
          format: date-time
          description: >-
            When deletion was recorded. Unset if deletion has not been recorded.
            This response metadata does not determine the deployment's lifecycle
            status.
        destroyed_by:
          type: string
          description: >-
            The user who destroyed the deployment (email or principal name).
            Unset if the deployment has not been destroyed.
        display_name:
          type: string
          description: Human-readable name for the deployment, up to 256 characters.
        git_info:
          $ref: '#/components/schemas/GitInfo'
          description: >-
            Git provenance of the deployment's source, derived from the latest
            version.
        initial_parent_path:
          type: string
          description: >-
            The workspace path of the existing folder where the deployment is
            initially created. Must be absolute and canonical, with single
            separators, no ``.`` or ``..`` segments, and no trailing slash
            unless the path is ``/``. It may contain at most 24 path segments,
            excluding an optional leading ``/Workspace`` segment. The complete
            path may contain up to 1,024 characters, and each segment may
            contain up to 511 characters. This field is input only and is not
            returned in create, get, or list responses.
        last_successful_version_id:
          type: string
          description: >-
            The version_id of the most recent version that completed
            successfully. Unset until a version has completed successfully.
            Unlike last_version_id, it is not advanced when a version fails, so
            it always points at the last known-good deployment state (or is
            unset if there has never been one).
        last_version_id:
          type: string
          description: The version_id of the most recent deployment version.
        name:
          type: string
          description: 'Resource name of the deployment. Format: deployments/{deployment_id}'
        status:
          $ref: '#/components/schemas/DeploymentStatus'
          description: Current status of the deployment.
        target_name:
          type: string
          description: The bundle target name associated with this deployment.
        update_time:
          type: string
          format: date-time
          description: When the deployment was last updated.
        updated_by:
          type: string
          description: >-
            The user who most recently updated the deployment (email or
            principal name). Empty if authoritative deployment metadata does not
            identify a modifier or the principal cannot be resolved.
        workspace_info:
          $ref: '#/components/schemas/WorkspaceInfo'
          description: Workspace location of the deployment.
      description: A bundle deployment registered with the control plane.
    GitInfo:
      type: object
      properties:
        branch:
          type: string
          description: Branch the source was deployed from.
        commit:
          type: string
          description: Commit SHA of the deployed source.
        origin_url:
          type: string
          description: URL of the git remote the source was deployed from.
      description: >-
        Git provenance of a bundle's source, captured at deploy time. Lets
        consumers link a deployed
            resource back to its source in version control.
    HeartbeatResponse:
      type: object
      properties:
        expire_time:
          type: string
          format: date-time
          description: The new lock expiry time after renewal.
      description: Response for Heartbeat.
    ListDeploymentsResponse:
      type: object
      properties:
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
          description: The deployments from the queried workspace.
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as ``page_token`` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
      description: Response for ListDeployments.
    ListOperationsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as ``page_token`` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
          description: The resource operations under the specified version.
      description: Response for ListOperations.
    ListResourcesResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as ``page_token`` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
          description: The resources under the specified deployment.
      description: Response for ListResources.
    ListVersionsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            A token, which can be sent as ``page_token`` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/Version'
          description: The versions under the specified deployment.
      description: Response for ListVersions.
    Operation:
      type: object
      properties:
        action_type:
          $ref: '#/components/schemas/OperationActionType'
          description: >-
            The type of operation performed on this resource. Set when the
            version is created and immutable thereafter.
        create_time:
          type: string
          format: date-time
          description: When the operation was recorded.
        dashboard_metadata:
          $ref: '#/components/schemas/DashboardMetadata'
          description: >-
            Dashboard-specific metadata; set only for dashboard resources.
            Mutable: may be set or updated via UpdateOperation as the resource
            is applied, and is mirrored onto the corresponding deployment-level
            resource.
        error_message:
          type: string
          description: >-
            Error message if the operation failed. Set when status is
            OPERATION_STATUS_FAILED. Captures the error encountered while
            applying the resource to the workspace. Mutable: may be updated
            after creation via UpdateOperation; setting it to an empty string
            clears it. After an update is applied, an operation whose status is
            OPERATION_STATUS_SUCCEEDED cannot carry an error_message.
        name:
          type: string
          description: >-
            Resource name of the operation. Format:
            deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}
        resource_id:
          type: string
          description: >-
            ID of the actual resource in the workspace (e.g. the job ID,
            pipeline ID). Required whenever ``state`` is set, because state
            records a resource that exists. A CREATE or RECREATE that has not
            produced its resource yet records neither. Mutable: may be filled in
            (or corrected) later via UpdateOperation once the ID is known.
        resource_key:
          type: string
          description: >-
            Resource identifier within the bundle (e.g. "jobs.foo",
            "pipelines.bar", "jobs.foo.permissions", "files.<rel-path>"). Can be
            an arbitrary UTF-8 encoded string key. This key links the operation
            to the corresponding deployment-level Resource. Set when the version
            is created and immutable thereafter.
        resource_type:
          $ref: '#/components/schemas/DeploymentResourceType'
          description: >-
            The type of the deployment resource this operation applies to.
            Derived from the ``resource_key`` prefix (e.g. "jobs" → JOB); the
            caller does not set this field.
        sequence_id:
          type: integer
          description: >-
            Monotonically increasing revision used for optimistic concurrency
            control (the AIP-154 concurrency token for this resource, realized
            as a sequence number rather than an opaque etag). The server assigns
            0 when the operation is created and increments it on every
            successful UpdateOperation, so a never-updated operation is at 0 and
            the first successful update makes it 1. It is OPTIONAL rather than
            OUTPUT_ONLY because it is dual-purpose: GetOperation returns the
            current value, and UpdateOperation reads the caller-supplied value
            as a precondition. The caller must echo the value it last observed;
            if it no longer matches the server's value, the update is rejected
            with ABORTED so the caller can re-read and retry.
        state:
          type: string
          description: >-
            Serialized local config state after the operation. Its presence
            records whether the resource is still tracked by the deployment.
            Explicitly clearing state removes the resource from the deployment;
            omitting it from the update mask leaves resource state unchanged.
            State is stored only on Resources. UpdateOperation accepts state but
            omits it from its response, as do subsequent GetOperation and
            ListOperations. Mutable: may be updated after creation via
            UpdateOperation. When updating, the caller must echo the
            last-observed ``sequence_id`` as a concurrency precondition. The
            string is not parsed; it is projected onto the corresponding
            Resource's state. It is deliberately not google.protobuf.Value,
            whose only numeric case is ``double number_value``, so parsing the
            client's JSON into it rewrites every integer as a double - ``1``
            reads back as ``1.0``, which no longer deserializes into an integer
            field - and silently loses precision above 2^53, which is within
            range for IDs the client records. A string rather than bytes: the
            payload is always UTF-8 JSON, and proto3 JSON maps bytes to base64,
            which inflates every request and response by a third and makes state
            unreadable in logs and API responses. Both generate the same OpenAPI
            schema ("type": "string"), so the SDKs are identical either way.
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: >-
            Status of the operation. Starts as OPERATION_STATUS_PENDING when the
            version is created and moves to a terminal status once the resource
            is applied. Mutable: updated via UpdateOperation, e.g. when an
            operation recorded as failed is retried and eventually succeeds.
        update_time:
          type: string
          format: date-time
          description: >-
            When the operation was last updated. Set to ``create_time`` when the
            operation is created and to the server timestamp on each successful
            UpdateOperation.
      description: >-
        An operation on a single resource performed during a version. The full
        set of operations for a
            version is recorded when the version is created: each carries its ``resource_key`` and
            ``action_type`` and starts in ``OPERATION_STATUS_PENDING``. As each resource is applied, its
            operation is updated (via UpdateOperation) to record the result of applying the change to the
            workspace. ``state``, ``error_message``, ``resource_id``, ``status``, and ``dashboard_metadata``
            may be updated afterwards, guarded by ``sequence_id`` for optimistic concurrency control; all
            other fields are immutable once recorded.
    Resource:
      type: object
      properties:
        resource_type:
          $ref: '#/components/schemas/DeploymentResourceType'
          description: The type of the deployment resource.
        dashboard_metadata:
          $ref: '#/components/schemas/DashboardMetadata'
          description: Dashboard-specific metadata; set only for dashboard resources.
        last_action_type:
          $ref: '#/components/schemas/OperationActionType'
          description: The action performed on this resource during the last version.
        last_version_id:
          type: string
          description: The version_id of the last version where this resource was updated.
        name:
          type: string
          description: >-
            Resource name. Format:
            deployments/{deployment_id}/resources/{resource_key}
        resource_id:
          type: string
          description: >-
            ID that references the actual resource in the workspace (e.g. the
            job ID, pipeline ID).
        resource_key:
          type: string
          description: >-
            Resource identifier within the bundle (e.g. "jobs.foo",
            "pipelines.bar", "jobs.foo.permissions").
        state:
          type: string
          description: >-
            Serialized local config state (what the CLI deployed). Opaque to
            this service; see Operation.state for why this is a string and not
            google.protobuf.Value.
        update_time:
          type: string
          format: date-time
          description: >-
            When the last operation that updated this resource's recorded state
            was applied. Pairs with last_action_type and last_version_id (all
            three advance together on that write).
      required:
        - resource_type
      description: >-
        A resource managed by a deployment. Resources are implicitly created,
        updated, or deleted when
            operations are recorded on a version.
    StagedOperation:
      type: object
      properties:
        resource_key:
          type: string
          description: >-
            The key identifying the resource this operation applies to (e.g.
            "jobs.foo", "pipelines.bar"). Becomes the final component of the
            operation's name and must be unique among the operations in the
            version.
        action_type:
          $ref: '#/components/schemas/OperationActionType'
          description: The type of operation planned for this resource.
      required:
        - resource_key
        - action_type
      description: >-
        A resource operation to record when a version is created. Each staged
        operation identifies the
            resource it applies to and the action planned for it; the server records the operation in
            ``OPERATION_STATUS_PENDING``, and its outcome is filled in later via UpdateOperation.
    Version:
      type: object
      properties:
        cli_version:
          type: string
          description: CLI version used to initiate the version.
        version_type:
          $ref: '#/components/schemas/VersionType'
          description: Type of version (deploy or destroy).
        complete_time:
          type: string
          format: date-time
          description: When the version completed. Unset while the version is in progress.
        completed_by:
          type: string
          description: >-
            The user who completed the version (email or principal name). May
            differ from ``created_by`` when another user force-completes the
            version.
        completion_reason:
          $ref: '#/components/schemas/VersionComplete'
          description: >-
            Why the version was completed. Unset while in progress. Set when
            status transitions to COMPLETED.
        create_time:
          type: string
          format: date-time
          description: When the version was created.
        created_by:
          type: string
          description: The user who created the version (email or principal name).
        deployment_mode:
          $ref: '#/components/schemas/DeploymentMode'
          description: >-
            Bundle target deployment mode (development or production), captured
            at the time of this version.
        display_name:
          type: string
          description: >-
            Display name for the deployment, captured at the time of this
            version. Up to 256 characters. When present, creating the version
            updates the deployment display name. An empty value clears it; an
            absent value leaves the current deployment display name unchanged.
        git_info:
          $ref: '#/components/schemas/GitInfo'
          description: Git provenance of the source, captured at the time of this version.
        name:
          type: string
          description: >-
            Resource name of the version. Format:
            deployments/{deployment_id}/versions/{version_id}
        operations:
          type: array
          items:
            $ref: '#/components/schemas/StagedOperation'
          description: >-
            The full operation plan for this version: one PENDING operation per
            entry, recorded in the same transaction. Input only -- supplied on
            create and never returned by create/get/list; read the recorded
            operations via ListOperations.
        previous_version_id:
          type: string
          description: >-
            The version_id this version was created on top of — the deployment's
            most recent version at creation time. Leave unset when creating the
            first version (the deployment has no prior versions). Set by the
            client on creation and immutable thereafter. Acts as an
            optimistic-concurrency precondition: the server requires it to equal
            the deployment's current most-recent version (and to be unset when
            the deployment has no versions) and returns
            ``INVALID_PARAMETER_VALUE`` on mismatch, so a deploy racing against
            a concurrent deploy is rejected rather than silently overwriting it.
        status:
          $ref: '#/components/schemas/VersionStatus'
          description: 'Status of the version: IN_PROGRESS or COMPLETED.'
        target_name:
          type: string
          description: Target name of the deployment, captured at the time of this version.
        version_id:
          type: string
          description: >-
            Version identifier within the parent deployment, assigned by the
            client on creation. A numeric string (base-10, fits in a signed
            64-bit integer) that is greater than or equal to 1. Version IDs are
            strictly increasing within a deployment but are not required to
            start at 1 or to be contiguous.
        workspace_info:
          $ref: '#/components/schemas/WorkspaceInfo'
          description: >-
            Workspace location of the deployment, captured at the time of this
            version.
      required:
        - cli_version
        - version_type
      description: >-
        A single invocation of a deploy or destroy command against a deployment.
        Creating a version
            acquires an exclusive lock on the parent deployment.
    WorkspaceInfo:
      type: object
      properties:
        bundle_root_path:
          type: string
