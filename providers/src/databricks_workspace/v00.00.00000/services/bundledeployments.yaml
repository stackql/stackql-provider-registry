    patch:
      operationId: bundle_deployments_update_operation
      summary: Updates a resource operation's mutable fields.
      tags:
        - bundledeployments
        - bundle_deployments
      description: >-
        Updates a resource operation's mutable fields.


        ``state``, ``error_message``, ``resource_id``, ``status``, and
        ``dashboard_metadata`` may be updated,

        independently; ``update_mask`` must contain only those paths. All other
        fields are immutable. The

        update is guarded by an optimistic-concurrency check: the caller sets
        ``operation.sequence_id`` to the

        value it last observed, and the server rejects the update with
        ``ABORTED`` if the operation has been

        modified since. On success the server increments ``sequence_id``;
        updates to ``state``,

        ``resource_id``, and ``dashboard_metadata`` are mirrored onto the
        corresponding deployment-level

        resource. Listing ``state`` in ``update_mask`` with no value clears it,
        which removes the tracked

        resource, so a delete or unbind that succeeds must clear ``state``. The
        parent version must be in

        progress, and after the update is applied a succeeded operation cannot
        carry an ``error_message``. See

        the ``state`` and ``resource_id`` fields for the rest.


        :param name: str
          Resource name of the operation. Format:
          deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}
        :param operation: :class:`Operation`
          The operation to update. Its ``name`` selects the operation; the fields named in ``update_mask``
          carry the new values; and ``sequence_id`` carries the optimistic-concurrency precondition (see the
          field docs on Operation). All other fields are ignored.
        :param update_mask: FieldMask
          The set of fields to update. Required; supported paths are ``state``, ``error_message``,
          ``resource_id``, ``status``, and ``dashboard_metadata``. An empty mask or any other path is rejected
          with INVALID_PARAMETER_VALUE.

        :returns: :class:`Operation`
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `deployment_id` segment of the `name` resource name
            (`deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}`).
            Resource name of the operation. Format:
            deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}
        - name: version_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `version_id` segment of the `name` resource name
            (`deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}`).
            Resource name of the operation. Format:
            deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}
        - name: resource_key
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `resource_key` segment of the `name` resource name
            (`deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}`).
            Resource name of the operation. Format:
            deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}
        - name: update_mask
          in: query
          required: true
          schema:
            type: object
          description: >-
            The set of fields to update. Required; supported paths are
            ``state``, ``error_message``, ``resource_id``, ``status``, and
            ``dashboard_metadata``. An empty mask or any other path is rejected
            with INVALID_PARAMETER_VALUE.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action_type:
                  type: string
                  x-enum:
                    - OPERATION_ACTION_TYPE_BIND
                    - OPERATION_ACTION_TYPE_BIND_AND_UPDATE
                    - OPERATION_ACTION_TYPE_CREATE
                    - OPERATION_ACTION_TYPE_DELETE
                    - OPERATION_ACTION_TYPE_INITIAL_REGISTER
                    - OPERATION_ACTION_TYPE_RECREATE
                    - OPERATION_ACTION_TYPE_RESIZE
                    - OPERATION_ACTION_TYPE_UNBIND
                    - OPERATION_ACTION_TYPE_UPDATE
                    - OPERATION_ACTION_TYPE_UPDATE_WITH_ID
                  description: >-
                    The type of operation performed on this resource. Set when
                    the version is created and immutable thereafter.
                create_time:
                  type: string
                  format: date-time
                  description: When the operation was recorded.
                dashboard_metadata:
                  type: object
                  properties:
                    definition_path:
                      type: string
                      description: >-
                        Path of the file that declares this dashboard, relative
                        to the bundle's workspace.file_path
                        (Deployment.workspace_info.file_path) — join the two to
                        get the file's absolute workspace path. For now this
                        lives only on the dashboard metadata, and is a single
                        string because it was a single string
                        (``relative_path``) in the legacy bundle metadata.json.
                        We may generalize it in the future: lifting it to a
                        top-level field on Resource/Operation (every resource
                        type has a definition location) and converting it to a
                        repeated field, since a resource can be declared across
                        multiple files/locations.
                    source_path:
                      type: string
                      description: >-
                        Path of the dashboard's source artifact (its
                        ``.lvdash.json``), relative to the deployment root.
                  description: >-
                    Dashboard-specific metadata; set only for dashboard
                    resources. Mutable: may be set or updated via
                    UpdateOperation as the resource is applied, and is mirrored
                    onto the corresponding deployment-level resource.
                error_message:
                  type: string
                  description: >-
                    Error message if the operation failed. Set when status is
                    OPERATION_STATUS_FAILED. Captures the error encountered
                    while applying the resource to the workspace. Mutable: may
                    be updated after creation via UpdateOperation; setting it to
                    an empty string clears it. After an update is applied, an
                    operation whose status is OPERATION_STATUS_SUCCEEDED cannot
                    carry an error_message.
                name:
                  type: string
                  description: >-
                    Resource name of the operation. Format:
                    deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}
                resource_id:
                  type: string
                  description: >-
                    ID of the actual resource in the workspace (e.g. the job ID,
                    pipeline ID). Required whenever ``state`` is set, because
                    state records a resource that exists. A CREATE or RECREATE
                    that has not produced its resource yet records neither.
                    Mutable: may be filled in (or corrected) later via
                    UpdateOperation once the ID is known.
                resource_key:
                  type: string
                  description: >-
                    Resource identifier within the bundle (e.g. "jobs.foo",
                    "pipelines.bar", "jobs.foo.permissions",
                    "files.<rel-path>"). Can be an arbitrary UTF-8 encoded
                    string key. This key links the operation to the
                    corresponding deployment-level Resource. Set when the
                    version is created and immutable thereafter.
                resource_type:
                  type: string
                  x-enum:
                    - DEPLOYMENT_RESOURCE_TYPE_ALERT
                    - DEPLOYMENT_RESOURCE_TYPE_APP
                    - DEPLOYMENT_RESOURCE_TYPE_CATALOG
                    - DEPLOYMENT_RESOURCE_TYPE_CLUSTER
                    - DEPLOYMENT_RESOURCE_TYPE_CLUSTER_POLICY
                    - DEPLOYMENT_RESOURCE_TYPE_DASHBOARD
                    - DEPLOYMENT_RESOURCE_TYPE_DATABASE_CATALOG
                    - DEPLOYMENT_RESOURCE_TYPE_DATABASE_INSTANCE
                    - DEPLOYMENT_RESOURCE_TYPE_EXPERIMENT
                    - DEPLOYMENT_RESOURCE_TYPE_EXTERNAL_LOCATION
                    - DEPLOYMENT_RESOURCE_TYPE_GENIE_SPACE
                    - DEPLOYMENT_RESOURCE_TYPE_INSTANCE_POOL
                    - DEPLOYMENT_RESOURCE_TYPE_JOB
                    - DEPLOYMENT_RESOURCE_TYPE_JOB_RUN
                    - DEPLOYMENT_RESOURCE_TYPE_MODEL
                    - DEPLOYMENT_RESOURCE_TYPE_MODEL_SERVING_ENDPOINT
                    - DEPLOYMENT_RESOURCE_TYPE_PIPELINE
                    - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_BRANCH
                    - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_CATALOG
                    - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_DATABASE
                    - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_ENDPOINT
                    - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_PROJECT
                    - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_ROLE
                    - DEPLOYMENT_RESOURCE_TYPE_POSTGRES_SYNCED_TABLE
                    - DEPLOYMENT_RESOURCE_TYPE_QUALITY_MONITOR
                    - DEPLOYMENT_RESOURCE_TYPE_REGISTERED_MODEL
                    - DEPLOYMENT_RESOURCE_TYPE_SCHEMA
                    - DEPLOYMENT_RESOURCE_TYPE_SECRET
                    - DEPLOYMENT_RESOURCE_TYPE_SECRET_SCOPE
                    - DEPLOYMENT_RESOURCE_TYPE_SQL_WAREHOUSE
                    - DEPLOYMENT_RESOURCE_TYPE_SYNCED_DATABASE_TABLE
                    - DEPLOYMENT_RESOURCE_TYPE_VECTOR_SEARCH_ENDPOINT
                    - DEPLOYMENT_RESOURCE_TYPE_VECTOR_SEARCH_INDEX
                    - DEPLOYMENT_RESOURCE_TYPE_VOLUME
                  description: >-
                    The type of the deployment resource this operation applies
                    to. Derived from the ``resource_key`` prefix (e.g. "jobs" →
                    JOB); the caller does not set this field.
                sequence_id:
                  type: integer
                  description: >-
                    Monotonically increasing revision used for optimistic
                    concurrency control (the AIP-154 concurrency token for this
                    resource, realized as a sequence number rather than an
                    opaque etag). The server assigns 0 when the operation is
                    created and increments it on every successful
                    UpdateOperation, so a never-updated operation is at 0 and
                    the first successful update makes it 1. It is OPTIONAL
                    rather than OUTPUT_ONLY because it is dual-purpose:
                    GetOperation returns the current value, and UpdateOperation
                    reads the caller-supplied value as a precondition. The
                    caller must echo the value it last observed; if it no longer
                    matches the server's value, the update is rejected with
                    ABORTED so the caller can re-read and retry.
                state:
                  type: string
                  description: >-
                    Serialized local config state after the operation. Its
                    presence records whether the resource is still tracked by
                    the deployment. Explicitly clearing state removes the
                    resource from the deployment; omitting it from the update
                    mask leaves resource state unchanged. State is stored only
                    on Resources. UpdateOperation accepts state but omits it
                    from its response, as do subsequent GetOperation and
                    ListOperations. Mutable: may be updated after creation via
                    UpdateOperation. When updating, the caller must echo the
                    last-observed ``sequence_id`` as a concurrency precondition.
                    The string is not parsed; it is projected onto the
                    corresponding Resource's state. It is deliberately not
                    google.protobuf.Value, whose only numeric case is ``double
                    number_value``, so parsing the client's JSON into it
                    rewrites every integer as a double - ``1`` reads back as
                    ``1.0``, which no longer deserializes into an integer field
                    - and silently loses precision above 2^53, which is within
                    range for IDs the client records. A string rather than
                    bytes: the payload is always UTF-8 JSON, and proto3 JSON
                    maps bytes to base64, which inflates every request and
                    response by a third and makes state unreadable in logs and
                    API responses. Both generate the same OpenAPI schema
                    ("type": "string"), so the SDKs are identical either way.
                status:
                  type: string
                  x-enum:
                    - OPERATION_STATUS_FAILED
                    - OPERATION_STATUS_PENDING
                    - OPERATION_STATUS_SUCCEEDED
                  description: >-
                    Status of the operation. Starts as OPERATION_STATUS_PENDING
                    when the version is created and moves to a terminal status
                    once the resource is applied. Mutable: updated via
                    UpdateOperation, e.g. when an operation recorded as failed
                    is retried and eventually succeeds.
                update_time:
                  type: string
                  format: date-time
                  description: >-
                    When the operation was last updated. Set to ``create_time``
                    when the operation is created and to the server timestamp on
                    each successful UpdateOperation.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
