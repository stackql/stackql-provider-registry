openapi: 3.0.0
info:
  title: Databricks Bundledeployments API (workspace)
  description: >-
    OpenAPI specification for the Databricks bundledeployments service
    (workspace-level APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.bundledeployments
servers:
  - url: https://{deployment_name}.{workspace_domain}
    variables:
      deployment_name:
        description: >-
          The Databricks workspace deployment name: the host prefix of the
          workspace URL (dbc-abcd0123-a1bc on AWS, adb-1234567890123456.7 on
          Azure, 1234567890123456.7 on GCP). Set DATABRICKS_DEPLOYMENT_NAME to
          default it for the session.
        default: dbc-abcd0123-a1bc
        x-stackQL-envVar: DATABRICKS_DEPLOYMENT_NAME
      workspace_domain:
        description: >-
          The Databricks workspace domain suffix for the cloud. Selected by
          DATABRICKS_CLOUD (aws, azure or gcp; default aws).
        default: cloud.databricks.com
        x-stackQL-envVarSelector:
          envVar: DATABRICKS_CLOUD
          default: aws
          values:
            aws: cloud.databricks.com
            azure: azuredatabricks.net
            gcp: gcp.databricks.com
paths:
  /api/2.0/bundle/deployments/{deployment_id}/versions/{version_id}/complete:
    post:
      operationId: bundle_deployments_complete_version
      summary: Marks a version as complete and releases the deployment lock.
      tags:
        - bundledeployments
        - bundle_deployments
      description: |-
        Marks a version as complete and releases the deployment lock.

        The server atomically:

        1. Sets the version status to the provided terminal status.
        2. Sets ``complete_time`` to the current server timestamp.
        3. Releases the lock on the parent deployment.
        4. Updates the parent deployment's ``status`` and ``last_version_id``.

        :param name: str
          The name of the version to complete. Format: deployments/{deployment_id}/versions/{version_id}
        :param completion_reason: :class:`VersionComplete`
          The reason for completing the version. Must be VERSION_COMPLETE_SUCCESS or VERSION_COMPLETE_FAILURE.
        :param force: bool (optional)
          If true, force-completes the version even if the caller is not the original creator.

        :returns: :class:`Version`
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `deployment_id` segment of the `name` resource name
            (`deployments/{deployment_id}/versions/{version_id}`). The name of
            the version to complete. Format:
            deployments/{deployment_id}/versions/{version_id}
        - name: version_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `version_id` segment of the `name` resource name
            (`deployments/{deployment_id}/versions/{version_id}`). The name of
            the version to complete. Format:
            deployments/{deployment_id}/versions/{version_id}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                completion_reason:
                  type: string
                  x-enum:
                    - VERSION_COMPLETE_FAILURE
                    - VERSION_COMPLETE_FORCE_ABORT
                    - VERSION_COMPLETE_LEASE_EXPIRED
                    - VERSION_COMPLETE_SUCCESS
                  description: >-
                    The reason for completing the version. Must be
                    VERSION_COMPLETE_SUCCESS or VERSION_COMPLETE_FAILURE.
                force:
                  type: boolean
                  description: >-
                    If true, force-completes the version even if the caller is
                    not the original creator.
              required:
                - completion_reason
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
  /api/2.0/bundle/deployments:
    post:
      operationId: bundle_deployments_create_deployment
      summary: Creates a new deployment in the workspace.
      tags:
        - bundledeployments
        - bundle_deployments
      description: |-
        Creates a new deployment in the workspace.

        :param deployment: :class:`Deployment`
          The deployment to create. ``initial_parent_path`` is required. ``display_name``, ``target_name``,
          ``deployment_mode``, and ``workspace_info`` may be set; every other field is assigned by the service
          and ignored on input.

        :returns: :class:`Deployment`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                create_time:
                  type: string
                  format: date-time
                  description: When the deployment was created.
                created_by:
                  type: string
                  description: >-
                    The user who created the deployment (email or principal
                    name). Empty if authoritative deployment metadata does not
                    identify a creator or the principal cannot be resolved.
                deployment_mode:
                  type: string
                  x-enum:
                    - DEPLOYMENT_MODE_DEVELOPMENT
                    - DEPLOYMENT_MODE_PRODUCTION
                  description: Bundle target deployment mode (development or production).
                destroy_time:
                  type: string
                  format: date-time
                  description: >-
                    When deletion was recorded. Unset if deletion has not been
                    recorded. This response metadata does not determine the
                    deployment's lifecycle status.
                destroyed_by:
                  type: string
                  description: >-
                    The user who destroyed the deployment (email or principal
                    name). Unset if the deployment has not been destroyed.
                display_name:
                  type: string
                  description: >-
                    Human-readable name for the deployment, up to 256
                    characters.
                git_info:
                  type: object
                  properties:
                    branch:
                      type: string
                      description: Branch the source was deployed from.
                    commit:
                      type: string
                      description: Commit SHA of the deployed source.
                    origin_url:
                      type: string
                      description: URL of the git remote the source was deployed from.
                  description: >-
                    Git provenance of the deployment's source, derived from the
                    latest version.
                initial_parent_path:
                  type: string
                  description: >-
                    The workspace path of the existing folder where the
                    deployment is initially created. Must be absolute and
                    canonical, with single separators, no ``.`` or ``..``
                    segments, and no trailing slash unless the path is ``/``. It
                    may contain at most 24 path segments, excluding an optional
                    leading ``/Workspace`` segment. The complete path may
                    contain up to 1,024 characters, and each segment may contain
                    up to 511 characters. This field is input only and is not
                    returned in create, get, or list responses.
                last_successful_version_id:
                  type: string
                  description: >-
                    The version_id of the most recent version that completed
                    successfully. Unset until a version has completed
                    successfully. Unlike last_version_id, it is not advanced
                    when a version fails, so it always points at the last
                    known-good deployment state (or is unset if there has never
                    been one).
                last_version_id:
                  type: string
                  description: The version_id of the most recent deployment version.
                name:
                  type: string
                  description: >-
                    Resource name of the deployment. Format:
                    deployments/{deployment_id}
                status:
                  type: string
                  x-enum:
                    - DEPLOYMENT_STATUS_ACTIVE
                    - DEPLOYMENT_STATUS_DELETED
                    - DEPLOYMENT_STATUS_FAILED
                    - DEPLOYMENT_STATUS_IN_PROGRESS
                  description: Current status of the deployment.
                target_name:
                  type: string
                  description: The bundle target name associated with this deployment.
                update_time:
                  type: string
                  format: date-time
                  description: When the deployment was last updated.
                updated_by:
                  type: string
                  description: >-
                    The user who most recently updated the deployment (email or
                    principal name). Empty if authoritative deployment metadata
                    does not identify a modifier or the principal cannot be
                    resolved.
                workspace_info:
                  type: object
                  properties:
                    bundle_root_path:
                      type: string
                      description: >-
                        Path of the bundle root (the directory containing
                        databricks.yml) relative to git_folder_path. Empty when
                        the deployment is not from a Databricks Git folder.
                    file_path:
                      type: string
                      description: >-
                        Absolute workspace path where the deployed bundle files
                        live. Mirrors the workspace.file_path field in DABs
                        bundle config.
                    git_folder_path:
                      type: string
                      description: >-
                        When deployed from a Databricks Git folder, the absolute
                        workspace path of that folder; empty for local deploys.
                    root_path:
                      type: string
                      description: >-
                        Absolute workspace path of the deployment root — the
                        base path the deployed files live under. Mirrors
                        workspace.root_path in the DABs bundle config; file_path
                        is its files subdirectory.
                    source_linked:
                      type: boolean
                      description: >-
                        Whether files are served directly from the source sync
                        root instead of being copied into file_path.
                  description: Workspace location of the deployment.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
    get:
      operationId: bundle_deployments_list_deployments
      summary: Lists deployments in the workspace.
      tags:
        - bundledeployments
        - bundle_deployments
      description: |-
        Lists deployments in the workspace.

        :param page_size: int (optional)
          The maximum number of deployments to return. The service may return fewer than this value. If
          unspecified, at most 20 deployments will be returned. The maximum value is 1000; values above 1000
          will be coerced to 1000.
        :param page_token: str (optional)
          A page token, received from a previous ``ListDeployments`` call. Provide this to retrieve the
          subsequent page.
        :param show_deleted: bool (optional)
          Whether to include soft-deleted deployments in the response. Defaults to false. When true, returns
          both live and soft-deleted deployments visible to the caller, subject to the filter. Soft-deleted
          deployments have status ``DEPLOYMENT_STATUS_DELETED``.

        :returns: Iterator over :class:`Deployment`
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of deployments to return. The service may return
            fewer than this value. If unspecified, at most 20 deployments will
            be returned. The maximum value is 1000; values above 1000 will be
            coerced to 1000.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ``ListDeployments`` call.
            Provide this to retrieve the subsequent page.
        - name: show_deleted
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            Whether to include soft-deleted deployments in the response.
            Defaults to false. When true, returns both live and soft-deleted
            deployments visible to the caller, subject to the filter.
            Soft-deleted deployments have status ``DEPLOYMENT_STATUS_DELETED``.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeploymentsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
  /api/2.0/bundle/deployments/{deployment_id}/versions:
    post:
      operationId: bundle_deployments_create_version
      summary: Creates a new version under a deployment.
      tags:
        - bundledeployments
        - bundle_deployments
      description: >-
        Creates a new version under a deployment.


        Creating a version acquires an exclusive lock on the deployment,
        preventing concurrent deploys. The

        caller provides a ``version_id``, a numeric string that must be
        numerically greater than the

        deployment's most recent version, and sets the version's
        ``previous_version_id`` to the deployment's

        most recent version (leaving it unset for the first version), which the
        server validates to detect

        concurrent deploys.


        The caller also provides the full set of ``operations`` planned for this
        version, each identified by a

        ``resource_key`` and an ``action_type``. The server records one
        operation per resource in

        ``OPERATION_STATUS_PENDING`` in the same transaction as the version, so
        the plan is captured

        atomically. The outcome of each operation is recorded later via
        UpdateOperation as the resource is

        applied; the set of operations cannot be changed after the version is
        created.


        :param parent: str
          The parent deployment where this version will be created. Format: deployments/{deployment_id}
        :param version: :class:`Version`
          The version to create.
        :param version_id: str
          The ID to use for the version, which becomes the final component of the version's resource name. A
          numeric string (base-10, fits in a signed 64-bit integer) chosen by the caller; must be greater than
          or equal to 1. Must be numerically greater than the deployment's most recent version (see
          ``version.previous_version_id``); it does not need to start at 1 or increase by exactly 1. If the
          value is not numerically greater, the server returns ``INVALID_PARAMETER_VALUE``.

        :returns: :class:`Version`
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `deployment_id` segment of the `parent` resource name
            (`deployments/{deployment_id}`). The parent deployment where this
            version will be created. Format: deployments/{deployment_id}
        - name: version_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            The ID to use for the version, which becomes the final component of
            the version's resource name. A numeric string (base-10, fits in a
            signed 64-bit integer) chosen by the caller; must be greater than or
            equal to 1. Must be numerically greater than the deployment's most
            recent version (see ``version.previous_version_id``); it does not
            need to start at 1 or increase by exactly 1. If the value is not
            numerically greater, the server returns ``INVALID_PARAMETER_VALUE``.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cli_version:
                  type: string
                  description: CLI version used to initiate the version.
                version_type:
                  type: string
                  x-enum:
                    - VERSION_TYPE_DEPLOY
                    - VERSION_TYPE_DESTROY
                  description: Type of version (deploy or destroy).
                complete_time:
                  type: string
                  format: date-time
                  description: >-
                    When the version completed. Unset while the version is in
                    progress.
                completed_by:
                  type: string
                  description: >-
                    The user who completed the version (email or principal
                    name). May differ from ``created_by`` when another user
                    force-completes the version.
                completion_reason:
                  type: string
                  x-enum:
                    - VERSION_COMPLETE_FAILURE
                    - VERSION_COMPLETE_FORCE_ABORT
                    - VERSION_COMPLETE_LEASE_EXPIRED
                    - VERSION_COMPLETE_SUCCESS
                  description: >-
                    Why the version was completed. Unset while in progress. Set
                    when status transitions to COMPLETED.
                create_time:
                  type: string
                  format: date-time
                  description: When the version was created.
                created_by:
                  type: string
                  description: The user who created the version (email or principal name).
                deployment_mode:
                  type: string
                  x-enum:
                    - DEPLOYMENT_MODE_DEVELOPMENT
                    - DEPLOYMENT_MODE_PRODUCTION
                  description: >-
                    Bundle target deployment mode (development or production),
                    captured at the time of this version.
                display_name:
                  type: string
                  description: >-
                    Display name for the deployment, captured at the time of
                    this version. Up to 256 characters. When present, creating
                    the version updates the deployment display name. An empty
                    value clears it; an absent value leaves the current
                    deployment display name unchanged.
                git_info:
                  type: object
                  properties:
                    branch:
                      type: string
                      description: Branch the source was deployed from.
                    commit:
                      type: string
                      description: Commit SHA of the deployed source.
                    origin_url:
                      type: string
                      description: URL of the git remote the source was deployed from.
                  description: >-
                    Git provenance of the source, captured at the time of this
                    version.
                name:
                  type: string
                  description: >-
                    Resource name of the version. Format:
                    deployments/{deployment_id}/versions/{version_id}
                operations:
                  type: array
                  items:
                    type: object
                    properties:
                      resource_key:
                        type: string
                        description: >-
                          The key identifying the resource this operation
                          applies to (e.g. "jobs.foo", "pipelines.bar"). Becomes
                          the final component of the operation's name and must
                          be unique among the operations in the version.
                      action_type:
                        type: string
                        x-enum:
                          - OPERATION_ACTION_TYPE_BIND
                          - OPERATION_ACTION_TYPE_BIND_AND_UPDATE
                          - OPERATION_ACTION_TYPE_CREATE
                          - OPERATION_ACTION_TYPE_DELETE
                          - OPERATION_ACTION_TYPE_INITIAL_REGISTER
                          - OPERATION_ACTION_TYPE_RECREATE
                          - OPERATION_ACTION_TYPE_RESIZE
                          - OPERATION_ACTION_TYPE_UNBIND
                          - OPERATION_ACTION_TYPE_UPDATE
                          - OPERATION_ACTION_TYPE_UPDATE_WITH_ID
                        description: The type of operation planned for this resource.
                    required:
                      - resource_key
                      - action_type
                    description: >-
                      A resource operation to record when a version is created.
                      Each staged operation identifies the
                          resource it applies to and the action planned for it; the server records the operation in
                          ``OPERATION_STATUS_PENDING``, and its outcome is filled in later via UpdateOperation.
                  description: >-
                    The full operation plan for this version: one PENDING
                    operation per entry, recorded in the same transaction. Input
                    only -- supplied on create and never returned by
                    create/get/list; read the recorded operations via
                    ListOperations.
                previous_version_id:
                  type: string
                  description: >-
                    The version_id this version was created on top of — the
                    deployment's most recent version at creation time. Leave
                    unset when creating the first version (the deployment has no
                    prior versions). Set by the client on creation and immutable
                    thereafter. Acts as an optimistic-concurrency precondition:
                    the server requires it to equal the deployment's current
                    most-recent version (and to be unset when the deployment has
                    no versions) and returns ``INVALID_PARAMETER_VALUE`` on
                    mismatch, so a deploy racing against a concurrent deploy is
                    rejected rather than silently overwriting it.
                status:
                  type: string
                  x-enum:
                    - VERSION_STATUS_COMPLETED
                    - VERSION_STATUS_IN_PROGRESS
                  description: 'Status of the version: IN_PROGRESS or COMPLETED.'
                target_name:
                  type: string
                  description: >-
                    Target name of the deployment, captured at the time of this
                    version.
                version_id:
                  type: string
                  description: >-
                    Version identifier within the parent deployment, assigned by
                    the client on creation. A numeric string (base-10, fits in a
                    signed 64-bit integer) that is greater than or equal to 1.
                    Version IDs are strictly increasing within a deployment but
                    are not required to start at 1 or to be contiguous.
                workspace_info:
                  type: object
                  properties:
                    bundle_root_path:
                      type: string
                      description: >-
                        Path of the bundle root (the directory containing
                        databricks.yml) relative to git_folder_path. Empty when
                        the deployment is not from a Databricks Git folder.
                    file_path:
                      type: string
                      description: >-
                        Absolute workspace path where the deployed bundle files
                        live. Mirrors the workspace.file_path field in DABs
                        bundle config.
                    git_folder_path:
                      type: string
                      description: >-
                        When deployed from a Databricks Git folder, the absolute
                        workspace path of that folder; empty for local deploys.
                    root_path:
                      type: string
                      description: >-
                        Absolute workspace path of the deployment root — the
                        base path the deployed files live under. Mirrors
                        workspace.root_path in the DABs bundle config; file_path
                        is its files subdirectory.
                    source_linked:
                      type: boolean
                      description: >-
                        Whether files are served directly from the source sync
                        root instead of being copied into file_path.
                  description: >-
                    Workspace location of the deployment, captured at the time
                    of this version.
              required:
                - cli_version
                - version_type
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
    get:
      operationId: bundle_deployments_list_versions
      summary: >-
        Lists versions under a deployment, ordered numerically by version_id
        descending (most recent first).
      tags:
        - bundledeployments
        - bundle_deployments
      description: >-
        Lists versions under a deployment, ordered numerically by version_id
        descending (most recent first).


        :param parent: str
          The parent deployment. Format: deployments/{deployment_id}
        :param page_size: int (optional)
          The maximum number of versions to return. The service may return fewer than this value. If
          unspecified, at most 20 versions will be returned. The maximum value is 100; values above 100 will
          be coerced to 100.
        :param page_token: str (optional)
          A page token, received from a previous ``ListVersions`` call. Provide this to retrieve the
          subsequent page.

        :returns: Iterator over :class:`Version`
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `deployment_id` segment of the `parent` resource name
            (`deployments/{deployment_id}`). The parent deployment. Format:
            deployments/{deployment_id}
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of versions to return. The service may return
            fewer than this value. If unspecified, at most 20 versions will be
            returned. The maximum value is 100; values above 100 will be coerced
            to 100.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ``ListVersions`` call.
            Provide this to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVersionsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
  /api/2.0/bundle/deployments/{deployment_id}:
    delete:
      operationId: bundle_deployments_delete_deployment
      summary: Deletes a deployment.
      tags:
        - bundledeployments
        - bundle_deployments
      description: |-
        Deletes a deployment.

        :param name: str
          Resource name of the deployment to delete. Format: deployments/{deployment_id}
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `deployment_id` segment of the `name` resource name
            (`deployments/{deployment_id}`). Resource name of the deployment to
            delete. Format: deployments/{deployment_id}
      responses:
        '200':
          description: Success
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
    get:
      operationId: bundle_deployments_get_deployment
      summary: Retrieves a deployment by its resource name.
      tags:
        - bundledeployments
        - bundle_deployments
      description: |-
        Retrieves a deployment by its resource name.

        :param name: str
          Resource name of the deployment to retrieve. Format: deployments/{deployment_id}

        :returns: :class:`Deployment`
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `deployment_id` segment of the `name` resource name
            (`deployments/{deployment_id}`). Resource name of the deployment to
            retrieve. Format: deployments/{deployment_id}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: BundleDeploymentsAPI
    patch:
      operationId: bundle_deployments_update_deployment
      summary: Updates a deployment.
      tags:
        - bundledeployments
        - bundle_deployments
      description: |-
        Updates a deployment.

        :param name: str
          Resource name of the deployment. Format: deployments/{deployment_id}
        :param deployment: :class:`Deployment`
          The deployment to update. Its ``name`` selects the deployment; the fields named in ``update_mask``
          carry the new values. All other fields are ignored.
        :param update_mask: FieldMask
          The fields to update; supported paths are ``display_name``, ``deployment_mode``, ``target_name``,
          and ``workspace_info``. An empty mask or any other path returns INVALID_PARAMETER_VALUE.

        :returns: :class:`Deployment`
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `deployment_id` segment of the `name` resource name
            (`deployments/{deployment_id}`). Resource name of the deployment.
            Format: deployments/{deployment_id}
        - name: update_mask
          in: query
          required: true
          schema:
            type: object
          description: >-
            The fields to update; supported paths are ``display_name``,
            ``deployment_mode``, ``target_name``, and ``workspace_info``. An
            empty mask or any other path returns INVALID_PARAMETER_VALUE.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                create_time:
                  type: string
                  format: date-time
                  description: When the deployment was created.
                created_by:
                  type: string
                  description: >-
                    The user who created the deployment (email or principal
                    name). Empty if authoritative deployment metadata does not
                    identify a creator or the principal cannot be resolved.
                deployment_mode:
                  type: string
                  x-enum:
                    - DEPLOYMENT_MODE_DEVELOPMENT
                    - DEPLOYMENT_MODE_PRODUCTION
                  description: Bundle target deployment mode (development or production).
                destroy_time:
                  type: string
                  format: date-time
                  description: >-
                    When deletion was recorded. Unset if deletion has not been
                    recorded. This response metadata does not determine the
                    deployment's lifecycle status.
                destroyed_by:
                  type: string
                  description: >-
                    The user who destroyed the deployment (email or principal
                    name). Unset if the deployment has not been destroyed.
                display_name:
                  type: string
                  description: >-
                    Human-readable name for the deployment, up to 256
                    characters.
                git_info:
                  type: object
                  properties:
                    branch:
                      type: string
                      description: Branch the source was deployed from.
                    commit:
                      type: string
                      description: Commit SHA of the deployed source.
                    origin_url:
                      type: string
                      description: URL of the git remote the source was deployed from.
                  description: >-
                    Git provenance of the deployment's source, derived from the
                    latest version.
                initial_parent_path:
                  type: string
                  description: >-
                    The workspace path of the existing folder where the
                    deployment is initially created. Must be absolute and
                    canonical, with single separators, no ``.`` or ``..``
                    segments, and no trailing slash unless the path is ``/``. It
                    may contain at most 24 path segments, excluding an optional
                    leading ``/Workspace`` segment. The complete path may
                    contain up to 1,024 characters, and each segment may contain
                    up to 511 characters. This field is input only and is not
                    returned in create, get, or list responses.
                last_successful_version_id:
                  type: string
                  description: >-
                    The version_id of the most recent version that completed
                    successfully. Unset until a version has completed
                    successfully. Unlike last_version_id, it is not advanced
                    when a version fails, so it always points at the last
                    known-good deployment state (or is unset if there has never
                    been one).
                last_version_id:
                  type: string
                  description: The version_id of the most recent deployment version.
                name:
                  type: string
                  description: >-
                    Resource name of the deployment. Format:
                    deployments/{deployment_id}
                status:
                  type: string
                  x-enum:
                    - DEPLOYMENT_STATUS_ACTIVE
                    - DEPLOYMENT_STATUS_DELETED
                    - DEPLOYMENT_STATUS_FAILED
                    - DEPLOYMENT_STATUS_IN_PROGRESS
                  description: Current status of the deployment.
                target_name:
                  type: string
                  description: The bundle target name associated with this deployment.
                update_time:
                  type: string
                  format: date-time
                  description: When the deployment was last updated.
                updated_by:
                  type: string
                  description: >-
                    The user who most recently updated the deployment (email or
                    principal name). Empty if authoritative deployment metadata
                    does not identify a modifier or the principal cannot be
                    resolved.
                workspace_info:
                  type: object
                  properties:
                    bundle_root_path:
                      type: string
                      description: >-
                        Path of the bundle root (the directory containing
                        databricks.yml) relative to git_folder_path. Empty when
                        the deployment is not from a Databricks Git folder.
                    file_path:
                      type: string
                      description: >-
                        Absolute workspace path where the deployed bundle files
                        live. Mirrors the workspace.file_path field in DABs
                        bundle config.
                    git_folder_path:
                      type: string
                      description: >-
                        When deployed from a Databricks Git folder, the absolute
                        workspace path of that folder; empty for local deploys.
                    root_path:
                      type: string
                      description: >-
                        Absolute workspace path of the deployment root — the
                        base path the deployed files live under. Mirrors
                        workspace.root_path in the DABs bundle config; file_path
                        is its files subdirectory.
                    source_linked:
                      type: boolean
                      description: >-
                        Whether files are served directly from the source sync
                        root instead of being copied into file_path.
                  description: Workspace location of the deployment.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
