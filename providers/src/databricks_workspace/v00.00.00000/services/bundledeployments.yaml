  /api/2.0/bundle/deployments/{deployment_id}/versions/{version_id}/heartbeat:
    post:
      operationId: bundle_deployments_heartbeat
      summary: Sends a heartbeat to renew the lock held by a version.
      tags:
        - bundledeployments
        - bundle_deployments
      description: >-
        Sends a heartbeat to renew the lock held by a version.


        The server validates that the version is the active (non-terminal)
        version on the parent deployment

        and resets the lock expiry. If the lock has already expired or the
        version is no longer active, the

        server returns ``ABORTED``.


        :param name: str
          The version whose lock to renew. Format: deployments/{deployment_id}/versions/{version_id}

        :returns: :class:`HeartbeatResponse`
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `deployment_id` segment of the `name` resource name
            (`deployments/{deployment_id}/versions/{version_id}`). The version
            whose lock to renew. Format:
            deployments/{deployment_id}/versions/{version_id}
        - name: version_id
          in: path
          required: true
          schema:
            type: string
          description: >-
