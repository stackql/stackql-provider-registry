            deployments/{deployment_id}
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of resources to return. The service may return
            fewer than this value. If unspecified, at most 50 resources will be
            returned. The maximum value is 1000; values above 1000 will be
            coerced to 1000.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ``ListResources`` call.
            Provide this to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResourcesResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
