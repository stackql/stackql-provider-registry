  /api/2.0/sandbox-exec/sandboxes/{sandbox_id}/exec-sync:
    post:
      operationId: sandbox_execute_command_sync
      summary: >-
        Runs a command in the sandbox and blocks until it exits, returning the
        captured stdout, stderr and
      tags:
        - sandbox
      description: >-
        Runs a command in the sandbox and blocks until it exits, returning the
        captured stdout, stderr and

        exit code in a single response.


        :param name: str
          Resource name of the sandbox to run the command in, in the form ``sandboxes/{sandbox_id}``. Bound
          from the URL path.
        :param cmd: str
          Executable or command to run (e.g. ``/bin/echo``, ``python3``).
        :param args: List[str] (optional)
          Arguments passed to ``cmd``.
        :param envs: Dict[str,str] (optional)
          Extra environment variables for the command's process, merged over the sandbox's default
          environment.
        :param execution_timeout: Duration (optional)
          Maximum time to wait for the command to finish. When it elapses the command is terminated and the
          response carries status ``TIMED_OUT``. The server applies a default when unset and clamps to an
          upper bound; negative or otherwise invalid durations are rejected with ``INVALID_ARGUMENT``.

        :returns: :class:`ExecuteCommandSyncResponse`
      parameters:
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `sandbox_id` segment of the `name` resource name
            (`sandboxes/{sandbox_id}`). Resource name of the sandbox to run the
            command in, in the form ``sandboxes/{sandbox_id}``. Bound from the
            URL path.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cmd:
                  type: string
                  description: >-
                    Executable or command to run (e.g. ``/bin/echo``,
                    ``python3``).
                args:
                  type: array
                  items:
                    type: string
                  description: Arguments passed to ``cmd``.
                envs:
                  type: object
                  description: >-
