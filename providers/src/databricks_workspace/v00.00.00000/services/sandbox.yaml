        :param parent: str
        :param path: str
          Absolute UTF-8 path of the directory.
        :param parents: bool (optional)
          Defaults to true, which also succeeds when the directory already exists.

        :returns: :class:`CreateDirectoryResponse`
      parameters:
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `sandbox_id` segment of the `parent` resource name
            (`sandboxes/{sandbox_id}`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Absolute UTF-8 path of the directory.
                parents:
                  type: boolean
                  description: >-
                    Defaults to true, which also succeeds when the directory
                    already exists.
              required:
                - path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDirectoryResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: SandboxAPI
  /api/2.0/sandboxes:
    post:
      operationId: sandbox_create_sandbox
      summary: Creates a new Sandbox.
      tags:
        - sandbox
      description: |-
        Creates a new Sandbox.

        :param sandbox: :class:`Sandbox`
          The sandbox to create.
        :param sandbox_id: str
          Client-supplied ID that becomes the final path segment of the resource name.

        :returns: :class:`Sandbox`
      parameters:
        - name: sandbox_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            Client-supplied ID that becomes the final path segment of the
            resource name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                create_time:
                  type: string
                  format: date-time
                  description: Output only. The creation time of the sandbox.
                display_name:
                  type: string
                  description: >-
                    Human-readable display label for the sandbox. At most 256
                    characters.
                metadata:
                  type: object
                  properties:
                    custom_tags:
                      type: object
                      description: >-
                        Key-value tags associated with the sandbox. Supports up
                        to 54 tags. Keys must be between 1 and 512 characters,
                        and values must not exceed 256 characters.
                  description: Metadata associated with the sandbox.
                name:
                  type: string
                  description: >-
                    The sandbox resource name, in the form
                    ``sandboxes/{sandbox_id}``. Derived from ``sandbox_id``; any
                    value supplied in a create or update request body is
                    ignored.
                spec:
                  type: object
                  properties:
                    compute:
                      type: object
                      properties:
                        inactivity_timeout:
                          type: string
                    environment:
                      type: object
                      properties:
                        image_uri:
                          type: string
                      description: The execution environment to use for the sandbox.
                  description: >-
                    The desired configuration of the sandbox, supplied by the
                    caller at creation time.
                status:
                  type: object
                  properties:
                    state:
                      type: string
                      x-enum:
                        - SANDBOX_STATE_PENDING
                        - SANDBOX_STATE_RUNNING
                        - SANDBOX_STATE_STOPPED
                        - SANDBOX_STATE_STOPPING
                      description: >-
                        Lifecycle state of a Sandbox resource. STOPPING is the
                        transient state while the sandbox is

                        being stopped -- by a Stop request or inactivity
                        auto-termination -- and settles to STOPPED once

                        the operation completes.
                  description: >-
                    The observed runtime state of the sandbox, populated by the
                    server.
                update_time:
                  type: string
                  format: date-time
                  description: >-
                    Output only. The last update time of the sandbox metadata
                    and spec.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: SandboxAPI
