components:
  schemas:
    Command:
      type: object
      properties:
        args:
          type: array
          items:
            type: string
          description: Arguments passed to the program.
        cmd:
          type: string
          description: The program that was executed.
        command_id:
          type: string
          description: Stable identifier for this command.
        exit_code:
          type: integer
          description: >-
            Process exit code. Only present when finished is true and the
            process exited normally (not killed by signal or failed to start).
        finished:
          type: boolean
          description: Whether the command has finished executing.
        pid:
          type: integer
          description: PID of the spawned process. Absent if the process failed to start.
      description: A single command execution.
    ComputeSpec:
      type: object
      properties:
        inactivity_timeout:
          type: string
    CreateDirectoryResponse:
      type: object
      properties: {}
      description: Confirms that the requested directory exists.
    DeletePathResponse:
      type: object
      properties: {}
      description: Confirms that the requested path is absent.
    EnvironmentSpec:
      type: object
      properties:
        image_uri:
          type: string
    ExecuteCommandSyncResponse:
      type: object
      properties:
        command_id:
          type: string
          description: >-
            Daemon-generated identifier for this command execution, for
            correlation (for example in ``ListCommands``).
        exit_code:
          type: integer
          description: >-
            Process exit code. Unset when the process was terminated by a signal
            (e.g. on ``TIMED_OUT``) or never started (``FAILED``) rather than
            exiting normally.
        status:
          $ref: '#/components/schemas/ExecuteCommandStatus'
          description: >-
            Terminal status of the command execution. Always set on a successful
            response; never ``EXECUTE_COMMAND_STATUS_UNSPECIFIED``.
        stderr:
          type: string
          description: >-
            Captured standard error, with the same UTF-8 semantics as
            ``stdout``.
        stdout:
          type: string
          description: >-
            Captured standard output as UTF-8 text. Invalid UTF-8 bytes are
            replaced with the Unicode replacement character (U+FFFD).
        truncated:
          type: boolean
          description: >-
            True when ``stdout`` / ``stderr`` were truncated because the
            captured output exceeded the server's per-response size cap. The
            dropped output is not included in this response and is not
            recoverable through this unary API.
      description: >-
        Result of a completed unary command execution: captured output, exit
        code, and terminal status.
    GetMetadataResponse:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/SandboxFileInfo'
      description: >-
        Contains metadata for the requested path without following its final
        symlink.
    ListCommandsResponse:
      type: object
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/Command'
          description: Commands in this page of results.
        next_page_token:
          type: string
          description: >-
            Token to retrieve the next page. Empty when there are no more
            results.
      description: Response listing tracked command executions.
    ListDirectoryContentsResponse:
      type: object
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/SandboxFileInfo'
        next_page_token:
          type: string
      description: >-
        Contains a page of immediate directory entries and an optional
        continuation token. An empty
            token marks the final page. Pages reflect concurrent directory changes.
    ListSandboxesResponse:
      type: object
      properties:
        next_page_token:
          type: string
        sandboxes:
          type: array
          items:
            $ref: '#/components/schemas/Sandbox'
      description: A list of Sandboxes.
    RenamePathResponse:
      type: object
      properties: {}
      description: Confirms that the sandbox path was renamed.
    Sandbox:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
          description: Output only. The creation time of the sandbox.
        display_name:
          type: string
          description: >-
            Human-readable display label for the sandbox. At most 256
            characters.
        metadata:
          $ref: '#/components/schemas/SandboxMetadata'
          description: Metadata associated with the sandbox.
        name:
          type: string
          description: >-
            The sandbox resource name, in the form ``sandboxes/{sandbox_id}``.
            Derived from ``sandbox_id``; any value supplied in a create or
            update request body is ignored.
        spec:
          $ref: '#/components/schemas/SandboxSpec'
          description: >-
            The desired configuration of the sandbox, supplied by the caller at
            creation time.
        status:
          $ref: '#/components/schemas/SandboxStatus'
          description: The observed runtime state of the sandbox, populated by the server.
        update_time:
          type: string
          format: date-time
          description: Output only. The last update time of the sandbox metadata and spec.
      description: A Sandbox resource representing an execution environment.
    SandboxFileInfo:
      type: object
      properties:
        file_type:
          $ref: '#/components/schemas/SandboxFileType'
        group:
          type: string
        mode:
          type: integer
        modify_time:
          type: string
          format: date-time
          description: Nanosecond precision is preserved on the wire.
        name:
          type: string
        owner:
          type: string
        path:
          type: string
        permissions:
          type: string
        size:
          type: integer
        symlink_target:
          type: string
      description: >-
        Metadata for a sandbox filesystem entry, describing a final symlink
        itself.
    SandboxMetadata:
      type: object
      properties:
        custom_tags:
          type: object
          description: >-
            Key-value tags associated with the sandbox. Supports up to 54 tags.
            Keys must be between 1 and 512 characters, and values must not
            exceed 256 characters.
      description: Metadata associated with a sandbox.
    SandboxSpec:
      type: object
      properties:
        compute:
          $ref: '#/components/schemas/ComputeSpec'
        environment:
          $ref: '#/components/schemas/EnvironmentSpec'
          description: The execution environment to use for the sandbox.
    SandboxStatus:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/SandboxState'
    ExecuteCommandStatus:
      type: string
      x-enum:
        - EXECUTE_COMMAND_STATUS_COMPLETED
        - EXECUTE_COMMAND_STATUS_FAILED
        - EXECUTE_COMMAND_STATUS_TIMED_OUT
      description: Terminal status of a unary command execution.
    SandboxFileType:
      type: string
      x-enum:
        - SANDBOX_FILE_TYPE_DIRECTORY
        - SANDBOX_FILE_TYPE_FILE
        - SANDBOX_FILE_TYPE_OTHER
        - SANDBOX_FILE_TYPE_SYMLINK
      description: Type of a sandbox filesystem entry without following its final symlink.
    SandboxState:
      type: string
      x-enum:
        - SANDBOX_STATE_PENDING
        - SANDBOX_STATE_RUNNING
        - SANDBOX_STATE_STOPPED
        - SANDBOX_STATE_STOPPING
      description: >-
        Lifecycle state of a Sandbox resource. STOPPING is the transient state
        while the sandbox is

        being stopped -- by a Stop request or inactivity auto-termination -- and
        settles to STOPPED once

        the operation completes.
