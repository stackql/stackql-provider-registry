    patch:
      operationId: ai_search_update_endpoint
      summary: >-
        Update an existing AI Search endpoint. Multi-bucket masks are supported
        and dispatched in
      tags:
        - aisearch
        - ai_search
      description: >-
        Update an existing AI Search endpoint. Multi-bucket masks are supported
        and dispatched in

        deterministic bucket order: budget policy, custom tags, throughput, then
        scaling/replicas. Per-bucket

        dispatch is not atomic across buckets — if a later bucket fails, earlier
        buckets may already have

        been applied.


        :param name: str
          Name of the AI Search endpoint. Server-assigned full resource path
          (``workspaces/{workspace}/endpoints/{endpoint}``) on output. On create, the user-supplied short name
          is conveyed via ``CreateEndpointRequest.endpoint_id``; the server composes the full ``name`` and
          returns it on the response.
        :param endpoint: :class:`Endpoint`
          The Endpoint resource to update. ``endpoint.name`` carries the full resource path.
        :param update_mask: FieldMask
          The list of fields to update.

        :returns: :class:`Endpoint`
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: >-
            Name of the AI Search endpoint. Server-assigned full resource path
            (``workspaces/{workspace}/endpoints/{endpoint}``) on output. On
            create, the user-supplied short name is conveyed via
            ``CreateEndpointRequest.endpoint_id``; the server composes the full
            ``name`` and returns it on the response.
        - name: update_mask
          in: query
          required: true
          schema:
            type: object
          description: The list of fields to update.
      requestBody:
        content:
          application/json:
