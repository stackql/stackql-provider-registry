      description: >-
        Query (search) an AI Search index. Read-only, so a read-scoped token may
        invoke it.


        :param name: str
          Full resource name of the index to query. Format:
          ``workspaces/{workspace_id}/endpoints/{endpoint_id}/indexes/{index_id}``
        :param columns: List[str]
          Column names to include in each result row.
        :param columns_to_rerank: List[str] (optional)
          Columns whose values are sent to the reranker.
        :param facets: List[str] (optional)
          Facets to compute over the matched results (e.g. ``"category TOP 5"``).
        :param filters_json: str (optional)
          JSON string describing query filters (e.g. ``{"id >": 5}``).
        :param max_results: int (optional)
          Maximum number of results to return (the legacy ``num_results``). Defaults to 10.
        :param query_columns: List[str] (optional)
          Text columns to search for ``query_text``. When empty, all text columns are searched.
        :param query_text: str (optional)
          Query text. Required for Delta Sync indexes that compute embeddings from a model endpoint.
        :param query_type: str (optional)
          Query type: ``ANN``, ``HYBRID``, or ``FULL_TEXT``. Defaults to ``ANN``.
        :param query_vector: List[float] (optional)
          Query vector. Required for Direct Access indexes and Delta Sync indexes with self-managed vectors.
        :param reranker: :class:`RerankerConfig` (optional)
          If set, results are reranked before being returned.
        :param score_threshold: float (optional)
          Score threshold for the approximate nearest-neighbor search. Defaults to 0.0.
        :param sort_columns: List[str] (optional)
          Sort clauses, e.g. ``["rating DESC", "price ASC"]``. Overrides relevance ordering.

        :returns: :class:`QueryIndexResponse`
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: >-
            Full resource name of the index to query. Format:
            ``workspaces/{workspace_id}/endpoints/{endpoint_id}/indexes/{index_id}``
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                columns:
                  type: array
                  items:
                    type: string
                  description: Column names to include in each result row.
                columns_to_rerank:
                  type: array
                  items:
                    type: string
                  description: Columns whose values are sent to the reranker.
                facets:
                  type: array
                  items:
                    type: string
                  description: >-
                    Facets to compute over the matched results (e.g. ``"category
                    TOP 5"``).
                filters_json:
                  type: string
                  description: 'JSON string describing query filters (e.g. ``{"id >": 5}``).'
                max_results:
                  type: integer
                  description: >-
                    Maximum number of results to return (the legacy
                    ``num_results``). Defaults to 10.
                query_columns:
                  type: array
                  items:
                    type: string
                  description: >-
                    Text columns to search for ``query_text``. When empty, all
                    text columns are searched.
                query_text:
                  type: string
                  description: >-
                    Query text. Required for Delta Sync indexes that compute
                    embeddings from a model endpoint.
                query_type:
                  type: string
                  description: >-
                    Query type: ``ANN``, ``HYBRID``, or ``FULL_TEXT``. Defaults
                    to ``ANN``.
                query_vector:
                  type: array
                  items:
                    type: number
                  description: >-
                    Query vector. Required for Direct Access indexes and Delta
                    Sync indexes with self-managed vectors.
                reranker:
                  type: object
                  properties:
                    model:
                      type: string
                      description: >-
                        Reranker identifier: "databricks_reranker" for the base
                        model, or a Model Serving endpoint name when
                        ``model_type`` is MODEL_TYPE_FINETUNED.
                    model_type:
                      type: string
                      x-enum:
                        - MODEL_TYPE_BASE
                        - MODEL_TYPE_FINETUNED
                      description: Discriminator for how ``model`` is interpreted.
                    parameters:
                      type: object
                      properties:
                        columns_to_rerank:
                          type: array
                          items:
                            type: string
                          description: >-
                            Columns whose values are concatenated and sent to
                            the reranker.
                      description: Parameters controlling reranking.
                  description: If set, results are reranked before being returned.
                score_threshold:
                  type: number
                  description: >-
                    Score threshold for the approximate nearest-neighbor search.
                    Defaults to 0.0.
                sort_columns:
                  type: array
                  items:
                    type: string
                  description: >-
                    Sort clauses, e.g. ``["rating DESC", "price ASC"]``.
                    Overrides relevance ordering.
              required:
                - columns
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryIndexResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
