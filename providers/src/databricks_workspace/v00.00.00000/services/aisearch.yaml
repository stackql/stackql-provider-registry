components:
  schemas:
    ColumnInfo:
      type: object
      properties:
        name:
          type: string
          description: Name of the column.
        type_text:
          type: string
          description: Data type of the column (e.g., "string", "int", "array<float>").
      description: >-
        Column information (name and data type) for an index column. Surfaced on
        ``Index.column_info``.
    CustomTag:
      type: object
      properties:
        key:
          type: string
          description: Key field for an AI Search endpoint tag.
        value:
          type: string
          description: '[Optional] Value field for an AI Search endpoint tag.'
      required:
        - key
      description: >-
        User-defined key/value tag attached to an AI Search endpoint for cost
        attribution and access
            control.
    DataModificationResult:
      type: object
      properties:
        failed_primary_keys:
          type: array
          items:
            type: string
          description: Primary keys of rows that failed to process.
        success_row_count:
          type: integer
          description: Count of rows processed successfully.
      description: Per-row outcome of a data-plane upsert or delete operation.
    DeltaSyncIndexSpec:
      type: object
      properties:
        pipeline_type:
          $ref: '#/components/schemas/PipelineType'
          description: >-
            Pipeline execution mode. Required on create — the backend rejects an
            unset value. Storage Optimized endpoints accept only ``TRIGGERED``;
            Standard endpoints accept both. No explicit ``stage`` — a REQUIRED
            field staged below its service would be dropped from combined specs
            while remaining in ``required``, tripping the OpenAPI
            required-vs-properties consistency check. The field inherits the
            service's launch stage.
        columns_to_sync:
          type: array
          items:
            type: string
          description: >-
            [Optional] Select the columns to sync with the index. If left blank,
            all columns from the source table are synced. The primary key column
            and embedding source or vector column are always synced.
        embedding_source_columns:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingSourceColumn'
          description: The columns that contain the embedding source.
        embedding_vector_columns:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingVectorColumn'
          description: The columns that contain the embedding vectors.
        embedding_writeback_table:
          type: string
          description: >-
            [Optional] Name of the Delta table to sync the index contents and
            computed embeddings to.
        pipeline_id:
          type: string
          description: The ID of the pipeline that is used to sync the index.
        source_table:
          type: string
          description: The full name of the source Delta table.
      required:
        - pipeline_type
      description: >-
        Specification for a Delta Sync index — the index is kept in sync with a
        source Delta table.
    DirectAccessIndexSpec:
      type: object
      properties:
        embedding_source_columns:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingSourceColumn'
          description: The columns that contain the embedding source.
        embedding_vector_columns:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingVectorColumn'
          description: The columns that contain the embedding vectors.
        requested_schema_json:
          type: string
          description: >-
            The index schema exactly as the user supplied it on create,
            preserving the original type spellings (e.g. ``integer``) rather
            than Unity Catalog's canonical names (e.g. ``int``) that
            ``schema_json`` returns.
        schema_json:
          type: string
          description: >-
            The schema of the index in JSON format. Supported types are
            ``integer``, ``long``, ``float``, ``double``, ``boolean``,
            ``string``, ``date``, ``timestamp``. Supported types for vector
            columns: ``array<float>``, ``array<double>``.
      description: >-
        Specification for a Direct Access index — the customer manages vectors
        and metadata directly.
    EmbeddingSourceColumn:
      type: object
      properties:
        embedding_model_endpoint:
          type: string
          description: >-
            Name of the embedding model endpoint, used by default for both
            ingestion and querying.
        model_endpoint_name_for_query:
          type: string
          description: >-
            Name of the embedding model endpoint which, if specified, is used
            for querying (not ingestion).
        name:
          type: string
          description: Name of the source column.
      description: >-
        Name of an embedding source column and its associated embedding model
        endpoint.
    EmbeddingVectorColumn:
      type: object
      properties:
        embedding_dimension:
          type: integer
          description: Dimension of the embedding vector.
        name:
          type: string
          description: Name of the column.
      description: Name and dimension of an embedding vector column.
    Endpoint:
      type: object
      properties:
        endpoint_type:
          $ref: '#/components/schemas/EndpointType'
          description: Type of endpoint. Required on create and immutable thereafter.
        budget_policy_id:
          type: string
          description: The user-selected budget policy id for the endpoint.
        create_time:
          type: string
          format: date-time
          description: Time the endpoint was created.
        creator:
          type: string
          description: Creator of the endpoint
        custom_tags:
          type: array
          items:
            $ref: '#/components/schemas/CustomTag'
          description: The custom tags assigned to the endpoint
        effective_budget_policy_id:
          type: string
          description: The budget policy id applied to the endpoint
        endpoint_status:
          $ref: '#/components/schemas/EndpointStatus'
          description: Current status of the endpoint
        id:
          type: string
          description: Unique identifier of the endpoint
        index_count:
          type: integer
          description: Number of indexes on the endpoint
        last_updated_user:
          type: string
          description: User who last updated the endpoint
        name:
          type: string
          description: >-
            Name of the AI Search endpoint. Server-assigned full resource path
            (``workspaces/{workspace}/endpoints/{endpoint}``) on output. On
            create, the user-supplied short name is conveyed via
            ``CreateEndpointRequest.endpoint_id``; the server composes the full
            ``name`` and returns it on the response.
        replica_count:
          type: integer
          description: >-
            The client-supplied desired number of replicas for the endpoint,
            applied at create/update time. Mutually exclusive with
            ``target_qps``.
        scaling_info:
          $ref: '#/components/schemas/EndpointScalingInfo'
          description: Scaling information for the endpoint
        target_qps:
          type: integer
          description: >-
            Target QPS for the endpoint. Mutually exclusive with
            ``replica_count``. Best-effort; the system does not guarantee this
            QPS will be achieved.
        throughput_info:
          $ref: '#/components/schemas/EndpointThroughputInfo'
          description: Throughput information for the endpoint
        update_time:
          type: string
          format: date-time
          description: Time the endpoint was last updated.
        usage_policy_id:
          type: string
          description: The usage policy id applied to the endpoint.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          description: >-
            Advisory warnings surfaced when target_qps is set on a Standard
            endpoint.
      required:
        - endpoint_type
      description: >-
        An AI Search endpoint — compute infrastructure that hosts AI Search
        indexes and serves queries
            against them. Customers create, query, and delete endpoints; the system manages provisioning,
            scaling, and health status.
    EndpointScalingInfo:
      type: object
      properties:
        requested_target_qps:
          type: integer
          description: >-
            The requested QPS target for the endpoint. Best-effort; the system
            does not guarantee this QPS will be achieved.
        state:
          $ref: '#/components/schemas/ScalingChangeState'
          description: The current state of the scaling change request.
      description: >-
        Scaling information for a Storage Optimized endpoint — current scaling
        state and the requested
            QPS target the system is scaling toward.
    EndpointStatus:
      type: object
      properties:
        message:
          type: string
          description: >-
            Human-readable detail about the endpoint's current state or the
            reason for a state transition.
        state:
          $ref: '#/components/schemas/EndpointStatusState'
          description: >-
            Current lifecycle state of the endpoint. See ``State`` for the
            meaning of each value.
      description: >-
        Lifecycle and health state of an AI Search endpoint, along with any
        human-readable detail about
            that state.
    EndpointThroughputInfo:
      type: object
      properties:
        change_request_message:
          type: string
          description: Additional information about the throughput change request
        change_request_state:
          $ref: '#/components/schemas/ThroughputChangeRequestState'
          description: The state of the most recent throughput change request
        current_concurrency:
          type: number
          description: The current concurrency (total CPU) allocated to the endpoint
        current_concurrency_utilization_percentage:
          type: number
          description: The current utilization of concurrency as a percentage (0-100)
        current_num_replicas:
          type: integer
          description: The current number of replicas allocated to the endpoint
        maximum_concurrency_allowed:
          type: number
          description: The maximum concurrency allowed for this endpoint
        minimal_concurrency_allowed:
          type: number
          description: The minimum concurrency allowed for this endpoint
        requested_concurrency:
          type: number
          description: The requested concurrency (total CPU) for the endpoint
        requested_num_replicas:
          type: integer
          description: The requested number of replicas for the endpoint
      description: >-
        Throughput information for an AI Search endpoint, including requested
        and current concurrency
            settings.
    FacetResultData:
      type: object
      properties:
        facet_array:
          type: array
          items:
            type: array
            items:
              type: object
          description: >-
            Facet rows; each row is ``[facet_column_name, value_or_range,
            count]``.
        facet_row_count:
          type: integer
          description: Number of facet rows returned.
      description: Facet aggregation rows returned by a query.
    Index:
      type: object
      properties:
        primary_key:
          type: string
          description: Primary key of the index. Set on create and immutable thereafter.
        index_type:
          $ref: '#/components/schemas/IndexType'
          description: Type of index. Required on create and immutable thereafter.
        creator:
          type: string
          description: Creator of the index.
        delta_sync_index_spec:
          $ref: '#/components/schemas/DeltaSyncIndexSpec'
          description: >-
            Specification for a Delta Sync index. Set when ``index_type`` is
            ``DELTA_SYNC``.
        direct_access_index_spec:
          $ref: '#/components/schemas/DirectAccessIndexSpec'
          description: >-
            Specification for a Direct Access index. Set when ``index_type`` is
            ``DIRECT_ACCESS``.
        endpoint:
          type: string
          description: >-
            Name of the endpoint associated with the index. Ignored on create —
            the endpoint is taken from ``CreateIndexRequest.parent``; populated
            only on output.
        index_subtype:
          $ref: '#/components/schemas/IndexSubtype'
          description: The subtype of the index. Set on create and immutable thereafter.
        name:
          type: string
          description: >-
            Name of the AI Search index. Server-assigned full resource path
            (``workspaces/{workspace}/endpoints/{endpoint}/indexes/{index}``) on
            output, where ``{index}`` is the index's Unity Catalog table name.
            On create, the user-supplied UC table name is conveyed via
            ``CreateIndexRequest.index_id``; the server composes the full
            ``name`` and returns it on the response.
        status:
          $ref: '#/components/schemas/IndexStatus'
          description: Current status of the index.
      required:
        - primary_key
        - index_type
      description: >-
        An AI Search index — a searchable collection of vectors and metadata
        hosted on an AI Search
            endpoint. Indexes are children of endpoints; customers create, get, list, and delete them. The
            ``{index}`` segment of the resource name is the index's Unity Catalog table name.
    IndexStatus:
      type: object
      properties:
        index_url:
          type: string
          description: Index API URL used to perform operations on the index.
        indexed_row_count:
          type: integer
          description: Number of rows indexed.
        message:
          type: string
          description: Human-readable detail about the index's current state.
        ready:
          type: boolean
          description: Whether the index is ready for search.
      description: >-
        Lifecycle and health state of an AI Search index, along with
        human-readable detail about that
            state and basic indexing progress.
    ListEndpointsResponse:
      type: object
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
          description: The endpoints in the workspace.
        next_page_token:
          type: string
          description: >-
            A token that can be used to get the next page of results. Empty when
            there are no more results.
      description: >-
        Response for ListEndpoints carrying the page of endpoints and an
        optional continuation token.
    ListIndexesResponse:
      type: object
      properties:
        indexes:
          type: array
          items:
            $ref: '#/components/schemas/Index'
          description: >-
            The indexes on the endpoint. The field is named ``indexes`` (not the
            irregular plural ``indices``) to satisfy core::0132, which derives
            the response field name from the ListIndexes method.
            core::0158::response-plural-first-field independently computes the
            resource plural as ``indices`` and is satisfied via a scoped field
            exception below.
        next_page_token:
          type: string
          description: >-
            A token that can be used to get the next page of results. Empty when
            there are no more results.
      description: >-
        Response for ListIndexes carrying the page of indexes and an optional
        continuation token.
    QueryIndexResponse:
      type: object
      properties:
        facet_result:
          $ref: '#/components/schemas/FacetResultData'
          description: Facet aggregation rows, when facets were requested.
        manifest:
          $ref: '#/components/schemas/ResultManifest'
          description: Metadata describing the result columns.
        result:
          $ref: '#/components/schemas/ResultData'
          description: The matched result rows.
      description: >-
        Response for QueryIndex carrying the matched rows and their column
        metadata.
    RemoveDataResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/DataModificationResult'
          description: Per-row outcome of the delete.
        status:
          $ref: '#/components/schemas/DataModificationStatus'
          description: Overall status of the delete.
      description: Response for RemoveData.
    RerankerConfig:
      type: object
      properties:
        model:
          type: string
          description: >-
            Reranker identifier: "databricks_reranker" for the base model, or a
            Model Serving endpoint name when ``model_type`` is
            MODEL_TYPE_FINETUNED.
        model_type:
          $ref: '#/components/schemas/RerankerConfigModelType'
          description: Discriminator for how ``model`` is interpreted.
        parameters:
          $ref: '#/components/schemas/RerankerConfigRerankerParameters'
          description: Parameters controlling reranking.
      description: Configuration for reranking query results with a reranker model.
    RerankerConfigRerankerParameters:
      type: object
      properties:
        columns_to_rerank:
          type: array
          items:
            type: string
          description: Columns whose values are concatenated and sent to the reranker.
      description: Parameters controlling how the reranker processes results.
    ResultData:
      type: object
      properties:
        data_array:
          type: array
          items:
            type: array
            items:
              type: object
          description: >-
            Result rows; each row is a list of column values aligned with the
            manifest columns.
        row_count:
          type: integer
          description: Number of rows in the result set.
      description: The rows of a query result set.
    ResultManifest:
      type: object
      properties:
        column_count:
          type: integer
          description: Number of columns in the result set.
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnInfo'
          description: Information about each column in the result set.
        facet_column_count:
          type: integer
          description: Number of columns in the facet result.
        facet_columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnInfo'
          description: Information about each facet column.
      description: Metadata describing the columns of a query result set.
    ScanIndexResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
          description: The rows in this page, each a struct of column name to value.
        next_page_token:
          type: string
          description: Token for the next page; empty when the scan is exhausted.
      description: >-
        Response for ScanIndex carrying a page of rows and an optional
        continuation token.
    SyncIndexResponse:
      type: object
      properties: {}
      description: >-
        Response for SyncIndex. Empty today; reserved so future sync metadata
        (e.g. an operation handle)
            can be added without breaking the wire contract.
    UpsertDataResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/DataModificationResult'
          description: Per-row outcome of the upsert.
        status:
          $ref: '#/components/schemas/DataModificationStatus'
          description: Overall status of the upsert.
      description: Response for UpsertData.
    Warning:
      type: object
      properties:
        index_names:
          type: array
          items:
            type: string
          description: Indexes affected by this warning.
        message:
          type: string
          description: Human-readable detail about the warning.
        status_code:
          $ref: '#/components/schemas/WarningStatusCode'
          description: Status code categorizing the warning.
      description: >-
        Advisory warning surfaced on an AI Search endpoint — a non-fatal
        condition the customer should
            be aware of (for example, a temporarily unavailable reranker or an index without an optimized
            query route).
    DataModificationStatus:
      type: string
      x-enum:
        - FAILURE
        - PARTIAL_SUCCESS
        - SUCCESS
      description: >-
        Overall outcome of a data-plane upsert or delete. Mirrors the legacy

        ``databricks.brickindexscheduler.UpsertDeleteDataStatus``
        value-for-value.
    EndpointStatusState:
      type: string
      x-enum:
        - DELETED
        - OFFLINE
        - ONLINE
        - PROVISIONING
        - RED_STATE
        - YELLOW_STATE
      description: >-
        Lifecycle state of an AI Search endpoint, used by both Standard and
        Storage Optimized SKUs.
    EndpointType:
      type: string
      x-enum:
        - STANDARD
        - STORAGE_OPTIMIZED
      description: Type of endpoint.
    IndexSubtype:
      type: string
      x-enum:
        - FULL_TEXT
        - HYBRID
        - VECTOR
      description: >-
        The subtype of the AI Search index, determining the indexing and
        retrieval strategy.


        - ``VECTOR``: Not a supported create value — do not select it. Use
        ``HYBRID`` (vector + hybrid
          search) or ``FULL_TEXT`` (full-text only). It is the proto2 default (``= 0``) solely to mirror
          the legacy ``index_v2.proto`` enum value-for-value; it is not an offered index subtype.
        - ``FULL_TEXT``: An index that uses full-text search without vector
        embeddings.

        - ``HYBRID``: An index that uses vector embeddings for similarity search
        and hybrid search.
    IndexType:
      type: string
      x-enum:
        - DELTA_SYNC
        - DIRECT_ACCESS
      description: >-
        There are 2 types of AI Search indexes:


        - ``DELTA_SYNC``: An index that automatically syncs with a source Delta
        Table, automatically and
          incrementally updating the index as the underlying data in the Delta Table changes.
        - ``DIRECT_ACCESS``: An index that supports direct read and write of
        vectors and metadata
          through our REST and SDK APIs. With this model, the user manages index updates.
    PipelineType:
      type: string
      x-enum:
        - CONTINUOUS
        - TRIGGERED
      description: >-
        Pipeline execution mode for a Delta Sync index. Required on create for
        Delta Sync indexes; the

        legacy backend rejects an unset value with INVALID_PARAMETER_VALUE.


        - ``TRIGGERED``: the pipeline stops after refreshing the source table
        once, using the data
          available when the update started.
        - ``CONTINUOUS``: the pipeline processes new data as it arrives in the
        source table to keep the
          index fresh.
    RerankerConfigModelType:
      type: string
      x-enum:
        - MODEL_TYPE_BASE
        - MODEL_TYPE_FINETUNED
      description: How the ``model`` field is interpreted.
    ScalingChangeState:
      type: string
      x-enum:
        - SCALING_CHANGE_APPLIED
        - SCALING_CHANGE_IN_PROGRESS
        - SCALING_CHANGE_UNSPECIFIED
      description: >-
        State of the most recent scaling change request for a Storage Optimized
        endpoint.
    ThroughputChangeRequestState:
      type: string
      x-enum:
        - CHANGE_ADJUSTED
        - CHANGE_FAILED
        - CHANGE_IN_PROGRESS
        - CHANGE_REACHED_MAXIMUM
        - CHANGE_REACHED_MINIMUM
        - CHANGE_SUCCESS
      description: >-
        State of the most recent throughput change request issued against a
        Storage Optimized endpoint.

        Surfaced on ``EndpointThroughputInfo.change_request_state``.
    WarningStatusCode:
      type: string
      x-enum:
        - ENDPOINT_HAS_INDEX_WITHOUT_OPTIMIZED_ROUTE
        - ENDPOINT_HAS_MANAGED_INDEX
        - RERANKER_TEMPORARILY_UNAVAILABLE
      description: >-
        Status code categorizing an advisory warning surfaced on an AI Search
        endpoint.
