openapi: 3.0.0
info:
  title: Databricks Aisearch API (workspace)
  description: >-
    OpenAPI specification for the Databricks aisearch service (workspace-level
    APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-07-31'
  x-stackql-sdk-namespace: databricks.sdk.service.aisearch
servers:
  - url: https://{deployment_name}.cloud.databricks.com
    variables:
      deployment_name:
        description: The Databricks Workspace Deployment Name
        default: dbc-abcd0123-a1bc
paths:
  /api/2.0/ai-search/{parent}/endpoints:
    post:
      operationId: ai_search_create_endpoint
      summary: Create a new AI Search endpoint.
      tags:
        - aisearch
        - ai_search
      description: |-
        Create a new AI Search endpoint.

        :param parent: str
          The Workspace where this Endpoint will be created. Format: ``workspaces/{workspace_id}``
        :param endpoint: :class:`Endpoint`
          The Endpoint resource to create. Fields other than ``endpoint.name`` carry the desired
          configuration; ``endpoint.name`` is server-assigned from ``parent`` and ``endpoint_id``.
        :param endpoint_id: str (optional)
          The user-supplied short name for the Endpoint, per AIP-133. The server composes the full
          ``Endpoint.name`` as ``{parent}/endpoints/{endpoint_id}``. AIP-133 does not list ``endpoint_id`` as
          a fields-may-be-required entry, so we annotate it OPTIONAL on the wire; the server still rejects
          empty values with INVALID_PARAMETER_VALUE.

        :returns: :class:`Endpoint`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            The Workspace where this Endpoint will be created. Format:
            ``workspaces/{workspace_id}``
        - name: endpoint_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            The user-supplied short name for the Endpoint, per AIP-133. The
            server composes the full ``Endpoint.name`` as
            ``{parent}/endpoints/{endpoint_id}``. AIP-133 does not list
            ``endpoint_id`` as a fields-may-be-required entry, so we annotate it
            OPTIONAL on the wire; the server still rejects empty values with
            INVALID_PARAMETER_VALUE.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: object
                  properties:
                    endpoint_type:
                      type: string
                      x-enum:
                        - STANDARD
                        - STORAGE_OPTIMIZED
                      description: >-
                        Type of endpoint. Required on create and immutable
                        thereafter.
                    budget_policy_id:
                      type: string
                      description: The user-selected budget policy id for the endpoint.
                    create_time:
                      type: string
                      format: date-time
                      description: Time the endpoint was created.
                    creator:
                      type: string
                      description: Creator of the endpoint
                    custom_tags:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            description: Key field for an AI Search endpoint tag.
                          value:
                            type: string
                            description: >-
                              [Optional] Value field for an AI Search endpoint
                              tag.
                        required:
                          - key
                        description: >-
                          User-defined key/value tag attached to an AI Search
                          endpoint for cost attribution and access
                              control.
                      description: The custom tags assigned to the endpoint
                    effective_budget_policy_id:
                      type: string
                      description: The budget policy id applied to the endpoint
                    endpoint_status:
                      type: object
                      properties:
                        message:
                          type: string
                          description: >-
                            Human-readable detail about the endpoint's current
                            state or the reason for a state transition.
                        state:
                          type: string
                          x-enum:
                            - DELETED
                            - OFFLINE
                            - ONLINE
                            - PROVISIONING
                            - RED_STATE
                            - YELLOW_STATE
                          description: >-
                            Current lifecycle state of the endpoint. See
                            ``State`` for the meaning of each value.
                      description: Current status of the endpoint
                    id:
                      type: string
                      description: Unique identifier of the endpoint
                    index_count:
                      type: integer
                      description: Number of indexes on the endpoint
                    last_updated_user:
                      type: string
                      description: User who last updated the endpoint
                    name:
                      type: string
                      description: >-
                        Name of the AI Search endpoint. Server-assigned full
                        resource path
                        (``workspaces/{workspace}/endpoints/{endpoint}``) on
                        output. On create, the user-supplied short name is
                        conveyed via ``CreateEndpointRequest.endpoint_id``; the
                        server composes the full ``name`` and returns it on the
                        response.
                    replica_count:
                      type: integer
                      description: >-
                        The client-supplied desired number of replicas for the
                        endpoint, applied at create/update time. Mutually
                        exclusive with ``target_qps``.
                    scaling_info:
                      type: object
                      properties:
                        requested_target_qps:
                          type: integer
                          description: >-
                            The requested QPS target for the endpoint.
                            Best-effort; the system does not guarantee this QPS
                            will be achieved.
                        state:
                          type: string
                          x-enum:
                            - SCALING_CHANGE_APPLIED
                            - SCALING_CHANGE_IN_PROGRESS
                            - SCALING_CHANGE_UNSPECIFIED
                          description: The current state of the scaling change request.
                      description: Scaling information for the endpoint
                    target_qps:
                      type: integer
                      description: >-
                        Target QPS for the endpoint. Mutually exclusive with
                        ``replica_count``. Best-effort; the system does not
                        guarantee this QPS will be achieved.
                    throughput_info:
                      type: object
                      properties:
                        change_request_message:
                          type: string
                          description: >-
                            Additional information about the throughput change
                            request
                        change_request_state:
                          type: string
                          x-enum:
                            - CHANGE_ADJUSTED
                            - CHANGE_FAILED
                            - CHANGE_IN_PROGRESS
                            - CHANGE_REACHED_MAXIMUM
                            - CHANGE_REACHED_MINIMUM
                            - CHANGE_SUCCESS
                          description: >-
                            The state of the most recent throughput change
                            request
                        current_concurrency:
                          type: number
                          description: >-
                            The current concurrency (total CPU) allocated to the
                            endpoint
                        current_concurrency_utilization_percentage:
                          type: number
                          description: >-
                            The current utilization of concurrency as a
                            percentage (0-100)
                        current_num_replicas:
                          type: integer
                          description: >-
                            The current number of replicas allocated to the
                            endpoint
                        maximum_concurrency_allowed:
                          type: number
                          description: The maximum concurrency allowed for this endpoint
                        minimal_concurrency_allowed:
                          type: number
                          description: The minimum concurrency allowed for this endpoint
                        requested_concurrency:
                          type: number
                          description: >-
                            The requested concurrency (total CPU) for the
                            endpoint
                        requested_num_replicas:
                          type: integer
                          description: The requested number of replicas for the endpoint
                      description: Throughput information for the endpoint
                    update_time:
                      type: string
                      format: date-time
                      description: Time the endpoint was last updated.
                    usage_policy_id:
                      type: string
                      description: The usage policy id applied to the endpoint.
                    warnings:
                      type: array
                      items:
                        type: object
                        properties:
                          index_names:
                            type: array
                            items:
                              type: string
                            description: Indexes affected by this warning.
                          message:
                            type: string
                            description: Human-readable detail about the warning.
                          status_code:
                            type: string
                            x-enum:
                              - ENDPOINT_HAS_INDEX_WITHOUT_OPTIMIZED_ROUTE
                              - ENDPOINT_HAS_MANAGED_INDEX
                              - RERANKER_TEMPORARILY_UNAVAILABLE
                            description: Status code categorizing the warning.
                        description: >-
                          Advisory warning surfaced on an AI Search endpoint — a
                          non-fatal condition the customer should
                              be aware of (for example, a temporarily unavailable reranker or an index without an optimized
                              query route).
                      description: >-
                        Advisory warnings surfaced when target_qps is set on a
                        Standard endpoint.
                  required:
                    - endpoint_type
                  description: >-
                    The Endpoint resource to create. Fields other than
                    ``endpoint.name`` carry the desired configuration;
                    ``endpoint.name`` is server-assigned from ``parent`` and
                    ``endpoint_id``.
              required:
                - endpoint
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AiSearchAPI
    get:
      operationId: ai_search_list_endpoints
      summary: List AI Search endpoints in a workspace.
      tags:
        - aisearch
        - ai_search
      description: |-
        List AI Search endpoints in a workspace.

        :param parent: str
          The Workspace that owns this collection of endpoints. Format: ``workspaces/{workspace_id}``
        :param page_size: int (optional)
          Best-effort upper bound on the number of results to return. Honored as an upper bound by the shim:
          ``page_size`` only narrows the legacy backend's response, never widens it, so the practical cap is
          ``min(page_size, legacy_fixed_page_size)``.
        :param page_token: str (optional)
          Page token from a previous response. If not provided, returns the first page.

        :returns: Iterator over :class:`Endpoint`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            The Workspace that owns this collection of endpoints. Format:
            ``workspaces/{workspace_id}``
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Best-effort upper bound on the number of results to return. Honored
            as an upper bound by the shim: ``page_size`` only narrows the legacy
            backend's response, never widens it, so the practical cap is
            ``min(page_size, legacy_fixed_page_size)``.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            Page token from a previous response. If not provided, returns the
            first page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEndpointsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AiSearchAPI
  /api/2.0/ai-search/{parent}/indexes:
    post:
      operationId: ai_search_create_index
      summary: Create a new AI Search index.
      tags:
        - aisearch
        - ai_search
      description: |-
        Create a new AI Search index.

        :param parent: str
          The Endpoint where this Index will be created. Format:
          ``workspaces/{workspace_id}/endpoints/{endpoint_id}``
        :param index: :class:`Index`
          The Index resource to create. Fields other than ``index.name`` carry the desired configuration;
          ``index.name`` is server-assigned from ``parent`` and ``index_id``.
        :param index_id: str (optional)
          The user-supplied Unity Catalog table name for the Index, per AIP-133. The server composes the full
          ``Index.name`` as ``{parent}/indexes/{index_id}``. AIP-133 does not list ``index_id`` as a
          fields-may-be-required entry, so we annotate it OPTIONAL on the wire; the server still rejects empty
          values with INVALID_PARAMETER_VALUE.

        :returns: :class:`Index`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            The Endpoint where this Index will be created. Format:
            ``workspaces/{workspace_id}/endpoints/{endpoint_id}``
        - name: index_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            The user-supplied Unity Catalog table name for the Index, per
            AIP-133. The server composes the full ``Index.name`` as
            ``{parent}/indexes/{index_id}``. AIP-133 does not list ``index_id``
            as a fields-may-be-required entry, so we annotate it OPTIONAL on the
            wire; the server still rejects empty values with
            INVALID_PARAMETER_VALUE.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                index:
                  type: object
                  properties:
                    primary_key:
                      type: string
                      description: >-
                        Primary key of the index. Set on create and immutable
                        thereafter.
                    index_type:
                      type: string
                      x-enum:
                        - DELTA_SYNC
                        - DIRECT_ACCESS
                      description: >-
                        Type of index. Required on create and immutable
                        thereafter.
                    creator:
                      type: string
                      description: Creator of the index.
                    delta_sync_index_spec:
                      type: object
                      properties:
                        pipeline_type:
                          type: string
                          x-enum:
                            - CONTINUOUS
                            - TRIGGERED
                          description: >-
                            Pipeline execution mode. Required on create — the
                            backend rejects an unset value. Storage Optimized
                            endpoints accept only ``TRIGGERED``; Standard
                            endpoints accept both. No explicit ``stage`` — a
                            REQUIRED field staged below its service would be
                            dropped from combined specs while remaining in
                            ``required``, tripping the OpenAPI
                            required-vs-properties consistency check. The field
                            inherits the service's launch stage.
                        columns_to_sync:
                          type: array
                          items:
                            type: string
                          description: >-
                            [Optional] Select the columns to sync with the
                            index. If left blank, all columns from the source
                            table are synced. The primary key column and
                            embedding source or vector column are always synced.
                        embedding_source_columns:
                          type: array
                          items:
                            type: object
                            properties:
                              embedding_model_endpoint:
                                type: string
                                description: >-
                                  Name of the embedding model endpoint, used by
                                  default for both ingestion and querying.
                              model_endpoint_name_for_query:
                                type: string
                                description: >-
                                  Name of the embedding model endpoint which, if
                                  specified, is used for querying (not
                                  ingestion).
                              name:
                                type: string
                                description: Name of the source column.
                            description: >-
                              Name of an embedding source column and its
                              associated embedding model endpoint.
                          description: The columns that contain the embedding source.
                        embedding_vector_columns:
                          type: array
                          items:
                            type: object
                            properties:
                              embedding_dimension:
                                type: integer
                                description: Dimension of the embedding vector.
                              name:
                                type: string
                                description: Name of the column.
                            description: Name and dimension of an embedding vector column.
                          description: The columns that contain the embedding vectors.
                        embedding_writeback_table:
                          type: string
                          description: >-
                            [Optional] Name of the Delta table to sync the index
                            contents and computed embeddings to.
                        pipeline_id:
                          type: string
                          description: >-
                            The ID of the pipeline that is used to sync the
                            index.
                        source_table:
                          type: string
                          description: The full name of the source Delta table.
                      required:
                        - pipeline_type
                      description: >-
                        Specification for a Delta Sync index. Set when
                        ``index_type`` is ``DELTA_SYNC``.
                    direct_access_index_spec:
                      type: object
                      properties:
                        embedding_source_columns:
                          type: array
                          items:
                            type: object
                            properties:
                              embedding_model_endpoint:
                                type: string
                                description: >-
                                  Name of the embedding model endpoint, used by
                                  default for both ingestion and querying.
                              model_endpoint_name_for_query:
                                type: string
                                description: >-
                                  Name of the embedding model endpoint which, if
                                  specified, is used for querying (not
                                  ingestion).
                              name:
                                type: string
                                description: Name of the source column.
                            description: >-
                              Name of an embedding source column and its
                              associated embedding model endpoint.
                          description: The columns that contain the embedding source.
                        embedding_vector_columns:
                          type: array
                          items:
                            type: object
                            properties:
                              embedding_dimension:
                                type: integer
                                description: Dimension of the embedding vector.
                              name:
                                type: string
                                description: Name of the column.
                            description: Name and dimension of an embedding vector column.
                          description: The columns that contain the embedding vectors.
                        requested_schema_json:
                          type: string
                          description: >-
                            The index schema exactly as the user supplied it on
                            create, preserving the original type spellings (e.g.
                            ``integer``) rather than Unity Catalog's canonical
                            names (e.g. ``int``) that ``schema_json`` returns.
                        schema_json:
                          type: string
                          description: >-
                            The schema of the index in JSON format. Supported
                            types are ``integer``, ``long``, ``float``,
                            ``double``, ``boolean``, ``string``, ``date``,
                            ``timestamp``. Supported types for vector columns:
                            ``array<float>``, ``array<double>``.
                      description: >-
                        Specification for a Direct Access index. Set when
                        ``index_type`` is ``DIRECT_ACCESS``.
                    endpoint:
                      type: string
                      description: >-
                        Name of the endpoint associated with the index. Ignored
                        on create — the endpoint is taken from
                        ``CreateIndexRequest.parent``; populated only on output.
                    index_subtype:
                      type: string
                      x-enum:
                        - FULL_TEXT
                        - HYBRID
                        - VECTOR
                      description: >-
                        The subtype of the index. Set on create and immutable
                        thereafter.
                    name:
                      type: string
                      description: >-
                        Name of the AI Search index. Server-assigned full
                        resource path
                        (``workspaces/{workspace}/endpoints/{endpoint}/indexes/{index}``)
                        on output, where ``{index}`` is the index's Unity
                        Catalog table name. On create, the user-supplied UC
                        table name is conveyed via
                        ``CreateIndexRequest.index_id``; the server composes the
                        full ``name`` and returns it on the response.
                    status:
                      type: object
                      properties:
                        index_url:
                          type: string
                          description: >-
                            Index API URL used to perform operations on the
                            index.
                        indexed_row_count:
                          type: integer
                          description: Number of rows indexed.
                        message:
                          type: string
                          description: >-
                            Human-readable detail about the index's current
                            state.
                        ready:
                          type: boolean
                          description: Whether the index is ready for search.
                      description: Current status of the index.
                  required:
                    - primary_key
                    - index_type
                  description: >-
                    The Index resource to create. Fields other than
                    ``index.name`` carry the desired configuration;
                    ``index.name`` is server-assigned from ``parent`` and
                    ``index_id``.
              required:
                - index
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Index'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AiSearchAPI
    get:
      operationId: ai_search_list_indexes
      summary: List AI Search indexes on an endpoint.
      tags:
        - aisearch
        - ai_search
      description: |-
        List AI Search indexes on an endpoint.

        :param parent: str
          The Endpoint that owns this collection of indexes. Format:
          ``workspaces/{workspace_id}/endpoints/{endpoint_id}``
        :param debug_level: int (optional)
          Opt-in debug level. When set to 1 or higher, the backend computes per-index routing eligibility and
          populates ``can_use_optimized_route`` on each returned index. When unset (0), that field is left
          unpopulated and the eligibility computation is skipped. Matches the ``debug_level`` convention on
          the query path.
        :param page_size: int (optional)
          Best-effort upper bound on the number of results to return. Honored as an upper bound by the shim:
          ``page_size`` only narrows the legacy backend's response, never widens it, so the practical cap is
          ``min(page_size, legacy_fixed_page_size)``.
        :param page_token: str (optional)
          Page token from a previous response. If not provided, returns the first page.

        :returns: Iterator over :class:`Index`
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
          description: >-
            The Endpoint that owns this collection of indexes. Format:
            ``workspaces/{workspace_id}/endpoints/{endpoint_id}``
        - name: debug_level
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Opt-in debug level. When set to 1 or higher, the backend computes
            per-index routing eligibility and populates
            ``can_use_optimized_route`` on each returned index. When unset (0),
            that field is left unpopulated and the eligibility computation is
            skipped. Matches the ``debug_level`` convention on the query path.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Best-effort upper bound on the number of results to return. Honored
            as an upper bound by the shim: ``page_size`` only narrows the legacy
            backend's response, never widens it, so the practical cap is
            ``min(page_size, legacy_fixed_page_size)``.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            Page token from a previous response. If not provided, returns the
            first page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIndexesResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AiSearchAPI
