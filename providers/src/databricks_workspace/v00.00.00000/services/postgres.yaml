  /api/2.0/postgres/credentials:
    post:
      operationId: postgres_generate_database_credential
      summary: Generate OAuth credentials for a Postgres database.
      tags:
      - postgres
      description: |-
        Generate OAuth credentials for a Postgres database.

        :param endpoint: str
          The endpoint resource name for which this credential will be generated. Format:
          projects/{project_id}/branches/{branch_id}/endpoints/{endpoint_id}
        :param claims: List[:class:`RequestedClaims`] (optional)
          The returned token will be scoped to UC tables with the specified permissions.
        :param expire_time: Timestamp (optional)
          Timestamp in UTC of when this credential should expire. Must be at least 300 seconds (5 minutes) and
          at most 1 hour from the current time.
        :param ttl: Duration (optional)
          The requested time-to-live for the generated credential token. Must be at least 300 seconds (5
          minutes) and at most 3600 seconds (1 hour).

        :returns: :class:`DatabaseCredential`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                  description: 'The endpoint resource name for which this credential will be generated. Format: projects/{project_id}/branches/{branch_id}/endpoints/{endpoint_id}'
                claims:
                  type: array
                  items:
                    type: object
                    properties:
                      permission_set:
                        type: string
                        x-enum:
                        - READ_ONLY
                        description: |-
                          Create a collection of name/value pairs.

                          Example enumeration:

                          >>> class Color(Enum):
                          ...     RED = 1
                          ...     BLUE = 2
                          ...     GREEN = 3

                          Access them by:

                          - attribute access:

                            >>> Color.RED
                            <Color.RED: 1>

                          - value lookup:

                            >>> Color(1)
                            <Color.RED: 1>

                          - name lookup:

                            >>> Color['RED']
                            <Color.RED: 1>

                          Enumerations can be iterated over, and know how many members they have:

                          >>> len(Color)
                          3

                          >>> list(Color)
                          [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

                          Methods can be added to enumerations, and members can have their own
                          attributes -- see the documentation for details.
                      resources:
                        type: array
                        items:
                          type: object
                          properties:
                            table_name:
                              type: string
                  description: The returned token will be scoped to UC tables with the specified permissions.
                expire_time:
                  type: string
                  format: date-time
                  description: Timestamp in UTC of when this credential should expire. Must be at least 300 seconds (5 minutes)
                    and at most 1 hour from the current time.
                ttl:
                  type: string
                  description: The requested time-to-live for the generated credential token. Must be at least 300 seconds
                    (5 minutes) and at most 3600 seconds (1 hour).
              required:
              - endpoint
      responses:
