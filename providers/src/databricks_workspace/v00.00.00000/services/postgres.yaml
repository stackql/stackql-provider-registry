      summary: Creates a new Postgres role in the branch.
      tags:
      - postgres
      description: |-
        Creates a new Postgres role in the branch.

        :param parent: str
          The Branch where this Role is created. Format: projects/{project_id}/branches/{branch_id}
        :param role: :class:`Role`
          The desired specification of a Role.
        :param replace_existing: bool (optional)
          If true, update the role if it already exists instead of returning an error.

          When the role already exists, the provided ``role`` spec fully replaces the existing one:
          ``membership_roles`` is overwritten, not merged. Leaving ``membership_roles`` empty clears all of
          the role's existing memberships, including ``DATABRICKS_SUPERUSER``. Always send the complete
          desired list of memberships when using this field.
        :param role_id: str (optional)
          The ID to use for the Role, which will become the final component of the role's resource name. This
          ID becomes the role in Postgres.

          This value should be 4-63 characters, and valid characters are lowercase letters, numbers, and
          hyphens, as defined by RFC 1123.

          If role_id is not specified in the request, it is generated automatically.

        :returns: :class:`Operation`
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: 'The `project_id` segment of the `parent` resource name (`projects/{project_id}/branches/{branch_id}`).
          The Branch where this Role is created. Format: projects/{project_id}/branches/{branch_id}'
      - name: branch_id
        in: path
        required: true
        schema:
          type: string
        description: 'The `branch_id` segment of the `parent` resource name (`projects/{project_id}/branches/{branch_id}`).
          The Branch where this Role is created. Format: projects/{project_id}/branches/{branch_id}'
      - name: replace_existing
        in: query
        required: false
        schema:
          type: boolean
        description: 'If true, update the role if it already exists instead of returning an error. When the role already exists,
          the provided ``role`` spec fully replaces the existing one: ``membership_roles`` is overwritten, not merged. Leaving
          ``membership_roles`` empty clears all of the role''s existing memberships, including ``DATABRICKS_SUPERUSER``. Always
          send the complete desired list of memberships when using this field.'
      - name: role_id
        in: query
        required: false
        schema:
          type: string
        description: The ID to use for the Role, which will become the final component of the role's resource name. This ID
          becomes the role in Postgres. This value should be 4-63 characters, and valid characters are lowercase letters,
          numbers, and hyphens, as defined by RFC 1123. If role_id is not specified in the request, it is generated automatically.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                create_time:
                  type: string
                  format: date-time
                name:
                  type: string
                  description: 'Output only. The full resource path of the role. Format: projects/{project_id}/branches/{branch_id}/roles/{role_id}'
                parent:
                  type: string
                  description: 'The Branch where this Role exists. Format: projects/{project_id}/branches/{branch_id}'
                role_id:
                  type: string
                  description: The part of the name, chosen by the user when the resource was created.
                spec:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        bypassrls:
                          type: boolean
                        createdb:
                          type: boolean
                        createrole:
                          type: boolean
                      description: |-
                        Attributes that can be granted to a Postgres role. We are only implementing a subset for now,
                            see xref: https://www.postgresql.org/docs/16/sql-createrole.html The values follow Postgres
                            keyword naming e.g. CREATEDB, BYPASSRLS, etc. which is why they don't include typical
                            underscores between words.
                    auth_method:
                      type: string
                      x-enum:
                      - LAKEBASE_OAUTH_V1
                      - NO_LOGIN
                      - PG_PASSWORD_SCRAM_SHA_256
                      description: 'Controls how the Postgres role authenticates when a client opens a database connection.
                        Supported values: - LAKEBASE_OAUTH_V1: the role authenticates by presenting a Databricks OAuth access
                        token derived from the backing managed identity (the Databricks user, service principal, or group
                        named by the role''s ``postgres_role``). No static password exists for roles using this method. -
                        PG_PASSWORD_SCRAM_SHA_256: the role authenticates with a Postgres password verified server-side using
                        the SCRAM-SHA-256 mechanism. Lakebase generates a password for the role. - NO_LOGIN: the role cannot
                        open a Postgres session at all. Useful for roles that exist only to own objects or to aggregate privileges
                        that are then granted to other, loginable roles. If auth_method is left unspecified, a meaningful
                        authentication method is derived from the identity_type: - For the managed identities, OAUTH is used.
                        - For the regular postgres roles, authentication based on postgres passwords is used. NOTE: for the
                        Databricks identity type GROUP, LAKEBASE_OAUTH_V1 is the default auth method (group can login as well).'
                    identity_type:
                      type: string
                      x-enum:
                      - GROUP
                      - SERVICE_PRINCIPAL
                      - USER
                      description: 'The type of role. When specifying a managed-identity, the chosen role_id must be a valid:
                        - application ID for SERVICE_PRINCIPAL - user email for USER - group name for GROUP'
                    membership_roles:
                      type: array
                      items:
                        type: string
                        x-enum:
                        - DATABRICKS_SUPERUSER
                        description: Roles that the DatabaseInstanceRole can be a member of.
                      description: An enum value for a standard role that this role is a member of.
                    postgres_role:
                      type: string
                      description: 'The name of the Postgres role. This expects a valid Postgres identifier as specified in
                        the link below. https://www.postgresql.org/docs/current/sql-syntax-lexical.html#SQL-SYNTAX-IDENTIFIERS
                        Required when creating the Role. If you wish to create a Postgres Role backed by a managed Databricks
                        identity, then postgres_role must be one of the following: 1. user email for IdentityType.USER 2.
                        app ID for IdentityType.SERVICE_PRINCIPAL 3. group name for IdentityType.GROUP'
                  description: The spec contains the role configuration, including identity type, authentication method, and
                    role attributes.
                status:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        bypassrls:
                          type: boolean
                        createdb:
                          type: boolean
                        createrole:
                          type: boolean
                      description: |-
                        Attributes that can be granted to a Postgres role. We are only implementing a subset for now,
                            see xref: https://www.postgresql.org/docs/16/sql-createrole.html The values follow Postgres
                            keyword naming e.g. CREATEDB, BYPASSRLS, etc. which is why they don't include typical
                            underscores between words.
                    auth_method:
                      type: string
                      x-enum:
                      - LAKEBASE_OAUTH_V1
                      - NO_LOGIN
                      - PG_PASSWORD_SCRAM_SHA_256
                      description: How the role is authenticated when connecting to Postgres.
                    identity_type:
                      type: string
                      x-enum:
                      - GROUP
                      - SERVICE_PRINCIPAL
                      - USER
                      description: The type of the role.
                    membership_roles:
                      type: array
                      items:
                        type: string
                        x-enum:
                        - DATABRICKS_SUPERUSER
                        description: Roles that the DatabaseInstanceRole can be a member of.
                      description: An enum value for a standard role that this role is a member of.
                    postgres_role:
                      type: string
                      description: The name of the Postgres role.
                    role_id:
                      type: string
                      description: Part of the resource name.
                  description: Current status of the role, including its identity type, authentication method, and role attributes.
                update_time:
                  type: string
                  format: date-time
