        is_protected:
          type: boolean
          description: Whether the initial default branch should be protected from deletion.
      description: Configuration for the initial default branch created during project creation.
    InitialDatabaseSpec:
      type: object
      properties:
        postgres_database:
          type: string
          description: The name of the Postgres database. This expects a valid Postgres identifier as specified in the link
            below. https://www.postgresql.org/docs/current/sql-syntax-lexical.html#SQL-SYNTAX-IDENTIFIERS
      description: |-
        Configuration for the initial Postgres database created inside the initial branch for a newly
            created project. If omitted, the initial branch still gets an initial database with name
            ``databricks_postgres``. The initial database is always owned by the initial Postgres role
            (whether caller-provided via ``initial_role_spec`` or defaulted to the caller's identity).
    InitialEndpointSpec:
      type: object
      properties:
        autoscaling_limit_max_cu:
          type: number
          description: The maximum number of Compute Units for the initial endpoint.
        autoscaling_limit_min_cu:
          type: number
          description: The minimum number of Compute Units for the initial endpoint.
        group:
          $ref: '#/components/schemas/EndpointGroupSpec'
          description: Settings for HA configuration of the endpoint.
        no_suspension:
          type: boolean
          description: When set to true, explicitly disables automatic suspension (never suspend). Should be set to true when
            provided. Mutually exclusive with ``suspend_timeout_duration``.
        suspend_timeout_duration:
          type: string
          description: Duration of inactivity after which the initial endpoint is automatically suspended. If specified, should
            be between 60s and 604800s (1 minute to 1 week). Mutually exclusive with ``no_suspension``.
      description: Configuration for the initial Read/Write endpoint created during project creation.
    InitialRoleSpec:
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/RoleAttributes'
          description: The desired API-exposed Postgres role attribute to associate with the role. Optional.
        auth_method:
          $ref: '#/components/schemas/RoleAuthMethod'
          description: 'Controls how the Postgres role authenticates when a client opens a database connection. Supported
            values: - LAKEBASE_OAUTH_V1: the role authenticates by presenting a Databricks OAuth access token derived from
            the backing managed identity (the Databricks user, service principal, or group named by the role''s ``postgres_role``).
            No static password exists for roles using this method. - PG_PASSWORD_SCRAM_SHA_256: the role authenticates with
            a Postgres password verified server-side using the SCRAM-SHA-256 mechanism. Lakebase generates a password for
            the role. - NO_LOGIN: the role cannot open a Postgres session at all. Useful for roles that exist only to own
            objects or to aggregate privileges that are then granted to other, loginable roles. If auth_method is left unspecified,
            a meaningful authentication method is derived from the identity_type: - For the managed identities, OAUTH is used.
            - For the regular postgres roles, authentication based on postgres passwords is used. NOTE: for the Databricks
            identity type GROUP, LAKEBASE_OAUTH_V1 is the default auth method (group can login as well).'
        identity_type:
          $ref: '#/components/schemas/RoleIdentityType'
          description: 'The type of role. When specifying a managed-identity, the chosen role_id must be a valid: - application
            ID for SERVICE_PRINCIPAL - user email for USER - group name for GROUP'
        membership_roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleMembershipRole'
          description: An enum value for a standard role that this role is a member of.
        postgres_role:
          type: string
          description: 'The name of the Postgres role. This expects a valid Postgres identifier as specified in the link below.
            https://www.postgresql.org/docs/current/sql-syntax-lexical.html#SQL-SYNTAX-IDENTIFIERS If you wish to create a
            Postgres Role backed by a managed Databricks identity, then postgres_role must be one of the following: 1. user
            email for IdentityType.USER 2. app ID for IdentityType.SERVICE_PRINCIPAL 3. group name for IdentityType.GROUP'
      description: |-
        Configuration for the initial Postgres role created inside the initial branch for a newly
            created project. If omitted, the default branch still gets an initial Postgres role
            corresponding to the caller of the API endpoint.
