                claims:
                  type: array
                  items:
                    type: object
                    properties:
                      permission_set:
                        type: string
                        x-enum:
                        - READ_ONLY
                        description: |-
                          Create a collection of name/value pairs.

                          Example enumeration:

                          >>> class Color(Enum):
                          ...     RED = 1
                          ...     BLUE = 2
                          ...     GREEN = 3

                          Access them by:

                          - attribute access:

                            >>> Color.RED
                            <Color.RED: 1>

                          - value lookup:

                            >>> Color(1)
                            <Color.RED: 1>

                          - name lookup:

                            >>> Color['RED']
                            <Color.RED: 1>

                          Enumerations can be iterated over, and know how many members they have:

                          >>> len(Color)
                          3

                          >>> list(Color)
                          [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

                          Methods can be added to enumerations, and members can have their own
                          attributes -- see the documentation for details.
                      resources:
                        type: array
                        items:
                          type: object
                          properties:
                            table_name:
                              type: string
                  description: The returned token will be scoped to UC tables with the specified permissions.
                expire_time:
                  type: string
                  format: date-time
                  description: Timestamp in UTC of when this credential should expire. Must be at least 300 seconds (5 minutes)
                    and at most 1 hour from the current time.
                group_name:
                  type: string
                  description: Databricks workspace group name. When provided, credentials are generated with permissions
                    scoped to this group.
                ttl:
                  type: string
                  description: The requested time-to-live for the generated credential token. Must be at least 300 seconds
                    (5 minutes) and at most 3600 seconds (1 hour).
              required:
              - endpoint
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseCredential'
        default:
          description: Error response
          content:
            application/json:
              schema:
