        status:
          $ref: '#/components/schemas/EndpointStatus'
          description: Current operational status of the compute endpoint.
        uid:
          type: string
          description: System-generated unique ID for the endpoint.
        update_time:
          type: string
          format: date-time
          description: A timestamp indicating when the compute endpoint was last updated.
    EndpointGroupSpec:
      type: object
      properties:
        min:
          type: integer
        max:
          type: integer
          description: The maximum number of computes in the endpoint group. Currently, this must be equal to min. Set to
            1 for single compute endpoints, to disable HA. To manually suspend all computes in an endpoint group, set disabled
            to true on the EndpointSpec.
        enable_readable_secondaries:
          type: boolean
          description: Whether to allow read-only connections to read-write endpoints. Only relevant for read-write endpoints
            where size.max > 1.
      required:
      - min
      - max
    EndpointGroupStatus:
      type: object
      properties:
        min:
          type: integer
        max:
          type: integer
          description: The maximum number of computes in the endpoint group. Currently, this must be equal to min. Set to
            1 for single compute endpoints, to disable HA. To manually suspend all computes in an endpoint group, set disabled
            to true on the EndpointSpec.
        enable_readable_secondaries:
          type: boolean
          description: Whether read-only connections to read-write endpoints are allowed. Only relevant if read replicas are
            configured by specifying size.max > 1.
      required:
      - min
      - max
    EndpointHosts:
      type: object
      properties:
        host:
          type: string
          description: The hostname to connect to this endpoint. For read-write endpoints, this is a read-write hostname which
            connects to the primary compute. For read-only endpoints, this is a read-only hostname which allows read-only
            operations.
        read_only_host:
          type: string
          description: An optionally defined read-only host for the endpoint, without pooling. For read-only endpoints, this
            attribute is always defined and is equivalent to host. For read-write endpoints, this attribute is defined if
            the enclosing endpoint is a group with greater than 1 computes configured, and has readable secondaries enabled.
        read_only_pooled_host:
          type: string
          description: The read-only hostname of the compute endpoint, with pooling. This attribute is always defined for
            read-only endpoints, and may be defined for read-write endpoints if configured with read replicas and allow read-only
            connections.
        read_write_pooled_host:
          type: string
          description: The read-write hostname of the compute endpoint, with pooling. This attribute is only defined for read-write
            endpoints.
      description: Encapsulates various hostnames (r/w or r/o, pooled or not) for an endpoint.
    EndpointOperationMetadata:
      type: object
      properties: {}
    EndpointSettings:
      type: object
      properties:
        pg_settings:
          type: object
          description: A raw representation of Postgres settings.
      description: A collection of settings for a compute endpoint.
    EndpointSpec:
      type: object
      properties:
        endpoint_type:
          $ref: '#/components/schemas/EndpointType'
        autoscaling_limit_max_cu:
          type: number
          description: The maximum number of Compute Units. The maximum value is 64. The difference between the minimum and
            maximum Compute Units (max - min) must not exceed 16.
        autoscaling_limit_min_cu:
          type: number
          description: The minimum number of Compute Units. Minimum value is 0.5.
        disabled:
          type: boolean
          description: Whether to restrict connections to the compute endpoint. Enabling this option schedules a suspend compute
            operation. A disabled compute endpoint cannot be enabled by a connection or console action.
        group:
          $ref: '#/components/schemas/EndpointGroupSpec'
          description: Settings for optional HA configuration of the endpoint. If unspecified, the endpoint defaults to non
            HA settings, with a single compute backing the endpoint (and no readable secondaries for Read/Write endpoints).
        no_suspension:
          type: boolean
          description: When set to true, explicitly disables automatic suspension (never suspend). Should be set to true when
            provided. Mutually exclusive with ``suspend_timeout_duration``. When updating, use ``spec.suspension`` in the
            update_mask.
        settings:
          $ref: '#/components/schemas/EndpointSettings'
        suspend_timeout_duration:
          type: string
          description: Duration of inactivity after which the compute endpoint is automatically suspended. If specified should
            be between 60s and 604800s (1 minute to 1 week). Mutually exclusive with ``no_suspension``. When updating, use
            ``spec.suspension`` in the update_mask.
      required:
      - endpoint_type
    EndpointStatus:
      type: object
      properties:
        autoscaling_limit_max_cu:
          type: number
        autoscaling_limit_min_cu:
          type: number
          description: The minimum number of Compute Units.
        current_state:
          $ref: '#/components/schemas/EndpointStatusState'
        disabled:
          type: boolean
          description: Whether to restrict connections to the compute endpoint. Enabling this option schedules a suspend compute
            operation. A disabled compute endpoint cannot be enabled by a connection or console action.
        endpoint_id:
          type: string
          description: Part of the resource name.
        endpoint_type:
          $ref: '#/components/schemas/EndpointType'
          description: The endpoint type. A branch can only have one READ_WRITE endpoint.
        group:
          $ref: '#/components/schemas/EndpointGroupStatus'
          description: Details on the HA configuration of the endpoint.
        hosts:
          $ref: '#/components/schemas/EndpointHosts'
          description: Contains host information for connecting to the endpoint.
        last_active_time:
          type: string
          format: date-time
          description: A timestamp indicating when the compute endpoint was last active.
        pending_state:
          $ref: '#/components/schemas/EndpointStatusState'
        settings:
          $ref: '#/components/schemas/EndpointSettings'
        suspend_timeout_duration:
          type: string
          description: Duration of inactivity after which the compute endpoint is automatically suspended.
    ForwardEtlConfig:
      type: object
