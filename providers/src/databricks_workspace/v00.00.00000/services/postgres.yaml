components:
  schemas:
    Branch:
      type: object
      properties:
        branch_id:
          type: string
        create_time:
          type: string
          format: date-time
          description: A timestamp indicating when the branch was created.
        name:
          type: string
          description: 'Output only. The full resource path of the branch. Format: projects/{project_id}/branches/{branch_id}'
        parent:
          type: string
          description: 'The project containing this branch (API resource hierarchy). Format: projects/{project_id} Note: This
            field indicates where the branch exists in the resource hierarchy. For point-in-time branching from another branch,
            see ``status.source_branch``.'
        spec:
          $ref: '#/components/schemas/BranchSpec'
          description: The spec contains the branch configuration.
        status:
          $ref: '#/components/schemas/BranchStatus'
          description: The current status of a Branch.
        uid:
          type: string
          description: System-generated unique ID for the branch.
        update_time:
          type: string
          format: date-time
          description: A timestamp indicating when the branch was last updated.
    BranchOperationMetadata:
      type: object
      properties: {}
    BranchSpec:
      type: object
      properties:
        expire_time:
          type: string
          format: date-time
        is_protected:
          type: boolean
          description: When set to true, protects the branch from deletion and reset. Associated compute endpoints and the
            project cannot be deleted while the branch is protected.
        no_expiry:
          type: boolean
          description: Explicitly disable expiration. When set to true, the branch will not expire. If set to false, the request
            is invalid; provide either ttl or expire_time instead. Mutually exclusive with ``expire_time`` and ``ttl``. When
            updating, use ``spec.expiration`` in the update_mask.
        source_branch:
          type: string
          description: 'The name of the source branch from which this branch was created (data lineage for point-in-time recovery).
            If not specified, defaults to the project''s default branch. Format: projects/{project_id}/branches/{branch_id}'
        source_branch_lsn:
          type: string
          description: The Log Sequence Number (LSN) on the source branch from which this branch was created.
        source_branch_time:
          type: string
          format: date-time
          description: The point in time on the source branch from which this branch was created.
        ttl:
          type: string
          description: Relative time-to-live duration. When set, the branch will expire at creation_time + ttl. Mutually exclusive
            with ``expire_time`` and ``no_expiry``. When updating, use ``spec.expiration`` in the update_mask.
    BranchStatus:
      type: object
      properties:
        branch_id:
          type: string
        current_state:
          $ref: '#/components/schemas/BranchStatusState'
          description: The branch's state, indicating if it is initializing, ready for use, or archived.
        default:
          type: boolean
          description: Whether the branch is the project's default branch.
        delete_time:
          type: string
          format: date-time
          description: A timestamp indicating when the branch was deleted. Empty if the branch is not deleted.
        expire_time:
          type: string
          format: date-time
          description: Absolute expiration time for the branch. Empty if expiration is disabled.
        is_protected:
          type: boolean
          description: Whether the branch is protected.
        logical_size_bytes:
          type: integer
          description: The logical size of the branch.
        pending_state:
          $ref: '#/components/schemas/BranchStatusState'
          description: The pending state of the branch, if a state transition is in progress.
        purge_time:
          type: string
          format: date-time
          description: A timestamp indicating when the branch is scheduled to be purged. Empty if the branch is not deleted,
            otherwise set to a timestamp in the future.
        source_branch:
          type: string
          description: 'The name of the source branch from which this branch was created. Format: projects/{project_id}/branches/{branch_id}'
        source_branch_lsn:
          type: string
          description: The Log Sequence Number (LSN) on the source branch from which this branch was created.
        source_branch_time:
          type: string
          format: date-time
          description: The point in time on the source branch from which this branch was created.
        source_recovery_branch:
          type: string
          description: 'If this branch is a child of a recovery branch, this field identifies that recovery source. For non-recovery-derived
            branches this is unset. Format: projects/{project_id}/preview/recovery-branches/{recovery_branch_id}'
        state_change_time:
          type: string
          format: date-time
          description: A timestamp indicating when the ``current_state`` began.
    Catalog:
      type: object
      properties:
        catalog_id:
          type: string
        create_time:
          type: string
          format: date-time
          description: A timestamp indicating when the catalog was created.
        name:
          type: string
          description: 'Output only. The full resource path of the catalog. Format: "catalogs/{catalog_id}".'
        spec:
          $ref: '#/components/schemas/CatalogCatalogSpec'
          description: The desired state of the Catalog.
        status:
          $ref: '#/components/schemas/CatalogCatalogStatus'
          description: The observed state of the Catalog.
        uid:
          type: string
          description: System-generated unique identifier for the catalog.
        update_time:
          type: string
          format: date-time
          description: A timestamp indicating when the catalog was last updated.
    CatalogCatalogSpec:
      type: object
      properties:
        postgres_database:
          type: string
          description: The name of the Postgres database inside the specified Lakebase project and branch to be associated
            with the UC catalog. This database must already exist, unless create_database_if_missing is set to true on creation.
            A database can only be registered with one UC catalog at a time. To re-register a database with a different catalog,
            the existing catalog must be deleted first. A child branch inherits the fact of parent's registration. This means
            the same-named database in a child branch cannot be registered with a second catalog while the parent's registration
            exists. To allow registering the database of a child branch, drop and recreate the database on the child branch.
            This removes the fact of parent's registration from this branch only. Doing Point In Time Restore (PITR) prior
            to the moment before the Postgres DB was registered in the Catalog drops the fact of registration of the database.
            So the user should avoid doing so.
        branch:
          type: string
          description: 'The resource path of the branch associated with the catalog. Format: projects/{project_id}/branches/{branch_id}.'
        create_database_if_missing:
          type: boolean
          description: If set to true, the specified postgres_database is created on behalf of the calling user if it does
            not already exist. In this case, the calling user has a role created for them in Postgres if they do not already
            have one. Defaults to false, meaning that the request fails if the specified postgres_database does not already
            exist.
      required:
      - postgres_database
      description: The desired state of the Catalog.
    CatalogCatalogStatus:
      type: object
      properties:
        branch:
          type: string
          description: 'The resource path of the branch associated with the catalog. Format: projects/{project_id}/branches/{branch_id}.'
        postgres_database:
          type: string
          description: The name of the Postgres database associated with the catalog.
        project:
          type: string
          description: 'The resource path of the project associated with the catalog. Format: projects/{project_id}.'
      description: The observed state of the Catalog.
    CatalogOperationMetadata:
      type: object
      properties: {}
    CdfConfig:
      type: object
      properties:
        catalog:
          type: string
          description: The Unity Catalog catalog that replicated tables are written into. Set at creation; the CdfConfig is
            immutable.
        schema:
          type: string
          description: The Unity Catalog schema that replicated tables are written into. Set at creation; the CdfConfig is
            immutable.
        postgres_schema:
          type: string
          description: The Postgres schema this CdfConfig replicates from. Unique within the parent database. Set at creation;
            the CdfConfig is immutable.
        cdf_config_id:
          type: string
          description: The user-specified id; equals the final segment of ``name``. Defaults to the Postgres schema name for
            configs without an explicit id.
        create_time:
          type: string
          format: date-time
          description: When the CdfConfig was created.
        name:
          type: string
          description: 'Output only. The full resource name of the CdfConfig. Format: projects/{project}/branches/{branch}/databases/{database}/cdf-configs/{cdf_config}'
      required:
      - catalog
      - schema
      - postgres_schema
      description: |-
        A Lakebase CDF configuration (CdfConfig): one per Postgres schema per database, replicating that
            schema's tables into a Unity Catalog schema. Immutable once created.
    CdfConfigOperationMetadata:
      type: object
      properties: {}
      description: |-
        Metadata for CdfConfig long-running operations. Intentionally empty today; fields (e.g.
            progress) may be added as the operation contract grows.
    CdfStatus:
      type: object
      properties:
        committed_lsn:
          type: string
          description: The high-watermark Log Sequence Number (LSN) committed to Delta Lake.
        create_time:
          type: string
          format: date-time
          description: When replication for this table was first established.
        last_sync_time:
          type: string
          format: date-time
          description: The last time changes for this table were written to Delta Lake.
        name:
          type: string
          description: 'Output only. The full resource name of the CdfStatus. Format: projects/{project}/branches/{branch}/databases/{database}/cdf-configs/{cdf_config}/cdf-statuses/{cdf_status}
            The {cdf_status} segment is the Postgres table name.'
        postgres_table:
          type: string
          description: The Postgres table being replicated.
        state:
          $ref: '#/components/schemas/CdfState'
          description: The current replication state of this table.
        status_detail:
          type: string
          description: Human-readable detail for the current state (e.g. the skip/error reason). Empty for healthy states.
        uc_table:
          type: string
          description: The Unity Catalog table receiving replicated data.
      description: |-
        The read-only replication status of a single Postgres table replicated under a CdfConfig. One
            status exists per replicated table. It is created automatically and cannot be modified.
    ComputeInstance:
      type: object
      properties:
        name:
          type: string
        compute_instance_id:
          type: string
          description: The unique ID for this compute.
        compute_host:
          type: string
          description: A host scoped directly to the enclosing compute. This host is guaranteed to resolve to the specific
            compute instance.
        current_state:
          $ref: '#/components/schemas/ComputeInstanceComputeState'
          description: The current state of the compute.
        pending_state:
          $ref: '#/components/schemas/ComputeInstanceComputeState'
          description: The desired pending state of the compute, if a state transition is in progress.
        role:
          $ref: '#/components/schemas/ComputeInstanceComputeType'
          description: The role of this compute within the endpoint.
        start_time:
          type: string
          format: date-time
          description: A timestamp indicating when the compute was last started.
        suspend_time:
          type: string
          format: date-time
          description: A timestamp indicating when the compute was last suspended.
      required:
      - name
      - compute_instance_id
    DailySchedule:
      type: object
      properties:
        hour:
          type: integer
          description: The hour of the day, in UTC, at which to take the snapshot, in [0, 23].
      description: Take a snapshot once per day, at the configured hour.
    DataApi:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
          description: A timestamp indicating when the Data API was first enabled.
        name:
          type: string
          description: 'Resource name: projects/{project_id}/branches/{branch_id}/databases/{database_id}/data-api'
        parent:
          type: string
          description: 'The database containing this Data API configuration. Format: projects/{project_id}/branches/{branch_id}/databases/{database_id}'
        spec:
          $ref: '#/components/schemas/DataApiDataApiSpec'
          description: The desired Data API configuration.
        status:
          $ref: '#/components/schemas/DataApiDataApiStatus'
          description: The observed Data API state (read-only).
        update_time:
          type: string
          format: date-time
          description: A timestamp indicating when the Data API configuration was last updated.
      description: |-
        DataApi represents the Data API (PostgREST) configuration for a Database. At most one DataApi
            per database. Create enables Data API, Delete disables it.
    DataApiDataApiSpec:
      type: object
      properties:
        db_aggregates_enabled:
          type: boolean
          description: 'Enable aggregate functions (count, sum, avg, etc.) in Data API responses. Default: true.'
        db_anon_role:
          type: string
          description: 'The PostgreSQL role used for unauthenticated (anonymous) requests. Must be a valid PostgreSQL role
            name (1-63 chars, [a-zA-Z_][a-zA-Z0-9_$]*). Default: "anonymous".'
        db_extra_search_path:
          type: array
          items:
            type: string
          description: Additional schemas to include in the PostgreSQL search path. Each entry must be a valid PostgreSQL
            schema name.
        db_max_rows:
          type: integer
          description: Maximum number of rows returned in a single Data API response. Must be a positive integer.
        db_schemas:
          type: array
          items:
            type: string
          description: 'Database schemas exposed through the Data API. Each entry must be a valid PostgreSQL schema name (1-63
            chars, [a-zA-Z_][a-zA-Z0-9_$]*). Maximum 100 entries. Default: ["public"].'
        jwt_cache_max_lifetime:
          type: string
          description: Maximum lifetime for cached JWT tokens. Zero duration disables caching.
        jwt_role_claim_key:
          type: string
          description: 'JSON path to the role claim in JWT tokens (e.g., ".sub"). Default: ".sub".'
        openapi_mode:
          $ref: '#/components/schemas/OpenApiMode'
          description: OpenAPI documentation mode for the Data API endpoint.
        server_cors_allowed_origins:
          type: array
          items:
            type: string
          description: Allowed origins for CORS requests. Each entry should be a valid origin URL, or use "*" to allow all
            origins.
        server_timing_enabled:
          type: boolean
          description: Enable the Server-Timing header in Data API responses.
      description: Desired PostgREST configuration (input).
    DataApiDataApiStatus:
      type: object
