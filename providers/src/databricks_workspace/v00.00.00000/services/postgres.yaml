          type: string
        description: 'The `project_id` segment of the `parent` resource name (`projects/{project_id}`). The project in which
          to create the snapshot. Format: projects/{project_id}'
      - name: snapshot_id
        in: query
        required: true
        schema:
          type: string
        description: Client-chosen ID for the snapshot. It becomes the final segment of the snapshot resource name and cannot
          be changed after creation.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                create_time:
                  type: string
                  format: date-time
                  description: When the snapshot was created.
                name:
                  type: string
                  description: 'The resource name of the snapshot. Format: projects/{project_id}/snapshots/{snapshot_id}'
                snapshot_id:
                  type: string
                  description: The user-chosen ID; the final segment of ``name``.
                spec:
                  type: object
                  properties:
                    source_branch:
                      type: string
                      description: 'The source branch to snapshot. Format: projects/{project_id}/branches/{branch_id}'
                    expire_time:
                      type: string
                      format: date-time
                      description: Absolute time at which the snapshot is deleted. Mutually exclusive with ``ttl`` and ``no_expiry``.
                    no_expiry:
                      type: boolean
                      description: If true, the snapshot never expires. Mutually exclusive with ``ttl`` and ``expire_time``.
                    source_branch_lsn:
                      type: string
                      description: LSN to snapshot from, e.g. ``16/B374D848``. Mutually exclusive with ``source_branch_time``.
                    source_branch_time:
                      type: string
                      format: date-time
                      description: Timestamp to snapshot from. Mutually exclusive with ``source_branch_lsn``.
                    ttl:
                      type: string
                      description: Time-to-live. The snapshot expires this long after it is created. Mutually exclusive with
                        ``expire_time`` and ``no_expiry``. Reads report the resolved absolute ``expire_time`` instead.
                  required:
                  - source_branch
