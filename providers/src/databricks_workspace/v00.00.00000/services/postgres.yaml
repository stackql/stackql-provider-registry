  /api/2.0/postgres/synced_tables:
    post:
      operationId: postgres_create_synced_table
      summary: Create a Synced Table.
      tags:
      - postgres
      description: |-
        Create a Synced Table.

        :param synced_table: :class:`SyncedTable`
        :param synced_table_id: str
          The ID to use for the Synced Table. This becomes the final component of the SyncedTable's resource
          name. ID is required and is the synced table name, containing (catalog, schema, table) tuple.
          Elements of the tuple are the UC entity names.

          Example: "{catalog}.{schema}.{table}"

          synced_table_id represents both of the following:

          1. An online VIEW virtual table in the Unity Catalog accessible via the Lakehouse Federation.
          2. Postgres table named "{table}" in schema "{schema}" in the connected Postgres database

        :returns: :class:`Operation`
      parameters:
      - name: synced_table_id
        in: query
        required: true
        schema:
          type: string
        description: 'The ID to use for the Synced Table. This becomes the final component of the SyncedTable''s resource
          name. ID is required and is the synced table name, containing (catalog, schema, table) tuple. Elements of the tuple
          are the UC entity names. Example: "{catalog}.{schema}.{table}" synced_table_id represents both of the following:
          1. An online VIEW virtual table in the Unity Catalog accessible via the Lakehouse Federation. 2. Postgres table
          named "{table}" in schema "{schema}" in the connected Postgres database'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                synced_table:
                  type: object
                  properties:
                    create_time:
                      type: string
                      format: date-time
                    name:
                      type: string
                      description: Output only. The Full resource name of the synced table in Postgres where (catalog, schema,
                        table) are the UC entity names. Format "synced_tables/{catalog}.{schema}.{table}" For the corresponding
                        source table in the Unity catalog look for the "source_table_full_name" attribute.
                    spec:
                      type: object
                      properties:
                        accelerated_sync:
                          type: boolean
                        branch:
                          type: string
                          description: 'The full resource name the branch associated with the table. Format: "projects/{project_id}/branches/{branch_id}".'
                        create_database_objects_if_missing:
                          type: boolean
                          description: If true, the synced table's logical database and schema resources in PG will be created
                            if they do not already exist. The request will fail if this is false and the database/schema do
                            not exist. Defaults to true if omitted.
                        existing_pipeline_id:
                          type: string
                          description: ID of an existing pipeline to bin-pack this synced table into. At most one of existing_pipeline_id
                            and new_pipeline_spec should be defined. The pipeline used for the synced table is returned via
                            the top level pipeline_id attribute.
                        extra_columns:
                          type: array
                          items:
                            type: object
                            properties:
                              column_name:
                                type: string
                                description: Name of the column.
                              column_type:
                                type: string
                                description: PostgreSQL type of the column, for example "tsvector" or "vector(1024)".
                              compute:
                                type: string
                                description: SQL expression used to compute the column's value, for example "to_tsvector('english',
                                  content)".
                              maintenance:
                                type: string
                                x-enum:
                                - DEFAULT_VALUE
                                - STORED_GENERATED
                                description: How the column's value is populated and kept up to date.
                            required:
                            - column_name
                            - column_type
                            description: An extra PostgreSQL column to add to the synced table.
                          description: Extra PostgreSQL-only columns to add to the synced table.
                        extra_index_definitions:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Name of the index as it will appear in PostgreSQL.
                              definition:
                                type: string
                                description: 'The definition portion of a CREATE INDEX statement, placed after ON table_name.
                                  For example: USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 64).'
                              creation_point:
                                type: string
                                x-enum:
                                - CREATION_POINT_AFTER_DATA_LOAD
                                description: When the index should be created relative to the initial data load.
                            required:
