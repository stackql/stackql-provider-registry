    ListSnapshotsResponse:
      type: object
      properties:
        next_page_token:
          type: string
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
          description: The snapshots in the project.
    MonthlySchedule:
      type: object
      properties:
        day:
          type: integer
          description: The day of the month on which to take the snapshot, in [1, 31]. In shorter months the snapshot is taken
            on the last day instead (day 31 runs on Feb 28 or 29, and on Apr 30), so every month gets exactly one snapshot.
        hour:
          type: integer
          description: The hour of the day, in UTC, at which to take the snapshot, in [0, 23].
      required:
      - day
      description: Take a snapshot once per month, on the configured day at the configured hour.
    NewPipelineSpec:
      type: object
      properties:
        budget_policy_id:
          type: string
        pipeline_channel:
          $ref: '#/components/schemas/NewPipelineSpecPipelineChannel'
          description: Release channel of the underlying pipeline's runtime. Some source table configurations (e.g., read-time
            CDF) require PREVIEW. Defaults to CURRENT if not specified.
        storage_catalog:
          type: string
          description: UC catalog for the pipeline to store intermediate files (checkpoints, event logs etc). This needs to
            be a standard catalog where the user has permissions to create Delta tables.
        storage_schema:
          type: string
          description: UC schema for the pipeline to store intermediate files (checkpoints, event logs etc). This needs to
            be in the standard catalog where the user has permissions to create Delta tables.
    Operation:
      type: object
      properties:
        done:
          type: boolean
          description: If the value is ``false``, it means the operation is still in progress. If ``true``, the operation
            is completed, and either ``error`` or ``response`` is available.
        error:
          $ref: '#/components/schemas/DatabricksServiceExceptionWithDetailsProto'
          description: The error result of the operation in case of failure or cancellation.
        metadata:
          type: object
          description: Service-specific metadata associated with the operation. It typically contains progress information
            and common metadata such as create time. Some services might not provide such metadata.
        name:
          type: string
          description: The server-assigned name, which is only unique within the same service that originally returns it.
            If you use the default HTTP mapping, the ``name`` should be a resource name ending with ``operations/{unique_id}``.
        response:
          type: object
          description: The normal, successful response of the operation.
      description: This resource represents a long-running operation that is the result of a network API call.
    Project:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
        delete_time:
          type: string
          format: date-time
          description: A timestamp indicating when the project was soft-deleted. Empty if the project is not deleted, otherwise
            set to a timestamp in the past.
        initial_branch_spec:
          $ref: '#/components/schemas/InitialBranchSpec'
          description: Configuration for the initial default branch created as part of project creation. Allows overriding
