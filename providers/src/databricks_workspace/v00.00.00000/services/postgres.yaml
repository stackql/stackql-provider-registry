openapi: 3.0.0
info:
  title: Databricks Postgres API (workspace)
  description: OpenAPI specification for the Databricks postgres service (workspace-level APIs), generated from the Databricks
    Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-07-31'
  x-stackql-sdk-namespace: databricks.sdk.service.postgres
servers:
- url: https://{deployment_name}.cloud.databricks.com
  variables:
    deployment_name:
      description: The Databricks Workspace Deployment Name
      default: dbc-abcd0123-a1bc
paths:
  /api/2.0/postgres/{parent}/branches:
    post:
      operationId: postgres_create_branch
      summary: Creates a new database branch in the project.
      tags:
      - postgres
      description: |-
        Creates a new database branch in the project.

        :param parent: str
          The Project where this Branch will be created. Format: projects/{project_id}
        :param branch: :class:`Branch`
          The Branch to create.
        :param branch_id: str
          The ID to use for the Branch. This becomes the final component of the branch's resource name. The ID
          is required and must be 1-63 characters long, start with a lowercase letter, and contain only
          lowercase letters, numbers, and hyphens. For example, ``development`` becomes
          ``projects/my-app/branches/development``.
        :param replace_existing: bool (optional)
          If true, update the branch if it already exists instead of returning an error.

        :returns: :class:`Operation`
      parameters:
      - name: parent
        in: path
        required: true
        schema:
          type: string
        description: 'The Project where this Branch will be created. Format: projects/{project_id}'
      - name: branch_id
        in: query
        required: true
        schema:
          type: string
        description: The ID to use for the Branch. This becomes the final component of the branch's resource name. The ID
          is required and must be 1-63 characters long, start with a lowercase letter, and contain only lowercase letters,
          numbers, and hyphens. For example, ``development`` becomes ``projects/my-app/branches/development``.
      - name: replace_existing
        in: query
        required: false
        schema:
          type: boolean
        description: If true, update the branch if it already exists instead of returning an error.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch:
                  type: object
                  properties:
                    branch_id:
                      type: string
                    create_time:
                      type: string
                      format: date-time
                      description: A timestamp indicating when the branch was created.
                    name:
                      type: string
                      description: 'Output only. The full resource path of the branch. Format: projects/{project_id}/branches/{branch_id}'
                    parent:
                      type: string
                      description: 'The project containing this branch (API resource hierarchy). Format: projects/{project_id}
                        Note: This field indicates where the branch exists in the resource hierarchy. For point-in-time branching
                        from another branch, see ``status.source_branch``.'
                    spec:
                      type: object
                      properties:
                        expire_time:
                          type: string
                          format: date-time
                        is_protected:
                          type: boolean
                          description: When set to true, protects the branch from deletion and reset. Associated compute endpoints
                            and the project cannot be deleted while the branch is protected.
                        no_expiry:
                          type: boolean
                          description: Explicitly disable expiration. When set to true, the branch will not expire. If set
                            to false, the request is invalid; provide either ttl or expire_time instead. Mutually exclusive
                            with ``expire_time`` and ``ttl``. When updating, use ``spec.expiration`` in the update_mask.
                        source_branch:
                          type: string
                          description: 'The name of the source branch from which this branch was created (data lineage for
                            point-in-time recovery). If not specified, defaults to the project''s default branch. Format:
                            projects/{project_id}/branches/{branch_id}'
                        source_branch_lsn:
                          type: string
                          description: The Log Sequence Number (LSN) on the source branch from which this branch was created.
                        source_branch_time:
                          type: string
                          format: date-time
                          description: The point in time on the source branch from which this branch was created.
                        ttl:
                          type: string
                          description: Relative time-to-live duration. When set, the branch will expire at creation_time +
                            ttl. Mutually exclusive with ``expire_time`` and ``no_expiry``. When updating, use ``spec.expiration``
                            in the update_mask.
                      description: The spec contains the branch configuration.
                    status:
                      type: object
                      properties:
                        branch_id:
                          type: string
                        current_state:
                          type: string
                          x-enum:
                          - ARCHIVED
                          - DELETED
                          - IMPORTING
                          - INIT
                          - READY
                          - RESETTING
                          description: The branch's state, indicating if it is initializing, ready for use, or archived.
                        default:
                          type: boolean
                          description: Whether the branch is the project's default branch.
                        delete_time:
                          type: string
                          format: date-time
                          description: A timestamp indicating when the branch was deleted. Empty if the branch is not deleted.
                        expire_time:
                          type: string
                          format: date-time
                          description: Absolute expiration time for the branch. Empty if expiration is disabled.
                        is_protected:
                          type: boolean
                          description: Whether the branch is protected.
                        logical_size_bytes:
                          type: integer
                          description: The logical size of the branch.
                        pending_state:
                          type: string
                          x-enum:
                          - ARCHIVED
                          - DELETED
                          - IMPORTING
                          - INIT
                          - READY
                          - RESETTING
                          description: The pending state of the branch, if a state transition is in progress.
                        purge_time:
                          type: string
                          format: date-time
                          description: A timestamp indicating when the branch is scheduled to be purged. Empty if the branch
                            is not deleted, otherwise set to a timestamp in the future.
                        source_branch:
                          type: string
                          description: 'The name of the source branch from which this branch was created. Format: projects/{project_id}/branches/{branch_id}'
                        source_branch_lsn:
                          type: string
                          description: The Log Sequence Number (LSN) on the source branch from which this branch was created.
                        source_branch_time:
                          type: string
                          format: date-time
                          description: The point in time on the source branch from which this branch was created.
                        source_recovery_branch:
                          type: string
                          description: 'If this branch is a child of a recovery branch, this field identifies that recovery
                            source. For non-recovery-derived branches this is unset. Format: projects/{project_id}/preview/recovery-branches/{recovery_branch_id}'
                        state_change_time:
                          type: string
                          format: date-time
                          description: A timestamp indicating when the ``current_state`` began.
                      description: The current status of a Branch.
                    uid:
                      type: string
                      description: System-generated unique ID for the branch.
                    update_time:
                      type: string
                      format: date-time
                      description: A timestamp indicating when the branch was last updated.
                  description: The Branch to create.
              required:
              - branch
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: PostgresAPI
    get:
      operationId: postgres_list_branches
      summary: Returns a paginated list of database branches in the project.
      tags:
      - postgres
      description: |-
        Returns a paginated list of database branches in the project.

        :param parent: str
          The Project that owns this collection of branches. Format: projects/{project_id}
        :param page_size: int (optional)
          Upper bound for items returned. Cannot be negative.
        :param page_token: str (optional)
          Page token from a previous response. If not provided, returns the first page.
        :param show_deleted: bool (optional)
          Whether to include soft-deleted branches in the response. When true, deleted branches are included
          alongside active branches. Purged branches are never returned.

        :returns: Iterator over :class:`Branch`
      parameters:
      - name: parent
        in: path
        required: true
        schema:
          type: string
        description: 'The Project that owns this collection of branches. Format: projects/{project_id}'
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
        description: Upper bound for items returned. Cannot be negative.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
        description: Page token from a previous response. If not provided, returns the first page.
      - name: show_deleted
        in: query
        required: false
        schema:
          type: boolean
        description: Whether to include soft-deleted branches in the response. When true, deleted branches are included alongside
          active branches. Purged branches are never returned.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBranchesResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: PostgresAPI
  /api/2.0/postgres/catalogs:
    post:
      operationId: postgres_create_catalog
      summary: Register a Postgres database in the Unity Catalog.
      tags:
      - postgres
      description: |-
        Register a Postgres database in the Unity Catalog.

        :param catalog: :class:`Catalog`
        :param catalog_id: str
          The ID in the Unity Catalog. It becomes the full resource name, for example "my_catalog" becomes
          "catalogs/my_catalog".

        :returns: :class:`Operation`
      parameters:
      - name: catalog_id
        in: query
        required: true
        schema:
          type: string
        description: The ID in the Unity Catalog. It becomes the full resource name, for example "my_catalog" becomes "catalogs/my_catalog".
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                catalog:
                  type: object
                  properties:
                    catalog_id:
                      type: string
                    create_time:
                      type: string
                      format: date-time
                      description: A timestamp indicating when the catalog was created.
                    name:
                      type: string
                      description: 'Output only. The full resource path of the catalog. Format: "catalogs/{catalog_id}".'
                    spec:
                      type: object
                      properties:
                        postgres_database:
                          type: string
                          description: The name of the Postgres database inside the specified Lakebase project and branch
                            to be associated with the UC catalog. This database must already exist, unless create_database_if_missing
                            is set to true on creation. A database can only be registered with one UC catalog at a time. To
                            re-register a database with a different catalog, the existing catalog must be deleted first. A
                            child branch inherits the fact of parent's registration. This means the same-named database in
                            a child branch cannot be registered with a second catalog while the parent's registration exists.
                            To allow registering the database of a child branch, drop and recreate the database on the child
                            branch. This removes the fact of parent's registration from this branch only. Doing Point In Time
                            Restore (PITR) prior to the moment before the Postgres DB was registered in the Catalog drops
                            the fact of registration of the database. So the user should avoid doing so.
                        branch:
                          type: string
                          description: 'The resource path of the branch associated with the catalog. Format: projects/{project_id}/branches/{branch_id}.'
                        create_database_if_missing:
                          type: boolean
                          description: If set to true, the specified postgres_database is created on behalf of the calling
                            user if it does not already exist. In this case, the calling user has a role created for them
                            in Postgres if they do not already have one. Defaults to false, meaning that the request fails
                            if the specified postgres_database does not already exist.
                      required:
                      - postgres_database
                      description: The desired state of the Catalog.
                    status:
                      type: object
                      properties:
                        branch:
                          type: string
                          description: 'The resource path of the branch associated with the catalog. Format: projects/{project_id}/branches/{branch_id}.'
                        postgres_database:
                          type: string
                          description: The name of the Postgres database associated with the catalog.
                        project:
                          type: string
                          description: 'The resource path of the project associated with the catalog. Format: projects/{project_id}.'
                      description: The observed state of the Catalog.
                    uid:
                      type: string
                      description: System-generated unique identifier for the catalog.
                    update_time:
                      type: string
                      format: date-time
                      description: A timestamp indicating when the catalog was last updated.
              required:
              - catalog
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: PostgresAPI
  /api/2.0/postgres/{parent}/cdf-configs:
    post:
      operationId: postgres_create_cdf_config
      summary: Create a CDF configuration that materializes the change data feed for all tables in a Postgres schema
      tags:
      - postgres
      description: |-
        Create a CDF configuration that materializes the change data feed for all tables in a Postgres schema
        as open-format Delta tables in Unity Catalog. Once created, each table's change history is
        continuously written to its corresponding Lakehouse table.

        :param parent: str
          The parent database under which to create the CdfConfig. Format:
          projects/{project}/branches/{branch}/databases/{database}
        :param cdf_config: :class:`CdfConfig`
          The CdfConfig to create. The catalog, schema, and postgres_schema fields are required; all other
          fields are output only and ignored on input.
        :param cdf_config_id: str (optional)
          The user-specified id for the CdfConfig, forming the final segment of its resource name. Must match
          the pattern ``[a-z][a-z0-9_]{0,62}``. Defaults to the Postgres schema name when omitted.

        :returns: :class:`Operation`
      parameters:
      - name: parent
        in: path
        required: true
        schema:
          type: string
        description: 'The parent database under which to create the CdfConfig. Format: projects/{project}/branches/{branch}/databases/{database}'
      - name: cdf_config_id
        in: query
        required: false
        schema:
          type: string
        description: The user-specified id for the CdfConfig, forming the final segment of its resource name. Must match the
          pattern ``[a-z][a-z0-9_]{0,62}``. Defaults to the Postgres schema name when omitted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cdf_config:
                  type: object
                  properties:
                    catalog:
                      type: string
                      description: The Unity Catalog catalog that replicated tables are written into. Set at creation; the
                        CdfConfig is immutable.
                    schema:
                      type: string
                      description: The Unity Catalog schema that replicated tables are written into. Set at creation; the
                        CdfConfig is immutable.
                    postgres_schema:
                      type: string
                      description: The Postgres schema this CdfConfig replicates from. Unique within the parent database.
                        Set at creation; the CdfConfig is immutable.
                    cdf_config_id:
                      type: string
                      description: The user-specified id; equals the final segment of ``name``. Defaults to the Postgres schema
                        name for configs without an explicit id.
                    create_time:
                      type: string
                      format: date-time
                      description: When the CdfConfig was created.
                    name:
                      type: string
                      description: 'Output only. The full resource name of the CdfConfig. Format: projects/{project}/branches/{branch}/databases/{database}/cdf-configs/{cdf_config}'
                  required:
                  - catalog
                  - schema
                  - postgres_schema
                  description: The CdfConfig to create. The catalog, schema, and postgres_schema fields are required; all
                    other fields are output only and ignored on input.
              required:
              - cdf_config
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: PostgresAPI
    get:
      operationId: postgres_list_cdf_configs
      summary: List all CDF configurations for a Lakebase database. Each configuration maps a Postgres schema to a
      tags:
      - postgres
      description: |-
        List all CDF configurations for a Lakebase database. Each configuration maps a Postgres schema to a
        Unity Catalog schema where the change data feed is materialized.

        :param parent: str
          The parent database to list CdfConfigs for. Format:
          projects/{project}/branches/{branch}/databases/{database}
        :param page_size: int (optional)
          Maximum number of CdfConfigs to return.
        :param page_token: str (optional)
          Pagination token returned by a previous ListCdfConfigs call. Empty on the first page.

        :returns: Iterator over :class:`CdfConfig`
      parameters:
      - name: parent
        in: path
        required: true
        schema:
          type: string
        description: 'The parent database to list CdfConfigs for. Format: projects/{project}/branches/{branch}/databases/{database}'
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
        description: Maximum number of CdfConfigs to return.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
        description: Pagination token returned by a previous ListCdfConfigs call. Empty on the first page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCdfConfigsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: PostgresAPI
  /api/2.0/postgres/{parent}/data-api:
    post:
      operationId: postgres_create_data_api
      summary: Enable Data API for a database.
      tags:
      - postgres
      description: |-
        Enable Data API for a database.

        :param parent: str
          Parent database: projects/{project_id}/branches/{branch_id}/databases/{database_id}
        :param data_api: :class:`DataApi`
          The Data API configuration to create.

        :returns: :class:`Operation`
      parameters:
      - name: parent
        in: path
        required: true
        schema:
          type: string
        description: 'Parent database: projects/{project_id}/branches/{branch_id}/databases/{database_id}'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data_api:
                  type: object
                  properties:
                    create_time:
                      type: string
                      format: date-time
                      description: A timestamp indicating when the Data API was first enabled.
                    name:
                      type: string
                      description: 'Resource name: projects/{project_id}/branches/{branch_id}/databases/{database_id}/data-api'
                    parent:
                      type: string
                      description: 'The database containing this Data API configuration. Format: projects/{project_id}/branches/{branch_id}/databases/{database_id}'
                    spec:
                      type: object
                      properties:
                        db_aggregates_enabled:
                          type: boolean
                          description: 'Enable aggregate functions (count, sum, avg, etc.) in Data API responses. Default:
                            true.'
                        db_anon_role:
                          type: string
                          description: 'The PostgreSQL role used for unauthenticated (anonymous) requests. Must be a valid
                            PostgreSQL role name (1-63 chars, [a-zA-Z_][a-zA-Z0-9_$]*). Default: "anonymous".'
                        db_extra_search_path:
                          type: array
                          items:
                            type: string
                          description: Additional schemas to include in the PostgreSQL search path. Each entry must be a valid
                            PostgreSQL schema name.
                        db_max_rows:
                          type: integer
                          description: Maximum number of rows returned in a single Data API response. Must be a positive integer.
                        db_schemas:
                          type: array
                          items:
                            type: string
                          description: 'Database schemas exposed through the Data API. Each entry must be a valid PostgreSQL
                            schema name (1-63 chars, [a-zA-Z_][a-zA-Z0-9_$]*). Maximum 100 entries. Default: ["public"].'
                        jwt_cache_max_lifetime:
                          type: string
                          description: Maximum lifetime for cached JWT tokens. Zero duration disables caching.
                        jwt_role_claim_key:
                          type: string
                          description: 'JSON path to the role claim in JWT tokens (e.g., ".sub"). Default: ".sub".'
                        openapi_mode:
                          type: string
                          x-enum:
                          - OPEN_API_MODE_DISABLED
                          - OPEN_API_MODE_IGNORE_PRIVILEGES
                          description: OpenAPI documentation mode for the Data API endpoint.
                        server_cors_allowed_origins:
                          type: array
                          items:
                            type: string
                          description: Allowed origins for CORS requests. Each entry should be a valid origin URL, or use
                            "*" to allow all origins.
                        server_timing_enabled:
                          type: boolean
                          description: Enable the Server-Timing header in Data API responses.
                      description: The desired Data API configuration.
                    status:
                      type: object
                      properties:
                        available_schemas:
                          type: array
                          items:
                            type: string
                          description: Schemas available in the database (for reference when configuring db_schemas).
                        db_aggregates_enabled:
                          type: boolean
                          description: Actual aggregate function setting read from the database.
                        db_anon_role:
                          type: string
                          description: Actual anonymous role name read from the database.
                        db_extra_search_path:
                          type: array
                          items:
                            type: string
                          description: Actual extra search path schemas read from the database.
                        db_max_rows:
                          type: integer
                          description: Actual max rows setting read from the database.
                        db_schemas:
                          type: array
                          items:
                            type: string
                          description: Actual exposed schemas read from the database.
                        jwt_cache_max_lifetime:
                          type: string
                          description: Actual JWT cache max lifetime read from the database.
                        jwt_role_claim_key:
                          type: string
                          description: Actual JWT role claim key read from the database.
                        openapi_mode:
                          type: string
                          x-enum:
                          - OPEN_API_MODE_DISABLED
                          - OPEN_API_MODE_IGNORE_PRIVILEGES
                          description: Actual OpenAPI mode read from the database.
                        server_cors_allowed_origins:
                          type: array
                          items:
                            type: string
                          description: Actual CORS allowed origins read from the database.
                        server_timing_enabled:
                          type: boolean
                          description: Actual Server-Timing header setting read from the database.
                        url:
                          type: string
                          description: Data API endpoint URL.
                      description: The observed Data API state (read-only).
                    update_time:
                      type: string
                      format: date-time
                      description: A timestamp indicating when the Data API configuration was last updated.
                  description: The Data API configuration to create.
              required:
              - data_api
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: PostgresAPI
  /api/2.0/postgres/{parent}/databases:
    post:
      operationId: postgres_create_database
      summary: Create a Database.
      tags:
      - postgres
      description: |-
        Create a Database.

        Creates a database in the specified branch. A branch can have multiple databases.

        :param parent: str
          The Branch where this Database will be created. Format: projects/{project_id}/branches/{branch_id}
        :param database: :class:`Database`
          The desired specification of a Database.
        :param database_id: str (optional)
          The ID to use for the Database, which will become the final component of the database's resource
          name. This ID becomes the database name in postgres.

          This value should be 4-63 characters, and only use characters available in DNS names, as defined by
          RFC-1123

          If database_id is not specified in the request, it is generated automatically.
        :param replace_existing: bool (optional)
          If true, update the database if it already exists instead of returning an error.

        :returns: :class:`Operation`
      parameters:
      - name: parent
        in: path
        required: true
        schema:
          type: string
        description: 'The Branch where this Database will be created. Format: projects/{project_id}/branches/{branch_id}'
      - name: database_id
        in: query
        required: false
        schema:
          type: string
        description: The ID to use for the Database, which will become the final component of the database's resource name.
          This ID becomes the database name in postgres. This value should be 4-63 characters, and only use characters available
          in DNS names, as defined by RFC-1123 If database_id is not specified in the request, it is generated automatically.
      - name: replace_existing
        in: query
        required: false
        schema:
          type: boolean
        description: If true, update the database if it already exists instead of returning an error.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                database:
                  type: object
                  properties:
                    create_time:
                      type: string
                      format: date-time
                      description: A timestamp indicating when the database was created.
                    database_id:
                      type: string
                      description: The part of the name, chosen by the user when the resource was created.
                    name:
                      type: string
                      description: 'The resource name of the database. Format: projects/{project_id}/branches/{branch_id}/databases/{database_id}'
                    parent:
                      type: string
                      description: 'The branch containing this database. Format: projects/{project_id}/branches/{branch_id}'
                    spec:
                      type: object
                      properties:
                        role:
                          type: string
                        postgres_database:
                          type: string
                          description: The name of the Postgres database. This expects a valid Postgres identifier as specified
                            in the link below. https://www.postgresql.org/docs/current/sql-syntax-lexical.html#SQL-SYNTAX-IDENTIFIERS
                            Required when creating the Database. To rename, pass a valid postgres identifier when updating
                            the Database.
                      required:
                      - role
                      description: The desired state of the Database.
                    status:
                      type: object
                      properties:
                        database_id:
                          type: string
