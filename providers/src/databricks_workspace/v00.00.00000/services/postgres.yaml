            is always owned by the initial role (caller-provided via ``initial_role_spec`` or defaulted to the caller's identity).
            This field is input-only; to change databases after project creation, use the standalone Database API.
        initial_endpoint_spec:
          $ref: '#/components/schemas/InitialEndpointSpec'
          description: Configuration settings for the initial Read/Write endpoint created inside the initial branch for a
            newly created project. If omitted, the initial endpoint created will have default settings, without high availability
            configured. This field does not apply to any endpoints created after project creation. Use spec.default_endpoint_settings
            to configure default settings for endpoints created after project creation.
        initial_role_spec:
          $ref: '#/components/schemas/InitialRoleSpec'
          description: Configuration for the initial Postgres role created inside the initial branch for this project. If
            omitted, the initial branch gets an initial role corresponding to the caller of the API endpoint. This field is
            input-only; to change roles after project creation, use the standalone Role API.
        name:
          type: string
          description: 'Output only. The full resource path of the project. Format: projects/{project_id}'
        project_id:
          type: string
          description: The part of the name, chosen by the user when the resource was created.
        purge_time:
          type: string
          format: date-time
          description: A timestamp indicating when the project is scheduled for permanent deletion. Empty if the project is
            not deleted, otherwise set to a timestamp in the future.
        spec:
          $ref: '#/components/schemas/ProjectSpec'
          description: The spec contains the project configuration, including display_name, pg_version (Postgres version),
            history_retention_duration, and default_endpoint_settings.
        status:
          $ref: '#/components/schemas/ProjectStatus'
          description: The current status of a Project.
        uid:
          type: string
          description: System-generated unique ID for the project.
        update_time:
          type: string
          format: date-time
          description: A timestamp indicating when the project was last updated.
    ProjectCustomTag:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
          description: The value of the custom tag.
    ProjectDefaultEndpointSettings:
      type: object
      properties:
        autoscaling_limit_max_cu:
          type: number
          description: The maximum number of Compute Units. Minimum value is 0.5.
        autoscaling_limit_min_cu:
          type: number
          description: The minimum number of Compute Units. Minimum value is 0.5.
        no_suspension:
          type: boolean
          description: When set to true, explicitly disables automatic suspension (never suspend). Should be set to true when
            provided. Mutually exclusive with ``suspend_timeout_duration``. When updating, use ``spec.project_default_settings.suspension``
            in the update_mask.
        pg_settings:
          type: object
          description: A raw representation of Postgres settings.
        suspend_timeout_duration:
          type: string
          description: Duration of inactivity after which the compute endpoint is automatically suspended. If specified should
            be between 60s and 604800s (1 minute to 1 week). Mutually exclusive with ``no_suspension``. When updating, use
            ``spec.project_default_settings.suspension`` in the update_mask.
      description: A collection of settings for a compute endpoint.
    ProjectOperationMetadata:
      type: object
      properties: {}
    ProjectSpec:
      type: object
      properties:
        budget_policy_id:
          type: string
        compute_provisioner:
          type: string
          description: The compute provisioner used to provision endpoints in this project. Overrides the default provisioner
            when set.
        custom_tags:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCustomTag'
          description: Custom tags to associate with the project. Forwarded to LBM for billing and cost tracking. To update
            tags, provide the new tag list and include "spec.custom_tags" in the update_mask. To clear all tags, provide an
            empty list and include "spec.custom_tags" in the update_mask. To preserve existing tags, omit this field from
            the update_mask (or use wildcard "*" which auto-excludes empty tags).
        default_branch:
          type: string
          description: 'The full resource path for the default branch of the project Format: projects/{project_id}/branches/{branch_id}'
        default_endpoint_settings:
          $ref: '#/components/schemas/ProjectDefaultEndpointSettings'
        display_name:
          type: string
          description: Human-readable project name. Length should be between 1 and 256 characters.
        enable_pg_native_login:
          type: boolean
          description: Whether to enable PG native password login on all endpoints in this project. Defaults to false.
        history_retention_duration:
          type: string
          description: The number of seconds to retain the shared history for point in time recovery for all branches in this
            project. Value should be between 172800s (2 days) and 3024000s (35 days).
        pg_version:
          type: integer
          description: The major Postgres version number. The set of supported versions may vary; consult the API documentation
            for currently accepted values.
    ProjectStatus:
      type: object
      properties:
        branch_logical_size_limit_bytes:
          type: integer
        budget_policy_id:
          type: string
          description: The budget policy that is applied to the project.
        compute_last_active_time:
          type: string
          format: date-time
          description: The most recent time when any endpoint of this project was active.
        compute_provisioner:
          type: string
          description: The effective compute provisioner backing this project's endpoints.
        custom_tags:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCustomTag'
          description: The effective custom tags associated with the project.
        default_branch:
          type: string
          description: The full resource path of the default branch of the project
        default_endpoint_settings:
          $ref: '#/components/schemas/ProjectDefaultEndpointSettings'
          description: The effective default endpoint settings.
        display_name:
          type: string
          description: The effective human-readable project name.
        enable_pg_native_login:
          type: boolean
          description: Whether to enable PG native password login on all endpoints in this project.
        history_retention_duration:
          type: string
          description: The effective number of seconds to retain the shared history for point in time recovery.
        owner:
          type: string
          description: The email of the project owner.
        pg_version:
          type: integer
          description: The effective major Postgres version number.
        project_id:
          type: string
          description: Part of the resource name.
        replication_role:
          $ref: '#/components/schemas/ReplicationRolePreview'
          description: The replication role of the project in this workspace. Populated only when cross-workspace replication
            is configured.
        synthetic_storage_size_bytes:
          type: integer
          description: The current space occupied by the project in storage.
    RecoveryBranchPreview:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
        name:
          type: string
          description: 'The resource name of the recovery branch. Format: projects/{project_id}/preview/recovery-branches/{recovery_branch_id}'
        parent:
          type: string
          description: 'The project containing this recovery branch. Format: projects/{project_id}'
        status:
          $ref: '#/components/schemas/RecoveryBranchPreviewStatus'
        uid:
          type: string
        update_time:
          type: string
          format: date-time
    RecoveryBranchPreviewStatus:
      type: object
      properties:
        current_state:
          $ref: '#/components/schemas/RecoveryBranchPreviewStatusState'
        divergent:
          type: boolean
        end_lsn:
          type: string
          description: The Log Sequence Number (LSN) up to which the recovery branch's timeline holds data.
        expire_time:
          type: string
          format: date-time
        failover_child_lsn:
          type: string
          description: The Log Sequence Number (LSN) at which a local child timeline was branched off this recovery branch's
            timeline during recovery branch creation.
        home_workspace:
          type: string
          description: 'The workspace that owns the source branch and where reconciliation completes. Format: a workspace
            identifier.'
        is_foreign:
          type: boolean
        origin_branch:
          type: string
          description: 'The normal branch from which this recovery branch originated. Format: projects/{project_id}/branches/{branch_id}'
    ReplicationGroupPreview:
      type: object
      properties:
        replication_mode:
          $ref: '#/components/schemas/ReplicationModePreview'
        workspaces:
          type: array
          items:
            type: string
          description: The workspaces participating in this replication group. Phase 1 requires exactly 2 entries.
        create_time:
          type: string
          format: date-time
          description: Server-generated timestamps.
        etag:
          type: string
          description: Optional optimistic concurrency token for update and delete.
        name:
          type: string
          description: 'The resource name of the replication group. Format: projects/{project_id}/preview/replication-groups/{replication_group_id}'
        observed_metrics:
          $ref: '#/components/schemas/ReplicationMetricsPreview'
          description: The latest observed replication metrics for this group.
        parent:
          type: string
          description: 'The parent project that owns this replication group. Format: projects/{project_id}'
        primary_workspace:
          type: string
          description: The workspace currently serving writes. Server-owned.
        state:
          $ref: '#/components/schemas/ReplicationGroupPreviewState'
          description: The lifecycle state of the replication group.
        update_time:
          type: string
          format: date-time
      required:
      - replication_mode
      - workspaces
    ReplicationGroupPreviewOperationMetadata:
      type: object
      properties: {}
      description: |-
        Empty placeholder; required by every LRO ``metadata_type``. Mirrors BranchOperationMetadata /
            RoleOperationMetadata.
    ReplicationMetricsPreview:
      type: object
      properties:
        as_of_time:
          type: string
          format: date-time
        bytes_lag:
          type: integer
          description: The most recent observed byte lag.
        throughput_bytes_per_second:
          type: integer
          description: The most recent observed replication throughput.
        time_lag:
          type: string
          description: The most recent observed time lag.
    RequestedClaims:
      type: object
      properties:
        permission_set:
          $ref: '#/components/schemas/RequestedClaimsPermissionSet'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/RequestedResource'
    RequestedResource:
      type: object
      properties:
        table_name:
          type: string
    Role:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
        name:
          type: string
          description: 'Output only. The full resource path of the role. Format: projects/{project_id}/branches/{branch_id}/roles/{role_id}'
        parent:
          type: string
          description: 'The Branch where this Role exists. Format: projects/{project_id}/branches/{branch_id}'
        role_id:
          type: string
          description: The part of the name, chosen by the user when the resource was created.
        spec:
          $ref: '#/components/schemas/RoleRoleSpec'
          description: The spec contains the role configuration, including identity type, authentication method, and role
            attributes.
        status:
          $ref: '#/components/schemas/RoleRoleStatus'
          description: Current status of the role, including its identity type, authentication method, and role attributes.
        update_time:
          type: string
          format: date-time
      description: Role represents a Postgres role within a Branch.
    RoleAttributes:
      type: object
      properties:
        bypassrls:
          type: boolean
        createdb:
          type: boolean
        createrole:
          type: boolean
      description: |-
        Attributes that can be granted to a Postgres role. We are only implementing a subset for now,
            see xref: https://www.postgresql.org/docs/16/sql-createrole.html The values follow Postgres
            keyword naming e.g. CREATEDB, BYPASSRLS, etc. which is why they don't include typical
            underscores between words.
    RoleOperationMetadata:
      type: object
      properties: {}
    RoleRoleSpec:
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/RoleAttributes'
        auth_method:
          $ref: '#/components/schemas/RoleAuthMethod'
          description: 'Controls how the Postgres role authenticates when a client opens a database connection. Supported
            values: - LAKEBASE_OAUTH_V1: the role authenticates by presenting a Databricks OAuth access token derived from
            the backing managed identity (the Databricks user, service principal, or group named by the role''s ``postgres_role``).
            No static password exists for roles using this method. - PG_PASSWORD_SCRAM_SHA_256: the role authenticates with
            a Postgres password verified server-side using the SCRAM-SHA-256 mechanism. Lakebase generates a password for
            the role. - NO_LOGIN: the role cannot open a Postgres session at all. Useful for roles that exist only to own
            objects or to aggregate privileges that are then granted to other, loginable roles. If auth_method is left unspecified,
            a meaningful authentication method is derived from the identity_type: - For the managed identities, OAUTH is used.
            - For the regular postgres roles, authentication based on postgres passwords is used. NOTE: for the Databricks
            identity type GROUP, LAKEBASE_OAUTH_V1 is the default auth method (group can login as well).'
        identity_type:
          $ref: '#/components/schemas/RoleIdentityType'
          description: 'The type of role. When specifying a managed-identity, the chosen role_id must be a valid: - application
            ID for SERVICE_PRINCIPAL - user email for USER - group name for GROUP'
        membership_roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleMembershipRole'
          description: An enum value for a standard role that this role is a member of.
        postgres_role:
          type: string
          description: 'The name of the Postgres role. This expects a valid Postgres identifier as specified in the link below.
            https://www.postgresql.org/docs/current/sql-syntax-lexical.html#SQL-SYNTAX-IDENTIFIERS Required when creating
            the Role. If you wish to create a Postgres Role backed by a managed Databricks identity, then postgres_role must
            be one of the following: 1. user email for IdentityType.USER 2. app ID for IdentityType.SERVICE_PRINCIPAL 3. group
            name for IdentityType.GROUP'
    RoleRoleStatus:
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/RoleAttributes'
        auth_method:
          $ref: '#/components/schemas/RoleAuthMethod'
        identity_type:
          $ref: '#/components/schemas/RoleIdentityType'
          description: The type of the role.
        membership_roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleMembershipRole'
          description: An enum value for a standard role that this role is a member of.
        postgres_role:
          type: string
          description: The name of the Postgres role.
        role_id:
          type: string
          description: Part of the resource name.
    ScheduleCadence:
      type: object
      properties:
        retention:
          type: string
          description: How long snapshots from this cadence are kept before automatic deletion. Must be at least 1 hour. Applied
            when a snapshot is taken; not retroactive, so changing it affects only later snapshots.
        daily_schedule:
          $ref: '#/components/schemas/DailySchedule'
          description: Take a snapshot once per day.
        monthly_schedule:
          $ref: '#/components/schemas/MonthlySchedule'
          description: Take a snapshot once per month.
        weekly_schedule:
          $ref: '#/components/schemas/WeeklySchedule'
          description: Take a snapshot once per week.
      required:
      - retention
      description: One cadence at which automatic snapshots are taken.
    Snapshot:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
          description: When the snapshot was created.
        name:
          type: string
          description: 'The resource name of the snapshot. Format: projects/{project_id}/snapshots/{snapshot_id}'
        snapshot_id:
          type: string
          description: The user-chosen ID; the final segment of ``name``.
        spec:
          $ref: '#/components/schemas/SnapshotSpec'
          description: Client-provided configuration of the snapshot.
        status:
          $ref: '#/components/schemas/SnapshotStatus'
          description: Server-observed state of the snapshot.
        uid:
          type: string
          description: Unique system-generated ID for the snapshot.
        update_time:
          type: string
          format: date-time
          description: When the snapshot was last updated.
      description: |-
        An immutable, point-in-time copy of a branch's data within a project. It remains available after
            the source branch is deleted.
    SnapshotOperationMetadata:
      type: object
      properties: {}
      description: Metadata for the long-running snapshot Create, Update, and Delete operations.
    SnapshotSchedule:
      type: object
      properties:
        name:
          type: string
          description: 'The resource name of the branch''s snapshot schedule. Format: projects/{project_id}/branches/{branch_id}/snapshot-schedule'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleCadence'
          description: The cadences at which automatic snapshots are taken. Update replaces the whole set; an empty set disables
            automatic snapshots. Order is not significant. When several cadences fire together, one snapshot is taken, retained
            for the longest of their retentions.
      description: |-
        The automatic snapshot cadences for a branch. There is exactly one schedule per branch
            (singleton); it is configured in place, not created or deleted.

            Name: projects/{project_id}/branches/{branch_id}/snapshot-schedule
    SnapshotSpec:
      type: object
      properties:
        source_branch:
          type: string
          description: 'The source branch to snapshot. Format: projects/{project_id}/branches/{branch_id}'
        expire_time:
          type: string
          format: date-time
          description: Absolute time at which the snapshot is deleted. Mutually exclusive with ``ttl`` and ``no_expiry``.
        no_expiry:
          type: boolean
          description: If true, the snapshot never expires. Mutually exclusive with ``ttl`` and ``expire_time``.
        source_branch_lsn:
          type: string
          description: LSN to snapshot from, e.g. ``16/B374D848``. Mutually exclusive with ``source_branch_time``.
        source_branch_time:
          type: string
          format: date-time
          description: Timestamp to snapshot from. Mutually exclusive with ``source_branch_lsn``.
        ttl:
          type: string
          description: Time-to-live. The snapshot expires this long after it is created. Mutually exclusive with ``expire_time``
            and ``no_expiry``.
      required:
      - source_branch
      description: Client-provided configuration of the snapshot.
    SnapshotStatus:
      type: object
      properties:
        current_state:
          $ref: '#/components/schemas/SnapshotStatusState'
          description: The snapshot's current state.
        diff_size_bytes:
          type: integer
          description: Incremental storage size in bytes since the previous snapshot. Unset when the snapshot is not billed
            on incremental usage.
        expire_time:
          type: string
          format: date-time
          description: Absolute time at which the snapshot is deleted.
        full_size_bytes:
          type: integer
          description: Full logical size of the snapshot, in bytes.
        no_expiry:
          type: boolean
          description: True if the snapshot never expires.
        source_branch:
          type: string
          description: 'The source branch the snapshot was taken from. Format: projects/{project_id}/branches/{branch_id}'
        source_branch_lsn:
          type: string
          description: The LSN at which the snapshot was taken.
        source_branch_time:
          type: string
          format: date-time
          description: The point in time at which the snapshot was taken.
      description: Server-observed state of a snapshot.
    SyncedTable:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
        name:
          type: string
          description: Output only. The Full resource name of the synced table in Postgres where (catalog, schema, table)
            are the UC entity names. Format "synced_tables/{catalog}.{schema}.{table}" For the corresponding source table
            in the Unity catalog look for the "source_table_full_name" attribute.
        spec:
          $ref: '#/components/schemas/SyncedTableSyncedTableSpec'
          description: Configuration details of the synced table, such as the source table, scheduling policy, etc. This attribute
            is specified at creation time and most fields are returned as is on subsequent queries.
        status:
          $ref: '#/components/schemas/SyncedTableSyncedTableStatus'
          description: Synced Table data synchronization status.
        synced_table_id:
          type: string
          description: The part of the name, chosen by the user when the resource was created.
        uid:
          type: string
          description: The Unity Catalog table ID for this synced table.
    SyncedTableOperationMetadata:
      type: object
      properties: {}
      description: Metadata for SyncedTable long-running operations.
    SyncedTablePipelineProgress:
      type: object
      properties:
        estimated_completion_time_seconds:
          type: number
          description: The estimated time remaining to complete this update in seconds.
        latest_version_currently_processing:
          type: integer
          description: The source table Delta version that was last processed by the pipeline. The pipeline may not have completely
            processed this version yet.
        sync_progress_completion:
          type: number
          description: The completion ratio of this update. This is a number between 0 and 1.
        synced_row_count:
          type: integer
          description: The number of rows that have been synced in this update.
        total_row_count:
          type: integer
          description: The total number of rows that need to be synced in this update. This number may be an estimate.
      description: Progress information of the Synced Table data synchronization pipeline.
    SyncedTablePosition:
      type: object
      properties:
        delta_table_sync_info:
          $ref: '#/components/schemas/DeltaTableSyncInfo'
        sync_end_time:
          type: string
          format: date-time
          description: The end timestamp of the most recent successful synchronization. This is the time when the data is
            available in the synced table.
        sync_start_time:
          type: string
          format: date-time
          description: The starting timestamp of the most recent successful synchronization from the source table to the destination
            (synced) table. Note this is the starting timestamp of the sync operation, not the end time. E.g., for a batch,
            this is the time when the sync operation started.
    SyncedTableSyncedTableSpec:
      type: object
      properties:
        accelerated_sync:
          type: boolean
        branch:
          type: string
          description: 'The full resource name the branch associated with the table. Format: "projects/{project_id}/branches/{branch_id}".'
        create_database_objects_if_missing:
          type: boolean
          description: If true, the synced table's logical database and schema resources in PG will be created if they do
            not already exist. The request will fail if this is false and the database/schema do not exist. Defaults to true
            if omitted.
        existing_pipeline_id:
          type: string
          description: ID of an existing pipeline to bin-pack this synced table into. At most one of existing_pipeline_id
            and new_pipeline_spec should be defined. The pipeline used for the synced table is returned via the top level
            pipeline_id attribute.
        extra_columns:
          type: array
          items:
            $ref: '#/components/schemas/SyncedTableSyncedTableSpecExtraColumn'
          description: Extra PostgreSQL-only columns to add to the synced table.
        extra_index_definitions:
          type: array
          items:
            $ref: '#/components/schemas/SyncedTableSyncedTableSpecSecondaryIndex'
          description: Secondary indexes to create on the synced table.
        new_pipeline_spec:
          $ref: '#/components/schemas/NewPipelineSpec'
          description: Specification for creating a new pipeline. At most one of existing_pipeline_id and new_pipeline_spec
            should be defined. The pipeline used for the synced table is returned via the top level pipeline_id attribute.
        postgres_database:
          type: string
          description: The Postgres database name where the synced table will be created in. If this synced table is created
            inside a Lakebase Catalog, this attribute can be omitted on creation and is inferred from the postgres_database
            associated with the Lakebase Catalog. If specified when inside a Lakebase Catalog, the value must match. A value
            must be specified when creating a synced table inside a Standard Catalog.
        primary_key_columns:
          type: array
          items:
            type: string
          description: Primary Key columns to be used for data insert/update in the destination.
        scheduling_policy:
          $ref: '#/components/schemas/SyncedTableSyncedTableSpecSyncedTableSchedulingPolicy'
          description: Scheduling policy of the underlying pipeline.
        source_table_full_name:
          type: string
          description: 'Three-part (catalog, schema, table) name of the source Delta table. For the corresponding destination
            table, use any of the two: - synced_table_id used at the creation of the SyncedTable - "name" consisting of "synced_tables/"
            prefix and the full name of the destination table.'
        timeseries_key:
          type: string
          description: Time series key to deduplicate (tie-break) rows with the same primary key.
        type_overrides:
          type: array
          items:
            $ref: '#/components/schemas/SyncedTableSyncedTableSpecTypeOverride'
          description: Override the default Delta->PG type mapping for specific columns. A TypeOverride with PG_SPECIFIC_TYPE_UNSPECIFIED
            is rejected; a valid pg_type must be set.
    SyncedTableSyncedTableSpecExtraColumn:
      type: object
      properties:
        column_name:
          type: string
          description: Name of the column.
        column_type:
          type: string
          description: PostgreSQL type of the column, for example "tsvector" or "vector(1024)".
        compute:
          type: string
          description: SQL expression used to compute the column's value, for example "to_tsvector('english', content)".
        maintenance:
          $ref: '#/components/schemas/SyncedTableSyncedTableSpecExtraColumnMaintenance'
      required:
      - column_name
      - column_type
      description: An extra PostgreSQL column to add to the synced table.
    SyncedTableSyncedTableSpecSecondaryIndex:
      type: object
      properties:
        name:
          type: string
          description: Name of the index as it will appear in PostgreSQL.
        definition:
          type: string
          description: 'The definition portion of a CREATE INDEX statement, placed after ON table_name. For example: USING
            hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 64).'
        creation_point:
          $ref: '#/components/schemas/SyncedTableSyncedTableSpecSecondaryIndexCreationPoint'
          description: When the index should be created relative to the initial data load.
      required:
      - name
      - definition
      description: Definition of a secondary index to create on the synced table.
    SyncedTableSyncedTableSpecTypeOverride:
      type: object
      properties:
        column_name:
          type: string
          description: Name of the source column whose target PostgreSQL type should be overridden.
        pg_type:
          $ref: '#/components/schemas/SyncedTableSyncedTableSpecPgSpecificType'
          description: PostgreSQL-specific target type to use for the column.
        size:
          type: integer
          description: Size parameter for the target type, for types that take one (e.g. vector dimension, varchar length).
            Required when the chosen pg_type needs a size.
      required:
      - column_name
      - pg_type
      description: Overrides the default Delta-to-PostgreSQL type mapping for a single column.
    SyncedTableSyncedTableStatus:
      type: object
      properties:
        detailed_state:
          $ref: '#/components/schemas/SyncedTableState'
        last_processed_commit_version:
          type: integer
          description: The last source table Delta version that was successfully synced to the synced table.
        last_sync:
          $ref: '#/components/schemas/SyncedTablePosition'
          description: Summary of the last successful synchronization from source to destination.
        last_sync_time:
          type: string
          format: date-time
          description: The end timestamp of the last time any data was synchronized from the source table to the synced table.
            This is when the data is available in the synced table.
        message:
          type: string
          description: A text description of the current state of the synced table.
        ongoing_sync_progress:
          $ref: '#/components/schemas/SyncedTablePipelineProgress'
        pipeline_id:
          type: string
          description: ID of the associated pipeline.
        project:
          type: string
          description: 'The full resource name of the project associated with the table. Format: "projects/{project_id}".'
        provisioning_phase:
          $ref: '#/components/schemas/ProvisioningPhase'
          description: The current phase of the data synchronization pipeline.
        unity_catalog_provisioning_state:
          $ref: '#/components/schemas/ProvisioningInfoState'
          description: The provisioning state of the synced table entity in Unity Catalog.
    Table:
      type: object
      properties:
        name:
          type: string
          description: Full three-part (catalog, schema, table) name of the table.
        database:
          type: string
          description: 'The project and branch scoped database to which this table belongs. Of the format: projects/{project_id}/branches/{branch_id}/databases/{database_id}
            where database_id is the name of the logical database in Postgres.'
        branch:
          type: string
          description: The id of the database branch associated with the table. Of the format projects/{project_id}/branches/{branch_id}.
        project:
          type: string
          description: The id of the database project associated with the table. Of the format projects/{project_id}.
        table_serving_url:
          type: string
          description: REST API URL for serving data from this table.
      required:
      - name
      - database
      description: |-
        Table represents a non-synced database table in a Lakebase project. Unlike SyncedTable, this
            does not have a data synchronization pipeline.
    WeeklySchedule:
      type: object
      properties:
        day_of_week:
          $ref: '#/components/schemas/DayOfWeek'
          description: The day of the week on which to take the snapshot.
        hour:
          type: integer
          description: The hour of the day, in UTC, at which to take the snapshot, in [0, 23].
      required:
      - day_of_week
      description: Take a snapshot once per week, on the configured day at the configured hour.
    BranchStatusState:
      type: string
      x-enum:
      - ARCHIVED
      - DELETED
      - IMPORTING
      - INIT
      - READY
      - RESETTING
      description: The state of the branch.
    CdfState:
      type: string
      x-enum:
      - CDF_STATE_SKIPPED
      - CDF_STATE_SNAPSHOTTING
      - CDF_STATE_STREAMING
      - CDF_STATE_TERMINATED
      description: The replication state of a single replicated table (CdfStatus).
