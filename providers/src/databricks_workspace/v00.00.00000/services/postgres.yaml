        create_time:
          type: string
          format: date-time
        endpoint_id:
          type: string
          description: The part of the name, chosen by the user when the resource was created.
        name:
          type: string
          description: 'Output only. The full resource path of the endpoint. Format: projects/{project_id}/branches/{branch_id}/endpoints/{endpoint_id}'
        parent:
          type: string
          description: 'The branch containing this endpoint (API resource hierarchy). Format: projects/{project_id}/branches/{branch_id}'
        spec:
