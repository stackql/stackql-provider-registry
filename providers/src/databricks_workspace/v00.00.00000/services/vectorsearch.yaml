    post:
      operationId: vector_search_indexes_run_reranker_finetuning
      summary: Triggers reranker finetuning for a vector index.
      tags:
        - vectorsearch
        - vector_search_indexes
      description: |-
        Triggers reranker finetuning for a vector index.

        :param name: str
          Fully qualified index name (catalog.schema.index).
