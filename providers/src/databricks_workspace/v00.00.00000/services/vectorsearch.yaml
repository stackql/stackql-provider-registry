                    embedding_vector_columns:
                      type: array
                      items:
                        type: object
                        properties:
                          embedding_dimension:
                            type: integer
                          name:
                            type: string
                            description: Name of the column
                      description: >-
                        The columns that contain the embedding vectors. The
                        format should be array[double].
                    requested_schema_json:
                      type: string
                      description: >-
                        The index schema exactly as the user supplied it on
                        create, preserving the original type spellings (e.g.
                        ``integer``) rather than Unity Catalog's canonical names
                        (e.g. ``int``) that ``schema_json`` returns.
                    schema_json:
                      type: string
                      description: >-
                        The schema of the index in JSON format. Supported types
                        are ``integer``, ``long``, ``float``, ``double``,
                        ``boolean``, ``string``, ``date``, ``timestamp``.
                        Supported types for vector column: ``array<float>``,
                        ``array<double>``,`.
                  description: >-
                    Specification for Direct Vector Access Index. Required if
                    ``index_type`` is ``DIRECT_ACCESS``.
                index_subtype:
                  type: string
                  x-enum:
                    - FULL_TEXT
                    - HYBRID
                    - VECTOR
                  description: >-
                    The subtype of the index. Use ``HYBRID`` or ``FULL_TEXT``.
                    ``VECTOR`` is not supported.
              required:
                - name
                - endpoint_name
                - primary_key
                - index_type
