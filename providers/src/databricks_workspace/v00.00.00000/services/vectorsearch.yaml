                    default of
                    ``<catalog>.<schema>.reranker_<index_short_name>`` from
                    ``name``.
                num_queries:
                  type: integer
                  description: >-
                    Cap on the number of queries sampled from ``query_table``
                    (or generated when ``query_table`` is unset). Use -1 to
                    process all queries (the data-gen default). Lower values cut
                    LLM-judge cost and run time.
                query_column:
                  type: string
                  description: >-
                    Column in ``query_table`` containing the query text. Ignored
