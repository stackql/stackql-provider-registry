    patch:
      operationId: vector_search_endpoints_patch_endpoint
      summary: Update an endpoint
      tags:
        - vectorsearch
        - vector_search_endpoints
      description: |-
        Update an endpoint

        :param endpoint_name: str
          Name of the AI Search endpoint
        :param replication_factor: int (optional)
          OpenSearch replication factor. Directly sets userThroughputSettings.replicationFactor. Mutually
          exclusive with target_qps (and the deprecated min_qps alias). Must be non-negative (0 = no
          replication). The autoscaler caps the effective value based on endpoint scaling settings. Note: This
          is the raw replication factor, not "total data copies". For the user-facing replica count (which
          uses total-copies semantics), see PatchEndpointThroughputRequest.num_replicas.
        :param target_qps: int (optional)
          Target QPS for the endpoint. Best-effort; the system does not guarantee this QPS will be achieved.

        :returns: :class:`EndpointInfo`
      parameters:
        - name: endpoint_name
          in: path
          required: true
          schema:
            type: string
          description: Name of the AI Search endpoint
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                replication_factor:
                  type: integer
                  description: >-
                    OpenSearch replication factor. Directly sets
                    userThroughputSettings.replicationFactor. Mutually exclusive
                    with target_qps (and the deprecated min_qps alias). Must be
                    non-negative (0 = no replication). The autoscaler caps the
                    effective value based on endpoint scaling settings. Note:
                    This is the raw replication factor, not "total data copies".
                    For the user-facing replica count (which uses total-copies
                    semantics), see PatchEndpointThroughputRequest.num_replicas.
                target_qps:
                  type: integer
                  description: >-
                    Target QPS for the endpoint. Best-effort; the system does
                    not guarantee this QPS will be achieved.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointInfo'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: VectorSearchEndpointsAPI
