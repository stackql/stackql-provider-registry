openapi: 3.0.0
info:
  title: Databricks Vectorsearch API (workspace)
  description: >-
    OpenAPI specification for the Databricks vectorsearch service
    (workspace-level APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-07-31'
  x-stackql-sdk-namespace: databricks.sdk.service.vectorsearch
servers:
  - url: https://{deployment_name}.cloud.databricks.com
    variables:
      deployment_name:
        description: The Databricks Workspace Deployment Name
        default: dbc-abcd0123-a1bc
paths:
  /api/2.0/vector-search/endpoints:
    post:
      operationId: vector_search_endpoints_create_endpoint
      summary: Create a new endpoint.
      tags:
        - vectorsearch
        - vector_search_endpoints
      description: |-
        Create a new endpoint.

        :param name: str
          Name of the AI Search endpoint
        :param endpoint_type: :class:`EndpointType`
          Type of endpoint
        :param budget_policy_id: str (optional)
          The budget policy id to be applied
        :param num_replicas: int (optional)
          Initial number of replicas for the endpoint. If not specified, defaults to 1.
        :param target_qps: int (optional)
          Target QPS for the endpoint. Mutually exclusive with num_replicas. The actual replica count is
          calculated at index creation/sync time based on this value. Best-effort target; the system does not
          guarantee this QPS will be achieved.
        :param usage_policy_id: str (optional)
          The usage policy id to be applied once we've migrated to usage policies

        :returns:
          Long-running operation waiter for :class:`EndpointInfo`.
          See :method:wait_get_endpoint_vector_search_endpoint_online for more details.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the AI Search endpoint
                endpoint_type:
                  type: string
                  x-enum:
                    - STANDARD
                    - STORAGE_OPTIMIZED
                  description: Type of endpoint
                budget_policy_id:
                  type: string
                  description: The budget policy id to be applied
                num_replicas:
                  type: integer
                  description: >-
                    Initial number of replicas for the endpoint. If not
                    specified, defaults to 1.
                target_qps:
                  type: integer
                  description: >-
                    Target QPS for the endpoint. Mutually exclusive with
                    num_replicas. The actual replica count is calculated at
                    index creation/sync time based on this value. Best-effort
                    target; the system does not guarantee this QPS will be
                    achieved.
                usage_policy_id:
                  type: string
                  description: >-
                    The usage policy id to be applied once we've migrated to
                    usage policies
              required:
                - name
                - endpoint_type
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointInfo'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: VectorSearchEndpointsAPI
