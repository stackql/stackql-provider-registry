                    omitted.
                query_table:
                  type: string
                  description: >-
                    Optional fully qualified UC Delta table holding training
                    queries (catalog.schema.table). When unset, the data-gen job
                    synthesises queries from the index corpus via an LLM.
      responses:
        '200':
          description: Success
