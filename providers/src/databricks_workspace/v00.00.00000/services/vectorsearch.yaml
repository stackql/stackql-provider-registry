components:
  schemas:
    AdjustedThroughputRequest:
      type: object
      properties:
        concurrency:
          type: number
          description: Adjusted concurrency (total CPU) for the endpoint
        maximum_concurrency_allowed:
          type: number
          description: Adjusted maximum concurrency allowed for the endpoint
        minimal_concurrency_allowed:
          type: number
          description: Adjusted minimum concurrency allowed for the endpoint
      description: Adjusted throughput request parameters
    AutoEvalJob:
      type: object
      properties:
        current_stage:
          $ref: '#/components/schemas/AutoEvalStage'
          description: Pipeline stage currently in progress.
        dashboard_url:
          type: string
          description: Lakeview dashboard URL for the latest run's results.
        metrics_table_full_name:
          type: string
          description: >-
            Fully qualified Delta table name where per-run metrics are persisted
            (``autoeval_metrics_<index>``).
        mlflow_experiment_id:
          type: string
          description: >-
            MLflow experiment_id used by the autoeval wheel. Stable per index.
            The UI uses this to construct an "Open in MLflow" deep link without
            an additional MLflow tag fetch.
        mlflow_run_id:
          type: string
          description: MLflow run_id of the latest autoeval run. Per-run, latest only.
        overall_progress:
          type: number
          description: >-
            Overall progress across all stages, in the range [0.0, 1.0]. Capped
            at 0.99 while the run is RUNNING — the bar only reaches 1.0 when
            status flips to AUTO_EVAL_DISPLAY_STATUS_SUCCEEDED.
        progress_on_current_stage:
          type: integer
          description: >-
            Items completed within the current stage (e.g., queries generated,
            (query_type, reranker, phase) tuples evaluated, results saved).
        results_table_full_name:
          type: string
          description: >-
            Fully qualified Delta table name where per-query results are
            persisted (``autoeval_results_<index>``).
        total_for_current_stage:
          type: integer
          description: Total items expected within the current stage.
      description: >-
        State of the most recent autoeval Databricks Jobs background-compute run
        for an index. The UI
            uses this to render the staged progress bar.
    ColumnInfo:
      type: object
      properties:
        name:
          type: string
        type_text:
          type: string
          description: Data type of the column (e.g., "string", "int", "array<float>")
    CustomTag:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
          description: '[Optional] Value field for an AI Search endpoint tag.'
      required:
        - key
    DeleteDataResult:
      type: object
      properties:
        failed_primary_keys:
          type: array
          items:
            type: string
        success_row_count:
          type: integer
          description: Count of successfully processed rows.
    DeleteDataVectorIndexResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/DeleteDataResult'
        status:
          $ref: '#/components/schemas/DeleteDataStatus'
          description: Status of the delete operation.
    DeleteEndpointResponse:
      type: object
      properties: {}
    DeleteIndexResponse:
      type: object
      properties: {}
    DeltaSyncVectorIndexSpecRequest:
      type: object
      properties:
        columns_to_index:
          type: array
          items:
            type: string
        columns_to_sync:
          type: array
          items:
            type: string
          description: >-
            [Optional] Select the columns to sync with the vector index. If you
            leave this field blank, all columns from the source table are synced
            with the index. The primary key column and embedding source column
            or embedding vector column are always synced.
        effective_budget_policy_id:
          type: string
          description: The budget policy id applied to the AI Search index
        effective_usage_policy_id:
          type: string
        embedding_source_columns:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingSourceColumn'
          description: The columns that contain the embedding source.
        embedding_vector_columns:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingVectorColumn'
          description: The columns that contain the embedding vectors.
        embedding_writeback_table:
          type: string
          description: >-
            [Optional] Name of the Delta table to sync the vector index contents
            and computed embeddings to.
        pipeline_type:
          $ref: '#/components/schemas/PipelineType'
          description: >-
            Pipeline execution mode. - ``TRIGGERED``: If the pipeline uses the
            triggered execution mode, the system stops processing after
            successfully refreshing the source table in the pipeline once,
            ensuring the table is updated based on the data available when the
            update started. - ``CONTINUOUS``: If the pipeline uses continuous
            execution, the pipeline processes new data as it arrives in the
            source table to keep vector index fresh.
        source_table:
          type: string
          description: The name of the source table.
    DeltaSyncVectorIndexSpecResponse:
      type: object
      properties:
        columns_to_index:
          type: array
          items:
            type: string
        columns_to_sync:
          type: array
          items:
            type: string
          description: >-
            [Optional] Select the columns to sync with the vector index. If you
            leave this field blank, all columns from the source table are synced
            with the index. The primary key column and embedding source column
            or embedding vector column are always synced.
        effective_budget_policy_id:
          type: string
          description: The budget policy id applied to the AI Search index
        effective_usage_policy_id:
          type: string
        embedding_source_columns:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingSourceColumn'
          description: The columns that contain the embedding source.
        embedding_vector_columns:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingVectorColumn'
          description: The columns that contain the embedding vectors.
        embedding_writeback_table:
          type: string
          description: >-
            [Optional] Name of the Delta table to sync the vector index contents
            and computed embeddings to.
        pipeline_id:
          type: string
          description: The ID of the pipeline that is used to sync the index.
        pipeline_type:
          $ref: '#/components/schemas/PipelineType'
          description: >-
            Pipeline execution mode. - ``TRIGGERED``: If the pipeline uses the
            triggered execution mode, the system stops processing after
            successfully refreshing the source table in the pipeline once,
            ensuring the table is updated based on the data available when the
            update started. - ``CONTINUOUS``: If the pipeline uses continuous
            execution, the pipeline processes new data as it arrives in the
            source table to keep vector index fresh.
        source_table:
          type: string
          description: The name of the source table.
    DirectAccessVectorIndexSpec:
      type: object
      properties:
        embedding_source_columns:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingSourceColumn'
        embedding_vector_columns:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingVectorColumn'
          description: >-
            The columns that contain the embedding vectors. The format should be
            array[double].
        requested_schema_json:
          type: string
          description: >-
            The index schema exactly as the user supplied it on create,
            preserving the original type spellings (e.g. ``integer``) rather
            than Unity Catalog's canonical names (e.g. ``int``) that
            ``schema_json`` returns.
        schema_json:
          type: string
          description: >-
            The schema of the index in JSON format. Supported types are
            ``integer``, ``long``, ``float``, ``double``, ``boolean``,
            ``string``, ``date``, ``timestamp``. Supported types for vector
            column: ``array<float>``, ``array<double>``,`.
    EmbeddingSourceColumn:
      type: object
      properties:
        embedding_model_endpoint_name:
          type: string
        model_endpoint_name_for_query:
          type: string
          description: >-
            Name of the embedding model endpoint which, if specified, is used
            for querying (not ingestion).
        name:
          type: string
          description: Name of the column
    EmbeddingVectorColumn:
      type: object
      properties:
        embedding_dimension:
          type: integer
        name:
          type: string
          description: Name of the column
    EndpointInfo:
      type: object
      properties:
        budget_policy_id:
          type: string
        creation_timestamp:
          type: integer
          description: Timestamp of endpoint creation
        creator:
          type: string
          description: Creator of the endpoint
        custom_tags:
          type: array
          items:
            $ref: '#/components/schemas/CustomTag'
          description: The custom tags assigned to the endpoint
        effective_budget_policy_id:
          type: string
          description: The budget policy id applied to the endpoint
        endpoint_status:
          $ref: '#/components/schemas/EndpointStatus'
          description: Current status of the endpoint
        endpoint_type:
          $ref: '#/components/schemas/EndpointType'
          description: Type of endpoint
        id:
          type: string
          description: Unique identifier of the endpoint
        last_updated_timestamp:
          type: integer
          description: Timestamp of last update to the endpoint
        last_updated_user:
          type: string
          description: User who last updated the endpoint
        name:
          type: string
          description: Name of the AI Search endpoint
        num_indexes:
          type: integer
          description: Number of indexes on the endpoint
        scaling_info:
          $ref: '#/components/schemas/EndpointScalingInfo'
          description: Scaling information for the endpoint
        throughput_info:
          $ref: '#/components/schemas/EndpointThroughputInfo'
          description: Throughput information for the endpoint
    EndpointScalingInfo:
      type: object
      properties:
        requested_target_qps:
          type: integer
        state:
          $ref: '#/components/schemas/ScalingChangeState'
          description: The current state of the scaling change request.
    EndpointStatus:
      type: object
      properties:
        message:
          type: string
          description: Additional status message
        state:
          $ref: '#/components/schemas/EndpointStatusState'
          description: Current state of the endpoint
      description: Status information of an endpoint
    EndpointThroughputInfo:
      type: object
      properties:
        change_request_message:
          type: string
          description: Additional information about the throughput change request
        change_request_state:
          $ref: '#/components/schemas/ThroughputChangeRequestState'
          description: The state of the most recent throughput change request
        current_concurrency:
          type: number
          description: The current concurrency (total CPU) allocated to the endpoint
        current_concurrency_utilization_percentage:
          type: number
          description: The current utilization of concurrency as a percentage (0-100)
        current_num_replicas:
          type: integer
          description: The current number of replicas allocated to the endpoint
        maximum_concurrency_allowed:
          type: number
          description: The maximum concurrency allowed for this endpoint
        minimal_concurrency_allowed:
          type: number
          description: The minimum concurrency allowed for this endpoint
        requested_concurrency:
          type: number
          description: The requested concurrency (total CPU) for the endpoint
        requested_num_replicas:
          type: integer
          description: The requested number of replicas for the endpoint
      description: Throughput information for an endpoint
    FacetResultData:
      type: object
      properties:
        facet_array:
          type: array
          items:
            type: array
            items:
              type: string
          description: >-
            Facet rows. Each row is ``[facet_column_name, value_or_range,
            count]``.
        facet_row_count:
          type: integer
          description: Number of facet rows returned.
      description: Facet aggregation rows returned by a query.
    GetAutoEvalStatusResponse:
      type: object
      properties:
        end_time_ms:
          type: integer
        job_id:
          type: string
          description: >-
            Databricks Jobs job_id of the autoeval background-compute job for
            this index, so the UI can surface a link to the job. Unset when no
            autoeval job exists for the index yet.
        latest_run:
          $ref: '#/components/schemas/AutoEvalJob'
          description: >-
            State of the latest autoeval run, including stage progress.
            Populated only while status is AUTO_EVAL_DISPLAY_STATUS_RUNNING and
            the running wheel has reported at least one stage update. Absent for
            terminal states.
        run_as_user:
          type: string
          description: >-
            The user the latest job run was created as. Used by the UI to
            construct the per-run MLflow dashboard URL.
        state_message:
          type: string
          description: >-
            Free-form failure copy from the underlying job. Populated only when
            status is AUTO_EVAL_DISPLAY_STATUS_FAILED. Capped server-side to
            bound payload size when the job emits long stack traces.
        status:
          $ref: '#/components/schemas/AutoEvalDisplayStatus'
          description: Current display status of the latest autoeval run.
    GetVectorSearchEndpointPermissionLevelsResponse:
      type: object
      properties:
        permission_levels:
          type: array
          items:
            $ref: '#/components/schemas/VectorSearchEndpointPermissionsDescription'
    ListEndpointResponse:
      type: object
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/EndpointInfo'
        next_page_token:
