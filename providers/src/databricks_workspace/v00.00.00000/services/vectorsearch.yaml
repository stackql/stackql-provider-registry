    DeleteDataStatus:
      type: string
      x-enum:
        - FAILURE
        - PARTIAL_SUCCESS
        - SUCCESS
      description: |-
        Create a collection of name/value pairs.

        Example enumeration:

        >>> class Color(Enum):
        ...     RED = 1
        ...     BLUE = 2
        ...     GREEN = 3

        Access them by:

        - attribute access:

          >>> Color.RED
          <Color.RED: 1>

        - value lookup:

          >>> Color(1)
          <Color.RED: 1>

        - name lookup:

          >>> Color['RED']
          <Color.RED: 1>

        Enumerations can be iterated over, and know how many members they have:

        >>> len(Color)
        3

        >>> list(Color)
        [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

        Methods can be added to enumerations, and members can have their own
        attributes -- see the documentation for details.
    EndpointStatusState:
      type: string
      x-enum:
        - DELETED
        - OFFLINE
        - ONLINE
        - PROVISIONING
        - RED_STATE
        - STARTING
        - STOPPED
        - STOPPING
        - YELLOW_STATE
      description: Current state of the endpoint
    EndpointType:
      type: string
      x-enum:
        - STANDARD
        - STORAGE_OPTIMIZED
      description: Type of endpoint.
    IndexSubtype:
      type: string
      x-enum:
        - FULL_TEXT
        - HYBRID
        - VECTOR
      description: >-
        The subtype of the AI Search index, determining the indexing and
        retrieval strategy.


        - ``VECTOR``: Not supported. Use ``HYBRID`` instead.

        - ``FULL_TEXT``: An index that uses full-text search without vector
        embeddings.

        - ``HYBRID``: An index that uses vector embeddings for similarity search
        and hybrid search.
    PipelineType:
      type: string
      x-enum:
        - CONTINUOUS
        - TRIGGERED
      description: >-
        Pipeline execution mode.


        - ``TRIGGERED``: If the pipeline uses the triggered execution mode, the
        system stops processing
          after successfully refreshing the source table in the pipeline once, ensuring the table is
          updated based on the data available when the update started.
        - ``CONTINUOUS``: If the pipeline uses continuous execution, the
        pipeline processes new data as
          it arrives in the source table to keep vector index fresh.
    ScalingChangeState:
      type: string
      x-enum:
        - SCALING_CHANGE_APPLIED
        - SCALING_CHANGE_IN_PROGRESS
        - SCALING_CHANGE_UNSPECIFIED
      description: |-
        Create a collection of name/value pairs.

        Example enumeration:

        >>> class Color(Enum):
        ...     RED = 1
        ...     BLUE = 2
        ...     GREEN = 3

        Access them by:

        - attribute access:

          >>> Color.RED
          <Color.RED: 1>

        - value lookup:

          >>> Color(1)
          <Color.RED: 1>

        - name lookup:

          >>> Color['RED']
          <Color.RED: 1>

        Enumerations can be iterated over, and know how many members they have:

        >>> len(Color)
        3

        >>> list(Color)
        [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

        Methods can be added to enumerations, and members can have their own
        attributes -- see the documentation for details.
    UpsertDataStatus:
      type: string
      x-enum:
        - FAILURE
        - PARTIAL_SUCCESS
        - SUCCESS
      description: |-
        Create a collection of name/value pairs.

        Example enumeration:

        >>> class Color(Enum):
        ...     RED = 1
        ...     BLUE = 2
        ...     GREEN = 3

        Access them by:

        - attribute access:

          >>> Color.RED
          <Color.RED: 1>

        - value lookup:

          >>> Color(1)
          <Color.RED: 1>

        - name lookup:

          >>> Color['RED']
          <Color.RED: 1>

        Enumerations can be iterated over, and know how many members they have:

        >>> len(Color)
        3

        >>> list(Color)
        [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

        Methods can be added to enumerations, and members can have their own
        attributes -- see the documentation for details.
    VectorIndexType:
      type: string
      x-enum:
        - DELTA_SYNC
        - DIRECT_ACCESS
      description: >-
        There are 2 types of AI Search indexes:


        - ``DELTA_SYNC``: An index that automatically syncs with a source Delta
        Table, automatically and
          incrementally updating the index as the underlying data in the Delta Table changes.
        - ``DIRECT_ACCESS``: An index that supports direct read and write of
        vectors and metadata
          through our REST and SDK APIs. With this model, the user manages index updates.
    VectorSearchEndpointPermissionLevel:
      type: string
      x-enum:
        - CAN_CREATE
        - CAN_MANAGE
        - CAN_USE
      description: Permission level
