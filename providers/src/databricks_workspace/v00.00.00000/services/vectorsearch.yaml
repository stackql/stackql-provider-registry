  /api/2.0/vector-search/indexes:
    post:
      operationId: vector_search_indexes_create_index
      summary: Create a new index.
      tags:
        - vectorsearch
        - vector_search_indexes
      description: >-
        Create a new index.


        :param name: str
          Name of the index
        :param endpoint_name: str
          Name of the endpoint to be used for serving the index
        :param primary_key: str
          Primary key of the index
        :param index_type: :class:`VectorIndexType`

        :param delta_sync_index_spec: :class:`DeltaSyncVectorIndexSpecRequest`
        (optional)
          Specification for Delta Sync Index. Required if ``index_type`` is ``DELTA_SYNC``.
        :param direct_access_index_spec: :class:`DirectAccessVectorIndexSpec`
        (optional)
          Specification for Direct Vector Access Index. Required if ``index_type`` is ``DIRECT_ACCESS``.
        :param index_subtype: :class:`IndexSubtype` (optional)
          The subtype of the index. Use ``HYBRID`` or ``FULL_TEXT``. ``VECTOR`` is not supported.

        :returns: :class:`VectorIndex`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the index
                endpoint_name:
                  type: string
                  description: Name of the endpoint to be used for serving the index
                primary_key:
                  type: string
                  description: Primary key of the index
                index_type:
                  type: string
                  x-enum:
                    - DELTA_SYNC
                    - DIRECT_ACCESS
                  description: >-
                    There are 2 types of AI Search indexes:


                    - ``DELTA_SYNC``: An index that automatically syncs with a
                    source Delta Table, automatically and
                      incrementally updating the index as the underlying data in the Delta Table changes.
                    - ``DIRECT_ACCESS``: An index that supports direct read and
                    write of vectors and metadata
                      through our REST and SDK APIs. With this model, the user manages index updates.
                delta_sync_index_spec:
                  type: object
                  properties:
                    columns_to_index:
                      type: array
                      items:
                        type: string
                    columns_to_sync:
                      type: array
                      items:
                        type: string
                      description: >-
                        [Optional] Select the columns to sync with the vector
                        index. If you leave this field blank, all columns from
                        the source table are synced with the index. The primary
                        key column and embedding source column or embedding
                        vector column are always synced.
                    effective_budget_policy_id:
                      type: string
                      description: The budget policy id applied to the AI Search index
                    effective_usage_policy_id:
                      type: string
                    embedding_source_columns:
                      type: array
                      items:
                        type: object
                        properties:
                          embedding_model_endpoint_name:
                            type: string
                          model_endpoint_name_for_query:
                            type: string
                            description: >-
                              Name of the embedding model endpoint which, if
                              specified, is used for querying (not ingestion).
                          name:
                            type: string
                            description: Name of the column
                      description: The columns that contain the embedding source.
                    embedding_vector_columns:
                      type: array
                      items:
                        type: object
                        properties:
                          embedding_dimension:
                            type: integer
                          name:
                            type: string
                            description: Name of the column
                      description: The columns that contain the embedding vectors.
                    embedding_writeback_table:
                      type: string
                      description: >-
                        [Optional] Name of the Delta table to sync the vector
                        index contents and computed embeddings to.
                    pipeline_type:
                      type: string
                      x-enum:
                        - CONTINUOUS
                        - TRIGGERED
                      description: >-
                        Pipeline execution mode. - ``TRIGGERED``: If the
                        pipeline uses the triggered execution mode, the system
                        stops processing after successfully refreshing the
                        source table in the pipeline once, ensuring the table is
                        updated based on the data available when the update
                        started. - ``CONTINUOUS``: If the pipeline uses
                        continuous execution, the pipeline processes new data as
                        it arrives in the source table to keep vector index
                        fresh.
                    source_table:
                      type: string
                      description: The name of the source table.
                  description: >-
                    Specification for Delta Sync Index. Required if
                    ``index_type`` is ``DELTA_SYNC``.
                direct_access_index_spec:
                  type: object
                  properties:
                    embedding_source_columns:
                      type: array
                      items:
                        type: object
                        properties:
                          embedding_model_endpoint_name:
                            type: string
                          model_endpoint_name_for_query:
                            type: string
                            description: >-
                              Name of the embedding model endpoint which, if
                              specified, is used for querying (not ingestion).
                          name:
