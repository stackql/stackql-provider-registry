  /api/2.0/vector-search/indexes/{index_name}/query:
    post:
      operationId: vector_search_indexes_query_index
      summary: Query the specified vector index.
      tags:
        - vectorsearch
        - vector_search_indexes
      description: |-
        Query the specified vector index.

        :param index_name: str
          Name of the vector index to query.
        :param columns: List[str]
          List of column names to include in the response.
        :param columns_to_rerank: List[str] (optional)
          Column names used to retrieve data to send to the reranker.
        :param facets: List[str] (optional)
          Facets to compute over the matched results. Each entry has one of these forms: ``"<column>"`` - top
          10 distinct values by count ``"<column> TOP <n>"`` - top n distinct values, where n > 0 ``"<column>
          BUCKETS [[from,to],...]"`` - inclusive numeric ranges ``TOP`` and ``BUCKETS`` are case-insensitive.
          A column may appear at most once.
        :param filters_json: str (optional)
          JSON string representing query filters.

          Example filters:

          - ``{"id <": 5}``: Filter for id less than 5.
          - ``{"id >": 5}``: Filter for id greater than 5.
          - ``{"id <=": 5}``: Filter for id less than equal to 5.
          - ``{"id >=": 5}``: Filter for id greater than equal to 5.
          - ``{"id": 5}``: Filter for id equal to 5.
        :param num_results: int (optional)
          Number of results to return. Defaults to 10.
        :param query_columns: List[str] (optional)
          Text columns to search for ``query_text``. When empty, all text columns are searched.
        :param query_text: str (optional)
          Query text. Required for Delta Sync Index using model endpoint.
        :param query_type: str (optional)
          The query type to use. Choices are ``ANN`` and ``HYBRID`` and ``FULL_TEXT``. Defaults to ``ANN``.
        :param query_vector: List[float] (optional)
          Query vector. Required for Direct Vector Access Index and Delta Sync Index using self-managed
          vectors.
        :param reranker: :class:`RerankerConfig` (optional)
          If set, the top 50 results are reranked with the Databricks Reranker model before returning the
          ``num_results`` results to the user. The setting ``columns_to_rerank`` selects which columns are
          used for reranking. For each datapoint, the columns selected are concatenated before being sent to
          the reranking model. See https://docs.databricks.com/aws/en/vector-search/query-vector-search#rerank
          for more information.
        :param score_threshold: float (optional)
          Threshold for the approximate nearest neighbor search. Defaults to 0.0.
        :param sort_columns: List[str] (optional)
          Sort results by column values instead of the default relevance ordering. Each clause has the form
          ``"<column> ASC"`` or ``"<column> DESC"``, for example ``["rating DESC", "price ASC"]``.

        :returns: :class:`QueryVectorIndexResponse`
      parameters:
        - name: index_name
          in: path
          required: true
          schema:
            type: string
          description: Name of the vector index to query.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                columns:
                  type: array
                  items:
                    type: string
                  description: List of column names to include in the response.
                columns_to_rerank:
                  type: array
                  items:
                    type: string
                  description: Column names used to retrieve data to send to the reranker.
                facets:
                  type: array
                  items:
                    type: string
                  description: >-
                    Facets to compute over the matched results. Each entry has
                    one of these forms: ``"<column>"`` - top 10 distinct values
                    by count ``"<column> TOP <n>"`` - top n distinct values,
                    where n > 0 ``"<column> BUCKETS [[from,to],...]"`` -
                    inclusive numeric ranges ``TOP`` and ``BUCKETS`` are
                    case-insensitive. A column may appear at most once.
                filters_json:
                  type: string
                  description: >-
                    JSON string representing query filters. Example filters: -
                    ``{"id <": 5}``: Filter for id less than 5. - ``{"id >":
                    5}``: Filter for id greater than 5. - ``{"id <=": 5}``:
                    Filter for id less than equal to 5. - ``{"id >=": 5}``:
                    Filter for id greater than equal to 5. - ``{"id": 5}``:
                    Filter for id equal to 5.
                num_results:
                  type: integer
                  description: Number of results to return. Defaults to 10.
                query_columns:
                  type: array
                  items:
                    type: string
                  description: >-
                    Text columns to search for ``query_text``. When empty, all
                    text columns are searched.
                query_text:
                  type: string
                  description: >-
                    Query text. Required for Delta Sync Index using model
                    endpoint.
                query_type:
                  type: string
                  description: >-
                    The query type to use. Choices are ``ANN`` and ``HYBRID``
                    and ``FULL_TEXT``. Defaults to ``ANN``.
                query_vector:
                  type: array
                  items:
                    type: number
                  description: >-
                    Query vector. Required for Direct Vector Access Index and
                    Delta Sync Index using self-managed vectors.
                reranker:
                  type: object
                  properties:
                    model:
                      type: string
                    parameters:
                      type: object
                      properties:
                        columns_to_rerank:
                          type: array
                          items:
                            type: string
                      description: >-
                        Parameters that control how the reranker processes the
                        query results.
                  description: >-
                    If set, the top 50 results are reranked with the Databricks
                    Reranker model before returning the ``num_results`` results
                    to the user. The setting ``columns_to_rerank`` selects which
                    columns are used for reranking. For each datapoint, the
                    columns selected are concatenated before being sent to the
                    reranking model. See
                    https://docs.databricks.com/aws/en/vector-search/query-vector-search#rerank
                    for more information.
                score_threshold:
                  type: number
                  description: >-
                    Threshold for the approximate nearest neighbor search.
                    Defaults to 0.0.
                sort_columns:
                  type: array
                  items:
                    type: string
                  description: >-
                    Sort results by column values instead of the default
                    relevance ordering. Each clause has the form ``"<column>
                    ASC"`` or ``"<column> DESC"``, for example ``["rating DESC",
                    "price ASC"]``.
              required:
                - columns
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryVectorIndexResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: VectorSearchIndexesAPI
