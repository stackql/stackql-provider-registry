          items:
            $ref: '#/components/schemas/MiniVectorIndex'
    MapStringValueEntry:
      type: object
      properties:
        key:
          type: string
          description: Column name.
        value:
          $ref: '#/components/schemas/Value'
          description: Column value, nullable.
      description: Key-value pair.
    Metric:
      type: object
      properties:
        labels:
          type: array
          items:
            $ref: '#/components/schemas/MetricLabel'
