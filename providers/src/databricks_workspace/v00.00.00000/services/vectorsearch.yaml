      summary: Triggers an autoeval quality evaluation for a vector index.
      tags:
        - vectorsearch
        - vector_search_indexes
      description: |-
        Triggers an autoeval quality evaluation for a vector index.

        :param name: str
          Fully qualified index name (catalog.schema.index).
        :param num_queries: int (optional)
          Number of queries to generate for evaluation (default: 50).
        :param num_results: int (optional)
          Number of results to fetch per query (default: 10).
        :param query_types: List[str] (optional)
          Query types to evaluate (default: FULL_TEXT, ANN, HYBRID).
        :param queryset_query_column: str (optional)
          Column in ``queryset_table`` holding the query text. Required when ``queryset_table`` is set;
          ignored otherwise.
        :param queryset_relevant_docs_column: str (optional)
          Optional column in ``queryset_table`` holding the ground-truth relevant document IDs for each query
          (STRING or ARRAY<STRING>). When set, recall@k is reported against these labels; when unset,
          evaluation falls back to LLM-judged metrics only. Ignored when ``queryset_table`` is unset.
        :param queryset_table: str (optional)
          Fully qualified Unity Catalog table (catalog.schema.table) of evaluation queries to run against the
          index. When set, queries are read from this table and synthetic query generation is skipped. The
          table takes precedence over any automatically detected query source.

        :returns: :class:`RunAutoEvalResponse`
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Fully qualified index name (catalog.schema.index).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                num_queries:
                  type: integer
                  description: 'Number of queries to generate for evaluation (default: 50).'
                num_results:
                  type: integer
                  description: 'Number of results to fetch per query (default: 10).'
                query_types:
                  type: array
                  items:
                    type: string
                  description: 'Query types to evaluate (default: FULL_TEXT, ANN, HYBRID).'
                queryset_query_column:
                  type: string
                  description: >-
                    Column in ``queryset_table`` holding the query text.
                    Required when ``queryset_table`` is set; ignored otherwise.
                queryset_relevant_docs_column:
                  type: string
                  description: >-
                    Optional column in ``queryset_table`` holding the
                    ground-truth relevant document IDs for each query (STRING or
                    ARRAY<STRING>). When set, recall@k is reported against these
                    labels; when unset, evaluation falls back to LLM-judged
                    metrics only. Ignored when ``queryset_table`` is unset.
                queryset_table:
                  type: string
                  description: >-
                    Fully qualified Unity Catalog table (catalog.schema.table)
                    of evaluation queries to run against the index. When set,
                    queries are read from this table and synthetic query
                    generation is skipped. The table takes precedence over any
                    automatically detected query source.
      responses:
