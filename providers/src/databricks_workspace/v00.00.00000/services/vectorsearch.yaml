  /api/2.0/vector-search/endpoints/{endpoint_name}/throughput:
    patch:
      operationId: vector_search_endpoints_patch_endpoint_throughput
      summary: Update the throughput (concurrency) of an endpoint
      tags:
        - vectorsearch
        - vector_search_endpoints
      description: |-
        Update the throughput (concurrency) of an endpoint

        :param endpoint_name: str
          Name of the AI Search endpoint
        :param all_or_nothing: bool (optional)
          If true, the request will fail if the requested concurrency or limits cannot be exactly met. If
          false, the request will be adjusted to the closest possible value.
        :param concurrency: float (optional)
          Requested concurrency (total CPU) for the endpoint. If not specified, the current concurrency is
          maintained.
        :param maximum_concurrency_allowed: float (optional)
          Maximum concurrency allowed for the endpoint. If not specified, the current maximum is maintained.
        :param minimal_concurrency_allowed: float (optional)
          Minimum concurrency allowed for the endpoint. If not specified, the current minimum is maintained.
        :param num_replicas: int (optional)
          Requested number of data copies for the endpoint (including primary). For example: num_replicas=2
          means 2 total copies of the data (1 primary + 1 replica). If not specified, the current replication
          factor is maintained. Valid range: 1-6 (where 1 = no replication, 6 = 1 primary + 5 replicas).

        :returns: :class:`PatchEndpointThroughputResponse`
      parameters:
        - name: endpoint_name
          in: path
          required: true
          schema:
            type: string
          description: Name of the AI Search endpoint
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                all_or_nothing:
                  type: boolean
                  description: >-
                    If true, the request will fail if the requested concurrency
                    or limits cannot be exactly met. If false, the request will
                    be adjusted to the closest possible value.
                concurrency:
                  type: number
                  description: >-
                    Requested concurrency (total CPU) for the endpoint. If not
                    specified, the current concurrency is maintained.
                maximum_concurrency_allowed:
                  type: number
                  description: >-
                    Maximum concurrency allowed for the endpoint. If not
                    specified, the current maximum is maintained.
                minimal_concurrency_allowed:
                  type: number
                  description: >-
                    Minimum concurrency allowed for the endpoint. If not
                    specified, the current minimum is maintained.
                num_replicas:
                  type: integer
                  description: >-
                    Requested number of data copies for the endpoint (including
                    primary). For example: num_replicas=2 means 2 total copies
                    of the data (1 primary + 1 replica). If not specified, the
                    current replication factor is maintained. Valid range: 1-6
                    (where 1 = no replication, 6 = 1 primary + 5 replicas).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchEndpointThroughputResponse'
        default:
          description: Error response
          content:
