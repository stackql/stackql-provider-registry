openapi: 3.0.0
info:
  title: Databricks Dataclassification API (workspace)
  description: >-
    OpenAPI specification for the Databricks dataclassification service
    (workspace-level APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.dataclassification
servers:
  - url: https://{deployment_name}.{workspace_domain}
    variables:
      deployment_name:
        description: >-
          The Databricks workspace deployment name: the host prefix of the
          workspace URL (dbc-abcd0123-a1bc on AWS, adb-1234567890123456.7 on
          Azure, 1234567890123456.7 on GCP). Set DATABRICKS_DEPLOYMENT_NAME to
          default it for the session.
        default: dbc-abcd0123-a1bc
        x-stackQL-envVar: DATABRICKS_DEPLOYMENT_NAME
      workspace_domain:
        description: >-
          The Databricks workspace domain suffix for the cloud. Selected by
          DATABRICKS_CLOUD (aws, azure or gcp; default aws).
        default: cloud.databricks.com
        x-stackQL-envVarSelector:
          envVar: DATABRICKS_CLOUD
          default: aws
          values:
            aws: cloud.databricks.com
            azure: azuredatabricks.net
            gcp: gcp.databricks.com
paths:
  /api/data-classification/v1/catalogs/{catalog_name}/config:
    post:
      operationId: data_classification_create_catalog_config
      summary: Create Data Classification configuration for a catalog.
      tags:
        - dataclassification
        - data_classification
      description: >-
        Create Data Classification configuration for a catalog.


        Creates a new config resource, which enables Data Classification for the
        specified catalog.


        - The config must not already exist for the catalog.


        :param parent: str
          Parent resource in the format: catalogs/{catalog_name}
        :param catalog_config: :class:`CatalogConfig`
          The configuration to create.

        :returns: :class:`CatalogConfig`
      parameters:
        - name: catalog_name
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `catalog_name` segment of the `parent` resource name
            (`catalogs/{catalog_name}`). Parent resource in the format:
            catalogs/{catalog_name}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_tag_configs:
                  type: array
                  items:
                    type: object
                    properties:
                      classification_tag:
                        type: string
                        description: >-
                          The Classification Tag. For built-in classes this is a
                          system tag (e.g., "class.name", "class.location"); for
                          custom classes it is a user-defined governance tag
                          key.
                      auto_tagging_mode:
                        type: string
                        x-enum:
                          - AUTO_TAGGING_DISABLED
                          - AUTO_TAGGING_ENABLED
                        description: >-
                          Whether auto-tagging is enabled or disabled for this
                          classification tag.
                    required:
                      - classification_tag
                      - auto_tagging_mode
                    description: >-
                      Auto-tagging configuration for a classification tag. When
                      enabled, detected columns are
                          automatically tagged with Unity Catalog tags.
                  description: >-
                    List of auto-tagging configurations for this catalog. Empty
                    list means no auto-tagging is enabled.
                excluded_schemas:
                  type: object
                  properties:
                    names:
                      type: array
                      items:
                        type: string
                      description: >-
                        Schema names, each relative to the parent catalog. Must
                        not be empty.
                  required:
                    - names
                  description: >-
                    Schemas to exclude from the scan, each named relative to the
                    parent catalog. If specified, all schemas except the
                    specified ones will be scanned. Mutually exclusive with
                    ``included_schemas``: only one may be set per request. If
                    neither ``included_schemas`` nor ``excluded_schemas`` is
                    set, all schemas are scanned.
                included_schemas:
                  type: object
                  properties:
                    names:
                      type: array
                      items:
                        type: string
                      description: >-
                        Schema names, each relative to the parent catalog. Must
                        not be empty.
                  required:
                    - names
                  description: >-
                    Schemas to include in the scan, each named relative to the
                    parent catalog. If specified, only listed schemas will be
                    scanned. Mutually exclusive with ``excluded_schemas``: only
                    one may be set per request. If neither ``included_schemas``
                    nor ``excluded_schemas`` is set, all schemas are scanned.
                name:
                  type: string
                  description: 'Resource name in the format: catalogs/{catalog_name}/config.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogConfig'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: DataClassificationAPI
    delete:
      operationId: data_classification_delete_catalog_config
      summary: Delete Data Classification configuration for a catalog.
      tags:
        - dataclassification
        - data_classification
      description: |-
        Delete Data Classification configuration for a catalog.

        :param name: str
          Resource name in the format: catalogs/{catalog_name}/config
      parameters:
        - name: catalog_name
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `catalog_name` segment of the `name` resource name
            (`catalogs/{catalog_name}/config`). Resource name in the format:
            catalogs/{catalog_name}/config
      responses:
        '200':
          description: Success
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: DataClassificationAPI
    get:
      operationId: data_classification_get_catalog_config
      summary: Get the Data Classification configuration for a catalog.
      tags:
        - dataclassification
        - data_classification
      description: |-
        Get the Data Classification configuration for a catalog.

        :param name: str
          Resource name in the format: catalogs/{catalog_name}/config

        :returns: :class:`CatalogConfig`
      parameters:
        - name: catalog_name
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `catalog_name` segment of the `name` resource name
            (`catalogs/{catalog_name}/config`). Resource name in the format:
            catalogs/{catalog_name}/config
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogConfig'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: DataClassificationAPI
    patch:
      operationId: data_classification_update_catalog_config
      summary: Update the Data Classification configuration for a catalog.
      tags:
        - dataclassification
        - data_classification
      description: >-
        Update the Data Classification configuration for a catalog.


        - The config must already exist for the catalog.

        - Updates fields specified in the update_mask. Use update_mask field to
        perform partial updates of the
          configuration.

        :param name: str
          Resource name in the format: catalogs/{catalog_name}/config.
        :param catalog_config: :class:`CatalogConfig`
          The configuration to apply to the catalog. The name field in catalog_config identifies which
          resource to update.
        :param update_mask: FieldMask
          Field mask specifying which fields to update.

        :returns: :class:`CatalogConfig`
      parameters:
        - name: catalog_name
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `catalog_name` segment of the `name` resource name
            (`catalogs/{catalog_name}/config`). Resource name in the format:
            catalogs/{catalog_name}/config.
        - name: update_mask
          in: query
          required: true
          schema:
            type: object
          description: Field mask specifying which fields to update.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_tag_configs:
                  type: array
                  items:
                    type: object
                    properties:
                      classification_tag:
                        type: string
                        description: >-
                          The Classification Tag. For built-in classes this is a
                          system tag (e.g., "class.name", "class.location"); for
                          custom classes it is a user-defined governance tag
                          key.
                      auto_tagging_mode:
                        type: string
                        x-enum:
                          - AUTO_TAGGING_DISABLED
                          - AUTO_TAGGING_ENABLED
                        description: >-
                          Whether auto-tagging is enabled or disabled for this
                          classification tag.
                    required:
                      - classification_tag
                      - auto_tagging_mode
                    description: >-
                      Auto-tagging configuration for a classification tag. When
                      enabled, detected columns are
                          automatically tagged with Unity Catalog tags.
                  description: >-
                    List of auto-tagging configurations for this catalog. Empty
                    list means no auto-tagging is enabled.
                excluded_schemas:
                  type: object
                  properties:
                    names:
                      type: array
                      items:
                        type: string
                      description: >-
                        Schema names, each relative to the parent catalog. Must
                        not be empty.
                  required:
                    - names
                  description: >-
                    Schemas to exclude from the scan, each named relative to the
                    parent catalog. If specified, all schemas except the
                    specified ones will be scanned. Mutually exclusive with
                    ``included_schemas``: only one may be set per request. If
                    neither ``included_schemas`` nor ``excluded_schemas`` is
                    set, all schemas are scanned.
                included_schemas:
                  type: object
                  properties:
                    names:
                      type: array
                      items:
                        type: string
                      description: >-
                        Schema names, each relative to the parent catalog. Must
                        not be empty.
                  required:
                    - names
                  description: >-
                    Schemas to include in the scan, each named relative to the
                    parent catalog. If specified, only listed schemas will be
                    scanned. Mutually exclusive with ``excluded_schemas``: only
                    one may be set per request. If neither ``included_schemas``
                    nor ``excluded_schemas`` is set, all schemas are scanned.
                name:
                  type: string
                  description: 'Resource name in the format: catalogs/{catalog_name}/config.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogConfig'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: DataClassificationAPI
components:
  schemas:
    AutoTaggingConfig:
      type: object
      properties:
        classification_tag:
          type: string
          description: >-
            The Classification Tag. For built-in classes this is a system tag
            (e.g., "class.name", "class.location"); for custom classes it is a
            user-defined governance tag key.
        auto_tagging_mode:
          $ref: '#/components/schemas/AutoTaggingConfigAutoTaggingMode'
          description: >-
            Whether auto-tagging is enabled or disabled for this classification
            tag.
      required:
        - classification_tag
        - auto_tagging_mode
      description: >-
        Auto-tagging configuration for a classification tag. When enabled,
        detected columns are
            automatically tagged with Unity Catalog tags.
    CatalogConfig:
      type: object
      properties:
        auto_tag_configs:
          type: array
          items:
            $ref: '#/components/schemas/AutoTaggingConfig'
          description: >-
            List of auto-tagging configurations for this catalog. Empty list
            means no auto-tagging is enabled.
        excluded_schemas:
          $ref: '#/components/schemas/CatalogConfigSchemaNames'
          description: >-
            Schemas to exclude from the scan, each named relative to the parent
            catalog. If specified, all schemas except the specified ones will be
            scanned. Mutually exclusive with ``included_schemas``: only one may
            be set per request. If neither ``included_schemas`` nor
            ``excluded_schemas`` is set, all schemas are scanned.
        included_schemas:
          $ref: '#/components/schemas/CatalogConfigSchemaNames'
          description: >-
            Schemas to include in the scan, each named relative to the parent
            catalog. If specified, only listed schemas will be scanned. Mutually
            exclusive with ``excluded_schemas``: only one may be set per
            request. If neither ``included_schemas`` nor ``excluded_schemas`` is
            set, all schemas are scanned.
        name:
          type: string
          description: 'Resource name in the format: catalogs/{catalog_name}/config.'
      description: >-
        Data Classification configuration for a Unity Catalog catalog. This
        message follows the "At Most
            One Resource" pattern: at most one CatalogConfig exists per catalog.

            - Full CRUD operations are supported: Create enables Data Classification, Delete disables it
            - It has no unique identifier of its own and uses its parent catalog's identifier (catalog_name)
    CatalogConfigSchemaNames:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
          description: >-
            Schema names, each relative to the parent catalog. Must not be
            empty.
      required:
        - names
      description: Wrapper message for a list of schema names.
    AutoTaggingConfigAutoTaggingMode:
      type: string
      x-enum:
        - AUTO_TAGGING_DISABLED
        - AUTO_TAGGING_ENABLED
      description: Auto-tagging mode.
