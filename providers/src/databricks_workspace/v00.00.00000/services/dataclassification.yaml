              #/paths/~1api~1data-classification~1v1~1catalogs~1{catalog_name}~1config/get
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: >-
              #/paths/~1api~1data-classification~1v1~1catalogs~1{catalog_name}~1config/patch
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/catalog_configs/methods/get'
