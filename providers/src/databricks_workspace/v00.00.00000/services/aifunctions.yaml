openapi: 3.0.0
info:
  title: Databricks Aifunctions API (workspace)
  description: >-
    OpenAPI specification for the Databricks aifunctions service
    (workspace-level APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.aifunctions
servers:
  - url: https://{deployment_name}.{workspace_domain}
    variables:
      deployment_name:
        description: >-
          The Databricks workspace deployment name: the host prefix of the
          workspace URL (dbc-abcd0123-a1bc on AWS, adb-1234567890123456.7 on
          Azure, 1234567890123456.7 on GCP). Set DATABRICKS_DEPLOYMENT_NAME to
          default it for the session.
        default: dbc-abcd0123-a1bc
        x-stackQL-envVar: DATABRICKS_DEPLOYMENT_NAME
      workspace_domain:
        description: >-
          The Databricks workspace domain suffix for the cloud. Selected by
          DATABRICKS_CLOUD (aws, azure or gcp; default aws).
        default: cloud.databricks.com
        x-stackQL-envVarSelector:
          envVar: DATABRICKS_CLOUD
          default: aws
          values:
            aws: cloud.databricks.com
            azure: azuredatabricks.net
            gcp: gcp.databricks.com
paths:
  /api/2.0/ai-functions/ai-classify:
    post:
      operationId: ai_functions_ai_classify
      summary: >-
        Classifies content according to a set of provided labels. For REST API
        requests, the default rate
      tags:
        - aifunctions
        - ai_functions
      description: >-
        Classifies content according to a set of provided labels. For REST API
        requests, the default rate

        limit is 1,200 requests per minute per workspace. Contact your
        Databricks account team to request a

        higher limit.


        :param content: any
          The content to classify. It accepts a plain string or the response object of
          [ai_parse_document](:method:AiFunctions/AiParseDocument).
        :param labels: any
          The label set to classify as. Either a JSON array of label strings (e.g. ["spam", "not_spam"]), or a
          JSON object mapping each label to a description (e.g. {"spam": "unsolicited bulk message",
          "not_spam": "a legitimate message"}). Accepts 2 to 500 labels, each 1 to 100 characters.
        :param options: :class:`AiClassifyOptions` (optional)
          Function options. Omitted fields fall back to their documented defaults.

        :returns: :class:`AiClassifyResponse`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: object
                  description: >-
                    The content to classify. It accepts a plain string or the
                    response object of
                    [ai_parse_document](:method:AiFunctions/AiParseDocument).
                labels:
                  type: object
                  description: >-
                    The label set to classify as. Either a JSON array of label
                    strings (e.g. ["spam", "not_spam"]), or a JSON object
                    mapping each label to a description (e.g. {"spam":
                    "unsolicited bulk message", "not_spam": "a legitimate
                    message"}). Accepts 2 to 500 labels, each 1 to 100
                    characters.
                options:
                  type: object
                  properties:
                    enable_confidence_scores:
                      type: boolean
                      description: >-
                        When true, includes a per-label confidence score in the
                        response.
                    enable_rationales:
                      type: boolean
                      description: >-
                        When true, includes a rationale explaining each
                        classification in the response.
                    instructions:
                      type: string
                      description: >-
                        Natural-language guidance that steers how the text is
                        classified (up to 20,000 characters).
                    multilabel:
                      type: boolean
                      description: >-
                        When true, allows more than one label to be returned per
                        input.
                    version:
                      type: string
                      description: >-
                        The function version to invoke. Defaults to the latest
                        version. Supported versions: ["2.1"].
                  description: >-
                    Function options. Omitted fields fall back to their
                    documented defaults.
              required:
                - content
                - labels
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiClassifyResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AiFunctionsAPI
  /api/2.0/ai-functions/ai-decide:
    post:
      operationId: ai_functions_ai_decide
      summary: >-
        Turn text and structured data into decisions your application can use.
        Define questions and criteria
      tags:
        - aifunctions
        - ai_functions
      description: >-
        Turn text and structured data into decisions your application can use.
        Define questions and criteria

        to choose an option, estimate a probability, or assign a score given a
        provided state.


        :param state: any
          A string, JSON object, or array containing the content, related context, and examples needed to
          answer the provided questions. For example, provide a support message, a conversation, or records
          describing the current state of an application. All questions receive this same state.
        :param questions: any
          A JSON object mapping question IDs to their definitions. Each ID must contain non-whitespace text;
          its answer is returned with the same ID in ``response.answers``.

          Each definition is an object with the required fields ``type`` and ``instructions``. The
          ``criteria`` field is optional for the type ``noul`` but is required for the types ``choice`` and
          ``score``.

          The ``instructions`` field describes the judgment to make and can be a string, object, or array. Use
          an object or array to include supporting context alongside the instructions.

          The ``type`` can be one of:

          - ``choice``: Selects one option from a defined set. Requires ``criteria`` to be an object mapping 1
            to 255 nonempty option names to descriptions. The criteria description can be a string, object,
            array, or null when the name needs no additional detail. For example:

          .. code-block:: json

             {
             "team": {
             "type": "choice",
             "instructions": "Which team should handle this ticket?",
             "criteria": {
             "billing": "Payments, charges, and refunds",
             "technical_support": null
             }
             }
             }

          - ``noul``: Estimates the probability that the answer to a true-or-false question is true.
            ``criteria`` can take the fields ``true`` or ``false``, or both, with descriptions that are
            strings, objects, or arrays. Omit ``criteria`` to use the question alone. The instructions or at
            least one criteria description must contain non-whitespace text, a nonempty object, or a nonempty
            array. For example, both of the following are valid:

          .. code-block:: json

             {
             "escalate": {
             "type": "noul",
             "instructions": "Does this ticket need escalation?",
             "criteria": {
             "true": "Suspected fraud or an exception to standard policy",
             "false": "A routine issue frontline support can resolve"
             }
             }
             }

          or

          .. code-block:: json

             {
             "escalate": {
             "type": "noul",
             "instructions": "Does this ticket need escalation?"
             }
             }

          - ``score``: Rates the state on an ordered scale. Requires ``criteria`` to be an array of 2 to 10
            level descriptions, ordered from low to high. Descriptions must contain non-whitespace text, a
            nonempty object, or a nonempty array. Array positions define levels starting at 0. For example:

          .. code-block:: json

             {
             "urgency": {
             "type": "score",
             "instructions": "How urgent is this ticket?",
             "criteria": [
             "Routine: can wait a few days",
             "Time-sensitive: needs attention today",
             "Critical: needs immediate action"
             ]
             }
             }
        :param options: :class:`AiDecideOptions` (optional)
          Function options. Omitted fields fall back to their documented defaults.

        :returns: :class:`AiDecideResponse`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: object
                  description: >-
                    A string, JSON object, or array containing the content,
                    related context, and examples needed to answer the provided
                    questions. For example, provide a support message, a
                    conversation, or records describing the current state of an
                    application. All questions receive this same state.
                questions:
                  type: object
                  description: >-
                    A JSON object mapping question IDs to their definitions.
                    Each ID must contain non-whitespace text; its answer is
                    returned with the same ID in ``response.answers``. Each
                    definition is an object with the required fields ``type``
                    and ``instructions``. The ``criteria`` field is optional for
                    the type ``noul`` but is required for the types ``choice``
                    and ``score``. The ``instructions`` field describes the
                    judgment to make and can be a string, object, or array. Use
                    an object or array to include supporting context alongside
                    the instructions. The ``type`` can be one of: - ``choice``:
                    Selects one option from a defined set. Requires ``criteria``
                    to be an object mapping 1 to 255 nonempty option names to
                    descriptions. The criteria description can be a string,
                    object, array, or null when the name needs no additional
                    detail. For example: .. code-block:: json { "team": {
                    "type": "choice", "instructions": "Which team should handle
                    this ticket?", "criteria": { "billing": "Payments, charges,
                    and refunds", "technical_support": null } } } - ``noul``:
                    Estimates the probability that the answer to a true-or-false
                    question is true. ``criteria`` can take the fields ``true``
                    or ``false``, or both, with descriptions that are strings,
                    objects, or arrays. Omit ``criteria`` to use the question
                    alone. The instructions or at least one criteria description
                    must contain non-whitespace text, a nonempty object, or a
                    nonempty array. For example, both of the following are
                    valid: .. code-block:: json { "escalate": { "type": "noul",
                    "instructions": "Does this ticket need escalation?",
                    "criteria": { "true": "Suspected fraud or an exception to
                    standard policy", "false": "A routine issue frontline
                    support can resolve" } } } or .. code-block:: json {
                    "escalate": { "type": "noul", "instructions": "Does this
                    ticket need escalation?" } } - ``score``: Rates the state on
                    an ordered scale. Requires ``criteria`` to be an array of 2
                    to 10 level descriptions, ordered from low to high.
                    Descriptions must contain non-whitespace text, a nonempty
                    object, or a nonempty array. Array positions define levels
                    starting at 0. For example: .. code-block:: json {
                    "urgency": { "type": "score", "instructions": "How urgent is
                    this ticket?", "criteria": [ "Routine: can wait a few days",
                    "Time-sensitive: needs attention today", "Critical: needs
                    immediate action" ] } }
                options:
                  type: object
                  properties:
                    version:
                      type: string
                      description: >-
                        The function API version to invoke. Defaults to "1.0".
                        Supported versions: ["1.0"].
                  description: >-
                    Function options. Omitted fields fall back to their
                    documented defaults.
              required:
                - state
                - questions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiDecideResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AiFunctionsAPI
  /api/2.0/ai-functions/ai-extract:
    post:
      operationId: ai_functions_ai_extract
      summary: >-
        Extracts structured data from text and documents according to a provided
        schema. For REST API
      tags:
        - aifunctions
        - ai_functions
      description: >-
        Extracts structured data from text and documents according to a provided
        schema. For REST API

        requests, the default rate limit is 120 requests per minute per
        workspace. Contact your Databricks

        account team to request a higher limit.


        :param content: any
          The text to extract from. It accepts a plain string or the response object of
          [ai_parse_document](:method:AiFunctions/AiParseDocument).
        :param schema: any
          The extraction schema defining the fields to extract. Either a JSON array of field names, assumed to
          be strings (e.g. ["company", "valuation"]), or a JSON object mapping each field to its
          type/description/nullability (e.g. {"company": {"type": "string", "description": "the company
          name"}}). Accepts up to 256 fields, 12 levels of nesting, and 500 enum values. Supported field types
          are string, integer, number, boolean, and enum.
        :param options: :class:`AiExtractOptions` (optional)
          Function options. Omitted fields fall back to their documented defaults.

        :returns: :class:`AiExtractResponse`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: object
                  description: >-
                    The text to extract from. It accepts a plain string or the
                    response object of
                    [ai_parse_document](:method:AiFunctions/AiParseDocument).
                schema:
                  type: object
                  description: >-
                    The extraction schema defining the fields to extract. Either
                    a JSON array of field names, assumed to be strings (e.g.
                    ["company", "valuation"]), or a JSON object mapping each
                    field to its type/description/nullability (e.g. {"company":
                    {"type": "string", "description": "the company name"}}).
                    Accepts up to 256 fields, 12 levels of nesting, and 500 enum
                    values. Supported field types are string, integer, number,
                    boolean, and enum.
                options:
                  type: object
                  properties:
                    enable_citations:
                      type: boolean
                      description: >-
                        When true, includes citation metadata locating each
                        extracted value in the source. Depending on the type of
                        input, citations can be one of two types: For raw text
                        (STRING) inputs, a citation is a span of text in the
                        original input. Each object in ``metadata.citations``
                        has an ``id`` (integer matching a ``citation_ids`` entry
                        on a field), a ``start`` (inclusive 0-based character
                        offset into the input string), and a ``stop`` (exclusive
                        0-based character offset into the input string). For PDF
                        documents and images (when using ai_extract downstream
                        of ai_parse_document), a citation is a bounding box in
                        the original input. Each object in
                        ``metadata.citations`` has an ``id`` (integer matching a
                        ``citation_ids`` entry on a field) and a ``bbox`` (array
                        of {coord, page_id} objects, identical in shape to
                        element.bbox in ai_parse_document output; coord is pixel
                        coordinates on the page image as [x0, y0, x1, y1], and
                        page_id is a 0-based page index).
                    enable_confidence_scores:
                      type: boolean
                      description: >-
                        When true, includes a per-field confidence score in the
                        response.
                    instructions:
                      type: string
                      description: >-
                        Natural-language guidance that steers how data is
                        extracted (up to 20,000 characters).
                    mode:
                      type: string
                      description: >-
                        Extraction mode. Supported modes: "precision" — more
                        powerful extraction for complex schemas, long documents,
                        and reasoning-heavy extractions. Defaults to none
                        (standard extraction).
                    version:
                      type: string
                      description: >-
                        The function version to invoke. Defaults to the latest
                        version. Supported versions: ["2.1"].
                  description: >-
                    Function options. Omitted fields fall back to their
                    documented defaults.
              required:
                - content
                - schema
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiExtractResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AiFunctionsAPI
  /api/2.0/ai-functions/ai-parse-document:
    post:
      operationId: ai_functions_ai_parse_document
      summary: Parse structured content from unstructured documents.
      tags:
        - aifunctions
        - ai_functions
      description: |-
        Parse structured content from unstructured documents.

        :param content: str
          The document to parse. The REST API accepts a Unity Catalog volume path to the source file or a
          base64 data URL containing the file bytes (for example,
          data:application/pdf;base64,<encoded-file-bytes> or data:image/jpeg;base64,<encoded-file-bytes>).
          Supported formats: PDF, DOCX, DOC, PPTX, PPT, JPG, JPEG, PNG, TIFF. Accepts up to 100 pages and 100
          MB per document.
        :param options: :class:`AiParseDocumentOptions` (optional)
          Function options. Omitted fields fall back to their documented defaults.

        :returns: :class:`AiParseDocumentResponse`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: >-
                    The document to parse. The REST API accepts a Unity Catalog
                    volume path to the source file or a base64 data URL
                    containing the file bytes (for example,
                    data:application/pdf;base64,<encoded-file-bytes> or
                    data:image/jpeg;base64,<encoded-file-bytes>). Supported
                    formats: PDF, DOCX, DOC, PPTX, PPT, JPG, JPEG, PNG, TIFF.
                    Accepts up to 100 pages and 100 MB per document.
                options:
                  type: object
                  properties:
                    description_element_types:
                      type: string
                      description: >-
                        Element types for which an AI-generated description is
                        produced. Use "*" (default) to generate descriptions for
                        all supported element types, "figure" to generate them
                        for figures only, or "" (empty string) to generate none.
                        Only figure descriptions are supported for version
                        "2.0", so "*" and "figure" produce the same behavior.
                    image_output_path:
                      type: string
                      description: >-
                        Unity Catalog volume path where rendered page and
                        element images are written.
                    page_range:
                      type: string
                      description: >-
                        Pages to parse (1-indexed), as a comma-separated list of
                        page numbers or ranges (e.g. "1,3,5-10").
                    version:
                      type: string
                      description: >-
                        The ai_parse_document output schema version. Supported
                        value: "2.0".
                  description: >-
                    Function options. Omitted fields fall back to their
                    documented defaults.
              required:
                - content
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiParseDocumentResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AiFunctionsAPI
components:
  schemas:
    AiClassifyOptions:
      type: object
      properties:
        enable_confidence_scores:
          type: boolean
          description: When true, includes a per-label confidence score in the response.
        enable_rationales:
          type: boolean
          description: >-
            When true, includes a rationale explaining each classification in
            the response.
        instructions:
          type: string
          description: >-
            Natural-language guidance that steers how the text is classified (up
            to 20,000 characters).
        multilabel:
          type: boolean
          description: When true, allows more than one label to be returned per input.
        version:
          type: string
          description: >-
            The function version to invoke. Defaults to the latest version.
            Supported versions: ["2.1"].
      description: ai_classify
    AiClassifyResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/AiClassifyResponseMetadata'
        response:
          type: object
          description: >-
            The function result as a JSON value. An array of per-label objects:
            one element in single-label mode (the default), or multiple elements
            when ``multilabel`` is true. When ``enable_confidence_scores`` and
            ``enable_rationales`` are true, ``confidence_score`` and
            ``rationale`` are included in each response value, respectively.
    AiClassifyResponseMetadata:
      type: object
      properties:
        version:
          type: string
    AiDecideOptions:
      type: object
      properties:
        version:
          type: string
          description: >-
            The function API version to invoke. Defaults to "1.0". Supported
            versions: ["1.0"].
      description: ai_decide
    AiDecideResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/AiDecideResponseMetadata'
        response:
          type: object
          description: >-
            A JSON object containing an ``answers`` map with one answer for each
            question, keyed by the same IDs as ``questions``. Each answer has a
            ``type`` matching its question and the following fields: -
            ``choice``: choice is the highest-probability option from
            ``criteria``. ``probabilities`` maps every option name to its
            probability. ``confidence`` is a number from 0 to 1 indicating how
            well the state supports the assessment. The ``probabilities`` values
            sum to 1. For example: .. code-block:: json { "answers": { "team": {
            "type": "choice", "choice": "billing", "probabilities": { "billing":
            0.85, "technical_support": 0.15 }, "confidence": 0.9 } } } -
            ``noul``: ``probability`` is a number from 0 to 1 estimating the
            probability that the answer is true. For example: .. code-block::
            json { "answers": { "escalate": { "type": "noul", "probability": 0.8
            } } } - ``score``: score is the probability-weighted mean of the
            zero-based level indices. It can fall between levels, from 0 to the
            number of levels minus 1. ``probabilities`` maps each level index to
            its probability, and ``legend`` maps each index to its original
            description. Both maps use string keys such as "0", "1", and "2".
            ``confidence`` is a number from 0 to 1 indicating how well the state
            supports the assessment. The ``probabilities`` values sum to 1. For
            example: .. code-block:: json { "answers": { "urgency": { "type":
            "score", "score": 1.6, "probabilities": { "0": 0.1, "1": 0.2, "2":
            0.7 }, "legend": { "0": "Routine: can wait a few days", "1":
            "Time-sensitive: needs attention today", "2": "Critical: needs
            immediate action" }, "confidence": 0.85 } } }
    AiDecideResponseMetadata:
      type: object
      properties:
        version:
          type: string
    AiExtractBbox:
      type: object
      properties:
        coord:
          type: array
          items:
            type: integer
          description: Pixel coordinates on the page image as [x0, y0, x1, y1].
        page_id:
          type: integer
          description: 0-based page index the box is on.
      description: A bounding box on a source page; used by bbox-input citations.
    AiExtractCitation:
      type: object
      properties:
        bbox:
          type: array
          items:
            $ref: '#/components/schemas/AiExtractBbox'
          description: >-
            Bounding boxes locating the citation on the source pages; set for
            bbox citations.
        id:
          type: integer
          description: Integer matching a citation_ids entry on an extracted field.
        start:
          type: integer
          description: >-
            Inclusive 0-based character offset into the input string; set for
            span citations.
        stop:
          type: integer
          description: >-
            Exclusive 0-based character offset into the input string; set for
            span citations.
      description: >-
        A citation locating an extracted value in the source. start/stop are set
        for span (STRING input)
            citations, bbox for bbox (parsed-document input) citations.
    AiExtractOptions:
      type: object
      properties:
        enable_citations:
          type: boolean
          description: >-
            When true, includes citation metadata locating each extracted value
            in the source. Depending on the type of input, citations can be one
            of two types: For raw text (STRING) inputs, a citation is a span of
            text in the original input. Each object in ``metadata.citations``
            has an ``id`` (integer matching a ``citation_ids`` entry on a
            field), a ``start`` (inclusive 0-based character offset into the
            input string), and a ``stop`` (exclusive 0-based character offset
            into the input string). For PDF documents and images (when using
            ai_extract downstream of ai_parse_document), a citation is a
            bounding box in the original input. Each object in
            ``metadata.citations`` has an ``id`` (integer matching a
            ``citation_ids`` entry on a field) and a ``bbox`` (array of {coord,
            page_id} objects, identical in shape to element.bbox in
            ai_parse_document output; coord is pixel coordinates on the page
            image as [x0, y0, x1, y1], and page_id is a 0-based page index).
        enable_confidence_scores:
          type: boolean
          description: When true, includes a per-field confidence score in the response.
        instructions:
          type: string
          description: >-
            Natural-language guidance that steers how data is extracted (up to
            20,000 characters).
        mode:
          type: string
          description: >-
            Extraction mode. Supported modes: "precision" — more powerful
            extraction for complex schemas, long documents, and reasoning-heavy
            extractions. Defaults to none (standard extraction).
        version:
          type: string
          description: >-
            The function version to invoke. Defaults to the latest version.
            Supported versions: ["2.1"].
      description: ai_extract
    AiExtractResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/AiExtractResponseMetadata'
        response:
          type: object
          description: >-
            The function result as a JSON value. When
            ``enable_confidence_scores`` and ``enable_citations`` are true,
            ``confidence`` and ``citation_ids`` are included in each response
            field, respectively.
    AiExtractResponseMetadata:
      type: object
      properties:
        chunk_type:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/AiExtractCitation'
          description: >-
            Citation objects locating each result in the source; present when
            citations are enabled.
        mode:
          type: string
          description: >-
            The resolved extraction mode; present when a non-default mode was
            used.
        version:
          type: string
          description: The resolved function version.
    AiParseDocumentFileMetadata:
      type: object
      properties:
        file_modification_time:
          type: string
          description: Last-modified timestamp of the source file, as an HTTP date string.
        file_name:
          type: string
          description: Base name of the source file.
        file_path:
          type: string
          description: Unity Catalog volume path of the source file.
        file_size:
          type: integer
          description: Size of the source file in bytes.
      description: Metadata about the source file; present only for file-path input.
    AiParseDocumentOptions:
      type: object
      properties:
        description_element_types:
          type: string
          description: >-
            Element types for which an AI-generated description is produced. Use
            "*" (default) to generate descriptions for all supported element
            types, "figure" to generate them for figures only, or "" (empty
            string) to generate none. Only figure descriptions are supported for
            version "2.0", so "*" and "figure" produce the same behavior.
        image_output_path:
          type: string
          description: >-
            Unity Catalog volume path where rendered page and element images are
            written.
        page_range:
          type: string
          description: >-
            Pages to parse (1-indexed), as a comma-separated list of page
            numbers or ranges (e.g. "1,3,5-10").
        version:
          type: string
          description: 'The ai_parse_document output schema version. Supported value: "2.0".'
      description: ai_parse_document
    AiParseDocumentPageError:
      type: object
      properties:
        error_message:
          type: string
          description: Message describing why the page failed.
        page_id:
          type: integer
          description: 0-based index of the page that failed.
      description: A single page that failed to parse while the overall request succeeded.
    AiParseDocumentResponse:
      type: object
      properties:
        document:
          type: object
        error_status:
          type: array
          items:
            $ref: '#/components/schemas/AiParseDocumentPageError'
          description: >-
            Per-page partial-failure details; present when the request succeeds
            (2xx) but individual pages fail.
        metadata:
          $ref: '#/components/schemas/AiParseDocumentResponseMetadata'
          description: Additional metadata returned by AI Parse Document.
    AiParseDocumentResponseMetadata:
      type: object
      properties:
        file_metadata:
          $ref: '#/components/schemas/AiParseDocumentFileMetadata'
        id:
          type: string
          description: Unique identifier for the parse request.
        version:
          type: string
          description: The resolved function version.
