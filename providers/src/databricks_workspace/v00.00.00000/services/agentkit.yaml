            type: string
          description: >-
            Caller-provided, workspace-unique session store ID. It must be 3-55
            characters, begin with a lowercase letter, and contain only
            lowercase letters, digits, and hyphens.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                create_time:
                  type: string
                  format: date-time
                  description: Time when the store was created.
                creator_user_id:
                  type: string
                  description: >-
                    Workspace-local user ID of the authenticated principal that
