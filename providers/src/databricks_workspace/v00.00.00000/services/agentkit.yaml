        - WRITE
      description: Permission level granted on a store. WRITE is a superset of READ.
    PrincipalType:
      type: string
      x-enum:
        - SERVICE_PRINCIPAL
        - USER
      description: The kind of Databricks principal a store permission is granted to.
    StorageBackendType:
      type: string
      x-enum:
        - STORAGE_BACKEND_TYPE_LAKEBASE
      description: Type of service-managed storage backing a memory store.
