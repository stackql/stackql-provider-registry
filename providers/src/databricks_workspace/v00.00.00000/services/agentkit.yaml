components:
  schemas:
    AppendSessionItemsResponse:
      type: object
      properties:
        session_items:
          type: array
          items:
            $ref: '#/components/schemas/SessionItem'
          description: Persisted session items with service-assigned fields.
      description: Response containing appended items.
    ClearSessionItemsResponse:
      type: object
      properties: {}
      description: Response from clearing items from a session.
    ExtractMemoriesResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ManagedMemoryEntry'
          description: The memory entries written by this extraction.
        name:
          type: string
          description: >-
            Correlation identifier for this extraction, for logging and tracing.
            Not a fetchable resource.
      description: Result of a single-session memory extraction.
    ForkSessionResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/Session'
          description: The newly-created independent top-level session.
      description: Response from forking a session.
    GrantMemoryStorePermissionResponse:
      type: object
      properties: {}
      description: Response from granting a permission on a memory store.
    GrantSessionStorePermissionResponse:
      type: object
      properties: {}
      description: Response from granting a permission on a session store.
    ListManagedMemoryEntriesResponse:
      type: object
      properties:
        managed_memory_entries:
          type: array
          items:
            $ref: '#/components/schemas/ManagedMemoryEntry'
          description: Memory entries matching the request and selected response view.
        next_page_token:
          type: string
          description: >-
            Opaque pagination token. This field is omitted when there are no
            more results.
      description: Response containing memory entries.
    ListManagedMemoryStoresResponse:
      type: object
      properties:
        managed_memory_stores:
          type: array
          items:
            $ref: '#/components/schemas/ManagedMemoryStore'
          description: Memory stores in the caller's workspace.
        next_page_token:
          type: string
          description: >-
            Opaque pagination token. This field is omitted when there are no
            more results.
      description: Response containing memory stores in the caller's workspace.
    ListMemoryStorePermissionsResponse:
      type: object
      properties:
        memory_store_permissions:
          type: array
          items:
            $ref: '#/components/schemas/MemoryStorePermission'
          description: >-
            Explicit READ or WRITE grants. Implicit owner/admin access and
            inherited grants are excluded.
        next_page_token:
          type: string
          description: >-
            Token for the next page, omitted when all permissions have been
            returned.
      description: A page of explicit memory store permissions.
    ListSessionItemsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token to retrieve the next page.
        session_items:
          type: array
          items:
            $ref: '#/components/schemas/SessionItem'
          description: Session items in the requested page.
      description: Response containing a page of session items.
    ListSessionStorePermissionsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: >-
            Token for the next page, omitted when all permissions have been
            returned.
        session_store_permissions:
          type: array
          items:
            $ref: '#/components/schemas/SessionStorePermission'
          description: >-
            Explicit READ or WRITE grants. Implicit owner/admin access and
            inherited grants are excluded.
      description: A page of explicit session store permissions.
    ListSessionStoresResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token to retrieve the next page.
        session_stores:
          type: array
          items:
            $ref: '#/components/schemas/SessionStore'
          description: Session stores in the requested page.
      description: Response containing a page of session stores.
    ListSessionsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token to retrieve the next page.
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
          description: Sessions in the requested page.
      description: Response containing a page of sessions.
    ManagedMemoryEntry:
      type: object
      properties:
        actor_id:
          type: string
          description: >-
            Customer-provided identifier for the actor whose memory this entry
            represents.
        path:
          type: string
          description: >-
            Absolute, case-sensitive path identifying the entry within its actor
            and optional session. Paths must begin with ``/`` and must not
            contain empty, ``.`` or ``..`` segments.
        content:
          type: string
          description: Optional free-form memory content.
        create_time:
          type: string
          format: date-time
          description: Time when the entry was created.
        description:
          type: string
          description: Human-readable description of the memory entry.
        name:
          type: string
          description: >-
            Resource name in the form
            ``memory-stores/{managed_memory_store_id}/entries/{managed_memory_entry_id}``.
            Required for updates; assigned by the service on creation.
        session_id:
          type: string
          description: >-
            Optional identifier for the session associated with this memory
            entry. When omitted, the entry applies across the actor's sessions.
        source_type:
          $ref: '#/components/schemas/ManagedMemoryEntrySourceType'
          description: >-
            Which writer created this entry. Caller sets this on Create;
            immutable after creation.
        update_time:
          type: string
          format: date-time
          description: Time when the entry was last updated.
      required:
        - actor_id
        - path
      description: A workspace-scoped entry in a memory store.
    ManagedMemoryEntrySearchResult:
      type: object
      properties:
        managed_memory_entry:
          $ref: '#/components/schemas/ManagedMemoryEntry'
          description: Memory entry matching the query.
        score:
          type: number
          description: Relevance score for the result. Higher scores are more relevant.
      description: One relevance-ranked memory search result.
    ManagedMemoryStore:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
          description: Time when the store was created.
        creator_user_id:
          type: string
          description: >-
            Workspace-local user ID of the authenticated principal that created
            the store. This is immutable server-set attribution and does not
            grant access; authorization is evaluated from the authenticated
            request context.
        description:
          type: string
          description: Human-readable description of the memory store.
        display_name:
          type: string
          description: >-
            Deprecated compatibility alias for the caller-provided memory store
            ID. Canonical clients provide the ID through
            ``CreateMemoryStoreRequest.managed_memory_store_id`` and use
            ``name`` as the resource identifier.
        name:
          type: string
          description: >-
            Resource name in the form
            ``memory-stores/{managed_memory_store_id}``.
        owner_user_id:
          type: string
          description: >-
            Deprecated alias for ``creator_user_id``. This identifies the
            original creator, not a transferable owner. Use ``creator_user_id``
            instead.
        storage_backend:
          $ref: '#/components/schemas/StorageBackend'
          description: Service-managed storage backing this memory store.
        update_time:
          type: string
          format: date-time
          description: Time when the store was last updated.
        workspace_id:
          type: integer
          description: Workspace that owns the memory store.
      description: A workspace-scoped memory store backed by service-managed storage.
    MemoryStorePermission:
      type: object
      properties:
        permission:
          $ref: '#/components/schemas/PermissionLevel'
          description: >-
            The permission level. WRITE includes READ;
            PERMISSION_LEVEL_UNSPECIFIED means neither is available.
        principal:
          $ref: '#/components/schemas/StorePrincipal'
          description: The principal whose permission is reported.
      description: A principal's permission on a memory store.
    PopSessionItemResponse:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/SessionItem'
          description: Removed item, if any.
      description: Response containing the popped item.
    RevokeMemoryStorePermissionResponse:
      type: object
      properties: {}
      description: Response from revoking a memory store permission.
    RevokeSessionStorePermissionResponse:
      type: object
      properties: {}
      description: Response from revoking a session store permission.
    SearchManagedMemoryEntriesResponse:
      type: object
      properties:
        managed_memory_entries:
          type: array
          items:
            $ref: '#/components/schemas/ManagedMemoryEntry'
          description: >-
            Deprecated compatibility alias for clients migrating to ``results``.
            This contains the same entries in the same order, but omits their
            relevance scores.
        next_page_token:
          type: string
          description: >-
            Opaque pagination token. Search currently returns an unpaginated
            ranked top-N result set, so the server does not populate this field.
        results:
          type: array
          items:
            $ref: '#/components/schemas/ManagedMemoryEntrySearchResult'
          description: >-
            Canonical matching entries and relevance scores, ordered most
            relevant first.
      description: Response containing memory entries ranked by relevance.
    Session:
      type: object
      properties:
        actor_id:
          type: string
          description: >-
            Opaque caller-provided identifier for the application actor
            associated with the session. This is application data and has no
            Databricks authentication or authorization semantics. Use the same
            value as the Managed Memory Entry ``actor_id`` when storing memories
            associated with this actor. Every session must set it. A child
            session must use the same value as its parent.
        create_time:
          type: string
          format: date-time
          description: Time when the session was created.
        last_activity_time:
          type: string
          format: date-time
          description: Time when the session's item history was last mutated.
        metadata:
          type: object
          description: Mutable caller-defined string labels.
        name:
          type: string
          description: >-
            Resource name in the form
            ``session-stores/{session_store_id}/sessions/{session_id}``.
        parent_session_id:
          type: string
          description: >-
            Immediate parent session ID. Set only at creation for child
            sessions, immutable thereafter, and restricted to the same store.
        root_session_id:
          type: string
          description: >-
            Top-level session ID in the spawn tree. This equals ``session_id``
            for a root or fork and is inherited transitively by child sessions.
        session_id:
          type: string
          description: >-
            Unique session ID. The service generates a UUID unless the caller
            supplies ``CreateSessionRequest.session_id``.
        update_time:
          type: string
          format: date-time
          description: Time when session resource fields last changed.
      required:
        - actor_id
      description: A durable logical interaction stored within a Session Store.
    SessionItem:
      type: object
      properties:
        data:
          type: object
          description: >-
            Complete SDK-native, JSON-compatible item. The service stores and
            returns this value without interpreting provider-specific fields
            such as ``type``, ``role``, or ``content``.
        create_time:
          type: string
          format: date-time
          description: >-
            Server-assigned time when the append commits. Values are
            nondecreasing within a session. Item listing orders by this
            timestamp; equal timestamps are resolved by committed append order.
        item_id:
          type: string
          description: Stable service-generated item ID.
      required:
        - data
      description: A transcript entry in a session's history.
    SessionStore:
      type: object
      properties:
        create_time:
          type: string
          format: date-time
          description: Time when the store was created.
        creator_user_id:
          type: string
          description: >-
            Workspace-local user ID of the authenticated principal that created
            the store. This is immutable server-set attribution and does not
            grant access; authorization is evaluated from the authenticated
            request context.
        description:
          type: string
          description: Human-readable description of the session store.
        metadata:
          type: object
          description: Mutable caller-defined string labels.
        name:
          type: string
          description: Resource name in the form ``session-stores/{session_store_id}``.
        update_time:
          type: string
          format: date-time
          description: Time when the store was last updated.
      description: A workspace-scoped session store.
    SessionStorePermission:
      type: object
      properties:
        permission:
          $ref: '#/components/schemas/PermissionLevel'
          description: >-
            The permission level. WRITE includes READ;
            PERMISSION_LEVEL_UNSPECIFIED means neither is available.
        principal:
          $ref: '#/components/schemas/StorePrincipal'
          description: The principal whose permission is reported.
      description: A principal's permission on a session store.
    StorageBackend:
      type: object
      properties:
        backend_id:
          type: string
          description: Backend-specific identifier. For Lakebase, this is the project ID.
        backend_type:
          $ref: '#/components/schemas/StorageBackendType'
          description: Type of the storage backend.
      description: Service-managed storage backing a memory store.
    StorePrincipal:
      type: object
      properties:
        name:
          type: string
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
          description: >-
            The kind of principal. Required unless the deprecated type alias is
            supplied.
      required:
        - name
      description: >-
        A principal a store permission is granted to. ``name`` is the
        principal's Lakebase identifier: a
            user's email or a service principal's application (client) id.
    ManagedMemoryEntrySourceType:
      type: string
      x-enum:
        - MANAGED_MEMORY_ENTRY_SOURCE_TYPE_AGENT
        - MANAGED_MEMORY_ENTRY_SOURCE_TYPE_DREAMER
      description: Identifies the source that created a memory entry.
    ManagedMemoryEntryView:
      type: string
      x-enum:
        - MANAGED_MEMORY_ENTRY_VIEW_BASIC
        - MANAGED_MEMORY_ENTRY_VIEW_FULL
      description: Controls how much memory entry data is returned.
    PermissionLevel:
      type: string
      x-enum:
