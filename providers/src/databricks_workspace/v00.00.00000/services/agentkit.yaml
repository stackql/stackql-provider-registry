openapi: 3.0.0
info:
  title: Databricks Agentkit API (workspace)
  description: >-
    OpenAPI specification for the Databricks agentkit service (workspace-level
    APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.agentkit
servers:
  - url: https://{deployment_name}.{workspace_domain}
    variables:
      deployment_name:
        description: >-
          The Databricks workspace deployment name: the host prefix of the
          workspace URL (dbc-abcd0123-a1bc on AWS, adb-1234567890123456.7 on
          Azure, 1234567890123456.7 on GCP). Set DATABRICKS_DEPLOYMENT_NAME to
          default it for the session.
        default: dbc-abcd0123-a1bc
        x-stackQL-envVar: DATABRICKS_DEPLOYMENT_NAME
      workspace_domain:
        description: >-
          The Databricks workspace domain suffix for the cloud. Selected by
          DATABRICKS_CLOUD (aws, azure or gcp; default aws).
        default: cloud.databricks.com
        x-stackQL-envVarSelector:
          envVar: DATABRICKS_CLOUD
          default: aws
          values:
            aws: cloud.databricks.com
            azure: azuredatabricks.net
            gcp: gcp.databricks.com
paths:
  /api/2.0/agents/session-stores/{session_store_id}/sessions/{session_id}/items:append:
    post:
      operationId: agent_kit_append_session_items
      summary: Appends items to a session.
      tags:
        - agentkit
        - agent_kit
      description: |-
        Appends items to a session.

        :param parent: str
          Resource name of the containing session, in the form
          ``session-stores/{session_store_id}/sessions/{session_id}``.
        :param items: List[:class:`SessionItem`]
          Items to append atomically in request order. Concurrent append requests are serialized into one
          committed order without exposing a numeric sequence in the public contract.

        :returns: :class:`AppendSessionItemsResponse`
      parameters:
        - name: session_store_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `session_store_id` segment of the `parent` resource name
            (`session-stores/{session_store_id}/sessions/{session_id}`).
            Resource name of the containing session, in the form
            ``session-stores/{session_store_id}/sessions/{session_id}``.
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `session_id` segment of the `parent` resource name
            (`session-stores/{session_store_id}/sessions/{session_id}`).
            Resource name of the containing session, in the form
            ``session-stores/{session_store_id}/sessions/{session_id}``.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      data:
                        type: object
                        description: >-
                          Complete SDK-native, JSON-compatible item. The service
                          stores and returns this value without interpreting
                          provider-specific fields such as ``type``, ``role``,
                          or ``content``.
                      create_time:
                        type: string
                        format: date-time
                        description: >-
                          Server-assigned time when the append commits. Values
                          are nondecreasing within a session. Item listing
                          orders by this timestamp; equal timestamps are
                          resolved by committed append order.
                      item_id:
                        type: string
                        description: Stable service-generated item ID.
                    required:
                      - data
                    description: A transcript entry in a session's history.
                  description: >-
                    Items to append atomically in request order. Concurrent
                    append requests are serialized into one committed order
                    without exposing a numeric sequence in the public contract.
              required:
                - items
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendSessionItemsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AgentKitAPI
  /api/2.0/agents/session-stores/{session_store_id}/sessions/{session_id}/items:clear:
    post:
      operationId: agent_kit_clear_session_items
      summary: Clears all items from a session.
      tags:
        - agentkit
        - agent_kit
      description: |-
        Clears all items from a session.

        :param parent: str
          Resource name of the containing session, in the form
          ``session-stores/{session_store_id}/sessions/{session_id}``.

        :returns: :class:`ClearSessionItemsResponse`
      parameters:
        - name: session_store_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `session_store_id` segment of the `parent` resource name
            (`session-stores/{session_store_id}/sessions/{session_id}`).
            Resource name of the containing session, in the form
            ``session-stores/{session_store_id}/sessions/{session_id}``.
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `session_id` segment of the `parent` resource name
            (`session-stores/{session_store_id}/sessions/{session_id}`).
            Resource name of the containing session, in the form
            ``session-stores/{session_store_id}/sessions/{session_id}``.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearSessionItemsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AgentKitAPI
  /api/2.0/agents/memory-stores/{managed_memory_store_id}/entries:
    post:
      operationId: agent_kit_create_memory
      summary: >-
        Creates a memory entry using exclusive-create semantics. Callers may
        choose the entry ID; the service
      tags:
        - agentkit
        - agent_kit
      description: >-
        Creates a memory entry using exclusive-create semantics. Callers may
        choose the entry ID; the service

        generates one when it is omitted. Returns ``ALREADY_EXISTS`` when an
        entry with the same actor,

        session, and path already exists. Omitted ``session_id`` is its own
        uniqueness key: two

        omitted-session entries with the same actor and path conflict, but an
        omitted-session entry does not

        conflict with a session-scoped entry at the same actor and path.


        :param parent: str
          Memory store that will contain the entry, in the form ``memory-stores/{managed_memory_store_id}``.
        :param managed_memory_entry: :class:`ManagedMemoryEntry`
          The memory entry to create.
        :param managed_memory_entry_id: str (optional)
          Optional caller-selected memory entry ID. The service generates an ID when omitted.

        :returns: :class:`ManagedMemoryEntry`
      parameters:
        - name: managed_memory_store_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `managed_memory_store_id` segment of the `parent` resource name
            (`memory-stores/{managed_memory_store_id}`). Memory store that will
            contain the entry, in the form
            ``memory-stores/{managed_memory_store_id}``.
        - name: managed_memory_entry_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional caller-selected memory entry ID. The service generates an
            ID when omitted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor_id:
                  type: string
                  description: >-
                    Customer-provided identifier for the actor whose memory this
                    entry represents.
                path:
                  type: string
                  description: >-
                    Absolute, case-sensitive path identifying the entry within
                    its actor and optional session. Paths must begin with ``/``
                    and must not contain empty, ``.`` or ``..`` segments.
                content:
                  type: string
                  description: Optional free-form memory content.
                create_time:
                  type: string
                  format: date-time
                  description: Time when the entry was created.
                description:
                  type: string
                  description: Human-readable description of the memory entry.
                name:
                  type: string
                  description: >-
                    Resource name in the form
                    ``memory-stores/{managed_memory_store_id}/entries/{managed_memory_entry_id}``.
                    Required for updates; assigned by the service on creation.
                session_id:
                  type: string
                  description: >-
                    Optional identifier for the session associated with this
                    memory entry. When omitted, the entry applies across the
                    actor's sessions.
                source_type:
                  type: string
                  x-enum:
                    - MANAGED_MEMORY_ENTRY_SOURCE_TYPE_AGENT
                    - MANAGED_MEMORY_ENTRY_SOURCE_TYPE_DREAMER
                  description: >-
                    Which writer created this entry. Caller sets this on Create;
                    immutable after creation.
                update_time:
                  type: string
                  format: date-time
                  description: Time when the entry was last updated.
              required:
                - actor_id
                - path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMemoryEntry'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AgentKitAPI
    get:
      operationId: agent_kit_list_memories
      summary: >-
        Lists memory entries for one actor. An exact ``path`` filters entries
        across sessions, ignoring
      tags:
        - agentkit
        - agent_kit
      description: >-
        Lists memory entries for one actor. An exact ``path`` filters entries
        across sessions, ignoring

        session metadata. Otherwise, ``session_id`` and ``path_prefix`` restrict
        the actor partition. ``view``

        controls whether each returned entry includes memory content.


        :param parent: str
          Memory store whose entries are listed, in the form ``memory-stores/{managed_memory_store_id}``.
        :param actor_id: str
          Customer-provided identifier for the actor whose entries are listed.
        :param page_size: int (optional)
          Maximum number of entries to return. The service may return fewer entries than requested. Defaults
          to 10; must be between 1 and 100.
        :param page_token: str (optional)
          Opaque pagination token from a previous ListManagedMemoryEntries response.
        :param path_prefix: str (optional)
          Optional path prefix used to restrict entries within the actor partition.
        :param session_id: str (optional)
          Optional session identifier. When set, only entries with this exact ``session_id`` are returned.
          Omitted-session (cross-session) entries are not included. Ignored when path is set.
        :param view: :class:`ManagedMemoryEntryView` (optional)
          Controls whether each returned entry includes memory content. Defaults to ``FULL``.

        :returns: Iterator over :class:`ManagedMemoryEntry`
      parameters:
        - name: managed_memory_store_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `managed_memory_store_id` segment of the `parent` resource name
            (`memory-stores/{managed_memory_store_id}`). Memory store whose
            entries are listed, in the form
            ``memory-stores/{managed_memory_store_id}``.
        - name: actor_id
          in: query
          required: true
          schema:
            type: string
          description: Customer-provided identifier for the actor whose entries are listed.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Maximum number of entries to return. The service may return fewer
            entries than requested. Defaults to 10; must be between 1 and 100.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            Opaque pagination token from a previous ListManagedMemoryEntries
            response.
        - name: path_prefix
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional path prefix used to restrict entries within the actor
            partition.
        - name: session_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional session identifier. When set, only entries with this exact
            ``session_id`` are returned. Omitted-session (cross-session) entries
            are not included. Ignored when path is set.
        - name: view
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ManagedMemoryEntryView'
          description: >-
            Controls whether each returned entry includes memory content.
            Defaults to ``FULL``.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractMemoriesResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AgentKitAPI
  /api/2.0/agents/memory-stores:
    post:
      operationId: agent_kit_create_memory_store
      summary: Creates a memory store in the caller's workspace.
      tags:
        - agentkit
        - agent_kit
      description: |-
        Creates a memory store in the caller's workspace.

        :param managed_memory_store: :class:`ManagedMemoryStore`
          The memory store to create.
        :param managed_memory_store_id: str
          Caller-provided, workspace-unique memory store ID. It must be 3-56 characters, begin with a
          lowercase letter, contain only lowercase letters, digits, and hyphens, and end with a letter or
          digit.

        :returns: :class:`ManagedMemoryStore`
      parameters:
        - name: managed_memory_store_id
          in: query
          required: true
          schema:
            type: string
          description: >-
            Caller-provided, workspace-unique memory store ID. It must be 3-56
            characters, begin with a lowercase letter, contain only lowercase
            letters, digits, and hyphens, and end with a letter or digit.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                create_time:
                  type: string
                  format: date-time
                  description: Time when the store was created.
                creator_user_id:
                  type: string
                  description: >-
                    Workspace-local user ID of the authenticated principal that
                    created the store. This is immutable server-set attribution
                    and does not grant access; authorization is evaluated from
                    the authenticated request context.
                description:
                  type: string
                  description: Human-readable description of the memory store.
                display_name:
                  type: string
                  description: >-
                    Deprecated compatibility alias for the caller-provided
                    memory store ID. Canonical clients provide the ID through
                    ``CreateMemoryStoreRequest.managed_memory_store_id`` and use
                    ``name`` as the resource identifier.
                name:
                  type: string
                  description: >-
                    Resource name in the form
                    ``memory-stores/{managed_memory_store_id}``.
                owner_user_id:
                  type: string
                  description: >-
                    Deprecated alias for ``creator_user_id``. This identifies
                    the original creator, not a transferable owner. Use
                    ``creator_user_id`` instead.
                storage_backend:
                  type: object
                  properties:
                    backend_id:
                      type: string
                      description: >-
                        Backend-specific identifier. For Lakebase, this is the
                        project ID.
                    backend_type:
                      type: string
                      x-enum:
                        - STORAGE_BACKEND_TYPE_LAKEBASE
                      description: Type of the storage backend.
                  description: Service-managed storage backing this memory store.
                update_time:
                  type: string
                  format: date-time
                  description: Time when the store was last updated.
                workspace_id:
                  type: integer
                  description: Workspace that owns the memory store.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMemoryStore'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AgentKitAPI
    get:
      operationId: agent_kit_list_memory_stores
      summary: Lists memory stores in the caller's workspace.
      tags:
        - agentkit
        - agent_kit
      description: |-
        Lists memory stores in the caller's workspace.

        :param page_size: int (optional)
          Maximum number of stores to return. The service may return fewer stores than requested. Defaults to
          10; must be between 1 and 100.
        :param page_token: str (optional)
          Opaque pagination token from a previous ListManagedMemoryStores response.

        :returns: Iterator over :class:`ManagedMemoryStore`
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Maximum number of stores to return. The service may return fewer
            stores than requested. Defaults to 10; must be between 1 and 100.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            Opaque pagination token from a previous ListManagedMemoryStores
            response.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListManagedMemoryStoresResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AgentKitAPI
  /api/2.0/agents/session-stores/{session_store_id}/sessions:
    post:
      operationId: agent_kit_create_session
      summary: Creates a session within a session store.
      tags:
        - agentkit
        - agent_kit
      description: |-
        Creates a session within a session store.

        :param parent: str
          Resource name of the containing session store, in the form ``session-stores/{session_store_id}``.
        :param session: :class:`Session`
          The session to create. ``actor_id`` is required. A session with ``parent_session_id`` is a child and
          must use its parent's ``actor_id``. Independent forks are created only through ``ForkSession``.
        :param session_id: str (optional)
          Optional caller-selected session ID. The service generates a UUID when this field is omitted. The ID
          must be unique; a collision returns ``ALREADY_EXISTS``.

        :returns: :class:`Session`
      parameters:
        - name: session_store_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `session_store_id` segment of the `parent` resource name
            (`session-stores/{session_store_id}`). Resource name of the
            containing session store, in the form
            ``session-stores/{session_store_id}``.
        - name: session_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional caller-selected session ID. The service generates a UUID
            when this field is omitted. The ID must be unique; a collision
            returns ``ALREADY_EXISTS``.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor_id:
                  type: string
                  description: >-
                    Opaque caller-provided identifier for the application actor
                    associated with the session. This is application data and
                    has no Databricks authentication or authorization semantics.
                    Use the same value as the Managed Memory Entry ``actor_id``
                    when storing memories associated with this actor. Every
                    session must set it. A child session must use the same value
                    as its parent.
                create_time:
                  type: string
                  format: date-time
                  description: Time when the session was created.
                last_activity_time:
                  type: string
                  format: date-time
                  description: Time when the session's item history was last mutated.
                metadata:
                  type: object
                  description: Mutable caller-defined string labels.
                name:
                  type: string
                  description: >-
                    Resource name in the form
                    ``session-stores/{session_store_id}/sessions/{session_id}``.
                parent_session_id:
                  type: string
                  description: >-
                    Immediate parent session ID. Set only at creation for child
                    sessions, immutable thereafter, and restricted to the same
                    store.
                root_session_id:
                  type: string
                  description: >-
                    Top-level session ID in the spawn tree. This equals
                    ``session_id`` for a root or fork and is inherited
                    transitively by child sessions.
                session_id:
                  type: string
                  description: >-
                    Unique session ID. The service generates a UUID unless the
                    caller supplies ``CreateSessionRequest.session_id``.
                update_time:
                  type: string
                  format: date-time
                  description: Time when session resource fields last changed.
              required:
                - actor_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AgentKitAPI
    get:
      operationId: agent_kit_list_sessions
      summary: Lists sessions within a session store.
      tags:
        - agentkit
        - agent_kit
      description: |-
        Lists sessions within a session store.

        :param parent: str
          Resource name of the containing session store, in the form ``session-stores/{session_store_id}``.
        :param filter: str (optional)
          Filter expression. Supported fields include ``actor_id`` and ``metadata``; for example, ``actor_id =
          "support-customer-123"``.
        :param order_by: str (optional)
          Sort order. Defaults to ``last_activity_time desc``. Page-token continuation is exactly-once when
          ordering by ``create_time`` (immutable); ordering by ``last_activity_time`` is best-effort, because
          that value changes as a session gains activity, so a session updated between page requests may be
          repeated or skipped. To enumerate every session exactly once, order by ``create_time``.
        :param page_size: int (optional)
          Maximum number of sessions to return. Defaults to 10; must be between 1 and 100.
        :param page_token: str (optional)
          Token returned by a previous list request.

        :returns: Iterator over :class:`Session`
      parameters:
        - name: session_store_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `session_store_id` segment of the `parent` resource name
            (`session-stores/{session_store_id}`). Resource name of the
            containing session store, in the form
            ``session-stores/{session_store_id}``.
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: >-
            Filter expression. Supported fields include ``actor_id`` and
            ``metadata``; for example, ``actor_id = "support-customer-123"``.
        - name: order_by
          in: query
          required: false
          schema:
            type: string
          description: >-
            Sort order. Defaults to ``last_activity_time desc``. Page-token
            continuation is exactly-once when ordering by ``create_time``
            (immutable); ordering by ``last_activity_time`` is best-effort,
            because that value changes as a session gains activity, so a session
            updated between page requests may be repeated or skipped. To
            enumerate every session exactly once, order by ``create_time``.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Maximum number of sessions to return. Defaults to 10; must be
            between 1 and 100.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: Token returned by a previous list request.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: AgentKitAPI
  /api/2.0/agents/session-stores:
    post:
      operationId: agent_kit_create_session_store
      summary: Creates a session store.
      tags:
        - agentkit
        - agent_kit
      description: |-
        Creates a session store.

        :param session_store: :class:`SessionStore`
          The session store to create.
        :param session_store_id: str
          Caller-provided, workspace-unique session store ID. It must be 3-55 characters, begin with a
