                  description: >-
                    Resource name in the form
                    ``session-stores/{session_store_id}``.
                update_time:
                  type: string
                  format: date-time
                  description: Time when the store was last updated.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStore'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
