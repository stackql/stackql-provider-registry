          Optional session identifier. When set, only entries with this exact ``session_id`` are searched.
          Omitted-session (cross-session) entries are not included.
        :param view: :class:`ManagedMemoryEntryView` (optional)
          Controls whether each returned entry includes memory content. Search scores are always returned.
          Defaults to ``FULL``.

        :returns: Iterator over :class:`ManagedMemoryEntrySearchResult`
      parameters:
        - name: managed_memory_store_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `managed_memory_store_id` segment of the `parent` resource name
            (`memory-stores/{managed_memory_store_id}`). Memory store whose
            entries are searched, in the form
            ``memory-stores/{managed_memory_store_id}``.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor_id:
                  type: string
                  description: >-
                    Customer-provided identifier for the actor whose entries are
                    searched.
                query:
                  type: string
                  description: Free-form search query.
                limit:
                  type: integer
                  description: >-
                    Deprecated alias for ``page_size``. When both fields are
                    set, their values must match.
                page_size:
                  type: integer
                  description: >-
                    Maximum number of relevance-ranked entries to return.
                    Defaults to 10 and must be between 1 and 100.
                page_token:
                  type: string
                  description: >-
                    Reserved for pagination compatibility. The server currently
                    ignores this field because Search returns a ranked top-N
                    result set.
                path_prefix:
                  type: string
                  description: >-
                    Optional absolute, case-sensitive path prefix used to
                    restrict searched entries within the actor partition. The
                    prefix must begin with ``/`` and must not contain empty,
                    ``.`` or ``..`` segments.
                session_id:
                  type: string
                  description: >-
                    Optional session identifier. When set, only entries with
                    this exact ``session_id`` are searched. Omitted-session
                    (cross-session) entries are not included.
                view:
                  type: string
                  x-enum:
                    - MANAGED_MEMORY_ENTRY_VIEW_BASIC
                    - MANAGED_MEMORY_ENTRY_VIEW_FULL
                  description: >-
                    Controls whether each returned entry includes memory
                    content. Search scores are always returned. Defaults to
                    ``FULL``.
              required:
                - actor_id
                - query
