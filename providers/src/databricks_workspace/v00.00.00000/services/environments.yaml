          description: The list of workspace base environments.
      description: Response message for ListWorkspaceBaseEnvironments.
    Operation:
      type: object
      properties:
        done:
          type: boolean
          description: >-
            If the value is ``false``, it means the operation is still in
            progress. If ``true``, the operation is completed, and either
            ``error`` or ``response`` is available.
        error:
          $ref: '#/components/schemas/DatabricksServiceExceptionWithDetailsProto'
