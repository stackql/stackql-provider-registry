            mapping, the ``name`` should be a resource name ending with
            ``operations/{unique_id}``.
        response:
          type: object
          description: The normal, successful response of the operation.
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
    WorkspaceBaseEnvironment:
      type: object
      properties:
        display_name:
          type: string
          description: Human-readable display name for the workspace base environment.
        base_environment_type:
          $ref: '#/components/schemas/BaseEnvironmentType'
          description: The type of base environment (CPU or GPU).
        create_time:
          type: string
          format: date-time
          description: Timestamp when the environment was created.
        creator_user_id:
          type: string
          description: User ID of the creator.
        filepath:
          type: string
          description: The WSFS or UC Volumes path to the environment YAML file.
        is_default:
          type: boolean
          description: Whether this is the default environment for the workspace.
        last_updated_user_id:
          type: string
          description: User ID of the last user who updated the environment.
        message:
          type: string
          description: >-
            Status message providing additional details about the environment
