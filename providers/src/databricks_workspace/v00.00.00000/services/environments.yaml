            The default workspace base environment for GPU compute. Format:
            workspace-base-environments/{workspace_base_environment}
        name:
          type: string
          description: >-
            The resource name of this singleton resource. Format:
            default-workspace-base-environment
      description: >-
        A singleton resource representing the default workspace base environment
        configuration. This
            resource contains the workspace base environments that are used as defaults for serverless
            notebooks and jobs in the workspace, for both CPU and GPU compute types.
    EnvironmentSpec:
      type: object
      properties:
        dependencies:
          type: array
          items:
            type: string
          description: >-
            List of pip dependencies, as supported by the version of pip in this
            environment. Each dependency is a valid pip requirements file line
