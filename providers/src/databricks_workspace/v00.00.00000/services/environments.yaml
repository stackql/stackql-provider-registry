openapi: 3.0.0
info:
  title: Databricks Environments API (workspace)
  description: >-
    OpenAPI specification for the Databricks environments service
    (workspace-level APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.environments
servers:
  - url: https://{deployment_name}.{workspace_domain}
    variables:
      deployment_name:
        description: >-
          The Databricks workspace deployment name: the host prefix of the
          workspace URL (dbc-abcd0123-a1bc on AWS, adb-1234567890123456.7 on
          Azure, 1234567890123456.7 on GCP). Set DATABRICKS_DEPLOYMENT_NAME to
          default it for the session.
        default: dbc-abcd0123-a1bc
        x-stackQL-envVar: DATABRICKS_DEPLOYMENT_NAME
      workspace_domain:
        description: >-
          The Databricks workspace domain suffix for the cloud. Selected by
          DATABRICKS_CLOUD (aws, azure or gcp; default aws).
        default: cloud.databricks.com
        x-stackQL-envVarSelector:
          envVar: DATABRICKS_CLOUD
          default: aws
          values:
            aws: cloud.databricks.com
            azure: azuredatabricks.net
            gcp: gcp.databricks.com
paths:
  /api/environments/v1/workspace-base-environments:
    post:
      operationId: environments_create_workspace_base_environment
      summary: >-
        Creates a new WorkspaceBaseEnvironment. This is a long-running
        operation. The operation will
      tags:
        - environments
      description: >-
        Creates a new WorkspaceBaseEnvironment. This is a long-running
        operation. The operation will

        asynchronously generate a materialized environment to optimize
        dependency resolution and is only

        marked as done when the materialized environment has been successfully
        generated or has failed.


        :param workspace_base_environment: :class:`WorkspaceBaseEnvironment`
          Required. The workspace base environment to create.
        :param request_id: str (optional)
          A unique identifier for this request. A random UUID is recommended. This request is only idempotent
          if a request_id is provided.
        :param workspace_base_environment_id: str (optional)
          The ID to use for the workspace base environment, which will become the final component of the
          resource name. This value should be 4-63 characters, and valid characters are /[a-z][0-9]-/.

        :returns: :class:`Operation`
      parameters:
        - name: request_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            A unique identifier for this request. A random UUID is recommended.
            This request is only idempotent if a request_id is provided.
        - name: workspace_base_environment_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            The ID to use for the workspace base environment, which will become
            the final component of the resource name. This value should be 4-63
            characters, and valid characters are /[a-z][0-9]-/.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: >-
                    Human-readable display name for the workspace base
                    environment.
                base_environment_type:
                  type: string
                  x-enum:
                    - CPU
                    - GPU
                  description: The type of base environment (CPU or GPU).
                create_time:
                  type: string
                  format: date-time
                  description: Timestamp when the environment was created.
                creator_user_id:
                  type: string
                  description: User ID of the creator.
                filepath:
                  type: string
                  description: The WSFS or UC Volumes path to the environment YAML file.
                is_default:
                  type: boolean
                  description: Whether this is the default environment for the workspace.
                last_updated_user_id:
                  type: string
                  description: User ID of the last user who updated the environment.
                message:
                  type: string
                  description: >-
                    Status message providing additional details about the
                    environment status.
                name:
                  type: string
                  description: >-
                    The resource name of the workspace base environment. Format:
                    workspace-base-environments/{workspace-base-environment}
                spec:
                  type: object
                  properties:
                    dependencies:
                      type: array
                      items:
                        type: string
                      description: >-
                        List of pip dependencies, as supported by the version of
                        pip in this environment. Each dependency is a valid pip
                        requirements file line per
                        https://pip.pypa.io/en/stable/reference/requirements-file-format/.
                        Allowed dependencies include a requirement specifier, an
                        archive URL, a local project path (such as WSFS or UC
                        Volumes in Databricks), or a VCS project URL.
                    environment_version:
                      type: string
                      description: >-
                        Environment version used by the environment. Each
                        version comes with a specific Python version and a set
                        of Python packages. The version is a string, consisting
                        of an integer.
                  description: >-
                    The environment specification containing version and
                    dependencies.
                status:
                  type: string
                  x-enum:
                    - CREATED
                    - EXPIRED
                    - FAILED
                    - INVALID
                    - PENDING
                    - REFRESHING
                  description: The status of the materialized workspace base environment.
                update_time:
                  type: string
                  format: date-time
                  description: Timestamp when the environment was last updated.
              required:
                - display_name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: EnvironmentsAPI
    get:
      operationId: environments_list_workspace_base_environments
      summary: Lists all WorkspaceBaseEnvironments in the workspace.
      tags:
        - environments
      description: >-
        Lists all WorkspaceBaseEnvironments in the workspace.


        Databricks provides the following base environments:


        - ``workspace-base-environments/databricks_ai_...``: includes popular AI
        and deep learning packages
          for serverless GPU compute.
        - ``workspace-base-environments/databricks_ml_...``: includes popular ML
        packages for serverless
          compute.

        Databricks-provided base environments are versioned. For example,

        ``workspace-base-environments/databricks_ml_v5`` corresponds to the ML
        environment built on

        environment version 5.


        :param page_size: int (optional)
          The maximum number of environments to return per page. Default is 1000.
        :param page_token: str (optional)
          Page token for pagination. Received from a previous ListWorkspaceBaseEnvironments call.

        :returns: Iterator over :class:`WorkspaceBaseEnvironment`
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of environments to return per page. Default is
            1000.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            Page token for pagination. Received from a previous
            ListWorkspaceBaseEnvironments call.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspaceBaseEnvironmentsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: EnvironmentsAPI
