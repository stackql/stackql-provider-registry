        name:
          type: string
          description: >-
            The resource name of the workspace base environment. Format:
            workspace-base-environments/{workspace-base-environment}
        spec:
          $ref: '#/components/schemas/EnvironmentSpec'
          description: The environment specification containing version and dependencies.
        status:
          $ref: '#/components/schemas/WorkspaceBaseEnvironmentCacheStatus'
          description: The status of the materialized workspace base environment.
        update_time:
          type: string
          format: date-time
          description: Timestamp when the environment was last updated.
      required:
