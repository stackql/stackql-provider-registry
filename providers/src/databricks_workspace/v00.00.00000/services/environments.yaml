            https://pip.pypa.io/en/stable/reference/requirements-file-format/.
            Allowed dependencies include a requirement specifier, an archive
            URL, a local project path (such as WSFS or UC Volumes in
            Databricks), or a VCS project URL.
        environment_version:
          type: string
          description: >-
            Environment version used by the environment. Each version comes with
            a specific Python version and a set of Python packages. The version
            is a string, consisting of an integer.
      description: >-
        Environment specification for a WorkspaceBaseEnvironment. Contains the
        environment version and
            dependencies configuration.
    ListWorkspaceBaseEnvironmentsResponse:
      type: object
      properties:
        next_page_token:
