components:
  schemas:
    AnomalyDetectionConfig:
      type: object
      properties:
        custom_check_configurations:
          type: array
          items:
            $ref: '#/components/schemas/CustomCheckConfiguration'
        excluded_table_full_names:
          type: array
          items:
            type: string
          description: >-
            List of fully qualified table names to exclude from anomaly
            detection.
        job_type:
          $ref: '#/components/schemas/AnomalyDetectionJobType'
          description: The type of the last run of the workflow.
        last_run_id:
          type: string
          description: Run id of the last run of the workflow
        latest_run_status:
          $ref: '#/components/schemas/AnomalyDetectionRunStatus'
          description: The status of the last run of the workflow.
        slicing_config:
          $ref: '#/components/schemas/SlicingConfig'
          description: Per-schema completeness slicing configuration.
        validity_check_configurations:
          type: array
          items:
            $ref: '#/components/schemas/ValidityCheckConfiguration'
    ColumnMatcher:
      type: object
      properties:
        column_names:
          type: array
          items:
            type: string
        variable_name:
          type: string
          description: >-
            Variable name within a custom sql query that this matcher applies
            to.
    ColumnSpec:
      type: object
      properties:
        name:
          type: string
          description: >-
            The name of the column to slice on. The top-K column values are
            auto-discovered.
      required:
        - name
      description: A column to slice completeness monitoring on.
    CustomCheckConfiguration:
      type: object
      properties:
        scalar_check:
          $ref: '#/components/schemas/CustomScalarCheck'
    CustomCheckThresholds:
      type: object
      properties:
        lower_bound:
          $ref: '#/components/schemas/Threshold'
        upper_bound:
          $ref: '#/components/schemas/Threshold'
          description: Upper bound threshold
    CustomScalarCheck:
      type: object
      properties:
        check_name:
          type: string
        column_matchers:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMatcher'
          description: Column matchers to determine which tables to apply this check to
        sql_query:
          type: string
          description: Templated SQL query for this check
        thresholds:
          $ref: '#/components/schemas/CustomCheckThresholds'
          description: Upper/lower thresholds for the output of the query
    ListQualityMonitorResponse:
      type: object
      properties:
        next_page_token:
          type: string
        quality_monitors:
          type: array
          items:
            $ref: '#/components/schemas/QualityMonitor'
    PercentNullValidityCheck:
      type: object
      properties:
        column_names:
          type: array
          items:
            type: string
        upper_bound:
          type: number
          description: Optional upper bound; we should use auto determined bounds for now
    QualityMonitor:
      type: object
      properties:
        object_type:
          type: string
        object_id:
          type: string
          description: The uuid of the request object. For example, schema id.
        anomaly_detection_config:
