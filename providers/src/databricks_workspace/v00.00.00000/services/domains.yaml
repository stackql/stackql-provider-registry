openapi: 3.0.0
info:
  title: Databricks Domains API (workspace)
  description: >-
    OpenAPI specification for the Databricks domains service (workspace-level
    APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.domains
servers:
  - url: https://{deployment_name}.{workspace_domain}
    variables:
      deployment_name:
        description: >-
          The Databricks workspace deployment name: the host prefix of the
          workspace URL (dbc-abcd0123-a1bc on AWS, adb-1234567890123456.7 on
          Azure, 1234567890123456.7 on GCP). Set DATABRICKS_DEPLOYMENT_NAME to
          default it for the session.
        default: dbc-abcd0123-a1bc
        x-stackQL-envVar: DATABRICKS_DEPLOYMENT_NAME
      workspace_domain:
        description: >-
          The Databricks workspace domain suffix for the cloud. Selected by
          DATABRICKS_CLOUD (aws, azure or gcp; default aws).
        default: cloud.databricks.com
        x-stackQL-envVarSelector:
          envVar: DATABRICKS_CLOUD
          default: aws
          values:
            aws: cloud.databricks.com
            azure: azuredatabricks.net
            gcp: gcp.databricks.com
paths:
  /api/2.0/domains:
    post:
      operationId: domains_create_domain
      summary: Create a domain. If ``domain_id`` is omitted, the server generates one.
      tags:
        - domains
      description: |-
        Create a domain. If ``domain_id`` is omitted, the server generates one.

        :param domain: :class:`Domain`
        :param domain_id: str (optional)
          Client-supplied resource ID for the new domain. If omitted, the server generates one.

        :returns: :class:`Domain`
      parameters:
        - name: domain_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            Client-supplied resource ID for the new domain. If omitted, the
            server generates one.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_key:
                  type: string
                business_owner_ids:
                  type: array
                  items:
                    type: integer
                  description: >-
                    Principal IDs of the business owners (users, groups, or
                    service principals).
                create_time:
                  type: string
                  format: date-time
                  description: Timestamp when the domain was created.
                description:
                  type: string
                  description: Full description (max 4096 chars)
                domain_id:
                  type: string
                  description: >-
                    Unique identifier for the domain. If omitted at Create, the
                    server generates one.
                draft:
                  type: boolean
                  description: >-
                    Whether to mark the domain as a draft. If omitted on Create,
                    the server applies a default; the resolved value is returned
                    in ``effective_draft``.
                effective_draft:
                  type: boolean
                  description: Resolved draft state of the domain.
                icon:
                  type: object
                  properties:
                    color:
                      type: string
                      description: 'Hex color code with # prefix (e.g., "#FF5733").'
                    name:
                      type: string
                      x-enum:
                        - ADDRESS_BOOK
                        - ALARM
