    get:
      operationId: domains_list_domains
      summary: >-
        List domains in the account. Set ``parent_domain_id`` to return only the
        direct subdomains of a given
      tags:
        - domains
      description: >-
        List domains in the account. Set ``parent_domain_id`` to return only the
        direct subdomains of a given

        domain.


        Authorization: external callers must have the ``MANAGE DISCOVER``
        permission; only domains the caller

        is authorized to read are returned.


        :param page_size: int (optional)

        :param page_token: str (optional)

        :param parent_domain_id: str (optional)
          Filter by parent domain.

          - Absent: return all domains regardless of hierarchy.
          - Present: return only direct children of the specified domain.

        :returns: Iterator over :class:`Domain`
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
        - name: page_token
          in: query
          required: false
          schema:
            type: string
        - name: parent_domain_id
          in: query
          required: false
          schema:
            type: string
          description: >-
            Filter by parent domain. - Absent: return all domains regardless of
            hierarchy. - Present: return only direct children of the specified
            domain.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDomainsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: DomainsAPI
