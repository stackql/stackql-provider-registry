      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `domain_id` segment of the `name` resource name
            (`domains/{domain_id}`). Full resource name of the domain to delete.
            Format: ``domains/{domain_id}``
        - name: force
