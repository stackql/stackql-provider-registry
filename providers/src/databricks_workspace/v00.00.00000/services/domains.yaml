                      description: Available icon names for a domain.
                  description: Icon to display for the domain.
                name:
                  type: string
                  description: >-
                    Full resource name of the domain. The primary identifier for
                    this resource. Format: ``domains/{domain_id}`` Identifies
                    the domain on get, update, and delete. Not an input on
                    create — to choose the id, set
                    ``CreateDomainRequest.domain_id``.
                parent_domain_id:
                  type: string
                  description: >-
                    Domain ID of the parent. If absent, this is a top-level
                    domain. If present, this domain is a subdomain of the
