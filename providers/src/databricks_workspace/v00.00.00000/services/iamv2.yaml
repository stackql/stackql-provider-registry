        identity, use the ExternalUser resource.

        :param user: :class:`User`
          Required. User to be created in Databricks

        :returns: :class:`User`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username/email of the user.
                full_name:
                  type: object
                  properties:
                    family_name:
                      type: string
                    given_name:
                      type: string
                account_user_status:
                  type: string
                  x-enum:
                  - ACTIVE
                  - INACTIVE
                  description: The activity status of a user in a Databricks account.
                account_id:
                  type: string
                  description: The accountId parent of the user in Databricks.
                external_id:
                  type: string
                  description: ExternalId of the user in the customer's IdP.
                user_id:
                  type: string
                  description: Internal userId of the user in Databricks.
              required:
              - username
              - full_name
              - account_user_status
      responses:
        '200':
          description: Success
