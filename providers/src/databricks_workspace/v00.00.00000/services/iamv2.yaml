  /api/2.0/identity/workspace-assignments:
    post:
      operationId: workspace_iam_v2_create_workspace_assignment_proxy
      summary: Creates a workspace assignment for a principal in the calling workspace. Entitlements are granted one
      tags:
      - iamv2
      - workspace_iam_v2
      description: |-
        Creates a workspace assignment for a principal in the calling workspace. Entitlements are granted one
        at a time rather than atomically. If the request fails partway through, the principal stays assigned
        to the workspace with only some of the requested entitlements. Get the assignment afterwards to
        confirm which entitlements were granted.

        :param workspace_assignment: :class:`WorkspaceAssignment`
          Required. Workspace assignment to be created in Databricks.

        :returns: :class:`WorkspaceAssignment`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                principal_id:
                  type: integer
                  description: The internal ID of the principal (user/sp/group) in Databricks.
                account_id:
                  type: string
                  description: The account ID parent of the workspace where the principal is assigned
                effective_entitlements:
