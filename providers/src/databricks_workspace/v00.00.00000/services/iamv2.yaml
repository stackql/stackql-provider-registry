openapi: 3.0.0
info:
  title: Databricks Iamv2 API (workspace)
  description: OpenAPI specification for the Databricks iamv2 service (workspace-level APIs), generated from the Databricks
    Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.iamv2
servers:
- url: https://{deployment_name}.{workspace_domain}
  variables:
    deployment_name:
      description: 'The Databricks workspace deployment name: the host prefix of the workspace URL (dbc-abcd0123-a1bc on AWS,
        adb-1234567890123456.7 on Azure, 1234567890123456.7 on GCP). Set DATABRICKS_DEPLOYMENT_NAME to default it for the
        session.'
      default: dbc-abcd0123-a1bc
      x-stackQL-envVar: DATABRICKS_DEPLOYMENT_NAME
    workspace_domain:
      description: The Databricks workspace domain suffix for the cloud. Selected by DATABRICKS_CLOUD (aws, azure or gcp;
        default aws).
      default: cloud.databricks.com
      x-stackQL-envVarSelector:
        envVar: DATABRICKS_CLOUD
        default: aws
        values:
          aws: cloud.databricks.com
          azure: azuredatabricks.net
          gcp: gcp.databricks.com
paths:
  /api/2.0/identity/groups/{group_id}/direct-members:
    post:
      operationId: workspace_iam_v2_create_direct_group_member_proxy
      summary: Creates a group membership (assigns a principal to a group).
      tags:
      - iamv2
      - workspace_iam_v2
      description: |-
        Creates a group membership (assigns a principal to a group).

        :param group_id: int
          Required. Internal ID of the group in Databricks.
        :param direct_group_member: :class:`DirectGroupMember`
          Required. The group membership to create.

        :returns: :class:`DirectGroupMember`
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: integer
        description: Required. Internal ID of the group in Databricks.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                principal_id:
                  type: integer
                  description: Internal ID of the principal in Databricks.
                display_name:
                  type: string
                  description: Display name of the principal.
                external_id:
                  type: string
                  description: The external ID of the principal in the customer's IdP.
                group_id:
                  type: integer
                  description: The internal ID of the group this member belongs to.
                membership_source:
                  type: string
                  x-enum:
                  - IDENTITY_PROVIDER
                  - INTERNAL
                  description: The source of group membership (internal or from identity provider).
                principal_type:
                  type: string
                  x-enum:
                  - GROUP
                  - SERVICE_PRINCIPAL
                  - USER
                  description: The type of the principal (user/service principal/group).
              required:
              - principal_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectGroupMember'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: WorkspaceIamV2API
    get:
      operationId: workspace_iam_v2_list_direct_group_members_proxy
      summary: Lists provisioned direct members of a group with their membership source (internal or from identity
      tags:
      - iamv2
      - workspace_iam_v2
      description: |-
        Lists provisioned direct members of a group with their membership source (internal or from identity
        provider).

        :param group_id: int
          Required. Internal ID of the group in Databricks whose direct members are being listed.
        :param page_size: int (optional)
          The maximum number of members to return. The service may return fewer than this value. If not
          provided, defaults to 1000, which is also the maximum allowed. Requests for more than the maximum
          are clamped to 1000.
        :param page_token: str (optional)
          A page token from a previous list call. Provide this to retrieve the subsequent page.

        :returns: Iterator over :class:`DirectGroupMember`
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: integer
        description: Required. Internal ID of the group in Databricks whose direct members are being listed.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
        description: The maximum number of members to return. The service may return fewer than this value. If not provided,
          defaults to 1000, which is also the maximum allowed. Requests for more than the maximum are clamped to 1000.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
        description: A page token from a previous list call. Provide this to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDirectGroupMembersResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: WorkspaceIamV2API
  /api/2.0/identity/groups:
    post:
      operationId: workspace_iam_v2_create_group_proxy
      summary: Creates a local group in the Databricks account that parents the calling workspace and returns the
      tags:
      - iamv2
      - workspace_iam_v2
      description: |-
        Creates a local group in the Databricks account that parents the calling workspace and returns the
        created group. A local group is one that is not synced from the customer's identity provider, and can
        be created whether or not Account Identity Management (AIM) is enabled.

        When AIM is enabled, supplying an external ID returns an error. To provision the identity from your
        identity provider, resolve it by its external ID with ResolveGroup; to read an existing external
        identity, use the ExternalGroup resource.

        :param group: :class:`Group`
          Required. Group to be created in Databricks

        :returns: :class:`Group`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  description: The parent account ID for group in Databricks.
                external_id:
                  type: string
                  description: ExternalId of the group in the customer's IdP.
                group_id:
                  type: string
                  description: Internal group ID of the group in Databricks.
                group_name:
                  type: string
                  description: Display name of the group.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: WorkspaceIamV2API
    get:
      operationId: workspace_iam_v2_list_groups_proxy
      summary: Lists the groups in the Databricks account that parents the calling workspace, returning one page per
      tags:
      - iamv2
      - workspace_iam_v2
      description: |-
        Lists the groups in the Databricks account that parents the calling workspace, returning one page per
        call. Supports filtering by group name or external ID.

        :param filter: str (optional)
          Optional. Allows filtering groups by group name or external id.
        :param page_size: int (optional)
          The maximum number of groups to return. The service may return fewer than this value. If not
          provided, defaults to 1000, which is also the maximum allowed. Requests for more than the maximum
          are clamped to 1000.
        :param page_token: str (optional)
          A page token, received from a previous ListGroups call. Provide this to retrieve the subsequent
          page.

        :returns: Iterator over :class:`Group`
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
        description: Optional. Allows filtering groups by group name or external id.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
        description: The maximum number of groups to return. The service may return fewer than this value. If not provided,
          defaults to 1000, which is also the maximum allowed. Requests for more than the maximum are clamped to 1000.
      - name: page_token
