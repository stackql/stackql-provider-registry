          description: The type of the principal (user/service principal/group).
      required:
      - principal_id
      description: Represents a principal that is a direct member of a group, with its source of membership.
    ExactMatchRule:
      type: object
      properties:
        external_id:
          type: string
          description: The identity provider's external ID for the group to match. This is not the Databricks group ID. The
            value must be non-empty and is matched exactly, including case.
      required:
      - external_id
      description: An exact-match rule that matches a group's external ID from the identity provider.
    ExternalGroup:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
        display_name:
          type: string
          description: Display name of the group from the customer's IdP.
        external_group_id:
          type: string
          description: The external ID of the group in the customer's IdP.
        internal_id:
          type: string
          description: Internal groupId of the group in Databricks.
        name:
          type: string
          description: 'The resource name of the external group. The format depends on the API that returned it: - Account-scoped:
            accounts/{account_id}/external-groups/{external_group_id} - Workspace-scoped: external-groups/{external_group_id}'
      description: |-
        An external group from the customer's Identity Provider, resolved into Databricks. This is a
            read-only resource keyed by the IdP external ID. The Get method may trigger an idempotent sync
            from the customer's IdP to provision or refresh the group's data in Databricks.
    ExternalServicePrincipal:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
