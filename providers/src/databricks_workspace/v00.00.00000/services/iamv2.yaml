  /api/2.0/identity/workspace-assignment-details:
    post:
      operationId: workspace_iam_v2_create_workspace_assignment_detail_proxy
      summary: Creates a workspace assignment detail for a principal (workspace-level proxy). Entitlement grants are
      tags:
      - iamv2
      - workspace_iam_v2
      description: |-
        Creates a workspace assignment detail for a principal (workspace-level proxy). Entitlement grants are
        applied individually and non-atomically — if a failure occurs partway through, the principal will be
        assigned to the workspace but with only a subset of the requested entitlements. Use
        GetWorkspaceAssignmentDetail to confirm which entitlements were successfully granted.

        :param workspace_assignment_detail: :class:`WorkspaceAssignmentDetail`
          Required. Workspace assignment detail to be created in <Databricks>.

        :returns: :class:`WorkspaceAssignmentDetail`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_assignment_detail:
                  type: object
                  properties:
                    principal_id:
                      type: integer
                      description: The internal ID of the principal (user/sp/group) in Databricks.
                    account_id:
                      type: string
                      description: The account ID parent of the workspace where the principal is assigned
                    effective_entitlements:
                      type: array
                      items:
                        type: string
                        x-enum:
                        - ALLOW_CLUSTER_CREATE
                        - ALLOW_INSTANCE_POOL_CREATE
                        - DATABRICKS_SQL_ACCESS
                        - WORKSPACE_ACCESS
                        - WORKSPACE_ADMIN
                        - WORKSPACE_CONSUME
                        description: |-
                          Create a collection of name/value pairs.

                          Example enumeration:

                          >>> class Color(Enum):
                          ...     RED = 1
                          ...     BLUE = 2
                          ...     GREEN = 3

                          Access them by:

                          - attribute access:

                            >>> Color.RED
                            <Color.RED: 1>

                          - value lookup:

                            >>> Color(1)
                            <Color.RED: 1>

                          - name lookup:

                            >>> Color['RED']
                            <Color.RED: 1>

                          Enumerations can be iterated over, and know how many members they have:

                          >>> len(Color)
                          3

                          >>> list(Color)
                          [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

                          Methods can be added to enumerations, and members can have their own
                          attributes -- see the documentation for details.
                      description: 'The principal''s full effective entitlements granted in this workspace: every entitlement
                        it holds whether granted directly or via group membership. Populated on Get; empty on List.'
                    entitlements:
                      type: array
                      items:
                        type: string
                        x-enum:
                        - ALLOW_CLUSTER_CREATE
                        - ALLOW_INSTANCE_POOL_CREATE
                        - DATABRICKS_SQL_ACCESS
                        - WORKSPACE_ACCESS
                        - WORKSPACE_ADMIN
                        - WORKSPACE_CONSUME
                        description: |-
                          Create a collection of name/value pairs.

                          Example enumeration:

                          >>> class Color(Enum):
                          ...     RED = 1
                          ...     BLUE = 2
                          ...     GREEN = 3

                          Access them by:

                          - attribute access:

                            >>> Color.RED
                            <Color.RED: 1>

                          - value lookup:

                            >>> Color(1)
                            <Color.RED: 1>

                          - name lookup:

                            >>> Color['RED']
                            <Color.RED: 1>

                          Enumerations can be iterated over, and know how many members they have:

                          >>> len(Color)
                          3

                          >>> list(Color)
                          [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

                          Methods can be added to enumerations, and members can have their own
                          attributes -- see the documentation for details.
                      description: 'Entitlements granted directly to the principal on this workspace. The only client-settable
                        field: create and update manage exactly this set (including entitlements the principal also holds
                        via a group). Not populated by ListWorkspaceAssignmentDetails (omitted for scalability); call GetWorkspaceAssignmentDetail
                        to read the entitlements for a single principal.'
                    principal_type:
                      type: string
                      x-enum:
                      - GROUP
                      - SERVICE_PRINCIPAL
                      - USER
                      description: The type of the principal (user/sp/group).
                    workspace_id:
                      type: integer
                      description: The workspace ID where the principal is assigned
                  required:
                  - principal_id
                  description: Required. Workspace assignment detail to be created in <Databricks>.
              required:
              - workspace_assignment_detail
      responses:
        '200':
          description: Success
