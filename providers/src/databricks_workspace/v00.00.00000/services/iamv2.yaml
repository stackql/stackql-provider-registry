                  message:
                    type: string
      x-stackql-sdk-source: WorkspaceIamV2API
    get:
      operationId: workspace_iam_v2_list_workspace_assignment_details_proxy
      summary: Lists workspace assignment details for a workspace (workspace-level proxy). For scalability, the
      tags:
