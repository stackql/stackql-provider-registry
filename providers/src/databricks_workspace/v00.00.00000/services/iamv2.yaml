        application_id:
          type: string
          description: Application ID of the service principal, from the customer's IdP.
        display_name:
          type: string
          description: Display name of the service principal, from the customer's IdP.
        external_service_principal_id:
          type: string
          description: The external ID of the service principal in the customer's IdP.
        internal_id:
          type: string
          description: Internal servicePrincipalId of the service principal in Databricks.
        name:
          type: string
          description: 'The resource name of the external service principal. The format depends on the API that returned it:
            - Account-scoped: accounts/{account_id}/external-service-principals/{external_service_principal_id} - Workspace-scoped:
            external-service-principals/{external_service_principal_id}'
      description: |-
        An external service principal from the customer's Identity Provider, resolved into Databricks.
            This is a read-only resource keyed by the IdP external ID. The Get method may trigger an
            idempotent sync from the customer's IdP to provision or refresh the service principal's data in
            Databricks.
