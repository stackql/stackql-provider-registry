    WorkspaceAccessDetail:
      type: object
      properties:
        access_type:
          $ref: '#/components/schemas/WorkspaceAccessDetailAccessType'
        account_id:
          type: string
          description: The account ID parent of the workspace where the principal has access.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/WorkspacePermission'
          description: The permissions granted to the principal in the workspace.
        principal_id:
          type: integer
          description: The internal ID of the principal (user/sp/group) in Databricks.
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
        status:
          $ref: '#/components/schemas/State'
          description: The activity status of the principal in the workspace. Not applicable for groups at the moment.
        workspace_id:
          type: integer
          description: The workspace ID where the principal has access.
      description: The details of a principal's access to a workspace.
    WorkspaceAssignmentDetail:
      type: object
      properties:
        principal_id:
          type: integer
          description: The internal ID of the principal (user/sp/group) in Databricks.
        account_id:
          type: string
          description: The account ID parent of the workspace where the principal is assigned
        effective_entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
          description: 'The principal''s full effective entitlements granted in this workspace: every entitlement it holds
            whether granted directly or via group membership. Populated on Get; empty on List.'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
          description: 'Entitlements granted directly to the principal on this workspace. The only client-settable field:
            create and update manage exactly this set (including entitlements the principal also holds via a group). Not populated
            by ListWorkspaceAssignmentDetails (omitted for scalability); call GetWorkspaceAssignmentDetail to read the entitlements
            for a single principal.'
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
        workspace_id:
          type: integer
          description: The workspace ID where the principal is assigned
      required:
      - principal_id
      description: |-
        The direct assignment of a provisioned account-level principal (user, service principal, or
            group) to a workspace, together with the entitlements that assignment grants in the workspace.

            A WorkspaceAssignmentDetail exists only for principals that are directly assigned to the
            workspace; principals that merely inherit workspace access through a group are not represented
            here (see WorkspaceAccessDetail / WorkspaceIdentityDetail for the effective, direct-or-indirect
            view). Creating the resource assigns the principal to the workspace; deleting it removes the
            assignment. The ``entitlements`` field is the only client-settable field and defines the
            entitlements granted directly on this assignment; ``effective_entitlements`` is the read-only
            union of those plus any granted via group membership.

            A direct assignment always carries at least one directly-assigned entitlement: the assignment is
            what grants the entitlement, so a WorkspaceAssignmentDetail with an empty ``entitlements`` set
            is not a valid state. Both create and update require a non-empty ``entitlements`` set (an empty
            set is rejected); to remove a principal's assignment entirely, delete the resource.

            This resource replaces workspace assignment previously managed through the workspace SCIM and
            permission-assignment APIs, and is intended for account and workspace admins.
    WorkspaceIdentityDetail:
      type: object
      properties:
        assignment_type:
          $ref: '#/components/schemas/WorkspaceIdentityDetailAssignmentType'
          description: The type of assignment the principal has to the workspace (direct or indirect).
        principal_id:
          type: integer
          description: The internal ID of the principal (user/sp/group) in Databricks.
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
          description: The type of the principal (user/service principal/group).
        workspace_identity_status:
          $ref: '#/components/schemas/State'
          description: The activity status of an identity in a Databricks workspace.
      description: The details of a directly or indirectly assigned principal's details in a workspace.
    AccountAccessRuleAction:
      type: string
      x-enum:
      - DENY
      description: The action type for an account access identity rule (currently DENY only).
    Entitlement:
      type: string
      x-enum:
      - ALLOW_CLUSTER_CREATE
      - ALLOW_INSTANCE_POOL_CREATE
      - DATABRICKS_SQL_ACCESS
      - WORKSPACE_ACCESS
      - WORKSPACE_ADMIN
      - WORKSPACE_CONSUME
      description: |-
        Create a collection of name/value pairs.

        Example enumeration:

        >>> class Color(Enum):
        ...     RED = 1
        ...     BLUE = 2
        ...     GREEN = 3

        Access them by:

        - attribute access:

          >>> Color.RED
          <Color.RED: 1>

        - value lookup:

          >>> Color(1)
          <Color.RED: 1>

        - name lookup:

          >>> Color['RED']
          <Color.RED: 1>

        Enumerations can be iterated over, and know how many members they have:

        >>> len(Color)
        3

        >>> list(Color)
        [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

        Methods can be added to enumerations, and members can have their own
        attributes -- see the documentation for details.
    GroupMembershipSource:
      type: string
      x-enum:
      - IDENTITY_PROVIDER
      - INTERNAL
      description: The source of the group membership (internal or from identity provider).
    PrincipalType:
      type: string
      x-enum:
      - GROUP
      - SERVICE_PRINCIPAL
      - USER
      description: The type of the principal (user/sp/group).
    State:
      type: string
      x-enum:
      - ACTIVE
      - INACTIVE
      description: The activity status of a user or service principal in a Databricks account or workspace.
    WorkspaceAccessDetailAccessType:
      type: string
      x-enum:
      - DIRECT
      - INDIRECT
      description: The type of access the principal has to the workspace.
    WorkspaceAccessDetailView:
      type: string
      x-enum:
      - BASIC
      - FULL
      description: Controls what fields are returned in the GetWorkspaceAccessDetail response.
    WorkspaceIdentityDetailAssignmentType:
      type: string
      x-enum:
      - DIRECT
      - INDIRECT
      description: The type of assignment the principal has to the workspace.
    WorkspacePermission:
      type: string
      x-enum:
      - ADMIN_PERMISSION
      - USER_PERMISSION
      description: The type of permission a principal has to a workspace (admin/user).
