  /api/2.0/identity/workspace-assignment-details:
    post:
      operationId: workspace_iam_v2_create_workspace_assignment_detail_proxy
      summary: Creates a workspace assignment detail for a principal in the calling workspace.
      tags:
      - iamv2
      - workspace_iam_v2
      description: |-
        Creates a workspace assignment detail for a principal in the calling workspace.

        :param workspace_assignment_detail: :class:`WorkspaceAssignmentDetail`
          Required. Workspace assignment detail to be created in Databricks.

        :returns: :class:`WorkspaceAssignmentDetail`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                principal_id:
                  type: integer
                  description: The internal ID of the principal (user/sp/group) in Databricks.
                account_id:
                  type: string
                  description: The account ID parent of the workspace where the principal is assigned
                effective_entitlements:
                  type: array
                  items:
                    type: string
                    x-enum:
                    - ALLOW_CLUSTER_CREATE
                    - ALLOW_INSTANCE_POOL_CREATE
                    - DATABRICKS_SQL_ACCESS
                    - WORKSPACE_ACCESS
                    - WORKSPACE_ADMIN
                    - WORKSPACE_CONSUME
                    description: |-
                      Create a collection of name/value pairs.

                      Example enumeration:

                      >>> class Color(Enum):
                      ...     RED = 1
                      ...     BLUE = 2
                      ...     GREEN = 3

                      Access them by:

                      - attribute access:

                        >>> Color.RED
                        <Color.RED: 1>

                      - value lookup:

                        >>> Color(1)
                        <Color.RED: 1>

                      - name lookup:

                        >>> Color['RED']
                        <Color.RED: 1>

                      Enumerations can be iterated over, and know how many members they have:

                      >>> len(Color)
                      3

                      >>> list(Color)
                      [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

                      Methods can be added to enumerations, and members can have their own
                      attributes -- see the documentation for details.
                  description: Every entitlement the principal holds in this workspace, whether granted directly or through
                    group membership. Get responses populate this field. List responses leave it empty.
                entitlements:
                  type: array
                  items:
                    type: string
                    x-enum:
                    - ALLOW_CLUSTER_CREATE
                    - ALLOW_INSTANCE_POOL_CREATE
                    - DATABRICKS_SQL_ACCESS
                    - WORKSPACE_ACCESS
                    - WORKSPACE_ADMIN
                    - WORKSPACE_CONSUME
                    description: |-
                      Create a collection of name/value pairs.

                      Example enumeration:

                      >>> class Color(Enum):
                      ...     RED = 1
                      ...     BLUE = 2
                      ...     GREEN = 3

                      Access them by:

                      - attribute access:

                        >>> Color.RED
                        <Color.RED: 1>

                      - value lookup:

                        >>> Color(1)
                        <Color.RED: 1>

                      - name lookup:

                        >>> Color['RED']
                        <Color.RED: 1>

                      Enumerations can be iterated over, and know how many members they have:

                      >>> len(Color)
                      3

                      >>> list(Color)
                      [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]

                      Methods can be added to enumerations, and members can have their own
                      attributes -- see the documentation for details.
                  description: Entitlements granted directly to the principal on this workspace. This is the only client-settable
                    field. Create and update manage exactly this set, including entitlements the principal also holds through
                    a group. List responses leave this field empty. Get a single principal to read its entitlements.
                principal_type:
                  type: string
                  x-enum:
                  - GROUP
                  - SERVICE_PRINCIPAL
                  - USER
                  description: The type of the principal (user/sp/group).
                workspace_id:
                  type: integer
                  description: The workspace ID where the principal is assigned.
              required:
              - principal_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAssignmentDetail'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: WorkspaceIamV2API
    get:
      operationId: workspace_iam_v2_list_workspace_assignment_details_proxy
      summary: Lists workspace assignment details for the calling workspace. The response omits the per-principal
      tags:
      - iamv2
      - workspace_iam_v2
      description: |-
        Lists workspace assignment details for the calling workspace. The response omits the per-principal
        entitlement fields (``entitlements`` and ``effective_entitlements``). To read the entitlements for a
        single principal, get that principal's assignment detail.

        :param page_size: int (optional)
          The maximum number of workspace assignment details to return. The service may return fewer than this
