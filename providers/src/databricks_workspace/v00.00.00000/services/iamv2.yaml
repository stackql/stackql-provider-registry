        required: false
        schema:
          type: string
        description: A page token, received from a previous ListGroups call. Provide this to retrieve the subsequent page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroupsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: WorkspaceIamV2API
  /api/2.0/identity/service-principals:
    post:
      operationId: workspace_iam_v2_create_service_principal_proxy
      summary: Creates a local service principal in the Databricks account that parents the calling workspace and
      tags:
      - iamv2
      - workspace_iam_v2
      description: |-
        Creates a local service principal in the Databricks account that parents the calling workspace and
        returns the created service principal. A local service principal is one that is not synced from the
        customer's identity provider, and can be created whether or not Account Identity Management (AIM) is
        enabled.

        When AIM is enabled, supplying an external ID returns an error. To provision the identity from your
        identity provider, resolve it by its external ID with ResolveServicePrincipal; to read an existing
        external identity, use the ExternalServicePrincipal resource.

        :param service_principal: :class:`ServicePrincipal`
          Required. Service principal to be created in Databricks

        :returns: :class:`ServicePrincipal`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: Display name of the service principal.
                account_sp_status:
                  type: string
                  x-enum:
                  - ACTIVE
                  - INACTIVE
                  description: The activity status of a service principal in a Databricks account.
                account_id:
                  type: string
                  description: The parent account ID for the service principal in Databricks.
                application_id:
                  type: string
                  description: Application ID of the service principal. Set at creation time and cannot be changed afterwards;
                    when omitted, the server generates one.
                external_id:
                  type: string
                  description: ExternalId of the service principal in the customer's IdP.
                service_principal_id:
                  type: string
                  description: Internal service principal ID of the service principal in Databricks.
              required:
              - display_name
              - account_sp_status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrincipal'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: WorkspaceIamV2API
