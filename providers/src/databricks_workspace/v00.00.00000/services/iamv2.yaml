components:
  schemas:
    AccountAccessIdentityRule:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/AccountAccessRuleAction'
          description: Currently, only DENY action is supported.
        display_name:
          type: string
          description: Display name of the principal.
        external_principal_id:
          type: string
          description: External ID of the principal in the customer's IdP.
        name:
          type: string
          description: 'Fully qualified name for the rule. Format: accounts/{account_id}/account-access-identity-rules/{external_principal_id}'
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
          description: The type of the principal (user/service principal/group). This field is populated by the server based
            on the external_principal_id.
      required:
      - action
      description: An identity rule that controls which principals can access an account.
    AttributeControlEntry:
      type: object
      properties:
        is_allowed:
          type: boolean
          description: Whether the attribute is permitted. Always true in the Identity Attributes PrPr.
        name:
          type: string
          description: 'The resource name of the entry. Format: accounts/{account_id}/attribute-control-entries/{attribute_name}
            where {attribute_name} is the IdP attribute being governed (e.g. "department").'
      description: |-
        A single entry in an account's identity attribute control list. The presence of an entry means
            the governed attribute (the last segment of ``name``) is controlled across all write sources
            (SCIM, Identity APIs, AIM); is_allowed records whether the attribute is permitted (always true
            in the Identity Attributes PrPr). For the Identity Attributes PrPr the control list is an
            explicit allowlist: an attribute that is NOT present in the control list is treated as not
            allowed. This may change post-PrPr.
    DirectGroupMember:
      type: object
      properties:
        principal_id:
          type: integer
          description: Internal ID of the principal in Databricks.
        display_name:
          type: string
          description: Display name of the principal.
        external_id:
          type: string
          description: The external ID of the principal in Databricks.
        membership_source:
          $ref: '#/components/schemas/GroupMembershipSource'
          description: The source of group membership (internal or from identity provider).
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
          description: The type of the principal (user/service principal/group).
      required:
      - principal_id
      description: Represents a principal that is a direct member of a group, with its source of membership.
    ExternalGroup:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
        display_name:
          type: string
          description: Display name of the group from the customer's IdP.
        external_group_id:
          type: string
          description: The external ID of the group in the customer's IdP.
        internal_id:
          type: string
          description: Internal groupId of the group in Databricks.
        name:
          type: string
          description: 'The resource name of the external group. Format: accounts/{account_id}/external-groups/{external_group_id}'
      description: |-
        An external group from the customer's Identity Provider, resolved into Databricks. This is a
            read-only resource keyed by the IdP external ID. The Get method may trigger an idempotent sync
            from the customer's IdP to provision or refresh the group's data in Databricks.
    ExternalServicePrincipal:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
        account_sp_status:
          $ref: '#/components/schemas/State'
          description: The activity status of the service principal in the Databricks account.
        application_id:
          type: string
          description: Application ID of the service principal, from the customer's IdP.
        display_name:
          type: string
          description: Display name of the service principal, from the customer's IdP.
        external_service_principal_id:
          type: string
          description: The external ID of the service principal in the customer's IdP.
        internal_id:
          type: string
          description: Internal servicePrincipalId of the service principal in Databricks.
        name:
          type: string
          description: 'The resource name of the external service principal. Format: accounts/{account_id}/external-service-principals/{external_service_principal_id}'
      description: |-
        An external service principal from the customer's Identity Provider, resolved into Databricks.
            This is a read-only resource keyed by the IdP external ID. The Get method may trigger an
            idempotent sync from the customer's IdP to provision or refresh the service principal's data in
            Databricks.
    ExternalUser:
      type: object
      properties:
        account_id:
          type: string
          description: The parent account ID, from Databricks.
        account_user_status:
          $ref: '#/components/schemas/State'
          description: The activity status of the user in the Databricks account.
        display_name:
          type: string
          description: Display name of the user from the customer's IdP.
        external_user_id:
          type: string
          description: The external ID of the user in the customer's IdP.
        full_name:
          $ref: '#/components/schemas/FullName'
          description: The full name of the user, from the customer's IdP.
        internal_id:
          type: string
          description: Internal userId of the user in Databricks.
        name:
          type: string
          description: 'The resource name of the external user. Format: accounts/{account_id}/external-users/{external_user_id}'
        username:
          type: string
          description: Username/email of the user, from Databricks.
      description: |-
        An external user from the customer's Identity Provider, resolved into Databricks. This is a
            read-only resource that allows customers to look up external user identities by their IdP
            external ID and retrieve the corresponding Databricks internal ID and metadata. The Get method
            may trigger an idempotent sync from the customer's IdP to provision or refresh the user's data
            in Databricks.
    FullName:
      type: object
