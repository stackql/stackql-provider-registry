openapi: 3.0.0
info:
  title: Databricks Knowledgeassistants API (workspace)
  description: >-
    OpenAPI specification for the Databricks knowledgeassistants service
    (workspace-level APIs), generated from the Databricks Python SDK.
  version: 0.1.0
  x-stackql-sdk-version: 0.123.0
  x-stackql-date-generated: '2026-11-01'
  x-stackql-sdk-namespace: databricks.sdk.service.knowledgeassistants
servers:
  - url: https://{deployment_name}.{workspace_domain}
    variables:
      deployment_name:
        description: >-
          The Databricks workspace deployment name: the host prefix of the
          workspace URL (dbc-abcd0123-a1bc on AWS, adb-1234567890123456.7 on
          Azure, 1234567890123456.7 on GCP). Set DATABRICKS_DEPLOYMENT_NAME to
          default it for the session.
        default: dbc-abcd0123-a1bc
        x-stackQL-envVar: DATABRICKS_DEPLOYMENT_NAME
      workspace_domain:
        description: >-
          The Databricks workspace domain suffix for the cloud. Selected by
          DATABRICKS_CLOUD (aws, azure or gcp; default aws).
        default: cloud.databricks.com
        x-stackQL-envVarSelector:
          envVar: DATABRICKS_CLOUD
          default: aws
          values:
            aws: cloud.databricks.com
            azure: azuredatabricks.net
            gcp: gcp.databricks.com
paths:
  /api/2.1/knowledge-assistants/{knowledge_assistant_id}/examples:
    post:
      operationId: knowledge_assistants_create_example
      summary: Creates an example for a Knowledge Assistant.
      tags:
        - knowledgeassistants
        - knowledge_assistants
      description: |-
        Creates an example for a Knowledge Assistant.

        :param parent: str
          Parent resource where this example will be created. Format:
          knowledge-assistants/{knowledge_assistant_id}
        :param example: :class:`Example`
          The example to create under the parent Knowledge Assistant.

        :returns: :class:`Example`
      parameters:
        - name: knowledge_assistant_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `knowledge_assistant_id` segment of the `parent` resource name
            (`knowledge-assistants/{knowledge_assistant_id}`). Parent resource
            where this example will be created. Format:
            knowledge-assistants/{knowledge_assistant_id}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  description: The example question.
                create_time:
                  type: string
                  format: date-time
                  description: Timestamp when this example was created.
                example_id:
                  type: string
                  description: The universally unique identifier (UUID) of the example.
                guidelines:
                  type: array
                  items:
                    type: string
                  description: >-
                    Guidelines for answering the question. Optional — examples
                    may be created with just a question; the front-end form does
                    not require guidelines.
                name:
                  type: string
                  description: >-
                    Full resource name:
                    knowledge-assistants/{knowledge_assistant_id}/examples/{example_id}
                update_time:
                  type: string
                  format: date-time
                  description: Timestamp when this example was last updated.
              required:
                - question
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: KnowledgeAssistantsAPI
    get:
      operationId: knowledge_assistants_list_examples
      summary: Lists examples under a Knowledge Assistant.
      tags:
        - knowledgeassistants
        - knowledge_assistants
      description: |-
        Lists examples under a Knowledge Assistant.

        :param parent: str
          Parent resource to list from. Format: knowledge-assistants/{knowledge_assistant_id}
        :param page_size: int (optional)
          The maximum number of examples to return. If unspecified, at most 100 examples will be returned. The
          maximum value is 100; values above 100 will be coerced to 100.
        :param page_token: str (optional)
          A page token, received from a previous ``ListExamples`` call. Provide this to retrieve the
          subsequent page. If unspecified, the first page will be returned.

        :returns: Iterator over :class:`Example`
      parameters:
        - name: knowledge_assistant_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `knowledge_assistant_id` segment of the `parent` resource name
            (`knowledge-assistants/{knowledge_assistant_id}`). Parent resource
            to list from. Format: knowledge-assistants/{knowledge_assistant_id}
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
          description: >-
            The maximum number of examples to return. If unspecified, at most
            100 examples will be returned. The maximum value is 100; values
            above 100 will be coerced to 100.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: >-
            A page token, received from a previous ``ListExamples`` call.
            Provide this to retrieve the subsequent page. If unspecified, the
            first page will be returned.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListExamplesResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: KnowledgeAssistantsAPI
  /api/2.1/knowledge-assistants:
    post:
      operationId: knowledge_assistants_create_knowledge_assistant
      summary: Creates a Knowledge Assistant.
      tags:
        - knowledgeassistants
        - knowledge_assistants
      description: |-
        Creates a Knowledge Assistant.

        :param knowledge_assistant: :class:`KnowledgeAssistant`
          The Knowledge Assistant to create.

        :returns: :class:`KnowledgeAssistant`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: >-
                    The display name of the Knowledge Assistant, unique at
                    workspace level. Required when creating a Knowledge
                    Assistant. When updating a Knowledge Assistant, optional
                    unless included in update_mask.
                description:
                  type: string
                  description: >-
                    Description of what this agent can do (user-facing).
                    Required when creating a Knowledge Assistant. When updating
                    a Knowledge Assistant, optional unless included in
                    update_mask.
                create_time:
                  type: string
                  format: date-time
                  description: Creation timestamp.
                creator:
                  type: string
                  description: The creator of the Knowledge Assistant.
                endpoint_name:
                  type: string
                  description: The name of the knowledge assistant agent endpoint.
                error_info:
                  type: string
                  description: >-
                    Error details when the Knowledge Assistant is in FAILED
                    state.
                experiment_id:
                  type: string
                  description: The MLflow experiment ID.
                id:
                  type: string
                  description: 'Deprecated: use knowledge_assistant_id instead.'
                instructions:
                  type: string
                  description: >-
                    Additional global instructions on how the agent should
                    generate answers. Optional on create and update. When
                    updating a Knowledge Assistant, include this field in
                    update_mask to modify it.
                name:
                  type: string
                  description: >-
                    The resource name of the Knowledge Assistant. Format:
                    knowledge-assistants/{knowledge_assistant_id}
                state:
                  type: string
                  x-enum:
                    - ACTIVE
                    - CREATING
                    - FAILED
                  description: >-
                    State of the Knowledge Assistant. Not returned in List
                    responses.
              required:
                - display_name
                - description
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAssistant'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: KnowledgeAssistantsAPI
    get:
      operationId: knowledge_assistants_list_knowledge_assistants
      summary: List Knowledge Assistants
      tags:
