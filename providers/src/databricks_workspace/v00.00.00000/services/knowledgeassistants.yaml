  /api/2.1/knowledge-assistants/{knowledge_assistant_id}/knowledge-sources:
    post:
      operationId: knowledge_assistants_create_knowledge_source
      summary: Creates a Knowledge Source under a Knowledge Assistant.
      tags:
        - knowledgeassistants
        - knowledge_assistants
      description: |-
        Creates a Knowledge Source under a Knowledge Assistant.

        :param parent: str
          Parent resource where this source will be created. Format:
          knowledge-assistants/{knowledge_assistant_id}
        :param knowledge_source: :class:`KnowledgeSource`

        :returns: :class:`KnowledgeSource`
      parameters:
        - name: knowledge_assistant_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The `knowledge_assistant_id` segment of the `parent` resource name
            (`knowledge-assistants/{knowledge_assistant_id}`). Parent resource
            where this source will be created. Format:
            knowledge-assistants/{knowledge_assistant_id}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: >-
                    Human-readable display name of the knowledge source.
                    Required when creating a Knowledge Source. When updating a
                    Knowledge Source, optional unless included in update_mask.
                description:
                  type: string
                  description: >-
                    Description of the knowledge source. Required when creating
                    a Knowledge Source. When updating a Knowledge Source,
                    optional unless included in update_mask.
                source_type:
                  type: string
                  description: >-
                    The type of the source: "index", "files", or "file_table".
                    Required when creating a Knowledge Source. When updating a
                    Knowledge Source, this field is ignored.
                create_time:
                  type: string
                  format: date-time
                  description: Timestamp when this knowledge source was created.
                file_table:
                  type: object
                  properties:
                    table_name:
                      type: string
                      description: >-
                        Full UC name of the table, in the format of
                        {CATALOG}.{SCHEMA}.{TABLE_NAME}.
                    file_col:
                      type: string
                      description: >-
                        The name of the column containing BINARY file content to
                        be indexed.
                  required:
                    - table_name
                    - file_col
                  description: FileTableSpec specifies a file table source configuration.
                files:
                  type: object
                  properties:
                    path:
                      type: string
                      description: A UC volume path that includes a list of files.
                  required:
                    - path
                  description: FilesSpec specifies a files source configuration.
                id:
                  type: string
                index:
                  type: object
                  properties:
                    index_name:
                      type: string
                      description: >-
                        Full UC name of the vector search index, in the format
                        of {CATALOG}.{SCHEMA}.{INDEX_NAME}.
                    text_col:
                      type: string
                      description: >-
                        The column that includes the document text for
                        retrieval.
                    doc_uri_col:
                      type: string
                      description: >-
                        The column that specifies a link or reference to where
                        the information came from.
                  required:
                    - index_name
                    - text_col
                    - doc_uri_col
                  description: >-
                    IndexSpec specifies a vector search index source
                    configuration.
                knowledge_cutoff_time:
                  type: string
                  format: date-time
                  description: >-
                    Timestamp representing the cutoff before which content in
                    this knowledge source is being ingested.
                name:
                  type: string
                  description: >-
                    Full resource name:
                    knowledge-assistants/{knowledge_assistant_id}/knowledge-sources/{knowledge_source_id}
                state:
                  type: string
                  x-enum:
                    - FAILED_UPDATE
                    - UPDATED
                    - UPDATING
                  description: >-
                    Create a collection of name/value pairs.


                    Example enumeration:


                    >>> class Color(Enum):

                    ...     RED = 1

                    ...     BLUE = 2

                    ...     GREEN = 3


                    Access them by:


                    - attribute access:

                      >>> Color.RED
                      <Color.RED: 1>

                    - value lookup:

                      >>> Color(1)
                      <Color.RED: 1>

                    - name lookup:

                      >>> Color['RED']
                      <Color.RED: 1>

                    Enumerations can be iterated over, and know how many members
                    they have:


                    >>> len(Color)

                    3


                    >>> list(Color)

                    [<Color.RED: 1>, <Color.BLUE: 2>, <Color.GREEN: 3>]


                    Methods can be added to enumerations, and members can have
                    their own

                    attributes -- see the documentation for details.
              required:
                - display_name
                - description
                - source_type
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSource'
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-stackql-sdk-source: KnowledgeAssistantsAPI
    get:
