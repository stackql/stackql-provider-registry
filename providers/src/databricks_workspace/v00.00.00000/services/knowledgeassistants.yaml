components:
  schemas:
    Example:
      type: object
      properties:
        question:
          type: string
          description: The example question.
        create_time:
          type: string
          format: date-time
          description: Timestamp when this example was created.
        example_id:
          type: string
          description: The universally unique identifier (UUID) of the example.
        guidelines:
          type: array
          items:
            type: string
          description: >-
            Guidelines for answering the question. Optional — examples may be
            created with just a question; the front-end form does not require
            guidelines.
        name:
          type: string
          description: >-
            Full resource name:
            knowledge-assistants/{knowledge_assistant_id}/examples/{example_id}
        update_time:
          type: string
          format: date-time
          description: Timestamp when this example was last updated.
      required:
        - question
      description: >-
        An example associated with a Knowledge Assistant. Contains a question
        and guidelines for how the
            assistant should respond.
    FileTableSpec:
      type: object
      properties:
        table_name:
          type: string
          description: >-
            Full UC name of the table, in the format of
            {CATALOG}.{SCHEMA}.{TABLE_NAME}.
        file_col:
          type: string
          description: The name of the column containing BINARY file content to be indexed.
      required:
        - table_name
        - file_col
      description: FileTableSpec specifies a file table source configuration.
    FilesSpec:
      type: object
      properties:
        path:
          type: string
          description: A UC volume path that includes a list of files.
      required:
        - path
      description: FilesSpec specifies a files source configuration.
    GetKnowledgeAssistantPermissionLevelsResponse:
      type: object
      properties:
        permission_levels:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeAssistantPermissionsDescription'
    IndexSpec:
      type: object
      properties:
        index_name:
          type: string
          description: >-
            Full UC name of the vector search index, in the format of
            {CATALOG}.{SCHEMA}.{INDEX_NAME}.
        text_col:
          type: string
          description: The column that includes the document text for retrieval.
        doc_uri_col:
          type: string
          description: >-
            The column that specifies a link or reference to where the
            information came from.
      required:
        - index_name
        - text_col
        - doc_uri_col
      description: IndexSpec specifies a vector search index source configuration.
