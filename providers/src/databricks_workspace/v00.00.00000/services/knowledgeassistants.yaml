      type: object
      properties:
        display_name:
          type: string
          description: >-
            The display name of the Knowledge Assistant, unique at workspace
            level. Required when creating a Knowledge Assistant. When updating a
            Knowledge Assistant, optional unless included in update_mask.
        description:
          type: string
          description: >-
            Description of what this agent can do (user-facing). Required when
            creating a Knowledge Assistant. When updating a Knowledge Assistant,
            optional unless included in update_mask.
        create_time:
          type: string
          format: date-time
          description: Creation timestamp.
        creator:
          type: string
          description: The creator of the Knowledge Assistant.
        endpoint_name:
          type: string
          description: The name of the knowledge assistant agent endpoint.
        error_info:
          type: string
          description: Error details when the Knowledge Assistant is in FAILED state.
        experiment_id:
          type: string
          description: The MLflow experiment ID.
        id:
          type: string
          description: 'Deprecated: use knowledge_assistant_id instead.'
        instructions:
          type: string
          description: >-
            Additional global instructions on how the agent should generate
            answers. Optional on create and update. When updating a Knowledge
            Assistant, include this field in update_mask to modify it.
        name:
          type: string
          description: >-
            The resource name of the Knowledge Assistant. Format:
