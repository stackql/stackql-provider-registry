openapi: 3.1.0
info:
  title: NVIDIA Cloud Functions - Queues
  description: NVCF request queue details per function and version, and queue position per request (served from api.nvcf.nvidia.com).
  version: 2.261.2
paths:
  /v2/nvcf/queues/functions/{function_id}:
    get:
      description: 'Provides details of all the queues associated with the specified function.  If a function has multiple versions and they are all deployed, then the  response includes details of all the queues. If the specified function  is public, then Account Admin cannot perform this operation. Requires a bearer token or an api-key with ''queue_details'' scope in the HTTP  Authorization header. '
      operationId: getQueuesDetails_1
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQueuesResponse'
          description: OK
      summary: Queue Details
      tags:
        - Queue Details
  /v2/nvcf/queues/functions/{function_id}/versions/{version_id}:
    get:
      description: 'Provides details of all the queues associated with the specified function.  If a function has multiple versions and they are all deployed, then the  response includes details of all the queues. If the specified function  is public, then Account Admin cannot perform this operation. Requires a bearer token or an api-key with ''queue_details'' scope in the HTTP  Authorization header. '
      operationId: getQueuesDetails
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version id
          in: path
          name: version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQueuesResponse'
          description: OK
      summary: Queue Details
      tags:
        - Queue Details
  /v2/nvcf/queues/{request_id}/position:
    get:
      description: 'Using the specified function invocation request id, returns the estimated  position of the corresponding message up to 1000 in the queue. Requires a bearer token or an api-key with ''queue_details'' scope in the HTTP  Authorization header. '
      operationId: getPositionInQueue
      parameters:
        - description: Function invocation request id
          in: path
          name: request_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPositionInQueueResponse'
          description: OK
      summary: Queue Position
      tags:
        - Queue Details
components:
  schemas:
    GetQueuesResponse:
      description: Request queue details of all the functions with same id in an account
      properties:
        functionId:
          description: Function id
          format: uuid
          maxLength: 36
          minLength: 36
          type: string
        queues:
          description: Details of all the queues associated with same named functions
          items:
            $ref: '#/components/schemas/QueueDto'
          maxItems: 2147483647
          minItems: 0
          type: array
      required:
        - functionId
        - queues
      type: object
    GetPositionInQueueResponse:
      description: Request position in queue for invocation request
      properties:
        functionId:
          description: Function id
          format: uuid
          maxLength: 36
          minLength: 36
          type: string
        functionVersionId:
          description: Function version id
          format: uuid
          maxLength: 36
          minLength: 36
          type: string
        positionInQueue:
          description: Position of request in queue
          format: int32
          maximum: 2147483647
          minimum: -2147483648
          type: integer
      required:
        - functionId
        - functionVersionId
      type: object
    QueueDto:
      description: Data Transfer Object(DTO) representing a request queue for function version
      properties:
        functionName:
          description: Function name
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
        functionStatus:
          description: Function status
          enum:
            - ACTIVE
            - DEPLOYING
            - ERROR
            - INACTIVE
            - DELETED
            - DEGRADED
            - DEGRADING
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
        functionVersionId:
          description: Function version id
          format: uuid
          maxLength: 36
          minLength: 36
          type: string
        queueDepth:
          description: Approximate number of messages in the request queue
          format: int32
          maximum: 2147483647
          minimum: -2147483648
          type: integer
      required:
        - functionName
        - functionStatus
        - functionVersionId
      type: object
  x-stackQL-resources:
    queues:
      id: nvidia.nvcf_queues.queues
      name: queues
      title: Queues
      methods:
        list:
          operation:
            $ref: '#/paths/~1v2~1nvcf~1queues~1functions~1{function_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.queues
          request:
            nativeCasing: camel
        list_version:
          operation:
            $ref: '#/paths/~1v2~1nvcf~1queues~1functions~1{function_id}~1versions~1{version_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.queues
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/queues/methods/list_version'
          - $ref: '#/components/x-stackQL-resources/queues/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    queue_positions:
      id: nvidia.nvcf_queues.queue_positions
      name: queue_positions
      title: Queue Positions
      methods:
        get:
          operation:
            $ref: '#/paths/~1v2~1nvcf~1queues~1{request_id}~1position/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/queue_positions/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.nvcf.nvidia.com
