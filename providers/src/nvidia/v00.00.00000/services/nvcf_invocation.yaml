  /v2/nvcf/pexec/status/{request_id}:
    get:
      deprecated: true
      description: 'Deprecated and will be removed soon. Please use the new NVCF Invocation API  endpoint to invoke a function and stream results without polling.  Retrieves the status of an in-progress or pending request using its unique  invocation request ID. If the result is available, it will be included in  the response, marking the request as fulfilled. Conversely, if the result is  not yet available, the request is deemed pending. Access to this endpoint  mandates inclusion of a bearer token with ''invoke_function'' scope in the  HTTP Authorization header. In-progress responses are returned in order. If no in-progress response is received  during polling you will receive the most recent in-progress response. Only the first  256 unread in-progress messages are kept. '
      operationId: getFunctionInvocationResult
      parameters:
        - description: Invocation Request Id
          in: path
          name: request_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
