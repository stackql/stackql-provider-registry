openapi: 3.1.0
info:
  title: NVIDIA Cloud Functions - Invocation
  description: NVCF HTTP-polling invocation (pexec and status), assets and invocation assertion tokens (served from api.nvcf.nvidia.com).
  version: 2.261.2
paths:
  /v2/nvcf/assets:
    get:
      deprecated: true
      description: 'List assets owned by the current NVIDIA Cloud Account. Requires a  bearer token with ''invoke_function'' scope in the HTTP Authorization header. '
      operationId: getAssets
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetsResponse'
          description: OK
      summary: List Assets
      tags:
        - Asset Management
      parameters: []
    post:
      deprecated: true
      description: 'Creates a unique id representing an asset and a pre-signed URL to upload the  asset artifact to AWS S3 bucket for the NVIDIA Cloud Account. Requires a  bearer token  with ''invoke_function'' scope in the HTTP Authorization header. '
      operationId: createAsset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAssetResponse'
          description: OK
      summary: Create Asset
      tags:
        - Asset Management
      parameters: []
  /v2/nvcf/assets/{asset_id}:
    get:
      deprecated: true
      description: 'Returns details for the specified asset-id belonging to the current NVIDIA  Cloud Account. Requires a bearer token with ''invoke_function'' scope in  the HTTP Authorization header. '
      operationId: getAsset
      parameters:
        - description: Asset id
          in: path
          name: asset_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
          description: OK
      summary: Show Asset Details
      tags:
        - Asset Management
    delete:
      deprecated: true
      description: 'Deletes asset belonging to the current NVIDIA Cloud Account. Requires  a bearer token with ''invoke_function'' scope in the HTTP Authorization header. '
      operationId: deleteAsset
      parameters:
        - description: Id of the asset to be deleted
          in: path
          name: asset_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '204':
          description: No Content
      summary: Delete Asset
      tags:
        - Asset Management
  /v2/nvcf/pexec/functions/{function_id}:
    post:
      deprecated: true
      description: 'Deprecated and will be removed soon. Please use the new NVCF Invocation API  endpoint to invoke a function.  Invokes the specified function that was successfully deployed. If the version  is not specified, any active function versions will handle the request. If  the version is specified in the URI, then the request is exclusively processed  by the designated version of the function. By default, this endpoint will block  for 5 seconds. If the request is not fulfilled before the timeout, it''s status  is considered in-progress or pending and the response includes HTTP status code  202 with an invocation request ID, indicating that the client should commence  polling for the result using the invocation request ID. Access to this endpoint  mandates inclusion of a bearer token with ''invoke_function'' scope in the  HTTP Authorization header. Additionally, this endpoint has the capability to  provide updates on the progress of the request, contingent upon the workload''s  provision of such information. In-progress responses are returned in order. If no in-progress response is received  during polling you will receive the most recent in-progress response. Only the first  256 unread in-progress messages are kept. '
      operationId: invokeFunction
      parameters:
        - in: header
          name: NVCF-INPUT-ASSET-REFERENCES
          required: false
          schema:
            items:
              format: UTF-8
              maxLength: 262144
              minLength: 0
              type: string
            maxItems: 2147483647
            minItems: 0
            type: array
            nullable: true
        - in: header
          name: NVCF-POLL-SECONDS
          required: false
          schema:
            format: int32
            maximum: 300
            minimum: 0
            type: integer
            nullable: true
        - in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StackqlJsonBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  char:
                    type: string
                  direct:
                    type: boolean
                  double:
                    format: double
                    type: number
                  float:
                    format: float
                    type: number
                  int:
                    format: int32
                    type: integer
                  long:
                    format: int64
                    type: integer
                  readOnly:
                    type: boolean
                  short:
                    format: int32
                    type: integer
                type: object
          description: Invocation is fulfilled
          headers:
            NVCF-PERCENT-COMPLETE:
              description: Percentage complete
              schema:
                type: string
              style: simple
            NVCF-REQID:
              description: Invocation Request Id
              schema:
                type: string
              style: simple
            NVCF-STATUS:
              description: Invocation status
              schema:
                type: string
              style: simple
        '202':
          content:
            application/json:
              schema:
                properties:
                  char:
                    type: string
                  direct:
                    type: boolean
                  double:
                    format: double
                    type: number
                  float:
                    format: float
                    type: number
                  int:
                    format: int32
                    type: integer
                  long:
                    format: int64
                    type: integer
                  readOnly:
                    type: boolean
                  short:
                    format: int32
                    type: integer
                type: object
          description: Result is pending. Client should poll using the requestId.
          headers:
            NVCF-PERCENT-COMPLETE:
              description: Percentage complete
              schema:
                type: string
              style: simple
            NVCF-REQID:
              description: Invocation Request Id
              schema:
                type: string
              style: simple
            NVCF-STATUS:
              description: Invocation status
              schema:
                type: string
              style: simple
        '302':
          description: |
            Client should use the URL specified in the 'Location' response header to fetch
             large result.
          headers:
            Location:
              description: URL to get the result
              schema:
                type: string
              style: simple
            NVCF-PERCENT-COMPLETE:
              description: Percentage complete
              schema:
                type: string
              style: simple
            NVCF-REQID:
              description: Invocation Request Id
              schema:
                type: string
              style: simple
            NVCF-STATUS:
              description: Invocation status
              schema:
                type: string
              style: simple
        '402':
          content:
            application/json:
              schema:
                properties:
                  char:
                    type: string
                  direct:
                    type: boolean
                  double:
                    format: double
                    type: number
                  float:
                    format: float
                    type: number
                  int:
                    format: int32
                    type: integer
                  long:
                    format: int64
                    type: integer
                  readOnly:
                    type: boolean
                  short:
                    format: int32
                    type: integer
                type: object
          description: Cloud credits expired for public functions. Please contact NVIDIA representatives.
        '403':
          content:
            application/json:
              schema:
                properties:
                  char:
                    type: string
                  direct:
                    type: boolean
                  double:
                    format: double
                    type: number
                  float:
                    format: float
                    type: number
                  int:
                    format: int32
                    type: integer
                  long:
                    format: int64
                    type: integer
                  readOnly:
                    type: boolean
                  short:
                    format: int32
                    type: integer
                type: object
          description: |
            Either missing scope in the auth(JWT / ApiKey) token and/or missing resource entry
             in the ApiKey for the function.
        '429':
          content:
            application/json:
              schema:
                properties:
                  char:
                    type: string
                  direct:
                    type: boolean
                  double:
                    format: double
                    type: number
                  float:
                    format: float
                    type: number
                  int:
                    format: int32
                    type: integer
                  long:
                    format: int64
                    type: integer
                  readOnly:
                    type: boolean
                  short:
                    format: int32
                    type: integer
                type: object
          description: Client is doing too many requests per second and should slow down request rate.
      summary: Call Function
      tags:
        - Function Invocation
