components:
  schemas:
    ListAssetsResponse:
      description: Response body containing list of assets of the current nca id
      properties:
        assets:
          description: List of assets uploaded for the nca id
          items:
            $ref: '#/components/schemas/AssetDto'
          maxItems: 2147483647
          minItems: 0
          type: array
      required:
        - assets
      type: object
    CreateAssetRequest:
      description: Request payload to create an asset-id and the corresponding pre-signed URL to upload an asset of specified content-type to AWS S3 bucket.
      properties:
        contentType:
          description: Content type of the asset such image/png, image/jpeg, etc.
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
        description:
          description: Asset description
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
      required:
        - contentType
        - description
      type: object
    CreateAssetResponse:
      description: Response body containing asset-id and the corresponding pre-signed URL to upload an asset of specified content-type to AWS S3 bucket.
      properties:
        assetId:
          description: Unique id of the asset to be uploaded to AWS S3 bucket
          format: uuid
          maxLength: 36
          minLength: 36
          type: string
        contentType:
          description: Content type of the asset such image/png, image/jpeg, etc.
          format: UTF-8
          maxLength: 262144
          minLength: 1
          type: string
        description:
          description: Asset description to be used when uploading the asset
          format: UTF-8
          maxLength: 262144
          minLength: 1
          type: string
        uploadUrl:
          description: Pre-signed upload URL to upload asset
          format: url
          type: string
      required:
        - assetId
        - contentType
        - description
        - uploadUrl
      type: object
    AssetResponse:
      properties:
        asset:
          $ref: '#/components/schemas/AssetDto'
      required:
        - asset
      type: object
    MultiFunctionsInvocationTokenRequest:
      description: Request body for issuing a function invocation token
      properties:
        clientId:
          description: ClientId for client to pass in to track who will eventually use the token
          format: UTF-8
          maxLength: 262144
          minLength: 1
          type: string
        functions:
          description: Functions to invoke
          items:
            $ref: '#/components/schemas/BasicFunctionDto'
          maxItems: 4
          minItems: 0
          type: array
      required:
        - clientId
        - functions
      type: object
    InvocationTokenResponse:
      description: Function invocation token response
      properties:
        access_token:
          description: Token issued by Notary Service
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
        expires_in:
          description: Token expiration time in seconds
          format: int32
          maximum: 2147483647
          minimum: -2147483648
          type: integer
      type: object
    InvocationTokenRequest:
      description: Request body for issuing a function invocation token
      properties:
        clientId:
          description: ClientId for client to pass in to track who will eventually use the token
          format: UTF-8
          maxLength: 262144
