openapi: 3.1.0
info:
  title: NVIDIA Cloud Functions - Deployments
  description: 'NVCF deployments and GPU specifications, cluster groups and GPU inventory, registry credentials and telemetry endpoints (source: the published NVCF OpenAPI specification; served from api.ngc.nvidia.com).'
  version: 2.261.2
paths:
  /v2/nvcf/clusterGroups:
    get:
      deprecated: true
      description: 'Lists Cluster Groups for the current account. The response includes cluster  groups defined specifically in the current account and publicly available  cluster groups such as GFN, OCI, etc. Requires a bearer token with ''list_cluster_groups'' scope in HTTP Authorization header. '
      operationId: getClusterGroups
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterGroupsResponse'
          description: OK
      summary: List Cluster Groups
      tags:
        - Cluster Groups and GPUs
      parameters: []
  /v2/nvcf/deployments/functions/{function_id}/versions/{function_version_id}:
    get:
      description: 'Allows Account Admins to retrieve the deployment details of the specified  function version. Access to this endpoint mandates a bearer token with ''deploy_function'' scope in the  HTTP Authorization header. '
      operationId: getFunctionDeployment
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version id
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
          description: OK
      summary: Get Function Deployment Details
      tags:
        - Function Deployment
    post:
      description: 'Initiates deployment for the specified function version. Upon invocation of  this endpoint, the function''s status transitions to ''DEPLOYING''. If the  specified function version is public, then Account Admin cannot perform this  operation. Access to this endpoint mandates a bearer token with ''deploy_function'' scope in the  HTTP Authorization header. '
      operationId: createFunctionDeployment
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version id
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionDeploymentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
          description: OK
      summary: Deploy Function
      tags:
        - Function Deployment
    put:
      deprecated: true
      description: ' Deprecated and will be removed soon. Use a single GPU specification update  method instead.  Updates the deployment specs of the specified function version. It''s important  to note that GPU type and backend configurations cannot be modified through  this endpoint. If the specified function is public, then Account Admin cannot  perform this operation. Access to this endpoint mandates a bearer token with ''deploy_function'' scope in the  HTTP Authorization header. '
      operationId: updateFunctionDeployment
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version id
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionDeploymentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
          description: OK
      summary: Update Function Deployment
      tags:
        - Function Deployment
    delete:
      description: 'Deletes the deployment associated with the specified function. Upon  deletion, any active instances will be terminated, and the function''s status  will transition to ''INACTIVE''. To undeploy a function version gracefully,  specify ''graceful=true'' query parameter, allowing current tasks to complete  before terminating the instances. If the specified function version is public,  then Account Admin cannot perform this operation. Access to this endpoint mandates a bearer token with ''deploy_function'' scope in the  HTTP Authorization header. '
      operationId: deleteFunctionDeployment
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version id
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Query param to deactivate function for graceful shutdown
          in: query
          name: graceful
          required: false
          schema:
            default: false
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
          description: OK
      summary: Delete Function Deployment
      tags:
        - Function Deployment
  /v2/nvcf/deployments/{deployment_id}:
    get:
      description: 'Allows Account Admins to retrieve the deployment details of the specified  deployment id. Access to this endpoint mandates a bearer token with ''deploy_function'' scope in the  HTTP Authorization header. '
      operationId: getFunctionDeployment_1
      parameters:
        - description: Deployment id
          in: path
          name: deployment_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
          description: OK
      summary: Get Function Deployment Details
      tags:
        - Function Deployment
  /v2/nvcf/deployments/{deployment_id}/gpu-specifications/{gpu_spec_id}:
    patch:
      description: ' Updates the GPU specification of the specified function version''s deployment.  It''s important to note that GPU type and backend configurations cannot be  modified through this endpoint. If the specified function is public,  then Account Admin cannot perform this operation. Access to this endpoint mandates a bearer token with ''deploy_function'' scope in the  HTTP Authorization header. '
      operationId: updateGpuSpecification
      parameters:
        - description: Deployment id
          in: path
          name: deployment_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: GPU Specification id
          in: path
          name: gpu_spec_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGpuSpecificationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGpuSpecificationResponse'
          description: OK
      summary: Update the specified GPU specification under the specified deployment
      tags:
        - Function Deployment
  /v2/nvcf/recognized-registries:
    get:
      description: 'Lists all the registries that are recognized by NVCF. Only when a registry  is recognized by NVCF that the users can add its credential to their account  and then use it to create functions. Requires a bearer token in the HTTP Authorization header with ''manage_registries'' scope. '
      operationId: getRecognizedRegistries
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognizedRegistriesResponse'
          description: OK
      summary: List Recognized Registries
      tags:
        - Registry Credential Management
      parameters: []
  /v2/nvcf/registry-credentials:
    get:
      description: 'Lists all the registry credentials associated with the authenticated  NVIDIA Cloud Account. Requires a bearer token in the HTTP Authorization header with ''manage_registries'' scope. '
      operationId: listRegistryCredentialDetails
      parameters:
        - description: |
            Filters registry credentials using the specified 'artifactType' query param.
          in: query
          name: artifactType
          required: false
          schema:
            default:
              - CONTAINER
              - HELM
              - MODEL
              - RESOURCE
            items:
              enum:
                - CONTAINER
                - HELM
                - MODEL
                - RESOURCE
              format: UTF-8
              maxLength: 262144
              minLength: 0
              type: string
            maxItems: 2147483647
            minItems: 0
            type: array
            uniqueItems: true
        - description: |
            Filters registry credentials using the specified 'provisionedBy' query param.
          in: query
          name: provisionedBy
          required: false
          schema:
            default:
              - SYSTEM
              - USER
            items:
              enum:
                - SYSTEM
                - USER
              format: UTF-8
              maxLength: 262144
              minLength: 0
              type: string
            maxItems: 2147483647
            minItems: 0
            type: array
            uniqueItems: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRegistryCredentialDetailsResponse'
          description: OK
      summary: List Registry Credentials
      tags:
        - Registry Credential Management
    post:
      description: 'Adds a new registry credential to the account. Requires a bearer token in the HTTP Authorization header with ''manage_registries'' scope. '
      operationId: addRegistryCredential
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRegistryCredentialRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialDetailsResponse'
          description: OK
      summary: Add new registry credential to the account
      tags:
        - Registry Credential Management
      parameters: []
  /v2/nvcf/registry-credentials/{registry_credential_id}:
    get:
      description: 'Retrieves detailed information of the specified registry credential  associated with the authenticated NVIDIA Cloud Account. Requires a bearer token in the HTTP Authorization header with ''manage_registries'' scope. '
      operationId: getRegistryCredentialDetails
      parameters:
        - description: Registry Credential id
          in: path
          name: registry_credential_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialDetailsResponse'
          description: OK
      summary: Get Registry Credential Details
      tags:
        - Registry Credential Management
    patch:
      description: 'Updates the secret and/or the artifact types associated with the specified  registry credential. Artifact types specified in the request body are  added to the set of artifact types that already exist for the specified  registry credential. Requires a bearer token in the HTTP Authorization header with ''manage_registries'' scope. '
      operationId: updateRegistryCredential
      parameters:
        - description: Registry Credential id
          in: path
          name: registry_credential_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRegistryCredentialRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialDetailsResponse'
          description: OK
      summary: Update registry credential
      tags:
        - Registry Credential Management
    delete:
      description: 'Deletes the specified registry credential associated with the authenticated  NVIDIA Cloud Account. Requires a bearer token in the HTTP Authorization header with ''manage_registries'' scope. '
      operationId: deleteRegistryCredential
      parameters:
        - description: Registry Credential id
          in: path
          name: registry_credential_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '204':
          description: No Content
      summary: Delete Registry Credential
      tags:
        - Registry Credential Management
  /v2/nvcf/secrets/telemetries/{telemetry_id}:
    put:
      description: 'Updates secret for the specific telemetry Id within NVIDIA Cloud Account. This endpoint requires a bearer token with ''update_secrets'' scope in the HTTP Authorization header. '
      operationId: updateTelemetrySecret
      parameters:
        - description: NVIDIA Cloud Account Id
          in: path
          name: telemetry_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTelemetrySecretRequest'
        required: true
      responses:
        '204':
          description: No Content
      summary: Update secret for a specific Telemetry Id
      tags:
        - User Secret Management
  /v2/nvcf/telemetries:
    get:
      description: 'Retrieves telemetry configurations for a specific NVIDIA Cloud Account.  requires a bearer token with ''manage_telemetries'' scope in the HTTP  Authorization header. '
      operationId: getTelemetriesByAccount
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTelemetryResponse'
          description: OK
      summary: List Telemetries
      tags:
        - Telemetry Management
      parameters: []
    post:
      description: 'Creates telemetry endpoints for NVIDIA Cloud Accounts.  requires a bearer token with ''manage_telemetries'' scope in the HTTP  Authorization header. '
      operationId: createTelemetry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
          description: OK
      summary: Create Telemetry
      tags:
        - Telemetry Management
      parameters: []
  /v2/nvcf/telemetries/{telemetry_id}:
    get:
      description: 'Retrieves the details of a specific telemetry configuration by its ID.  requires a bearer token with ''manage_telemetries'' scope in the HTTP  Authorization header. '
      operationId: getTelemetry
      parameters:
        - in: path
          name: telemetry_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
          description: OK
      summary: Get Telemetry Details
      tags:
        - Telemetry Management
    delete:
      description: 'Deletes a specific telemetry configuration for a NVIDIA Cloud Account.  requires a bearer token with ''manage_telemetries'' scope in the HTTP  Authorization header. If there any functions that are dependent on the  Telemetry that is being deleted, then response with 400 status code will  be returned. '
      operationId: deleteTelemetry
      parameters:
        - in: path
          name: telemetry_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Cannot be deleted till Functions depend on it
      summary: Delete Telemetry
      tags:
        - Telemetry Management
components:
  schemas:
    ClusterGroupsResponse:
      properties:
        clusterGroups:
          items:
            $ref: '#/components/schemas/ClusterGroup'
          maxItems: 2147483647
          minItems: 0
          type: array
      type: object
    FunctionResponse:
      description: Response body with function details
      properties:
        function:
          $ref: '#/components/schemas/FunctionDto'
          description: Function details
      required:
        - function
      type: object
    DeploymentResponse:
      description: Function Deployment Response
      properties:
        deployment:
          $ref: '#/components/schemas/FunctionDeploymentDto'
          description: Deployment details
      required:
        - deployment
      type: object
    FunctionDeploymentRequest:
      description: Request to deploy a function
      properties:
        deploymentSpecifications:
          description: GPU specs with GPU, instance-type, clusters etc. details
          items:
            $ref: '#/components/schemas/GpuSpecificationDto'
          maxItems: 2147483647
          minItems: 1
          type: array
      required:
        - deploymentSpecifications
      type: object
    UpdateFunctionDeploymentRequest:
      description: Request to update function deployment spec
      properties:
        deploymentSpecifications:
          description: Deployment specs with GPU, instance-type, etc. details for update request
          items:
            $ref: '#/components/schemas/UpdateGpuSpecificationDto'
          maxItems: 2147483647
          minItems: 1
          type: array
      required:
        - deploymentSpecifications
      type: object
    UpdateGpuSpecificationRequest:
      description: Request to update single function deployment GPU Specification
      properties:
        autoscalingConfiguration:
          $ref: '#/components/schemas/AutoscalingConfigurationDto'
          description: Customizable Autoscaling configuration
        autoscalingConfigurationPolicy:
          description: 'Autoscaling configuration policy. CUSTOM_CONFIGURATION (default): use the provided autoscalingConfig. PLATFORM_CONFIGURATION: remove custom config and use platform defaults.'
          enum:
            - CUSTOM_CONFIGURATION
            - PLATFORM_CONFIGURATION
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
          nullable: true
        maxInstances:
          description: Maximum number of instances for the deployment
          format: int32
          maximum: 2147483647
          minimum: 0
          type: integer
          nullable: true
        minInstances:
          description: Minimum number of instances for the deployment
          format: int32
          maximum: 2147483647
          minimum: 0
          type: integer
          nullable: true
      type: object
    UpdateGpuSpecificationResponse:
      description: Update GPU Specification Response
      properties:
        gpuSpecification:
          $ref: '#/components/schemas/GpuSpecificationDto'
          description: GPU Specification details
      required:
        - gpuSpecification
      type: object
    RecognizedRegistriesResponse:
      description: Response body for recognized registries endpoint
      properties:
        recognizedRegistries:
          additionalProperties:
            items:
              additionalProperties:
                type: string
              type: object
            type: array
          description: Recognized registries
          type: object
      type: object
    ListRegistryCredentialDetailsResponse:
      description: Response body containing list of registry credentials
      properties:
        registryCredentials:
          description: List of registry credentials
          items:
            $ref: '#/components/schemas/RegistryCredentialDetailsDto'
          maxItems: 2147483647
          minItems: 0
          type: array
      required:
        - registryCredentials
      type: object
    AddRegistryCredentialRequest:
      description: Request body to add a registry credential to an account
      properties:
        artifactTypes:
          description: Artifact types that can be retrieved using this credential
          items:
            enum:
              - CONTAINER
              - HELM
              - MODEL
              - RESOURCE
            type: string
          maxItems: 2147483647
          minItems: 1
          type: array
          uniqueItems: true
        description:
          description: Optional registry credential description
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
          nullable: true
        registryHostname:
          description: Registry hostname
          format: UTF-8
          maxLength: 255
          minLength: 1
          pattern: (?=^.{4,253}$)(^((?!-)[a-zA-Z0-9-]{1,63}(?<!-)\.)+[a-zA-Z0-9]{2,63}$)
          type: string
        secret:
          $ref: '#/components/schemas/SecretDto'
          description: Registry credential - secret value must be base64 encoded string in username:password format
        tags:
          description: Optional set of tags
          items:
            pattern: '[a-zA-Z0-9\-_:=]+'
            type: string
          maxItems: 64
          minItems: 0
          type: array
          uniqueItems: true
          nullable: true
      required:
        - artifactTypes
        - registryHostname
        - secret
      type: object
    RegistryCredentialDetailsResponse:
      description: Response body for Registry Credential operations
      properties:
        registryCredential:
          $ref: '#/components/schemas/RegistryCredentialDetailsDto'
          description: Registry credential details
      required:
        - registryCredential
      type: object
    UpdateRegistryCredentialRequest:
      description: Request body to update registry credential
      properties:
        artifactTypeEnums:
          description: Optional artifact types to be added to the existing ones
          items:
            enum:
              - CONTAINER
              - HELM
              - MODEL
              - RESOURCE
            type: string
          maxItems: 2147483647
          minItems: 0
          type: array
          uniqueItems: true
          nullable: true
        secret:
          $ref: '#/components/schemas/SecretDto'
          description: Registry credential - secret value must be base64 encoded string in username:password format
      type: object
    UpdateTelemetrySecretRequest:
      description: Request payload to update secret
      properties:
        secret:
          $ref: '#/components/schemas/SecretDto'
          description: Telemetry secret
      required:
        - secret
      type: object
    ListTelemetryResponse:
      description: Response containing a list of telemetry configurations.
      properties:
        telemetries:
          description: List of telemetry configurations.
          items:
            $ref: '#/components/schemas/TelemetryDto'
          maxItems: 2147483647
          minItems: 0
          type: array
      type: object
    TelemetryRequest:
      description: Data Transfer Object (DTO) representing a telemetry request
      properties:
        endpoint:
          description: Telemetry endpoint URL
          format: UTF-8
          maxLength: 262144
          minLength: 1
          type: string
        protocol:
          description: Protocol used for communication
          enum:
            - HTTP
            - GRPC
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
        provider:
          description: Telemetry provider
          enum:
            - PROMETHEUS
            - GRAFANA_CLOUD
            - SPLUNK
            - DATADOG
            - SERVICENOW
            - KRATOS
            - KRATOS_THANOS
            - TIMESTREAM
            - VICTORIAMETRICS
            - AZURE_MONITOR
            - OTEL_COLLECTOR
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
        secret:
          $ref: '#/components/schemas/SecretDto'
          description: Single secret associated with the telemetry configuration
        types:
          description: Set of telemetry data types
          items:
            enum:
              - LOGS
              - METRICS
              - TRACES
            type: string
          maxItems: 2147483647
          minItems: 1
          type: array
          uniqueItems: true
      required:
        - endpoint
        - protocol
        - provider
        - secret
        - types
      type: object
    TelemetryResponse:
      description: Data Transfer Object (DTO) representing a telemetry response
      properties:
        telemetry:
          $ref: '#/components/schemas/TelemetryDto'
          description: Telemetry details
      type: object
    ClusterGroup:
      properties:
        authorizedNcaIds:
          items:
            type: string
          maxItems: 2147483647
          minItems: 0
          type: array
        clusters:
          items:
            $ref: '#/components/schemas/Cluster'
          maxItems: 2147483647
          minItems: 0
          type: array
        gpus:
          items:
            $ref: '#/components/schemas/Gpu'
          maxItems: 2147483647
          minItems: 0
          type: array
        id:
          format: uuid
          maxLength: 36
          minLength: 36
          type: string
        name:
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
        ncaId:
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
      type: object
    FunctionDto:
      description: Data Transfer Object (DTO) representing a function
      properties:
        activeInstances:
          description: List of active instances for this function.
          items:
            $ref: '#/components/schemas/InstanceDto'
          maxItems: 2147483647
          minItems: 0
          type: array
          nullable: true
        apiBodyFormat:
          description: Invocation request body format
          enum:
            - PREDICT_V2
            - CUSTOM
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
          nullable: true
        containerArgs:
          description: Args used to launch the container
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
          nullable: true
        containerEnvironment:
          description: Environment settings used to launch the container
          items:
            $ref: '#/components/schemas/ContainerEnvironmentEntryDto'
          maxItems: 2147483647
          minItems: 0
          type: array
          nullable: true
        containerImage:
          description: Optional custom container
          format: uri
          type: string
          nullable: true
        createdAt:
          description: Function creation timestamp
          format: date-time
          maxLength: 30
          minLength: 8
          type: string
        description:
          description: Function/version description
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
          nullable: true
        functionType:
          description: Used to indicate a STREAMING function. Defaults to DEFAULT.
          enum:
            - DEFAULT
            - STREAMING
            - LLM
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
        health:
          $ref: '#/components/schemas/HealthDto'
          description: Function health configuration
        healthUri:
          deprecated: true
          description: Health endpoint for the container or helmChart. Deprecated, use health.uri instead.
          format: uri
          type: string
        helmChart:
          description: Optional Helm Chart
          format: uri
          type: string
          nullable: true
        helmChartServiceName:
          description: |
            Helm Chart Service Name specified only when helmChart property is specified
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
          nullable: true
        id:
          description: Unique function id
          format: uuid
          maxLength: 36
          minLength: 36
          type: string
        inferencePort:
          description: Optional port number where the inference listener is running - defaults to 8000 for Triton
          format: int32
          maximum: 2147483647
