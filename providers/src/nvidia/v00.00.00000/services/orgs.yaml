components:
  schemas:
    UserRoleDefinitionsResponse:
      description: Response containing all the roles defined in NGC and their allowed actions
      properties:
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
        roles:
          description: List of roles
          items:
            $ref: '#/components/schemas/UserRoleDefinition'
          type: array
      type: object
    ErrorResponse:
      properties:
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
      type: object
    UserResponse:
      description: ' about one user'
      properties:
        activationToken:
          description: token needed to activate the user to enable login and other features
          type: string
        ncaRole:
          description: NCA role
          enum:
            - UNKNOWN
            - ADMINISTRATOR
            - MEMBER
            - OWNER
            - PENDING
          type: string
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
        user:
          $ref: '#/components/schemas/User'
        userRoles:
          description: DEPRECATED - Please use roles inside user
          items:
            $ref: '#/components/schemas/UserRole'
          type: array
      type: object
    SearchParams:
      properties:
        fields:
          items:
            type: string
          type: array
        filters:
          items:
            $ref: '#/components/schemas/SearchParamFilter'
          type: array
        groupBy:
          type: string
        orderBy:
          items:
            $ref: '#/components/schemas/SearchParamOrderBy'
          type: array
        page:
          format: int64
          type: integer
        pageSize:
          format: int64
          type: integer
        query:
          type: string
        queryFields:
          items:
            type: string
          type: array
        scoredSize:
          format: int64
          type: integer
      type: object
    UserListResponse:
      description: Response for List User reponse
      properties:
        paginationInfo:
          $ref: '#/components/schemas/PaginationInfo'
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
        users:
          description: information about the user
          items:
            $ref: '#/components/schemas/User'
          type: array
      type: object
    UserCreateRequest:
      description: object used request user creation in an existing org
      properties:
        email:
          description: Email address of the user. This should be unique.
          maxLength: 128
          minLength: 6
          type: string
        emailOptIn:
          description: indicates if user has opt in to nvidia emails
          type: boolean
        eulaAccepted:
          description: indicates if user has accepted EULA
          type: boolean
        name:
          description: user name
          maxLength: 64
          minLength: 1
          type: string
        roleType:
          description: DEPRECATED - use roleTypes which allows multiple roles
          type: string
        roleTypes:
          description: feature roles to give to the user
          items:
            description: feature roles to give to the user
            type: string
          type: array
        salesforceContactJobRole:
          description: user job role
          type: string
        userMetadata:
          $ref: '#/components/schemas/UserMetadata'
      required:
        - email
      type: object
    UserInvitationListResponse:
      description: Response for a list of user invitations.
      properties:
        invitations:
          description: List of invitations.
          items:
            $ref: '#/components/schemas/UserInvitation'
          type: array
        paginationInfo:
          $ref: '#/components/schemas/PaginationInfo'
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
      type: object
    Response:
      properties:
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
      type: object
    TeamListResponse:
      description: listing of all teams
      properties:
        paginationInfo:
          $ref: '#/components/schemas/PaginationInfo'
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
        teams:
          items:
            $ref: '#/components/schemas/Team'
          type: array
      type: object
    TeamCreateRequest:
      description: Request to create new Team
      properties:
        description:
          description: description of the team
          maxLength: 255
          type: string
        name:
          description: team name
          maxLength: 19
          minLength: 2
          type: string
      required:
        - name
      type: object
    TeamCreateResponse:
      description: response to an team creation request, includes unique team id
      properties:
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
        team:
          $ref: '#/components/schemas/Team'
      type: object
    TeamResponse:
      description: details about one team
      properties:
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
        team:
          $ref: '#/components/schemas/Team'
      type: object
    TeamUpdateRequest:
      description: object used to update information about existing team
      properties:
        description:
          description: description of the team
          maxLength: 255
          type: string
        infinityManagerSettings:
          $ref: '#/components/schemas/InfinityManagerSettings'
        repoScanSettings:
          $ref: '#/components/schemas/RepoScanSettings'
      type: object
    OrgListResponse:
      description: List of organizations.
      properties:
        organizations:
          items:
            $ref: '#/components/schemas/Organization'
          type: array
        paginationInfo:
          $ref: '#/components/schemas/PaginationInfo'
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
      type: object
    OrgResponse:
      description: info about an organizations
      properties:
        organizations:
          $ref: '#/components/schemas/Organization'
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
      type: object
    OrgProfileUpdateRequest:
      description: Object used to update Org profile information
      properties:
        description:
          description: optional description of the organization
          maxLength: 128
          type: string
        displayName:
          description: Name of the organization that will be shown to users
          maxLength: 255
          minLength: 1
          type: string
      type: object
    UserUpdateRequest:
      description: object used to request user update
      properties:
        hasEmailOptIn:
          description: indicates if user has opt in to nvidia emails
          type: boolean
        hasSignedAODTEULA:
          description: indicates if user has accepted AODT End User License Agreement.
          type: boolean
        hasSignedAiFoundryPartnershipsEULA:
          description: indicates if user has accepted AI Foundry Partnerships End User License Agreement.
          type: boolean
        hasSignedBaseCommandEULA:
          description: indicates if user has accepted Base Command EULA
          type: boolean
        hasSignedBaseCommandManagerEULA:
          description: indicates if user has accepted Base Command Manager End User License Agreement.
          type: boolean
        hasSignedBioNeMoEULA:
          description: indicates if user has accepted BioNeMo End User License Agreement.
          type: boolean
        hasSignedContainerPublishingEULA:
          description: indicates if user has accepted container publishing eula
          type: boolean
        hasSignedCuOptEULA:
          description: indicates if user has accepted CuOpt End User License Agreement.
          type: boolean
        hasSignedEULA:
          description: indicates if user has accepted NGC EULA
          type: boolean
        hasSignedEarth2EULA:
          description: indicates if user has accepted Earth-2 End User License Agreement.
          type: boolean
        hasSignedEgxEULA:
          description: indicates if user has accepted EGX EULA
          type: boolean
        hasSignedFleetCommandEULA:
          description: indicates if user has accepted Fleet Command End User License Agreement.
          type: boolean
        hasSignedLlmEULA:
          description: indicates if user has accepted LLM End User License Agreement.
          type: boolean
        hasSignedNVAIEEULA:
          description: indicates if user has accepted Fleet Command End User License Agreement.
          type: boolean
        hasSignedNVQCEULA:
          description: indicates if user has accepted Nvidia Quantum Cloud End User License Agreement.
          type: boolean
        hasSignedNvidiaEULA:
          description: indicates if user has accepted NVIDIA EULA
          type: boolean
        hasSignedOmniverseEULA:
          description: indicates if user has accepted Omniverse End User License Agreement.
          type: boolean
        hasSignedPrivacyPolicy:
          description: indicates if the user has signed the Privacy Policy
          type: boolean
        hasSignedThirdPartyRegistryShareEULA:
          description: indicates if user has consented to share their registration info with other parties
          type: boolean
        name:
          description: user name
          maxLength: 64
          minLength: 1
          type: string
        userMetadata:
          $ref: '#/components/schemas/UserMetadata'
      type: object
    UserKeyResponse:
      description: response to a request to access key such as docker token
      properties:
        cloudNfsKey:
          type: string
        cloudNfsKeyPwd:
          type: string
        cloudNfsUserName:
          type: string
        key:
          maxLength: 255
          type: string
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
      required:
        - key
      type: object
    OrgCreateRequestV3:
      description: Request to create new Organization in v3 flow
      properties:
        country:
          description: user country
          type: string
        description:
          description: optional description of the organization
          maxLength: 128
          type: string
        displayName:
          description: Name of the organization that will be shown to users.
          maxLength: 255
          minLength: 1
          type: string
        initiator:
          description: Identify the initiator of the org request
          type: string
        isInternal:
          description: Is NVIDIA internal org or not
          type: boolean
        name:
          description: Organization name
          maxLength: 64
          minLength: 2
          type: string
        ncaId:
          description: NVIDIA Cloud Account Identifier
          type: string
        ncaNumber:
          description: NVIDIA Cloud Account Number
          type: string
        orgOwner:
          $ref: '#/components/schemas/OrgOwnerV3'
        pecName:
          description: product end customer name for enterprise(Fleet Command) product
          type: string
        pecSfdcId:
          description: product end customer salesforce.com Id (external customer Id) for enterprise(Fleet Command) product
          type: string
        productEnablements:
          items:
            $ref: '#/components/schemas/ProductEnablement'
          type: array
        productSubscriptions:
          description: This should be deprecated, use productEnablements instead
          items:
            $ref: '#/components/schemas/ProductSubscription'
          type: array
        protoOrgId:
          description: Proto org identifier
          type: string
        salesforceAccountIndustry:
          description: Company or organization industry
          type: string
        sendEmail:
          description: Send email to org owner or not. Default is true
          type: boolean
        type:
          enum:
            - UNKNOWN
            - CLOUD
            - ENTERPRISE
            - INDIVIDUAL
          type: string
      type: object
    OrgInvitationResponse:
      description: Invitation Validation Response.
      properties:
        orgInvitation:
          $ref: '#/components/schemas/OrgInvitation'
        requestStatus:
          $ref: '#/components/schemas/RequestStatus'
      type: object
    UserNcaInvitationRequest:
      description: NCA User invitation request
      properties:
        email:
          description: Is the user email
          maxLength: 128
          minLength: 7
          type: string
        invitationExpirationIn:
          description: Is the numbers of days the invitation will expire
          format: int32
          type: integer
        inviteAs:
          description: Nca allow users to be invited as Admin and as Member
          enum:
            - ADMIN
            - MEMBER
          type: string
        message:
          description: Is a message to the new user
          type: string
      type: object
    RequestStatus:
      properties:
        requestId:
          type: string
        serverId:
          type: string
        statusCode:
          description: Describes response status reported by the server.
          enum:
            - UNKNOWN
            - SUCCESS
            - UNAUTHORIZED
            - PAYMENT_REQUIRED
            - FORBIDDEN
            - TIMEOUT
            - EXISTS
            - NOT_FOUND
            - INTERNAL_ERROR
            - INVALID_REQUEST
            - INVALID_REQUEST_VERSION
            - INVALID_REQUEST_DATA
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - UNPROCESSABLE_ENTITY
            - TOO_MANY_REQUESTS
            - INSUFFICIENT_STORAGE
            - SERVICE_UNAVAILABLE
            - PAYLOAD_TOO_LARGE
            - NOT_ACCEPTABLE
            - UNAVAILABLE_FOR_LEGAL_REASONS
            - BAD_GATEWAY
            - PRECONDITION_FAILED
          type: string
        statusDescription:
          type: string
      type: object
    UserRoleDefinition:
      description: List of roles
      properties:
        allowedActions:
          description: List of actions that this role allows
          items:
            $ref: '#/components/schemas/ServiceAccess'
          type: array
        displayName:
          description: Display Name of the role
          type: string
        name:
          description: Name of the role
          type: string
        product:
          $ref: '#/components/schemas/RoleProduct'
