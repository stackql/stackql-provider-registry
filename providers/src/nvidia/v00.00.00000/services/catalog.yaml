              - PUBLISHER_DESC
              - BUILT_BY_ASC
              - BUILT_BY_DESC
              - RESOURCE_ID_ASC
              - RESOURCE_ID_DESC
            format: UTF-8
            maxLength: 262144
            minLength: 0
            type: string
        - description: Resolve labels
          in: query
          name: resolve-labels
          required: false
          schema:
            type: boolean
        - description: Remove unresolved labels
          in: query
          name: remove-unresolved-labels
          required: false
          schema:
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
