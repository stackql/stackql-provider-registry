openapi: 3.1.0
info:
  title: NVIDIA NGC Catalog
  description: 'The public NGC catalog: guest reads of models, resources, recipes, helm charts, collections and generic artifacts, plus the GPU and cloud service provider catalogs (no organization scope; public artifacts read without credentials).'
  version: 0.0.1-SNAPSHOT
paths:
  /v2/collections:
    get:
      description: List public collections
      operationId: listPublicCollections
      parameters:
        - description: Page size
          in: query
          name: page-size
          required: false
          schema:
            format: UTF-8
            maxLength: 262144
            maximum: 5000
            minLength: 0
            minimum: 1
            type: string
        - description: Page number - zero based index
          in: query
          name: page-number
          required: false
          schema:
            format: UTF-8
            maxLength: 262144
            maximum: 10000
            minLength: 0
            minimum: 0
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Not Found
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Internal Error
      summary: List public collections
      tags:
        - Collections
  /v2/collections/{org_name}/{collection_name}:
    get:
      description: Get collection details in org as guest
      operationId: getCollectionInOrgAsGuest
      parameters:
        - description: Organization name
          in: path
          name: org_name
          required: true
          schema:
            format: UTF-8
            maxLength: 255
            minLength: 0
            type: string
        - description: Collection name
          in: path
          name: collection_name
          required: true
          schema:
            format: UTF-8
            maxLength: 262144
            minLength: 0
            type: string
        - description: Resolve labels
          in: query
          name: resolve-labels
          required: false
          schema:
            type: boolean
        - description: Remove unresolved labels
          in: query
          name: remove-unresolved-labels
          required: false
          schema:
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Unauthorized
        '403':
          content:
            application/json:
