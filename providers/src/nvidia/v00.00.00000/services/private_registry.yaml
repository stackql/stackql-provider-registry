openapi: 3.1.0
info:
  title: NVIDIA NGC Private Registry
  description: 'Org-scoped artifact metadata in the NGC private registry: models, resources, recipes, generic artifacts (helm charts, endpoints, blueprints, agents, playbooks, APIs, skills), versions and files, collections, shares, deployment parameters, encryption keys and workflows. Team-scoped twins are mapped as *_by_team methods (source: the Private Artifacts (Models) API definition, responses from the ngcsdk data classes).'
  version: 0.0.1-SNAPSHOT
paths:
  /encryption-keys:
    get:
      description: List encryption keys in org
      operationId: listKeysInOrg
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyListResponse'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Not Found
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Internal Error
      summary: List encryption keys in org
      tags:
        - Encryption Keys
    servers:
      - url: https://api.ngc.nvidia.com/v2/artifact-registry/org/{org_name}
        variables:
          org_name:
            description: NGC organization name (the org id shown in the NGC console under Organization -> Setup, e.g. 0123456789ab). Resolved from the NGC_ORG environment variable when it is set (x-stackQL-envVar - the same variable the NVIDIA Terraform provider reads); otherwise it must be supplied on every org-scoped query as WHERE org_name = '<org>'. A WHERE value always takes precedence over the environment.
            x-stackQL-envVar: NGC_ORG
  /encryption-keys/{key_id}:
    get:
      description: List artifacts for encryption key in org
      operationId: listArtifactsForKeyInOrg
      parameters:
        - description: Key ID
          in: path
          name: key_id
          required: true
          schema:
            format: UTF-8
            maxLength: 255
            minLength: 0
            type: string
        - description: Artifact type
          in: query
          name: artifact-type
          required: false
          schema:
            default: MODEL
            enum:
              - MODEL
              - MODEL_SCRIPT
              - HELM_CHART
              - REPOSITORY
              - COLLECTION
              - ENDPOINT
              - BLUEPRINT
              - PLAYBOOK
              - AGENT
              - API
              - SKILL
            format: UTF-8
            maxLength: 262144
            minLength: 0
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyArtifactListResponse'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Not Found
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Internal Error
      summary: List artifacts for encryption key in org
      tags:
        - Encryption Keys
    delete:
      description: Revoke encryption key and disassociate from all artifacts in org
      operationId: deleteKeyFromOrg
      parameters:
        - description: Key ID
          in: path
          name: key_id
          required: true
          schema:
            format: UTF-8
            maxLength: 255
            minLength: 0
            type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatusUrlResponse'
          description: Accepted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Not Found
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Internal Error
      summary: Revoke encryption key in org
      tags:
        - Encryption Keys
    servers:
      - url: https://api.ngc.nvidia.com/v2/artifact-registry/org/{org_name}
        variables:
          org_name:
            description: NGC organization name (the org id shown in the NGC console under Organization -> Setup, e.g. 0123456789ab). Resolved from the NGC_ORG environment variable when it is set (x-stackQL-envVar - the same variable the NVIDIA Terraform provider reads); otherwise it must be supplied on every org-scoped query as WHERE org_name = '<org>'. A WHERE value always takes precedence over the environment.
            x-stackQL-envVar: NGC_ORG
