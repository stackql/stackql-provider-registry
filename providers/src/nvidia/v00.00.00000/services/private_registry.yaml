        - description: Page size
          in: query
          name: page-size
          required: false
          schema:
            format: UTF-8
            maxLength: 262144
            maximum: 5000
            minLength: 0
            minimum: 1
            type: string
        - description: Page number - zero based index
          in: query
          name: page-number
          required: false
          schema:
            format: UTF-8
            maxLength: 262144
            maximum: 10000
            minLength: 0
            minimum: 0
            type: string
