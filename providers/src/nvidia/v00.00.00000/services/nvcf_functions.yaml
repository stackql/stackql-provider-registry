openapi: 3.1.0
info:
  title: NVIDIA Cloud Functions - Functions
  description: 'NVCF functions and versions, function metadata, authorizations (function sharing grants), secrets and rate limits (source: the published NVCF OpenAPI specification; management operations served from api.ngc.nvidia.com).'
  version: 2.261.2
paths:
  /v2/nvcf/authorizations/functions:
    get:
      description: 'Lists all the function versions in an account that have been shared/authorized  with/to other accounts. Response includes the nca-ids of the authorized  accounts. If a function version is not shared/authorized, then it is not  included in the response. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: getAuthorizedPartiesForAllFunctions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuthorizedPartiesResponse'
          description: OK
      summary: List Functions Authorized/Shared With Other Accounts
      tags:
        - Function Sharing
      parameters: []
  /v2/nvcf/authorizations/functions/{function_id}:
    get:
      description: 'Lists function versions of the specified function and their corresponding  authorized accounts allowed to invoke the function version. Individual  versions of a function can have their own authorized accounts. So, each  object in the array can have different authorized accounts listed. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: getAuthorizedPartiesForAllVersions
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuthorizedPartiesResponse'
          description: OK
      summary: List Function Versions with Authorized Accounts For Specified Function
      tags:
        - Function Sharing
    post:
      description: 'Authorizes additional NVIDIA Cloud Accounts to invoke any version of the  specified function. By default, a function belongs to the NVIDIA Cloud Account  that created it, and the credentials used for function invocation must  reference the same NVIDIA Cloud Account. Upon invocation of this endpoint, any  existing authorized accounts will be overwritten by the newly specified  authorized accounts. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: createAuthorizedPartiesForAllVersions
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedPartiesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
          description: OK
      summary: Authorize Accounts To Invoke Function
      tags:
        - Function Sharing
    delete:
      description: 'Deletes authorizations at the function level. This impacts all versions of  the function. If a function versions has its own set of authorizations,  those are not deleted. If the specified function is public, then  Account Admin cannot perform this operation. Note that the response does  not include any authz accounts at version level. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: deleteAuthorizedPartiesForAllVersions
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
          description: OK
      summary: Delete All Authorizations At Function Level
      tags:
        - Function Sharing
  /v2/nvcf/authorizations/functions/{function_id}/add:
    patch:
      description: 'Adds the specified NVIDIA Cloud Account to the set of authorized accounts that  are can invoke all the versions of the specified function. If the specified  function does not have any existing inheritable authorized accounts, it results  in a response with status 404. If the specified account is already in the set  of existing inheritable authorized accounts, it results in a response with  status code 409. If a function is public, then Account Admin cannot perform  this operation. Note that response only includes authz accounts at the  function level. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: addAuthorizedPartyForAllVersions
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAuthorizedPartyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
          description: OK
      summary: Authorize Another Account To Invoke, List, and Check Queue Details of Function
      tags:
        - Function Sharing
  /v2/nvcf/authorizations/functions/{function_id}/remove:
    patch:
      description: 'Removes the specified NVIDIA Cloud Account from the set of authorized accounts  that can invoke all the versions of the specified function. If the specified  function does not have any existing inheritable authorized parties, it results  in a response with status 404. Also, if the specified account is not in the  existing set of inheritable authorized accounts, it results in a response with  status 404. If the specified function is public, then Account Admin cannot  perform this operation. Note that response only includes the remaining  authorized accounts at the function level. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: removeAuthorizedPartyForAllVersions
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAuthorizedPartyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
          description: OK
      summary: Unauthorize Account From Invoking, Listing, and Checking Queue Details of Function
      tags:
        - Function Sharing
  /v2/nvcf/authorizations/functions/{function_id}/versions/{function_version_id}:
    get:
      description: 'Gets NVIDIA Cloud Account IDs that are authorized to invoke specified function  version. Response includes authorized accounts that were added specifically  at the version level and the authorized accounts that were inherited from  function level. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: getAuthorizedPartiesForSpecificVersion
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
          description: OK
      summary: Get Account Authorizations For Function Version
      tags:
        - Function Sharing
    post:
      description: 'Authorizes additional NVIDIA Cloud Accounts to invoke a specific function  version. By default, a function belongs to the NVIDIA Cloud Account that  created it, and the credentials used for function invocation must reference  the same NVIDIA Cloud Account. Upon invocation of this endpoint, any existing  authorized accounts will be overwritten by the newly specified authorized  accounts. Note that the response does NOT include inherited authorized accounts  that were added at the function level. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: createAuthorizedPartiesForSpecificVersion
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version id
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedPartiesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
          description: OK
      summary: Authorize Accounts To Invoke/List Function Version
      tags:
        - Function Sharing
    delete:
      description: 'Deletes all the authorized accounts that are directly associated with the  specified function version. Authorized parties that are inherited by the  function version are not deleted. If the specified function version is public,  then Account Admin cannot perform this operation. Note that the response  does not include inherited authorized accounts that were added at the function  level. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: deleteAuthorizedPartiesForSpecificVersion
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
          description: OK
      summary: Delete All Authorizations At Version Level
      tags:
        - Function Sharing
  /v2/nvcf/authorizations/functions/{function_id}/versions/{function_version_id}/add:
    patch:
      description: 'Adds the specified NVIDIA Cloud Account to the set of authorized accounts that  can invoke the specified function version. If the specified function version  does not have any existing inheritable authorized accounts, it results in a  response with status 404. If the specified account is already in the set of  existing authorized accounts that are directly associated with the function  version, it results in a response wit status code 409. If a function is public,  then Account Admin cannot perform this operation. Note that the response  does not include inherited authorized accounts that were added at the function  level. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: addAuthorizedPartyForSpecificVersion
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAuthorizedPartyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
          description: OK
      summary: Authorize Another Account To Invoke, List, and Check Queue Details of Function Version
      tags:
        - Function Sharing
  /v2/nvcf/authorizations/functions/{function_id}/versions/{function_version_id}/remove:
    patch:
      description: 'Removes the specified NVIDIA Cloud Account from the set of authorized accounts  that are directly associated with specified function version. If the specified  function version does not have any of its own(not inherited) authorized  accounts, it results in a response with status 404. Also, if the specified  authorized account is not in the set of existing authorized parties that are  directly associated with the specified function version, it results in a  response with status code 404. If the specified function version is public,  then Account Admin cannot perform this operation. Note that the response  does not include inherited authorized accounts that were added at the function  level. Access to this functionality mandates the inclusion of a bearer token with the  ''authorize_clients'' scope in the HTTP Authorization header '
      operationId: removeAuthorizedPartyForSpecificVersion
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAuthorizedPartyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPartiesResponse'
          description: OK
      summary: Unauthorize Account From Invoking, Listing, and Checking Queue Details of Function Version
      tags:
        - Function Sharing
  /v2/nvcf/functions:
    get:
      description: Lists all the functions associated with the authenticated NVIDIA Cloud Account.  Requires a bearer token  with 'list_functions' or 'list_functions_details'  scope in the HTTP Authorization header.
      operationId: getFunctions
      parameters:
        - description: |
            Query param 'visibility' indicates the kind of functions to be included
             in the response.
          in: query
          name: visibility
          required: false
          schema:
            default:
              - authorized
              - private
              - public
            items:
              enum:
                - authorized
                - private
                - public
              format: UTF-8
              maxLength: 262144
              minLength: 0
              type: string
            maxItems: 2147483647
            minItems: 0
            type: array
            uniqueItems: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFunctionsResponse'
          description: OK
      summary: List Functions
      tags:
        - Function Management
    post:
      description: 'Creates a new function within the authenticated NVIDIA Cloud Account. Requires a  bearer token with ''register_function'' scope in the HTTP Authorization header. '
      operationId: createFunction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFunctionResponse'
          description: OK
      summary: Create Function
      tags:
        - Function Management
      parameters: []
  /v2/nvcf/functions/ids:
    get:
      description: 'Lists ids of all the functions in the authenticated NVIDIA Cloud Account.  Requires a bearer token with ''list_functions'' or ''list_functions_details''  scopes in the HTTP Authorization header. '
      operationId: getFunctionIds
      parameters:
        - description: |
            Query param 'visibility' indicates the kind of functions to be included
             in the response.
          in: query
          name: visibility
          required: false
          schema:
            default:
              - authorized
              - private
              - public
            items:
              enum:
                - authorized
                - private
                - public
              format: UTF-8
              maxLength: 262144
              minLength: 0
              type: string
            maxItems: 2147483647
            minItems: 0
            type: array
            uniqueItems: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFunctionIdsResponse'
          description: OK
      summary: List Function Ids
      tags:
        - Function Management
  /v2/nvcf/functions/{function_id}/versions:
    get:
      description: 'Lists details of all the versions of the specified function in the authenticated  NVIDIA Cloud Account. Requires a bearer token  with ''list_functions'' or  ''list_functions_details'' scopes in the HTTP Authorization header. '
      operationId: getFunctions_1
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFunctionsResponse'
          description: OK
      summary: List Function Versions
      tags:
        - Function Management
    post:
      description: 'Creates a version of the specified function within the authenticated NVIDIA  Cloud Account. If the function is public, then Account Admin cannot create  a version. Requires a bearer token with ''register_function'' scope in the  HTTP Authorization header. '
      operationId: createFunction_1
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFunctionResponse'
          description: OK
      summary: Create Function Version
      tags:
        - Function Management
  /v2/nvcf/functions/{function_id}/versions/{function_version_id}:
    get:
      description: 'Retrieves detailed information of the specified function version in the  authenticated NVIDIA Cloud Account. Requires a bearer token with  ''list_functions'' or ''list_functions_details'' scopes in the HTTP  Authorization header. '
      operationId: getFunction
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: 'Version id '
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: |
            Query param 'includeSecrets' indicates whether to include secret names
             for the function in the response.
          in: query
          name: includeSecrets
          required: false
          schema:
            default: true
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
          description: OK
      summary: Get Function Version Details
      tags:
        - Function Management
    put:
      description: 'Updates mutable fields of the specified function version within the authenticated NVIDIA Cloud Account. The current request payload supports tags updates, rate limit updates, and model-specific LLM config updates. Requires a bearer token with ''update_function'' scope in the HTTP Authorization header. '
      operationId: updateFunction
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Version id
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
          description: OK
      summary: Updates mutable fields of the specified function version.
      tags:
        - Function Management
    delete:
      description: 'Deletes the specified function version in the authenticated NVIDIA Cloud  Account. Requires a bearer token with ''delete_function'' scope in the HTTP  Authorization header. If the function version is public, then Account Admin  cannot delete the function. '
      operationId: deleteFunction
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Version id
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '204':
          description: No Content
      summary: Delete Function
      tags:
        - Function Management
  /v2/nvcf/metadata/functions/{function_id}/versions/{function_version_id}:
    put:
      deprecated: true
      description: 'Deprecated: use PUT /v2/nvcf/functions/{functionId}/versions/{functionVersionId} to update tags, rate limit, model-specific LLM config, and other mutable function fields. This legacy endpoint updates the same mutable function version fields for the authenticated NVIDIA Cloud Account and requires a bearer token with ''update_function'' scope in the HTTP Authorization header. '
      operationId: updateFunctionMetadata
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Version id
          in: path
          name: function_version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
          description: OK
      summary: Update Function Metadata
      tags:
        - Function Management
  /v2/nvcf/ratelimit/functions/{function_id}/versions/{version_id}:
    put:
      deprecated: true
      description: 'Deprecated: use PUT /v2/nvcf/functions/{functionId}/versions/{versionId}  to update ratelimit and other mutable function fields. This legacy endpoint  only updates ratelimit for the specified function version and requires a  bearer token with ''update_function'' scope in the HTTP Authorization header. '
      operationId: updateRateLimit
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version id
          in: path
          name: version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionRequest'
        required: true
      responses:
        '204':
          description: No Content
      summary: Update user ratelimit for a function version
      tags:
        - User Ratelimit Management
    delete:
      description: 'Delete ratelimit for the specified function version. This endpoint  requires a bearer token with ''update_function'' scope in the HTTP  Authorization header. '
      operationId: deleteRateLimit
      parameters:
        - description: Function id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function version id
          in: path
          name: version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      responses:
        '204':
          description: No Content
      summary: Delete user ratelimit for a function version
      tags:
        - User Ratelimit Management
  /v2/nvcf/secrets/functions/{function_id}/versions/{version_id}:
    put:
      description: 'Updates secrets for the specified function version. This endpoint  requires a bearer token with ''update_secrets'' scope in the HTTP  Authorization header. '
      operationId: updateFunctionSecrets
      parameters:
        - description: Function Id
          in: path
          name: function_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
        - description: Function Version Id
          in: path
          name: version_id
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionSecretsRequest'
        required: true
      responses:
        '204':
          description: No Content
      summary: Update user secrets for a function version
      tags:
        - User Secret Management
components:
  schemas:
    ListAuthorizedPartiesResponse:
      description: Parties authorized to invoke function
      properties:
        functions:
          description: Functions with authorized parties and other details
          items:
            $ref: '#/components/schemas/AuthorizedPartiesByFunctionDto'
          maxItems: 2147483647
          minItems: 0
          type: array
      required:
        - functions
      type: object
    AuthorizedPartiesResponse:
      description: Parties authorized to invoke function
      properties:
        function:
          $ref: '#/components/schemas/AuthorizedPartiesByFunctionDto'
          description: Function with authorized parties and other details
      required:
        - function
      type: object
    AuthorizedPartiesRequest:
      description: Request to associated authorized parties for a specific version or allversions of a function
      properties:
        authorizedParties:
          description: Parties authorized to invoke function
          items:
            $ref: '#/components/schemas/AuthorizedPartyDto'
          maxItems: 2147483647
          minItems: 1
          type: array
      required:
        - authorizedParties
      type: object
    PatchAuthorizedPartyRequest:
      description: |
        Request payload to associate/disassociate authorized party with function
      properties:
        authorizedParty:
          $ref: '#/components/schemas/AuthorizedPartyDto'
          description: Authorized party
      required:
        - authorizedParty
      type: object
    ListFunctionsResponse:
      description: Response body containing list of functions
      properties:
        functions:
          description: List of functions
          items:
            $ref: '#/components/schemas/FunctionDto'
          maxItems: 2147483647
          minItems: 0
          type: array
      required:
        - functions
      type: object
    CreateFunctionRequest:
      description: Request payload to create function.
      properties:
        apiBodyFormat:
          description: Invocation request body format
          enum:
            - PREDICT_V2
            - CUSTOM
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
          nullable: true
        containerArgs:
          description: Args to be passed when launching the container
          format: UTF-8
          maxLength: 262144
          minLength: 0
          type: string
          nullable: true
        containerEnvironment:
          description: Environment settings for launching the container
          items:
            $ref: '#/components/schemas/ContainerEnvironmentEntryDto'
          maxItems: 2147483647
          minItems: 0
          type: array
          nullable: true
        containerImage:
          description: Optional custom container image
          format: uri
          type: string
          nullable: true
        description:
          description: Optional function/version description
          format: UTF-8
