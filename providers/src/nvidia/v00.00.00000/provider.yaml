id: nvidia
name: nvidia
version: v00.00.00000
providerServices:
  catalog:
    id: catalog:v00.00.00000
    name: catalog
    preferred: true
    service:
      $ref: nvidia/v00.00.00000/services/catalog.yaml
    title: NVIDIA NGC Catalog
    version: v00.00.00000
    description: >-
      The public NGC catalog: guest reads of models, resources, recipes, helm
      charts, collections and generic artifacts, plus the GPU and cloud service
      provider catalogs (no organization scope; public artifacts read without
      credentials).
  nvcf_deployments:
    id: nvcf_deployments:v00.00.00000
    name: nvcf_deployments
    preferred: true
    service:
      $ref: nvidia/v00.00.00000/services/nvcf_deployments.yaml
    title: NVIDIA Cloud Functions - Deployments
    version: v00.00.00000
    description: >-
      NVCF deployments and GPU specifications, cluster groups and GPU inventory,
      registry credentials and telemetry endpoints (source: the published NVCF
      OpenAPI specification; served from api.ngc.nvidia.com).
  nvcf_functions:
    id: nvcf_functions:v00.00.00000
    name: nvcf_functions
    preferred: true
    service:
      $ref: nvidia/v00.00.00000/services/nvcf_functions.yaml
    title: NVIDIA Cloud Functions - Functions
    version: v00.00.00000
    description: >-
      NVCF functions and versions, function metadata, authorizations (function
      sharing grants), secrets and rate limits (source: the published NVCF
      OpenAPI specification; management operations served from
      api.ngc.nvidia.com).
  nvcf_invocation:
    id: nvcf_invocation:v00.00.00000
    name: nvcf_invocation
    preferred: true
    service:
      $ref: nvidia/v00.00.00000/services/nvcf_invocation.yaml
    title: NVIDIA Cloud Functions - Invocation
    version: v00.00.00000
    description: >-
      NVCF HTTP-polling invocation (pexec and status), assets and invocation
      assertion tokens (served from api.nvcf.nvidia.com).
  nvcf_queues:
    id: nvcf_queues:v00.00.00000
    name: nvcf_queues
    preferred: true
    service:
      $ref: nvidia/v00.00.00000/services/nvcf_queues.yaml
    title: NVIDIA Cloud Functions - Queues
    version: v00.00.00000
    description: >-
      NVCF request queue details per function and version, and queue position
      per request (served from api.nvcf.nvidia.com).
  orgs:
    id: orgs:v00.00.00000
    name: orgs
    preferred: true
    service:
      $ref: nvidia/v00.00.00000/services/orgs.yaml
    title: NVIDIA NGC Organizations
    version: v00.00.00000
    description: >-
      NGC organizations, teams, users and team members, role grants, invitations
      and the current user (source: the NGC API definition harvested from the
      API explorer).
  private_registry:
    id: private_registry:v00.00.00000
    name: private_registry
    preferred: true
    service:
      $ref: nvidia/v00.00.00000/services/private_registry.yaml
    title: NVIDIA NGC Private Registry
    version: v00.00.00000
    description: >-
      Org-scoped artifact metadata in the NGC private registry: models,
      resources, recipes, generic artifacts (helm charts, endpoints, blueprints,
      agents, playbooks, APIs, skills), versions and files, collections, shares,
      deployment parameters, encryption keys and workflows. Team-scoped twins
      are mapped as *_by_team methods (source: the Private Artifacts (Models)
      API definition, responses from the ngcsdk data classes).
config:
  auth:
    type: bearer
    credentialsenvvar: NGC_API_KEY
  snake_case_aliases: true
