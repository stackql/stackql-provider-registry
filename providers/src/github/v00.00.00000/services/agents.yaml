openapi: 3.0.3
info:
  title: agents API
  description: Endpoints for Agents secrets and variables.
  version: 1.1.4
paths:
  /orgs/{org}/agents/secrets:
    get:
      summary: List organization secrets
      description: >-
        Lists all secrets available in an organization without revealing their

        encrypted values.


        Authenticated users must have collaborator access to a repository to
        create, update, or read secrets.


        OAuth app tokens and personal access tokens (classic) need the
        `admin:org` scope to use this endpoint. If the repository is private,
        the `repo` scope is also required.
      tags:
        - agents
      operationId: agents/list-org-secrets
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/agents/secrets#list-organization-secrets
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/per-page'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - total_count
                  - secrets
                properties:
                  total_count:
                    type: integer
                  secrets:
                    type: array
                    items:
                      $ref: '#/components/schemas/organization-actions-secret'
              examples:
                default:
                  $ref: '#/components/examples/organization-actions-secret-paginated'
          headers:
            Link:
              $ref: '#/components/headers/link'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: secrets
      x-stackQL-resource: secrets
  /orgs/{org}/agents/secrets/public-key:
    get:
      summary: Get an organization public key
      description: >-
        Gets your public key, which you need to encrypt secrets. You need to

        encrypt a secret before you can create or update secrets.


        Authenticated users must have collaborator access to a repository to
        create, update, or read secrets.


        OAuth app tokens and personal access tokens (classic) need the
        `admin:org` scope to use this endpoint. If the repository is private,
        the `repo` scope is also required.
      tags:
        - agents
      operationId: agents/get-org-public-key
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/secrets#get-an-organization-public-key
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/actions-public-key'
              examples:
                default:
                  $ref: '#/components/examples/actions-public-key'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: secrets
      x-stackQL-resource: secrets
  /orgs/{org}/agents/secrets/{secret_name}:
    get:
      summary: Get an organization secret
      description: >-
        Gets a single organization secret without revealing its encrypted value.


        The authenticated user must have collaborator access to a repository to
        create, update, or read secrets.


        OAuth tokens and personal access tokens (classic) need the `admin:org`
        scope to use this endpoint. If the repository is private, OAuth tokens
        and personal access tokens (classic) need the `repo` scope to use this
        endpoint.
      tags:
        - agents
      operationId: agents/get-org-secret
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/agents/secrets#get-an-organization-secret
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/secret-name'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-actions-secret'
              examples:
                default:
                  $ref: '#/components/examples/organization-actions-secret'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: secrets
      x-stackQL-resource: secrets
    put:
      summary: Create or update an organization secret
      description: >-
        Creates or updates an organization secret with an encrypted value.
        Encrypt your secret using

        [LibSodium](https://libsodium.gitbook.io/doc/bindings_for_other_languages).
        For more information, see "[Encrypting secrets for the REST
        API](https://docs.github.com/rest/guides/encrypting-secrets-for-the-rest-api)."


        Authenticated users must have collaborator access to a repository to
        create, update, or read secrets.


        OAuth tokens and personal access tokens (classic) need the `admin:org`
        scope to use this endpoint. If the repository is private, OAuth tokens
        and personal access tokens (classic) need the `repo` scope to use this
        endpoint.
      tags:
        - agents
      operationId: agents/create-or-update-org-secret
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/secrets#create-or-update-an-organization-secret
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/secret-name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                encrypted_value:
                  type: string
                  description: >-
                    Value for your secret, encrypted with
                    [LibSodium](https://libsodium.gitbook.io/doc/bindings_for_other_languages)
                    using the public key retrieved from the [Get an organization
                    public
                    key](https://docs.github.com/rest/agents/secrets#get-an-organization-public-key)
                    endpoint.
                  pattern: >-
                    ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4})$
                key_id:
                  type: string
                  description: ID of the key you used to encrypt the secret.
                visibility:
                  type: string
                  description: >-
                    Which type of organization repositories have access to the
                    organization secret. `selected` means only the repositories
                    specified by `selected_repository_ids` can access the
                    secret.
                  enum:
                    - all
                    - private
                    - selected
                selected_repository_ids:
                  type: array
                  description: >-
                    An array of repository ids that can access the organization
                    secret. You can only provide a list of repository ids when
                    the `visibility` is set to `selected`. You can manage the
                    list of selected repositories using the [List selected
                    repositories for an organization
                    secret](https://docs.github.com/rest/agents/secrets#list-selected-repositories-for-an-organization-secret),
                    [Set selected repositories for an organization
                    secret](https://docs.github.com/rest/agents/secrets#set-selected-repositories-for-an-organization-secret),
                    and [Remove selected repository from an organization
                    secret](https://docs.github.com/rest/agents/secrets#remove-selected-repository-from-an-organization-secret)
                    endpoints.
                  items:
                    type: integer
              required:
                - encrypted_value
                - key_id
                - visibility
            examples:
              default:
                value:
                  encrypted_value: c2VjcmV0
                  key_id: '012345678912345678'
                  visibility: selected
                  selected_repository_ids:
                    - 1296269
                    - 1296280
      responses:
        '201':
          description: Response when creating a secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/empty-object'
              examples:
                default:
                  value: null
        '204':
          description: Response when updating a secret
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: secrets
      x-stackQL-resource: secrets
    delete:
      summary: Delete an organization secret
      description: >-
        Deletes a secret in an organization using the secret name.


        Authenticated users must have collaborator access to a repository to
        create, update, or read secrets.


        OAuth tokens and personal access tokens (classic) need the `admin:org`
        scope to use this endpoint. If the repository is private, OAuth tokens
        and personal access tokens (classic) need the `repo` scope to use this
        endpoint.
      tags:
        - agents
      operationId: agents/delete-org-secret
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/secrets#delete-an-organization-secret
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/secret-name'
      responses:
        '204':
          description: Response
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: secrets
      x-stackQL-resource: secrets
  /orgs/{org}/agents/secrets/{secret_name}/repositories:
    get:
      summary: List selected repositories for an organization secret
      description: >-
        Lists all repositories that have been selected when the `visibility`

        for repository access to a secret is set to `selected`.


        Authenticated users must have collaborator access to a repository to
        create, update, or read secrets.


        OAuth app tokens and personal access tokens (classic) need the
        `admin:org` scope to use this endpoint. If the repository is private,
        the `repo` scope is also required.
      tags:
        - agents
      operationId: agents/list-selected-repos-for-org-secret
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/secrets#list-selected-repositories-for-an-organization-secret
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/secret-name'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per-page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - total_count
                  - repositories
                properties:
                  total_count:
                    type: integer
                  repositories:
                    type: array
                    items:
                      $ref: '#/components/schemas/minimal-repository'
              examples:
                default:
                  $ref: '#/components/examples/public-repository-paginated'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: secrets
      x-stackQL-resource: secrets
    put:
      summary: Set selected repositories for an organization secret
      description: >-
        Replaces all repositories for an organization secret when the
        `visibility`

        for repository access is set to `selected`. The visibility is set when
        you [Create

        or update an organization
        secret](https://docs.github.com/rest/agents/secrets#create-or-update-an-organization-secret).


        Authenticated users must have collaborator access to a repository to
        create, update, or read secrets.


        OAuth app tokens and personal access tokens (classic) need the
        `admin:org` scope to use this endpoint. If the repository is private,
        the `repo` scope is also required.
      tags:
        - agents
      operationId: agents/set-selected-repos-for-org-secret
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/secrets#set-selected-repositories-for-an-organization-secret
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/secret-name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selected_repository_ids:
                  type: array
                  description: >-
                    An array of repository ids that can access the organization
                    secret. You can only provide a list of repository ids when
                    the `visibility` is set to `selected`. You can add and
                    remove individual repositories using the [Add selected
                    repository to an organization
                    secret](https://docs.github.com/rest/agents/secrets#add-selected-repository-to-an-organization-secret)
                    and [Remove selected repository from an organization
                    secret](https://docs.github.com/rest/agents/secrets#remove-selected-repository-from-an-organization-secret)
                    endpoints.
                  items:
                    type: integer
              required:
                - selected_repository_ids
            examples:
              default:
                value:
                  selected_repository_ids:
                    - 64780797
      responses:
        '204':
          description: Response
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: secrets
      x-stackQL-resource: secrets
  /orgs/{org}/agents/secrets/{secret_name}/repositories/{repository_id}:
    put:
      summary: Add selected repository to an organization secret
      description: >-
        Adds a repository to an organization secret when the `visibility` for

        repository access is set to `selected`. For more information about
        setting the visibility, see [Create or

        update an organization
        secret](https://docs.github.com/rest/agents/secrets#create-or-update-an-organization-secret).


        Authenticated users must have collaborator access to a repository to
        create, update, or read secrets.


        OAuth tokens and personal access tokens (classic) need the `admin:org`
        scope to use this endpoint. If the repository is private, OAuth tokens
        and personal access tokens (classic) need the `repo` scope to use this
        endpoint.
      tags:
        - agents
      operationId: agents/add-selected-repo-to-org-secret
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/secrets#add-selected-repository-to-an-organization-secret
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/secret-name'
        - name: repository_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content when repository was added to the selected list
        '409':
          description: Conflict when visibility type is not set to selected
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: secrets
      x-stackQL-resource: secrets
    delete:
      summary: Remove selected repository from an organization secret
      description: >-
        Removes a repository from an organization secret when the `visibility`

        for repository access is set to `selected`. The visibility is set when
        you [Create

        or update an organization
        secret](https://docs.github.com/rest/agents/secrets#create-or-update-an-organization-secret).


        Authenticated users must have collaborator access to a repository to
        create, update, or read secrets.


        OAuth app tokens and personal access tokens (classic) need the
        `admin:org` scope to use this endpoint. If the repository is private,
        the `repo` scope is also required.
      tags:
        - agents
      operationId: agents/remove-selected-repo-from-org-secret
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/secrets#remove-selected-repository-from-an-organization-secret
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/secret-name'
        - name: repository_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Response when repository was removed from the selected list
        '409':
          description: Conflict when visibility type not set to selected
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: secrets
      x-stackQL-resource: secrets
  /orgs/{org}/agents/variables:
    get:
      summary: List organization variables
      description: >-
        Lists all agent variables available in an organization.

        Returned variables include their values.


        Authenticated users must have collaborator access to a repository to
        create, update, or read variables.


        OAuth app tokens and personal access tokens (classic) need the
        `admin:org` scope to use this endpoint. If the repository is private,
        the `repo` scope is also required.
      tags:
        - agents
      operationId: agents/list-org-variables
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/variables#list-organization-variables
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/variables-per-page'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - total_count
                  - variables
                properties:
                  total_count:
                    type: integer
                  variables:
                    type: array
                    items:
                      $ref: '#/components/schemas/organization-actions-variable'
              examples:
                default:
                  $ref: >-
                    #/components/examples/organization-actions-variables-paginated
          headers:
            Link:
              $ref: '#/components/headers/link'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: variables
      x-stackQL-resource: variables
    post:
      summary: Create an organization variable
      description: >-
        Creates an organization agent variable that you can reference in a
        GitHub Actions workflow.


        Authenticated users must have collaborator access to a repository to
        create, update, or read variables.


        OAuth tokens and personal access tokens (classic) need the `admin:org`
        scope to use this endpoint. If the repository is private, OAuth tokens
        and personal access tokens (classic) need the `repo` scope to use this
        endpoint.
      tags:
        - agents
      operationId: agents/create-org-variable
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/variables#create-an-organization-variable
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the variable.
                value:
                  type: string
                  description: The value of the variable.
                visibility:
                  type: string
                  description: >-
                    The type of repositories in the organization that can access
                    the variable. `selected` means only the repositories
                    specified by `selected_repository_ids` can access the
                    variable.
                  enum:
                    - all
                    - private
                    - selected
                selected_repository_ids:
                  type: array
                  description: >-
                    An array of repository ids that can access the organization
                    variable. You can only provide a list of repository ids when
                    the `visibility` is set to `selected`.
                  items:
                    type: integer
              required:
                - name
                - value
                - visibility
            examples:
              default:
                value:
                  name: USERNAME
                  value: octocat
                  visibility: selected
                  selected_repository_ids:
                    - 1296269
                    - 1296280
      responses:
        '201':
          description: Response when creating a variable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/empty-object'
              examples:
                default:
                  value: null
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: variables
      x-stackQL-resource: variables
  /orgs/{org}/agents/variables/{name}:
    get:
      summary: Get an organization variable
      description: >-
        Gets a specific agent variable in an organization.


        The authenticated user must have collaborator access to a repository to
        create, update, or read variables.


        OAuth tokens and personal access tokens (classic) need the `admin:org`
        scope to use this endpoint. If the repository is private, OAuth tokens
        and personal access tokens (classic) need the `repo` scope to use this
        endpoint.
      tags:
        - agents
      operationId: agents/get-org-variable
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/variables#get-an-organization-variable
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/variable-name'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-actions-variable'
              examples:
                default:
                  $ref: '#/components/examples/organization-actions-variable'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: variables
      x-stackQL-resource: variables
    patch:
      summary: Update an organization variable
      description: >-
        Updates an organization agent variable that you can reference in a
        GitHub Actions workflow.


        Authenticated users must have collaborator access to a repository to
        create, update, or read variables.


        OAuth app tokens and personal access tokens (classic) need the
        `admin:org` scope to use this endpoint. If the repository is private,
        the `repo` scope is also required.
      tags:
        - agents
      operationId: agents/update-org-variable
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/variables#update-an-organization-variable
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/variable-name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the variable.
                value:
                  type: string
                  description: The value of the variable.
                visibility:
                  type: string
                  description: >-
                    The type of repositories in the organization that can access
                    the variable. `selected` means only the repositories
                    specified by `selected_repository_ids` can access the
                    variable.
                  enum:
                    - all
                    - private
                    - selected
                selected_repository_ids:
                  type: array
                  description: >-
                    An array of repository ids that can access the organization
                    variable. You can only provide a list of repository ids when
                    the `visibility` is set to `selected`.
                  items:
                    type: integer
            examples:
              default:
                value:
                  name: USERNAME
                  value: octocat
                  visibility: selected
                  selected_repository_ids:
                    - 1296269
                    - 1296280
      responses:
        '204':
          description: Response
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: variables
      x-stackQL-resource: variables
    delete:
      summary: Delete an organization variable
      description: >-
        Deletes an organization agent variable using the variable name.


        Authenticated users must have collaborator access to a repository to
        create, update, or read variables.


        OAuth tokens and personal access tokens (classic) need the `admin:org`
        scope to use this endpoint. If the repository is private, OAuth tokens
        and personal access tokens (classic) need the `repo` scope to use this
        endpoint.
      tags:
        - agents
      operationId: agents/delete-org-variable
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/variables#delete-an-organization-variable
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/variable-name'
      responses:
        '204':
          description: Response
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: variables
      x-stackQL-resource: variables
  /orgs/{org}/agents/variables/{name}/repositories:
    get:
      summary: List selected repositories for an organization variable
      description: >-
        Lists all repositories that can access an organization agent variable

        that is available to selected repositories.


        Authenticated users must have collaborator access to a repository to
        create, update, or read variables.


        OAuth app tokens and personal access tokens (classic) need the
        `admin:org` scope to use this endpoint. If the repository is private,
        the `repo` scope is also required.
      tags:
        - agents
      operationId: agents/list-selected-repos-for-org-variable
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/variables#list-selected-repositories-for-an-organization-variable
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/variable-name'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per-page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - total_count
                  - repositories
                properties:
                  total_count:
                    type: integer
                  repositories:
                    type: array
                    items:
                      $ref: '#/components/schemas/minimal-repository'
              examples:
                default:
                  $ref: '#/components/examples/public-repository-paginated'
        '409':
          description: >-
            Response when the visibility of the variable is not set to
            `selected`
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: variables
      x-stackQL-resource: variables
    put:
      summary: Set selected repositories for an organization variable
      description: >-
        Replaces all repositories for an organization agent variable that is
        available

        to selected repositories. Organization variables that are available to
        selected

        repositories have their `visibility` field set to `selected`.


        Authenticated users must have collaborator access to a repository to
        create, update, or read variables.


        OAuth app tokens and personal access tokens (classic) need the
        `admin:org` scope to use this endpoint. If the repository is private,
        the `repo` scope is also required.
      tags:
        - agents
      operationId: agents/set-selected-repos-for-org-variable
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/agents/variables#set-selected-repositories-for-an-organization-variable
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/variable-name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selected_repository_ids:
                  type: array
                  description: >-
                    The IDs of the repositories that can access the organization
                    variable.
                  items:
                    type: integer
              required:
                - selected_repository_ids
            examples:
              default:
                value:
                  selected_repository_ids:
                    - 64780797
      responses:
        '204':
          description: Response
        '409':
          description: >-
            Response when the visibility of the variable is not set to
            `selected`
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: agents
        subcategory: variables
      x-stackQL-resource: variables
  /orgs/{org}/agents/variables/{name}/repositories/{repository_id}:
    put:
      summary: Add selected repository to an organization variable
      description: >-
