                pull:
                  type: boolean
                triage:
                  type: boolean
                push:
                  type: boolean
                maintain:
                  type: boolean
                admin:
                  type: boolean
              required:
                - pull
                - triage
                - push
                - maintain
                - admin
            url:
              type: string
              format: uri
            html_url:
              type: string
              format: uri
              example: https://github.com/orgs/rails/teams/core
            members_url:
              type: string
            repositories_url:
              type: string
              format: uri
            type:
              description: The ownership type of the team
              type: string
              enum:
                - enterprise
                - organization
            access_source:
