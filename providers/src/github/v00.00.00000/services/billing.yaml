  /users/{username}/settings/billing/usage/summary:
    get:
      summary: Get billing usage summary for a user
      description: >-
        > [!NOTE]

        > This endpoint is in public preview and is subject to change.


        Gets a summary report of usage for a user.


        **Note:** Only data from the past 24 months is accessible via this
        endpoint.
      tags:
        - billing
      operationId: billing/get-github-billing-usage-summary-report-user
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/billing/usage#get-billing-usage-summary-for-a-user
      parameters:
        - $ref: '#/components/parameters/username'
        - $ref: '#/components/parameters/billing-usage-report-year'
        - $ref: '#/components/parameters/billing-usage-report-month-default'
        - $ref: '#/components/parameters/billing-usage-report-day'
        - $ref: '#/components/parameters/billing-usage-report-repository'
        - $ref: '#/components/parameters/billing-usage-report-product'
        - $ref: '#/components/parameters/billing-usage-report-sku'
      responses:
        '200':
          $ref: '#/components/responses/billing_usage_summary_report_user'
        '400':
          $ref: '#/components/responses/bad_request'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '500':
          $ref: '#/components/responses/internal_error'
        '503':
          $ref: '#/components/responses/service_unavailable'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: billing
        subcategory: usage
      x-stackQL-resource: usage
components:
  schemas:
    create-budget:
      type: object
      properties:
        message:
          type: string
          description: A message indicating the result of the create operation
        budget:
          type: object
          properties:
            id:
              type: string
              description: ID of the budget.
            budget_scope:
              type: string
              description: The type of scope for the budget
              example: enterprise
              enum:
                - enterprise
                - organization
                - repository
                - cost_center
                - multi_user_customer
                - multi_user_cost_center
                - user
            budget_entity_name:
              type: string
              description: The name of the entity to apply the budget to
              example: example-repository-name
            budget_amount:
              type: integer
              description: >-
                The budget amount in whole dollars. For license-based products,
                this represents the number of licenses.
              example: 100
              minimum: 0
            prevent_further_usage:
              type: boolean
              description: >-
                Whether to prevent additional spending once the budget is
                exceeded
              example: true
            budget_product_sku:
              type: string
              description: A single product or sku to apply the budget to.
              example: actions_linux
            budget_type:
              description: The type of pricing for the budget
              example: ProductPricing
              oneOf:
                - type: string
                  enum:
                    - ProductPricing
                - type: string
                  enum:
                    - SkuPricing
            budget_alerting:
              type: object
              properties:
                will_alert:
                  type: boolean
                  description: >-
                    Whether alerts are enabled for this budget. Rejected for
                    user-scope as alerting is always disabled for them.
                  example: true
                alert_recipients:
                  type: array
                  items:
                    type: string
                  description: >-
                    Array of user login names who will receive alerts. Rejected
                    for user-scope as alerting is always disabled for them.
                  example:
                    - mona
                    - lisa
      required:
        - message
        - budget
    basic-error:
      title: Basic Error
      description: Basic Error
      type: object
      properties:
        message:
