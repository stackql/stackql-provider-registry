              required:
                - enabled
            examples:
              default:
                summary: Example request body
                value:
                  enabled: true
                  max_open_pull_requests: 1
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Whether the pull request creation cap is enabled
                  max_open_pull_requests:
                    type: integer
                    description: >-
                      The maximum number of open pull requests a user can have
                      at one time
                    minimum: 1
                    maximum: 1000
                required:
                  - enabled
                  - max_open_pull_requests
              examples:
                default:
                  summary: Response
                  value:
                    enabled: true
                    max_open_pull_requests: 1
        '403':
          $ref: '#/components/responses/forbidden'
