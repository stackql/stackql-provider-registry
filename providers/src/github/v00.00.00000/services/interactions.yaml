openapi: 3.0.3
info:
  title: interactions API
  description: Owner or admin management of users interactions.
  version: 1.1.4
paths:
  /orgs/{org}/interaction-limits:
    get:
      summary: Get interaction restrictions for an organization
      description: >-
        Shows which type of GitHub user can interact with this organization and
        when the restriction expires. If there is no restrictions, you will see
        an empty response.
      tags:
        - interactions
      operationId: interactions/get-restrictions-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/orgs#get-interaction-restrictions-for-an-organization
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                title: Interaction Limits
                description: Interaction limit settings.
                type: object
                properties:
                  limit:
                    $ref: '#/components/schemas/interaction-group'
                  origin:
                    type: string
                    example: repository
                  expires_at:
                    type: string
                    format: date-time
                    example: '2018-08-17T04:18:39Z'
                required:
                  - limit
                  - origin
                  - expires_at
                additionalProperties: false
              examples:
                default:
                  $ref: '#/components/examples/interaction-limit-response'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: orgs
      x-stackQL-resource: orgs
    put:
      summary: Set interaction restrictions for an organization
      description: >-
        Temporarily restricts interactions to a certain type of GitHub user in
        any public repository in the given organization. You must be an
        organization owner to set these restrictions. Setting the interaction
        limit at the organization level will overwrite any interaction limits
        that are set for individual repositories owned by the organization.
      tags:
        - interactions
      operationId: interactions/set-restrictions-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/orgs#set-interaction-restrictions-for-an-organization
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/interaction-limit'
            examples:
              default:
                value:
                  limit: collaborators_only
                  expiry: one_month
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/interaction-limit-response'
              examples:
                default:
                  $ref: '#/components/examples/interaction-limit-response'
        '422':
          $ref: '#/components/responses/validation_failed'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: orgs
      x-stackQL-resource: orgs
    delete:
      summary: Remove interaction restrictions for an organization
      description: >-
        Removes all interaction restrictions from public repositories in the
        given organization. You must be an organization owner to remove
        restrictions.
      tags:
        - interactions
      operationId: interactions/remove-restrictions-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/orgs#remove-interaction-restrictions-for-an-organization
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '204':
          description: Response
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: orgs
      x-stackQL-resource: orgs
  /orgs/{org}/interaction-limits/pulls/creation-cap:
    get:
      summary: Get pull request creation cap for an org
      description: >-
        Gets the pull request creation cap configuration for an organization.

        The cap limits the total number of open pull requests a user can have
        across all public

        repositories in the organization at one time.


        Only users with admin access to the organization can view the cap
        configuration.
      tags:
        - interactions
      operationId: interactions/get-pull-request-creation-cap-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/orgs#get-pull-request-creation-cap-for-an-org
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Whether the pull request creation cap is enabled
                  max_open_pull_requests:
                    type: integer
                    description: >-
                      The maximum number of open pull requests a user can have
                      at one time
                    minimum: 1
                    maximum: 1000
                required:
                  - enabled
                  - max_open_pull_requests
              examples:
                default:
                  summary: Response when cap is enabled
                  value:
                    enabled: true
                    max_open_pull_requests: 1
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basic-error'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: orgs
      x-stackQL-resource: orgs
    patch:
      summary: Update pull request creation cap for an org
      description: >-
        Updates the pull request creation cap for an organization. The cap
        limits the total number

        of open pull requests a user can have across all public repositories in
        the organization

        at one time.


        Only users with admin access to the organization can configure the cap.
      tags:
        - interactions
      operationId: interactions/update-pull-request-creation-cap-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/orgs#update-pull-request-creation-cap-for-an-org
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether the pull request creation cap is enabled
                max_open_pull_requests:
                  type: integer
                  description: >-
                    The maximum number of open pull requests a user can have at
                    one time
                  minimum: 1
                  maximum: 1000
              required:
                - enabled
            examples:
              default:
                summary: Example request body
                value:
                  enabled: true
                  max_open_pull_requests: 1
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Whether the pull request creation cap is enabled
                  max_open_pull_requests:
                    type: integer
                    description: >-
                      The maximum number of open pull requests a user can have
                      at one time
                    minimum: 1
                    maximum: 1000
                required:
                  - enabled
                  - max_open_pull_requests
              examples:
                default:
                  summary: Response
                  value:
                    enabled: true
                    max_open_pull_requests: 1
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basic-error'
        '422':
          $ref: '#/components/responses/validation_failed'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: orgs
      x-stackQL-resource: orgs
  /repos/{owner}/{repo}/interaction-limits:
    get:
      summary: Get interaction restrictions for a repository
      description: >-
        Shows which type of GitHub user can interact with this repository and
        when the restriction expires. If there are no restrictions, you will see
        an empty response.
      tags:
        - interactions
      operationId: interactions/get-restrictions-for-repo
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/repos#get-interaction-restrictions-for-a-repository
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                title: Interaction Limits
                description: Interaction limit settings.
                type: object
                properties:
                  limit:
                    $ref: '#/components/schemas/interaction-group'
                  origin:
                    type: string
                    example: repository
                  expires_at:
                    type: string
                    format: date-time
                    example: '2018-08-17T04:18:39Z'
                required:
                  - limit
                  - origin
                  - expires_at
                additionalProperties: false
              examples:
                default:
                  $ref: '#/components/examples/interaction-limit-2'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: repos
      x-stackQL-resource: repos
    put:
      summary: Set interaction restrictions for a repository
      description: >-
        Temporarily restricts interactions to a certain type of GitHub user
        within the given repository. You must have owner or admin access to set
        these restrictions. If an interaction limit is set for the user or
        organization that owns this repository, you will receive a `409
        Conflict` response and will not be able to use this endpoint to change
        the interaction limit for a single repository.
      tags:
        - interactions
      operationId: interactions/set-restrictions-for-repo
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/repos#set-interaction-restrictions-for-a-repository
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/interaction-limit'
            examples:
              default:
                summary: Example request body
                value:
                  limit: collaborators_only
                  expiry: one_day
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/interaction-limit-response'
              examples:
                default:
                  $ref: '#/components/examples/interaction-limit-2'
        '409':
          description: Response
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: repos
      x-stackQL-resource: repos
    delete:
      summary: Remove interaction restrictions for a repository
      description: >-
        Removes all interaction restrictions from the given repository. You must
        have owner or admin access to remove restrictions. If the interaction
        limit is set for the user or organization that owns this repository, you
        will receive a `409 Conflict` response and will not be able to use this
        endpoint to change the interaction limit for a single repository.
      tags:
        - interactions
      operationId: interactions/remove-restrictions-for-repo
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/repos#remove-interaction-restrictions-for-a-repository
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      responses:
        '204':
          description: Response
        '409':
          description: Response
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: repos
      x-stackQL-resource: repos
  /repos/{owner}/{repo}/interaction-limits/pulls/bypass-list:
    get:
      summary: Get pull request creation cap bypass list for a repository
      description: >-
        Lists the users that are on the pull request creation cap bypass list
        for a

        repository. Users on this list can create pull requests regardless of
        any

        configured pull request creation cap.


        Only users with maintainer permissions can view the bypass list.
      tags:
        - interactions
      operationId: interactions/get-pull-request-bypass-list-for-repo
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/repos#get-pull-request-creation-cap-bypass-list-for-a-repository
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/simple-user'
              examples:
                default:
                  $ref: '#/components/examples/pull-request-bypass-list-items'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: repos
      x-stackQL-resource: repos
    put:
      summary: Add users to the pull request creation cap bypass list for a repository
      description: >-
        Adds users to the pull request creation cap bypass list for a
        repository.

        Users on this list can create pull requests regardless of any configured

        pull request creation cap.


        Only users with maintainer permissions can modify the bypass list.

        You can add a maximum of 100 users per request.

        The bypass list can only hold a maximum of 100 users.
      tags:
        - interactions
      operationId: interactions/set-pull-request-bypass-list-for-repo
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/repos#add-users-to-the-pull-request-creation-cap-bypass-list-for-a-repository
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/interaction-limit-pull-request-bypass-list'
            examples:
              default:
                summary: Example request body
                value:
                  users:
                    - octocat
                    - monalisa
      responses:
        '204':
          description: Response
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '422':
          $ref: '#/components/responses/validation_failed'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: repos
      x-stackQL-resource: repos
    delete:
      summary: >-
        Remove users from the pull request creation cap bypass list for a
        repository
      description: >-
        Removes users from the pull request creation cap bypass list for a
        repository.

        Removed users will be subject to any configured pull request creation
        cap.


        Only users with maintainer permissions can modify the bypass list.

        You can remove a maximum of 100 users per request.
      tags:
        - interactions
      operationId: interactions/remove-pull-request-bypass-list-for-repo
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/interactions/repos#remove-users-from-the-pull-request-creation-cap-bypass-list-for-a-repository
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/interaction-limit-pull-request-bypass-list'
            examples:
              default:
                summary: Example request body
                value:
                  users:
                    - octocat
      responses:
        '204':
          description: Response
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '422':
          $ref: '#/components/responses/validation_failed'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: interactions
        subcategory: repos
      x-stackQL-resource: repos
