      x-github:
        enabledForGitHubApps: true
        category: copilot-spaces
        subcategory: collaborators
      x-stackQL-resource: collaborators
    post:
      summary: Add a collaborator to an organization Copilot Space
      description: >-
        Adds a collaborator (user or team) to a specific Copilot Space owned by
        an organization. The authenticated user must have appropriate
        permissions to manage collaborators.


        **Note:** When adding users as collaborators, they must already be
        members of the organization.

        When adding teams as collaborators, they must be defined in the
        organization.


        OAuth app tokens and personal access tokens (classic) need the
        `write:org` scope to use this endpoint.


        Fine-grained tokens and GitHub App user access tokens must have been
        granted access to the organization that owns the space. They must also
        have been granted access to every repository referenced by resources in
        the space.
      tags:
        - copilot-spaces
      operationId: copilot-spaces/add-collaborator-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/copilot-spaces/collaborators#add-a-collaborator-to-an-organization-copilot-space
      parameters:
        - $ref: '#/components/parameters/org'
        - name: space_number
          description: The unique identifier of the Copilot Space.
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - actor_type
                - actor_identifier
                - role
              properties:
                actor_type:
                  type: string
                  enum:
                    - User
                    - Team
                  description: The type of actor (user or team).
                actor_identifier:
                  type: string
                  description: >-
                    The username (for users) or team slug (for teams). The
                    numeric ID of a user or team is also accepted.
                role:
                  type: string
                  enum:
                    - reader
                    - writer
                    - admin
                  description: The role to grant to the collaborator.
            examples:
              user:
                value:
                  actor_type: User
                  actor_identifier: octocat
                  role: writer
              team:
                value:
                  actor_type: Team
                  actor_identifier: developers
                  role: reader
