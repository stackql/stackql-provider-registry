components:
  schemas:
    copilot-space:
      title: Space
      description: >-
        A GitHub Copilot Space represents an interactive AI workspace where
        users can ask questions and get assistance.
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: The unique identifier of the space.
          example: 42
        number:
          type: integer
          description: The number that identifies the space within its owner.
          example: 1
        name:
          type: string
          description: The display name of the space.
          example: My Development Space
        description:
          type: string
          nullable: true
          description: A description of the space.
          example: A space for discussing React development patterns
        general_instructions:
          type: string
          maxLength: 4000
          nullable: true
          description: General instructions for the Copilot Space.
          example: Help with React development patterns and best practices
        base_role:
          type: string
          enum:
            - reader
            - writer
            - admin
            - no_access
          description: |-
            The base role that determines default permissions.
            - `no_access`: No default access
            - `reader`: Default read permissions
            - `writer`: Default write permissions (organization spaces only)
            - `admin`: Default admin permissions (organization spaces only)
          example: no_access
        owner:
          description: The user or organization that owns this space.
          title: Simple User
          type: object
          properties:
            name:
              nullable: true
              type: string
            email:
              nullable: true
              type: string
            login:
              type: string
              example: octocat
            id:
              type: integer
              format: int64
              example: 1
            node_id:
              type: string
              example: MDQ6VXNlcjE=
            avatar_url:
              type: string
              format: uri
              example: https://github.com/images/error/octocat_happy.gif
            gravatar_id:
              type: string
              example: 41d064eb2195891e12d0413f63227ea7
              nullable: true
            url:
              type: string
              format: uri
              example: https://api.github.com/users/octocat
            html_url:
              type: string
              format: uri
              example: https://github.com/octocat
            followers_url:
              type: string
              format: uri
              example: https://api.github.com/users/octocat/followers
            following_url:
              type: string
              example: https://api.github.com/users/octocat/following{/other_user}
            gists_url:
              type: string
              example: https://api.github.com/users/octocat/gists{/gist_id}
            starred_url:
              type: string
              example: https://api.github.com/users/octocat/starred{/owner}{/repo}
            subscriptions_url:
              type: string
              format: uri
              example: https://api.github.com/users/octocat/subscriptions
            organizations_url:
              type: string
              format: uri
              example: https://api.github.com/users/octocat/orgs
            repos_url:
              type: string
              format: uri
              example: https://api.github.com/users/octocat/repos
            events_url:
              type: string
              example: https://api.github.com/users/octocat/events{/privacy}
            received_events_url:
              type: string
              format: uri
              example: https://api.github.com/users/octocat/received_events
            type:
              type: string
              example: User
            site_admin:
              type: boolean
            starred_at:
              type: string
              example: '"2020-07-09T00:17:55Z"'
            user_view_type:
              type: string
              example: public
            hooks_url:
              type: string
              example: https://api.github.com/orgs/github/hooks
            issues_url:
              type: string
              example: https://api.github.com/orgs/github/issues
            members_url:
              type: string
              example: https://api.github.com/orgs/github/members{/member}
            public_members_url:
              type: string
              example: https://api.github.com/orgs/github/public_members{/member}
            description:
              type: string
              example: A great organization
              nullable: true
          required:
            - avatar_url
            - events_url
            - followers_url
            - following_url
            - gists_url
            - gravatar_id
            - html_url
            - id
            - node_id
            - login
            - organizations_url
            - received_events_url
            - repos_url
            - site_admin
            - starred_url
            - subscriptions_url
            - type
            - url
            - hooks_url
            - issues_url
            - members_url
            - public_members_url
            - description
        creator:
          $ref: '#/components/schemas/simple-user'
        created_at:
          type: string
          format: date-time
          description: The date and time the space was created.
          example: '2023-01-01T00:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: The date and time the space was last updated.
          example: '2023-01-01T12:00:00Z'
        html_url:
          type: string
          format: uri
          description: The HTML URL of the space.
          example: https://github.com/copilot/spaces/octo-org/5
        api_url:
          type: string
          format: uri
          description: The API URL of the space.
          example: https://api.github.com/organizations/1/copilot-spaces/5
        resources_attributes:
          type: array
          description: Resources attached to the space.
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
                description: The unique identifier of the resource.
              resource_type:
                type: string
                enum:
                  - repository
                  - github_file
                  - free_text
                  - github_issue
                  - github_pull_request
                  - media_content
                  - uploaded_text_file
                description: The type of resource.
              copilot_chat_attachment_id:
                type: integer
                format: int64
                nullable: true
                description: >-
                  The unique identifier of the chat attachment for uploaded
                  files or media content.
              created_at:
                type: string
                format: date-time
                description: The date and time the resource was created.
              updated_at:
                type: string
                format: date-time
                description: The date and time the resource was last updated.
              metadata:
                type: object
                description: Metadata specific to the resource type.
                properties:
                  repository_id:
                    type: integer
                    description: Repository ID for repository or file resources.
                  file_path:
                    type: string
                    description: File path for file resources.
                  text:
                    type: string
                    description: Text content for free text resources.
                  name:
                    type: string
                    description: Name for the resource.
                  number:
                    type: integer
                    description: Issue or PR number.
                  copilot_chat_attachment_id:
                    type: integer
                    description: Chat attachment ID for uploaded files or media.
                  media_type:
                    type: string
                    description: Media type for media content resources.
                  url:
                    type: string
                    description: URL for media content resources.
                  height:
                    type: integer
                    description: Height for media content resources.
                  width:
                    type: integer
                    description: Width for media content resources.
      required:
        - id
        - number
        - name
        - base_role
        - owner
        - creator
        - created_at
        - updated_at
        - html_url
        - api_url
      additionalProperties: false
