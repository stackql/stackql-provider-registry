openapi: 3.0.3
info:
  title: copilot_spaces API
  description: github API
  version: 1.1.4
paths:
  /orgs/{org}/copilot-spaces:
    get:
      summary: List organization Copilot Spaces
      description: >-
        Lists Copilot Spaces owned by an organization. The authenticated user
        must have read access to the organization's Copilot Spaces.


        Only Spaces that are readable by the authenticated user are returned.
        This includes public Spaces and internal Spaces if the user is a member
        of the organization.


        OAuth app tokens and personal access tokens (classic) need the
        `read:org` scope to use this endpoint.


        Fine-grained tokens and GitHub App user access tokens must have been
        granted access to the organization that owns the space. They must also
        have been granted access to every repository referenced by resources in
        a space; spaces with inaccessible resources are omitted from the
        response.
      tags:
        - copilot-spaces
      operationId: copilot-spaces/list-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/copilot-spaces/copilot-spaces#list-organization-copilot-spaces
      parameters:
        - $ref: '#/components/parameters/org'
        - name: per_page
          description: The number of results per page (max 100).
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: before
          description: >-
            A cursor, as given in the [Link
            header](https://docs.github.com/rest/guides/using-pagination-in-the-rest-api#using-link-headers).
            If specified, the query only searches for results before this
            cursor.
          in: query
          schema:
            type: string
        - name: after
          description: >-
            A cursor, as given in the [Link
            header](https://docs.github.com/rest/guides/using-pagination-in-the-rest-api#using-link-headers).
            If specified, the query only searches for results after this cursor.
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - spaces
                properties:
                  spaces:
                    type: array
                    description: The list of Copilot Spaces on this page of results.
                    items:
                      $ref: '#/components/schemas/copilot-space'
              examples:
                default:
                  $ref: '#/components/examples/copilot-spaces-organization-list'
          headers:
            Link:
              $ref: '#/components/headers/link'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        enabledForGitHubApps: true
        category: copilot-spaces
        subcategory: copilot-spaces
      x-stackQL-resource: copilot_spaces
    post:
      summary: Create an organization Copilot Space
      description: >-
        Creates a new Copilot Space owned by an organization. The authenticated
        user must have permissions to create spaces in the organization.


        Organization members with appropriate permissions can create Copilot
        Spaces to be shared within their organization.


        OAuth app tokens and personal access tokens (classic) need the
        `read:org` scope to use this endpoint.


        Fine-grained tokens and GitHub App user access tokens must have been
        granted access to the organization that owns the space. They must also
        have been granted access to every repository referenced by the submitted
        resources.
      tags:
        - copilot-spaces
      operationId: copilot-spaces/create-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/copilot-spaces/copilot-spaces#create-an-organization-copilot-space
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the Copilot Space.
                  example: Team Planning Space
                description:
                  type: string
                  description: A description of the Copilot Space.
                  example: Organization space for team planning and coordination
                general_instructions:
                  type: string
                  maxLength: 4000
                  description: General instructions for the Copilot Space.
                  example: Help the team with planning and coordination tasks
                base_role:
                  type: string
                  enum:
                    - reader
                    - writer
                    - admin
                    - no_access
                  description: >-
                    The base role that determines default permissions for
                    organization members.

                    - `no_access`: No default access (default)

                    - `reader`: Organization members can read the space

                    - `writer`: Organization members can read and edit the space

                    - `admin`: Organization members have full admin access to
                    the space
                  default: no_access
                resources_attributes:
                  type: array
                  description: Resources to attach to the space.
                  items:
                    type: object
                    properties:
                      resource_type:
                        type: string
                        enum:
                          - repository
                          - github_file
                          - free_text
                          - github_issue
                          - github_pull_request
                          - media_content
                          - uploaded_text_file
                        description: The type of resource.
                      metadata:
                        type: object
                        description: Metadata specific to the resource type.
                        properties:
                          repository_id:
                            type: integer
                            description: Repository ID for repository or file resources.
                          file_path:
                            type: string
                            description: File path for file resources.
                          text:
                            type: string
                            description: Text content for free text resources.
                          name:
                            type: string
                            description: Name for the resource.
                          number:
                            type: integer
                            description: Issue or PR number.
              required:
                - name
            examples:
              default:
                value:
                  name: Team Planning Space
                  description: Organization space for team planning and coordination
                  general_instructions: Help the team with planning and coordination tasks
                  resources_attributes:
                    - resource_type: github_file
                      metadata:
                        repository_id: 123456
                        file_path: docs/planning.md
                    - resource_type: free_text
                      metadata:
                        name: Team Guidelines
                        text: >-
                          Our team follows agile methodology and holds daily
                          standups
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/copilot-space'
              examples:
                default:
                  $ref: '#/components/examples/copilot-space-organization'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '422':
          $ref: '#/components/responses/validation_failed'
      x-github:
        enabledForGitHubApps: true
        category: copilot-spaces
        subcategory: copilot-spaces
      x-stackQL-resource: copilot_spaces
  /orgs/{org}/copilot-spaces/{space_number}:
    get:
      summary: Get an organization Copilot Space
      description: >-
        Gets details about a specific Copilot Space owned by an organization.
        The authenticated user must have read access to the Space.


        Internal Spaces require the authenticated user to be a member of the
        organization or have been granted read permissions.


        OAuth app tokens and personal access tokens (classic) need the
        `read:org` scope to use this endpoint.


        Fine-grained tokens and GitHub App user access tokens must have been
        granted access to the organization that owns the space. They must also
        have been granted access to every repository referenced by resources in
        the space.
      tags:
        - copilot-spaces
      operationId: copilot-spaces/get-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/copilot-spaces/copilot-spaces#get-an-organization-copilot-space
      parameters:
        - $ref: '#/components/parameters/org'
        - name: space_number
          description: The unique identifier of the Copilot Space.
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/copilot-space'
              examples:
                default:
                  $ref: '#/components/examples/copilot-space-organization'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        enabledForGitHubApps: true
        category: copilot-spaces
        subcategory: copilot-spaces
      x-stackQL-resource: copilot_spaces
    put:
      summary: Set an organization Copilot Space
      description: >-
        Updates a Copilot Space owned by an organization. The authenticated user
        must have permissions to update spaces in the organization.


        Organization members with appropriate permissions can update Copilot
        Spaces owned by their organization.


        OAuth app tokens and personal access tokens (classic) need the
        `read:org` scope to use this endpoint.


        Fine-grained tokens and GitHub App user access tokens must have been
        granted access to the organization that owns the space. They must also
        have been granted access to every repository referenced by resources in
        the space, including any being added or updated.
      tags:
        - copilot-spaces
      operationId: copilot-spaces/update-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/copilot-spaces/copilot-spaces#set-an-organization-copilot-space
      parameters:
        - $ref: '#/components/parameters/org'
        - name: space_number
          description: The unique identifier of the Copilot Space.
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the Copilot Space.
                  example: Updated Team Planning Space
                description:
                  type: string
                  description: A description of the Copilot Space.
                  example: >-
                    Updated organization space for team planning and
                    coordination
                general_instructions:
                  type: string
                  maxLength: 4000
                  description: General instructions for the Copilot Space.
                  example: >-
                    Updated instructions to help the team with planning and
                    coordination tasks
                base_role:
                  type: string
                  enum:
                    - reader
                    - writer
                    - admin
                    - no_access
                  description: >-
                    The base role that determines default permissions for
                    organization members. Changing this field requires admin
                    permissions.

                    - `no_access`: No default access (default)

                    - `reader`: Organization members can read the space

                    - `writer`: Organization members can read and edit the space

                    - `admin`: Organization members have full admin access to
                    the space
                resources_attributes:
                  type: array
                  description: Resources to attach to the space.
                  items:
                    type: object
                    properties:
                      resource_type:
                        type: string
                        enum:
                          - repository
                          - github_file
                          - free_text
                          - github_issue
                          - github_pull_request
                          - media_content
                          - uploaded_text_file
                        description: The type of resource.
                      metadata:
                        type: object
                        description: Metadata specific to the resource type.
                        properties:
                          repository_id:
                            type: integer
                            description: Repository ID for repository or file resources.
                          file_path:
                            type: string
                            description: File path for file resources.
                          text:
                            type: string
                            description: Text content for free text resources.
                          name:
                            type: string
                            description: Name for the resource.
                          number:
                            type: integer
                            description: Issue or PR number.
            examples:
              default:
                value:
                  name: Updated Team Planning Space
                  description: >-
                    Updated organization space for team planning and
                    coordination
                  general_instructions: >-
                    Updated instructions to help the team with planning and
                    coordination tasks
                  resources_attributes:
                    - resource_type: github_file
                      metadata:
                        repository_id: 123456
                        file_path: docs/updated-planning.md
                    - id: 789
                      _destroy: true
                    - id: 456
                      resource_type: free_text
                      metadata:
                        name: Updated Team Guidelines
                        text: >-
                          Our updated team follows agile methodology and holds
                          daily standups
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/copilot-space'
              examples:
                default:
                  $ref: '#/components/examples/copilot-space-organization'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '422':
          $ref: '#/components/responses/validation_failed'
      x-github:
        enabledForGitHubApps: true
        category: copilot-spaces
        subcategory: copilot-spaces
      x-stackQL-resource: copilot_spaces
    delete:
      summary: Delete an organization Copilot Space
      description: >-
        Deletes a Copilot Space owned by an organization. The authenticated user
        must have permissions to delete spaces in the organization.


        **Warning:** This action is permanent and cannot be undone. Deleting a
        Copilot Space will remove all associated resources and configurations.


        Organization members with appropriate permissions can delete Copilot
        Spaces owned by their organization.


        OAuth app tokens and personal access tokens (classic) need both the
        `read:org` and `repo` scopes to use this endpoint.


        Fine-grained tokens and GitHub App user access tokens must have been
        granted access to the organization that owns the space. They must also
        have been granted access to every repository referenced by resources in
        the space.
      tags:
        - copilot-spaces
      operationId: copilot-spaces/delete-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/copilot-spaces/copilot-spaces#delete-an-organization-copilot-space
      parameters:
        - $ref: '#/components/parameters/org'
        - name: space_number
          description: The unique identifier of the Copilot Space.
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: The Copilot Space has been successfully deleted.
        '404':
          $ref: '#/components/responses/not_found'
        '422':
          $ref: '#/components/responses/validation_failed'
      x-github:
        enabledForGitHubApps: true
        category: copilot-spaces
        subcategory: copilot-spaces
      x-stackQL-resource: copilot_spaces
  /orgs/{org}/copilot-spaces/{space_number}/collaborators:
    get:
      summary: List collaborators for an organization Copilot Space
      description: >-
        Lists all collaborators for a specific Copilot Space owned by an
        organization. The authenticated user must have appropriate permissions
        to view collaborators.


        Each collaborator entry specifies which user or team has access to the
        space and at what level (reader, writer, or admin). The space owner
        (organization) is excluded from this list.


        **Note:** Team collaborators listed here are teams that are defined in
        the organization.


        OAuth app tokens and personal access tokens (classic) need the
        `read:org` scope to use this endpoint.


        Fine-grained tokens and GitHub App user access tokens must have been
        granted access to the organization that owns the space. They must also
        have been granted access to every repository referenced by resources in
        the space.
      tags:
        - copilot-spaces
      operationId: copilot-spaces/list-collaborators-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/copilot-spaces/collaborators#list-collaborators-for-an-organization-copilot-space
      parameters:
        - $ref: '#/components/parameters/org'
        - name: space_number
          description: The unique identifier of the Copilot Space.
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - collaborators
                properties:
                  collaborators:
                    type: array
                    description: The list of collaborators for this Copilot Space.
                    items:
                      $ref: '#/components/schemas/copilot-space-collaborator'
              examples:
                default:
                  value:
                    collaborators:
                      - actor_type: User
                        role: writer
                        login: octocat
                        id: 12345
                        node_id: MDQ6VXNlcjEyMzQ1
                        avatar_url: https://github.com/images/error/octocat_happy.gif
