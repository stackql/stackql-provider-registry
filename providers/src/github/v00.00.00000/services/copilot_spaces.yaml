  /orgs/{org}/copilot-spaces/{space_number}/collaborators/{actor_type}/{actor_identifier}:
    put:
      summary: Set a collaborator role for an organization Copilot Space
      description: >-
        Updates the role of a collaborator for a specific Copilot Space owned by
        an organization. The authenticated user must have appropriate
        permissions to manage collaborators.


        OAuth app tokens and personal access tokens (classic) need the
        `write:org` scope to use this endpoint.


        Fine-grained tokens and GitHub App user access tokens must have been
        granted access to the organization that owns the space. They must also
        have been granted access to every repository referenced by resources in
        the space.
      tags:
        - copilot-spaces
      operationId: copilot-spaces/update-collaborator-for-org
      externalDocs:
        description: API method documentation
        url: >-
          https://docs.github.com/rest/copilot-spaces/collaborators#set-a-collaborator-role-for-an-organization-copilot-space
      parameters:
        - $ref: '#/components/parameters/org'
        - name: space_number
          description: The unique identifier of the Copilot Space.
          in: path
          required: true
          schema:
            type: integer
        - name: actor_type
          description: The type of actor (user or team).
          in: path
          required: true
          schema:
            type: string
            enum:
              - User
              - Team
        - name: actor_identifier
          description: >-
            The username (for users) or team slug (for teams). The numeric ID of
            a user or team is also accepted.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - reader
                    - writer
                    - admin
                    - no_access
                  description: >-
                    The new role to grant to the collaborator. Use `no_access`
                    to remove the collaborator.
            examples:
