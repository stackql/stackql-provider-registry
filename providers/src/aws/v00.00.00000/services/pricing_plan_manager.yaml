openapi: 3.0.0
info:
  version: "2025-08-05"
  title: PricingPlanManager
  description: PricingPlanManager
  x-serviceName: pricingplanmanager
  x-serviceAlias: pricing_plan_manager
  x-protocol: rest-json
  x-apiVersion: "2025-08-05"
  x-endpointPrefix: pricingplanmanager
servers:
  - url: https://pricingplanmanager.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for pricing-plan-manager
paths:
  /v1/ApprovePaidSubscription:
    post:
      operationId: ApprovePaidSubscription
      description: Approves a subscription that is in PENDING_APPROVAL status, activating it and starting billing. This operation requires the current ETag value for concurrency control. Retrieve it from a previous GetSubscription or ListSubscriptions response.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/String"
          description: The ETag value from a previous GetSubscription or ListSubscriptions response. This ensures you are approving the expected version of the subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/SubscriptionArn"
                clientToken:
                  $ref: "#/components/schemas/IdempotencyToken"
              required:
                - arn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovePaidSubscriptionOutput"
  /v1/AssociateResourcesToSubscription:
    post:
      operationId: AssociateResourcesToSubscription
      description: Adds one or more resources to an existing subscription. The subscription must be in an active state that is not pending other changes. For subscriptions in the CloudFront plan family, the associated resources must include exactly one Amazon CloudFront distribution and one AWS WAF web ACL. You can also include other supported resources, such as Amazon Route 53 hosted zones, and CloudFront KeyValueStores.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/String"
          description: The ETag value from a previous GetSubscription or ListSubscriptions response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/SubscriptionArn"
                resourceArns:
                  $ref: "#/components/schemas/ResourceArns"
                clientToken:
                  $ref: "#/components/schemas/IdempotencyToken"
              required:
                - arn
                - resourceArns
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssociateResourcesToSubscriptionOutput"
  /v1/CancelSubscription:
    post:
      operationId: CancelSubscription
      description: Cancels a flat-rate pricing subscription. For active subscriptions, the cancellation is scheduled to take effect at the end of the current billing period. The subscription remains active until that date. To revert a pending cancellation, use CancelSubscriptionChange. For subscriptions in PENDING_APPROVAL status, the subscription is deleted immediately without scheduling.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/String"
          description: The ETag value from a previous GetSubscription or ListSubscriptions response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/SubscriptionArn"
                clientToken:
                  $ref: "#/components/schemas/IdempotencyToken"
              required:
                - arn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelSubscriptionOutput"
  /v1/CancelSubscriptionChange:
    post:
      operationId: CancelSubscriptionChange
      description: Cancels a pending scheduled change on a subscription, such as a pending downgrade or cancellation. The subscription returns to its state before the change was scheduled. You cannot cancel a scheduled change close to its effective date. If the change is within the processing window, this operation returns an error.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/String"
          description: The ETag value from a previous GetSubscription or ListSubscriptions response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/SubscriptionArn"
                clientToken:
                  $ref: "#/components/schemas/IdempotencyToken"
              required:
                - arn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelSubscriptionChangeOutput"
  /v1/CreateSubscription:
    post:
      operationId: CreateSubscription
      description: Creates a flat-rate pricing subscription for the specified resources. When approvalMode is set to MANUAL, paid-tier subscriptions are created in PENDING_APPROVAL status and require a separate ApprovePaidSubscription call before billing starts. Free-tier subscriptions are always activated immediately regardless of approval mode. When approvalMode is set to IMMEDIATE or is not specified, the subscription is activated immediately.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planFamily:
                  $ref: "#/components/schemas/String"
                planTier:
                  $ref: "#/components/schemas/String"
                usageLevel:
                  $ref: "#/components/schemas/String"
                resourceArns:
                  $ref: "#/components/schemas/ResourceArns"
                approvalMode:
                  $ref: "#/components/schemas/ApprovalMode"
                clientToken:
                  $ref: "#/components/schemas/IdempotencyToken"
              required:
                - planFamily
                - planTier
                - resourceArns
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSubscriptionOutput"
  /v1/DisassociateResourcesFromSubscription:
    post:
      operationId: DisassociateResourcesFromSubscription
      description: Removes one or more resources from an existing subscription. For subscriptions in the CloudFront plan family, the associated resources must always include exactly one Amazon CloudFront distribution and exactly one AWS WAF web ACL. You cannot remove these required resources.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/String"
          description: The ETag value from a previous GetSubscription or ListSubscriptions response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/SubscriptionArn"
                resourceArns:
                  $ref: "#/components/schemas/ResourceArns"
                clientToken:
                  $ref: "#/components/schemas/IdempotencyToken"
              required:
                - arn
                - resourceArns
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisassociateResourcesFromSubscriptionOutput"
  /v1/GetSubscription:
    post:
      operationId: GetSubscription
      description: Returns the details of a flat-rate pricing subscription, including its current status, associated resources, and any pending scheduled changes.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/SubscriptionArn"
              required:
                - arn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSubscriptionOutput"
  /v1/ListSubscriptions:
    post:
      operationId: ListSubscriptions
      description: Returns a summary of all flat-rate pricing subscriptions in the calling account.
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nextToken:
                  $ref: "#/components/schemas/String"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSubscriptionsOutput"
  /v1/UpdateSubscription:
    post:
      operationId: UpdateSubscription
      description: Changes the plan tier of an existing subscription. Upgrades take effect immediately. Downgrades are scheduled and the current tier remains unchanged until the end of the billing cycle (calendar month). You cannot update a subscription while a scheduled change is pending. To make a new change, first cancel the pending change using CancelSubscriptionChange. This operation replaces the plan tier value. If you omit the optional usageLevel field, it is reset to the default.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/String"
          description: The ETag value from a previous GetSubscription or ListSubscriptions response. This ensures you are updating the expected version of the subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/SubscriptionArn"
                planTier:
                  $ref: "#/components/schemas/String"
                usageLevel:
                  $ref: "#/components/schemas/String"
                clientToken:
                  $ref: "#/components/schemas/IdempotencyToken"
              required:
                - arn
                - planTier
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSubscriptionOutput"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    String:
      type: string
    SubscriptionArn:
      description: The Amazon Resource Name (ARN) of a flat-rate pricing subscription.
      type: string
      minLength: 1
      maxLength: 2048
    IdempotencyToken:
      description: A unique, case-sensitive identifier that you provide to ensure a request is handled only once.
      type: string
      minLength: 1
      maxLength: 64
    ApprovePaidSubscriptionOutput:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: The details of the approved subscription.
        eTag:
          $ref: "#/components/schemas/String"
          description: The updated entity tag for concurrency control.
      required:
        - subscription
        - eTag
    Subscription:
      description: The full details of a flat-rate pricing subscription, including its current configuration, status, and associated resources.
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/SubscriptionArn"
          description: The Amazon Resource Name (ARN) that uniquely identifies this subscription.
        planFamily:
          $ref: "#/components/schemas/String"
          description: The pricing plan family for the subscription, such as CloudFront.
        planTier:
          $ref: "#/components/schemas/String"
          description: The current tier level of the pricing plan, such as FREE, PRO, BUSINESS, or PREMIUM.
        usageLevel:
          $ref: "#/components/schemas/String"
          description: The usage level within the plan tier. When present, indicates a specific capacity configuration beyond the base tier.
        scheduledChange:
          $ref: "#/components/schemas/ScheduledChange"
          description: A pending change that will take effect at the end of the current billing period. This field is present only when a downgrade or cancellation is scheduled.
        status:
          $ref: "#/components/schemas/Status"
          description: The current status of the subscription. For the list of possible values, see the Status type.
        statusReason:
          $ref: "#/components/schemas/String"
          description: A human-readable explanation of the current status, present when additional context is available.
        resourceArns:
          $ref: "#/components/schemas/ResourceArns"
          description: The ARNs of the AWS resources covered by this subscription.
        createdAt:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time when the subscription was created, in ISO 8601 format.
        updatedAt:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time when the subscription was last modified, in ISO 8601 format.
      required:
        - arn
        - planFamily
        - planTier
        - status
        - resourceArns
        - createdAt
        - updatedAt
    ScheduledChange:
      description: A pending change on a subscription that takes effect at the end of the current billing period, such as a tier downgrade or cancellation.
      type: object
      properties:
        changeType:
          $ref: "#/components/schemas/ScheduledChangeType"
          description: The type of pending change. Possible values are DOWNGRADE (a tier change to a lower level) and CANCELLATION (subscription termination).
        effectiveDate:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time when the change takes effect, in ISO 8601 format. This value is populated after the change is confirmed by the billing system.
        planTier:
          $ref: "#/components/schemas/String"
          description: For downgrades, the tier level that the subscription will change to. Not present for cancellations.
        usageLevel:
          $ref: "#/components/schemas/String"
          description: For downgrades, the target usage level after the change takes effect.
      required:
        - changeType
    ScheduledChangeType:
      description: "The type of pending change on a subscription. Possible values: DOWNGRADE — The subscription tier is being lowered at the end of the billing period. CANCELLATION — The subscription is being terminated at the end of the billing period."
      type: string
      enum:
        - DOWNGRADE
        - CANCELLATION
    SyntheticTimestamp_date_time:
      type: string
      format: date-time
    Status:
      description: "The status of a flat-rate pricing subscription. Possible values: PENDING_APPROVAL — The subscription was created with manual approval and is waiting for an ApprovePaidSubscription call. ACTIVE — The subscription is active and resources are covered by flat-rate pricing. SYNC_IN_PROGRESS — A change is being applied to the subscription. Wait for the operation to complete before making additional changes. FAILED — The subscription encountered an error. Check the statusReason field for details."
      type: string
      enum:
        - PENDING_APPROVAL
        - ACTIVE
        - SYNC_IN_PROGRESS
        - FAILED
    ResourceArns:
      description: A list of 1 to 10 AWS resource ARNs to include in the subscription.
      type: array
      items:
        $ref: "#/components/schemas/String"
    AssociateResourcesToSubscriptionOutput:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: The details of the subscription with the newly added resources.
        eTag:
          $ref: "#/components/schemas/String"
          description: The updated entity tag for concurrency control.
      required:
        - subscription
        - eTag
    CancelSubscriptionOutput:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: The details of the subscription with the pending cancellation. For active subscriptions, a scheduledChange of type CANCELLATION is included.
        eTag:
          $ref: "#/components/schemas/String"
          description: The updated entity tag for concurrency control.
      required:
        - subscription
        - eTag
    CancelSubscriptionChangeOutput:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: The details of the subscription with the pending change removed.
        eTag:
          $ref: "#/components/schemas/String"
          description: The updated entity tag for concurrency control.
      required:
        - subscription
        - eTag
    ApprovalMode:
      description: Determines whether a subscription requires explicit approval before billing starts.
      type: string
      enum:
        - MANUAL
        - IMMEDIATE
    CreateSubscriptionOutput:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: The details of the newly created subscription.
        eTag:
          $ref: "#/components/schemas/String"
          description: The entity tag for concurrency control. Use this value in the If-Match header for subsequent operations on this subscription.
      required:
        - subscription
        - eTag
    DisassociateResourcesFromSubscriptionOutput:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: The details of the subscription with the specified resources removed.
        eTag:
          $ref: "#/components/schemas/String"
          description: The updated entity tag for concurrency control.
      required:
        - subscription
        - eTag
    GetSubscriptionOutput:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: The details of the requested subscription.
        eTag:
          $ref: "#/components/schemas/String"
          description: The entity tag for concurrency control. Use this value in the If-Match header for subsequent operations on this subscription.
      required:
        - subscription
        - eTag
    ListSubscriptionsOutput:
      type: object
      properties:
        subscriptionSummaries:
          $ref: "#/components/schemas/SubscriptionSummaryList"
          description: The list of subscription summaries for the calling account.
        nextToken:
          $ref: "#/components/schemas/String"
          description: A token that indicates there are more results available. Pass this value in a subsequent ListSubscriptions request to retrieve the next page of results.
      required:
        - subscriptionSummaries
    SubscriptionSummaryList:
      type: array
      items:
        $ref: "#/components/schemas/SubscriptionSummary"
    SubscriptionSummary:
      description: Summary information for a flat-rate pricing subscription, as returned by list operations.
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/SubscriptionArn"
          description: The Amazon Resource Name (ARN) that uniquely identifies this subscription.
        planFamily:
          $ref: "#/components/schemas/String"
          description: The pricing plan family for the subscription, such as CloudFront.
        planTier:
          $ref: "#/components/schemas/String"
          description: The current tier level of the pricing plan.
        usageLevel:
          $ref: "#/components/schemas/String"
          description: The usage level within the plan tier.
        scheduledChange:
          $ref: "#/components/schemas/ScheduledChange"
          description: A pending change that will take effect at the end of the current billing period, if any.
        status:
          $ref: "#/components/schemas/Status"
          description: The current status of the subscription.
        statusReason:
          $ref: "#/components/schemas/String"
          description: A human-readable explanation of the current status, present when additional context is available.
        resourceArns:
          $ref: "#/components/schemas/ResourceArns"
          description: The ARNs of the AWS resources covered by this subscription.
        createdAt:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time when the subscription was created, in ISO 8601 format.
        updatedAt:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time when the subscription was last modified, in ISO 8601 format.
        eTag:
          $ref: "#/components/schemas/String"
          description: The entity tag for concurrency control. Pass this value in the If-Match header when making changes to this subscription.
      required:
        - arn
        - planFamily
        - planTier
        - status
        - resourceArns
        - createdAt
        - updatedAt
        - eTag
    UpdateSubscriptionOutput:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: The details of the updated subscription. For downgrades, the current tier remains unchanged and a scheduledChange indicates the pending change.
        eTag:
          $ref: "#/components/schemas/String"
          description: The updated entity tag for concurrency control.
      required:
        - subscription
        - eTag
  x-stackQL-resources:
    subscriptions:
      id: aws.pricing_plan_manager.subscriptions
      name: subscriptions
      title: subscriptions
      methods:
        associate_resources_to_subscription:
          operation:
            $ref: "#/paths/~1v1~1AssociateResourcesToSubscription/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
          request:
            nativeCasing: pascal
          config:
            requestBodyTranslate:
              algorithm: naive
        cancel_subscription_change:
          operation:
            $ref: "#/paths/~1v1~1CancelSubscriptionChange/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
          request:
            nativeCasing: pascal
          config:
            requestBodyTranslate:
              algorithm: naive
        create_subscription:
          operation:
            $ref: "#/paths/~1v1~1CreateSubscription/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
          request:
            nativeCasing: pascal
          config:
            requestBodyTranslate:
              algorithm: naive
        disassociate_resources_from_subscription:
          operation:
            $ref: "#/paths/~1v1~1DisassociateResourcesFromSubscription/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
          request:
            nativeCasing: pascal
          config:
            requestBodyTranslate:
              algorithm: naive
        get_subscription:
          operation:
            $ref: "#/paths/~1v1~1GetSubscription/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
          request:
            nativeCasing: pascal
          config:
            requestBodyTranslate:
              algorithm: naive
        list_subscriptions:
          operation:
            $ref: "#/paths/~1v1~1ListSubscriptions/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
            objectKey: $.subscriptionSummaries
          request:
            nativeCasing: pascal
          config:
            pagination:
              requestToken:
                key: nextToken
                location: body
              responseToken:
                key: $.nextToken
                location: body
            requestBodyTranslate:
              algorithm: naive
        update_subscription:
          operation:
            $ref: "#/paths/~1v1~1UpdateSubscription/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
          request:
            nativeCasing: pascal
          config:
            requestBodyTranslate:
              algorithm: naive
      sqlVerbs:
        select:
          - $ref: "#/components/x-stackQL-resources/subscriptions/methods/get_subscription"
          - $ref: "#/components/x-stackQL-resources/subscriptions/methods/list_subscriptions"
        insert:
          - $ref: "#/components/x-stackQL-resources/subscriptions/methods/create_subscription"
        update:
          - $ref: "#/components/x-stackQL-resources/subscriptions/methods/associate_resources_to_subscription"
          - $ref: "#/components/x-stackQL-resources/subscriptions/methods/update_subscription"
        delete: []
