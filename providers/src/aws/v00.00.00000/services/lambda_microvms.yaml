openapi: 3.0.0
info:
  version: "2025-09-09"
  title: Lambda MicroVMs
  description: Lambda MicroVMs
  x-serviceName: lambda
  x-serviceAlias: lambda_microvms
  x-protocol: rest-json
  x-apiVersion: "2025-09-09"
  x-endpointPrefix: lambda
servers:
  - url: https://lambda.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for lambda-microvms
paths:
  /2025-09-09/microvms/{microvm_identifier}/auth-token:
    post:
      operationId: CreateMicrovmAuthToken
      description: Creates an authentication token for accessing a running MicroVM. The token grants access to the specified ports on the MicroVM endpoint.
      parameters:
        - name: microvm_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmIdentifier"
          description: The ID of the MicroVM to create an authentication token for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expirationInMinutes:
                  $ref: "#/components/schemas/PositiveInteger"
                allowedPorts:
                  $ref: "#/components/schemas/ListOfPortSpecification"
              required:
                - expirationInMinutes
                - allowedPorts
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMicrovmAuthTokenResponse"
  /2025-09-09/microvm-images:
    post:
      operationId: CreateMicrovmImage
      description: Creates a MicroVM image from the specified code artifact and base image. The build is asynchronous — the image transitions from CREATING to CREATED on success, or CREATE_FAILED on failure. Use GetMicrovmImage to poll for completion.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseImageArn:
                  $ref: "#/components/schemas/NonBlankString"
                baseImageVersion:
                  $ref: "#/components/schemas/Version"
                buildRoleArn:
                  $ref: "#/components/schemas/RoleArn"
                description:
                  $ref: "#/components/schemas/String"
                codeArtifact:
                  $ref: "#/components/schemas/CodeArtifact"
                logging:
                  $ref: "#/components/schemas/Logging"
                egressNetworkConnectors:
                  $ref: "#/components/schemas/CreateMicrovmImageRequestEgressNetworkConnectorsList"
                cpuConfigurations:
                  $ref: "#/components/schemas/CpuConfigurationList"
                resources:
                  $ref: "#/components/schemas/ResourcesList"
                additionalOsCapabilities:
                  $ref: "#/components/schemas/CapabilityList"
                hooks:
                  $ref: "#/components/schemas/Hooks"
                environmentVariables:
                  $ref: "#/components/schemas/EnvironmentVariableMap"
                name:
                  $ref: "#/components/schemas/ImageName"
                tags:
                  $ref: "#/components/schemas/Tags"
                clientToken:
                  $ref: "#/components/schemas/CreateMicrovmImageRequestClientTokenString"
              required:
                - baseImageArn
                - buildRoleArn
                - codeArtifact
                - name
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMicrovmImageResponse"
    get:
      operationId: ListMicrovmImages
      description: Lists MicroVM images in the account with optional name filtering. We recommend using pagination to ensure that the operation returns quickly and successfully.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListMicrovmImagesRequestMaxResultsInteger"
          description: The maximum number of results to return in a single call.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/String"
          description: The pagination token from a previous call. Use this token to retrieve the next page of results.
        - name: nameFilter
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NonBlankString"
          description: Filters images whose name contains the specified string.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMicrovmImagesResponse"
  /2025-09-09/microvms/{microvm_identifier}/shell-auth-token:
    post:
      operationId: CreateMicrovmShellAuthToken
      description: Creates a shell authentication token for interactive shell access to a running MicroVM. The MicroVM must have been run with the SHELL_INGRESS network connector attached.
      parameters:
        - name: microvm_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmIdentifier"
          description: The ID of the MicroVM to create a shell authentication token for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expirationInMinutes:
                  $ref: "#/components/schemas/PositiveInteger"
              required:
                - expirationInMinutes
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMicrovmShellAuthTokenResponse"
  /2025-09-09/microvm-images/{image_identifier}:
    delete:
      operationId: DeleteMicrovmImage
      description: Deletes a MicroVM image. This operation is idempotent; deleting an image that has already been deleted succeeds without error.
      parameters:
        - name: image_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: The unique identifier (ARN or ID) of the MicroVM image to delete.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMicrovmImageOutput"
    get:
      operationId: GetMicrovmImage
      description: Retrieves the details of a MicroVM image, including its state, versions, and configuration.
      parameters:
        - name: image_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: The unique identifier (ARN or ID) of the MicroVM image to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMicrovmImageOutput"
    put:
      operationId: UpdateMicrovmImage
      description: Updates the configuration of a MicroVM image and triggers a new version build. This operation uses PUT semantics — all required fields (codeArtifact, baseImageArn, buildRoleArn) must be provided with every request.
      parameters:
        - name: image_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: The unique identifier (ARN or ID) of the MicroVM image to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseImageArn:
                  $ref: "#/components/schemas/NonBlankString"
                baseImageVersion:
                  $ref: "#/components/schemas/Version"
                buildRoleArn:
                  $ref: "#/components/schemas/RoleArn"
                description:
                  $ref: "#/components/schemas/String"
                codeArtifact:
                  $ref: "#/components/schemas/CodeArtifact"
                logging:
                  $ref: "#/components/schemas/Logging"
                egressNetworkConnectors:
                  $ref: "#/components/schemas/UpdateMicrovmImageRequestEgressNetworkConnectorsList"
                cpuConfigurations:
                  $ref: "#/components/schemas/CpuConfigurationList"
                resources:
                  $ref: "#/components/schemas/ResourcesList"
                additionalOsCapabilities:
                  $ref: "#/components/schemas/CapabilityList"
                hooks:
                  $ref: "#/components/schemas/Hooks"
                environmentVariables:
                  $ref: "#/components/schemas/EnvironmentVariableMap"
                clientToken:
                  $ref: "#/components/schemas/UpdateMicrovmImageRequestClientTokenString"
              required:
                - baseImageArn
                - buildRoleArn
                - codeArtifact
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMicrovmImageResponse"
  /2025-09-09/microvm-images/{image_identifier}/versions/{image_version}:
    delete:
      operationId: DeleteMicrovmImageVersion
      description: Deletes a specific version of a MicroVM image. This operation is idempotent; deleting a version that has already been deleted succeeds without error.
      parameters:
        - name: image_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: The unique identifier (ARN or ID) of the MicroVM image.
        - name: image_version
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NonBlankString"
          description: The version of the MicroVM image to delete.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMicrovmImageVersionOutput"
    get:
      operationId: GetMicrovmImageVersion
      description: Retrieves the details of a specific version of a MicroVM image, including its configuration, state, and build information.
      parameters:
        - name: image_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: The unique identifier (ARN or ID) of the MicroVM image.
        - name: image_version
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NonBlankString"
          description: The version of the MicroVM image to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMicrovmImageVersionOutput"
    patch:
      operationId: UpdateMicrovmImageVersion
      description: Updates the status of a specific MicroVM image version.
      parameters:
        - name: image_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: The unique identifier (ARN or ID) of the MicroVM image.
        - name: image_version
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NonBlankString"
          description: The version of the MicroVM image to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/MicrovmImageVersionStatus"
              required:
                - status
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMicrovmImageVersionResponse"
  /2025-09-09/microvms/{microvm_identifier}:
    get:
      operationId: GetMicrovm
      description: Retrieves the details of a specific MicroVM, including its state, endpoint, image information, and configuration. The state field is eventually consistent — determine readiness by connecting to the endpoint.
      parameters:
        - name: microvm_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmIdentifier"
          description: The ID of the MicroVM to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMicrovmResponse"
    delete:
      operationId: TerminateMicrovm
      description: Terminates a MicroVM. This operation is idempotent; terminating a MicroVM that has already been terminated succeeds without error.
      parameters:
        - name: microvm_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmIdentifier"
          description: The ID of the MicroVM to terminate.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateMicrovmResponse"
  /2025-09-09/microvm-images/{image_identifier}/versions/{image_version}/builds/{build_id}:
    get:
      operationId: GetMicrovmImageBuild
      description: Retrieves the details of a specific MicroVM image build, including its state, target architecture, and snapshot information.
      parameters:
        - name: image_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: The unique identifier (ARN or ID) of the MicroVM image.
        - name: image_version
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NonBlankString"
          description: The version of the MicroVM image.
        - name: build_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NonBlankString"
          description: The unique identifier of the build to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMicrovmImageBuildOutput"
  /2025-09-09/managed-microvm-images/{image_identifier}/versions:
    get:
      operationId: ListManagedMicrovmImageVersions
      description: Lists versions of a managed MicroVM image. We recommend using pagination to ensure that the operation returns quickly and successfully.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListManagedMicrovmImageVersionsInputMaxResultsInteger"
          description: The maximum number of results to return in a single call.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/String"
          description: The pagination token from a previous call. Use this token to retrieve the next page of results.
        - name: image_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: The unique identifier (ARN or ID) of the managed MicroVM image to list versions for.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListManagedMicrovmImageVersionsOutput"
  /2025-09-09/managed-microvm-images:
    get:
      operationId: ListManagedMicrovmImages
      description: Lists AWS managed MicroVM images available for use as base images. We recommend using pagination to ensure that the operation returns quickly and successfully.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListManagedMicrovmImagesInputMaxResultsInteger"
          description: The maximum number of results to return in a single call.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/String"
          description: The pagination token from a previous call. Use this token to retrieve the next page of results.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListManagedMicrovmImagesOutput"
  /2025-09-09/microvm-images/{image_identifier}/versions/{image_version}/builds:
    get:
      operationId: ListMicrovmImageBuilds
      description: Lists builds for a MicroVM image version with optional filtering by architecture and chipset. We recommend using pagination to ensure that the operation returns quickly and successfully.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListMicrovmImageBuildsInputMaxResultsInteger"
          description: The maximum number of results to return in a single call.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/String"
          description: The pagination token from a previous call. Use this token to retrieve the next page of results.
        - name: image_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: The unique identifier (ARN or ID) of the MicroVM image.
        - name: image_version
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NonBlankString"
          description: The version of the MicroVM image to list builds for.
        - name: architecture
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Architecture"
          description: Filters builds by target CPU architecture.
        - name: chipset
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Chipset"
          description: Filters builds by target chipset.
        - name: chipsetGeneration
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NonBlankString"
          description: Filters builds by target chipset generation.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMicrovmImageBuildsOutput"
  /2025-09-09/microvm-images/{image_identifier}/versions:
    get:
      operationId: ListMicrovmImageVersions
      description: Lists versions of a MicroVM image. We recommend using pagination to ensure that the operation returns quickly and successfully.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListMicrovmImageVersionsInputMaxResultsInteger"
          description: The maximum number of results to return in a single call.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/String"
          description: The pagination token from a previous call. Use this token to retrieve the next page of results.
        - name: image_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: The unique identifier (ARN or ID) of the MicroVM image to list versions for.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMicrovmImageVersionsOutput"
  /2025-09-09/microvms:
    get:
      operationId: ListMicrovms
      description: Lists MicroVMs in the account with optional filtering by image and version. We recommend using pagination to ensure that the operation returns quickly and successfully.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListMicrovmsRequestMaxResultsInteger"
          description: The maximum number of results to return in a single call.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/String"
          description: The pagination token from a previous call. Use this token to retrieve the next page of results.
        - name: imageIdentifier
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MicrovmImageIdentifier"
          description: Optional filter to list only MicroVMs running the specified image.
        - name: imageVersion
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/String"
          description: Optional filter to list only MicroVMs running the specified image version.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMicrovmsResponse"
    post:
      operationId: RunMicrovm
      description: Runs a new MicroVM from the specified image. The MicroVM starts in PENDING state and transitions to RUNNING once provisioning completes. To connect, generate an authentication token using CreateMicrovmAuthToken.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ingressNetworkConnectors:
                  $ref: "#/components/schemas/NetworkConnectorList"
                egressNetworkConnectors:
                  $ref: "#/components/schemas/NetworkConnectorList"
                imageIdentifier:
                  $ref: "#/components/schemas/MicrovmImageIdentifier"
                imageVersion:
                  $ref: "#/components/schemas/Version"
                executionRoleArn:
                  $ref: "#/components/schemas/RoleArn"
                idlePolicy:
                  $ref: "#/components/schemas/IdlePolicy"
                logging:
                  $ref: "#/components/schemas/Logging"
                runHookPayload:
                  $ref: "#/components/schemas/RunMicrovmRequestRunHookPayloadString"
                maximumDurationInSeconds:
                  $ref: "#/components/schemas/RunMicrovmRequestMaximumDurationInSecondsInteger"
                clientToken:
                  $ref: "#/components/schemas/RunMicrovmRequestClientTokenString"
              required:
                - imageIdentifier
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunMicrovmResponse"
  /2017-03-31/tags/{resource}:
    get:
      operationId: ListTags
      description: Lists the tags associated with a Lambda MicroVM resource.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaggableResource"
          description: The ARN of the resource to list tags for.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTagsResponse"
    post:
      operationId: TagResource
      description: Adds tags to a Lambda MicroVM resource.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaggableResource"
          description: The ARN of the resource to tag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Tags:
                  $ref: "#/components/schemas/Tags"
      responses:
        "204":
          description: Success
    delete:
      operationId: UntagResource
      description: Removes tags from a Lambda MicroVM resource.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaggableResource"
          description: The ARN of the resource to remove tags from.
        - name: tagKeys
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TagKeyList"
          description: The list of tag keys to remove from the resource.
      responses:
        "204":
          description: Success
  /2025-09-09/microvms/{microvm_identifier}/resume:
    post:
      operationId: ResumeMicrovm
      description: Resumes a suspended MicroVM, restoring it to RUNNING state with all state intact. The MicroVM must be in SUSPENDED state.
      parameters:
        - name: microvm_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmIdentifier"
          description: The ID of the MicroVM to resume.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeMicrovmResponse"
  /2025-09-09/microvms/{microvm_identifier}/suspend:
    post:
      operationId: SuspendMicrovm
      description: Suspends a running MicroVM, preserving its full memory and disk state. The MicroVM transitions through SUSPENDING to SUSPENDED. To restore, call ResumeMicrovm or send traffic to the endpoint if autoResumeEnabled is true.
      parameters:
        - name: microvm_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MicrovmIdentifier"
          description: The ID of the MicroVM to suspend.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuspendMicrovmResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    MicrovmIdentifier:
      description: The ARN or ID of the MicroVm
      type: string
      minLength: 1
      maxLength: 256
    PositiveInteger:
      type: integer
      minimum: 1
    ListOfPortSpecification:
      description: A list of port specifications.
      type: array
      items:
        $ref: "#/components/schemas/PortSpecification"
    PortSpecification:
      description: Specifies which ports are accessible on a MicroVM. Only one of the port specification options can be set.
      type: object
      properties:
        port:
          $ref: "#/components/schemas/PortNumber"
          description: A single port number.
        range:
          $ref: "#/components/schemas/PortRange"
          description: A range of ports.
        allPorts:
          $ref: "#/components/schemas/Unit"
          description: Indicates that all ports are accessible.
    PortNumber:
      description: Represents a single port.
      type: integer
      minimum: 1
      maximum: 65535
    PortRange:
      description: Specifies a range of ports.
      type: object
      properties:
        startPort:
          $ref: "#/components/schemas/PortNumber"
          description: The starting port number of the range.
        endPort:
          $ref: "#/components/schemas/PortNumber"
          description: The ending port number of the range.
      required:
        - startPort
        - endPort
    Unit:
      type: object
    CreateMicrovmAuthTokenResponse:
      type: object
      properties:
        authToken:
          type: object
          properties: {}
          description: A map containing the authentication token. Use the value at key "X-aws-proxy-auth" as the header value when connecting to the MicroVM endpoint.
      required:
        - authToken
    NonBlankString:
      description: A string which is not empty or blank (only whitespace).
      type: string
      minLength: 1
      maxLength: 2048
      pattern: "[^\\s]+"
    Version:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: "[^\\s]+"
    RoleArn:
      description: The ARN of an IAM role that the service assumes to perform actions on behalf of the caller.
      type: string
      minLength: 20
      maxLength: 2048
      pattern: arn:aws[a-z\-]*:iam::[0-9]{12}:role/?[a-zA-Z_0-9+=,.@\-_/]+
    String:
      type: string
    CodeArtifact:
      description: Contains the location of the code artifact for a MicroVM image.
      type: object
      properties:
        uri:
          $ref: "#/components/schemas/NonBlankString"
