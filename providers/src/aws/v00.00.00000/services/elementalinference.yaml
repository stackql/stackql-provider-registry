openapi: 3.0.0
info:
  version: "2018-11-14"
  title: AWS Elemental Inference
  description: AWS Elemental Inference
  x-serviceName: elemental-inference
  x-serviceAlias: elementalinference
  x-protocol: rest-json
  x-apiVersion: "2018-11-14"
  x-endpointPrefix: elemental-inference
servers:
  - url: https://elemental-inference.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for elementalinference
paths:
  /v1/feed/{id}/associate:
    post:
      operationId: AssociateFeed
      description: "Associates a resource with the feed. The resource provides the input that Elemental Inference needs in order to perform an Elemental Inference feature, such as cropping video. You always provide the resource by associating it with a feed. You can associate only one resource with each feed. With an association, a specific source media is claiming ownership of the feed. AssociateFeed is a PATCH operation, which means that you can include only parameters that you want to change. Parameters that you don't include will not be affected by the operation. Specifically: You can add more outputs to the existing outputs. New outputs will be appended. You can't modify an existing output (for example to change its name). Instead, use UpdateFeed. You can't delete an existing output. Instead, use UpdateFeed. Also note that you can't change the feed name with AssociateFeed. Instead, use UpdateFeed."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/FeedId"
          description: The ID of the feed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                associatedResourceName:
                  $ref: "#/components/schemas/AssociatedResourceName"
                outputs:
                  $ref: "#/components/schemas/CreateOutputList"
                dryRun:
                  $ref: "#/components/schemas/Boolean"
              required:
                - associatedResourceName
                - outputs
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssociateFeedResponse"
  /v1/dictionary:
    post:
      operationId: CreateDictionary
      description: Creates a custom dictionary for improving transcription accuracy. A dictionary contains custom words and phrases that the ASR engine might not recognize, such as brand names, technical terms, or proper nouns. You can reference a dictionary when configuring a smart subtitles output.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/ResourceName"
                language:
                  $ref: "#/components/schemas/DictionaryLanguage"
                entries:
                  $ref: "#/components/schemas/DictionaryEntriesPayload"
                tags:
                  $ref: "#/components/schemas/TagMap"
              required:
                - name
                - language
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDictionaryResponse"
  /v1/feed:
    post:
      operationId: CreateFeed
      description: "Creates a feed. The feed is the target for the live media stream that is being sent by the calling application. An example of a calling application is AWS Elemental MediaLive. The key contents of the feed is an array of outputs. Each output represents an Elemental Inference feature. After you create the feed, you must associate a resource with the feed. At that point, you will have a useable feed: resource - feed - output or outputs."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/ResourceName"
                accessRoleArn:
                  $ref: "#/components/schemas/IamRoleArn"
                outputs:
                  $ref: "#/components/schemas/CreateOutputList"
                tags:
                  $ref: "#/components/schemas/TagMap"
              required:
                - name
                - outputs
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFeedResponse"
  /v1/dictionary/{id}:
    delete:
      operationId: DeleteDictionary
      description: Deletes the specified dictionary. You cannot delete a dictionary that is referenced by a feed. You must first remove the dictionary reference from the feed's subtitling configuration.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DictionaryId"
          description: The ID of the dictionary to delete.
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDictionaryResponse"
    get:
      operationId: GetDictionary
      description: Retrieves information about the specified dictionary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DictionaryId"
          description: The ID of the dictionary to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDictionaryResponse"
    patch:
      operationId: UpdateDictionary
      description: Updates the specified dictionary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DictionaryId"
          description: The ID of the dictionary to update.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/ResourceName"
                language:
                  $ref: "#/components/schemas/DictionaryLanguage"
                entries:
                  $ref: "#/components/schemas/DictionaryEntriesPayload"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDictionaryResponse"
  /v1/feed/{id}:
    delete:
      operationId: DeleteFeed
      description: Deletes the specified feed. You can delete the feed at any time. Elemental Inference doesn't block you from deleting a feed when the calling application is calling PutMedia or GetMetadata on that feed, although both these calls will start to fail. For more information about managing inactive feeds, see the Elemental Inference User Guide.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/FeedId"
          description: The ID of the feed.
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFeedResponse"
    get:
      operationId: GetFeed
      description: Retrieves information about the specified feed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/FeedId"
          description: The ID of the feed to query.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFeedResponse"
    put:
      operationId: UpdateFeed
      description: Updates the name and/or outputs in a feed. UpdateFeed is a PUT operation, which means that the payload that you specify completely overwrites the existing payload. This means that if you want to touch the array of outputs, you must pass in the full new list. So you must omit outputs you want to delete, and include outputs you want to add or modify. If you want to patch the array of outputs to make selective additions, use AssociateFeed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/FeedId"
          description: The ID of the feed to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/ResourceName"
                accessRoleArn:
                  $ref: "#/components/schemas/IamRoleArn"
                outputs:
                  $ref: "#/components/schemas/UpdateOutputList"
              required:
                - name
                - outputs
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateFeedResponse"
  /v1/feed/{id}/disassociate:
    post:
      operationId: DisassociateFeed
      description: Releases the resource (the source media) that is associated with this feed. The outputs in the feed become DISABLED.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/FeedId"
          description: The ID of the feed where you want to release the resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                associatedResourceName:
                  $ref: "#/components/schemas/AssociatedResourceName"
                dryRun:
                  $ref: "#/components/schemas/Boolean"
              required:
                - associatedResourceName
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisassociateFeedResponse"
  /v1/dictionary/{id}/entries/export:
    get:
      operationId: ExportDictionaryEntries
      description: Exports the entries from the specified dictionary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DictionaryId"
          description: The ID of the dictionary whose entries you want to export.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportDictionaryEntriesResponse"
  /v1/dictionaries:
    get:
      operationId: ListDictionaries
      description: Lists the dictionaries in your account.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListDictionariesRequestMaxResultsInteger"
          description: "The maximum number of results to return per API request. Valid range: 1 to 100."
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/String"
          description: The token that identifies the next batch of results to return.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDictionariesResponse"
  /v1/feeds:
    get:
      operationId: ListFeeds
      description: Displays a list of feeds that belong to this AWS account.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListFeedsRequestMaxResultsInteger"
          description: "The maximum number of results to return per API request. For example, you submit a list request with MaxResults set at 5. Although 20 items match your request, the service returns no more than the first 5 items. (The service also returns a NextToken value that you can use to fetch the next batch of results.) The service might return fewer results than the MaxResults value. If MaxResults is not included in the request, the service defaults to pagination with a maximum of 10 results per page. Valid Range: Minimum value of 1. Maximum value of 1000."
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/String"
          description: The token that identifies the batch of results that you want to see. For example, you submit a ListFeeds request with MaxResults set at 5. The service returns the first batch of results (up to 5) and a NextToken value. To see the next batch of results, you can submit the ListFeeds request a second time and specify the NextToken value.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFeedsResponse"
  /v1/tags/{resource_arn}:
    get:
      operationId: ListTagsForResource
      description: List all tags that are on an Elemental Inference resource in the current region.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceArn"
          description: The ARN of the resource whose tags you want to query.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTagsForResourceResponse"
    post:
      operationId: TagResource
      description: Associates the specified tags to the resource identified by the specified resourceArn in the current region. If existing tags on a resource are not specified in the request parameters, they are not changed. When a resource is deleted, the tags associated with that resource are also deleted.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceArn"
          description: The ARN of the resource where you want to add tags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  $ref: "#/components/schemas/TagMap"
              required:
                - tags
      responses:
        "204":
          description: Success
    delete:
      operationId: UntagResource
      description: Deletes specified tags from the specified resource in the current region.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceArn"
          description: The ARN of the resource where you want to delete one or more tags.
        - name: tagKeys
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TagKeyList"
          description: The keys of the tags to delete.
      responses:
        "204":
          description: Success
  /v1/fixtures:
    post:
      operationId: SearchFixtures
      description: "Searches for the fixtures (sports events, such as a specific basketball game) that are available for a sport in a date window. Each fixture in the response includes a fixtureId that you specify in the clipping output of a feed, so that Elemental Inference maps the event data for that fixture onto the clipping metadata. This operation is paginated: if there are more fixtures than fit in one page, the response includes a nextToken that you pass in a subsequent request."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sport:
                  $ref: "#/components/schemas/DataSourceSport"
                startDate:
                  $ref: "#/components/schemas/FixtureDate"
                endDate:
                  $ref: "#/components/schemas/FixtureDate"
                filters:
                  $ref: "#/components/schemas/SearchFilterList"
                maxResults:
                  $ref: "#/components/schemas/SearchFixturesRequestMaxResultsInteger"
                nextToken:
                  $ref: "#/components/schemas/String"
              required:
                - sport
                - startDate
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchFixturesResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    FeedId:
      type: string
      pattern: "[a-z0-9]{19}"
    AssociatedResourceName:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: "[\\w \\-\\.',@:;/]*"
    CreateOutputList:
      type: array
      items:
        $ref: "#/components/schemas/CreateOutput"
    CreateOutput:
      description: Contains configuration information about one output in a feed. It is used in the AssociateFeed and the CreateFeed actions.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ResourceName"
          description: A name for the output.
        outputConfig:
          $ref: "#/components/schemas/OutputConfig"
          description: A typed property for an output in a feed. It identifies the action for Elemental Inference to perform. It also provides a repository for the results of that action. For example, CroppingConfig output will contain the metadata for the crop feature.
        status:
          $ref: "#/components/schemas/OutputStatus"
          description: The status to assign to the output.
        description:
          $ref: "#/components/schemas/ResourceDescription"
          description: A description for the output.
      required:
        - name
        - outputConfig
        - status
    ResourceName:
      type: string
      pattern: "[a-zA-Z0-9]([a-zA-Z0-9-_]{0,126}[a-zA-Z0-9])?"
    OutputConfig:
      description: Contains one typed output. It is used in the CreateOutput, GetOutput, and Update Output structures.
      type: object
      properties:
        cropping:
          $ref: "#/components/schemas/CroppingConfig"
          description: The output config type that applies to the cropping feature.
        clipping:
          $ref: "#/components/schemas/ClippingConfig"
          description: The output config type that applies to the clipping feature.
        subtitling:
          $ref: "#/components/schemas/SubtitlingConfig"
          description: The output config type that applies to the smart subtitling feature.
    CroppingConfig:
      description: A type of OutputConfig, used when the output in a feed is for the crop feature.
      type: object
      properties:
        templateGroups:
          $ref: "#/components/schemas/TemplateGroupList"
          description: An array of template groups for the crop output. Each template group provides the graphics-compositing templates that Elemental Inference applies to the cropped video. You can specify from 1 to 4 template groups.
    TemplateGroupList:
      type: array
      items:
        $ref: "#/components/schemas/TemplateGroup"
    TemplateGroup:
      description: A named set of graphics-compositing templates used by the crop feature, specified in the templateGroups array of a CroppingConfig.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ResourceName"
          description: A name for the template group.
        templateUris:
          $ref: "#/components/schemas/TemplateUriList"
          description: An array of Amazon S3 URIs that point to the graphics-compositing templates for this group. You can specify 1 or 2 URIs. Each URI must be in the form s3://bucket-name/key. Elemental Inference reads these templates using the IAM role that you specify in accessRoleArn.
      required:
        - name
        - templateUris
    TemplateUriList:
      type: array
      items:
        $ref: "#/components/schemas/S3Uri"
    S3Uri:
      type: string
      minLength: 10
      maxLength: 255
      pattern: s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/.+
    ClippingConfig:
      description: A type of OutputConfig, used when the output in a feed is for the clip feature.
      type: object
      properties:
        callbackMetadata:
          $ref: "#/components/schemas/ResourceDescription"
          description: A string that you want Elemental Inference to always include in the event clipping metadata for this output. The string might identify the sports event in the source media, for example.
        dataSourceConfiguration:
          $ref: "#/components/schemas/DataSourceConfiguration"
          description: The data source to map onto this clipping output. This parameter is optional. When you include this parameter, Elemental Inference reads the event data for the fixture that you specify, and includes that data in the event clipping metadata for this output. If you omit this parameter, Elemental Inference doesn't map a data source onto this output.
    ResourceDescription:
      type: string
      minLength: 0
      maxLength: 1024
      pattern: "[\\w \\-\\.',@:;]*"
    DataSourceConfiguration:
      description: Contains the data source configuration for a clipping output. It identifies the fixture whose event data Elemental Inference maps onto the clipping metadata. It is used in the dataSourceConfiguration property of a ClippingConfig.
      type: object
      properties:
        fixtureId:
          $ref: "#/components/schemas/FixtureId"
          description: The ID of the fixture whose event data you want Elemental Inference to map onto this clipping output. The fixture should be the sports event in the source media that the feed is processing. To obtain this ID, use the SearchFixtures operation to find the fixture, then use the fixtureId from the matching FixtureSummary.
      required:
        - fixtureId
    FixtureId:
      type: string
      minLength: 1
      maxLength: 128
    SubtitlingConfig:
      description: A type of OutputConfig, used when the output in a feed is for the smart subtitling feature. smart subtitling uses automatic speech recognition (ASR) to generate live TTML subtitles from the audio in your source media.
      type: object
      properties:
        language:
          $ref: "#/components/schemas/TranscriptionLanguage"
          description: "The language of the audio in the source media. Elemental Inference uses this setting to optimize transcription accuracy. Specify the language using an ISO 639-2/T three-letter code, optionally with a region subtag. Supported values: eng, eng-au, eng-gb, eng-us, fra, ita, deu, spa, por."
        aspectRatio:
          $ref: "#/components/schemas/AspectRatio"
          description: The aspect ratio of the output video, specified as width and height integer values. Elemental Inference uses the aspect ratio to determine subtitle layout and line lengths.
        dictionary:
          $ref: "#/components/schemas/DictionaryId"
          description: The ID of a custom dictionary to improve transcription accuracy for domain-specific terminology. Use the CreateDictionary operation to create a dictionary.
        profanityFilter:
          $ref: "#/components/schemas/ProfanityFilterMode"
          description: "Controls how profanity is handled in the generated subtitles. Valid values: DISABLED (no filtering, default), CENSOR (replace profanity with asterisks), DROP (remove profanity from the transcript)."
      required:
        - language
    TranscriptionLanguage:
      type: string
      enum:
        - eng
        - eng-au
        - eng-gb
        - eng-us
        - fra
        - ita
        - deu
        - spa
        - por
    AspectRatio:
      description: The width and height of the output video. Used in SubtitlingConfig to determine subtitle layout.
      type: object
      properties:
        width:
          $ref: "#/components/schemas/Integer"
          description: The width component of the aspect ratio (for example, 16 in a 16:9 ratio).
        height:
          $ref: "#/components/schemas/Integer"
          description: The height component of the aspect ratio (for example, 9 in a 16:9 ratio).
      required:
        - width
        - height
    Integer:
      type: integer
    DictionaryId:
      type: string
      minLength: 1
      maxLength: 19
      pattern: "[a-zA-Z0-9]+"
    ProfanityFilterMode:
      type: string
      enum:
        - DISABLED
        - CENSOR
        - DROP
    OutputStatus:
      type: string
      enum:
        - ENABLED
        - DISABLED
    Boolean:
      type: boolean
    AssociateFeedResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/FeedArn"
          description: The ARN of the feed.
        id:
          $ref: "#/components/schemas/FeedId"
          description: The ID of the feed.
      required:
        - arn
        - id
    FeedArn:
      type: string
    DictionaryLanguage:
      type: string
      enum:
        - eng
        - fra
        - ita
        - deu
        - spa
        - por
    DictionaryEntriesPayload:
      type: string
      minLength: 0
      maxLength: 40960
    TagMap:
      type: object
      properties: {}
    CreateDictionaryResponse:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ResourceName"
          description: The name that you specified in the request.
        arn:
          $ref: "#/components/schemas/DictionaryArn"
          description: The ARN of the dictionary.
        id:
          $ref: "#/components/schemas/DictionaryId"
          description: A unique ID that Elemental Inference assigns to the dictionary.
        language:
          $ref: "#/components/schemas/DictionaryLanguage"
          description: The language of the dictionary.
        status:
          $ref: "#/components/schemas/DictionaryStatus"
          description: The current status of the dictionary. After creation succeeds, the status will be AVAILABLE.
        references:
          $ref: "#/components/schemas/FeedReferences"
          description: A list of feed IDs that reference this dictionary.
        tags:
          type: object
          properties: {}
          description: Any tags that you included when you created the dictionary.
      required:
        - name
        - arn
        - id
        - language
        - status
    DictionaryArn:
      type: string
    DictionaryStatus:
      type: string
      enum:
        - CREATING
        - AVAILABLE
        - REFERENCED
        - DELETING
        - DELETED
    FeedReferences:
      type: array
      items:
        $ref: "#/components/schemas/FeedId"
    IamRoleArn:
      type: string
      minLength: 32
      maxLength: 255
      pattern: arn:aws[a-z\-]*:iam::[0-9]{12}:role/.+
    CreateFeedResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/FeedArn"
          description: A unique ARN that Elemental Inference assigns to the feed.
        name:
          $ref: "#/components/schemas/ResourceName"
          description: The name that you specified in the request.
        id:
          $ref: "#/components/schemas/FeedId"
          description: A unique ID that Elemental Inference assigns to the feed.
        dataEndpoints:
          $ref: "#/components/schemas/StringList"
          description: An array of endpoints for the feed. Typically, there is only one endpoint. The feed receives source media at this endpoint (when the calling application calls PutMedia) and returns the resulting metadata to this endpoint (when the calling application calls GetMetadata).
        outputs:
          $ref: "#/components/schemas/GetOutputList"
          description: Repeats the outputs that you specified in the request.
        status:
          $ref: "#/components/schemas/FeedStatus"
          description: The current status of the feed. After creation of the feed has succeeded, the status will be AVAILABLE.
        association:
          $ref: "#/components/schemas/FeedAssociation"
          description: The association for this feed. When you create the feed, this property is empty. You must associate a resource with the feed using AssociateFeed or UpdateFeed.
        tags:
          type: object
          properties: {}
          description: Any tags that you included when you created the feed.
      required:
        - arn
        - name
        - id
        - dataEndpoints
        - outputs
        - status
    StringList:
      type: array
      items:
        $ref: "#/components/schemas/String"
    String:
      type: string
    GetOutputList:
      type: array
      items:
        $ref: "#/components/schemas/GetOutput"
    GetOutput:
      description: Contains configuration information about one output in a feed. It is used in the GetFeed response.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ResourceName"
          description: The name of the output.
        outputConfig:
          $ref: "#/components/schemas/OutputConfig"
          description: A typed property for an output in a feed. It identifies the action for Elemental Inference to perform. It also provides a repository for the results of that action. For example, CroppingConfig output will contain the metadata for the crop feature.
        status:
          $ref: "#/components/schemas/OutputStatus"
          description: The status of the output.
        description:
          $ref: "#/components/schemas/ResourceDescription"
          description: The description of the output.
        fromAssociation:
          $ref: "#/components/schemas/Boolean"
          description: True means that the output was originally created in the feed using AssociateFeed. False means it was created using CreateFeed or UpdateFeed. You will need this value if you use UpdateFeed to modify the list of outputs in the feed.
      required:
        - name
        - outputConfig
        - status
    FeedStatus:
      type: string
      enum:
        - CREATING
        - AVAILABLE
        - ACTIVE
        - UPDATING
        - DELETING
        - DELETED
        - ARCHIVED
    FeedAssociation:
      description: Contains information about the resource that is associated with a feed. It is used in the FeedSummary that is used in the response of a ListFeeds action.
      type: object
      properties:
        associatedResourceName:
          $ref: "#/components/schemas/AssociatedResourceName"
          description: The name of the associated resource.
      required:
        - associatedResourceName
    DeleteDictionaryResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/DictionaryArn"
          description: The ARN of the deleted dictionary.
        id:
          $ref: "#/components/schemas/DictionaryId"
          description: The ID of the deleted dictionary.
        status:
          $ref: "#/components/schemas/DictionaryStatus"
          description: The status of the dictionary after deletion.
      required:
        - arn
        - id
        - status
    DeleteFeedResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/FeedArn"
          description: The ARN of the deleted feed.
        id:
          $ref: "#/components/schemas/FeedId"
          description: The ID of the deleted feed.
        status:
          $ref: "#/components/schemas/FeedStatus"
          description: The current status of the feed. When deletion of the feed has succeeded, the status will be DELETED.
      required:
        - arn
        - id
        - status
    DisassociateFeedResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/FeedArn"
          description: The ARN of the feed.
        id:
          $ref: "#/components/schemas/FeedId"
          description: The ID of the feed.
      required:
        - arn
        - id
    ExportDictionaryEntriesResponse:
      type: object
      properties:
        entries:
          $ref: "#/components/schemas/DictionaryEntriesPayload"
          description: The dictionary entries payload.
    GetDictionaryResponse:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ResourceName"
          description: The name of the dictionary.
        arn:
          $ref: "#/components/schemas/DictionaryArn"
          description: The ARN of the dictionary.
        id:
          $ref: "#/components/schemas/DictionaryId"
          description: The ID of the dictionary.
        language:
          $ref: "#/components/schemas/DictionaryLanguage"
          description: The language of the dictionary.
        status:
          $ref: "#/components/schemas/DictionaryStatus"
          description: The current status of the dictionary.
        references:
          $ref: "#/components/schemas/FeedReferences"
          description: A list of feed IDs that reference this dictionary.
        tags:
          type: object
          properties: {}
          description: The tags associated with the dictionary.
      required:
        - name
        - arn
        - id
        - language
        - status
    GetFeedResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/FeedArn"
          description: The ARN of the feed.
        name:
          $ref: "#/components/schemas/ResourceName"
          description: The name of the feed.
        id:
          $ref: "#/components/schemas/FeedId"
          description: The ID of the feed.
        dataEndpoints:
          $ref: "#/components/schemas/StringList"
          description: The dataEndpoints of the feed.
        outputs:
          $ref: "#/components/schemas/GetOutputList"
          description: An array of the outputs in the feed.
        status:
          $ref: "#/components/schemas/FeedStatus"
          description: The status of the feed.
        association:
          $ref: "#/components/schemas/FeedAssociation"
          description: Information about the resource that is associated with the feed. It's possible that there is no associated resource. This is not an error.
        tags:
          type: object
          properties: {}
          description: A list of the tags, if any, for the feed.
      required:
        - arn
        - name
        - id
        - dataEndpoints
        - outputs
        - status
    ListDictionariesRequestMaxResultsInteger:
      type: integer
      minimum: 1
      maximum: 100
    ListDictionariesResponse:
      type: object
      properties:
        dictionaries:
          $ref: "#/components/schemas/DictionarySummaryList"
          description: A list of DictionarySummary objects.
        nextToken:
          $ref: "#/components/schemas/String"
          description: The token to use to retrieve the next batch of results.
      required:
        - dictionaries
    DictionarySummaryList:
      type: array
      items:
        $ref: "#/components/schemas/DictionarySummary"
    DictionarySummary:
      description: Contains summary information about a dictionary. Used in the ListDictionaries response.
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/DictionaryArn"
          description: The ARN of the dictionary.
        id:
          $ref: "#/components/schemas/DictionaryId"
          description: The ID of the dictionary.
        name:
          $ref: "#/components/schemas/ResourceName"
          description: The name of the dictionary.
        language:
          $ref: "#/components/schemas/DictionaryLanguage"
          description: The language of the dictionary.
        status:
          $ref: "#/components/schemas/DictionaryStatus"
          description: The status of the dictionary.
      required:
        - arn
        - id
        - name
        - language
        - status
    ListFeedsRequestMaxResultsInteger:
      type: integer
      minimum: 1
      maximum: 100
    ListFeedsResponse:
      type: object
      properties:
        feeds:
          $ref: "#/components/schemas/FeedSummaryList"
          description: A list of FeedSummary objects.
        nextToken:
          $ref: "#/components/schemas/String"
          description: The token that identifies the batch of results that you want to see. For example, you submit a list request with MaxResults set at 5. The service returns the first batch of results (up to 5) and a NextToken value. To see the next batch of results, you can submit the list request a second time and specify the NextToken value.
      required:
        - feeds
    FeedSummaryList:
      type: array
      items:
        $ref: "#/components/schemas/FeedSummary"
    FeedSummary:
      description: Contains configuration information about a feed. It is used in the ListFeeds response.
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/FeedArn"
          description: The ARN of the feed.
        id:
          $ref: "#/components/schemas/FeedId"
          description: The ID of the feed.
        name:
          $ref: "#/components/schemas/ResourceName"
          description: The name of the feed
        association:
          $ref: "#/components/schemas/FeedAssociation"
          description: The resource, if any, associated with the feed.
        status:
          $ref: "#/components/schemas/FeedStatus"
          description: The status of the feed.
      required:
        - arn
        - id
        - name
        - status
    ResourceArn:
      type: string
      pattern: arn:aws[a-z\-]*:elemental-inference[a-z\-]*:[a-z0-9\-]+:[0-9]{12}:(feed|dictionary)/[a-zA-Z0-9]{1,19}
    ListTagsForResourceResponse:
      type: object
      properties:
        tags:
          type: object
          properties: {}
          description: A list of the tags that belong to this resource.
    DataSourceSport:
      type: string
      enum:
        - basketball
        - american-football
    FixtureDate:
      type: string
      pattern: \d{4}-\d{2}-\d{2}
    SearchFilterList:
      type: array
      items:
        $ref: "#/components/schemas/SearchFilter"
    SearchFilter:
      description: A filter for a fixture search. It is used in the filters array of a SearchFixtures request.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/FilterName"
          description: "The dimension of the fixture to filter on. Valid values: COMPETITOR."
        values:
          $ref: "#/components/schemas/FilterValueList"
          description: An array of values to match in the dimension that you specified in name. You can specify up to 10 values. A fixture appears in the results if it matches at least one of these values.
      required:
        - name
        - values
    FilterName:
      type: string
      enum:
        - COMPETITOR
    FilterValueList:
      type: array
      items:
        $ref: "#/components/schemas/FilterValue"
    FilterValue:
      type: string
      minLength: 1
      maxLength: 256
    SearchFixturesRequestMaxResultsInteger:
      type: integer
      minimum: 1
      maximum: 100
    SearchFixturesResponse:
      type: object
      properties:
        fixtures:
          $ref: "#/components/schemas/FixtureSummaryList"
          description: An array of FixtureSummary objects, one for each fixture that matches the search. The array is empty if no fixtures match.
        nextToken:
          $ref: "#/components/schemas/String"
          description: The token that identifies the next batch of results. To see the next batch, submit the SearchFixtures request again, with the same search criteria, and specify this value in nextToken. This parameter is absent when there are no more results to return.
      required:
        - fixtures
    FixtureSummaryList:
      type: array
      items:
        $ref: "#/components/schemas/FixtureSummary"
    FixtureSummary:
      description: Contains information about one fixture. It is used in the SearchFixtures response. Elemental Inference relays the information in this structure from the data source, so that you can identify the fixture that matches your source media.
      type: object
      properties:
        fixtureId:
          $ref: "#/components/schemas/FixtureId"
          description: The ID of the fixture. Specify this ID in the clipping output of a feed, to identify the fixture whose event data you want Elemental Inference to map onto the clipping metadata.
        name:
          $ref: "#/components/schemas/String"
          description: The name of the fixture, as provided by the data source. For example, the names of the two competing teams.
        fixtureGroup:
          $ref: "#/components/schemas/String"
          description: The group that the fixture belongs to, such as the competition, league, or tournament. The data source doesn't provide this information for every fixture.
        scheduledStart:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The scheduled start time of the fixture, as provided by the data source. The actual start time might differ.
        status:
          $ref: "#/components/schemas/String"
          description: The status of the fixture in its lifecycle, as provided by the data source. For example, Scheduled or Completed.
        competitors:
          $ref: "#/components/schemas/CompetitorList"
          description: An array of the competitors (the teams or individuals) in the fixture.
      required:
        - fixtureId
        - name
        - status
        - competitors
    SyntheticTimestamp_date_time:
      type: string
      format: date-time
    CompetitorList:
      type: array
      items:
        $ref: "#/components/schemas/Competitor"
    Competitor:
      description: Contains information about one competitor in a fixture. It is used in the FixtureSummary that is in the SearchFixtures response.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/String"
          description: The name of the competitor, as provided by the data source.
        isHome:
          $ref: "#/components/schemas/Boolean"
          description: Specifies whether this competitor is the home side in the fixture. If true, this competitor is the home side. If false, this competitor is the away side.
    TagKeyList:
      type: array
      items:
        $ref: "#/components/schemas/TagKey"
    TagKey:
      type: string
      minLength: 1
      maxLength: 128
    UpdateDictionaryResponse:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ResourceName"
          description: The updated or original name of the dictionary.
        arn:
          $ref: "#/components/schemas/DictionaryArn"
          description: The ARN of the dictionary.
        id:
          $ref: "#/components/schemas/DictionaryId"
          description: The ID of the dictionary.
        language:
          $ref: "#/components/schemas/DictionaryLanguage"
          description: The updated or original language of the dictionary.
        status:
          $ref: "#/components/schemas/DictionaryStatus"
          description: The current status of the dictionary.
        references:
          $ref: "#/components/schemas/FeedReferences"
          description: A list of feed IDs that reference this dictionary.
        tags:
          type: object
          properties: {}
          description: Any tags associated with the dictionary.
      required:
        - name
        - arn
        - id
        - language
        - status
    UpdateOutputList:
      type: array
      items:
        $ref: "#/components/schemas/UpdateOutput"
    UpdateOutput:
      description: Contains configuration information about one output in a feed. It is used in the UpdateFeed action.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ResourceName"
          description: The name of the output.
        outputConfig:
          $ref: "#/components/schemas/OutputConfig"
          description: A typed property for an output in a feed. It identifies the action for Elemental Inference to perform. It also provides a repository for the results of that action. For example, CroppingConfig output will contain the metadata for the crop feature.
        status:
          $ref: "#/components/schemas/OutputStatus"
          description: The status of the output.
        description:
          $ref: "#/components/schemas/ResourceDescription"
          description: A description of the output.
        fromAssociation:
          $ref: "#/components/schemas/Boolean"
          description: Elemental Inference originally sets this parameter to True if this output was created by AssociateFeed or to False if this output was created by CreateFeed or UpdateFeed. You must not change this value. Therefore, use GetFeed to determine the current value. Then in the UpdateFeed request, if the current value is True, include this parameter with a value of True. If it's False, omit the parameter.
      required:
        - name
        - outputConfig
        - status
    UpdateFeedResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/FeedArn"
          description: The ARN of the feed.
        name:
          $ref: "#/components/schemas/ResourceName"
          description: The updated or original name of the feed.
        id:
          $ref: "#/components/schemas/FeedId"
          description: The ID of the feed.
        dataEndpoints:
          $ref: "#/components/schemas/StringList"
          description: The data endpoints of the feed.
        outputs:
          $ref: "#/components/schemas/GetOutputList"
          description: The array of outputs in the feed. You might have left this array unchanged, or you might have changed it.
        status:
          $ref: "#/components/schemas/FeedStatus"
          description: The status of the feed.
        association:
          $ref: "#/components/schemas/FeedAssociation"
          description: Information about the resource that is associated with the feed, if any.
        tags:
          type: object
          properties: {}
          description: The tags associated with the feed.
      required:
        - arn
        - name
        - id
        - dataEndpoints
        - outputs
        - status
