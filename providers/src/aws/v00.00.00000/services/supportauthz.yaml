openapi: 3.0.0
info:
  version: "2026-06-30"
  title: SupportAuthZ
  description: SupportAuthZ
  x-serviceName: supportauthz
  x-serviceAlias: supportauthz
  x-protocol: rest-json
  x-apiVersion: "2026-06-30"
  x-endpointPrefix: supportauthz
servers:
  - url: https://supportauthz.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for supportauthz
paths:
  /support-permits:
    post:
      operationId: CreateSupportPermit
      description: Creates a support permit that authorizes an AWS support operator to perform specified actions on specified resources. The permit is cryptographically signed using a customer-managed AWS KMS key (ECC_NIST_P384, SIGN_VERIFY) to ensure non-repudiation.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permit:
                  $ref: "#/components/schemas/Permit"
                name:
                  $ref: "#/components/schemas/Name"
                description:
                  $ref: "#/components/schemas/Description"
                signingKeyInfo:
                  $ref: "#/components/schemas/SigningKeyInfo"
                supportCaseDisplayId:
                  $ref: "#/components/schemas/SupportCaseDisplayId"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
                tags:
                  $ref: "#/components/schemas/Tags"
              required:
                - permit
                - name
                - signingKeyInfo
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSupportPermitOutput"
    get:
      operationId: ListSupportPermits
      description: Lists all support permits in the caller's account. Use pagination to ensure that the operation returns quickly and successfully.
      parameters:
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextToken"
          description: The token for the next page of results.
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResults"
          description: The maximum number of results to return in a single call. Valid range is 1 to 100.
        - name: supportPermitStatuses
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SupportPermitStatuses"
          description: "Filters the results by support permit status. Valid values: ACTIVE, INACTIVE, DELETING."
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSupportPermitsOutput"
  /support-permits/{support_permit_identifier}:
    delete:
      operationId: DeleteSupportPermit
      description: Deletes a support permit, revoking the authorization previously granted to the AWS support operator.
      parameters:
        - name: support_permit_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
          description: The Amazon Resource Name (ARN) or name of the support permit to delete.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSupportPermitOutput"
    get:
      operationId: GetSupportPermit
      description: Retrieves the details of a support permit by its ARN or name.
      parameters:
        - name: support_permit_identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SupportPermitIdentifier"
          description: The ARN or name of the support permit to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSupportPermitOutput"
  /actions/{action}:
    get:
      operationId: GetAction
      description: Retrieves the description of a specific support action.
      parameters:
        - name: action
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Action"
          description: The name of the support action to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetActionOutput"
  /actions:
    get:
      operationId: ListActions
      description: Lists available support actions for a specified AWS service. Use pagination to ensure that the operation returns quickly and successfully.
      parameters:
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextToken"
          description: The token for the next page of results.
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResults"
          description: The maximum number of results to return in a single call. Valid range is 1 to 100.
        - name: service
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Service"
          description: The name of the AWS service for which to list available support actions.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListActionsOutput"
  /support-permit-requests:
    get:
      operationId: ListSupportPermitRequests
      description: Lists permit requests from AWS support operators. Use pagination to ensure that the operation returns quickly and successfully.
      parameters:
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextToken"
          description: The token for the next page of results.
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResults"
          description: The maximum number of results to return in a single call. Valid range is 1 to 100.
        - name: supportCaseDisplayId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SupportCaseDisplayId"
          description: Filters the results by support case display identifier.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSupportPermitRequestsOutput"
  /tags/{resource_arn}:
    get:
      operationId: ListTagsForResource
      description: Lists the tags associated with a support permit resource.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
          description: The ARN of the resource to list tags for.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTagsForResourceOutput"
    post:
      operationId: TagResource
      description: Adds or overwrites one or more tags for a support permit resource.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
          description: The ARN of the resource to tag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  $ref: "#/components/schemas/Tags"
              required:
                - tags
      responses:
        "204":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResourceOutput"
    delete:
      operationId: UntagResource
      description: Removes one or more tags from a support permit resource.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
          description: The ARN of the resource to untag.
        - name: tagKeys
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TagKeyList"
          description: The tag keys to remove from the resource.
      responses:
        "204":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UntagResourceOutput"
  /support-permit-requests/{request_arn}/reject:
    put:
      operationId: RejectSupportPermitRequest
      description: Rejects a permit request from an AWS support operator. The operator cannot proceed with the requested action.
      parameters:
        - name: request_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RequestArn"
          description: The ARN of the permit request to reject.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectSupportPermitRequestOutput"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    Permit:
      description: The permit definition specifying the authorized actions, resources, and time-window conditions for a support operator.
      type: object
      properties:
        actions:
          $ref: "#/components/schemas/ActionSet"
          description: The set of actions that the support operator is authorized to perform.
        resources:
          $ref: "#/components/schemas/ResourceSet"
          description: The set of resources that the support operator is authorized to act upon.
        conditions:
          $ref: "#/components/schemas/Conditions"
          description: The time-window conditions that constrain when the permit is valid. Maximum of 2 conditions.
      required:
        - actions
        - resources
    ActionSet:
      description: The set of actions authorized by a permit. Specify either all actions or a list of specific actions.
      type: object
      properties:
        allActions:
          $ref: "#/components/schemas/Unit"
          description: Authorizes all available support actions.
        actions:
          $ref: "#/components/schemas/Actions"
          description: A list of specific support actions to authorize. Maximum of 10 actions.
    Unit:
      type: object
    Actions:
      type: array
      items:
        $ref: "#/components/schemas/Action"
    Action:
      type: string
      minLength: 3
      maxLength: 255
      pattern: "[a-z][a-z0-9-]*:[A-Za-z0-9_.-]+"
    ResourceSet:
      description: The set of resources authorized by a permit. Specify either all resources in the Region or a list of specific resources.
      type: object
      properties:
        allResourcesInRegion:
          $ref: "#/components/schemas/Unit"
          description: Authorizes the support operator to act on all resources in the Region.
        resources:
          $ref: "#/components/schemas/Resources"
          description: A list of specific resource identifiers that the support operator is authorized to act upon. Maximum of 5 resources.
    Resources:
      type: array
      items:
        $ref: "#/components/schemas/Resource"
    Resource:
      type: string
      minLength: 1
      maxLength: 512
      pattern: "[a-zA-Z0-9:/_.-]+"
    Conditions:
      type: array
      items:
        $ref: "#/components/schemas/Condition"
    Condition:
      description: A time-window condition that constrains when a support permit is valid.
      type: object
      properties:
        allowAfter:
          $ref: "#/components/schemas/Timestamp"
          description: The earliest time at which the permit becomes valid.
        allowBefore:
          $ref: "#/components/schemas/Timestamp"
          description: The latest time at which the permit remains valid.
    Timestamp:
      type: string
      format: date-time
    Name:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "[a-zA-Z0-9]{1,256}"
    Description:
      type: string
      minLength: 1
      maxLength: 1024
    SigningKeyInfo:
      description: The signing key used to cryptographically sign a support permit.
      type: object
      properties:
        kmsKey:
          $ref: "#/components/schemas/KmsKeyArn"
          description: The ARN of the AWS KMS key used to sign the permit. The key must have key spec ECC_NIST_P384 and key usage SIGN_VERIFY.
    KmsKeyArn:
      type: string
      minLength: 1
      maxLength: 512
      pattern: "[a-zA-Z0-9/:_-]{1,512}"
    SupportCaseDisplayId:
      type: string
      minLength: 1
      maxLength: 512
      pattern: "[a-zA-Z0-9:/-]{1,512}"
    ClientToken:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "[!-~]+"
    Tags:
      type: object
      properties: {}
    CreateSupportPermitOutput:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/Name"
          description: The name of the support permit.
        arn:
          $ref: "#/components/schemas/Arn"
          description: The Amazon Resource Name (ARN) of the support permit.
        description:
          $ref: "#/components/schemas/Description"
          description: The description of the support permit.
        permit:
          $ref: "#/components/schemas/Permit"
          description: The permit definition.
        status:
          $ref: "#/components/schemas/SupportPermitStatus"
          description: The current status of the support permit.
        signingKeyInfo:
          $ref: "#/components/schemas/SigningKeyInfo"
          description: The signing key information for the permit.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the permit was created.
        supportCaseDisplayId:
          $ref: "#/components/schemas/SupportCaseDisplayId"
          description: The display identifier of the support case associated with the permit.
        tags:
          type: object
          properties: {}
          description: The tags associated with the support permit.
      required:
        - name
        - arn
        - permit
        - status
        - signingKeyInfo
        - createdAt
    Arn:
      type: string
      minLength: 1
      maxLength: 512
      pattern: arn:[a-z0-9-]+:[a-z0-9-]+:[a-z0-9-]*:[0-9]{12}:.+
    SupportPermitStatus:
      description: The status of a support permit.
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - DELETING
    DeleteSupportPermitOutput:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/Name"
          description: The name of the deleted support permit.
        arn:
          $ref: "#/components/schemas/Arn"
          description: The ARN of the deleted support permit.
        description:
          $ref: "#/components/schemas/Description"
          description: The description of the deleted support permit.
        permit:
          $ref: "#/components/schemas/Permit"
          description: The permit definition of the deleted permit.
        status:
          $ref: "#/components/schemas/SupportPermitStatus"
          description: The status of the support permit. Returns DELETING.
        signingKeyInfo:
          $ref: "#/components/schemas/SigningKeyInfo"
          description: The signing key information for the deleted permit.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the permit was originally created.
        supportCaseDisplayId:
          $ref: "#/components/schemas/SupportCaseDisplayId"
          description: The display identifier of the support case associated with the deleted permit.
      required:
        - name
        - arn
        - permit
        - status
        - signingKeyInfo
        - createdAt
    GetActionOutput:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/Action"
          description: The name of the support action.
        service:
          $ref: "#/components/schemas/Service"
          description: The AWS service associated with the support action.
        description:
          $ref: "#/components/schemas/ActionDescription"
          description: A description of what the support action does.
      required:
        - action
        - service
        - description
    Service:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "[a-zA-Z0-9-]+"
    ActionDescription:
      type: string
      minLength: 1
      maxLength: 10240
    SupportPermitIdentifier:
      type: string
      minLength: 1
      maxLength: 512
      pattern: "[a-zA-Z0-9:/-]{1,512}"
    GetSupportPermitOutput:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/Name"
          description: The name of the support permit.
        arn:
          $ref: "#/components/schemas/Arn"
          description: The ARN of the support permit.
        description:
          $ref: "#/components/schemas/Description"
          description: The description of the support permit.
        permit:
          $ref: "#/components/schemas/Permit"
          description: The permit definition.
        status:
          $ref: "#/components/schemas/SupportPermitStatus"
          description: The current status of the support permit.
        signingKeyInfo:
          $ref: "#/components/schemas/SigningKeyInfo"
          description: The signing key information for the permit.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the permit was created.
        supportCaseDisplayId:
          $ref: "#/components/schemas/SupportCaseDisplayId"
          description: The display identifier of the support case associated with the permit.
        tags:
          type: object
          properties: {}
          description: The tags associated with the support permit.
      required:
        - name
        - arn
        - permit
        - status
        - signingKeyInfo
        - createdAt
    NextToken:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: "[a-zA-Z0-9/+=%_-]+"
    MaxResults:
      type: integer
      minimum: 1
      maximum: 100
    ListActionsOutput:
      type: object
      properties:
        actionSummaries:
          $ref: "#/components/schemas/ActionSummaries"
          description: The list of support actions.
        nextToken:
          $ref: "#/components/schemas/NextToken"
          description: The token for the next page of results, or null if there are no more results.
      required:
        - actionSummaries
    ActionSummaries:
      type: array
      items:
        $ref: "#/components/schemas/ActionSummary"
    ActionSummary:
      description: A summary of a support action.
      type: object
      properties:
        action:
          $ref: "#/components/schemas/Action"
          description: The name of the support action.
        service:
          $ref: "#/components/schemas/Service"
          description: The AWS service associated with the support action.
        description:
          $ref: "#/components/schemas/ActionDescription"
          description: A description of what the support action does.
      required:
        - action
        - service
        - description
    ListSupportPermitRequestsOutput:
      type: object
      properties:
        supportPermitRequests:
          $ref: "#/components/schemas/SupportPermitRequests"
          description: The list of permit requests.
        nextToken:
          $ref: "#/components/schemas/NextToken"
          description: The token for the next page of results, or null if there are no more results.
      required:
        - supportPermitRequests
    SupportPermitRequests:
      type: array
      items:
        $ref: "#/components/schemas/SupportPermitRequest"
    SupportPermitRequest:
      description: A permit request from an AWS support operator.
      type: object
      properties:
        requestArn:
          $ref: "#/components/schemas/RequestArn"
          description: The ARN of the permit request.
        permit:
          $ref: "#/components/schemas/Permit"
          description: The permit definition requested by the operator.
        supportCaseDisplayId:
          $ref: "#/components/schemas/SupportCaseDisplayId"
          description: The display identifier of the support case associated with the request.
        status:
          $ref: "#/components/schemas/SupportPermitRequestStatus"
          description: The current status of the permit request.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the request was created.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the request was last updated.
      required:
        - requestArn
        - permit
        - supportCaseDisplayId
        - status
        - createdAt
        - updatedAt
    RequestArn:
      type: string
      minLength: 1
      maxLength: 512
      pattern: "[a-zA-Z0-9:/-]{1,512}"
    SupportPermitRequestStatus:
      description: The status of a support permit request.
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - REJECTED
        - CANCELLED
    SupportPermitStatuses:
      type: array
      items:
        $ref: "#/components/schemas/SupportPermitStatus"
    ListSupportPermitsOutput:
      type: object
      properties:
        supportPermits:
          $ref: "#/components/schemas/SupportPermitSummaries"
          description: The list of support permits.
        nextToken:
          $ref: "#/components/schemas/NextToken"
          description: The token for the next page of results, or null if there are no more results.
      required:
        - supportPermits
    SupportPermitSummaries:
      type: array
      items:
        $ref: "#/components/schemas/SupportPermitSummary"
    SupportPermitSummary:
      description: A summary of a support permit.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/Name"
          description: The name of the support permit.
        arn:
          $ref: "#/components/schemas/Arn"
          description: The ARN of the support permit.
        permit:
          $ref: "#/components/schemas/Permit"
          description: The permit definition.
        status:
          $ref: "#/components/schemas/SupportPermitStatus"
          description: The current status of the support permit.
        signingKeyInfo:
          $ref: "#/components/schemas/SigningKeyInfo"
          description: The signing key information for the permit.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the permit was created.
        supportCaseDisplayId:
          $ref: "#/components/schemas/SupportCaseDisplayId"
          description: The display identifier of the support case associated with the permit.
      required:
        - name
        - arn
        - permit
        - status
        - signingKeyInfo
        - createdAt
    ListTagsForResourceOutput:
      type: object
      properties:
        tags:
          type: object
          properties: {}
          description: The tags associated with the resource.
    RejectSupportPermitRequestOutput:
      type: object
      properties:
        requestArn:
          $ref: "#/components/schemas/RequestArn"
          description: The ARN of the rejected permit request.
      required:
        - requestArn
    TagResourceOutput:
      type: object
    TagKeyList:
      type: array
      items:
        $ref: "#/components/schemas/TagKey"
    TagKey:
      type: string
      minLength: 1
      maxLength: 128
    UntagResourceOutput:
      type: object
  x-stackQL-resources:
    support_permits:
      id: aws.supportauthz.support_permits
      name: support_permits
      title: support_permits
      methods:
        create_support_permit:
          operation:
            $ref: "#/paths/~1support-permits/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
          request:
            nativeCasing: pascal
          config:
            requestBodyTranslate:
              algorithm: naive
        list_support_permits:
          operation:
            $ref: "#/paths/~1support-permits/get"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
            objectKey: $.supportPermits
          request:
            nativeCasing: pascal
          config:
            pagination:
              requestToken:
                key: nextToken
                location: query
              responseToken:
                key: $.nextToken
                location: body
        delete_support_permit:
          operation:
            $ref: "#/paths/~1support-permits~1{support_permit_identifier}/delete"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
        get_support_permit:
          operation:
            $ref: "#/paths/~1support-permits~1{support_permit_identifier}/get"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
        reject_support_permit_request:
          operation:
            $ref: "#/paths/~1support-permit-requests~1{request_arn}~1reject/put"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
      sqlVerbs:
        select:
          - $ref: "#/components/x-stackQL-resources/support_permits/methods/get_support_permit"
          - $ref: "#/components/x-stackQL-resources/support_permits/methods/list_support_permits"
        insert:
          - $ref: "#/components/x-stackQL-resources/support_permits/methods/create_support_permit"
        update: []
        delete:
          - $ref: "#/components/x-stackQL-resources/support_permits/methods/delete_support_permit"
    actions:
      id: aws.supportauthz.actions
      name: actions
      title: actions
      methods:
        get_action:
          operation:
            $ref: "#/paths/~1actions~1{action}/get"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
        list_actions:
          operation:
            $ref: "#/paths/~1actions/get"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
            objectKey: $.actionSummaries
          request:
            nativeCasing: pascal
          config:
            pagination:
              requestToken:
                key: nextToken
                location: query
              responseToken:
                key: $.nextToken
                location: body
      sqlVerbs:
        select:
          - $ref: "#/components/x-stackQL-resources/actions/methods/get_action"
          - $ref: "#/components/x-stackQL-resources/actions/methods/list_actions"
        insert: []
        update: []
        delete: []
    support_permit_requests:
      id: aws.supportauthz.support_permit_requests
      name: support_permit_requests
      title: support_permit_requests
      methods:
        list_support_permit_requests:
          operation:
            $ref: "#/paths/~1support-permit-requests/get"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
            objectKey: $.supportPermitRequests
          request:
