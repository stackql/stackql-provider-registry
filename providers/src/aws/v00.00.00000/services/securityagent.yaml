        createdAt:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time the target domain was created, in UTC format.
        verifiedAt:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time the target domain was verified, in UTC format.
      required:
        - targetDomainId
        - domainName
