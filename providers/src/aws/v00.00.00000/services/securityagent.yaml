openapi: 3.0.0
info:
  version: "2025-09-06"
  title: AWS Security Agent
  description: AWS Security Agent
  x-serviceName: securityagent
  x-serviceAlias: securityagent
  x-protocol: rest-json
  x-apiVersion: "2025-09-06"
  x-endpointPrefix: securityagent
servers:
  - url: https://securityagent.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for securityagent
paths:
  /AddArtifact:
    post:
      operationId: AddArtifact
      description: Uploads an artifact to an agent space. Artifacts provide additional context for security testing, such as architecture diagrams, API specifications, or configuration files.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentSpaceId:
                  $ref: "#/components/schemas/AgentSpaceId"
                artifactContent:
                  $ref: "#/components/schemas/Blob"
                artifactType:
                  $ref: "#/components/schemas/ArtifactType"
                fileName:
                  $ref: "#/components/schemas/String"
              required:
                - agentSpaceId
                - artifactContent
                - artifactType
                - fileName
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddArtifactOutput"
  /BatchCreateSecurityRequirements:
    post:
      operationId: BatchCreateSecurityRequirements
      description: Batch creates security requirements in a customer managed pack.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packId:
                  $ref: "#/components/schemas/SecurityRequirementPackId"
                securityRequirements:
                  $ref: "#/components/schemas/CreateSecurityRequirementEntryList"
              required:
                - packId
                - securityRequirements
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateSecurityRequirementsOutput"
  /BatchDeleteCodeReviews:
    post:
      operationId: BatchDeleteCodeReviews
      description: Deletes one or more code reviews from an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codeReviewIds:
                  $ref: "#/components/schemas/CodeReviewIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - codeReviewIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDeleteCodeReviewsOutput"
  /BatchDeletePentests:
    post:
      operationId: BatchDeletePentests
      description: Deletes one or more pentests from an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pentestIds:
                  $ref: "#/components/schemas/PentestIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - pentestIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDeletePentestsOutput"
  /BatchDeleteSecurityRequirements:
    post:
      operationId: BatchDeleteSecurityRequirements
      description: Batch deletes security requirements from a customer managed pack.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packId:
                  $ref: "#/components/schemas/SecurityRequirementPackId"
                securityRequirementNames:
                  $ref: "#/components/schemas/SecurityRequirementNameList"
              required:
                - packId
                - securityRequirementNames
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDeleteSecurityRequirementsOutput"
  /BatchDeleteThreatModels:
    post:
      operationId: BatchDeleteThreatModels
      description: Deletes one or more threat models from an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                threatModelIds:
                  $ref: "#/components/schemas/ThreatModelIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - threatModelIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDeleteThreatModelsOutput"
  /BatchGetAgentSpaces:
    post:
      operationId: BatchGetAgentSpaces
      description: Retrieves information about one or more agent spaces.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentSpaceIds:
                  $ref: "#/components/schemas/AgentSpaceIdList"
              required:
                - agentSpaceIds
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetAgentSpacesOutput"
  /BatchGetArtifactMetadata:
    post:
      operationId: BatchGetArtifactMetadata
      description: Retrieves metadata for one or more artifacts in an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentSpaceId:
                  $ref: "#/components/schemas/AgentSpaceId"
                artifactIds:
                  $ref: "#/components/schemas/ArtifactIds"
              required:
                - agentSpaceId
                - artifactIds
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetArtifactMetadataOutput"
  /BatchGetCodeReviewJobTasks:
    post:
      operationId: BatchGetCodeReviewJobTasks
      description: Retrieves information about one or more tasks within a code review job.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentSpaceId:
                  $ref: "#/components/schemas/String"
                codeReviewJobTaskIds:
                  $ref: "#/components/schemas/TaskIdList"
              required:
                - agentSpaceId
                - codeReviewJobTaskIds
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetCodeReviewJobTasksOutput"
  /BatchGetCodeReviewJobs:
    post:
      operationId: BatchGetCodeReviewJobs
      description: Retrieves information about one or more code review jobs in an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codeReviewJobIds:
                  $ref: "#/components/schemas/CodeReviewJobIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - codeReviewJobIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetCodeReviewJobsOutput"
  /BatchGetCodeReviews:
    post:
      operationId: BatchGetCodeReviews
      description: Retrieves information about one or more code reviews in an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codeReviewIds:
                  $ref: "#/components/schemas/CodeReviewIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - codeReviewIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetCodeReviewsOutput"
  /BatchGetFindings:
    post:
      operationId: BatchGetFindings
      description: Retrieves information about one or more security findings in an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                findingIds:
                  $ref: "#/components/schemas/FindingIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - findingIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetFindingsOutput"
  /BatchGetPentestJobTasks:
    post:
      operationId: BatchGetPentestJobTasks
      description: Retrieves information about one or more tasks within a pentest job.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentSpaceId:
                  $ref: "#/components/schemas/String"
                taskIds:
                  $ref: "#/components/schemas/TaskIdList"
              required:
                - agentSpaceId
                - taskIds
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetPentestJobTasksOutput"
  /BatchGetPentestJobs:
    post:
      operationId: BatchGetPentestJobs
      description: Retrieves information about one or more pentest jobs in an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pentestJobIds:
                  $ref: "#/components/schemas/PentestJobIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - pentestJobIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetPentestJobsOutput"
  /BatchGetPentests:
    post:
      operationId: BatchGetPentests
      description: Retrieves information about one or more pentests in an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pentestIds:
                  $ref: "#/components/schemas/PentestIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - pentestIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetPentestsOutput"
  /BatchGetSecurityRequirements:
    post:
      operationId: BatchGetSecurityRequirements
      description: Batch retrieves security requirements from a pack.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packId:
                  $ref: "#/components/schemas/SecurityRequirementPackId"
                securityRequirementNames:
                  $ref: "#/components/schemas/SecurityRequirementNameList"
              required:
                - packId
                - securityRequirementNames
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetSecurityRequirementsOutput"
  /BatchGetTargetDomains:
    post:
      operationId: BatchGetTargetDomains
      description: Retrieves information about one or more target domains.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetDomainIds:
                  $ref: "#/components/schemas/TargetDomainIdList"
              required:
                - targetDomainIds
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetTargetDomainsOutput"
  /BatchGetThreatModelJobTasks:
    post:
      operationId: BatchGetThreatModelJobTasks
      description: Retrieves information about one or more tasks within a threat model job.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentSpaceId:
                  $ref: "#/components/schemas/String"
                threatModelJobTaskIds:
                  $ref: "#/components/schemas/TaskIdList"
              required:
                - agentSpaceId
                - threatModelJobTaskIds
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetThreatModelJobTasksOutput"
  /BatchGetThreatModelJobs:
    post:
      operationId: BatchGetThreatModelJobs
      description: Retrieves information about one or more threat model jobs in an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                threatModelJobIds:
                  $ref: "#/components/schemas/ThreatModelJobIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - threatModelJobIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetThreatModelJobsOutput"
  /BatchGetThreatModels:
    post:
      operationId: BatchGetThreatModels
      description: Retrieves information about one or more threat models in an agent space.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                threatModelIds:
                  $ref: "#/components/schemas/ThreatModelIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - threatModelIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetThreatModelsOutput"
  /BatchGetThreats:
    post:
      operationId: BatchGetThreats
      description: Retrieves information about one or more threats.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                threatIds:
                  $ref: "#/components/schemas/ThreatIdList"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
              required:
                - threatIds
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetThreatsOutput"
  /BatchUpdateSecurityRequirements:
    post:
      operationId: BatchUpdateSecurityRequirements
      description: Batch updates security requirements within a customer managed pack.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packId:
                  $ref: "#/components/schemas/SecurityRequirementPackId"
                securityRequirements:
                  $ref: "#/components/schemas/UpdateSecurityRequirementEntryList"
              required:
                - packId
                - securityRequirements
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUpdateSecurityRequirementsOutput"
  /CreateAgentSpace:
    post:
      operationId: CreateAgentSpace
      description: Creates a new agent space. An agent space is a dedicated workspace for securing a specific application.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/AgentName"
                description:
                  $ref: "#/components/schemas/String"
                awsResources:
                  $ref: "#/components/schemas/AWSResources"
                targetDomainIds:
                  $ref: "#/components/schemas/TargetDomainIdList"
                codeReviewSettings:
                  $ref: "#/components/schemas/CodeReviewSettings"
                kmsKeyId:
                  $ref: "#/components/schemas/KmsKeyId"
                tags:
                  $ref: "#/components/schemas/TagMap"
              required:
                - name
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentSpaceOutput"
  /CreateApplication:
    post:
      operationId: CreateApplication
      description: Creates a new application. An application is the top-level organizational unit that supports IAM Identity Center integration.
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                idcInstanceArn:
                  $ref: "#/components/schemas/IdCInstanceArn"
                roleArn:
                  $ref: "#/components/schemas/RoleArn"
                defaultKmsKeyId:
                  $ref: "#/components/schemas/DefaultKmsKeyId"
                tags:
                  $ref: "#/components/schemas/TagMap"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApplicationResponse"
  /CreateCodeReview:
    post:
      operationId: CreateCodeReview
      description: Creates a new code review configuration in an agent space. A code review defines the parameters for automated security-focused code analysis.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: "#/components/schemas/String"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
                assets:
                  $ref: "#/components/schemas/Assets"
                serviceRole:
                  $ref: "#/components/schemas/ServiceRole"
                logConfig:
                  $ref: "#/components/schemas/CloudWatchLog"
                codeRemediationStrategy:
                  $ref: "#/components/schemas/CodeRemediationStrategy"
                validationMode:
                  $ref: "#/components/schemas/ValidationMode"
                maxTaskHours:
                  $ref: "#/components/schemas/Double"
              required:
                - title
                - agentSpaceId
                - assets
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCodeReviewOutput"
  /CreateIntegration:
    post:
      operationId: CreateIntegration
      description: Creates a new integration with a third-party provider, such as GitHub, for code review and remediation.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  $ref: "#/components/schemas/Provider"
                input:
                  $ref: "#/components/schemas/ProviderInput"
                integrationDisplayName:
                  $ref: "#/components/schemas/String"
                kmsKeyId:
                  $ref: "#/components/schemas/KmsKeyId"
                tags:
                  $ref: "#/components/schemas/TagMap"
                privateConnectionName:
                  $ref: "#/components/schemas/PrivateConnectionName"
              required:
                - provider
                - input
                - integrationDisplayName
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIntegrationOutput"
  /CreateMembership:
    post:
      operationId: CreateMembership
      description: Creates a new membership, granting a user access to an agent space within an application.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicationId:
                  $ref: "#/components/schemas/ApplicationId"
                agentSpaceId:
                  $ref: "#/components/schemas/AgentSpaceId"
                membershipId:
                  $ref: "#/components/schemas/MembershipId"
                memberType:
                  $ref: "#/components/schemas/MembershipType"
                config:
                  $ref: "#/components/schemas/MembershipConfig"
              required:
                - applicationId
                - agentSpaceId
                - membershipId
                - memberType
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMembershipResponse"
  /CreatePentest:
    post:
      operationId: CreatePentest
      description: Creates a new pentest configuration in an agent space. A pentest defines the security test parameters, including target assets, risk type exclusions, and logging configuration.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: "#/components/schemas/String"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
                assets:
                  $ref: "#/components/schemas/Assets"
                excludeRiskTypes:
                  $ref: "#/components/schemas/RiskTypeList"
                serviceRole:
                  $ref: "#/components/schemas/ServiceRole"
                logConfig:
                  $ref: "#/components/schemas/CloudWatchLog"
                vpcConfig:
                  $ref: "#/components/schemas/VpcConfig"
                networkTrafficConfig:
                  $ref: "#/components/schemas/NetworkTrafficConfig"
                codeRemediationStrategy:
                  $ref: "#/components/schemas/CodeRemediationStrategy"
                disableManagedSkills:
                  $ref: "#/components/schemas/SkillTypeList"
                maxTaskHours:
                  $ref: "#/components/schemas/Double"
              required:
                - title
                - agentSpaceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePentestOutput"
  /CreatePrivateConnection:
    post:
      operationId: CreatePrivateConnection
      description: Creates a private connection for reaching a self-hosted provider instance over private networking using Amazon VPC Lattice.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                privateConnectionName:
                  $ref: "#/components/schemas/PrivateConnectionName"
                mode:
                  $ref: "#/components/schemas/PrivateConnectionMode"
                tags:
                  $ref: "#/components/schemas/TagMap"
              required:
                - privateConnectionName
                - mode
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePrivateConnectionOutput"
  /CreateSecurityRequirementPack:
    post:
      operationId: CreateSecurityRequirementPack
      description: Creates a customer managed security requirement pack.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/SecurityRequirementPackName"
                description:
                  $ref: "#/components/schemas/String"
                status:
                  $ref: "#/components/schemas/SecurityRequirementPackStatus"
                kmsKeyId:
                  $ref: "#/components/schemas/KmsKeyId"
                tags:
                  $ref: "#/components/schemas/TagMap"
              required:
                - name
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSecurityRequirementPackOutput"
  /CreateTargetDomain:
    post:
      operationId: CreateTargetDomain
      description: Creates a new target domain for penetration testing. A target domain is a web domain that must be registered and verified before it can be tested.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetDomainName:
                  $ref: "#/components/schemas/String"
                verificationMethod:
                  $ref: "#/components/schemas/DomainVerificationMethod"
                tags:
                  $ref: "#/components/schemas/TagMap"
              required:
                - targetDomainName
                - verificationMethod
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTargetDomainOutput"
  /CreateThreat:
    post:
      operationId: CreateThreat
      description: Creates a new threat under a threat model job.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentSpaceId:
                  $ref: "#/components/schemas/String"
                threatJobId:
                  $ref: "#/components/schemas/String"
                title:
                  $ref: "#/components/schemas/String"
                statement:
                  $ref: "#/components/schemas/String"
                severity:
                  $ref: "#/components/schemas/ThreatSeverity"
                comments:
                  $ref: "#/components/schemas/String"
                stride:
                  $ref: "#/components/schemas/StrideCategoryList"
                threatSource:
                  $ref: "#/components/schemas/String"
                prerequisites:
                  $ref: "#/components/schemas/String"
                threatAction:
                  $ref: "#/components/schemas/String"
                threatImpact:
                  $ref: "#/components/schemas/String"
                impactedGoal:
                  $ref: "#/components/schemas/StringList"
                impactedAssets:
                  $ref: "#/components/schemas/StringList"
                anchor:
                  $ref: "#/components/schemas/ThreatAnchorShape"
                evidence:
                  $ref: "#/components/schemas/ThreatEvidenceList"
                recommendation:
                  $ref: "#/components/schemas/String"
              required:
                - agentSpaceId
                - threatJobId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateThreatOutput"
  /CreateThreatModel:
    post:
      operationId: CreateThreatModel
      description: Creates a new threat model configuration in an agent space. A threat model defines the parameters for automated threat analysis.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: "#/components/schemas/String"
                agentSpaceId:
                  $ref: "#/components/schemas/String"
                description:
                  $ref: "#/components/schemas/String"
                assets:
                  $ref: "#/components/schemas/Assets"
                scopeDocs:
                  $ref: "#/components/schemas/DocumentList"
                serviceRole:
                  $ref: "#/components/schemas/ServiceRole"
                logConfig:
