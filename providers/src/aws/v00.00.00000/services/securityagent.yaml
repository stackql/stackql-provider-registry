      description: Method used to verify domain ownership.
      type: string
      enum:
        - DNS_TXT
        - HTTP_ROUTE
        - PRIVATE_VPC
    DnsVerification:
      description: Contains DNS verification details for a target domain, including the DNS record to create for domain ownership verification.
      type: object
      properties:
        token:
          $ref: "#/components/schemas/String"
