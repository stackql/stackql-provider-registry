        dnsRecordName:
          $ref: "#/components/schemas/String"
          description: The name of the DNS record to create for verification.
        dnsRecordType:
          $ref: "#/components/schemas/DNSRecordType"
          description: The type of DNS record to create. Currently, only TXT is supported.
    DNSRecordType:
      description: Type of DNS record.
      type: string
      enum:
        - TXT
    HttpVerification:
      description: Contains HTTP route verification details for a target domain, including the route path and token to serve for domain ownership verification.
      type: object
      properties:
        token:
          $ref: "#/components/schemas/String"
          description: The verification token to serve at the specified route path.
        routePath:
