      type: object
      properties:
        targetDomains:
          $ref: "#/components/schemas/TargetDomainList"
          description: The list of target domains that were found.
        notFound:
          $ref: "#/components/schemas/TargetDomainIdList"
          description: The list of target domain identifiers that were not found.
    TargetDomainList:
      description: List of target domains.
      type: array
      items:
        $ref: "#/components/schemas/TargetDomain"
    TargetDomain:
