    CodeRemediationTaskStatus:
      description: Code remediation task status.
      type: string
      enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
    CodeRemediationTaskDetailsList:
      type: array
      items:
        $ref: "#/components/schemas/CodeRemediationTaskDetails"
    CodeRemediationTaskDetails:
      description: Contains details about a code remediation task, including links to the code diff and pull request.
      type: object
      properties:
        repoName:
          $ref: "#/components/schemas/String"
          description: The name of the repository where the remediation was applied.
        codeDiffLink:
          $ref: "#/components/schemas/String"
          description: The link to the code diff for the remediation.
        pullRequestLink:
          $ref: "#/components/schemas/String"
          description: The link to the pull request created for the remediation.
    CodeLocationList:
      description: List of code locations.
      type: array
      items:
        $ref: "#/components/schemas/CodeLocation"
    CodeLocation:
      description: Represents a location in source code associated with a security finding.
      type: object
      properties:
        filePath:
