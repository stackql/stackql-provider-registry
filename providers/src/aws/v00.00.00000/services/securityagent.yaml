    ValidationMode:
      description: Mode of validation to perform on findings
      type: string
      enum:
        - DISABLED
        - SIMULATED
    FindingIdList:
      type: array
      items:
        $ref: "#/components/schemas/String"
    BatchGetFindingsOutput:
      description: Output for the BatchGetFindings operation.
      type: object
      properties:
        findings:
          $ref: "#/components/schemas/FindingList"
          description: The list of findings that were found.
        notFound:
          $ref: "#/components/schemas/FindingIdList"
          description: The list of finding identifiers that were not found.
    FindingList:
      description: List of findings.
      type: array
      items:
        $ref: "#/components/schemas/Finding"
    Finding:
      description: Represents a security finding discovered during a pentest job. A finding contains details about a vulnerability, including its risk level, confidence, and remediation status.
      type: object
      properties:
        findingId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the finding.
        agentSpaceId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the agent space associated with the finding.
        pentestId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the pentest associated with the finding.
        pentestJobId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the pentest job that produced the finding.
        codeReviewId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the code review associated with the finding.
        codeReviewJobId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the code review job that produced the finding.
        taskId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the task that produced the finding.
        name:
          $ref: "#/components/schemas/String"
          description: The name of the finding.
        description:
          $ref: "#/components/schemas/String"
          description: A description of the finding.
        status:
          $ref: "#/components/schemas/FindingStatus"
          description: The current status of the finding. Valid values include ACTIVE, RESOLVED, ACCEPTED, and FALSE_POSITIVE.
        riskType:
          $ref: "#/components/schemas/String"
          description: The type of security risk identified by the finding.
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
          description: The risk level of the finding. Valid values include UNKNOWN, INFORMATIONAL, LOW, MEDIUM, HIGH, and CRITICAL.
        riskScore:
          $ref: "#/components/schemas/String"
          description: The numerical risk score of the finding.
        reasoning:
          $ref: "#/components/schemas/String"
          description: The reasoning behind the finding, explaining why it was identified as a vulnerability.
        confidence:
          $ref: "#/components/schemas/ConfidenceLevel"
          description: The confidence level of the finding. Valid values include FALSE_POSITIVE, UNCONFIRMED, LOW, MEDIUM, and HIGH.
        validationStatus:
          $ref: "#/components/schemas/ValidationStatus"
          description: The simulated validation status of the finding. Valid values are NOT_VALIDATED, VALIDATING, CONFIRMED, NOT_REPRODUCED, and VALIDATION_FAILED.
        attackScript:
          $ref: "#/components/schemas/String"
          description: The attack script used to reproduce the finding.
        codeRemediationTask:
          $ref: "#/components/schemas/CodeRemediationTask"
          description: The code remediation task associated with the finding, if code remediation was initiated.
        lastUpdatedBy:
          $ref: "#/components/schemas/String"
          description: The identifier of the entity that last updated the finding.
        customerNote:
          $ref: "#/components/schemas/String"
          description: A customer-provided note on the finding.
        codeLocations:
          $ref: "#/components/schemas/CodeLocationList"
          description: The file locations involved in the vulnerability, as reported by the code scanner.
        verificationScript:
          $ref: "#/components/schemas/VerificationScript"
          description: The verification script metadata for reproducing the finding, including download URL, instructions, and required environment variables.
        alignmentRationale:
          $ref: "#/components/schemas/String"
          description: The rationale provided by the alignment agent explaining how the finding was adjusted based on customer preferences.
        revalidationJobIds:
          $ref: "#/components/schemas/StringList"
          description: The list of pentest job identifiers for revalidation jobs that retested this finding.
        originalFindingId:
          $ref: "#/components/schemas/String"
          description: The identifier of the original finding that this revalidation finding was produced from.
        createdAt:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time the finding was created, in UTC format.
        updatedAt:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time the finding was last updated, in UTC format.
      required:
        - findingId
        - agentSpaceId
    FindingStatus:
      description: Finding status.
      type: string
      enum:
        - ACTIVE
        - RESOLVED
        - ACCEPTED
        - FALSE_POSITIVE
    RiskLevel:
      description: Risk severity level.
      type: string
      enum:
        - UNKNOWN
        - INFORMATIONAL
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
    ConfidenceLevel:
      description: Finding confidence level.
      type: string
      enum:
        - FALSE_POSITIVE
        - UNCONFIRMED
        - LOW
        - MEDIUM
        - HIGH
    ValidationStatus:
      description: Per-finding sandbox validation status
      type: string
      enum:
        - CONFIRMED
        - NOT_REPRODUCED
        - VALIDATION_FAILED
        - VALIDATING
        - NOT_VALIDATED
    CodeRemediationTask:
      description: Represents a code remediation task that was initiated to fix a security finding.
      type: object
      properties:
        status:
          $ref: "#/components/schemas/CodeRemediationTaskStatus"
          description: The current status of the code remediation task.
        statusReason:
          $ref: "#/components/schemas/String"
          description: The reason for the current status of the code remediation task.
        taskDetails:
          $ref: "#/components/schemas/CodeRemediationTaskDetailsList"
          description: The list of details for the code remediation task, including repository name, code diff link, and pull request link.
      required:
