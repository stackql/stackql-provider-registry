      description: Represents a pentest job, which is an execution instance of a pentest. A pentest job progresses through preflight, static analysis, pentest, and finalizing steps.
      type: object
      properties:
        pentestJobId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the pentest job.
        pentestId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the pentest associated with the job.
        title_:
          $ref: "#/components/schemas/String"
          description: The title of the pentest job.
        overview:
          $ref: "#/components/schemas/String"
          description: An overview of the pentest job results.
        status:
          $ref: "#/components/schemas/JobStatus"
          description: The current status of the pentest job.
        endpoints:
          $ref: "#/components/schemas/EndpointList"
          description: The list of endpoints being tested in the pentest job.
        actors:
          $ref: "#/components/schemas/ActorList"
          description: The list of actors used during the pentest job.
        documents:
          $ref: "#/components/schemas/DocumentList"
          description: The list of documents providing context for the pentest job.
        sourceCode:
          $ref: "#/components/schemas/SourceCodeRepositoryList"
          description: The list of source code repositories analyzed during the pentest job.
        excludePaths:
          $ref: "#/components/schemas/EndpointList"
          description: The list of paths excluded from the pentest job.
        allowedDomains:
          $ref: "#/components/schemas/EndpointList"
          description: The list of domains allowed during the pentest job.
        excludeRiskTypes:
          $ref: "#/components/schemas/RiskTypeList"
          description: The list of risk types excluded from the pentest job.
        steps:
          $ref: "#/components/schemas/StepList"
          description: The list of steps in the pentest job execution.
        executionContext:
          $ref: "#/components/schemas/ExecutionContextList"
          description: The execution context messages for the pentest job.
        serviceRole:
          $ref: "#/components/schemas/ServiceRole"
          description: The IAM service role used for the pentest job.
        logConfig:
          $ref: "#/components/schemas/CloudWatchLog"
          description: The CloudWatch Logs configuration for the pentest job.
        vpcConfig:
          $ref: "#/components/schemas/VpcConfig"
          description: The VPC configuration for the pentest job.
        networkTrafficConfig:
          $ref: "#/components/schemas/NetworkTrafficConfig"
          description: The network traffic configuration for the pentest job.
        errorInformation:
          $ref: "#/components/schemas/ErrorInformation"
          description: Error information if the pentest job encountered an error.
        integratedRepositories:
          $ref: "#/components/schemas/IntegratedRepositoryList"
          description: The list of integrated repositories associated with the pentest job.
        codeRemediationStrategy:
          $ref: "#/components/schemas/CodeRemediationStrategy"
          description: The code remediation strategy for the pentest job.
        cleanUpStrategy:
          $ref: "#/components/schemas/CleanUpStrategy"
          description: Strategy for cleaning up resources after pentest job completion.
        disableManagedSkills:
          $ref: "#/components/schemas/SkillTypeList"
          description: A list of managed skills disabled for this pentest job. Valid values include FINDING_PERSONALIZATION and LOGIN_OPTIMIZATION.
        maxTaskHours:
          $ref: "#/components/schemas/Double"
          description: The maximum number of billable task hours allowed for this pentest job. If the cumulative task hours reach this limit, the job is gracefully stopped.
        jobType:
          $ref: "#/components/schemas/JobType"
          description: The type of the pentest job. Valid values are FULL and REVALIDATION.
        selectedFindingIds:
          $ref: "#/components/schemas/StringList"
          description: The list of finding identifiers selected for revalidation. Present only when jobType is REVALIDATION.
        createdAt:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time the pentest job was created, in UTC format.
        updatedAt:
          $ref: "#/components/schemas/SyntheticTimestamp_date_time"
          description: The date and time the pentest job was last updated, in UTC format.
    JobType:
      description: The type of pentest job execution.
      type: string
      enum:
