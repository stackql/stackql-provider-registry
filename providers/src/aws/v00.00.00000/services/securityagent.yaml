      type: string
      enum:
        - PENDING
        - VERIFIED
        - FAILED
        - UNREACHABLE
    VerificationDetails:
      description: Contains the verification details for a target domain, including the verification method and provider-specific details.
      type: object
      properties:
        method:
          $ref: "#/components/schemas/DomainVerificationMethod"
