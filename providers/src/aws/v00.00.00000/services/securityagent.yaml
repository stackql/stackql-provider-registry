          description: The absolute path to the file containing the code location.
        lineStart:
          $ref: "#/components/schemas/Integer"
          description: The starting line number of the code location.
        lineEnd:
          $ref: "#/components/schemas/Integer"
          description: The ending line number of the code location.
        label:
          $ref: "#/components/schemas/String"
          description: The role of this location in the vulnerability, such as source or sink.
      required:
        - filePath
    Integer:
      type: integer
    VerificationScript:
      description: Contains metadata for a verification script that can be used to reproduce a security finding.
      type: object
      properties:
        scriptType:
          $ref: "#/components/schemas/String"
          description: The type of script. Valid values are python and bash.
        scriptUrl:
          $ref: "#/components/schemas/String"
          description: URL to download the verification script.
        instructions:
          $ref: "#/components/schemas/String"
          description: Instructions for running the verification script, including prerequisites and how to interpret results.
        envVars:
          $ref: "#/components/schemas/VerificationScriptEnvVarList"
          description: The list of environment variables required to run the verification script.
    VerificationScriptEnvVarList:
      description: List of environment variables required to run a verification script.
      type: array
      items:
        $ref: "#/components/schemas/VerificationScriptEnvVar"
    VerificationScriptEnvVar:
      description: Represents an environment variable required to run a verification script.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/String"
          description: The name of the environment variable.
        value:
          $ref: "#/components/schemas/String"
          description: The value of the environment variable.
    StringList:
      type: array
      items:
        $ref: "#/components/schemas/String"
    BatchGetPentestJobTasksOutput:
      description: Output for the BatchGetPentestJobTasks operation.
      type: object
      properties:
        tasks:
          $ref: "#/components/schemas/TaskList"
          description: The list of tasks that were found.
