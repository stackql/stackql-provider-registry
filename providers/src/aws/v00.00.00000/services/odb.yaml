openapi: 3.0.0
info:
  version: "2024-08-20"
  title: odb
  description: odb
  x-serviceName: odb
  x-serviceAlias: odb
  x-protocol: json
  x-apiVersion: "2024-08-20"
  x-endpointPrefix: odb
  x-targetPrefix: Odb
  x-jsonVersion: "1.0"
servers:
  - url: https://odb.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for odb
paths:
  /AcceptMarketplaceRegistration:
    post:
      operationId: AcceptMarketplaceRegistration
      description: Registers the Amazon Web Services Marketplace token for your Amazon Web Services account to activate your Oracle Database@Amazon Web Services subscription.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - Odb.AcceptMarketplaceRegistration
            default: Odb.AcceptMarketplaceRegistration
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                marketplaceRegistrationToken:
                  $ref: "#/components/schemas/String"
                  description: The registration token that's generated by Amazon Web Services Marketplace and sent to Oracle Database@Amazon Web Services.
              required:
                - marketplaceRegistrationToken
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptMarketplaceRegistrationOutput"
  /AssociateIamRoleToResource:
    post:
      operationId: AssociateIamRoleToResource
      description: Associates an Amazon Web Services Identity and Access Management (IAM) service role with a specified resource to enable Amazon Web Services service integration.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - Odb.AssociateIamRoleToResource
            default: Odb.AssociateIamRoleToResource
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                iamRoleArn:
                  $ref: "#/components/schemas/RoleArn"
                  description: The Amazon Resource Name (ARN) of the Amazon Web Services Identity and Access Management (IAM) service role to associate with the resource.
                awsIntegration:
                  $ref: "#/components/schemas/SupportedAwsIntegration"
                  description: The Amazon Web Services integration configuration settings for the Amazon Web Services Identity and Access Management (IAM) service role association.
                resourceArn:
                  $ref: "#/components/schemas/AssociateIamRoleToResourceInputResourceArnString"
                  description: The Amazon Resource Name (ARN) of the target resource to associate with the Amazon Web Services Identity and Access Management (IAM) service role.
              required:
                - iamRoleArn
                - awsIntegration
                - resourceArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssociateIamRoleToResourceOutput"
  /AssociateVirtualMachinesToExadbVmCluster:
    post:
      operationId: AssociateVirtualMachinesToExadbVmCluster
      description: Adds virtual machines to the specified Exascale VM cluster.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - Odb.AssociateVirtualMachinesToExadbVmCluster
            default: Odb.AssociateVirtualMachinesToExadbVmCluster
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                exadbVmClusterId:
                  $ref: "#/components/schemas/ResourceIdOrArn"
                  description: The unique identifier of the Exascale VM cluster to add virtual machines to.
                desiredNodeCount:
                  $ref: "#/components/schemas/AssociateVirtualMachinesToExadbVmClusterInputDesiredNodeCountInteger"
                  description: The desired number of nodes in the Exascale VM cluster after the association.
              required:
                - exadbVmClusterId
                - desiredNodeCount
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssociateVirtualMachinesToExadbVmClusterOutput"
  /CreateAutonomousDatabase:
    post:
      operationId: CreateAutonomousDatabase
      description: Creates a new Autonomous Database.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - Odb.CreateAutonomousDatabase
            default: Odb.CreateAutonomousDatabase
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                odbNetworkId:
                  $ref: "#/components/schemas/ResourceIdOrArn"
                  description: The unique identifier of the ODB network to be used for the Autonomous Database.
                displayName:
                  $ref: "#/components/schemas/ResourceDisplayName"
                  description: The user-friendly name for the Autonomous Database. The name does not have to be unique.
                dbName:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputDbNameString"
                  description: The name of the Autonomous Database. The name must begin with an alphabetic character and can contain a maximum of 30 alphanumeric characters. Special characters are not permitted. The name must be unique in the Amazon Web Services account.
                adminPassword:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputAdminPasswordString"
                  description: The password for the ADMIN user of the Autonomous Database.
                computeCount:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputComputeCountDouble"
                  description: The compute capacity, in number of Elastic CPUs (ECPUs) or Oracle CPUs (OCPUs), to assign to the Autonomous Database.
                dataStorageSizeInTBs:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputDataStorageSizeInTBsInteger"
                  description: The size, in terabytes (TB), of the data volume to allocate for the Autonomous Database.
                dataStorageSizeInGBs:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputDataStorageSizeInGBsInteger"
                  description: The size, in gigabytes (GB), of the data volume to allocate for the Autonomous Database.
                dbWorkload:
                  $ref: "#/components/schemas/DbWorkload"
                  description: The intended use of the Autonomous Database, such as transaction processing, data warehouse, JSON database, or APEX.
                isAutoScalingEnabled:
                  $ref: "#/components/schemas/Boolean"
                  description: Specifies whether to enable automatic scaling of the compute resources for the Autonomous Database.
                isAutoScalingForStorageEnabled:
                  $ref: "#/components/schemas/Boolean"
                  description: Specifies whether to enable automatic scaling of the storage for the Autonomous Database.
                licenseModel:
                  $ref: "#/components/schemas/LicenseModel"
                  description: The Oracle license model to apply to the Autonomous Database.
                characterSet:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputCharacterSetString"
                  description: The character set to use for the Autonomous Database.
                ncharacterSet:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputNcharacterSetString"
                  description: The national character set to use for the Autonomous Database.
                dbVersion:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputDbVersionString"
                  description: The Oracle Database software version to use for the Autonomous Database.
                databaseEdition:
                  $ref: "#/components/schemas/DatabaseEdition"
                  description: The Oracle Database edition to apply to the Autonomous Database.
                standbyAllowlistedIpsSource:
                  $ref: "#/components/schemas/StandbyAllowlistedIpsSource"
                  description: The source of the allowlisted IP addresses for the standby Autonomous Database.
                autonomousMaintenanceScheduleType:
                  $ref: "#/components/schemas/AutonomousMaintenanceScheduleType"
                  description: The maintenance schedule type for the Autonomous Database.
                backupRetentionPeriodInDays:
                  $ref: "#/components/schemas/Integer"
                  description: The retention period, in days, for automatic backups of the Autonomous Database.
                byolComputeCountLimit:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputByolComputeCountLimitDouble"
                  description: The maximum number of compute resources that you can allocate to the Autonomous Database under the bring-your-own-license (BYOL) model.
                cpuCoreCount:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputCpuCoreCountInteger"
                  description: The number of CPU cores to allocate to the Autonomous Database.
                customerContactsToSendToOCI:
                  $ref: "#/components/schemas/CustomerContacts"
                  description: The list of customer contacts to receive operational notifications from Oracle Cloud Infrastructure (OCI) for the Autonomous Database.
                privateEndpointIp:
                  $ref: "#/components/schemas/String"
                  description: The private endpoint IP address for the Autonomous Database.
                privateEndpointLabel:
                  $ref: "#/components/schemas/String"
                  description: The private endpoint label for the Autonomous Database.
                resourcePoolLeaderId:
                  $ref: "#/components/schemas/ResourceIdOrArn"
                  description: The unique identifier of the resource pool leader Autonomous Database.
                resourcePoolSummary:
                  $ref: "#/components/schemas/ResourcePoolSummary"
                  description: The configuration of the resource pool for the Autonomous Database.
                scheduledOperations:
                  $ref: "#/components/schemas/ScheduledOperationDetailsList"
                  description: The list of scheduled start and stop times for the Autonomous Database.
                standbyAllowlistedIps:
                  $ref: "#/components/schemas/StringList"
                  description: The list of IP addresses that are allowed to access the standby Autonomous Database.
                allowlistedIps:
                  $ref: "#/components/schemas/StringList"
                  description: The list of IP addresses that are allowed to access the Autonomous Database.
                transportableTablespace:
                  $ref: "#/components/schemas/TransportableTablespace"
                  description: The transportable tablespace configuration to use when creating the Autonomous Database.
                isBackupRetentionLocked:
                  $ref: "#/components/schemas/Boolean"
                  description: Specifies whether to lock the backup retention period of the Autonomous Database to prevent it from being shortened.
                isLocalDataGuardEnabled:
                  $ref: "#/components/schemas/Boolean"
                  description: Specifies whether to enable local Oracle Data Guard for the Autonomous Database.
                isMtlsConnectionRequired:
                  $ref: "#/components/schemas/Boolean"
                  description: Specifies whether mutual TLS (mTLS) authentication is required to connect to the Autonomous Database.
                dbToolsDetails:
                  $ref: "#/components/schemas/DatabaseToolList"
                  description: The list of database management tools to enable for the Autonomous Database.
                source:
                  $ref: "#/components/schemas/SourceType"
                  description: The source from which to create the Autonomous Database, such as a clone, backup, or cross-Region copy.
                sourceConfiguration:
                  $ref: "#/components/schemas/SourceConfiguration"
                  description: The configuration details for the source used to create the Autonomous Database.
                encryptionKeyProvider:
                  $ref: "#/components/schemas/EncryptionKeyProviderInput"
                  description: The provider of the encryption key to use for the Autonomous Database.
                encryptionKeyConfiguration:
                  $ref: "#/components/schemas/EncryptionKeyConfigurationInput"
                  description: The configuration of the encryption key to use for the Autonomous Database.
                adminPasswordSource:
                  $ref: "#/components/schemas/AdminPasswordSource"
                  description: The source of the admin password for the Autonomous Database. When set to CUSTOMER_MANAGED_AWS_SECRET, the admin password is retrieved from an Amazon Web Services Secrets Manager secret.
                adminPasswordSourceConfiguration:
                  $ref: "#/components/schemas/AdminPasswordSourceConfigurationInput"
                  description: The configuration of the admin password source for the Autonomous Database.
                clientToken:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseInputClientTokenString"
                  description: A client-provided token to ensure the idempotency of the request.
                tags:
                  $ref: "#/components/schemas/RequestTagMap"
                  description: The list of resource tags to apply to the Autonomous Database. Each tag is a key-value pair with no predefined name, type, or namespace.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAutonomousDatabaseOutput"
  /CreateAutonomousDatabaseBackup:
    post:
      operationId: CreateAutonomousDatabaseBackup
      description: Creates a new backup of the specified Autonomous Database.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - Odb.CreateAutonomousDatabaseBackup
            default: Odb.CreateAutonomousDatabaseBackup
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                autonomousDatabaseId:
                  $ref: "#/components/schemas/ResourceIdOrArn"
                  description: The unique identifier of the Autonomous Database to back up.
                displayName:
                  $ref: "#/components/schemas/ResourceDisplayName"
                  description: The user-friendly name for the Autonomous Database backup.
                retentionPeriodInDays:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseBackupInputRetentionPeriodInDaysInteger"
                  description: The retention period, in days, for the Autonomous Database backup.
                clientToken:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseBackupInputClientTokenString"
                  description: A client-provided token to ensure the idempotency of the request.
                tags:
                  $ref: "#/components/schemas/RequestTagMap"
                  description: The list of resource tags to apply to the Autonomous Database backup. Each tag is a key-value pair with no predefined name, type, or namespace.
              required:
                - autonomousDatabaseId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAutonomousDatabaseBackupOutput"
  /CreateAutonomousDatabaseWallet:
    post:
      operationId: CreateAutonomousDatabaseWallet
      description: Creates a new wallet for the specified Autonomous Database.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - Odb.CreateAutonomousDatabaseWallet
            default: Odb.CreateAutonomousDatabaseWallet
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                autonomousDatabaseId:
                  $ref: "#/components/schemas/ResourceIdOrArn"
                  description: The unique identifier of the Autonomous Database to create a wallet for.
                walletType:
                  $ref: "#/components/schemas/WalletType"
                  description: The type of wallet to create, either a regional wallet or an instance wallet.
                password:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseWalletInputPasswordString"
                  description: The password to encrypt the keys inside the wallet.
                passwordSource:
                  $ref: "#/components/schemas/WalletPasswordSource"
                  description: The source of the password for encrypting the wallet. When set to CUSTOMER_MANAGED_AWS_SECRET, the password is retrieved from an Amazon Web Services Secrets Manager secret.
                passwordSourceConfiguration:
                  $ref: "#/components/schemas/WalletPasswordSourceConfigurationInput"
                  description: The configuration of the password source for the Autonomous Database wallet.
                clientToken:
                  $ref: "#/components/schemas/CreateAutonomousDatabaseWalletInputClientTokenString"
                  description: A client-provided token to ensure the idempotency of the request.
              required:
                - autonomousDatabaseId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAutonomousDatabaseWalletOutput"
  /CreateCloudAutonomousVmCluster:
    post:
      operationId: CreateCloudAutonomousVmCluster
      description: Creates a new Autonomous VM cluster in the specified Exadata infrastructure.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - Odb.CreateCloudAutonomousVmCluster
            default: Odb.CreateCloudAutonomousVmCluster
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                cloudExadataInfrastructureId:
                  $ref: "#/components/schemas/ResourceIdOrArn"
                  description: The unique identifier of the Exadata infrastructure where the VM cluster will be created.
                odbNetworkId:
                  $ref: "#/components/schemas/ResourceIdOrArn"
                  description: The unique identifier of the ODB network to be used for the VM cluster.
                displayName:
                  $ref: "#/components/schemas/ResourceDisplayName"
                  description: The display name for the Autonomous VM cluster. The name does not need to be unique.
                clientToken:
                  $ref: "#/components/schemas/CreateCloudAutonomousVmClusterInputClientTokenString"
                  description: A client-provided token to ensure idempotency of the request.
                autonomousDataStorageSizeInTBs:
                  $ref: "#/components/schemas/CreateCloudAutonomousVmClusterInputAutonomousDataStorageSizeInTBsDouble"
                  description: The data disk group size to be allocated for Autonomous Databases, in terabytes (TB).
                cpuCoreCountPerNode:
                  $ref: "#/components/schemas/CreateCloudAutonomousVmClusterInputCpuCoreCountPerNodeInteger"
                  description: The number of CPU cores to be enabled per VM cluster node.
                dbServers:
                  $ref: "#/components/schemas/StringList"
                  description: The list of database servers to be used for the Autonomous VM cluster.
                description:
                  $ref: "#/components/schemas/CreateCloudAutonomousVmClusterInputDescriptionString"
                  description: A user-provided description of the Autonomous VM cluster.
                isMtlsEnabledVmCluster:
                  $ref: "#/components/schemas/Boolean"
                  description: Specifies whether to enable mutual TLS (mTLS) authentication for the Autonomous VM cluster.
                licenseModel:
                  $ref: "#/components/schemas/LicenseModel"
                  description: The Oracle license model to apply to the Autonomous VM cluster.
                maintenanceWindow:
                  $ref: "#/components/schemas/MaintenanceWindow"
                  description: The scheduling details for the maintenance window. Patching and system updates take place during the maintenance window.
                memoryPerOracleComputeUnitInGBs:
                  $ref: "#/components/schemas/CreateCloudAutonomousVmClusterInputMemoryPerOracleComputeUnitInGBsInteger"
                  description: The amount of memory to be allocated per OCPU, in GB.
                scanListenerPortNonTls:
                  $ref: "#/components/schemas/CreateCloudAutonomousVmClusterInputScanListenerPortNonTlsInteger"
                  description: The SCAN listener port for non-TLS (TCP) protocol.
                scanListenerPortTls:
                  $ref: "#/components/schemas/CreateCloudAutonomousVmClusterInputScanListenerPortTlsInteger"
                  description: The SCAN listener port for TLS (TCP) protocol.
                tags:
                  $ref: "#/components/schemas/RequestTagMap"
                  description: Free-form tags for this resource. Each tag is a key-value pair with no predefined name, type, or namespace.
                timeZone:
                  $ref: "#/components/schemas/CreateCloudAutonomousVmClusterInputTimeZoneString"
                  description: The time zone to use for the Autonomous VM cluster.
                totalContainerDatabases:
                  $ref: "#/components/schemas/CreateCloudAutonomousVmClusterInputTotalContainerDatabasesInteger"
                  description: The total number of Autonomous CDBs that you can create in the Autonomous VM cluster.
              required:
                - cloudExadataInfrastructureId
                - odbNetworkId
                - displayName
                - autonomousDataStorageSizeInTBs
                - cpuCoreCountPerNode
                - memoryPerOracleComputeUnitInGBs
                - totalContainerDatabases
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCloudAutonomousVmClusterOutput"
  /CreateCloudExadataInfrastructure:
    post:
      operationId: CreateCloudExadataInfrastructure
      description: Creates an Exadata infrastructure.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - Odb.CreateCloudExadataInfrastructure
            default: Odb.CreateCloudExadataInfrastructure
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                displayName:
                  $ref: "#/components/schemas/ResourceDisplayName"
                  description: A user-friendly name for the Exadata infrastructure.
                shape:
                  $ref: "#/components/schemas/CreateCloudExadataInfrastructureInputShapeString"
                  description: The model name of the Exadata infrastructure. For the list of valid model names, use the ListDbSystemShapes operation.
                availabilityZone:
                  $ref: "#/components/schemas/CreateCloudExadataInfrastructureInputAvailabilityZoneString"
                  description: "The name of the Availability Zone (AZ) where the Exadata infrastructure is located. This operation requires that you specify a value for either availabilityZone or availabilityZoneId. Example: us-east-1a"
                availabilityZoneId:
                  $ref: "#/components/schemas/CreateCloudExadataInfrastructureInputAvailabilityZoneIdString"
                  description: "The AZ ID of the AZ where the Exadata infrastructure is located. This operation requires that you specify a value for either availabilityZone or availabilityZoneId. Example: use1-az1"
                tags:
                  $ref: "#/components/schemas/RequestTagMap"
                  description: The list of resource tags to apply to the Exadata infrastructure.
                computeCount:
                  $ref: "#/components/schemas/Integer"
                  description: The number of database servers for the Exadata infrastructure. Valid values for this parameter depend on the shape. To get information about the minimum and maximum values, use the ListDbSystemShapes operation.
                customerContactsToSendToOCI:
                  $ref: "#/components/schemas/CustomerContacts"
                  description: The email addresses of contacts to receive notification from Oracle about maintenance updates for the Exadata infrastructure.
                maintenanceWindow:
                  $ref: "#/components/schemas/MaintenanceWindow"
                  description: The maintenance window configuration for the Exadata Cloud infrastructure. This allows you to define when maintenance operations such as patching and updates can be performed on the infrastructure.
                storageCount:
                  $ref: "#/components/schemas/Integer"
                  description: The number of storage servers to activate for this Exadata infrastructure. Valid values for this parameter depend on the shape. To get information about the minimum and maximum values, use the ListDbSystemShapes operation.
                clientToken:
                  $ref: "#/components/schemas/CreateCloudExadataInfrastructureInputClientTokenString"
                  description: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, the Amazon Web Services SDK automatically generates a client token and uses it for the request to ensure idempotency. The client token is valid for up to 24 hours after it's first used.
                databaseServerType:
                  $ref: "#/components/schemas/CreateCloudExadataInfrastructureInputDatabaseServerTypeString"
                  description: The database server model type of the Exadata infrastructure. For the list of valid model names, use the ListDbSystemShapes operation.
                storageServerType:
                  $ref: "#/components/schemas/CreateCloudExadataInfrastructureInputStorageServerTypeString"
                  description: The storage server model type of the Exadata infrastructure. For the list of valid model names, use the ListDbSystemShapes operation.
              required:
                - displayName
                - shape
                - computeCount
                - storageCount
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCloudExadataInfrastructureOutput"
  /CreateCloudVmCluster:
    post:
      operationId: CreateCloudVmCluster
      description: Creates a VM cluster on the specified Exadata infrastructure.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - Odb.CreateCloudVmCluster
            default: Odb.CreateCloudVmCluster
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                cloudExadataInfrastructureId:
                  $ref: "#/components/schemas/ResourceIdOrArn"
                  description: The unique identifier of the Exadata infrastructure for this VM cluster.
                cpuCoreCount:
                  $ref: "#/components/schemas/CreateCloudVmClusterInputCpuCoreCountInteger"
                  description: The number of CPU cores to enable on the VM cluster.
                displayName:
                  $ref: "#/components/schemas/ResourceDisplayName"
                  description: A user-friendly name for the VM cluster.
                giVersion:
                  $ref: "#/components/schemas/CreateCloudVmClusterInputGiVersionString"
                  description: "A valid software version of Oracle Grid Infrastructure (GI). To get the list of valid values, use the ListGiVersions operation and specify the shape of the Exadata infrastructure. Example: 19.0.0.0"
                hostname:
                  $ref: "#/components/schemas/Hostname"
                  description: "The host name for the VM cluster. Constraints: Can't be \"localhost\" or \"hostname\". Can't contain \"-version\". The maximum length of the combined hostname and domain is 63 characters. The hostname must be unique within the subnet."
                sshPublicKeys:
                  $ref: "#/components/schemas/StringList"
                  description: The public key portion of one or more key pairs used for SSH access to the VM cluster.
                odbNetworkId:
                  $ref: "#/components/schemas/ResourceIdOrArn"
                  description: The unique identifier of the ODB network for the VM cluster.
                clusterName:
                  $ref: "#/components/schemas/ClusterName"
                  description: A name for the Grid Infrastructure cluster. The name isn't case sensitive.
                dataCollectionOptions:
                  $ref: "#/components/schemas/DataCollectionOptions"
                  description: The set of preferences for the various diagnostic collection options for the VM cluster.
                dataStorageSizeInTBs:
                  $ref: "#/components/schemas/Double"
                  description: The size of the data disk group, in terabytes (TBs), to allocate for the VM cluster.
                dbNodeStorageSizeInGBs:
                  $ref: "#/components/schemas/Integer"
                  description: The amount of local node storage, in gigabytes (GB), to allocate for the VM cluster.
                dbServers:
                  $ref: "#/components/schemas/StringList"
                  description: The list of database servers for the VM cluster.
                tags:
                  $ref: "#/components/schemas/RequestTagMap"
                  description: The list of resource tags to apply to the VM cluster.
                isLocalBackupEnabled:
                  $ref: "#/components/schemas/Boolean"
                  description: Specifies whether to enable database backups to local Exadata storage for the VM cluster.
                isSparseDiskgroupEnabled:
                  $ref: "#/components/schemas/Boolean"
                  description: Specifies whether to create a sparse disk group for the VM cluster.
                licenseModel:
                  $ref: "#/components/schemas/LicenseModel"
                  description: "The Oracle license model to apply to the VM cluster. Default: LICENSE_INCLUDED"
                memorySizeInGBs:
                  $ref: "#/components/schemas/Integer"
                  description: The amount of memory, in gigabytes (GB), to allocate for the VM cluster.
                systemVersion:
                  $ref: "#/components/schemas/CreateCloudVmClusterInputSystemVersionString"
                  description: The version of the operating system of the image for the VM cluster.
                timeZone:
                  $ref: "#/components/schemas/CreateCloudVmClusterInputTimeZoneString"
                  description: "The time zone for the VM cluster. For a list of valid values for time zone, you can check the options in the console. Default: UTC"
                clientToken:
                  $ref: "#/components/schemas/CreateCloudVmClusterInputClientTokenString"
                  description: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, the Amazon Web Services SDK automatically generates a client token and uses it for the request to ensure idempotency. The client token is valid for up to 24 hours after it's first used.
                scanListenerPortTcp:
                  $ref: "#/components/schemas/CreateCloudVmClusterInputScanListenerPortTcpInteger"
                  description: "The port number for TCP connections to the single client access name (SCAN) listener. Valid values: 1024–8999 with the following exceptions: 2484, 6100, 6200, 7060, 7070, 7085, and 7879 Default: 1521"
              required:
                - cloudExadataInfrastructureId
                - cpuCoreCount
                - displayName
                - giVersion
                - hostname
                - sshPublicKeys
                - odbNetworkId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCloudVmClusterOutput"
  /CreateExadbVmCluster:
    post:
      operationId: CreateExadbVmCluster
      description: Creates an Exascale VM cluster.
      parameters:
