components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    String:
      type: string
    AcceptMarketplaceRegistrationOutput:
      type: object
    RoleArn:
      type: string
      minLength: 20
      maxLength: 2048
      pattern: arn:(?:aws|aws-cn|aws-us-gov|aws-iso-{0,1}[a-z]{0,1}):iam::[0-9]{12}:role/.+
    SupportedAwsIntegration:
      type: string
      enum:
        - KmsTde
    AssociateIamRoleToResourceInputResourceArnString:
      type: string
      minLength: 20
      maxLength: 2048
      pattern: arn:(?:aws|aws-cn|aws-us-gov|aws-iso-[a-z]?|aws-iso):odb:[a-z0-9-]+:\d{12}:(?:cloud-vm-cluster|cloud-autonomous-vm-cluster|exadb-vm-cluster)/[a-z0-9-_]+
    AssociateIamRoleToResourceOutput:
      type: object
    ResourceIdOrArn:
      type: string
      minLength: 6
      maxLength: 2048
      pattern: (arn:(?:aws|aws-cn|aws-us-gov|aws-iso-{0,1}[a-z]{0,1}):[a-z0-9-]+:[a-z0-9-]*:[0-9]+:[a-z0-9-]+/[a-zA-Z0-9_~.-]{6,64}|[a-zA-Z0-9_~.-]{6,64})
    AssociateVirtualMachinesToExadbVmClusterInputDesiredNodeCountInteger:
      type: integer
      minimum: 1
    AssociateVirtualMachinesToExadbVmClusterOutput:
      type: object
      properties:
        displayName:
          $ref: "#/components/schemas/String"
          description: The user-friendly name for the Exascale VM cluster.
        status:
          $ref: "#/components/schemas/ResourceStatus"
          description: The current status of the Exascale VM cluster.
        statusReason:
          $ref: "#/components/schemas/String"
          description: Additional information about the status of the Exascale VM cluster.
        exadbVmClusterId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the Exascale VM cluster.
      required:
        - exadbVmClusterId
    ResourceStatus:
      type: string
      enum:
        - AVAILABLE
        - FAILED
        - PROVISIONING
        - TERMINATED
        - TERMINATING
        - UPDATING
        - MAINTENANCE_IN_PROGRESS
    ResourceDisplayName:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "[a-zA-Z_](?!.*--)[a-zA-Z0-9_-]*"
    CreateAutonomousDatabaseInputDbNameString:
      type: string
      minLength: 1
      maxLength: 30
    CreateAutonomousDatabaseInputAdminPasswordString:
      type: string
      minLength: 12
      maxLength: 30
    CreateAutonomousDatabaseInputComputeCountDouble:
      type: number
      format: double
      minimum: 0.1
      maximum: 512
    CreateAutonomousDatabaseInputDataStorageSizeInTBsInteger:
      type: integer
      minimum: 1
      maximum: 384
    CreateAutonomousDatabaseInputDataStorageSizeInGBsInteger:
      type: integer
      minimum: 20
      maximum: 393216
    DbWorkload:
      type: string
      enum:
        - OLTP
        - AJD
        - APEX
        - LH
    Boolean:
      type: boolean
    LicenseModel:
      type: string
      enum:
        - BRING_YOUR_OWN_LICENSE
        - LICENSE_INCLUDED
    CreateAutonomousDatabaseInputCharacterSetString:
      type: string
      minLength: 1
      maxLength: 255
    CreateAutonomousDatabaseInputNcharacterSetString:
      type: string
      minLength: 1
      maxLength: 255
    CreateAutonomousDatabaseInputDbVersionString:
      type: string
      minLength: 1
      maxLength: 255
    DatabaseEdition:
      type: string
      enum:
        - STANDARD_EDITION
        - ENTERPRISE_EDITION
    StandbyAllowlistedIpsSource:
      type: string
      enum:
        - PRIMARY
        - SEPARATE
        - NOT_APPLICABLE
    AutonomousMaintenanceScheduleType:
      type: string
      enum:
        - EARLY
        - REGULAR
    Integer:
      type: integer
    CreateAutonomousDatabaseInputByolComputeCountLimitDouble:
      type: number
      format: double
      minimum: 2
    CreateAutonomousDatabaseInputCpuCoreCountInteger:
      type: integer
      minimum: 1
      maximum: 128
    CustomerContacts:
      type: array
      items:
        $ref: "#/components/schemas/CustomerContact"
    CustomerContact:
      description: A contact to receive notification from Oracle about maintenance updates for a specific Exadata infrastructure.
      type: object
      properties:
        email:
          $ref: "#/components/schemas/CustomerContactEmailString"
          description: The email address of the contact.
    CustomerContactEmailString:
      type: string
      minLength: 1
      maxLength: 320
    ResourcePoolSummary:
      description: The configuration of a resource pool for an Autonomous Database.
      type: object
      properties:
        isDisabled:
          $ref: "#/components/schemas/Boolean"
          description: Indicates whether the resource pool is disabled.
        poolSize:
          $ref: "#/components/schemas/Integer"
          description: The number of Autonomous Databases that the resource pool can contain.
        poolStorageSizeInTBs:
          $ref: "#/components/schemas/Integer"
          description: The total storage size of the resource pool, in terabytes (TB).
        availableStorageCapacityInTBs:
          $ref: "#/components/schemas/Double"
          description: The available storage capacity in the resource pool, in TB.
        totalComputeCapacity:
          $ref: "#/components/schemas/Integer"
          description: The total compute capacity of the resource pool.
        availableComputeCapacity:
          $ref: "#/components/schemas/Integer"
          description: The available compute capacity in the resource pool.
    Double:
      type: number
      format: double
    ScheduledOperationDetailsList:
      type: array
      items:
        $ref: "#/components/schemas/ScheduledOperationDetails"
    ScheduledOperationDetails:
      description: The scheduled start and stop times for an Autonomous Database on a specific day of the week.
      type: object
      properties:
        dayOfWeek:
          $ref: "#/components/schemas/DayOfWeek"
          description: The day of the week on which the scheduled operation occurs.
        scheduledStartTime:
          $ref: "#/components/schemas/String"
          description: The scheduled start time for the Autonomous Database, in UTC.
