openapi: 3.0.0
info:
  version: "2015-05-28"
  title: AWS IoT Data Plane
  description: AWS IoT Data Plane
  x-serviceName: iotdata
  x-serviceAlias: iot_data
  x-protocol: rest-json
  x-apiVersion: "2015-05-28"
  x-endpointPrefix: data-ats.iot
servers:
  - url: https://data-ats.iot.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for iot-data
paths:
  /connections/{client_id}:
    delete:
      operationId: DeleteConnection
      description: Disconnects a connected MQTT client from Amazon Web Services IoT Core. When you disconnect a client, Amazon Web Services IoT Core closes the client's network connection and optionally cleans the session state. Requires permission to access the DeleteConnection action.
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ClientId"
          description: The unique identifier of the MQTT client to disconnect. The client ID can't start with a dollar sign ($). MQTT client IDs must be URL encoded (percent-encoded) when they contain characters that are not valid in HTTP requests, such as spaces, forward slashes (/), and UTF-8 characters.
        - name: cleanSession
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CleanSession"
          description: Specifies whether to remove the client's persistent session state when disconnecting. Set to TRUE to delete all session information, including subscriptions and queued messages. Set to FALSE to preserve the session state for persistent sessions. For clean sessions this parameter will be ignored. By default, this is set to FALSE (preserves the session state).
        - name: preventWillMessage
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PreventWillMessage"
          description: Controls if Amazon Web Services IoT Core publishes the client's Last Will and Testament (LWT) message upon disconnection. Set to TRUE to prevent publishing the LWT message. Set to FALSE to ensure that LWT is published. By default, this is set to FALSE (LWT message is published).
      responses:
        "200":
          description: Success
    get:
      operationId: GetConnection
      description: Retrieves connection information for the specified MQTT client. Requires permission to access the GetConnection action.
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ClientId"
          description: The unique identifier of the MQTT client to retrieve connection information. The client ID can't start with a dollar sign ($). MQTT client IDs must be URL encoded (percent-encoded) when they contain characters that are not valid in HTTP requests, such as spaces, forward slashes (/), and UTF-8 characters.
        - name: includeSocketInformation
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IncludeSocketInformation"
          description: Specifies if socket information (sourcePort, targetPort, sourceIp, targetIp) should be included in the GetConnection response. Set to TRUE to include socket information. Set to FALSE to omit socket information. By default, this is set to FALSE. See the developer guide for how to authorize this parameter.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetConnectionResponse"
  /things/{thing_name}/shadow:
    delete:
      operationId: DeleteThingShadow
      description: Deletes the shadow for the specified thing. Requires permission to access the DeleteThingShadow action. For more information, see DeleteThingShadow in the IoT Developer Guide.
      parameters:
        - name: thing_name
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ThingName"
          description: The name of the thing.
        - name: name
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ShadowName"
          description: The name of the shadow.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteThingShadowResponse"
    get:
      operationId: GetThingShadow
      description: Gets the shadow for the specified thing. Requires permission to access the GetThingShadow action. For more information, see GetThingShadow in the IoT Developer Guide.
      parameters:
        - name: thing_name
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ThingName"
          description: The name of the thing.
        - name: name
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ShadowName"
          description: The name of the shadow.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetThingShadowResponse"
    post:
      operationId: UpdateThingShadow
      description: Updates the shadow for the specified thing. Requires permission to access the UpdateThingShadow action. For more information, see UpdateThingShadow in the IoT Developer Guide.
      parameters:
        - name: thing_name
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ThingName"
          description: The name of the thing.
        - name: name
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ShadowName"
          description: The name of the shadow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  $ref: "#/components/schemas/JsonDocument"
              required:
                - payload
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateThingShadowResponse"
  /retainedMessage/{topic}:
    get:
      operationId: GetRetainedMessage
      description: Gets the details of a single retained message for the specified topic. This action returns the message payload of the retained message, which can incur messaging costs. To list only the topic names of the retained messages, call ListRetainedMessages. Requires permission to access the GetRetainedMessage action. For more information about messaging costs, see Amazon Web Services IoT Core pricing - Messaging.
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Topic"
          description: The topic name of the retained message to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRetainedMessageResponse"
  /api/things/shadow/ListNamedShadowsForThing/{thing_name}:
    get:
      operationId: ListNamedShadowsForThing
      description: Lists the shadows for the specified thing. Requires permission to access the ListNamedShadowsForThing action.
      parameters:
        - name: thing_name
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ThingName"
          description: The name of the thing.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextToken"
          description: The token to retrieve the next set of results.
        - name: pageSize
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PageSize"
          description: The result page size.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNamedShadowsForThingResponse"
  /retainedMessage:
    get:
      operationId: ListRetainedMessages
      description: Lists summary information about the retained messages stored for the account. This action returns only the topic names of the retained messages. It doesn't return any message payloads. Although this action doesn't return a message payload, it can still incur messaging costs. To get the message payload of a retained message, call GetRetainedMessage with the topic name of the retained message. Requires permission to access the ListRetainedMessages action. For more information about messaging costs, see Amazon Web Services IoT Core pricing - Messaging.
      parameters:
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextToken"
          description: To retrieve the next set of results, the nextToken value from a previous response; otherwise null to receive the first set of results.
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResults"
          description: The maximum number of results to return at one time.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRetainedMessagesResponse"
  /connections/{client_id}/subscriptions:
    get:
      operationId: ListSubscriptions
      description: Returns a list of all subscriptions for MQTT clients with active sessions, including offline clients with persistent sessions. Requires permission to access the ListSubscriptions action.
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ClientId"
          description: The unique identifier of the MQTT client to list subscriptions for. The client ID can't start with a dollar sign ($). MQTT client IDs must be URL encoded (percent-encoded) when they contain characters that are not valid in HTTP requests, such as spaces, forward slashes (/), and UTF-8 characters.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextToken"
          description: To retrieve the next set of results, the nextToken value from a previous response; otherwise null to receive the first set of results.
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResults"
          description: The maximum number of subscriptions to return in a single request. By default, this is set to 20.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSubscriptionsResponse"
  /topics/{topic}:
    post:
      operationId: Publish
      description: Publishes an MQTT message. Requires permission to access the Publish action. For more information about MQTT messages, see MQTT Protocol in the IoT Developer Guide. For more information about messaging costs, see Amazon Web Services IoT Core pricing - Messaging.
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Topic"
          description: The name of the MQTT topic.
        - name: qos
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Qos"
          description: The Quality of Service (QoS) level. The default QoS level is 0.
        - name: retain
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Retain"
          description: "A Boolean value that determines whether to set the RETAIN flag when the message is published. Setting the RETAIN flag causes the message to be retained and sent to new subscribers to the topic. Valid values: true | false Default value: false"
        - name: x-amz-mqtt5-user-properties
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/UserProperties"
          description: 'A JSON string that contains an array of JSON objects. If you don’t use Amazon Web Services SDK or CLI, you must encode the JSON string to base64 format before adding it to the HTTP header. userProperties is an HTTP header value in the API. The following example userProperties parameter is a JSON string which represents two User Properties. Note that it needs to be base64-encoded: [{"deviceName": "alpha"}, {"deviceCnt": "45"}]'
        - name: x-amz-mqtt5-payload-format-indicator
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/PayloadFormatIndicator"
          description: An Enum string value that indicates whether the payload is formatted as UTF-8. payloadFormatIndicator is an HTTP header value in the API.
        - name: contentType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ContentType"
          description: A UTF-8 encoded string that describes the content of the publishing message.
        - name: responseTopic
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ResponseTopic"
          description: A UTF-8 encoded string that's used as the topic name for a response message. The response topic is used to describe the topic which the receiver should publish to as part of the request-response flow. The topic must not contain wildcard characters.
        - name: x-amz-mqtt5-correlation-data
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/CorrelationData"
          description: The base64-encoded binary data used by the sender of the request message to identify which request the response message is for when it's received. correlationData is an HTTP header value in the API.
        - name: messageExpiry
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MessageExpiry"
          description: A user-defined integer value that represents the message expiry interval in seconds. If absent, the message doesn't expire. For more information about the limits of messageExpiry, see Amazon Web Services IoT Core message broker and protocol limits and quotas from the Amazon Web Services Reference Guide.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  $ref: "#/components/schemas/Payload"
      responses:
        "200":
          description: Success
  /connections/{client_id}/messages:
    post:
      operationId: SendDirectMessage
      description: Sends an MQTT message directly to a specific client identified by its client ID. SendDirectMessage targets a single client ID. The receiving client does not need to subscribe to the topic, but the receiver's policy must allow iot:Receive on the specified topic. Requires permission to access the SendDirectMessage action. For more information about messaging costs, see Amazon Web Services IoT Core pricing.
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ClientId"
          description: The unique identifier of the MQTT client to send the message to. Client IDs must not exceed 128 characters and can't start with a dollar sign ($). MQTT client IDs must be URL encoded (percent-encoded) when they contain characters that are not valid in HTTP requests, such as spaces, forward slashes (/), and UTF-8 characters. For more information, see Amazon Web Services IoT Core message broker and protocol limits and quotas.
        - name: topic
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Topic"
          description: The topic of the outbound MQTT Publish message to the receiving client. For more information, see Amazon Web Services IoT Core message broker and protocol limits and quotas.
        - name: contentType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ContentType"
          description: The MQTT5 content type property forwarded to the receiving client (for example, application/json).
        - name: responseTopic
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ResponseTopic"
          description: A UTF-8 encoded string that's used as the topic name for a response message. The response topic describes the topic which the receiver should publish to as part of the request-response flow. The topic must not contain wildcard characters. For more information, see Amazon Web Services IoT Core message broker and protocol limits and quotas.
        - name: confirmation
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Confirmation"
          description: "A Boolean value that specifies whether to wait for delivery confirmation from the receiving client. When set to true, the API delivers the message at QoS 1 and waits for the client to send a delivery confirmation (PUBACK) before returning a successful response. If delivery confirmation is not received within the specified timeout period, the API returns HTTP 504. When set to false, the API delivers the message at QoS 0 and returns after Amazon Web Services IoT Core attempts to deliver the message. Valid values: true | false Default value: false"
        - name: timeout
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TimeoutInSeconds"
          description: "An integer that represents the maximum time, in seconds, to wait for a delivery confirmation (PUBACK) from the receiving client after the message has been delivered. This parameter is only used when confirmation is set to true. If confirmation is false, this parameter is ignored. The total API response time may be higher than this value due to internal processing. Set your HTTP client timeout to a value greater than this parameter. Valid range: 1 to 15 seconds. Default value: 5 seconds."
        - name: x-amz-mqtt5-user-properties
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/UserProperties"
          description: "A JSON string that contains an array of JSON objects. If you don't use Amazon Web Services SDK or CLI, you must encode the JSON string to base64 format before adding it to the HTTP header. userProperties is an HTTP header value in the API. For MQTT 3.1.1 clients, user properties are silently dropped. The following example userProperties parameter is a JSON string which represents two User Properties. Note that it needs to be base64-encoded: [{\"deviceName\": \"alpha\"}, {\"deviceCnt\": \"45\"}]"
        - name: x-amz-mqtt5-payload-format-indicator
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/PayloadFormatIndicator"
          description: An Enum string value that indicates whether the payload is formatted as UTF-8. payloadFormatIndicator is an HTTP header value in the API.
        - name: x-amz-mqtt5-correlation-data
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/CorrelationData"
          description: The base64-encoded binary data used by the sender of the request message to identify which request the response message is for when it's received. correlationData is an HTTP header value in the API.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  $ref: "#/components/schemas/Payload"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendDirectMessageResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    ClientId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[^$].*
    CleanSession:
      type: boolean
    PreventWillMessage:
      type: boolean
    ThingName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "[a-zA-Z0-9:_-]+"
    ShadowName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "[$a-zA-Z0-9:_-]+"
    DeleteThingShadowResponse:
      description: The output from the DeleteThingShadow operation.
      type: object
      properties:
        payload:
          $ref: "#/components/schemas/JsonDocument"
          description: The state information, in JSON format.
      required:
        - payload
    JsonDocument:
      type: string
      format: byte
    IncludeSocketInformation:
      type: boolean
    GetConnectionResponse:
      type: object
      properties:
        connected:
          $ref: "#/components/schemas/Connected"
          description: The connection state of the client. Returns true if the client is currently connected, or false if the client is not connected.
        thingName:
          $ref: "#/components/schemas/ThingName"
          description: The name of the thing associated with the principal of the MQTT client, if applicable.
        cleanSession:
          $ref: "#/components/schemas/CleanSession"
          description: Indicates whether the client is using a clean session. Returns true for clean sessions or false for persistent sessions.
        sourceIp:
          $ref: "#/components/schemas/SourceIp"
          description: The IP address of the client that initiated the connection.
        sourcePort:
          $ref: "#/components/schemas/SourcePort"
          description: The client's source port.
        targetIp:
          $ref: "#/components/schemas/TargetIp"
          description: The IP address of the Amazon Web Services IoT Core endpoint that the client connected to. For clients connected to VPC endpoints, this is the private IP address of the network interface the client is connected to.
        targetPort:
          $ref: "#/components/schemas/TargetPort"
          description: The port number of the Amazon Web Services IoT Core endpoint that the client connected to.
        keepAliveDuration:
          $ref: "#/components/schemas/KeepAliveDuration"
          description: The keep-alive interval in seconds that the client specified when establishing the connection.
        connectedSince:
          $ref: "#/components/schemas/Timestamp"
          description: Unix timestamp (in milliseconds) indicating when the client connected. Present only when connected is true.
        disconnectedSince:
          $ref: "#/components/schemas/Timestamp"
          description: Unix timestamp (in milliseconds) indicating when the client disconnected. Present only when connected is false. This information is available for 30 minutes after the client disconnects.
        disconnectReason:
          $ref: "#/components/schemas/DisconnectReason"
          description: The reason for the last disconnection, if the client is currently disconnected. See the developer guide for valid disconnect reasons.
        sessionExpiry:
          $ref: "#/components/schemas/SessionExpiry"
          description: The session expiry interval in seconds for the MQTT client connection. This is configured by the user. This value indicates how long the session will remain active after the client disconnects.
        clientId:
          $ref: "#/components/schemas/ClientId"
          description: The unique identifier of the MQTT client. This is the same client ID that was used when the client established the connection.
        vpcEndpointId:
          $ref: "#/components/schemas/VpcEndpointId"
          description: The ID of the VPC endpoint. Present for clients connected to IoT Core via a VPC endpoint.
    Connected:
      type: boolean
    SourceIp:
      type: string
    SourcePort:
      type: integer
    TargetIp:
      type: string
    TargetPort:
      type: integer
    KeepAliveDuration:
      type: integer
    Timestamp:
      type: integer
      format: int64
    DisconnectReason:
      type: string
    SessionExpiry:
      type: integer
      format: int64
    VpcEndpointId:
      type: string
    Topic:
      type: string
    GetRetainedMessageResponse:
      description: The output from the GetRetainedMessage operation.
      type: object
      properties:
        topic:
          $ref: "#/components/schemas/Topic"
          description: The topic name to which the retained message was published.
        payload:
          $ref: "#/components/schemas/Payload"
          description: The Base64-encoded message payload of the retained message body.
        qos:
          $ref: "#/components/schemas/Qos"
          description: The quality of service (QoS) level used to publish the retained message.
        lastModifiedTime:
          $ref: "#/components/schemas/Timestamp"
          description: The Epoch date and time, in milliseconds, when the retained message was stored by IoT.
        userProperties:
          $ref: "#/components/schemas/UserPropertiesBlob"
          description: "A base64-encoded JSON string that includes an array of JSON objects, or null if the retained message doesn't include any user properties. The following example userProperties parameter is a JSON string that represents two user properties. Note that it will be base64-encoded: [{\"deviceName\": \"alpha\"}, {\"deviceCnt\": \"45\"}]"
    Payload:
      type: string
      format: byte
    Qos:
      type: integer
      minimum: 0
      maximum: 1
    UserPropertiesBlob:
      type: string
      format: byte
    GetThingShadowResponse:
      description: The output from the GetThingShadow operation.
      type: object
      properties:
        payload:
          $ref: "#/components/schemas/JsonDocument"
          description: The state information, in JSON format.
    NextToken:
      type: string
    PageSize:
      type: integer
      minimum: 1
      maximum: 100
    ListNamedShadowsForThingResponse:
      type: object
      properties:
        results:
          $ref: "#/components/schemas/NamedShadowList"
          description: The list of shadows for the specified thing.
        nextToken:
          $ref: "#/components/schemas/NextToken"
          description: The token to use to get the next set of results, or null if there are no additional results.
        timestamp:
          $ref: "#/components/schemas/Timestamp"
          description: The Epoch date and time the response was generated by IoT.
    NamedShadowList:
      type: array
      items:
        $ref: "#/components/schemas/ShadowName"
    MaxResults:
      type: integer
      minimum: 1
      maximum: 200
    ListRetainedMessagesResponse:
      type: object
      properties:
        retainedTopics:
          $ref: "#/components/schemas/RetainedMessageList"
          description: A summary list the account's retained messages. The information returned doesn't include the message payloads of the retained messages.
        nextToken:
          $ref: "#/components/schemas/NextToken"
          description: The token for the next set of results, or null if there are no additional results.
    RetainedMessageList:
      type: array
      items:
        $ref: "#/components/schemas/RetainedMessageSummary"
    RetainedMessageSummary:
      description: Information about a single retained message.
      type: object
      properties:
        topic:
          $ref: "#/components/schemas/Topic"
          description: The topic name to which the retained message was published.
        payloadSize:
          $ref: "#/components/schemas/PayloadSize"
          description: The size of the retained message's payload in bytes.
        qos:
          $ref: "#/components/schemas/Qos"
          description: The quality of service (QoS) level used to publish the retained message.
        lastModifiedTime:
          $ref: "#/components/schemas/Timestamp"
          description: The Epoch date and time, in milliseconds, when the retained message was stored by IoT.
    PayloadSize:
      type: integer
      format: int64
    ListSubscriptionsResponse:
      type: object
      properties:
        subscriptions:
          $ref: "#/components/schemas/SubscriptionList"
          description: A list of topic filters and their associated Quality of Service (QoS) levels that the client is subscribed to.
        nextToken:
          $ref: "#/components/schemas/NextToken"
          description: The token to use to get the next set of results, or null if there are no additional results.
    SubscriptionList:
      type: array
      items:
        $ref: "#/components/schemas/SubscriptionSummary"
    SubscriptionSummary:
      description: Contains information about a subscription for an MQTT client, including the topic filter and Quality of Service (QoS) level.
      type: object
      properties:
        topicFilter:
          $ref: "#/components/schemas/TopicFilter"
          description: "The topic filter pattern that the client is subscribed to. May include MQTT wildcards such as + (single-level) and # (multi-level)."
        qos:
          $ref: "#/components/schemas/Qos"
          description: The Quality of Service (QoS) level for the subscription. Valid values are 0 (at most once) and 1 (at least once).
      required:
        - topicFilter
        - qos
    TopicFilter:
      type: string
    Retain:
      type: boolean
    UserProperties:
      type: string
    PayloadFormatIndicator:
      type: string
      enum:
        - UNSPECIFIED_BYTES
        - UTF8_DATA
    ContentType:
      type: string
    ResponseTopic:
      type: string
    CorrelationData:
      type: string
    MessageExpiry:
      type: integer
      format: int64
    Confirmation:
      type: boolean
    TimeoutInSeconds:
      type: integer
    SendDirectMessageResponse:
      description: The output from the SendDirectMessage operation.
      type: object
      properties:
        message:
          $ref: "#/components/schemas/ResponseMessage"
          description: The status message indicating the result of the operation.
