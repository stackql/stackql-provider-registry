openapi: 3.0.0
info:
  version: "2025-12-01"
  title: Agent Registry Control
  description: Agent Registry Control
  x-serviceName: agent-registry
  x-serviceAlias: agent_registry_control
  x-protocol: rest-json
  x-apiVersion: "2025-12-01"
  x-endpointPrefix: agent-registry-control
servers:
  - url: https://agent-registry-control.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for agent-registry-control
paths:
  /registries:
    post:
      operationId: CreateRegistry
      description: "Creates a new registry, a catalog that organizes registry records and defines their discovery authorization and record approval behavior. Creation is asynchronous: the registry begins in the CREATING status and becomes usable once it reaches READY."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/RegistryName"
                description:
                  $ref: "#/components/schemas/Description"
                discoveryConfiguration:
                  $ref: "#/components/schemas/DiscoveryConfiguration"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
                tags:
                  $ref: "#/components/schemas/TagsMap"
                approvalConfiguration:
                  $ref: "#/components/schemas/ApprovalConfiguration"
              required:
                - name
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRegistryResponse"
  /registries/{registry_id}/records:
    post:
      operationId: CreateRegistryRecord
      description: "Creates a registry record within a registry. A registry record describes a discoverable resource, such as an MCP server, an agent, an agent skill, or a custom resource. Creation is asynchronous: the record is returned with the CREATING status while it is processed."
      parameters:
        - name: registry_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RegistryIdentifier"
          description: The identifier of the registry in which to create the record (ARN or ID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/RegistryRecordName"
                displayName:
                  $ref: "#/components/schemas/RegistryRecordDisplayName"
                description:
                  $ref: "#/components/schemas/Description"
                recordType:
                  $ref: "#/components/schemas/RecordType"
                descriptors:
                  $ref: "#/components/schemas/Descriptors"
                recordVersion:
                  $ref: "#/components/schemas/RegistryRecordVersion"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
                tags:
                  $ref: "#/components/schemas/TagsMap"
              required:
                - name
                - recordType
                - descriptors
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRegistryRecordResponse"
  /registries/{registry_id}:
    delete:
      operationId: DeleteRegistry
      description: "Deletes a registry. Deletion is asynchronous: the registry transitions to the DELETING status and is removed along with its registry records."
      parameters:
        - name: registry_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RegistryIdentifier"
          description: The identifier of the registry to delete (ARN or ID)
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRegistryResponse"
    get:
      operationId: GetRegistry
      description: Gets a registry by identifier (ARN or ID)
      parameters:
        - name: registry_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RegistryIdentifier"
          description: The identifier of the registry to retrieve (ARN or ID)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRegistryResponse"
    patch:
      operationId: UpdateRegistry
      description: "Updates an existing registry. This operation uses PATCH semantics: specify only the fields you want to change, and omit the rest to leave them unchanged. Updates are applied asynchronously and the registry transitions to the UPDATING status while they are processed."
      parameters:
        - name: registry_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RegistryIdentifier"
          description: The identifier of the registry to update (ARN or ID)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/RegistryName"
                description:
                  $ref: "#/components/schemas/UpdatedDescription"
                discoveryConfiguration:
                  $ref: "#/components/schemas/UpdatedDiscoveryConfiguration"
                approvalConfiguration:
                  $ref: "#/components/schemas/UpdatedApprovalConfiguration"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRegistryResponse"
  /registries/{registry_id}/records/{record_id}:
    delete:
      operationId: DeleteRegistryRecord
      description: Deletes a registry record
      parameters:
        - name: registry_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RegistryIdentifier"
          description: The identifier of the registry containing the record (ARN or ID)
        - name: record_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RecordIdentifier"
          description: The identifier of the registry record to delete (ARN or ID)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRegistryRecordResponse"
    get:
      operationId: GetRegistryRecord
      description: Retrieves the details of a registry record
      parameters:
        - name: registry_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RegistryIdentifier"
          description: The identifier of the registry containing the record (ARN or ID)
        - name: record_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RecordIdentifier"
          description: The identifier of the registry record to retrieve (ARN or ID)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRegistryRecordResponse"
    patch:
      operationId: UpdateRegistryRecord
      description: "Updates a registry record. The update is asynchronous: the record is returned with the UPDATING status while it is processed. Fields that use update wrappers follow PATCH semantics: omit the field to leave it unchanged."
      parameters:
        - name: registry_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RegistryIdentifier"
          description: The identifier of the registry containing the record (ARN or ID)
        - name: record_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RecordIdentifier"
          description: The identifier of the registry record to update (ARN or ID)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/RegistryRecordName"
                displayName:
                  $ref: "#/components/schemas/UpdatedDisplayName"
                description:
                  $ref: "#/components/schemas/UpdatedDescription"
                recordType:
                  $ref: "#/components/schemas/RecordType"
                descriptors:
                  $ref: "#/components/schemas/UpdatedDescriptors"
                recordVersion:
                  $ref: "#/components/schemas/RegistryRecordVersion"
                triggerSynchronization:
                  $ref: "#/components/schemas/Boolean"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRegistryRecordResponse"
  /registries-list:
    post:
      operationId: ListRegistries
      description: Lists the registries in the caller's account and Region, with optional filtering by status and discovery authorizer type
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                maxResults:
                  $ref: "#/components/schemas/MaxResults"
                nextToken:
                  $ref: "#/components/schemas/NextToken"
                filters:
                  $ref: "#/components/schemas/RegistryFilterList"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRegistriesResponse"
  /registries/{registry_id}/records-list:
    post:
      operationId: ListRegistryRecords
      description: Lists the registry records within a registry, with optional filtering by name, status, and record type
      parameters:
        - name: registry_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RegistryIdentifier"
          description: The identifier of the registry to list records from (ARN or ID)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                maxResults:
                  $ref: "#/components/schemas/MaxResults"
                nextToken:
                  $ref: "#/components/schemas/NextToken"
                filters:
                  $ref: "#/components/schemas/RegistryRecordFilterList"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRegistryRecordsResponse"
  /tags/{resource_arn}:
    get:
      operationId: ListTagsForResource
      description: List the tags on a resource
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceArn"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTagsForResourceResponse"
    post:
      operationId: TagResource
      description: Tag a resource with key-value pairs
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceArn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  $ref: "#/components/schemas/TagsMap"
              required:
                - tags
      responses:
        "204":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResourceResponse"
    delete:
      operationId: UntagResource
      description: Remove tags from a resource by key
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceArn"
        - name: tagKeys
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TagKeyList"
      responses:
        "204":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UntagResourceResponse"
  /registries/{registry_id}/records/{record_id}/submit-for-approval:
    post:
      operationId: SubmitRegistryRecordForApproval
      description: Submits a DRAFT registry record for approval, moving it into the registry's approval workflow. Depending on the registry's approval configuration, the record is either auto-approved or set to PENDING_APPROVAL for a curator to approve or reject.
      parameters:
        - name: registry_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RegistryIdentifier"
          description: The identifier of the registry containing the record (ARN or ID)
        - name: record_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RecordIdentifier"
          description: The identifier of the registry record to submit for approval (ARN or ID)
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitRegistryRecordForApprovalResponse"
  /registries/{registry_id}/records/{record_id}/status:
    patch:
      operationId: UpdateRegistryRecordStatus
      description: Updates the status of a registry record as part of the registry's curation workflow, for example to approve or reject a record that is pending approval, or to deprecate an approved record so that it is no longer discoverable
      parameters:
        - name: registry_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RegistryIdentifier"
          description: The identifier of the registry containing the record (ARN or ID)
        - name: record_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RecordIdentifier"
          description: The identifier of the registry record to update the status of (ARN or ID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/RegistryRecordStatus"
                statusReason:
                  $ref: "#/components/schemas/UpdateRegistryRecordStatusRequestStatusReasonString"
              required:
                - status
                - statusReason
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRegistryRecordStatusResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    RegistryName:
      description: Registry name with validation pattern
      type: string
      minLength: 1
      maxLength: 64
      pattern: "[a-zA-Z0-9][a-zA-Z0-9_\\-\\.\\/]*"
    Description:
      description: Description of the Resource
      type: string
      minLength: 1
      maxLength: 4096
    DiscoveryConfiguration:
      description: Discovery configuration for the registry. Controls how consumers are authorized to search the registry and invoke its MCP endpoint.
      type: object
      properties:
        authorizerConfiguration:
          $ref: "#/components/schemas/AuthorizerConfiguration"
          description: The authorizer configuration for the registry. Required when authorizerType is CUSTOM_JWT.
        authorizerType:
          $ref: "#/components/schemas/RegistryAuthorizerType"
          description: The type of authorizer that controls how consumers access the registry's search and MCP invoke operations.
    AuthorizerConfiguration:
      description: The authorizer configuration for a registry. Exactly one member is set.
      type: object
      properties:
        customJWTAuthorizer:
          $ref: "#/components/schemas/CustomJWTAuthorizerConfiguration"
          description: Configuration for a custom JWT authorizer.
    CustomJWTAuthorizerConfiguration:
      description: Configuration for a custom JWT authorizer that validates inbound bearer tokens against an OpenID Connect identity provider.
      type: object
      properties:
        discoveryUrl:
          $ref: "#/components/schemas/DiscoveryUrl"
          description: The OpenID Connect discovery URL used to retrieve the identity provider's metadata and signing keys.
        allowedAudience:
          $ref: "#/components/schemas/AllowedAudienceList"
          description: The audience values accepted during JWT validation. A token is rejected if none of its audience claims match.
        allowedClients:
          $ref: "#/components/schemas/AllowedClientsList"
          description: The client identifiers accepted during JWT validation. A token is rejected if it was not issued to one of these clients.
        allowedScopes:
          $ref: "#/components/schemas/AllowedScopesType"
          description: The scopes accepted during JWT validation. A token is rejected if it does not carry one of these scopes.
        customClaims:
          $ref: "#/components/schemas/CustomClaimValidationsType"
          description: Additional custom claim validations applied to the inbound JWT.
        privateEndpoint:
          $ref: "#/components/schemas/PrivateEndpoint"
          description: The private endpoint used to reach the identity provider's discovery URL over a private network path.
        privateEndpointOverrides:
          $ref: "#/components/schemas/PrivateEndpointOverrides"
          description: Per-domain private endpoint overrides that route specific identity provider domains through distinct private endpoints.
      required:
        - discoveryUrl
    DiscoveryUrl:
      description: The OpenID Connect discovery URL, ending in /.well-known/openid-configuration, used to retrieve the identity provider's metadata and signing keys.
      type: string
      minLength: 1
      maxLength: 2048
      pattern: .+/\.well-known/openid-configuration
    AllowedAudienceList:
      description: The list of audience values accepted during JWT validation.
      type: array
      items:
        $ref: "#/components/schemas/AllowedAudience"
    AllowedAudience:
      description: An audience value that an inbound JWT must contain to be authorized.
      type: string
      minLength: 1
      maxLength: 255
    AllowedClientsList:
      description: The list of client identifiers accepted during JWT validation.
      type: array
      items:
        $ref: "#/components/schemas/AllowedClient"
    AllowedClient:
      description: A client identifier that an inbound JWT must be issued to in order to be authorized.
      type: string
      minLength: 1
      maxLength: 255
    AllowedScopesType:
      description: The list of scopes accepted during JWT validation.
      type: array
      items:
        $ref: "#/components/schemas/AllowedScopeType"
    AllowedScopeType:
      description: A scope value that an inbound JWT must carry to be authorized.
      type: string
      minLength: 1
      maxLength: 255
      pattern: "[\\x21\\x23-\\x5B\\x5D-\\x7E]+"
    CustomClaimValidationsType:
      description: The list of custom claim validations applied to an inbound JWT.
      type: array
      items:
        $ref: "#/components/schemas/CustomClaimValidationType"
    CustomClaimValidationType:
      description: A validation rule applied to a single claim of an inbound JWT.
      type: object
      properties:
        inboundTokenClaimName:
          $ref: "#/components/schemas/InboundTokenClaimNameType"
          description: The name of the claim in the inbound token to validate.
        inboundTokenClaimValueType:
          $ref: "#/components/schemas/InboundTokenClaimValueType"
          description: The value type of the claim in the inbound token, either a string or an array of strings.
        authorizingClaimMatchValue:
          $ref: "#/components/schemas/AuthorizingClaimMatchValueType"
          description: The value and match operator used to authorize the claim.
      required:
        - inboundTokenClaimName
        - inboundTokenClaimValueType
        - authorizingClaimMatchValue
    InboundTokenClaimNameType:
      description: The name of a claim in an inbound JWT.
      type: string
      minLength: 1
      maxLength: 255
      pattern: "[A-Za-z0-9_.-:]+"
    InboundTokenClaimValueType:
      description: The value type of a claim in an inbound JWT.
      type: string
      enum:
        - STRING
        - STRING_ARRAY
    AuthorizingClaimMatchValueType:
      description: The value and match operator used to authorize a claim during JWT validation.
      type: object
      properties:
        claimMatchValue:
          $ref: "#/components/schemas/ClaimMatchValueType"
          description: The expected value or values that the claim is compared against.
        claimMatchOperator:
          $ref: "#/components/schemas/ClaimMatchOperatorType"
          description: The operator used to compare the claim value against the expected value.
      required:
        - claimMatchValue
        - claimMatchOperator
    ClaimMatchValueType:
      description: The expected value used to match a claim. Exactly one member is set.
      type: object
      properties:
        matchValueString:
          $ref: "#/components/schemas/MatchValueString"
          description: A single string value to match the claim against.
        matchValueStringList:
          $ref: "#/components/schemas/MatchValueStringList"
          description: A list of string values to match the claim against.
    MatchValueString:
      description: A single value used to match a claim during JWT validation.
      type: string
      minLength: 1
      maxLength: 255
      pattern: "[A-Za-z0-9_.:/-]+"
    MatchValueStringList:
      description: A list of values used to match a claim during JWT validation.
      type: array
      items:
        $ref: "#/components/schemas/MatchValueString"
    ClaimMatchOperatorType:
      description: The operator used to compare a claim value against the expected value during JWT validation.
      type: string
      enum:
        - EQUALS
        - CONTAINS
        - CONTAINS_ANY
    PrivateEndpoint:
      description: A private network endpoint used to reach a resource over a private path. Exactly one member is set.
      type: object
      properties:
        selfManagedLatticeResource:
          $ref: "#/components/schemas/SelfManagedLatticeResource"
          description: A private endpoint backed by a self-managed VPC Lattice resource configuration.
        managedVpcResource:
          $ref: "#/components/schemas/ManagedVpcResource"
          description: A private endpoint backed by a service-managed VPC resource.
    SelfManagedLatticeResource:
      description: A self-managed private endpoint backed by a VPC Lattice resource configuration. Exactly one member is set.
      type: object
      properties:
        resourceConfigurationIdentifier:
          $ref: "#/components/schemas/ResourceConfigurationIdentifier"
          description: The identifier of the VPC Lattice resource configuration, specified as a resource configuration ID or ARN.
    ResourceConfigurationIdentifier:
      description: The identifier of a VPC Lattice resource configuration, specified as a resource configuration ID or ARN.
      type: string
      minLength: 20
      maxLength: 2048
      pattern: ((rcfg-[0-9a-z]{17})|(arn:[a-z0-9\-]+:vpc-lattice:[a-zA-Z0-9\-]+:\d{12}:resourceconfiguration/rcfg-[0-9a-z]{17}))
    ManagedVpcResource:
      description: A service-managed private endpoint provisioned within a customer VPC.
      type: object
      properties:
        vpcIdentifier:
          $ref: "#/components/schemas/VpcIdentifier"
          description: The identifier of the VPC in which the private endpoint is provisioned.
        subnetIds:
          $ref: "#/components/schemas/SubnetIds"
          description: The identifiers of the subnets in which the private endpoint network interfaces are placed.
        endpointIpAddressType:
          $ref: "#/components/schemas/EndpointIpAddressType"
          description: The IP address type used by the private endpoint, either IPV4 or IPV6.
        securityGroupIds:
          $ref: "#/components/schemas/SecurityGroupIds"
          description: The identifiers of the security groups associated with the private endpoint network interfaces.
        tags:
          type: object
          properties: {}
        routingDomain:
          $ref: "#/components/schemas/RoutingDomain"
          description: The routing domain used to resolve traffic through the private endpoint.
      required:
        - vpcIdentifier
        - subnetIds
        - endpointIpAddressType
    VpcIdentifier:
      description: The identifier of a VPC.
      type: string
      minLength: 10
      maxLength: 48
      pattern: vpc-(([0-9a-z]{8})|([0-9a-z]{17}))
    SubnetIds:
      description: The list of subnet identifiers in which the private endpoint network interfaces are placed.
      type: array
      items:
        $ref: "#/components/schemas/SubnetId"
    SubnetId:
      description: Subnet identifier
      type: string
      minLength: 15
      maxLength: 24
      pattern: subnet-[0-9a-zA-Z]{8,17}
    EndpointIpAddressType:
      description: The IP address type used by a private endpoint.
      type: string
      enum:
        - IPV4
        - IPV6
    SecurityGroupIds:
      description: The list of security group identifiers associated with a private endpoint.
      type: array
      items:
        $ref: "#/components/schemas/SecurityGroupIdentifier"
    SecurityGroupIdentifier:
      description: The identifier of a security group.
      type: string
      minLength: 10
      maxLength: 48
      pattern: sg-(([0-9a-z]{8})|([0-9a-z]{17}))
    RoutingDomain:
      description: The routing domain used to resolve traffic through a private endpoint.
      type: string
      minLength: 3
      maxLength: 255
    PrivateEndpointOverrides:
      description: The list of per-domain private endpoint overrides.
      type: array
      items:
        $ref: "#/components/schemas/PrivateEndpointOverride"
    PrivateEndpointOverride:
      description: A mapping of a domain to the private endpoint used to reach it.
      type: object
      properties:
        domain:
          $ref: "#/components/schemas/PrivateEndpointOverrideDomain"
          description: The domain name to which this private endpoint override applies.
        privateEndpoint:
          $ref: "#/components/schemas/PrivateEndpoint"
          description: The private endpoint used to reach the specified domain.
      required:
        - domain
        - privateEndpoint
    PrivateEndpointOverrideDomain:
      description: A domain name for which a specific private endpoint override applies.
      type: string
      minLength: 1
      maxLength: 253
    RegistryAuthorizerType:
      type: string
      enum:
        - CUSTOM_JWT
        - AWS_IAM
    ClientToken:
      description: Client specified token used for idempotency checks
      type: string
      minLength: 33
      maxLength: 256
      pattern: "[a-zA-Z0-9](-*[a-zA-Z0-9]){0,256}"
    TagsMap:
      description: A map of tag keys to tag values.
      type: object
      properties: {}
    ApprovalConfiguration:
      description: Configuration for the registry's record approval workflow. Controls whether records submitted for approval require manual review before they become approved and discoverable, or are auto-approved. When no auto-approval rules are configured, submitted records require manual review.
      type: object
      properties:
        autoApprovalRules:
          $ref: "#/components/schemas/AutoApprovalRuleList"
          description: The rules that determine which registry records are automatically approved on submission. When omitted or empty, submitted records require manual review.
    AutoApprovalRuleList:
      type: array
      items:
        $ref: "#/components/schemas/AutoApprovalRule"
    AutoApprovalRule:
      type: string
      enum:
        - APPROVE_ALL
    CreateRegistryResponse:
      description: Response structure for creating a registry
      type: object
      properties:
        registryArn:
          $ref: "#/components/schemas/RegistryArn"
          description: The ARN of the created registry
      required:
        - registryArn
    RegistryArn:
      description: Registry Amazon Resource Name
      type: string
      minLength: 46
      maxLength: 2048
      pattern: arn:aws(-[^:]+)?:agent-registry:[a-z0-9-]+:[0-9]{12}:registry/[a-zA-Z0-9]{12,16}
    RegistryIdentifier:
      description: Registry identifier that accepts either ARN or ID format
      type: string
      minLength: 1
      maxLength: 2048
