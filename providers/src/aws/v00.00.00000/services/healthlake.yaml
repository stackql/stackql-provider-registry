      description: The progress report for the import job.
      type: object
      properties:
        TotalNumberOfScannedFiles:
          $ref: "#/components/schemas/GenericLong"
          description: The number of files scanned from the S3 input bucket.
        TotalSizeOfScannedFilesInMB:
          $ref: "#/components/schemas/GenericDouble"
          description: The size (in MB) of files scanned from the S3 input bucket.
        TotalNumberOfImportedFiles:
          $ref: "#/components/schemas/GenericLong"
          description: The number of files imported.
        TotalNumberOfResourcesScanned:
          $ref: "#/components/schemas/GenericLong"
          description: The number of resources scanned from the S3 input bucket.
        TotalNumberOfResourcesImported:
          $ref: "#/components/schemas/GenericLong"
          description: The number of resources imported.
        TotalNumberOfResourcesWithCustomerError:
          $ref: "#/components/schemas/GenericLong"
          description: The number of resources that failed due to customer error.
        TotalNumberOfFilesReadWithCustomerError:
          $ref: "#/components/schemas/GenericLong"
          description: The number of files that failed to be read from the S3 input bucket due to customer error.
        TotalNumberOfScannedNonFhirFiles:
          $ref: "#/components/schemas/GenericLong"
          description: The number of non-FHIR files scanned from the S3 input bucket.
        TotalSizeOfScannedNonFhirFilesInMB:
          $ref: "#/components/schemas/GenericDouble"
          description: The size (in MB) of non-FHIR files scanned from the S3 input bucket.
        TotalNumberOfImportedNonFhirFiles:
          $ref: "#/components/schemas/GenericLong"
          description: The number of non-FHIR files imported.
        TotalNumberOfNonFhirResourcesScanned:
          $ref: "#/components/schemas/GenericLong"
          description: The number of non-FHIR resources scanned from the S3 input bucket.
        TotalNumberOfNonFhirResourcesImported:
          $ref: "#/components/schemas/GenericLong"
          description: The number of non-FHIR resources imported.
        TotalNumberOfNonFhirResourcesWithCustomerError:
          $ref: "#/components/schemas/GenericLong"
          description: The number of non-FHIR resources that failed due to customer error.
        TotalNumberOfNonFhirFilesReadWithCustomerError:
          $ref: "#/components/schemas/GenericLong"
          description: The number of non-FHIR files that failed to be read from the S3 input bucket due to customer error.
        Throughput:
          $ref: "#/components/schemas/GenericDouble"
          description: The transaction rate the import job is processed at.
        TotalFilesConverted:
          $ref: "#/components/schemas/GenericLong"
          description: Number of CCDA files successfully transformed during the import's transformation phase. Populated only for import jobs that use the two-Step-Function (transformation + ingestion) flow; null for legacy single-SF imports and for pure FHIR imports that skip transformation.
        TotalResourcesGenerated:
          $ref: "#/components/schemas/GenericLong"
          description: Number of FHIR resources produced by the transformation phase. Populated only for import jobs that use the two-Step-Function flow; null for legacy single-SF imports and for pure FHIR imports.
