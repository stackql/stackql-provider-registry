openapi: 3.0.0
info:
  version: "2017-07-01"
  title: Amazon HealthLake
  description: Amazon HealthLake
  x-serviceName: healthlake
  x-serviceAlias: healthlake
  x-protocol: json
  x-apiVersion: "2017-07-01"
  x-endpointPrefix: healthlake
  x-targetPrefix: HealthLake
  x-jsonVersion: "1.0"
servers:
  - url: https://healthlake.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for healthlake
paths:
  /CreateDataTransformationProfile:
    post:
      operationId: CreateDataTransformationProfile
      description: Creates a data transformation profile in DRAFT state. Specify a built-in starter profile, an existing profile version, raw profile content, or a sample data file as the source.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.CreateDataTransformationProfile
            default: HealthLake.CreateDataTransformationProfile
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                SourceFormat:
                  $ref: "#/components/schemas/SourceFormat"
                  description: The source data format that this profile converts from (Consolidated Clinical Document Architecture (C-CDA) or Comma-separated values (CSV)).
                Source:
                  $ref: "#/components/schemas/CreateDataTransformationProfileSource"
                  description: The source for the initial profile content. Specify a built-in starter profile, an existing profile version to clone, raw profile content for CI/CD workflows, or a sample data file in Amazon S3.
                KmsKeyId:
                  $ref: "#/components/schemas/KmsKeyId"
                  description: The AWS Key Management Service (AWS KMS) key identifier used to encrypt the profile content at rest.
                ProfileDescription:
                  $ref: "#/components/schemas/ProfileDescription"
                  description: A human-readable description of the profile's purpose.
                ProfileName:
                  $ref: "#/components/schemas/ProfileNameString"
                  description: A name for the data transformation profile.
                Tags:
                  $ref: "#/components/schemas/TagMap"
                  description: The tags to associate with the profile at creation time.
                ClientToken:
                  $ref: "#/components/schemas/ClientToken"
                  description: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, the service ignores the request but does not return an error.
              required:
                - SourceFormat
                - Source
                - ProfileName
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDataTransformationProfileResponse"
  /CreateFHIRDatastore:
    post:
      operationId: CreateFHIRDatastore
      description: Create a FHIR-enabled data store.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.CreateFHIRDatastore
            default: HealthLake.CreateFHIRDatastore
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                DatastoreName:
                  $ref: "#/components/schemas/DatastoreName"
                  description: The data store name (user-generated).
                DatastoreTypeVersion:
                  $ref: "#/components/schemas/FHIRVersion"
                  description: The FHIR release version supported by the data store. Current support is for version R4.
                SseConfiguration:
                  $ref: "#/components/schemas/SseConfiguration"
                  description: The server-side encryption key configuration for a customer-provided encryption key specified for creating a data store.
                PreloadDataConfig:
                  $ref: "#/components/schemas/PreloadDataConfig"
                  description: An optional parameter to preload (import) open source Synthea FHIR data upon creation of the data store.
                ClientToken:
                  $ref: "#/components/schemas/ClientTokenString"
                  description: An optional user-provided token to ensure API idempotency.
                Tags:
                  $ref: "#/components/schemas/TagList"
                  description: The resource tags applied to a data store when it is created.
                IdentityProviderConfiguration:
                  $ref: "#/components/schemas/IdentityProviderConfiguration"
                  description: The identity provider configuration to use for the data store.
                AnalyticsConfiguration:
                  $ref: "#/components/schemas/AnalyticsConfiguration"
                  description: The analytics configuration for the data store.
                NlpConfiguration:
                  $ref: "#/components/schemas/NlpConfiguration"
                  description: The natural language processing (NLP) configuration for the data store.
                ProfileConfiguration:
                  $ref: "#/components/schemas/ProfileConfiguration"
                  description: The profile configuration for the data store.
              required:
                - DatastoreTypeVersion
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFHIRDatastoreResponse"
  /DeleteDataTransformationProfile:
    post:
      operationId: DeleteDataTransformationProfile
      description: Deletes a data transformation profile and all its versions, including the DRAFT and all published versions.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.DeleteDataTransformationProfile
            default: HealthLake.DeleteDataTransformationProfile
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                ProfileId:
                  $ref: "#/components/schemas/ProfileIdString"
                  description: The unique identifier of the profile to delete.
              required:
                - ProfileId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDataTransformationProfileResponse"
  /DeleteFHIRDatastore:
    post:
      operationId: DeleteFHIRDatastore
      description: Delete a FHIR-enabled data store.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.DeleteFHIRDatastore
            default: HealthLake.DeleteFHIRDatastore
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                DatastoreId:
                  $ref: "#/components/schemas/DatastoreId"
                  description: The AWS-generated identifier for the data store to be deleted.
              required:
                - DatastoreId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFHIRDatastoreResponse"
  /DescribeDataTransformationJob:
    post:
      operationId: DescribeDataTransformationJob
      description: Describes a data transformation job, including its current status, configuration, and progress information.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.DescribeDataTransformationJob
            default: HealthLake.DescribeDataTransformationJob
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                JobId:
                  $ref: "#/components/schemas/DataTransformationJobId"
                  description: The unique identifier of the data transformation job to describe.
              required:
                - JobId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescribeDataTransformationJobResponse"
  /DescribeFHIRDatastore:
    post:
      operationId: DescribeFHIRDatastore
      description: Get properties for a FHIR-enabled data store.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.DescribeFHIRDatastore
            default: HealthLake.DescribeFHIRDatastore
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                DatastoreId:
                  $ref: "#/components/schemas/DatastoreId"
                  description: The data store identifier.
              required:
                - DatastoreId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescribeFHIRDatastoreResponse"
  /DescribeFHIRExportJob:
    post:
      operationId: DescribeFHIRExportJob
      description: Get FHIR export job properties.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.DescribeFHIRExportJob
            default: HealthLake.DescribeFHIRExportJob
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                DatastoreId:
                  $ref: "#/components/schemas/DatastoreId"
                  description: The data store identifier from which FHIR data is being exported from.
                JobId:
                  $ref: "#/components/schemas/JobId"
                  description: The export job identifier.
              required:
                - DatastoreId
                - JobId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescribeFHIRExportJobResponse"
  /DescribeFHIRImportJob:
    post:
      operationId: DescribeFHIRImportJob
      description: Get the import job properties to learn more about the job or job progress.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.DescribeFHIRImportJob
            default: HealthLake.DescribeFHIRImportJob
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                DatastoreId:
                  $ref: "#/components/schemas/DatastoreId"
                  description: The data store identifier.
                JobId:
                  $ref: "#/components/schemas/JobId"
                  description: The import job identifier.
              required:
                - DatastoreId
                - JobId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescribeFHIRImportJobResponse"
  /GetDataTransformationProfile:
    post:
      operationId: GetDataTransformationProfile
      description: Retrieves a data transformation profile's metadata and profile content at a specific version. Specify version 0 to retrieve the DRAFT, a version number between 1 and 99 to retrieve a specific published version, or omit the version to retrieve the latest published version.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.GetDataTransformationProfile
            default: HealthLake.GetDataTransformationProfile
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                ProfileId:
                  $ref: "#/components/schemas/ProfileIdString"
                  description: The unique identifier of the profile to retrieve.
                ProfileVersion:
                  $ref: "#/components/schemas/ProfileVersion"
                  description: The version number to retrieve. Specify 0 to retrieve the DRAFT version. If you omit this parameter, the service returns the latest published version.
              required:
                - ProfileId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDataTransformationProfileResponse"
  /ListDataTransformationJobs:
    post:
      operationId: ListDataTransformationJobs
      description: Lists data transformation jobs for your AWS account. Results can be filtered by status, job name, and submit time window. Results are paginated. Use the NextToken parameter to retrieve additional results.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.ListDataTransformationJobs
            default: HealthLake.ListDataTransformationJobs
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                MaxResults:
                  $ref: "#/components/schemas/MaxResults"
                  description: The maximum number of jobs to return per page. If you don't specify a value, the service returns up to 100 results.
                NextToken:
                  $ref: "#/components/schemas/DataTransformationNextToken"
                  description: The pagination token from a previous response. Pass this value to retrieve the next page of results.
                JobStatus:
                  $ref: "#/components/schemas/TransformationJobStatus"
                  description: Filters the results to include only jobs with the specified status.
                JobName:
                  $ref: "#/components/schemas/DataTransformationJobName"
                  description: Filters the results to include only jobs with the specified name.
                SubmittedAfter:
                  $ref: "#/components/schemas/DateTime"
                  description: Filters the results to include only jobs submitted at or after this timestamp.
                SubmittedBefore:
                  $ref: "#/components/schemas/DateTime"
                  description: Filters the results to include only jobs submitted at or before this timestamp.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDataTransformationJobsResponse"
  /ListDataTransformationProfileVersions:
    post:
      operationId: ListDataTransformationProfileVersions
      description: Lists all versions of a specific data transformation profile (DRAFT and published), in reverse chronological order (newest first). Use GetDataTransformationProfile to retrieve profile content. Results are paginated. Use the NextToken parameter to retrieve additional results.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.ListDataTransformationProfileVersions
            default: HealthLake.ListDataTransformationProfileVersions
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                ProfileId:
                  $ref: "#/components/schemas/ProfileIdString"
                  description: The unique identifier of the profile whose versions to list.
                MaxResults:
                  $ref: "#/components/schemas/MaxResults"
                  description: The maximum number of profile versions to return per page. If you don't specify a value, the service returns up to 100 results.
                NextToken:
                  $ref: "#/components/schemas/DataTransformationNextToken"
                  description: The pagination token from a previous response. Pass this value to retrieve the next page of results.
              required:
                - ProfileId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDataTransformationProfileVersionsResponse"
  /ListDataTransformationProfiles:
    post:
      operationId: ListDataTransformationProfiles
      description: Lists all data transformation profiles in your account, returning the latest version summary for each. Use GetDataTransformationProfile to retrieve profile content. Results are paginated. Use the NextToken parameter to retrieve additional results.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.ListDataTransformationProfiles
            default: HealthLake.ListDataTransformationProfiles
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                SourceFormat:
                  $ref: "#/components/schemas/SourceFormat"
                  description: Filters the results by source data format.
                MaxResults:
                  $ref: "#/components/schemas/MaxResults"
                  description: The maximum number of profiles to return per page. If you don't specify a value, the service returns up to 100 results.
                NextToken:
                  $ref: "#/components/schemas/DataTransformationNextToken"
                  description: The pagination token from a previous response. Pass this value to retrieve the next page of results.
              required:
                - SourceFormat
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDataTransformationProfilesResponse"
  /ListFHIRDatastores:
    post:
      operationId: ListFHIRDatastores
      description: List all FHIR-enabled data stores in a user’s account, regardless of data store status.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.ListFHIRDatastores
            default: HealthLake.ListFHIRDatastores
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                Filter:
                  $ref: "#/components/schemas/DatastoreFilter"
                  description: List all filters associated with a FHIR data store request.
                NextToken:
                  $ref: "#/components/schemas/NextToken"
                  description: The token used to retrieve the next page of data stores when results are paginated.
                MaxResults:
                  $ref: "#/components/schemas/MaxResultsInteger"
                  description: The maximum number of data stores returned on a page.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFHIRDatastoresResponse"
  /ListFHIRExportJobs:
    post:
      operationId: ListFHIRExportJobs
      description: Lists all FHIR export jobs associated with an account and their statuses.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.ListFHIRExportJobs
            default: HealthLake.ListFHIRExportJobs
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                DatastoreId:
                  $ref: "#/components/schemas/DatastoreId"
                  description: Limits the response to the export job with the specified data store ID.
                NextToken:
                  $ref: "#/components/schemas/NextToken"
                  description: A pagination token used to identify the next page of results to return.
                MaxResults:
                  $ref: "#/components/schemas/MaxResultsInteger"
                  description: Limits the number of results returned for a ListFHIRExportJobs to a maximum quantity specified by the user.
                JobName:
                  $ref: "#/components/schemas/JobName"
                  description: Limits the response to the export job with the specified job name.
                JobStatus:
                  $ref: "#/components/schemas/JobStatus"
                  description: Limits the response to export jobs with the specified job status.
                SubmittedBefore:
                  $ref: "#/components/schemas/HealthLakeTimestamp"
                  description: Limits the response to FHIR export jobs submitted before a user- specified date.
                SubmittedAfter:
                  $ref: "#/components/schemas/HealthLakeTimestamp"
                  description: Limits the response to FHIR export jobs submitted after a user-specified date.
              required:
                - DatastoreId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFHIRExportJobsResponse"
  /ListFHIRImportJobs:
    post:
      operationId: ListFHIRImportJobs
      description: List all FHIR import jobs associated with an account and their statuses.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.ListFHIRImportJobs
            default: HealthLake.ListFHIRImportJobs
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                DatastoreId:
                  $ref: "#/components/schemas/DatastoreId"
                  description: Limits the response to the import job with the specified data store ID.
                NextToken:
                  $ref: "#/components/schemas/NextToken"
                  description: The pagination token used to identify the next page of results to return.
                MaxResults:
                  $ref: "#/components/schemas/MaxResultsInteger"
                  description: Limits the number of results returned for ListFHIRImportJobs to a maximum quantity specified by the user.
                JobName:
                  $ref: "#/components/schemas/JobName"
                  description: Limits the response to the import job with the specified job name.
                JobStatus:
                  $ref: "#/components/schemas/JobStatus"
                  description: Limits the response to the import job with the specified job status.
                SubmittedBefore:
                  $ref: "#/components/schemas/HealthLakeTimestamp"
                  description: Limits the response to FHIR import jobs submitted before a user- specified date.
                SubmittedAfter:
                  $ref: "#/components/schemas/HealthLakeTimestamp"
                  description: Limits the response to FHIR import jobs submitted after a user-specified date.
              required:
                - DatastoreId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFHIRImportJobsResponse"
  /ListTagsForResource:
    post:
      operationId: ListTagsForResource
      description: Returns a list of all existing tags associated with a data store.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.ListTagsForResource
            default: HealthLake.ListTagsForResource
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                ResourceARN:
                  $ref: "#/components/schemas/AmazonResourceName"
                  description: The Amazon Resource Name (ARN) of the data store to which tags are being added.
              required:
                - ResourceARN
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTagsForResourceResponse"
  /PublishDataTransformationProfile:
    post:
      operationId: PublishDataTransformationProfile
      description: Promotes the current DRAFT version of a data transformation profile to a new immutable published version. Also supports rollback by publishing from a previously published version.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.PublishDataTransformationProfile
            default: HealthLake.PublishDataTransformationProfile
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                ProfileId:
                  $ref: "#/components/schemas/ProfileIdString"
                  description: The unique identifier of the profile to publish.
                SourceFormat:
                  $ref: "#/components/schemas/SourceFormat"
                  description: The source data format of the profile.
                FromExistingVersion:
                  $ref: "#/components/schemas/ProfileVersion"
                  description: The version number of a previously published version to republish as the new latest version. Use this parameter for rollback scenarios. If you omit this parameter, the service publishes the current DRAFT version.
                ChangeDescription:
                  $ref: "#/components/schemas/ChangeDescription"
                  description: A description of what changed or why this version is being published.
              required:
                - ProfileId
                - SourceFormat
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishDataTransformationProfileResponse"
  /StartDataTransformationJob:
    post:
      operationId: StartDataTransformationJob
      description: Starts an asynchronous data transformation job that converts source files from Amazon Simple Storage Service (Amazon S3) and writes the output to Amazon S3 or AWS HealthLake.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.StartDataTransformationJob
            default: HealthLake.StartDataTransformationJob
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                InputDataConfig:
                  $ref: "#/components/schemas/TransformationInputDataConfig"
                  description: The Amazon S3 location and format of the source files to transform.
                OutputDataConfig:
                  $ref: "#/components/schemas/TransformationOutputDataConfig"
                  description: The Amazon S3 output location and AWS Key Management Service (AWS KMS) encryption configuration.
                DataAccessRoleArn:
                  $ref: "#/components/schemas/DataTransformationIamRoleArn"
                  description: The Amazon Resource Name (ARN) of the AWS Identity and Access Management (IAM) role that AWS HealthLake assumes to read from and write to the specified Amazon S3 locations.
                ClientToken:
                  $ref: "#/components/schemas/ClientToken"
                  description: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, the service ignores the request but does not return an error.
                JobName:
                  $ref: "#/components/schemas/DataTransformationJobName"
                  description: A descriptive name for the data transformation job.
                ProfileId:
                  $ref: "#/components/schemas/ProfileIdString"
                  description: The unique identifier of the data transformation profile to use for conversion.
                DriftDetectionEnabled:
                  $ref: "#/components/schemas/Boolean"
                  description: Specifies whether drift detection is enabled for this job. When enabled, AWS HealthLake writes a drift report to the output Amazon S3 location alongside the converted files.
                ProvenanceEnabled:
                  $ref: "#/components/schemas/Boolean"
                  description: Specifies whether FHIR R4 Provenance resource generation is enabled for this transformation job. When provenance is enabled, the service also generates related DocumentReference and Device resources. If you don't specify a value, the default is true. To disable provenance output, set this parameter to false.
              required:
                - InputDataConfig
                - OutputDataConfig
                - DataAccessRoleArn
                - ClientToken
                - ProfileId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartDataTransformationJobResponse"
  /StartFHIRExportJob:
    post:
      operationId: StartFHIRExportJob
      description: Start a FHIR export job.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.StartFHIRExportJob
            default: HealthLake.StartFHIRExportJob
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                JobName:
                  $ref: "#/components/schemas/JobName"
                  description: The export job name.
                OutputDataConfig:
                  $ref: "#/components/schemas/OutputDataConfig"
                  description: The output data configuration supplied when the export job was started.
                DatastoreId:
                  $ref: "#/components/schemas/DatastoreId"
                  description: The data store identifier from which files are being exported.
                DataAccessRoleArn:
                  $ref: "#/components/schemas/IamRoleArn"
                  description: The Amazon Resource Name (ARN) used during initiation of the export job.
                ClientToken:
                  $ref: "#/components/schemas/ClientTokenString"
                  description: An optional user provided token used for ensuring API idempotency.
              required:
                - OutputDataConfig
                - DatastoreId
                - DataAccessRoleArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartFHIRExportJobResponse"
  /StartFHIRImportJob:
    post:
      operationId: StartFHIRImportJob
      description: Start importing bulk FHIR data into an ACTIVE data store. The import job imports FHIR data found in the InputDataConfig object and stores processing results in the JobOutputDataConfig object.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.StartFHIRImportJob
            default: HealthLake.StartFHIRImportJob
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                JobName:
                  $ref: "#/components/schemas/JobName"
                  description: The import job name.
                InputDataConfig:
                  $ref: "#/components/schemas/InputDataConfig"
                  description: The input properties for the import job request.
                JobOutputDataConfig:
                  $ref: "#/components/schemas/OutputDataConfig"
                DatastoreId:
                  $ref: "#/components/schemas/DatastoreId"
                  description: The data store identifier.
                DataAccessRoleArn:
                  $ref: "#/components/schemas/IamRoleArn"
                  description: The Amazon Resource Name (ARN) that grants access permission to AWS HealthLake.
                ClientToken:
                  $ref: "#/components/schemas/ClientTokenString"
                  description: The optional user-provided token used for ensuring API idempotency.
                ValidationLevel:
                  $ref: "#/components/schemas/ValidationLevel"
                  description: The validation level of the import job.
                ProfileId:
                  $ref: "#/components/schemas/BoundedLengthString"
                InputFormat:
                  $ref: "#/components/schemas/BoundedLengthString"
                DriftDetectionEnabled:
                  $ref: "#/components/schemas/HealthLakeBoolean"
                ProvenanceEnabled:
                  $ref: "#/components/schemas/DefaultEnabledBoolean"
                  description: Specifies whether to enable provenance for the import job.
              required:
                - InputDataConfig
                - JobOutputDataConfig
                - DatastoreId
                - DataAccessRoleArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartFHIRImportJobResponse"
  /TagResource:
    post:
      operationId: TagResource
      description: Add a user-specifed key and value tag to a data store.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.TagResource
            default: HealthLake.TagResource
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                ResourceARN:
                  $ref: "#/components/schemas/AmazonResourceName"
                  description: The Amazon Resource Name (ARN) that grants access to the data store tags are being added to.
                Tags:
                  $ref: "#/components/schemas/TagList"
                  description: The user-specified key and value pair tags being added to a data store.
              required:
                - ResourceARN
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResourceResponse"
  /UntagResource:
    post:
      operationId: UntagResource
      description: Remove a user-specifed key and value tag from a data store.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.UntagResource
            default: HealthLake.UntagResource
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                ResourceARN:
                  $ref: "#/components/schemas/AmazonResourceName"
                  description: The Amazon Resource Name (ARN) of the data store from which tags are being removed.
                TagKeys:
                  $ref: "#/components/schemas/TagKeyList"
                  description: The keys for the tags to be removed from the data store.
              required:
                - ResourceARN
                - TagKeys
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UntagResourceResponse"
  /UpdateDataTransformationProfile:
    post:
      operationId: UpdateDataTransformationProfile
      description: Updates the DRAFT version (version 0) of a data transformation profile with new profile content. The update replaces all existing DRAFT content.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.UpdateDataTransformationProfile
            default: HealthLake.UpdateDataTransformationProfile
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                ProfileId:
                  $ref: "#/components/schemas/ProfileIdString"
                  description: The unique identifier of the profile to update.
                ProfileMapping:
                  $ref: "#/components/schemas/ProfileMapping"
                  description: The new profile content for the DRAFT version. This is a full replacement of all profile files.
                ChangeDescription:
                  $ref: "#/components/schemas/ChangeDescription"
                  description: A description of what changed in this update.
              required:
                - ProfileId
                - ProfileMapping
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDataTransformationProfileResponse"
  /UpdateFHIRDatastore:
    post:
      operationId: UpdateFHIRDatastore
      description: Update the properties of a FHIR-enabled data store.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.UpdateFHIRDatastore
            default: HealthLake.UpdateFHIRDatastore
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                DatastoreId:
                  $ref: "#/components/schemas/DatastoreId"
                  description: The data store identifier.
                DatastoreName:
                  $ref: "#/components/schemas/DatastoreName"
                  description: The data store name.
                AnalyticsConfiguration:
                  $ref: "#/components/schemas/AnalyticsConfiguration"
                  description: The analytics configuration for the data store.
                NlpConfiguration:
                  $ref: "#/components/schemas/NlpConfiguration"
                  description: The natural language processing (NLP) configuration for the data store.
                ProfileConfiguration:
                  $ref: "#/components/schemas/ProfileConfiguration"
                  description: The profile configuration for the data store.
                IdentityProviderConfiguration:
                  $ref: "#/components/schemas/IdentityProviderConfiguration"
                  description: The identity provider configuration for the data store.
              required:
                - DatastoreId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateFHIRDatastoreResponse"
  /UpdateProfileWithAgent:
    post:
      operationId: UpdateProfileWithAgent
      description: Updates a data transformation profile using chat-based interaction with an agent. Supports multi-turn conversations for iteratively customizing profiles.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - HealthLake.UpdateProfileWithAgent
            default: HealthLake.UpdateProfileWithAgent
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                ProfileId:
                  $ref: "#/components/schemas/ProfileIdString"
                  description: The unique identifier of the profile to update via the agent.
                SourceFormat:
                  $ref: "#/components/schemas/SourceFormat"
                  description: The source data format for the transformation.
                InputMessage:
                  $ref: "#/components/schemas/AgentInputMessage"
                  description: The message to send to the agent.
                ConversationId:
                  $ref: "#/components/schemas/ConversationIdString"
                  description: The conversation identifier for multi-turn interactions. Omit to start a new conversation.
              required:
                - ProfileId
                - SourceFormat
                - InputMessage
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProfileWithAgentResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    SourceFormat:
      type: string
      enum:
        - CCDA
        - CSV
    CreateDataTransformationProfileSource:
      description: "The source for initial content when creating a data transformation profile. Specify exactly one variant: a built-in starter profile, an existing profile version to clone, raw profile content, or a sample data file."
      type: object
      properties:
        StarterProfile:
          $ref: "#/components/schemas/StarterProfileSource"
          description: Creates the profile from a built-in starter profile. Valid only when the source format is Consolidated Clinical Document Architecture (C-CDA).
        ExistingVersionedProfileId:
          $ref: "#/components/schemas/ExistingVersionedProfileSource"
          description: Creates the profile by cloning an existing profile at a specific version.
        ProfileMapping:
          $ref: "#/components/schemas/ProfileMappingSource"
          description: Creates the profile from raw profile content that you provide directly. Use this variant for continuous integration and continuous delivery (CI/CD) workflows.
        SampleData:
          $ref: "#/components/schemas/SampleDataSource"
          description: Creates the profile from a sample data file stored in Amazon S3. Valid only when the source format is Comma-separated values (CSV).
    StarterProfileSource:
      description: Identifies a built-in starter profile to use as the source when creating a data transformation profile. Valid only when the source format is Consolidated Clinical Document Architecture (C-CDA).
      type: object
      properties:
        StarterProfileName:
          $ref: "#/components/schemas/String"
          description: The name of the built-in starter profile.
      required:
        - StarterProfileName
    String:
      type: string
    ExistingVersionedProfileSource:
      description: Identifies an existing data transformation profile and version to clone when creating a new profile.
      type: object
      properties:
        ProfileId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the existing profile to clone from.
        Version:
          $ref: "#/components/schemas/Integer"
          description: The version number of the existing profile to clone from.
      required:
        - ProfileId
        - Version
    Integer:
      type: integer
    ProfileMappingSource:
      description: Contains raw content to use as the source when creating a data transformation profile directly from a mapping.
      type: object
      properties:
        ProfileMapping:
          type: object
          properties: {}
          description: The content as a map of file paths to profile strings.
      required:
        - ProfileMapping
    SampleDataSource:
      description: Identifies a sample data file in Amazon S3 to use as the source when creating a data transformation profile. Valid only when the source format is Comma-separated values (CSV).
      type: object
      properties:
        S3Uri:
          $ref: "#/components/schemas/SampleDataS3Uri"
          description: The Amazon S3 URI of the sample data file.
      required:
        - S3Uri
    SampleDataS3Uri:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: s3://[a-z0-9][a-z0-9.\-]{1,61}[a-z0-9](/.*)?
    KmsKeyId:
      type: string
      minLength: 1
      maxLength: 2048
    ProfileDescription:
      type: string
      minLength: 0
      maxLength: 1000
    ProfileNameString:
      type: string
      minLength: 1
      maxLength: 256
    TagMap:
      description: A map of tag keys to tag values associated with the resource.
      type: object
      properties: {}
    ClientToken:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "[a-zA-Z0-9-]+"
    CreateDataTransformationProfileResponse:
      description: The response from the CreateDataTransformationProfile operation.
      type: object
      properties:
        ProfileId:
          $ref: "#/components/schemas/ProfileIdString"
          description: The unique identifier of the created profile.
        Version:
          $ref: "#/components/schemas/ProfileVersion"
          description: The version number of the newly created profile. The starting version is always 0, which indicates the profile is in DRAFT state.
        SourceFormat:
          $ref: "#/components/schemas/SourceFormat"
          description: The source data format of the profile.
        TargetFormat:
          $ref: "#/components/schemas/TargetFormat"
          description: The target output format. Always FHIR_R4.
        ProfileName:
          $ref: "#/components/schemas/ProfileNameString"
          description: The name of the created profile.
        LastUpdatedAt:
          $ref: "#/components/schemas/DateTime"
          description: The timestamp when the profile was last updated.
      required:
        - ProfileId
        - Version
        - SourceFormat
        - TargetFormat
        - ProfileName
        - LastUpdatedAt
    ProfileIdString:
      type: string
      minLength: 32
      maxLength: 32
      pattern: "[a-f0-9]{32}"
    ProfileVersion:
      type: integer
      minimum: 0
      maximum: 99
    TargetFormat:
      type: string
      enum:
        - FHIR_R4
    DateTime:
      type: string
      format: date-time
    DatastoreName:
      description: The name of a data store.
      type: string
      minLength: 1
      maxLength: 256
      pattern: ([\p{L}\p{Z}\p{N}_.:/=+\-%@]*)
    FHIRVersion:
      description: The FHIR version supported by the data store.
      type: string
      enum:
        - R4
    SseConfiguration:
      description: The server-side encryption key configuration for a customer-provided encryption key.
      type: object
      properties:
        KmsEncryptionConfig:
          $ref: "#/components/schemas/KmsEncryptionConfig"
          description: The Key Management Service (KMS) encryption configuration used to provide details for data encryption.
      required:
        - KmsEncryptionConfig
    KmsEncryptionConfig:
      description: The customer-managed-key (CMK) used when creating a data store. If a customer-owned key is not specified, an AWS-owned key is used for encryption.
      type: object
      properties:
        CmkType:
          $ref: "#/components/schemas/CmkType"
          description: The type of customer-managed-key (CMK) used for encryption.
        KmsKeyId:
          $ref: "#/components/schemas/EncryptionKeyID"
          description: The Key Management Service (KMS) encryption key id/alias used to encrypt the data store contents at rest.
      required:
        - CmkType
    CmkType:
      type: string
      enum:
        - CUSTOMER_MANAGED_KMS_KEY
        - AWS_OWNED_KMS_KEY
    EncryptionKeyID:
      description: The identifier of an encryption key.
      type: string
      minLength: 1
      maxLength: 400
      pattern: (arn:aws((-us-gov)|(-iso)|(-iso-b)|(-cn))?:kms:)?([a-z]{2}-[a-z]+(-[a-z]+)?-\d:)?(\d{12}:)?(((key/)?[a-zA-Z0-9-_]+)|(alias/[a-zA-Z0-9:/_-]+))
    PreloadDataConfig:
      description: The input properties for the preloaded (Synthea) data store.
      type: object
      properties:
        PreloadDataType:
          $ref: "#/components/schemas/PreloadDataType"
          description: The type of preloaded data. Only Synthea preloaded data is supported.
      required:
        - PreloadDataType
    PreloadDataType:
      description: The type of preloaded data.
      type: string
      enum:
        - SYNTHEA
    ClientTokenString:
      description: A client-provided idempotency token.
      type: string
      minLength: 1
      maxLength: 64
      pattern: "[a-zA-Z0-9-]+"
    TagList:
      type: array
      items:
        $ref: "#/components/schemas/Tag"
    Tag:
      description: A label consisting of a user-defined key and value. The form for tags is {"Key", "Value"}
      type: object
      properties:
        Key:
          $ref: "#/components/schemas/TagKey"
          description: The key portion of a tag. Tag keys are case sensitive.
        Value:
          $ref: "#/components/schemas/TagValue"
          description: The value portion of a tag. Tag values are case-sensitive.
      required:
        - Key
        - Value
    TagKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ([\p{L}\p{Z}\p{N}_.:/=+\-@]*)
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
      pattern: ([\p{L}\p{Z}\p{N}_.:/=+\-@]*)
    IdentityProviderConfiguration:
      description: The identity provider configuration selected when the data store was created.
      type: object
      properties:
        AuthorizationStrategy:
          $ref: "#/components/schemas/AuthorizationStrategy"
          description: The authorization strategy selected when the HealthLake data store is created. HealthLake provides support for both SMART on FHIR V1 and V2 as described below. SMART_ON_FHIR_V1 – Support for only SMART on FHIR V1, which includes read (read/search) and write (create/update/delete) permissions. SMART_ON_FHIR – Support for both SMART on FHIR V1 and V2, which includes create, read, update, delete, and search permissions. AWS_AUTH – The default HealthLake authorization strategy; not affiliated with SMART on FHIR.
        FineGrainedAuthorizationEnabled:
          $ref: "#/components/schemas/HealthLakeBoolean"
          description: The parameter to enable SMART on FHIR fine-grained authorization for the data store.
        Metadata:
          $ref: "#/components/schemas/ConfigurationMetadata"
          description: "The JSON metadata elements to use in your identity provider configuration. Required elements are listed based on the launch specification of the SMART application. For more information on all possible elements, see Metadata in SMART's App Launch specification. authorization_endpoint: The URL to the OAuth2 authorization endpoint. grant_types_supported: An array of grant types that are supported at the token endpoint. You must provide at least one grant type option. Valid options are authorization_code and client_credentials. token_endpoint: The URL to the OAuth2 token endpoint. capabilities: An array of strings of the SMART capabilities that the authorization server supports. code_challenge_methods_supported: An array of strings of supported PKCE code challenge methods. You must include the S256 method in the array of PKCE code challenge methods."
        IdpLambdaArn:
          $ref: "#/components/schemas/LambdaArn"
          description: The Amazon Resource Name (ARN) of the Lambda function to use to decode the access token created by the authorization server.
      required:
        - AuthorizationStrategy
    AuthorizationStrategy:
      type: string
      enum:
        - SMART_ON_FHIR_V1
        - SMART_ON_FHIR
        - AWS_AUTH
    HealthLakeBoolean:
      description: A boolean value.
      type: boolean
    ConfigurationMetadata:
      type: string
    LambdaArn:
      type: string
      minLength: 49
      maxLength: 256
      pattern: arn:aws:lambda:[a-z]{2}-[a-z]+-\d{1}:\d{12}:function:[a-zA-Z0-9\-_\.]+(:(\$LATEST|[a-zA-Z0-9\-_]+))?
    AnalyticsConfiguration:
      description: The analytics configuration for a data store.
      type: object
      properties:
        Status:
          $ref: "#/components/schemas/AnalyticsStatus"
          description: The status of the analytics configuration.
    AnalyticsStatus:
      type: string
      enum:
        - ENABLED
        - ENABLING
        - DISABLED
        - DISABLING
        - PAUSING
        - PAUSED
    NlpConfiguration:
      description: The natural language processing (NLP) configuration for a data store.
      type: object
      properties:
        Status:
          $ref: "#/components/schemas/NlpStatus"
          description: The status of the NLP configuration.
    NlpStatus:
      type: string
      enum:
        - ENABLED
        - ENABLING
        - DISABLED
        - DISABLING
    ProfileConfiguration:
      description: The profile configuration for a data store.
      type: object
      properties:
        DefaultProfiles:
          $ref: "#/components/schemas/DefaultProfiles"
          description: The list of default profiles for the data store.
    DefaultProfiles:
      type: array
      items:
        $ref: "#/components/schemas/HealthLakeString"
    HealthLakeString:
      description: A general-purpose string value.
      type: string
      minLength: 0
      maxLength: 10000
      pattern: "[\\P{M}\\p{M}]{0,10000}"
    CreateFHIRDatastoreResponse:
      type: object
      properties:
        DatastoreId:
          $ref: "#/components/schemas/DatastoreId"
          description: The data store identifier.
        DatastoreArn:
          $ref: "#/components/schemas/DatastoreArn"
          description: The Amazon Resource Name (ARN) for the data store.
        DatastoreStatus:
          $ref: "#/components/schemas/DatastoreStatus"
          description: The data store status.
        DatastoreEndpoint:
          $ref: "#/components/schemas/BoundedLengthString"
          description: The AWS endpoint created for the data store.
      required:
        - DatastoreId
        - DatastoreArn
        - DatastoreStatus
        - DatastoreEndpoint
    DatastoreId:
      description: The identifier of a data store.
      type: string
      minLength: 1
      maxLength: 32
      pattern: ([\p{L}\p{Z}\p{N}_.:/=+\-%@]*)
    DatastoreArn:
      description: The ARN of a data store.
      type: string
      pattern: arn:aws((-us-gov)|(-iso)|(-iso-b)|(-cn))?:healthlake:[a-zA-Z0-9-]+:[0-9]{12}:datastore/.+?
    DatastoreStatus:
      description: The status of a data store.
      type: string
      enum:
        - CREATING
        - ACTIVE
        - DELETING
        - DELETED
        - CREATE_FAILED
        - UPDATING
        - UPDATE_FAILED
    BoundedLengthString:
      description: A bounded-length string value.
      type: string
      minLength: 1
      maxLength: 5000
      pattern: "[\\P{M}\\p{M}]{1,5000}"
    DeleteDataTransformationProfileResponse:
      description: The response from the DeleteDataTransformationProfile operation.
      type: object
      properties:
        ProfileId:
          $ref: "#/components/schemas/ProfileIdString"
          description: The unique identifier of the deleted profile.
        ProfileName:
          $ref: "#/components/schemas/ProfileNameString"
          description: The name of the deleted profile.
        DeletionTime:
          $ref: "#/components/schemas/DateTime"
          description: The timestamp when the profile was deleted.
      required:
        - ProfileId
        - DeletionTime
    DeleteFHIRDatastoreResponse:
      type: object
      properties:
        DatastoreId:
          $ref: "#/components/schemas/DatastoreId"
          description: The AWS-generated ID for the deleted data store.
        DatastoreArn:
          $ref: "#/components/schemas/DatastoreArn"
          description: The Amazon Resource Name (ARN) that grants access permission to AWS HealthLake.
        DatastoreStatus:
          $ref: "#/components/schemas/DatastoreStatus"
          description: The data store status.
        DatastoreEndpoint:
          $ref: "#/components/schemas/BoundedLengthString"
          description: The AWS endpoint of the data store to be deleted.
      required:
        - DatastoreId
        - DatastoreArn
        - DatastoreStatus
        - DatastoreEndpoint
    DataTransformationJobId:
      type: string
      minLength: 1
      maxLength: 32
      pattern: "[a-zA-Z0-9-]+"
    DescribeDataTransformationJobResponse:
      description: The response from the DescribeDataTransformationJob operation.
      type: object
      properties:
        TransformationJobProperties:
          $ref: "#/components/schemas/TransformationJobProperties"
          description: The properties of the data transformation job, including status, configuration, and progress information.
      required:
        - TransformationJobProperties
    TransformationJobProperties:
      description: Contains the properties of a data transformation job, including its status, configuration, and progress information. You retrieve this structure by calling DescribeDataTransformationJob.
      type: object
      properties:
        JobId:
          $ref: "#/components/schemas/DataTransformationJobId"
          description: The unique identifier of the data transformation job.
        JobStatus:
          $ref: "#/components/schemas/TransformationJobStatus"
          description: The current status of the data transformation job.
        InputDataConfig:
          $ref: "#/components/schemas/TransformationInputDataConfig"
          description: The Amazon S3 location and format of the source files for this job.
        OutputDataConfig:
          $ref: "#/components/schemas/TransformationOutputDataConfig"
          description: The Amazon S3 location and encryption configuration for the converted output.
        DataAccessRoleArn:
          $ref: "#/components/schemas/DataTransformationIamRoleArn"
          description: The Amazon Resource Name (ARN) of the AWS Identity and Access Management (IAM) role that grants AWS HealthLake access to the specified Amazon S3 locations. AWS HealthLake assumes this role to read input files and write output files.
        SubmitTime:
          $ref: "#/components/schemas/DateTime"
          description: The timestamp when the job was submitted.
        JobName:
          $ref: "#/components/schemas/DataTransformationJobName"
          description: The name of the data transformation job.
        ProfileId:
          $ref: "#/components/schemas/ProfileIdString"
          description: The unique identifier of the data transformation profile used for this job.
        ProfileName:
          $ref: "#/components/schemas/ProfileNameString"
          description: The name of the data transformation profile used for this job.
        ProfileVersion:
          $ref: "#/components/schemas/Integer"
          description: The version number of the data transformation profile used for this job.
        EndTime:
          $ref: "#/components/schemas/DateTime"
          description: The timestamp when the job completed or failed.
        DriftDetectionEnabled:
