openapi: 3.0.0
info:
  version: "2023-09-07"
  title: AWS Billing
  description: AWS Billing
  x-serviceName: billing
  x-serviceAlias: billing
  x-protocol: json
  x-apiVersion: "2023-09-07"
  x-endpointPrefix: billing
  x-targetPrefix: AWSBilling
  x-jsonVersion: "1.0"
servers:
  - url: https://billing.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for billing
paths:
  /AssociateSourceViews:
    post:
      operationId: AssociateSourceViews
      description: Associates one or more source billing views with an existing billing view. This allows creating aggregate billing views that combine data from multiple sources.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.AssociateSourceViews
            default: AWSBilling.AssociateSourceViews
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/BillingViewArn"
                  description: The Amazon Resource Name (ARN) of the billing view to associate source views with.
                sourceViews:
                  $ref: "#/components/schemas/BillingViewSourceViewsList"
                  description: A list of ARNs of the source billing views to associate.
              required:
                - arn
                - sourceViews
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssociateSourceViewsResponse"
  /CreateBillingView:
    post:
      operationId: CreateBillingView
      description: Creates a billing view with the specified billing view attributes.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.CreateBillingView
            default: AWSBilling.CreateBillingView
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/BillingViewName"
                  description: The name of the billing view.
                description:
                  $ref: "#/components/schemas/BillingViewDescription"
                  description: The description of the billing view.
                sourceViews:
                  $ref: "#/components/schemas/BillingViewSourceViewsList"
                  description: A list of billing views used as the data source for the custom billing view.
                dataFilterExpression:
                  $ref: "#/components/schemas/Expression"
                  description: See Expression. Billing view only supports LINKED_ACCOUNT, Tags, and CostCategories.
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
                  description: A unique, case-sensitive identifier you specify to ensure idempotency of the request. Idempotency ensures that an API request completes no more than one time. If the original request completes successfully, any subsequent retries complete successfully without performing any further actions with an idempotent request.
                resourceTags:
                  $ref: "#/components/schemas/ResourceTagList"
                  description: A list of key value map specifying tags associated to the billing view being created.
              required:
                - name
                - sourceViews
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBillingViewResponse"
  /DeleteBillingView:
    post:
      operationId: DeleteBillingView
      description: Deletes the specified billing view.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.DeleteBillingView
            default: AWSBilling.DeleteBillingView
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/BillingViewArn"
                  description: The Amazon Resource Name (ARN) that can be used to uniquely identify the billing view.
                force:
                  $ref: "#/components/schemas/Boolean"
                  description: If set to true, forces deletion of the billing view even if it has derived resources (e.g. other billing views or budgets). Use with caution as this may break dependent resources.
              required:
                - arn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteBillingViewResponse"
  /DisassociateSourceViews:
    post:
      operationId: DisassociateSourceViews
      description: Removes the association between one or more source billing views and an existing billing view. This allows modifying the composition of aggregate billing views.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.DisassociateSourceViews
            default: AWSBilling.DisassociateSourceViews
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/BillingViewArn"
                  description: The Amazon Resource Name (ARN) of the billing view to disassociate source views from.
                sourceViews:
                  $ref: "#/components/schemas/BillingViewSourceViewsList"
                  description: A list of ARNs of the source billing views to disassociate.
              required:
                - arn
                - sourceViews
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisassociateSourceViewsResponse"
  /GetBillingPreferences:
    post:
      operationId: GetBillingPreferences
      description: "Retrieves billing preferences for the specified feature. Each feature controls a distinct billing capability: which accounts can share Reserved Instances or credits, whether billing alerts are enabled, the historical record of sharing changes, and per-credit options."
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.GetBillingPreferences
            default: AWSBilling.GetBillingPreferences
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                nextToken:
                  $ref: "#/components/schemas/PageToken"
                  description: Pagination token from a previous response. Pass the value returned in nextToken to retrieve the next page of results.
                maxResults:
                  $ref: "#/components/schemas/GetBillingPreferencesRequestMaxResultsInteger"
                  description: "The maximum number of records to return per page. Range: 1 to 50. Default: 50."
                features:
                  $ref: "#/components/schemas/GetBillingPreferencesRequestFeaturesList"
                  description: "The feature to retrieve. Specify exactly one value. Valid values: BILLING_ALERTS, RI_SHARING, RI_SHARING_HISTORY, CREDIT_SHARING, CREDIT_SHARING_HISTORY, CREDIT_LEVEL_SHARING, CREDIT_PREFERENCE_OPTIONS."
                filters:
                  $ref: "#/components/schemas/GetBillingPreferencesRequestFiltersList"
                  description: Filters to narrow results. Specify exactly one filter when supplied. The supported filter name is PREFERENCE_KEY, which accepts 1 to 10 values to match preference keys.
              required:
                - features
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBillingPreferencesResponse"
  /GetBillingView:
    post:
      operationId: GetBillingView
      description: Returns the metadata associated to the specified billing view ARN.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.GetBillingView
            default: AWSBilling.GetBillingView
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/BillingViewArn"
                  description: The Amazon Resource Name (ARN) that can be used to uniquely identify the billing view.
              required:
                - arn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBillingViewResponse"
  /GetCreditAllocationHistory:
    post:
      operationId: GetCreditAllocationHistory
      description: Returns the per-billing-month allocation history for credits applied to an Amazon Web Services account's bills. Traverses the consolidated billing family to capture cross-account credit applications. Supports pagination and optional filtering to a single credit.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.GetCreditAllocationHistory
            default: AWSBilling.GetCreditAllocationHistory
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                accountId:
                  $ref: "#/components/schemas/AccountId"
                  description: The Amazon Web Services account ID whose allocation history to retrieve. Must be a 12-digit numeric string.
                creditId:
                  $ref: "#/components/schemas/Long"
                  description: Filters the result to a single credit. When omitted, returns allocation entries for all credits.
                startDate:
                  $ref: "#/components/schemas/Timestamp"
                  description: Inclusive start date as Unix epoch seconds. Must be on or before endDate. The range from startDate to endDate cannot exceed 24 billing months.
                endDate:
                  $ref: "#/components/schemas/Timestamp"
                  description: Inclusive end date as Unix epoch seconds.
                nextToken:
                  $ref: "#/components/schemas/PageToken"
                  description: Pagination token from a previous response. Pass the value returned in nextToken to retrieve the next page of results.
                maxResults:
                  $ref: "#/components/schemas/GetCreditAllocationHistoryRequestMaxResultsInteger"
                  description: "The maximum number of records to return per page. Range: 1 to 1000. Default: 100."
              required:
                - accountId
                - startDate
                - endDate
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCreditAllocationHistoryResponse"
  /GetCredits:
    post:
      operationId: GetCredits
      description: Returns the list of Amazon Web Services account credits for the specified account. Each credit includes its identifier, type, monetary amounts, applicable products, expiration, sharing configuration, and current enabled status. When the caller is the management account of a consolidated billing family and payerAccountFlag is true, the response aggregates credits across the entire family. Otherwise, the response includes only credits owned by the account specified in accountId.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.GetCredits
            default: AWSBilling.GetCredits
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                accountId:
                  $ref: "#/components/schemas/String"
                  description: The Amazon Web Services account ID. Must be a 12-digit numeric string.
                startDate:
                  $ref: "#/components/schemas/Timestamp"
                  description: The start date for the credit period as Unix epoch seconds. Must be a past date that is not more than one year before the current date.
                endDate:
                  $ref: "#/components/schemas/Timestamp"
                  description: The end date for the credit period as Unix epoch seconds. Must not be a future date and must be on or after startDate. Defaults to the current date when omitted.
                payerAccountFlag:
                  $ref: "#/components/schemas/Boolean"
                  description: When true and the caller is the management account, the response aggregates credits across the entire consolidated billing family. When false or omitted, returns only credits for the specified accountId.
              required:
                - accountId
                - startDate
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCreditsResponse"
  /GetEnterpriseSupportChargeSummary:
    post:
      operationId: GetEnterpriseSupportChargeSummary
      description: Returns a summary of Enterprise Support data aggregated across all accounts in the Enterprise Support profile.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.GetEnterpriseSupportChargeSummary
            default: AWSBilling.GetEnterpriseSupportChargeSummary
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                billingMonth:
                  $ref: "#/components/schemas/EnterpriseSupportBillingMonth"
                  description: The billing month in YYYY-MM format. This must be a month in the past.
              required:
                - billingMonth
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEnterpriseSupportChargeSummaryResponse"
  /GetEnterpriseSupportContractDetails:
    post:
      operationId: GetEnterpriseSupportContractDetails
      description: Returns Enterprise Support contract details.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.GetEnterpriseSupportContractDetails
            default: AWSBilling.GetEnterpriseSupportContractDetails
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                billingMonth:
                  $ref: "#/components/schemas/EnterpriseSupportBillingMonth"
                  description: The billing month in YYYY-MM format. This must be a month in the past.
              required:
                - billingMonth
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEnterpriseSupportContractDetailsResponse"
  /GetResourcePolicy:
    post:
      operationId: GetResourcePolicy
      description: Returns the resource-based policy document attached to the resource in JSON format.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.GetResourcePolicy
            default: AWSBilling.GetResourcePolicy
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                resourceArn:
                  $ref: "#/components/schemas/ResourceArn"
                  description: The Amazon Resource Name (ARN) of the billing view resource to which the policy is attached to.
              required:
                - resourceArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetResourcePolicyResponse"
  /ListBillingViews:
    post:
      operationId: ListBillingViews
      description: Lists the billing views available for a given time period. Every Amazon Web Services account has a unique PRIMARY billing view that represents the billing data available by default. Accounts that use Billing Conductor also have BILLING_GROUP billing views representing pro forma costs associated with each created billing group.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.ListBillingViews
            default: AWSBilling.ListBillingViews
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                activeTimeRange:
                  $ref: "#/components/schemas/ActiveTimeRange"
                  description: The time range for the billing views listed. PRIMARY billing view is always listed. BILLING_GROUP billing views are listed for time ranges when the associated billing group resource in Billing Conductor is active. The time range must be within one calendar month.
                arns:
                  $ref: "#/components/schemas/BillingViewArnList"
                  description: The Amazon Resource Name (ARN) that can be used to uniquely identify the billing view.
                billingViewTypes:
                  $ref: "#/components/schemas/BillingViewTypeList"
                  description: The type of billing view.
                names:
                  $ref: "#/components/schemas/StringSearches"
                  description: Filters the list of billing views by name. You can specify search criteria to match billing view names based on the search option provided.
                ownerAccountId:
                  $ref: "#/components/schemas/AccountId"
                  description: The list of owners of the billing view.
                sourceAccountId:
                  $ref: "#/components/schemas/AccountId"
                  description: Filters the results to include only billing views that use the specified account as a source.
                maxResults:
                  $ref: "#/components/schemas/BillingViewsMaxResults"
                  description: The maximum number of billing views to retrieve. Default is 100.
                nextToken:
                  $ref: "#/components/schemas/PageToken"
                  description: The pagination token that is used on subsequent calls to list billing views.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBillingViewsResponse"
  /ListEnterpriseSupportLinkedAccountCharges:
    post:
      operationId: ListEnterpriseSupportLinkedAccountCharges
      description: Returns Support-eligible spend broken down at linked account level.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.ListEnterpriseSupportLinkedAccountCharges
            default: AWSBilling.ListEnterpriseSupportLinkedAccountCharges
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                billingMonth:
                  $ref: "#/components/schemas/EnterpriseSupportBillingMonth"
                  description: The billing month in YYYY-MM format. This must be a month in the past.
                accountId:
                  $ref: "#/components/schemas/AccountId"
                  description: An optional linked account ID to filter results to a specific account.
                maxResults:
                  $ref: "#/components/schemas/ListEnterpriseSupportLinkedAccountChargesRequestMaxResultsInteger"
                  description: The maximum number of results to return per page.
                nextToken:
                  $ref: "#/components/schemas/PageToken"
                  description: The pagination token for the next page of results.
              required:
                - billingMonth
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnterpriseSupportLinkedAccountChargesResponse"
  /ListSourceViewsForBillingView:
    post:
      operationId: ListSourceViewsForBillingView
      description: Lists the source views (managed Amazon Web Services billing views) associated with the billing view.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.ListSourceViewsForBillingView
            default: AWSBilling.ListSourceViewsForBillingView
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/BillingViewArn"
                  description: The Amazon Resource Name (ARN) that can be used to uniquely identify the billing view.
                maxResults:
                  $ref: "#/components/schemas/BillingViewsMaxResults"
                  description: The number of entries a paginated response contains.
                nextToken:
                  $ref: "#/components/schemas/PageToken"
                  description: The pagination token that is used on subsequent calls to list billing views.
              required:
                - arn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSourceViewsForBillingViewOutputDisplay"
  /ListTagsForResource:
    post:
      operationId: ListTagsForResource
      description: Lists tags associated with the billing view resource.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.ListTagsForResource
            default: AWSBilling.ListTagsForResource
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                resourceArn:
                  $ref: "#/components/schemas/ResourceArn"
                  description: The Amazon Resource Name (ARN) of the resource.
              required:
                - resourceArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTagsForResourceResponse"
  /RedeemCredits:
    post:
      operationId: RedeemCredits
      description: Redeems an Amazon Web Services promotional credit code on behalf of the calling account. On success, a new credit is added to the account's credit ledger with the amount, validity period, and applicable products defined by the promotion. The credit is then automatically applied to subsequent bills according to the standard credit application order.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.RedeemCredits
            default: AWSBilling.RedeemCredits
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                promoCode:
                  $ref: "#/components/schemas/PromoCode"
                  description: The promotional credit code to redeem.
              required:
                - promoCode
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemCreditsResponse"
  /TagResource:
    post:
      operationId: TagResource
      description: An API operation for adding one or more tags (key-value pairs) to a resource.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.TagResource
            default: AWSBilling.TagResource
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                resourceArn:
                  $ref: "#/components/schemas/ResourceArn"
                  description: The Amazon Resource Name (ARN) of the resource.
                resourceTags:
                  $ref: "#/components/schemas/ResourceTagList"
                  description: A list of tag key value pairs that are associated with the resource.
              required:
                - resourceArn
                - resourceTags
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResourceResponse"
  /UntagResource:
    post:
      operationId: UntagResource
      description: Removes one or more tags from a resource. Specify only tag keys in your request. Don't specify the value.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.UntagResource
            default: AWSBilling.UntagResource
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                resourceArn:
                  $ref: "#/components/schemas/ResourceArn"
                  description: The Amazon Resource Name (ARN) of the resource.
                resourceTagKeys:
                  $ref: "#/components/schemas/ResourceTagKeyList"
                  description: A list of tag key value pairs that are associated with the resource.
              required:
                - resourceArn
                - resourceTagKeys
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UntagResourceResponse"
  /UpdateBillingPreferences:
    post:
      operationId: UpdateBillingPreferences
      description: Updates billing preferences for the specified feature. Each feature targets a distinct billing capability and has its own set of supported keys. The action sets the value for each provided key; keys not present in the request are unchanged. Sharing keys (RI_SHARING, CREDIT_SHARING, CREDIT_LEVEL_SHARING, and sharing keys under CREDIT_PREFERENCE_OPTIONS) may only be set by the management account of a consolidated billing family. The credit/{creditId}/status key may be set by member accounts for credits they own, or by the management account for any credit in the family.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.UpdateBillingPreferences
            default: AWSBilling.UpdateBillingPreferences
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                feature:
                  $ref: "#/components/schemas/BillingFeature"
                  description: "The feature to update. Valid values: BILLING_ALERTS, RI_SHARING, CREDIT_SHARING, CREDIT_LEVEL_SHARING, CREDIT_PREFERENCE_OPTIONS. The history features (RI_SHARING_HISTORY and CREDIT_SHARING_HISTORY) are read-only and cannot be updated."
                billingPreferencesPerKey:
                  $ref: "#/components/schemas/BillingPreferencesPerKey"
                  description: Key/value pairs to apply. All keys in a single request must be valid for the specified feature and must not be duplicated. For CREDIT_PREFERENCE_OPTIONS, all keys must reference the same creditId.
              required:
                - feature
                - billingPreferencesPerKey
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateBillingPreferencesResponse"
  /UpdateBillingView:
    post:
      operationId: UpdateBillingView
      description: An API to update the attributes of the billing view.
      parameters:
        - name: X-Amz-Target
          in: header
          description: Action Header
          required: false
          schema:
            type: string
            enum:
              - AWSBilling.UpdateBillingView
            default: AWSBilling.UpdateBillingView
      requestBody:
        required: true
        content:
          application/x-amz-json-1.0:
            schema:
              type: object
              properties:
                arn:
                  $ref: "#/components/schemas/BillingViewArn"
                  description: The Amazon Resource Name (ARN) that can be used to uniquely identify the billing view.
                name:
                  $ref: "#/components/schemas/BillingViewName"
                  description: The name of the billing view.
                description:
                  $ref: "#/components/schemas/BillingViewDescription"
                  description: The description of the billing view.
                dataFilterExpression:
                  $ref: "#/components/schemas/Expression"
                  description: See Expression. Billing view only supports LINKED_ACCOUNT, Tags, and CostCategories.
              required:
                - arn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateBillingViewResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    BillingViewArn:
      type: string
      pattern: arn:aws[a-z-]*:(billing)::[0-9]{12}:billingview/[a-zA-Z0-9/:_\+=\.\-@]{0,75}[a-zA-Z0-9]
    BillingViewSourceViewsList:
      type: array
      items:
        $ref: "#/components/schemas/BillingViewArn"
    AssociateSourceViewsResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/BillingViewArn"
          description: The ARN of the billing view that the source views were associated with.
      required:
        - arn
    BillingViewName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "[ a-zA-Z0-9_\\+=\\.\\-@]+"
    BillingViewDescription:
      type: string
      minLength: 0
      maxLength: 1024
      pattern: ([ a-zA-Z0-9_\+=\.\-@]+)?
    Expression:
      description: See Expression. Billing view only supports LINKED_ACCOUNT, Tags, and CostCategories.
      type: object
      properties:
        dimensions:
          $ref: "#/components/schemas/DimensionValues"
          description: The specific Dimension to use for Expression.
        tags:
          $ref: "#/components/schemas/TagValues"
          description: The specific Tag to use for Expression.
        costCategories:
          $ref: "#/components/schemas/CostCategoryValues"
          description: The filter that's based on CostCategory values.
        timeRange:
          $ref: "#/components/schemas/TimeRange"
          description: Specifies a time range filter for the billing view data.
    DimensionValues:
      description: The metadata that you can use to filter and group your results.
      type: object
      properties:
        key:
          $ref: "#/components/schemas/Dimension"
          description: The names of the metadata types that you can use to filter and group your results.
        values:
          $ref: "#/components/schemas/Values"
          description: The metadata values that you can use to filter and group your results.
      required:
        - key
        - values
    Dimension:
      type: string
      enum:
        - LINKED_ACCOUNT
    Values:
      type: array
      items:
        $ref: "#/components/schemas/Value"
    Value:
      type: string
      minLength: 0
      maxLength: 1024
      pattern: "[\\S\\s]*"
    TagValues:
      description: The values that are available for a tag.
      type: object
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
          description: The key for the tag.
        values:
          $ref: "#/components/schemas/Values"
          description: The specific value of the tag.
      required:
        - key
        - values
    TagKey:
      type: string
      minLength: 0
      maxLength: 1024
      pattern: "[\\S\\s]*"
    CostCategoryValues:
      description: The Cost Categories values used for filtering the costs.
      type: object
      properties:
        key:
          $ref: "#/components/schemas/CostCategoryName"
          description: The unique name of the Cost Category.
        values:
          $ref: "#/components/schemas/Values"
          description: The specific value of the Cost Category.
      required:
        - key
        - values
    CostCategoryName:
      type: string
      minLength: 1
      maxLength: 50
      pattern: (?! )[\p{L}\p{N}\p{Z}-_]*(?<! )
    TimeRange:
      description: Specifies a time range with inclusive begin and end dates.
      type: object
      properties:
        beginDateInclusive:
          $ref: "#/components/schemas/Timestamp"
          description: The inclusive start date of the time range.
        endDateInclusive:
          $ref: "#/components/schemas/Timestamp"
          description: The inclusive end date of the time range.
    Timestamp:
      type: string
      format: date-time
    ClientToken:
      type: string
      pattern: "[a-zA-Z0-9-]+"
    ResourceTagList:
      type: array
      items:
        $ref: "#/components/schemas/ResourceTag"
    ResourceTag:
      description: The tag structure that contains a tag key and value.
      type: object
      properties:
        key:
          $ref: "#/components/schemas/ResourceTagKey"
          description: The key that's associated with the tag.
        value:
          $ref: "#/components/schemas/ResourceTagValue"
          description: The value that's associated with the tag.
      required:
        - key
    ResourceTagKey:
      type: string
      minLength: 1
      maxLength: 128
    ResourceTagValue:
      type: string
      minLength: 0
      maxLength: 256
    CreateBillingViewResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/BillingViewArn"
          description: The Amazon Resource Name (ARN) that can be used to uniquely identify the billing view.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The time when the billing view was created.
      required:
        - arn
    Boolean:
      type: boolean
    DeleteBillingViewResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/BillingViewArn"
          description: The Amazon Resource Name (ARN) that can be used to uniquely identify the billing view.
      required:
        - arn
    DisassociateSourceViewsResponse:
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/BillingViewArn"
          description: The ARN of the billing view that the source views were disassociated from.
      required:
        - arn
    PageToken:
      type: string
      minLength: 1
      maxLength: 4095
      pattern: "[-a-zA-Z0-9+=/_]+"
    GetBillingPreferencesRequestMaxResultsInteger:
      type: integer
      minimum: 1
      maximum: 50
    GetBillingPreferencesRequestFeaturesList:
      type: array
      items:
        $ref: "#/components/schemas/BillingFeature"
    BillingFeature:
      type: string
      enum:
        - RI_SHARING
        - RI_SHARING_HISTORY
        - CREDIT_SHARING
        - CREDIT_SHARING_HISTORY
        - CREDIT_LEVEL_SHARING
        - BILLING_ALERTS
        - CREDIT_PREFERENCE_OPTIONS
    GetBillingPreferencesRequestFiltersList:
      type: array
      items:
        $ref: "#/components/schemas/BillingFeatureFilter"
    BillingFeatureFilter:
      description: A filter that narrows the set of preferences returned by GetBillingPreferences.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/BillingFeatureFilterName"
          description: The filter name. Currently the only supported value is PREFERENCE_KEY.
        value:
          $ref: "#/components/schemas/BillingFeatureFilterValues"
          description: The filter values to match. For PREFERENCE_KEY, supply 1 to 10 preference key values to match.
    BillingFeatureFilterName:
      type: string
      enum:
        - PREFERENCE_KEY
    BillingFeatureFilterValues:
      type: array
      items:
        $ref: "#/components/schemas/BillingFeatureFilterValue"
    BillingFeatureFilterValue:
      type: string
      minLength: 1
      maxLength: 100
      pattern: "[a-zA-Z0-9-/]+"
    GetBillingPreferencesResponse:
      type: object
      properties:
        billingPreferences:
          $ref: "#/components/schemas/BillingPreferences"
          description: The list of preference entries matching the request.
        nextToken:
          $ref: "#/components/schemas/PageToken"
          description: Pagination token. Present when more pages are available; null when there are no more results.
      required:
        - billingPreferences
    BillingPreferences:
      type: array
      items:
        $ref: "#/components/schemas/BillingPreferenceSummary"
    BillingPreferenceSummary:
      description: A single billing preference entry returned by GetBillingPreferences.
      type: object
      properties:
        feature:
          $ref: "#/components/schemas/BillingFeature"
          description: The feature this preference belongs to.
        key:
          $ref: "#/components/schemas/PreferenceKey"
          description: The preference key. Format depends on the feature.
        value:
          $ref: "#/components/schemas/PreferenceValue"
          description: "The preference value. Valid values: ENABLED or DISABLED."
        accountName:
          $ref: "#/components/schemas/AccountName"
          description: The display name of the account. Populated together with accountId; null otherwise.
        accountId:
          $ref: "#/components/schemas/AccountId"
          description: The associated Amazon Web Services account ID. Populated for account-list keys; null otherwise.
        billingPeriod:
          $ref: "#/components/schemas/BillingPeriod"
          description: The billing period associated with the preference change. Populated only for the history features RI_SHARING_HISTORY and CREDIT_SHARING_HISTORY.
      required:
        - feature
        - key
        - value
    PreferenceKey:
      type: string
      minLength: 1
      maxLength: 2148
      pattern: "[a-zA-Z0-9-\\/\\*: ]+"
    PreferenceValue:
      type: string
      enum:
        - ENABLED
        - DISABLED
    AccountName:
      type: string
      minLength: 1
      maxLength: 50
    AccountId:
      type: string
      pattern: "[0-9]{12}"
    BillingPeriod:
      description: A specific billing period identified by year and month.
      type: object
      properties:
        year:
          $ref: "#/components/schemas/BillingYear"
          description: The four-digit year of the billing period.
        month:
          $ref: "#/components/schemas/Month"
          description: The month of the billing period as an integer between 1 and 12.
      required:
        - year
        - month
    BillingYear:
      type: integer
      minimum: 2005
      maximum: 2120
    Month:
      type: integer
      minimum: 1
      maximum: 12
    GetBillingViewResponse:
      type: object
      properties:
        billingView:
          $ref: "#/components/schemas/BillingViewElement"
          description: The billing view element associated with the specified ARN.
      required:
        - billingView
    BillingViewElement:
      description: The metadata associated to the billing view.
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/BillingViewArn"
          description: The Amazon Resource Name (ARN) that can be used to uniquely identify the billing view.
        name:
          $ref: "#/components/schemas/BillingViewName"
          description: The account name of the billing view.
        description:
          $ref: "#/components/schemas/BillingViewDescription"
          description: The description of the billing view.
        billingViewType:
          $ref: "#/components/schemas/BillingViewType"
          description: The type of billing group.
        ownerAccountId:
          $ref: "#/components/schemas/AccountId"
          description: The account owner of the billing view.
        sourceAccountId:
          $ref: "#/components/schemas/AccountId"
          description: The Amazon Web Services account ID that owns the source billing view, if this is a derived billing view.
        dataFilterExpression:
          $ref: "#/components/schemas/Expression"
          description: See Expression. Billing view only supports LINKED_ACCOUNT, Tags, and CostCategories.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The time when the billing view was created.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The time when the billing view was last updated.
        derivedViewCount:
          $ref: "#/components/schemas/Integer"
          description: The number of billing views that use this billing view as a source.
        sourceViewCount:
          $ref: "#/components/schemas/Integer"
          description: The number of source views associated with this billing view.
        viewDefinitionLastUpdatedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp of when the billing view definition was last updated.
        healthStatus:
          $ref: "#/components/schemas/BillingViewHealthStatus"
          description: The current health status of the billing view.
    BillingViewType:
      type: string
      enum:
        - PRIMARY
        - BILLING_GROUP
        - CUSTOM
        - BILLING_TRANSFER
        - BILLING_TRANSFER_SHOWBACK
    Integer:
      type: integer
    BillingViewHealthStatus:
      description: Represents the health status of a billing view, including a status code and optional reasons for the status.
      type: object
      properties:
        statusCode:
          $ref: "#/components/schemas/BillingViewStatus"
          description: The current health status code of the billing view.
        statusReasons:
          $ref: "#/components/schemas/BillingViewStatusReasons"
          description: A list of reasons explaining the current health status, if applicable.
    BillingViewStatus:
      type: string
      enum:
        - HEALTHY
        - UNHEALTHY
        - CREATING
        - UPDATING
    BillingViewStatusReasons:
      type: array
      items:
        $ref: "#/components/schemas/BillingViewStatusReason"
    BillingViewStatusReason:
      type: string
      enum:
        - SOURCE_VIEW_UNHEALTHY
        - SOURCE_VIEW_UPDATING
        - SOURCE_VIEW_ACCESS_DENIED
        - SOURCE_VIEW_NOT_FOUND
        - CYCLIC_DEPENDENCY
        - SOURCE_VIEW_DEPTH_EXCEEDED
        - AGGREGATE_SOURCE
        - VIEW_OWNER_NOT_MANAGEMENT_ACCOUNT
    Long:
      type: integer
      format: int64
    GetCreditAllocationHistoryRequestMaxResultsInteger:
      type: integer
      minimum: 1
      maximum: 1000
    GetCreditAllocationHistoryResponse:
      type: object
      properties:
        creditAllocationHistoryList:
          $ref: "#/components/schemas/CreditAllocationHistoryList"
          description: Allocation entries sorted by billingMonth in descending order.
        partialResults:
          $ref: "#/components/schemas/Boolean"
          description: true when data could not be retrieved for one or more billing months. The failedMonths field lists which months are missing.
        failedMonths:
          $ref: "#/components/schemas/FailedMonthsList"
          description: Billing months in YYYY-MM format that failed to return data. Non-empty only when partialResults is true.
        nextToken:
          $ref: "#/components/schemas/PageToken"
          description: Pagination token. Present when more pages are available; null when there are no more results.
      required:
        - partialResults
    CreditAllocationHistoryList:
      type: array
      items:
        $ref: "#/components/schemas/CreditAllocationHistoryEntry"
    CreditAllocationHistoryEntry:
      description: A single entry in the credit allocation history, representing how a credit was applied to a specific service during a billing month.
      type: object
      properties:
        creditId:
          $ref: "#/components/schemas/CreditId"
          description: The identifier of the credit that was applied.
        creditAmount:
          $ref: "#/components/schemas/Amount"
          description: The amount of credit applied. Negative values represent credits that reduced the bill.
        description:
          $ref: "#/components/schemas/String"
          description: A human-readable description of the credit allocation.
        accountId:
          $ref: "#/components/schemas/AccountId"
          description: The Amazon Web Services account the credit was applied to.
        appliedServiceName:
          $ref: "#/components/schemas/String"
          description: The Amazon Web Services service the credit was applied to.
        billingMonth:
          $ref: "#/components/schemas/BillingMonth"
          description: The billing month of the application in YYYY-MM format.
        isEstimatedBill:
          $ref: "#/components/schemas/Boolean"
          description: true when the entry was applied to an in-flight bill that has not yet been finalized.
      required:
        - creditId
        - creditAmount
        - accountId
        - appliedServiceName
        - billingMonth
        - isEstimatedBill
    CreditId:
      type: string
      minLength: 1
      maxLength: 32
      pattern: "[0-9]+"
    Amount:
      description: A monetary amount with a currency code. Used throughout the Billing API to represent credit balances, allocations, and adjustments.
      type: object
      properties:
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
          description: The ISO 4217 currency code for the amount (for example, USD).
        currencyAmount:
          $ref: "#/components/schemas/CurrencyAmount"
          description: The amount as a decimal string (for example, "743.21"). Negative values represent credits that reduce a bill.
      required:
        - currencyCode
        - currencyAmount
    CurrencyCode:
      type: string
      pattern: "[A-Z]{3}"
    CurrencyAmount:
      type: string
      pattern: "[0-9]+(.[0-9]+)"
    String:
      type: string
    BillingMonth:
      type: string
      minLength: 1
      maxLength: 7
    FailedMonthsList:
      type: array
      items:
        $ref: "#/components/schemas/BillingMonth"
    GetCreditsResponse:
      type: object
      properties:
        credits:
          $ref: "#/components/schemas/CreditDataList"
          description: The list of credits matching the request. Returns an empty list when no credits exist.
    CreditDataList:
      type: array
      items:
        $ref: "#/components/schemas/CreditData"
    CreditData:
      description: Detailed information about an Amazon Web Services credit, including its identifier, type, monetary amounts, applicable products, sharing configuration, and current enabled status.
      type: object
      properties:
        creditId:
          $ref: "#/components/schemas/CreditId"
          description: The unique identifier for the credit.
        accountId:
          $ref: "#/components/schemas/AccountId"
          description: The Amazon Web Services account ID that owns the credit.
        creditType:
          $ref: "#/components/schemas/String"
          description: "The type of credit. Examples: Promotion, Refund, TrueUp."
        initialAmount:
          $ref: "#/components/schemas/Amount"
          description: The initial amount of the credit when it was issued.
        remainingAmount:
          $ref: "#/components/schemas/Amount"
          description: The unused balance of the credit.
        estimatedAmount:
          $ref: "#/components/schemas/Amount"
          description: The estimated remaining balance, including in-flight (open) bills that have not yet been finalized.
        applicableProductNames:
          $ref: "#/components/schemas/ProductNames"
          description: The names of Amazon Web Services services this credit applies to.
        description:
          $ref: "#/components/schemas/String"
          description: A human-readable description of the credit.
        startDate:
          $ref: "#/components/schemas/Timestamp"
          description: The date the credit becomes valid, as Unix epoch seconds.
        endDate:
          $ref: "#/components/schemas/Timestamp"
          description: The date the credit expires, as Unix epoch seconds.
        exhaustDate:
          $ref: "#/components/schemas/Timestamp"
          description: The date the credit balance reached zero, as Unix epoch seconds.
        applicationType:
          $ref: "#/components/schemas/ApplicationType"
          description: "When the credit is applied during bill computation. Valid values: BEFORE_CROSS_SERVICE_DISCOUNTS, AFTER_DISCOUNTS."
        shareableAccounts:
          $ref: "#/components/schemas/ShareableAccountIds"
          description: The Amazon Web Services account IDs entitled to apply this credit.
        accountHasCreditSharingEnabled:
          $ref: "#/components/schemas/Boolean"
          description: Whether the owning account has account-level credit sharing turned on.
        creditConsoleVisibility:
          $ref: "#/components/schemas/String"
          description: The display configuration for the credit in the Amazon Web Services Billing console.
        creditSharingType:
          $ref: "#/components/schemas/CreditSharingType"
          description: "The sharing configuration for the credit. Valid values: DEFAULT, DISABLED, CUSTOM, COST_CATEGORY_RULE."
        costCategoryArn:
          $ref: "#/components/schemas/String"
          description: The Amazon Resource Name (ARN) of the Cost Category controlling the credit's sharing scope. Present only when creditSharingType is COST_CATEGORY_RULE.
        ruleName:
          $ref: "#/components/schemas/String"
          description: The rule name within the Cost Category. Present only when creditSharingType is COST_CATEGORY_RULE.
        creditStatus:
          $ref: "#/components/schemas/CreditStatus"
          description: "Whether the credit participates in billing runs. Valid values: ENABLED, DISABLED."
        purchaseTypeApplications:
          $ref: "#/components/schemas/PurchaseTypeApplications"
          description: Restricts which purchase types this credit applies to. When null or omitted, the credit applies to all purchase types.
      required:
        - creditId
        - accountId
        - creditType
        - initialAmount
        - remainingAmount
        - description
        - startDate
    ProductNames:
      type: array
      items:
        $ref: "#/components/schemas/ProductName"
    ProductName:
      type: string
      minLength: 1
      maxLength: 128
    ApplicationType:
      type: string
      enum:
        - BEFORE_CROSS_SERVICE_DISCOUNTS
        - AFTER_DISCOUNTS
    ShareableAccountIds:
      type: array
      items:
        $ref: "#/components/schemas/AccountId"
    CreditSharingType:
      type: string
      enum:
        - DEFAULT
        - DISABLED
        - CUSTOM
        - COST_CATEGORY_RULE
    CreditStatus:
      type: string
      enum:
        - ENABLED
        - DISABLED
    PurchaseTypeApplications:
      type: array
      items:
        $ref: "#/components/schemas/PurchaseType"
    PurchaseType:
      type: string
      minLength: 1
      maxLength: 64
    EnterpriseSupportBillingMonth:
      description: The billing month in YYYY-MM format. This must be a month in the past.
      type: string
      pattern: \d{4}-(0[1-9]|1[0-2])
    GetEnterpriseSupportChargeSummaryResponse:
      description: The response structure for GetEnterpriseSupportChargeSummary.
      type: object
      properties:
        payerAccountId:
          $ref: "#/components/schemas/AccountId"
          description: The payer account ID that is authorized to view Enterprise Support data for all accounts in its Support profile.
        billingMonth:
          $ref: "#/components/schemas/EnterpriseSupportBillingMonth"
          description: The billing month in YYYY-MM format. This must be a month in the past.
        billingPeriodStartDate:
          $ref: "#/components/schemas/Timestamp"
          description: The start date of the billing period.
        billingPeriodEndDate:
          $ref: "#/components/schemas/Timestamp"
          description: The end date of the billing period.
        isEstimated:
          $ref: "#/components/schemas/Boolean"
          description: When true, the Support charge amount is estimated. When false, the Support charge amount is finalized.
        billDate:
          $ref: "#/components/schemas/Timestamp"
          description: The date the bill was generated.
        supportCharge:
          $ref: "#/components/schemas/String"
          description: The Support charge amount for the account.
        totalSupportCharge:
          $ref: "#/components/schemas/String"
          description: The total Support charge amount for all accounts in the Support profile.
        supportDiscount:
          $ref: "#/components/schemas/String"
          description: The support discount amount.
        totalSupportEligibleSpend:
          $ref: "#/components/schemas/String"
          description: The total Support-eligible Spend from all accounts in the Support profile. This includes eligible spend from usage of Amazon Web Services, Reserved Instances, and Savings Plans.
        totalSupportEligibleUsageSpend:
          $ref: "#/components/schemas/String"
          description: The total Support-eligible spend from usage of Amazon Web Services from all accounts in the Support profile.
        totalSupportEligibleReservedInstanceSpend:
          $ref: "#/components/schemas/String"
          description: The total Support-eligible Reserved Instance spend from all accounts in the Support profile.
        totalSupportEligibleSavingsPlanSpend:
          $ref: "#/components/schemas/String"
          description: The total Support-eligible Savings Plan spend from all accounts in the Support profile.
        supportChargePercentage:
          $ref: "#/components/schemas/String"
          description: The percentage applied to the total Support-eligible spend to calculate the total Support charge across all accounts in the Support profile.
        supportEffectivePricingPlan:
          $ref: "#/components/schemas/PricingPlan"
          description: The effective pricing plan used for the support charge calculation.
      required:
        - payerAccountId
        - billingMonth
        - billingPeriodStartDate
        - billingPeriodEndDate
        - isEstimated
        - billDate
        - supportCharge
        - totalSupportCharge
        - supportDiscount
        - totalSupportEligibleSpend
        - totalSupportEligibleUsageSpend
        - totalSupportEligibleReservedInstanceSpend
        - totalSupportEligibleSavingsPlanSpend
        - supportChargePercentage
        - supportEffectivePricingPlan
    PricingPlan:
      description: A pricing plan for Enterprise Support billing.
      type: object
      properties:
        pricingPlanId:
          $ref: "#/components/schemas/String"
          description: The unique identifier for the pricing plan.
        name:
          $ref: "#/components/schemas/String"
          description: The name of the pricing plan.
        description:
          $ref: "#/components/schemas/String"
          description: A description of the pricing plan.
        startDate:
          $ref: "#/components/schemas/Timestamp"
          description: The start date of the pricing plan.
        endDate:
          $ref: "#/components/schemas/Timestamp"
          description: The end date of the pricing plan.
        planDiscountPercent:
          $ref: "#/components/schemas/String"
          description: The discount percentage applied by this pricing plan.
        discountAppliesToMinimumCharge:
          $ref: "#/components/schemas/Boolean"
          description: Whether the discount applies to the minimum Support charge.
        minimumCharge:
          $ref: "#/components/schemas/String"
          description: The minimum Support charge amount for this pricing plan.
        tiered:
          $ref: "#/components/schemas/String"
          description: Whether the pricing plan uses tiered pricing.
        tiers:
          $ref: "#/components/schemas/PricingPlanTierList"
          description: The pricing tiers within this plan.
      required:
        - tiers
    PricingPlanTierList:
      description: A list of pricing plan tiers.
      type: array
      items:
        $ref: "#/components/schemas/PricingPlanTier"
    PricingPlanTier:
      description: A tier within an Enterprise Support pricing plan.
      type: object
      properties:
        tierMinimum:
          $ref: "#/components/schemas/String"
          description: The minimum spend threshold for this tier.
        tierMaximum:
          $ref: "#/components/schemas/String"
          description: The maximum spend threshold for this tier.
        baseCharge:
          $ref: "#/components/schemas/String"
          description: The base charge for this tier.
        additionalPercentageOfAggregateCharges:
          $ref: "#/components/schemas/String"
          description: The additional percentage applied to aggregate charges in this tier.
        aggregateChargesAdjustment:
          $ref: "#/components/schemas/String"
          description: The adjustment applied to aggregate charges.
        incremental:
          $ref: "#/components/schemas/Boolean"
          description: Whether the tier charges are calculated incrementally.
        increment:
          $ref: "#/components/schemas/String"
          description: The increment amount for incremental tier calculations.
        incrementCharge:
          $ref: "#/components/schemas/String"
          description: The charge per increment.
      required:
        - tierMinimum
        - baseCharge
        - additionalPercentageOfAggregateCharges
        - aggregateChargesAdjustment
        - incremental
    GetEnterpriseSupportContractDetailsResponse:
      description: The response structure for GetEnterpriseSupportContractDetails.
      type: object
      properties:
        isContractActive:
          $ref: "#/components/schemas/Boolean"
          description: When true, the Enterprise Support contract is active. When false, the Enterprise Support Contract is inactive.
        supportAllocationMethod:
          $ref: "#/components/schemas/String"
          description: "The method used to distribute the total Support charge amount across each account in the Support profile. Valid values: Proportional, Fixed_Percentage. Proportional means support charges are distributed to each account in proportion to its eligible Spend. Fixed_Percentage means support charges are distributed across accounts according to pre-configured percentages from the contract."
        supportReservedInstanceAmortizationStartDate:
          $ref: "#/components/schemas/Timestamp"
          description: When supportReservedInstanceTreatmentMethod = AmortizedCustom, only amortized fees for Reserved Instances purchased on or after this date are included in the calculation. This field is Null for all other treatment methods.
        supportReservedInstanceTreatmentMethod:
          $ref: "#/components/schemas/String"
          description: "The method used to include Reserved Instance (RI) fees in the Enterprise Support charge calculation. Valid values: None (RI fees excluded from Support-eligible spend), Upfront (full upfront RI fees included in month of purchase), Amortized (RI fees spread over commitment term for RIs purchased on or after Support subscription start date), AmortizedCustom (same as Amortized but only for RIs purchased on or after a specified custom start date), AmortizedAll (RI fees amortized for all active RIs including those purchased before Support subscription started)."
        supportSavingsPlansAmortizationStartDate:
          $ref: "#/components/schemas/Timestamp"
          description: This is applicable when supportSavingsPlansTreatmentMethod = Amortized and is Null for all other methods. It shows the start date from which Savings Plan fees are included in Support Eligible Spend.
        supportSavingsPlansTreatmentMethod:
          $ref: "#/components/schemas/String"
          description: "The method used to include Savings Plans fees in Enterprise Support charge calculations. Valid values: None (Savings Plan fees excluded from Support-eligible spend), Upfront (full upfront Savings Plan fees included in month of purchase), Amortized (Savings Plan fees spread over commitment term for Savings Plans purchased on or after Support subscription start date), AmortizedCustom (same as Amortized but only for Savings Plans purchased on or after a specified custom start date), AmortizedAll (Savings Plan fees amortized for all active Savings Plans including those purchased before Support subscription started)."
        supportProrateStartDate:
          $ref: "#/components/schemas/Timestamp"
          description: The start date for accounts subscribed or unsubscribed to Support billing during the billing month.
        contractPayerAccountIds:
          $ref: "#/components/schemas/ContractAccountList"
          description: The list of accounts covered by the Enterprise Support contract.
        chargedPayerAccountIds:
          $ref: "#/components/schemas/ChargeAccountList"
          description: The list of payer accounts and their charge allocation percentages.
        additionalSupportCharge:
          $ref: "#/components/schemas/AdditionalChargeList"
          description: Any Additional support charges applied to the contract.
        additionalSupportEligibleUsageSpend:
          $ref: "#/components/schemas/AdditionalChargeList"
          description: Any Additional support-eligible usage spend charges.
        pricingPlans:
          $ref: "#/components/schemas/PricingPlanList"
          description: The pricing plans associated with this Enterprise Support contract.
      required:
        - supportAllocationMethod
        - contractPayerAccountIds
        - chargedPayerAccountIds
        - pricingPlans
    ContractAccountList:
