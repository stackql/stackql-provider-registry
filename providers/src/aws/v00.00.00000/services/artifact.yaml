openapi: 3.0.0
info:
  version: "2018-05-10"
  title: AWS Artifact
  description: AWS Artifact
  x-serviceName: artifact
  x-serviceAlias: artifact
  x-protocol: rest-json
  x-apiVersion: "2018-05-10"
  x-endpointPrefix: artifact
servers:
  - url: https://artifact.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for artifact
paths:
  /v1/compliance-inquiry/create:
    post:
      operationId: CreateComplianceInquiry
      description: Create a new compliance inquiry.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/InquiryName"
                inquiryContent:
                  $ref: "#/components/schemas/InquiryContent"
                clientToken:
                  $ref: "#/components/schemas/IdempotentClientToken"
                supportMode:
                  $ref: "#/components/schemas/InquirySupportMode"
                tags:
                  $ref: "#/components/schemas/TagsMap"
              required:
                - name
                - inquiryContent
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateComplianceInquiryResponse"
  /v1/compliance-inquiry/export:
    post:
      operationId: ExportComplianceInquiry
      description: Export a compliance inquiry report.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                complianceInquiryId:
                  $ref: "#/components/schemas/InquiryId"
                queryIdentifiers:
                  $ref: "#/components/schemas/QueryIdentifiersList"
                includeCitations:
                  $ref: "#/components/schemas/Boolean"
              required:
                - complianceInquiryId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportComplianceInquiryResponse"
  /v1/account-settings/get:
    get:
      operationId: GetAccountSettings
      description: Get the account settings for Artifact.
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountSettingsResponse"
  /v1/compliance-inquiry/getMetadata:
    get:
      operationId: GetComplianceInquiryMetadata
      description: Get the metadata for a single compliance inquiry.
      parameters:
        - name: complianceInquiryId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/InquiryId"
          description: Unique resource ID for the compliance inquiry.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetComplianceInquiryMetadataResponse"
  /v1/report/get:
    get:
      operationId: GetReport
      description: Get the content for a single report.
      parameters:
        - name: reportId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ReportId"
          description: Unique resource ID for the report resource.
        - name: reportVersion
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/VersionAttribute"
          description: Version for the report resource.
        - name: termToken
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ShortStringAttribute"
          description: Unique download token provided by GetTermForReport API.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReportResponse"
  /v1/report/getMetadata:
    get:
      operationId: GetReportMetadata
      description: Get the metadata for a single report.
      parameters:
        - name: reportId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ReportId"
          description: Unique resource ID for the report resource.
        - name: reportVersion
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/VersionAttribute"
          description: Version for the report resource.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReportMetadataResponse"
  /v1/report/getTermForReport:
    get:
      operationId: GetTermForReport
      description: Get the Term content associated with a single report.
      parameters:
        - name: reportId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ReportId"
          description: Unique resource ID for the report resource.
        - name: reportVersion
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/VersionAttribute"
          description: Version for the report resource.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTermForReportResponse"
  /v1/compliance-inquiry/list:
    get:
      operationId: ListComplianceInquiries
      description: List available compliance inquiries.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResultsAttribute"
          description: Maximum number of resources to return in the paginated response.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextTokenAttribute"
          description: Pagination token to request the next page of resources.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListComplianceInquiriesResponse"
  /v1/compliance-inquiry/listQueries:
    get:
      operationId: ListComplianceInquiryQueries
      description: List queries within a compliance inquiry.
      parameters:
        - name: complianceInquiryId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/InquiryId"
          description: Unique resource ID for the compliance inquiry.
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResultsAttribute"
          description: Maximum number of resources to return in the paginated response.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextTokenAttribute"
          description: Pagination token to request the next page of resources.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListComplianceInquiryQueriesResponse"
  /v1/customer-agreement/list:
    get:
      operationId: ListCustomerAgreements
      description: List active customer-agreements applicable to calling identity.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResultsAttribute"
          description: Maximum number of resources to return in the paginated response.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextTokenAttribute"
          description: Pagination token to request the next page of resources.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCustomerAgreementsResponse"
  /v1/report/listVersions:
    get:
      operationId: ListReportVersions
      description: List available report versions for a given report.
      parameters:
        - name: reportId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ReportId"
          description: Unique resource ID for the report resource.
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResultsAttribute"
          description: Maximum number of resources to return in the paginated response.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextTokenAttribute"
          description: Pagination token to request the next page of resources.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReportVersionsResponse"
  /v1/report/list:
    get:
      operationId: ListReports
      description: List available reports.
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResultsAttribute"
          description: Maximum number of resources to return in the paginated response.
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextTokenAttribute"
          description: Pagination token to request the next page of resources.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReportsResponse"
  /tags/{resource_arn}:
    get:
      operationId: ListTagsForResource
      description: List tags for a resource.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LongStringAttribute"
          description: The Amazon Resource Name (ARN) of the resource.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTagsForResourceResponse"
    post:
      operationId: TagResource
      description: Add tags to a resource.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LongStringAttribute"
          description: The Amazon Resource Name (ARN) of the resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  $ref: "#/components/schemas/TagsMap"
              required:
                - tags
      responses:
        "204":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResourceResponse"
    delete:
      operationId: UntagResource
      description: Remove tags from a resource.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LongStringAttribute"
          description: The Amazon Resource Name (ARN) of the resource.
        - name: tagKeys
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TagKeys"
          description: Tag keys to remove from the resource.
      responses:
        "204":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UntagResourceResponse"
  /v1/account-settings/put:
    put:
      operationId: PutAccountSettings
      description: Put the account settings for Artifact.
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationSubscriptionStatus:
                  $ref: "#/components/schemas/NotificationSubscriptionStatus"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutAccountSettingsResponse"
  /v1/compliance-inquiry/putFeedback:
    put:
      operationId: PutComplianceInquiryFeedback
      description: Submits feedback on a compliance inquiry response.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                complianceInquiryId:
                  $ref: "#/components/schemas/InquiryId"
                queryIdentifier:
                  $ref: "#/components/schemas/Integer"
                rating:
                  $ref: "#/components/schemas/FeedbackRating"
                responseRevisionId:
                  $ref: "#/components/schemas/Integer"
                reasonCodes:
                  $ref: "#/components/schemas/FeedbackReasonCodeList"
                comment:
                  $ref: "#/components/schemas/FeedbackCommentAttribute"
                clientToken:
                  $ref: "#/components/schemas/IdempotentClientToken"
              required:
                - complianceInquiryId
                - rating
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutComplianceInquiryFeedbackResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    InquiryName:
      type: string
    InquiryContent:
      description: Content for creating a compliance inquiry - either a single query or file content.
      type: object
      properties:
        query:
          $ref: "#/components/schemas/LongStringAttribute"
          description: Single text query for AI-generated answer.
        fileContent:
          $ref: "#/components/schemas/InquiryFileContent"
          description: File content with multiple questions.
    LongStringAttribute:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: "[^<>]*"
    InquiryFileContent:
      description: File content structure for compliance inquiry uploads.
      type: object
      properties:
        fileSections:
          $ref: "#/components/schemas/InquiryFileContentFileSectionsList"
          description: List of file sections/sheets to process.
        content:
          $ref: "#/components/schemas/Blob"
          description: Binary content of the uploaded file.
      required:
        - content
    InquiryFileContentFileSectionsList:
      type: array
      items:
        $ref: "#/components/schemas/ShortStringAttribute"
    ShortStringAttribute:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "[a-zA-Z0-9_\\-\\s]*"
    Blob:
      type: string
      format: byte
    IdempotentClientToken:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "[\\w\\-]+"
    InquirySupportMode:
      type: string
      enum:
        - AI_ONLY
        - FULL_SUPPORT
    TagsMap:
      description: A map of tag keys to tag values.
      type: object
      properties: {}
    CreateComplianceInquiryResponse:
      type: object
      properties:
        complianceInquirySummary:
          $ref: "#/components/schemas/InquirySummary"
          description: Summary information about the created compliance inquiry.
        tags:
          type: object
          properties: {}
          description: Tags associated with the compliance inquiry resource.
    InquirySummary:
      description: Summary information about a compliance inquiry.
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/String"
          description: ARN of the compliance inquiry resource.
        name:
          $ref: "#/components/schemas/String"
          description: Title of the inquiry.
        id:
          $ref: "#/components/schemas/InquiryId"
          description: Unique resource ID for the compliance inquiry.
        status:
          $ref: "#/components/schemas/InquiryStatus"
          description: Current processing status of the inquiry.
        statusMessage:
          $ref: "#/components/schemas/InquiryStatusMessage"
          description: Status message providing additional context.
        inputSource:
          $ref: "#/components/schemas/InputSource"
          description: Type of inquiry content (text or file).
        createdAt:
          $ref: "#/components/schemas/TimestampAttribute"
          description: Timestamp indicating when the resource was created.
      required:
        - arn
        - name
        - id
        - status
        - statusMessage
        - inputSource
        - createdAt
    String:
      type: string
    InquiryId:
      type: string
      pattern: compliance-inquiry-[a-zA-Z0-9]{16}
    InquiryStatus:
      type: string
      enum:
        - PROCESSING
        - HUMAN_REVIEW
        - COMPLETED
        - FAILED
    InquiryStatusMessage:
      type: string
      enum:
        - Compliance inquiry processing is complete.
        - Malware was detected on the file. Provide a new file and try again.
        - Compliance inquiry processing is in-progress.
        - An internal error occurred while processing the inquiry. Try again at a later time.
        - Human review is in progress.
        - Compliance inquiry processing is complete. One or more queries encountered errors during processing.
    InputSource:
      type: string
      enum:
        - TEXT
        - FILE
    TimestampAttribute:
      type: string
      format: date-time
    QueryIdentifiersList:
      type: array
      items:
        $ref: "#/components/schemas/Integer"
    Integer:
      type: integer
    Boolean:
      type: boolean
    ExportComplianceInquiryResponse:
      type: object
      properties:
        documentPresignedUrl:
          $ref: "#/components/schemas/PresignedUrl"
          description: Presigned S3 URL to access the exported compliance inquiry report.
        tags:
          type: object
          properties: {}
          description: Tags associated with the compliance inquiry resource.
    PresignedUrl:
      description: A pre-signed URL for accessing content.
      type: string
    GetAccountSettingsResponse:
      type: object
      properties:
        accountSettings:
          $ref: "#/components/schemas/AccountSettings"
    AccountSettings:
      description: Account settings for the customer.
      type: object
      properties:
        notificationSubscriptionStatus:
          $ref: "#/components/schemas/NotificationSubscriptionStatus"
          description: Notification subscription status of the customer.
    NotificationSubscriptionStatus:
      type: string
      enum:
        - SUBSCRIBED
        - NOT_SUBSCRIBED
    GetComplianceInquiryMetadataResponse:
      type: object
      properties:
        complianceInquiryDetail:
          $ref: "#/components/schemas/InquiryDetail"
          description: Detailed information about the compliance inquiry.
        tags:
          type: object
          properties: {}
          description: Tags associated with the compliance inquiry resource.
    InquiryDetail:
      description: Detailed information about a compliance inquiry.
      type: object
      properties:
        arn:
          $ref: "#/components/schemas/String"
          description: ARN of the compliance inquiry resource.
        name:
          $ref: "#/components/schemas/String"
          description: Title of the inquiry.
        id:
          $ref: "#/components/schemas/InquiryId"
          description: Unique resource ID for the compliance inquiry.
        status:
          $ref: "#/components/schemas/InquiryStatus"
          description: Current processing status of the inquiry.
        statusMessage:
          $ref: "#/components/schemas/InquiryStatusMessage"
          description: Status message providing additional context.
        inputSource:
          $ref: "#/components/schemas/InputSource"
          description: Type of inquiry content (text or file).
        createdAt:
          $ref: "#/components/schemas/TimestampAttribute"
          description: Timestamp indicating when the resource was created.
        updatedAt:
          $ref: "#/components/schemas/TimestampAttribute"
          description: Timestamp indicating when the resource was last modified.
        supportMode:
          $ref: "#/components/schemas/InquirySupportMode"
          description: Support mode for this inquiry. AI_ONLY provides AI-generated responses. FULL_SUPPORT includes human expert review.
      required:
        - arn
        - name
        - id
        - status
        - statusMessage
        - inputSource
        - createdAt
    ReportId:
      type: string
      pattern: report-[a-zA-Z0-9]{16}
    VersionAttribute:
      type: integer
      format: int64
      minimum: 1
    GetReportResponse:
      type: object
      properties:
        documentPresignedUrl:
          $ref: "#/components/schemas/GetReportResponseDocumentPresignedUrlString"
          description: Presigned S3 url to access the report content.
    GetReportResponseDocumentPresignedUrlString:
      type: string
      minLength: 1
      maxLength: 10240
    GetReportMetadataResponse:
      type: object
      properties:
        reportDetails:
          $ref: "#/components/schemas/ReportDetail"
          description: Report resource detail.
    ReportDetail:
      description: Full detail for report resource metadata.
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ReportId"
          description: Unique resource ID for the report resource.
        name:
          $ref: "#/components/schemas/ShortStringAttribute"
          description: Name for the report resource.
        description:
          $ref: "#/components/schemas/LongStringAttribute"
          description: Description for the report resource.
        periodStart:
          $ref: "#/components/schemas/TimestampAttribute"
          description: Timestamp indicating the report resource effective start.
        periodEnd:
          $ref: "#/components/schemas/TimestampAttribute"
          description: Timestamp indicating the report resource effective end.
        createdAt:
          $ref: "#/components/schemas/TimestampAttribute"
          description: Timestamp indicating when the report resource was created.
        lastModifiedAt:
          $ref: "#/components/schemas/TimestampAttribute"
          description: Timestamp indicating when the report resource was last modified.
        deletedAt:
          $ref: "#/components/schemas/TimestampAttribute"
          description: Timestamp indicating when the report resource was deleted.
        state:
          $ref: "#/components/schemas/PublishedState"
          description: Current state of the report resource
        arn:
          $ref: "#/components/schemas/LongStringAttribute"
          description: ARN for the report resource.
        series:
          $ref: "#/components/schemas/ShortStringAttribute"
          description: Series for the report resource.
        category:
          $ref: "#/components/schemas/ShortStringAttribute"
          description: Category for the report resource.
        companyName:
          $ref: "#/components/schemas/ShortStringAttribute"
          description: Associated company name for the report resource.
        productName:
          $ref: "#/components/schemas/ShortStringAttribute"
          description: Associated product name for the report resource.
        termArn:
          $ref: "#/components/schemas/LongStringAttribute"
          description: Unique resource ARN for term resource.
        version:
          $ref: "#/components/schemas/VersionAttribute"
          description: Version for the report resource.
        acceptanceType:
          $ref: "#/components/schemas/AcceptanceType"
          description: Acceptance type for report.
        sequenceNumber:
          $ref: "#/components/schemas/SequenceNumberAttribute"
          description: Sequence number to enforce optimistic locking.
        uploadState:
          $ref: "#/components/schemas/UploadState"
          description: The current state of the document upload.
        statusMessage:
          $ref: "#/components/schemas/StatusMessage"
          description: The message associated with the current upload state.
    PublishedState:
      type: string
      enum:
        - PUBLISHED
        - UNPUBLISHED
    AcceptanceType:
      type: string
      enum:
        - PASSTHROUGH
        - EXPLICIT
    SequenceNumberAttribute:
      type: integer
      format: int64
      minimum: 1
    UploadState:
      type: string
      enum:
        - PROCESSING
        - COMPLETE
        - FAILED
        - FAULT
    StatusMessage:
      type: string
    GetTermForReportResponse:
      type: object
      properties:
        documentPresignedUrl:
          $ref: "#/components/schemas/GetTermForReportResponseDocumentPresignedUrlString"
          description: Presigned S3 url to access the term content.
        termToken:
          $ref: "#/components/schemas/String"
          description: Unique token representing this request event.
    GetTermForReportResponseDocumentPresignedUrlString:
      type: string
      minLength: 1
      maxLength: 10240
    MaxResultsAttribute:
      type: integer
      minimum: 1
      maximum: 300
    NextTokenAttribute:
      type: string
      minLength: 1
      maxLength: 2048
    ListComplianceInquiriesResponse:
      type: object
      properties:
        complianceInquiries:
          $ref: "#/components/schemas/InquiriesList"
          description: List of compliance inquiry resources.
        nextToken:
          $ref: "#/components/schemas/NextTokenAttribute"
          description: Pagination token to request the next page of resources.
    InquiriesList:
      type: array
      items:
        $ref: "#/components/schemas/InquirySummary"
    ListComplianceInquiryQueriesResponse:
      type: object
      properties:
        queries:
          $ref: "#/components/schemas/QueriesList"
          description: List of compliance query summaries.
        nextToken:
          $ref: "#/components/schemas/NextTokenAttribute"
          description: Pagination token to request the next page of resources.
    QueriesList:
      type: array
      items:
        $ref: "#/components/schemas/QuerySummary"
    QuerySummary:
      description: Summary information about a single query within a compliance inquiry.
      type: object
      properties:
        queryIdentifier:
          $ref: "#/components/schemas/Integer"
          description: Sequential identifier of the query within the inquiry.
        query:
          $ref: "#/components/schemas/LongStringAttribute"
          description: The actual query text.
        response:
          $ref: "#/components/schemas/LongStringAttribute"
          description: Generated response to the query.
        reviewType:
          $ref: "#/components/schemas/ReviewType"
          description: Type of review for the response.
        citations:
          $ref: "#/components/schemas/CitationList"
          description: Supporting citations for the response.
        status:
          $ref: "#/components/schemas/QueryStatus"
          description: Current processing status of the query.
        statusMessage:
          $ref: "#/components/schemas/QueryStatusMessage"
          description: Descriptive status message.
        createdAt:
          $ref: "#/components/schemas/TimestampAttribute"
          description: Timestamp when the query was created.
        updatedResponseVersions:
          $ref: "#/components/schemas/ResponseVersionList"
          description: Ordered list of response version history entries, oldest first.
      required:
        - queryIdentifier
        - query
        - status
        - statusMessage
        - createdAt
    ReviewType:
      type: string
      enum:
        - HUMAN
        - AI
    CitationList:
      type: array
      items:
        $ref: "#/components/schemas/Citation"
    Citation:
      description: Citation information for AI-generated responses.
      type: object
      properties:
        sourceLabel:
          $ref: "#/components/schemas/ShortStringAttribute"
          description: Label identifying the compliance source.
        sourceContent:
          $ref: "#/components/schemas/LongStringAttribute"
          description: Content text from the compliance source.
        sourceLink:
          $ref: "#/components/schemas/LongStringAttribute"
          description: Link to the compliance source.
    QueryStatus:
      type: string
      enum:
        - PROCESSING
        - COMPLETED
        - FAILED
    QueryStatusMessage:
      type: string
      enum:
