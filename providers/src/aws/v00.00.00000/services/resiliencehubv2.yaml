          $ref: "#/components/schemas/LoggingConfiguration"
          description: The logging configuration snapshotted from the test when the run was started.
        roleName:
          $ref: "#/components/schemas/EntityName"
          description: The IAM execution role name snapshotted from the test when the run was started.
        testTemplateArn:
          $ref: "#/components/schemas/ServiceOwnedArn"
          description: The ARN of the test template snapshotted from the test when the run was started.
        reportConfiguration:
          $ref: "#/components/schemas/TestRunReportConfiguration"
          description: The report configuration snapshotted from the service when the run was started.
        policy:
          $ref: "#/components/schemas/TestRunPolicySnapshot"
          description: The resilience policy snapshotted from the service when the run was started.
        reportOutput:
          $ref: "#/components/schemas/ReportGenerationResult"
          description: The report generation result for the test run. Present after report generation completes or fails.
