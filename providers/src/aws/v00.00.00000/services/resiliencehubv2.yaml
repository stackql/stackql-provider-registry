          $ref: "#/components/schemas/Arn"
          description: The ARN of the ARC Region switch plan associated with the test run.
        regionSwitchExecutionId:
          $ref: "#/components/schemas/RegionSwitchExecutionId"
          description: The identifier of the ARC Region switch execution detected during the test run.
        permissionModel:
          $ref: "#/components/schemas/PermissionModel"
          description: The permission model snapshotted from the service when the run was started.
        regions:
          $ref: "#/components/schemas/RegionList"
          description: The Regions snapshotted from the service when the run was started.
        accountTargeting:
          $ref: "#/components/schemas/AccountTargeting"
          description: Indicates whether this test run targets a single account or multiple accounts.
