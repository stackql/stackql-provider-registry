          type: object
          properties: {}
          description: The parameter values used for the test run.
        errorMessage:
          $ref: "#/components/schemas/String"
          description: A human-readable reason for test run failure. Only present when the status is FAILED or ERROR.
        stopConditions:
          $ref: "#/components/schemas/StopConditionList"
          description: The stop conditions snapshotted from the test when the run was started.
