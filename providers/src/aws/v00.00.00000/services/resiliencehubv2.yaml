          $ref: "#/components/schemas/System"
          description: The created system.
      required:
        - system
    System:
      description: Represents a system in Resilience Hub. A system is a logical grouping of services.
      type: object
      properties:
        systemArn:
          $ref: "#/components/schemas/Arn"
        systemId:
          $ref: "#/components/schemas/SystemId"
        name:
