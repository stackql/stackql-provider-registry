        ouId:
          $ref: "#/components/schemas/OuId"
          description: The organizational unit (OU) identifier for the system.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the system was created.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the system was last updated.
      required:
