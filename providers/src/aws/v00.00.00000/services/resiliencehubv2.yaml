        testingRecommendations:
          $ref: "#/components/schemas/TestingRecommendationsList"
          description: Testing recommendations to address the finding.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the finding was last updated.
