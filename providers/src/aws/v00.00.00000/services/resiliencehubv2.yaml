                  $ref: "#/components/schemas/PermissionModel"
                dependencyDiscovery:
                  $ref: "#/components/schemas/DependencyDiscoveryInput"
                reportConfiguration:
                  $ref: "#/components/schemas/ServiceReportConfiguration"
              required:
                - serviceArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateServiceResponse"
  /v2/update-function:
    post:
      operationId: UpdateServiceFunction
      description: Updates a service function.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                serviceFunctionId:
                  $ref: "#/components/schemas/EntityId"
                name:
                  $ref: "#/components/schemas/EntityLabel"
                description:
                  $ref: "#/components/schemas/EntityDescription"
                criticality:
                  $ref: "#/components/schemas/ServiceFunctionCriticality"
              required:
                - serviceArn
                - serviceFunctionId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateServiceFunctionResponse"
  /v2/update-system:
    post:
      operationId: UpdateSystem
      description: Updates an existing system.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemArn:
                  $ref: "#/components/schemas/Arn"
                description:
                  $ref: "#/components/schemas/EntityDescription"
                sharingEnabled:
                  $ref: "#/components/schemas/Boolean"
              required:
                - systemArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSystemResponse"
  /v2/update-test:
    post:
      operationId: UpdateTest
      description: Updates the configuration of an existing test.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                testId:
                  $ref: "#/components/schemas/TestId"
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                loggingConfiguration:
                  $ref: "#/components/schemas/LoggingConfiguration"
                stopConditions:
                  $ref: "#/components/schemas/StopConditionList"
                roleName:
                  $ref: "#/components/schemas/EntityName"
                parameters:
                  $ref: "#/components/schemas/TestParameters"
              required:
                - testId
                - serviceArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateTestResponse"
  /v2/update-user-journey:
    post:
      operationId: UpdateUserJourney
      description: Updates an existing user journey.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemArn:
                  $ref: "#/components/schemas/Arn"
                userJourneyId:
                  $ref: "#/components/schemas/UserJourneyId"
                name:
                  $ref: "#/components/schemas/EntityLabel"
                description:
                  $ref: "#/components/schemas/EntityDescription"
                policyArn:
                  $ref: "#/components/schemas/Arn"
              required:
                - systemArn
                - userJourneyId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserJourneyResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    Arn:
      description: ARN identifier.
      type: string
      minLength: 31
      pattern: arn:(aws|aws-cn|aws-iso|aws-iso-[a-z]{1}|aws-us-gov):[A-Za-z0-9][A-Za-z0-9_/.-]{0,62}:([a-z]{2}-((iso[a-z]{0,1}-)|(gov-)){0,1}[a-z]+-[0-9]):[0-9]{12}:[A-Za-z0-9/][A-Za-z0-9:_/+.-]{0,1023}
    AssertionText:
      type: string
      minLength: 1
      maxLength: 1000
    ClientToken:
      description: Idempotency token.
      type: string
      minLength: 1
      maxLength: 63
      pattern: "[A-Za-z0-9_.-]{0,63}"
    CreateAssertionResponse:
      type: object
      properties:
        assertion:
          $ref: "#/components/schemas/Assertion"
          description: The created assertion.
      required:
        - assertion
    Assertion:
      description: Represents a resilience assertion for a service.
      type: object
      properties:
        serviceArn:
          $ref: "#/components/schemas/Arn"
        assertionId:
          $ref: "#/components/schemas/Uuid"
          description: The unique identifier of the assertion.
        text:
          $ref: "#/components/schemas/AssertionText"
          description: The text content of the assertion.
        source:
          $ref: "#/components/schemas/AssertionSource"
          description: The source of the assertion, indicating whether it was AI-generated or created by a user.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the assertion was created.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the assertion was last updated.
      required:
        - serviceArn
        - assertionId
        - text
        - source
    Uuid:
      type: string
      minLength: 36
      maxLength: 36
      pattern: "[0-9a-f]{8}-[0-9a-f]{4}-[0-5][0-9a-f]{3}-[089ab][0-9a-f]{3}-[0-9a-f]{12}"
    AssertionSource:
      type: string
      enum:
        - AI_GENERATED
        - USER
    Timestamp:
      type: string
      format: date-time
    ResourceConfiguration:
      description: Resource configuration for an input source. Provide exactly one field.
      type: object
      properties:
        resourceTags:
          $ref: "#/components/schemas/ResourceTagList"
          description: The resource tags for tag-based resource discovery.
        cfnStackArn:
          $ref: "#/components/schemas/Arn"
        tfStateFileUrl:
          $ref: "#/components/schemas/S3Url"
        eks:
          $ref: "#/components/schemas/EksSource"
          description: The Amazon EKS configuration for resource discovery.
        designFileS3Url:
          $ref: "#/components/schemas/S3Url"
    ResourceTagList:
      type: array
      items:
        $ref: "#/components/schemas/ResourceTag"
    ResourceTag:
      description: A tag key-value pair used for resource discovery.
      type: object
      properties:
        key:
          $ref: "#/components/schemas/TagKey"
        values:
          $ref: "#/components/schemas/ResourceTagValuesList"
          description: The list of tag values.
      required:
        - key
        - values
    TagKey:
      description: Tag key.
      type: string
      minLength: 1
      maxLength: 128
      pattern: "[^\\x00-\\x1f\\x22]+"
    ResourceTagValuesList:
      type: array
      items:
        $ref: "#/components/schemas/TagValue"
    TagValue:
      description: Tag value.
      type: string
      minLength: 0
      maxLength: 256
      pattern: "[^\\x00-\\x1f\\x22]*"
    S3Url:
      description: S3 URL — virtual hosted-style or s3:// URI.
      type: string
      minLength: 1
      maxLength: 2000
      pattern: ((https://([^/]+)\.s3[^/]*\.[^/]+)|(s3://([^/]+)))/\S{1,2000}
    EksSource:
      description: Defines an Amazon EKS cluster and its namespaces as an input source for resource discovery.
      type: object
      properties:
        clusterArn:
          $ref: "#/components/schemas/Arn"
        namespaces:
          $ref: "#/components/schemas/EksSourceNamespacesList"
          description: The list of Kubernetes namespaces within the EKS cluster.
      required:
        - clusterArn
        - namespaces
    EksSourceNamespacesList:
      type: array
      items:
        $ref: "#/components/schemas/EksNamespace"
    EksNamespace:
      description: Kubernetes namespace name (RFC 1123 Label).
      type: string
      minLength: 1
      maxLength: 63
      pattern: "[a-z0-9]([-a-z0-9]*[a-z0-9])?"
    CreateInputSourceResponse:
      type: object
      properties:
        serviceArn:
          $ref: "#/components/schemas/Arn"
        inputSourceId:
          $ref: "#/components/schemas/InputSourceId"
          description: The unique identifier assigned to the created input source.
      required:
        - serviceArn
        - inputSourceId
    InputSourceId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: \S{1,255}
    EntityName:
      description: Resource name (used in ARN — no spaces allowed).
      type: string
      minLength: 2
      maxLength: 60
      pattern: "[A-Za-z0-9][A-Za-z0-9_\\-]{1,59}"
    LongDescription:
      description: Resource description for services and policies.
      type: string
      minLength: 0
      maxLength: 615
    AvailabilitySlo:
      description: Defines the availability service level objective (SLO) for a resilience policy.
      type: object
      properties:
        target:
          $ref: "#/components/schemas/AvailabilitySloTargetDouble"
          description: The target availability percentage, expressed as a value between 0 and 100.
    AvailabilitySloTargetDouble:
      type: number
      format: double
      minimum: 0
      maximum: 100
    MultiAzTargets:
      description: Defines the multi-AZ disaster recovery targets for a resilience policy.
      type: object
      properties:
        rtoInMinutes:
          $ref: "#/components/schemas/MultiAzTargetsRtoInMinutesInteger"
          description: The recovery time objective (RTO) target for multi-AZ, in minutes.
        rpoInMinutes:
          $ref: "#/components/schemas/MultiAzTargetsRpoInMinutesInteger"
          description: The recovery point objective (RPO) target for multi-AZ, in minutes.
        disasterRecoveryApproach:
          $ref: "#/components/schemas/MultiAzDisasterRecoveryApproach"
          description: The disaster recovery approach for multi-AZ.
    MultiAzTargetsRtoInMinutesInteger:
      type: integer
      minimum: 0
    MultiAzTargetsRpoInMinutesInteger:
      type: integer
      minimum: 0
    MultiAzDisasterRecoveryApproach:
      type: string
      enum:
        - ACTIVE_ACTIVE
        - HOT_STANDBY
        - WARM_STANDBY
        - PILOT_LIGHT
        - BACKUP_AND_RESTORE
    MultiRegionTargets:
      description: Defines the multi-Region disaster recovery targets for a resilience policy.
      type: object
      properties:
        rtoInMinutes:
          $ref: "#/components/schemas/MultiRegionTargetsRtoInMinutesInteger"
          description: The recovery time objective (RTO) target for multi-Region, in minutes.
        rpoInMinutes:
          $ref: "#/components/schemas/MultiRegionTargetsRpoInMinutesInteger"
          description: The recovery point objective (RPO) target for multi-Region, in minutes.
        disasterRecoveryApproach:
          $ref: "#/components/schemas/MultiRegionDisasterRecoveryApproach"
          description: The disaster recovery approach for multi-Region.
    MultiRegionTargetsRtoInMinutesInteger:
      type: integer
      minimum: 0
    MultiRegionTargetsRpoInMinutesInteger:
      type: integer
      minimum: 0
    MultiRegionDisasterRecoveryApproach:
      type: string
      enum:
        - ACTIVE_ACTIVE
        - HOT_STANDBY
        - WARM_STANDBY
        - PILOT_LIGHT
        - BACKUP_AND_RESTORE
    DataRecoveryTargets:
      description: Defines data recovery targets for a resilience policy.
      type: object
      properties:
        timeBetweenBackupsInMinutes:
          $ref: "#/components/schemas/DataRecoveryTargetsTimeBetweenBackupsInMinutesInteger"
          description: The target time between backups, in minutes.
    DataRecoveryTargetsTimeBetweenBackupsInMinutesInteger:
      type: integer
      minimum: 0
    KmsKeyId:
      description: KMS key identifier — accepts key ID, key ARN, alias name, or alias ARN.
      type: string
      minLength: 1
      maxLength: 2048
    TagMap:
      description: Resource tags.
      type: object
      properties: {}
    CreatePolicyResponse:
      type: object
      properties:
        policy:
          $ref: "#/components/schemas/Policy"
          description: The created resilience policy.
      required:
        - policy
    Policy:
      description: Represents a resilience policy that defines availability and disaster recovery requirements.
      type: object
      properties:
        policyArn:
          $ref: "#/components/schemas/Arn"
        name:
          $ref: "#/components/schemas/EntityName"
        description:
          $ref: "#/components/schemas/LongDescription"
        availabilitySlo:
          $ref: "#/components/schemas/AvailabilitySlo"
          description: The availability SLO defined in the policy.
        multiAz:
          $ref: "#/components/schemas/MultiAzTargets"
          description: The multi-AZ disaster recovery targets defined in the policy.
        multiRegion:
          $ref: "#/components/schemas/MultiRegionTargets"
          description: The multi-Region disaster recovery targets defined in the policy.
        dataRecovery:
          $ref: "#/components/schemas/DataRecoveryTargets"
          description: The data recovery targets defined in the policy.
        kmsKeyId:
          $ref: "#/components/schemas/KmsKeyId"
        tags:
          type: object
          properties: {}
        associatedServiceCount:
          $ref: "#/components/schemas/Integer"
          description: The number of services associated with this policy.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the policy was created.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the policy was last updated.
      required:
        - policyArn
        - name
    Integer:
      type: integer
    ReportType:
      type: string
      enum:
        - FAILURE_MODE
        - TESTING
    CreateReportResponse:
      type: object
      properties:
        reportGenerationResult:
          $ref: "#/components/schemas/ReportGenerationResult"
          description: The result of the report generation request.
      required:
        - reportGenerationResult
    ReportGenerationResult:
      description: Result of a report generation attempt.
      type: object
      properties:
        reportType:
          $ref: "#/components/schemas/ReportType"
          description: The type of the generated report.
        status:
          $ref: "#/components/schemas/ReportGenerationStatus"
          description: The status of the report generation.
        serviceArn:
          $ref: "#/components/schemas/Arn"
          description: The service this report was generated for.
        assessmentId:
          $ref: "#/components/schemas/Uuid"
          description: Present for FAILURE_MODE reports.
        testRunId:
          $ref: "#/components/schemas/TestRunId"
        testTemplateArn:
          $ref: "#/components/schemas/ServiceOwnedArn"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the report was created.
        reportOutput:
          $ref: "#/components/schemas/ReportOutput"
          description: Present when status is SUCCEEDED or FAILED.
      required:
        - reportType
        - status
    ReportGenerationStatus:
      description: Status of report generation.
      type: string
      enum:
        - PENDING
        - SUCCEEDED
        - FAILED
    TestRunId:
      description: The unique identifier of a test run.
      type: string
    ServiceOwnedArn:
      description: An ARN owned by the service. Accepts either a standard 12-digit account ID or the literal "aws" for AWS-managed resources, such as AWS-managed test templates.
      type: string
      minLength: 31
      pattern: arn:(aws|aws-cn|aws-iso|aws-iso-[a-z]{1}|aws-us-gov):[A-Za-z0-9][A-Za-z0-9_/.-]{0,62}:([a-z]{2}-((iso[a-z]{0,1}-)|(gov-)){0,1}[a-z]+-[0-9]):([0-9]{12}|aws):[A-Za-z0-9/][A-Za-z0-9:_/+.-]{0,1023}
    ReportOutput:
      description: Union of possible report outputs.
      type: object
      properties:
        s3ReportOutput:
          $ref: "#/components/schemas/S3ReportOutput"
          description: The S3 location where the report was written.
        failedReportOutput:
          $ref: "#/components/schemas/FailedReportOutput"
          description: Details when report generation failed.
    S3ReportOutput:
      description: S3 location where report was written.
      type: object
      properties:
        s3ObjectKey:
          $ref: "#/components/schemas/String"
          description: The S3 object key for the generated report.
      required:
        - s3ObjectKey
    String:
      type: string
    FailedReportOutput:
      description: Details when report generation failed.
      type: object
      properties:
        errorCode:
          $ref: "#/components/schemas/ReportGenerationErrorCode"
          description: The error code describing why the report generation failed.
        errorMessage:
          $ref: "#/components/schemas/String"
          description: The error message describing why the report generation failed.
      required:
        - errorCode
    ReportGenerationErrorCode:
      description: Error codes for failed report generation.
      type: string
      enum:
        - INSUFFICIENT_PERMISSIONS
        - CONFIGURATION_ERROR
        - INTERNAL_ERROR
    AssociatedSystemList:
      type: array
      items:
        $ref: "#/components/schemas/AssociatedSystem"
    AssociatedSystem:
      description: Represents a system associated with a service.
      type: object
      properties:
        systemArn:
          $ref: "#/components/schemas/Arn"
        systemName:
          $ref: "#/components/schemas/EntityName"
        userJourneyIds:
          $ref: "#/components/schemas/UserJourneyIdList"
          description: The list of user journey identifiers that associate this system with the service.
      required:
        - systemArn
    UserJourneyIdList:
      type: array
      items:
        $ref: "#/components/schemas/UserJourneyId"
    UserJourneyId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: \S{1,255}
    RegionList:
      type: array
      items:
        $ref: "#/components/schemas/AwsRegion"
    AwsRegion:
      type: string
      minLength: 6
      pattern: "[a-z]{2}-((iso[a-z]{0,1}-)|(gov-)){0,1}[a-z]+-[0-9]"
    PermissionModel:
      description: Defines the permission model for a service.
      type: object
      properties:
        invokerRoleName:
          $ref: "#/components/schemas/IamRoleName"
        crossAccountRoles:
          $ref: "#/components/schemas/CrossAccountRoleList"
          description: The list of cross-account IAM role ARNs.
      required:
        - invokerRoleName
    IamRoleName:
      description: IAM role name (supports up to 64 characters per IAM limits).
      type: string
      minLength: 1
      maxLength: 576
      pattern: ([A-Za-z0-9_+=,.@\-]+/)*[A-Za-z0-9_+=,.@\-]+
    CrossAccountRoleList:
      type: array
      items:
        $ref: "#/components/schemas/CrossAccountRole"
    CrossAccountRole:
      description: Specifies a cross-account IAM role ARN and optional external ID.
      type: object
      properties:
        crossAccountRoleArn:
          $ref: "#/components/schemas/IamRoleArn"
        externalId:
          $ref: "#/components/schemas/CrossAccountRoleExternalIdString"
          description: The external ID used for assuming the cross-account role.
      required:
        - crossAccountRoleArn
    IamRoleArn:
      description: ARN of the IAM Role for the profile. Null if the permission profile is the 'Admin' profile.
      type: string
      minLength: 32
      pattern: arn:(aws|aws-cn|aws-iso|aws-iso-[a-z]{1}|aws-us-gov):iam::[0-9]{12}:role/(([^/][!-~]+/){1,511})?[A-Za-z0-9_+=,.@-]{1,64}
    CrossAccountRoleExternalIdString:
      type: string
      minLength: 2
      maxLength: 1224
    DependencyDiscoveryInput:
      description: Caller-settable values for dependency discovery. INITIALIZING is system-managed.
      type: string
      enum:
        - ENABLED
        - DISABLED
    ServiceReportConfiguration:
      description: Configuration for automatic report generation on a Service.
      type: object
      properties:
        reportOutputs:
          $ref: "#/components/schemas/ReportOutputConfigurationList"
          description: Output destinations for generated reports.
      required:
        - reportOutputs
    ReportOutputConfigurationList:
      description: List of report output configurations.
      type: array
      items:
        $ref: "#/components/schemas/ReportOutputConfiguration"
    ReportOutputConfiguration:
      description: Configuration for a report output destination.
      type: object
      properties:
        s3:
          $ref: "#/components/schemas/S3ReportOutputConfiguration"
    S3ReportOutputConfiguration:
      description: S3 configuration for report output.
      type: object
      properties:
        bucketPath:
          $ref: "#/components/schemas/S3BucketPath"
          description: S3 bucket path where reports will be written (e.g., my-bucket/ngrh-reports/).
        bucketOwner:
          $ref: "#/components/schemas/AwsAccountId"
          description: Account ID of the bucket owner for cross-account access verification.
      required:
        - bucketPath
        - bucketOwner
    S3BucketPath:
      description: S3 bucket path (with or without s3:// prefix).
      type: string
      minLength: 3
      maxLength: 512
      pattern: (s3://)?[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](/.*)?
    AwsAccountId:
      type: string
      minLength: 12
      maxLength: 12
      pattern: \d{12}
    CreateServiceResponse:
      type: object
      properties:
        service:
          $ref: "#/components/schemas/Service"
          description: The created service.
      required:
        - service
    Service:
      description: Represents a service in Resilience Hub. A service is the primary unit of resilience assessment.
      type: object
      properties:
        serviceArn:
          $ref: "#/components/schemas/Arn"
        name:
          $ref: "#/components/schemas/EntityName"
        description:
          $ref: "#/components/schemas/LongDescription"
        associatedSystems:
          $ref: "#/components/schemas/AssociatedSystemList"
          description: The systems associated with the service.
        policyArn:
          $ref: "#/components/schemas/Arn"
        regions:
          $ref: "#/components/schemas/RegionList"
          description: The Regions where the service operates.
        permissionModel:
          $ref: "#/components/schemas/PermissionModel"
          description: The permission model for the service.
        dependencyDiscovery:
          $ref: "#/components/schemas/DependencyDiscoveryConfig"
          description: The dependency discovery configuration for the service.
        effectivePolicyValues:
          $ref: "#/components/schemas/EffectivePolicyValues"
          description: The effective policy values for the service.
        achievability:
          $ref: "#/components/schemas/Achievability"
          description: The achievability status of the service's resilience targets.
        reportConfiguration:
          $ref: "#/components/schemas/ServiceReportConfiguration"
        kmsKeyId:
          $ref: "#/components/schemas/KmsKeyId"
        tags:
          type: object
          properties: {}
        estimatedAssessmentCost:
          $ref: "#/components/schemas/AssessmentCost"
          description: The estimated cost of running an assessment on the service.
        resourceDiscovery:
          $ref: "#/components/schemas/ResourceDiscoveryStatus"
          description: The resource discovery status for the service.
        assessmentStatus:
          $ref: "#/components/schemas/AssessmentStatus"
          description: The current assessment status of the service.
        rerunAssessment:
          $ref: "#/components/schemas/Boolean"
          description: Indicates whether the assessment should be rerun.
        openFindingsCount:
          $ref: "#/components/schemas/Integer"
          description: The number of open findings for the service.
        resolvedFindingsCount:
          $ref: "#/components/schemas/Integer"
          description: The number of resolved findings for the service.
        organizationId:
          $ref: "#/components/schemas/OrganizationId"
          description: The AWS Organizations identifier for the service.
        ouId:
          $ref: "#/components/schemas/OuId"
          description: The organizational unit (OU) identifier for the service.
        accountId:
          $ref: "#/components/schemas/AccountId"
          description: The AWS account ID that owns the service.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the service was created.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the service was last updated.
      required:
        - serviceArn
        - name
    DependencyDiscoveryConfig:
      description: Configuration for dependency discovery on a service.
      type: object
      properties:
        status:
          $ref: "#/components/schemas/DependencyDiscoveryStatus"
          description: The current status of dependency discovery.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when dependency discovery was last updated.
        eligibleResourceCount:
          $ref: "#/components/schemas/DependencyDiscoveryConfigEligibleResourceCountInteger"
          description: The count of resources eligible for dependency attribution.
        message:
          $ref: "#/components/schemas/DependencyDiscoveryConfigMessageString"
          description: A status message for dependency discovery, displayed during the initialization state.
      required:
        - status
    DependencyDiscoveryStatus:
      type: string
      enum:
        - ENABLED
        - INITIALIZING
        - DISABLED
    DependencyDiscoveryConfigEligibleResourceCountInteger:
      type: integer
      minimum: 0
    DependencyDiscoveryConfigMessageString:
      type: string
      minLength: 0
      maxLength: 1024
    EffectivePolicyValues:
      description: Contains the effective resilience policy values for a service.
      type: object
      properties:
        availabilitySlo:
          $ref: "#/components/schemas/SloSource"
          description: The effective availability SLO value for the service.
        multiAzRto:
          $ref: "#/components/schemas/TargetSource"
          description: The effective multi-AZ RTO value for the service, in minutes.
        multiAzRpo:
          $ref: "#/components/schemas/TargetSource"
          description: The effective multi-AZ RPO value for the service, in minutes.
        multiAzDrApproach:
          $ref: "#/components/schemas/DisasterRecoverySource"
          description: The effective multi-AZ disaster recovery approach for the service.
        multiRegionRto:
          $ref: "#/components/schemas/TargetSource"
          description: The effective multi-Region RTO value for the service, in minutes.
        multiRegionRpo:
          $ref: "#/components/schemas/TargetSource"
          description: The effective multi-Region RPO value for the service, in minutes.
        multiRegionDrApproach:
          $ref: "#/components/schemas/DisasterRecoverySource"
          description: The effective multi-Region disaster recovery approach for the service.
        dataRecoveryTimeBetweenBackups:
          $ref: "#/components/schemas/TargetSource"
          description: The effective data recovery time between backups value for the service.
    SloSource:
      description: Contains the effective availability SLO value and its source.
