        createdAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the service function was created.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the service function was last updated.
      required:
        - serviceArn
        - serviceFunctionId
        - name
        - criticality
    EntityId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: \S{1,255}
    ServiceFunctionSource:
      type: string
      enum:
        - AI_GENERATED
        - USER
    ResourceList:
      type: array
      items:
        $ref: "#/components/schemas/String"
    CreateServiceFunctionResourcesResponse:
      type: object
      properties:
        serviceArn:
          $ref: "#/components/schemas/Arn"
        serviceFunctionId:
          $ref: "#/components/schemas/EntityId"
          description: The identifier of the service function.
        resources:
          $ref: "#/components/schemas/ResourceList"
          description: The list of resources that were associated.
    CreateSystemResponse:
      type: object
      properties:
