      required:
        - serviceFunction
    ServiceFunction:
      description: Represents a logical component of a service.
      type: object
      properties:
        serviceArn:
          $ref: "#/components/schemas/Arn"
        serviceFunctionId:
          $ref: "#/components/schemas/EntityId"
