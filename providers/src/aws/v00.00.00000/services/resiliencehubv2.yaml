      minLength: 0
      maxLength: 500
    ServiceFunctionCriticality:
      type: string
      enum:
        - PRIMARY
        - SUPPLEMENTAL
    CreateServiceFunctionResponse:
      type: object
      properties:
        serviceFunction:
          $ref: "#/components/schemas/ServiceFunction"
