        policyName:
          $ref: "#/components/schemas/EntityName"
        source:
          $ref: "#/components/schemas/PolicyValueSource"
          description: Indicates whether the value comes from the service's own account or a cross-account policy.
    Double:
      type: number
      format: double
    PolicyValueSource:
      type: string
      enum:
        - SELF
        - CROSS_ACCOUNT
    TargetSource:
      description: Contains an effective RTO or RPO value and its source.
      type: object
      properties:
        value:
          $ref: "#/components/schemas/Integer"
          description: The RTO or RPO value in minutes.
        policyName:
          $ref: "#/components/schemas/EntityName"
        source:
          $ref: "#/components/schemas/PolicyValueSource"
          description: Indicates whether the value comes from the service's own account or a cross-account policy.
    DisasterRecoverySource:
      description: Contains the effective disaster recovery approach value for a service.
      type: object
      properties:
        value:
          $ref: "#/components/schemas/String"
          description: The disaster recovery approach value.
        policyName:
          $ref: "#/components/schemas/EntityName"
        source:
          $ref: "#/components/schemas/PolicyValueSource"
          description: Indicates whether the value comes from the service's own account or a cross-account policy.
    Achievability:
      description: Describes the achievability status of a service's resilience targets based on the most recent assessment.
      type: object
      properties:
        availabilitySlo:
          $ref: "#/components/schemas/AchievabilityStatus"
          description: The achievability status of the availability SLO target for the service.
        multiAzRtoRpo:
          $ref: "#/components/schemas/AchievabilityStatus"
          description: The achievability status of the multi-AZ RTO and RPO targets for the service.
        multiRegionRtoRpo:
          $ref: "#/components/schemas/AchievabilityStatus"
          description: The achievability status of the multi-Region RTO and RPO targets for the service.
        dataRecoveryTimeBetweenBackups:
          $ref: "#/components/schemas/AchievabilityStatus"
          description: The achievability status of the data recovery time between backups for the service.
    AchievabilityStatus:
      type: string
      enum:
        - ACHIEVABLE
        - NOT_ACHIEVABLE
    AssessmentCost:
      description: Represents the cost of running a failure mode assessment.
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Double"
          description: The cost amount for the assessment.
        currency:
          $ref: "#/components/schemas/CostCurrency"
          description: The currency of the assessment cost.
    CostCurrency:
      type: string
      enum:
        - USD
    ResourceDiscoveryStatus:
      description: Contains the status of resource discovery for a service.
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResourceDiscoveryRunStatus"
          description: The current status of resource discovery.
        lastRunAt:
