          $ref: "#/components/schemas/TestRun"
          description: The requested test run.
      required:
        - testRun
    TestRun:
      description: Represents a single run of a test. Configuration is snapshotted from the test and service at the time the run is started.
      type: object
      properties:
        testRunId:
          $ref: "#/components/schemas/TestRunId"
          description: The unique identifier of the test run.
        testId:
          $ref: "#/components/schemas/TestId"
          description: The identifier of the test that was run.
        status:
          $ref: "#/components/schemas/TestRunStatus"
          description: The current status of the test run.
        serviceArn:
          $ref: "#/components/schemas/Arn"
          description: The ARN of the service the test run belongs to.
        startedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the test run started.
        endedAt:
          $ref: "#/components/schemas/Timestamp"
          description: The timestamp when the test run ended.
        experiments:
          $ref: "#/components/schemas/ExperimentDetailsList"
          description: The AWS Fault Injection Service (AWS FIS) experiments run as part of the test run.
        eventCount:
          $ref: "#/components/schemas/Integer"
          description: The number of events recorded for the test run. Use ListTestRunEvents to retrieve the details.
