        - STACK_NOT_FOUND
        - CLUSTER_NOT_FOUND
        - STATE_FILE_NOT_FOUND
        - ACCESS_DENIED
        - UNSUPPORTED_CLUSTER
        - INTERNAL_ERROR
    AssessmentStatus:
      type: string
      enum:
        - NOT_STARTED
        - PENDING
        - IN_PROGRESS
        - FAILED
        - SUCCESS
    Boolean:
      type: boolean
    OrganizationId:
