openapi: 3.0.0
info:
  version: "2026-02-17"
  title: AWS Resilience Hub V2
  description: AWS Resilience Hub V2
  x-serviceName: resiliencehub
  x-serviceAlias: resiliencehubv2
  x-protocol: rest-json
  x-apiVersion: "2026-02-17"
  x-endpointPrefix: resiliencehub
servers:
  - url: https://resiliencehub.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for resiliencehubv2
paths:
  /v2/create-assertion:
    post:
      operationId: CreateAssertion
      description: Creates a resilience assertion for a service.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                text:
                  $ref: "#/components/schemas/AssertionText"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - serviceArn
                - text
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAssertionResponse"
  /v2/create-input-source:
    post:
      operationId: CreateInputSource
      description: Creates an input source for a service.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                resourceConfiguration:
                  $ref: "#/components/schemas/ResourceConfiguration"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - serviceArn
                - resourceConfiguration
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInputSourceResponse"
  /v2/create-policy:
    post:
      operationId: CreatePolicy
      description: Creates a resilience policy that defines availability and disaster recovery requirements.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/EntityName"
                description:
                  $ref: "#/components/schemas/LongDescription"
                availabilitySlo:
                  $ref: "#/components/schemas/AvailabilitySlo"
                multiAz:
                  $ref: "#/components/schemas/MultiAzTargets"
                multiRegion:
                  $ref: "#/components/schemas/MultiRegionTargets"
                dataRecovery:
                  $ref: "#/components/schemas/DataRecoveryTargets"
                kmsKeyId:
                  $ref: "#/components/schemas/KmsKeyId"
                tags:
                  $ref: "#/components/schemas/TagMap"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - name
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePolicyResponse"
  /v2/create-report:
    post:
      operationId: CreateReport
      description: On-demand report creation. Idempotent — duplicate requests with same clientToken return existing result.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                reportType:
                  $ref: "#/components/schemas/ReportType"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - serviceArn
                - reportType
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReportResponse"
  /v2/create-service:
    post:
      operationId: CreateService
      description: Creates a service.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/EntityName"
                description:
                  $ref: "#/components/schemas/LongDescription"
                associatedSystems:
                  $ref: "#/components/schemas/AssociatedSystemList"
                policyArn:
                  $ref: "#/components/schemas/Arn"
                regions:
                  $ref: "#/components/schemas/RegionList"
                permissionModel:
                  $ref: "#/components/schemas/PermissionModel"
                dependencyDiscovery:
                  $ref: "#/components/schemas/DependencyDiscoveryInput"
                reportConfiguration:
                  $ref: "#/components/schemas/ServiceReportConfiguration"
                kmsKeyId:
                  $ref: "#/components/schemas/KmsKeyId"
                tags:
                  $ref: "#/components/schemas/TagMap"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - name
                - regions
                - permissionModel
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServiceResponse"
  /v2/create-service-function:
    post:
      operationId: CreateServiceFunction
      description: Creates a service function within a service.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/EntityLabel"
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                description:
                  $ref: "#/components/schemas/EntityDescription"
                criticality:
                  $ref: "#/components/schemas/ServiceFunctionCriticality"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - name
                - serviceArn
                - criticality
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServiceFunctionResponse"
  /v2/create-service-function-resources:
    post:
      operationId: CreateServiceFunctionResources
      description: Associates resources with a service function.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                serviceFunctionId:
                  $ref: "#/components/schemas/EntityId"
                resources:
                  $ref: "#/components/schemas/ResourceList"
              required:
                - serviceArn
                - serviceFunctionId
                - resources
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServiceFunctionResourcesResponse"
  /v2/create-system:
    post:
      operationId: CreateSystem
      description: Creates a system that represents a logical grouping of services.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/EntityName"
                description:
                  $ref: "#/components/schemas/EntityDescription"
                sharingEnabled:
                  $ref: "#/components/schemas/Boolean"
                kmsKeyId:
                  $ref: "#/components/schemas/KmsKeyId"
                tags:
                  $ref: "#/components/schemas/TagMap"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - name
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSystemResponse"
  /v2/create-test:
    post:
      operationId: CreateTest
      description: Creates a test for a service by configuring a test template. Each service has one test per template.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                testTemplateArn:
                  $ref: "#/components/schemas/ServiceOwnedArn"
                loggingConfiguration:
                  $ref: "#/components/schemas/LoggingConfiguration"
                stopConditions:
                  $ref: "#/components/schemas/StopConditionList"
                roleName:
                  $ref: "#/components/schemas/EntityName"
                parameters:
                  $ref: "#/components/schemas/TestParameters"
              required:
                - serviceArn
                - testTemplateArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTestResponse"
  /v2/create-user-journey:
    post:
      operationId: CreateUserJourney
      description: Creates a user journey within a system.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemArn:
                  $ref: "#/components/schemas/Arn"
                name:
                  $ref: "#/components/schemas/EntityLabel"
                description:
                  $ref: "#/components/schemas/EntityDescription"
                policyArn:
                  $ref: "#/components/schemas/Arn"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - systemArn
                - name
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserJourneyResponse"
  /v2/delete-assertion:
    post:
      operationId: DeleteAssertion
      description: Deletes a resilience assertion from a service.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                assertionId:
                  $ref: "#/components/schemas/Uuid"
              required:
                - serviceArn
                - assertionId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAssertionResponse"
  /v2/delete-input-source:
    post:
      operationId: DeleteInputSource
      description: Deletes an input source.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                inputSourceId:
                  $ref: "#/components/schemas/InputSourceId"
              required:
                - serviceArn
                - inputSourceId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteInputSourceResponse"
  /v2/delete-policy:
    post:
      operationId: DeletePolicy
      description: Deletes a resilience policy.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policyArn:
                  $ref: "#/components/schemas/Arn"
              required:
                - policyArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePolicyResponse"
  /v2/delete-service:
    post:
      operationId: DeleteService
      description: Deletes a service.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
              required:
                - serviceArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteServiceResponse"
  /v2/delete-function:
    post:
      operationId: DeleteServiceFunction
      description: Deletes a service function.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                serviceFunctionId:
                  $ref: "#/components/schemas/EntityId"
              required:
                - serviceArn
                - serviceFunctionId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteServiceFunctionResponse"
  /v2/delete-service-function-resources:
    post:
      operationId: DeleteServiceFunctionResources
      description: Removes resources from a service function.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                serviceFunctionId:
                  $ref: "#/components/schemas/EntityId"
                resources:
                  $ref: "#/components/schemas/ResourceList"
              required:
                - serviceArn
                - serviceFunctionId
                - resources
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteServiceFunctionResourcesResponse"
  /v2/delete-system:
    post:
      operationId: DeleteSystem
      description: Deletes a system.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemArn:
                  $ref: "#/components/schemas/Arn"
              required:
                - systemArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSystemResponse"
  /v2/delete-test:
    post:
      operationId: DeleteTest
      description: Deletes a test.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                testId:
                  $ref: "#/components/schemas/TestId"
                serviceArn:
                  $ref: "#/components/schemas/Arn"
              required:
                - testId
                - serviceArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTestResponse"
  /v2/delete-test-sources:
    post:
      operationId: DeleteTestSources
      description: Removes monitoring sources from a test. The operation is transactional and idempotent — removing a source that is not attached is a no-op.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                testId:
                  $ref: "#/components/schemas/TestId"
                serviceArn:
                  $ref: "#/components/schemas/Arn"
                testSources:
                  $ref: "#/components/schemas/TestSourceInputList"
              required:
                - testId
                - serviceArn
                - testSources
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTestSourcesResponse"
  /v2/delete-user-journey:
    post:
      operationId: DeleteUserJourney
      description: Deletes a user journey.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemArn:
                  $ref: "#/components/schemas/Arn"
                userJourneyId:
                  $ref: "#/components/schemas/UserJourneyId"
              required:
                - systemArn
                - userJourneyId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserJourneyResponse"
  /v2/get-failure-mode-finding:
    get:
      operationId: GetFailureModeFinding
      description: Retrieves a finding by findingId.
      parameters:
        - name: findingId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
          description: The unique identifier of the finding to retrieve.
        - name: serviceArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFailureModeFindingResponse"
  /v2/get-policy:
    get:
      operationId: GetPolicy
      description: Retrieves a resilience policy by ARN.
      parameters:
        - name: policyArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPolicyResponse"
  /v2/get-service:
    get:
      operationId: GetService
      description: Retrieves a service by ARN.
      parameters:
        - name: serviceArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetServiceResponse"
  /v2/get-system:
    get:
      operationId: GetSystem
      description: Retrieves a system by ARN.
      parameters:
        - name: systemArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSystemResponse"
  /v2/get-test:
    get:
      operationId: GetTest
      description: Retrieves a test by ID.
      parameters:
        - name: testId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TestId"
          description: The identifier of the test to retrieve.
        - name: serviceArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
          description: The ARN of the service the test belongs to.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTestResponse"
  /v2/get-test-run:
    get:
      operationId: GetTestRun
      description: Retrieves a test run by ID, including its status, results, and the configuration snapshotted when the run started.
      parameters:
        - name: testRunId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TestRunId"
          description: The identifier of the test run to retrieve.
        - name: serviceArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
          description: The ARN of the service the test run belongs to.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTestRunResponse"
  /v2/get-test-template:
    get:
      operationId: GetTestTemplate
      description: Retrieves a resilience test template by ARN, including the parameters it accepts and the fault actions it runs.
      parameters:
        - name: testTemplateArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ServiceOwnedArn"
          description: The ARN of the test template to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTestTemplateResponse"
  /v2/get-user-journey:
    get:
      operationId: GetUserJourney
      description: Retrieves a user journey.
      parameters:
        - name: systemArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
        - name: userJourneyId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UserJourneyId"
          description: The identifier of the user journey to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserJourneyResponse"
  /v2/import-app:
    post:
      operationId: ImportApp
      description: Imports a V1 app into the V2 resource model, creating a service with the same name.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                v1AppArn:
                  $ref: "#/components/schemas/Arn"
                policyArn:
                  $ref: "#/components/schemas/Arn"
                kmsKeyId:
                  $ref: "#/components/schemas/KmsKeyId"
                skipManuallyAddedResources:
                  $ref: "#/components/schemas/Boolean"
                associatedSystems:
                  $ref: "#/components/schemas/AssociatedSystemList"
                tags:
                  $ref: "#/components/schemas/TagMap"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - v1AppArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAppResponse"
  /v2/import-policy:
    post:
      operationId: ImportPolicy
      description: Imports a V1 policy into V2, mapping RTO/RPO values from V1 scenarios.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                v1PolicyArn:
                  $ref: "#/components/schemas/Arn"
                kmsKeyId:
                  $ref: "#/components/schemas/KmsKeyId"
                availabilitySlo:
                  $ref: "#/components/schemas/AvailabilitySlo"
                multiAzDisasterRecoveryApproach:
                  $ref: "#/components/schemas/MultiAzDisasterRecoveryApproach"
                multiRegionDisasterRecoveryApproach:
                  $ref: "#/components/schemas/MultiRegionDisasterRecoveryApproach"
                tags:
                  $ref: "#/components/schemas/TagMap"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - v1PolicyArn
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPolicyResponse"
  /v2/list-assertions:
    get:
      operationId: ListAssertions
      description: Lists resilience assertions for a service.
      parameters:
        - name: serviceArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssertionSource"
          description: Filter assertions by source type.
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResults"
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextToken"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAssertionsResponse"
  /v2/list-dependencies:
    get:
      operationId: ListDependencies
      description: Lists dependencies discovered for services.
      parameters:
        - name: serviceArn
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Arn"
        - name: queryRangeStartTime
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Timestamp"
          description: The start time for the dependency query range.
        - name: queryRangeEndTime
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Timestamp"
          description: The end time for the dependency query range.
        - name: queryRangeGranularity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/QueryGranularity"
          description: The granularity for the dependency query range.
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResults"
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextToken"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDependenciesResponse"
  /v2/list-failure-mode-assessments:
    get:
      operationId: ListFailureModeAssessments
      description: Lists failure mode assessments.
      parameters:
        - name: serviceArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
        - name: assessmentStatuses
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssessmentStatusList"
          description: Specifies the assessment statuses to include in the results.
        - name: startedAfter
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Timestamp"
          description: Specifies that only assessments that started at or after this timestamp appear in the results.
        - name: endedBefore
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Timestamp"
          description: Specifies that only assessments that ended at or before this timestamp appear in the results.
        - name: sortBy
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssessmentSortField"
          description: The field to use for sorting failure mode assessments.
        - name: sortOrder
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SortOrder"
          description: The sort order for results.
        - name: maxResults
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxResults"
        - name: nextToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NextToken"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFailureModeAssessmentsResponse"
  /v2/list-failure-mode-findings:
    get:
      operationId: ListFailureModeFindings
      description: List findings.
      parameters:
        - name: serviceArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Arn"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FindingSeverity"
          description: Filter findings by severity.
        - name: failureCategory
