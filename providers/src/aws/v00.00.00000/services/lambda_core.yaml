          - $ref: "#/components/x-stackQL-resources/network_connectors/methods/get_network_connector"
          - $ref: "#/components/x-stackQL-resources/network_connectors/methods/list_network_connectors"
        insert:
          - $ref: "#/components/x-stackQL-resources/network_connectors/methods/create_network_connector"
        update:
          - $ref: "#/components/x-stackQL-resources/network_connectors/methods/update_network_connector"
