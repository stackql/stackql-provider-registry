            pagination:
              requestToken:
                key: Marker
                location: query
              responseToken:
                key: $.NextMarker
                location: body
        delete_network_connector:
          operation:
            $ref: "#/paths/~12026-04-04~1network-connectors~1{identifier}/delete"
          response:
            openAPIDocKey: "202"
            mediaType: application/json
        get_network_connector:
          operation:
            $ref: "#/paths/~12026-04-04~1network-connectors~1{identifier}/get"
          response:
            openAPIDocKey: "200"
