openapi: 3.0.0
info:
  version: "2026-04-30"
  title: AWS Lambda Core
  description: AWS Lambda Core
  x-serviceName: lambda
  x-serviceAlias: lambda_core
  x-protocol: rest-json
  x-apiVersion: "2026-04-30"
  x-endpointPrefix: lambda
servers:
  - url: https://lambda.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for lambda-core
paths:
  /2026-04-04/network-connectors:
    post:
      operationId: CreateNetworkConnector
      description: Creates a network connector that enables Lambda compute resources to route outbound traffic through your Amazon VPC. The network connector provisions elastic network interfaces (ENIs) in the subnets you specify, providing a managed network path to private resources such as databases, caches, and internal APIs. This operation is asynchronous. The network connector starts in PENDING state while ENIs are provisioned in your VPC (provisioning typically takes up to 10 minutes). Use GetNetworkConnector to poll the connector state until it reaches ACTIVE. Once active, you can attach the connector to Lambda MicroVMs at run time using the egressNetworkConnectors parameter on RunMicroVm. This operation is idempotent when you provide a ClientToken — if you retry a request that completed successfully using the same client token, the operation returns the existing connector without creating a duplicate.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Name:
                  $ref: "#/components/schemas/NetworkConnectorName"
                Configuration:
                  $ref: "#/components/schemas/NetworkConnectorConfiguration"
                OperatorRole:
                  $ref: "#/components/schemas/NetworkConnectorRoleArn"
                ClientToken:
                  $ref: "#/components/schemas/ClientTokenString"
                Tags:
                  $ref: "#/components/schemas/NetworkConnectorTags"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateNetworkConnectorResponse"
    get:
      operationId: ListNetworkConnectors
      description: Returns a paginated list of network connectors in your account for the current Region. You can optionally filter results by connector state. Use the Marker parameter from a previous response to retrieve the next page of results. Each item in the response includes the connector ARN, name, ID, type, current state, and last modified timestamp. To retrieve full configuration details for a specific connector, use GetNetworkConnector.
      parameters:
        - name: State
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NetworkConnectorState"
          description: Optional filter to return only connectors in the specified state (for example, ACTIVE or FAILED).
        - name: Marker
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/String"
          description: The pagination token from a previous ListNetworkConnectors response. Use this value to retrieve the next page of results.
        - name: MaxItems
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaxHundredListItems"
          description: "The maximum number of connectors to return per page. Valid range: 1 to 100."
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNetworkConnectorsResponse"
  /2026-04-04/network-connectors/{identifier}:
    delete:
      operationId: DeleteNetworkConnector
      description: Initiates deletion of a network connector. The connector transitions to DELETING state while elastic network interfaces are cleaned up asynchronously. After deletion completes, subsequent calls to GetNetworkConnector return ResourceNotFoundException. This operation is idempotent — calling delete on a connector that is already deleting or has been deleted succeeds without error. You can delete connectors in ACTIVE or FAILED states. Before deleting a connector, ensure that no Lambda MicroVMs are using it, as they will lose VPC egress connectivity immediately.
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NetworkConnectorIdentifier"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteNetworkConnectorResponse"
    get:
      operationId: GetNetworkConnector
      description: Retrieves the current configuration, state, and metadata of a network connector. The Identifier parameter accepts the connector ID, name, or full ARN. Use this operation to poll connector state after creation or update, or to inspect the current VPC configuration and any failure reasons. The response includes the full connector configuration, current state, and — if the connector has been updated — the LastUpdateStatus and LastUpdateStatusReasonCode fields that indicate whether the most recent update succeeded or failed.
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NetworkConnectorIdentifier"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNetworkConnectorResponse"
    put:
      operationId: UpdateNetworkConnector
      description: Updates the VPC configuration or operator role of an existing network connector. You can modify the subnet IDs, security group IDs, network protocol, or operator role. The connector must be in ACTIVE state to accept updates. This operation is asynchronous. The connector remains in ACTIVE state during the update — existing workloads that reference this connector are not disrupted. Use GetNetworkConnector to monitor the LastUpdateStatus field, which transitions through InProgress to Successful or Failed. If the update fails, the LastUpdateStatusReasonCode field provides a specific error code for troubleshooting. This operation is idempotent when you provide a ClientToken.
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NetworkConnectorIdentifier"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                Configuration:
                  $ref: "#/components/schemas/NetworkConnectorConfiguration"
                OperatorRole:
                  $ref: "#/components/schemas/NetworkConnectorRoleArn"
                ClientToken:
                  $ref: "#/components/schemas/ClientTokenString"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateNetworkConnectorResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    NetworkConnectorName:
      type: string
      minLength: 1
      maxLength: 140
      pattern: (arn:aws[a-zA-Z-]*:lambda:(eusc-)?[a-z]{2}((-gov)|(-iso([a-z]?)))?-[a-z]+-\d{1}:\d{12}:network-connector:[a-zA-Z0-9-_]+(:[1-9]|[1-9][0-9]+)?)|[a-zA-Z0-9_-]{1,64}
    NetworkConnectorConfiguration:
      description: The network configuration for a network connector. Different connector types use different configuration shapes; specify the configuration that matches your connector type.
      type: object
      properties:
        VpcEgressConfiguration:
          $ref: "#/components/schemas/NetworkConnectorVpcEgressConfiguration"
          description: Configuration for a VPC egress network connector. Specifies the subnets, security groups, and network protocol for routing outbound traffic through your VPC.
    NetworkConnectorVpcEgressConfiguration:
      description: Configuration for a VPC egress network connector. Specifies the VPC subnets, security groups, network protocol, and associated Lambda compute resource types.
      type: object
      properties:
        SubnetIds:
          $ref: "#/components/schemas/NetworkConnectorSubnetIds"
          description: The IDs of the VPC subnets where Lambda provisions elastic network interfaces (ENIs). Specify 1 to 16 subnets. All subnets must be in the same VPC.
        SecurityGroupIds:
          $ref: "#/components/schemas/NetworkConnectorSecurityGroupIds"
          description: The IDs of the VPC security groups to attach to the ENIs. Specify 0 to 5 security groups. All security groups must be in the same VPC as the subnets.
        NetworkProtocol:
          $ref: "#/components/schemas/NetworkProtocol"
          description: The network protocol for the connector. Specify IPv4 for IPv4-only networking, or DualStack for both IPv4 and IPv6.
        AssociatedComputeResourceTypes:
          $ref: "#/components/schemas/AssociatedComputeResourceTypesList"
          description: The types of Lambda compute resources that can use this connector. Currently, only MicroVm is supported.
    NetworkConnectorSubnetIds:
      type: array
      items:
        $ref: "#/components/schemas/NetworkConnectorSubnetId"
    NetworkConnectorSubnetId:
      type: string
      minLength: 0
      maxLength: 1024
      pattern: subnet-[0-9a-z]*
    NetworkConnectorSecurityGroupIds:
      type: array
      items:
        $ref: "#/components/schemas/NetworkConnectorSecurityGroupId"
    NetworkConnectorSecurityGroupId:
      type: string
      minLength: 0
      maxLength: 1024
      pattern: sg-[0-9a-zA-Z]*
    NetworkProtocol:
      type: string
      enum:
        - IPv4
        - DualStack
    AssociatedComputeResourceTypesList:
      type: array
      items:
        $ref: "#/components/schemas/ComputeResourceType"
    ComputeResourceType:
      type: string
      enum:
        - MicroVm
    NetworkConnectorRoleArn:
      type: string
      minLength: 0
      maxLength: 10000
      pattern: arn:(aws[a-zA-Z-]*)?:iam::\d{12}:role/?[a-zA-Z_0-9+=,.@\-_/]+
    ClientTokenString:
      type: string
      minLength: 1
      maxLength: 64
    NetworkConnectorTags:
      type: object
      properties: {}
    CreateNetworkConnectorResponse:
      type: object
      properties:
        Arn:
          $ref: "#/components/schemas/NetworkConnectorArn"
          description: The Amazon Resource Name (ARN) of the network connector.
        Name:
          $ref: "#/components/schemas/NetworkConnectorName"
          description: The name of the network connector.
        Id:
          $ref: "#/components/schemas/NetworkConnectorId"
        Configuration:
          $ref: "#/components/schemas/NetworkConnectorConfiguration"
          description: The network configuration of the connector, including VPC subnets and security groups.
        OperatorRole:
          $ref: "#/components/schemas/NetworkConnectorRoleArn"
          description: The ARN of the IAM role that Lambda uses to manage the underlying ENI resources for this connector.
        State:
          $ref: "#/components/schemas/NetworkConnectorState"
          description: The current state of the network connector.
      required:
        - Arn
        - Name
        - Id
    NetworkConnectorArn:
      type: string
      minLength: 1
      maxLength: 140
      pattern: (arn:aws[a-zA-Z-]*:lambda:(eusc-)?[a-z]{2}((-gov)|(-iso([a-z]?)))?-[a-z]+-\d{1}:\d{12}:network-connector:[a-zA-Z0-9-_]+(:[1-9]|[1-9][0-9]+)?)
    NetworkConnectorId:
      description: The unique identifier for a network connector, assigned by the service at creation time
      type: string
      minLength: 1
      maxLength: 140
    NetworkConnectorState:
      type: string
      enum:
        - PENDING
        - ACTIVE
        - INACTIVE
        - FAILED
        - DELETING
        - DELETE_FAILED
    NetworkConnectorIdentifier:
      description: A flexible identifier that accepts a network connector ID, name, or ARN
      type: string
      minLength: 1
      maxLength: 140
    DeleteNetworkConnectorResponse:
      type: object
      properties:
        Arn:
          $ref: "#/components/schemas/NetworkConnectorArn"
          description: The Amazon Resource Name (ARN) of the network connector.
        Name:
          $ref: "#/components/schemas/NetworkConnectorName"
          description: The name of the network connector.
        Id:
          $ref: "#/components/schemas/NetworkConnectorId"
        Configuration:
          $ref: "#/components/schemas/NetworkConnectorConfiguration"
          description: The network configuration of the connector, including VPC subnets and security groups.
        OperatorRole:
          $ref: "#/components/schemas/NetworkConnectorRoleArn"
          description: The ARN of the IAM role that Lambda uses to manage the underlying ENI resources for this connector.
        State:
          $ref: "#/components/schemas/NetworkConnectorState"
          description: The current state of the network connector. The State field is typically DELETING after this call.
      required:
        - Arn
        - Name
        - Id
    GetNetworkConnectorResponse:
      type: object
      properties:
        Arn:
          $ref: "#/components/schemas/NetworkConnectorArn"
          description: The Amazon Resource Name (ARN) of the network connector.
        Name:
          $ref: "#/components/schemas/NetworkConnectorName"
          description: The name of the network connector.
        Id:
          $ref: "#/components/schemas/NetworkConnectorId"
        Version:
          $ref: "#/components/schemas/NetworkConnectorVersion"
          description: The version number of the connector configuration, incremented on each update.
        Configuration:
          $ref: "#/components/schemas/NetworkConnectorConfiguration"
          description: The network configuration of the connector, including VPC subnets and security groups.
        OperatorRole:
          $ref: "#/components/schemas/NetworkConnectorRoleArn"
          description: The ARN of the IAM role that Lambda uses to manage the underlying ENI resources for this connector.
        State:
          $ref: "#/components/schemas/NetworkConnectorState"
          description: The current state of the network connector.
        StateReason:
          $ref: "#/components/schemas/String"
          description: A human-readable explanation of the current state, populated when the state is FAILED or DELETE_FAILED.
        StateReasonCode:
          $ref: "#/components/schemas/NetworkConnectorStateReasonCode"
          description: A machine-readable code indicating the reason for the current state. Use this for programmatic error handling.
        LastUpdateStatus:
          $ref: "#/components/schemas/NetworkConnectorLastUpdateStatus"
          description: The status of the most recent update operation (Successful, Failed, or InProgress).
        LastUpdateStatusReason:
          $ref: "#/components/schemas/NetworkConnectorLastUpdateStatusReason"
          description: A human-readable explanation of the last update status.
        LastUpdateStatusReasonCode:
          $ref: "#/components/schemas/NetworkConnectorLastUpdateStatusReasonCode"
          description: A machine-readable code indicating the reason for the last update status. Use this for programmatic error handling.
        LastModified:
          $ref: "#/components/schemas/CoreTimestamp"
          description: The date and time when the connector configuration was last modified.
      required:
        - Arn
        - Name
        - Id
    NetworkConnectorVersion:
      type: integer
      format: int64
      minimum: 0
    String:
      type: string
    NetworkConnectorStateReasonCode:
      type: string
      enum:
        - DisallowedByVpcEncryptionControl
        - Ec2RequestLimitExceeded
        - InsufficientRolePermissions
        - InternalError
        - InvalidSecurityGroup
        - InvalidSubnet
        - SubnetOutOfIPAddresses
    NetworkConnectorLastUpdateStatus:
      type: string
      enum:
        - Successful
        - Failed
        - InProgress
    NetworkConnectorLastUpdateStatusReason:
      type: string
    NetworkConnectorLastUpdateStatusReasonCode:
      type: string
      enum:
        - DisallowedByVpcEncryptionControl
        - Ec2RequestLimitExceeded
        - InsufficientRolePermissions
        - InternalError
        - InvalidSecurityGroup
        - InvalidSubnet
        - SubnetOutOfIPAddresses
    CoreTimestamp:
      type: string
      format: date-time
    MaxHundredListItems:
      type: integer
      minimum: 1
      maximum: 100
    ListNetworkConnectorsResponse:
      type: object
      properties:
        NetworkConnectors:
          $ref: "#/components/schemas/NetworkConnectorsList"
          description: A list of network connector summaries for the current page of results.
        NextMarker:
          $ref: "#/components/schemas/String"
          description: The pagination token to include in a subsequent request to retrieve the next page. This value is null when there are no more results.
      required:
        - NetworkConnectors
    NetworkConnectorsList:
      type: array
      items:
        $ref: "#/components/schemas/NetworkConnectorSummary"
    NetworkConnectorSummary:
      description: Summary information about a network connector returned by ListNetworkConnectors. Contains identifying fields and current state. To retrieve full configuration details, use GetNetworkConnector.
      type: object
      properties:
        Arn:
          $ref: "#/components/schemas/NetworkConnectorArn"
          description: The ARN of the network connector.
        Name:
          $ref: "#/components/schemas/NetworkConnectorName"
          description: The name of the network connector.
        Id:
          $ref: "#/components/schemas/NetworkConnectorId"
        Type:
          $ref: "#/components/schemas/NetworkConnectorType"
          description: The type of the network connector (VPC_EGRESS).
        State:
          $ref: "#/components/schemas/NetworkConnectorState"
          description: The current state of the network connector.
        LastModified:
          $ref: "#/components/schemas/CoreTimestamp"
          description: The date and time when the connector was last modified.
      required:
        - Arn
        - Name
        - Id
        - Type
    NetworkConnectorType:
      type: string
      enum:
        - VPC_EGRESS
    UpdateNetworkConnectorResponse:
      type: object
      properties:
        Arn:
          $ref: "#/components/schemas/NetworkConnectorArn"
          description: The Amazon Resource Name (ARN) of the network connector.
        Name:
          $ref: "#/components/schemas/NetworkConnectorName"
          description: The name of the network connector.
        Id:
          $ref: "#/components/schemas/NetworkConnectorId"
        OperatorRole:
          $ref: "#/components/schemas/NetworkConnectorRoleArn"
          description: The ARN of the IAM role that Lambda uses to manage the underlying ENI resources for this connector.
        Configuration:
          $ref: "#/components/schemas/NetworkConnectorConfiguration"
          description: The network configuration of the connector, including VPC subnets and security groups.
        State:
          $ref: "#/components/schemas/NetworkConnectorState"
          description: The current state of the network connector.
        LastUpdateStatus:
          $ref: "#/components/schemas/NetworkConnectorLastUpdateStatus"
          description: The status of this update operation (typically InProgress immediately after the call).
        LastUpdateStatusReason:
          $ref: "#/components/schemas/NetworkConnectorLastUpdateStatusReason"
          description: A human-readable explanation of the update status.
        LastModified:
          $ref: "#/components/schemas/CoreTimestamp"
          description: The timestamp of this update.
      required:
        - Arn
        - Name
        - Id
