openapi: 3.0.0
info:
  version: "2018-05-10"
  title: Account Access
  description: Account Access
  x-serviceName: account-access
  x-serviceAlias: account_access
  x-protocol: rest-json
  x-apiVersion: "2018-05-10"
  x-endpointPrefix: account-access
servers:
  - url: https://account-access.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for account-access
paths:
  /applications:
    post:
      operationId: CreateApplication
      description: Creates an account access manager instance and its Amazon Web Services account access application in the associated IAM Identity Center instance. This operation is idempotent; calling it multiple times with the same parameters returns the existing application.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identitySource:
                  $ref: "#/components/schemas/IdentitySource"
                tags:
                  $ref: "#/components/schemas/TagsMap"
              required:
                - identitySource
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApplicationResponse"
  /entitlements:
    post:
      operationId: CreateEntitlement
      description: Creates an entitlement (assignment) in account access manager. An entitlement (assignment) grants a principal (IAM Identity Center user or group) permission to assume a specified IAM role in an Amazon Web Services account. This operation is idempotent.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicationArn:
                  $ref: "#/components/schemas/ApplicationArn"
                entitlement:
                  $ref: "#/components/schemas/Entitlement"
              required:
                - applicationArn
                - entitlement
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEntitlementResponse"
  /applications/{application_arn}:
    delete:
      operationId: DeleteApplication
      description: Deletes an account access manager application. This operation is idempotent; deleting an application that has already been deleted does not return an error.
      parameters:
        - name: application_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationArn"
          description: Specifies the ARN of the application to delete.
      responses:
        "204":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteApplicationResponse"
    get:
      operationId: GetApplication
      description: Retrieves details about an account access manager application, including its status, identity source, and tags.
      parameters:
        - name: application_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationArn"
          description: Specifies the ARN of the application to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetApplicationResponse"
  /entitlements/{entitlement_id}:
    delete:
      operationId: DeleteEntitlement
      description: Deletes an entitlement from an account access manager application. This operation is idempotent; deleting an entitlement that has already been deleted does not return an error.
      parameters:
        - name: applicationArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationArn"
          description: Specifies the ARN of the application that the entitlement belongs to.
        - name: entitlement_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/String"
          description: Specifies the unique identifier of the entitlement to delete.
      responses:
        "204":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEntitlementResponse"
    get:
      operationId: GetEntitlement
      description: Retrieves details about a specific entitlement for an account access manager application, including the principal, IAM role, and target account.
      parameters:
        - name: applicationArn
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationArn"
          description: Specifies the ARN of the application that the entitlement belongs to.
        - name: entitlement_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/String"
          description: Specifies the unique identifier of the entitlement to retrieve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEntitlementResponse"
  /applications-list:
    post:
      operationId: ListApplications
      description: Lists the account access manager applications in your account. Use pagination to ensure that the operation returns quickly and successfully.
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                maxResults:
                  $ref: "#/components/schemas/ListApplicationsRequestMaxResultsInteger"
                nextToken:
                  $ref: "#/components/schemas/String"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApplicationsResponse"
  /entitlements-list:
    post:
      operationId: ListEntitlements
      description: Lists the entitlements for a specified account access manager application. You can filter results by principal, IAM role, or account. Use pagination to ensure that the operation returns quickly and successfully.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicationArn:
                  $ref: "#/components/schemas/ApplicationArn"
                filter:
                  $ref: "#/components/schemas/EntitlementFilter"
                nextToken:
                  $ref: "#/components/schemas/String"
                maxResults:
                  $ref: "#/components/schemas/ListEntitlementsRequestMaxResultsInteger"
              required:
                - applicationArn
                - filter
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEntitlementsResponse"
  /tags/{resource_arn}:
    get:
      operationId: ListTagsForResource
      description: Lists the tags associated with an account access manager resource.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationArn"
          description: Specifies the ARN of the resource to list tags for.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTagsForResourceResponse"
    post:
      operationId: TagResource
      description: Adds tags to an account access manager resource.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationArn"
          description: Specifies the ARN of the resource to add tags to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  $ref: "#/components/schemas/TagsMap"
              required:
                - tags
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResourceResponse"
    delete:
      operationId: UntagResource
      description: Removes tags from an account access manager resource.
      parameters:
        - name: resource_arn
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationArn"
          description: Specifies the ARN of the resource to remove tags from.
        - name: tagKeys
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TagKeys"
          description: Specifies the tag keys to remove from the resource.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UntagResourceResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    IdentitySource:
      description: Specifies the identity source for an account access manager application.
      type: object
      properties:
        identityCenter:
          $ref: "#/components/schemas/IdentityCenter"
          description: The IAM Identity Center instance to use as the identity source.
    IdentityCenter:
      description: Specifies the IAM Identity Center instance to use as the identity source for an application.
      type: object
      properties:
        instanceArn:
          $ref: "#/components/schemas/IdentityCenterInstanceArn"
          description: The ARN of the IAM Identity Center instance.
      required:
        - instanceArn
    IdentityCenterInstanceArn:
      type: string
      minLength: 10
      maxLength: 1224
      pattern: arn:[a-z0-9-]+:sso:::instance/(sso)?ins-[a-zA-Z0-9-.]{16}
    TagsMap:
      type: object
      properties: {}
    CreateApplicationResponse:
      type: object
      properties:
        applicationArn:
          $ref: "#/components/schemas/ApplicationArn"
          description: The Amazon Resource Name (ARN) of the created application.
      required:
        - applicationArn
    ApplicationArn:
      type: string
      minLength: 49
      maxLength: 2048
      pattern: arn:[a-z0-9-]+:account-access:[a-z0-9]+(-[a-z0-9]+)*:[0-9]{12}:application/[a-zA-Z0-9-]+
    Entitlement:
      description: Specifies the entitlement configuration for an account access manager application, defining which principal can assume which IAM role.
      type: object
      properties:
        principalRole:
          $ref: "#/components/schemas/PrincipalRoleEntitlement"
          description: The principal-to-role mapping for the entitlement.
    PrincipalRoleEntitlement:
      description: Specifies a principal-to-role entitlement that grants an IAM Identity Center principal permission to assume an IAM role.
      type: object
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
          description: The principal (user or group) that is granted access to assume the IAM role.
        roleArn:
          $ref: "#/components/schemas/RoleArn"
          description: The ARN of the IAM role that the principal can assume.
      required:
        - principal
        - roleArn
    Principal:
      description: Identifies a principal (user or group) that can be granted entitlements.
      type: object
      properties:
        identityCenter:
          $ref: "#/components/schemas/IdentityCenterPrincipal"
          description: The IAM Identity Center principal (user or group).
    IdentityCenterPrincipal:
      description: Identifies a user or group from IAM Identity Center.
      type: object
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
          description: The unique identifier of a user in IAM Identity Center.
        groupId:
          $ref: "#/components/schemas/GroupId"
          description: The unique identifier of a group in IAM Identity Center.
    UserId:
      type: string
      minLength: 1
      maxLength: 47
      pattern: ([0-9a-f]{10}-|)[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}
    GroupId:
      type: string
      minLength: 1
      maxLength: 47
      pattern: ([0-9a-f]{10}-|)[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}
    RoleArn:
      type: string
      pattern: arn:[a-z0-9-]+:iam::[0-9]{12}:role/([a-zA-Z0-9+=,.@_-]+/)*[a-zA-Z0-9+=,.@_-]+
    CreateEntitlementResponse:
      type: object
      properties:
        entitlementId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the created entitlement.
      required:
        - entitlementId
    String:
      type: string
    DeleteApplicationResponse:
      type: object
    DeleteEntitlementResponse:
      type: object
    GetApplicationResponse:
      type: object
      properties:
        identitySource:
          $ref: "#/components/schemas/IdentitySourceDetails"
          description: The identity source details for the application, including the IAM Identity Center instance configuration.
        status:
          $ref: "#/components/schemas/Status"
          description: The current status of the application.
        tenantId:
          $ref: "#/components/schemas/String"
          description: The tenant identifier associated with the application.
        createdAt:
          $ref: "#/components/schemas/DateTime"
          description: The date and time when the application was created.
        updatedAt:
          $ref: "#/components/schemas/DateTime"
          description: The date and time when the application was last updated.
        tags:
          type: object
          properties: {}
          description: The tags associated with the application.
        error:
          $ref: "#/components/schemas/ErrorDetails"
          description: The error details if the application is in a failed state.
      required:
        - identitySource
        - status
        - createdAt
        - updatedAt
    IdentitySourceDetails:
      description: Contains detailed information about the identity source for an application.
      type: object
      properties:
        identityCenter:
          $ref: "#/components/schemas/IdentityCenterDetails"
          description: The IAM Identity Center configuration details for the identity source.
    IdentityCenterDetails:
      description: Contains detailed information about the IAM Identity Center configuration for an application.
      type: object
      properties:
        instanceArn:
          $ref: "#/components/schemas/IdentityCenterInstanceArn"
          description: The ARN of the IAM Identity Center instance.
        applicationArn:
          $ref: "#/components/schemas/IdentityCenterApplicationArn"
          description: The ARN of the IAM Identity Center application created for this account access manager application.
      required:
        - instanceArn
    IdentityCenterApplicationArn:
      type: string
      minLength: 10
      maxLength: 1224
      pattern: arn:[a-z0-9-]+:sso::[0-9]{12}:application/(sso)?ins-[a-zA-Z0-9-.]{16}/apl-[a-zA-Z0-9]{16}
    Status:
      type: string
      enum:
        - CREATE_IN_PROGRESS
        - ACTIVE
        - DELETE_IN_PROGRESS
        - CREATE_FAILED
        - DELETE_FAILED
    DateTime:
      type: string
      format: date-time
    ErrorDetails:
      description: Contains information about an error that occurred during application processing.
      type: object
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
          description: The error code that identifies the type of error.
        message:
          $ref: "#/components/schemas/String"
          description: A human-readable message that describes the error.
      required:
        - code
        - message
    ErrorCode:
      type: string
      enum:
        - AUTHORIZATION_ERROR
        - RESOURCE_NOT_FOUND_ERROR
        - SERVICE_QUOTA_EXCEEDED_ERROR
        - INTERNAL_SERVICE_ERROR
    GetEntitlementResponse:
      type: object
      properties:
        applicationArn:
          $ref: "#/components/schemas/ApplicationArn"
          description: The ARN of the application that the entitlement belongs to.
        entitlementId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the entitlement.
        entitlement:
          $ref: "#/components/schemas/EntitlementDetails"
          description: The entitlement details, including the principal, IAM role, and target account.
        createdAt:
          $ref: "#/components/schemas/DateTime"
          description: The date and time when the entitlement was created.
      required:
        - applicationArn
        - entitlementId
        - entitlement
        - createdAt
    EntitlementDetails:
      description: Contains detailed information about an entitlement, including the principal, IAM role, and target account.
      type: object
      properties:
        principalRole:
          $ref: "#/components/schemas/PrincipalRoleEntitlementDetails"
          description: The principal-to-role mapping details for the entitlement, including the target account.
    PrincipalRoleEntitlementDetails:
      description: Contains detailed information about a principal-to-role entitlement, including the target account.
      type: object
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
          description: The principal (user or group) that is granted access to assume the IAM role.
        roleArn:
          $ref: "#/components/schemas/RoleArn"
          description: The ARN of the IAM role that the principal can assume.
        account:
          $ref: "#/components/schemas/Account"
          description: The 12-digit Amazon Web Services account ID where the IAM role resides.
        accountName:
          $ref: "#/components/schemas/String"
          description: The friendly name of the Amazon Web Services account where the IAM role resides.
      required:
        - principal
        - roleArn
        - account
    Account:
      type: string
      minLength: 12
      maxLength: 12
      pattern: "[0-9]{12}"
    ListApplicationsRequestMaxResultsInteger:
      type: integer
      minimum: 1
      maximum: 100
    ListApplicationsResponse:
      type: object
      properties:
        applications:
          $ref: "#/components/schemas/ApplicationList"
          description: The list of applications.
        nextToken:
          $ref: "#/components/schemas/String"
          description: The pagination token to use in a subsequent request to retrieve the next set of results. This value is null when there are no more results to return.
      required:
        - applications
    ApplicationList:
      type: array
      items:
        $ref: "#/components/schemas/ApplicationSummary"
    ApplicationSummary:
      description: Contains summary information about an account access manager application.
      type: object
      properties:
        applicationArn:
          $ref: "#/components/schemas/ApplicationArn"
          description: The ARN of the application.
        tenantId:
          $ref: "#/components/schemas/String"
          description: The tenant identifier associated with the application.
        createdAt:
          $ref: "#/components/schemas/DateTime"
          description: The date and time when the application was created.
        updatedAt:
          $ref: "#/components/schemas/DateTime"
          description: The date and time when the application was last updated.
      required:
        - applicationArn
        - createdAt
        - updatedAt
    EntitlementFilter:
      description: Specifies filter criteria for listing entitlements.
      type: object
      properties:
        principalRole:
          $ref: "#/components/schemas/PrincipalRoleEntitlementFilter"
          description: The principal-to-role filter criteria for narrowing entitlement results.
    PrincipalRoleEntitlementFilter:
      description: Specifies filter criteria for principal-to-role entitlements. All specified criteria must match for an entitlement to be returned.
      type: object
      properties:
        principal:
          $ref: "#/components/schemas/PrincipalFilter"
          description: The principal to filter entitlements by.
        roleArn:
          $ref: "#/components/schemas/RoleArn"
          description: The IAM role ARN to filter entitlements by.
        account:
          $ref: "#/components/schemas/Account"
          description: The 12-digit Amazon Web Services account ID to filter entitlements by.
    PrincipalFilter:
      description: Specifies filter criteria for a principal.
      type: object
      properties:
        identityCenter:
          $ref: "#/components/schemas/IdentityCenterPrincipalFilter"
          description: The IAM Identity Center principal filter criteria.
    IdentityCenterPrincipalFilter:
      description: Specifies filter criteria for an IAM Identity Center principal.
      type: object
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
          description: The unique identifier of a user in IAM Identity Center to filter by.
        groupId:
          $ref: "#/components/schemas/GroupId"
          description: The unique identifier of a group in IAM Identity Center to filter by.
    ListEntitlementsRequestMaxResultsInteger:
      type: integer
      minimum: 1
      maximum: 100
    ListEntitlementsResponse:
      type: object
      properties:
        entitlements:
          $ref: "#/components/schemas/EntitlementsList"
          description: The list of entitlements for the specified application.
        nextToken:
          $ref: "#/components/schemas/String"
          description: The pagination token to use in a subsequent request to retrieve the next set of results. This value is null when there are no more results to return.
      required:
        - entitlements
    EntitlementsList:
      type: array
      items:
        $ref: "#/components/schemas/EntitlementsListMember"
    EntitlementsListMember:
      description: Contains information about an entitlement in a list result.
      type: object
      properties:
        entitlementId:
          $ref: "#/components/schemas/String"
          description: The unique identifier of the entitlement.
        entitlement:
          $ref: "#/components/schemas/EntitlementSummary"
          description: The summary information for the entitlement.
        createdAt:
          $ref: "#/components/schemas/DateTime"
          description: The date and time when the entitlement was created.
      required:
        - entitlementId
        - entitlement
        - createdAt
    EntitlementSummary:
      description: Contains summary information about an entitlement.
      type: object
      properties:
        principalRole:
          $ref: "#/components/schemas/PrincipalRoleEntitlementSummary"
          description: The principal-to-role mapping summary for the entitlement.
    PrincipalRoleEntitlementSummary:
      description: Contains summary information about a principal-to-role entitlement.
      type: object
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
          description: The principal (user or group) that is granted access to assume the IAM role.
        roleArn:
          $ref: "#/components/schemas/RoleArn"
          description: The ARN of the IAM role that the principal can assume.
        account:
          $ref: "#/components/schemas/Account"
          description: The 12-digit Amazon Web Services account ID where the IAM role resides.
        accountName:
          $ref: "#/components/schemas/String"
          description: The friendly name of the Amazon Web Services account where the IAM role resides.
      required:
        - principal
        - roleArn
        - account
    ListTagsForResourceResponse:
      type: object
      properties:
        tags:
          type: object
          properties: {}
          description: The tags associated with the resource.
    TagResourceResponse:
      type: object
    TagKeys:
      type: array
      items:
        $ref: "#/components/schemas/String"
    UntagResourceResponse:
      type: object
  x-stackQL-resources:
    applications:
      id: aws.account_access.applications
      name: applications
      title: applications
      methods:
        create_application:
          operation:
            $ref: "#/paths/~1applications/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
          request:
            nativeCasing: pascal
          config:
            requestBodyTranslate:
              algorithm: naive
        delete_application:
          operation:
            $ref: "#/paths/~1applications~1{application_arn}/delete"
          response:
            openAPIDocKey: "204"
            mediaType: application/json
        get_application:
          operation:
            $ref: "#/paths/~1applications~1{application_arn}/get"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
        list_applications:
          operation:
            $ref: "#/paths/~1applications-list/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
            objectKey: $.applications
          request:
            nativeCasing: pascal
          config:
            pagination:
              requestToken:
                key: nextToken
                location: body
              responseToken:
                key: $.nextToken
                location: body
            requestBodyTranslate:
              algorithm: naive
      sqlVerbs:
        select:
          - $ref: "#/components/x-stackQL-resources/applications/methods/get_application"
          - $ref: "#/components/x-stackQL-resources/applications/methods/list_applications"
        insert:
          - $ref: "#/components/x-stackQL-resources/applications/methods/create_application"
        update: []
        delete:
          - $ref: "#/components/x-stackQL-resources/applications/methods/delete_application"
    entitlements:
      id: aws.account_access.entitlements
      name: entitlements
      title: entitlements
      methods:
        create_entitlement:
          operation:
            $ref: "#/paths/~1entitlements/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
          request:
            nativeCasing: pascal
          config:
            requestBodyTranslate:
              algorithm: naive
        delete_entitlement:
          operation:
            $ref: "#/paths/~1entitlements~1{entitlement_id}/delete"
          response:
            openAPIDocKey: "204"
            mediaType: application/json
          request:
            nativeCasing: pascal
        get_entitlement:
          operation:
            $ref: "#/paths/~1entitlements~1{entitlement_id}/get"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
          request:
            nativeCasing: pascal
        list_entitlements:
          operation:
            $ref: "#/paths/~1entitlements-list/post"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
            objectKey: $.entitlements
          request:
            nativeCasing: pascal
          config:
            pagination:
              requestToken:
                key: nextToken
                location: body
              responseToken:
                key: $.nextToken
                location: body
            requestBodyTranslate:
              algorithm: naive
      sqlVerbs:
        select:
          - $ref: "#/components/x-stackQL-resources/entitlements/methods/get_entitlement"
          - $ref: "#/components/x-stackQL-resources/entitlements/methods/list_entitlements"
        insert:
          - $ref: "#/components/x-stackQL-resources/entitlements/methods/create_entitlement"
        update: []
        delete:
          - $ref: "#/components/x-stackQL-resources/entitlements/methods/delete_entitlement"
    tags:
      id: aws.account_access.tags
      name: tags
      title: tags
      methods:
        list_tags_for_resource:
          operation:
            $ref: "#/paths/~1tags~1{resource_arn}/get"
          response:
            openAPIDocKey: "200"
            mediaType: application/json
