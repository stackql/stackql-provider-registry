openapi: 3.0.0
info:
  version: "2023-01-01"
  title: AWS Sign-In Service
  description: AWS Sign-In Service
  x-serviceName: signin
  x-serviceAlias: signin
  x-protocol: rest-json
  x-apiVersion: "2023-01-01"
  x-endpointPrefix: signin
servers:
  - url: https://signin.{region}.amazonaws.com
    variables:
      region:
        default: us-east-1
        description: AWS region
    description: Regional endpoint for signin
paths:
  /v1/token:
    post:
      operationId: CreateOAuth2Token
      description: "CreateOAuth2Token API Path: /v1/token Request Method: POST Content-Type: application/json or application/x-www-form-urlencoded This API implements OAuth 2.0 flows for AWS Sign-In CLI clients, supporting both: Authorization code redemption (grant_type=authorization_code) - NOT idempotent Token refresh (grant_type=refresh_token) - Idempotent within token validity window The operation behavior is determined by the grant_type parameter in the request body: Authorization Code Flow (NOT Idempotent): JSON or form-encoded body with client_id, grant_type=authorization_code, code, redirect_uri, code_verifier Returns access_token, token_type, expires_in, refresh_token, and id_token Each authorization code can only be used ONCE for security (prevents replay attacks) Token Refresh Flow (Idempotent): JSON or form-encoded body with client_id, grant_type=refresh_token, refresh_token Returns access_token, token_type, expires_in, and refresh_token (no id_token) Multiple calls with same refresh_token return consistent results within validity window Authentication and authorization: Confidential clients: sigv4 signing required with signin:ExchangeToken permissions CLI clients (public): authn/authz skipped based on client_id & grant_type Note: This operation cannot be marked as @idempotent because it handles both idempotent (token refresh) and non-idempotent (auth code redemption) flows in a single endpoint."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenInput:
                  $ref: "#/components/schemas/CreateOAuth2TokenRequestBody"
              required:
                - tokenInput
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOAuth2TokenResponse"
  /v1/token?x-amz-client-auth-method=iam:
    post:
      operationId: CreateOAuth2TokenWithIAM
      description: Grants permission to exchange client credentials for an OAuth 2.0 access token scoped to a resource that can be used to access AWS services from applications
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grantType:
                  $ref: "#/components/schemas/ClientCredentialsGrantType"
                resource:
                  $ref: "#/components/schemas/CreateOAuth2TokenWithIAMRequestResourceString"
              required:
                - grantType
                - resource
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOAuth2TokenWithIAMResponse"
  /delete-console-authorization-configuration:
    post:
      operationId: DeleteConsoleAuthorizationConfiguration
      description: Delete console authorization configuration with automatic scope detection
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetId:
                  $ref: "#/components/schemas/TargetId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteConsoleAuthorizationConfigurationOutput"
  /delete-resource-permission-statement:
    post:
      operationId: DeleteResourcePermissionStatement
      description: Remove a permission statement from the account's SignIn resource-based policy
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                statementId:
                  $ref: "#/components/schemas/StatementId"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
              required:
                - statementId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResourcePermissionStatementOutput"
  /get-console-authorization-configuration:
    post:
      operationId: GetConsoleAuthorizationConfiguration
      description: Get console authorization configuration with automatic scope detection
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetId:
                  $ref: "#/components/schemas/TargetId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetConsoleAuthorizationConfigurationOutput"
  /get-resource-policy:
    post:
      operationId: GetResourcePolicy
      description: Retrieve the account's consolidated SignIn resource-based policy
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetResourcePolicyOutput"
  /v1/introspect?x-amz-client-auth-method=iam:
    post:
      operationId: IntrospectOAuth2TokenWithIAM
      description: 'Grants permission to inspect the metadata and state of an OAuth 2.0 access token or refresh token Implements RFC 7662 OAuth 2.0 Token Introspection over a SigV4-authenticated endpoint. Inspects the metadata of an access_token or refresh_token issued by AWS Sign-In and returns the claims associated with it. Inactive token semantics (RFC 7662 §2.2): when the supplied token is unknown, expired, revoked, malformed, or owned by a different account, the response body is exactly { "active": false } with all other claims omitted.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  $ref: "#/components/schemas/IntrospectionToken"
                tokenTypeHint:
                  $ref: "#/components/schemas/TokenTypeHint"
              required:
                - token
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectOAuth2TokenWithIAMResponse"
  /list-resource-permission-statements:
    post:
      operationId: ListResourcePermissionStatements
      description: Retrieve all permission statements in the account's SignIn resource-based policy
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                maxResults:
                  $ref: "#/components/schemas/ConsolePermissionMaxResults"
                nextToken:
                  $ref: "#/components/schemas/NextToken"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResourcePermissionStatementsOutput"
  /put-console-authorization-configuration:
    post:
      operationId: PutConsoleAuthorizationConfiguration
      description: Enable console authorization configuration with automatic scope detection
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetId:
                  $ref: "#/components/schemas/TargetId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutConsoleAuthorizationConfigurationOutput"
  /put-resource-permission-statement:
    post:
      operationId: PutResourcePermissionStatement
      description: Create a permission statement in the account's SignIn resource-based policy
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceVpc:
                  $ref: "#/components/schemas/SourceVpc"
                signinSourceVpce:
                  $ref: "#/components/schemas/SourceVpce"
                consoleSourceVpce:
                  $ref: "#/components/schemas/SourceVpce"
                vpcSourceIp:
                  $ref: "#/components/schemas/VpcSourceIp"
                sourceIp:
                  $ref: "#/components/schemas/SourceIp"
                requestedRegion:
                  $ref: "#/components/schemas/RequestedRegion"
                excludedPrincipal:
                  $ref: "#/components/schemas/ExcludedPrincipal"
                clientToken:
                  $ref: "#/components/schemas/ClientToken"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutResourcePermissionStatementOutput"
  /v1/revoke?x-amz-client-auth-method=iam:
    post:
      operationId: RevokeOAuth2TokenWithIAM
      description: "Grants permission to revoke an OAuth 2.0 refresh token and its associated refresh tokens Revokes a refresh_token issued by AWS Sign-In, invalidating the entire token chain so that the refresh_token can no longer be used to mint new access_tokens. Idempotency: revoking an already-revoked, expired, or otherwise invalid token still returns 200 OK with an empty body. Only the refresh_token type is accepted."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  $ref: "#/components/schemas/RevocationToken"
              required:
                - token
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeOAuth2TokenWithIAMResponse"
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    CreateOAuth2TokenRequestBody:
      description: "Request body payload for CreateOAuth2Token operation The operation type is determined by the grant_type parameter: grant_type=authorization_code: Requires code, redirect_uri, code_verifier grant_type=refresh_token: Requires refresh_token"
      type: object
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
          description: The client identifier (ARN) used during Sign-In onboarding Required for both authorization code and refresh token flows
        grantType:
          $ref: "#/components/schemas/GrantType"
          description: OAuth 2.0 grant type - determines which flow is used Must be "authorization_code" or "refresh_token"
        code:
          $ref: "#/components/schemas/AuthorizationCode"
          description: The authorization code received from /v1/authorize Required only when grant_type=authorization_code
        redirectUri:
          $ref: "#/components/schemas/RedirectUri"
          description: The redirect URI that must match the original authorization request Required only when grant_type=authorization_code
        codeVerifier:
          $ref: "#/components/schemas/CodeVerifier"
          description: PKCE code verifier to prove possession of the original code challenge Required only when grant_type=authorization_code
        refreshToken:
          $ref: "#/components/schemas/RefreshToken"
          description: The refresh token returned from auth_code redemption Required only when grant_type=refresh_token
      required:
        - clientId
        - grantType
    ClientId:
      description: "Client identifier pattern for AWS Sign-In devtools clients The ARN used by client as part of Sign-In onboarding. Expected values: arn:aws:signin:::devtools/cross-device (for cross-device devtools login) arn:aws:signin:::devtools/same-device (for same-device devtools login)"
      type: string
      pattern: arn:aws:signin:::devtools/(cross-device|same-device)
    GrantType:
      description: 'OAuth 2.0 grant type parameter For auth code redemption: Must be "authorization_code" For token refresh: Must be "refresh_token" Based on client_id & grant_type, authn/authz is skipped for CLI endpoints.'
      type: string
      pattern: (authorization_code|refresh_token)
    AuthorizationCode:
      description: Authorization code received from AWS Sign-In /v1/authorize endpoint The authorization code received from AWS Sign-In from /v1/authorize. Used in auth code redemption flow only.
      type: string
      minLength: 1
      maxLength: 512
    RedirectUri:
      description: Redirect URI for OAuth 2.0 flow validation The same redirect URI used in the authorization request. This must match exactly what was sent in the original authorization request for security validation.
      type: string
      minLength: 1
      maxLength: 2048
    CodeVerifier:
      description: PKCE code verifier for OAuth 2.0 security PKCE code verifier to prove possession of the original code challenge. Used to prevent authorization code interception attacks in public clients. Must be 43-128 characters using unreserved characters [A-Z] / [a-z] / [0-9] / "-" / "." / "_" / "~"
      type: string
      minLength: 43
      maxLength: 128
      pattern: "[A-Za-z0-9\\-._~]+"
    RefreshToken:
      description: Encrypted refresh token with cnf.jkt This is the encrypted refresh token returned from auth code redemption. The token content includes cnf.jkt (SHA-256 thumbprint of the presented jwk). Used in subsequent token refresh requests.
      type: string
      minLength: 1
      maxLength: 2048
    CreateOAuth2TokenResponse:
      description: Output structure for CreateOAuth2Token operation Contains flattened token operation outputs for both authorization code and refresh token flows. The response content depends on the grant_type from the original request.
      type: object
      properties:
        tokenOutput:
          $ref: "#/components/schemas/CreateOAuth2TokenResponseBody"
          description: Flattened token operation outputs The specific response fields depend on the grant_type used in the request
      required:
        - tokenOutput
    CreateOAuth2TokenResponseBody:
      description: "Response body payload for CreateOAuth2Token operation The response content depends on the grant_type from the request: grant_type=authorization_code: Returns all fields including refresh_token and id_token grant_type=refresh_token: Returns access_token, token_type, expires_in, refresh_token (no id_token)"
      type: object
      properties:
        accessToken:
          $ref: "#/components/schemas/AccessToken"
          description: Scoped-down AWS credentials (15 minute duration) Present for both authorization code redemption and token refresh
        tokenType:
          $ref: "#/components/schemas/TokenType"
          description: Token type indicating this is AWS SigV4 credentials Value is "aws_sigv4" for both flows
        expiresIn:
          $ref: "#/components/schemas/ExpiresIn"
          description: Time to expiry in seconds (maximum 900) Present for both authorization code redemption and token refresh
        refreshToken:
          $ref: "#/components/schemas/RefreshToken"
          description: Encrypted refresh token with cnf.jkt (SHA-256 thumbprint of presented jwk) Always present in responses (required for both flows)
        idToken:
          $ref: "#/components/schemas/IdToken"
          description: ID token containing user identity information Present only in authorization code redemption response (grant_type=authorization_code) Not included in token refresh responses
      required:
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
    AccessToken:
      description: AWS credentials structure containing temporary access credentials Scoped, temporary AWS credentials with a 15-minute duration.
      type: object
      properties:
        accessKeyId:
          $ref: "#/components/schemas/String"
          description: AWS access key ID for temporary credentials
        secretAccessKey:
          $ref: "#/components/schemas/String"
          description: AWS secret access key for temporary credentials
        sessionToken:
          $ref: "#/components/schemas/String"
          description: AWS session token for temporary credentials
      required:
        - accessKeyId
        - secretAccessKey
        - sessionToken
    String:
      type: string
    TokenType:
      description: Token type parameter indicating credential usage A parameter which indicates to the client how the token must be used. Value is "aws_sigv4" (instead of typical "Bearer" for other OAuth systems) to indicate that the client must de-serialize the token and use it to generate a signature.
      type: string
      pattern: aws_sigv4
    ExpiresIn:
      description: Time to expiry in seconds The time to expiry in seconds, for these purposes will be at most 900 (15 minutes).
      type: integer
      minimum: 1
      maximum: 900
    IdToken:
      description: ID token containing user identity information Encoded JWT token containing user identity claims and authentication context. Returned only in authorization code redemption responses (grant_type=authorization_code). Contains user identity information such as ARN and other identity claims.
      type: string
      minLength: 1
      maxLength: 4096
    ClientCredentialsGrantType:
      description: OAuth 2.0 grant type for client_credentials flow.
      type: string
      pattern: client_credentials
    CreateOAuth2TokenWithIAMRequestResourceString:
      type: string
      minLength: 1
      maxLength: 2048
    CreateOAuth2TokenWithIAMResponse:
      description: Output structure for CreateOAuth2TokenWithIAM operation Contains the JWT access token, token type, and expiration per RFC 6749 §5.1.
      type: object
      properties:
        accessToken:
          $ref: "#/components/schemas/OAuthAccessToken"
          description: JWT access token containing principal identity, resource scope, and session metadata
        tokenType:
          $ref: "#/components/schemas/BearerTokenType"
          description: Always "Bearer" per OAuth 2.1 specification
        expiresIn:
          $ref: "#/components/schemas/TokenExpiresIn"
          description: Token lifetime in seconds. Value is the minimum of session validity and 1 hour.
      required:
        - accessToken
        - tokenType
        - expiresIn
    OAuthAccessToken:
      description: OAuth 2.0 access token (JWT) containing principal identity and resource scope.
      type: string
      minLength: 1
      maxLength: 4096
    BearerTokenType:
      description: Token type for access tokens. Always "Bearer" per OAuth 2.1.
      type: string
      pattern: Bearer
    TokenExpiresIn:
      description: Token lifetime in seconds. Value is the minimum of session validity and 1 hour (3600 seconds).
      type: integer
      minimum: 1
      maximum: 3600
    TargetId:
      description: Target account identifier for console authorization
      type: string
      minLength: 12
      maxLength: 32
      pattern: (\d{12}|o-[a-z0-9]{10}|r-[0-9a-z]{4,32})
    DeleteConsoleAuthorizationConfigurationOutput:
      description: Output for DeleteConsoleAuthorizationConfiguration operation
      type: object
      properties:
        targetId:
          $ref: "#/components/schemas/TargetId"
          description: Target account identifier
        scope:
          $ref: "#/components/schemas/String"
          description: Authorization scope
        consoleAuthorizationEnabled:
          $ref: "#/components/schemas/Boolean"
          description: Whether console authorization is enabled
      required:
        - targetId
        - scope
        - consoleAuthorizationEnabled
    Boolean:
      type: boolean
    StatementId:
      description: Unique identifier for a permission statement
      type: string
      pattern: "[A-Za-z0-9+/]{64}=?"
    ClientToken:
      description: Idempotency token
      type: string
      minLength: 1
      maxLength: 64
      pattern: "[!-~]+"
    DeleteResourcePermissionStatementOutput:
      description: Output for DeleteResourcePermissionStatement operation
      type: object
    GetConsoleAuthorizationConfigurationOutput:
      description: Output for GetConsoleAuthorizationConfiguration operation
      type: object
      properties:
        targetId:
          $ref: "#/components/schemas/TargetId"
          description: Target account identifier
        scope:
          $ref: "#/components/schemas/String"
          description: Authorization scope
        consoleAuthorizationEnabled:
          $ref: "#/components/schemas/Boolean"
          description: Whether console authorization is enabled
      required:
        - targetId
        - scope
        - consoleAuthorizationEnabled
    GetResourcePolicyOutput:
      description: Output for GetResourcePolicy operation
      type: object
      properties:
        signinResourceBasedPolicy:
          $ref: "#/components/schemas/SigninResourceBasedPolicy"
          description: The account's SignIn resource-based policy
      required:
        - signinResourceBasedPolicy
    SigninResourceBasedPolicy:
      description: SignIn resource-based policy document
      type: object
      properties:
        version:
          $ref: "#/components/schemas/String"
          description: Policy version
        statement:
          $ref: "#/components/schemas/PolicyStatements"
          description: Policy statements
    PolicyStatements:
      type: array
      items:
        $ref: "#/components/schemas/PolicyStatement"
    PolicyStatement:
      description: Individual policy statement within a resource-based policy
      type: object
      properties:
        effect:
          $ref: "#/components/schemas/String"
          description: Effect of the policy statement (Allow/Deny)
        principal:
          type: object
          properties: {}
          description: Principal the statement applies to
        action:
          $ref: "#/components/schemas/PolicyActions"
          description: Actions the statement controls
        resource:
          $ref: "#/components/schemas/String"
          description: Resource the statement applies to
        condition:
          type: object
          properties: {}
          description: Condition block for the statement
    PolicyActions:
      description: List of policy actions
      type: array
      items:
        $ref: "#/components/schemas/String"
    IntrospectionToken:
      description: Token string submitted for introspection. May be an AWS Sign-In access_token (prefix "ASOA") or refresh_token (prefix "ASOR").
      type: string
      minLength: 1
      maxLength: 4096
      pattern: ASO[AR][A-Za-z0-9+/=_\-]+
    TokenTypeHint:
      description: 'Optional RFC 7662 §2.1 token_type_hint value. One of: "access_token" "refresh_token"'
      type: string
      pattern: (access_token|refresh_token)
    IntrospectOAuth2TokenWithIAMResponse:
      description: Output structure for IntrospectOAuth2TokenWithIAM operation RFC 7662 §2.2 introspection response. Only active is required; all other claims are omitted when the token is inactive.
      type: object
      properties:
        active:
          $ref: "#/components/schemas/Boolean"
          description: Indicates whether the token is currently active. true only when the token is valid, has not expired, has not been revoked, and belongs to the caller's account.
        clientId:
          $ref: "#/components/schemas/String"
          description: Client identifier for the OAuth 2.0 client that requested the token.
        userId:
          $ref: "#/components/schemas/String"
          description: User identifier matching sts:GetCallerIdentity's UserId field for the token's subject principal (e.g. "AIDAEXAMPLE" for an IAM user, or "AROAEXAMPLE:session-name" for an assumed role).
        tokenType:
          $ref: "#/components/schemas/IntrospectedTokenType"
          description: Indicates which kind of token was introspected. One of "access_token" or "refresh_token".
        exp:
          $ref: "#/components/schemas/Long"
          description: Token expiration time as a NumericDate (Unix epoch seconds).
        iat:
          $ref: "#/components/schemas/Long"
          description: Token issuance time as a NumericDate (Unix epoch seconds).
        nbf:
          $ref: "#/components/schemas/Long"
          description: Token "not before" time as a NumericDate (Unix epoch seconds).
        sub:
          $ref: "#/components/schemas/String"
          description: "Subject of the token: the IAM principal ARN. For assumed-role sessions, this is the session ARN (matches sts:GetCallerIdentity's Arn field), e.g. arn:aws:sts::123456789012:assumed-role/MyRole/session-name."
        aud:
          $ref: "#/components/schemas/String"
          description: 'Audience of the token: the OAuth resource the token is scoped to (for example, "aws-mcp.amazonaws.com"). Omitted for refresh tokens.'
        iss:
          $ref: "#/components/schemas/String"
          description: Issuer of the token. Always "signin.amazonaws.com" for AWS Sign-In.
        jti:
          $ref: "#/components/schemas/String"
          description: Unique identifier for the token.
        accountId:
          $ref: "#/components/schemas/AccountId"
          description: 12-digit AWS account ID of the token's subject principal.
        signinSession:
          $ref: "#/components/schemas/String"
          description: AWS Sign-In session ARN bound to the token, of the form arn:aws:signin:{region}:{account}:session/{uuid}.
        resource:
          $ref: "#/components/schemas/String"
          description: The OAuth resource the token is scoped to during Human OAuth flow. Only present for refresh token introspection.
      required:
        - active
    IntrospectedTokenType:
      description: Introspection response token_type value. Indicates which kind of token was inspected.
      type: string
      pattern: (access_token|refresh_token)
    Long:
      type: integer
      format: int64
    AccountId:
      description: AWS account identifier
      type: string
      minLength: 12
      maxLength: 12
      pattern: "[0-9]{12}"
    ConsolePermissionMaxResults:
      description: Maximum number of results for list operations
      type: integer
      minimum: 1
      maximum: 100
    NextToken:
      description: Pagination token
      type: string
      minLength: 0
      maxLength: 2048
      pattern: "[-a-zA-Z0-9+=/_]*"
    ListResourcePermissionStatementsOutput:
      description: Output for ListResourcePermissionStatements operation
      type: object
      properties:
        permissionStatements:
          $ref: "#/components/schemas/PermissionStatementSummaries"
          description: List of permission statement summaries
        nextToken:
          $ref: "#/components/schemas/NextToken"
          description: Token for next page of results
      required:
        - permissionStatements
    PermissionStatementSummaries:
      type: array
      items:
        $ref: "#/components/schemas/PermissionStatementSummary"
    PermissionStatementSummary:
      description: Summary of a permission statement
      type: object
      properties:
        sid:
          $ref: "#/components/schemas/StatementId"
          description: Unique identifier for the permission statement
        condition:
          type: object
          properties: {}
          description: Condition block for the permission statement
      required:
        - sid
    PutConsoleAuthorizationConfigurationOutput:
      description: Output for PutConsoleAuthorizationConfiguration operation
      type: object
      properties:
        targetId:
          $ref: "#/components/schemas/TargetId"
          description: Target account identifier
        scope:
          $ref: "#/components/schemas/String"
          description: Authorization scope
        consoleAuthorizationEnabled:
          $ref: "#/components/schemas/Boolean"
          description: Whether console authorization is enabled
      required:
        - targetId
        - scope
        - consoleAuthorizationEnabled
    SourceVpc:
      description: VPC identifier for network-based access control
      type: string
      pattern: vpc-([0-9a-f]{8}|[0-9a-f]{17})
    SourceVpce:
      description: VPC endpoint identifier
      type: string
      pattern: vpce-[a-z0-9]{8,20}
    VpcSourceIp:
      description: Source IP address within a VPC
      type: string
    SourceIp:
      description: Source IP address for access control
      type: string
    RequestedRegion:
      description: AWS region identifier for VPC and VPC endpoint pairing
      type: string
      pattern: "[a-z]{2}(-[a-z]+)+-\\d+"
    ExcludedPrincipal:
      description: Principal to exclude from permission statements
      type: string
      minLength: 20
      maxLength: 2048
