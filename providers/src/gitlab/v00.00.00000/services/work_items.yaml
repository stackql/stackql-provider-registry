openapi: 3.0.3
info:
  title: work_items API
  description: 'Work items - group work items, work item types and state counts. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=group_work_item_state_counts&method=get:
    post:
      operationId: group_work_item_state_counts_get
      summary: Counts of work items by state for the namespace.
      description: Counts of work items by state for the namespace. Generated from the GitLab GraphQL schema field Group.workItemStateCounts (WorkItemStateCountsType).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.workItemStateCounts'
        url: https://docs.gitlab.com/api/graphql/reference/#groupworkitemstatecounts
      x-stackQL-graphQL:
        id: gitlab.work_items.group_work_item_state_counts.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { group(fullPath: "{{ .full_path }}") { workItemStateCounts{{ if or .assignee_wildcard_id .author_username .closed_after .closed_before .confidential .created_after .created_before .crm_contact_id .crm_organization_id .due_after .due_before .health_status_filter .iid .include_ancestors .include_descendants .iteration_wildcard_id .milestone_wildcard_id .my_reaction_emoji .release_tag_wildcard_id .search .sort .state .subscribed .updated_after .updated_before .weight .weight_wildcard_id }}({{ if .assignee_wildcard_id }}, assigneeWildcardId: {{ .assignee_wildcard_id }}{{ end }}{{ if .author_username }}, authorUsername: "{{ .author_username }}"{{ end }}{{ if .closed_after }}, closedAfter: "{{ .closed_after }}"{{ end }}{{ if .closed_before }}, closedBefore: "{{ .closed_before }}"{{ end }}{{ if .confidential }}, confidential: {{ .confidential }}{{ end }}{{ if .created_after }}, createdAfter: "{{ .created_after }}"{{ end }}{{ if .created_before }}, createdBefore: "{{ .created_before }}"{{ end }}{{ if .crm_contact_id }}, crmContactId: "{{ .crm_contact_id }}"{{ end }}{{ if .crm_organization_id }}, crmOrganizationId: "{{ .crm_organization_id }}"{{ end }}{{ if .due_after }}, dueAfter: "{{ .due_after }}"{{ end }}{{ if .due_before }}, dueBefore: "{{ .due_before }}"{{ end }}{{ if .health_status_filter }}, healthStatusFilter: {{ .health_status_filter }}{{ end }}{{ if .iid }}, iid: "{{ .iid }}"{{ end }}{{ if .include_ancestors }}, includeAncestors: {{ .include_ancestors }}{{ end }}{{ if .include_descendants }}, includeDescendants: {{ .include_descendants }}{{ end }}{{ if .iteration_wildcard_id }}, iterationWildcardId: {{ .iteration_wildcard_id }}{{ end }}{{ if .milestone_wildcard_id }}, milestoneWildcardId: {{ .milestone_wildcard_id }}{{ end }}{{ if .my_reaction_emoji }}, myReactionEmoji: "{{ .my_reaction_emoji }}"{{ end }}{{ if .release_tag_wildcard_id }}, releaseTagWildcardId: {{ .release_tag_wildcard_id }}{{ end }}{{ if .search }}, search: "{{ .search }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}{{ if .state }}, state: {{ .state }}{{ end }}{{ if .subscribed }}, subscribed: {{ .subscribed }}{{ end }}{{ if .updated_after }}, updatedAfter: "{{ .updated_after }}"{{ end }}{{ if .updated_before }}, updatedBefore: "{{ .updated_before }}"{{ end }}{{ if .weight }}, weight: "{{ .weight }}"{{ end }}{{ if .weight_wildcard_id }}, weightWildcardId: {{ .weight_wildcard_id }}{{ end }}){{ end }} { all_: all closed opened } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: assignee_wildcard_id
          in: query
          required: false
          description: Filter by assignee wildcard. Incompatible with `assigneeUsernames`.
          schema:
            type: string
            enum:
              - NONE
              - ANY
              - ME
        - name: author_username
          in: query
          required: false
          description: Filter work items by author username.
          schema:
            type: string
        - name: closed_after
          in: query
          required: false
          description: Work items closed after the date.
          schema:
            type: string
        - name: closed_before
          in: query
          required: false
          description: Work items closed before the date.
          schema:
            type: string
        - name: confidential
          in: query
          required: false
          description: Filter for confidential work items. If `false`, excludes confidential work items. If `true`, returns only confidential work items.
          schema:
            type: boolean
        - name: created_after
          in: query
          required: false
          description: Work items created after the timestamp.
          schema:
            type: string
        - name: created_before
          in: query
          required: false
          description: Work items created before the timestamp.
          schema:
            type: string
        - name: crm_contact_id
          in: query
          required: false
          description: Filter by ID of CRM contact.
          schema:
            type: string
        - name: crm_organization_id
          in: query
          required: false
          description: Filter by ID of CRM contact organization.
          schema:
            type: string
        - name: due_after
          in: query
          required: false
          description: Work items due after the timestamp.
          schema:
            type: string
        - name: due_before
          in: query
          required: false
          description: Work items due before the timestamp.
          schema:
            type: string
        - name: health_status_filter
          in: query
          required: false
          description: Health status of the work item, "none" and "any" values are supported.
          schema:
            type: string
            enum:
              - NONE
              - ANY
              - onTrack
              - needsAttention
              - atRisk
        - name: iid
          in: query
          required: false
          description: IID of the work item. For example, "1".
          schema:
            type: string
        - name: include_ancestors
          in: query
          required: false
          description: Include work items from ancestor groups. Ignored for project namespaces.
          schema:
            type: boolean
        - name: include_descendants
          in: query
          required: false
          description: Include work items from descendant groups and projects. Ignored for project namespaces.
          schema:
            type: boolean
        - name: iteration_wildcard_id
          in: query
          required: false
          description: Filter by iteration ID wildcard.
          schema:
            type: string
            enum:
              - NONE
              - ANY
              - CURRENT
        - name: milestone_wildcard_id
          in: query
          required: false
          description: Filter by milestone ID wildcard. Incompatible with `milestoneTitle`.
          schema:
            type: string
            enum:
              - NONE
              - ANY
              - STARTED
              - UPCOMING
        - name: my_reaction_emoji
          in: query
          required: false
          description: Filter by reaction emoji applied by the current user. Wildcard values `NONE` and `ANY` are supported.
          schema:
            type: string
        - name: release_tag_wildcard_id
          in: query
          required: false
          description: Filter by release tag wildcard.
          schema:
            type: string
            enum:
              - NONE
              - ANY
        - name: search
          in: query
          required: false
          description: Search query for title or description.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort work items by criteria.
          schema:
            type: string
            enum:
              - UPDATED_DESC
              - UPDATED_ASC
              - CREATED_DESC
              - CREATED_ASC
              - TITLE_ASC
              - TITLE_DESC
              - LABEL_PRIORITY_ASC
              - LABEL_PRIORITY_DESC
              - BLOCKING_ISSUES_ASC
              - BLOCKING_ISSUES_DESC
              - MILESTONE_DUE_ASC
              - MILESTONE_DUE_DESC
        - name: state
          in: query
          required: false
          description: Current state of the work item.
          schema:
            type: string
            enum:
              - opened
              - closed
              - locked
              - all
        - name: subscribed
          in: query
          required: false
          description: Work items the current user is subscribed to.
          schema:
            type: string
            enum:
              - EXPLICITLY_SUBSCRIBED
              - EXPLICITLY_UNSUBSCRIBED
        - name: updated_after
          in: query
          required: false
          description: Work items updated after the timestamp.
          schema:
            type: string
        - name: updated_before
          in: query
          required: false
          description: Work items updated before the timestamp.
          schema:
            type: string
        - name: weight
          in: query
          required: false
          description: Weight applied to the work item, "none" and "any" values are supported.
          schema:
            type: string
        - name: weight_wildcard_id
          in: query
          required: false
          description: Filter by weight ID wildcard. Incompatible with weight.
          schema:
            type: string
            enum:
              - NONE
              - ANY
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          workItemStateCounts:
                            type: object
                            properties:
                              all_:
                                type: integer
                                description: Number of work items for the project or group.
                              closed:
                                type: integer
                                description: Number of work items with state CLOSED for the project or group.
                              opened:
                                type: integer
                                description: Number of work items with state OPENED for the project or group.
  /api/graphql?resource=group_work_item_types&method=list:
    post:
      operationId: group_work_item_types_list
      summary: Work item types available to the group.
      description: Work item types available to the group. Generated from the GitLab GraphQL schema field Group.workItemTypes (connection of WorkItemType nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.workItemTypes'
        url: https://docs.gitlab.com/api/graphql/reference/#groupworkitemtypes
      x-stackQL-graphQL:
        id: gitlab.work_items.group_work_item_types.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.workItemTypes.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.workItemTypes.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.workItemTypes.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { workItemTypes(first: 100{{ .cursor }}) { nodes { icon_name: iconName id name } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          workItemTypes:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    icon_name:
                                      type: string
                                      description: Icon name of the work item type.
                                    id:
                                      type: string
                                      description: Global ID of the work item type.
                                    name:
                                      type: string
                                      description: Name of the work item type.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_work_item&method=get:
    post:
      operationId: group_work_item_get
      summary: Find a work item by IID directly associated with the group.
      description: Find a work item by IID directly associated with the group. Generated from the GitLab GraphQL schema field Group.workItem (WorkItem).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.workItem'
        url: https://docs.gitlab.com/api/graphql/reference/#groupworkitem
      x-stackQL-graphQL:
        id: gitlab.work_items.group_work_item.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { group(fullPath: "{{ .full_path }}") { workItem(iid: "{{ .iid }}") { closed_at: closedAt confidential create_note_email: createNoteEmail created_at: createdAt description duplicated_to_work_item_url: duplicatedToWorkItemUrl hidden id iid imported lock_version: lockVersion moved_to_work_item_url: movedToWorkItemUrl name promoted_to_epic_url: promotedToEpicUrl reference state title updated_at: updatedAt user_discussions_count: userDiscussionsCount web_path: webPath web_url: webUrl } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: iid
          in: query
          required: true
          description: IID of the work item.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          workItem:
                            type: object
                            properties:
                              closed_at:
                                type: string
                                description: Timestamp of when the work item was closed.
                              confidential:
                                type: boolean
                                description: Indicates the work item is confidential.
                              create_note_email:
                                type: string
                                description: User specific email address for the work item.
                              created_at:
                                type: string
                                description: Timestamp of when the work item was created.
                              description:
                                type: string
                                description: Description of the work item.
                              duplicated_to_work_item_url:
                                type: string
                                description: URL of the work item that the work item is marked as a duplicate of.
                              hidden:
                                type: boolean
                                description: Indicates the work item is hidden because the author has been banned.
                              id:
                                type: string
                                description: Global ID of the work item.
                              iid:
                                type: string
                                description: Internal ID of the work item.
                              imported:
                                type: boolean
                                description: Indicates whether the work item was imported.
                              lock_version:
                                type: integer
                                description: Lock version of the work item. Incremented each time the work item is updated.
                              moved_to_work_item_url:
                                type: string
                                description: URL of the work item that the work item was moved to.
                              name:
                                type: string
                                description: Name or title of the object.
                              promoted_to_epic_url:
                                type: string
                                description: URL of the epic that the work item has been promoted to.
                              reference:
                                type: string
                                description: Internal reference of the work item. Returned in shortened format by default.
                              state:
                                type: string
                                enum:
                                  - OPEN
                                  - CLOSED
                                description: State of the work item.
                              title:
                                type: string
                                description: Title of the work item.
                              updated_at:
                                type: string
                                description: Timestamp of when the work item was last updated.
                              user_discussions_count:
                                type: integer
                                description: Number of user discussions in the work item.
                              web_path:
                                type: string
                                description: Web path of the object.
                              web_url:
                                type: string
                                description: URL of the object.
  /api/graphql?resource=group_work_items&method=list:
    post:
      operationId: group_work_items_list
      summary: Work items that belong to the namespace.
      description: Work items that belong to the namespace. Generated from the GitLab GraphQL schema field Group.workItems (connection of WorkItem nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.workItems'
        url: https://docs.gitlab.com/api/graphql/reference/#groupworkitems
      x-stackQL-graphQL:
        id: gitlab.work_items.group_work_items.list
