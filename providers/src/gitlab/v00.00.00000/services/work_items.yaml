        cursor:
          strategy: page_info
          jsonPath: $.data.group.workItems.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.workItems.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { workItems(first: 100{{ .cursor }}{{ if .assignee_wildcard_id }}, assigneeWildcardId: {{ .assignee_wildcard_id }}{{ end }}{{ if .author_username }}, authorUsername: "{{ .author_username }}"{{ end }}{{ if .closed_after }}, closedAfter: "{{ .closed_after }}"{{ end }}{{ if .closed_before }}, closedBefore: "{{ .closed_before }}"{{ end }}{{ if .confidential }}, confidential: {{ .confidential }}{{ end }}{{ if .created_after }}, createdAfter: "{{ .created_after }}"{{ end }}{{ if .created_before }}, createdBefore: "{{ .created_before }}"{{ end }}{{ if .crm_contact_id }}, crmContactId: "{{ .crm_contact_id }}"{{ end }}{{ if .crm_organization_id }}, crmOrganizationId: "{{ .crm_organization_id }}"{{ end }}{{ if .due_after }}, dueAfter: "{{ .due_after }}"{{ end }}{{ if .due_before }}, dueBefore: "{{ .due_before }}"{{ end }}{{ if .health_status_filter }}, healthStatusFilter: {{ .health_status_filter }}{{ end }}{{ if .iid }}, iid: "{{ .iid }}"{{ end }}{{ if .include_ancestors }}, includeAncestors: {{ .include_ancestors }}{{ end }}{{ if .include_descendants }}, includeDescendants: {{ .include_descendants }}{{ end }}{{ if .iteration_wildcard_id }}, iterationWildcardId: {{ .iteration_wildcard_id }}{{ end }}{{ if .milestone_wildcard_id }}, milestoneWildcardId: {{ .milestone_wildcard_id }}{{ end }}{{ if .my_reaction_emoji }}, myReactionEmoji: "{{ .my_reaction_emoji }}"{{ end }}{{ if .release_tag_wildcard_id }}, releaseTagWildcardId: {{ .release_tag_wildcard_id }}{{ end }}{{ if .search }}, search: "{{ .search }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}{{ if .state }}, state: {{ .state }}{{ end }}{{ if .subscribed }}, subscribed: {{ .subscribed }}{{ end }}{{ if .updated_after }}, updatedAfter: "{{ .updated_after }}"{{ end }}{{ if .updated_before }}, updatedBefore: "{{ .updated_before }}"{{ end }}{{ if .weight }}, weight: "{{ .weight }}"{{ end }}{{ if .weight_wildcard_id }}, weightWildcardId: {{ .weight_wildcard_id }}{{ end }}) { nodes { closed_at: closedAt confidential create_note_email: createNoteEmail created_at: createdAt description duplicated_to_work_item_url: duplicatedToWorkItemUrl hidden id iid imported lock_version: lockVersion moved_to_work_item_url: movedToWorkItemUrl name promoted_to_epic_url: promotedToEpicUrl reference state title updated_at: updatedAt user_discussions_count: userDiscussionsCount web_path: webPath web_url: webUrl } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: assignee_wildcard_id
          in: query
          required: false
          description: Filter by assignee wildcard. Incompatible with `assigneeUsernames`.
          schema:
            type: string
            enum:
              - NONE
              - ANY
              - ME
        - name: author_username
          in: query
          required: false
          description: Filter work items by author username.
          schema:
            type: string
        - name: closed_after
          in: query
          required: false
          description: Work items closed after the date.
          schema:
            type: string
        - name: closed_before
          in: query
          required: false
          description: Work items closed before the date.
          schema:
            type: string
        - name: confidential
          in: query
          required: false
          description: Filter for confidential work items. If `false`, excludes confidential work items. If `true`, returns only confidential work items.
          schema:
            type: boolean
        - name: created_after
          in: query
          required: false
          description: Work items created after the timestamp.
          schema:
            type: string
        - name: created_before
          in: query
          required: false
          description: Work items created before the timestamp.
          schema:
            type: string
        - name: crm_contact_id
          in: query
          required: false
          description: Filter by ID of CRM contact.
          schema:
            type: string
        - name: crm_organization_id
          in: query
          required: false
          description: Filter by ID of CRM contact organization.
          schema:
            type: string
        - name: due_after
          in: query
          required: false
          description: Work items due after the timestamp.
          schema:
            type: string
        - name: due_before
          in: query
          required: false
          description: Work items due before the timestamp.
          schema:
            type: string
        - name: health_status_filter
          in: query
          required: false
          description: Health status of the work item, "none" and "any" values are supported.
          schema:
            type: string
            enum:
              - NONE
              - ANY
              - onTrack
              - needsAttention
              - atRisk
        - name: iid
          in: query
          required: false
          description: IID of the work item. For example, "1".
          schema:
            type: string
        - name: include_ancestors
          in: query
          required: false
          description: Include work items from ancestor groups. Ignored for project namespaces.
          schema:
            type: boolean
        - name: include_descendants
          in: query
          required: false
          description: Include work items from descendant groups and projects. Ignored for project namespaces.
          schema:
            type: boolean
        - name: iteration_wildcard_id
          in: query
          required: false
          description: Filter by iteration ID wildcard.
