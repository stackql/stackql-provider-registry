openapi: 3.0.3
info:
  title: audit API
  description: 'Audit - audit event definitions. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=audit_event_definitions&method=list:
    post:
      operationId: audit_event_definitions_list
      summary: Definitions for all audit events available on the instance.
      description: Definitions for all audit events available on the instance. Generated from the GitLab GraphQL schema field Query.auditEventDefinitions (connection of AuditEventDefinition nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.auditEventDefinitions'
        url: https://docs.gitlab.com/api/graphql/reference/#queryauditeventdefinitions
      x-stackQL-graphQL:
        id: gitlab.audit.audit_event_definitions.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.auditEventDefinitions.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.auditEventDefinitions.pageInfo.endCursor
          terminateOnJsonPath: $.data.auditEventDefinitions.pageInfo.hasNextPage
        query: 'query { auditEventDefinitions(first: 100{{ .cursor }}) { nodes { description feature_category: featureCategory introduced_by_issue: introducedByIssue introduced_by_mr: introducedByMr milestone name saved_to_database: savedToDatabase streamed } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      auditEventDefinitions:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                description:
                                  type: string
                                  description: Description of what action the audit event tracks.
                                feature_category:
                                  type: string
                                  description: Feature category associated with the event.
                                introduced_by_issue:
                                  type: string
                                  description: Link to the issue introducing the event. For olderaudit events, it can be a commit URL rather than amerge request URL.
                                introduced_by_mr:
                                  type: string
                                  description: Link to the merge request introducing the event. Forolder audit events, it can be a commit URL rather thana merge request URL.
                                milestone:
                                  type: string
                                  description: Milestone the event was introduced in.
                                name:
                                  type: string
                                  description: Key name of the audit event.
                                saved_to_database:
                                  type: boolean
                                  description: Indicates if the event is saved to PostgreSQL database.
                                streamed:
                                  type: boolean
                                  description: Indicates if the event is streamed to an external destination.
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
components:
  x-stackQL-resources:
    audit_event_definitions:
      id: gitlab.audit.audit_event_definitions
      name: audit_event_definitions
      title: Audit Event Definitions
      methods:
        list:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=audit_event_definitions&method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.auditEventDefinitions.nodes
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/audit_event_definitions/methods/list'
        insert: []
        update: []
        delete: []
