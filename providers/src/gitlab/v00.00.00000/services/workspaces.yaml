openapi: 3.0.3
info:
  title: workspaces API
  description: 'Remote development workspaces. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=workspace&method=get:
    post:
      operationId: workspace_get
      summary: Find a workspace.
      description: Find a workspace. Generated from the GitLab GraphQL schema field Query.workspace (Workspace).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.workspace'
        url: https://docs.gitlab.com/api/graphql/reference/#queryworkspace
      x-stackQL-graphQL:
        id: gitlab.workspaces.workspace.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { workspace(id: "{{ .id }}") { actual_state: actualState created_at: createdAt deployment_resource_version: deploymentResourceVersion desired_state: desiredState desired_state_updated_at: desiredStateUpdatedAt devfile devfile_path: devfilePath id name namespace processed_devfile: processedDevfile project_id: projectId project_ref: projectRef responded_to_agent_at: respondedToAgentAt updated_at: updatedAt url user { id username name } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: Find a workspace by its ID.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspace:
                        type: object
                        properties:
                          actual_state:
                            type: string
                            description: Actual state of the workspace.
                          created_at:
                            type: string
                            description: Timestamp of when the workspace was created.
                          deployment_resource_version:
                            type: integer
                            description: Version of the deployment resource for the workspace.
                          desired_state:
                            type: string
                            description: Desired state of the workspace.
                          desired_state_updated_at:
                            type: string
                            description: Timestamp of the last update to the desired state.
                          devfile:
                            type: string
                            description: Source YAML of the devfile used to configure the workspace.
                          devfile_path:
                            type: string
                            description: Path to the devfile used to configure the workspace.
                          id:
                            type: string
                            description: Global ID of the workspace.
                          name:
                            type: string
                            description: Name of the workspace in Kubernetes.
                          namespace:
                            type: string
                            description: Namespace of the workspace in Kubernetes.
                          processed_devfile:
                            type: string
                            description: Processed YAML of the devfile used to configure the workspace.
                          project_id:
                            type: string
                            description: ID of the project that contains the devfile for the workspace.
                          project_ref:
                            type: string
                            description: Git reference that contains the devfile used to configure the workspace, and that will be cloned into the workspace
                          responded_to_agent_at:
                            type: string
                            description: Timestamp of the last response sent to the GitLab agent for Kubernetes for the workspace.
                          updated_at:
                            type: string
                            description: Timestamp of the last update to any mutable workspace property.
                          url:
                            type: string
                            description: URL of the workspace.
                          user:
                            type: object
                            description: UserCore identity (id, username, name)
                            properties:
                              id:
                                type: string
                              username:
                                type: string
                              name:
                                type: string
  /api/graphql?resource=workspaces&method=list:
    post:
      operationId: workspaces_list
      summary: Find workspaces across the entire instance. This field is only available to instance admins, it will return an empty result for all non-admins.
      description: Find workspaces across the entire instance. This field is only available to instance admins, it will return an empty result for all non-admins. Generated from the GitLab GraphQL schema field Query.workspaces (connection of Workspace nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.workspaces'
        url: https://docs.gitlab.com/api/graphql/reference/#queryworkspaces
      x-stackQL-graphQL:
        id: gitlab.workspaces.workspaces.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.workspaces.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.workspaces.pageInfo.endCursor
          terminateOnJsonPath: $.data.workspaces.pageInfo.hasNextPage
        query: 'query { workspaces(first: 100{{ .cursor }}) { nodes { actual_state: actualState created_at: createdAt deployment_resource_version: deploymentResourceVersion desired_state: desiredState desired_state_updated_at: desiredStateUpdatedAt devfile devfile_path: devfilePath id name namespace processed_devfile: processedDevfile project_id: projectId project_ref: projectRef responded_to_agent_at: respondedToAgentAt updated_at: updatedAt url user { id username name } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspaces:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                actual_state:
                                  type: string
                                  description: Actual state of the workspace.
                                created_at:
                                  type: string
                                  description: Timestamp of when the workspace was created.
                                deployment_resource_version:
                                  type: integer
                                  description: Version of the deployment resource for the workspace.
                                desired_state:
                                  type: string
                                  description: Desired state of the workspace.
                                desired_state_updated_at:
                                  type: string
                                  description: Timestamp of the last update to the desired state.
                                devfile:
                                  type: string
                                  description: Source YAML of the devfile used to configure the workspace.
                                devfile_path:
                                  type: string
                                  description: Path to the devfile used to configure the workspace.
                                id:
                                  type: string
                                  description: Global ID of the workspace.
                                name:
                                  type: string
                                  description: Name of the workspace in Kubernetes.
                                namespace:
                                  type: string
                                  description: Namespace of the workspace in Kubernetes.
                                processed_devfile:
                                  type: string
                                  description: Processed YAML of the devfile used to configure the workspace.
                                project_id:
                                  type: string
                                  description: ID of the project that contains the devfile for the workspace.
                                project_ref:
                                  type: string
                                  description: Git reference that contains the devfile used to configure the workspace, and that will be cloned into the workspace
                                responded_to_agent_at:
                                  type: string
                                  description: Timestamp of the last response sent to the GitLab agent for Kubernetes for the workspace.
                                updated_at:
                                  type: string
                                  description: Timestamp of the last update to any mutable workspace property.
                                url:
                                  type: string
                                  description: URL of the workspace.
                                user:
                                  type: object
                                  description: UserCore identity (id, username, name)
                                  properties:
                                    id:
                                      type: string
                                    username:
                                      type: string
                                    name:
                                      type: string
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
components:
  x-stackQL-resources:
    workspace:
      id: gitlab.workspaces.workspace
      name: workspace
      title: Workspace
      methods:
        get:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=workspace&method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.workspace
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/workspace/methods/get'
        insert: []
        update: []
        delete: []
    workspaces:
      id: gitlab.workspaces.workspaces
      name: workspaces
      title: Workspaces
      methods:
        list:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=workspaces&method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.workspaces.nodes
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/workspaces/methods/list'
        insert: []
        update: []
        delete: []
