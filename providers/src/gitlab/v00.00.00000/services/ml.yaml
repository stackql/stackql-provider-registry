openapi: 3.0.3
info:
  title: ml API
  description: 'Machine learning model registry - experiments. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=ml_experiment&method=get:
    post:
      operationId: ml_experiment_get
      summary: Find a machine learning experiment.
      description: Find a machine learning experiment. Generated from the GitLab GraphQL schema field Query.mlExperiment (MlExperiment).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.mlExperiment'
        url: https://docs.gitlab.com/api/graphql/reference/#querymlexperiment
      x-stackQL-graphQL:
        id: gitlab.ml.ml_experiment.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { mlExperiment(id: "{{ .id }}") { candidate_count: candidateCount created_at: createdAt id model_id: modelId name path updated_at: updatedAt } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: ID of the experiment.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mlExperiment:
                        type: object
                        properties:
                          candidate_count:
                            type: integer
                            description: Number of candidates in the experiment.
                          created_at:
                            type: string
                            description: Timestamp of when the experiment was created.
                          id:
                            type: string
                            description: ID of the experiment.
                          model_id:
                            type: string
                            description: ID of the model.
                          name:
                            type: string
                            description: Name of the experiment.
                          path:
                            type: string
                            description: Web URL of the experiment.
                          updated_at:
                            type: string
                            description: Timestamp of when the experiment was updated.
  /api/graphql?resource=project_ml_experiments&method=list:
    post:
      operationId: project_ml_experiments_list
      summary: Find machine learning experiments
      description: Find machine learning experiments Generated from the GitLab GraphQL schema field Project.mlExperiments (connection of MlExperiment nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.mlExperiments'
        url: https://docs.gitlab.com/api/graphql/reference/#projectmlexperiments
      x-stackQL-graphQL:
        id: gitlab.ml.project_ml_experiments.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.mlExperiments.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.mlExperiments.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.mlExperiments.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { mlExperiments(first: 100{{ .cursor }}{{ if .name }}, name: "{{ .name }}"{{ end }}{{ if .order_by }}, orderBy: {{ .order_by }}{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}) { nodes { candidate_count: candidateCount created_at: createdAt id model_id: modelId name path updated_at: updatedAt } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Search for names that include the string.
          schema:
            type: string
        - name: order_by
          in: query
          required: false
          description: Ordering column. Default is created_at.
          schema:
            type: string
            enum:
              - NAME
              - CREATED_AT
              - UPDATED_AT
              - ID
        - name: sort
          in: query
          required: false
          description: Ordering direction. Default is desc.
          schema:
            type: string
            enum:
              - ASC
              - DESC
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          mlExperiments:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    candidate_count:
                                      type: integer
                                      description: Number of candidates in the experiment.
                                    created_at:
                                      type: string
                                      description: Timestamp of when the experiment was created.
                                    id:
                                      type: string
                                      description: ID of the experiment.
                                    model_id:
                                      type: string
                                      description: ID of the model.
                                    name:
                                      type: string
                                      description: Name of the experiment.
                                    path:
                                      type: string
                                      description: Web URL of the experiment.
                                    updated_at:
                                      type: string
                                      description: Timestamp of when the experiment was updated.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
components:
  x-stackQL-resources:
    ml_experiment:
      id: gitlab.ml.ml_experiment
      name: ml_experiment
      title: Ml Experiment
      methods:
        get:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=ml_experiment&method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.mlExperiment
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/ml_experiment/methods/get'
        insert: []
        update: []
        delete: []
    project_ml_experiments:
      id: gitlab.ml.project_ml_experiments
      name: project_ml_experiments
      title: Project Ml Experiments
      methods:
        list:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=project_ml_experiments&method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.project.mlExperiments.nodes
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/project_ml_experiments/methods/list'
        insert: []
        update: []
        delete: []
