openapi: 3.0.3
info:
  title: snippets API
  description: 'Snippets - instance and project snippets. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=project_snippets&method=list:
    post:
      operationId: project_snippets_list
      summary: Snippets of the project.
      description: Snippets of the project. Generated from the GitLab GraphQL schema field Project.snippets (connection of Snippet nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.snippets'
        url: https://docs.gitlab.com/api/graphql/reference/#projectsnippets
      x-stackQL-graphQL:
        id: gitlab.snippets.project_snippets.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.snippets.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.snippets.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.snippets.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { snippets(first: 100{{ .cursor }}{{ if .visibility }}, visibility: {{ .visibility }}{{ end }}) { nodes { created_at: createdAt description file_name: fileName hidden http_url_to_repo: httpUrlToRepo id imported imported_from: importedFrom raw_url: rawUrl ssh_url_to_repo: sshUrlToRepo title updated_at: updatedAt visibility_level: visibilityLevel web_url: webUrl author { id username name } project { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: visibility
          in: query
          required: false
          description: Visibility of the snippet.
          schema:
            type: string
            enum:
              - private
              - internal
              - public
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          snippets:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    created_at:
                                      type: string
                                      description: Timestamp the snippet was created.
                                    description:
                                      type: string
                                      description: Description of the snippet.
                                    file_name:
                                      type: string
                                      description: File Name of the snippet.
                                    hidden:
                                      type: boolean
                                      description: Indicates the snippet is hidden because the author has been banned.
                                    http_url_to_repo:
                                      type: string
                                      description: HTTP URL to the snippet repository.
                                    id:
                                      type: string
                                      description: ID of the snippet.
                                    imported:
                                      type: boolean
                                      description: Indicates whether the snippet was imported.
                                    imported_from:
                                      type: string
                                      enum:
                                        - NONE
                                        - GITLAB_MIGRATION
                                        - GITLAB_PROJECT
                                        - GITLAB_GROUP
                                        - GITHUB
                                        - BITBUCKET
                                        - BITBUCKET_SERVER
                                        - FOGBUGZ
                                        - GITEA
                                        - GIT
                                        - MANIFEST
                                        - CUSTOM_TEMPLATE
                                        - JIRA
                                        - OFFLINE_TRANSFER
                                      description: Import source of the snippet.
                                    raw_url:
                                      type: string
                                      description: Raw URL of the snippet.
                                    ssh_url_to_repo:
                                      type: string
                                      description: SSH URL to the snippet repository.
                                    title:
                                      type: string
                                      description: Title of the snippet.
                                    updated_at:
                                      type: string
                                      description: Timestamp the snippet was updated.
                                    visibility_level:
                                      type: string
                                      enum:
                                        - private
                                        - internal
                                        - public
                                      description: Visibility Level of the snippet.
                                    web_url:
                                      type: string
                                      description: Web URL of the snippet.
                                    author:
                                      type: object
                                      description: UserCore identity (id, username, name)
                                      properties:
                                        id:
                                          type: string
                                        username:
                                          type: string
                                        name:
                                          type: string
                                    project:
                                      type: object
                                      description: Project identity (id, full_path, name)
                                      properties:
                                        id:
                                          type: string
                                        full_path:
                                          type: string
                                        name:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=snippets&method=list:
    post:
      operationId: snippets_list
      summary: Find Snippets visible to the current user.
      description: Find Snippets visible to the current user. Generated from the GitLab GraphQL schema field Query.snippets (connection of Snippet nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.snippets'
        url: https://docs.gitlab.com/api/graphql/reference/#querysnippets
      x-stackQL-graphQL:
        id: gitlab.snippets.snippets.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.snippets.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.snippets.pageInfo.endCursor
          terminateOnJsonPath: $.data.snippets.pageInfo.hasNextPage
        query: 'query { snippets(first: 100{{ .cursor }}{{ if .author_id }}, authorId: "{{ .author_id }}"{{ end }}{{ if .explore }}, explore: {{ .explore }}{{ end }}{{ if .project_id }}, projectId: "{{ .project_id }}"{{ end }}{{ if .type }}, type: {{ .type }}{{ end }}{{ if .visibility }}, visibility: {{ .visibility }}{{ end }}) { nodes { created_at: createdAt description file_name: fileName hidden http_url_to_repo: httpUrlToRepo id imported imported_from: importedFrom raw_url: rawUrl ssh_url_to_repo: sshUrlToRepo title updated_at: updatedAt visibility_level: visibilityLevel web_url: webUrl author { id username name } project { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: author_id
          in: query
          required: false
          description: ID of an author.
          schema:
            type: string
        - name: explore
          in: query
          required: false
          description: Explore personal snippets.
          schema:
            type: boolean
        - name: project_id
          in: query
          required: false
          description: ID of a project.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Type of snippet.
          schema:
            type: string
            enum:
              - personal
              - project
        - name: visibility
          in: query
          required: false
          description: Visibility of the snippet.
          schema:
            type: string
            enum:
              - private
              - internal
              - public
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      snippets:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                created_at:
                                  type: string
                                  description: Timestamp the snippet was created.
                                description:
                                  type: string
                                  description: Description of the snippet.
                                file_name:
                                  type: string
                                  description: File Name of the snippet.
                                hidden:
                                  type: boolean
                                  description: Indicates the snippet is hidden because the author has been banned.
                                http_url_to_repo:
                                  type: string
                                  description: HTTP URL to the snippet repository.
                                id:
                                  type: string
                                  description: ID of the snippet.
                                imported:
                                  type: boolean
                                  description: Indicates whether the snippet was imported.
                                imported_from:
                                  type: string
                                  enum:
                                    - NONE
                                    - GITLAB_MIGRATION
                                    - GITLAB_PROJECT
                                    - GITLAB_GROUP
                                    - GITHUB
                                    - BITBUCKET
                                    - BITBUCKET_SERVER
                                    - FOGBUGZ
                                    - GITEA
                                    - GIT
                                    - MANIFEST
                                    - CUSTOM_TEMPLATE
                                    - JIRA
                                    - OFFLINE_TRANSFER
                                  description: Import source of the snippet.
                                raw_url:
                                  type: string
                                  description: Raw URL of the snippet.
                                ssh_url_to_repo:
                                  type: string
                                  description: SSH URL to the snippet repository.
                                title:
                                  type: string
                                  description: Title of the snippet.
                                updated_at:
                                  type: string
                                  description: Timestamp the snippet was updated.
                                visibility_level:
                                  type: string
                                  enum:
                                    - private
                                    - internal
                                    - public
                                  description: Visibility Level of the snippet.
                                web_url:
                                  type: string
                                  description: Web URL of the snippet.
                                author:
                                  type: object
                                  description: UserCore identity (id, username, name)
                                  properties:
                                    id:
                                      type: string
                                    username:
                                      type: string
                                    name:
                                      type: string
                                project:
                                  type: object
                                  description: Project identity (id, full_path, name)
                                  properties:
                                    id:
                                      type: string
                                    full_path:
                                      type: string
                                    name:
                                      type: string
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
components:
  x-stackQL-resources:
    project_snippets:
      id: gitlab.snippets.project_snippets
      name: project_snippets
      title: Project Snippets
      methods:
        list:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=project_snippets&method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.project.snippets.nodes
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/project_snippets/methods/list'
        insert: []
        update: []
        delete: []
    snippets:
      id: gitlab.snippets.snippets
      name: snippets
      title: Snippets
      methods:
        list:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=snippets&method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.snippets.nodes
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/snippets/methods/list'
        insert: []
        update: []
        delete: []
