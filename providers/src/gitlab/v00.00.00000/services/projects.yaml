  /api/graphql?resource=project_available_deploy_keys&method=list:
    post:
      operationId: project_available_deploy_keys_list
      summary: List of available deploy keys
      description: List of available deploy keys Generated from the GitLab GraphQL schema field Project.availableDeployKeys (connection of AccessLevelDeployKey nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.availableDeployKeys'
        url: https://docs.gitlab.com/api/graphql/reference/#projectavailabledeploykeys
      x-stackQL-graphQL:
        id: gitlab.projects.project_available_deploy_keys.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.availableDeployKeys.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.availableDeployKeys.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.availableDeployKeys.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { availableDeployKeys(first: 100{{ .cursor }}{{ if .title_query }}, titleQuery: "{{ .title_query }}"{{ end }}) { nodes { expires_at: expiresAt id title user { id username name } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: title_query
          in: query
          required: false
          description: Term by which to search deploy key titles.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          availableDeployKeys:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    expires_at:
                                      type: string
                                      description: Expiration date of the deploy key.
                                    id:
                                      type: string
                                      description: ID of the deploy key.
                                    title:
                                      type: string
                                      description: Title of the deploy key.
                                    user:
                                      type: object
                                      description: AccessLevelUser identity (id, username, name)
                                      properties:
                                        id:
                                          type: string
                                        username:
                                          type: string
                                        name:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
