            type: string
        - name: end_date
          in: query
          required: false
          description: List timelogs within a date range where the logged date is equal to or before endDate.
          schema:
            type: string
        - name: end_time
          in: query
          required: false
          description: List timelogs within a time range where the logged time is equal to or before endTime.
