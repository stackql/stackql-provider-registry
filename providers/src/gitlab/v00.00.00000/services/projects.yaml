  /api/graphql?resource=project_alert_management_http_integrations&method=list:
    post:
      operationId: project_alert_management_http_integrations_list
      summary: HTTP Integrations which can receive alerts for the project.
      description: HTTP Integrations which can receive alerts for the project. Generated from the GitLab GraphQL schema field Project.alertManagementHttpIntegrations (connection of AlertManagementHttpIntegration nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.alertManagementHttpIntegrations'
        url: https://docs.gitlab.com/api/graphql/reference/#projectalertmanagementhttpintegrations
      x-stackQL-graphQL:
        id: gitlab.projects.project_alert_management_http_integrations.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.alertManagementHttpIntegrations.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.alertManagementHttpIntegrations.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.alertManagementHttpIntegrations.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { alertManagementHttpIntegrations(first: 100{{ .cursor }}{{ if .id }}, id: "{{ .id }}"{{ end }}) { nodes { active id name payload_example: payloadExample token type url } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: id
          in: query
          required: false
          description: ID of the integration.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          alertManagementHttpIntegrations:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    active:
                                      type: boolean
                                      description: Whether the endpoint is currently accepting alerts.
                                    id:
                                      type: string
                                      description: ID of the integration.
                                    name:
                                      type: string
                                      description: Name of the integration.
                                    payload_example:
                                      type: string
                                      description: Example of an alert payload.
                                    token:
                                      type: string
                                      description: Token used to authenticate alert notification requests.
                                    type:
                                      type: string
