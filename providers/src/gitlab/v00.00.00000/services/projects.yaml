          strategy: page_info
          jsonPath: $.data.project.timelogs.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.timelogs.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { timelogs(first: 100{{ .cursor }}{{ if .end_date }}, endDate: "{{ .end_date }}"{{ end }}{{ if .end_time }}, endTime: "{{ .end_time }}"{{ end }}{{ if .group_id }}, groupId: "{{ .group_id }}"{{ end }}{{ if .project_id }}, projectId: "{{ .project_id }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}{{ if .start_date }}, startDate: "{{ .start_date }}"{{ end }}{{ if .start_time }}, startTime: "{{ .start_time }}"{{ end }}{{ if .username }}, username: "{{ .username }}"{{ end }}) { nodes { id spent_at: spentAt summary time_spent: timeSpent user { id username name } project { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } } }'
