openapi: 3.0.3
info:
  title: projects API
  description: 'Projects and project-scoped configuration - project details, forks, topics, labels, milestones, releases, environments, deployments, branch rules, repository and statistics. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=milestone&method=get:
    post:
      operationId: milestone_get
      summary: Find a milestone.
      description: Find a milestone. Generated from the GitLab GraphQL schema field Query.milestone (Milestone).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.milestone'
        url: https://docs.gitlab.com/api/graphql/reference/#querymilestone
      x-stackQL-graphQL:
        id: gitlab.projects.milestone.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { milestone(id: "{{ .id }}") { created_at: createdAt description due_date: dueDate expired group_milestone: groupMilestone id iid project_milestone: projectMilestone start_date: startDate state subgroup_milestone: subgroupMilestone title upcoming updated_at: updatedAt web_path: webPath group_: group { id full_path: fullPath name } project { id full_path: fullPath name } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: Find a milestone by its ID.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      milestone:
                        type: object
                        properties:
                          created_at:
                            type: string
                            description: Timestamp of milestone creation.
                          description:
                            type: string
                            description: Description of the milestone.
                          due_date:
                            type: string
                            description: Timestamp of the milestone due date.
                          expired:
                            type: boolean
                            description: Expired state of the milestone (a milestone is expired when the due date is past the current date). Defaults to `false` when due date has not been set.
                          group_milestone:
                            type: boolean
                            description: Indicates if milestone is at group level.
                          id:
                            type: string
                            description: ID of the milestone.
                          iid:
                            type: string
                            description: Internal ID of the milestone.
                          project_milestone:
                            type: boolean
                            description: Indicates if milestone is at project level.
                          start_date:
                            type: string
                            description: Timestamp of the milestone start date.
                          state:
                            type: string
                            enum:
                              - active
                              - closed
                            description: State of the milestone.
                          subgroup_milestone:
                            type: boolean
                            description: Indicates if milestone is at subgroup level.
                          title:
                            type: string
                            description: Title of the milestone.
                          upcoming:
                            type: boolean
                            description: Upcoming state of the milestone (a milestone is upcoming when the start date is in the future). Defaults to `false` when start date has not been set.
                          updated_at:
                            type: string
                            description: Timestamp of last milestone update.
                          web_path:
                            type: string
                            description: Web path of the milestone.
                          group_:
                            type: object
                            description: Group identity (id, full_path, name)
                            properties:
                              id:
                                type: string
                              full_path:
                                type: string
                              name:
                                type: string
                          project:
                            type: object
                            description: Project identity (id, full_path, name)
                            properties:
                              id:
                                type: string
                              full_path:
                                type: string
                              name:
                                type: string
  /api/graphql?resource=project_agent_configurations&method=list:
    post:
      operationId: project_agent_configurations_list
      summary: Agent configurations defined by the project
      description: Agent configurations defined by the project Generated from the GitLab GraphQL schema field Project.agentConfigurations (connection of AgentConfiguration nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.agentConfigurations'
        url: https://docs.gitlab.com/api/graphql/reference/#projectagentconfigurations
      x-stackQL-graphQL:
        id: gitlab.projects.project_agent_configurations.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.agentConfigurations.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.agentConfigurations.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.agentConfigurations.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { agentConfigurations(first: 100{{ .cursor }}) { nodes { agent_name: agentName } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          agentConfigurations:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    agent_name:
                                      type: string
                                      description: Name of the agent.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=project_alert_management_alert_status_counts&method=get:
    post:
      operationId: project_alert_management_alert_status_counts_get
      summary: Counts of alerts by status for the project.
      description: Counts of alerts by status for the project. Generated from the GitLab GraphQL schema field Project.alertManagementAlertStatusCounts (AlertManagementAlertStatusCountsType).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.alertManagementAlertStatusCounts'
        url: https://docs.gitlab.com/api/graphql/reference/#projectalertmanagementalertstatuscounts
      x-stackQL-graphQL:
        id: gitlab.projects.project_alert_management_alert_status_counts.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { project(fullPath: "{{ .full_path }}") { alertManagementAlertStatusCounts{{ if or .assignee_username .search }}({{ if .assignee_username }}, assigneeUsername: "{{ .assignee_username }}"{{ end }}{{ if .search }}, search: "{{ .search }}"{{ end }}){{ end }} { acknowledged all_: all ignored open resolved triggered } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: assignee_username
          in: query
          required: false
          description: Username of a user assigned to the issue.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Search query for title, description, service, or monitoring_tool.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          alertManagementAlertStatusCounts:
                            type: object
                            properties:
                              acknowledged:
                                type: integer
                                description: Number of alerts with status ACKNOWLEDGED for the project
                              all_:
                                type: integer
                                description: Total number of alerts for the project.
                              ignored:
                                type: integer
                                description: Number of alerts with status IGNORED for the project
                              open:
                                type: integer
                                description: Number of alerts with status TRIGGERED or ACKNOWLEDGED for the project.
                              resolved:
                                type: integer
                                description: Number of alerts with status RESOLVED for the project
                              triggered:
                                type: integer
                                description: Number of alerts with status TRIGGERED for the project
  /api/graphql?resource=project_alert_management_alert&method=get:
    post:
      operationId: project_alert_management_alert_get
      summary: A single Alert Management alert of the project.
      description: A single Alert Management alert of the project. Generated from the GitLab GraphQL schema field Project.alertManagementAlert (AlertManagementAlert).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.alertManagementAlert'
        url: https://docs.gitlab.com/api/graphql/reference/#projectalertmanagementalert
      x-stackQL-graphQL:
        id: gitlab.projects.project_alert_management_alert.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { project(fullPath: "{{ .full_path }}") { alertManagementAlert{{ if or .assignee_username .domain .iid .search .sort }}({{ if .assignee_username }}, assigneeUsername: "{{ .assignee_username }}"{{ end }}{{ if .domain }}, domain: {{ .domain }}{{ end }}{{ if .iid }}, iid: "{{ .iid }}"{{ end }}{{ if .search }}, search: "{{ .search }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}){{ end }} { created_at: createdAt description details details_url: detailsUrl ended_at: endedAt event_count: eventCount hosts id iid monitoring_tool: monitoringTool name runbook service severity started_at: startedAt status title updated_at: updatedAt web_url: webUrl } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: assignee_username
          in: query
          required: false
          description: Username of a user assigned to the issue.
          schema:
            type: string
        - name: domain
          in: query
          required: false
          description: Filter query for given domain.
          schema:
            type: string
            enum:
              - operations
        - name: iid
          in: query
          required: false
          description: IID of the alert. For example, "1".
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Search query for title, description, service, or monitoring_tool.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort alerts by the criteria.
          schema:
            type: string
            enum:
              - STARTED_AT_ASC
              - STARTED_AT_DESC
              - ENDED_AT_ASC
              - ENDED_AT_DESC
              - CREATED_TIME_ASC
              - CREATED_TIME_DESC
              - UPDATED_TIME_ASC
              - UPDATED_TIME_DESC
              - EVENT_COUNT_ASC
              - EVENT_COUNT_DESC
              - SEVERITY_ASC
              - SEVERITY_DESC
              - STATUS_ASC
              - STATUS_DESC
              - UPDATED_DESC
              - UPDATED_ASC
              - CREATED_DESC
              - CREATED_ASC
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          alertManagementAlert:
                            type: object
                            properties:
                              created_at:
                                type: string
                                description: Timestamp the alert was created.
                              description:
                                type: string
                                description: Description of the alert.
                              details:
                                type: string
                                description: Alert details.
                              details_url:
                                type: string
                                description: URL of the alert detail page.
                              ended_at:
                                type: string
                                description: Timestamp the alert ended.
                              event_count:
                                type: integer
                                description: Number of events of the alert.
                              hosts:
                                type: array
                                items:
                                  type: string
                                  description: List of hosts the alert came from.
                              id:
                                type: string
                                description: ID of the alert.
                              iid:
                                type: string
                                description: Internal ID of the alert.
                              monitoring_tool:
                                type: string
                                description: Monitoring tool the alert came from.
                              name:
                                type: string
                                description: Name or title of the object.
                              runbook:
                                type: string
                                description: Runbook for the alert as defined in alert details.
                              service:
                                type: string
                                description: Service the alert came from.
                              severity:
                                type: string
                                enum:
                                  - CRITICAL
                                  - HIGH
                                  - MEDIUM
                                  - LOW
                                  - INFO
                                  - UNKNOWN
                                description: Severity of the alert.
                              started_at:
                                type: string
                                description: Timestamp the alert was raised.
                              status:
                                type: string
                                enum:
                                  - TRIGGERED
                                  - ACKNOWLEDGED
                                  - RESOLVED
                                  - IGNORED
                                description: Status of the alert.
                              title:
                                type: string
                                description: Title of the alert.
                              updated_at:
                                type: string
                                description: Timestamp the alert was last updated.
                              web_url:
                                type: string
                                description: URL of the alert.
  /api/graphql?resource=project_alert_management_alerts&method=list:
