openapi: 3.0.3
info:
  title: boards API
  description: 'Issue and epic boards - project, group and instance boards and board lists. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=board_list&method=get:
    post:
      operationId: board_list_get
      summary: Find an issue board list.
      description: Find an issue board list. Generated from the GitLab GraphQL schema field Query.boardList (BoardList).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.boardList'
        url: https://docs.gitlab.com/api/graphql/reference/#queryboardlist
      x-stackQL-graphQL:
        id: gitlab.boards.board_list.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { boardList(id: "{{ .id }}") { collapsed id issues_count: issuesCount limit_metric: limitMetric list_type: listType max_issue_count: maxIssueCount max_issue_weight: maxIssueWeight position title total_issue_weight: totalIssueWeight milestone { id title } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: Global ID of the list.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      boardList:
                        type: object
                        properties:
                          collapsed:
                            type: boolean
                            description: Indicates if the list is collapsed for the user.
                          id:
                            type: string
                            description: ID (global ID) of the list.
                          issues_count:
                            type: integer
                            description: Count of issues in the list.
                          limit_metric:
                            type: string
                            enum:
                              - all_metrics
                              - issue_count
                              - issue_weights
                            description: Current limit metric for the list.
                          list_type:
                            type: string
                            description: Type of the list.
                          max_issue_count:
                            type: integer
                            description: Maximum number of issues in the list.
                          max_issue_weight:
                            type: integer
                            description: Maximum weight of issues in the list.
                          position:
                            type: integer
                            description: Position of list within the board.
                          title:
                            type: string
                            description: Title of the list.
                          total_issue_weight:
                            type: string
                            description: Total weight of all issues in the list, encoded as a string.
                          milestone:
                            type: object
                            description: Milestone identity (id, title)
                            properties:
                              id:
                                type: string
                              title:
                                type: string
  /api/graphql?resource=epic_board_list&method=get:
    post:
      operationId: epic_board_list_get
      summary: get epic_board_list
      description: get epic_board_list Generated from the GitLab GraphQL schema field Query.epicBoardList (EpicList).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.epicBoardList'
        url: https://docs.gitlab.com/api/graphql/reference/#queryepicboardlist
      x-stackQL-graphQL:
        id: gitlab.boards.epic_board_list.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { epicBoardList(id: "{{ .id }}") { collapsed id list_type: listType position title } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: Global ID of the list.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      epicBoardList:
                        type: object
                        properties:
                          collapsed:
                            type: boolean
                            description: Indicates if the list is collapsed for the user.
                          id:
                            type: string
                            description: Global ID of the board list.
                          list_type:
                            type: string
                            description: Type of the list.
                          position:
                            type: integer
                            description: Position of the list within the board.
                          title:
                            type: string
                            description: Title of the list.
  /api/graphql?resource=group_board&method=get:
    post:
      operationId: group_board_get
      summary: A single board of the group.
      description: A single board of the group. Generated from the GitLab GraphQL schema field Group.board (Board).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.board'
        url: https://docs.gitlab.com/api/graphql/reference/#groupboard
      x-stackQL-graphQL:
        id: gitlab.boards.group_board.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { group(fullPath: "{{ .full_path }}") { board(id: "{{ .id }}") { created_at: createdAt hide_backlog_list: hideBacklogList hide_closed_list: hideClosedList id name updated_at: updatedAt web_path: webPath web_url: webUrl weight milestone { id title } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: id
          in: query
          required: true
          description: ID of the board.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          board:
                            type: object
                            properties:
                              created_at:
                                type: string
                                description: Timestamp of when the board was created.
                              hide_backlog_list:
                                type: boolean
                                description: Whether or not backlog list is hidden.
                              hide_closed_list:
                                type: boolean
                                description: Whether or not closed list is hidden.
                              id:
                                type: string
                                description: ID (global ID) of the board.
                              name:
                                type: string
                                description: Name of the board.
                              updated_at:
                                type: string
                                description: Timestamp of when the board was last updated.
                              web_path:
                                type: string
                                description: Web path of the board.
                              web_url:
                                type: string
                                description: Web URL of the board.
                              weight:
                                type: integer
                                description: Weight of the board.
                              milestone:
                                type: object
                                description: Milestone identity (id, title)
                                properties:
                                  id:
                                    type: string
                                  title:
                                    type: string
