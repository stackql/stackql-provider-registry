      description: Scan Execution Policies of the namespace. Generated from the GitLab GraphQL schema field Group.scanExecutionPolicies (connection of ScanExecutionPolicy nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.scanExecutionPolicies'
        url: https://docs.gitlab.com/api/graphql/reference/#groupscanexecutionpolicies
      x-stackQL-graphQL:
