  /api/graphql?resource=project_security_scanners&method=get:
    post:
      operationId: project_security_scanners_get
      summary: Information about security analyzers used in the project.
      description: Information about security analyzers used in the project. Generated from the GitLab GraphQL schema field Project.securityScanners (SecurityScanners).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.securityScanners'
        url: https://docs.gitlab.com/api/graphql/reference/#projectsecurityscanners
      x-stackQL-graphQL:
        id: gitlab.security.project_security_scanners.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { project(fullPath: "{{ .full_path }}") { securityScanners { available enabled pipeline_run: pipelineRun } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          securityScanners:
                            type: object
                            properties:
                              available:
                                type: array
                                items:
                                  type: string
                                  enum:
                                    - SAST
                                    - SAST_ADVANCED
                                    - SAST_IAC
                                    - DAST
                                    - DEPENDENCY_SCANNING
                                    - CONTAINER_SCANNING
                                    - SECRET_DETECTION
                                    - COVERAGE_FUZZING
                                    - API_FUZZING
                                    - CLUSTER_IMAGE_SCANNING
                                  description: List of analyzers which are available for the project.
                              enabled:
                                type: array
                                items:
                                  type: string
                                  enum:
                                    - SAST
                                    - SAST_ADVANCED
                                    - SAST_IAC
                                    - DAST
                                    - DEPENDENCY_SCANNING
                                    - CONTAINER_SCANNING
                                    - SECRET_DETECTION
                                    - COVERAGE_FUZZING
                                    - API_FUZZING
                                    - CLUSTER_IMAGE_SCANNING
                                  description: List of analyzers which are enabled for the project.
                              pipeline_run:
                                type: array
                                items:
                                  type: string
                                  enum:
                                    - SAST
                                    - SAST_ADVANCED
                                    - SAST_IAC
                                    - DAST
                                    - DEPENDENCY_SCANNING
                                    - CONTAINER_SCANNING
                                    - SECRET_DETECTION
                                    - COVERAGE_FUZZING
                                    - API_FUZZING
                                    - CLUSTER_IMAGE_SCANNING
                                  description: List of analyzers which ran successfully in the latest pipeline.
  /api/graphql?resource=project_vulnerabilities_count_by_day&method=list:
    post:
      operationId: project_vulnerabilities_count_by_day_list
      summary: The historical number of vulnerabilities per day for the project.
      description: The historical number of vulnerabilities per day for the project. Generated from the GitLab GraphQL schema field Project.vulnerabilitiesCountByDay (connection of VulnerabilitiesCountByDay nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.vulnerabilitiesCountByDay'
        url: https://docs.gitlab.com/api/graphql/reference/#projectvulnerabilitiescountbyday
      x-stackQL-graphQL:
        id: gitlab.security.project_vulnerabilities_count_by_day.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.vulnerabilitiesCountByDay.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.vulnerabilitiesCountByDay.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.vulnerabilitiesCountByDay.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { vulnerabilitiesCountByDay(first: 100{{ .cursor }}, endDate: "{{ .end_date }}", startDate: "{{ .start_date }}") { nodes { critical date high info low medium total unknown } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: end_date
          in: query
          required: true
          description: Last day for which to fetch vulnerability history.
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          description: First day for which to fetch vulnerability history.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          vulnerabilitiesCountByDay:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    critical:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with critical severity
                                    date:
                                      type: string
                                      description: Date for the count.
                                    high:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with high severity
                                    info:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with info severity
                                    low:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with low severity
                                    medium:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with medium severity
                                    total:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day.
                                    unknown:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with unknown severity
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=project_vulnerabilities&method=list:
    post:
      operationId: project_vulnerabilities_list
      summary: Vulnerabilities reported on the project.
      description: Vulnerabilities reported on the project. Generated from the GitLab GraphQL schema field Project.vulnerabilities (connection of Vulnerability nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.vulnerabilities'
        url: https://docs.gitlab.com/api/graphql/reference/#projectvulnerabilities
      x-stackQL-graphQL:
        id: gitlab.security.project_vulnerabilities.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.vulnerabilities.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.vulnerabilities.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.vulnerabilities.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { vulnerabilities(first: 100{{ .cursor }}{{ if .has_ai_resolution }}, hasAiResolution: {{ .has_ai_resolution }}{{ end }}{{ if .has_issues }}, hasIssues: {{ .has_issues }}{{ end }}{{ if .has_merge_request }}, hasMergeRequest: {{ .has_merge_request }}{{ end }}{{ if .has_remediations }}, hasRemediations: {{ .has_remediations }}{{ end }}{{ if .has_resolution }}, hasResolution: {{ .has_resolution }}{{ end }}{{ if .identifier_name }}, identifierName: "{{ .identifier_name }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}) { nodes { ai_resolution_available: aiResolutionAvailable ai_resolution_enabled: aiResolutionEnabled confirmed_at: confirmedAt description detected_at: detectedAt dismissal_reason: dismissalReason dismissed_at: dismissedAt false_positive: falsePositive has_remediations: hasRemediations id name present_on_default_branch: presentOnDefaultBranch removed_from_code: removedFromCode report_type: reportType resolved_at: resolvedAt resolved_on_default_branch: resolvedOnDefaultBranch severity solution state state_comment: stateComment title unverified updated_at: updatedAt user_notes_count: userNotesCount uuid vulnerability_path: vulnerabilityPath web_url: webUrl project { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: has_ai_resolution
          in: query
          required: false
          description: Returns only the vulnerabilities which can likely be resolved by GitLab Duo Vulnerability Resolution.
          schema:
            type: boolean
        - name: has_issues
          in: query
          required: false
          description: Returns only the vulnerabilities which have linked issues.
          schema:
            type: boolean
        - name: has_merge_request
          in: query
          required: false
          description: Returns only the vulnerabilities which have linked merge requests.
          schema:
            type: boolean
        - name: has_remediations
          in: query
          required: false
          description: Returns only the vulnerabilities which have remediations.
          schema:
            type: boolean
        - name: has_resolution
          in: query
          required: false
          description: Returns only the vulnerabilities which have been resolved on default branch.
          schema:
            type: boolean
        - name: identifier_name
          in: query
          required: false
          description: Filter vulnerabilities by identifier name. Ignored when applied on instance security dashboard queries.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: List vulnerabilities by sort order.
          schema:
            type: string
            enum:
              - severity_desc
              - severity_asc
              - detected_desc
              - detected_asc
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          vulnerabilities:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    ai_resolution_available:
                                      type: boolean
                                      description: Indicates whether the type of vulnerability can be resolved with AI.
                                    ai_resolution_enabled:
                                      type: boolean
                                      description: Indicates whether the specific vulnerability can be resolved with AI.
                                    confirmed_at:
                                      type: string
                                      description: Timestamp of when the vulnerability state was changed to confirmed.
                                    description:
                                      type: string
                                      description: Description of the vulnerability.
                                    detected_at:
                                      type: string
                                      description: Timestamp of when the vulnerability was first detected.
                                    dismissal_reason:
                                      type: string
                                      enum:
                                        - ACCEPTABLE_RISK
                                        - FALSE_POSITIVE
                                        - MITIGATING_CONTROL
                                        - USED_IN_TESTS
                                        - NOT_APPLICABLE
                                      description: Reason for dismissal. Returns `null` for states other than `dismissed`.
                                    dismissed_at:
                                      type: string
                                      description: Timestamp of when the vulnerability state was changed to dismissed.
                                    false_positive:
                                      type: boolean
                                      description: Indicates whether the vulnerability is a false positive.
                                    has_remediations:
                                      type: boolean
                                      description: Indicates whether there is a remediation available for the vulnerability.
                                    id:
                                      type: string
                                      description: GraphQL ID of the vulnerability.
                                    name:
                                      type: string
                                      description: Name or title of the object.
                                    present_on_default_branch:
                                      type: boolean
                                      description: Indicates whether the vulnerability is present on the default branch or not.
                                    removed_from_code:
                                      type: boolean
                                      description: Indicates whether the vulnerability is present in the code or not.
                                    report_type:
                                      type: string
                                      enum:
                                        - SAST
                                        - DEPENDENCY_SCANNING
                                        - CONTAINER_SCANNING
                                        - DAST
                                        - SECRET_DETECTION
                                        - COVERAGE_FUZZING
                                        - API_FUZZING
                                        - CLUSTER_IMAGE_SCANNING
                                        - CONTAINER_SCANNING_FOR_REGISTRY
                                        - SARIF
                                        - GENERIC
                                      description: Type of the security report that found the vulnerability (SAST, DEPENDENCY_SCANNING, CONTAINER_SCANNING, DAST, SECRET_DETECTION, COVERAGE_FUZZING, API_FUZZING, CLUSTER_IMAGE_SCANNING, CONTAINER_SCANNING_FOR_REGISTRY, SARIF, GENERIC). `Scan Type` in the UI.
                                    resolved_at:
                                      type: string
                                      description: Timestamp of when the vulnerability state was changed to resolved.
                                    resolved_on_default_branch:
                                      type: boolean
                                      description: Indicates whether the vulnerability is fixed on the default branch or not.
                                    severity:
                                      type: string
                                      enum:
                                        - INFO
                                        - UNKNOWN
                                        - LOW
                                        - MEDIUM
                                        - HIGH
                                        - CRITICAL
                                      description: Severity of the vulnerability (INFO, UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL)
                                    solution:
                                      type: string
                                      description: Recommended solution for the vulnerability.
                                    state:
                                      type: string
                                      enum:
                                        - CONFIRMED
                                        - DETECTED
                                        - DISMISSED
                                        - RESOLVED
                                      description: State of the vulnerability (DETECTED, CONFIRMED, RESOLVED, DISMISSED)
                                    state_comment:
                                      type: string
                                      description: Comment given for the vulnerability state change.
                                    title:
                                      type: string
                                      description: Title of the vulnerability.
                                    unverified:
                                      type: boolean
                                      description: Indicates whether the finding was detected without an identified source (untrusted input).
                                    updated_at:
                                      type: string
                                      description: Timestamp of when the vulnerability was last updated.
                                    user_notes_count:
                                      type: integer
                                      description: Number of user notes attached to the vulnerability.
                                    uuid:
                                      type: string
                                      description: UUID of the vulnerability finding. Can be used to look up the associated security report finding.
                                    vulnerability_path:
                                      type: string
                                      description: Path to the vulnerability's details page.
                                    web_url:
                                      type: string
                                      description: URL to the vulnerability's details page.
                                    project:
                                      type: object
                                      description: Project identity (id, full_path, name)
                                      properties:
                                        id:
                                          type: string
                                        full_path:
                                          type: string
                                        name:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=project_vulnerability_images&method=list:
    post:
