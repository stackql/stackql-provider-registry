          schema:
            type: boolean
        - name: include_unscoped
          in: query
          required: false
          description: Filter policies that are scoped to the project.
          schema:
            type: boolean
        - name: relationship
          in: query
          required: false
          description: Filter policies by the given policy relationship. Default is DIRECT.
          schema:
            type: string
            enum:
              - DIRECT
              - INHERITED
              - INHERITED_ONLY
              - DESCENDANT
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          scanExecutionPolicies:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    description:
                                      type: string
                                      description: Description of the policy.
                                    edit_path:
                                      type: string
                                      description: URL of policy edit page.
                                    enabled:
                                      type: boolean
                                      description: Indicates whether the policy is enabled.
                                    name:
                                      type: string
                                      description: Name of the policy.
                                    updated_at:
                                      type: string
                                      description: Timestamp of when the policy YAML was last updated.
                                    yaml:
                                      type: string
                                      description: YAML definition of the policy.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_security_policy_project_suggestions&method=list:
    post:
      operationId: group_security_policy_project_suggestions_list
      summary: Security policy project suggestions
      description: Security policy project suggestions Generated from the GitLab GraphQL schema field Group.securityPolicyProjectSuggestions (connection of Project nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.securityPolicyProjectSuggestions'
        url: https://docs.gitlab.com/api/graphql/reference/#groupsecuritypolicyprojectsuggestions
      x-stackQL-graphQL:
        id: gitlab.security.group_security_policy_project_suggestions.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.securityPolicyProjectSuggestions.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.securityPolicyProjectSuggestions.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.securityPolicyProjectSuggestions.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { securityPolicyProjectSuggestions(first: 100{{ .cursor }}, search: "{{ .search }}"{{ if .only_linked }}, onlyLinked: {{ .only_linked }}{{ end }}) { nodes { actual_repository_size_limit: actualRepositorySizeLimit admin_edit_path: adminEditPath admin_show_path: adminShowPath allow_merge_on_skipped_pipeline: allowMergeOnSkippedPipeline allows_multiple_merge_request_assignees: allowsMultipleMergeRequestAssignees allows_multiple_merge_request_reviewers: allowsMultipleMergeRequestReviewers archived autoclose_referenced_issues: autocloseReferencedIssues avatar_url: avatarUrl ci_config_path_or_default: ciConfigPathOrDefault container_registry_enabled: containerRegistryEnabled container_scanning_for_registry_enabled: containerScanningForRegistryEnabled created_at: createdAt description edit_path: editPath forks_count: forksCount full_path: fullPath has_jira_vulnerability_issue_creation_enabled: hasJiraVulnerabilityIssueCreationEnabled http_url_to_repo: httpUrlToRepo id import_status: importStatus is_forked: isForked issues_enabled: issuesEnabled jira_import_status: jiraImportStatus jobs_enabled: jobsEnabled last_activity_at: lastActivityAt lfs_enabled: lfsEnabled merge_commit_template: mergeCommitTemplate merge_request_title_regex: mergeRequestTitleRegex merge_request_title_regex_description: mergeRequestTitleRegexDescription merge_requests_disable_committers_approval: mergeRequestsDisableCommittersApproval merge_requests_enabled: mergeRequestsEnabled merge_requests_ff_only_enabled: mergeRequestsFfOnlyEnabled name name_with_namespace: nameWithNamespace only_allow_merge_if_all_discussions_are_resolved: onlyAllowMergeIfAllDiscussionsAreResolved only_allow_merge_if_all_status_checks_passed: onlyAllowMergeIfAllStatusChecksPassed only_allow_merge_if_pipeline_succeeds: onlyAllowMergeIfPipelineSucceeds open_issues_count: openIssuesCount open_merge_requests_count: openMergeRequestsCount pages_force_https: pagesForceHttps pages_use_unique_domain: pagesUseUniqueDomain path pre_receive_secret_detection_enabled: preReceiveSecretDetectionEnabled prevent_merge_without_jira_issue_enabled: preventMergeWithoutJiraIssueEnabled printing_merge_request_link_enabled: printingMergeRequestLinkEnabled public_jobs: publicJobs remove_source_branch_after_merge: removeSourceBranchAfterMerge repository_size_excess: repositorySizeExcess request_access_enabled: requestAccessEnabled secret_push_protection_enabled: secretPushProtectionEnabled security_configuration_path: securityConfigurationPath security_dashboard_path: securityDashboardPath service_desk_address: serviceDeskAddress service_desk_enabled: serviceDeskEnabled shared_runners_enabled: sharedRunnersEnabled snippets_enabled: snippetsEnabled squash_commit_template: squashCommitTemplate squash_read_only: squashReadOnly ssh_url_to_repo: sshUrlToRepo star_count: starCount suggestion_commit_message: suggestionCommitMessage topics updated_at: updatedAt visibility web_path: webPath web_url: webUrl wiki_enabled: wikiEnabled namespace { id full_path: fullPath name } group_: group { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: search
          in: query
          required: true
          description: Search query for projects' full paths.
          schema:
            type: string
        - name: only_linked
          in: query
          required: false
          description: Whether to suggest only projects already linked as security policy projects.
          schema:
            type: boolean
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          securityPolicyProjectSuggestions:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    actual_repository_size_limit:
                                      type: number
                                      description: Size limit for the repository in bytes.
                                    admin_edit_path:
                                      type: string
                                      description: Admin path for editing project. Only available to admins.
                                    admin_show_path:
                                      type: string
                                      description: Admin path of the project. Only available to admins.
                                    allow_merge_on_skipped_pipeline:
                                      type: boolean
                                      description: If `only_allow_merge_if_pipeline_succeeds` is true, indicates if merge requests of the project can also be merged with skipped jobs.
                                    allows_multiple_merge_request_assignees:
                                      type: boolean
                                      description: Project allows assigning multiple users to a merge request.
                                    allows_multiple_merge_request_reviewers:
                                      type: boolean
                                      description: Project allows assigning multiple reviewers to a merge request.
                                    archived:
                                      type: boolean
                                      description: Indicates if the project or any ancestor is archived.
                                    autoclose_referenced_issues:
                                      type: boolean
                                      description: Indicates if issues referenced by merge requests and commits within the default branch are closed automatically.
                                    avatar_url:
                                      type: string
                                      description: Avatar URL of the project.
                                    ci_config_path_or_default:
                                      type: string
                                      description: Path of the CI configuration file.
                                    container_registry_enabled:
                                      type: boolean
                                      description: Indicates if Container registry is enabled for the current user
                                    container_scanning_for_registry_enabled:
                                      type: boolean
                                      description: Indicates whether container scanning for registry is enabled or not for the project. Returns `null` if unauthorized.
                                    created_at:
                                      type: string
