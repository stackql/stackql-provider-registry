      summary: The historical number of vulnerabilities per day for the projects in the group and its subgroups.
      description: The historical number of vulnerabilities per day for the projects in the group and its subgroups. Generated from the GitLab GraphQL schema field Group.vulnerabilitiesCountByDay (connection of VulnerabilitiesCountByDay nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.vulnerabilitiesCountByDay'
        url: https://docs.gitlab.com/api/graphql/reference/#groupvulnerabilitiescountbyday
      x-stackQL-graphQL:
        id: gitlab.security.group_vulnerabilities_count_by_day.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.vulnerabilitiesCountByDay.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.vulnerabilitiesCountByDay.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.vulnerabilitiesCountByDay.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { vulnerabilitiesCountByDay(first: 100{{ .cursor }}, endDate: "{{ .end_date }}", startDate: "{{ .start_date }}") { nodes { critical date high info low medium total unknown } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: end_date
          in: query
          required: true
          description: Last day for which to fetch vulnerability history.
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          description: First day for which to fetch vulnerability history.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          vulnerabilitiesCountByDay:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    critical:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with critical severity
                                    date:
                                      type: string
                                      description: Date for the count.
                                    high:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with high severity
                                    info:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with info severity
                                    low:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with low severity
                                    medium:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with medium severity
                                    total:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day.
                                    unknown:
                                      type: integer
                                      description: Total number of vulnerabilities on a particular day with unknown severity
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
