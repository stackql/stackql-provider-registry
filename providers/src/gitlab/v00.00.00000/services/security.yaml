        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { group(fullPath: "{{ .full_path }}") { vulnerabilitySeveritiesCount{{ if or .capped .has_ai_resolution .has_issues .has_merge_request .has_remediations .has_resolution }}({{ if .capped }}, capped: {{ .capped }}{{ end }}{{ if .has_ai_resolution }}, hasAiResolution: {{ .has_ai_resolution }}{{ end }}{{ if .has_issues }}, hasIssues: {{ .has_issues }}{{ end }}{{ if .has_merge_request }}, hasMergeRequest: {{ .has_merge_request }}{{ end }}{{ if .has_remediations }}, hasRemediations: {{ .has_remediations }}{{ end }}{{ if .has_resolution }}, hasResolution: {{ .has_resolution }}{{ end }}){{ end }} { critical high info low medium unknown } } }'
