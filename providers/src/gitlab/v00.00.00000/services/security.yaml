      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: capped
          in: query
          required: false
          description: Default value is false. When set to true, the count returned for each severity is capped at a maximum of 1001. Ignored when used along with any argument that requires advanced vulnerability management.
          schema:
            type: boolean
        - name: has_ai_resolution
          in: query
          required: false
          description: Filters vulnerabilities which can or can not be resolved by GitLab Duo Vulnerability Resolution.
          schema:
            type: boolean
        - name: has_issues
          in: query
          required: false
          description: Filter vulnerabilities that do or do not have issues.
          schema:
            type: boolean
        - name: has_merge_request
          in: query
          required: false
          description: Filter vulnerabilities that do or do not have a merge request.
          schema:
            type: boolean
        - name: has_remediations
          in: query
          required: false
          description: Filter vulnerabilities that do or do not have remediations.
          schema:
            type: boolean
        - name: has_resolution
          in: query
          required: false
          description: Filter vulnerabilities that do or do not have a resolution.
          schema:
            type: boolean
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          vulnerabilitySeveritiesCount:
                            type: object
                            properties:
                              critical:
                                type: integer
                                description: Number of vulnerabilities of CRITICAL severity of the project
                              high:
                                type: integer
                                description: Number of vulnerabilities of HIGH severity of the project
                              info:
                                type: integer
                                description: Number of vulnerabilities of INFO severity of the project
