  /api/graphql?resource=vulnerability&method=get:
    post:
      operationId: vulnerability_get
      summary: Find a vulnerability.
      description: Find a vulnerability. Generated from the GitLab GraphQL schema field Query.vulnerability (Vulnerability).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.vulnerability'
        url: https://docs.gitlab.com/api/graphql/reference/#queryvulnerability
      x-stackQL-graphQL:
        id: gitlab.security.vulnerability.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { vulnerability(id: "{{ .id }}") { ai_resolution_available: aiResolutionAvailable ai_resolution_enabled: aiResolutionEnabled confirmed_at: confirmedAt description detected_at: detectedAt dismissal_reason: dismissalReason dismissed_at: dismissedAt false_positive: falsePositive has_remediations: hasRemediations id name present_on_default_branch: presentOnDefaultBranch removed_from_code: removedFromCode report_type: reportType resolved_at: resolvedAt resolved_on_default_branch: resolvedOnDefaultBranch severity solution state state_comment: stateComment title unverified updated_at: updatedAt user_notes_count: userNotesCount uuid vulnerability_path: vulnerabilityPath web_url: webUrl project { id full_path: fullPath name } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: Global ID of the Vulnerability.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      vulnerability:
                        type: object
                        properties:
                          ai_resolution_available:
                            type: boolean
                            description: Indicates whether the type of vulnerability can be resolved with AI.
                          ai_resolution_enabled:
                            type: boolean
                            description: Indicates whether the specific vulnerability can be resolved with AI.
                          confirmed_at:
                            type: string
                            description: Timestamp of when the vulnerability state was changed to confirmed.
                          description:
                            type: string
                            description: Description of the vulnerability.
                          detected_at:
                            type: string
                            description: Timestamp of when the vulnerability was first detected.
                          dismissal_reason:
                            type: string
                            enum:
                              - ACCEPTABLE_RISK
                              - FALSE_POSITIVE
                              - MITIGATING_CONTROL
                              - USED_IN_TESTS
                              - NOT_APPLICABLE
                            description: Reason for dismissal. Returns `null` for states other than `dismissed`.
                          dismissed_at:
                            type: string
                            description: Timestamp of when the vulnerability state was changed to dismissed.
                          false_positive:
                            type: boolean
                            description: Indicates whether the vulnerability is a false positive.
                          has_remediations:
                            type: boolean
                            description: Indicates whether there is a remediation available for the vulnerability.
                          id:
                            type: string
                            description: GraphQL ID of the vulnerability.
                          name:
                            type: string
                            description: Name or title of the object.
                          present_on_default_branch:
                            type: boolean
                            description: Indicates whether the vulnerability is present on the default branch or not.
                          removed_from_code:
                            type: boolean
                            description: Indicates whether the vulnerability is present in the code or not.
                          report_type:
                            type: string
                            enum:
                              - SAST
                              - DEPENDENCY_SCANNING
                              - CONTAINER_SCANNING
                              - DAST
                              - SECRET_DETECTION
                              - COVERAGE_FUZZING
                              - API_FUZZING
                              - CLUSTER_IMAGE_SCANNING
                              - CONTAINER_SCANNING_FOR_REGISTRY
                              - SARIF
                              - GENERIC
                            description: Type of the security report that found the vulnerability (SAST, DEPENDENCY_SCANNING, CONTAINER_SCANNING, DAST, SECRET_DETECTION, COVERAGE_FUZZING, API_FUZZING, CLUSTER_IMAGE_SCANNING, CONTAINER_SCANNING_FOR_REGISTRY, SARIF, GENERIC). `Scan Type` in the UI.
                          resolved_at:
                            type: string
                            description: Timestamp of when the vulnerability state was changed to resolved.
                          resolved_on_default_branch:
                            type: boolean
                            description: Indicates whether the vulnerability is fixed on the default branch or not.
                          severity:
                            type: string
                            enum:
                              - INFO
                              - UNKNOWN
                              - LOW
                              - MEDIUM
                              - HIGH
                              - CRITICAL
                            description: Severity of the vulnerability (INFO, UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL)
                          solution:
                            type: string
                            description: Recommended solution for the vulnerability.
                          state:
                            type: string
                            enum:
                              - CONFIRMED
                              - DETECTED
                              - DISMISSED
                              - RESOLVED
                            description: State of the vulnerability (DETECTED, CONFIRMED, RESOLVED, DISMISSED)
                          state_comment:
                            type: string
                            description: Comment given for the vulnerability state change.
                          title:
                            type: string
                            description: Title of the vulnerability.
                          unverified:
                            type: boolean
                            description: Indicates whether the finding was detected without an identified source (untrusted input).
                          updated_at:
                            type: string
                            description: Timestamp of when the vulnerability was last updated.
                          user_notes_count:
                            type: integer
                            description: Number of user notes attached to the vulnerability.
                          uuid:
                            type: string
                            description: UUID of the vulnerability finding. Can be used to look up the associated security report finding.
                          vulnerability_path:
                            type: string
                            description: Path to the vulnerability's details page.
                          web_url:
                            type: string
                            description: URL to the vulnerability's details page.
                          project:
                            type: object
                            description: Project identity (id, full_path, name)
                            properties:
                              id:
                                type: string
                              full_path:
                                type: string
                              name:
                                type: string
