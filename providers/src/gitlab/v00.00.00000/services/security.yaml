openapi: 3.0.3
info:
  title: security API
  description: 'Security and compliance - vulnerabilities, vulnerability statistics and scanners, security policies, dependencies (SBOM), DAST profiles and compliance frameworks. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=dependency&method=get:
    post:
      operationId: dependency_get
      summary: Find a dependency.
      description: Find a dependency. Generated from the GitLab GraphQL schema field Query.dependency (Dependency).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.dependency'
        url: https://docs.gitlab.com/api/graphql/reference/#querydependency
      x-stackQL-graphQL:
        id: gitlab.security.dependency.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { dependency(id: "{{ .id }}") { id name packager reachability vulnerability_count: vulnerabilityCount } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: Global ID of the Dependency.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      dependency:
                        type: object
                        properties:
                          id:
                            type: string
                            description: ID of the dependency.
                          name:
                            type: string
                            description: Name of the dependency.
                          packager:
                            type: string
                            enum:
                              - BUNDLER
                              - YARN
                              - NPM
                              - PNPM
                              - BUN
                              - MAVEN
                              - COMPOSER
                              - PIP
                              - CONAN
                              - GO
                              - NUGET
                              - SBT
                              - GRADLE
                              - PIPENV
                              - POETRY
                              - SETUPTOOLS
                              - APK
                              - CONDA
                              - PUB
                              - CARGO
                            description: Description of the tool used to manage the dependency.
                          reachability:
                            type: string
                            enum:
                              - UNKNOWN
                              - IN_USE
                              - NOT_FOUND
                            description: Information about reachability of a dependency.
                          vulnerability_count:
                            type: integer
                            description: Number of vulnerabilities within the dependency.
  /api/graphql?resource=group_approval_policies&method=list:
    post:
      operationId: group_approval_policies_list
      summary: Approval Policies of the project
      description: Approval Policies of the project Generated from the GitLab GraphQL schema field Group.approvalPolicies (connection of ApprovalPolicy nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.approvalPolicies'
        url: https://docs.gitlab.com/api/graphql/reference/#groupapprovalpolicies
      x-stackQL-graphQL:
        id: gitlab.security.group_approval_policies.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.approvalPolicies.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.approvalPolicies.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.approvalPolicies.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { approvalPolicies(first: 100{{ .cursor }}{{ if .deduplicate_policies }}, deduplicatePolicies: {{ .deduplicate_policies }}{{ end }}{{ if .include_unscoped }}, includeUnscoped: {{ .include_unscoped }}{{ end }}{{ if .relationship }}, relationship: {{ .relationship }}{{ end }}) { nodes { description edit_path: editPath enabled enforcement_type: enforcementType name role_approvers: roleApprovers updated_at: updatedAt yaml } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: deduplicate_policies
          in: query
          required: false
          description: Remove duplicate policies when the same policy is applied via multiple routes.
          schema:
            type: boolean
        - name: include_unscoped
          in: query
          required: false
          description: Filter policies that are scoped to the project.
          schema:
            type: boolean
        - name: relationship
          in: query
          required: false
          description: Filter policies by the given policy relationship. Default is DIRECT.
          schema:
            type: string
            enum:
              - DIRECT
              - INHERITED
              - INHERITED_ONLY
              - DESCENDANT
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          approvalPolicies:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    description:
                                      type: string
                                      description: Description of the policy.
                                    edit_path:
                                      type: string
                                      description: URL of policy edit page.
                                    enabled:
                                      type: boolean
                                      description: Indicates whether the policy is enabled.
                                    enforcement_type:
                                      type: string
                                      enum:
                                        - ENFORCE
                                        - WARN
                                      description: Enforcement type of the policy. Can be "enforce" or "warn".
                                    name:
                                      type: string
                                      description: Name of the policy.
                                    role_approvers:
                                      type: array
                                      items:
                                        type: string
                                        enum:
                                          - GUEST
                                          - PLANNER
                                          - REPORTER
                                          - SECURITY_MANAGER
                                          - DEVELOPER
                                          - MAINTAINER
                                          - OWNER
                                        description: Approvers of the role type. Users belonging to these role(s) alone will be approvers.
                                    updated_at:
                                      type: string
                                      description: Timestamp of when the policy YAML was last updated.
                                    yaml:
                                      type: string
                                      description: YAML definition of the policy.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_compliance_frameworks&method=list:
    post:
      operationId: group_compliance_frameworks_list
      summary: Compliance frameworks available to projects in this namespace.
      description: Compliance frameworks available to projects in this namespace. Generated from the GitLab GraphQL schema field Group.complianceFrameworks (connection of ComplianceFramework nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.complianceFrameworks'
        url: https://docs.gitlab.com/api/graphql/reference/#groupcomplianceframeworks
      x-stackQL-graphQL:
        id: gitlab.security.group_compliance_frameworks.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.complianceFrameworks.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.complianceFrameworks.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.complianceFrameworks.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { complianceFrameworks(first: 100{{ .cursor }}{{ if .id }}, id: "{{ .id }}"{{ end }}{{ if .search }}, search: "{{ .search }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}) { nodes { color default_: default description edit_path: editPath id name namespace_id: namespaceId updated_at: updatedAt } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: id
          in: query
          required: false
          description: Global ID of a specific compliance framework to return.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Search framework with most similar names.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort compliance frameworks by the criteria.
          schema:
            type: string
            enum:
              - NAME_ASC
              - NAME_DESC
              - UPDATED_AT_ASC
              - UPDATED_AT_DESC
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          complianceFrameworks:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    color:
                                      type: string
                                      description: Hexadecimal representation of compliance framework's label color.
                                    default_:
                                      type: boolean
                                      description: Default compliance framework for the group.
                                    description:
                                      type: string
                                      description: Description of the compliance framework.
                                    edit_path:
                                      type: string
                                      description: Web UI path to edit the compliance framework.
                                    id:
                                      type: string
                                      description: Compliance framework ID.
                                    name:
                                      type: string
                                      description: Name of the compliance framework.
                                    namespace_id:
                                      type: string
                                      description: Namespace ID.
                                    updated_at:
                                      type: string
                                      description: Timestamp of when the compliance framework was last updated.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_dependencies&method=list:
    post:
      operationId: group_dependencies_list
      summary: Software dependencies used by projects under this group.
      description: Software dependencies used by projects under this group. Generated from the GitLab GraphQL schema field Group.dependencies (connection of Dependency nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.dependencies'
        url: https://docs.gitlab.com/api/graphql/reference/#groupdependencies
      x-stackQL-graphQL:
        id: gitlab.security.group_dependencies.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.dependencies.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.dependencies.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.dependencies.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { dependencies(first: 100{{ .cursor }}{{ if .sort }}, sort: {{ .sort }}{{ end }}) { nodes { id name packager reachability vulnerability_count: vulnerabilityCount } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort dependencies by given criteria.
          schema:
            type: string
            enum:
              - NAME_DESC
              - NAME_ASC
              - PACKAGER_DESC
              - PACKAGER_ASC
              - SEVERITY_DESC
              - SEVERITY_ASC
              - LICENSE_ASC
              - LICENSE_DESC
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          dependencies:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: ID of the dependency.
                                    name:
                                      type: string
                                      description: Name of the dependency.
                                    packager:
                                      type: string
                                      enum:
                                        - BUNDLER
                                        - YARN
                                        - NPM
                                        - PNPM
                                        - BUN
                                        - MAVEN
                                        - COMPOSER
                                        - PIP
                                        - CONAN
                                        - GO
                                        - NUGET
                                        - SBT
                                        - GRADLE
                                        - PIPENV
                                        - POETRY
                                        - SETUPTOOLS
                                        - APK
                                        - CONDA
                                        - PUB
                                        - CARGO
                                      description: Description of the tool used to manage the dependency.
                                    reachability:
                                      type: string
                                      enum:
                                        - UNKNOWN
                                        - IN_USE
                                        - NOT_FOUND
                                      description: Information about reachability of a dependency.
                                    vulnerability_count:
                                      type: integer
                                      description: Number of vulnerabilities within the dependency.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_project_compliance_standards_adherence&method=list:
    post:
      operationId: group_project_compliance_standards_adherence_list
      summary: Compliance standards adherence for the projects in a group and its subgroups.
      description: Compliance standards adherence for the projects in a group and its subgroups. Generated from the GitLab GraphQL schema field Group.projectComplianceStandardsAdherence (connection of ComplianceStandardsAdherence nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.projectComplianceStandardsAdherence'
        url: https://docs.gitlab.com/api/graphql/reference/#groupprojectcompliancestandardsadherence
      x-stackQL-graphQL:
        id: gitlab.security.group_project_compliance_standards_adherence.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.projectComplianceStandardsAdherence.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.projectComplianceStandardsAdherence.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.projectComplianceStandardsAdherence.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { projectComplianceStandardsAdherence(first: 100{{ .cursor }}) { nodes { check_name: checkName id standard status updated_at: updatedAt project { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          projectComplianceStandardsAdherence:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    check_name:
                                      type: string
                                      enum:
                                        - PREVENT_APPROVAL_BY_MERGE_REQUEST_AUTHOR
                                        - PREVENT_APPROVAL_BY_MERGE_REQUEST_COMMITTERS
                                        - AT_LEAST_TWO_APPROVALS
                                        - AT_LEAST_ONE_NON_AUTHOR_APPROVAL
                                        - SAST
                                        - DAST
                                      description: Name of the check for the compliance standard.
                                    id:
                                      type: string
                                      description: Compliance standards adherence ID.
                                    standard:
                                      type: string
                                      enum:
                                        - GITLAB
                                        - SOC2
                                      description: Name of the compliance standard.
                                    status:
                                      type: string
                                      enum:
                                        - SUCCESS
                                        - FAIL
                                      description: Status of the compliance standards adherence.
                                    updated_at:
                                      type: string
                                      description: Timestamp when the adherence was updated.
                                    project:
                                      type: object
                                      description: Project identity (id, full_path, name)
                                      properties:
                                        id:
                                          type: string
                                        full_path:
                                          type: string
                                        name:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_scan_execution_policies&method=list:
    post:
