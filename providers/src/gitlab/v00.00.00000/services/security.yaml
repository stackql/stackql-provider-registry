          terminateOnJsonPath: $.data.group.scanExecutionPolicies.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { scanExecutionPolicies(first: 100{{ .cursor }}{{ if .deduplicate_policies }}, deduplicatePolicies: {{ .deduplicate_policies }}{{ end }}{{ if .include_unscoped }}, includeUnscoped: {{ .include_unscoped }}{{ end }}{{ if .relationship }}, relationship: {{ .relationship }}{{ end }}) { nodes { description edit_path: editPath enabled name updated_at: updatedAt yaml } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: deduplicate_policies
          in: query
