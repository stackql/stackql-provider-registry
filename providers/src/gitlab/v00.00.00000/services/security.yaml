    post:
      operationId: group_vulnerabilities_list
      summary: Vulnerabilities reported on the projects in the group and its subgroups.
      description: Vulnerabilities reported on the projects in the group and its subgroups. Generated from the GitLab GraphQL schema field Group.vulnerabilities (connection of Vulnerability nodes).
