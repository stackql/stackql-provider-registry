openapi: 3.0.3
info:
  title: admin API
  description: 'Administration - Geo nodes, license history, subscription entries and billable user previews. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=geo_node&method=get:
    post:
      operationId: geo_node_get
      summary: Find a Geo node.
      description: Find a Geo node. Generated from the GitLab GraphQL schema field Query.geoNode (GeoNode).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.geoNode'
        url: https://docs.gitlab.com/api/graphql/reference/#querygeonode
      x-stackQL-graphQL:
        id: gitlab.admin.geo_node.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { geoNode{{ if or .name }}({{ if .name }}, name: "{{ .name }}"{{ end }}){{ end }} { container_repositories_max_capacity: containerRepositoriesMaxCapacity enabled files_max_capacity: filesMaxCapacity id internal_url: internalUrl minimum_reverification_interval: minimumReverificationInterval name primary_: primary repos_max_capacity: reposMaxCapacity selective_sync_shards: selectiveSyncShards selective_sync_type: selectiveSyncType sync_object_storage: syncObjectStorage url verification_max_capacity: verificationMaxCapacity } }'
      x-stackql-protocol: graphql
      parameters:
        - name: name
          in: query
          required: false
          description: Name of the Geo node. Defaults to the current Geo node name.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      geoNode:
                        type: object
                        properties:
                          container_repositories_max_capacity:
                            type: integer
                            description: Maximum concurrency of container repository sync for the secondary node.
                          enabled:
                            type: boolean
                            description: Indicates whether the Geo node is enabled.
                          files_max_capacity:
                            type: integer
                            description: Maximum concurrency of LFS/attachment backfill for the secondary node.
                          id:
                            type: string
                            description: ID of the GeoNode.
                          internal_url:
                            type: string
                            description: URL defined on the primary node secondary nodes should use to contact it.
                          minimum_reverification_interval:
                            type: integer
                            description: Interval (in days) in which the repository verification is valid. After expiry, it is reverted.
                          name:
                            type: string
                            description: Unique identifier for the Geo node.
                          primary_:
                            type: boolean
                            description: Indicates whether the Geo node is the primary.
                          repos_max_capacity:
                            type: integer
                            description: Maximum concurrency of repository backfill for the secondary node.
                          selective_sync_shards:
                            type: array
                            items:
                              type: string
                              description: Repository storages whose projects should be synced, if `selective_sync_type` == `shards`.
                          selective_sync_type:
                            type: string
                            description: Indicates if syncing is limited to only specific groups, or shards.
                          sync_object_storage:
                            type: boolean
                            description: Indicates if the secondary node will replicate blobs in Object Storage.
                          url:
                            type: string
                            description: User-facing URL for the Geo node.
                          verification_max_capacity:
                            type: integer
                            description: Maximum concurrency of repository verification for the secondary node.
  /api/graphql?resource=group_gitlab_subscriptions_preview_billable_user_change&method=get:
    post:
      operationId: group_gitlab_subscriptions_preview_billable_user_change_get
      summary: Preview Billable User Changes
      description: Preview Billable User Changes Generated from the GitLab GraphQL schema field Group.gitlabSubscriptionsPreviewBillableUserChange (PreviewBillableUserChange).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.gitlabSubscriptionsPreviewBillableUserChange'
        url: https://docs.gitlab.com/api/graphql/reference/#groupgitlabsubscriptionspreviewbillableuserchange
      x-stackQL-graphQL:
        id: gitlab.admin.group_gitlab_subscriptions_preview_billable_user_change.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { group(fullPath: "{{ .full_path }}") { gitlabSubscriptionsPreviewBillableUserChange(role: {{ .role }}{{ if .add_group_id }}, addGroupId: {{ .add_group_id }}{{ end }}{{ if .member_role_id }}, memberRoleId: {{ .member_role_id }}{{ end }}) { new_billable_user_count: newBillableUserCount seats_in_subscription: seatsInSubscription will_increase_overage: willIncreaseOverage } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: role
          in: query
          required: true
          description: Role of users being added to group.
          schema:
            type: string
            enum:
              - GUEST
              - PLANNER
              - REPORTER
              - SECURITY_MANAGER
              - DEVELOPER
              - MAINTAINER
              - OWNER
        - name: add_group_id
          in: query
          required: false
          description: Group ID to add.
          schema:
            type: integer
        - name: member_role_id
          in: query
          required: false
          description: Custom role assigned to the users.
          schema:
            type: integer
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          gitlabSubscriptionsPreviewBillableUserChange:
                            type: object
                            properties:
                              new_billable_user_count:
                                type: integer
                                description: Total number of billable users after change.
                              seats_in_subscription:
                                type: integer
                                description: Number of seats in subscription.
                              will_increase_overage:
                                type: boolean
                                description: ' If the group will have an increased overage after change.'
  /api/graphql?resource=license_history_entries&method=list:
    post:
      operationId: license_history_entries_list
      summary: Fields related to entries in the license history.
      description: Fields related to entries in the license history. Generated from the GitLab GraphQL schema field Query.licenseHistoryEntries (connection of LicenseHistoryEntry nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.licenseHistoryEntries'
        url: https://docs.gitlab.com/api/graphql/reference/#querylicensehistoryentries
      x-stackQL-graphQL:
        id: gitlab.admin.license_history_entries.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.licenseHistoryEntries.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.licenseHistoryEntries.pageInfo.endCursor
          terminateOnJsonPath: $.data.licenseHistoryEntries.pageInfo.hasNextPage
        query: 'query { licenseHistoryEntries(first: 100{{ .cursor }}) { nodes { activated_at: activatedAt block_changes_at: blockChangesAt company created_at: createdAt email expires_at: expiresAt id name plan starts_at: startsAt type users_in_license_count: usersInLicenseCount } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      licenseHistoryEntries:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                activated_at:
                                  type: string
                                  description: Date when the license was activated.
                                block_changes_at:
                                  type: string
                                  description: Date when licensed features will be blocked.
                                company:
                                  type: string
                                  description: Company of the licensee.
                                created_at:
                                  type: string
                                  description: Date when the license was added.
                                email:
                                  type: string
                                  description: Email of the licensee.
                                expires_at:
                                  type: string
                                  description: Date when the license expires.
                                id:
                                  type: string
                                  description: ID of the license extracted from the license data.
                                name:
                                  type: string
                                  description: Name of the licensee.
                                plan:
                                  type: string
                                  description: Name of the subscription plan.
                                starts_at:
                                  type: string
                                  description: Date when the license started.
                                type:
                                  type: string
                                  description: Type of the license.
                                users_in_license_count:
                                  type: integer
                                  description: Number of paid users in the license.
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /api/graphql?resource=project_gitlab_subscriptions_preview_billable_user_change&method=get:
    post:
      operationId: project_gitlab_subscriptions_preview_billable_user_change_get
      summary: Preview Billable User Changes
      description: Preview Billable User Changes Generated from the GitLab GraphQL schema field Project.gitlabSubscriptionsPreviewBillableUserChange (PreviewBillableUserChange).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.gitlabSubscriptionsPreviewBillableUserChange'
        url: https://docs.gitlab.com/api/graphql/reference/#projectgitlabsubscriptionspreviewbillableuserchange
      x-stackQL-graphQL:
        id: gitlab.admin.project_gitlab_subscriptions_preview_billable_user_change.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { project(fullPath: "{{ .full_path }}") { gitlabSubscriptionsPreviewBillableUserChange(role: {{ .role }}{{ if .add_group_id }}, addGroupId: {{ .add_group_id }}{{ end }}{{ if .member_role_id }}, memberRoleId: {{ .member_role_id }}{{ end }}) { new_billable_user_count: newBillableUserCount seats_in_subscription: seatsInSubscription will_increase_overage: willIncreaseOverage } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: role
          in: query
          required: true
          description: Role of users being added to group.
          schema:
            type: string
            enum:
              - GUEST
              - PLANNER
              - REPORTER
              - SECURITY_MANAGER
              - DEVELOPER
              - MAINTAINER
              - OWNER
        - name: add_group_id
          in: query
          required: false
          description: Group ID to add.
          schema:
            type: integer
        - name: member_role_id
          in: query
          required: false
          description: Custom role assigned to the users.
          schema:
            type: integer
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          gitlabSubscriptionsPreviewBillableUserChange:
                            type: object
                            properties:
                              new_billable_user_count:
                                type: integer
                                description: Total number of billable users after change.
                              seats_in_subscription:
                                type: integer
                                description: Number of seats in subscription.
                              will_increase_overage:
                                type: boolean
                                description: ' If the group will have an increased overage after change.'
  /api/graphql?resource=subscription_future_entries&method=list:
    post:
      operationId: subscription_future_entries_list
      summary: Fields related to entries in future subscriptions.
      description: Fields related to entries in future subscriptions. Generated from the GitLab GraphQL schema field Query.subscriptionFutureEntries (connection of SubscriptionFutureEntry nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.subscriptionFutureEntries'
        url: https://docs.gitlab.com/api/graphql/reference/#querysubscriptionfutureentries
      x-stackQL-graphQL:
        id: gitlab.admin.subscription_future_entries.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.subscriptionFutureEntries.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.subscriptionFutureEntries.pageInfo.endCursor
          terminateOnJsonPath: $.data.subscriptionFutureEntries.pageInfo.hasNextPage
        query: 'query { subscriptionFutureEntries(first: 100{{ .cursor }}) { nodes { company email expires_at: expiresAt name plan starts_at: startsAt type users_in_license_count: usersInLicenseCount } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subscriptionFutureEntries:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                company:
                                  type: string
                                  description: Company of the licensee.
                                email:
                                  type: string
                                  description: Email of the licensee.
                                expires_at:
                                  type: string
                                  description: Date when the license expires.
                                name:
                                  type: string
                                  description: Name of the licensee.
                                plan:
                                  type: string
                                  description: Name of the subscription plan.
                                starts_at:
                                  type: string
                                  description: Date when the license started.
                                type:
                                  type: string
                                  description: Type of license the subscription will yield.
                                users_in_license_count:
                                  type: integer
                                  description: Number of paid user seats.
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
components:
  x-stackQL-resources:
    geo_node:
      id: gitlab.admin.geo_node
      name: geo_node
      title: Geo Node
      methods:
        get:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=geo_node&method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.geoNode
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/geo_node/methods/get'
        insert: []
        update: []
        delete: []
    group_gitlab_subscriptions_preview_billable_user_change:
      id: gitlab.admin.group_gitlab_subscriptions_preview_billable_user_change
      name: group_gitlab_subscriptions_preview_billable_user_change
      title: Group Gitlab Subscriptions Preview Billable User Change
      methods:
        get:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=group_gitlab_subscriptions_preview_billable_user_change&method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.group.gitlabSubscriptionsPreviewBillableUserChange
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/group_gitlab_subscriptions_preview_billable_user_change/methods/get'
        insert: []
        update: []
