      title: Subscription Future Entries
      methods:
        list:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=subscription_future_entries&method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.subscriptionFutureEntries.nodes
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/subscription_future_entries/methods/list'
        insert: []
        update: []
        delete: []
