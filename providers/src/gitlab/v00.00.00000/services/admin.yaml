      methods:
        list:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=license_history_entries&method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.licenseHistoryEntries.nodes
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/license_history_entries/methods/list'
        insert: []
        update: []
        delete: []
    project_gitlab_subscriptions_preview_billable_user_change:
      id: gitlab.admin.project_gitlab_subscriptions_preview_billable_user_change
      name: project_gitlab_subscriptions_preview_billable_user_change
      title: Project Gitlab Subscriptions Preview Billable User Change
      methods:
        get:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=project_gitlab_subscriptions_preview_billable_user_change&method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.project.gitlabSubscriptionsPreviewBillableUserChange
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/project_gitlab_subscriptions_preview_billable_user_change/methods/get'
        insert: []
