        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.doraPerformanceScoreCounts.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.doraPerformanceScoreCounts.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.doraPerformanceScoreCounts.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { doraPerformanceScoreCounts(first: 100{{ .cursor }}) { nodes { high_projects_count: highProjectsCount low_projects_count: lowProjectsCount medium_projects_count: mediumProjectsCount metric_name: metricName no_data_projects_count: noDataProjectsCount } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
