    post:
      operationId: usage_trends_measurements_list
      summary: Get statistics on the instance.
      description: Get statistics on the instance. Generated from the GitLab GraphQL schema field Query.usageTrendsMeasurements (connection of UsageTrendsMeasurement nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.usageTrendsMeasurements'
        url: https://docs.gitlab.com/api/graphql/reference/#queryusagetrendsmeasurements
      x-stackQL-graphQL:
        id: gitlab.analytics.usage_trends_measurements.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.usageTrendsMeasurements.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.usageTrendsMeasurements.pageInfo.endCursor
          terminateOnJsonPath: $.data.usageTrendsMeasurements.pageInfo.hasNextPage
        query: 'query { usageTrendsMeasurements(first: 100{{ .cursor }}, identifier: {{ .identifier }}{{ if .recorded_after }}, recordedAfter: "{{ .recorded_after }}"{{ end }}{{ if .recorded_before }}, recordedBefore: "{{ .recorded_before }}"{{ end }}) { nodes { count identifier recorded_at: recordedAt } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: identifier
          in: query
          required: true
          description: Type of measurement or statistics to retrieve.
          schema:
            type: string
            enum:
              - PROJECTS
              - USERS
              - ISSUES
              - MERGE_REQUESTS
              - GROUPS
              - PIPELINES
              - PIPELINES_SUCCEEDED
              - PIPELINES_FAILED
              - PIPELINES_CANCELED
              - PIPELINES_SKIPPED
        - name: recorded_after
          in: query
          required: false
          description: Measurement recorded after the date.
          schema:
            type: string
        - name: recorded_before
          in: query
          required: false
          description: Measurement recorded before the date.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      usageTrendsMeasurements:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                count:
                                  type: integer
                                  description: Object count.
                                identifier:
                                  type: string
                                  enum:
                                    - PROJECTS
                                    - USERS
                                    - ISSUES
                                    - MERGE_REQUESTS
                                    - GROUPS
                                    - PIPELINES
                                    - PIPELINES_SUCCEEDED
                                    - PIPELINES_FAILED
                                    - PIPELINES_CANCELED
                                    - PIPELINES_SKIPPED
                                  description: Type of objects being measured.
                                recorded_at:
                                  type: string
                                  description: Time the measurement was recorded.
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
