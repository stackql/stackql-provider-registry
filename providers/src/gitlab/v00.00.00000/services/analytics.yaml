            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          doraPerformanceScoreCounts:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    high_projects_count:
                                      type: integer
                                      description: Number of projects that score "high" on the metric.
                                    low_projects_count:
                                      type: integer
                                      description: Number of projects that score "low" on the metric.
                                    medium_projects_count:
                                      type: integer
                                      description: Number of projects that score "medium" on the metric.
                                    metric_name:
                                      type: string
                                      description: Name of the DORA metric.
                                    no_data_projects_count:
                                      type: integer
                                      description: Number of projects with no data for the metric.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_value_streams&method=list:
    post:
      operationId: group_value_streams_list
