            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          valueStreams:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: ID of the value stream.
                                    name:
                                      type: string
                                      description: Name of the value stream.
                                    namespace:
                                      type: object
                                      description: Namespace identity (id, full_path, name)
                                      properties:
                                        id:
                                          type: string
                                        full_path:
                                          type: string
                                        name:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=project_code_coverage_summary&method=get:
    post:
      operationId: project_code_coverage_summary_get
      summary: Code coverage summary associated with the project.
      description: Code coverage summary associated with the project. Generated from the GitLab GraphQL schema field Project.codeCoverageSummary (CodeCoverageSummary).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.codeCoverageSummary'
        url: https://docs.gitlab.com/api/graphql/reference/#projectcodecoveragesummary
      x-stackQL-graphQL:
        id: gitlab.analytics.project_code_coverage_summary.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { project(fullPath: "{{ .full_path }}") { codeCoverageSummary { average_coverage: averageCoverage coverage_count: coverageCount last_updated_on: lastUpdatedOn } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
