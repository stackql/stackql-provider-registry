openapi: 3.0.3
info:
  title: analytics API
  description: 'Analytics - usage trends, DevOps adoption, value streams, DORA performance scores, code coverage, contributions and customizable dashboards. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=custom_dashboard&method=get:
    post:
      operationId: custom_dashboard_get
      summary: Find a custom dashboard by ID.
      description: Find a custom dashboard by ID. Generated from the GitLab GraphQL schema field Query.customDashboard (CustomDashboard).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.customDashboard'
        url: https://docs.gitlab.com/api/graphql/reference/#querycustomdashboard
      x-stackQL-graphQL:
        id: gitlab.analytics.custom_dashboard.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { customDashboard(id: "{{ .id }}") { config created_at: createdAt description id lock_version: lockVersion name slug system updated_at: updatedAt namespace { id full_path: fullPath name } project { id full_path: fullPath name } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: Dashboard ID.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customDashboard:
                        type: object
                        properties:
                          config:
                            type: string
                            description: Dashboard layout and widget configuration.
                          created_at:
                            type: string
                            description: Timestamp when the dashboard was created.
                          description:
                            type: string
                            description: Optional summary or purpose of the dashboard.
                          id:
                            type: string
                            description: Global ID of the custom dashboard.
                          lock_version:
                            type: integer
                            description: Version used for optimistic concurrency control.
                          name:
                            type: string
                            description: Display name of the dashboard.
                          slug:
                            type: string
                            description: Dashboard url slug.
                          system:
                            type: boolean
                            description: Whether the dashboard is a built-in GitLab dashboard.
                          updated_at:
                            type: string
                            description: Timestamp when the dashboard was last updated.
                          namespace:
                            type: object
                            description: Namespace identity (id, full_path, name)
                            properties:
                              id:
                                type: string
                              full_path:
                                type: string
                              name:
                                type: string
                          project:
                            type: object
                            description: Project identity (id, full_path, name)
                            properties:
                              id:
                                type: string
                              full_path:
                                type: string
                              name:
                                type: string
  /api/graphql?resource=custom_system_dashboard&method=get:
    post:
      operationId: custom_system_dashboard_get
      summary: Find a GitLab-provided system dashboard by slug.
      description: Find a GitLab-provided system dashboard by slug. Generated from the GitLab GraphQL schema field Query.customSystemDashboard (CustomSystemDashboard).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.customSystemDashboard'
        url: https://docs.gitlab.com/api/graphql/reference/#querycustomsystemdashboard
      x-stackQL-graphQL:
        id: gitlab.analytics.custom_system_dashboard.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { customSystemDashboard(slug: "{{ .slug }}") { config created_at: createdAt description id name slug system } }'
      x-stackql-protocol: graphql
      parameters:
        - name: slug
          in: query
          required: true
          description: Slug of the system dashboard (e.g. "duo_and_sdlc_trends").
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customSystemDashboard:
                        type: object
                        properties:
                          config:
                            type: string
                            description: Dashboard layout and widget configuration.
                          created_at:
                            type: string
                            description: Timestamp when the dashboard was created.
                          description:
                            type: string
                            description: Optional summary or purpose of the dashboard.
                          id:
                            type: string
                            description: Global ID of the dashboard.
                          name:
                            type: string
                            description: Display name of the dashboard.
                          slug:
                            type: string
                            description: Dashboard url slug.
                          system:
                            type: boolean
                            description: Whether the dashboard is a built-in GitLab dashboard.
  /api/graphql?resource=devops_adoption_enabled_namespaces&method=list:
    post:
      operationId: devops_adoption_enabled_namespaces_list
      summary: 'Get configured DevOps adoption namespaces. **Status**: Beta. This endpoint is subject to change without notice.'
      description: 'Get configured DevOps adoption namespaces. **Status**: Beta. This endpoint is subject to change without notice. Generated from the GitLab GraphQL schema field Query.devopsAdoptionEnabledNamespaces (connection of DevopsAdoptionEnabledNamespace nodes).'
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.devopsAdoptionEnabledNamespaces'
        url: https://docs.gitlab.com/api/graphql/reference/#querydevopsadoptionenablednamespaces
      x-stackQL-graphQL:
        id: gitlab.analytics.devops_adoption_enabled_namespaces.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.devopsAdoptionEnabledNamespaces.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.devopsAdoptionEnabledNamespaces.pageInfo.endCursor
          terminateOnJsonPath: $.data.devopsAdoptionEnabledNamespaces.pageInfo.hasNextPage
        query: 'query { devopsAdoptionEnabledNamespaces(first: 100{{ .cursor }}{{ if .display_namespace_id }}, displayNamespaceId: "{{ .display_namespace_id }}"{{ end }}) { nodes { id namespace { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: display_namespace_id
          in: query
          required: false
          description: Filter by display namespace.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      devopsAdoptionEnabledNamespaces:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: ID of the enabled namespace.
                                namespace:
                                  type: object
                                  description: Namespace identity (id, full_path, name)
                                  properties:
                                    id:
                                      type: string
                                    full_path:
                                      type: string
                                    name:
                                      type: string
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /api/graphql?resource=group_code_coverage_activities&method=list:
    post:
      operationId: group_code_coverage_activities_list
      summary: Represents the code coverage activity for this group.
      description: Represents the code coverage activity for this group. Generated from the GitLab GraphQL schema field Group.codeCoverageActivities (connection of CodeCoverageActivity nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.codeCoverageActivities'
        url: https://docs.gitlab.com/api/graphql/reference/#groupcodecoverageactivities
      x-stackQL-graphQL:
        id: gitlab.analytics.group_code_coverage_activities.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.codeCoverageActivities.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.codeCoverageActivities.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.codeCoverageActivities.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { codeCoverageActivities(first: 100{{ .cursor }}, startDate: "{{ .start_date }}") { nodes { average_coverage: averageCoverage coverage_count: coverageCount date project_count: projectCount } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          description: First day for which to fetch code coverage activity (maximum time window is set to 90 days).
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          codeCoverageActivities:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    average_coverage:
                                      type: number
                                      description: Average percentage of the different code coverage results available for the group.
                                    coverage_count:
                                      type: integer
                                      description: Number of different code coverage results available for the group.
                                    date:
                                      type: string
                                      description: Date when the code coverage was created.
                                    project_count:
                                      type: integer
                                      description: Number of projects with code coverage results for the group.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_contributions&method=list:
    post:
      operationId: group_contributions_list
      summary: Provides the aggregated contributions by users within the group and its subgroups
      description: Provides the aggregated contributions by users within the group and its subgroups Generated from the GitLab GraphQL schema field Group.contributions (connection of ContributionAnalyticsContribution nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.contributions'
        url: https://docs.gitlab.com/api/graphql/reference/#groupcontributions
      x-stackQL-graphQL:
        id: gitlab.analytics.group_contributions.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.contributions.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.contributions.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.contributions.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { contributions(first: 100{{ .cursor }}, from: "{{ .from_ }}", to: "{{ .to_ }}") { nodes { issues_closed: issuesClosed issues_created: issuesCreated merge_requests_approved: mergeRequestsApproved merge_requests_closed: mergeRequestsClosed merge_requests_created: mergeRequestsCreated merge_requests_merged: mergeRequestsMerged repo_pushed: repoPushed total_events: totalEvents user { id username name } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: from_
          in: query
          required: true
          description: Start date of the reporting time range.
          schema:
            type: string
        - name: to_
          in: query
          required: true
          description: End date of the reporting time range. The end date must be within 93 days after the start date.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          contributions:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    issues_closed:
                                      type: integer
                                      description: Number of issues closed by the user.
                                    issues_created:
                                      type: integer
                                      description: Number of issues created by the user.
                                    merge_requests_approved:
                                      type: integer
                                      description: Number of merge requests approved by the user.
                                    merge_requests_closed:
                                      type: integer
                                      description: Number of merge requests closed by the user.
                                    merge_requests_created:
                                      type: integer
                                      description: Number of merge requests created by the user.
                                    merge_requests_merged:
                                      type: integer
                                      description: Number of merge requests merged by the user.
                                    repo_pushed:
                                      type: integer
                                      description: Number of repository pushes the user made.
                                    total_events:
                                      type: integer
                                      description: Total number of events contributed by the user.
                                    user:
                                      type: object
                                      description: UserCore identity (id, username, name)
                                      properties:
                                        id:
                                          type: string
                                        username:
                                          type: string
                                        name:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_customizable_dashboard_visualizations&method=list:
    post:
      operationId: group_customizable_dashboard_visualizations_list
      summary: Visualizations of the group or associated configuration project.
      description: Visualizations of the group or associated configuration project. Generated from the GitLab GraphQL schema field Group.customizableDashboardVisualizations (connection of CustomizableDashboardVisualization nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.customizableDashboardVisualizations'
        url: https://docs.gitlab.com/api/graphql/reference/#groupcustomizabledashboardvisualizations
      x-stackQL-graphQL:
        id: gitlab.analytics.group_customizable_dashboard_visualizations.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.customizableDashboardVisualizations.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.customizableDashboardVisualizations.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.customizableDashboardVisualizations.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { customizableDashboardVisualizations(first: 100{{ .cursor }}{{ if .slug }}, slug: "{{ .slug }}"{{ end }}) { nodes { data errors options slug type } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: slug
          in: query
          required: false
          description: Slug of the visualization to return.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          customizableDashboardVisualizations:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    data:
                                      type: string
                                      description: Data of the visualization.
                                    errors:
                                      type: array
                                      items:
                                        type: string
                                        description: Validation errors in the visualization.
                                    options:
                                      type: string
                                      description: Options of the visualization.
                                    slug:
                                      type: string
                                      description: Slug of the visualization.
                                    type:
                                      type: string
                                      description: Type of the visualization.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_customizable_dashboards&method=list:
    post:
      operationId: group_customizable_dashboards_list
      summary: Customizable dashboards for the group.
      description: Customizable dashboards for the group. Generated from the GitLab GraphQL schema field Group.customizableDashboards (connection of CustomizableDashboard nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.customizableDashboards'
        url: https://docs.gitlab.com/api/graphql/reference/#groupcustomizabledashboards
      x-stackQL-graphQL:
        id: gitlab.analytics.group_customizable_dashboards.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.customizableDashboards.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.customizableDashboards.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.customizableDashboards.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { customizableDashboards(first: 100{{ .cursor }}{{ if .category }}, category: {{ .category }}{{ end }}{{ if .slug }}, slug: "{{ .slug }}"{{ end }}) { nodes { category description errors filters slug title user_defined: userDefined } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Find by dashboard type.
          schema:
            type: string
            enum:
              - ANALYTICS
        - name: slug
          in: query
          required: false
          description: Find by dashboard slug.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          customizableDashboards:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    category:
                                      type: string
                                      enum:
                                        - ANALYTICS
                                      description: Category of dashboard.
                                    description:
                                      type: string
                                      description: Description of the dashboard.
                                    errors:
                                      type: array
                                      items:
                                        type: string
                                        description: Errors on yaml definition.
                                    filters:
                                      type: string
                                      description: Dashboard global filters.
                                    slug:
                                      type: string
                                      description: Slug of the dashboard.
                                    title:
                                      type: string
                                      description: Title of the dashboard.
                                    user_defined:
                                      type: boolean
                                      description: Indicates whether the dashboard is user-defined or provided by GitLab.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_dora_performance_score_counts&method=list:
    post:
      operationId: group_dora_performance_score_counts_list
      summary: Group's DORA scores for all projects by DORA key metric for the last complete month.
      description: Group's DORA scores for all projects by DORA key metric for the last complete month. Generated from the GitLab GraphQL schema field Group.doraPerformanceScoreCounts (connection of DoraPerformanceScoreCount nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.doraPerformanceScoreCounts'
        url: https://docs.gitlab.com/api/graphql/reference/#groupdoraperformancescorecounts
      x-stackQL-graphQL:
