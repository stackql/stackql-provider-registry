openapi: 3.0.3
info:
  title: packages API
  description: 'Packages and registries - packages, container repositories, container protection rules, dependency proxy and cleanup policies. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=container_repository&method=get:
    post:
      operationId: container_repository_get
      summary: Find a container repository.
      description: Find a container repository. Generated from the GitLab GraphQL schema field Query.containerRepository (ContainerRepositoryDetails).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.containerRepository'
        url: https://docs.gitlab.com/api/graphql/reference/#querycontainerrepository
      x-stackQL-graphQL:
        id: gitlab.packages.container_repository.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { containerRepository(id: "{{ .id }}") { created_at: createdAt expiration_policy_cleanup_status: expirationPolicyCleanupStatus expiration_policy_started_at: expirationPolicyStartedAt id last_cleanup_deleted_tags_count: lastCleanupDeletedTagsCount last_published_at: lastPublishedAt location name path protection_rule_exists: protectionRuleExists size status tags_count: tagsCount updated_at: updatedAt project { id full_path: fullPath name } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: Global ID of the container repository.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      containerRepository:
                        type: object
                        properties:
                          created_at:
                            type: string
                            description: Timestamp when the container repository was created.
                          expiration_policy_cleanup_status:
                            type: string
                            enum:
                              - UNSCHEDULED
                              - SCHEDULED
                              - UNFINISHED
                              - ONGOING
                            description: Tags cleanup status for the container repository.
                          expiration_policy_started_at:
                            type: string
                            description: Timestamp when the cleanup done by the expiration policy was started on the container repository.
                          id:
                            type: string
                            description: ID of the container repository.
                          last_cleanup_deleted_tags_count:
                            type: integer
                            description: Number of deleted tags from the last cleanup.
                          last_published_at:
                            type: string
                            description: Timestamp when a repository tag was last created or updated. Only present for repositories that had tags created or updated after GitLab 16.11.
                          location:
                            type: string
                            description: URL of the container repository.
                          name:
                            type: string
                            description: Name of the container repository.
                          path:
                            type: string
                            description: Path of the container repository.
                          protection_rule_exists:
                            type: boolean
                            description: Whether any matching container protection rule exists for the container repository.
                          size:
                            type: number
                            description: Deduplicated size of the image repository in bytes. This is only available on GitLab.com for repositories created after `2021-11-04`.
                          status:
                            type: string
                            enum:
                              - DELETE_SCHEDULED
                              - DELETE_FAILED
                              - DELETE_ONGOING
                            description: Status of the container repository.
                          tags_count:
                            type: integer
                            description: Number of tags associated with the image.
                          updated_at:
                            type: string
                            description: Timestamp when the container repository was updated.
                          project:
                            type: object
                            description: Project identity (id, full_path, name)
                            properties:
                              id:
                                type: string
                              full_path:
                                type: string
                              name:
                                type: string
  /api/graphql?resource=group_container_repositories&method=list:
    post:
      operationId: group_container_repositories_list
      summary: Container repositories of the group.
      description: Container repositories of the group. Generated from the GitLab GraphQL schema field Group.containerRepositories (connection of ContainerRepository nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.containerRepositories'
        url: https://docs.gitlab.com/api/graphql/reference/#groupcontainerrepositories
      x-stackQL-graphQL:
        id: gitlab.packages.group_container_repositories.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.containerRepositories.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.containerRepositories.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.containerRepositories.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { containerRepositories(first: 100{{ .cursor }}{{ if .name }}, name: "{{ .name }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}) { nodes { created_at: createdAt expiration_policy_cleanup_status: expirationPolicyCleanupStatus expiration_policy_started_at: expirationPolicyStartedAt id last_cleanup_deleted_tags_count: lastCleanupDeletedTagsCount location name path protection_rule_exists: protectionRuleExists status tags_count: tagsCount updated_at: updatedAt project { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Filter the container repositories by their name.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort container repositories by the criteria.
          schema:
            type: string
            enum:
              - NAME_ASC
              - NAME_DESC
              - UPDATED_DESC
              - UPDATED_ASC
              - CREATED_DESC
              - CREATED_ASC
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          containerRepositories:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    created_at:
                                      type: string
                                      description: Timestamp when the container repository was created.
                                    expiration_policy_cleanup_status:
                                      type: string
                                      enum:
                                        - UNSCHEDULED
                                        - SCHEDULED
                                        - UNFINISHED
                                        - ONGOING
                                      description: Tags cleanup status for the container repository.
                                    expiration_policy_started_at:
                                      type: string
                                      description: Timestamp when the cleanup done by the expiration policy was started on the container repository.
                                    id:
                                      type: string
                                      description: ID of the container repository.
                                    last_cleanup_deleted_tags_count:
                                      type: integer
                                      description: Number of deleted tags from the last cleanup.
                                    location:
                                      type: string
                                      description: URL of the container repository.
                                    name:
                                      type: string
                                      description: Name of the container repository.
                                    path:
                                      type: string
                                      description: Path of the container repository.
                                    protection_rule_exists:
                                      type: boolean
                                      description: Whether any matching container protection rule exists for the container repository.
                                    status:
                                      type: string
                                      enum:
                                        - DELETE_SCHEDULED
                                        - DELETE_FAILED
                                        - DELETE_ONGOING
                                      description: Status of the container repository.
                                    tags_count:
                                      type: integer
                                      description: Number of tags associated with the image.
                                    updated_at:
                                      type: string
                                      description: Timestamp when the container repository was updated.
                                    project:
                                      type: object
                                      description: Project identity (id, full_path, name)
                                      properties:
                                        id:
                                          type: string
                                        full_path:
                                          type: string
                                        name:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_dependency_proxy_blobs&method=list:
    post:
      operationId: group_dependency_proxy_blobs_list
      summary: Dependency Proxy blobs.
      description: Dependency Proxy blobs. Generated from the GitLab GraphQL schema field Group.dependencyProxyBlobs (connection of DependencyProxyBlob nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.dependencyProxyBlobs'
        url: https://docs.gitlab.com/api/graphql/reference/#groupdependencyproxyblobs
      x-stackQL-graphQL:
        id: gitlab.packages.group_dependency_proxy_blobs.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.dependencyProxyBlobs.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.dependencyProxyBlobs.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.dependencyProxyBlobs.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { dependencyProxyBlobs(first: 100{{ .cursor }}) { nodes { created_at: createdAt file_name: fileName size updated_at: updatedAt } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          dependencyProxyBlobs:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    created_at:
                                      type: string
                                      description: Date of creation.
                                    file_name:
                                      type: string
                                      description: Name of the blob.
                                    size:
                                      type: string
                                      description: Size of the blob file.
                                    updated_at:
                                      type: string
                                      description: Date of most recent update.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_dependency_proxy_image_ttl_policy&method=get:
    post:
      operationId: group_dependency_proxy_image_ttl_policy_get
      summary: Dependency proxy TTL policy for the group.
      description: Dependency proxy TTL policy for the group. Generated from the GitLab GraphQL schema field Group.dependencyProxyImageTtlPolicy (DependencyProxyImageTtlGroupPolicy).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.dependencyProxyImageTtlPolicy'
        url: https://docs.gitlab.com/api/graphql/reference/#groupdependencyproxyimagettlpolicy
      x-stackQL-graphQL:
        id: gitlab.packages.group_dependency_proxy_image_ttl_policy.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { group(fullPath: "{{ .full_path }}") { dependencyProxyImageTtlPolicy { created_at: createdAt enabled ttl updated_at: updatedAt } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          dependencyProxyImageTtlPolicy:
                            type: object
                            properties:
                              created_at:
                                type: string
                                description: Timestamp of creation.
                              enabled:
                                type: boolean
                                description: Indicates whether the policy is enabled or disabled.
                              ttl:
                                type: integer
                                description: Number of days to retain a cached image file.
                              updated_at:
                                type: string
                                description: Timestamp of the most recent update.
  /api/graphql?resource=group_dependency_proxy_manifests&method=list:
    post:
      operationId: group_dependency_proxy_manifests_list
      summary: Dependency Proxy manifests.
      description: Dependency Proxy manifests. Generated from the GitLab GraphQL schema field Group.dependencyProxyManifests (connection of DependencyProxyManifest nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.dependencyProxyManifests'
        url: https://docs.gitlab.com/api/graphql/reference/#groupdependencyproxymanifests
      x-stackQL-graphQL:
        id: gitlab.packages.group_dependency_proxy_manifests.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.dependencyProxyManifests.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.dependencyProxyManifests.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.dependencyProxyManifests.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { dependencyProxyManifests(first: 100{{ .cursor }}) { nodes { created_at: createdAt digest file_name: fileName id image_name: imageName size status updated_at: updatedAt } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          dependencyProxyManifests:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    created_at:
                                      type: string
                                      description: Date of creation.
                                    digest:
                                      type: string
                                      description: Digest of the manifest.
                                    file_name:
                                      type: string
                                      description: Name of the manifest.
                                    id:
                                      type: string
                                      description: ID of the manifest.
                                    image_name:
                                      type: string
                                      description: Name of the image.
                                    size:
                                      type: string
                                      description: Size of the manifest file.
                                    status:
                                      type: string
                                      enum:
                                        - DEFAULT
                                        - PENDING_DESTRUCTION
                                        - PROCESSING
                                        - ERROR
                                      description: Status of the manifest (default, pending_destruction, processing, error)
                                    updated_at:
                                      type: string
                                      description: Date of most recent update.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_dependency_proxy_setting&method=get:
    post:
      operationId: group_dependency_proxy_setting_get
      summary: Dependency Proxy settings for the group.
      description: Dependency Proxy settings for the group. Generated from the GitLab GraphQL schema field Group.dependencyProxySetting (DependencyProxySetting).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.dependencyProxySetting'
        url: https://docs.gitlab.com/api/graphql/reference/#groupdependencyproxysetting
      x-stackQL-graphQL:
        id: gitlab.packages.group_dependency_proxy_setting.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { group(fullPath: "{{ .full_path }}") { dependencyProxySetting { enabled identity } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          dependencyProxySetting:
                            type: object
                            properties:
                              enabled:
                                type: boolean
                                description: Indicates whether the dependency proxy is enabled for the group.
                              identity:
                                type: string
                                description: Identity credential used to authenticate with Docker Hub when pulling images. Can be a username (for password or personal access token (PAT)) or organization name (for organization access token (OAT)).
  /api/graphql?resource=group_package_settings&method=get:
    post:
      operationId: group_package_settings_get
      summary: Package settings for the namespace.
      description: Package settings for the namespace. Generated from the GitLab GraphQL schema field Group.packageSettings (PackageSettings).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.packageSettings'
        url: https://docs.gitlab.com/api/graphql/reference/#grouppackagesettings
      x-stackQL-graphQL:
        id: gitlab.packages.group_package_settings.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { group(fullPath: "{{ .full_path }}") { packageSettings { audit_events_enabled: auditEventsEnabled generic_duplicate_exception_regex: genericDuplicateExceptionRegex generic_duplicates_allowed: genericDuplicatesAllowed lock_maven_package_requests_forwarding: lockMavenPackageRequestsForwarding lock_npm_package_requests_forwarding: lockNpmPackageRequestsForwarding lock_pypi_package_requests_forwarding: lockPypiPackageRequestsForwarding maven_duplicate_exception_regex: mavenDuplicateExceptionRegex maven_duplicates_allowed: mavenDuplicatesAllowed maven_package_requests_forwarding: mavenPackageRequestsForwarding maven_package_requests_forwarding_locked: mavenPackageRequestsForwardingLocked npm_package_requests_forwarding: npmPackageRequestsForwarding npm_package_requests_forwarding_locked: npmPackageRequestsForwardingLocked nuget_duplicate_exception_regex: nugetDuplicateExceptionRegex nuget_duplicates_allowed: nugetDuplicatesAllowed nuget_symbol_server_enabled: nugetSymbolServerEnabled pypi_package_requests_forwarding: pypiPackageRequestsForwarding pypi_package_requests_forwarding_locked: pypiPackageRequestsForwardingLocked terraform_module_duplicate_exception_regex: terraformModuleDuplicateExceptionRegex terraform_module_duplicates_allowed: terraformModuleDuplicatesAllowed } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          packageSettings:
                            type: object
                            properties:
                              audit_events_enabled:
                                type: boolean
                                description: Indicates whether audit events are created when publishing or deleting a package in the namespace (Premium and Ultimate only).
                              generic_duplicate_exception_regex:
                                type: string
                                description: When generic_duplicates_allowed is false, you can publish duplicate packages with names that match this regex. Otherwise, this setting has no effect.
                              generic_duplicates_allowed:
                                type: boolean
                                description: Indicates whether duplicate generic packages are allowed for the namespace.
                              lock_maven_package_requests_forwarding:
                                type: boolean
                                description: Indicates whether Maven package forwarding is locked for all descendent namespaces.
                              lock_npm_package_requests_forwarding:
                                type: boolean
                                description: Indicates whether npm package forwarding is locked for all descendent namespaces.
                              lock_pypi_package_requests_forwarding:
                                type: boolean
                                description: Indicates whether PyPI package forwarding is locked for all descendent namespaces.
                              maven_duplicate_exception_regex:
                                type: string
                                description: When maven_duplicates_allowed is false, you can publish duplicate packages with names that match this regex. Otherwise, this setting has no effect.
                              maven_duplicates_allowed:
                                type: boolean
                                description: Indicates whether duplicate Maven packages are allowed for the namespace.
                              maven_package_requests_forwarding:
                                type: boolean
                                description: Indicates whether Maven package forwarding is allowed for the namespace.
                              maven_package_requests_forwarding_locked:
                                type: boolean
                                description: Indicates whether Maven package forwarding settings are locked by a parent namespace.
                              npm_package_requests_forwarding:
                                type: boolean
                                description: Indicates whether npm package forwarding is allowed for the namespace.
                              npm_package_requests_forwarding_locked:
                                type: boolean
                                description: Indicates whether npm package forwarding settings are locked by a parent namespace.
                              nuget_duplicate_exception_regex:
                                type: string
                                description: 'When nuget_duplicates_allowed is false, you can publish duplicate packages with names that match this regex. Otherwise, this setting has no effect. '
                              nuget_duplicates_allowed:
                                type: boolean
                                description: Indicates whether duplicate NuGet packages are allowed for the namespace.
                              nuget_symbol_server_enabled:
                                type: boolean
                                description: Indicates whether the NuGet symbol server is enabled for the namespace.
                              pypi_package_requests_forwarding:
                                type: boolean
                                description: Indicates whether PyPI package forwarding is allowed for the namespace.
                              pypi_package_requests_forwarding_locked:
                                type: boolean
                                description: Indicates whether PyPI package forwarding settings are locked by a parent namespace.
                              terraform_module_duplicate_exception_regex:
                                type: string
                                description: When terraform_module_duplicates_allowed is false, you can publish duplicate packages with names that match this regex. Otherwise, this setting has no effect.
                              terraform_module_duplicates_allowed:
                                type: boolean
                                description: Indicates whether duplicate Terraform packages are allowed for the namespace.
  /api/graphql?resource=group_packages&method=list:
    post:
      operationId: group_packages_list
      summary: Packages of the group. This field can only be resolved for one group in any single request.
      description: Packages of the group. This field can only be resolved for one group in any single request. Generated from the GitLab GraphQL schema field Group.packages (connection of Package nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.packages'
        url: https://docs.gitlab.com/api/graphql/reference/#grouppackages
      x-stackQL-graphQL:
        id: gitlab.packages.group_packages.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.packages.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.packages.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.packages.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { packages(first: 100{{ .cursor }}{{ if .include_versionless }}, includeVersionless: {{ .include_versionless }}{{ end }}{{ if .package_name }}, packageName: "{{ .package_name }}"{{ end }}{{ if .package_type }}, packageType: {{ .package_type }}{{ end }}{{ if .package_version }}, packageVersion: "{{ .package_version }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}{{ if .status }}, status: {{ .status }}{{ end }}) { nodes { created_at: createdAt id name package_type: packageType protection_rule_exists: protectionRuleExists status status_message: statusMessage updated_at: updatedAt version project { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: include_versionless
          in: query
          required: false
          description: Include versionless packages.
          schema:
            type: boolean
        - name: package_name
          in: query
          required: false
          description: Search a package by name.
          schema:
            type: string
        - name: package_type
          in: query
          required: false
          description: Filter a package by type.
          schema:
            type: string
            enum:
              - MAVEN
              - NPM
              - CONAN
              - NUGET
              - PYPI
              - COMPOSER
              - GENERIC
              - GOLANG
              - DEBIAN
              - RUBYGEMS
              - HELM
              - TERRAFORM_MODULE
              - RPM
              - ML_MODEL
              - CARGO
        - name: package_version
          in: query
          required: false
          description: |-
            Filter a package by version. If used in combination with `include_versionless`,
                      then no versionless packages are returned.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort packages by the criteria.
          schema:
            type: string
            enum:
              - PROJECT_PATH_DESC
              - PROJECT_PATH_ASC
              - CREATED_DESC
              - CREATED_ASC
              - NAME_DESC
              - NAME_ASC
              - VERSION_DESC
              - VERSION_ASC
              - TYPE_DESC
              - TYPE_ASC
        - name: status
          in: query
          required: false
          description: Filter a package by status.
          schema:
            type: string
            enum:
              - DEFAULT
              - HIDDEN
              - PROCESSING
              - ERROR
              - PENDING_DESTRUCTION
              - DEPRECATED
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          packages:
                            type: object
                            properties:
