              - TERRAFORM_MODULE
              - RPM
              - ML_MODEL
              - CARGO
        - name: package_version
          in: query
          required: false
          description: |-
            Filter a package by version. If used in combination with `include_versionless`,
                      then no versionless packages are returned.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort packages by the criteria.
          schema:
            type: string
            enum:
              - CREATED_DESC
              - CREATED_ASC
              - NAME_DESC
              - NAME_ASC
              - VERSION_DESC
              - VERSION_ASC
              - TYPE_DESC
              - TYPE_ASC
        - name: status
          in: query
          required: false
          description: Filter a package by status.
          schema:
            type: string
            enum:
              - DEFAULT
              - HIDDEN
              - PROCESSING
              - ERROR
              - PENDING_DESTRUCTION
              - DEPRECATED
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          packages:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    created_at:
                                      type: string
                                      description: Date of creation.
                                    id:
                                      type: string
                                      description: ID of the package.
                                    name:
                                      type: string
                                      description: Name of the package.
                                    package_type:
                                      type: string
                                      enum:
                                        - MAVEN
                                        - NPM
                                        - CONAN
                                        - NUGET
                                        - PYPI
                                        - COMPOSER
                                        - GENERIC
                                        - GOLANG
                                        - DEBIAN
                                        - RUBYGEMS
                                        - HELM
                                        - TERRAFORM_MODULE
                                        - RPM
                                        - ML_MODEL
                                        - CARGO
                                      description: Package type.
                                    protection_rule_exists:
                                      type: boolean
                                      description: Whether any matching package protection rule exists for the package.
                                    status:
                                      type: string
                                      enum:
                                        - DEFAULT
                                        - HIDDEN
                                        - PROCESSING
                                        - ERROR
                                        - PENDING_DESTRUCTION
                                        - DEPRECATED
                                      description: Package status.
                                    status_message:
                                      type: string
                                      description: Status message.
                                    updated_at:
                                      type: string
                                      description: Date of most recent update.
                                    version:
                                      type: string
                                      description: Version string.
                                    project:
                                      type: object
                                      description: Project identity (id, full_path, name)
                                      properties:
                                        id:
                                          type: string
                                        full_path:
                                          type: string
                                        name:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
