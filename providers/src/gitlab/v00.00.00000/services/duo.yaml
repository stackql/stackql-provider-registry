openapi: 3.0.3
info:
  title: duo API
  description: 'GitLab Duo - AI chat context presets and agentic workflows. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=ai_chat_context_presets&method=get:
    post:
      operationId: ai_chat_context_presets_get
      summary: Get available GitLab Duo Chat context presets for the current user for a specific URL
      description: Get available GitLab Duo Chat context presets for the current user for a specific URL Generated from the GitLab GraphQL schema field Query.aiChatContextPresets (ContextPreset).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.aiChatContextPresets'
        url: https://docs.gitlab.com/api/graphql/reference/#queryaichatcontextpresets
      x-stackQL-graphQL:
        id: gitlab.duo.ai_chat_context_presets.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { aiChatContextPresets{{ if or .project_id .question_count .resource_id .url }}({{ if .project_id }}, projectId: "{{ .project_id }}"{{ end }}{{ if .question_count }}, questionCount: {{ .question_count }}{{ end }}{{ if .resource_id }}, resourceId: "{{ .resource_id }}"{{ end }}{{ if .url }}, url: "{{ .url }}"{{ end }}){{ end }} { ai_resource_data: aiResourceData questions } }'
      x-stackql-protocol: graphql
      parameters:
        - name: project_id
          in: query
          required: false
          description: Global ID of the project the user is acting on.
          schema:
            type: string
        - name: question_count
          in: query
          required: false
          description: Number of questions for the default screen.
          schema:
            type: integer
        - name: resource_id
          in: query
          required: false
          description: Global ID of the resource from the current page.
          schema:
            type: string
        - name: url
          in: query
          required: false
          description: URL of the page the user is currently on.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      aiChatContextPresets:
                        type: object
                        properties:
                          ai_resource_data:
                            type: string
                            description: Serialized representation of the AI resource in the current context.
                          questions:
                            type: array
                            items:
                              type: string
                              description: Array of questions that the user can ask GitLab Duo Chat from the current page.
  /api/graphql?resource=project_duo_workflow_events&method=list:
    post:
      operationId: project_duo_workflow_events_list
      summary: Checkpoints for GitLab Duo Agent Platform flows, for all users (remote flows only). Returns only the latest checkpoint by default. Use `first` and `after` to page through history.
      description: Checkpoints for GitLab Duo Agent Platform flows, for all users (remote flows only). Returns only the latest checkpoint by default. Use `first` and `after` to page through history. Generated from the GitLab GraphQL schema field Project.duoWorkflowEvents (connection of DuoWorkflowEvent nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.duoWorkflowEvents'
        url: https://docs.gitlab.com/api/graphql/reference/#projectduoworkflowevents
      x-stackQL-graphQL:
        id: gitlab.duo.project_duo_workflow_events.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.duoWorkflowEvents.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.duoWorkflowEvents.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.duoWorkflowEvents.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { duoWorkflowEvents(first: 100{{ .cursor }}, workflowId: "{{ .workflow_id }}") { nodes { compressed_checkpoint: compressedCheckpoint errors metadata parent_ts: parentTs thread_ts: threadTs workflow_definition: workflowDefinition workflow_goal: workflowGoal workflow_status: workflowStatus } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: workflow_id
          in: query
          required: true
          description: Array of request IDs to fetch.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          duoWorkflowEvents:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    compressed_checkpoint:
                                      type: string
                                      description: Checkpoint of the event, zlib-compressed and Base64-encoded.
                                    errors:
                                      type: array
                                      items:
                                        type: string
                                        description: Message errors.
                                    metadata:
                                      type: string
                                      description: Metadata associated with the event.
                                    parent_ts:
                                      type: string
                                      description: UUID v7 timestamp identifier of the parent message for branched conversations or responses.
                                    thread_ts:
                                      type: string
                                      description: UUID v7 timestamp identifier for the conversation thread/session in LangGraph state management.
                                    workflow_definition:
                                      type: string
                                      description: GitLab Duo Agent Platform flow type based on its capabilities.
                                    workflow_goal:
                                      type: string
                                      description: Goal of the session.
                                    workflow_status:
                                      type: string
                                      enum:
                                        - CREATED
                                        - RUNNING
                                        - PAUSED
                                        - INPUT_REQUIRED
                                        - PLAN_APPROVAL_REQUIRED
                                        - TOOL_CALL_APPROVAL_REQUIRED
                                        - STOPPED
                                        - FAILED
                                        - FINISHED
                                      description: Status of the session.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=project_duo_workflow_workflows&method=list:
    post:
      operationId: project_duo_workflow_workflows_list
      summary: GitLab Duo Agent Platform flows for a project, for all users (remote flows only).
      description: GitLab Duo Agent Platform flows for a project, for all users (remote flows only). Generated from the GitLab GraphQL schema field Project.duoWorkflowWorkflows (connection of DuoWorkflow nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.duoWorkflowWorkflows'
        url: https://docs.gitlab.com/api/graphql/reference/#projectduoworkflowworkflows
      x-stackQL-graphQL:
        id: gitlab.duo.project_duo_workflow_workflows.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.duoWorkflowWorkflows.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.duoWorkflowWorkflows.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.duoWorkflowWorkflows.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { duoWorkflowWorkflows(first: 100{{ .cursor }}{{ if .environment }}, environment: {{ .environment }}{{ end }}{{ if .project_path }}, projectPath: "{{ .project_path }}"{{ end }}{{ if .search }}, search: "{{ .search }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}{{ if .status_group }}, statusGroup: {{ .status_group }}{{ end }}{{ if .type }}, type: "{{ .type }}"{{ end }}{{ if .updated_after }}, updatedAfter: "{{ .updated_after }}"{{ end }}{{ if .workflow_id }}, workflowId: "{{ .workflow_id }}"{{ end }}) { nodes { agent_privileges_names: agentPrivilegesNames all_executor_logs_urls: allExecutorLogsUrls allow_agent_to_request_user: allowAgentToRequestUser archived created_at: createdAt environment goal human_status: humanStatus id incremental_checkpoints_enabled: incrementalCheckpointsEnabled last_executor_logs_url: lastExecutorLogsUrl mcp_enabled: mcpEnabled name namespace_id: namespaceId pre_approved_agent_privileges_names: preApprovedAgentPrivilegesNames project_id: projectId resource_iid: resourceIid resource_web_url: resourceWebUrl stalled status status_group: statusGroup status_name: statusName summary title tool_call_approvals: toolCallApprovals updated_at: updatedAt user_id: userId web_url: webUrl workflow_definition: workflowDefinition user { id username name } namespace { id full_path: fullPath name } project { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
        - name: environment
          in: query
          required: false
          description: Environment, for example, IDE or web.
          schema:
            type: string
            enum:
              - CHAT_PARTIAL
              - CHAT
              - AMBIENT
        - name: project_path
          in: query
          required: false
          description: Full path of the project that contains the flows.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Flow title or goal to search for.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort flows by the criteria.
          schema:
            type: string
            enum:
              - STATUS_ASC
              - STATUS_DESC
              - UPDATED_DESC
              - UPDATED_ASC
              - CREATED_DESC
              - CREATED_ASC
        - name: status_group
          in: query
          required: false
          description: Status group to filter flow sessions by.
          schema:
            type: string
            enum:
              - ACTIVE
              - PAUSED
              - AWAITING_INPUT
              - COMPLETED
              - FAILED
              - CANCELED
        - name: type
          in: query
          required: false
          description: Type of flow to filter by (for example, software_development or foundational_chat_agents).
          schema:
            type: string
        - name: updated_after
          in: query
          required: false
          description: Filters flows updated after a given date.
          schema:
            type: string
        - name: workflow_id
          in: query
          required: false
          description: Flow ID to filter by.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          duoWorkflowWorkflows:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    agent_privileges_names:
                                      type: array
                                      items:
                                        type: string
                                        description: Privileges granted to the agent during execution.
                                    all_executor_logs_urls:
                                      type: array
                                      items:
                                        type: string
                                        description: List of all the executor logs for the workflow.
                                    allow_agent_to_request_user:
                                      type: boolean
                                      description: Allow the agent to request user input.
                                    archived:
                                      type: boolean
                                      description: Archived due to retention policy.
                                    created_at:
                                      type: string
                                      description: Timestamp of when the session was created.
                                    environment:
                                      type: string
                                      enum:
                                        - CHAT_PARTIAL
                                        - CHAT
                                        - AMBIENT
                                      description: Environment, like IDE or web.
                                    goal:
                                      type: string
                                      description: Goal of the session.
                                    human_status:
                                      type: string
                                      description: Human-readable status of the session.
                                    id:
                                      type: string
                                      description: ID of the session.
                                    incremental_checkpoints_enabled:
                                      type: boolean
                                      description: Indicates incremental checkpoints were enabled for the session at creation.
                                    last_executor_logs_url:
                                      type: string
                                      description: URL to the latest executor logs of the workflow.
                                    mcp_enabled:
                                      type: boolean
                                      description: Has MCP been enabled for the namespace.
                                    name:
                                      type: string
                                      description: Name or title of the object.
                                    namespace_id:
                                      type: string
                                      description: ID of the namespace.
                                    pre_approved_agent_privileges_names:
                                      type: array
                                      items:
                                        type: string
                                        description: Privileges pre-approved for the agent during execution.
                                    project_id:
                                      type: string
                                      description: ID of the project.
                                    resource_iid:
                                      type: integer
                                      description: IID of the associated resource (issue or merge request).
                                    resource_web_url:
                                      type: string
                                      description: Web URL of the associated resource (issue or merge request).
                                    stalled:
                                      type: boolean
                                      description: Workflow got created but has no checkpoints.
                                    status:
                                      type: string
                                      enum:
                                        - CREATED
                                        - RUNNING
                                        - PAUSED
                                        - INPUT_REQUIRED
                                        - PLAN_APPROVAL_REQUIRED
                                        - TOOL_CALL_APPROVAL_REQUIRED
                                        - STOPPED
                                        - FAILED
                                        - FINISHED
                                      description: Status of the session.
                                    status_group:
                                      type: string
                                      enum:
                                        - ACTIVE
                                        - PAUSED
                                        - AWAITING_INPUT
                                        - COMPLETED
                                        - FAILED
                                        - CANCELED
                                      description: Status group of the flow session.
                                    status_name:
                                      type: string
                                      description: Status name of the session.
                                    summary:
                                      type: string
                                      description: Summary of the session.
                                    title:
                                      type: string
                                      description: Title of the session.
                                    tool_call_approvals:
                                      type: string
                                      description: Tools approval per session policy.
                                    updated_at:
                                      type: string
                                      description: Timestamp of when the session was last updated.
                                    user_id:
                                      type: string
                                      description: ID of the user.
                                    web_url:
                                      type: string
                                      description: URL of the object.
                                    workflow_definition:
                                      type: string
                                      description: GitLab Duo Agent Platform flow type based on its capabilities.
                                    user:
                                      type: object
                                      description: UserCore identity (id, username, name)
                                      properties:
                                        id:
                                          type: string
                                        username:
                                          type: string
                                        name:
                                          type: string
                                    namespace:
                                      type: object
                                      description: Namespace identity (id, full_path, name)
                                      properties:
                                        id:
                                          type: string
                                        full_path:
                                          type: string
                                        name:
                                          type: string
                                    project:
                                      type: object
                                      description: Project identity (id, full_path, name)
                                      properties:
                                        id:
                                          type: string
                                        full_path:
                                          type: string
                                        name:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
components:
  x-stackQL-resources:
    ai_chat_context_presets:
      id: gitlab.duo.ai_chat_context_presets
      name: ai_chat_context_presets
      title: Ai Chat Context Presets
      methods:
        get:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=ai_chat_context_presets&method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.aiChatContextPresets
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/ai_chat_context_presets/methods/get'
        insert: []
        update: []
        delete: []
    project_duo_workflow_events:
      id: gitlab.duo.project_duo_workflow_events
      name: project_duo_workflow_events
      title: Project Duo Workflow Events
      methods:
        list:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=project_duo_workflow_events&method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.project.duoWorkflowEvents.nodes
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/project_duo_workflow_events/methods/list'
        insert: []
        update: []
        delete: []
    project_duo_workflow_workflows:
      id: gitlab.duo.project_duo_workflow_workflows
      name: project_duo_workflow_workflows
      title: Project Duo Workflow Workflows
      methods:
        list:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=project_duo_workflow_workflows&method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.project.duoWorkflowWorkflows.nodes
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/project_duo_workflow_workflows/methods/list'
        insert: []
        update: []
        delete: []
