  /api/graphql?resource=todo&method=get:
    post:
      operationId: todo_get
      summary: Retrieve a single to-do item
      description: Retrieve a single to-do item Generated from the GitLab GraphQL schema field Query.todo (Todo).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.todo'
        url: https://docs.gitlab.com/api/graphql/reference/#querytodo
      x-stackQL-graphQL:
        id: gitlab.users.todo.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { todo(id: "{{ .id }}") { action body created_at: createdAt id member_access_type: memberAccessType snoozed_until: snoozedUntil state target_type: targetType target_url: targetUrl author { id username name } group_: group { id full_path: fullPath name } project { id full_path: fullPath name } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: ID of the to-do item.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      todo:
                        type: object
                        properties:
                          action:
                            type: string
                            enum:
                              - assigned
                              - review_requested
                              - mentioned
                              - build_failed
                              - marked
                              - approval_required
                              - unmergeable
                              - directly_addressed
                              - member_access_requested
                              - review_submitted
                              - ssh_key_expired
                              - ssh_key_expiring_soon
                              - merge_train_removed
                              - okr_checkin_requested
                              - added_approver
                              - duo_pro_access_granted
                              - duo_enterprise_access_granted
                              - duo_core_access_granted
                              - duo_workflow_input_required
                            description: Action of the to-do item.
                          body:
                            type: string
                            description: Body of the to-do item.
                          created_at:
                            type: string
                            description: Timestamp the to-do item was created.
                          id:
                            type: string
                            description: ID of the to-do item.
                          member_access_type:
                            type: string
                            description: Access type of access request to-do items.
                          snoozed_until:
                            type: string
                            description: Time until when the todo is snoozed.
                          state:
                            type: string
                            enum:
                              - pending
                              - done
                            description: State of the to-do item.
                          target_type:
                            type: string
                            enum:
                              - COMMIT
                              - ISSUE
                              - WORKITEM
                              - MERGEREQUEST
                              - DESIGN
                              - ALERT
                              - PROJECT
                              - NAMESPACE
                              - KEY
                              - WIKIPAGEMETA
                              - EPIC
                              - USER
                              - VULNERABILITY
                              - COMPLIANCE_VIOLATION
                              - DUO_WORKFLOW
                            description: Target type of the to-do item.
                          target_url:
                            type: string
                            description: URL of the to-do item target.
                          author:
                            type: object
                            description: UserCore identity (id, username, name)
                            properties:
                              id:
                                type: string
                              username:
                                type: string
                              name:
                                type: string
                          group_:
                            type: object
                            description: Group identity (id, full_path, name)
                            properties:
                              id:
                                type: string
                              full_path:
                                type: string
                              name:
                                type: string
                          project:
                            type: object
                            description: Project identity (id, full_path, name)
                            properties:
                              id:
                                type: string
                              full_path:
                                type: string
                              name:
                                type: string
  /api/graphql?resource=user&method=get:
    post:
      operationId: user_get
      summary: Find a user.
      description: Find a user. Generated from the GitLab GraphQL schema field Query.user (UserCore).
