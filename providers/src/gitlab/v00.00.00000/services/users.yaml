openapi: 3.0.3
info:
  title: users API
  description: 'Users and access - user details, the current user, user permissions on projects and groups, and to-do items. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=current_user&method=get:
    post:
      operationId: current_user_get
      summary: Get information about current user.
      description: Get information about current user. Generated from the GitLab GraphQL schema field Query.currentUser (CurrentUser).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.currentUser'
        url: https://docs.gitlab.com/api/graphql/reference/#querycurrentuser
      x-stackQL-graphQL:
        id: gitlab.users.current_user.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { currentUser { active admin avatar_url: avatarUrl bio bot commit_email: commitEmail composite_identity_enforced: compositeIdentityEnforced created_at: createdAt discord duo_classic_chat_available: duoClassicChatAvailable github gitpod_enabled: gitpodEnabled group_count: groupCount human id job_title: jobTitle last_activity_on: lastActivityOn linkedin location name organization preferences_gitpod_path: preferencesGitpodPath profile_enable_gitpod_path: profileEnableGitpodPath project_count: projectCount pronouns public_email: publicEmail state twitter type username web_path: webPath web_url: webUrl namespace { id full_path: fullPath name } } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      currentUser:
                        type: object
                        properties:
                          active:
                            type: boolean
                            description: Indicates if the user is active.
                          admin:
                            type: boolean
                            description: Indicates if the user is an instance administrator.
                          avatar_url:
                            type: string
                            description: URL of the user's avatar.
                          bio:
                            type: string
                            description: Bio of the user.
                          bot:
                            type: boolean
                            description: Indicates if the user is a bot.
                          commit_email:
                            type: string
                            description: User's default commit email.
                          composite_identity_enforced:
                            type: boolean
                            description: Indicates if composite identity is enforced for the user.
                          created_at:
                            type: string
                            description: Timestamp of when the user was created.
                          discord:
                            type: string
                            description: Discord ID of the user.
                          duo_classic_chat_available:
                            type: boolean
                            description: User access to GitLab Duo Chat (non-agentic) feature.
                          github:
                            type: string
                            description: GitHub profile name of the user.
                          gitpod_enabled:
                            type: boolean
                            description: Whether Ona is enabled at the user level.
                          group_count:
                            type: integer
                            description: Group count for the user.
                          human:
                            type: boolean
                            description: Indicates if the user is a regular user.
                          id:
                            type: string
                            description: Global ID of the user.
                          job_title:
                            type: string
                            description: Job title of the user.
                          last_activity_on:
                            type: string
                            description: Date the user last performed any actions.
                          linkedin:
                            type: string
                            description: LinkedIn profile name of the user.
                          location:
                            type: string
                            description: Location of the user.
                          name:
                            type: string
                            description: Human-readable name of the user. Returns `****` if the user is a project bot and the requester does not have permission to view the project.
                          organization:
                            type: string
                            description: Who the user represents or works for.
                          preferences_gitpod_path:
                            type: string
                            description: Web path to the Ona section within user preferences.
                          profile_enable_gitpod_path:
                            type: string
                            description: Web path to enable Ona for the user.
                          project_count:
                            type: integer
                            description: Project count for the user.
                          pronouns:
                            type: string
                            description: Pronouns of the user.
                          public_email:
                            type: string
                            description: User's public email.
                          state:
                            type: string
                            enum:
                              - active
                              - blocked
                              - deactivated
                              - banned
                              - ldap_blocked
                              - blocked_pending_approval
                            description: State of the user.
                          twitter:
                            type: string
                            description: X (formerly Twitter) username of the user.
                          type:
                            type: string
                            enum:
                              - HUMAN
                              - SUPPORT_BOT
                              - ALERT_BOT
                              - VISUAL_REVIEW_BOT
                              - SERVICE_USER
                              - GHOST
                              - PROJECT_BOT
                              - SECURITY_BOT
                              - AUTOMATION_BOT
                              - SECURITY_POLICY_BOT
                              - ADMIN_BOT
                              - SERVICE_ACCOUNT
                              - PLACEHOLDER
                              - DUO_CODE_REVIEW_BOT
                              - IMPORT_USER
                            description: Type of the user.
                          username:
                            type: string
                            description: Username of the user. Unique within the instance of GitLab.
                          web_path:
                            type: string
                            description: Web path of the user.
                          web_url:
                            type: string
                            description: Web URL of the user.
                          namespace:
                            type: object
                            description: Namespace identity (id, full_path, name)
                            properties:
                              id:
                                type: string
                              full_path:
                                type: string
                              name:
                                type: string
  /api/graphql?resource=project_user_access_authorized_agents&method=list:
    post:
      operationId: project_user_access_authorized_agents_list
      summary: Authorized cluster agents for the project through user_access keyword.
      description: Authorized cluster agents for the project through user_access keyword. Generated from the GitLab GraphQL schema field Project.userAccessAuthorizedAgents (connection of ClusterAgentAuthorizationUserAccess nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Project.userAccessAuthorizedAgents'
        url: https://docs.gitlab.com/api/graphql/reference/#projectuseraccessauthorizedagents
      x-stackQL-graphQL:
        id: gitlab.users.project_user_access_authorized_agents.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.userAccessAuthorizedAgents.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.userAccessAuthorizedAgents.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.userAccessAuthorizedAgents.pageInfo.hasNextPage
        query: 'query { project(fullPath: "{{ .full_path }}") { userAccessAuthorizedAgents(first: 100{{ .cursor }}) { nodes { config } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the project, for example gitlab-org/gitlab
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          userAccessAuthorizedAgents:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    config:
                                      type: string
                                      description: Configuration for the authorized project.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
