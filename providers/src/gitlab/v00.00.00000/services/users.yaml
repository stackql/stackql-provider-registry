          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { user{{ if or .id .username }}({{ if .id }}, id: "{{ .id }}"{{ end }}{{ if .username }}, username: "{{ .username }}"{{ end }}){{ end }} { active avatar_url: avatarUrl bio bot commit_email: commitEmail composite_identity_enforced: compositeIdentityEnforced created_at: createdAt discord github gitpod_enabled: gitpodEnabled group_count: groupCount human id job_title: jobTitle last_activity_on: lastActivityOn linkedin location name organization preferences_gitpod_path: preferencesGitpodPath profile_enable_gitpod_path: profileEnableGitpodPath project_count: projectCount pronouns public_email: publicEmail state twitter type username web_path: webPath web_url: webUrl namespace { id full_path: fullPath name } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: false
          description: ID of the User.
          schema:
            type: string
        - name: username
          in: query
          required: false
          description: Username of the User.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
