openapi: 3.0.3
info:
  title: metadata API
  description: 'Instance metadata - GitLab version and revision, current license and query complexity. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=current_license&method=get:
    post:
      operationId: current_license_get
      summary: Fields related to the current license.
      description: Fields related to the current license. Generated from the GitLab GraphQL schema field Query.currentLicense (CurrentLicense).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.currentLicense'
        url: https://docs.gitlab.com/api/graphql/reference/#querycurrentlicense
      x-stackQL-graphQL:
        id: gitlab.metadata.current_license.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { currentLicense { activated_at: activatedAt billable_users_count: billableUsersCount block_changes_at: blockChangesAt company created_at: createdAt email expires_at: expiresAt has_gitlab_credits_add_on: hasGitlabCreditsAddOn id last_sync: lastSync maximum_user_count: maximumUserCount name plan starts_at: startsAt trial type users_in_license_count: usersInLicenseCount users_over_license_count: usersOverLicenseCount } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      currentLicense:
                        type: object
                        properties:
                          activated_at:
                            type: string
                            description: Date when the license was activated.
                          billable_users_count:
                            type: integer
                            description: Number of billable users on the system.
                          block_changes_at:
                            type: string
                            description: Date when licensed features will be blocked.
                          company:
                            type: string
                            description: Company of the licensee.
                          created_at:
                            type: string
                            description: Date when the license was added.
                          email:
                            type: string
                            description: Email of the licensee.
                          expires_at:
                            type: string
                            description: Date when the license expires.
                          has_gitlab_credits_add_on:
                            type: boolean
                            description: Whether the license has an active GitLab Credits add-on.
                          id:
                            type: string
                            description: ID of the license extracted from the license data.
                          last_sync:
                            type: string
                            description: Date when the license was last synced.
                          maximum_user_count:
                            type: integer
                            description: Highest number of billable users on the system during the term of the current license.
                          name:
                            type: string
                            description: Name of the licensee.
                          plan:
                            type: string
                            description: Name of the subscription plan.
                          starts_at:
                            type: string
                            description: Date when the license started.
                          trial:
                            type: boolean
                            description: Indicates if the license is a trial.
                          type:
                            type: string
                            description: Type of the license.
                          users_in_license_count:
                            type: integer
                            description: Number of paid users in the license.
                          users_over_license_count:
                            type: integer
                            description: Number of users over the paid users in the license.
  /api/graphql?resource=metadata&method=get:
    post:
      operationId: metadata_get
      summary: Metadata about GitLab.
      description: Metadata about GitLab. Generated from the GitLab GraphQL schema field Query.metadata (Metadata).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.metadata'
        url: https://docs.gitlab.com/api/graphql/reference/#querymetadata
      x-stackQL-graphQL:
        id: gitlab.metadata.metadata.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: query { metadata { enterprise revision version } }
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      metadata:
                        type: object
                        properties:
                          enterprise:
                            type: boolean
                            description: Enterprise edition.
                          revision:
                            type: string
                            description: Revision.
                          version:
                            type: string
                            description: Version.
  /api/graphql?resource=query_complexity&method=get:
    post:
      operationId: query_complexity_get
      summary: Information about the complexity of the GraphQL query.
      description: Information about the complexity of the GraphQL query. Generated from the GitLab GraphQL schema field Query.queryComplexity (QueryComplexity).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.queryComplexity'
        url: https://docs.gitlab.com/api/graphql/reference/#queryquerycomplexity
      x-stackQL-graphQL:
        id: gitlab.metadata.query_complexity.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { queryComplexity { limit_: limit score } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      queryComplexity:
                        type: object
                        properties:
                          limit_:
                            type: integer
                            description: GraphQL query complexity limit.
                          score:
                            type: integer
                            description: GraphQL query complexity score.
components:
  x-stackQL-resources:
    current_license:
      id: gitlab.metadata.current_license
      name: current_license
      title: Current License
      methods:
        get:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=current_license&method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.currentLicense
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/current_license/methods/get'
        insert: []
        update: []
        delete: []
    metadata:
      id: gitlab.metadata.metadata
      name: metadata
      title: Metadata
      methods:
        get:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=metadata&method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.metadata
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/metadata/methods/get'
        insert: []
        update: []
        delete: []
    query_complexity:
      id: gitlab.metadata.query_complexity
      name: query_complexity
      title: Query Complexity
      methods:
        get:
          operation:
            $ref: '#/paths/~1api~1graphql?resource=query_complexity&method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.queryComplexity
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/query_complexity/methods/get'
        insert: []
        update: []
        delete: []
