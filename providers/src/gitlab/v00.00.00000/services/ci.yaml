openapi: 3.0.3
info:
  title: ci API
  description: 'CI/CD - pipelines, jobs, runners, pipeline schedules, pipeline analytics, CI variables, job token scope and CI/CD settings. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=ci_application_settings&method=get:
    post:
      operationId: ci_application_settings_get
      summary: CI related settings that apply to the entire instance.
      description: CI related settings that apply to the entire instance. Generated from the GitLab GraphQL schema field Query.ciApplicationSettings (CiApplicationSettings).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.ciApplicationSettings'
        url: https://docs.gitlab.com/api/graphql/reference/#queryciapplicationsettings
      x-stackQL-graphQL:
        id: gitlab.ci.ci_application_settings.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { ciApplicationSettings { keep_latest_artifact: keepLatestArtifact } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ciApplicationSettings:
                        type: object
                        properties:
                          keep_latest_artifact:
                            type: boolean
                            description: Whether to keep the latest jobs artifacts.
  /api/graphql?resource=ci_dedicated_hosted_runner_filters&method=get:
    post:
      operationId: ci_dedicated_hosted_runner_filters_get
      summary: Returns available filters for GitLab Dedicated runner usage data.
      description: Returns available filters for GitLab Dedicated runner usage data. Generated from the GitLab GraphQL schema field Query.ciDedicatedHostedRunnerFilters (CiDedicatedHostedRunnerFilters).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.ciDedicatedHostedRunnerFilters'
        url: https://docs.gitlab.com/api/graphql/reference/#querycidedicatedhostedrunnerfilters
      x-stackQL-graphQL:
        id: gitlab.ci.ci_dedicated_hosted_runner_filters.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: query { ciDedicatedHostedRunnerFilters { years } }
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ciDedicatedHostedRunnerFilters:
                        type: object
                        properties:
                          years:
                            type: array
                            items:
                              type: integer
                              description: List of years with available usage data.
  /api/graphql?resource=ci_dedicated_hosted_runner_usage&method=list:
    post:
      operationId: ci_dedicated_hosted_runner_usage_list
      summary: Compute usage data for runners across namespaces on GitLab Dedicated. Defaults to the current year if no year or billing month is specified. Ultimate only.
      description: Compute usage data for runners across namespaces on GitLab Dedicated. Defaults to the current year if no year or billing month is specified. Ultimate only. Generated from the GitLab GraphQL schema field Query.ciDedicatedHostedRunnerUsage (connection of CiDedicatedHostedRunnerUsage nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.ciDedicatedHostedRunnerUsage'
        url: https://docs.gitlab.com/api/graphql/reference/#querycidedicatedhostedrunnerusage
      x-stackQL-graphQL:
        id: gitlab.ci.ci_dedicated_hosted_runner_usage.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.ciDedicatedHostedRunnerUsage.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.ciDedicatedHostedRunnerUsage.pageInfo.endCursor
          terminateOnJsonPath: $.data.ciDedicatedHostedRunnerUsage.pageInfo.hasNextPage
        query: 'query { ciDedicatedHostedRunnerUsage(first: 100{{ .cursor }}{{ if .billing_month }}, billingMonth: "{{ .billing_month }}"{{ end }}{{ if .grouping }}, grouping: {{ .grouping }}{{ end }}{{ if .runner_id }}, runnerId: "{{ .runner_id }}"{{ end }}{{ if .year }}, year: {{ .year }}{{ end }}) { nodes { billing_month: billingMonth billing_month_iso8601: billingMonthIso8601 compute_minutes: computeMinutes compute_minutes_usage: computeMinutesUsage duration_minutes: durationMinutes duration_seconds: durationSeconds } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: billing_month
          in: query
          required: false
          description: First day of the month to retrieve data for.
          schema:
            type: string
        - name: grouping
          in: query
          required: false
          description: Groups usage data by instance aggregate or root namespace.
          schema:
            type: string
            enum:
              - INSTANCE_AGGREGATE
              - PER_ROOT_NAMESPACE
        - name: runner_id
          in: query
          required: false
          description: Runner ID to retrieve data for.
          schema:
            type: string
        - name: year
          in: query
          required: false
          description: Year to retrieve data for.
          schema:
            type: integer
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ciDedicatedHostedRunnerUsage:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                billing_month:
                                  type: string
                                  description: Month of the usage data.
                                billing_month_iso8601:
                                  type: string
                                  description: Timestamp of the billing month in ISO 8601 format.
                                compute_minutes:
                                  type: integer
                                  description: Total compute minutes used across all namespaces. Values are rounded down to the nearest integer.
                                compute_minutes_usage:
                                  type: number
                                  description: Total compute minutes used across all namespaces.
                                duration_minutes:
                                  type: number
                                  description: Total duration in minutes of runner usage.
                                duration_seconds:
                                  type: integer
                                  description: Total duration in seconds of runner usage. Values are rounded down to the nearest integer.
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /api/graphql?resource=ci_minutes_project_monthly_usage&method=list:
    post:
      operationId: ci_minutes_project_monthly_usage_list
      summary: Compute usage data for projects in a namespace for a given month. Returns project usage independent of whether a namespace-level usage record exists.
      description: Compute usage data for projects in a namespace for a given month. Returns project usage independent of whether a namespace-level usage record exists. Generated from the GitLab GraphQL schema field Query.ciMinutesProjectMonthlyUsage (connection of CiMinutesProjectMonthlyUsage nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.ciMinutesProjectMonthlyUsage'
        url: https://docs.gitlab.com/api/graphql/reference/#queryciminutesprojectmonthlyusage
      x-stackQL-graphQL:
        id: gitlab.ci.ci_minutes_project_monthly_usage.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.ciMinutesProjectMonthlyUsage.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.ciMinutesProjectMonthlyUsage.pageInfo.endCursor
          terminateOnJsonPath: $.data.ciMinutesProjectMonthlyUsage.pageInfo.hasNextPage
        query: 'query { ciMinutesProjectMonthlyUsage(first: 100{{ .cursor }}{{ if .date }}, date: "{{ .date }}"{{ end }}{{ if .namespace_id }}, namespaceId: "{{ .namespace_id }}"{{ end }}) { nodes { minutes shared_runners_duration: sharedRunnersDuration project { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: date
          in: query
          required: false
          description: Date for which to retrieve the usage data, should be the first day of a month. Defaults to the current month.
          schema:
            type: string
        - name: namespace_id
          in: query
          required: false
          description: Global ID of the Namespace for the project compute usage.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ciMinutesProjectMonthlyUsage:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                minutes:
                                  type: integer
                                  description: Number of compute minutes used by the project in the month.
                                shared_runners_duration:
                                  type: integer
                                  description: Total duration (in seconds) of shared runners use by the project for the month.
                                project:
                                  type: object
                                  description: Project identity (id, full_path, name)
                                  properties:
                                    id:
                                      type: string
                                    full_path:
                                      type: string
                                    name:
                                      type: string
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /api/graphql?resource=ci_minutes_usage&method=list:
    post:
      operationId: ci_minutes_usage_list
      summary: Compute usage data for a namespace.
      description: Compute usage data for a namespace. Generated from the GitLab GraphQL schema field Query.ciMinutesUsage (connection of CiMinutesNamespaceMonthlyUsage nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.ciMinutesUsage'
        url: https://docs.gitlab.com/api/graphql/reference/#queryciminutesusage
      x-stackQL-graphQL:
        id: gitlab.ci.ci_minutes_usage.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.ciMinutesUsage.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.ciMinutesUsage.pageInfo.endCursor
          terminateOnJsonPath: $.data.ciMinutesUsage.pageInfo.hasNextPage
        query: 'query { ciMinutesUsage(first: 100{{ .cursor }}{{ if .date }}, date: "{{ .date }}"{{ end }}{{ if .namespace_id }}, namespaceId: "{{ .namespace_id }}"{{ end }}) { nodes { minutes month month_iso8601: monthIso8601 shared_runners_duration: sharedRunnersDuration } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: date
          in: query
          required: false
          description: Date for which to retrieve the usage data, should be the first day of a month.
          schema:
            type: string
        - name: namespace_id
          in: query
          required: false
          description: Global ID of the Namespace for the monthly compute usage.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ciMinutesUsage:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                minutes:
                                  type: integer
                                  description: Total number of compute minutes used by all projects in the namespace.
                                month:
                                  type: string
                                  description: Month related to the usage data.
                                month_iso8601:
                                  type: string
                                  description: Month related to the usage data in ISO 8601 date format.
                                shared_runners_duration:
                                  type: integer
                                  description: Total duration (in seconds) of shared runners use by the namespace for the month.
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /api/graphql?resource=ci_pipeline_stage&method=get:
    post:
      operationId: ci_pipeline_stage_get
      summary: Stage belonging to a CI pipeline.
      description: Stage belonging to a CI pipeline. Generated from the GitLab GraphQL schema field Query.ciPipelineStage (CiStage).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.ciPipelineStage'
        url: https://docs.gitlab.com/api/graphql/reference/#querycipipelinestage
      x-stackQL-graphQL:
        id: gitlab.ci.ci_pipeline_stage.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { ciPipelineStage(id: "{{ .id }}") { id name status } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: Global ID of the CI stage.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ciPipelineStage:
                        type: object
                        properties:
                          id:
                            type: string
                            description: ID of the stage.
                          name:
                            type: string
                            description: Name of the stage.
                          status:
                            type: string
                            description: Status of the pipeline stage.
  /api/graphql?resource=ci_variables&method=list:
    post:
      operationId: ci_variables_list
      summary: List of the instance's CI/CD variables.
      description: List of the instance's CI/CD variables. Generated from the GitLab GraphQL schema field Query.ciVariables (connection of CiInstanceVariable nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.ciVariables'
        url: https://docs.gitlab.com/api/graphql/reference/#querycivariables
      x-stackQL-graphQL:
        id: gitlab.ci.ci_variables.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.ciVariables.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.ciVariables.pageInfo.endCursor
          terminateOnJsonPath: $.data.ciVariables.pageInfo.hasNextPage
        query: 'query { ciVariables(first: 100{{ .cursor }}{{ if .sort }}, sort: {{ .sort }}{{ end }}) { nodes { description hidden id key masked protected raw value variable_type: variableType } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: sort
          in: query
          required: false
          description: Sort order of results.
          schema:
            type: string
            enum:
              - KEY_ASC
              - KEY_DESC
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ciVariables:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                description:
                                  type: string
                                  description: Description of the variable.
                                hidden:
                                  type: boolean
                                  description: Indicates whether the variable is hidden.
                                id:
                                  type: string
                                  description: ID of the variable.
                                key:
                                  type: string
                                  description: Name of the variable.
                                masked:
                                  type: boolean
                                  description: Indicates whether the variable is masked.
                                protected:
                                  type: boolean
                                  description: Indicates whether the variable is protected.
                                raw:
                                  type: boolean
                                  description: Indicates whether the variable is raw.
                                value:
                                  type: string
                                  description: Value of the variable.
                                variable_type:
                                  type: string
                                  enum:
                                    - ENV_VAR
                                    - FILE
                                  description: Type of the variable.
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /api/graphql?resource=group_ci_variables&method=list:
    post:
      operationId: group_ci_variables_list
      summary: List of the group's CI/CD variables.
      description: List of the group's CI/CD variables. Generated from the GitLab GraphQL schema field Group.ciVariables (connection of CiGroupVariable nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.ciVariables'
        url: https://docs.gitlab.com/api/graphql/reference/#groupcivariables
      x-stackQL-graphQL:
        id: gitlab.ci.group_ci_variables.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.ciVariables.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.ciVariables.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.ciVariables.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { ciVariables(first: 100{{ .cursor }}{{ if .sort }}, sort: {{ .sort }}{{ end }}) { nodes { description environment_scope: environmentScope hidden id key masked protected raw value variable_type: variableType } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort order of results.
          schema:
            type: string
            enum:
              - KEY_ASC
              - KEY_DESC
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          ciVariables:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    description:
                                      type: string
                                      description: Description of the variable.
                                    environment_scope:
                                      type: string
                                      description: Scope defining the environments that can use the variable.
                                    hidden:
                                      type: boolean
                                      description: Indicates whether the variable is hidden.
                                    id:
                                      type: string
                                      description: ID of the variable.
                                    key:
                                      type: string
                                      description: Name of the variable.
                                    masked:
                                      type: boolean
                                      description: Indicates whether the variable is masked.
                                    protected:
                                      type: boolean
                                      description: Indicates whether the variable is protected.
                                    raw:
                                      type: boolean
                                      description: Indicates whether the variable is raw.
                                    value:
                                      type: string
                                      description: Value of the variable.
                                    variable_type:
                                      type: string
                                      enum:
                                        - ENV_VAR
                                        - FILE
                                      description: Type of the variable.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_pipeline_analytics&method=get:
    post:
      operationId: group_pipeline_analytics_get
      summary: Pipeline analytics.
      description: Pipeline analytics. Generated from the GitLab GraphQL schema field Group.pipelineAnalytics (PipelineAnalytics).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.pipelineAnalytics'
        url: https://docs.gitlab.com/api/graphql/reference/#grouppipelineanalytics
      x-stackQL-graphQL:
        id: gitlab.ci.group_pipeline_analytics.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { group(fullPath: "{{ .full_path }}") { pipelineAnalytics{{ if or .from_time .ref .source .to_time }}({{ if .from_time }}, fromTime: "{{ .from_time }}"{{ end }}{{ if .ref }}, ref: "{{ .ref }}"{{ end }}{{ if .source }}, source: {{ .source }}{{ end }}{{ if .to_time }}, toTime: "{{ .to_time }}"{{ end }}){{ end }} { month_pipelines_labels: monthPipelinesLabels month_pipelines_successful: monthPipelinesSuccessful month_pipelines_totals: monthPipelinesTotals pipeline_times_labels: pipelineTimesLabels pipeline_times_values: pipelineTimesValues week_pipelines_labels: weekPipelinesLabels week_pipelines_successful: weekPipelinesSuccessful week_pipelines_totals: weekPipelinesTotals year_pipelines_labels: yearPipelinesLabels year_pipelines_successful: yearPipelinesSuccessful year_pipelines_totals: yearPipelinesTotals } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: from_time
          in: query
          required: false
          description: Start of the requested time (in UTC). Defaults to the pipelines started in the past week.
          schema:
            type: string
        - name: ref
          in: query
          required: false
          description: Branch that triggered the pipeline.
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Source of the pipeline.
          schema:
            type: string
            enum:
              - UNKNOWN
              - PUSH
              - WEB
              - TRIGGER
              - SCHEDULE
              - API
              - EXTERNAL
              - PIPELINE
              - CHAT
              - WEBIDE
              - MERGE_REQUEST_EVENT
              - EXTERNAL_PULL_REQUEST_EVENT
              - PARENT_PIPELINE
              - ONDEMAND_DAST_SCAN
              - ONDEMAND_DAST_VALIDATION
              - SECURITY_ORCHESTRATION_POLICY
              - CONTAINER_REGISTRY_PUSH
              - DUO_WORKFLOW
              - PIPELINE_EXECUTION_POLICY_SCHEDULE
              - DEPENDENCY_MANAGEMENT_SECURITY_UPDATE
        - name: to_time
          in: query
          required: false
          description: End of the requested time (in UTC). Defaults to the pipelines started before the current date.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          pipelineAnalytics:
                            type: object
                            properties:
                              month_pipelines_labels:
                                type: array
                                items:
                                  type: string
                                  description: Labels for the monthly pipeline count. Only available for projects.
                              month_pipelines_successful:
                                type: array
                                items:
                                  type: integer
                                  description: Total monthly successful pipeline count. Only available for projects.
                              month_pipelines_totals:
                                type: array
                                items:
                                  type: integer
                                  description: Total monthly pipeline count. Only available for projects.
                              pipeline_times_labels:
                                type: array
                                items:
                                  type: string
                                  description: Pipeline times labels. Only available for projects.
                              pipeline_times_values:
                                type: array
                                items:
                                  type: integer
                                  description: Pipeline times. Only available for projects.
                              week_pipelines_labels:
                                type: array
                                items:
                                  type: string
                                  description: Labels for the weekly pipeline count. Only available for projects.
                              week_pipelines_successful:
                                type: array
                                items:
                                  type: integer
                                  description: Total weekly successful pipeline count. Only available for projects.
                              week_pipelines_totals:
                                type: array
                                items:
                                  type: integer
                                  description: Total weekly pipeline count. Only available for projects.
                              year_pipelines_labels:
                                type: array
                                items:
                                  type: string
                                  description: Labels for the yearly pipeline count. Only available for projects.
                              year_pipelines_successful:
                                type: array
                                items:
                                  type: integer
                                  description: Total yearly successful pipeline count. Only available for projects.
                              year_pipelines_totals:
                                type: array
                                items:
                                  type: integer
                                  description: Total yearly pipeline count. Only available for projects.
  /api/graphql?resource=group_pipeline_execution_policies&method=list:
    post:
      operationId: group_pipeline_execution_policies_list
      summary: Pipeline Execution Policies of the namespace.
      description: Pipeline Execution Policies of the namespace. Generated from the GitLab GraphQL schema field Group.pipelineExecutionPolicies (connection of PipelineExecutionPolicy nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.pipelineExecutionPolicies'
        url: https://docs.gitlab.com/api/graphql/reference/#grouppipelineexecutionpolicies
      x-stackQL-graphQL:
        id: gitlab.ci.group_pipeline_execution_policies.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.pipelineExecutionPolicies.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.pipelineExecutionPolicies.pageInfo.endCursor
