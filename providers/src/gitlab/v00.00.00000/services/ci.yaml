          schema:
            type: string
            enum:
              - INVALID
              - NOT_AVAILABLE
              - AVAILABLE
              - RECOMMENDED
        - name: version_prefix
          in: query
          required: false
          description: Filter runners by version. Runners that contain runner managers with the version at the start of the search term are returned. For example, the search term '14.' returns runner managers with versions '14.11.1' and '14.2.3'.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      runners:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                access_level:
                                  type: string
                                  enum:
                                    - NOT_PROTECTED
                                    - REF_PROTECTED
                                  description: Access level of the runner.
                                admin_url:
                                  type: string
                                  description: Admin URL of the runner. Only available for administrators.
                                contacted_at:
                                  type: string
                                  description: Timestamp of last contact from the runner.
                                created_at:
                                  type: string
                                  description: Timestamp of creation of the runner.
                                creation_state:
                                  type: string
                                  enum:
                                    - STARTED
                                    - FINISHED
                                  description: Runner creation state. Used to determine if a runner has been registered and has contacted the GitLab instance.
                                description:
                                  type: string
                                  description: Description of the runner.
                                edit_admin_url:
                                  type: string
                                  description: Admin form URL of the runner. Only available for administrators.
                                id:
                                  type: string
                                  description: ID of the runner.
                                job_execution_status:
                                  type: string
                                  enum:
                                    - IDLE
                                    - ACTIVE
                                  description: Job execution status of the runner.
                                locked:
                                  type: boolean
                                  description: Indicates the runner is locked.
                                maintenance_note:
                                  type: string
                                  description: Runner's maintenance notes.
                                maximum_timeout:
                                  type: integer
                                  description: Maximum timeout (in seconds) for jobs processed by the runner.
                                paused:
                                  type: boolean
                                  description: Indicates the runner is paused and not available to run jobs.
                                private_projects_minutes_cost_factor:
                                  type: number
                                  description: Private projects' "compute cost factor" associated with the runner (GitLab.com only).
                                public_projects_minutes_cost_factor:
                                  type: number
                                  description: Public projects' "compute cost factor" associated with the runner (GitLab.com only).
                                register_admin_url:
                                  type: string
                                  description: URL of the temporary registration page of the runner. Only available before the runner is registered. Only available for administrators.
                                run_untagged:
                                  type: boolean
                                  description: Indicates the runner is able to run untagged jobs.
                                runner_type:
                                  type: string
                                  enum:
                                    - INSTANCE_TYPE
                                    - GROUP_TYPE
                                    - PROJECT_TYPE
                                  description: Type of the runner.
                                short_sha:
                                  type: string
                                  description: First eight characters of the runner's token used to authenticate new job requests. Used as the runner's unique ID.
                                status:
                                  type: string
                                  enum:
                                    - ONLINE
                                    - OFFLINE
                                    - STALE
                                    - NEVER_CONTACTED
                                  description: Status of the runner.
                                tag_list:
                                  type: array
                                  items:
                                    type: string
                                    description: Tags associated with the runner.
                                token_expires_at:
                                  type: string
                                  description: Runner token expiration time.
                                upgrade_status:
                                  type: string
                                  enum:
                                    - INVALID
                                    - NOT_AVAILABLE
                                    - AVAILABLE
                                    - RECOMMENDED
                                  description: Availability of upgrades for the runner.
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
