openapi: 3.0.3
info:
  title: groups API
  description: 'Groups, namespaces and group-scoped resources - group details, descendant and shared groups, members, epics, iterations, contacts and organizations. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=group_cluster_agents&method=list:
    post:
      operationId: group_cluster_agents_list
      summary: Cluster agents associated with projects in the group and its subgroups.
      description: Cluster agents associated with projects in the group and its subgroups. Generated from the GitLab GraphQL schema field Group.clusterAgents (connection of ClusterAgent nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.clusterAgents'
        url: https://docs.gitlab.com/api/graphql/reference/#groupclusteragents
      x-stackQL-graphQL:
        id: gitlab.groups.group_cluster_agents.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.clusterAgents.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.clusterAgents.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.clusterAgents.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { clusterAgents(first: 100{{ .cursor }}{{ if .has_remote_development_enabled }}, hasRemoteDevelopmentEnabled: {{ .has_remote_development_enabled }}{{ end }}{{ if .has_vulnerabilities }}, hasVulnerabilities: {{ .has_vulnerabilities }}{{ end }}{{ if .has_workspaces_agent_config }}, hasWorkspacesAgentConfig: {{ .has_workspaces_agent_config }}{{ end }}) { nodes { created_at: createdAt id is_receptive: isReceptive name updated_at: updatedAt web_path: webPath project { id full_path: fullPath name } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: has_remote_development_enabled
          in: query
          required: false
          description: Returns only cluster agents which have been enabled with the remote development feature.
          schema:
            type: boolean
        - name: has_vulnerabilities
          in: query
          required: false
          description: Returns only cluster agents which have vulnerabilities.
          schema:
            type: boolean
        - name: has_workspaces_agent_config
          in: query
          required: false
          description: Returns only cluster agents which have an associated workspaces agent config.
          schema:
            type: boolean
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          clusterAgents:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    created_at:
                                      type: string
                                      description: Timestamp the cluster agent was created.
                                    id:
                                      type: string
                                      description: ID of the cluster agent.
                                    is_receptive:
                                      type: boolean
                                      description: Whether the cluster agent is receptive or not.
                                    name:
                                      type: string
                                      description: Name of the cluster agent.
                                    updated_at:
                                      type: string
                                      description: Timestamp the cluster agent was updated.
                                    web_path:
                                      type: string
                                      description: Web path of the cluster agent.
                                    project:
                                      type: object
                                      description: Project identity (id, full_path, name)
                                      properties:
                                        id:
                                          type: string
                                        full_path:
                                          type: string
                                        name:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_contact_state_counts&method=get:
    post:
      operationId: group_contact_state_counts_get
      summary: Counts of contacts by state for the group.
      description: Counts of contacts by state for the group. Generated from the GitLab GraphQL schema field Group.contactStateCounts (ContactStateCounts).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.contactStateCounts'
        url: https://docs.gitlab.com/api/graphql/reference/#groupcontactstatecounts
      x-stackQL-graphQL:
        id: gitlab.groups.group_contact_state_counts.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { group(fullPath: "{{ .full_path }}") { contactStateCounts{{ if or .search .state }}({{ if .search }}, search: "{{ .search }}"{{ end }}{{ if .state }}, state: {{ .state }}{{ end }}){{ end }} { active all_: all inactive } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Search term to find contacts with.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: State of the contacts to search for.
          schema:
            type: string
            enum:
              - all
              - active
              - inactive
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          contactStateCounts:
                            type: object
                            properties:
                              active:
                                type: integer
                                description: Number of contacts with state `ACTIVE`
                              all_:
                                type: integer
                                description: Number of contacts with state `ALL`
                              inactive:
                                type: integer
                                description: Number of contacts with state `INACTIVE`
  /api/graphql?resource=group_contacts&method=list:
    post:
      operationId: group_contacts_list
      summary: Find contacts of this group.
      description: Find contacts of this group. Generated from the GitLab GraphQL schema field Group.contacts (connection of CustomerRelationsContact nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.contacts'
        url: https://docs.gitlab.com/api/graphql/reference/#groupcontacts
      x-stackQL-graphQL:
        id: gitlab.groups.group_contacts.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.contacts.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.contacts.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.contacts.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { contacts(first: 100{{ .cursor }}{{ if .search }}, search: "{{ .search }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}{{ if .state }}, state: {{ .state }}{{ end }}) { nodes { active created_at: createdAt description email first_name: firstName id last_name: lastName phone updated_at: updatedAt } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Search term to find contacts with.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Criteria to sort contacts by.
          schema:
            type: string
            enum:
              - FIRST_NAME_ASC
              - FIRST_NAME_DESC
              - LAST_NAME_ASC
              - LAST_NAME_DESC
              - EMAIL_ASC
              - EMAIL_DESC
              - PHONE_ASC
              - PHONE_DESC
              - DESCRIPTION_ASC
              - DESCRIPTION_DESC
              - ORGANIZATION_ASC
              - ORGANIZATION_DESC
              - UPDATED_DESC
              - UPDATED_ASC
              - CREATED_DESC
              - CREATED_ASC
        - name: state
          in: query
          required: false
          description: State of the contacts to search for.
          schema:
            type: string
            enum:
              - all
              - active
              - inactive
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          contacts:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    active:
                                      type: boolean
                                      description: State of the contact.
                                    created_at:
                                      type: string
                                      description: Timestamp the contact was created.
                                    description:
                                      type: string
                                      description: Description of or notes for the contact.
                                    email:
                                      type: string
                                      description: Email address of the contact.
                                    first_name:
                                      type: string
                                      description: First name of the contact.
                                    id:
                                      type: string
                                      description: Internal ID of the contact.
                                    last_name:
                                      type: string
                                      description: Last name of the contact.
                                    phone:
                                      type: string
                                      description: Phone number of the contact.
                                    updated_at:
                                      type: string
                                      description: Timestamp the contact was last updated.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_custom_emoji&method=list:
    post:
      operationId: group_custom_emoji_list
      summary: Custom emoji in this namespace.
      description: Custom emoji in this namespace. Generated from the GitLab GraphQL schema field Group.customEmoji (connection of CustomEmoji nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.customEmoji'
        url: https://docs.gitlab.com/api/graphql/reference/#groupcustomemoji
      x-stackQL-graphQL:
        id: gitlab.groups.group_custom_emoji.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.customEmoji.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.customEmoji.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.customEmoji.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { customEmoji(first: 100{{ .cursor }}{{ if .include_ancestor_groups }}, includeAncestorGroups: {{ .include_ancestor_groups }}{{ end }}) { nodes { created_at: createdAt external id name url } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: include_ancestor_groups
          in: query
          required: false
          description: Includes custom emoji from parent groups.
          schema:
            type: boolean
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          customEmoji:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    created_at:
                                      type: string
                                      description: Timestamp of when the custom emoji was created.
                                    external:
                                      type: boolean
                                      description: Whether the emoji is an external link.
                                    id:
                                      type: string
                                      description: ID of the emoji.
                                    name:
                                      type: string
                                      description: Name of the emoji.
                                    url:
                                      type: string
                                      description: Link to file of the emoji.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_descendant_groups&method=list:
    post:
      operationId: group_descendant_groups_list
      summary: List of descendant groups of this group.
      description: List of descendant groups of this group. Generated from the GitLab GraphQL schema field Group.descendantGroups (connection of Group nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.descendantGroups'
        url: https://docs.gitlab.com/api/graphql/reference/#groupdescendantgroups
      x-stackQL-graphQL:
        id: gitlab.groups.group_descendant_groups.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.descendantGroups.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.descendantGroups.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.descendantGroups.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { descendantGroups(first: 100{{ .cursor }}{{ if .archived }}, archived: {{ .archived }}{{ end }}{{ if .include_parent_descendants }}, includeParentDescendants: {{ .include_parent_descendants }}{{ end }}{{ if .owned }}, owned: {{ .owned }}{{ end }}{{ if .search }}, search: "{{ .search }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}) { nodes { actual_repository_size_limit: actualRepositorySizeLimit actual_size_limit: actualSizeLimit additional_purchased_storage_size: additionalPurchasedStorageSize admin_edit_path: adminEditPath admin_show_path: adminShowPath allow_stale_runner_pruning: allowStaleRunnerPruning archived auto_devops_enabled: autoDevopsEnabled avatar_url: avatarUrl billable_members_count: billableMembersCount contains_locked_projects: containsLockedProjects created_at: createdAt cross_project_pipeline_available: crossProjectPipelineAvailable dependency_proxy_blob_count: dependencyProxyBlobCount dependency_proxy_image_count: dependencyProxyImageCount dependency_proxy_image_prefix: dependencyProxyImagePrefix dependency_proxy_total_size: dependencyProxyTotalSize dependency_proxy_total_size_bytes: dependencyProxyTotalSizeBytes descendant_groups_count: descendantGroupsCount description edit_path: editPath emails_disabled: emailsDisabled emails_enabled: emailsEnabled enforce_free_user_cap: enforceFreeUserCap full_name: fullName full_path: fullPath group_members_count: groupMembersCount id is_linked_to_subscription: isLinkedToSubscription is_self_archived: isSelfArchived lfs_enabled: lfsEnabled lock_math_rendering_limits_enabled: lockMathRenderingLimitsEnabled math_rendering_limits_enabled: mathRenderingLimitsEnabled mentions_disabled: mentionsDisabled name path project_creation_level: projectCreationLevel projects_count: projectsCount repository_size_excess_project_count: repositorySizeExcessProjectCount request_access_enabled: requestAccessEnabled require_two_factor_authentication: requireTwoFactorAuthentication share_with_group_lock: shareWithGroupLock shared_runners_setting: sharedRunnersSetting storage_size_limit: storageSizeLimit subgroup_creation_level: subgroupCreationLevel total_repository_size: totalRepositorySize total_repository_size_excess: totalRepositorySizeExcess two_factor_grace_period: twoFactorGracePeriod updated_at: updatedAt visibility web_path: webPath web_url: webUrl } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: archived
          in: query
          required: false
          description: Filters archived groups.
          schema:
            type: boolean
        - name: include_parent_descendants
          in: query
          required: false
          description: List of descendant groups of the parent group.
          schema:
            type: boolean
        - name: owned
          in: query
          required: false
          description: Limit result to groups owned by authenticated user.
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          description: Search query for group name or group full path.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort groups by given criteria.
          schema:
            type: string
            enum:
              - SIMILARITY
              - CREATED_AT_ASC
              - CREATED_AT_DESC
              - UPDATED_AT_ASC
              - UPDATED_AT_DESC
              - NAME_ASC
              - NAME_DESC
              - PATH_ASC
              - PATH_DESC
              - ID_ASC
              - ID_DESC
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          descendantGroups:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    actual_repository_size_limit:
                                      type: number
                                      description: Size limit for repositories in the namespace in bytes. This limit only applies to namespaces under Project limit enforcement.
                                    actual_size_limit:
                                      type: number
                                      description: The actual storage size limit (in bytes) based on the enforcement type of either repository or namespace. This limit is agnostic of enforcement type.
                                    additional_purchased_storage_size:
                                      type: number
                                      description: Additional storage purchased for the root namespace in bytes.
                                    admin_edit_path:
                                      type: string
                                      description: Admin path for editing group. Only available to admins.
                                    admin_show_path:
                                      type: string
                                      description: Admin path of the group. Only available to admins.
                                    allow_stale_runner_pruning:
                                      type: boolean
                                      description: Indicates whether to regularly prune stale group runners. Defaults to false.
                                    archived:
                                      type: boolean
                                      description: Indicates if the group or any ancestor is archived.
                                    auto_devops_enabled:
                                      type: boolean
                                      description: Indicates whether Auto DevOps is enabled for all projects within the group.
                                    avatar_url:
                                      type: string
                                      description: Avatar URL of the group.
                                    billable_members_count:
                                      type: integer
                                      description: Number of billable users in the group.
                                    contains_locked_projects:
                                      type: boolean
                                      description: Includes at least one project where the repository size exceeds the limit. This only applies to namespaces under Project limit enforcement.
                                    created_at:
                                      type: string
                                      description: Timestamp of the group creation.
                                    cross_project_pipeline_available:
                                      type: boolean
                                      description: Indicates if the cross_project_pipeline feature is available for the namespace.
                                    dependency_proxy_blob_count:
                                      type: integer
                                      description: Number of dependency proxy blobs cached in the group.
                                    dependency_proxy_image_count:
                                      type: integer
                                      description: Number of dependency proxy images cached in the group.
                                    dependency_proxy_image_prefix:
                                      type: string
                                      description: Prefix for pulling images when using the dependency proxy.
                                    dependency_proxy_total_size:
                                      type: string
                                      description: Total size of the dependency proxy cached images.
                                    dependency_proxy_total_size_bytes:
                                      type: string
                                      description: Total size of the dependency proxy cached images in bytes, encoded as a string.
                                    descendant_groups_count:
                                      type: integer
                                      description: Count of direct descendant groups of the group.
                                    description:
                                      type: string
                                      description: Description of the namespace.
                                    edit_path:
                                      type: string
                                      description: Path for editing group.
                                    emails_disabled:
                                      type: boolean
                                      description: Indicates if a group has email notifications disabled.
                                    emails_enabled:
                                      type: boolean
                                      description: Indicates if a group has email notifications enabled.
                                    enforce_free_user_cap:
                                      type: boolean
                                      description: Indicates whether the group has limited users for a free plan.
                                    full_name:
                                      type: string
                                      description: Full name of the group.
                                    full_path:
                                      type: string
                                      description: Full path of the group.
                                    group_members_count:
                                      type: integer
                                      description: Count of direct members of the group.
                                    id:
                                      type: string
                                      description: ID of the group.
                                    is_linked_to_subscription:
                                      type: boolean
                                      description: Indicates if group is linked to a subscription.
                                    is_self_archived:
                                      type: boolean
                                      description: Indicates if the group is archived.
                                    lfs_enabled:
                                      type: boolean
                                      description: Indicates if Large File Storage (LFS) is enabled for namespace.
                                    lock_math_rendering_limits_enabled:
                                      type: boolean
                                      description: Indicates if math rendering limits are locked for all descendant groups.
                                    math_rendering_limits_enabled:
                                      type: boolean
                                      description: Indicates if math rendering limits are used for the group.
                                    mentions_disabled:
                                      type: boolean
                                      description: Indicates if a group is disabled from getting mentioned.
                                    name:
                                      type: string
                                      description: Name of the group.
                                    path:
                                      type: string
                                      description: Path of the namespace.
                                    project_creation_level:
                                      type: string
                                      description: Permission level required to create projects in the group.
                                    projects_count:
                                      type: integer
                                      description: Count of direct projects in the group.
                                    repository_size_excess_project_count:
                                      type: integer
                                      description: Number of projects in the root namespace where the repository size exceeds the limit. This only applies to namespaces under Project limit enforcement.
                                    request_access_enabled:
                                      type: boolean
                                      description: Indicates if users can request access to namespace.
                                    require_two_factor_authentication:
                                      type: boolean
                                      description: Indicates if all users in the group are required to set up two-factor authentication.
                                    share_with_group_lock:
                                      type: boolean
                                      description: Indicates if sharing a project with another group within the group is prevented.
                                    shared_runners_setting:
                                      type: string
                                      enum:
                                        - DISABLED_AND_UNOVERRIDABLE
                                        - DISABLED_AND_OVERRIDABLE
                                        - ENABLED
                                      description: Shared runners availability for the namespace and its descendants.
                                    storage_size_limit:
                                      type: number
                                      description: The storage limit (in bytes) included with the root namespace plan. This limit only applies to namespaces under namespace limit enforcement.
                                    subgroup_creation_level:
                                      type: string
                                      description: Permission level required to create subgroups within the group.
                                    total_repository_size:
                                      type: number
                                      description: Total repository size of all projects in the root namespace in bytes.
                                    total_repository_size_excess:
                                      type: number
                                      description: Total excess repository size of all projects in the root namespace in bytes. This only applies to namespaces under Project limit enforcement.
                                    two_factor_grace_period:
                                      type: integer
                                      description: Time before two-factor authentication is enforced.
                                    updated_at:
                                      type: string
                                      description: Timestamp of when the group was last updated.
                                    visibility:
                                      type: string
                                      description: Visibility of the namespace.
                                    web_path:
                                      type: string
                                      description: Web path of the group.
                                    web_url:
                                      type: string
                                      description: Web URL of the group.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_environment_scopes&method=list:
    post:
      operationId: group_environment_scopes_list
      summary: Environment scopes of the group.
      description: Environment scopes of the group. Generated from the GitLab GraphQL schema field Group.environmentScopes (connection of CiGroupEnvironmentScope nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.environmentScopes'
        url: https://docs.gitlab.com/api/graphql/reference/#groupenvironmentscopes
      x-stackQL-graphQL:
        id: gitlab.groups.group_environment_scopes.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.environmentScopes.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.environmentScopes.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.environmentScopes.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { environmentScopes(first: 100{{ .cursor }}{{ if .name }}, name: "{{ .name }}"{{ end }}{{ if .search }}, search: "{{ .search }}"{{ end }}) { nodes { name } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Name of the environment scope.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Search query for environment scope name.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          environmentScopes:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      description: Scope name defininig the enviromnments that can use the variable.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_group_members&method=list:
    post:
      operationId: group_group_members_list
