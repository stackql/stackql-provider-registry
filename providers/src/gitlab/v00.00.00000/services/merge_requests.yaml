openapi: 3.0.3
info:
  title: merge_requests API
  description: 'Merge requests - project and group merge requests, merge request details, violations and access levels. Read-only: every method is a GraphQL query mapped to SELECT.'
  version: v00.00.00000
servers:
  - url: https://{host:[^/]+}
    variables:
      host:
        default: gitlab.com
        description: 'GitLab host, with an optional port (default gitlab.com). Resolved from the GITLAB_HOST environment variable when it is set (x-stackQL-envVar); a WHERE host value always takes precedence. Self-managed instances: the provider is generated from the gitlab.com schema, so older instances may reject fields they do not serve.'
        x-stackQL-envVar: GITLAB_HOST
paths:
  /api/graphql?resource=group_merge_request_violations&method=list:
    post:
      operationId: group_merge_request_violations_list
      summary: Compliance violations reported on merge requests merged within the group.
      description: Compliance violations reported on merge requests merged within the group. Generated from the GitLab GraphQL schema field Group.mergeRequestViolations (connection of ComplianceViolation nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.mergeRequestViolations'
        url: https://docs.gitlab.com/api/graphql/reference/#groupmergerequestviolations
      x-stackQL-graphQL:
        id: gitlab.merge_requests.group_merge_request_violations.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.mergeRequestViolations.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.mergeRequestViolations.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.mergeRequestViolations.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { mergeRequestViolations(first: 100{{ .cursor }}{{ if .sort }}, sort: {{ .sort }}{{ end }}) { nodes { id reason severity_level: severityLevel } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: List compliance violations by sort order.
          schema:
            type: string
            enum:
              - SEVERITY_LEVEL_DESC
              - SEVERITY_LEVEL_ASC
              - VIOLATION_REASON_DESC
              - VIOLATION_REASON_ASC
              - MERGE_REQUEST_TITLE_DESC
              - MERGE_REQUEST_TITLE_ASC
              - MERGED_AT_DESC
              - MERGED_AT_ASC
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          mergeRequestViolations:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: Compliance violation ID.
                                    reason:
                                      type: string
                                      enum:
                                        - APPROVED_BY_MERGE_REQUEST_AUTHOR
                                        - APPROVED_BY_COMMITTER
                                        - APPROVED_BY_INSUFFICIENT_USERS
                                      description: Reason the compliance violation occurred.
                                    severity_level:
                                      type: string
                                      enum:
                                        - INFO
                                        - LOW
                                        - MEDIUM
                                        - HIGH
                                        - CRITICAL
                                      description: Severity of the compliance violation.
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=group_merge_requests&method=list:
    post:
      operationId: group_merge_requests_list
      summary: Merge requests for projects in this group.
      description: Merge requests for projects in this group. Generated from the GitLab GraphQL schema field Group.mergeRequests (connection of MergeRequest nodes).
      externalDocs:
        description: 'GitLab GraphQL API reference: Group.mergeRequests'
        url: https://docs.gitlab.com/api/graphql/reference/#groupmergerequests
      x-stackQL-graphQL:
        id: gitlab.merge_requests.group_merge_requests.list
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.group.mergeRequests.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.group.mergeRequests.pageInfo.endCursor
          terminateOnJsonPath: $.data.group.mergeRequests.pageInfo.hasNextPage
        query: 'query { group(fullPath: "{{ .full_path }}") { mergeRequests(first: 100{{ .cursor }}{{ if .assignee_username }}, assigneeUsername: "{{ .assignee_username }}"{{ end }}{{ if .assignee_wildcard_id }}, assigneeWildcardId: {{ .assignee_wildcard_id }}{{ end }}{{ if .author_username }}, authorUsername: "{{ .author_username }}"{{ end }}{{ if .closed_after }}, closedAfter: "{{ .closed_after }}"{{ end }}{{ if .closed_before }}, closedBefore: "{{ .closed_before }}"{{ end }}{{ if .created_after }}, createdAfter: "{{ .created_after }}"{{ end }}{{ if .created_before }}, createdBefore: "{{ .created_before }}"{{ end }}{{ if .deployed_after }}, deployedAfter: "{{ .deployed_after }}"{{ end }}{{ if .deployed_before }}, deployedBefore: "{{ .deployed_before }}"{{ end }}{{ if .deployment_id }}, deploymentId: "{{ .deployment_id }}"{{ end }}{{ if .draft }}, draft: {{ .draft }}{{ end }}{{ if .environment_name }}, environmentName: "{{ .environment_name }}"{{ end }}{{ if .include_archived }}, includeArchived: {{ .include_archived }}{{ end }}{{ if .include_subgroups }}, includeSubgroups: {{ .include_subgroups }}{{ end }}{{ if .merged_after }}, mergedAfter: "{{ .merged_after }}"{{ end }}{{ if .merged_before }}, mergedBefore: "{{ .merged_before }}"{{ end }}{{ if .merged_by }}, mergedBy: "{{ .merged_by }}"{{ end }}{{ if .milestone_title }}, milestoneTitle: "{{ .milestone_title }}"{{ end }}{{ if .milestone_wildcard_id }}, milestoneWildcardId: {{ .milestone_wildcard_id }}{{ end }}{{ if .my_reaction_emoji }}, myReactionEmoji: "{{ .my_reaction_emoji }}"{{ end }}{{ if .release_tag }}, releaseTag: "{{ .release_tag }}"{{ end }}{{ if .reviewer_username }}, reviewerUsername: "{{ .reviewer_username }}"{{ end }}{{ if .reviewer_wildcard_id }}, reviewerWildcardId: {{ .reviewer_wildcard_id }}{{ end }}{{ if .search }}, search: "{{ .search }}"{{ end }}{{ if .sort }}, sort: {{ .sort }}{{ end }}{{ if .state }}, state: {{ .state }}{{ end }}{{ if .subscribed }}, subscribed: {{ .subscribed }}{{ end }}{{ if .updated_after }}, updatedAfter: "{{ .updated_after }}"{{ end }}{{ if .updated_before }}, updatedBefore: "{{ .updated_before }}"{{ end }}) { nodes { allow_collaboration: allowCollaboration allows_multiple_assignees: allowsMultipleAssignees allows_multiple_reviewers: allowsMultipleReviewers approvals_left: approvalsLeft approvals_required: approvalsRequired approved auto_merge_enabled: autoMergeEnabled auto_merge_strategy: autoMergeStrategy closed_at: closedAt commit_count: commitCount conflicts created_at: createdAt description detailed_merge_status: detailedMergeStatus discussion_locked: discussionLocked downvotes draft force_remove_source_branch: forceRemoveSourceBranch has_ci: hasCi hidden human_time_estimate: humanTimeEstimate human_total_time_spent: humanTotalTimeSpent id iid in_progress_merge_commit_sha: inProgressMergeCommitSha merge_after: mergeAfter merge_commit_sha: mergeCommitSha merge_error: mergeError merge_ongoing: mergeOngoing merge_status_enum: mergeStatusEnum mergeable merged_at: mergedAt name prepared_at: preparedAt project_id: projectId rebase_commit_sha: rebaseCommitSha reference resolvable_discussions_count: resolvableDiscussionsCount resolved_discussions_count: resolvedDiscussionsCount retargeted should_remove_source_branch: shouldRemoveSourceBranch source_branch: sourceBranch source_project_id: sourceProjectId squash squash_on_merge: squashOnMerge squash_read_only: squashReadOnly state supports_lock_on_merge: supportsLockOnMerge target_branch: targetBranch target_branch_exists: targetBranchExists target_branch_path: targetBranchPath target_project_id: targetProjectId time_estimate: timeEstimate title total_time_spent: totalTimeSpent updated_at: updatedAt upvotes user_discussions_count: userDiscussionsCount user_notes_count: userNotesCount web_path: webPath web_url: webUrl author { id username name } project { id full_path: fullPath name } milestone { id title } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: full_path
          in: query
          required: true
          description: Full path of the group, for example gitlab-org
          schema:
            type: string
        - name: assignee_username
          in: query
          required: false
          description: Username of the assignee.
          schema:
            type: string
        - name: assignee_wildcard_id
          in: query
          required: false
          description: Filter by assignee presence. Incompatible with assigneeUsernames and assigneeUsername.
          schema:
            type: string
            enum:
              - NONE
              - ANY
              - ME
        - name: author_username
          in: query
          required: false
          description: Username of the author.
          schema:
            type: string
        - name: closed_after
          in: query
          required: false
          description: Merge requests closed after the date.
          schema:
            type: string
        - name: closed_before
          in: query
          required: false
          description: Merge requests closed before the date.
          schema:
            type: string
        - name: created_after
          in: query
          required: false
          description: Merge requests created after the timestamp.
          schema:
            type: string
        - name: created_before
          in: query
          required: false
          description: Merge requests created before the timestamp.
          schema:
            type: string
        - name: deployed_after
          in: query
          required: false
          description: Merge requests deployed after the timestamp.
          schema:
            type: string
        - name: deployed_before
          in: query
          required: false
          description: Merge requests deployed before the timestamp.
          schema:
            type: string
        - name: deployment_id
          in: query
          required: false
          description: ID of the deployment.
          schema:
            type: string
        - name: draft
          in: query
          required: false
          description: Limit result to draft merge requests.
          schema:
            type: boolean
        - name: environment_name
          in: query
          required: false
          description: Environment merge requests have been deployed to.
          schema:
            type: string
        - name: include_archived
          in: query
          required: false
          description: Return merge requests from archived projects
          schema:
            type: boolean
        - name: include_subgroups
          in: query
          required: false
          description: Include merge requests belonging to subgroups
          schema:
            type: boolean
        - name: merged_after
          in: query
          required: false
          description: Merge requests merged after the date.
          schema:
            type: string
        - name: merged_before
          in: query
          required: false
          description: Merge requests merged before the date.
          schema:
            type: string
        - name: merged_by
          in: query
          required: false
          description: Username of the merger.
          schema:
            type: string
        - name: milestone_title
          in: query
          required: false
          description: Title of the milestone. Incompatible with milestoneWildcardId.
          schema:
            type: string
        - name: milestone_wildcard_id
          in: query
          required: false
          description: Filter issues by milestone ID wildcard. Incompatible with milestoneTitle.
          schema:
            type: string
            enum:
              - NONE
              - ANY
              - STARTED
              - UPCOMING
        - name: my_reaction_emoji
          in: query
          required: false
          description: Filter by your reaction emoji.
          schema:
            type: string
        - name: release_tag
          in: query
          required: false
          description: Filter by release tag.
          schema:
            type: string
        - name: reviewer_username
          in: query
          required: false
          description: Username of the reviewer.
          schema:
            type: string
        - name: reviewer_wildcard_id
          in: query
          required: false
          description: Filter by reviewer presence. Incompatible with reviewerUsername.
          schema:
            type: string
            enum:
              - NONE
              - ANY
        - name: search
          in: query
          required: false
          description: Search query for title or description.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort merge requests by the criteria.
          schema:
            type: string
            enum:
              - MERGED_AT_ASC
              - MERGED_AT_DESC
              - CLOSED_AT_ASC
              - CLOSED_AT_DESC
              - TITLE_ASC
              - TITLE_DESC
              - POPULARITY_ASC
              - POPULARITY_DESC
              - PRIORITY_ASC
              - PRIORITY_DESC
              - LABEL_PRIORITY_ASC
              - LABEL_PRIORITY_DESC
              - MILESTONE_DUE_ASC
              - MILESTONE_DUE_DESC
              - UPDATED_DESC
              - UPDATED_ASC
              - CREATED_DESC
              - CREATED_ASC
        - name: state
          in: query
          required: false
          description: Merge request state. If provided, all resolved merge requests will have the state.
          schema:
            type: string
            enum:
              - merged
              - opened
              - closed
              - locked
              - all
        - name: subscribed
          in: query
          required: false
          description: Merge requests the current user is subscribed to.
          schema:
            type: string
            enum:
              - EXPLICITLY_SUBSCRIBED
              - EXPLICITLY_UNSUBSCRIBED
        - name: updated_after
          in: query
          required: false
          description: Merge requests updated after the timestamp.
          schema:
            type: string
        - name: updated_before
          in: query
          required: false
          description: Merge requests updated before the timestamp.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group:
                        type: object
                        properties:
                          mergeRequests:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    allow_collaboration:
                                      type: boolean
                                      description: Indicates if members of the target project can push to the fork.
                                    allows_multiple_assignees:
                                      type: boolean
                                      description: Allows assigning multiple users to a merge request.
                                    allows_multiple_reviewers:
                                      type: boolean
                                      description: Allows assigning multiple reviewers to a merge request.
                                    approvals_left:
                                      type: integer
                                      description: Number of approvals left.
                                    approvals_required:
                                      type: integer
                                      description: Number of approvals required.
                                    approved:
                                      type: boolean
                                      description: Indicates if the merge request has all the required approvals.
                                    auto_merge_enabled:
                                      type: boolean
                                      description: Indicates if auto merge is enabled for the merge request.
                                    auto_merge_strategy:
                                      type: string
                                      description: Selected auto merge strategy.
                                    closed_at:
                                      type: string
                                      description: Timestamp of when the merge request was closed, null if not closed.
                                    commit_count:
                                      type: integer
                                      description: Number of commits in the merge request.
                                    conflicts:
                                      type: boolean
                                      description: Indicates if the merge request has conflicts.
                                    created_at:
                                      type: string
                                      description: Timestamp of when the merge request was created.
                                    description:
                                      type: string
                                      description: Description of the merge request (Markdown rendered as HTML for caching).
                                    detailed_merge_status:
                                      type: string
                                      enum:
                                        - UNCHECKED
                                        - CHECKING
                                        - MERGEABLE
                                        - COMMITS_STATUS
                                        - CI_MUST_PASS
                                        - CI_STILL_RUNNING
                                        - DISCUSSIONS_NOT_RESOLVED
                                        - DRAFT_STATUS
                                        - NOT_OPEN
                                        - NOT_APPROVED
                                        - BLOCKED_STATUS
                                        - EXTERNAL_STATUS_CHECKS
                                        - PREPARING
                                        - JIRA_ASSOCIATION
                                        - CONFLICT
                                        - NEED_REBASE
                                        - APPROVALS_SYNCING
                                        - LOCKED_PATHS
                                        - LOCKED_LFS_FILES
                                        - MERGE_TIME
                                        - SECURITY_POLICIES_VIOLATIONS
                                        - TITLE_NOT_MATCHING
                                        - REQUESTED_CHANGES
                                        - SECURITY_POLICY_PIPELINE_CHECK
                                      description: Detailed merge status of the merge request.
                                    discussion_locked:
                                      type: boolean
                                      description: Indicates if comments on the merge request are locked to members only.
                                    downvotes:
                                      type: integer
                                      description: Number of downvotes for the merge request.
                                    draft:
                                      type: boolean
                                      description: Indicates if the merge request is a draft.
                                    force_remove_source_branch:
                                      type: boolean
                                      description: Indicates if the project settings will lead to source branch deletion after merge.
                                    has_ci:
                                      type: boolean
                                      description: Indicates if the merge request has CI.
                                    hidden:
                                      type: boolean
                                      description: Indicates the merge request is hidden because the author has been banned.
                                    human_time_estimate:
                                      type: string
                                      description: Human-readable time estimate of the merge request.
                                    human_total_time_spent:
                                      type: string
                                      description: Human-readable total time reported as spent on the merge request.
                                    id:
                                      type: string
                                      description: ID of the merge request.
                                    iid:
                                      type: string
                                      description: Internal ID of the merge request.
                                    in_progress_merge_commit_sha:
                                      type: string
                                      description: Commit SHA of the merge request if merge is in progress.
                                    merge_after:
                                      type: string
                                      description: Date after which the merge request can be merged.
                                    merge_commit_sha:
                                      type: string
                                      description: SHA of the merge request commit (set once merged).
                                    merge_error:
                                      type: string
                                      description: Error message due to a merge error.
                                    merge_ongoing:
                                      type: boolean
                                      description: Indicates if a merge is currently occurring.
                                    merge_status_enum:
                                      type: string
                                      enum:
                                        - UNCHECKED
                                        - CHECKING
                                        - CAN_BE_MERGED
                                        - CANNOT_BE_MERGED
                                        - CANNOT_BE_MERGED_RECHECK
                                      description: Merge status of the merge request.
                                    mergeable:
                                      type: boolean
                                      description: Indicates if the merge request is mergeable.
                                    merged_at:
                                      type: string
                                      description: Timestamp of when the merge request was merged, null if not merged.
                                    name:
                                      type: string
                                      description: Name or title of the object.
                                    prepared_at:
                                      type: string
                                      description: Timestamp of when the merge request was prepared.
                                    project_id:
                                      type: integer
                                      description: ID of the merge request project.
                                    rebase_commit_sha:
                                      type: string
                                      description: Rebase commit SHA of the merge request.
                                    reference:
                                      type: string
                                      description: Internal reference of the merge request. Returned in shortened format by default.
                                    resolvable_discussions_count:
                                      type: integer
                                      description: Number of user discussions that are resolvable in the merge request.
                                    resolved_discussions_count:
                                      type: integer
                                      description: Number of user discussions that are resolved in the merge request.
                                    retargeted:
                                      type: boolean
                                      description: Indicates if merge request was retargeted.
                                    should_remove_source_branch:
                                      type: boolean
                                      description: Indicates if the source branch of the merge request will be deleted after merge.
                                    source_branch:
                                      type: string
                                      description: Source branch of the merge request.
                                    source_project_id:
                                      type: integer
                                      description: ID of the merge request source project.
                                    squash:
                                      type: boolean
                                      description: Indicates if the merge request is set to be squashed when merged. [Project settings](https://docs.gitlab.com/user/project/merge_requests/squash_and_merge/#configure-squash-options-for-a-project) may override this value. Use `squash_on_merge` instead to take project squash options into account.
                                    squash_on_merge:
                                      type: boolean
                                      description: Indicates if the merge request will be squashed when merged.
                                    squash_read_only:
                                      type: boolean
                                      description: Indicates if `squashReadOnly` is enabled.
                                    state:
                                      type: string
                                      enum:
                                        - merged
                                        - opened
                                        - closed
                                        - locked
                                        - all
                                      description: State of the merge request.
                                    supports_lock_on_merge:
                                      type: boolean
                                      description: Indicates if the merge request supports locked labels.
                                    target_branch:
                                      type: string
                                      description: Target branch of the merge request.
                                    target_branch_exists:
                                      type: boolean
                                      description: Indicates if the target branch of the merge request exists.
                                    target_branch_path:
                                      type: string
                                      description: Path to the target branch of the merge request.
                                    target_project_id:
                                      type: integer
                                      description: ID of the merge request target project.
                                    time_estimate:
                                      type: integer
                                      description: Time estimate of the merge request.
                                    title:
                                      type: string
                                      description: Title of the merge request.
                                    total_time_spent:
                                      type: integer
                                      description: Total time (in seconds) reported as spent on the merge request.
                                    updated_at:
                                      type: string
                                      description: Timestamp of when the merge request was last updated.
                                    upvotes:
                                      type: integer
                                      description: Number of upvotes for the merge request.
                                    user_discussions_count:
                                      type: integer
                                      description: Number of user discussions in the merge request.
                                    user_notes_count:
                                      type: integer
                                      description: User notes count of the merge request.
                                    web_path:
                                      type: string
                                      description: Web path of the merge request.
                                    web_url:
                                      type: string
                                      description: Web URL of the merge request.
                                    author:
                                      type: object
                                      description: MergeRequestAuthor identity (id, username, name)
                                      properties:
                                        id:
                                          type: string
                                        username:
                                          type: string
                                        name:
                                          type: string
                                    project:
                                      type: object
                                      description: Project identity (id, full_path, name)
                                      properties:
                                        id:
                                          type: string
                                        full_path:
                                          type: string
                                        name:
                                          type: string
                                    milestone:
                                      type: object
                                      description: Milestone identity (id, title)
                                      properties:
                                        id:
                                          type: string
                                        title:
                                          type: string
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /api/graphql?resource=merge_request&method=get:
    post:
      operationId: merge_request_get
      summary: Find a merge request.
      description: Find a merge request. Generated from the GitLab GraphQL schema field Query.mergeRequest (MergeRequest).
      externalDocs:
        description: 'GitLab GraphQL API reference: Query.mergeRequest'
        url: https://docs.gitlab.com/api/graphql/reference/#querymergerequest
      x-stackQL-graphQL:
        id: gitlab.merge_requests.merge_request.get
        url: https://gitlab.com/api/graphql
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { mergeRequest(id: "{{ .id }}") { allow_collaboration: allowCollaboration allows_multiple_assignees: allowsMultipleAssignees allows_multiple_reviewers: allowsMultipleReviewers approvals_left: approvalsLeft approvals_required: approvalsRequired approved auto_merge_enabled: autoMergeEnabled auto_merge_strategy: autoMergeStrategy closed_at: closedAt commit_count: commitCount conflicts created_at: createdAt description detailed_merge_status: detailedMergeStatus discussion_locked: discussionLocked downvotes draft force_remove_source_branch: forceRemoveSourceBranch has_ci: hasCi hidden human_time_estimate: humanTimeEstimate human_total_time_spent: humanTotalTimeSpent id iid in_progress_merge_commit_sha: inProgressMergeCommitSha merge_after: mergeAfter merge_commit_sha: mergeCommitSha merge_error: mergeError merge_ongoing: mergeOngoing merge_status_enum: mergeStatusEnum mergeable merged_at: mergedAt name prepared_at: preparedAt project_id: projectId rebase_commit_sha: rebaseCommitSha reference resolvable_discussions_count: resolvableDiscussionsCount resolved_discussions_count: resolvedDiscussionsCount retargeted should_remove_source_branch: shouldRemoveSourceBranch source_branch: sourceBranch source_project_id: sourceProjectId squash squash_on_merge: squashOnMerge squash_read_only: squashReadOnly state supports_lock_on_merge: supportsLockOnMerge target_branch: targetBranch target_branch_exists: targetBranchExists target_branch_path: targetBranchPath target_project_id: targetProjectId time_estimate: timeEstimate title total_time_spent: totalTimeSpent updated_at: updatedAt upvotes user_discussions_count: userDiscussionsCount user_notes_count: userNotesCount web_path: webPath web_url: webUrl author { id username name } project { id full_path: fullPath name } milestone { id title } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: Global ID of the merge request.
          schema:
            type: string
      responses:
        '200':
          description: GraphQL response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mergeRequest:
                        type: object
                        properties:
                          allow_collaboration:
                            type: boolean
                            description: Indicates if members of the target project can push to the fork.
                          allows_multiple_assignees:
                            type: boolean
                            description: Allows assigning multiple users to a merge request.
                          allows_multiple_reviewers:
                            type: boolean
                            description: Allows assigning multiple reviewers to a merge request.
                          approvals_left:
                            type: integer
                            description: Number of approvals left.
                          approvals_required:
                            type: integer
                            description: Number of approvals required.
                          approved:
