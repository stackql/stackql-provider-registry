openapi: 3.1.0
info:
  title: models API
  description: typesafe models API
  version: 0.2.0
paths:
  /v1/models:
    get:
      summary: Models V1
      description: |-
        List the models and aliases available to the authenticated account.

        Pass a returned model name as `model` in a POST /v1/systemone request.
      operationId: models_v1_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelMetadataList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
components:
  schemas:
    ModelMetadataList:
      properties:
        models:
          items:
            $ref: '#/components/schemas/ModelMetadata'
          type: array
          title: Models
          description: Available models and aliases. Use a model's name in POST /v1/systemone requests.
          examples:
            - - description: General-purpose system one model.
                name: jev-latest
                release_date: '2026-09-15'
      type: object
      required:
        - models
      title: ModelMetadataList
      description: Models and aliases available to the authenticated account.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
          description: Validation errors describing which request values are missing or invalid.
          examples:
            - - loc:
                  - body
                  - state
                msg: Field required
                type: missing
      type: object
      title: HTTPValidationError
      description: Request validation failures returned with HTTP status 422.
    ModelMetadata:
      properties:
        name:
          type: string
          title: Name
          description: Model name or alias accepted by the request's model field.
          examples:
            - jev-latest
        description:
          type: string
          title: Description
          description: Human-readable description of the model and its capabilities.
          examples:
            - General-purpose system one model.
        release_date:
          type: string
          title: Release Date
          description: Model release date, formatted as YYYY-MM-DD.
          examples:
            - '2026-09-15'
      type: object
      required:
        - name
        - description
        - release_date
      title: ModelMetadata
      description: A model or model alias available to the authenticated account.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
          description: 'Path to the invalid value: the request location followed by field names and array indices.'
          examples:
            - - body
              - questions
              - urgency
              - score
              - criteria
        msg:
          type: string
          title: Message
          description: Human-readable explanation of the validation failure.
          examples:
            - Field required
        type:
          type: string
          title: Error Type
          description: Machine-readable validation error code.
          examples:
            - missing
        input:
          title: Input
          description: The input value that failed validation.
          examples:
            - type: score
        ctx:
          type: string
          title: Context
          description: Additional context used to explain the validation failure. (opaque JSON object)
          examples:
            - min_length: 1
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
      description: A request validation error at a specific field or array element.
  x-stackQL-resources:
    models:
      id: typesafe.models.models
      name: models
      title: Models
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1models/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.models
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/models/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.typesafe.ai
x-stackQL-config:
  retry:
    algorithm: exponential
    max_attempts: 3
    initial_delay_ms: 500
    max_delay_ms: 10000
    multiplier: 2
    jitter_fraction: 0.1
    retryable_methods:
      - GET
      - HEAD
      - POST
    retryable_conditions:
      status_codes:
        - 408
        - 429
        - 502
        - 503
        - 504
        - 529
