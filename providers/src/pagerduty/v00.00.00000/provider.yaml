    id: extension_schemas:v00.00.00000
    name: extension_schemas
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/extension_schemas.yaml
    title: PagerDuty API - Extension Schemas
    version: v00.00.00000
    description: >-
      Extension schemas describe the available extension types (vendors and
      webhook types).
  extensions:
    id: extensions:v00.00.00000
    name: extensions
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/extensions.yaml
    title: PagerDuty API - Extensions
    version: v00.00.00000
    description: >-
      Extensions attach extension schema objects (webhooks, integrations) to
      services.
  incident_types:
    id: incident_types:v00.00.00000
    name: incident_types
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/incident_types.yaml
    title: PagerDuty API - Incident Types
    version: v00.00.00000
    description: Incident types and their custom fields.
  incident_workflows:
    id: incident_workflows:v00.00.00000
    name: incident_workflows
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/incident_workflows.yaml
    title: PagerDuty API - Incident Workflows
    version: v00.00.00000
    description: Incident Workflows, their actions, triggers and instances.
  incidents:
    id: incidents:v00.00.00000
    name: incidents
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/incidents.yaml
    title: PagerDuty API - Incidents
    version: v00.00.00000
    description: >-
      Incidents and their alerts, notes, log entries, status updates, responder
      requests, custom field values and business service impacts.
  ip_allow_lists:
    id: ip_allow_lists:v00.00.00000
    name: ip_allow_lists
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/ip_allow_lists.yaml
    title: PagerDuty API - Ip Allow Lists
    version: v00.00.00000
    description: IP allow lists (early access).
  licenses:
    id: licenses:v00.00.00000
    name: licenses
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/licenses.yaml
    title: PagerDuty API - Licenses
    version: v00.00.00000
    description: Licenses and license allocations for the account.
  log_entries:
    id: log_entries:v00.00.00000
    name: log_entries
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/log_entries.yaml
    title: PagerDuty API - Log Entries
    version: v00.00.00000
    description: Log entries record everything that happens to an incident.
  maintenance_windows:
    id: maintenance_windows:v00.00.00000
    name: maintenance_windows
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/maintenance_windows.yaml
    title: PagerDuty API - Maintenance Windows
    version: v00.00.00000
    description: Maintenance windows temporarily disable incident creation on services.
  notifications:
    id: notifications:v00.00.00000
    name: notifications
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/notifications.yaml
    title: PagerDuty API - Notifications
    version: v00.00.00000
    description: Notifications sent to users for incidents in a time window.
  oauth_delegations:
    id: oauth_delegations:v00.00.00000
    name: oauth_delegations
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/oauth_delegations.yaml
    title: PagerDuty API - Oauth Delegations
    version: v00.00.00000
    description: OAuth delegation revocation.
  on_calls:
    id: on_calls:v00.00.00000
    name: on_calls
