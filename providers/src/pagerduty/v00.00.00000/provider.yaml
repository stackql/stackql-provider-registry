    title: PagerDuty API - Schedules
    version: v00.00.00000
    description: On-call schedules, their overrides, users and audit records.
  schedules_v3:
    id: schedules_v3:v00.00.00000
    name: schedules_v3
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/schedules_v3.yaml
    title: PagerDuty API - Schedules V3
    version: v00.00.00000
    description: >-
      The v3 schedules API: schedules, rotations, events, custom shifts and
