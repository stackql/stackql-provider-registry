id: pagerduty
name: pagerduty
version: v00.00.00000
providerServices:
  abilities:
    id: abilities:v00.00.00000
    name: abilities
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/abilities.yaml
    title: PagerDuty API - Abilities
    version: v00.00.00000
    description: >-
      Account abilities by feature name (for example teams), which depend on the
      pricing plan and account state.
  add_ons:
    id: add_ons:v00.00.00000
    name: add_ons
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/add_ons.yaml
    title: PagerDuty API - Add Ons
    version: v00.00.00000
    description: >-
      Add-ons let developers insert their own functionality into the PagerDuty
      UI.
  alert_grouping_settings:
    id: alert_grouping_settings:v00.00.00000
    name: alert_grouping_settings
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/alert_grouping_settings.yaml
    title: PagerDuty API - Alert Grouping Settings
    version: v00.00.00000
    description: >-
      Alert grouping settings define how alerts on a service are grouped into
      incidents.
  analytics:
    id: analytics:v00.00.00000
    name: analytics
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/analytics.yaml
    title: PagerDuty API - Analytics
    version: v00.00.00000
    description: >-
      Enriched incident, responder and user analytics data (POST-based reads
      exposed as SELECT).
  audit:
    id: audit:v00.00.00000
    name: audit
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/audit.yaml
    title: PagerDuty API - Audit
    version: v00.00.00000
    description: Account-wide audit records.
  automation_actions:
    id: automation_actions:v00.00.00000
    name: automation_actions
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/automation_actions.yaml
    title: PagerDuty API - Automation Actions
    version: v00.00.00000
    description: >-
      Automation Actions: actions, runners, invocations and their service and
      team associations.
  business_services:
    id: business_services:v00.00.00000
    name: business_services
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/business_services.yaml
    title: PagerDuty API - Business Services
    version: v00.00.00000
    description: >-
      Business services model the services an organization provides, their
      subscribers, impacts and priority thresholds.
  change_events:
    id: change_events:v00.00.00000
    name: change_events
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/change_events.yaml
    title: PagerDuty API - Change Events
    version: v00.00.00000
    description: >-
      Change events represent changes (deployments, configuration changes)
      correlated with incidents.
  custom_fields:
    id: custom_fields:v00.00.00000
    name: custom_fields
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/custom_fields.yaml
    title: PagerDuty API - Custom Fields
    version: v00.00.00000
    description: >-
      Account-level custom field definitions for incidents (deprecated in favour
      of incident types) and services.
  enrichment:
    id: enrichment:v00.00.00000
    name: enrichment
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/enrichment.yaml
    title: PagerDuty API - Enrichment
    version: v00.00.00000
    description: >-
      Contextual data enrichment: ServiceNow integrations, enrichment schemas
      and records, and event enrichments.
  escalation_policies:
    id: escalation_policies:v00.00.00000
    name: escalation_policies
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/escalation_policies.yaml
    title: PagerDuty API - Escalation Policies
    version: v00.00.00000
    description: >-
      Escalation policies determine who is notified and when for incidents on a
      service.
  event_orchestrations:
    id: event_orchestrations:v00.00.00000
    name: event_orchestrations
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/event_orchestrations.yaml
    title: PagerDuty API - Event Orchestrations
    version: v00.00.00000
    description: >-
      Event Orchestrations route, enrich and act on events (global, router,
      unrouted and service paths, integrations, cache variables, enablements).
