    version: v00.00.00000
    description: 'On-calls: who is on call for which escalation policy and schedule.'
  paused_incident_reports:
    id: paused_incident_reports:v00.00.00000
    name: paused_incident_reports
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/paused_incident_reports.yaml
    title: PagerDuty API - Paused Incident Reports
    version: v00.00.00000
    description: Reports on alerts whose incident notifications were paused.
  priorities:
    id: priorities:v00.00.00000
    name: priorities
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/priorities.yaml
    title: PagerDuty API - Priorities
    version: v00.00.00000
    description: Incident priorities configured on the account.
  recommendations:
    id: recommendations:v00.00.00000
    name: recommendations
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/recommendations.yaml
    title: PagerDuty API - Recommendations
    version: v00.00.00000
