      $ref: pagerduty/v00.00.00000/services/sre_agent.yaml
    title: PagerDuty API - Sre Agent
    version: v00.00.00000
    description: SRE Agent memories.
  standards:
    id: standards:v00.00.00000
    name: standards
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/standards.yaml
    title: PagerDuty API - Standards
    version: v00.00.00000
    description: Service standards and standards scores.
  status_dashboards:
    id: status_dashboards:v00.00.00000
    name: status_dashboards
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/status_dashboards.yaml
    title: PagerDuty API - Status Dashboards
    version: v00.00.00000
    description: Status dashboards and their service impacts.
  status_pages:
    id: status_pages:v00.00.00000
    name: status_pages
    preferred: true
    service:
      $ref: pagerduty/v00.00.00000/services/status_pages.yaml
    title: PagerDuty API - Status Pages
    version: v00.00.00000
    description: >-
      Status pages: impacts, services, severities, statuses, posts, post
