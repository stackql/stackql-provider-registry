openapi: 3.0.2
info:
  title: PagerDuty API - Webhooks
  description: Webhook subscriptions (v3 webhooks) and their OAuth clients.
  version: 2.0.0
paths:
  /webhook_subscriptions:
    get:
      x-pd-requires-scope: webhook_subscriptions.read
      tags:
        - Webhooks
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: |
        List existing webhook subscriptions.

        The `filter_type` and `filter_id` query parameters may be used to only show subscriptions
        for a particular _service_ or _team_.

        For more information on webhook subscriptions and how they are used to configure v3 webhooks
        see the [Webhooks v3 Developer Documentation](https://developer.pagerduty.com/docs/webhooks/v3-overview/).

        Scoped OAuth requires: `webhook_subscriptions.read`
      parameters:
        - $ref: '#/components/parameters/offset_limit'
        - $ref: '#/components/parameters/offset_offset'
        - $ref: '#/components/parameters/offset_total'
        - $ref: '#/components/parameters/webhooks_filter_type'
        - $ref: '#/components/parameters/webhooks_filter_id'
      responses:
        '200':
          description: A set of webhook subscriptions matching the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                required:
                  - webhook_subscriptions
              examples:
                response:
                  $ref: '#/components/examples/ListSubscriptionExample'
        '400':
          $ref: '#/components/responses/WebhookBadRequest'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
    post:
      x-pd-requires-scope: webhook_subscriptions.write
      tags:
        - Webhooks
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: |
        Creates a new webhook subscription.

        For more information on webhook subscriptions and how they are used to configure v3 webhooks
        see the [Webhooks v3 Developer Documentation](https://developer.pagerduty.com/docs/webhooks/v3-overview/).

        Scoped OAuth requires: `webhook_subscriptions.write`
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook_subscription:
                  $ref: '#/components/schemas/WebhookSubscription'
              required:
                - webhook_subscription
            examples:
              request:
                $ref: '#/components/examples/CreateSubscriptionExample'
      responses:
        '200':
          description: The webhook subscription that was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_subscription:
                    $ref: '#/components/schemas/WebhookSubscription'
                required:
                  - webhook_subscription
              examples:
                response:
                  $ref: '#/components/examples/GetSubscriptionExample'
        '400':
          $ref: '#/components/responses/WebhookBadRequest'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
  /webhook_subscriptions/{id}:
    get:
      x-pd-requires-scope: webhook_subscriptions.read
      tags:
        - Webhooks
      operationId: getWebhookSubscription
      summary: Get a webhook subscription
      description: |
        Gets details about an existing webhook subscription.

        Scoped OAuth requires: `webhook_subscriptions.read`
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The webhook subscription that was requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_subscription:
                    $ref: '#/components/schemas/WebhookSubscription'
                required:
                  - webhook_subscription
              examples:
                response:
                  $ref: '#/components/examples/GetSubscriptionExample'
        '400':
          $ref: '#/components/responses/WebhookBadRequest'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
    put:
      x-pd-requires-scope: webhook_subscriptions.write
      tags:
        - Webhooks
      operationId: updateWebhookSubscription
      summary: Update a webhook subscription
      description: |
        Updates an existing webhook subscription.

        Only the fields being updated need to be included on the request.  This operation does not
        support updating the `delivery_method` of the webhook subscription.

        Scoped OAuth requires: `webhook_subscriptions.write`
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionUpdate'
            examples:
              request:
                $ref: '#/components/examples/PutSubscriptionExample'
      responses:
        '200':
          description: The updated webhook subscription.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_subscription:
                    $ref: '#/components/schemas/WebhookSubscription'
                required:
                  - webhook_subscription
              examples:
                response:
                  $ref: '#/components/examples/GetSubscriptionExample'
        '400':
          $ref: '#/components/responses/WebhookBadRequest'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
    delete:
      x-pd-requires-scope: webhook_subscriptions.write
      tags:
        - Webhooks
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription
      description: |
        Deletes a webhook subscription.

        Scoped OAuth requires: `webhook_subscriptions.write`
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: The webhook subscription was deleted successfully.
        '400':
          $ref: '#/components/responses/WebhookBadRequest'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
  /webhook_subscriptions/{id}/enable:
    post:
      x-pd-requires-scope: webhook_subscriptions.write
      tags:
        - Webhooks
      operationId: enableWebhookSubscription
      summary: Enable a webhook subscription
      description: |
        Enable a webhook subscription that is temporarily disabled. (This API does not require a request body.)

        Webhook subscriptions can become temporarily disabled when the subscription's delivery method is repeatedly rejected by the server.

        Scoped OAuth requires: `webhook_subscriptions.write`
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The webhook subscription that was successfully enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_subscription:
                    $ref: '#/components/schemas/WebhookSubscription'
                required:
                  - webhook_subscription
              examples:
                response:
                  $ref: '#/components/examples/GetSubscriptionExample'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
  /webhook_subscriptions/{id}/ping:
    post:
      x-pd-requires-scope: webhook_subscriptions.write
      tags:
        - Webhooks
      operationId: testWebhookSubscription
      summary: Test a webhook subscription
      description: |
        Test a webhook subscription.

        Fires a test event against the webhook subscription.  If properly configured,
        this will deliver the `pagey.ping` webhook event to the destination.

        Scoped OAuth requires: `webhook_subscriptions.write`
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
  /webhook_subscriptions/oauth_clients:
    get:
      tags:
        - Webhooks
      summary: List OAuth clients
      description: |
        List all OAuth clients for webhook subscriptions. Maximum of 10 clients per account.

        Requires admin or owner role permissions.
      operationId: listOauthClients
      parameters: []
      responses:
        '200':
          description: A list of OAuth clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  oauth_clients:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthClient'
              examples:
                default:
                  $ref: '#/components/examples/ListOAuthClientsExample'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
    post:
      tags:
        - Webhooks
      summary: Create an OAuth client
      description: |
        Create a new OAuth client for webhook subscriptions. The client credentials will be validated by attempting to obtain an access token before creation.

        Requires admin or owner role permissions.

        Maximum of 10 OAuth clients per account.
      operationId: createOauthClient
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthClientRequest'
            examples:
              default:
                $ref: '#/components/examples/CreateOAuthClientExample'
      responses:
        '201':
          description: OAuth client created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  oauth_client:
                    $ref: '#/components/schemas/OAuthClient'
              examples:
                default:
                  $ref: '#/components/examples/GetOAuthClientExample'
        '400':
          $ref: '#/components/responses/WebhookBadRequest'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
  /webhook_subscriptions/oauth_clients/{id}:
    get:
      tags:
        - Webhooks
      summary: Get an OAuth client
      description: |
        Get details of a specific OAuth client by ID.

        Requires admin or owner role permissions.
      operationId: getOauthClient
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OAuth client details
          content:
            application/json:
              schema:
                type: object
                properties:
                  oauth_client:
                    $ref: '#/components/schemas/OAuthClient'
              examples:
                default:
                  $ref: '#/components/examples/GetOAuthClientExample'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
    put:
      tags:
        - Webhooks
      summary: Update an OAuth client
      description: |
        Update an existing OAuth client. Any change will trigger token validation with the OAuth server.

        Requires admin or owner role permissions.
      operationId: updateOauthClient
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOAuthClientRequest'
            examples:
              default:
                $ref: '#/components/examples/UpdateOAuthClientExample'
      responses:
        '200':
          description: OAuth client updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  oauth_client:
                    $ref: '#/components/schemas/OAuthClient'
              examples:
                default:
                  $ref: '#/components/examples/GetOAuthClientExample'
        '400':
          $ref: '#/components/responses/WebhookBadRequest'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
    delete:
      tags:
        - Webhooks
      summary: Delete an OAuth client
      description: |
        Delete an OAuth client. This will also remove the OAuth client association from any webhook subscriptions using it.

        Requires admin or owner role permissions.
      operationId: deleteOauthClient
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: OAuth client deleted successfully
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '403':
          $ref: '#/components/responses/WebhookForbidden'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
components:
  schemas:
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        type:
          type: string
          description: The type indicating the schema of the object.
          default: webhook_subscription
          enum:
            - webhook_subscription
        active:
          type: boolean
          default: true
          description: Determines whether this subscription will produce webhook events.
        delivery_method:
          type: object
          properties:
            id:
              type: string
              readOnly: true
            secret:
              type: string
              description: The secret used to sign webhook payloads. Only provided on the initial create response.
              nullable: true
              readOnly: true
            temporarily_disabled:
              type: boolean
              description: Whether or not this webhook subscription is temporarily disabled. Becomes `true` if the delivery method URL is repeatedly rejected by the server.
            type:
              type: string
              description: Indicates the type of the delivery method.
              default: http_delivery_method
              enum:
                - http_delivery_method
            url:
              type: string
              description: The destination URL for webhook delivery.
              format: url
            custom_headers:
              type: array
              description: Optional headers to be set on this webhook subscription when sent. The header values are redacted in GET requests, but are not redacted on the webhook when delivered to the webhook's endpoint.
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: The header name
                  value:
                    type: string
                    description: The header value
          required:
            - type
            - url
        description:
          type: string
          description: A short description of the webhook subscription.
        events:
          type: array
          description: The set of outbound event types the webhook will receive.
          minItems: 1
          uniqueItems: true
          items:
            type: string
        filter:
          type: object
          properties:
            id:
              type: string
              description: The id of the object being used as the filter.  This field is required for all filter types except account_reference.
            type:
              type: string
              description: The type of object being used as the filter.
              enum:
                - account_reference
                - service_reference
                - team_reference
          required:
            - type
        oauth_client:
          description: OAuth client details. This field is populated in responses when oauth_client_id is set.
          readOnly: true
          type: object
          properties:
            id:
              type: string
              description: The ID of the OAuth client
              example: AGMEB7F7YJYELCPG4Y5YWMYGXE
            type:
              type: string
              enum:
                - oauth_client_reference
              description: The type of object being referenced
              example: oauth_client_reference
              default: oauth_client_reference
            summary:
              type: string
              description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client
              example: PagerDuty Webhook Integration
              readOnly: true
          required:
            - id
            - type
      required:
        - type
        - delivery_method
        - events
        - filter
    Pagination:
      type: object
      properties:
        offset:
          type: integer
          description: Echoes offset pagination property.
          readOnly: true
        limit:
          type: integer
          description: Echoes limit pagination property.
          readOnly: true
        more:
          type: boolean
          description: Indicates if there are additional records to return
          readOnly: true
        total:
          type: integer
          description: The total number of records matching the given query.
          nullable: true
          readOnly: true
    WebhookSubscriptionUpdate:
      type: object
      properties:
        webhook_subscription:
          type: object
          properties:
            description:
              type: string
              description: A short description of the webhook subscription.
            events:
              type: array
              description: The set of outbound event types the subscription will receive.
              minItems: 1
              uniqueItems: true
              items:
                type: string
            filter:
              type: object
              properties:
                id:
                  type: string
                  description: The id of the object being used as the filter.  This field is required for all filter types except account_reference.
                type:
                  type: string
                  description: The type of object being used as the filter.
                  enum:
                    - account_reference
                    - service_reference
                    - team_reference
            active:
              type: boolean
              description: If true, a webhook will be sent. True is the default state. If false, a webhook will not be sent.
            oauth_client_id:
              type: string
              description: The ID of the OAuth client to use for authenticating webhook requests. Optional field.
              nullable: true
    OAuthClient:
      type: object
      properties:
        id:
          type: string
          description: The ID of the OAuth client
          example: AGMEB7F7YJYELCPG4Y5YWMYGXE
          readOnly: true
        type:
          type: string
          enum:
            - oauth_client
          description: The type of object being created
          example: oauth_client
          default: oauth_client
        name:
          type: string
          description: A human-readable name for the OAuth client
          example: PagerDuty Webhook Integration
          maxLength: 255
        client_id:
          type: string
          description: The OAuth client ID provided by the OAuth server
          example: oauth-client-id
          maxLength: 255
        scope:
          type: string
          description: The OAuth scopes requested for this client
          example: read write
          maxLength: 255
          nullable: true
        token_url:
          type: string
          format: uri
          description: The OAuth token endpoint URL
          example: https://foo.oauth-server.com/oauth_token.do
          maxLength: 255
        grant_type:
          type: string
          enum:
            - client_credentials
          description: The OAuth grant type (currently only client_credentials is supported)
          example: client_credentials
        status:
          type: string
          enum:
            - active
            - error
          description: The current status of the OAuth client
          example: active
          readOnly: true
      required:
        - type
        - name
        - client_id
        - token_url
        - grant_type
    CreateOAuthClientRequest:
      type: object
      properties:
        oauth_client:
          type: object
          properties:
            name:
              type: string
              description: A human-readable name for the OAuth client
              example: PagerDuty Webhook Integration
              maxLength: 255
            client_id:
              type: string
              description: The OAuth client ID provided by the OAuth server
              example: oauth-client-id
              maxLength: 255
            client_secret:
              type: string
              description: The OAuth client secret provided by the OAuth server
              example: oauth-secret-id
              maxLength: 255
            scope:
              type: string
              description: The OAuth scopes requested for this client
              example: read write
              maxLength: 255
            token_url:
              type: string
              format: uri
              description: The OAuth token endpoint URL
              example: https://foo.oauth-server.com/oauth_token.do
              maxLength: 255
            grant_type:
              type: string
              enum:
                - client_credentials
              description: The OAuth grant type (currently only client_credentials is supported)
              example: client_credentials
          required:
            - name
            - client_id
            - client_secret
            - token_url
            - grant_type
      required:
        - oauth_client
    UpdateOAuthClientRequest:
      type: object
      properties:
        oauth_client:
          type: object
          properties:
            name:
              type: string
              description: A human-readable name for the OAuth client
              example: Updated ServiceNow Integration
              maxLength: 255
            client_id:
              type: string
              description: The OAuth client ID provided by the OAuth server
              example: oauth-client-id
              maxLength: 255
            client_secret:
              type: string
              description: The OAuth client secret provided by the OAuth server
              example: oauth-secret-id
              maxLength: 255
            scope:
              type: string
              description: The OAuth scopes requested for this client
              example: read write admin
              maxLength: 255
            token_url:
              type: string
              format: uri
              description: The OAuth token endpoint URL
              example: https://foo.oauth-server.com/oauth_token.do
              maxLength: 255
            grant_type:
              type: string
              enum:
                - client_credentials
              description: The OAuth grant type (currently only client_credentials is supported)
              example: client_credentials
      required:
        - oauth_client
  responses:
    WebhookBadRequest:
      description: |
        Caller provided invalid arguments. Please review the response for error
        details. Retrying with the same arguments will *not* work.
    WebhookUnauthorized:
      description: |
        Caller did not supply credentials or did not provide the correct
        credentials.

        If you are using an API key, it may be invalid or your Authorization header may be malformed.
    WebhookForbidden:
      description: |
        Caller is not authorized to view the requested resource.

        While your authentication is valid, the authenticated user or token does not have permission to perform this action.
    WebhookNotFound:
      description: The requested resource was not found.
  parameters:
    offset_limit:
      name: limit
      in: query
      required: false
      description: The number of results per page.
      schema:
        type: integer
    offset_offset:
      name: offset
      in: query
      required: false
      description: Offset to start pagination search results.
      schema:
        type: integer
    offset_total:
      name: total
      in: query
      required: false
      description: |
        By default the `total` field in pagination responses is set to `null` to provide the fastest possible response times. Set `total` to `true` for this field to be populated.

        See our [Pagination Docs](https://developer.pagerduty.com/docs/rest-api-v2/pagination/) for more information.
      schema:
        default: false
        type: boolean
    webhooks_filter_type:
      name: filter_type
      in: query
      required: false
      description: The type of resource to filter upon.
      schema:
        enum:
          - account
          - service
          - team
        type: string
    webhooks_filter_id:
      name: filter_id
      in: query
      required: false
      description: The id of the resource to filter upon. Required if filter_type is service or team.
      schema:
        type: string
    id:
      name: id
      description: The ID of the resource.
      in: path
      required: true
      schema:
        type: string
  examples:
    ListSubscriptionExample:
      summary: Example
      value:
        webhook_subscriptions:
          - delivery_method:
              id: PF9KMXH
              secret: null
              type: http_delivery_method
              url: https://example.com/receive_a_pagerduty_webhook
              custom_headers:
                - name: your-header-name
                  value: '-- redacted --'
            description: Sends PagerDuty v3 webhook events somewhere interesting.
            events:
              - incident.acknowledged
              - incident.annotated
              - incident.delegated
              - incident.escalated
              - incident.priority_updated
              - incident.reassigned
              - incident.resolved
              - incident.responder.added
              - incident.responder.replied
              - incident.triggered
              - incident.unacknowledged
            filter:
              id: P393ZNQ
              type: service_reference
            oauth_client:
              id: AGLRZQ2PGR5B7EQ52DTT4ZJERY
              type: oauth_client_reference
              summary: PagerDuty Webhook Integration
            id: PY1OL64
            type: webhook_subscription
            active: true
        limit: 25
        offset: 0
        total: null
        more: false
    CreateSubscriptionExample:
      summary: Example
      value:
        webhook_subscription:
          delivery_method:
            type: http_delivery_method
            url: https://example.com/receive_a_pagerduty_webhook
            custom_headers:
              - name: header-name
                value: header-value
          description: Sends PagerDuty v3 webhook events somewhere interesting.
          events:
            - incident.acknowledged
            - incident.annotated
            - incident.delegated
            - incident.escalated
            - incident.priority_updated
            - incident.reassigned
            - incident.reopened
            - incident.resolved
            - incident.responder.added
            - incident.responder.replied
            - incident.triggered
            - incident.unacknowledged
          filter:
            id: P393ZNQ
            type: service_reference
          oauth_client_id: AGMEB7F7YJYELCPG4Y5YWMYGXE
          type: webhook_subscription
    GetSubscriptionExample:
      summary: Example
      value:
        webhook_subscription:
          delivery_method:
            id: PF9KMXH
            secret: null
            temporarily_disabled: false
            type: http_delivery_method
            url: https://example.com/receive_a_pagerduty_webhook
            custom_headers:
              - name: your-header-name
                value: '-- redacted --'
