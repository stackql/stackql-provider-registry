openapi: 3.0.2
info:
  title: PagerDuty API - Recommendations
  description: Recommended Event Orchestration rules.
  version: 2.0.0
paths:
  /recommendations/event_orchestrations/rules:
    get:
      x-pd-requires-scope: recommendations.read
      tags:
        - Recommendations
      operationId: listRecommendedRules
      summary: List recommended rules
      description: |
        List AI-generated recommended rules available for an account's Service Event Orchestrations.

        Results can be filtered by service or team. Use cursor-based pagination to retrieve large result sets.

        Note: `service_id` and `service_ids[]` cannot be used together in the same request.

        Scoped OAuth requires: `recommendations.read`
      parameters:
        - $ref: '#/components/parameters/recommendation_service_id_query'
        - $ref: '#/components/parameters/recommendation_service_ids'
        - $ref: '#/components/parameters/team_ids'
        - $ref: '#/components/parameters/recommendation_actions'
        - $ref: '#/components/parameters/recommendation_limit'
        - $ref: '#/components/parameters/cursor_cursor'
      responses:
        '200':
          $ref: '#/components/responses/RecommendationListResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List AI-generated recommended rules for Event Orchestrations.
  /recommendations/event_orchestrations/services/{service_id}/rules/{recommendation_id}/dismiss:
    post:
      x-pd-requires-scope: recommendations.write
      tags:
        - Recommendations
      operationId: dismissRecommendedRule
      summary: Dismiss a recommended rule
      description: |
        Dismiss a recommended rule for a service, recording feedback on whether the recommendation was useful.

        Scoped OAuth requires: `recommendations.write`
      parameters:
        - $ref: '#/components/parameters/service_id'
        - $ref: '#/components/parameters/recommendation_id'
      requestBody:
        $ref: '#/components/requestBodies/RecommendationDismissRequest'
      responses:
        '200':
          $ref: '#/components/responses/RecommendationActionResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Dismiss an AI-generated recommended rule with feedback.
  /recommendations/event_orchestrations/services/{service_id}/rules/{recommendation_id}/accept:
    post:
      x-pd-requires-scope: recommendations.write
      tags:
        - Recommendations
      operationId: acceptRecommendedRule
      summary: Accept a recommended rule
      description: |
        Accept a recommended rule and apply it to the service's Event Orchestration.

        Scoped OAuth requires: `recommendations.write`
      parameters:
        - $ref: '#/components/parameters/service_id'
        - $ref: '#/components/parameters/recommendation_id'
      responses:
        '200':
          $ref: '#/components/responses/RecommendationActionResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Accept an AI-generated recommended rule and apply it to the service's Event Orchestration.
  /recommendations/event_orchestrations/services/{service_id}/accepted_rules/{rule_id}:
    delete:
      x-pd-requires-scope: recommendations.write
      tags:
        - Recommendations
      operationId: deleteAcceptedRecommendedRule
      summary: Delete an accepted rule
      description: |
        Remove a previously accepted recommended rule from a service's Event Orchestration.

        Scoped OAuth requires: `recommendations.write`
      parameters:
        - $ref: '#/components/parameters/service_id'
        - $ref: '#/components/parameters/recommendation_rule_id'
      responses:
        '200':
          $ref: '#/components/responses/RecommendationActionResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Remove a previously accepted recommended rule from a service's Event Orchestration.
components:
  schemas:
    RecommendedRule:
      type: object
      description: An AI-generated recommended rule for a Service Event Orchestration.
      properties:
        recommendation_id:
          type: string
          description: The unique identifier for this recommendation (rule instance hash).
          readOnly: true
          example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
        type:
          type: string
          description: The type of resource this recommendation applies to.
          enum:
            - service
          readOnly: true
        status:
          type: string
          description: The availability status of the recommendation.
          enum:
            - available
          readOnly: true
        description:
          type: string
          description: A human-readable description of what the recommended rule does.
          example: Suppress alerts where event.summary matches 'disk usage'
        pcl_expr:
          type: string
          description: The PagerDuty Condition Language (PCL) expression that defines the rule's matching condition.
          example: event.summary matches part 'disk usage'
        created_at:
          type: string
          format: date-time
          description: The date/time the recommendation was created.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: The date/time the recommendation was last updated.
          readOnly: true
        metrics:
          type: object
          description: Performance metrics describing the recommendation's historical match rate and effectiveness.
          readOnly: true
          properties:
            num_events_matching_rule:
              type: integer
              description: Total number of events that match the rule's condition.
            num_events_with_action:
              type: integer
              description: Total number of events that had the recommended action applied.
            num_events_with_action_matching_rule:
              type: integer
              description: Number of events that both match the condition and had the action applied.
            precision_metric:
              type: number
              format: float
              description: Fraction of events matching the rule that also had the action applied. Value between 0 and 1.
              minimum: 0
              maximum: 1
            recall:
              type: number
              format: float
              description: Fraction of events with the action applied that also match the rule condition. Value between 0 and 1.
              minimum: 0
              maximum: 1
        actions:
          type: object
          description: The action the recommended rule would apply when its condition is matched. One of the following action types will be present.
          properties:
            suppress:
              type: boolean
              description: If true, matching events will be suppressed.
            severity:
              type: string
              description: Normalize the severity of matching events to this value.
              enum:
                - critical
                - high
                - warning
                - info
                - low
            priority:
              type: string
              description: The ID of the priority to assign to matching incidents.
        parent:
          type: object
          description: The service this recommendation applies to.
          readOnly: true
          properties:
            id:
              type: string
              description: The obfuscated ID of the service.
              example: P1ABC23
            type:
              type: string
              description: The type of the parent resource.
              enum:
                - service_reference
    RecommendedRuleDecision:
      type: object
      description: A decision to dismiss a recommended rule, including feedback on its usefulness.
      required:
        - decision
      properties:
        decision:
          type: object
          required:
            - feedback
          properties:
            feedback:
              type: string
              description: |
                Feedback on whether the recommendation was useful.
                - `positive`: The recommendation was relevant and useful.
                - `negative`: The recommendation was not relevant or not useful.
              enum:
                - positive
                - negative
  responses:
    RecommendationListResponse:
      description: A list of recommended rules for the account's Service Event Orchestrations.
      content:
        application/json:
          schema:
            type: object
            properties:
              recommended_rules:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendedRule'
              next_cursor:
                type: string
                nullable: true
                description: Cursor to retrieve the next page of results. Null if there are no more results.
          examples:
            response:
              summary: Response Example
              value:
                recommended_rules:
                  - recommendation_id: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
                    type: service
                    status: available
                    description: Suppress alerts where event.summary matches 'disk usage'
                    pcl_expr: event.summary matches part 'disk usage'
                    created_at: '2026-01-15T10:30:00Z'
                    updated_at: '2026-01-15T10:30:00Z'
                    metrics:
                      num_events_matching_rule: 1200
                      num_events_with_action: 950
                      num_events_with_action_matching_rule: 900
                      precision_metric: 0.75
                      recall: 0.95
                    actions:
                      suppress: true
                    parent:
                      id: P1ABC23
                      type: service_reference
                next_cursor: eyJ2ZXJzaW9uIjoxLCJwYWdlIjoyLCJuZXh0X3JlY29tbWVuZGF0aW9uIjpudWxsfQ==
    ArgumentError:
      description: Caller provided invalid arguments. Please review the response for error details. Retrying with the same arguments will *not* work.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    Unauthorized:
      description: |
        Caller did not supply credentials or did not provide the correct credentials.
        If you are using an API key, it may be invalid or your Authorization header may be malformed.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    Forbidden:
      description: |
        Caller is not authorized to view the requested resource.
        While your authentication is valid, the authenticated user or token does not have permission to perform this action.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    TooManyRequests:
      description: Too many requests have been made, the rate limit has been reached.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    InternalServerError:
      description: Internal Server Error the PagerDuty server experienced an error.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    RecommendationActionResponse:
      description: Successful response confirming the action was applied.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum:
                  - ok
          examples:
            response:
              summary: Response Example
              value:
                status: ok
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    Conflict:
      description: The request conflicts with the current state of the server.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
  parameters:
    recommendation_service_id_query:
      name: service_id
      in: query
      required: false
      description: Filter recommended rules for a single service. Cannot be combined with `service_ids[]`.
      schema:
        type: string
    recommendation_service_ids:
      name: service_ids[]
      in: query
      required: false
      description: Filter recommended rules for multiple services. Cannot be combined with `service_id`.
      explode: true
      schema:
        type: array
        items:
          type: string
        uniqueItems: true
    team_ids:
      name: team_ids[]
      in: query
      description: An array of team IDs. Only results related to these teams will be returned. Account must have the `teams` ability to use this parameter.
      explode: true
      schema:
        type: array
        items:
          type: string
        uniqueItems: true
    recommendation_actions:
      name: actions[]
      in: query
      required: false
      description: Filter recommended rules by action type.
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - suppress
            - severity
            - priority
        uniqueItems: true
    recommendation_limit:
      name: limit
      in: query
      required: false
      description: The number of results per page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    cursor_cursor:
      name: cursor
      in: query
      required: false
      description: |
        Optional parameter used to request the "next" set of results from an API.  The value provided here is most commonly obtained from the `next_cursor` field of the previous request.  When no value is provided, the request starts at the beginning of the result set.
      schema:
        type: string
    service_id:
      name: service_id
      in: path
      description: The service ID
      required: true
      schema:
        type: string
    recommendation_id:
      name: recommendation_id
      in: path
      required: true
      description: The recommendation ID (rule instance hash).
      schema:
        type: string
    recommendation_rule_id:
      name: rule_id
      in: path
      required: true
      description: The ID of the accepted rule.
      schema:
        type: string
  requestBodies:
    RecommendationDismissRequest:
      description: A request to dismiss a recommended rule with feedback.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecommendedRuleDecision'
          examples:
            negative_feedback:
              summary: 'Request Example: Dismiss with negative feedback'
              value:
                decision:
                  feedback: negative
            positive_feedback:
              summary: 'Request Example: Dismiss with positive feedback'
              value:
                decision:
                  feedback: positive
  x-stackQL-resources:
    event_orchestration_rules:
      id: pagerduty.recommendations.event_orchestration_rules
      name: event_orchestration_rules
      title: Event Orchestration Rules
      methods:
        list:
          operation:
            $ref: '#/paths/~1recommendations~1event_orchestrations~1rules/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.recommended_rules
          config:
            pagination:
              requestToken:
                key: cursor
                location: query
              responseToken:
                key: next_cursor
                location: body
            queryParamPushdown:
              top:
                paramName: limit
                maxValue: 50
        dismiss:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1recommendations~1event_orchestrations~1services~1{service_id}~1rules~1{recommendation_id}~1dismiss/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        accept:
          operation:
            $ref: '#/paths/~1recommendations~1event_orchestrations~1services~1{service_id}~1rules~1{recommendation_id}~1accept/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete_accepted_rule:
          operation:
            $ref: '#/paths/~1recommendations~1event_orchestrations~1services~1{service_id}~1accepted_rules~1{rule_id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/event_orchestration_rules/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.pagerduty.com
    description: PagerDuty REST API v2 (US service region). The EU service region (https://api.eu.pagerduty.com) is documented in NOTES.md - a server variable cannot carry it without becoming a required parameter on every query.
