openapi: 3.0.2
info:
  title: PagerDuty API - Standards
  description: Service standards and standards scores.
  version: 2.0.0
paths:
  /standards:
    get:
      x-pd-requires-scope: standards.read
      tags:
        - Standards
      operationId: listStandards
      summary: List Standards
      description: |
        Get all standards of an account.

        Scoped OAuth requires: `standards.read`
      parameters:
        - $ref: '#/components/parameters/active_standard'
        - $ref: '#/components/parameters/query_resource_type_standard'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  standards:
                    type: array
                    items:
                      $ref: '#/components/schemas/Standard'
              examples:
                response:
                  summary: Response Example
                  value:
                    standards:
                      - active: true
                        description: A description provides critical context about what a service represents or is used for to inform team members and responders. The description should be kept concise and understandable by those without deep knowledge of the service.
                        exclusions: []
                        id: 01CXX38Q0U8XKHO4LNKXUJTBFG
                        inclusions:
                          - type: technical_service_reference
                            id: P0CPWBO
                        name: Service has a description
                        resource_type: technical_service
                        type: has_technical_service_description
                      - active: true
                        description: Ensure that no incident goes unaddressed, even if the on-call responder on the first level of the escalation policy is unavailable.
                        exclusions: []
                        id: 01CXX38Q0Y8D9IYFAEDCH5F53L
                        inclusions: []
                        name: Service has an escalation policy with 2 or more unique levels
                        resource_type: technical_service
                        type: minimum_escalation_policy_rule_depth
                      - active: true
                        description: Extensions or add-ons streamline incident response and communication processes by connecting PagerDuty services to other tools that matter to your incident management workflow.
                        exclusions: []
                        id: 01CXX38Q11T19P0K1GFKHUZJ35
                        inclusions: []
                        name: Service has an extension or add-on (e.g. Slack, etc.)
                        resource_type: technical_service
                        type: minimum_outbound_integrations
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /standards/{id}:
    put:
      x-pd-requires-scope: standards.write
      tags:
        - Standards
      summary: Update a standard
      operationId: updateStandard
      description: |
        Updates a standard

        Scoped OAuth requires: `standards.write`
      parameters:
        - $ref: '#/components/parameters/id_standard'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                values:
                  type: object
                  properties:
                    regex:
                      type: string
                description:
                  type: string
                inclusions:
                  type: array
                  items:
                    $ref: '#/components/schemas/StandardInclusionExclusion'
                exclusions:
                  type: array
                  items:
                    $ref: '#/components/schemas/StandardInclusionExclusion'
            examples:
              request:
                summary: Request Example
                value:
                  active: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standard'
              examples:
                response:
                  summary: Response Example
                  value:
                    active: false
                    description: A description provides critical context about what a service represents or is used for to inform team members and responders. The description should be kept concise and understandable by those without deep knowledge of the service.
                    exclusions: []
                    id: 01CXX38Q0U8XKHO4LNKXUJTBFG
                    inclusions: []
                    name: Service has a description
                    resource_type: technical_service
                    type: has_technical_service_description
        '400':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /standards/scores/{resource_type}:
    get:
      x-pd-requires-scope: standards.read
      tags:
        - Standards
      summary: List resources' standards scores
      operationId: listResourceStandardsManyServices
      description: |
        List standards applied to a set of resources

        Scoped OAuth requires: `standards.read`
      parameters:
        - $ref: '#/components/parameters/resource_ids_standard'
        - $ref: '#/components/parameters/resource_type_standard'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/StandardApplied'
              examples:
                response:
                  summary: Response Example
                  value:
                    resources:
                      - resource_id: P0CPWBO
                        resource_type: technical_service
                        score:
                          passing: 1
                          total: 1
                        standards:
                          - active: true
                            description: A description provides critical context about what a service represents or is used for to inform team members and responders. The description should be kept concise and understandable by those without deep knowledge of the service.
                            id: 01CXX38Q0U8XKHO4LNKXUJTBFG
                            pass: true
                            name: Service has a description
                            type: has_technical_service_description
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /standards/scores/{resource_type}/{id}:
    get:
      x-pd-requires-scope: standards.read
      tags:
        - Standards
      summary: List a resource's standards scores
      operationId: listResourceStandards
      description: |
        List standards applied to a specific resource

        Scoped OAuth requires: `standards.read`
      parameters:
        - $ref: '#/components/parameters/resource_id_standard'
        - $ref: '#/components/parameters/resource_type_standard'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApplied'
              examples:
                response:
                  summary: Response Example
                  value:
                    resource_id: P0CPWBO
                    resource_type: technical_service
                    score:
                      passing: 1
                      total: 1
                    standards:
                      - active: true
                        description: A description provides critical context about what a service represents or is used for to inform team members and responders. The description should be kept concise and understandable by those without deep knowledge of the service.
                        id: 01CXX38Q0U8XKHO4LNKXUJTBFG
                        pass: true
                        name: Service has a description
                        type: has_technical_service_description
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  schemas:
    Standard:
      title: Standard
      type: object
      properties:
        active:
          type: boolean
        description:
          type: string
        id:
          type: string
        name:
          type: string
        type:
          type: string
        resource_type:
          type: string
          enum:
            - technical_service
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/StandardInclusionExclusion'
        inclusions:
          type: array
          items:
            $ref: '#/components/schemas/StandardInclusionExclusion'
    StandardInclusionExclusion:
      title: StandardInclusionExclusion
      type: object
      properties:
        type:
          type: string
          enum:
            - technical_service_reference
        id:
          type: string
    StandardApplied:
      title: StandardApplied
      type: object
      properties:
        resource_id:
          type: string
        resource_type:
          type: string
          enum:
            - technical_service
        score:
          type: object
          properties:
            passing:
              type: integer
            total:
              type: integer
        standards:
          type: array
          items:
            type: object
            properties:
              active:
                type: boolean
              description:
                type: string
              id:
                type: string
              name:
                type: string
              type:
                type: string
              pass:
                type: boolean
  responses:
    Unauthorized:
      description: |
        Caller did not supply credentials or did not provide the correct credentials.
        If you are using an API key, it may be invalid or your Authorization header may be malformed.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    Forbidden:
      description: |
        Caller is not authorized to view the requested resource.
        While your authentication is valid, the authenticated user or token does not have permission to perform this action.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    TooManyRequests:
      description: Too many requests have been made, the rate limit has been reached.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    UnprocessableEntity:
      description: Unprocessable Entity. Some arguments failed validation checks.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    Conflict:
      description: The request conflicts with the current state of the server.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
  parameters:
    active_standard:
      in: query
      name: active
      required: false
      schema:
        type: boolean
    query_resource_type_standard:
      in: query
      name: resource_type
      schema:
        type: string
        enum:
          - technical_service
    id_standard:
      in: path
      name: id
      required: true
      description: Id of the standard
      schema:
        type: string
    resource_ids_standard:
      in: query
      name: ids
      required: true
      description: Ids of resources to apply the standards. Maximum of 100 items
      schema:
        type: array
        items:
          type: string
    resource_type_standard:
      in: path
      name: resource_type
      required: true
      schema:
        type: string
        enum:
          - technical_services
    resource_id_standard:
      in: path
      name: id
      required: true
      description: Id of the resource to apply the standards.
      schema:
        type: string
  x-stackQL-resources:
    standards:
      id: pagerduty.standards.standards
      name: standards
      title: Standards
      methods:
        list:
          operation:
            $ref: '#/paths/~1standards/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.standards
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1standards~1{id}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/standards/methods/list'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/standards/methods/update'
        delete: []
        replace: []
    scores:
      id: pagerduty.standards.scores
      name: scores
      title: Scores
      methods:
        list:
          operation:
            $ref: '#/paths/~1standards~1scores~1{resource_type}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.resources
        get:
          operation:
            $ref: '#/paths/~1standards~1scores~1{resource_type}~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/scores/methods/get'
          - $ref: '#/components/x-stackQL-resources/scores/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.pagerduty.com
    description: PagerDuty REST API v2 (US service region). The EU service region (https://api.eu.pagerduty.com) is documented in NOTES.md - a server variable cannot carry it without becoming a required parameter on every query.
