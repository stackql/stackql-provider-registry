      operationId: listEventOrchestrationFeatureEnablements
      summary: List Enablements for an Event Orchestration
      description: |
        List all feature enablement settings for an Event Orchestration. Currently, only the `aiops` enablement is supported.

        For any account with the AIOps product addon, every Event Orchestration will have AIOps features enabled by default.

        **Warning conditions**:
        - If the account is not entitled to use AIOps features, a warning will be returned alongside the enablement data.

        Scoped OAuth requires: `event_orchestrations.read`
      parameters:
        - $ref: '#/components/parameters/event_orchestration_id'
      responses:
        '200':
          description: The list of feature enablement settings for the Event Orchestation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enablements:
                    type: array
                    description: Array of feature enablement settings.
                    items:
                      $ref: '#/components/schemas/FeatureEnablement'
              examples:
                success_response:
                  $ref: '#/components/examples/FeatureEnablementListResponseSuccess'
                response_with_warning:
                  $ref: '#/components/examples/FeatureEnablementListResponseWarningForOrchestration'
                default_response:
                  $ref: '#/components/examples/FeatureEnablementListResponseDefault'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Manage Enablements for a Global Event Orchestration.
  /event_orchestrations/{id}/enablements/{feature_name}:
    put:
      x-pd-requires-scope: event_orchestrations.write
      tags:
        - Event Orchestrations
      operationId: updateEventOrchestrationFeatureEnablements
      summary: Update an Enablement for an Event Orchestration
      description: |
        Update the feature enablement setting for a specific product addon on an Event Orchestration. This setting controls enabling or disabling the set of features contained within the addon.
        Currently, only `aiops` is supported as a valid feature enablement.

        **Warning conditions**:
        - If the account is not entitled to use AIOps features, the setting will be updated, but a warning will be returned.

        Scoped OAuth requires: `event_orchestrations.write`
      parameters:
        - $ref: '#/components/parameters/event_orchestration_id'
        - $ref: '#/components/parameters/enablement_feature_name'
      requestBody:
        description: The feature enablement setting to apply.
        content:
          application/json:
            schema:
              type: object
              properties:
                enablement:
                  $ref: '#/components/schemas/FeatureEnablement'
              required:
                - enablement
            examples:
              enable_aiops:
                $ref: '#/components/examples/FeatureEnablementPutRequestEnable'
              disable_aiops:
                $ref: '#/components/examples/FeatureEnablementPutRequestDisable'
      responses:
        '200':
          description: The feature enablement setting was updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enablement:
                    $ref: '#/components/schemas/FeatureEnablement'
              examples:
                success_response:
                  $ref: '#/components/examples/FeatureEnablementPutResponseSuccess'
                response_with_warning:
                  $ref: '#/components/examples/FeatureEnablementPutResponseWarningForOrchestration'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Manage an Enablement for a Global Event Orchestration.
