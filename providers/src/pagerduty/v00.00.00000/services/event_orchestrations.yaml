      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orchestration:
                  $ref: '#/components/schemas/Orchestration'
              required:
                - orchestration
            examples:
              change_name:
                summary: 'Example: Change name'
                value:
                  orchestration:
                    name: Go-Kart Orchestration
              change_team:
                summary: 'Example: Change team'
                value:
                  orchestration:
                    team:
                      id: PWL7QXS
              change_description:
                summary: 'Example: Change description'
                value:
                  orchestration:
                    description: Orchestration that does some stuff
        description: ''
      responses:
        '200':
          description: The Orchestration that was updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orchestration:
