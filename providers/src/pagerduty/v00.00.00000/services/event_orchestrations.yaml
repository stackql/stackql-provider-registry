  requestBodies:
    OrchestrationCacheVariablePostRequest:
      content:
        application/json:
          schema:
            type: object
            properties:
              cache_variable:
                oneOf:
                  - $ref: '#/components/schemas/OrchestrationCacheVariableRecentValue'
                  - $ref: '#/components/schemas/OrchestrationCacheVariableTriggerEventCount'
                  - $ref: '#/components/schemas/OrchestrationCacheVariableExternalData'
            required:
              - cache_variable
          examples:
            recent_value:
              summary: 'Request Example: Recent value cache variable'
              value:
                cache_variable:
                  name: example_1
                  conditions:
                    - expression: not event.custom_details.errors exists
                  configuration:
                    type: recent_value
                    source: event.summary
                    regex: .*
            trigger_event_count:
              summary: 'Request Example: Trigger event count cache variable'
              value:
                cache_variable:
                  name: example_2
                  configuration:
                    type: trigger_event_count
                    ttl_seconds: 30
            external_data:
              summary: 'Request Example: External Data cache variable'
              value:
                cache_variable:
                  name: example_3
                  configuration:
                    type: external_data
                    ttl_seconds: 300
                    data_type: boolean
    OrchestrationCacheVariablePutRequest:
      content:
        application/json:
          schema:
            type: object
            properties:
              cache_variable:
                oneOf:
                  - $ref: '#/components/schemas/OrchestrationCacheVariableRecentValue'
                  - $ref: '#/components/schemas/OrchestrationCacheVariableTriggerEventCount'
                  - $ref: '#/components/schemas/OrchestrationCacheVariableExternalData'
            required:
              - cache_variable
          examples:
            update_conditions:
              summary: 'Request Example: Update conditions (trigger_event_count, recent_value)'
              value:
                cache_variable:
                  name: example_1
                  conditions:
                    - expression: event.summary matches 'exception'
                    - expression: event.summary matches 'error'
            update_configuration:
              summary: 'Request Example: Update configuration'
              value:
                cache_variable:
                  name: example_1
                  configuration:
                    type: trigger_event_count
                    ttl_seconds: 2
            update_disabled:
              summary: 'Request Example: Update disabled state'
              value:
                cache_variable:
                  name: example_1
                  disabled: true
    OrchestrationCacheVariableDataPutRequest:
      description: The updated data for an `external_data` type Cache Variable for this Event Orchestration.
      content:
        application/json:
          schema:
            type: object
            properties:
              cache_variable_data:
                type: string
                description: 'The string value to set on an external data cache variable configured with `data_type: string`.'
              updated_at:
                type: string
                format: date-time
                description: The date/time the cache variable data was last updated.
                readOnly: true
            required:
              - cache_variable_data
          examples:
            string data:
              summary: 'Request Example: Updated string'
              value:
                cache_variable_data: Updated - Hello World!
            number data:
              summary: 'Request Example: Updated number'
              value:
                cache_variable_data: 85.1
            boolean data:
              summary: 'Request Example: Updated boolean'
              value:
                cache_variable_data: false
    OrchestrationCacheVariableDataPutResponse:
      description: The data on an `external_data` type Cache Variable for this Event Orchestration.
      content:
        application/json:
          schema:
            type: object
            properties:
              cache_variable_data:
                type: string
                description: 'The string value to set on an external data cache variable configured with `data_type: string`.'
              updated_at:
                type: string
                format: date-time
                description: The date/time the cache variable data was last updated.
                readOnly: true
            required:
              - cache_variable_data
          examples:
            string data:
              summary: 'Response Example: String'
              value:
                cache_variable_data: Updated - Hello World!
                updated_at: '2021-11-18T16:42:01Z'
            number data:
              summary: 'Response Example: Number'
              value:
                cache_variable_data: 85.1
                updated_at: '2021-11-18T16:42:01Z'
            boolean data:
              summary: 'Response Example: Boolean'
              value:
                cache_variable_data: false
                updated_at: '2021-11-18T16:42:01Z'
