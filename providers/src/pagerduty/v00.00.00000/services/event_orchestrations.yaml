                      routes: 0
                      created_at: '2021-11-18T16:42:01Z'
                      created_by:
                        id: P8B9WR8
                        self: https://api.pagerduty.com/users/P8B9WR8
                        type: user_reference
                      updated_at: '2021-11-19T11:42:32Z'
                      updated_by:
                        id: P8B9WR8
                        self: https://api.pagerduty.com/users/P8B9WR8
                        type: user_reference
