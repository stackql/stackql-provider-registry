          readOnly: true
        created_by:
          type: object
          description: Reference to the user that has created the Orchestration.
          properties:
            id:
              type: string
              readOnly: true
            type:
              type: string
              description: A string that determines the schema of the object
              readOnly: true
            self:
              type: string
              format: url
              description: The API show URL at which the object is accessible
              readOnly: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: The date the Orchestration was last updated.
          readOnly: true
        updated_by:
          type: object
          description: Reference to the user that has updated the Orchestration last.
          properties:
            id:
              type: string
              readOnly: true
            type:
              type: string
              description: A string that determines the schema of the object
              readOnly: true
            self:
              type: string
              format: url
              description: The API show URL at which the object is accessible
              readOnly: true
          readOnly: true
        version:
          type: string
          description: Version of the Orchestration.
          readOnly: true
    OrchestrationIntegration:
      type: object
      properties:
        id:
          type: string
          description: ID of the Integration.
          readOnly: true
        label:
          type: string
          description: Name of the Integration.
        parameters:
          type: object
          readOnly: true
          properties:
            routing_key:
              type: string
              description: Routing Key used to send Events to this Orchestration
              readOnly: true
            type:
              type: string
              default: global
              readOnly: true
    OrchestrationGlobal:
      type: object
      properties:
        orchestration_path:
          type: object
          properties:
            type:
              type: string
              default: service
              readOnly: true
            parent:
              type: object
              properties:
                id:
                  type: string
                  description: ID of the object these Orchestration Rules belongs to.
                  readOnly: true
                type:
                  type: string
                  description: A string that determines the schema of the parent object
                  readOnly: true
                self:
                  type: string
                  format: url
                  description: The API show URL at which the parent object is accessible
                  readOnly: true
              readOnly: true
            sets:
              type: array
              description: Must contain at least a "start" set, but can contain any number of additional sets that are routed to by other rules to form a directional graph of rules.
              items:
                type: object
                description: A set of rules
                properties:
                  id:
                    type: string
                    description: The ID of this set of rules. Rules in other sets can route events into this set using the "route_to" properties.
                    default: start
                  rules:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID of the rule
                          readOnly: true
                        label:
                          type: string
                          description: A description of this rule's purpose.
                        conditions:
                          type: array
                          description: Each of these conditions is evaluated to check if an event matches this rule. The rule is considered a match if **any** of these conditions match.
                          items:
                            type: object
                            properties:
                              expression:
                                type: string
                                description: A PCL condition string
                                example: event.summary matches part 'my service error'
                        actions:
                          type: string
                          description: When an event matches this rule, these are the actions that will be taken to change the resulting alert and incident. (opaque JSON object)
                        disabled:
                          type: boolean
                          description: Indicates whether the rule is disabled and would therefore not be evaluated.
            catch_all:
              type: object
              description: When none of the Rules in a set match an event, we apply the catch_all actions to the event.
              properties:
                actions:
                  type: string
                  description: These are the actions that will be taken to change the resulting alert and incident. (opaque JSON object)
            created_at:
              type: string
              format: date-time
              description: The date/time the object was created.
              readOnly: true
            created_by:
              type: object
              description: Reference to the user that created the object.
              properties:
                id:
                  type: string
                  readOnly: true
                type:
                  type: string
                  description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
                  readOnly: true
                self:
                  type: string
                  format: url
                  description: The API show URL at which the object is accessible
                  readOnly: true
              readOnly: true
            updated_at:
              type: string
              format: date-time
              description: The date/time the object was last updated.
              readOnly: true
            updated_by:
              type: object
              description: Reference to the user that last updated the object.
              properties:
                id:
                  type: string
                  readOnly: true
                type:
                  type: string
                  description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
                  readOnly: true
                self:
                  type: string
                  format: url
                  description: The API show URL at which the object is accessible
                  readOnly: true
              readOnly: true
            version:
              type: string
              description: Version of these Orchestration Rules
              readOnly: true
      required:
        - orchestration_path
      example:
        orchestration_path:
          type: global
          parent:
            id: b02e973d-9620-4e0a-9edc-00fedf7d4694
            self: https://api.pagerduty.com/event_orchestrations/b02e973d-9620-4e0a-9edc-00fedf7d4694
            type: event_orchestration_reference
          self: https://api.pagerduty.com/event_orchestrations/b02e973d-9620-4e0a-9edc-00fedf7d4694/global
          sets:
            - id: start
              rules:
                - label: Always apply some consistent event transformations to all events
                  id: c91f72f3
                  conditions: []
                  actions:
                    variables:
                      - name: hostname
                        path: event.component
                        value: 'hostname: (.*)'
                        type: regex
                    extractions:
                      - template: '{{variables.hostname}}'
                        target: event.custom_details.hostname
                      - source: event.source
                        regex: www (.*) service
                        target: event.source
                    incident_custom_field_updates:
                      - id: PEXCK89
                        value: '#my-team-channel'
                      - id: PN1C4A2
                        value: '{{event.timestamp}}'
                    route_to: step-two
            - id: step-two
              rules:
                - label: All critical alerts should be treated as P1 incidents
                  id: 7c54529d
                  conditions:
                    - expression: event.severity matches 'critical'
                  actions:
                    priority: P0IN2KQ
                    suppress: false
                    incident_custom_field_updates:
                      - id: PEXCK89
                        value: '#p1-incident-response'
                - label: Drop all events from the very-noisy monitoring tool
                  id: 1f6d9a33
                  conditions:
                    - expression: event.source matches part 'very-noisy'
                  actions:
                    drop_event: true
                - label: Assign all database related incidents to the Database Team's escalation policy
                  id: 4314d9ce
                  conditions:
                    - expression: event.source matches 'prod-db'
                  actions:
                    escalation_policy: PEYSGVF
                - label: Never bother the on-call for info-level events outside of work hours
                  id: cd770384
                  conditions:
                    - expression: event.severity matches 'info' and not (now in Mon,Tue,Wed,Thu,Fri 09:00:00 to 17:00:00 America/Los_Angeles)
                  actions:
                    suppress: true
          catch_all:
            actions:
              suppress: true
              incident_custom_field_updates:
                - id: PEXCK89
                  value: '#general-incident-notifications'
          created_at: '2021-11-18T16:42:01Z'
          created_by:
            id: P8B9WR8
            self: https://api.pagerduty.com/users/P8B9WR8
            type: user_reference
          updated_at: '2021-11-18T16:42:01Z'
          updated_by:
            id: P8B9WR8
            self: https://api.pagerduty.com/users/P8B9WR8
            type: user_reference
          version: rn1Mja13T1HBdmPChqFilSQXUW2fWXM_
    OrchestrationWarningIneligible:
      type: object
      description: This rule is using a feature that is currently unavailable on the current account plan.
      properties:
        message:
          type: string
          description: A description of the warning and any potential side effects.
        rule_id:
          type: string
          description: The ID of the rule using the feature.
        feature:
          type: string
          description: |
            The feature that the current account plan does not have access to.

            Example values include:
            * `threshold_condition`
            * `nested_rules`
            * `suspend`
            * `automation_actions`
            * `cache_variable:automation_actions`
            * `cache_variable:annotate`
            * `variables`
            * `interpolation:annotate`
            * `interpolation:extractions`
            * `interpolation:incident_custom_field_updates`
            * `suppress`
            * `incident_custom_field_updates`
            * `dynamic_route_to`
            * `escalation_policy`
            * `aiops_routing_mismatch`
        feature_type:
          type: string
          description: |
            Specifies whether the feature is a part of the rule's conditions, or its actions.

            Example values include:
            * `conditions`
            * `actions`
            * `nested_rules`
            * `global_orchestrations`
            * `aiops_routing`
        warning_type:
          type: string
          description: The type of warning that is being returned for the rule.
          enum:
            - forbidden_feature
            - invalid_routing
    OrchestrationWarningInvalidData:
      type: object
      description: This rule includes invalid data for a feature item.
      properties:
        message:
          type: string
          description: A description of the warning and any potential side effects.
        rule_id:
          type: string
          description: The ID of the rule using the feature.
        feature:
          type: string
          description: |
            The feature that includes invalid data.

            Example values include:
              * `incident_custom_field_updates`
              * `escalation_policy`
              * `cache_variable:annotate`
              * `cache_variable:conditions`
              * `cache_variable:automation_actions`
