      name: id
      in: path
      required: true
      description: The ID of the schedule.
      schema:
        type: string
      example: PSJUKNI
    schedule_v3_since:
      name: since
      in: query
      description: Start of time range (ISO 8601)
      schema:
        type: string
        format: date-time
      example: '2025-01-01T00:00:00Z'
    schedule_v3_until:
      name: until
      in: query
      description: End of time range (ISO 8601)
      schema:
        type: string
        format: date-time
      example: '2025-01-31T23:59:59Z'
    schedule_v3_time_zone:
      name: time_zone
      in: query
      description: |
        IANA timezone identifier for rendering shift times. Defaults to the
        schedule's configured time zone.
      schema:
        type: string
      example: America/New_York
    schedule_v3_overflow:
      name: overflow
      in: query
      description: Include shifts that extend beyond the requested time range boundaries
      schema:
        type: boolean
        default: false
    schedule_v3_include:
      name: include[]
      in: query
      description: |
        Additional data to include in the schedule response:
        - `final_schedule`: computed on-call assignments for the time range
      schema:
        type: array
        items:
          type: string
          enum:
            - final_schedule
      style: form
      explode: true
      example:
        - final_schedule
    cursor_limit:
      name: limit
      in: query
      required: false
      description: The minimum of the `limit` parameter used in the request or the maximum request size of the API.
      schema:
        type: integer
    cursor_cursor:
      name: cursor
      in: query
      required: false
      description: |
        Optional parameter used to request the "next" set of results from an API.  The value provided here is most commonly obtained from the `next_cursor` field of the previous request.  When no value is provided, the request starts at the beginning of the result set.
      schema:
        type: string
    audit_since:
      name: since
      in: query
      description: The start of the date range over which you want to search. If not specified, defaults to `now() - 24 hours` (past 24 hours)
      schema:
        type: string
        format: date-time
    audit_until:
      name: until
      in: query
      description: The end of the date range over which you want to search. If not specified, defaults to `now()`. May not be more than 31 days after `since`.
      schema:
        type: string
        format: date-time
    schedule_v3_since_required:
      name: since
      in: query
      required: true
      description: Start of time range (ISO 8601)
      schema:
        type: string
        format: date-time
      example: '2026-06-01T00:00:00Z'
    schedule_v3_until_required:
      name: until
      in: query
      required: true
      description: End of time range (ISO 8601)
      schema:
        type: string
        format: date-time
      example: '2026-06-28T23:59:59Z'
    schedule_v3_limit:
      name: limit
