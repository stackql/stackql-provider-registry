components:
  schemas:
    V3ScheduleReference:
      type: object
      description: |
        Lightweight schedule object returned by the list endpoint.
        Uses `"type": "schedule_v3_reference"` to distinguish from
        legacy schedules (`"type": "schedule_reference"`).
      required:
        - id
        - type
        - summary
      properties:
        id:
          type: string
          example: PL5FQHC
        type:
          type: string
          enum:
            - schedule_v3_reference
        summary:
          type: string
          description: Schedule name
          example: Engineering On-Call
        self:
          type: string
          format: uri
          example: https://api.pagerduty.com/v3/schedules/PL5FQHC
        html_url:
          type: string
          format: uri
          example: https://example.pagerduty.com/schedules/PL5FQHC
    CreateScheduleRequest:
      type: object
      required:
        - schedule
      properties:
        schedule:
          type: object
          required:
            - name
            - time_zone
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 255
              example: Engineering On-Call
            time_zone:
              type: string
              description: IANA timezone identifier
              example: America/New_York
            description:
              type: string
              maxLength: 1024
              example: Primary engineering on-call rotation
            teams:
              type: array
              description: Teams to associate with this schedule
              items:
                type: object
                required:
                  - id
                  - type
                properties:
                  id:
                    type: string
                  type:
                    type: string
                    enum:
                      - team_reference
    ScheduleResponse:
      type: object
      required:
        - schedule
      properties:
        schedule:
          type: object
          required:
            - id
            - type
            - name
            - time_zone
          properties:
            id:
              type: string
              example: PL5FQHC
            type:
              type: string
              enum:
                - schedule_v3
              description: |
                Always `"schedule_v3"` for schedules created with this API.
                Schedules created with the legacy `/schedules` API use `"schedule"`.
            name:
              type: string
              example: Engineering On-Call
            time_zone:
              type: string
              example: America/New_York
            description:
              type: string
              example: Primary engineering on-call rotation
            teams:
              type: array
              items:
                $ref: '#/components/schemas/TeamReference'
            escalation_policies:
              type: array
              description: Escalation policies that reference this schedule
              items:
                $ref: '#/components/schemas/EscalationPolicyReference'
            users:
              type: array
              description: All users referenced in this schedule (only present when include[]=users)
              items:
                $ref: '#/components/schemas/UserReference'
            rotations:
              type: array
              description: Rotations in this schedule
              items:
                $ref: '#/components/schemas/Rotation'
