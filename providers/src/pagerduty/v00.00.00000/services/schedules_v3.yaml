openapi: 3.0.2
info:
  title: PagerDuty API - Schedules V3
  description: 'The v3 schedules API: schedules, rotations, events, custom shifts and overrides.'
  version: 2.0.0
paths:
  /v3/schedules:
    get:
      tags:
        - Schedules_v3
      summary: List schedules
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Retrieve a paginated list of schedule references. Returns lightweight
        objects without embedded rotations or events.

        Each result is filtered by the caller's read permission; schedules the
        caller cannot read are silently excluded.
      operationId: listSchedulesV3
      parameters:
        - $ref: '#/components/parameters/schedule_v3_limit_schedules'
        - $ref: '#/components/parameters/schedule_v3_offset'
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/offset_total'
        - $ref: '#/components/parameters/team_ids'
      responses:
        '200':
          description: Schedules retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - schedules
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: '#/components/schemas/V3ScheduleReference'
                  limit:
                    type: integer
                    example: 100
                  offset:
                    type: integer
                    example: 0
                  more:
                    type: boolean
                    description: Whether additional results exist beyond this page
                    example: false
              examples:
                response:
                  summary: Example response
                  value:
                    schedules:
                      - id: PS1A2B3C
                        type: schedule_v3_reference
                        summary: Engineering On-Call
                        self: https://api.pagerduty.com/v3/schedules/PS1A2B3C
                        html_url: https://subdomain.pagerduty.com/schedules/PS1A2B3C
                    limit: 100
                    offset: 0
                    more: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Schedules_v3
      summary: Create a schedule
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Create a new on-call schedule with basic metadata. Rotations and events
        must be added via separate API calls after creation.

        **Rejected fields:** `rotations` and `escalation_policies` are not
        accepted in the request body and will result in a 400 error.
      operationId: createScheduleV3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
            examples:
              basic:
                summary: Minimal schedule
                value:
                  schedule:
                    name: Engineering On-Call
                    time_zone: America/New_York
              withTeams:
                summary: Schedule with teams
                value:
                  schedule:
                    name: Engineering On-Call
                    time_zone: UTC
                    description: Engineering team on-call schedule
                    teams:
                      - id: PTEAM123
                        type: team_reference
      responses:
        '201':
          description: Schedule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v3/schedules/{id}:
    get:
      tags:
        - Schedules_v3
      summary: Get a schedule
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Retrieve a schedule by ID including rotations and events. Optionally
        include the computed final schedule for a time range.

        Use `include[]=final_schedule` to get computed on-call assignments.
        Use `since` and `until` to specify the time range.
      operationId: getScheduleV3
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
        - $ref: '#/components/parameters/schedule_v3_since'
        - $ref: '#/components/parameters/schedule_v3_until'
        - $ref: '#/components/parameters/schedule_v3_time_zone'
        - $ref: '#/components/parameters/schedule_v3_overflow'
        - $ref: '#/components/parameters/schedule_v3_include'
      responses:
        '200':
          description: Schedule retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
              examples:
                response:
                  summary: Example response
                  value:
                    schedule:
                      id: PS1A2B3C
                      type: schedule_v3
                      name: Engineering On-Call
                      time_zone: America/New_York
                      self: https://api.pagerduty.com/v3/schedules/PS1A2B3C
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Schedules_v3
      summary: Update a schedule
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Update schedule metadata (name, description, time zone). All fields are
        optional — only provided fields are updated.

        To modify rotations or events, use their respective endpoints.

        **Rejected fields:** `rotations` and `escalation_policies` are not
        accepted and will result in a 400 error.
      operationId: updateScheduleV3
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
            examples:
              nameOnly:
                summary: Update name only
                value:
                  schedule:
                    name: New Schedule Name
              fullUpdate:
                summary: Update multiple fields
                value:
                  schedule:
                    name: Updated Schedule
                    time_zone: America/Los_Angeles
                    description: Updated description
      responses:
        '200':
          description: Schedule updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
              examples:
                response:
                  summary: Example response
                  value:
                    schedule:
                      id: PS1A2B3C
                      type: schedule_v3
                      name: Updated Schedule
                      time_zone: America/Los_Angeles
                      self: https://api.pagerduty.com/v3/schedules/PS1A2B3C
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Schedules_v3
      summary: Delete a schedule
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Delete a schedule and all associated rotations and events.

        If the schedule is referenced by an active escalation policy, the
        deletion will be rejected.
      operationId: deleteScheduleV3
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
      responses:
        '204':
          description: Schedule deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v3/schedules/{id}/audit/records:
    get:
      x-pd-requires-scope: audit_records.read
      tags:
        - Schedules_v3
      operationId: listSchedulesAuditRecordsV3
      summary: List audit records for a schedule
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        The returned records are sorted by the `execution_time` from newest to oldest.

        See [`Cursor-based pagination`](https://developer.pagerduty.com/docs/rest-api-v2/pagination/) for instructions on how to paginate through the result set.

        For more information see the [Audit API Document](https://developer.pagerduty.com/docs/rest-api-v2/audit-records-api/).

        Scoped OAuth requires: `audit_records.read`
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
        - $ref: '#/components/parameters/cursor_limit'
        - $ref: '#/components/parameters/cursor_cursor'
        - $ref: '#/components/parameters/audit_since'
        - $ref: '#/components/parameters/audit_until'
      responses:
        '200':
          description: Records matching the query criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecordResponseSchema'
              examples:
                response:
                  $ref: '#/components/examples/AuditRecordScheduleResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List audit records of changes made to the schedule.
  /v3/schedules/{id}/custom_shifts:
    get:
      tags:
        - Schedules_v3
      summary: List custom shifts
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Retrieve custom shifts for a schedule within a time range.

        **`since` and `until` are required.**
      operationId: listCustomShifts
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
        - $ref: '#/components/parameters/schedule_v3_since_required'
        - $ref: '#/components/parameters/schedule_v3_until_required'
        - $ref: '#/components/parameters/schedule_v3_time_zone'
        - $ref: '#/components/parameters/schedule_v3_overflow'
        - $ref: '#/components/parameters/schedule_v3_limit'
        - $ref: '#/components/parameters/schedule_v3_offset'
      responses:
        '200':
          description: Custom shifts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - custom_shifts
                properties:
                  custom_shifts:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomShift'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  more:
                    type: boolean
              examples:
                response:
                  summary: Example response
                  value:
                    custom_shifts: []
                    limit: 25
                    offset: 0
                    more: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Schedules_v3
      summary: Create custom shifts
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Create one or more custom shifts for a schedule. Custom shifts are
        ad-hoc one-off coverage periods that exist outside of rotation events.

        Each custom shift requires exactly one assignment.
      operationId: createCustomShifts
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomShiftsRequest'
            example:
              custom_shifts:
                - type: custom_shift
                  start_time: '2025-03-15T09:00:00Z'
                  end_time: '2025-03-15T17:00:00Z'
                  assignments:
                    - type: shift_assignment
                      member:
                        type: user_member
                        user_id: PUSER123
      responses:
        '201':
          description: Custom shifts created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - custom_shifts
                properties:
                  custom_shifts:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomShift'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v3/schedules/{id}/custom_shifts/{custom_shift_id}:
    get:
      tags:
        - Schedules_v3
      summary: Get a custom shift
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Retrieve a single custom shift by ID.
      operationId: getCustomShift
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
        - $ref: '#/components/parameters/schedule_v3_custom_shift_id'
      responses:
        '200':
          description: Custom shift retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - custom_shift
                properties:
                  custom_shift:
                    $ref: '#/components/schemas/CustomShift'
              examples:
                response:
                  summary: Example response
                  value:
                    custom_shift:
                      id: ABCDE12345FGHIJ67890KLMNO
                      type: custom_shift
                      start_time: '2025-03-15T09:00:00Z'
                      end_time: '2025-03-15T17:00:00Z'
                      assignments:
                        - id: AGOQEAQOOJ3UDGC22OGLXLIRY4
                          member:
                            type: user_member
                            user_id: PNFNM8M
                          type: shift_assignment
                      self: https://api.pagerduty.com/v3/schedules/PI7DH85/custom_shifts/ABCDE12345FGHIJ67890KLMNO
                      html_url: https://subdomain.pagerduty.com/schedules/PI7DH85
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Schedules_v3
      summary: Update a custom shift
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Update an existing custom shift.

        If the shift has already started, only `end_time` can be modified.
      operationId: updateCustomShift
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
        - $ref: '#/components/parameters/schedule_v3_custom_shift_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomShiftRequest'
            example:
              custom_shift:
                start_time: '2025-03-15T10:00:00Z'
                end_time: '2025-03-15T18:00:00Z'
                assignments:
                  - type: shift_assignment
                    member:
                      type: user_member
                      user_id: PUSER456
      responses:
        '200':
          description: Custom shift updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - custom_shift
                properties:
                  custom_shift:
                    $ref: '#/components/schemas/CustomShift'
              examples:
                response:
                  summary: Example response
                  value:
                    custom_shift:
                      id: ABCDE12345FGHIJ67890KLMNO
                      type: custom_shift
                      start_time: '2025-03-15T10:00:00Z'
                      end_time: '2025-03-15T18:00:00Z'
                      assignments:
                        - id: AGOQEAQOOJ3UDGC22OGLXLIRY4
                          member:
                            type: user_member
                            user_id: PNFNM8M
                          type: shift_assignment
                      self: https://api.pagerduty.com/v3/schedules/PI7DH85/custom_shifts/ABCDE12345FGHIJ67890KLMNO
                      html_url: https://subdomain.pagerduty.com/schedules/PI7DH85
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Schedules_v3
      summary: Delete a custom shift
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Delete a custom shift by ID. When the shift is not started, it deletes the shift entirely. If the shift is already started, it sets the end_time to now. It returns Bad Request when shift is already ended.
      operationId: deleteCustomShift
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
        - $ref: '#/components/parameters/schedule_v3_custom_shift_id'
      responses:
        '204':
          description: Custom shift deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v3/schedules/{id}/overrides:
    get:
      tags:
        - Schedules_v3
      summary: List overrides
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Retrieve overrides for a schedule within a time range.

        **`since` and `until` are required.**
      operationId: listOverrides
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
        - $ref: '#/components/parameters/schedule_v3_since_required'
        - $ref: '#/components/parameters/schedule_v3_until_required'
        - $ref: '#/components/parameters/schedule_v3_time_zone'
        - $ref: '#/components/parameters/schedule_v3_overflow'
        - $ref: '#/components/parameters/schedule_v3_limit'
        - $ref: '#/components/parameters/schedule_v3_offset'
      responses:
        '200':
          description: Overrides retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - overrides
                properties:
                  overrides:
                    type: array
                    items:
                      $ref: '#/components/schemas/OverrideShift'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  more:
                    type: boolean
              examples:
                response:
                  summary: Example response
                  value:
                    overrides: []
                    limit: 25
                    offset: 0
                    more: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Schedules_v3
      summary: Create overrides
      description: |
        <!-- theme: info -->

        > **Important note:** Shift-based schedules use the V3 API and are not compatible with V2 automations. **To create automations for Shift-Based Schedules, you need to:**
        >
        > 1. **Update your automations** to use the V3 API for all new shift-based schedules
        > 2. **Keep the V2 endpoint** for your existing schedules
        >
        > An upgrade tool for existing schedules is coming soon; your legacy schedules will keep working in the meantime. [Learn more](https://support.pagerduty.com/main/docs/shift-based-schedules-api-upgrade-examples).

        Create one or more overrides for a schedule. An override temporarily
        replaces a scheduled on-call member with a different member for a
        specific time period.

        Each override must reference either a `rotation_id` or a
        `custom_shift_id` (not both). The overriding member must belong to
        the account.

        **Note:** The create response wraps the result in an `overrides` array.
        Single-resource endpoints (get, update) wrap in `override` (singular).
      operationId: createOverrides
      parameters:
        - $ref: '#/components/parameters/schedule_v3_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOverridesRequest'
            example:
              overrides:
                - type: override_shift
