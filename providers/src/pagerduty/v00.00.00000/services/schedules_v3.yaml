        rotation:
          $ref: '#/components/schemas/Rotation'
    Event:
      type: object
      description: |
        An event defines when and how users are on-call within a rotation.
        It combines a recurring time window (`start_time`, `end_time`,
        `recurrence`) with an assignment strategy and an effective date range
        (`effective_since`, `effective_until`).
      required:
        - id
        - type
        - name
        - start_time
        - end_time
        - effective_since
        - recurrence
        - assignment_strategy
      properties:
        id:
          type: string
          example: ABCDEFGHIJKLMNOPQRSTUVWXY2
        type:
          type: string
          enum:
            - schedule_event
        name:
          type: string
          description: Display name for this event
          example: Weekly On-Call
        start_time:
          $ref: '#/components/schemas/ZonedDateTime'
        end_time:
          $ref: '#/components/schemas/ZonedDateTime'
        effective_since:
          type: string
          format: date-time
          description: When this event starts producing shifts (UTC)
          example: '2025-03-03T00:00:00Z'
        effective_until:
          type: string
          format: date-time
          nullable: true
          description: When this event stops producing shifts (UTC). Null means indefinite.
          example: '2025-09-01T00:00:00Z'
        recurrence:
          type: array
          description: 'RFC 5545 recurrence rules defining the repeating pattern. This must be an array containing:  <br> - Exactly one <b>RRULE</b> <br>- Zero or more <b>EXDATE</b> <br>- Zero or more <b>RDATE</b>'
          items:
            type: string
          example:
            - RRULE:FREQ=WEEKLY
        assignment_strategy:
          $ref: '#/components/schemas/EventAssignmentStrategy'
        self:
          type: string
          format: uri
        html_url:
          type: string
          format: uri
    CreateEventRequest:
      type: object
      required:
        - event
      properties:
        event:
          type: object
          required:
            - name
            - start_time
            - end_time
            - effective_since
            - recurrence
            - assignment_strategy
          properties:
            name:
              type: string
              maxLength: 255
            start_time:
              $ref: '#/components/schemas/ZonedDateTime'
            end_time:
              $ref: '#/components/schemas/ZonedDateTime'
            effective_since:
              type: string
              format: date-time
              description: |
                When this event starts producing shifts. Values in the past are
                clamped to the current time.
            effective_until:
              type: string
              format: date-time
              nullable: true
              description: When this event stops producing shifts. Omit or null for indefinite.
            recurrence:
              type: array
              items:
                type: string
              description: |
                RFC 5545 recurrence rules. Must be an array containing exactly
                one RRULE, zero or more EXDATE, and zero or more RDATE.

                **UI editor constraints:** The shift-based schedule editor can
                only load an event when the RRULE satisfies all of the following:
                1. A `FREQ` parameter is present.
                2. `FREQ` is one of `WEEKLY`, `DAILY`, `MONTHLY`, or `HOURLY`.
                3. All `BYDAY` values are standard two-letter day codes
                   (`MO`, `TU`, `WE`, `TH`, `FR`, `SA`, `SU`).

                Events that violate any condition display a
                "can't be edited in the UI" modal and must be managed via the API.
            assignment_strategy:
              $ref: '#/components/schemas/EventAssignmentStrategy'
    EventResponse:
      type: object
      required:
        - event
      properties:
        event:
          $ref: '#/components/schemas/Event'
    UpdateEventRequest:
      type: object
      description: |
        Which fields can be updated depends on the
        event's current state:
        - Active events (already started): only `effective_until` can be changed
        - Future events: all fields can be changed
        - Past events: no fields can be changed (returns 400)
      required:
        - event
      properties:
        event:
          type: object
          properties:
            name:
              type: string
              maxLength: 255
            start_time:
              $ref: '#/components/schemas/ZonedDateTime'
            end_time:
              $ref: '#/components/schemas/ZonedDateTime'
            effective_since:
              type: string
              format: date-time
            effective_until:
              type: string
              format: date-time
              nullable: true
            recurrence:
              type: array
              items:
                type: string
              description: |
                RFC 5545 recurrence rules. Must be an array containing exactly
                one RRULE, zero or more EXDATE, and zero or more RDATE.

                **UI editor constraints:** The shift-based schedule editor can
                only load an event when the RRULE satisfies all of the following:
                1. A `FREQ` parameter is present.
                2. `FREQ` is one of `WEEKLY`, `DAILY`, `MONTHLY`, or `HOURLY`.
                3. All `BYDAY` values are standard two-letter day codes
                   (`MO`, `TU`, `WE`, `TH`, `FR`, `SA`, `SU`).

                Events that violate any condition display a
                "can't be edited in the UI" modal and must be managed via the API.
            assignment_strategy:
              $ref: '#/components/schemas/EventAssignmentStrategy'
