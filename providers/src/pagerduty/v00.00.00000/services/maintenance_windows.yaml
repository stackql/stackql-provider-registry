openapi: 3.0.2
info:
  title: PagerDuty API - Maintenance Windows
  description: Maintenance windows temporarily disable incident creation on services.
  version: 2.0.0
paths:
  /maintenance_windows:
    get:
      x-pd-requires-scope: services.read
      tags:
        - Maintenance Windows
      operationId: listMaintenanceWindows
      description: |
        List existing maintenance windows, optionally filtered by service and/or team, or whether they are from the past, present or future.

        A Maintenance Window is used to temporarily disable one or more Services for a set period of time.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#maintenance-windows)

        Scoped OAuth requires: `services.read`
      summary: List maintenance windows
      parameters:
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/offset_limit'
        - $ref: '#/components/parameters/offset_offset'
        - $ref: '#/components/parameters/offset_total'
        - $ref: '#/components/parameters/team_ids'
        - $ref: '#/components/parameters/services'
        - $ref: '#/components/parameters/include_maintenance_window'
        - $ref: '#/components/parameters/filter_maintenance_windows'
      responses:
        '200':
          description: A paginated array of maintenance windows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                  maintenance_windows:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceWindow'
                required:
                  - maintenance_windows
              examples:
                response:
                  summary: Response Example
                  value:
                    maintenance_windows:
                      - id: PW98YIO
                        type: maintenance_window
                        summary: Immanentizing the eschaton
                        self: https://api.pagerduty.com/maintenance_windows/PW98YIO
                        html_url: https://subdomain.pagerduty.com/service-directory/maintenance-windows/PW98YIO
                        sequence_number: 1
                        start_time: '2015-11-09T20:00:00-05:00'
                        end_time: '2015-11-09T22:00:00-05:00'
                        description: Immanentizing the eschaton
                        services:
                          - id: PIJ90N7
                            type: service_reference
                            summary: My Mail Service
                            self: https://api.pagerduty.com/services/PIJ90N7
                            html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
                        teams:
                          - id: PQ9K7I8
                            type: team_reference
                            summary: Engineering
                            self: https://api.pagerduty.com/teams/PQ9K7I8
                            html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                        created_by:
                          id: PXPGF42
                          type: user_reference
                          summary: Earline Greenholt
                          self: https://api.pagerduty.com/users/PXPGF42
                          html_url: https://subdomain.pagerduty.com/users/PXPGF42
                    limit: 25
                    offset: 0
                    more: false
                    total: null
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      x-pd-requires-scope: services.write
      tags:
        - Maintenance Windows
      operationId: createMaintenanceWindow
      description: |
        Create a new maintenance window for the specified services. No new incidents will be created for a service that is in maintenance.

        A Maintenance Window is used to temporarily disable one or more Services for a set period of time.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#maintenance-windows)

        Scoped OAuth requires: `services.write`
      summary: Create a maintenance window
      parameters:
        - $ref: '#/components/parameters/from_header'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maintenance_window:
                  $ref: '#/components/schemas/MaintenanceWindow'
              required:
                - maintenance_window
            examples:
              request:
                summary: Request Example
                value:
                  maintenance_window:
                    type: maintenance_window
                    start_time: '2015-11-09T20:00:00-05:00'
                    end_time: '2015-11-09T22:00:00-05:00'
                    description: Immanentizing the eschaton
                    services:
                      - id: PIJ90N7
                        type: service_reference
        description: The maintenance window object.
      responses:
        '201':
          description: The maintenance window that was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance_window:
                    $ref: '#/components/schemas/MaintenanceWindow'
                required:
                  - maintenance_window
              examples:
                response:
                  summary: Response Example
                  value:
                    maintenance_window:
                      id: PW98YIO
                      type: maintenance_window
                      summary: Immanentizing the eschaton
                      self: https://api.pagerduty.com/maintenance_windows/PW98YIO
                      html_url: https://subdomain.pagerduty.com/service-directory/maintenance-windows/PW98YIO
                      sequence_number: 1
                      start_time: '2015-11-09T20:00:00-05:00'
                      end_time: '2015-11-09T22:00:00-05:00'
                      description: Immanentizing the eschaton
                      services:
                        - id: PIJ90N7
                          type: service_reference
                          summary: My Mail Service
                          self: https://api.pagerduty.com/services/PIJ90N7
                          html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
                      teams:
                        - id: PQ9K7I8
                          type: team_reference
                          summary: Engineering
                          self: https://api.pagerduty.com/teams/PQ9K7I8
                          html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                      created_by:
                        id: PXPGF42
                        type: user_reference
                        summary: Earline Greenholt
                        self: https://api.pagerduty.com/users/PXPGF42
                        html_url: https://subdomain.pagerduty.com/users/PXPGF42
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: List and create maintenance windows.
  /maintenance_windows/{id}:
    get:
      x-pd-requires-scope: services.read
      tags:
        - Maintenance Windows
      operationId: getMaintenanceWindow
      description: |
        Get an existing maintenance window.

        A Maintenance Window is used to temporarily disable one or more Services for a set period of time.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#maintenance-windows)

        Scoped OAuth requires: `services.read`
      summary: Get a maintenance window
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/include_maintenance_window'
      responses:
        '200':
          description: The maintenance window that was updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance_window:
                    $ref: '#/components/schemas/MaintenanceWindow'
                required:
                  - maintenance_window
              examples:
                response:
                  summary: Response Example
                  value:
                    maintenance_window:
                      id: PW98YIO
                      type: maintenance_window
                      summary: Immanentizing the eschaton
                      self: https://api.pagerduty.com/maintenance_windows/PW98YIO
                      html_url: https://subdomain.pagerduty.com/service-directory/maintenance-windows/PW98YIO
                      sequence_number: 1
                      start_time: '2015-11-09T20:00:00-05:00'
                      end_time: '2015-11-09T22:00:00-05:00'
                      description: Immanentizing the eschaton
                      services:
                        - id: PIJ90N7
                          type: service_reference
                          summary: My Mail Service
