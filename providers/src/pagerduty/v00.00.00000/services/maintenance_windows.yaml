                        type: user_reference
                        summary: Earline Greenholt
                        self: https://api.pagerduty.com/users/PXPGF42
                        html_url: https://subdomain.pagerduty.com/users/PXPGF42
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      x-pd-requires-scope: services.write
      tags:
        - Maintenance Windows
      operationId: deleteMaintenanceWindow
      description: |
        Delete an existing maintenance window if it's in the future, or end it if it's currently on-going. If the maintenance window has already ended it cannot be deleted.

        A Maintenance Window is used to temporarily disable one or more Services for a set period of time.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#maintenance-windows)

        Scoped OAuth requires: `services.write`
      summary: Delete or end a maintenance window
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: The maintenance window was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: The maintenance window can't be deleted because it has already ended.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      x-pd-requires-scope: services.write
      tags:
        - Maintenance Windows
      operationId: updateMaintenanceWindow
      description: |
        Update an existing maintenance window.

        A Maintenance Window is used to temporarily disable one or more Services for a set period of time.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#maintenance-windows)

        Scoped OAuth requires: `services.write`
      summary: Update a maintenance window
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maintenance_window:
                  $ref: '#/components/schemas/MaintenanceWindow'
              required:
                - maintenance_window
            examples:
              request:
                summary: Request Example
                value:
                  maintenance_window:
                    type: maintenance_window
                    start_time: '2015-11-09T20:00:00-05:00'
                    end_time: '2015-11-09T22:00:00-05:00'
                    description: Immanentizing the eschaton
                    services:
                      - id: PIJ90N7
                        type: service_reference
        description: The maintenance window to be updated.
      responses:
        '200':
          description: The maintenance window that was updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance_window:
                    $ref: '#/components/schemas/MaintenanceWindow'
                required:
                  - maintenance_window
              examples:
                response:
                  summary: Response Example
                  value:
                    maintenance_window:
                      id: PW98YIO
                      type: maintenance_window
                      summary: Immanentizing the eschaton
                      self: https://api.pagerduty.com/maintenance_windows/PW98YIO
                      html_url: https://subdomain.pagerduty.com/service-directory/maintenance-windows/PW98YIO
                      sequence_number: 1
                      start_time: '2015-11-09T20:00:00-05:00'
                      end_time: '2015-11-09T22:00:00-05:00'
                      description: Immanentizing the eschaton
                      services:
                        - id: PIJ90N7
                          type: service_reference
                          summary: My Mail Service
                          self: https://api.pagerduty.com/services/PIJ90N7
                          html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
                      teams:
                        - id: PQ9K7I8
                          type: team_reference
                          summary: Engineering
                          self: https://api.pagerduty.com/teams/PQ9K7I8
                          html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                      created_by:
                        id: PXPGF42
                        type: user_reference
                        summary: Earline Greenholt
                        self: https://api.pagerduty.com/users/PXPGF42
                        html_url: https://subdomain.pagerduty.com/users/PXPGF42
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: Manage a maintenance window.
components:
  schemas:
    Pagination:
      type: object
      properties:
        offset:
          type: integer
          description: Echoes offset pagination property.
          readOnly: true
        limit:
          type: integer
          description: Echoes limit pagination property.
          readOnly: true
        more:
          type: boolean
          description: Indicates if there are additional records to return
          readOnly: true
        total:
          type: integer
          description: The total number of records matching the given query.
          nullable: true
          readOnly: true
    MaintenanceWindow:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        sequence_number:
          type: integer
          readOnly: true
          description: The order in which the maintenance window was created.
        start_time:
          type: string
          format: date-time
          description: This maintenance window's start time. This is when the services will stop creating incidents. If this date is in the past, it will be updated to be the current time.
        end_time:
          type: string
          format: date-time
          description: This maintenance window's end time. This is when the services will start creating incidents again. This date must be in the future and after the `start_time`.
        description:
          type: string
          description: A description for this maintenance window.
        created_by:
          $ref: '#/components/schemas/UserReference'
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceReference'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamReference'
          readOnly: true
      required:
        - start_time
        - end_time
        - services
        - type
      example:
        id: PIJ89JD
        type: maintenance_window
        start_time: '2015-11-09T20:00:00-05:00'
        end_time: '2015-11-09T22:00:00-05:00'
        description: Immanentizing the eschaton
        services:
          - id: PIJ90N7
            type: service_reference
    Tag:
