          type: string
          enum:
            - unacknowledge
            - escalate
            - resolve
            - urgency_change
        at:
          type: string
          format: date-time
        to:
          description: The urgency that the incident will change to. This field is only present when the type is `urgency_change`.
          type: string
          enum:
            - high
      discriminator:
        propertyName: type
      required:
        - type
        - at
