      example:
        type: tag
        label: Batman
    Channel:
      type: object
      description: Polymorphic object representation of the means by which the action was channeled. Has different formats depending on type, indicated by channel[type]. Will be one of `auto`, `email`, `api`, `nagios`, or `timeout` if `agent[type]` is `service`. Will be one of `email`, `sms`, `website`, `web_trigger`, or `note` if `agent[type]` is `user`.
      properties:
        type:
          type: string
          description: type
        user:
          type: string
          description: (opaque JSON object)
        team:
          type: string
          description: (opaque JSON object)
        notification:
          $ref: '#/components/schemas/Notification'
        channel:
          type: string
          description: channel (opaque JSON object)
        changeset:
          type: object
          description: Changeset present in CustomFieldsValueChange and FieldValueChange log entries.
          properties:
            customer_fields:
              type: array
              description: Customer Fields present in CustomFieldsValueChange and FieldValueChange log entries.
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: PDB5RLI
                  name:
                    type: string
                    example: serial_number_hardware
                  value:
                    oneOf:
                      - type: integer
                      - type: array
                        items:
                          type: string
                  namespace:
                    type: string
                    example: incidents
                  old_value:
                    type: string
                    nullable: true
                    example: null
            application_fields:
              type: array
              description: Application Fields present in CustomFieldsValueChange and FieldValueChange log entries.
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: PIJ90N7
                  name:
                    type: string
                    example: service
                  value:
                    oneOf:
                      - type: string
                        example: PIZW265
                      - type: integer
                        example: 130
                      - type: array
                        items:
                          type: string
                  namespace:
                    type: string
                    example: incidents
                  old_value:
                    type: string
                    nullable: true
                    example: null
            custom_attributes:
              type: object
              description: Custom attributes for the changeset.
              additionalProperties:
                type: string
            customer_schema:
              type: object
              properties:
                old_value:
                  type: string
                  nullable: true
                  example: null
        summary:
          type: string
          description: Same as `host`
        host:
          type: string
          description: Nagios host
        service:
          type: string
          description: Nagios service that created the event, if applicable
        state:
          type: string
          description: State that caused the event
