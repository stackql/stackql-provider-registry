    post:
      x-pd-requires-scope: incident_workflows:instances.write
      tags:
        - Incident Workflows
      operationId: createIncidentWorkflowInstance
      description: |
        Start an Instance of an Incident Workflow. Sometimes referred to as "triggering a workflow on an incident."

        An Incident Workflow is a sequence of configurable Steps and associated Triggers that can execute automated Actions for a given Incident.

        Scoped OAuth requires: `incident_workflows:instances.write`
      summary: Start an Incident Workflow Instance
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                incident_workflow_instance:
                  type: object
                  properties:
                    id:
                      type: string
                      description: An identifier to help differentiate between workflow executions.
                      example: P3SNKQS
                    incident:
                      type: object
                      properties:
                        id:
                          type: string
                          example: Q1R2DLCB21K7NP
                        type:
                          type: string
                          enum:
                            - incident_reference
                      required:
                        - id
              required:
                - incident_workflow_instance
            examples:
              request:
                summary: Request Example
                value:
                  incident_workflow_instance:
                    id: P3SNKQS
                    type: incident_workflow_instance
                    incident:
                      id: Q1R2DLCB21K7NP
                      type: incident_reference
      responses:
        '201':
          description: The Incident Workflow Instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident_workflow_instance:
                    $ref: '#/components/schemas/IncidentWorkflowInstance'
                required:
                  - incident_workflow_instance
              examples:
