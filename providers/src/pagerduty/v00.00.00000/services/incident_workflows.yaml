      description: |
        Create new Incident Workflow Trigger

        Scoped OAuth requires: `incident_workflows.write`
      summary: Create a Trigger
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trigger:
                  type: object
                  properties:
                    id:
                      type: string
                      readOnly: true
                    summary:
                      type: string
                      nullable: true
                      readOnly: true
                      description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
                    type:
                      type: string
                      readOnly: true
                      description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
                    self:
                      type: string
                      nullable: true
                      readOnly: true
                      format: url
                      description: the API show URL at which the object is accessible
                    html_url:
                      type: string
                      nullable: true
                      readOnly: true
                      format: url
                      description: a URL at which the entity is uniquely displayed in the Web app
                    trigger_type:
                      type: string
                      enum:
                        - conditional
                        - manual
                        - incident_type
                    condition:
                      type: string
                      description: |
                        A PCL condition string.

                        If specified, the trigger will execute when the condition is met on an incident.

                        If unspecified, the trigger will execute on incident creation.

                        Required if trigger_type is “conditional”, not allowed for other trigger types.
                    trigger_url:
                      type: string
                      format: url
                    incident_types:
                      type: array
