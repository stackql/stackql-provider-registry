openapi: 3.0.2
info:
  title: PagerDuty API - Teams
  description: Teams, their members, escalation policies, notification subscriptions and audit records.
  version: 2.0.0
paths:
  /teams:
    post:
      x-pd-requires-scope: teams.write
      tags:
        - Teams
      operationId: createTeam
      description: |
        Create a new Team.

        A team is a collection of Users and Escalation Policies that represent a group of people within an organization.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#teams)

        Scoped OAuth requires: `teams.write`
      summary: Create a team
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  $ref: '#/components/schemas/Team'
              required:
                - team
            examples:
              request:
                summary: Request Example
                value:
                  team:
                    type: team
                    name: Engineering
                    description: The engineering team
        description: The team to be created.
      responses:
        '201':
          description: The team that was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
                required:
                  - team
              examples:
                response:
                  summary: Response Example
                  value:
                    team:
                      id: PQ9K7I8
                      type: team
                      summary: Engineering
                      self: https://api.pagerduty.com/teams/PQ9K7I8
                      html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                      name: Engineering
                      description: All engineering
                      default_role: manager
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      x-pd-requires-scope: teams.read
      tags:
        - Teams
      operationId: listTeams
      description: |
        List teams of your PagerDuty account, optionally filtered by a search query.

        A team is a collection of Users and Escalation Policies that represent a group of people within an organization.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#teams)

        Scoped OAuth requires: `teams.read`
      summary: List teams
      parameters:
        - $ref: '#/components/parameters/offset_limit'
        - $ref: '#/components/parameters/offset_offset'
        - $ref: '#/components/parameters/offset_total'
        - $ref: '#/components/parameters/query'
      responses:
        '200':
          description: A paginated array of teams.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                  teams:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
                required:
                  - teams
              examples:
                response:
                  summary: Response Example
                  value:
                    teams:
                      - id: PQ9K7I8
                        type: team
                        summary: Engineering
                        self: https://api.pagerduty.com/teams/PQ9K7I8
                        html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                        name: Engineering
                        description: All engineering
                    limit: 100
                    offset: 0
                    more: false
                    total: null
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: List or create teams.
  /teams/{id}:
    get:
      x-pd-requires-scope: teams.read
      tags:
        - Teams
      operationId: getTeam
      description: |
        Get details about an existing team.

        A team is a collection of Users and Escalation Policies that represent a group of people within an organization.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#teams)

        Scoped OAuth requires: `teams.read`
      summary: Get a team
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/include_teams'
      responses:
        '200':
          description: The team requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
                required:
                  - team
              examples:
                response:
                  summary: Response Example
                  value:
                    team:
                      id: PQ9K7I8
                      type: team
                      summary: Engineering
                      self: https://api.pagerduty.com/teams/PQ9K7I8
                      html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                      name: Engineering
                      description: All engineering
                      default_role: manager
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      x-pd-requires-scope: teams.write
      tags:
        - Teams
      operationId: deleteTeam
      description: |
        Remove an existing team.

        Succeeds only if the team has no associated Escalation Policies, Services, Schedules and Subteams.

        All associated unresovled incidents will be reassigned to another team (if specified) or will loose team association, thus becoming account-level (with visibility implications).

        Note that the incidents reassignment process is asynchronous and has no guarantee to complete before the API call return.

        A team is a collection of Users and Escalation Policies that represent a group of people within an organization.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#teams)

        Scoped OAuth requires: `teams.write`
      summary: Delete a team
      parameters:
        - $ref: '#/components/parameters/reassignment_team'
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: The team was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      x-pd-requires-scope: teams.write
      tags:
        - Teams
      operationId: updateTeam
      description: |
        Update an existing team.

        A team is a collection of Users and Escalation Policies that represent a group of people within an organization.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#teams)

        Scoped OAuth requires: `teams.write`
      summary: Update a team
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  $ref: '#/components/schemas/Team'
              required:
                - team
            examples:
              request:
                summary: Request Example
                value:
                  team:
                    type: team
                    name: Engineering
                    description: The engineering team
        description: The team to be updated.
      responses:
        '200':
          description: The team that was updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
                required:
                  - team
              examples:
                response:
                  summary: Response Example
                  value:
                    team:
                      id: PQ9K7I8
                      type: team
                      summary: Engineering
                      self: https://api.pagerduty.com/teams/PQ9K7I8
                      html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                      name: Engineering
                      description: All engineering
                      default_role: manager
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: Manage a team.
  /teams/{id}/audit/records:
    get:
      x-pd-requires-scope: audit_records.read
      tags:
        - Teams
      operationId: listTeamsAuditRecords
      summary: List audit records for a team
      description: |
        The returned records are sorted by the `execution_time` from newest to oldest.

        See [`Cursor-based pagination`](https://developer.pagerduty.com/docs/rest-api-v2/pagination/) for instructions on how to paginate through the result set.

        For more information see the [Audit API Document](https://developer.pagerduty.com/docs/rest-api-v2/audit-records-api/).

        Scoped OAuth requires: `audit_records.read`
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/cursor_limit'
        - $ref: '#/components/parameters/cursor_cursor'
        - $ref: '#/components/parameters/audit_since'
        - $ref: '#/components/parameters/audit_until'
      responses:
        '200':
          description: Records matching the query criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecordResponseSchema'
              examples:
                response:
                  $ref: '#/components/examples/AuditRecordTeamResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List audit records of changes made to the team.
  /teams/{id}/escalation_policies/{escalation_policy_id}:
    delete:
      tags:
        - Teams
      x-pd-requires-scope: teams.write
      operationId: deleteTeamEscalationPolicy
      description: |
        Remove an escalation policy from a team.

        A team is a collection of Users and Escalation Policies that represent a group of people within an organization.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#teams)

        Scoped OAuth requires: `teams.write`
      summary: Remove an escalation policy from a team
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/team_escalation_policy_id'
      responses:
        '204':
          description: The escalation policy was removed from the team.
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Teams
      x-pd-requires-scope: teams.write
      operationId: updateTeamEscalationPolicy
      description: |
        Add an escalation policy to a team.

        A team is a collection of Users and Escalation Policies that represent a group of people within an organization.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#teams)

        Scoped OAuth requires: `teams.write`
      summary: Add an escalation policy to a team
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/team_escalation_policy_id'
      responses:
        '204':
          description: The escalation policy was added to the team.
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: Manage an escalation policy for a team.
  /teams/{id}/members:
    get:
      x-pd-requires-scope: teams.read
      tags:
        - Teams
      operationId: listTeamUsers
      description: |
        Get information about members on a team.

        A team is a collection of Users and Escalation Policies that represent a group of people within an organization.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#teams)

        Scoped OAuth requires: `teams.read`
      summary: List members of a team
      parameters:
        - $ref: '#/components/parameters/offset_limit'
        - $ref: '#/components/parameters/offset_offset'
        - $ref: '#/components/parameters/offset_total'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/include_teams_members'
      responses:
        '200':
          description: A paginated array of users within the requested team.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                  members:
                    type: array
                    uniqueItems: false
                    items:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/UserReference'
                        role:
                          type: string
              examples:
                response:
                  summary: Response Example
                  value:
                    members:
                      - user:
                          id: P0XJYI9
                          type: user_reference
                          summary: Jane Doe
                          self: https://api.pagerduty.com/users/P0XJYI9
                          html_url: https://subdomain.pagerduty.com/users/P0XJYI9
                        role: manager
                    limit: 100
                    offset: 0
                    more: false
                    total: null
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: List information about members within a team.
  /teams/{id}/notification_subscriptions:
    get:
      x-pd-requires-scope: subscribers.read
      summary: List Team Notification Subscriptions
      tags:
        - Teams
      operationId: getTeamNotificationSubscriptions
      description: |
        Retrieve a list of Notification Subscriptions the given Team has.

        <!-- theme: warning -->
        > Teams must be added through `POST /teams/{id}/notification_subscriptions` to be returned from this endpoint.

        Scoped OAuth requires: `subscribers.read`
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        subscription:
                          $ref: '#/components/schemas/NotificationSubscription'
                        subscribable_name:
                          type: string
                          nullable: true
                          description: The name of the subscribable
                required:
                  - subscriptions
              examples:
                response:
                  summary: Response Example
                  value:
                    subscriptions:
                      - subscription:
                          subscriber_id: PD1234
                          subscriber_type: team
                          subscribable_id: PD1234
                          subscribable_type: incident
                          subscribable_name: null
                          account_id: PD1234
                      - subscription:
                          subscriber_id: PD1234
                          subscriber_type: team
                          subscribable_id: PD1234
                          subscribable_type: business_service
                          subscribable_name: Online Payment
                          account_id: PD1234
                    limit: 2
                    offset: 0
                    total: 1000
                    more: true
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      x-pd-requires-scope: subscribers.write
      summary: Create Team Notification Subscriptions
      tags:
        - Teams
      operationId: createTeamNotificationSubscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationSubscriptionWithContext'
              examples:
                response:
                  summary: Response Example
                  value:
                    subscriptions:
                      - account_id: PD1234
                        subscribable_id: PD1234
                        subscribable_type: incident
                        subscriber_id: PD1234
                        subscriber_type: team
                        result: success
                      - account_id: PD1234
                        subscribable_id: PD1234
                        subscribable_type: business_service
                        subscriber_id: PD1234
                        subscriber_type: team
                        result: duplicate
                      - account_id: PD1234
                        subscribable_id: PD1235
                        subscribable_type: business_service
                        subscriber_id: PD1234
                        subscriber_type: team
                        result: unauthorized
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      description: |
        Create new Notification Subscriptions for the given Team.

        Scoped OAuth requires: `subscribers.write`
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subscribables:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/NotificationSubscribable'
              required:
                - subscribables
            examples:
              request:
                summary: Request Example
                value:
                  subscribables:
                    - subscribable_type: incident
                      subscribable_id: PD1234
                    - subscribable_type: business_service
                      subscribable_id: PD1234
                    - subscribable_type: business_service
                      subscribable_id: PD1235
        description: The entities to subscribe to.
  /teams/{id}/notification_subscriptions/unsubscribe:
    post:
      x-pd-requires-scope: subscribers.write
      tags:
        - Teams
      operationId: removeTeamNotificationSubscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_count:
                    type: number
                  unauthorized_count:
                    type: number
                  non_existent_count:
                    type: number
                required:
                  - deleted_count
                  - unauthorized_count
                  - non_existent_count
              examples:
                response:
                  summary: Response Example
                  value:
                    deleted_count: 1
                    unauthorized_count: 1
                    non_existent_count: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      description: |
        Unsubscribe the given Team from Notifications on the matching Subscribable entities.

        Scoped OAuth requires: `subscribers.write`
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subscribables:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/NotificationSubscribable'
              required:
                - subscribables
            examples:
              request:
                summary: Response Example
                value:
                  subscribables:
                    - subscribable_type: incident
                      subscribable_id: PD1234
                    - subscribable_type: business_service
                      subscribable_id: PD1234
        description: The entities to unsubscribe from.
    summary: Remove Team Notification Subscriptions
  /teams/{id}/users/{user_id}:
    delete:
      x-pd-requires-scope: teams.write
      tags:
        - Teams
      operationId: deleteTeamUser
      description: |
        Remove a user from a team.

        A team is a collection of Users and Escalation Policies that represent a group of people within an organization.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#teams)

        Scoped OAuth requires: `teams.write`
      summary: Remove a user from a team
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/team_user_id'
      responses:
        '204':
          description: The user was removed to the team.
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      x-pd-requires-scope: teams.write
      tags:
        - Teams
      operationId: updateTeamUser
      description: |
        Add a user to a team. Attempting to add a user with the `read_only_user` role will return a 400 error.

        A team is a collection of Users and Escalation Policies that represent a group of people within an organization.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#teams)

        Scoped OAuth requires: `teams.write`
      summary: Add a user to a team
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/team_user_id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: The role of the user on the team.
                  enum:
                    - observer
                    - responder
                    - manager
            examples:
              role:
                summary: Request Example
                value:
                  role: observer
        description: The role of the user on the team.
      responses:
        '204':
          description: The user was added to the team.
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: Manage team memberships.
components:
  schemas:
    Team:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        name:
          type: string
          description: The name of the team.
          maxLength: 100
        description:
          type: string
          description: The description of the team.
          maxLength: 1024
