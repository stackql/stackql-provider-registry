openapi: 3.0.2
info:
  title: PagerDuty API - Priorities
  description: Incident priorities configured on the account.
  version: 2.0.0
paths:
  /priorities:
    get:
      tags:
        - Priorities
      x-pd-requires-scope: priorities.read
      operationId: listPriorities
      description: |
        List existing priorities, in order (most to least severe).

        A priority is a label representing the importance and impact of an incident.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#priorities)

        Scoped OAuth requires: `priorities.read`
      summary: List priorities
      parameters:
        - $ref: '#/components/parameters/offset_limit'
        - $ref: '#/components/parameters/offset_offset'
        - $ref: '#/components/parameters/offset_total'
      responses:
        '200':
          description: A paginated array of priorities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                  priorities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Priority'
                required:
                  - priorities
              examples:
                response:
                  summary: Response Example
                  value:
                    priorities:
                      - id: PSLWBL8
                        type: priority
                        summary: P1
                        self: https://api.pagerduty.com/priorities/PSLWBL8
                        name: P1
                        description: Critical issue that warrants public notification and liaison with executive teams
                      - id: P53ZZH5
                        type: priority
                        summary: P2
                        self: https://api.pagerduty.com/priorities/P53ZZH5
                        name: P2
                        description: Critical system issue actively impacting many customers' ability to use the product
                      - id: PGE9YCZ
                        type: priority
                        summary: P3
                        self: https://api.pagerduty.com/priorities/PGE9YCZ
                        name: P3
                        description: Stability or minor customer-impacting issues that require immediate attention from service owners
                      - id: PVJPWYW
                        type: priority
                        summary: P4
                        self: https://api.pagerduty.com/priorities/PVJPWYW
                        name: P4
                        description: Minor issues requiring action, but not affecting customer ability to use the product
                      - id: P81SUUT
                        type: priority
                        summary: P5
                        self: https://api.pagerduty.com/priorities/P81SUUT
                        name: P5
                        description: Cosmetic issues or bugs, not affecting customer ability to use the product
                    limit: 25
                    offset: 0
                    more: false
                    total: null
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: List priorities.
components:
  schemas:
    Pagination:
      type: object
      properties:
        offset:
          type: integer
          description: Echoes offset pagination property.
          readOnly: true
        limit:
          type: integer
          description: Echoes limit pagination property.
          readOnly: true
        more:
          type: boolean
          description: Indicates if there are additional records to return
          readOnly: true
        total:
          type: integer
          description: The total number of records matching the given query.
          nullable: true
          readOnly: true
    Priority:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        name:
          type: string
          description: The user-provided short name of the priority.
        description:
          type: string
          description: The user-provided description of the priority.
    Tag:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        label:
          type: string
          description: The label of the tag.
          maxLength: 191
      required:
        - label
        - type
      example:
        type: tag
        label: Batman
