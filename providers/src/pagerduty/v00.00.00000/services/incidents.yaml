  /incidents/{id}/responder_requests/cancel:
    put:
      x-pd-requires-scope: incidents.write
      tags:
        - Incidents
      operationId: cancelIncidentResponderRequest
      description: |
        Cancel pending responder requests for the specified incident.

        This endpoint allows you to cancel responder requests for specified targets that are in a pending state. Only responders who have not yet joined or declined can be cancelled. This endpoint requires the account to have access to the [responder requests](https://support.pagerduty.com/main/docs/add-responders) feature.

        **Account Ability Requirement**: The account must have the `coordinated_responding` ability. Returns 402 Payment Required if the ability is missing. You can use the List Abilities API to check account abilities.

        **State Constraints**: Only responders in the `pending` state can be cancelled. Responders who have already `joined` or `declined` are not affected (the result will indicate their current state).

        **User vs Escalation Policy Behavior**:
        - **Users**: Direct cancellation, updates state to `user_cancelled`, stops notifications
        - **Escalation Policies**: Stops the escalation process, updates state of all pending users from that escalation policy to `user_cancelled` and stops notifications

        **Result Values**:
        - `cancelled`: Successfully cancelled
        - `joined`: User already joined (not cancelled)
        - `declined`: User already declined (not cancelled)
        - `not_found`: Target not found or not part of any responder request

        Scoped OAuth requires: `incidents.write`
      summary: Cancel responder requests for an incident
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requester_id:
                  type: string
                  description: The user id of the requester.
                responder_request_targets:
                  description: The array of targets to cancel.
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: The type of target (either a user or an escalation policy)
                        enum:
                          - user_reference
                          - escalation_policy_reference
                      id:
                        type: string
                        description: The id of the user or escalation policy
                    required:
                      - type
                      - id
              required:
                - requester_id
                - responder_request_targets
            examples:
              request:
                summary: Request Example
                value:
                  requester_id: PL1JMK5
                  responder_request_targets:
                    - type: user_reference
                      id: PJ25ZYX
                    - type: escalation_policy_reference
                      id: PEP12AB
      responses:
        '200':
          description: The result of cancelling responder requests for the given incident.
          content:
            application/json:
              schema:
                type: object
                properties:
                  responder_request_targets:
                    description: The array of targets with their cancellation results.
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The type of target (either a user or an escalation policy)
                          enum:
                            - user_reference
                            - escalation_policy_reference
                        id:
                          type: string
                          description: The id of the user or escalation policy
                        result:
                          type: string
                          description: The result of the cancellation attempt
                          enum:
                            - cancelled
                            - joined
                            - declined
                            - not_found
                      required:
                        - type
                        - id
                        - result
                required:
                  - responder_request_targets
              examples:
                all_cancelled:
                  summary: All Targets Cancelled
                  value:
                    responder_request_targets:
                      - type: user_reference
                        id: PJ25ZYX
                        result: cancelled
                      - type: escalation_policy_reference
                        id: PEP12AB
                        result: cancelled
                mixed_results:
                  summary: Mixed Results
                  value:
                    responder_request_targets:
                      - type: user_reference
                        id: PJ25ZYX
                        result: cancelled
                      - type: user_reference
                        id: PL7A2O4
                        result: joined
                      - type: user_reference
                        id: PABC123
                        result: not_found
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: Cancel responder requests for an incident.
