    put:
      x-pd-requires-scope: incidents.write
      x-pd-operation-limit: true
      tags:
        - Incidents
      operationId: updateIncidents
      description: |
        Acknowledge, resolve, escalate or reassign one or more incidents.

        An incident represents a problem or an issue that needs to be addressed and resolved.

        A maximum of 250 incidents may be updated at a time. If more than this number of incidents are given, the API will respond with status 413 (Request Entity Too Large).

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#incidents)

        Scoped OAuth requires: `incidents.write`

        This API operation has operation specific rate limits. See the [Rate Limits](https://developer.pagerduty.com/docs/72d3b724589e3-rest-api-rate-limits) page for more information.
      summary: Manage incidents
      parameters:
        - $ref: '#/components/parameters/offset_limit'
        - $ref: '#/components/parameters/offset_offset'
        - $ref: '#/components/parameters/offset_total'
        - $ref: '#/components/parameters/from_header'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                incidents:
                  type: array
                  description: An array of incidents, including the parameters to update.
                  items:
                    properties:
                      id:
                        type: string
                        description: The id of the incident to update.
                      type:
                        type: string
                        description: The incident type.
                        enum:
                          - incident
                          - incident_reference
                      status:
                        type: string
                        description: The new status of the incident. If the incident is currently resolved, setting the status to "triggered" or "acknowledged" will reopen it. When reopening an incident to the "triggered" status, it will be assigned based on the assignees or escalation_policy fields in the request, otherwise it will be assigned to the current Escalation Policy. When reopening an incident to the "acknowledged" status, it will be assigned to the current user.
                        enum:
                          - resolved
                          - acknowledged
                          - triggered
                      resolution:
                        type: string
                        description: |
                          The resolution for this incident. This field is used only when setting the incident status to resolved.
                          The value provided here is added to the incident’s 'Resolve' log entry as a note and will not be displayed directly in the UI.
                      title:
                        type: string
                        description: A succinct description of the nature, symptoms, cause, or effect of the incident.
                      priority:
                        description: The priority of the incident. Can be provided as a priority object or a string matching a priority name. If a string is provided, the highest priority with a matching name will be used.
                        oneOf:
                          - type: object
                            properties:
                              id:
                                type: string
                                description: The ID of the priority.
                              name:
                                type: string
                                description: The user-provided short name of the priority.
                              type:
                                type: string
                                description: The type of the reference.
                                enum:
                                  - priority
                                  - priority_reference
                            required:
                              - id
                              - type
                          - type: string
                            description: A string matching the name of a priority. If provided, the highest priority with a matching name will be used.
                      escalation_level:
                        type: integer
                        description: Escalate the incident to this level in the escalation policy.
                      assignments:
                        type: array
                        description: Assign the incident to these assignees.
                        items:
                          properties:
                            assignee:
                              $ref: '#/components/schemas/UserReference'
                          type: object
                      incident_type:
                        $ref: '#/components/schemas/IncidentTypeReference'
                      escalation_policy:
                        $ref: '#/components/schemas/EscalationPolicyReference'
                      urgency:
                        type: string
                        description: The urgency of the incident.
                        enum:
                          - high
                          - low
                      conference_bridge:
                        $ref: '#/components/schemas/ConferenceBridge'
                    required:
                      - id
                      - type
                    type: object
              required:
                - incidents
            examples:
              incidents:
                summary: Request Example
                value:
                  incidents:
                    - id: PT4KHLK
                      type: incident_reference
                      status: acknowledged
                    - id: PQMF62U
                      type: incident_reference
                      priority:
                        id: P53ZZH5
                        type: priority_reference
                    - id: PPVZH9X
                      type: incident_reference
                      status: resolved
                    - id: P8JOGX7
                      type: incident_reference
                      assignments:
                        - assignee:
                            id: PXPGF42
                            type: user_reference
                    - id: PYJ9K7I
                      type: incident_reference
                      incident_type:
                        name: major_incident
      responses:
        '200':
          description: All of the updates succeeded.
          content:
            application/json:
