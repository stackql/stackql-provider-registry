openapi: 3.0.2
info:
  title: PagerDuty API - Incident Types
  description: Incident types and their custom fields.
  version: 2.0.0
paths:
  /incidents/types:
    get:
      x-pd-requires-scope: incident_types.read
      tags:
        - Incident Types
      operationId: listIncidentTypes
      description: |
        List the available incident types

        Incident Types are a feature which will allow customers to categorize incidents, such as a security incident, a major incident, or a fraud incident.
        These can be filtered by enabled or disabled types.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#incidentType)

        Scoped OAuth requires: `incident_types.read`
      summary: List incident types
      parameters:
        - $ref: '#/components/parameters/incident_type_list_filter'
      responses:
        '200':
          description: An array of all types for the account. The default incident type will automatically return on this list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncidentType'
                required:
                  - incident_types
              examples:
                response:
                  summary: Response Example
                  value:
                    incident_types:
                      - type: incident_type
                        name: incident_default
                        id: P123456
                        created_at: '2023-05-31T13:40:47.000Z'
                        updated_at: '2023-07-31T13:40:47.000Z'
                        description: null
                        display_name: Base Incident
                        enabled: true
                        parent: null
                      - type: incident_type
                        name: security
                        id: P567890
                        created_at: '2023-05-31T13:41:47.000Z'
                        updated_at: '2023-07-31T13:40:47.000Z'
                        description: Security related incidents
                        display_name: Security
                        enabled: true
                        parent:
                          id: P123456
                          type: incident_type_reference
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      x-pd-requires-scope: incident_types.write
      tags:
        - Incident Types
      operationId: createIncidentType
      description: |
        Create a new incident type.

        Incident Types are a feature which will allow customers to categorize incidents, such as a security incident, a major incident, or a fraud incident.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#incidentType)

        Scoped OAuth requires: `incident_types.write`
      summary: Create an Incident Type
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                incident_type:
                  type: object
                  description: Details of the incident type to be created.
                  properties:
                    name:
                      type: string
                      description: The name of the Incident Type. Usage of the suffix `_default` is prohibited. This cannot be changed once the incident type has been created.
                      maxLength: 50
                    display_name:
                      type: string
                      description: The display name of the Incident Type. Usage of the prefix `PD`, `PagerDuty`, `Default` is prohibited.
                      maxLength: 50
                    parent_type:
                      type: string
                      description: The parent type of the Incident Type. Either name or id of the parent type can be used.
                    enabled:
                      type: boolean
                      description: Whether the Incident Type is enabled. Defaults to true if not provided.
                    description:
                      type: string
                      description: The description of the Incident Type.
                      maxLength: 1000
                  required:
                    - name
                    - display_name
                    - parent_type
              required:
                - incident_type
            examples:
              request:
                summary: Request Example
                value:
                  incident_type:
                    name: fraud_incident
                    display_name: Fraud Incident
                    parent_type: incident_default
      responses:
        '201':
          description: The incident type object created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident_type:
                    $ref: '#/components/schemas/IncidentType'
                required:
                  - incident_type
              examples:
                response:
                  summary: Response Example
                  value:
                    incident_type:
                      enabled: true
                      id: P234567
                      name: fraud_incident
                      parent:
                        id: P123456
                        type: incident_type_reference
                      type: incident_type
                      description: null
                      created_at: '2023-05-31T13:41:47Z'
                      updated_at: '2023-07-31T13:41:47Z'
                      display_name: Fraud Incident
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List and create incident types.
  /incidents/types/{type_id_or_name}:
    get:
      x-pd-requires-scope: incident_types.read
      tags:
        - Incident Types
      operationId: getIncidentType
      description: |
        Get detailed information about a single incident type. Accepts either an incident type id, or an incident type name.

        Incident Types are a feature which will allow customers to categorize incidents, such as a security incident, a major incident, or a fraud incident.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#incident)

        Scoped OAuth requires: `incident_types.read`
      summary: Get an Incident Type
      parameters:
        - $ref: '#/components/parameters/incident_type_id_or_name'
      responses:
        '200':
          description: The incident type requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident_type:
                    $ref: '#/components/schemas/IncidentType'
                required:
                  - incident_type
              examples:
                response:
                  summary: Response Example
                  value:
                    incident_type:
                      enabled: true
                      id: P567890
                      parent:
                        id: P123456
                        type: incident_type_reference
                      name: major_incident
                      type: incident_type
                      description: Major incidents
                      created_at: '2023-05-31T13:41:47Z'
                      updated_at: '2023-07-31T13:41:47Z'
                      display_name: Major Incident
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      x-pd-requires-scope: incident_types.write
      tags:
        - Incident Types
      operationId: updateIncidentType
      description: |
        Update an Incident Type.

        Incident Types are a feature which will allow customers to categorize incidents, such as a security incident, a major incident, or a fraud incident.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#incident)

        Scoped OAuth requires: `incident_types.write`
      summary: Update an Incident Type
      parameters:
        - $ref: '#/components/parameters/incident_type_id_or_name'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                incident_type:
                  type: object
                  description: Details of the incident type to be created.
                  properties:
                    display_name:
                      type: string
                      description: The display name of the Incident Type.
                      maxLength: 50
                    enabled:
                      type: boolean
                      description: Whether the Incident Type is enabled. Defaults to true if not provided.
                    description:
                      type: string
                      description: The description of the Incident Type.
                      maxLength: 1000
              required:
                - incident_type
            examples:
              request:
                summary: Request Example
                value:
                  incident_type:
                    display_name: Major Incident
      responses:
        '200':
          description: The incident type object updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident_type:
                    $ref: '#/components/schemas/IncidentType'
                required:
                  - incident_type
              examples:
                response:
                  summary: Response Example
                  value:
                    incident_type:
                      name: major_incident
                      id: P567890
                      created_at: '2023-05-31T13:41:47Z'
                      updated_at: '2023-07-31T13:41:47Z'
                      description: Major incidents
                      display_name: Major Incident
                      enabled: true
                      parent:
                        id: P123456
                        type: incident_type_reference
                      type: incident_type
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List and update incident types.
  /incidents/types/{type_id_or_name}/custom_fields:
    get:
      x-pd-requires-scope: custom_fields.read
      tags:
        - Incident Types
      operationId: listIncidentTypeCustomFields
      description: |
        List the custom fields for an incident type.

        Custom Fields (CF) are a feature which will allow customers to extend Incidents with their own custom data,
        to provide additional context and support features such as customized filtering, search and analytics.
        Custom Fields can be applied to different incident types.

        Scoped OAuth requires: `custom_fields.read`
      summary: List Incident Type Custom Fields
      parameters:
        - $ref: '#/components/parameters/incident_type_id_or_name'
        - $ref: '#/components/parameters/include_customfields_field'
      responses:
        '200':
          description: The custom fields for the incident type requested. Passing in include[]=field_options will return the field options for the custom field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncidentTypeCustomFieldWithOptions'
                required:
                  - fields
              examples:
                simple_example:
                  summary: Response Example - No query parameters
                  value:
                    fields:
                      - enabled: true
                        id: P567890
                        name: incident_commander
                        type: field
                        self: https://api.pagerduty.com/incidents/types/P123456/custom_fields/P567890
                        description: field description
                        field_type: single_value_fixed
                        data_type: string
                        created_at: '2023-05-31T13:41:47Z'
                        updated_at: '2023-07-31T13:41:47Z'
                        display_name: Incident Commander
                        default_value: John Doe
                        incident_type: Security Incident
                        summary: incident_commander
                      - enabled: true
                        id: P456789
                        name: due_date
                        type: field
                        self: https://api.pagerduty.com/incidents/types/P123456/custom_fields/P456789
                        description: field description
                        field_type: single_value
                        data_type: string
                        created_at: '2024-05-31T13:41:47Z'
                        updated_at: '2024-07-31T13:41:47Z'
                        display_name: Due Date
                        default_value: '2025-07-31T13:41:47Z'
                        incident_type: Security Incident 2
                        summary: due_date
                example_with_field_options:
                  summary: Response Example - Include field options
                  value:
                    fields:
                      - enabled: true
                        id: P567890
                        name: incident_commander
                        type: field
                        self: https://api.pagerduty.com/incidents/types/P123456/custom_fields/P567890
                        description: field description
                        field_type: single_value_fixed
                        data_type: string
                        created_at: '2023-05-31T13:41:47Z'
                        updated_at: '2023-07-31T13:41:47Z'
                        display_name: Incident Commander
                        default_value: John Doe
                        incident_type: Security Incident
                        summary: incident_commander
                        field_options:
                          - id: PT4KHEE
                            type: field_option
                            data:
                              data_type: string
                              value: John Doe
                            created_at: '2021-06-01T21:30:42Z'
                            updated_at: '2021-06-01T21:30:42Z'
                          - id: P5IYCNZ
                            type: field_option
                            data:
                              data_type: string
                              value: Jane Smith
                            created_at: '2021-06-01T21:30:42Z'
                            updated_at: '2021-06-01T21:30:42Z'
                      - enabled: true
                        id: P456789
                        name: due_date
                        type: field
                        self: https://api.pagerduty.com/incidents/types/P123456/custom_fields/P456789
                        description: field description
                        field_type: single_value
                        data_type: string
                        created_at: '2024-05-31T13:41:47Z'
                        updated_at: '2024-07-31T13:41:47Z'
                        display_name: Due Date
                        default_value: '2025-07-31T13:41:47Z'
                        incident_type: Security Incident 2
                        summary: due_date
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      x-pd-requires-scope: custom_fields.write
      tags:
        - Incident Types
      operationId: createIncidentTypeCustomField
      description: |
        Create a Custom Field for an Incident Type

        Custom Fields (CF) are a feature which will allow customers to extend Incidents with their own custom data,
        to provide additional context and support features such as customized filtering, search and analytics.
        Custom Fields can be applied to different incident types.

        Scoped OAuth requires: `custom_fields.write`
      summary: Create a Custom Field for an Incident Type
      parameters:
        - $ref: '#/components/parameters/incident_type_id_or_name'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                field:
                  type: object
                  description: Details of the custom field to be created.
                  properties:
                    name:
                      type: string
                      description: The name of the custom field.
                      maxLength: 50
                    display_name:
                      type: string
                      description: The display name of the Incident Type.
                      maxLength: 50
                    data_type:
                      type: string
                      description: The data type of the custom field.
                    field_type:
                      type: string
                      description: The field type of the custom field.
                      enum:
                        - single_value
                        - single_value_fixed
                        - multi_value
                        - multi_value_fixed
                    description:
                      type: string
                      description: The description of the custom field.
                      maxLength: 1000
                    enabled:
                      type: boolean
                      description: Whether the custom field is enabled.
                    default_value:
                      type: string
                      description: The default value of the custom field.
                    field_options:
                      type: array
                      items:
                        $ref: '#/components/schemas/CustomFieldsFieldOption'
                      description: The options for the custom field. Can only be applied to fields with a `field_type` of `single_value_fixed` or `multi_value_fixed`. When creating a fixed-value custom field, this property is required, as the field must be created with at least one field option.
                  required:
                    - name
                    - display_name
                    - data_type
                    - field_type
              required:
                - field
            examples:
              simple_example:
                summary: Request Example
                value:
                  field:
                    name: custom_field_1
                    display_name: Custom Field 1
                    data_type: string
                    field_type: single_value
              example_with_fixed_value_field:
                summary: Example with Fixed Value Field
                value:
                  field:
                    name: development_environment
                    display_name: Development Environment
                    description: The environment that the issue occurred in
                    data_type: string
                    field_type: single_value_fixed
                    field_options:
                      - data:
                          data_type: string
                          value: staging
                      - data:
                          data_type: string
                          value: production
      responses:
        '201':
          description: The custom field object created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    $ref: '#/components/schemas/IncidentTypeCustomFields'
                required:
                  - field
              examples:
                simple_example:
                  summary: Response Example
                  value:
                    field:
                      enabled: true
                      id: P123456
                      name: custom_field_1
                      type: field
                      self: https://api.pagerduty.com/incidents/types/P567890/custom_fields/P123456
                      description: null
                      field_type: single_value
                      data_type: string
                      updated_at: '2021-06-01T21:30:42Z'
                      created_at: '2021-06-01T21:30:42Z'
                      display_name: Custom Field 1
                      default_value: null
                      incident_type: P567890
                      summary: custom_field_1
                fixed_value_example:
                  summary: Example for Fixed-Value Field
                  value:
                    field:
                      enabled: true
                      id: P4567
                      name: development_environment
                      type: field
                      self: https://api.pagerduty.com/incidents/types/P567890/custom_fields/P4567
                      description: The environment that the issue occurred in
                      field_type: single_value_fixed
                      data_type: string
                      updated_at: '2021-06-01T21:30:43Z'
                      created_at: '2021-06-01T21:30:43Z'
                      display_name: Development Environment
                      default_value: null
                      incident_type: P567890
                      summary: development_environment
                      field_options:
                        - id: PT4KHEE
                          type: field_option
                          data:
                            data_type: string
                            value: staging
                          created_at: '2021-06-01T21:30:43Z'
                          updated_at: '2021-06-01T21:30:43Z'
                        - id: P5IYCNZ
                          type: field_option
                          data:
                            data_type: string
                            value: production
                          created_at: '2021-06-01T21:30:42Z'
                          updated_at: '2021-06-01T21:30:42Z'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List and update the custom fields for an incident type.
  /incidents/types/{type_id_or_name}/custom_fields/{field_id}:
    get:
      x-pd-requires-scope: custom_fields.read
      tags:
        - Incident Types
      operationId: getIncidentTypeCustomField
      description: |
        Get a custom field for an incident type.

        Custom Fields (CF) are a feature which will allow customers to extend Incidents with their own custom data,
        to provide additional context and support features such as customized filtering, search and analytics.
        Custom Fields can be applied to different incident types.

        Scoped OAuth requires: `custom_fields.read`
      summary: Get an Incident Type Custom Field
      parameters:
        - $ref: '#/components/parameters/incident_type_id_or_name'
        - $ref: '#/components/parameters/field_id'
        - $ref: '#/components/parameters/include_customfields_field'
      responses:
        '200':
          description: The incident type custom field requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    $ref: '#/components/schemas/IncidentTypeCustomFieldWithOptions'
                required:
                  - field
              examples:
                simple_example:
                  summary: Response Example - No query parameter
                  value:
                    field:
                      enabled: true
                      id: P123456
                      name: environment
                      type: field
                      self: https://api.pagerduty.com/incidents/types/P567890/custom_fields/P123456
                      description: The environment that the issue occurred in
                      field_type: single_value_fixed
                      data_type: string
                      updated_at: '2021-06-01T21:30:42Z'
                      created_at: '2021-06-01T21:30:42Z'
                      display_name: Environment
                      default_value: null
                      incident_type: P567890
                      summary: environment
                example_with_field_options:
                  summary: Response Example - Include field options
                  value:
                    field:
                      enabled: true
                      id: P123456
                      name: environment
                      type: field
                      self: https://api.pagerduty.com/incidents/types/P567890/custom_fields/P123456
                      description: The environment that the issue occurred in
                      field_type: single_value_fixed
                      data_type: string
                      updated_at: '2021-06-01T21:30:42Z'
                      created_at: '2021-06-01T21:30:42Z'
                      display_name: Environment
                      default_value: null
                      incident_type: P567890
                      summary: environment
                      field_options:
                        - id: PT4KHEE
                          type: field_option
                          data:
                            data_type: string
                            value: production
                          created_at: '2021-06-01T21:30:42Z'
                          updated_at: '2021-06-01T21:30:42Z'
                        - id: P5IYCNZ
                          type: field_option
                          data:
                            data_type: string
                            value: staging
                          created_at: '2021-06-01T21:30:42Z'
                          updated_at: '2021-06-01T21:30:42Z'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      x-pd-requires-scope: custom_fields.write
      tags:
        - Incident Types
      operationId: updateIncidentTypeCustomField
      description: |
        Update a custom field for an incident type. Field Options can also be updated within the same call.

        Custom Fields (CF) are a feature which will allow customers to extend Incidents with their own custom data,
        to provide additional context and support features such as customized filtering, search and analytics.
        Custom Fields can be applied to different incident types.

        Scoped OAuth requires: `custom_fields.write`
      summary: Update a Custom Field for an Incident Type
      parameters:
        - $ref: '#/components/parameters/incident_type_id_or_name'
        - $ref: '#/components/parameters/field_id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                field:
                  type: object
                  description: Details of the custom field to be updated.
                  properties:
                    display_name:
                      type: string
                      description: The display name of the Incident Type.
                      maxLength: 50
                    enabled:
                      type: boolean
                      description: Whether the Incident Type is enabled.
                    default_value:
                      type: string
                      description: The default value of the custom field.
                    description:
                      type: string
                      description: The description of the custom field.
                      maxLength: 1000
                    field_options:
                      type: array
                      items:
                        $ref: '#/components/schemas/CustomFieldsFieldOption'
                      description: List of options to upsert on the custom field. Can only be applied to fields with a `field_type` of `single_value_fixed` or `multi_value_fixed`. When an `id` property is included, this will update the value of the specified field option. Without an `id` property, that field option will be added to the field. Any existing field options not included in the upsert list will be deleted (unless the current default value refers to a field option to be deleted).
              required:
                - field
            examples:
              basic_example:
                summary: Request Example
                value:
                  field:
                    display_name: Custom Field 1
              example_with_field_options_upsert:
                summary: Example Updating a Field Option Together With Field Metadata
                value:
                  field:
                    display_name: Single Select Field Updated
                    field_options:
                      - data:
                          data_type: string
                          value: Updated value for an existing field option
                        id: PQ9K7I8
                      - data:
                          data_type: string
                          value: Upserting a brand new field option, by not providing an id property
      responses:
        '200':
          description: The updated custom field object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    $ref: '#/components/schemas/IncidentTypeCustomFieldWithOptions'
                required:
                  - field
              examples:
                response:
                  summary: Response Example
                  value:
                    field:
                      enabled: true
                      id: P123456
                      name: custom_field_1
                      type: field
                      self: https://api.pagerduty.com/incidents/types/P567890/custom_fields/P123456
                      description: The environment that the issue occurred in
                      field_type: single_value_fixed
                      data_type: string
                      updated_at: '2021-06-01T21:30:42Z'
                      created_at: '2021-06-01T21:30:42Z'
                      display_name: Custom Field 1
                      default_value: null
                      incident_type: P567890
                      summary: custom_field_1
                      field_options:
                        - id: PT4KHEE
                          type: field_option
                          data:
                            data_type: string
