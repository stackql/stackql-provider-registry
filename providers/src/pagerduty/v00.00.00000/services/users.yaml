openapi: 3.0.2
info:
  title: PagerDuty API - Users
  description: Users and their contact methods, notification rules, subscriptions, sessions, licenses and OAuth delegations.
  version: 2.0.0
paths:
  /users:
    get:
      x-pd-requires-scope: users.read
      tags:
        - Users
      operationId: listUsers
      description: |
        List users of your PagerDuty account, optionally filtered by a search query.

        Users are members of a PagerDuty account that have the ability to interact with Incidents and other data on the account.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#users)

        Scoped OAuth requires: `users.read`
      summary: List users
      parameters:
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/team_ids'
        - $ref: '#/components/parameters/offset_limit'
        - $ref: '#/components/parameters/offset_offset'
        - $ref: '#/components/parameters/offset_total'
        - $ref: '#/components/parameters/include_user'
      responses:
        '200':
          description: A paginated array of users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                required:
                  - users
              examples:
                response:
                  summary: Response Example
                  value:
                    users:
                      - id: PXPGF42
                        type: user
                        summary: Earline Greenholt
                        self: https://api.pagerduty.com/users/PXPGF42
                        html_url: https://subdomain.pagerduty.com/users/PXPGF42
                        name: Earline Greenholt
                        email: 125.greenholt.earline@graham.name
                        time_zone: America/Lima
                        color: green
                        role: admin
                        avatar_url: https://pd-static-assets.pagerduty.com/users/blank-avatar.png
                        description: I'm the boss
                        invitation_sent: false
                        created_via_sso: true
                        contact_methods:
                          - id: PTDVERC
                            type: email_contact_method_reference
                            summary: Default
                            self: https://api.pagerduty.com/users/PXPGF42/contact_methods/PTDVERC
                        notification_rules:
                          - id: P8GRWKK
                            type: assignment_notification_rule_reference
                            summary: Default
                            self: https://api.pagerduty.com/users/PXPGF42/notification_rules/P8GRWKK
                            html_url: null
                        job_title: Director of Engineering
                        teams:
                          - id: PQ9K7I8
                            type: team_reference
                            summary: Engineering
                            self: https://api.pagerduty.com/teams/PQ9K7I8
                            html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                      - id: PAM4FGS
                        type: user
                        summary: Kyler Kuhn
                        self: https://api.pagerduty.com/users/PAM4FGS
                        html_url: https://subdomain.pagerduty.com/users/PAM4FGS
                        name: Kyler Kuhn
                        email: 126_dvm_kyler_kuhn@beahan.name
                        time_zone: Asia/Hong_Kong
                        color: red
                        role: admin
                        avatar_url: https://pd-static-assets.pagerduty.com/users/blank-avatar.png
                        description: Actually, I am the boss
                        invitation_sent: false
                        created_via_sso: false
                        contact_methods:
                          - id: PVMGSML
                            type: email_contact_method_reference
                            summary: Work
                            self: https://api.pagerduty.com/users/PAM4FGS/contact_methods/PVMGSMLL
                        notification_rules:
                          - id: P8GRWKK
                            type: assignment_notification_rule_reference
                            summary: Default
                            self: https://api.pagerduty.com/users/PXPGF42/notification_rules/P8GRWKK
                            html_url: null
                        job_title: Senior Engineer
                        teams:
                          - id: PQ9K7I8
                            type: team_reference
                            summary: Engineering
                            self: https://api.pagerduty.com/teams/PQ9K7I8
                            html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                    limit: 25
                    offset: 0
                    more: false
                    total: null
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      x-pd-requires-scope: users.write
      tags:
        - Users
      operationId: createUser
      description: |
        Create a new user.

        Users are members of a PagerDuty account that have the ability to interact with Incidents and other data on the account.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#users)

        Scoped OAuth requires: `users.write`
      summary: Create a user
      parameters:
        - $ref: '#/components/parameters/from_header'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id:
                      type: string
                      readOnly: true
                    summary:
                      type: string
                      nullable: true
                      readOnly: true
                      description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
                    type:
                      type: string
                      readOnly: true
                      description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
                    self:
                      type: string
                      nullable: true
                      readOnly: true
                      format: url
                      description: the API show URL at which the object is accessible
                    html_url:
                      type: string
                      nullable: true
                      readOnly: true
                      format: url
                      description: a URL at which the entity is uniquely displayed in the Web app
                    name:
                      type: string
                      description: The name of the user.
                      maxLength: 100
                    email:
                      type: string
                      format: email
                      description: The user's email address.
                      minLength: 6
                      maxLength: 100
                    time_zone:
                      type: string
                      format: tzinfo
                      description: The preferred time zone name. If null, the account's time zone will be used.
                    color:
                      type: string
                      description: The schedule color.
                    role:
                      description: The user role. Account must have the `read_only_users` ability to set a user as a `read_only_user` or a `read_only_limited_user`, and must have advanced permissions abilities to set a user as `observer` or `restricted_access`.
                      type: string
                      enum:
                        - admin
                        - limited_user
                        - observer
                        - owner
                        - read_only_user
                        - restricted_access
                        - read_only_limited_user
                        - user
                    avatar_url:
                      type: string
                      format: url
                      description: The URL of the user's avatar.
                      readOnly: true
                    description:
                      type: string
                      description: The user's bio.
                      nullable: true
                    invitation_sent:
                      type: boolean
                      readOnly: true
                      description: If true, the user has an outstanding invitation.
                    job_title:
                      type: string
                      description: The user's title.
                      maxLength: 100
                    created_via_sso:
                      type: boolean
                      readOnly: true
                      description: If true, the user was created via Single Sign-On (SSO).
                    teams:
                      type: array
                      readOnly: true
                      description: The list of teams to which the user belongs. Account must have the `teams` ability to set this.
                      items:
                        $ref: '#/components/schemas/TeamReference'
                    contact_methods:
                      type: array
                      readOnly: true
                      description: The list of contact methods for the user.
                      items:
                        $ref: '#/components/schemas/ContactMethodReference'
                    notification_rules:
                      readOnly: true
                      type: array
                      description: The list of notification rules for the user.
                      items:
                        $ref: '#/components/schemas/NotificationRuleReference'
                    http_cal_url:
                      type: string
                      format: uri
                      readOnly: true
                      description: |-
                        iCal HTTP feed URL for this user's on-call shifts. Only returned on the `GET /users/{id}` detail endpoint: automatically when viewing your own profile with a user-level token, or when an account admin with `can_update_user` passes `include[]=calendar_urls` for another user. Not returned on list endpoints or with account-level read-only keys.

                        **Security:** this URL is a bearer credential. Anyone with the URL can read the user's on-call calendar without further authentication. Rotate via `POST /users/{id}/regenerate_private_url_key` if it may have been exposed.
                    web_cal_url:
                      type: string
                      format: uri
                      readOnly: true
                      description: |-
                        iCal webcal URL for this user's on-call shifts. Only returned on the `GET /users/{id}` detail endpoint: automatically when viewing your own profile with a user-level token, or when an account admin with `can_update_user` passes `include[]=calendar_urls` for another user. Not returned on list endpoints or with account-level read-only keys.

                        **Security:** this URL is a bearer credential. Anyone with the URL can read the user's on-call calendar without further authentication. Rotate via `POST /users/{id}/regenerate_private_url_key` if it may have been exposed.
                    license:
                      description: The License assigned to the User
                      type: object
                      properties:
                        id:
                          type: string
                          readOnly: true
                        summary:
                          type: string
                          nullable: true
                          readOnly: true
                          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
                        type:
                          type: string
                          readOnly: true
                          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
                        self:
                          type: string
                          nullable: true
                          readOnly: true
                          format: url
                          description: the API show URL at which the object is accessible
                        html_url:
                          type: string
                          nullable: true
                          readOnly: true
                          format: url
                          description: a URL at which the entity is uniquely displayed in the Web app
                      required:
                        - type
                        - id
                  required:
                    - name
                    - email
                    - type
                  example:
                    type: user
                    name: Earline Greenholt
                    email: 125.greenholt.earline@graham.name
                    time_zone: America/Lima
                    color: green
                    role: admin
                    job_title: Director of Engineering
                    created_via_sso: false
                    avatar_url: https://pd-static-assets.pagerduty.com/users/blank-avatar.png
                    description: I'm the boss
              required:
                - user
            examples:
              request:
                summary: Request Example
                value:
                  user:
                    type: user
                    name: Earline Greenholt
                    email: 125.greenholt.earline@graham.name
                    time_zone: America/Lima
                    color: green
                    role: admin
                    job_title: Director of Engineering
                    avatar_url: https://pd-static-assets.pagerduty.com/users/blank-avatar.png
                    description: I'm the boss
                    license:
                      id: PTDVERC
                      type: license_reference
        description: The user to be created.
      responses:
        '201':
          description: The user that was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required:
                  - user
              examples:
                response:
                  summary: Response Example
                  value:
                    user:
                      id: PXPGF42
                      type: user
                      summary: Earline Greenholt
                      self: https://api.pagerduty.com/users/PXPGF42
                      html_url: https://subdomain.pagerduty.com/users/PXPGF42
                      name: Earline Greenholt
                      email: 125.greenholt.earline@graham.name
                      time_zone: America/Lima
                      color: green
                      role: admin
                      avatar_url: https://pd-static-assets.pagerduty.com/users/blank-avatar.png
                      description: I'm the boss
                      invitation_sent: false
                      created_via_sso: true
                      contact_methods:
                        - id: PTDVERC
                          type: email_contact_method_reference
                          summary: Default
                          self: https://api.pagerduty.com/users/PXPGF42/contact_methods/PTDVERC
                      notification_rules:
                        - id: P8GRWKK
                          type: assignment_notification_rule_reference
                          summary: Default
                          self: https://api.pagerduty.com/users/PXPGF42/notification_rules/P8GRWKK
                          html_url: null
                      job_title: Director of Engineering
                      teams:
                        - id: PQ9K7I8
                          type: team_reference
                          summary: Engineering
                          self: https://api.pagerduty.com/teams/PQ9K7I8
                          html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
