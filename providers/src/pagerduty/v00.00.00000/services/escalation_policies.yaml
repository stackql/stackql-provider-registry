openapi: 3.0.2
info:
  title: PagerDuty API - Escalation Policies
  description: Escalation policies determine who is notified and when for incidents on a service.
  version: 2.0.0
paths:
  /escalation_policies:
    get:
      tags:
        - Escalation Policies
      x-pd-requires-scope: escalation_policies.read
      operationId: listEscalationPolicies
      description: |
        List all of the existing escalation policies.

        Escalation policies define which user should be alerted at which time.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#escalation-policies)

        Scoped OAuth requires: `escalation_policies.read`
      summary: List escalation policies
      parameters:
        - $ref: '#/components/parameters/offset_limit'
        - $ref: '#/components/parameters/offset_offset'
        - $ref: '#/components/parameters/offset_total'
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/user_ids_escalation_policies'
        - $ref: '#/components/parameters/team_ids'
        - $ref: '#/components/parameters/include_escalation_policy'
        - $ref: '#/components/parameters/sort_by_escalation_policy'
      responses:
        '200':
          description: A paginated array of escalation policy objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                  escalation_policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/EscalationPolicy'
                required:
                  - escalation_policies
              examples:
                response:
                  summary: Response Example
                  value:
                    escalation_policies:
                      - id: PANZZEQ
                        type: escalation_policy
                        summary: Engineering Escalation Policy
                        on_call_handoff_notifications: if_has_services
                        self: https://api.pagerduty.com/escalation_policies/PANZZEQ
                        html_url: https://subdomain.pagerduty.com/escalation_policies/PANZZEQ
                        name: Engineering Escalation Policy
                        escalation_rules:
                          - id: PANZZEQ
                            escalation_delay_in_minutes: 30
                            targets:
                              - id: PEYSGVF
                                summary: PagerDuty Admin
                                type: user_reference
                                self: https://api.pagerduty.com/users/PEYSGVF
                                html_url: https://subdomain.pagerduty.com/users/PEYSGVF
                              - id: PI7DH85
                                summary: Daily Engineering Rotation
                                type: schedule_reference
                                self: https://api.pagerduty.com/schedules/PI7DH85
                                html_url: https://subdomain.pagerduty.com/schedules/PI7DH85
                        services:
                          - id: PIJ90N7
                            type: service_reference
                            summary: My Mail Service
                            self: https://api.pagerduty.com/services/PIJ90N7
                            html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
                        num_loops: 0
                        teams:
                          - id: PQ9K7I8
                            type: team_reference
                            summary: Engineering
                            self: https://api.pagerduty.com/teams/PQ9K7I8
                            html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                    limit: 25
                    offset: 0
                    more: false
                    total: null
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Escalation Policies
      x-pd-requires-scope: escalation_policies.write
      operationId: createEscalationPolicy
      description: |
        Creates a new escalation policy. At least one escalation rule must be provided.

        Escalation policies define which user should be alerted at which time.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#escalation-policies)

        Scoped OAuth requires: `escalation_policies.write`
      summary: Create an escalation policy
      parameters:
        - $ref: '#/components/parameters/optional_from_header'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                escalation_policy:
                  $ref: '#/components/schemas/EscalationPolicy'
              required:
                - escalation_policy
            examples:
              request:
                summary: Request Example
                value:
                  escalation_policy:
                    type: escalation_policy
                    name: Engineering Escalation Policy
                    escalation_rules:
                      - escalation_delay_in_minutes: 30
                        targets:
                          - id: PEYSGVF
                            type: user_reference
                        escalation_rule_assignment_strategy:
                          type: round_robin
                    services:
                      - id: PIJ90N7
                        type: service_reference
                    num_loops: 2
                    on_call_handoff_notifications: if_has_services
                    teams:
                      - id: PQ9K7I8
                        type: team_reference
                    description: Here is the ep for the engineering team.
        description: The escalation policy to be created.
      responses:
        '201':
          description: The escalation policy that was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  escalation_policy:
                    $ref: '#/components/schemas/EscalationPolicy'
                required:
                  - escalation_policy
              examples:
                response:
                  summary: Response Example
                  value:
                    escalation_policy:
                      id: PT20YPA
                      type: escalation_policy
                      summary: Engineering Escalation Policy
                      on_call_handoff_notifications: if_has_services
                      self: https://api.pagerduty.com/escalation_policies/PT20YPA
                      html_url: https://subdomain.pagerduty.com/escalation_policies/PT20YPA
                      name: Engineering Escalation Policy
                      escalation_rules:
                        - id: PT20YPA
                          escalation_delay_in_minutes: 22
                          targets:
                            - id: PXPGF42
                              summary: Earline Greenholt
                              type: user_reference
                              self: https://api.pagerduty.com/users/PXPGF42
                              html_url: https://subdomain.pagerduty.com/users/PXPGF42
                            - id: PI7DH85
                              summary: Daily Engineering Rotation
                              type: schedule_reference
                              self: https://api.pagerduty.com/schedules/PI7DH85
                              html_url: https://subdomain.pagerduty.com/schedules/PI7DH85
                      services:
                        - id: PIJ90N7
                          type: service_reference
                          summary: My Mail Service
                          self: https://api.pagerduty.com/services/PIJ90N7
                          html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
                      num_loops: 2
                      teams:
                        - id: PQ9K7I8
                          type: team_reference
                          summary: Engineering
                          self: https://api.pagerduty.com/teams/PQ9K7I8
                          html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: List and create escalation policies.
  /escalation_policies/{id}:
    get:
      tags:
        - Escalation Policies
      x-pd-requires-scope: escalation_policies.read
      operationId: getEscalationPolicy
      description: |
        Get information about an existing escalation policy and its rules.

        Escalation policies define which user should be alerted at which time.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#escalation-policies)

        Scoped OAuth requires: `escalation_policies.read`
      summary: Get an escalation policy
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/include_escalation_policy'
      responses:
        '200':
          description: The escalation policy object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  escalation_policy:
                    $ref: '#/components/schemas/EscalationPolicy'
                required:
                  - escalation_policy
              examples:
                response:
                  summary: Response Example
                  value:
                    escalation_policy:
                      id: PT20YPA
                      type: escalation_policy
                      summary: Another Escalation Policy
                      on_call_handoff_notifications: if_has_services
                      self: https://api.pagerduty.com/escalation_policies/PT20YPA
                      html_url: https://subdomain.pagerduty.com/escalation_policies/PT20YPA
                      name: Another Escalation Policy
                      escalation_rules:
                        - id: PGHDV41
                          escalation_delay_in_minutes: 30
                          targets:
                            - id: PAM4FGS
                              summary: Kyler Kuhn
                              type: user_reference
                              self: https://api.pagerduty.com/users/PAM4FGS
                              html_url: https://subdomain.pagerduty.com/users/PAM4FGS
                            - id: PI7DH85
                              summary: Daily Engineering Rotation
                              type: schedule_reference
                              self: https://api.pagerduty.com/schedules/PI7DH85
                              html_url: https://subdomain.pagerduty.com/schedules/PI7DH85
                      services:
                        - id: PIJ90N7
                          type: service_reference
                          summary: My Mail Service
                          self: https://api.pagerduty.com/services/PIJ90N7
                          html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
                      num_loops: 2
                      teams:
                        - id: PQ9K7I8
                          type: team_reference
                          summary: Engineering
                          self: https://api.pagerduty.com/teams/PQ9K7I8
                          html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                      description: This is yet another escalation policy
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Escalation Policies
      x-pd-requires-scope: escalation_policies.write
      operationId: deleteEscalationPolicy
      description: |
        Deletes an existing escalation policy and rules. The escalation policy must not be in use by any services.

        Escalation policies define which user should be alerted at which time.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#escalation-policies)

        Scoped OAuth requires: `escalation_policies.write`
      summary: Delete an escalation policy
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: The escalation policy was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Escalation Policies
      x-pd-requires-scope: escalation_policies.write
      operationId: updateEscalationPolicy
      description: |
        Updates an existing escalation policy and rules.

        Escalation policies define which user should be alerted at which time.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#escalation-policies)

        Scoped OAuth requires: `escalation_policies.write`
      summary: Update an escalation policy
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                escalation_policy:
                  $ref: '#/components/schemas/EscalationPolicy'
              required:
                - escalation_policy
            examples:
              request:
                summary: Request Example
                value:
                  escalation_policy:
                    type: escalation_policy
                    name: Engineering Escalation Policy
                    escalation_rules:
                      - escalation_delay_in_minutes: 30
                        targets:
                          - id: PEYSGVF
                            type: user_reference
                        escalation_rule_assignment_strategy:
                          type: round_robin
                    services:
                      - id: PIJ90N7
                        type: service_reference
                    num_loops: 2
                    on_call_handoff_notifications: if_has_services
                    teams:
                      - id: PQ9K7I8
                        type: team_reference
                    description: Here is the ep for the engineering team.
        description: The escalation policy to be updated.
      responses:
        '200':
          description: The escalation policy that was updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  escalation_policy:
                    $ref: '#/components/schemas/EscalationPolicy'
                required:
                  - escalation_policy
              examples:
                response:
                  summary: Response Example
                  value:
                    escalation_policy:
                      id: PT20YPA
                      type: escalation_policy
                      summary: Another Escalation Policy
                      on_call_handoff_notifications: if_has_services
                      self: https://api.pagerduty.com/escalation_policies/PT20YPA
                      html_url: https://subdomain.pagerduty.com/escalation_policies/PT20YPA
                      name: Another Escalation Policy
                      escalation_rules:
                        - id: PGHDV41
                          escalation_delay_in_minutes: 30
                          targets:
                            - id: PAM4FGS
                              summary: Kyler Kuhn
                              type: user_reference
                              self: https://api.pagerduty.com/users/PAM4FGS
                              html_url: https://subdomain.pagerduty.com/users/PAM4FGS
                            - id: PI7DH85
                              summary: Daily Engineering Rotation
                              type: schedule_reference
                              self: https://api.pagerduty.com/schedules/PI7DH85
                              html_url: https://subdomain.pagerduty.com/schedules/PI7DH85
                      services:
                        - id: PIJ90N7
                          type: service_reference
                          summary: My Mail Service
                          self: https://api.pagerduty.com/services/PIJ90N7
                          html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
                      num_loops: 2
                      teams:
                        - id: PQ9K7I8
                          type: team_reference
                          summary: Engineering
                          self: https://api.pagerduty.com/teams/PQ9K7I8
                          html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
                      description: This is yet another escalation policy
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: Manage an escalation policy.
  /escalation_policies/{id}/audit/records:
    get:
      x-pd-requires-scope: audit_records.read
      tags:
        - Escalation Policies
      operationId: listEscalationPolicyAuditRecords
      summary: List audit records for an escalation policy
      description: |
        The returned records are sorted by the `execution_time` from newest to oldest.

        See [`Cursor-based pagination`](https://developer.pagerduty.com/docs/rest-api-v2/pagination/) for instructions on how to paginate through the result set.

        For more information see the [Audit API Document](https://developer.pagerduty.com/docs/rest-api-v2/audit-records-api/).

        Scoped OAuth requires: `audit_records.read`
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/cursor_limit'
        - $ref: '#/components/parameters/cursor_cursor'
        - $ref: '#/components/parameters/audit_since'
        - $ref: '#/components/parameters/audit_until'
      responses:
        '200':
          description: Records matching the query criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecordResponseSchema'
              examples:
                response:
                  $ref: '#/components/examples/AuditRecordEscalationPolicyResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List audit records of changes made to the escalation policy.
components:
  schemas:
    Pagination:
      type: object
      properties:
        offset:
          type: integer
          description: Echoes offset pagination property.
          readOnly: true
        limit:
          type: integer
          description: Echoes limit pagination property.
          readOnly: true
        more:
          type: boolean
          description: Indicates if there are additional records to return
          readOnly: true
        total:
          type: integer
          description: The total number of records matching the given query.
          nullable: true
          readOnly: true
    EscalationPolicy:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        name:
          type: string
          description: The name of the escalation policy.
        description:
          type: string
          description: Escalation policy description.
        num_loops:
          type: integer
          description: The number of times the escalation policy will repeat after reaching the end of its escalation.
          default: 0
          minimum: 0
        on_call_handoff_notifications:
          type: string
          description: Determines how on call handoff notifications will be sent for users on the escalation policy. Defaults to "if_has_services".
          enum:
            - if_has_services
            - always
        escalation_rules:
          type: array
          items:
            $ref: '#/components/schemas/EscalationRule'
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceReference'
          minLength: 0
          readOnly: true
        teams:
          type: array
          description: Team associated with the policy. Account must have the `teams` ability to use this parameter. Only one team may be associated with the policy.
          items:
            $ref: '#/components/schemas/TeamReference'
          minLength: 0
      required:
        - type
        - name
        - escalation_rules
      example:
        id: PQIL2IX
        type: escalation_policy
        name: Engineering Escalation Policy
        escalation_rules:
          - escalation_delay_in_minutes: 30
            targets:
              - id: PEYSGVF
                type: user_reference
            escalation_rule_assignment_strategy:
              - type: round_robin
        services:
          - id: PIJ90N7
            type: service_reference
        num_loops: 2
        on_call_handoff_notifications: if_has_services
        teams:
          - id: PQ9K7I8
            type: team_reference
        description: Here is the ep for the engineering team.
    AuditRecordResponseSchema:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        response_metadata:
          nullable: true
          anyOf:
            - $ref: '#/components/schemas/AuditMetadata'
        limit:
          type: integer
          description: The minimum of the `limit` parameter used in the request or the maximum request size of the API.
          readOnly: true
        next_cursor:
          type: string
          description: |
            An opaque string than will deliver the next set of results when provided as the `cursor` parameter in a subsequent request.  A `null` value for this field indicates that there are no additional results.
          example: dXNlcjaVMzc5V0ZYTlo=
          nullable: true
          readOnly: true
      required:
        - records
        - limit
        - next_cursor
    Tag:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        label:
          type: string
          description: The label of the tag.
          maxLength: 191
      required:
        - label
        - type
      example:
        type: tag
        label: Batman
    EscalationRule:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        escalation_delay_in_minutes:
          type: integer
          description: The number of minutes before an unacknowledged incident escalates away from this rule.
        targets:
          type: array
          minItems: 1
          maxItems: 10
          description: The targets an incident should be assigned to upon reaching this rule.
          items:
            $ref: '#/components/schemas/EscalationTargetReference'
        escalation_rule_assignment_strategy:
          type: string
          description: The strategy used to assign the escalation rule to an incident.
          enum:
            - round_robin
            - assign_to_everyone
      required:
        - escalation_delay_in_minutes
        - targets
      example:
        escalation_delay_in_minutes: 30
        targets:
          - id: PAM4FGS
            type: user_reference
          - id: PI7DH85
            type: schedule_reference
    ServiceReference:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
      required:
        - type
        - id
      description: (opaque JSON object)
    TeamReference:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
      required:
        - type
        - id
      description: (opaque JSON object)
    AuditRecord:
      type: object
      readOnly: true
      description: An Audit Trail record
      properties:
        id:
          type: string
        self:
          type: string
          nullable: true
          description: Record URL.
        execution_time:
          type: string
          format: date-time
          description: The date/time the action executed, in ISO8601 format and millisecond precision.
        execution_context:
          type: object
          description: Action execution context
          properties:
            request_id:
              type: string
              nullable: true
              description: Request Id
            remote_address:
              type: string
              nullable: true
