          enum:
            - boolean
            - integer
            - float
            - string
            - datetime
            - url
        default_value:
          oneOf:
            - type: object
              title: Boolean
              properties:
                value:
                  type: boolean
                  nullable: true
            - type: object
              title: Integer
              properties:
                value:
                  type: integer
                  nullable: true
            - type: object
              title: Float
              properties:
                value:
                  type: number
                  nullable: true
            - type: object
              title: String
              properties:
                value:
                  oneOf:
                    - type: string
                      maxLength: 200
                      nullable: true
                    - type: array
                      items:
                        type: string
                        maxLength: 200
                      maxItems: 10
                      uniqueItems: true
                      nullable: true
            - type: object
              title: Datetime
              properties:
                value:
                  type: string
                  nullable: true
                  format: date-time
            - type: object
              title: Url
              properties:
                value:
                  type: string
                  format: uri
                  maxLength: 200
                  nullable: true
