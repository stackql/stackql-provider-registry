openapi: 3.0.2
info:
  title: PagerDuty API - Custom Fields
  description: Account-level custom field definitions for incidents (deprecated in favour of incident types) and services.
  version: 2.0.0
paths:
  /incidents/custom_fields:
    post:
      tags:
        - Incident Custom Fields
      x-pd-requires-scope: custom_fields.write
      operationId: createCustomFieldsField
      description: |

        <!-- theme: warning -->
        > ### Deprecated
        > This endpoint is deprecated and only works for fields on the Base Incident Type. \
        > For more flexibility, we recommend using the Incident Types endpoint: \
        > /incidents/types/{type_id_or_name}/custom_fields

        Creates a new Custom Field on the Base Incident Type, along with the Field Options if provided. \
        An account may have up to 10 Fields.

        Scoped OAuth requires: `custom_fields.write`
      summary: Create a Field
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                field:
                  $ref: '#/components/schemas/CustomFieldsFieldWithOptions'
              required:
                - field
            examples:
              request1:
                summary: 'Example: With field_options and single-value'
                value:
                  field:
                    data_type: string
                    name: environment
                    display_name: Environment
                    description: The environment that the issue occurred in
                    field_type: single_value_fixed
                    default_value: production
                    field_options:
                      - data:
                          data_type: string
                          value: production
                      - data:
                          data_type: string
                          value: staging
              request2:
                summary: 'Example: With field_options and multi-value'
                value:
                  field:
                    data_type: string
                    name: environment
                    display_name: Environment
                    description: The environment that the issue occurred in
                    field_type: multi_value_fixed
                    default_value:
                      - production
                      - staging
                    field_options:
                      - data:
                          data_type: string
                          value: production
                      - data:
                          data_type: string
                          value: staging
              request3:
                summary: 'Example: Without field_options'
                value:
                  field:
                    data_type: string
                    name: environment
                    display_name: Environment
                    description: The environment that the issue occurred in
                    field_type: single_value
                    default_value: production
      responses:
        '201':
          description: The field object created, along with the Field Options if provided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    $ref: '#/components/schemas/CustomFieldsFieldWithOptions'
                required:
                  - field
              examples:
                response1:
                  summary: 'Example: With field_options and single-value'
                  value:
                    field:
                      id: P5IYCNZ
                      type: field
                      summary: environment
                      self: https://api.pagerduty.com/incidents/custom_fields/P5IYCNZ
                      data_type: string
                      name: environment
                      display_name: Environment
                      field_type: single_value_fixed
                      description: The environment that the issue occurred in
                      created_at: '2021-06-01T21:30:42Z'
                      updated_at: '2021-06-01T21:30:42Z'
                      default_value: staging
                      field_options:
                        - id: PT4KHEE
                          type: field_option
                          data:
                            data_type: string
                            value: production
                          created_at: '2021-06-01T21:30:42Z'
                          updated_at: '2021-06-01T21:30:42Z'
                        - id: P5IYCNZ
                          type: field_option
                          data:
                            data_type: string
                            value: staging
                          created_at: '2021-06-01T21:30:42Z'
                          updated_at: '2021-06-01T21:30:42Z'
                response2:
                  summary: 'Example: With field_options and multi-value'
                  value:
                    field:
                      id: P5IYCNZ
                      type: field
                      summary: environment
                      self: https://api.pagerduty.com/incidents/custom_fields/P5IYCNZ
                      data_type: string
                      name: environment
                      display_name: Environment
                      field_type: multi_value_fixed
                      description: The environment that the issue occurred in
                      created_at: '2021-06-01T21:30:42Z'
                      updated_at: '2021-06-01T21:30:42Z'
                      default_value:
                        - production
                        - staging
                      field_options:
                        - id: PT4KHEE
                          type: field_option
                          data:
                            data_type: string
                            value: production
                          created_at: '2021-06-01T21:30:42Z'
                          updated_at: '2021-06-01T21:30:42Z'
                        - id: P5IYCNZ
                          type: field_option
                          data:
                            data_type: string
                            value: staging
                          created_at: '2021-06-01T21:30:42Z'
                          updated_at: '2021-06-01T21:30:42Z'
                response3:
                  summary: 'Example: Without field_options'
                  value:
                    field:
                      id: P5IYCNZ
                      type: field
                      summary: environment
                      self: https://api.pagerduty.com/incidents/custom_fields/P5IYCNZ
                      data_type: string
                      field_type: single_value
                      name: environment
                      display_name: Environment
                      description: The environment that the issue occurred in
                      default_value: production
                      created_at: '2021-06-01T21:30:42Z'
                      updated_at: '2021-06-01T21:30:42Z'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Incident Custom Fields
      x-pd-requires-scope: custom_fields.read
      operationId: listCustomFieldsFields
      description: |

        <!-- theme: warning -->
        > ### Deprecated
        > This endpoint is deprecated and only works for fields on the Base Incident Type. \
        > For more flexibility, we recommend using the Incident Types endpoint: \
        > /incidents/types/{type_id_or_name}/custom_fields

        List Custom Fields on the Base Incident Type.

        Scoped OAuth requires: `custom_fields.read`
      summary: List Fields
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/include_customfields_field'
      responses:
        '200':
          description: A list of fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomFieldsFieldWithOptions'
                required:
                  - fields
              examples:
                response:
                  summary: Response Example
                  value:
                    fields:
                      - id: P5IYCNZ
                        type: field
                        summary: environment
                        self: https://api.pagerduty.com/incidents/custom_fields/P5IYCNZ
                        data_type: string
                        name: environment
                        display_name: Environment
                        description: The environment that the issue occurred in
                        field_type: single_value_fixed
                        created_at: '2021-06-01T21:30:42Z'
                        updated_at: '2021-06-01T21:30:42Z'
                        default_value: null
                        field_options:
                          - id: PT4KHEE
                            type: field_option
                            data:
                              data_type: string
                              value: abc
                            created_at: '2021-06-01T21:30:42Z'
                            updated_at: '2021-06-01T21:30:42Z'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Create and list Fields on Incidents
  /incidents/custom_fields/{field_id}:
    get:
      tags:
        - Incident Custom Fields
      x-pd-requires-scope: custom_fields.read
      operationId: getCustomFieldsField
      description: |

        <!-- theme: warning -->
        > ### Deprecated
        > This endpoint is deprecated and only works for fields on the Base Incident Type. \
        > For more flexibility, we recommend using the Incident Types endpoint: \
        > /incidents/types/{type_id_or_name}/custom_fields/{field_id}

        Show detailed information about a Custom Field on the Base Incident Type.

        Scoped OAuth requires: `custom_fields.read`
      summary: Get a Field
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/field_id'
        - $ref: '#/components/parameters/include_customfields_field'
      responses:
        '200':
          description: The field requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    $ref: '#/components/schemas/CustomFieldsFieldWithOptions'
                required:
                  - field
              examples:
                response1:
                  summary: 'Example: No query parameters'
                  value:
                    field:
                      id: P5IYCNZ
                      type: field
                      summary: environment
                      self: https://api.pagerduty.com/incidents/custom_fields/P5IYCNZ
                      data_type: string
                      name: environment
                      display_name: Environment
                      description: The environment that the issue occurred in
                      field_type: multi_value
                      default_value: null
                      created_at: '2021-06-01T21:30:42Z'
                      updated_at: '2021-06-01T21:30:42Z'
                response2:
                  summary: 'Example: Using include[]=field_options'
                  value:
                    field:
                      id: P5IYCNZ
                      type: field
                      summary: environment
                      self: https://api.pagerduty.com/incidents/custom_fields/P5IYCNZ
                      data_type: string
                      name: environment
                      display_name: Environment
                      description: The environment that the issue occurred in
                      field_type: single_value_fixed
                      created_at: '2021-06-01T21:30:42Z'
                      updated_at: '2021-06-01T21:30:42Z'
                      default_value: null
                      field_options:
                        - id: PT4KHEE
                          type: field_option
                          data:
                            data_type: string
                            value: production
                          created_at: '2021-06-01T21:30:42Z'
                          updated_at: '2021-06-01T21:30:42Z'
                        - id: P5IYCNZ
                          type: field_option
                          data:
                            data_type: string
                            value: staging
                          created_at: '2021-06-01T21:30:42Z'
                          updated_at: '2021-06-01T21:30:42Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Incident Custom Fields
      x-pd-requires-scope: custom_fields.write
      operationId: updateCustomFieldsField
      description: |

        <!-- theme: warning -->
        > ### Deprecated
        > This endpoint is deprecated and only works for fields on the Base Incident Type. \
        > For more flexibility, we recommend using the Incident Types endpoint: \
        > /incidents/types/{type_id_or_name}/custom_fields/{field_id}

        Update a Custom Field on the Base Incident Type.

        Scoped OAuth requires: `custom_fields.write`
      summary: Update a Field
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/field_id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                field:
                  $ref: '#/components/schemas/CustomFieldsEditableField'
              required:
                - field
            examples:
              request:
                summary: Request Example
                value:
                  field:
                    display_name: New Display Name!
                    description: New description!
      responses:
        '200':
          description: The field object updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    $ref: '#/components/schemas/CustomFieldsField'
                required:
                  - field
              examples:
                response:
                  summary: Response Example
                  value:
                    field:
                      id: P5IYCNZ
                      type: field
                      summary: old_name
                      self: https://api.pagerduty.com/incidents/custom_fields/P5IYCNZ
                      data_type: string
                      name: old_name
                      display_name: New Display Name!
                      description: New description!
                      field_type: single_value
                      default_value: null
                      created_at: '2021-06-01T21:30:42Z'
                      updated_at: '2021-06-01T21:30:42Z'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Incident Custom Fields
      x-pd-requires-scope: custom_fields.write
      operationId: deleteCustomFieldsField
      description: |

        <!-- theme: warning -->
        > ### Deprecated
        > This endpoint is deprecated and only works for fields on the Base Incident Type. \
        > For more flexibility, we recommend using the Incident Types endpoint: \
        > /incidents/types/{type_id_or_name}/custom_fields/{field_id}

        Delete a Custom Field from the Base Incident Type.

        Scoped OAuth requires: `custom_fields.write`
      summary: Delete a Field
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/field_id'
      responses:
        '204':
          description: The field was deleted successfully.
        '400':
          $ref: '#/components/responses/ArgumentError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Get, update and delete a field.
  /incidents/custom_fields/{field_id}/field_options:
    post:
      tags:
        - Incident Custom Fields
      x-pd-requires-scope: custom_fields.write
      operationId: createCustomFieldsFieldOption
      description: |

        <!-- theme: warning -->
        > ### Deprecated
        > This endpoint is deprecated and only works for fields on the Base Incident Type. \
        > For more flexibility, we recommend using the Incident Types endpoint: \
        > /incidents/types/{type_id_or_name}/custom_fields/{field_id}/field_options

        Create a new Field Option for a Custom Field on the Base Incident Type. Field Options may only be created for Fields that have `field_options`. A Field may have no more than 10 enabled options.

        Scoped OAuth requires: `custom_fields.write`
      summary: Create a Field Option
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/field_id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                field_option:
                  $ref: '#/components/schemas/CustomFieldsFieldOption'
              required:
                - field_option
            examples:
              request:
                summary: Request Example
                value:
                  field_option:
                    data:
                      data_type: string
                      value: production
      responses:
        '201':
          description: The field option created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_option:
                    $ref: '#/components/schemas/CustomFieldsFieldOption'
                required:
                  - field_option
              examples:
                response:
                  summary: Response Example
                  value:
                    field_option:
                      id: PQ9K7I8
                      type: field_option
                      data:
                        data_type: string
                        value: production
                      created_at: '2021-06-01T21:30:42Z'
                      updated_at: '2021-06-01T21:30:42Z'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Incident Custom Fields
      x-pd-requires-scope: custom_fields.read
      operationId: listCustomFieldsFieldOptions
      description: |

        <!-- theme: warning -->
        > ### Deprecated
        > This endpoint is deprecated and only works for fields on the Base Incident Type. \
        > For more flexibility, we recommend using the Incident Types endpoint: \
        > /incidents/types/{type_id_or_name}/custom_fields/{field_id}/field_options

        List all enabled Field Options for a Custom Field on the Base Incident Type.

        Scoped OAuth requires: `custom_fields.read`
      summary: List Field Options
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/field_id'
      responses:
        '200':
          description: A list of field options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_options:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomFieldsFieldOption'
                required:
                  - field_options
              examples:
                response:
                  summary: Response Example
                  value:
                    field_options:
                      - id: PQ9K7I8
                        type: field_option
                        data:
                          data_type: string
                          value: production
                        created_at: '2021-06-01T21:30:42Z'
                        updated_at: '2021-06-01T21:30:42Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Create new option for the given field_options (e.g., enum) field and list all options for the given field.
  /incidents/custom_fields/{field_id}/field_options/{field_option_id}:
    put:
      tags:
        - Incident Custom Fields
      x-pd-requires-scope: custom_fields.write
      operationId: updateCustomFieldsFieldOption
      description: |

        <!-- theme: warning -->
        > ### Deprecated
        > This endpoint is deprecated and only works for fields on the Base Incident Type. \
        > For more flexibility, we recommend using the Incident Types endpoint: \
        > /incidents/types/{type_id_or_name}/custom_fields/{field_id}/field_options/{field_option_id}

