          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Update field option.
  /services/custom_fields:
    post:
      tags:
        - Service Custom Fields
      x-pd-requires-scope: custom_fields.write
      operationId: createServiceCustomField
      description: |
        Creates a new Custom Field for Services, along with the Field Options if provided.

        Scoped OAuth requires: `custom_fields.write`
      summary: Create a Field
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                field:
                  $ref: '#/components/schemas/ServiceCustomFieldsFieldCreateModel'
              required:
                - field
            examples:
              request1:
                summary: 'Example: With field_options and single-value'
                value:
                  field:
                    data_type: string
                    description: The environment that the service operates in
                    display_name: Environment
                    enabled: true
                    field_options:
                      - data:
                          data_type: string
                          value: production
                      - data:
                          data_type: string
                          value: staging
                      - data:
                          data_type: string
                          value: development
                    field_type: single_value_fixed
                    name: environment
              request2:
                summary: 'Example: With field_options and multi-value'
                value:
                  field:
                    data_type: string
                    description: The regions where this service is deployed
                    display_name: Supported Regions
                    enabled: true
                    field_options:
                      - data:
                          data_type: string
                          value: us-east-1
                      - data:
                          data_type: string
                          value: us-west-1
                      - data:
                          data_type: string
                          value: eu-west-1
                      - data:
                          data_type: string
                          value: ap-southeast-1
                    field_type: multi_value_fixed
                    name: supported_regions
              request3:
                summary: 'Example: Without field_options'
                value:
                  field:
                    data_type: string
                    description: The team that owns this service
                    display_name: Team Owner
                    enabled: true
                    field_type: single_value
                    name: team_owner
      responses:
        '201':
          description: The field object created, along with the Field Options if provided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    $ref: '#/components/schemas/ServiceCustomFieldsFieldReadModel'
                required:
                  - field
              examples:
                response1:
                  summary: 'Example: With field_options and single-value'
                  value:
                    field:
                      created_at: '2023-01-01T00:00:00Z'
                      data_type: string
                      description: The environment that the service operates in
                      display_name: Environment
                      enabled: true
                      field_options:
                        - created_at: '2023-01-01T00:00:00Z'
                          data:
                            data_type: string
                            value: production
                          id: OPT1
                          type: field_option
                          updated_at: '2023-01-01T00:00:00Z'
                        - created_at: '2023-01-01T00:00:00Z'
                          data:
                            data_type: string
                            value: staging
                          id: OPT2
                          type: field_option
                          updated_at: '2023-01-01T00:00:00Z'
                        - created_at: '2023-01-01T00:00:00Z'
                          data:
                            data_type: string
                            value: development
                          id: OPT3
                          type: field_option
                          updated_at: '2023-01-01T00:00:00Z'
                      field_type: single_value_fixed
                      id: ABCDEF1
                      name: environment
                      self: https://api.pagerduty.com/services/custom_fields/ABCDEF1
                      summary: Environment
                      type: custom_fields_field
                      updated_at: '2023-01-01T00:00:00Z'
                response2:
                  summary: 'Example: With field_options and multi-value'
                  value:
                    field:
                      created_at: '2023-01-01T00:00:00Z'
                      data_type: string
                      description: The regions where this service is deployed
                      display_name: Supported Regions
                      enabled: true
                      field_options:
                        - created_at: '2023-01-01T00:00:00Z'
                          data:
                            data_type: string
                            value: us-east-1
                          id: OPT4
                          type: field_option
                          updated_at: '2023-01-01T00:00:00Z'
                        - created_at: '2023-01-01T00:00:00Z'
                          data:
                            data_type: string
                            value: us-west-1
                          id: OPT5
                          type: field_option
                          updated_at: '2023-01-01T00:00:00Z'
                        - created_at: '2023-01-01T00:00:00Z'
                          data:
                            data_type: string
                            value: eu-west-1
                          id: OPT6
                          type: field_option
                          updated_at: '2023-01-01T00:00:00Z'
                        - created_at: '2023-01-01T00:00:00Z'
                          data:
                            data_type: string
                            value: ap-southeast-1
                          id: OPT7
                          type: field_option
                          updated_at: '2023-01-01T00:00:00Z'
                      field_type: multi_value_fixed
                      id: ABCDEF2
                      name: supported_regions
                      self: https://api.pagerduty.com/services/custom_fields/ABCDEF2
