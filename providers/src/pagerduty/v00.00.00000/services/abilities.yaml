openapi: 3.0.2
info:
  title: PagerDuty API - Abilities
  description: Account abilities by feature name (for example teams), which depend on the pricing plan and account state.
  version: 2.0.0
paths:
  /abilities:
    get:
      x-pd-requires-scope: abilities.read
      tags:
        - Abilities
      operationId: listAbilities
      description: |
        List all of your account's abilities, by name.

        "Abilities" describes your account's capabilities by feature name. For example `"teams"`.

        An ability may be available to your account based on things like your pricing plan or account state.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#abilities)

        Scoped OAuth requires: `abilities.read`
      summary: List abilities
      parameters: []
      responses:
        '200':
          description: An array of ability names.
          content:
            application/json:
              schema:
                type: object
                properties:
                  abilities:
                    type: array
                    description: The set of abilities your account has.
                    items:
                      type: string
                      description: A single ability, as a name.
                      readOnly: true
                required:
                  - abilities
              examples:
                response:
                  summary: Example Response
                  value:
                    abilities:
                      - teams
                      - read_only_users
                      - service_support_hours
                      - urgencies
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: List your account's abilities.
  /abilities/{id}:
    get:
      x-pd-requires-scope: abilities.read
      tags:
        - Abilities
      operationId: getAbility
      description: |
        Test whether your account has a given ability.

        "Abilities" describes your account's capabilities by feature name. For example `"teams"`.

        An ability may be available to your account based on things like your pricing plan or account state.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#abilities)

        Scoped OAuth requires: `abilities.read`
      summary: Test an ability
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: The account has the requested ability.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    description: Get an ability.
