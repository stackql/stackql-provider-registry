  parameters:
    cursor_limit:
      name: limit
      in: query
      required: false
      description: The minimum of the `limit` parameter used in the request or the maximum request size of the API.
      schema:
        type: integer
    cursor_cursor:
      name: cursor
      in: query
      required: false
      description: |
        Optional parameter used to request the "next" set of results from an API.  The value provided here is most commonly obtained from the `next_cursor` field of the previous request.  When no value is provided, the request starts at the beginning of the result set.
      schema:
        type: string
    automation_actions_name:
      name: name
      description: Filters results to include the ones matching the name (case insensitive substring matching)
      in: query
      required: false
      schema:
        type: string
        nullable: false
    automation_actions_runner_id:
      name: runner_id
      description: |
        Filters results to include the ones linked to the specified runner.
        Specifying the value `any` filters results to include the ones linked to runners only,
        thus omitting the results not linked to runners.
      in: query
      required: false
      schema:
        type: string
        nullable: false
    automation_actions_classification:
      name: classification
      description: Filters results to include the ones matching the specified classification (aka category)
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AutomationActionsActionClassificationEnum'
    automation_actions_team_id:
      name: team_id
      description: Filters results to include the ones associated with the specified team.
      in: query
      required: false
      schema:
        type: string
        nullable: false
    automation_actions_service_id:
      name: service_id
      description: Filters results to include the ones associated with the specified service
      in: query
      required: false
      schema:
        type: string
        nullable: false
    automation_actions_action_type:
      name: action_type
      description: Filters results to include the ones matching the specified action type
      in: query
      required: false
      schema:
        type: string
        enum:
          - script
          - process_automation
        example: process_automation
    id:
      name: id
      description: The ID of the resource.
      in: path
      required: true
      schema:
        type: string
    service_id:
      name: service_id
      in: path
      description: The service ID
      required: true
      schema:
        type: string
    team_id:
      name: team_id
      in: path
      description: The team ID
      required: true
      schema:
        type: string
    automation_actions_invocation_state:
      name: invocation_state
      description: Invocation state
      in: query
      schema:
        type: string
        description: prepared -- the invocation exists and can be referenced, but is NOT available to a Runner <br> created -- the invocation exists and is waiting for a Runner <br> sent -- invocation sent to a Runner <br> queued -- invocation queued by a Runner <br> running -- invocation is being ran by a Runner <br> aborted -- invocation was aborted on a Runner <br> completed -- invocation completed on a Runner <br> error -- invocation encountered an error on a Runner unknown -- transient error encountered when fetching invocation state
        enum:
          - prepared
          - created
          - sent
          - queued
          - running
          - aborted
          - completed
          - error
          - unknown
        example: sent
    automation_actions_not_invocation_state:
      name: not_invocation_state
      description: Invocation state inverse filter (matches invocations NOT in the specified state)
      in: query
      schema:
        type: string
        description: prepared -- the invocation exists and can be referenced, but is NOT available to a Runner <br> created -- the invocation exists and is waiting for a Runner <br> sent -- invocation sent to a Runner <br> queued -- invocation queued by a Runner <br> running -- invocation is being ran by a Runner <br> aborted -- invocation was aborted on a Runner <br> completed -- invocation completed on a Runner <br> error -- invocation encountered an error on a Runner unknown -- transient error encountered when fetching invocation state
        enum:
          - prepared
          - created
          - sent
          - queued
          - running
          - aborted
          - completed
          - error
          - unknown
        example: sent
    automation_actions_incident_id:
      name: incident_id
      description: Incident ID
      in: query
      required: false
      schema:
        type: string
        example: Q2LAR4ADCXC8IB
    automation_actions_action_id:
      name: action_id
      description: Action ID
      in: query
      required: false
      schema:
        type: string
        example: 01DAW70HK24JZORNE0P9C2V1L9
    automation_actions_runners_include:
      name: include[]
      in: query
      required: false
      description: Includes additional data elements into the response
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - associated_actions
          example: associated_actions
        uniqueItems: true
