openapi: 3.0.2
info:
  title: PagerDuty API - Automation Actions
  description: 'Automation Actions: actions, runners, invocations and their service and team associations.'
  version: 2.0.0
paths:
  /automation_actions/actions:
    post:
      summary: Create an Automation Action
      tags:
        - Automation Actions
      description: |
        Create a Script, Process Automation, or Runbook Automation action
      operationId: createAutomationAction
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  discriminator:
                    propertyName: action_type
                    mapping:
                      script: '#/components/schemas/AutomationActionsScriptActionPostBody'
                      process_automation: '#/components/schemas/AutomationActionsProcessAutomationJobActionPostBody'
                  type: object
                  properties:
                    name:
                      type: string
                      example: Restart apache
                      maxLength: 255
                    description:
                      type: string
                      example: Restarts apache on the us-west-2-shopping-cart host
                      maxLength: 1024
                    action_classification:
                      $ref: '#/components/schemas/AutomationActionsActionClassificationEnum'
                    action_type:
                      type: string
                      enum:
                        - script
                        - process_automation
                      example: process_automation
                    runner:
                      type: string
                      example: 1a6763bd-b1ad-458f-a347-6c8a9bea2d70
                      maxLength: 36
                    services:
                      nullable: false
                      type: array
                      items:
                        $ref: '#/components/schemas/ServiceReference'
                    teams:
                      nullable: false
                      type: array
                      items:
                        $ref: '#/components/schemas/TeamReference'
                    only_invocable_on_unresolved_incidents:
                      type: boolean
                      description: If true, the action can only be invoked against an unresolved incident.
                      default: false
                      example: false
                    allow_invocation_manually:
                      type: boolean
                      description: If true, the action can only be invoked manually by a user.
                      default: true
                      example: true
                    allow_invocation_from_event_orchestration:
                      type: boolean
                      description: If true, the action can only be invoked automatically by an Event Orchestration.
                      default: true
                      example: true
                    map_to_all_services:
                      type: boolean
                      description: If true, the action will be associated with every service.
                      default: false
                      example: false
                    action_data_reference:
                      $ref: '#/components/schemas/AutomationActionsScriptActionDataReference'
                  required:
                    - name
                    - description
                    - action_type
                    - action_data_reference
              required:
                - action
            examples:
              request:
                value:
                  action:
                    name: Restart apache
                    description: Restarts apache on the us-west-2-shopping-cart host
                    action_type: script
                    action_data_reference:
                      script: java --version
                    teams:
                      - id: PQ9K7I8
                        type: team_reference
                    services:
                      - id: PRDRWUJ
                        type: service_reference
        required: true
      responses:
        '201':
          description: Action information
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    discriminator:
                      propertyName: action_type
                      mapping:
                        script: '#/components/schemas/AutomationActionsScriptActionWithTeams'
                        process_automation: '#/components/schemas/AutomationActionsProcessAutomationJobActionWithTeams'
                    type: object
                    properties:
                      id:
                        type: string
                        readOnly: true
                      summary:
                        type: string
                        nullable: true
                        readOnly: true
                        description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
                      type:
                        type: string
                        readOnly: true
                        description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
                      self:
                        type: string
                        nullable: true
                        readOnly: true
                        format: url
                        description: the API show URL at which the object is accessible
                      html_url:
                        type: string
                        nullable: true
                        readOnly: true
                        format: url
                        description: a URL at which the entity is uniquely displayed in the Web app
                      name:
                        type: string
                        example: Restart apache
                      description:
                        type: string
                        example: Restarts apache on the us-west-2-shopping-cart host
                      action_type:
                        type: string
                        enum:
                          - script
                          - process_automation
                        example: process_automation
                      action_classification:
                        $ref: '#/components/schemas/AutomationActionsActionClassificationEnum'
                      runner:
                        type: string
                        maxLength: 36
                      runner_type:
                        $ref: '#/components/schemas/AutomationActionsRunnerTypeEnum'
                      services:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceReference'
                      privileges:
                        $ref: '#/components/schemas/AutomationActionsUserPermissions'
                      metadata:
                        type: string
                        description: (opaque JSON object)
                      creation_time:
                        type: string
                        format: date-time
                        description: The date/time
                      modify_time:
                        type: string
                        format: date-time
                        description: The date/time
                      last_run:
                        type: string
                        format: date-time
                        description: The date/time
                      last_run_by:
                        oneOf:
                          - $ref: '#/components/schemas/UserReference'
                          - type: object
                            properties:
                              id:
                                type: string
                                example: /5471da24-eecd-42e2-ac38-a32b2d907406/service/P000000
                              type:
                                type: string
                                example: event_orchestration_reference
                            required:
                              - type
                              - id
                          - type: object
                            properties:
                              id:
                                type: string
                                readOnly: true
                              summary:
                                type: string
                                nullable: true
                                readOnly: true
                                description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
                              type:
                                type: string
                                readOnly: true
                                description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
                              self:
                                type: string
                                nullable: true
                                readOnly: true
                                format: url
                                description: the API show URL at which the object is accessible
                              html_url:
                                type: string
                                nullable: true
                                readOnly: true
                                format: url
                                description: a URL at which the entity is uniquely displayed in the Web app
                            required:
                              - type
                              - id
                            description: (opaque JSON object)
                      only_invocable_on_unresolved_incidents:
                        type: boolean
                        description: If true, the action can only be invoked against an unresolved incident.
                        default: false
                        example: false
                      allow_invocation_manually:
                        type: boolean
                        description: If true, the action can only be invoked manually by a user.
                        default: true
                        example: true
                      allow_invocation_from_event_orchestration:
                        type: boolean
                        description: If true, the action can only be invoked automatically by an Event Orchestration.
                        default: true
                        example: true
                      map_to_all_services:
                        type: boolean
                        description: If true, the action will be associated with every service.
                        default: false
                        example: false
                      action_data_reference:
                        $ref: '#/components/schemas/AutomationActionsScriptActionDataReference'
                      teams:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamReference'
                    description: A unit of work to be executed on runner. At most, an account can have 10,000 actions. If action maximum is exceeded, a 400 reponse is returned with error message.
                    required:
                      - id
                      - type
                      - action_type
                      - name
                      - creation_time
                      - modify_time
                      - action_data_reference
                required:
                  - action
              examples:
                response:
                  summary: Response Example
                  value:
                    action:
                      action_data_reference:
                        script: java --version
                      action_type: script
                      type: action
                      creation_time: '2022-11-08T14:54:02.267989Z'
                      description: Restarts apache on the us-west-2-shopping-cart host
                      id: 01DA2MLYN0J5EFC1LKWXUKDDKT
                      modify_time: '2022-11-08T14:54:02.267989Z'
                      name: Restart apache
                      only_invocable_on_unresolved_incidents: false
                      allow_invocation_manually: true
                      allow_invocation_from_event_orchestration: true
                      map_to_all_services: false
                      privileges:
                        permissions:
                          - read
                          - update
                          - delete
                          - invoke
                      services:
                        - id: PRDRWUJ
                          type: service_reference
                      teams:
                        - id: PQ9K7I8
                          type: team_reference
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List Automation Actions
      tags:
        - Automation Actions
      operationId: getAllAutomationActions
      description: |
        Lists Automation Actions matching provided query params.

        The returned records are sorted by action name in alphabetical order.

        See [`Cursor-based pagination`](https://developer.pagerduty.com/docs/rest-api-v2/pagination/) for instructions on how to paginate through the result set.
      parameters:
        - $ref: '#/components/parameters/cursor_limit'
        - $ref: '#/components/parameters/cursor_cursor'
        - $ref: '#/components/parameters/automation_actions_name'
        - $ref: '#/components/parameters/automation_actions_runner_id'
        - $ref: '#/components/parameters/automation_actions_classification'
        - $ref: '#/components/parameters/automation_actions_team_id'
        - $ref: '#/components/parameters/automation_actions_service_id'
        - $ref: '#/components/parameters/automation_actions_action_type'
      responses:
        '200':
          description: An array of actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/AutomationActionsScriptAction'
                        - $ref: '#/components/schemas/AutomationActionsProcessAutomationJobAction'
                      discriminator:
                        propertyName: action_type
                        mapping:
                          script: '#/components/schemas/AutomationActionsScriptAction'
                          process_automation: '#/components/schemas/AutomationActionsProcessAutomationJobAction'
                  privileges:
                    $ref: '#/components/schemas/AutomationActionsUserPermissions'
                  limit:
                    type: integer
                    description: The minimum of the `limit` parameter used in the request or the maximum request size of the API.
                    readOnly: true
                  next_cursor:
                    type: string
                    description: |
                      An opaque string than will deliver the next set of results when provided as the `cursor` parameter in a subsequent request.  A `null` value for this field indicates that there are no additional results.
                    example: dXNlcjaVMzc5V0ZYTlo=
                    nullable: true
                    readOnly: true
                required:
                  - actions
                  - limit
                  - next_cursor
              examples:
                response:
                  summary: Response Example
                  value:
                    actions:
                      - action_data_reference:
                          script: java --version
                        action_type: script
                        type: action
                        creation_time: '2022-11-08T14:54:02.267989Z'
                        description: Restarts apache on the us-west-2-shopping-cart host
                        id: 01DA2MLYN0J5EFC1LKWXUKDDKT
                        modify_time: '2022-11-08T14:54:02.267989Z'
                        name: Restart apache
                        only_invocable_on_unresolved_incidents: false
                        map_to_all_services: false
                        allow_invocation_manually: true
                        allow_invocation_from_event_orchestration: true
                        privileges:
                          permissions:
                            - read
                            - update
                            - delete
                            - invoke
                        services:
                          - id: PRDRWUJ
                            type: service_reference
                      - action_data_reference:
                          script: java --version
                        action_type: script
                        type: action
                        creation_time: '2022-11-08T14:54:02.267989Z'
                        description: Restarts apache on the us-west-2-shopping-cart host
                        id: 01DACKMP6Q3Y5YG51ENA26CX2I
                        modify_time: '2022-11-08T14:54:02.267989Z'
                        name: Restart apache
                        only_invocable_on_unresolved_incidents: false
                        map_to_all_services: false
                        allow_invocation_manually: true
                        allow_invocation_from_event_orchestration: true
                        privileges:
                          permissions:
                            - read
                            - update
                    limit: 2
                    next_cursor: null
                    privileges:
                      permissions:
                        - read
                        - update
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
