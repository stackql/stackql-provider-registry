openapi: 3.0.2
info:
  title: PagerDuty API - Status Pages
  description: 'Status pages: impacts, services, severities, statuses, posts, post updates, postmortems and subscriptions.'
  version: 2.0.0
paths:
  /status_pages:
    get:
      x-pd-requires-scope: status_pages.read
      tags:
        - Status Pages
      operationId: listStatusPages
      description: |
        List Status Pages.

        Scoped OAuth requires: `status_pages.read`
      summary: List Status Pages
      parameters:
        - $ref: '#/components/parameters/status_page_type'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                  status_pages:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatusPage'
              examples:
                response:
                  summary: Response Example
                  value:
                    limit: 25
                    more: false
                    offset: 0
                    status_pages:
                      - id: PT4KHLK
                        name: My brand Status Page
                        published_at: '2017-09-13T10:11:12.000Z'
                        status_page_type: private
                        type: status_page
                        url: https://status.mybrand.example
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
