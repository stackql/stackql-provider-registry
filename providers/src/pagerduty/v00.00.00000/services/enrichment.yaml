components:
  schemas:
    ServiceNowIntegration:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Base32-encoded UUID v7 (26 uppercase alphanumeric characters) identifying the integration.
        name:
          type: string
          description: The name of the integration.
        description:
          type: string
          nullable: true
          description: An optional description of the integration.
        cmdb_tables:
          type: array
          description: The ServiceNow CMDB table configurations belonging to this integration. An integration must have at least 1 and at most 8 tables.
          items:
            $ref: '#/components/schemas/ServiceNowTable'
        credentials:
          readOnly: true
          nullable: true
          description: The ServiceNow credentials associated with the account, or `null` if no credentials have been configured. Credentials are managed through the credentials endpoints, not through this object.
          type: object
          properties:
            id:
              type: string
              readOnly: true
              description: Base32-encoded UUID v7 (26 uppercase alphanumeric characters) identifying the credentials.
            instance_endpoint:
              type: string
              description: The ServiceNow instance URL (for example, `https://your-instance.service-now.com`).
            user:
              type: string
              description: The ServiceNow username used to authenticate API requests. The user must have read access to the configured CMDB tables.
            password:
              type: string
              writeOnly: true
              description: The ServiceNow password. Only accepted in requests and never returned in responses.
            created_at:
              type: string
              format: date-time
              readOnly: true
              description: The date/time the credentials were created.
            updated_at:
              type: string
              format: date-time
              readOnly: true
              description: The date/time the credentials were last updated.
            deleted_at:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              description: The date/time the credentials were deleted, or `null` if they have not been deleted.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The date/time the integration was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The date/time the integration was last updated.
    ServiceNowTableInput:
      type: object
      required:
        - display_name
        - ci_table_name
        - field_mappings
      properties:
        display_name:
          type: string
          description: A human-readable name for the CMDB table configuration. This name is used to identify the generated enrichment schema in the Event Enrichment rule editor.
        ci_table_name:
          type: string
          description: The name of the ServiceNow CMDB table to synchronize (for example, `cmdb_ci_server` or `cmdb_ci_ip_switch`). Table names are case-sensitive.
        query_filter:
          type: string
          nullable: true
          description: An optional ServiceNow encoded query used to limit which records are synchronized from the table (for example, `operational_status=1^u_environment=production`). Set to `null` to synchronize all records.
        field_mappings:
          type: array
          minItems: 2
          maxItems: 20
          description: The mappings between ServiceNow fields and event fields. Must contain between 2 and 20 mappings, including at least one enrichment field. At most 3 mappings may be marked as query fields.
          items:
            $ref: '#/components/schemas/ServiceNowFieldMappingInput'
    ServiceNowTable:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Base32-encoded UUID v7 (26 uppercase alphanumeric characters) identifying the CMDB table configuration.
        display_name:
          type: string
          description: A human-readable name for the CMDB table configuration. This name is used to identify the generated enrichment schema in the Event Enrichment rule editor.
        ci_table_name:
          type: string
          description: The name of the ServiceNow CMDB table to synchronize (for example, `cmdb_ci_server` or `cmdb_ci_ip_switch`). Table names are case-sensitive.
        query_filter:
          type: string
          nullable: true
          description: An optional ServiceNow encoded query used to limit which records are synchronized from the table (for example, `operational_status=1^u_environment=production`). Set to `null` to synchronize all records.
        field_mappings:
          type: array
          description: The mappings between ServiceNow fields and event fields. Must contain between 2 and 20 mappings, including at least one enrichment field. At most 3 mappings may be designated as query fields.
          items:
            $ref: '#/components/schemas/ServiceNowFieldMapping'
        status:
          type: string
          readOnly: true
          description: 'The current data synchronization status of the table. `disabled`: sync is not enabled (the default for newly created tables). `syncing`: an initial sync is in progress. `active`: sync is healthy and incremental updates are running. `error`: sync failed (check the credentials or table configuration).'
          enum:
            - disabled
            - syncing
            - active
            - error
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The date/time the table configuration was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The date/time the table configuration was last updated.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: The date/time the table configuration was deleted, or `null` if it has not been deleted.
    ServiceNowCredentialsInput:
      type: object
      required:
        - instance_endpoint
        - user
        - password
      properties:
        instance_endpoint:
          type: string
          description: The ServiceNow instance URL (for example, `https://your-instance.service-now.com`).
        user:
          type: string
          description: The ServiceNow username used to authenticate API requests. The user must have read access to the configured CMDB tables.
        password:
          type: string
          writeOnly: true
          description: The ServiceNow password. Only accepted in requests and never returned in responses.
    ServiceNowCredentials:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Base32-encoded UUID v7 (26 uppercase alphanumeric characters) identifying the credentials.
        instance_endpoint:
          type: string
          description: The ServiceNow instance URL (for example, `https://your-instance.service-now.com`).
        user:
          type: string
          description: The ServiceNow username used to authenticate API requests. The user must have read access to the configured CMDB tables.
        password:
          type: string
          writeOnly: true
          description: The ServiceNow password. Only accepted in requests and never returned in responses.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The date/time the credentials were created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The date/time the credentials were last updated.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: The date/time the credentials were deleted, or `null` if they have not been deleted.
    EnrichmentRecord:
      type: object
      properties:
        record_id:
          type: string
          readOnly: true
          description: Unique identifier for this enrichment record.
        type:
          type: string
          readOnly: true
          description: The type of the resource.
          example: enrichment_record
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the record was created.
        enrichment_data:
          type: object
          additionalProperties:
            type: string
          description: The enrichment data for this record, as key-value pairs keyed by field name.
    EnrichmentSchema:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the enrichment schema.
        type:
          type: string
          readOnly: true
          description: The type of the resource.
          example: enrichment_schema
        integration_type:
          type: string
          readOnly: true
          description: The source of the enrichment schema. `CSV` schemas are created and populated through the schema and CSV-upload endpoints; `SERVICENOW` schemas are managed by the ServiceNow CMDB integration. Schemas created through the API are always `CSV`, and only `CSV` schemas can be deleted.
          enum:
            - CSV
            - SERVICENOW
        name:
          type: string
          maxLength: 50
          description: Display name of the enrichment schema.
        description:
          type: string
          nullable: true
          maxLength: 2048
          description: Description of this set of enrichment data.
        fields:
          type: array
          minItems: 2
          maxItems: 25
          description: The fields that make up the schema, including both query and enriched fields. A schema must contain 1-3 `query` fields and at least one `enriched` field, up to a maximum of 25 fields. Field names are unique within the schema (case-insensitive).
          items:
            $ref: '#/components/schemas/EnrichmentField'
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the schema was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the schema was last updated.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Timestamp when the schema was deleted, or `null` if it has not been deleted.
    EventEnrichments:
      type: object
      properties:
        event_enrichments:
          type: array
          description: The list of Event Enrichments.
          items:
            $ref: '#/components/schemas/EventEnrichment'
        limit:
          type: integer
          description: The minimum of the `limit` parameter used in the request or the maximum request size of the API.
