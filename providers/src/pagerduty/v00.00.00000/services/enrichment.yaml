          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
  parameters:
    servicenow_integration_id:
      name: integration_id
      in: path
      required: true
      description: Base32-encoded UUID v7 (26 uppercase alphanumeric characters) identifying the ServiceNow enrichment integration.
      schema:
        type: string
    servicenow_table_id:
      name: table_id
      in: path
      required: true
      description: Base32-encoded UUID v7 (26 uppercase alphanumeric characters) identifying the CMDB table configuration.
      schema:
        type: string
    servicenow_credentials_id:
      name: credentials_id
      in: path
      required: true
      description: Base32-encoded UUID v7 (26 uppercase alphanumeric characters) identifying the ServiceNow credentials.
      schema:
        type: string
    enrichment_csv_filename:
      name: filename
      in: query
      required: false
      description: The filename for the CSV content. Required when creating a schema from a `text/csv` body; optional for `text/csv` record uploads. Ignored for `multipart/form-data` and JSON requests.
      schema:
        type: string
    enrichment_schema_id:
      name: schema_id
      in: path
      required: true
      description: The ID of the enrichment schema.
      schema:
        type: string
        format: uuid
    enrichment_records_limit:
      name: limit
      in: query
      required: false
      description: The maximum number of records to return per page (1-100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    enrichment_records_cursor:
      name: cursor
      in: query
      required: false
      description: Pagination cursor returned by a previous list request.
      schema:
        type: string
    enrichment_record_id:
      name: record_id
      in: path
      required: true
      description: The ID of the enrichment record.
      schema:
        type: string
    offset_limit:
      name: limit
      in: query
      required: false
      description: The number of results per page.
      schema:
        type: integer
    offset_offset:
      name: offset
      in: query
      required: false
      description: Offset to start pagination search results.
      schema:
        type: integer
    enrichment_include:
      name: include[]
      in: query
      required: false
      description: Include additional details. Supported value is "privileges".
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - privileges
    event_enrichment_id:
      name: id
      in: path
      required: true
      description: The ID of the Event Enrichment.
      schema:
        type: string
    enrichment_association_type:
      name: association_type
      in: query
      required: false
      description: Filter associations by type. Either "service" or "event_orchestration".
      schema:
        type: string
        enum:
          - service
          - event_orchestration
  requestBodies:
    ServiceNowIntegrationPostRequest:
      description: The ServiceNow enrichment integration to create. Credentials are added separately through the credentials endpoint.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - cmdb_tables
            properties:
              name:
                type: string
                maxLength: 100
                description: The name of the integration.
              description:
                type: string
                maxLength: 500
                description: An optional description of the integration.
              cmdb_tables:
                type: array
                minItems: 1
                maxItems: 8
                description: The ServiceNow CMDB table configurations. An integration must have between 1 and 8 tables.
                items:
                  $ref: '#/components/schemas/ServiceNowTableInput'
          examples:
            basic:
              summary: Create a ServiceNow enrichment integration
              value:
                name: Production CMDB Integration
                description: Enrichment data from production ServiceNow instance
                cmdb_tables:
                  - display_name: Network Switches
                    ci_table_name: cmdb_ci_ip_switch
                    query_filter: operational_status=1
                    field_mappings:
                      - servicenow_field: name
                        event_field: source
                      - servicenow_field: operational_status
                        event_field: Operational Status
                      - servicenow_field: support_group
                        event_field: Support Group
                      - servicenow_field: sys_class_name
                        event_field: CI Class
            multipleQueryFields:
              summary: Match on multiple query fields
              description: 'Designate more than one mapping as a query field with `type: query`. A CI is matched only when the event contains a value for every query field (here, both `host` and `ci_class`). The remaining mappings provide enrichment data.'
              value:
                name: Production CMDB Integration
                description: Match CIs on both host name and CI class
                cmdb_tables:
                  - display_name: Servers
                    ci_table_name: cmdb_ci_server
                    query_filter: operational_status=1
                    field_mappings:
                      - servicenow_field: name
                        event_field: host
                        type: query
                      - servicenow_field: sys_class_name
                        event_field: ci_class
                        type: query
                      - servicenow_field: support_group
                        event_field: Support Group
                      - servicenow_field: location
                        event_field: Location
    ServiceNowTablePostRequest:
      description: The CMDB table configuration to add to the integration.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - cmdb_table
            properties:
              cmdb_table:
                $ref: '#/components/schemas/ServiceNowTableInput'
          examples:
            basic:
              summary: Add a CMDB table
              value:
                cmdb_table:
                  display_name: Windows Servers
                  ci_table_name: cmdb_ci_win_server
                  query_filter: null
                  field_mappings:
                    - servicenow_field: name
                      event_field: source
                    - servicenow_field: category
                      event_field: category
                    - servicenow_field: fault_count
                      event_field: fault count
                    - servicenow_field: cost_cc
                      event_field: cost cc
    ServiceNowTablePutRequest:
      description: The replacement CMDB table configuration. This is a full replacement — all fields, including `ci_table_name` and the complete `field_mappings` list, must be provided. A table can only be updated while its sync is disabled and before its initial backfill has started.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - cmdb_table
            properties:
              cmdb_table:
                $ref: '#/components/schemas/ServiceNowTableInput'
          examples:
            basic:
              summary: Update a CMDB table configuration
              value:
                cmdb_table:
                  display_name: Production Network Switches
                  ci_table_name: cmdb_ci_ip_switch
                  query_filter: operational_status=1^u_environment=production
                  field_mappings:
                    - servicenow_field: name
                      event_field: source
                    - servicenow_field: operational_status
                      event_field: Operational Status
                    - servicenow_field: sys_class_name
                      event_field: CI Class
                    - servicenow_field: support_group.name
                      event_field: Support Team
    ServiceNowCredentialsPostRequest:
      description: The ServiceNow credentials to create. Only one credential set is allowed per account.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - credentials
            properties:
              credentials:
                $ref: '#/components/schemas/ServiceNowCredentialsInput'
          examples:
            basic:
              summary: Create ServiceNow credentials
              value:
                credentials:
                  instance_endpoint: https://your-instance.service-now.com
                  user: integration_user
                  password: YOUR_SERVICENOW_PASSWORD
    ServiceNowCredentialsPutRequest:
      description: The credential fields to update. Supports partial updates — only the fields provided are changed.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - credentials
            properties:
              credentials:
                $ref: '#/components/schemas/ServiceNowCredentials'
          examples:
            basic:
              summary: Update ServiceNow credentials
              value:
                credentials:
                  instance_endpoint: https://your-instance.service-now.com
                  password: YOUR_NEW_SERVICENOW_PASSWORD
    EnrichmentQueryPostRequest:
      description: The schema and query field values to match enrichment records against.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - schema_id
              - query
            properties:
              schema_id:
                type: string
                format: uuid
                description: The ID of the enrichment schema to query.
              query:
                type: array
                minItems: 1
                maxItems: 3
                description: The query field values to match against. Up to 3 query fields may be supplied; all must match.
                items:
                  type: object
                  required:
                    - field
                    - value
                  properties:
                    field:
                      type: string
                      description: The query field name.
                    value:
                      type: string
                      description: The value to match for this field.
          examples:
            basic:
              summary: Query enrichment data
              value:
                schema_id: 9f194d8d-0f58-4c5c-b1d2-a5adf7171821
                query:
                  - field: Application
                    value: Authorization
                  - field: Environment
                    value: production
    EnrichmentSchemaPostRequest:
      description: The enrichment schema to create. Provide a JSON body to define the schema explicitly, or upload a CSV file (as `multipart/form-data` or `text/csv`) to auto-generate a schema in which the first column becomes the query field and the remaining columns become enriched fields. CSV uploads are limited to 10 MB.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - fields
            properties:
              integration_type:
                type: string
                description: The schema source. Only `CSV` is supported through the API; the schema is always recorded as `CSV` regardless of the value sent.
                enum:
                  - CSV
              name:
                type: string
                maxLength: 50
                description: Display name of the enrichment schema.
              description:
                type: string
                maxLength: 2048
                description: Description of this set of enrichment data.
              fields:
                type: array
                minItems: 2
                maxItems: 25
                description: The schema fields. Must include 1-3 query fields and at least one enriched field, up to 25 fields total. Field names must be unique (case-insensitive).
                items:
                  type: object
                  required:
                    - name
                    - type
                  properties:
                    name:
                      type: string
                      maxLength: 256
                      description: The name of the field. Must be unique within the schema (case-insensitive).
                    type:
                      type: string
                      description: How the field is used. `query` fields match incoming events to records (case-insensitive); `enriched` fields carry the data added to a matched event.
                      enum:
                        - query
                        - enriched
          examples:
            basic:
              summary: Create a schema with multiple query fields
              value:
                integration_type: CSV
                name: Application Environment Enrichment
                description: Maps applications to team and runbook info by environment
                fields:
                  - name: Application
                    type: query
                  - name: Environment
                    type: query
                  - name: Manager
                    type: enriched
                  - name: Team
                    type: enriched
                  - name: Runbook URL
                    type: enriched
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: The CSV file to upload (max 10 MB). The schema name is derived from the filename.
        text/csv:
          schema:
            type: string
            description: The raw CSV content (max 10 MB). Provide the filename via the `filename` query parameter.
    EnrichmentSchemaPutRequest:
      description: The schema fields to update. At least one of `name` or `description` must be provided.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - schema
            properties:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    maxLength: 50
                    description: Display name of the enrichment schema.
                  description:
                    type: string
                    maxLength: 2048
                    description: Description of this set of enrichment data.
          examples:
            basic:
              summary: Rename a schema
              value:
                schema:
                  name: Team Leads and Runbooks
                  description: Attaches SME and Runbook URLs to incidents
    EnrichmentRecordsCsvUploadRequest:
      description: 'The CSV file to upload into the schema, as `multipart/form-data` or `text/csv`. The file is streamed for asynchronous processing and is limited to 10 MB. The CSV columns must align with the schema''s fields: missing columns result in empty values and extra columns are ignored. Records are keyed by their query-field values, so uploading a row whose query values match an existing record updates that record.'
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: The CSV file to upload (max 10 MB).
        text/csv:
          schema:
            type: string
            description: The raw CSV content (max 10 MB). Optionally provide the filename via the `filename` query parameter.
    EventEnrichmentPostRequest:
      description: The Event Enrichment to create.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - event_enrichment
            properties:
              event_enrichment:
                $ref: '#/components/schemas/EventEnrichment'
          examples:
            basic:
              summary: Create a new Event Enrichment
              value:
                event_enrichment:
                  name: 1st Event Enrichment
                  description: My very first EE!
                  team:
                    id: PA5JAKW
    EventEnrichmentDefaultPutRequest:
      description: 'The Event Enrichment to set as the account default. Set to `default: null` to clear the current default.'
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              default:
                nullable: true
                type: object
                description: A reference to an Event Enrichment object.
                properties:
                  id:
                    type: string
                    description: The ID of the Event Enrichment.
                  type:
                    type: string
                    description: A string that determines the schema of the object.
                    enum:
                      - event_enrichment_reference
                  summary:
                    type: string
                    description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
                    readOnly: true
                  self:
                    type: string
                    format: url
                    description: The API show URL at which the object is accessible.
                    readOnly: true
          examples:
            set_default:
              summary: Set a new account default
              value:
                default:
                  id: AGN4PVDO2F5AZIVWETZ42I6IP4
                  type: event_enrichment_reference
            clear_default:
              summary: Clear the current account default
              value:
                default: null
    EventEnrichmentPutRequest:
      description: The Event Enrichment fields to update.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - event_enrichment
            properties:
              event_enrichment:
                $ref: '#/components/schemas/EventEnrichment'
          examples:
            basic:
              summary: Update an Event Enrichment
              value:
                event_enrichment:
                  name: Event Enrichment - Updated Name
                  description: New Description
                  team:
                    id: PUBG4NJ
    EventEnrichmentAssociationPostRequest:
      description: The associations to add to the Event Enrichment.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - associations
            properties:
              associations:
                type: array
                items:
                  $ref: '#/components/schemas/EventEnrichmentAssociation'
          examples:
            basic:
              summary: Associate a Service and an Event Orchestration
              value:
                associations:
                  - type: service_reference
                    id: PVBHKC1
                  - type: event_orchestration_reference
                    id: af3d4d66-4a34-46c6-9a3c-7d5d8bd8eeeb
    EventEnrichmentAssociationDeleteRequest:
      description: The associations to remove from the Event Enrichment.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - associations
            properties:
              associations:
                type: array
                items:
                  $ref: '#/components/schemas/EventEnrichmentAssociation'
          examples:
            basic:
              summary: Remove a Service and an Event Orchestration association
              value:
                associations:
                  - type: service_reference
                    id: PVBHKC1
                  - type: event_orchestration_reference
                    id: af3d4d66-4a34-46c6-9a3c-7d5d8bd8eeeb
    EventEnrichmentRulesPutRequest:
      description: The updated Event Enrichment rules configuration.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - orchestration_path
            properties:
              orchestration_path:
                $ref: '#/components/schemas/EventEnrichmentOrchestrationPath'
          examples:
            with_extractions:
              summary: Update rules with an extraction action
              value:
                orchestration_path:
                  sets:
                    - id: start
                      rules:
                        - label: Extract server name from event source
                          conditions:
                            - expression: event.summary matches part 'Application:'
                          actions:
                            extractions:
                              - target: event.custom_details.server_name
                                template: '[production] {{event.source}}'
            with_enrichments:
              summary: Update rules with an enrichment action
              value:
                orchestration_path:
                  sets:
                    - id: start
                      rules:
                        - label: Enrich events that have an `Application:` in their summary
                          conditions:
                            - expression: event.summary matches part 'Application:'
                          actions:
                            enrichments:
                              - schema_to_search: 9f194d8d-0f58-4c5c-b1d2-a5adf7171821
                                search_values:
                                  - path: event.custom_details.app
                                    query_field_name: app_name
                                target: event.custom_details.app_metadata
