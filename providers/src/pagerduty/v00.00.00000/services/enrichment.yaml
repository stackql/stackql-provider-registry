    ServiceNowFieldMappingInput:
      type: object
      required:
        - servicenow_field
        - event_field
      properties:
        servicenow_field:
          type: string
          description: The ServiceNow field (column) to read the value from. Dot-walked fields are supported to traverse relationships (for example, `support_group.manager.email`).
        event_field:
          type: string
          description: The event field that the ServiceNow value is mapped to.
        type:
          type: string
          description: Set to `query` to use this mapping as a lookup key for matching incoming events to Configuration Items. Omit it for enrichment fields (the default). At most 3 mappings may be marked `query`, and at least one mapping must be left as an enrichment field. When no mapping is marked `query`, the `name` field is used as the query field automatically. Only `query` is accepted here — any other value is rejected.
          enum:
            - query
    ServiceNowFieldMapping:
      type: object
      required:
        - servicenow_field
        - event_field
      properties:
        servicenow_field:
          type: string
          description: The ServiceNow field (column) to read the value from. Dot-walked fields are supported to traverse relationships (for example, `support_group.manager.email`).
        event_field:
          type: string
          description: The event field that the ServiceNow value is mapped to.
        type:
          type: string
          description: 'Determines how the field is used during enrichment. `enriched` fields add contextual data to a matched event, while `query` fields are used to match incoming events to Configuration Items. When no mapping specifies a `type`, the field defaults to `enriched` and the `name` field is automatically used as the single query field. To match on a different field — or on more than one field — set `type: query` on those mappings; in that mode `name` is no longer used as a query field unless it is itself marked `query`. Up to 3 query fields may be configured, and when more than one is set an event must contain a matching value for every query field to be enriched (logical AND). At least one mapping must be an enriched field. In responses, a mapping''s `type` is `query`, `enriched`, or `discriminator`. `discriminator` is assigned automatically to the `sys_id` field of `cmdb_rel_ci` relationship tables to distinguish relationship types; it appears in responses but cannot be set on requests.'
          enum:
            - query
            - enriched
            - discriminator
    EnrichmentField:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          maxLength: 256
          description: The name of the field. Unique within the schema (case-insensitive).
        type:
          type: string
          description: How the field is used during enrichment. `query` fields are used to match incoming events to enrichment records (matching is case-insensitive), and `enriched` fields carry the contextual data added to a matched event. A schema has 1-3 query fields and at least one enriched field. `discriminator` is reserved for internal use (for example, by the ServiceNow CMDB integration).
          enum:
            - query
            - enriched
            - discriminator
    EventEnrichmentRule:
      type: object
      properties:
        id:
          type: string
          description: The ID of this rule.
          readOnly: true
        label:
          type: string
          description: A description of this rule's purpose.
        conditions:
          type: array
          description: Conditions that must be satisfied for this rule's actions to execute.
          items:
            type: object
            properties:
              expression:
                type: string
                description: A PCL condition expression.
                example: event.summary matches part 'my service error'
        actions:
          description: Actions to perform when the rule conditions are met. Must be one of `extractions` or `enrichments`.
          type: object
          title: Extractions
          required:
            - extractions
            - enrichments
          properties:
            extractions:
              type: array
              description: Modify the event payload using regex-based extraction or template-based composition. Maximum 25 extractions per rule.
              items:
                type: object
                properties:
                  target:
                    type: string
                    description: The PD-CEF field to set with the extracted value.
                  template:
                    type: string
                    nullable: true
                    description: A string template used to populate the target field. Supports event field interpolation. Used for template-based extraction.
                  source:
                    type: string
                    description: The path to the event field where the regex will be applied. Used for regex-based extraction.
                  regex:
                    type: string
                    description: A RE2 regular expression. If it contains capture groups, their values are extracted and appended. If no capture groups, the whole match is used. Used for regex-based extraction.
            enrichments:
              type: array
              description: Query a CDP enrichment schema using event values and write results back into the event payload. Maximum 1 enrichment action per rule; maximum 5 enrichment actions applied per event per Event Enrichment.
              items:
                type: object
                properties:
                  schema_to_search:
                    type: string
                    description: The ID of the Enrichment Schema to query.
                  search_values:
                    type: array
                    description: Configurations that specify how to read values from the event to query the Enrichment Schema.
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: The PD-CEF field whose value is used to search the Enrichment Schema. Used for path-based configuration.
                        template:
                          type: string
                          description: A string template used to build the search value. Supports event field interpolation. Used for template-based configuration.
                        query_field_name:
                          type: string
                          description: The name of the Enrichment Schema field to search against. Must be a field of type `query`.
                  target:
                    type: string
                    description: The PD-CEF field to set with the data retrieved from the Enrichment Schema.
        disabled:
          type: boolean
          description: Indicates whether the rule is disabled and would therefore not be evaluated.
