openapi: 3.0.2
info:
  title: PagerDuty API - Enrichment
  description: 'Contextual data enrichment: ServiceNow integrations, enrichment schemas and records, and event enrichments.'
  version: 2.0.0
paths:
  /enrichment/integrations/servicenow:
    get:
      tags:
        - Enrichment Integrations
      summary: List ServiceNow integrations
      x-pd-requires-scope: contextual_data.read
      operationId: listServiceNowIntegrations
      description: |
        Lists the ServiceNow enrichment integrations for the account, including their CMDB tables, field mappings, and credentials. Because only one integration is allowed per account, this returns at most one integration.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.read`
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/ServiceNowIntegrationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Enrichment Integrations
      summary: Create a ServiceNow integration
      x-pd-requires-scope: contextual_data.write
      operationId: createServiceNowIntegration
      description: |
        Creates a ServiceNow enrichment integration with one or more CMDB table configurations. Only one integration is allowed per account. Each CMDB table must define between 2 and 20 field mappings, and an integration may contain at most 8 tables. Credentials are managed separately through the credentials endpoints.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters: []
      requestBody:
        $ref: '#/components/requestBodies/ServiceNowIntegrationPostRequest'
      responses:
        '201':
          $ref: '#/components/responses/ServiceNowIntegrationPostResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List and create ServiceNow enrichment integrations.
  /enrichment/integrations/servicenow/{integration_id}:
    get:
      tags:
        - Enrichment Integrations
      summary: Get a ServiceNow integration
      x-pd-requires-scope: contextual_data.read
      operationId: getServiceNowIntegration
      description: |
        Retrieves a single ServiceNow enrichment integration by ID, including its CMDB tables, field mappings, the current sync status of each table, and credentials.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.read`
      parameters:
        - $ref: '#/components/parameters/servicenow_integration_id'
      responses:
        '200':
          $ref: '#/components/responses/ServiceNowIntegrationGetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Enrichment Integrations
      summary: Delete a ServiceNow integration
      x-pd-requires-scope: contextual_data.write
      operationId: deleteServiceNowIntegration
      description: |
        Deletes a ServiceNow enrichment integration, including all of its CMDB table configurations and their generated enrichment schemas, and disables any associated data synchronization.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/servicenow_integration_id'
      responses:
        '204':
          description: The ServiceNow integration was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Get and delete a specific ServiceNow enrichment integration.
  /enrichment/integrations/servicenow/{integration_id}/tables:
    post:
      tags:
        - Enrichment Integrations
      summary: Add a CMDB table
      x-pd-requires-scope: contextual_data.write
      operationId: addServiceNowTable
      description: |
        Adds a new ServiceNow CMDB table configuration to an existing integration. An integration may contain at most 8 tables. New tables are created with `status: disabled`; enable synchronization separately once the configuration has been validated.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/servicenow_integration_id'
      requestBody:
        $ref: '#/components/requestBodies/ServiceNowTablePostRequest'
      responses:
        '201':
          $ref: '#/components/responses/ServiceNowTablePostResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Add a CMDB table to a ServiceNow enrichment integration.
  /enrichment/integrations/servicenow/{integration_id}/tables/{table_id}:
    put:
      tags:
        - Enrichment Integrations
      summary: Update a CMDB table
      x-pd-requires-scope: contextual_data.write
      operationId: updateServiceNowTable
      description: |
        Replaces a ServiceNow CMDB table configuration. This is a full replacement — all fields, including `ci_table_name` and the complete `field_mappings` list, must be provided. A table can only be updated while its synchronization is disabled and before its initial backfill has started.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/servicenow_integration_id'
        - $ref: '#/components/parameters/servicenow_table_id'
      requestBody:
        $ref: '#/components/requestBodies/ServiceNowTablePutRequest'
      responses:
        '200':
          $ref: '#/components/responses/ServiceNowTablePutResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Enrichment Integrations
      summary: Remove a CMDB table
      x-pd-requires-scope: contextual_data.write
      operationId: deleteServiceNowTable
      description: |
        Removes a ServiceNow CMDB table configuration from an integration. The table's generated enrichment schema is removed and its data synchronization is disabled.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/servicenow_integration_id'
        - $ref: '#/components/parameters/servicenow_table_id'
      responses:
        '204':
          description: The CMDB table was removed successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Update and delete a CMDB table configuration.
  /enrichment/integrations/servicenow/{integration_id}/tables/{table_id}/enable:
    post:
      tags:
        - Enrichment Integrations
      summary: Enable CMDB table sync
      x-pd-requires-scope: contextual_data.write
      operationId: enableServiceNowTableSync
      description: |
        Enables data synchronization for a ServiceNow CMDB table configuration. Once enabled, the table's enrichment schema is populated with CI data from ServiceNow and kept up to date with periodic syncs. This operation is idempotent — enabling an already-enabled table succeeds.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/servicenow_integration_id'
        - $ref: '#/components/parameters/servicenow_table_id'
      responses:
        '200':
          $ref: '#/components/responses/ServiceNowTableEnableResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Enable data synchronization for a CMDB table.
  /enrichment/integrations/servicenow/{integration_id}/tables/{table_id}/test:
    get:
      tags:
        - Enrichment Integrations
      summary: Test a CMDB table
      x-pd-requires-scope: contextual_data.read
      operationId: testServiceNowTable
      description: |
        Validates a ServiceNow CMDB table configuration by running a live query against ServiceNow and returning up to 10 sample records. Use this before enabling synchronization to confirm that the credentials, table name, query filter, and mapped fields are correct. Records are returned keyed by ServiceNow field name.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.read`
      parameters:
        - $ref: '#/components/parameters/servicenow_integration_id'
        - $ref: '#/components/parameters/servicenow_table_id'
      responses:
        '200':
          $ref: '#/components/responses/ServiceNowTableTestResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Test a CMDB table configuration against live ServiceNow data.
  /enrichment/integrations/servicenow/credentials:
    post:
      tags:
        - Enrichment Integrations
      summary: Create ServiceNow credentials
      x-pd-requires-scope: contextual_data.write
      operationId: createServiceNowCredentials
      description: |
        Creates the ServiceNow API credentials used to authenticate synchronization and test requests. Only one credential set is allowed per account, and it is shared across the account's ServiceNow integration. The password is never returned in responses.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters: []
      requestBody:
        $ref: '#/components/requestBodies/ServiceNowCredentialsPostRequest'
      responses:
        '201':
          $ref: '#/components/responses/ServiceNowCredentialsPostResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Create ServiceNow credentials for the account.
  /enrichment/integrations/servicenow/credentials/{credentials_id}:
    get:
      tags:
        - Enrichment Integrations
      summary: Get ServiceNow credentials
      x-pd-requires-scope: contextual_data.read
      operationId: getServiceNowCredentials
      description: |
        Retrieves the ServiceNow credentials by ID. The password is never returned.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.read`
      parameters:
        - $ref: '#/components/parameters/servicenow_credentials_id'
      responses:
        '200':
          $ref: '#/components/responses/ServiceNowCredentialsGetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Enrichment Integrations
      summary: Update ServiceNow credentials
      x-pd-requires-scope: contextual_data.write
      operationId: updateServiceNowCredentials
      description: |
        Updates the ServiceNow credentials. Supports partial updates — only the fields provided in the request are changed. If a password is provided, it replaces the stored password. The password is never returned.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/servicenow_credentials_id'
      requestBody:
        $ref: '#/components/requestBodies/ServiceNowCredentialsPutRequest'
      responses:
        '200':
          $ref: '#/components/responses/ServiceNowCredentialsPutResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Enrichment Integrations
      summary: Delete ServiceNow credentials
      x-pd-requires-scope: contextual_data.write
      operationId: deleteServiceNowCredentials
      description: |
        Deletes the ServiceNow credentials. Credentials cannot be deleted while they are associated with an existing ServiceNow integration; delete the integration first.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/servicenow_credentials_id'
      responses:
        '204':
          description: The ServiceNow credentials were deleted successfully.
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Get, update, and delete ServiceNow credentials.
  /enrichment/query:
    post:
      tags:
        - Enrichment Schemas
      summary: Query enrichment data
      x-pd-requires-scope: contextual_data.read
      operationId: queryEnrichmentData
      description: |
        Query an enrichment schema for records matching a set of field values. Supply up to 3 query fields; all must match. Returns at most one record for standard schemas, or multiple records for schemas that use a discriminator field.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.read`
      parameters: []
      requestBody:
        $ref: '#/components/requestBodies/EnrichmentQueryPostRequest'
      responses:
        '200':
          $ref: '#/components/responses/EnrichmentQueryPostResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Query enrichment records by field values.
  /enrichment/schemas:
    get:
      tags:
        - Enrichment Schemas
      summary: List enrichment schemas
      x-pd-requires-scope: contextual_data.read
      operationId: listEnrichmentSchemas
      description: |
        Lists all enrichment schemas for the account.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.read`
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/EnrichmentSchemaListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Enrichment Schemas
      summary: Create an enrichment schema
      x-pd-requires-scope: contextual_data.write
      operationId: createEnrichmentSchema
      description: |
        Creates an enrichment schema. Provide a JSON body to define the schema explicitly (returns `201`), or upload a CSV file as `multipart/form-data` or `text/csv` to auto-generate a schema from the file's columns — the first column becomes a query field and the rest become enriched fields (returns `202` once the file is accepted for processing). A schema must include 1-3 query fields and at least one enriched field, up to 25 fields total, with unique (case-insensitive) field names. Schemas created through the API are always `CSV`, and an account may have at most 25 CSV schemas. CSV uploads are limited to 10 MB.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/enrichment_csv_filename'
      requestBody:
        $ref: '#/components/requestBodies/EnrichmentSchemaPostRequest'
      responses:
        '201':
          $ref: '#/components/responses/EnrichmentSchemaPostResponse'
        '202':
          $ref: '#/components/responses/EnrichmentSchemaCsvCreateResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List and create enrichment schemas.
  /enrichment/schemas/{schema_id}:
    get:
      tags:
        - Enrichment Schemas
      summary: Get an enrichment schema
      x-pd-requires-scope: contextual_data.read
      operationId: getEnrichmentSchema
      description: |
        Retrieves a specific enrichment schema by ID.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.read`
      parameters:
        - $ref: '#/components/parameters/enrichment_schema_id'
      responses:
        '200':
          $ref: '#/components/responses/EnrichmentSchemaGetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Enrichment Schemas
      summary: Update an enrichment schema
      x-pd-requires-scope: contextual_data.write
      operationId: updateEnrichmentSchema
      description: |
        Updates the name and/or description of an enrichment schema. At least one of `name` or `description` must be provided. Schema fields cannot be changed after creation.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/enrichment_schema_id'
      requestBody:
        $ref: '#/components/requestBodies/EnrichmentSchemaPutRequest'
      responses:
        '200':
          $ref: '#/components/responses/EnrichmentSchemaPutResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Enrichment Schemas
      summary: Delete an enrichment schema
      x-pd-requires-scope: contextual_data.write
      operationId: deleteEnrichmentSchema
      description: |
        Soft-deletes an enrichment schema and returns the deleted schema. Only `CSV` schemas can be deleted; `SERVICENOW` schemas are managed by the ServiceNow CMDB integration.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/enrichment_schema_id'
      responses:
        '200':
          $ref: '#/components/responses/EnrichmentSchemaDeleteResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Get, update, and delete a specific enrichment schema.
  /enrichment/schemas/{schema_id}/records:
    get:
      tags:
        - Enrichment Schemas
      summary: List enrichment records
      x-pd-requires-scope: contextual_data.read
      operationId: listEnrichmentRecords
      description: |
        Retrieves a page of enrichment records for a schema. Results are cursor-paginated.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.read`
      parameters:
        - $ref: '#/components/parameters/enrichment_schema_id'
        - $ref: '#/components/parameters/enrichment_records_limit'
        - $ref: '#/components/parameters/enrichment_records_cursor'
      responses:
        '200':
          $ref: '#/components/responses/EnrichmentRecordsListResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Enrichment Schemas
      summary: Upload CSV records
      x-pd-requires-scope: contextual_data.write
      operationId: uploadEnrichmentCsv
      description: |
        Uploads a CSV file of enrichment records into an existing schema, as `multipart/form-data` or `text/csv`. The file is accepted for asynchronous processing (returns `202`) and is limited to 10 MB. The CSV columns must align with the schema's fields: missing columns result in empty values and extra columns are ignored. Records are keyed by their query-field values, so uploading a row whose query values match an existing record updates that record.

        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. Contact your PagerDuty account team to request access.

        Scoped OAuth requires: `contextual_data.write`
      parameters:
        - $ref: '#/components/parameters/enrichment_schema_id'
        - $ref: '#/components/parameters/enrichment_csv_filename'
      requestBody:
        $ref: '#/components/requestBodies/EnrichmentRecordsCsvUploadRequest'
      responses:
        '202':
          $ref: '#/components/responses/EnrichmentRecordsCsvUploadResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List and upload enrichment records for a schema.
  /enrichment/schemas/{schema_id}/records/{record_id}:
    delete:
