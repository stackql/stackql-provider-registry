openapi: 3.0.2
info:
  title: PagerDuty API - Templates
  description: Message templates (status updates and other templated content).
  version: 2.0.0
paths:
  /templates:
    get:
      x-pd-requires-scope: templates.read
      tags:
        - Templates
      operationId: getTemplates
      description: |
        Get a list of all the template on an account

        Scoped OAuth requires: `templates.read`
      summary: List templates
      parameters:
        - $ref: '#/components/parameters/offset_limit'
        - $ref: '#/components/parameters/offset_offset'
        - $ref: '#/components/parameters/offset_total'
        - $ref: '#/components/parameters/template_query'
        - $ref: '#/components/parameters/template_type'
        - $ref: '#/components/parameters/sort_by_template'
      responses:
        '200':
          description: A paginated array of templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Template'
                required:
                  - templates
              examples:
                response:
                  summary: Response Example
                  value:
                    limit: 25
                    more: false
                    offset: 0
                    templates:
                      - created_at: '2022-12-30T16:00:00Z'
                        created_by:
                          id: PDZR4CN
                          self: https://api.pagerduty.com/users/PDZR4CN
                          type: user_reference
                        description: Sample template description
                        id: PBZUP2B
                        name: Sample Template 160
                        self: https://api.pagerduty.com/templates/PBZUP2B
                        template_type: status_update
                        type: template
                        updated_at: '2022-12-30T16:00:00Z'
                        updated_by:
                          id: PGY287N
                          self: https://api.pagerduty.com/users/PGY287N
                          type: user_reference
                    total: null
        '400':
          $ref: '#/components/responses/ArgumentError'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      x-pd-requires-scope: templates.write
      tags:
        - Templates
      operationId: createTemplate
      description: |
        Create a new template

        Scoped OAuth requires: `templates.write`
      summary: Create a template
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  $ref: '#/components/schemas/EditableTemplate'
              required:
                - template
            examples:
              request:
                summary: Request Example
                value:
                  template:
                    description: Sample template description
                    templated_fields:
                      email_body: <div> sample </div>
                      email_subject: Sample email Subject
                      message: Sample SMS message
                    name: Sample Template
                    template_type: status_update
        required: true
      responses:
        '201':
          description: Template successfully created
          content:
            application/json:
              x-type: true
              schema:
                type: object
                properties:
                  template:
                    $ref: '#/components/schemas/Template'
                required:
                  - template
              examples:
                response:
                  summary: Response Example
                  value:
                    template:
                      created_at: '2022-08-19T13:46:22Z'
                      created_by:
                        id: PF9KMXH
                        self: https://api.pagerduty.com/users/PF9KMXH
                        type: user_reference
                      description: Sample template description
                      templated_fields:
                        email_body: <div> sample </div>
                        email_subject: Sample email Subject
                        message: Sample SMS message
                      id: PCCR863
                      name: Sample Template
                      self: https://api.pagerduty.com/templates/PCCR863
                      template_type: status_update
                      type: template
                      updated_at: '2022-08-19T13:46:22Z'
                      updated_by:
                        id: PF9KMXH
                        self: https://api.pagerduty.com/users/PF9KMXH
                        type: user_reference
        '400':
          $ref: '#/components/responses/ArgumentError'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List and Create Templates
  /templates/{id}:
    get:
      x-pd-requires-scope: templates.read
      tags:
        - Templates
      operationId: getTemplate
      description: |
        Get a single template on the account

        Scoped OAuth requires: `templates.read`
      summary: Get a template
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    $ref: '#/components/schemas/Template'
                required:
                  - template
              examples:
                response:
                  summary: Response Example
                  value:
                    template:
                      created_at: '2022-12-30T16:00:00Z'
                      created_by:
                        id: PDZR4CN
                        self: https://api.pagerduty.com/users/PDZR4CN
                        type: user_reference
                      description: Sample template description
                      templated_fields:
                        email_body: <div> sample </div>
                        email_subject: Sample email Subject
                        message: Sample template message
                      id: PBZUP2B
                      name: Sample Template 160
                      self: https://api.pagerduty.com/templates/PBZUP2B
                      template_type: status_update
                      type: template
                      updated_at: '2022-12-30T16:00:00Z'
                      updated_by:
                        id: PGY287N
                        self: https://api.pagerduty.com/users/PGY287N
                        type: user_reference
        '400':
          $ref: '#/components/responses/ArgumentError'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      x-pd-requires-scope: templates.write
      tags:
        - Templates
      operationId: updateTemplate
      description: |
        Update an existing template

        Scoped OAuth requires: `templates.write`
      summary: Update a template
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  $ref: '#/components/schemas/EditableTemplate'
              required:
                - template
            examples:
              request:
                summary: Request Example
                value:
                  template:
                    description: Sample template description
                    templated_fields:
                      email_body: <div> sample </div>
                      email_subject: Sample email Subject
                      message: Sample SMS message
                    name: Sample Template
                    template_type: status_update
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    $ref: '#/components/schemas/Template'
                required:
                  - template
              examples:
                response:
                  summary: Response Example
                  value:
                    template:
                      created_at: '2022-08-19T13:46:22Z'
                      created_by:
                        id: PF9KMXH
                        self: https://api.pagerduty.com/users/PF9KMXH
                        type: user_reference
                      description: Sample template description
                      templated_fields:
                        email_body: <div> sample </div>
                        email_subject: Sample email Subject
                        message: Sample SMS message
                      id: PCCR863
                      name: Sample Template
                      self: https://api.pagerduty.com/templates/PCCR863
                      template_type: status_update
                      type: template
                      updated_at: '2022-08-19T13:46:22Z'
                      updated_by:
                        id: PF9KMXH
                        self: https://api.pagerduty.com/users/PF9KMXH
                        type: user_reference
        '400':
          $ref: '#/components/responses/ArgumentError'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      x-pd-requires-scope: templates.write
      tags:
        - Templates
      operationId: deleteTemplate
      description: |
        Delete a specific of templates on the account

        Scoped OAuth requires: `templates.write`
      summary: Delete a template
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Successful operation
        '400':
          $ref: '#/components/responses/ArgumentError'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Update and Delete Templates
  /templates/{id}/render:
    post:
      x-pd-requires-scope: templates.read
      tags:
        - Templates
      operationId: renderTemplate
      summary: Render a template
      description: |
        Render a template. This endpoint has a variable request body depending on the template type. For the `status_update` template type, the caller will provide the incident id, and a status update message.

        Scoped OAuth requires: `templates.read`
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                incident_id:
                  type: string
                  description: The incident id to render the template for
                status_update:
                  type: object
                  properties:
                    message:
                      type: string
                      description: An optional status update message that will be sent to the template
                external:
                  description: An optional object collection that can be referenced in the template.
            examples:
              request:
                summary: Request Example
                value:
                  incident_id: QT4KHLK034QWE34
                  status_update:
                    message: Status update message
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderedTemplate'
              examples:
                response:
                  value:
                    templated_fields:
                      email_subject: 'Update: Status update message'
                      email_body: <div class="test">Status update message</div>
                      message: 'Update: Status update message'
                    warnings:
                      - email_body:
                          - '{{incident.bad_value}} does not exist.'
                    errors: []
        '400':
          $ref: '#/components/responses/ArgumentError'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /templates/fields:
    get:
      x-pd-requires-scope: templates.read
      tags:
        - Templates
      operationId: getTemplateFields
      description: |
        Get a list of fields that can be used on the account templates.

        Scoped OAuth requires: `templates.read`
      summary: List template fields
      parameters: []
      responses:
        '200':
          description: An array of template fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: array
                    items:
                      title: Field
                      type: object
                      properties:
                        data_type:
                          type: string
                          description: The kind of data the template field is allowed to contain.
                          enum:
                            - boolean
                            - integer
                            - float
                            - string
                            - datetime
                            - url
                        default_value:
                          type: string
                          description: The default value of the template field.
                          nullable: true
                        description:
                          type: string
                          description: A short description of the template field.
                          nullable: true
                        domain_name:
                          type: object
                          properties:
                            order:
                              type: integer
                            summary:
                              type: string
                        example:
                          type: string
                          description: An example value for the template field.
                          nullable: true
                        keyword:
                          type: string
                          nullable: true
                        summary:
                          type: string
                          description: A short summary of the template field.
                        type:
                          type: string
                          description: The type of template field.
                          enum:
                            - standard_field
                            - custom_field
                required:
                  - fields
              examples:
                response:
                  summary: Response Example
                  value:
                    fields:
                      - data_type: datetime
                        default_value: null
                        description: The time the incident was created.
                        domain:
                          order: 1
                          summary: Incident
                        example: '2023-11-22T07:12:50Z'
                        keyword: null
                        summary: incident.created_at
                        type: standard_field
                      - data_type: string
                        default_value: null
                        description: The name of the escalation policy attached to the service that the incident is on
                        domain:
                          order: 1
                          summary: Incident
                        example: Another Escalation Policy
                        keyword: name
                        summary: incident.escalation_policy.summary
                        type: standard_field
                      - data_type: string
                        default_value: default value
                        description: An account defined custom field
                        domain:
                          order: 1
                          summary: Incident
                        example: null
                        keyword: null
                        summary: incident.custom_field
                        type: custom_field
        '400':
          $ref: '#/components/responses/ArgumentError'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Pagination:
      type: object
      properties:
        offset:
          type: integer
          description: Echoes offset pagination property.
          readOnly: true
        limit:
          type: integer
          description: Echoes limit pagination property.
          readOnly: true
        more:
          type: boolean
          description: Indicates if there are additional records to return
          readOnly: true
        total:
          type: integer
          description: The total number of records matching the given query.
          nullable: true
          readOnly: true
    Template:
      type: object
      properties:
        template_type:
          type: string
          description: The type of template (`status_update` is the only supported template at this time)
          enum:
            - status_update
        name:
          type: string
          description: The name of the template
        description:
          type: string
          nullable: true
          description: Description of the template
        templated_fields:
          type: object
          properties:
            email_subject:
              type: string
              nullable: true
              description: The subject of the e-mail
            email_body:
              type: string
              nullable: true
              description: The HTML body of the e-mail message
            message:
              type: string
              nullable: true
              description: |-
                The short-message of the template (SMS, Push notification, Slack,
                etc)
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        type:
          type: string
          enum:
            - template
        created_by:
          description: User/Account object reference of the creator
          oneOf:
            - $ref: '#/components/schemas/UserReference'
            - type: object
              properties:
                id:
                  type: string
                  readOnly: true
                summary:
                  type: string
                  nullable: true
                  readOnly: true
                  description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
                type:
                  type: string
                  readOnly: true
                  description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
                self:
                  type: string
                  nullable: true
                  readOnly: true
                  format: url
                  description: the API show URL at which the object is accessible
                html_url:
                  type: string
                  nullable: true
                  readOnly: true
                  format: url
                  description: a URL at which the entity is uniquely displayed in the Web app
              required:
                - type
                - id
              description: (opaque JSON object)
        updated_by:
          description: User/Account object reference of the updator
          oneOf:
            - $ref: '#/components/schemas/UserReference'
            - type: object
              properties:
                id:
                  type: string
                  readOnly: true
                summary:
                  type: string
                  nullable: true
                  readOnly: true
                  description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
                type:
                  type: string
                  readOnly: true
                  description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
                self:
                  type: string
                  nullable: true
                  readOnly: true
                  format: url
                  description: the API show URL at which the object is accessible
                html_url:
                  type: string
                  nullable: true
                  readOnly: true
                  format: url
                  description: a URL at which the entity is uniquely displayed in the Web app
              required:
                - type
                - id
              description: (opaque JSON object)
    EditableTemplate:
      type: object
      properties:
        template_type:
          type: string
          description: The type of template (`status_update` is the only supported template at this time)
          enum:
            - status_update
        name:
          type: string
          description: The name of the template
        description:
          type: string
          nullable: true
          description: Description of the template
        templated_fields:
          type: object
          properties:
            email_subject:
              type: string
              nullable: true
              description: The subject of the e-mail
            email_body:
              type: string
              nullable: true
              description: The HTML body of the e-mail message
            message:
              type: string
              nullable: true
              description: |-
                The short-message of the template (SMS, Push notification, Slack,
                etc)
    StatusUpdateTemplateInput:
      type: object
      properties:
        incident_id:
          type: string
          description: The incident id to render the template for
        status_update:
          type: object
          properties:
            message:
              type: string
              description: An optional status update message that will be sent to the template
        external:
          description: An optional object collection that can be referenced in the template.
    RenderedTemplate:
      type: object
      properties:
        templated_fields:
          type: object
          properties:
            email_subject:
              type: string
              description: The rendered e-mail subject
            email_body:
              type: string
              description: The rendered e-mail body
            message:
              type: string
              description: The rendered short message (SMS, Push, Slack, etc)
        warnings:
          description: |-
            List of render warnings messages for each rendered field.
            (Ex:  ["{{incident.invalid_field}} does not exist."])
          type: object
          properties:
            email_subject:
              type: array
              description: List of warnings for email_subject
              items:
                type: string
            email_body:
              type: array
              description: List of warnings for email_body
              items:
                type: string
            message:
              type: array
              description: List of warnings for message field
              items:
                type: string
        errors:
          description: List of errors
          type: array
          items:
            type: string
    UserReference:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
      required:
        - type
        - id
      description: (opaque JSON object)
    Reference:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
      required:
        - type
        - id
      description: (opaque JSON object)
    Tag:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        label:
          type: string
          description: The label of the tag.
          maxLength: 191
      required:
        - label
        - type
      example:
        type: tag
        label: Batman
  responses:
    ArgumentError:
      description: Caller provided invalid arguments. Please review the response for error details. Retrying with the same arguments will *not* work.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    PaymentRequired:
      description: |
        Account does not have the abilities to perform the action. Please review the response for the required abilities.
        You can also use the [Abilities API](#resource_Abilities) to determine what features are available to your account.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    Forbidden:
      description: |
        Caller is not authorized to view the requested resource.
        While your authentication is valid, the authenticated user or token does not have permission to perform this action.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    InternalServerError:
      description: Internal Server Error the PagerDuty server experienced an error.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
