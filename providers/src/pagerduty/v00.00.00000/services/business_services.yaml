      operationId: deleteBusinessServicePriorityThresholds
      description: |
        Clears the Priority Threshold for the account.  If the priority threshold is cleared, any Incident with a Priority set will be able to impact Business Services.
        Scoped OAuth requires: `services.write`
      parameters: []
    put:
      x-pd-requires-scope: services.write
      summary: Set the Account-level priority threshold for Business Service impact.
      tags:
