      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  global_threshold:
                    type: object
                    properties:
                      id:
                        type: string
                      order:
                        type: number
                    required:
                      - id
                      - order
                required:
                  - global_threshold
              examples:
                response:
                  summary: Response Example
                  value:
                    global_threshold:
                      id: PTLNKGF
                      order: 256
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
