openapi: 3.0.2
info:
  title: PagerDuty API - Ip Allow Lists
  description: IP allow lists (early access).
  version: 2.0.0
paths:
  /ip_allow_lists:
    post:
      x-pd-requires-scope: ip_allow_lists.write
      tags:
        - IP Allow Lists
      summary: Create an IP allow list
      operationId: createIpAllowList
      description: |
        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. You must pass the `X-EARLY-ACCESS: ip-allow-lists` header on every request, and your account must be enrolled in the IP Allow Lists Early Access program. Contact your PagerDuty account team to request access.

        Create the account's IP allow list.

        Only Account Owners, Global Admins, and Account API Keys can call this endpoint.

        Scoped OAuth requires: `ip_allow_lists.write`
      parameters:
        - $ref: '#/components/parameters/ip_allow_list_early_access'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ip_allow_list
              properties:
                ip_allow_list:
                  $ref: '#/components/schemas/IpAllowList'
            examples:
              basic:
                summary: Create an enabled allow list
                value:
                  ip_allow_list:
                    type: ip_allow_list
                    state: enabled
                    cidr_entries:
                      - cidr: 192.168.1.0/24
                        description: Office VPN
      responses:
        '201':
          description: IP allow list created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ip_allow_list
                properties:
                  ip_allow_list:
                    $ref: '#/components/schemas/IpAllowList'
              examples:
                response:
                  $ref: '#/components/examples/IpAllowListResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      x-pd-requires-scope: ip_allow_lists.read
      tags:
        - IP Allow Lists
      summary: List IP allow lists
      operationId: listIpAllowLists
      description: |
        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. You must pass the `X-EARLY-ACCESS: ip-allow-lists` header on every request, and your account must be enrolled in the IP Allow Lists Early Access program. Contact your PagerDuty account team to request access.

        Return all IP allow lists for the account.

        Only Account Owners, Global Admins, and Account API Keys can call this endpoint.

        Scoped OAuth requires: `ip_allow_lists.read`
      parameters:
        - $ref: '#/components/parameters/ip_allow_list_early_access'
      responses:
        '200':
          description: IP allow lists retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ip_allow_lists
                properties:
                  ip_allow_lists:
                    type: array
                    maxItems: 1
                    items:
                      $ref: '#/components/schemas/IpAllowList'
              examples:
                response:
                  summary: Example response
                  value:
                    ip_allow_lists:
                      - id: AGIS47HYOV6BDODBTMQKMPQPHU
                        type: ip_allow_list
                        state: enabled
                        cidr_entries:
                          - cidr: 192.168.1.0/24
                            description: Office VPN
                          - cidr: 10.0.0.0/24
                            description: Data Center
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Manage the account's IP Allow List.
  /ip_allow_lists/{id}:
    get:
      x-pd-requires-scope: ip_allow_lists.read
      tags:
        - IP Allow Lists
      summary: Get an IP allow list
      operationId: getIpAllowList
      description: |
        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. You must pass the `X-EARLY-ACCESS: ip-allow-lists` header on every request, and your account must be enrolled in the IP Allow Lists Early Access program. Contact your PagerDuty account team to request access.

        Return the IP allow list with the given `id`.

        Only Account Owners, Global Admins, and Account API Keys can call this endpoint.

        Scoped OAuth requires: `ip_allow_lists.read`
      parameters:
        - $ref: '#/components/parameters/ip_allow_list_early_access'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: IP allow list retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ip_allow_list
                properties:
                  ip_allow_list:
                    $ref: '#/components/schemas/IpAllowList'
              examples:
                response:
                  $ref: '#/components/examples/IpAllowListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      x-pd-requires-scope: ip_allow_lists.write
      tags:
        - IP Allow Lists
      summary: Update an IP allow list
      operationId: updateIpAllowList
      description: |
        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. You must pass the `X-EARLY-ACCESS: ip-allow-lists` header on every request, and your account must be enrolled in the IP Allow Lists Early Access program. Contact your PagerDuty account team to request access.

        Update the IP allow list with the given `id`. The request body fully replaces the writable fields.

        Only Account Owners, Global Admins, and Account API Keys can call this endpoint.

        Scoped OAuth requires: `ip_allow_lists.write`
      parameters:
        - $ref: '#/components/parameters/ip_allow_list_early_access'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ip_allow_list
              properties:
                ip_allow_list:
                  $ref: '#/components/schemas/IpAllowList'
            examples:
              update:
                summary: Replace the allow list entries
                value:
                  ip_allow_list:
                    type: ip_allow_list
                    state: enabled
                    cidr_entries:
                      - cidr: 192.168.1.0/24
                        description: Office VPN
                      - cidr: 10.0.0.0/24
                        description: Data Center
      responses:
        '200':
          description: IP allow list updated successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ip_allow_list
                properties:
                  ip_allow_list:
                    $ref: '#/components/schemas/IpAllowList'
              examples:
                response:
                  $ref: '#/components/examples/IpAllowListResponse'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      x-pd-requires-scope: ip_allow_lists.write
      tags:
        - IP Allow Lists
      summary: Delete an IP allow list
      operationId: deleteIpAllowList
      description: |
        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. You must pass the `X-EARLY-ACCESS: ip-allow-lists` header on every request, and your account must be enrolled in the IP Allow Lists Early Access program. Contact your PagerDuty account team to request access.

        Delete the IP allow list with the given `id`. Subsequent `GET` and `PUT` requests for the same `id` will return `404`. The list is no longer enforced once deleted.

        Only Account Owners, Global Admins, and Account API Keys can call this endpoint.

        Scoped OAuth requires: `ip_allow_lists.write`
      parameters:
        - $ref: '#/components/parameters/ip_allow_list_early_access'
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: IP allow list deleted successfully. No response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Manage a specific IP Allow List for the account.
  /ip_allow_lists/{id}/audit/records:
    get:
      x-pd-requires-scope: audit_records.read
      tags:
        - IP Allow Lists
      operationId: listIpAllowListAuditRecords
      summary: List audit records for an IP allow list
      description: |
        <!-- theme: warning -->

        > ### Early Access
        > This API is in Early Access and may change at any time. You must pass the `X-EARLY-ACCESS: ip-allow-lists` header on every request, and your account must be enrolled in the IP Allow Lists Early Access program. Contact your PagerDuty account team to request access.

        The response will include audit records with changes that are made to the given IP allow list.

        The returned records are sorted by the `execution_time` from newest to oldest.

        See [`Cursor-based pagination`](https://developer.pagerduty.com/docs/rest-api-v2/pagination/) for instructions on how to paginate through the result set.

        For more information see the [Audit API Document](https://developer.pagerduty.com/docs/rest-api-v2/audit-records-api/).

        Scoped OAuth requires: `audit_records.read`
      parameters:
        - $ref: '#/components/parameters/ip_allow_list_early_access'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/cursor_limit'
        - $ref: '#/components/parameters/cursor_cursor'
        - $ref: '#/components/parameters/audit_since'
        - $ref: '#/components/parameters/audit_until'
      responses:
        '200':
          description: Records matching the query criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecordResponseSchema'
              examples:
                response:
                  summary: Response Example
                  value:
                    records:
                      - id: kRm-tyP
                        action: delete
                        actors:
                          - id: P8AC329
                            type: api_key_reference
                        details:
                          fields: []
                          references: []
                          resource:
                            id: B2KTPSXM5L42BFCNYJ73HRDQML
                            type: ip_allow_list_reference
                        execution_context:
                          request_id: 4e8c2a1f9b3d7e6c5a8b2c9d1e4f7a3b
                        execution_time: '2026-04-20T18:09:47.563218Z'
                        method:
                          type: api_token
                        root_resource:
                          id: B2KTPSXM5L42BFCNYJ73HRDQML
                          type: ip_allow_list_reference
                      - id: xQ4nVbS
                        action: update
                        actors:
                          - id: P8AC329
                            type: api_key_reference
                        details:
                          fields:
                            - name: state
                              value: enabled
                              before_value: disabled
                          references: []
                          resource:
                            id: B2KTPSXM5L42BFCNYJ73HRDQML
                            type: ip_allow_list_reference
                        execution_context:
                          request_id: 7b3a9c1d2e5f8a4b6c9d0e1f2a3b4c5d
                        execution_time: '2026-04-16T09:51:33.207614Z'
                        method:
                          type: api_token
                        root_resource:
                          id: B2KTPSXM5L42BFCNYJ73HRDQML
                          type: ip_allow_list_reference
                      - id: Hf8-zEm
