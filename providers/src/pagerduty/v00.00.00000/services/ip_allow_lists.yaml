          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: List audit records of changes made to the IP allow list.
components:
  schemas:
    IpAllowList:
      type: object
      description: |
        An IP allow list restricts access to a PagerDuty account's subdomain to a set
        of IPv4 CIDR ranges. Enforcement currently applies to web and mobile
        application traffic.
      properties:
        id:
          type: string
          description: |
            Unique identifier for the allow list
            (e.g. `AGIS47HYOV6BDODBTMQKMPQPHU`).
          readOnly: true
        type:
          type: string
          description: A string that determines the schema of the object.
          default: ip_allow_list
          enum:
            - ip_allow_list
          readOnly: true
        state:
          type: string
          description: |
            Whether the allow list is enforced for the account. When `enabled`, only
            requests from IPs matching one of the `cidr_entries` are permitted to
            access the subdomain. When `disabled`, the allow list is stored but not
            enforced.
          enum:
            - enabled
            - disabled
        cidr_entries:
          type: array
          description: |
            The CIDR ranges that are allowed when the allow list is `enabled`. Must
            be non-empty when `state` is `enabled`.
          maxItems: 100
          items:
            $ref: '#/components/schemas/CidrEntry'
      required:
        - state
        - cidr_entries
      example:
        id: AGIS47HYOV6BDODBTMQKMPQPHU
        type: ip_allow_list
        state: enabled
        cidr_entries:
          - cidr: 192.168.1.0/24
            description: Office VPN
          - cidr: 10.0.0.0/24
            description: Data Center
    AuditRecordResponseSchema:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        response_metadata:
          nullable: true
          anyOf:
            - $ref: '#/components/schemas/AuditMetadata'
        limit:
          type: integer
          description: The minimum of the `limit` parameter used in the request or the maximum request size of the API.
          readOnly: true
        next_cursor:
          type: string
          description: |
            An opaque string than will deliver the next set of results when provided as the `cursor` parameter in a subsequent request.  A `null` value for this field indicates that there are no additional results.
          example: dXNlcjaVMzc5V0ZYTlo=
          nullable: true
          readOnly: true
      required:
        - records
        - limit
        - next_cursor
    CidrEntry:
      type: object
      description: A single CIDR entry within an IP allow list.
      required:
        - cidr
      properties:
        cidr:
          type: string
          description: An IPv4 CIDR range. Each octet must be `0`-`255` and the mask must be between `1` and `32`.
          pattern: ^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)/([1-9]|[12]\d|3[0-2])$
          example: 192.168.1.0/24
        description:
          type: string
          nullable: true
          description: An optional human-readable description for the entry. Limited to 64 characters.
          maxLength: 64
          example: Office VPN
    AuditRecord:
      type: object
      readOnly: true
      description: An Audit Trail record
      properties:
        id:
          type: string
        self:
          type: string
          nullable: true
          description: Record URL.
        execution_time:
          type: string
          format: date-time
          description: The date/time the action executed, in ISO8601 format and millisecond precision.
        execution_context:
          type: object
          description: Action execution context
          properties:
            request_id:
              type: string
              nullable: true
              description: Request Id
            remote_address:
              type: string
              nullable: true
              description: remote address
          nullable: true
        actors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Reference'
        method:
          type: object
          description: The method information
          properties:
            description:
              type: string
              nullable: true
            truncated_token:
              description: Truncated token containing the last 4 chars of the token's actual value.
              type: string
              nullable: true
              example: 3xyz
            type:
              type: string
              description: |
                Describes the method used to perform the action:

                `browser` -- authenticated user session. Session value is not returned in the `truncated_token` field.

                `oauth` -- access token obtained via the OAuth flow. Truncated token value is returned in the `truncated_token` field.

                `api_token` -- Pagerduty API token. Truncated token value is returned in the `truncated_token` field.

                `identity_provider` -- action performed by an Identity provider on behalf of a user. No value is returned in the `truncated_token` field.

                `other` -- Method that does not fall in the predefined categories. Truncated token value MAY be returned in the `truncated_token` field.
              enum:
                - browser
                - oauth
                - api_token
                - identity_provider
                - other
          required:
            - type
        root_resource:
          $ref: '#/components/schemas/Reference'
        action:
          type: string
          example: create
        details:
          type: object
          nullable: true
          description: |
            Additional details to provide further information about the action or
            the resource that has been audited.
          properties:
            resource:
              $ref: '#/components/schemas/Reference'
            fields:
              description: |
                A set of fields that have been affected.
                The fields that have not been affected MAY be returned.
              type: array
              nullable: true
              items:
                type: object
                description: |
                  Information about the affected field.
                  When available, field's before and after values are returned:
                    
                  #### Resource creation
                  - `value` MAY be returned

                  #### Resource update
                  - `value` MAY be returned
                  - `before_value` MAY be returned

                  #### Resource deletion
                  - `before_value` MAY be returned
                properties:
                  name:
                    type: string
                    description: Name of the resource field
                    example: name
                  description:
                    type: string
                    nullable: true
                    description: Human readable description of the resource field
                    example: First and Last name
                  value:
                    type: string
                    nullable: true
                    description: new or updated value of the field
                    example: Jonathan
                  before_value:
                    type: string
                    nullable: true
                    description: previous or deleted value of the field
                    example: John
                required:
                  - name
            references:
              description: A set of references that have been affected.
              type: array
              nullable: true
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Name of the reference field
                    example: team_members
                  description:
                    type: string
                    nullable: true
                    description: Human readable description of the references field
                    example: First and Last name
                  added:
                    type: array
                    nullable: true
                    items:
                      $ref: '#/components/schemas/Reference'
                  removed:
                    type: array
                    nullable: true
                    items:
                      $ref: '#/components/schemas/Reference'
                required:
                  - name
          required:
            - resource
      required:
        - id
        - execution_time
        - method
        - root_resource
        - action
    AuditMetadata:
      type: object
      properties:
        messages:
          type: array
          nullable: true
          items:
            type: string
            example: Message about the result
    CursorPagination:
      type: object
      properties:
        limit:
          type: integer
          description: The minimum of the `limit` parameter used in the request or the maximum request size of the API.
          readOnly: true
        next_cursor:
          type: string
          description: |
            An opaque string than will deliver the next set of results when provided as the `cursor` parameter in a subsequent request.  A `null` value for this field indicates that there are no additional results.
          example: dXNlcjaVMzc5V0ZYTlo=
          nullable: true
          readOnly: true
      required:
        - limit
        - next_cursor
    Reference:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
      required:
        - type
        - id
      description: (opaque JSON object)
    Tag:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        label:
          type: string
          description: The label of the tag.
          maxLength: 191
      required:
        - label
        - type
      example:
        type: tag
        label: Batman
  responses:
    ArgumentError:
      description: Caller provided invalid arguments. Please review the response for error details. Retrying with the same arguments will *not* work.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    Unauthorized:
      description: |
        Caller did not supply credentials or did not provide the correct credentials.
        If you are using an API key, it may be invalid or your Authorization header may be malformed.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    Forbidden:
      description: |
        Caller is not authorized to view the requested resource.
        While your authentication is valid, the authenticated user or token does not have permission to perform this action.
      content:
        application/json:
          schema:
            description: Generic error response from the PagerDuty API
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: integer
                    readOnly: true
                  message:
                    type: string
                    readOnly: true
                    description: Error message string
                  errors:
                    type: array
                    readOnly: true
                    items:
                      type: string
                      readOnly: true
                      description: Human-readable error details
                example:
                  message: Not Found
                  code: 2100
    NotFound:
      description: The requested resource was not found.
      content:
