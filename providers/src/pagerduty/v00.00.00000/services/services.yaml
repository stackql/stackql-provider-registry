              type: array
              description: Array of sub-conditions.
              items:
                type: object
                properties:
                  operator:
                    type: string
                    description: The type of operator to apply.
                    enum:
                      - exists
                      - nexists
                      - equals
                      - nequals
                      - contains
                      - ncontains
                      - matches
                      - nmatches
                  parameters:
                    type: object
                    properties:
                      path:
                        type: string
                        description: Path to a field in an event, in dot-notation.  For Event Rules on a serivce, this will have to be a PD-CEF field.
                      value:
                        type: string
                        description: Value to apply to the operator.
                      options:
                        type: string
                        description: Options to configure the operator. (opaque JSON object)
                    required:
                      - value
                      - path
                required:
                  - operator
                  - parameters
          required:
            - operator
            - subconditions
