    description: Retrieve and update service custom fields.
  /services/{id}/enablements:
    get:
      tags:
        - Services
      x-pd-requires-scope: services.read
      operationId: listServiceFeatureEnablements
      summary: Get Enablements for a Service
      description: |
        List all feature enablement settings for a service. Currently, only the `aiops` enablement is supported.

        For any account with the AIOps product addon, every service will have AIOps features enabled by default.

        **Warning conditions**:
        - If the account is not entitled to use AIOps features, a warning will be returned alongside the enablement data.

        Scoped OAuth requires: `services.read`
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The list of feature enablement settings for the service.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enablements:
                    type: array
                    description: Array of feature enablement settings.
                    items:
                      $ref: '#/components/schemas/FeatureEnablement'
              examples:
                success_response:
                  $ref: '#/components/examples/FeatureEnablementListResponseSuccess'
                response_with_warning:
                  $ref: '#/components/examples/FeatureEnablementListResponseWarningForService'
                default_response:
                  $ref: '#/components/examples/FeatureEnablementListResponseDefault'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Get Enablements for a Service.
  /services/{id}/enablements/{feature_name}:
    put:
      tags:
        - Services
      x-pd-requires-scope: services.write
      operationId: updateServiceFeatureEnablement
      summary: Update an Enablement for a Service
      description: |
        Update the feature enablement setting for a specific product addon on a service. This setting controls enabling or disabling the set of features contained within the addon.
        Currently, only `aiops` is supported as a valid feature enablement.

        **Warning conditions**:
        - If the account is not entitled to use AIOps features, the setting will be updated, but a warning will be returned.

        Scoped OAuth requires: `services.write`
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/enablement_feature_name'
      requestBody:
        description: The feature enablement setting to apply.
        content:
          application/json:
            schema:
              type: object
              properties:
                enablement:
                  $ref: '#/components/schemas/FeatureEnablement'
              required:
                - enablement
            examples:
              enable_aiops:
                $ref: '#/components/examples/FeatureEnablementPutRequestEnable'
              disable_aiops:
                $ref: '#/components/examples/FeatureEnablementPutRequestDisable'
      responses:
        '200':
          description: The feature enablement setting was updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enablement:
                    $ref: '#/components/schemas/FeatureEnablement'
              examples:
                success_response:
                  $ref: '#/components/examples/FeatureEnablementPutResponseSuccess'
                response_with_warning:
                  $ref: '#/components/examples/FeatureEnablementPutResponseWarningForService'
        '400':
          $ref: '#/components/responses/ArgumentError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    description: Update an Enablement for a Service.
components:
  schemas:
    Pagination:
      type: object
      properties:
        offset:
          type: integer
          description: Echoes offset pagination property.
          readOnly: true
        limit:
          type: integer
          description: Echoes limit pagination property.
          readOnly: true
        more:
          type: boolean
          description: Indicates if there are additional records to return
          readOnly: true
        total:
          type: integer
          description: The total number of records matching the given query.
          nullable: true
          readOnly: true
    Service:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        name:
          type: string
          description: The name of the service.
        description:
          type: string
          description: The user-provided description of the service.
        auto_resolve_timeout:
          type: integer
          description: Time in seconds that an incident is automatically resolved if left open for that long. Value is `null` if the feature is disabled. Value must not be negative. Setting this field to `0`, `null` (or unset in POST request) will disable the feature.
          default: 14400
        acknowledgement_timeout:
          type: integer
          description: Time in seconds that an incident changes to the Triggered State after being Acknowledged. Value is `null` if the feature is disabled. Value must not be negative. Setting this field to `0`, `null` (or unset in POST request) will disable the feature.
          default: 1800
        created_at:
          type: string
          format: date-time
          description: The date/time when this service was created
          readOnly: true
        status:
          type: string
          description: |
            The current state of the Service. Valid statuses are:


            - `active`: The service is enabled and has no open incidents. This is the only status a service can be created with.
            - `warning`: The service is enabled and has one or more acknowledged incidents.
            - `critical`: The service is enabled and has one or more triggered incidents.
            - `maintenance`: The service is under maintenance, no new incidents will be triggered during maintenance mode.
            - `disabled`: The service is disabled and will not have any new triggered incidents.
          enum:
            - active
            - warning
            - critical
            - maintenance
            - disabled
          default: active
        last_incident_timestamp:
          type: string
          format: date-time
          description: The date/time when the most recent incident was created for this service.
          readOnly: true
        escalation_policy:
          $ref: '#/components/schemas/EscalationPolicyReference'
        response_play:
          deprecated: true
          description: Response plays associated with this service.
        teams:
          type: array
          description: The set of teams associated with this service.
          items:
            $ref: '#/components/schemas/TeamReference'
          readOnly: true
        integrations:
          type: array
          description: An array containing Integration objects that belong to this service. If `integrations` is passed as an argument, these are full objects - otherwise, these are references.
          items:
            $ref: '#/components/schemas/IntegrationReference'
          readOnly: true
        incident_urgency_rule:
          $ref: '#/components/schemas/IncidentUrgencyRule'
        support_hours:
          $ref: '#/components/schemas/SupportHours'
        scheduled_actions:
          type: array
          description: An array containing scheduled actions for the service.
          items:
            $ref: '#/components/schemas/ScheduledAction'
        addons:
          type: array
          description: The array of Add-ons associated with this service.
          items:
            $ref: '#/components/schemas/AddonReference'
          readOnly: true
        alert_creation:
          type: string
          deprecated: true
          description: |
            Whether a service creates only incidents, or both alerts and incidents. A service must create alerts in order to enable incident merging.
            * "create_incidents" - The service will create one incident and zero alerts for each incoming event.
            * "create_alerts_and_incidents" - The service will create one incident and one associated alert for each incoming event.
            This attribute has been deprecated as all services will be migrated to use alerts and incidents. Afterward, the incident only service setting will no longer be available. For details, please refer to the knowledge base: https://support.pagerduty.com/docs/alerts#enable-and-disable-alerts-on-a-service.
          enum:
            - create_incidents
            - create_alerts_and_incidents
          default: create_alerts_and_incidents
        alert_grouping_parameters:
          description: Alert Grouping Parameters
          deprecated: true
          oneOf:
            - $ref: '#/components/schemas/AlertGroupingParameters'
            - type: object
              title: Alert Grouping Settings Reference
              deprecated: true
              description: When a service uses alert grouping configuration that is unsupported via the services api, and can only be configured via the [Alert Grouping Settings API](https://developer.pagerduty.com/api-reference/587edbc8ff416-create-an-alert-grouping-setting). The reference object includes the new location details for the service's Alert Grouping Setting. When an `alert_grouping_settings_reference` is included in a create or update request it will be ignored and no changes are applied to the service.
              properties:
                id:
                  type: string
                  readOnly: true
                  description: id of the related alert grouping setting
                type:
                  readOnly: true
                  type: string
                  description: type of reference eg. alert_grouping_setting_reference
                summary:
                  readOnly: true
                  type: string
                  description: an explanation of this reference
                self:
                  readOnly: true
                  type: string
                  description: link to api endpoint for this setting
                html_url:
                  readOnly: true
                  type: string
                  description: link to the ui page to edit the setting
        alert_grouping:
          type: string
          deprecated: true
          description: |
            Defines how alerts on this service will be automatically grouped into incidents. Note that the alert grouping features are available only on certain plans. There are three available options:
            * null - No alert grouping on the service. Each alert will create a separate incident;
            * "time" - All alerts within a specified duration will be grouped into the same incident. This duration is set in the `alert_grouping_timeout` setting (described below). Available on Standard, Enterprise, and Event Intelligence plans;
            * "intelligent" - Alerts will be intelligently grouped based on a machine learning model that looks at the alert summary, timing, and the history of grouped alerts. Available on Enterprise and Event Intelligence plans

            This attribute has been deprecated and configuration via [Alert Grouping Settings](https://developer.pagerduty.com/api-reference/587edbc8ff416-create-an-alert-grouping-setting) resource is encouraged.
          enum:
            - time
            - intelligent
        alert_grouping_timeout:
          type: integer
          deprecated: true
          description: |
            The duration in minutes within which to automatically group incoming alerts. This setting applies only when `alert_grouping` is set to `time`. To continue grouping alerts until the Incident is resolved, set this value to `0`.

            This attribute has been deprecated and configuration via [Alert Grouping Settings](https://developer.pagerduty.com/api-reference/587edbc8ff416-create-an-alert-grouping-setting) resource is encouraged.
        auto_pause_notifications_parameters:
          $ref: '#/components/schemas/AutoPauseNotificationsParameters'
      required:
        - type
        - escalation_policy
      example:
        id: PSI2I2O
        summary: string
        type: service
        self: string
        html_url: string
        name: My Web App
        description: My cool web application that does things.
        auto_resolve_timeout: 14400
        acknowledgement_timeout: 600
        status: active
        escalation_policy:
          id: PWIP6CQ
          type: escalation_policy_reference
        incident_urgency_rule:
          type: use_support_hours
          during_support_hours:
            type: constant
            urgency: high
          outside_support_hours:
            type: constant
            urgency: low
        support_hours:
          type: fixed_time_per_day
          time_zone: America/Lima
          start_time: '09:00:00'
          end_time: '17:00:00'
          days_of_week:
            - 1
            - 2
            - 3
            - 4
            - 5
        scheduled_actions:
          - type: urgency_change
            at:
              type: named_time
              name: support_hours_start
            to_urgency: high
        alert_creation: create_alerts_and_incidents
        auto_pause_notifications_parameters:
          enabled: true
          timeout: 300
    AuditRecordResponseSchema:
