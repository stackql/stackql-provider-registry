    AlertGroupingParameters:
      type: object
      title: Alert Grouping Parameters
      deprecated: true
      description: |
        Defines how alerts on this service will be automatically grouped into incidents. Note that the alert grouping features are available only on certain plans. To turn grouping off set the type to null.
        This attribute has been deprecated and configuration via [Alert Grouping Settings](https://developer.pagerduty.com/api-reference/587edbc8ff416-create-an-alert-grouping-setting) resource is encouraged.
      properties:
        type:
          type: string
          nullable: true
          enum:
            - time
            - intelligent
            - content_based
            - null
        config:
          type: object
          title: Intelligent Alert Grouping
          description: The configuration for Intelligent Alert Grouping. Note that this configuration is only available for certain plans.
          properties:
            time_window:
              type: integer
              minimum: 300
              maximum: 3600
              description: The maximum amount of time allowed between Alerts. Any Alerts arriving greater than `time_window` seconds apart will not be grouped together. This is a rolling time window and is counted from the most recently grouped alert. The window is extended every time a new alert is added to the group, up to 24 hours. To use the "recommended_time_window," set the value to 0, otherwise the value must be between 300 and 3600.
            recommended_time_window:
              readOnly: true
              type: integer
              description: In order to ensure your Service has the optimal grouping window, we use data science to calculate your Service's average Alert inter-arrival time. We encourage customers to use this value. Please set `time_window` to 0 to use the `recommended_time_window`.
            timeout:
              type: integer
              minimum: 1
              maximum: 1440
              description: The duration in minutes within which to automatically group incoming Alerts. To continue grouping Alerts until the Incident is resolved, set this value to 0.
            aggregate:
              type: string
              description: Whether Alerts should be grouped if `all` or `any` specified fields match. If `all` is selected, an exact match on every specified field name must occur for Alerts to be grouped. If `any` is selected, Alerts will be grouped when there is an exact match on at least one of the specified fields.
              enum:
                - all, any
            fields:
              type: array
              description: An array of strings which represent the fields with which to group against. Depending on the aggregate, Alerts will group if some or all the fields match.
              items:
                type: string
    AutoPauseNotificationsParameters:
      title: AutoPauseNotificationsParameters
      type: object
      description: Defines how alerts on this service are automatically suspended for a period of time before triggering, when identified as likely being transient. Note that automatically pausing notifications is only available on certain plans.
      properties:
        enabled:
          type: boolean
          default: false
          description: Indicates whether alerts should be automatically suspended when identified as transient
        timeout:
          type: integer
          enum:
            - 0
            - 120
            - 180
            - 300
            - 600
            - 900
          description: Indicates in seconds how long alerts should be suspended before triggering. To automatically select the recommended timeout for a service, set this value to `0`.
        recommended_timeout:
          type: integer
          enum:
            - 120
            - 180
            - 300
            - 600
            - 900
          description: The recommended timeout setting for this service based on prior alert patterns.
      example:
        enabled: true
        timeout: 300
    AuditRecord:
      type: object
      readOnly: true
      description: An Audit Trail record
      properties:
        id:
          type: string
        self:
          type: string
          nullable: true
          description: Record URL.
        execution_time:
          type: string
          format: date-time
          description: The date/time the action executed, in ISO8601 format and millisecond precision.
        execution_context:
          type: object
          description: Action execution context
          properties:
            request_id:
              type: string
              nullable: true
              description: Request Id
            remote_address:
              type: string
              nullable: true
              description: remote address
          nullable: true
        actors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Reference'
        method:
          type: object
          description: The method information
          properties:
            description:
              type: string
              nullable: true
            truncated_token:
              description: Truncated token containing the last 4 chars of the token's actual value.
              type: string
              nullable: true
              example: 3xyz
            type:
              type: string
              description: |
                Describes the method used to perform the action:

                `browser` -- authenticated user session. Session value is not returned in the `truncated_token` field.

                `oauth` -- access token obtained via the OAuth flow. Truncated token value is returned in the `truncated_token` field.

                `api_token` -- Pagerduty API token. Truncated token value is returned in the `truncated_token` field.

                `identity_provider` -- action performed by an Identity provider on behalf of a user. No value is returned in the `truncated_token` field.

                `other` -- Method that does not fall in the predefined categories. Truncated token value MAY be returned in the `truncated_token` field.
              enum:
                - browser
                - oauth
                - api_token
                - identity_provider
                - other
          required:
            - type
        root_resource:
          $ref: '#/components/schemas/Reference'
        action:
          type: string
          example: create
        details:
          type: object
          nullable: true
          description: |
            Additional details to provide further information about the action or
            the resource that has been audited.
          properties:
            resource:
              $ref: '#/components/schemas/Reference'
            fields:
              description: |
                A set of fields that have been affected.
                The fields that have not been affected MAY be returned.
              type: array
              nullable: true
              items:
                type: object
                description: |
                  Information about the affected field.
                  When available, field's before and after values are returned:
                    
                  #### Resource creation
                  - `value` MAY be returned

                  #### Resource update
                  - `value` MAY be returned
                  - `before_value` MAY be returned

                  #### Resource deletion
                  - `before_value` MAY be returned
                properties:
                  name:
                    type: string
                    description: Name of the resource field
                    example: name
                  description:
                    type: string
                    nullable: true
                    description: Human readable description of the resource field
                    example: First and Last name
                  value:
                    type: string
                    nullable: true
                    description: new or updated value of the field
                    example: Jonathan
                  before_value:
                    type: string
                    nullable: true
                    description: previous or deleted value of the field
                    example: John
                required:
                  - name
            references:
              description: A set of references that have been affected.
              type: array
              nullable: true
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Name of the reference field
                    example: team_members
                  description:
                    type: string
                    nullable: true
                    description: Human readable description of the references field
                    example: First and Last name
                  added:
                    type: array
                    nullable: true
                    items:
                      $ref: '#/components/schemas/Reference'
                  removed:
                    type: array
                    nullable: true
                    items:
                      $ref: '#/components/schemas/Reference'
                required:
                  - name
          required:
            - resource
      required:
        - id
        - execution_time
        - method
        - root_resource
        - action
