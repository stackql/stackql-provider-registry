      summary: Create a Ruleset
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleset:
                  type: object
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: ID of the Ruleset.
                    self:
                      type: string
                      format: url
                      description: the API show URL at which the object is accessible
                      readOnly: true
                    type:
                      type: string
                      readOnly: true
                      enum:
                        - global
                        - default_global
                    name:
                      type: string
                      description: Name of the Ruleset.
                    routing_keys:
                      type: array
                      readOnly: true
                      description: Routing keys routed to this Ruleset.
                      items:
                        type: string
                    created_at:
                      type: string
                      format: date-time
                      readOnly: true
                      description: The date the Ruleset was created at.
                    creator:
                      type: object
                      readOnly: true
                      description: Reference to the user that has created the Ruleset.
                      properties:
                        id:
                          type: string
                          readOnly: true
                        type:
                          type: string
                          description: A string that determines the schema of the object
                          readOnly: true
                        self:
                          type: string
                          format: url
                          description: The API show URL at which the object is accessible
                          readOnly: true
                    updated_at:
                      type: string
                      format: date-time
                      readOnly: true
                      description: The date the Ruleset was last updated.
                    updater:
                      type: object
                      readOnly: true
                      description: Reference to the user that has updated the Ruleset last.
                      properties:
                        id:
                          type: string
                          readOnly: true
                        type:
                          type: string
                          description: A string that determines the schema of the object
                          readOnly: true
                        self:
                          type: string
                          format: url
                          description: The API show URL at which the object is accessible
                          readOnly: true
                    team:
                      type: object
                      description: Reference to the team that owns the Ruleset. If none is specified, only admins have access.
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          description: A string that determines the schema of the object
                          readOnly: true
                        self:
                          type: string
                          format: url
                          description: The API show URL at which the object is accessible
                          readOnly: true
                      required:
                        - id
                        - type
                  example:
                    id: 0e84de00-9511-4380-9f4f-a7b568bb49a0
                    name: MySQL Clusters
                    type: global
                    routing_keys:
                      - R0212P1QXGEIQE2NMTQ7L7WXD00DWHIN
                    self: https://api.pagerduty.com/rulesets/0e84de00-9511-4380-9f4f-a7b568bb49a0
                    created_at: '2019-12-24T21:18:52Z'
                    creator:
                      type: user_reference
                      self: https://api.pagerduty.com/users/PABO808
                      id: PABO808
                    updated_at: '2019-12-25T14:54:23Z'
                    updater:
                      type: user_reference
                      self: https://api.pagerduty.com/users/PABO808
                      id: PABO808
                    team:
                      type: team_reference
                      self: https://api.pagerduty.com/teams/P3ZQXDF
                      id: P3ZQXDF
                  required:
                    - name
                  description: (opaque JSON object)
              required:
                - ruleset
            examples:
              request:
                summary: Request Example
                value:
                  ruleset:
                    name: MySQL Clusters
                    team:
                      id: PWL7QXS
                      type: team_reference
      responses:
        '201':
          description: The Ruleset that was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ruleset:
                    $ref: '#/components/schemas/Ruleset'
              examples:
                response:
                  summary: Response Example
                  value:
                    rulesets:
                      id: 0e84de00-9511-4380-9f4f-a7b568bb49a0
                      name: MySQL Clusters
                      type: global
                      routing_keys:
