  parameters:
    optional_session_configuration_type:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
          - mobile
          - web
      description: Session configuration type. If omitted, returns both mobile and web configurations.
    session_configuration_type:
      name: type
      in: query
      required: true
      schema:
        type: string
        enum:
          - mobile
          - web
      description: Session configuration type. This can be either 'mobile' or 'web', or a comma-separated list of both.
  x-stackQL-resources:
    session_configurations:
      id: pagerduty.session_configurations.session_configurations
      name: session_configurations
      title: Session Configurations
      methods:
