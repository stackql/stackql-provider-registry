openapi: 3.0.2
info:
  title: PagerDuty API - Session Configurations
  description: Account session configuration.
  version: 2.0.0
paths:
  /session_configurations:
    get:
      operationId: getSessionConfigurations
      x-pd-requires-scope: session_configurations.read
      summary: Get an account's session configurations
      description: |
        Retrieves session configurations for a PagerDuty account. Returns an array containing
        the requested configurations. If a specific type is requested, the array contains one item.
        If no type is specified, the array contains all available configurations (mobile and web).
        If no configurations exist, a 404 Not Found error will be returned.

        A Session Configuration needs to be created before it can be retrieved and used.

        Scoped OAuth requires: `session_configurations.read`
      tags:
        - Session Configurations
      parameters:
        - $ref: '#/components/parameters/optional_session_configuration_type'
      responses:
        '200':
          description: Session Configurations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_configurations:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - mobile
                            - web
                          description: The session configuration type (mobile or web)
                          example: web
                        absolute_session_ttl:
                          type: integer
                          description: Absolute session time to live in seconds
                          example: 3600
                          minimum: 600
                          maximum: 18144000
                        idle_session_ttl:
                          type: integer
                          description: Idle session time to live in seconds
                          example: 1800
                          minimum: 60
                          maximum: 86400
                      required:
                        - type
                        - absolute_session_ttl
                        - idle_session_ttl
                required:
                  - session_configurations
              examples:
                response:
                  summary: Session Configurations Example
                  value:
                    session_configurations:
                      - type: web
                        absolute_session_ttl: 3600
                        idle_session_ttl: 600
                      - type: mobile
                        absolute_session_ttl: 7200
                        idle_session_ttl: 1200
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      summary: Configure an account's session configurations
      operationId: updateSessionConfigurations
      x-pd-requires-scope: session_configurations.write
      description: |
        Creates or updates session configurations for a PagerDuty Account. The configurations will take effect immediately for new sessions, while existing sessions for the specified `types` are immediately revoked.

        Scoped OAuth requires: `session_configurations.write`
      tags:
        - Session Configurations
      parameters:
        - $ref: '#/components/parameters/session_configuration_type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_configuration:
                  type: object
                  properties:
                    absolute_session_ttl:
                      type: integer
                      description: Absolute session time to live in seconds
                      example: 3600
                      minimum: 600
                      maximum: 18144000
                    idle_session_ttl:
                      type: integer
                      description: Idle session time to live in seconds
                      example: 600
                      minimum: 60
                      maximum: 15552000
                  required:
                    - absolute_session_ttl
                    - idle_session_ttl
              required:
                - session_configuration
      responses:
        '200':
          description: Session Configurations updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_configurations:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - mobile
                            - web
                          description: The session configuration type (mobile or web)
                          example: web
                        absolute_session_ttl:
                          type: integer
                          description: Absolute session time to live in seconds
                          example: 3600
                          minimum: 600
                          maximum: 18144000
                        idle_session_ttl:
                          type: integer
                          description: Idle session time to live in seconds
                          example: 1800
                          minimum: 60
                          maximum: 86400
                      required:
                        - type
                        - absolute_session_ttl
                        - idle_session_ttl
                required:
                  - session_configurations
              examples:
                response:
                  summary: Put Session Configurations Example
                  value:
                    session_configurations:
                      - type: web
                        absolute_session_ttl: 3600
                        idle_session_ttl: 600
                      - type: mobile
                        absolute_session_ttl: 7200
                        idle_session_ttl: 1200
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      summary: Delete an account's session configurations.
      operationId: deleteSessionConfigurations
      x-pd-requires-scope: session_configurations.write
      description: |
        Deletes the session configurations for a PagerDuty account that was previously set.
        The type parameter is required and specifies which configurations to delete.
        A single type ('mobile' or 'web') or comma-separated list may be passed in.

        Scoped OAuth requires: `session_configurations.write`
      tags:
        - Session Configurations
      parameters:
        - $ref: '#/components/parameters/session_configuration_type'
      responses:
        '204':
          description: Session Configurations deleted successfully
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
