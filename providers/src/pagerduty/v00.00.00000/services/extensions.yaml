          last_status_change_by:
            id: PXPGF42
            type: user_reference
            summary: Earline Greenholt
            self: https://api.pagerduty.com/users/PXPGF42
            html_url: https://subdomain.pagerduty.com/users/PXPGF42
          first_trigger_log_entry:
            id: Q02JTSNZWHSEKV
            type: trigger_log_entry_reference
