openapi: 3.0.2
info:
  title: PagerDuty API - Extensions
  description: Extensions attach extension schema objects (webhooks, integrations) to services.
  version: 2.0.0
paths:
  /extensions:
    get:
      tags:
        - Extensions
      x-pd-requires-scope: extensions.read
      operationId: listExtensions
      description: |
        List existing extensions.

        Extensions are representations of Extension Schema objects that are attached to Services.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#extensions)

        Scoped OAuth requires: `extensions.read`
      summary: List extensions
      parameters:
        - $ref: '#/components/parameters/offset_limit'
        - $ref: '#/components/parameters/offset_offset'
        - $ref: '#/components/parameters/offset_total'
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/extension_object_id'
        - $ref: '#/components/parameters/extension_schema_id'
        - $ref: '#/components/parameters/include_extensions'
      responses:
        '200':
          description: A paginated array of extensions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: Echoes offset pagination property.
                    readOnly: true
                  limit:
                    type: integer
                    description: Echoes limit pagination property.
                    readOnly: true
                  more:
                    type: boolean
                    description: Indicates if there are additional records to return
                    readOnly: true
                  total:
                    type: integer
                    description: The total number of records matching the given query.
                    nullable: true
                    readOnly: true
                  extensions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Extension'
                required:
                  - extensions
              examples:
                response:
                  summary: Response Example
                  value:
                    extensions:
                      - id: PPGPXHO
                        self: https://api.pagerduty.com/extensions/PPGPXHO
                        endpoint_url: https://example.com/receive_a_pagerduty_webhook
                        name: My Webhook
                        summary: My Webhook
                        type: extension
                        extension_schema:
                          id: PJFWPEP
                          type: extension_schema_reference
                          summary: Generic Webhook
                          self: https://api.pagerduty.com/extension_schemas/PJFWPEP
                        extension_objects:
                          - id: PIJ90N7
                            type: service_reference
                            summary: My Application Service
                            self: https://api.pagerduty.com/services/PIJ90N7
                            html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
                    limit: 25
                    offset: 0
                    more: false
                    total: null
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Extensions
      x-pd-requires-scope: extensions.write
      operationId: createExtension
      description: |
        Create a new Extension.

        Extensions are representations of Extension Schema objects that are attached to Services.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#extensions)

        Scoped OAuth requires: `extensions.write`
      summary: Create an extension
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                extension:
                  $ref: '#/components/schemas/Extension'
              required:
                - extension
            examples:
              request:
                summary: Request Example
                value:
                  extension:
                    endpoint_url: https://example.com/receive_a_pagerduty_webhook
                    name: My Webhook
                    extension_schema:
                      id: PJFWPEP
                      type: extension_schema_reference
                    extension_objects:
                      - id: PIJ90N7
                        type: service_reference
              requestCustomHeaders:
                summary: Request Example with Custom Headers
                value:
                  extension:
                    endpoint_url: https://example.com/receive_a_pagerduty_webhook
                    name: My Webhook
                    extension_schema:
                      id: PJFWPEP
                      type: extension_schema_reference
                    extension_objects:
                      - id: PIJ90N7
                        type: service_reference
                    config:
                      headers:
                        - name: Authorization
                          value: Token token=super_secret_token_value
        description: The extension to be created
      responses:
        '201':
          description: The extension that was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  extension:
                    $ref: '#/components/schemas/Extension'
                required:
                  - extension
              examples:
                response:
                  summary: Response Example
                  value:
                    extension:
                      id: PPGPXHO
                      self: https://api.pagerduty.com/extensions/PPGPXHO
                      endpoint_url: https://example.com/receive_a_pagerduty_webhook
                      name: My Webhook
                      summary: My Webhook
                      type: extension
                      extension_schema:
                        id: PJFWPEP
                        type: extension_schema_reference
                        summary: Generic Webhook
                        self: https://api.pagerduty.com/extension_schemas/PJFWPEP
                      extension_objects:
                        - id: PIJ90N7
                          type: service_reference
                          summary: My Application Service
                          self: https://api.pagerduty.com/services/PIJ90N7
                          html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
      callbacks:
        webhookV2:
          endpoint_url:
            post:
              parameters: []
              tags:
                - Webhooks V2
              operationId: webhookV2
              description: Receive webhook indicating incident state has changed.
              summary: Receive webhook
              security: []
              responses:
                '200':
                  description: Your server implementation should return this if it successfuly received the webhook.
              requestBody:
                description: Webhook.
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        messages:
                          type: array
                          description: An array of webhook messages.
                          items:
                            $ref: '#/components/schemas/WebhookIncidentAction'
        webhookV1:
          endpoint_url:
            post:
              parameters: []
              tags:
                - Webhooks V1
              operationId: webhookV1
              description: Receive webhook indicating incident state has changed.
              summary: Receive webhook
              security: []
              responses:
                '200':
                  description: Your server implementation should return this if it successfuly received the webhook.
              requestBody:
                description: Webhook.
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/WebhooksV1Message'
    description: List and create extensions.
  /extensions/{id}:
    get:
      tags:
        - Extensions
      x-pd-requires-scope: extensions.read
      operationId: getExtension
      description: |
        Get details about an existing extension.

        Extensions are representations of Extension Schema objects that are attached to Services.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#extensions)

        Scoped OAuth requires: `extensions.read`
      summary: Get an extension
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/include_extensions_id'
      responses:
        '200':
          description: The extension that was requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  extension:
                    $ref: '#/components/schemas/Extension'
                required:
                  - extension
              examples:
                response:
                  summary: Response Example
                  value:
                    extension:
                      id: PPGPXHO
                      self: https://api.pagerduty.com/extensions/PPGPXHO
                      endpoint_url: https://example.com/receive_a_pagerduty_webhook
                      name: My Webhook
                      summary: My Webhook
                      type: extension
                      extension_schema:
                        id: PJFWPEP
                        type: extension_schema_reference
                        summary: Generic Webhook
                        self: https://api.pagerduty.com/extension_schemas/PJFWPEP
                      extension_objects:
                        - id: PIJ90N7
                          type: service_reference
                          summary: My Application Service
                          self: https://api.pagerduty.com/services/PIJ90N7
                          html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
                      temporarily_disabled: false
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Extensions
      x-pd-requires-scope: extensions.write
      operationId: deleteExtension
      description: |
        Delete an existing extension.

        Once the extension is deleted, it will not be accessible from the web UI and new incidents won't be able to be created for this extension.

        Extensions are representations of Extension Schema objects that are attached to Services.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#extensions)

        Scoped OAuth requires: `extensions.write`
      summary: Delete an extension
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: The extension was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Extensions
      x-pd-requires-scope: extensions.write
      operationId: updateExtension
      description: |
        Update an existing extension.

        Extensions are representations of Extension Schema objects that are attached to Services.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#extensions)

        Scoped OAuth requires: `extensions.write`
      summary: Update an extension
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                extension:
                  $ref: '#/components/schemas/Extension'
              required:
                - extension
            examples:
              request:
                summary: Request Example
                value:
                  extension:
                    endpoint_url: https://example.com/receive_a_pagerduty_webhook
                    name: My Webhook
                    extension_schema:
                      id: PJFWPEP
                      type: extension_schema_reference
                    extension_objects:
                      - id: PIJ90N7
                        type: service_reference
              requestCustomHeaders:
                summary: Request Example with Custom Headers
                value:
                  extension:
                    endpoint_url: https://example.com/receive_a_pagerduty_webhook
                    name: My Webhook
                    extension_schema:
                      id: PJFWPEP
                      type: extension_schema_reference
                    extension_objects:
                      - id: PIJ90N7
                        type: service_reference
                    config:
                      headers:
                        - name: Authorization
                          value: Token token=super_secret_token_value
        description: The extension to be updated.
      responses:
        '200':
          description: The extension that was updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  extension:
                    $ref: '#/components/schemas/Extension'
                required:
                  - extension
              examples:
                response:
                  summary: Response Example
                  value:
                    extension:
                      id: PPGPXHO
                      self: https://api.pagerduty.com/extensions/PPGPXHO
                      endpoint_url: https://example.com/receive_a_pagerduty_webhook
                      name: My Webhook
                      summary: My Webhook
                      type: extension
                      extension_schema:
                        id: PJFWPEP
                        type: extension_schema_reference
                        summary: Generic Webhook
                        self: https://api.pagerduty.com/extension_schemas/PJFWPEP
                      extension_objects:
                        - id: PIJ90N7
                          type: service_reference
                          summary: My Application Service
                          self: https://api.pagerduty.com/services/PIJ90N7
                          html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    description: Manage an extension.
  /extensions/{id}/enable:
    post:
      tags:
        - Extensions
      x-pd-requires-scope: extensions.write
      operationId: enableExtension
      description: |
        Enable an extension that is temporarily disabled. (This API does not require a request body.)

        Extensions are representations of Extension Schema objects that are attached to Services.

        For more information see the [API Concepts Document](https://developer.pagerduty.com/api-reference/a47605517c19a-api-concepts#extensions)

        Scoped OAuth requires: `extensions.write`
      summary: Enable an extension
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The extension that was successfully enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  extension:
                    $ref: '#/components/schemas/Extension'
                required:
                  - extension
              examples:
                response:
                  summary: Response Example
                  value:
                    extension:
                      id: PPGPXHO
                      self: https://api.pagerduty.com/extensions/PPGPXHO
                      endpoint_url: https://example.com/receive_a_pagerduty_webhook
                      name: My Webhook
                      summary: My Webhook
                      type: extension
                      extension_schema:
                        id: PJFWPEP
                        type: extension_schema_reference
                        summary: Generic Webhook
                        self: https://api.pagerduty.com/extension_schemas/PJFWPEP
                      extension_objects:
                        - id: PIJ90N7
                          type: service_reference
                          summary: My Application Service
                          self: https://api.pagerduty.com/services/PIJ90N7
                          html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
        '400':
          $ref: '#/components/responses/ArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    description: Enable an extension.
components:
  schemas:
    Pagination:
      type: object
      properties:
        offset:
          type: integer
          description: Echoes offset pagination property.
          readOnly: true
        limit:
          type: integer
          description: Echoes limit pagination property.
          readOnly: true
        more:
          type: boolean
          description: Indicates if there are additional records to return
          readOnly: true
        total:
          type: integer
          description: The total number of records matching the given query.
          nullable: true
          readOnly: true
    Extension:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        summary:
          type: string
          nullable: true
          readOnly: true
          description: A short-form, server-generated string that provides succinct, important information about an object suitable for primary labeling of an entity in a client. In many cases, this will be identical to `name`, though it is not intended to be an identifier.
        type:
          type: string
          readOnly: true
          description: A string that determines the schema of the object. This must be the standard name for the entity, suffixed by `_reference` if the object is a reference.
        self:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: the API show URL at which the object is accessible
        html_url:
          type: string
          nullable: true
          readOnly: true
          format: url
          description: a URL at which the entity is uniquely displayed in the Web app
        name:
          type: string
          description: The name of the extension.
        endpoint_url:
          type: string
          format: url
          description: The url of the extension.
        extension_objects:
          type: array
          description: The objects for which the extension applies
          items:
            $ref: '#/components/schemas/ServiceReference'
        extension_schema:
          $ref: '#/components/schemas/ExtensionSchemaReference'
        temporarily_disabled:
          type: boolean
          readOnly: true
          description: Whether or not this extension is temporarily disabled; for example, a webhook extension that is repeatedly rejected by the server.
          default: false
        config:
          type: string
          description: The object that contains extension configuration values depending on the extension schema specification. (opaque JSON object)
      required:
        - extension_objects
        - extension_schema
        - name
      example:
        id: PJU23I3
        endpoint_url: https://example.com/receive_a_pagerduty_webhook
        name: My Webhook
        summary: My Webhook
        type: extension
        extension_schema:
          id: PJFWPEP
          type: extension_schema_reference
        extension_objects:
          - id: PIJ90N7
            type: service_reference
        config:
          anykey: anyvalue
    WebhookIncidentAction:
      type: object
      description: A message containing information about a single PagerDuty action.
      readOnly: true
      properties:
        id:
          type: string
          format: uuid
          description: Uniquely identifies this outgoing webhook message; can be used for idempotency when processing the messages.
          readOnly: true
        triggered_at:
          type: string
          format: date-time
          description: The date/time when this message was was sent.
          readOnly: true
        webhook:
          $ref: '#/components/schemas/Webhook'
        type:
          type: string
          description: |
            The type of action being reported by this message. * `incident.trigger` - Sent when an incident is newly created/triggered. * `incident.acknowledge` - Sent when an incident is acknowledged by a user. * `incident.unacknowledge` - Sent when an incident is unacknowledged due to its acknowledgement timing out. * `incident.resolve` - Sent when an incident has been resolved. * `incident.assign` - Sent when an incident has been assigned to another user. Often occurs in concert with an `acknowledge`. * `incident.escalate` - Sent when an incident has been escalated to another user in the same escalation chain. * `incident.delegate` - Sent when an incident has been reassigned to another escalation policy. * `incident.annotate` - Sent when a note is created on an incident.
          enum:
            - incident.trigger
            - incident.acknowledge
            - incident.unacknowledge
            - incident.resolve
            - incident.assign
            - incident.escalate
            - incident.delegate
            - incident.annotate
        incident:
          $ref: '#/components/schemas/Incident'
        log_entries:
          type: array
          description: Log Entries that correspond to the action this Webhook is reporting. Includes the channels.
          items:
            oneOf:
              - $ref: '#/components/schemas/AcknowledgeLogEntry'
              - $ref: '#/components/schemas/AnnotateLogEntry'
              - $ref: '#/components/schemas/AssignLogEntry'
              - $ref: '#/components/schemas/DelegateLogEntry'
              - $ref: '#/components/schemas/EscalateLogEntry'
              - $ref: '#/components/schemas/ExhaustEscalationPathLogEntry'
              - $ref: '#/components/schemas/NotifyLogEntry'
              - $ref: '#/components/schemas/ReachAckLimitLogEntry'
              - $ref: '#/components/schemas/ReachTriggerLimitLogEntry'
              - $ref: '#/components/schemas/RepeatEscalationPathLogEntry'
              - $ref: '#/components/schemas/ResolveLogEntry'
              - $ref: '#/components/schemas/SnoozeLogEntry'
              - $ref: '#/components/schemas/TriggerLogEntry'
              - $ref: '#/components/schemas/UnacknowledgeLogEntry'
              - $ref: '#/components/schemas/UrgencyChangeLogEntry'
      example:
        id: bb4fcb00-6324-11e6-b9aa-22000affca53
        type: incident.resolve
        triggered_at: '2016-08-15T20:13:28Z'
        log_entries:
          - id: R0FFIOTKIU30MN7XWR99SI0
            type: resolve_log_entry
            summary: Resolved by Earline Greenholt
            self: https://api.pagerduty.com/log_entries/R0FFIOTKIU30MN7XWR99SI0
            html_url: null
            created_at: '2017-09-22T18:37:29+00:00'
            agent:
              id: PLMUP47
              type: user_reference
              summary: Earline Greenholt
              self: https://api.pagerduty.com/users/PXPGF42
              html_url: https://subdomain.pagerduty.com/users/PXPGF42
            channel:
              type: slack
              user:
                id: U60DQ6ZXY
                name: alisdair
              team:
                id: T029K7I8
                domain: subdomain
              channel:
                id: C6981DRAW
                name: subdomain-ops
            service:
              id: PN49J75
              type: service_reference
              summary: Cool Service
              self: https://api.pagerduty.com/services/PNTDJ30
              html_url: https://subdomain.pagerduty.com/service-directory/PNTDJ30
            incident:
              id: PVO5OB2
              type: incident_reference
              summary: The server is on fire.
              self: https://api.pagerduty.com/incidents/PT4KHLK
              html_url: https://subdomain.pagerduty.com/incidents/PT4KHLK
            teams:
              - id: PQ9K7I8
                type: team_reference
                summary: Engineering
                self: https://api.pagerduty.com/teams/PQ9K7I8
                html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
        webhook:
          type: webhook
          summary: webhook
          self: https://api.pagerduty.com/webhooks/PPGPXHO
          html_url: 'null'
          name: My Webhook
          endpoint_url: https://example.com
          webhook_object:
            id: PNTDJ30
            type: service_reference
            summary: Cool Service
            self: 'null'
            html_url: 'null'
          config:
            anykey: anyvalue
          outbound_integration:
            id: PJFWPEP
            type: outbound_integration_reference
            summary: Generic Webhook V2
            self: 'null'
            html_url: 'null'
        incident:
          id: PT4KHLK
          type: incident
          summary: The server is on fire.
          self: https://api.pagerduty.com/incidents/PT4KHLK
          html_url: https://subdomain.pagerduty.com/incidents/PT4KHLK
          incident_number: 1234
          created_at: '2015-10-06T21:30:42Z'
          status: resolved
          pending_actions:
            - type: unacknowledge
              at: '2015-11-10T01:02:52Z'
            - type: resolve
              at: '2015-11-10T04:31:52Z'
          incident_key: baf7cf21b1da41b4b0221008339ff357
          service:
            id: PIJ90N7
            type: service_reference
            summary: My Application Service
            self: https://api.pagerduty.com/services/PIJ90N7
            html_url: https://subdomain.pagerduty.com/service-directory/PIJ90N7
            name: My Application Service
            description: 'null'
            auto_resolve_timeout: 14400
            acknowledgement_timeout: 600
            created_at: '2015-11-06T11:12:51-05:00'
            status: active
            last_incident_timestamp: 'null'
            integrations:
              - id: PQ12345
                type: generic_email_inbound_integration_reference
                summary: Email Integration
                self: https://api.pagerduty.com/services/PIJ90N7/integrations/PQ12345
                html_url: https://subdomain.pagerduty.com/services/PIJ90N7/integrations/PQ12345
            escalation_policy:
              id: PT20YPA
              type: escalation_policy_reference
              summary: Another Escalation Policy
              self: https://api.pagerduty.com/escalation_policies/PT20YPA
              html_url: https://subdomain.pagerduty.com/escalation_policies/PT20YPA
            teams:
              - id: PQ9K7I8
                type: team_reference
                summary: Engineering
                self: https://api.pagerduty.com/teams/PQ9K7I8
                html_url: https://subdomain.pagerduty.com/teams/PQ9K7I8
            incident_urgency_rule:
              type: use_support_hours
              during_support_hours:
                type: constant
                urgency: high
              outside_support_hours:
