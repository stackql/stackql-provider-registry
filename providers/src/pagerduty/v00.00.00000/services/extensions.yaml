  x-stackQL-resources:
    extensions:
      id: pagerduty.extensions.extensions
      name: extensions
      title: Extensions
      methods:
        list:
          operation:
            $ref: '#/paths/~1extensions/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.extensions
          config:
            queryParamPushdown:
              top:
                paramName: limit
                maxValue: 100
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1extensions/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        get:
          operation:
            $ref: '#/paths/~1extensions~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.extension
        delete:
          operation:
            $ref: '#/paths/~1extensions~1{id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1extensions~1{id}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        enable:
          operation:
            $ref: '#/paths/~1extensions~1{id}~1enable/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/extensions/methods/get'
          - $ref: '#/components/x-stackQL-resources/extensions/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/extensions/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/extensions/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/extensions/methods/delete'
        replace: []
