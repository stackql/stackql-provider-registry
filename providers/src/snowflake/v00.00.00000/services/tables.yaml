    IcebergTableFromDelta:
      type: object
      description: Create iceberg table from Delta
      properties:
        name:
          type: string
          description: Specifies the name for the table, must be unique for the schema in which the table is created
        external_volume:
          type: string
          description: Specifies the name of the external volume to use for the table
        replace_invalid_characters:
          type: boolean
          description: Specifies whether to replace invalid characters in the column names
        base_location:
          type: string
          description: Specifies a relative path from the table’s EXTERNAL_VOLUME location to a directory where Snowflake can access your Delta table files.
        catalog:
          type: string
          description: Specifies the name of the catalog integration to use for the table
        comment:
          type: string
          description: Specifies a comment for the table
      required:
        - name
        - base_location
    IcebergTableFromIcebergRest:
      type: object
      description: Creates or replaces an Apache Iceberg™ table in the current/specified schema for an Iceberg REST catalog.
      properties:
        name:
          type: string
          description: Specifies the name for the table, must be unique for the schema in which the table is created
        external_volume:
          type: string
          description: Specifies the name of the external volume to use for the table
        catalog_table_name:
          type: string
          description: Specifies the table name as recognized by the AWS Glue Data Catalog.
        catalog_namespace:
          type: string
          description: Specifies the catalog namespace for the table.
        replace_invalid_characters:
          type: boolean
          description: Specifies whether to replace invalid characters in the column names
        auto_refresh:
          type: boolean
          description: Specifies whether to automatically refresh the table metadata
        catalog:
          type: string
          description: Specifies the name of the catalog integration to use for the table
        comment:
          type: string
          description: Specifies a comment for the table
      required:
        - name
        - catalog_table_name
    IcebergTableColumn:
      type: object
      description: A column in the snowflake catalog iceberg table
      properties:
        name:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          description: Column name
        datatype:
          type: string
          description: The data type for the column
        comment:
          type: string
          description: Specifies a comment for the column
        nullable:
          type: boolean
          description: Argument null return acceptance criteria
        default_value:
          type: string
          description: Default value for the column
      required:
        - name
        - datatype
    Constraint:
      type: object
      description: Constraints define integrity and consistency rules for data stored in tables.
      properties:
        name:
          type: string
          description: Name of the Constraint
        column_names:
          type: array
          items:
            type: string
            description: Column name for the constraint
        constraint_type:
          type: string
          description: Type of the constraint
      discriminator:
        propertyName: constraint_type
        mapping:
          PRIMARY KEY: PrimaryKey
          FOREIGN KEY: ForeignKey
          UNIQUE: UniqueKey
    PrimaryKey:
      type: object
      description: A primary key is the column or columns that contain values that uniquely identify each row in a table.
      properties:
        name:
          type: string
          description: Name of the Constraint
        column_names:
          type: array
          items:
            type: string
            description: Column name for the constraint
        constraint_type:
          type: string
          description: Type of the constraint
      discriminator:
        propertyName: constraint_type
        mapping:
          PRIMARY KEY: PrimaryKey
          FOREIGN KEY: ForeignKey
          UNIQUE: UniqueKey
    UniqueKey:
      type: object
      description: Unique keys are columns in a table that uniquely identify items in the rows. This sounds a lot like a primary key, but the main difference is that unique keys can have NULL values.
      properties:
        name:
          type: string
          description: Name of the Constraint
        column_names:
          type: array
          items:
            type: string
            description: Column name for the constraint
        constraint_type:
          type: string
          description: Type of the constraint
      discriminator:
        propertyName: constraint_type
        mapping:
          PRIMARY KEY: PrimaryKey
          FOREIGN KEY: ForeignKey
          UNIQUE: UniqueKey
    ForeignKey:
      type: object
      description: Foreign keys link data in one table to the data in another table.
      properties:
        referenced_table_name:
          type: string
        referenced_column_names:
          type: array
          items:
            type: string
        name:
          type: string
          description: Name of the Constraint
        column_names:
          type: array
          items:
            type: string
            description: Column name for the constraint
        constraint_type:
          type: string
          description: Type of the constraint
      required:
        - referenced_table_name
      discriminator:
        propertyName: constraint_type
        mapping:
          PRIMARY KEY: PrimaryKey
          FOREIGN KEY: ForeignKey
          UNIQUE: UniqueKey
