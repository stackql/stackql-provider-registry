    Streamlit:
      type: object
      description: A Snowflake Streamlit object
      properties:
        name:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          description: Name of the Streamlit
        comment:
          type: string
          description: Optional description of the Streamlit app, used for documentation or metadata purposes
