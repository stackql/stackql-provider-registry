components:
  schemas:
    Alert:
      type: object
      description: A Snowflake alert
      properties:
        name:
          type: string
          description: Name of the alert
        comment:
          type: string
          description: user comment associated to an object in the dictionary
        schedule:
          $ref: '#/components/schemas/Schedule'
          description: The schedule the alert runs under
        warehouse:
          type: string
          description: The warehouse the alert runs in
        condition:
          type: string
          description: The SQL statement that must be evaluated to determine whether to trigger the alert
        action:
          type: string
          description: The SQL statement to execute when the alert is triggered
        created_on:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the alert was created.
        database_name:
          type: string
          readOnly: true
          description: Database in which the alert is stored
        schema_name:
          type: string
          readOnly: true
          description: Schema in which the alert is stored
        owner:
          type: string
          readOnly: true
          description: Role that owns the alert
        owner_role_type:
          type: string
          readOnly: true
          description: The type of role that owns the alert
        state:
          type: string
          readOnly: true
          description: The current state of the alert
      required:
        - name
        - schedule
        - condition
        - action
    Schedule:
      type: object
      properties:
        schedule_type:
          type: string
          description: Type of the schedule, can be either CRON_TYPE or MINUTES_TYPE
      required:
        - schedule_type
      discriminator:
        propertyName: schedule_type
        mapping:
          CRON_TYPE: CronSchedule
          SCHEDULE_TYPE: MinutesSchedule
    CronSchedule:
      type: object
      properties:
        cron_expr:
          type: string
          description: A cron expression for the scheduled execution.
        timezone:
          type: string
          description: The time zone for the schedule.
        schedule_type:
          type: string
          description: Type of the schedule, can be either CRON_TYPE or MINUTES_TYPE
      required:
        - cron_expr
        - timezone
        - schedule_type
      discriminator:
        propertyName: schedule_type
        mapping:
          CRON_TYPE: CronSchedule
          SCHEDULE_TYPE: MinutesSchedule
    MinutesSchedule:
      type: object
      properties:
        minutes:
          type: integer
        schedule_type:
          type: string
          description: Type of the schedule, can be either CRON_TYPE or MINUTES_TYPE
      required:
        - minutes
        - schedule_type
      discriminator:
        propertyName: schedule_type
        mapping:
          CRON_TYPE: CronSchedule
          SCHEDULE_TYPE: MinutesSchedule
    AlertClone:
      type: object
      properties:
        name:
          type: string
          description: Name of the alert
        point_of_time:
          $ref: '#/components/schemas/PointOfTime'
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
      required:
        - name
    PointOfTime:
      type: object
      properties:
        point_of_time_type:
          type: string
          description: 'Type of the point of time. Possible values include: timestamp, offset, statement'
          example: timestamp
        reference:
          type: string
          enum:
            - at
            - before
          x-enum-varnames:
            - AT
            - BEFORE
          description: Relation to the point of time.  Currently, the API supports `at` and `before`
          example: at
      required:
        - point_of_time_type
        - reference
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeTimestamp:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the point of time (e.g. TO_TIMESTAMP(1749423600)).
          example: TO_TIMESTAMP(1749423600)
        point_of_time_type:
          type: string
          description: 'Type of the point of time. Possible values include: timestamp, offset, statement'
          example: timestamp
        reference:
          type: string
          enum:
            - at
            - before
          x-enum-varnames:
            - AT
            - BEFORE
          description: Relation to the point of time.  Currently, the API supports `at` and `before`
          example: at
      required:
        - timestamp
        - point_of_time_type
        - reference
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeOffset:
      type: object
      properties:
        offset:
          type: string
          description: The difference in seconds from the current time in the form -N where N can be an integer or arithmetic expression (e.g. -120).
          example: '-120'
        point_of_time_type:
          type: string
          description: 'Type of the point of time. Possible values include: timestamp, offset, statement'
          example: timestamp
        reference:
          type: string
          enum:
            - at
            - before
          x-enum-varnames:
            - AT
            - BEFORE
          description: Relation to the point of time.  Currently, the API supports `at` and `before`
          example: at
      required:
        - offset
        - point_of_time_type
        - reference
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeStatement:
      type: object
      properties:
        statement:
          type: string
          description: Query ID of a statement to use as the reference point (e.g. 01bcf40d-0002-197f-0000-045701e2306e).
          example: 01bcf40d-0002-197f-0000-045701e2306e
        point_of_time_type:
          type: string
          description: 'Type of the point of time. Possible values include: timestamp, offset, statement'
          example: timestamp
        reference:
          type: string
          enum:
            - at
            - before
          x-enum-varnames:
            - AT
            - BEFORE
          description: Relation to the point of time.  Currently, the API supports `at` and `before`
          example: at
      required:
        - statement
        - point_of_time_type
        - reference
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    Identifier:
      type: string
      description: A Snowflake object identifier. If the identifier contains spaces or special characters, the entire string must be enclosed in double quotes. Identifiers enclosed in double quotes are also case-sensitive.
      pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
      example: TEST_NAME
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message returned by the server
        code:
          type: string
          description: Error code.
        error_code:
          type: string
          description: Error code, same as `code` above. This property has been deprecated and will be removed in a future release, but is temporarily supported for for short-term backward compatibility.
        request_id:
          type: string
          description: Unique request ID.
      example:
        message: Compilation error!
        error_code: '390189'
        request_id: 01afef9d-0607-0550-0001-dd270c3902d7
    SuccessResponse:
      type: object
      description: Schema for all the success responses returned by the server.
      properties:
        status:
          type: string
          description: Message returned by the server.
      example:
        status: Request successfully completed
    SuccessAcceptedResponse:
      type: object
      description: Schema for a request in progress response returned by the server.
      properties:
        code:
          type: string
          description: Message code returned by the server.
        message:
          type: string
          description: Message returned by the server
        resultHandler:
          type: string
          description: Opaque result ID used for checking for request completion through one or more subsequent completion check operations.
      example:
        code: '392604'
        message: Request execution in progress. Use the provided location header or result handler ID to perform query monitoring and management.
    Parameter:
      description: Snowflake parameter defined at the system, account, user, session, or object level.
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Parameter name.
        value:
          type: string
          description: Parameter value.
        defaultValue:
          type: string
          description: Default parameter value.
        dataType:
          type: string
          description: Data type of the parameter value. Either BOOLEAN, NUMBER, FLOAT, or STRING.
        level:
          type: string
          description: Level at which parameter is defined.
        description:
          type: string
          description: Parameter description.
      example:
        name: SAMPLE_SNOWAPI_PARAM
        value: true
        defaultValue: false
        dataType: boolean
        level: ACCOUNT
        description: Sample snowflake parameter.
    TargetLag:
      type: object
      description: Specifies the schedule for periodically refreshing the dynamic table.
      properties:
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    UserDefinedLag:
      description: User-defined target lag.
      properties:
        seconds:
          type: integer
          format: int64
          description: Target lag time in seconds.
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      example:
        seconds: 3600
      required:
        - seconds
      type: object
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    DownstreamLag:
      description: Downstream target lag
      type: object
      properties:
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    Pipe:
      type: object
      description: A Snowflake pipe
      properties:
        name:
          type: string
          description: Name of the pipe
        comment:
          type: string
          description: user comment associated to an object in the dictionary
        auto_ingest:
          type: boolean
          description: TRUE if all files from stage need to be auto-ingested
        error_integration:
          type: string
          description: Link to integration object that point to a user provided Azure storage queue / SQS. When present,  errors (e.g. ingest failure for Snowpipe or a user task failure or replication failure) will be sent to this queue to notify customers
        aws_sns_topic:
          type: string
          description: Optional, if provided, auto_ingest pipe will only receive messages from this SNS topic.
        integration:
          type: string
          description: Link to integration object that ties a user provided storage queue to an auto_ingest enabled pipe. Required for auto_ingest to work on azure.
        copy_statement:
          type: string
          description: COPY INTO <table> statement used to load data from queued files into a Snowflake table. This statement serves as the text/definition for the pipe and is displayed in the SHOW PIPES output
          pattern: (?i)^COPY INTO .*
        created_on:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the pipe was created.
        database_name:
          type: string
          readOnly: true
          description: Database in which the pipe is stored
        schema_name:
          type: string
