      parameters:
        - name: api_integration_name
          description: Identifier (i.e. name) for the resource.
          required: true
          in: path
          schema:
            example: TEST_NAME
            $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiIntegration'
components:
  schemas:
    ApiIntegration:
      type: object
      description: A Snowflake API integration object.
      properties:
        name:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          description: Name of the API integration.
        api_hook:
          $ref: '#/components/schemas/ApiHook'
        api_allowed_prefixes:
          type: array
          items:
            type: string
          description: >-
            A comma-separated list of endpoints and resources that Snowflake can
            access.
        api_blocked_prefixes:
          type: array
          items:
            type: string
          description: >-
            A comma-separated list of endpoints and resources that are not
            allowed to be called from Snowflake.
          nullable: true
        enabled:
          type: boolean
          description: Whether the API integration is enabled.
        comment:
          type: string
          description: Comment for the API integration.
          nullable: true
        created_on:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the API integration was created.
      required:
        - name
        - api_hook
        - api_allowed_prefixes
        - enabled
    ApiHook:
      type: object
      properties:
        type:
          type: string
          enum:
            - AWS
            - AZURE
            - GC
            - GIT
          description: Type of ApiHook, can be AWS, AZURE, GC or GIT.
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          AWS: AwsHook
          AZURE: AzureHook
          GC: GoogleCloudHook
          GIT: GitHook
    AwsHook:
      type: object
      properties:
        api_provider:
          type: string
          enum:
            - AWS_API_GATEWAY
            - AWS_PRIVATE_API_GATEWAY
            - AWS_GOV_API_GATEWAY
            - AWS_GOV_PRIVATE_API_GATEWAY
        api_aws_role_arn:
          type: string
          description: The ARN (Amazon resource name) of the IAM role.
        api_key:
          $ref: '#/components/schemas/ApiKey'
        type:
          type: string
          enum:
            - AWS
            - AZURE
            - GC
            - GIT
          description: Type of ApiHook, can be AWS, AZURE, GC or GIT.
      required:
        - api_provider
        - api_aws_role_arn
        - type
      discriminator:
        propertyName: type
        mapping:
          AWS: AwsHook
          AZURE: AzureHook
          GC: GoogleCloudHook
          GIT: GitHook
    AzureHook:
      type: object
      properties:
        api_provider:
          type: string
          enum:
            - AZURE_API_MANAGEMENT
            - AZURE_PRIVATE_API_MANAGEMENT
        azure_tenant_id:
          type: string
          description: >-
            The ID of the Office 365 tenant that all Azure API Management
            instances belong to.
        azure_ad_application_id:
          type: string
          description: The application ID of the Azure Active Directory application.
        api_key:
          $ref: '#/components/schemas/ApiKey'
        type:
          type: string
          enum:
            - AWS
            - AZURE
            - GC
            - GIT
          description: Type of ApiHook, can be AWS, AZURE, GC or GIT.
      required:
        - api_provider
        - azure_tenant_id
        - azure_ad_application_id
        - type
      discriminator:
        propertyName: type
        mapping:
          AWS: AwsHook
          AZURE: AzureHook
          GC: GoogleCloudHook
          GIT: GitHook
    GoogleCloudHook:
      type: object
      properties:
        api_provider:
          type: string
          enum:
            - GOOGLE_API_GATEWAY
        google_audience:
          type: string
          description: >-
            Used as an audience claim when generating the JTW (JSON Web Token)
            to authenticate to the Google API Gateway.
        api_key:
          $ref: '#/components/schemas/ApiKey'
        type:
          type: string
          enum:
            - AWS
            - AZURE
            - GC
            - GIT
          description: Type of ApiHook, can be AWS, AZURE, GC or GIT.
      required:
        - api_provider
        - google_audience
        - type
      discriminator:
        propertyName: type
        mapping:
          AWS: AwsHook
          AZURE: AzureHook
          GC: GoogleCloudHook
          GIT: GitHook
    GitHook:
      type: object
      properties:
        allow_any_secret:
          type: boolean
          default: false
          description: >-
            Whether to allow any Snowflake secret when accessing the Git
            repository. This setting is ignored if
            allowed_authentication_secrets is present.
        allowed_authentication_secrets:
          type: array
          items:
            type: string
          description: >-
            A comma-separated list of fully-qualified Snowflake secret names
            that UDF or procedure handler code can use when accessing the Git
            repository.
          nullable: true
        allowed_api_authentication_integrations:
          type: array
          items:
            type: string
          description: >-
            A comma-separated list of Snowflake security integration names that
            UDF or procedure handler code can use when accessing the Git
            repository. If empty, allow no integrations.
          nullable: true
        type:
          type: string
          enum:
            - AWS
            - AZURE
            - GC
            - GIT
          description: Type of ApiHook, can be AWS, AZURE, GC or GIT.
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          AWS: AwsHook
          AZURE: AzureHook
          GC: GoogleCloudHook
          GIT: GitHook
    ApiKey:
      type: string
      description: >-
        An alphanumeric string that is used to identify API clients and control
        access to the API, also called a subscription key.
      nullable: true
    Identifier:
      type: string
      description: >-
        A Snowflake object identifier. If the identifier contains spaces or
        special characters, the entire string must be enclosed in double quotes.
        Identifiers enclosed in double quotes are also case-sensitive.
      pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
      example: TEST_NAME
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message returned by the server
        code:
          type: string
          description: Error code.
        error_code:
          type: string
          description: >-
            Error code, same as `code` above. This property has been deprecated
            and will be removed in a future release, but is temporarily
            supported for for short-term backward compatibility.
        request_id:
          type: string
          description: Unique request ID.
      example:
        message: Compilation error!
        error_code: '390189'
        request_id: 01afef9d-0607-0550-0001-dd270c3902d7
    SuccessResponse:
      type: object
      description: Schema for all the success responses returned by the server.
      properties:
        status:
          type: string
          description: Message returned by the server.
      example:
        status: Request successfully completed
    SuccessAcceptedResponse:
      type: object
      description: Schema for a request in progress response returned by the server.
      properties:
        code:
          type: string
          description: Message code returned by the server.
        message:
          type: string
          description: Message returned by the server
        resultHandler:
          type: string
          description: >-
            Opaque result ID used for checking for request completion through
            one or more subsequent completion check operations.
      example:
        code: '392604'
        message: >-
          Request execution in progress. Use the provided location header or
          result handler ID to perform query monitoring and management.
    PointOfTime:
      type: object
      description: Point of time.
      required:
        - point_of_time_type
      properties:
        point_of_time_type:
          description: >-
            Type of the point of time. Possible values include:

            - `timestamp`: Exact time using the standard timezone format.
            Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative
            to 'now.' in the form -N where N can be an integer or arithmetic
            expression. Example: `-120` - `statement`: ID of a query statement
            to use as the reference point for <a
            href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time
            Travel</a>.

            For more information, see
            https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: >-
            Relation to the point of time. Currently, the API supports `at` and
            `before`.
          example: at
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeTimestamp:
      description: Point of time identified by a timestamp.
      properties:
        timestamp:
          type: string
          description: Timestamp of the point of time (e.g. TO_TIMESTAMP(1749423600))
          example: TO_TIMESTAMP(1749423600)
        point_of_time_type:
          description: >-
            Type of the point of time. Possible values include:

            - `timestamp`: Exact time using the standard timezone format.
            Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative
            to 'now.' in the form -N where N can be an integer or arithmetic
            expression. Example: `-120` - `statement`: ID of a query statement
            to use as the reference point for <a
            href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time
            Travel</a>.

            For more information, see
            https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: >-
            Relation to the point of time. Currently, the API supports `at` and
            `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeOffset:
      description: Point of time identified by an offset in reference to the current time
      properties:
        offset:
          type: string
          description: >-
            The difference in seconds from the current time in the form -N where
            N can be an integer or arithmetic expression (e.g. -120).
          example: '-120'
        point_of_time_type:
          description: >-
            Type of the point of time. Possible values include:

            - `timestamp`: Exact time using the standard timezone format.
            Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative
            to 'now.' in the form -N where N can be an integer or arithmetic
            expression. Example: `-120` - `statement`: ID of a query statement
            to use as the reference point for <a
            href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time
            Travel</a>.

            For more information, see
            https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: >-
            Relation to the point of time. Currently, the API supports `at` and
            `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeStatement:
      description: Point of time indicating when a statement was executed.
      properties:
        statement:
          type: string
          description: >-
            Query ID of a statement to use as the reference point (e.g.
            01bcf40d-0002-197f-0000-045701e2306e).
          example: 01bcf40d-0002-197f-0000-045701e2306e
        point_of_time_type:
          description: >-
            Type of the point of time. Possible values include:

            - `timestamp`: Exact time using the standard timezone format.
            Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative
            to 'now.' in the form -N where N can be an integer or arithmetic
            expression. Example: `-120` - `statement`: ID of a query statement
            to use as the reference point for <a
            href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time
            Travel</a>.

            For more information, see
            https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: >-
            Relation to the point of time. Currently, the API supports `at` and
            `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    Parameter:
      description: >-
        Snowflake parameter defined at the system, account, user, session, or
        object level.
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Parameter name.
        value:
          type: string
          description: Parameter value.
        defaultValue:
          type: string
          description: Default parameter value.
        dataType:
          type: string
          description: >-
            Data type of the parameter value. Either BOOLEAN, NUMBER, FLOAT, or
            STRING.
        level:
          type: string
          description: Level at which parameter is defined.
        description:
          type: string
          description: Parameter description.
      example:
        name: SAMPLE_SNOWAPI_PARAM
        value: true
        defaultValue: false
        dataType: boolean
        level: ACCOUNT
        description: Sample snowflake parameter.
    TargetLag:
      type: object
      description: Specifies the schedule for periodically refreshing the dynamic table.
      properties:
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    UserDefinedLag:
      description: User-defined target lag.
      properties:
        seconds:
          type: integer
          format: int64
          description: Target lag time in seconds.
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      example:
        seconds: 3600
      required:
        - seconds
      type: object
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    DownstreamLag:
      description: Downstream target lag
      type: object
      properties:
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    CatalogIntegration:
      type: object
      description: Catalog integration
      properties:
        name:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          description: Name of the catalog integration.
        catalog:
          $ref: '#/components/schemas/Catalog'
          description: Type of catalog and its parameters.
        table_format:
          type: string
          enum:
            - ICEBERG
          description: Table format of the catalog.
        enabled:
          type: boolean
          description: >-
            whether this catalog integration is available to use for Iceberg
            tables. 
        comment:
          type: string
          description: Comment.
        type:
          type: string
          readOnly: true
          description: Type of the integration. Always CATALOG.
        category:
          type: string
          readOnly: true
          description: Category of the integration. Always CATALOG.
        created_on:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the catalog integration was created.
      required:
        - name
        - catalog
        - table_format
        - enabled
    Catalog:
      type: object
      properties:
        catalog_source:
          type: string
          enum:
            - GLUE
            - OBJECT_STORE
            - POLARIS
          description: Type of external catalog
      required:
        - catalog_source
      discriminator:
        propertyName: catalog_source
        mapping:
          GLUE: Glue
          OBJECT_STORE: ObjectStore
          POLARIS: Polaris
    Glue:
      type: object
      properties:
        glue_aws_role_arn:
          type: string
          description: ARN for AWS role to assume
        glue_catalog_id:
          type: string
          description: Glue catalog id
        glue_region:
          type: string
          description: >-
            AWS region of the Glue catalog. Must be specified if the Snowflake
            account is not hosted on AWS.
        catalog_namespace:
          type: string
          description: >-
            default AWS Glue catalog namespace for all Iceberg table that use
            this catalog integration
        catalog_source:
          type: string
          enum:
            - GLUE
            - OBJECT_STORE
            - POLARIS
          description: Type of external catalog
      required:
        - glue_aws_role_arn
        - glue_catalog_id
        - catalog_namespace
        - catalog_source
      discriminator:
        propertyName: catalog_source
        mapping:
          GLUE: Glue
          OBJECT_STORE: ObjectStore
          POLARIS: Polaris
    ObjectStore:
      type: object
      properties:
        catalog_source:
          type: string
          enum:
            - GLUE
            - OBJECT_STORE
            - POLARIS
          description: Type of external catalog
      required:
        - catalog_source
      discriminator:
        propertyName: catalog_source
        mapping:
          GLUE: Glue
          OBJECT_STORE: ObjectStore
          POLARIS: Polaris
    Polaris:
      type: object
      properties:
        catalog_namespace:
          type: string
          description: >-
            Default Polaris namespace used by all Iceberg tables associated with
            this catalog integration
        rest_config:
          $ref: '#/components/schemas/RestConfig'
          description: Information about the Polaris catalog account and catalog name.
        rest_authentication:
          $ref: '#/components/schemas/RestAuthentication'
          description: >-
            Authentication details that Snowflake uses to connect to the Polaris
            catalog.
        catalog_source:
          type: string
          enum:
            - GLUE
            - OBJECT_STORE
            - POLARIS
          description: Type of external catalog
      required:
        - catalog_namespace
        - rest_config
        - rest_authentication
        - catalog_source
      discriminator:
        propertyName: catalog_source
        mapping:
          GLUE: Glue
          OBJECT_STORE: ObjectStore
          POLARIS: Polaris
    RestConfig:
      type: object
      properties:
        catalog_uri:
          type: string
          description: Customer's Polaris account locator URL
        warehouse:
          type: string
          description: Name of the catalog to use in Polaris
      required:
        - catalog_uri
        - warehouse
    RestAuthentication:
      type: object
      properties:
        type:
          type: string
          enum:
            - OAUTH
          description: Authentication type.
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          OAUTH: OAuth
    OAuth:
      type: object
      properties:
        oauth_client_id:
          type: string
          description: >-
            The client ID of the OAuth2 credential associated with the Polaris
            service connection.
        oauth_client_secret:
          type: string
          description: >-
            The secret for the OAuth2 credential associated with the Polaris
            service connection.
        oauth_allowed_scopes:
          type: array
          items:
            type: string
          description: >-
            The scope of the OAuth token. Only one scope is included in the
            Iceberg REST API specification, but catalogs can support more than
            one scope in their implementation.
        type:
          type: string
          enum:
            - OAUTH
          description: Authentication type.
      required:
        - oauth_client_id
        - oauth_client_secret
        - oauth_allowed_scopes
        - type
      discriminator:
        propertyName: type
        mapping:
          OAUTH: OAuth
    ExternalVolume:
      type: object
      description: A Snowflake external volume
      properties:
        name:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          description: >-
            String that specifies the identifier (the name) for the external
            volume; must be unique in your account.
        storage_locations:
          type: array
          items:
            $ref: '#/components/schemas/StorageLocation'
          description: >-
            Set of named cloud storage locations in different regions and,
            optionally, cloud platforms.
        allow_writes:
          type: boolean
          description: >-
            Specifies whether write operations are allowed for the external
            volume; must be set to TRUE for Iceberg tables that use Snowflake as
            the catalog.
        comment:
          type: string
          description: String (literal) that specifies a comment for the external volume.
        created_on:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the external volume was created.
        owner:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          readOnly: true
          description: Role that owns the external volume
        owner_role_type:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          readOnly: true
          description: The type of role that owns the external volume
      required:
        - name
        - storage_locations
    StorageLocation:
      type: object
      properties:
        name:
          type: string
          description: ''
        storage_provider:
          type: string
          enum:
            - S3
            - S3GOV
            - GCS
            - AZURE
          description: Specifies the cloud storage provider that stores your data files.
      required:
        - name
        - storage_provider
      discriminator:
        propertyName: storage_provider
        mapping:
          S3: StorageLocationS3
          S3GOV: StorageLocationS3Gov
          GCS: StorageLocationGcs
          AZURE: StorageLocationAzure
    StorageLocationS3:
      properties:
        storage_aws_role_arn:
          type: string
          description: >-
            Specifies the case-sensitive Amazon Resource Name (ARN) of the AWS
            identity and access management (IAM) role that grants privileges on
            the S3 bucket containing your data files.
        storage_base_url:
          type: string
          description: Specifies the base URL for your cloud storage location.
        storage_aws_external_id:
          type: string
          description: >-
            Optionally specifies an external ID that Snowflake uses to establish
            a trust relationship with AWS.
        encryption:
          $ref: '#/components/schemas/Encryption'
          description: >-
            Specifies the properties needed to encrypt data on the external
            volume.
        name:
          type: string
          description: ''
        storage_provider:
          type: string
          enum:
            - S3
            - S3GOV
            - GCS
            - AZURE
          description: Specifies the cloud storage provider that stores your data files.
      required:
        - storage_aws_role_arn
        - storage_base_url
        - name
        - storage_provider
      type: object
      discriminator:
        propertyName: storage_provider
        mapping:
          S3: StorageLocationS3
          S3GOV: StorageLocationS3Gov
          GCS: StorageLocationGcs
          AZURE: StorageLocationAzure
    Encryption:
      type: object
      properties:
        type:
          type: string
          enum:
            - NONE
            - AWS_SSE_S3
            - AWS_SSE_KMS
            - GCS_SSE_KMS
          description: Specifies the encryption type used.
        kms_key_id:
          type: string
          description: >-
            Specifies the ID for the Cloud KMS-managed key used to encrypt files
            written to the bucket.
      required:
        - type
    StorageLocationS3Gov:
      properties:
        storage_aws_role_arn:
          type: string
          description: >-
            Specifies the case-sensitive Amazon Resource Name (ARN) of the AWS
            identity and access management (IAM) role that grants privileges on
            the S3 bucket containing your data files.
        storage_base_url:
          type: string
          description: Specifies the base URL for your cloud storage location.
        storage_aws_external_id:
          type: string
          description: >-
            Optionally specifies an external ID that Snowflake uses to establish
            a trust relationship with AWS.
        encryption:
          $ref: '#/components/schemas/Encryption'
          description: >-
            Specifies the properties needed to encrypt data on the external
            volume.
        name:
          type: string
          description: ''
        storage_provider:
          type: string
          enum:
            - S3
            - S3GOV
            - GCS
            - AZURE
          description: Specifies the cloud storage provider that stores your data files.
      required:
        - storage_aws_role_arn
        - storage_base_url
        - name
        - storage_provider
      type: object
      discriminator:
        propertyName: storage_provider
        mapping:
          S3: StorageLocationS3
          S3GOV: StorageLocationS3Gov
          GCS: StorageLocationGcs
