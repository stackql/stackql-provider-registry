    schema_name:
      name: schema_name
      description: >-
        Identifier (i.e. name) for the schema to which the resource belongs. You
        can use the `/api/v2/databases/{database}/schemas` GET request to get a
        list of available schemas for the specified database.
      required: true
      in: path
      schema:
        example: TEST_SCHEMA
        $ref: '#/components/schemas/Identifier'
    name_with_args:
      name: name_with_args
      description: Function's name with Args
      required: true
      in: path
      schema:
        type: string
        example: foo(a number, b number)
  headers:
