  description: >-
    The Snowflake REST API surface for the integrations service, combining the
    vendor spec(s): api-integration.yaml, catalog-integration.yaml,
    external-volume.yaml, notification-integration.yaml.
  contact:
    name: Snowflake, Inc.
    url: https://snowflake.com
    email: support@snowflake.com
