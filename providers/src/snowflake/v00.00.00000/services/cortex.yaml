      description: Perform LLM text completion inference using Cortex Messages API format.
      operationId: cortexGenericAnthropicMessages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CortexAnthropicMessagesRequest'
      responses:
        '200':
          description: OK
