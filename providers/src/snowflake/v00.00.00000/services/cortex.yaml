components:
  schemas:
    TokenInfo:
      type: object
      properties:
        token:
          type: string
        expiration_seconds:
          type: integer
    StatusUpdate:
      type: object
      properties:
        status:
          description: The latest status for processing the request
          type: string
        status_message:
          description: A human readable description on the current request processing status
          type: string
        request_id:
          type: string
          description: Unique request ID.
      required:
        - status
    MessageContentDelta:
      type: object
      properties:
        type:
          type: string
        index:
          type: integer
          description: The index of the content array this delta object represents
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentDeltaTextObject'
          think: '#/components/schemas/MessageContentDeltaThinkObject'
          sql: '#/components/schemas/MessageContentDeltaSqlObject'
          suggestions: '#/components/schemas/MessageContentDeltaSuggestionsObject'
          chart: '#/components/schemas/MessageContentChartObject'
    MessageContentDeltaTextObject:
      type: object
      properties:
        type:
          type: string
        index:
          type: integer
          description: The index of the content array this delta object represents
        text_delta:
          type: string
          description: The delta of the text content, clients should concatenate all deltas for the same index
          example: To answer the question "What is the profit per store?" we must aggregate sales at the store level
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentDeltaTextObject'
          think: '#/components/schemas/MessageContentDeltaThinkObject'
          sql: '#/components/schemas/MessageContentDeltaSqlObject'
          suggestions: '#/components/schemas/MessageContentDeltaSuggestionsObject'
          chart: '#/components/schemas/MessageContentChartObject'
      title: Text
      description: The text content that is part of a message.
      required:
        - text_delta
    MessageContentDeltaThinkObject:
      type: object
      properties:
        type:
          type: string
        index:
          type: integer
          description: The index of the content array this delta object represents
        think_delta:
          type: string
          description: The delta of the think content, clients should concatenate all deltas for the same index
          example: To answer the question "What is the profit per store?" we must aggregate sales at the store level
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentDeltaTextObject'
          think: '#/components/schemas/MessageContentDeltaThinkObject'
          sql: '#/components/schemas/MessageContentDeltaSqlObject'
          suggestions: '#/components/schemas/MessageContentDeltaSuggestionsObject'
          chart: '#/components/schemas/MessageContentChartObject'
      title: Think
      description: The think content that is part of a message.
      required:
        - think_delta
    MessageContentDeltaSqlObject:
      type: object
      properties:
        type:
          type: string
        index:
          type: integer
          description: The index of the content array this delta object represents
        statement_delta:
          type: string
          description: The delta of the sql statement, clients should concatenate all deltas for the same index
          example: SELECT store, SUM(profit) FROM sales GROUP BY store
        confidence:
          $ref: '#/components/schemas/Confidence'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentDeltaTextObject'
          think: '#/components/schemas/MessageContentDeltaThinkObject'
          sql: '#/components/schemas/MessageContentDeltaSqlObject'
          suggestions: '#/components/schemas/MessageContentDeltaSuggestionsObject'
          chart: '#/components/schemas/MessageContentChartObject'
      title: SQL
      description: The SQL content that is part of a message.
      required:
        - statement_delta
    MessageContentDeltaSuggestionsObject:
      type: object
      properties:
        type:
          type: string
        index:
          type: integer
          description: The index of the content array this delta object represents
        suggestions_delta:
          $ref: '#/components/schemas/SuggestionDelta'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentDeltaTextObject'
          think: '#/components/schemas/MessageContentDeltaThinkObject'
          sql: '#/components/schemas/MessageContentDeltaSqlObject'
          suggestions: '#/components/schemas/MessageContentDeltaSuggestionsObject'
          chart: '#/components/schemas/MessageContentChartObject'
      title: Suggested Questions
      description: If SQL cannot be generated, a list of questions the semantic model can generate SQL for.
      required:
        - suggestions_delta
    SuggestionDelta:
      type: object
      properties:
        index:
          type: integer
          description: The index of the suggestions array this delta object represents
        suggestion_delta:
          type: string
          description: The delta of a suggestion text, clients should concatenate all deltas for the same index
    StreamingError:
      type: object
      properties:
        message:
          type: string
          description: A description of the error
        code:
          type: string
          description: The Snowflake error code categorizing the error
        request_id:
          type: string
          description: Unique request ID
    Warnings:
      type: object
      description: Represents a wrapper schema around Warning for streaming case
      properties:
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    SendFeedbackRequest:
      type: object
      description: The request object for sending user feedback on Cortex Analyst responses
      properties:
        request_id:
          type: string
          description: Request id associated with the feedback
        positive:
          type: boolean
          description: Whether the response was good (true) or bad (false)
        feedback_message:
          type: string
          description: The text for the detailed feedback message
      required:
        - request_id
        - positive
    GenerateVerifiedQuerySuggestionsRequest:
      type: object
      description: The request object for getting VQ suggestions
      properties:
        mode:
          type: string
          enum:
            - ca_requests_based
            - query_history_based
          description: Whether to generate suggestions based on historical CA requests or all SQL queries. One of 'ca_requests_based' or 'query_history_based'
          default: ca_requests_based
        semantic_model:
          $ref: '#/components/schemas/SemanticModelObject'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableColumns'
        tds_source:
          type: array
          items:
            $ref: '#/components/schemas/TdsInput'
        sql_source:
          $ref: '#/components/schemas/SqlInputs'
        warehouse:
          type: string
          description: Warehouse name to use for processing suggestions.
        offset:
          description: The suggestions offset index, offset = 0 indicates the first call
          type: integer
          format: int32
        limit:
          description: The number of suggestions to return starting from the provided offset value
          type: integer
          format: int32
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
        - warehouse
    GenerateVerifiedQuerySuggestionsResponse:
      type: object
      description: The non-streaming response object for the VQ Suggestions request
      properties:
        request_id:
          type: string
          description: Unique request ID
        vq_suggestions:
          type: array
          items:
            $ref: '#/components/schemas/VerifiedQuerySuggestion'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    VerifiedQuerySuggestion:
      type: object
      description: A suggestion to add or remove or replace a Verified Query to a semantic model.
      properties:
        score:
          type: number
          description: Score of the suggestion, higher is better.
          format: float
        vq_to_add:
          $ref: '#/components/schemas/VerifiedQuery'
        vq_to_remove:
          $ref: '#/components/schemas/VerifiedQuery'
    FastGenerationRequest:
      type: object
      description: The request for the FastGeneration rpc
      properties:
        json_proto:
          type: object
          description: A JSON-mapped FastGenerationRequest protobuf
          additionalProperties: true
    FastGenerationResponse:
      type: object
      description: The response for the FastGeneration rpc (streamed)
      properties:
        json_proto:
          type: object
          description: A JSON-mapped FastGenerationResponse protobuf
          additionalProperties: true
    PreSelectionRequest:
      type: object
      description: The request for the PreSelection rpc
      properties:
        tds_source:
          type: array
          items:
            $ref: '#/components/schemas/TdsInput'
        sql_source:
          $ref: '#/components/schemas/SqlInputs'
        warehouse:
          type: string
          description: Warehouse name to use for processing.
        tableau_input:
          $ref: '#/components/schemas/TableauInput'
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
        - tds_source
        - warehouse
    PreSelectionResponse:
      type: object
      description: The response for the PreSelection rpc
      properties:
        request_id:
          type: string
          description: Unique request ID
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableColumns'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
    TdsInput:
      type: object
      description: Tableau data source file stage paths
      properties:
        tds_stage_path:
          type: string
          description: TDS file stage path
        tds_file_content:
          type: string
          description: TDS file raw contents
      required:
        - tds_stage_path
    TableColumns:
      type: object
      description: Contains information about table and column names
      properties:
        database:
          type: string
          description: Database name
        schema:
          type: string
          description: Schema name
        table:
          type: string
          description: Table name
        column_names:
          type: array
          items:
            type: string
            description: Column names
      required:
        - database
        - schema
        - table
        - column_names
    AnnotatedSqlQuery:
      type: object
      description: Contains a SQL query with optional context and natural language annotation
      properties:
        sql_text:
          type: string
          description: SQL query text
        database:
          type: string
          description: Database associated with the SQL query
        schema:
          type: string
          description: Schema associated with the SQL query
        corresponding_question:
          type: string
          description: Natural language question that the SQL query answers
        additional_context:
          type: string
          description: Free-form string for additional context about the query
      required:
        - sql_text
    SqlInputs:
      type: object
      description: Contains SQL queries which may be annotated with natural language
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/AnnotatedSqlQuery'
      required:
        - queries
    CreateAgenticOptimizationRequest:
      type: object
      description: A request to start an agentic optimization run for a semantic model. Note that only semantic views and semantic model files are supported. Inline semantic models will lead to a 400 response.
      properties:
        semantic_model:
          $ref: '#/components/schemas/SemanticModelObject'
        warehouse:
          type: string
          description: Warehouse name to use for processing suggestions.
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
        - semantic_model
    CreateAgenticOptimizationResponse:
      type: object
      description: The result of starting an agentic optimization run for a semantic model.
      properties:
        request_id:
          type: string
          description: Unique request ID
          example: abcd1234-5678-90ab-cdef-1234567890ab
        optimization_name:
          type: string
          description: The fully-qualified name of the created optimization run.
          example: some_db.some_schema."Some_Optimziation_Name_1234567890"
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
    GetAgenticOptimizationResponse:
      type: object
      description: The status, state, and outcome of a specified agentic optimization run.
      properties:
        request_id:
          type: string
          description: Unique request ID
          example: abcd1234-5678-90ab-cdef-1234567890ab
        status:
          $ref: '#/components/schemas/AgenticOptimizationStatus'
        state:
          type: string
          description: An opaque string containing the state of the optimization.
          example: '{"progress": 0.5, "details": "Halfway through the optimization"}'
        outcome:
          type: string
          description: An opaque string containing the outcome of the optimization, separate from the state. This should be the JSON-encoded form of an AgenticOptimizationOutcome protobuf message.
          example: '{"extensions": ""}'
    ListAgenticOptimizationsRequest:
      type: object
      description: A request to list all agentic optimization runs for a given base model. Note that only semantic views and semantic model files are supported. Inline semantic models will lead to a 400 response.
      properties:
        semantic_model:
          $ref: '#/components/schemas/SemanticModelObject'
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
        - semantic_model
    ListAgenticOptimizationsResponse:
      type: object
      description: The response from listing agentic optimization runs.
      properties:
        request_id:
          type: string
          description: Unique request ID
          example: abcd1234-5678-90ab-cdef-1234567890ab
        optimizations:
          type: array
          items:
            $ref: '#/components/schemas/AgenticOptimizationSummary'
    AgenticOptimizationSummary:
      type: object
      description: A summary of an agentic optimization run.
      properties:
        optimization_name:
          type: string
          description: The fully-qualified name of the optimization.
        status:
          $ref: '#/components/schemas/AgenticOptimizationStatus'
    AgenticOptimizationStatus:
      type: string
      description: The status of an agentic optimization run.
      enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
        - CANCELED
    TableauInput:
      type: object
      description: Input required to extract data from Tableau. Tableau Cloud users can optionally provide integration data if files are not already uploaded
      properties:
        stage_files:
          $ref: '#/components/schemas/TableauStageFiles'
        server_files:
          $ref: '#/components/schemas/TableauServerFiles'
    TableauStageFiles:
      type: object
      description: Specifies stage paths of the Tableau files
      properties:
        stage_paths:
          type: array
          items:
            type: string
            description: The stage paths of where the Tableau file is stored
    TableauServerFiles:
      type: object
      description: Contains Tableau URLs to retrieve files from Tableau server and information around Tableau integration
      properties:
        tableau_urls:
          type: array
          items:
            type: string
            description: The URLs in Tableau to retrieve files from
        integration:
          $ref: '#/components/schemas/TableauIntegration'
    TableauIntegration:
      type: object
      description: Contains data on how to connect to Tableau and process data
      properties:
        auth:
          $ref: '#/components/schemas/TableauAuth'
        staging_data:
          $ref: '#/components/schemas/StagingData'
      required:
        - auth
        - staging_data
    GenerateFiltersAndMetricsSuggestionsRequest:
      type: object
      description: The request object for generating filters, facts, and metrics suggestions
      properties:
        semantic_model:
          $ref: '#/components/schemas/SemanticModelObject'
        tables:
          type: array
          description: Tables and selected columns to build a basic semantic model from
          items:
            $ref: '#/components/schemas/TableColumns'
        warehouse:
          type: string
          description: Warehouse name to use for processing suggestions.
        metrics_offset:
          type: integer
          format: int32
          description: Pagination offset for metrics suggestions
        metrics_limit:
          type: integer
          format: int32
          description: Pagination limit for metrics suggestions
        facts_offset:
          type: integer
          format: int32
          description: Pagination offset for facts suggestions
        facts_limit:
          type: integer
          format: int32
          description: Pagination limit for facts suggestions
        filters_offset:
          type: integer
          format: int32
          description: Pagination offset for filters suggestions
        filters_limit:
          type: integer
          format: int32
          description: Pagination limit for filters suggestions
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
    GenerateFiltersAndMetricsSuggestionsResponse:
      type: object
      description: The response object for filters, facts, and metrics suggestions
      properties:
        request_id:
          type: string
          description: Unique request ID
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SemanticModelUpdateSuggestion'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
    SemanticModelUpdateSuggestion:
      type: object
      description: A suggestion consisting of ordered semantic object changes with optional setup SQL and score.
      properties:
        changes:
          type: array
          description: Changes to be applied in order
          items:
            $ref: '#/components/schemas/SemanticModelChange'
        version:
          type: integer
          format: int32
          description: Version of SemanticModelUpdateSuggestion
    SemanticModelChange:
      type: object
      description: A single change to apply to the semantic object
      properties:
        operation:
          $ref: '#/components/schemas/SemanticModelChangeOperation'
        path:
          type: string
          description: Path to the node in the semantic object to change
        value:
          $ref: '#/components/schemas/SemanticModelChangeValue'
      required:
        - operation
        - path
    SemanticModelChangeOperation:
      type: string
      description: Operation applied to a semantic object at a given path
      enum:
        - set
        - append
        - remove
    SemanticModelChangeValue:
      type: object
      description: One-of value. A map with exactly one key set corresponding to the semantic model object or primitive.
      additionalProperties: true
    TableauAuth:
      type: object
      description: Authentication required to connect to Tableau
      properties:
        secret_fqn:
          type: string
          description: The fully qualified name of the secret containing the Tableau PAT
        server_url:
          type: string
          description: The Tableau server name to send requests to
      required:
        - secret_fqn
        - server_url
    StagingData:
      type: object
      description: Contains information indicating where to stage data
      properties:
        database:
          type: string
          description: Database name
        schema:
          type: string
          description: Schema name
      required:
        - database
        - schema
    Identifier:
      type: string
      description: A Snowflake object identifier. If the identifier contains spaces or special characters, the entire string must be enclosed in double quotes. Identifiers enclosed in double quotes are also case-sensitive.
      pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
      example: TEST_NAME
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message returned by the server
        code:
          type: string
          description: Error code.
        error_code:
          type: string
          description: Error code, same as `code` above. This property has been deprecated and will be removed in a future release, but is temporarily supported for for short-term backward compatibility.
        request_id:
          type: string
          description: Unique request ID.
      example:
        message: Compilation error!
        error_code: '390189'
        request_id: 01afef9d-0607-0550-0001-dd270c3902d7
    SuccessResponse:
      type: object
      description: Schema for all the success responses returned by the server.
      properties:
        status:
          type: string
          description: Message returned by the server.
      example:
        status: Request successfully completed
    SuccessAcceptedResponse:
      type: object
      description: Schema for a request in progress response returned by the server.
      properties:
        code:
          type: string
          description: Message code returned by the server.
        message:
          type: string
          description: Message returned by the server
        resultHandler:
          type: string
          description: Opaque result ID used for checking for request completion through one or more subsequent completion check operations.
      example:
        code: '392604'
        message: Request execution in progress. Use the provided location header or result handler ID to perform query monitoring and management.
    PointOfTime:
      type: object
      description: Point of time.
      required:
        - point_of_time_type
      properties:
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeTimestamp:
      description: Point of time identified by a timestamp.
      properties:
        timestamp:
          type: string
          description: Timestamp of the point of time (e.g. TO_TIMESTAMP(1749423600))
          example: TO_TIMESTAMP(1749423600)
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeOffset:
      description: Point of time identified by an offset in reference to the current time
      properties:
        offset:
          type: string
          description: The difference in seconds from the current time in the form -N where N can be an integer or arithmetic expression (e.g. -120).
          example: '-120'
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeStatement:
      description: Point of time indicating when a statement was executed.
      properties:
        statement:
          type: string
          description: Query ID of a statement to use as the reference point (e.g. 01bcf40d-0002-197f-0000-045701e2306e).
          example: 01bcf40d-0002-197f-0000-045701e2306e
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    Parameter:
      description: Snowflake parameter defined at the system, account, user, session, or object level.
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Parameter name.
        value:
          type: string
          description: Parameter value.
        defaultValue:
          type: string
          description: Default parameter value.
        dataType:
          type: string
          description: Data type of the parameter value. Either BOOLEAN, NUMBER, FLOAT, or STRING.
        level:
          type: string
          description: Level at which parameter is defined.
        description:
          type: string
          description: Parameter description.
      example:
        name: SAMPLE_SNOWAPI_PARAM
        value: true
        defaultValue: false
        dataType: boolean
        level: ACCOUNT
        description: Sample snowflake parameter.
    TargetLag:
      type: object
      description: Specifies the schedule for periodically refreshing the dynamic table.
      properties:
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    UserDefinedLag:
      description: User-defined target lag.
      properties:
        seconds:
          type: integer
          format: int64
          description: Target lag time in seconds.
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      example:
        seconds: 3600
      required:
        - seconds
      type: object
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    DownstreamLag:
      description: Downstream target lag
      type: object
      properties:
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    SemanticModelObject:
      type: object
      title: the semantic model object
      description: Represents a semantic model object
      properties:
        semantic_model_file:
          description: The path to a file stored in a Snowflake Stage holding the semantic model yaml. Must be a fully qualified stage url
          type: string
          example: '@db.schema.stage/path/to/file.yaml'
        semantic_view:
          description: The name of the Snowflake native semantic model object
          type: string
          example: db.schema.semantic_view
        inline_semantic_model:
          description: A string containing the entire semantic model yaml
          type: string
          example: 'name: my_semantic_model\ntables:\n  - name: orders\n...'
    MessageObject:
      type: object
      title: The message object
      description: Represents a message within a chat.
      properties:
        role:
          description: The entity that produced the message. One of `user` or `analyst`.
          type: string
          enum:
            - user
            - analyst
        content:
          description: The content of the message in array of text or SQL.
          type: array
          items:
            $ref: '#/components/schemas/MessageContent'
      required:
        - content
    MessageContent:
      type: object
      properties:
        type:
          type: string
          enum:
            - text
            - sql
            - suggestions
            - results
            - chart
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentTextObject'
          sql: '#/components/schemas/MessageContentSqlObject'
          suggestions: '#/components/schemas/MessageContentSuggestionsObject'
          results: '#/components/schemas/MessageContentResultsObject'
          chart: '#/components/schemas/MessageContentChartObject'
    MessageContentTextObject:
      type: object
      properties:
        type:
          type: string
          enum:
            - text
            - sql
            - suggestions
            - results
            - chart
        text:
          type: string
          example: To answer the question "What is the profit per store?" we must aggregate sales at the store level
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentTextObject'
          sql: '#/components/schemas/MessageContentSqlObject'
          suggestions: '#/components/schemas/MessageContentSuggestionsObject'
          results: '#/components/schemas/MessageContentResultsObject'
          chart: '#/components/schemas/MessageContentChartObject'
      title: Text
      description: The text content that is part of a message.
      required:
        - text
    MessageContentSqlObject:
      type: object
      properties:
        type:
          type: string
          enum:
            - text
            - sql
            - suggestions
            - results
            - chart
        statement:
          type: string
          description: The executable SQL statement
          example: SELECT store, SUM(profit) FROM sales GROUP BY store
        confidence:
          $ref: '#/components/schemas/Confidence'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentTextObject'
          sql: '#/components/schemas/MessageContentSqlObject'
          suggestions: '#/components/schemas/MessageContentSuggestionsObject'
          results: '#/components/schemas/MessageContentResultsObject'
          chart: '#/components/schemas/MessageContentChartObject'
      title: SQL
      description: The SQL content that is part of a message.
      required:
        - statement
    MessageContentSuggestionsObject:
      type: object
      properties:
        type:
          type: string
          enum:
            - text
            - sql
            - suggestions
            - results
            - chart
        suggestions:
          type: array
          items:
            type: string
            example: What is the lifetime revenue for the top 5 clients?
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentTextObject'
          sql: '#/components/schemas/MessageContentSqlObject'
          suggestions: '#/components/schemas/MessageContentSuggestionsObject'
          results: '#/components/schemas/MessageContentResultsObject'
          chart: '#/components/schemas/MessageContentChartObject'
      title: Suggested Questions
      description: If SQL cannot be generated, a list of questions the semantic model can generate SQL for.
      required:
        - suggestions
    MessageContentResultsObject:
      type: object
      properties:
        type:
          type: string
          enum:
            - text
            - sql
            - suggestions
            - results
            - chart
        query_id:
          type: string
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentTextObject'
          sql: '#/components/schemas/MessageContentSqlObject'
          suggestions: '#/components/schemas/MessageContentSuggestionsObject'
          results: '#/components/schemas/MessageContentResultsObject'
          chart: '#/components/schemas/MessageContentChartObject'
      title: Results
      description: Query ID of the executed query
      required:
        - query_id
    MessageContentChartObject:
      type: object
      properties:
        type:
          type: string
          enum:
            - text
            - sql
            - suggestions
            - results
            - chart
        chart_spec:
          type: string
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/MessageContentTextObject'
          sql: '#/components/schemas/MessageContentSqlObject'
          suggestions: '#/components/schemas/MessageContentSuggestionsObject'
          results: '#/components/schemas/MessageContentResultsObject'
          chart: '#/components/schemas/MessageContentChartObject'
      title: Chart
      description: The chart specification that is part of a message.
      required:
        - chart_spec
    SendMessageRequest:
      type: object
      description: The request object for sendMessage requests
      properties:
        semantic_model_file:
          type: string
          description: The path to a file stored in a Snowflake Stage holding the semantic model yaml. Must be a fully qualified stage url
          example: '@db.schema.stage/path/to/file.yaml'
        semantic_model:
          type: string
          description: A string containing the entire semantic model yaml
          example: 'name: my_semantic_model\ntables:\n  - name: orders\n...'
        semantic_view:
          type: string
          description: The name of the Snowflake native semantic model object
          example: db.schema.semantic_view
        semantic_models:
          type: array
          description: A list of semantic model objects. If set, other semantic model properties are ignored
          items:
            $ref: '#/components/schemas/SemanticModelObject'
        stream:
          type: boolean
          description: Whether to stream the response or not
          default: false
        operation:
          type: string
          enum:
            - sql_generation
            - answer_generation
          description: Whether to response with SQL or natural language. One of 'sql_generation' or 'answer_generation'
          default: sql_generation
        warehouse:
          type: string
          description: Warehouse name to use for result set handling. Only used when 'operation' is 'answer_generation'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageObject'
        source:
          type: string
          description: an optional field to specify the source of the request. e.g "eval", "prod"
        experimental:
          type: string
          description: JSON serialized string of experimental API fields (undocumented).
      required:
        - messages
    Confidence:
      type: object
      description: The verified query the response is based on
      properties:
        verified_query_used:
          $ref: '#/components/schemas/VerifiedQuery'
    VerifiedQuery:
      type: object
      description: VerifiedQuery represents a (question, sql) pair that has been manually verified (e.g. by an analyst) to be correct.
      properties:
        name:
          type: string
          description: A name for this verified query. Mainly used for display purposes.
        question:
          type: string
          description: The question being answered.
        sql:
          type: string
          description: The correct SQL query for answering the question.
        verified_at:
          type: integer
          format: int64
          description: Timestamp at which the query was last verified - measures in seconds since epoch, in UTC.
        verified_by:
          type: string
          description: Name of the person who verified this query.
    SemanticModelSelection:
      type: object
      properties:
        index:
          description: The index of the selected semantic model
          type: integer
          format: int32
        identifier:
          $ref: '#/components/schemas/SemanticModelObject'
    SendMessageResponse:
      type: object
      description: The non-streaming response object for the sendMessage
      properties:
        message:
          $ref: '#/components/schemas/MessageObject'
        request_id:
          type: string
          description: Unique request ID
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        semantic_model_selection:
          $ref: '#/components/schemas/SemanticModelSelection'
        response_metadata:
          type: object
          additionalProperties: true
      required:
        - message
    Warning:
      type: object
      title: The warning object
      description: Represents a warning within a chat.
      properties:
        message:
          type: string
          description: A human-readable message describing the warning
    GetModelsRequest:
      type: object
      properties:
        models:
          type: array
          items:
            type: string
    GetModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            type: string
    CompleteRequest:
      type: object
      description: LLM text completion request.
      properties:
        model:
          description: The model name. See documentation for possible values.
          type: string
        anthropic:
          type: object
          description: Anthropic specific configuration.
          nullable: true
          properties:
            thinking:
              type: object
              description: Thinking configuration.
              nullable: true
              properties:
                budget_tokens:
                  type: integer
                  description: The budget for thinking tokens.
                  example: 2048
              required:
                - budget_tokens
        openai:
          type: object
          description: OpenAI specific configuration.
          nullable: true
          properties:
            reasoning:
              type: object
              description: Reasoning configuration.
              nullable: true
              properties:
                effort:
                  type: string
                  description: The effort level for reasoning.
                  enum:
                    - low
                    - medium
                    - high
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                description: |
                  Indicates the role of the message, one of 'system', 'user' or 'assistant'.

                  Rules:
                    - A 'user' message must be the last message in the list.
                    - If a 'system' message is specified, it must be the first message.
                    - If a 'assistant' message is specified, it must be immediately before a 'user' message in the list.

                  Multiple 'assistant' and 'user' messages can be specified, but they must alternate in sequence.
                default: user
              content:
                type: string
                description: The text completion prompt, e.g. 'What is a Large Language Model?'.
              content_list:
                type: array
                description: Contents of text, toolUse, toolResults, or model-specific output
                items:
                  discriminator:
                    propertyName: type
                    mapping:
                      text: '#/components/schemas/TextContent'
                      tool_result: '#/components/schemas/ToolResults'
                      tool_use: '#/components/schemas/ToolUse'
                      image: '#/components/schemas/Image'
                      anthropic: '#/components/schemas/AnthropicOutput'
                      openai: '#/components/schemas/OpenAIOutput'
          minItems: 1
        temperature:
          description: Temperature controls the amount of randomness used in response generation. A higher temperature corresponds to more randomness.
          type: number
          nullable: true
          minimum: 0
        top_p:
          description: Threshold probability for nucleus sampling. A higher top-p value increases the diversity of tokens that the model considers, while a lower value results in more predictable output.
          type: number
          default: 1
          minimum: 0
          maximum: 1
        max_tokens:
          description: The maximum number of output tokens to produce. The default value is model-dependent.
          type: integer
          default: 4096
          minimum: 0
        max_output_tokens:
          deprecated: true
          description: Deprecated in favor of "max_tokens", which has identical behavior.
          type: integer
          nullable: true
        response_format:
          type: object
          nullable: true
          description: An object describing response format config for structured-output mode.
          properties:
            type:
              type: string
              enum:
                - json
              description: The response format type (e.g., "json").
            schema:
              type: string
              description: The schema defining the structure of the response. If the `type` is "json", the `schema` field should contain a valid JSON schema. (opaque JSON object)
        guardrails:
          $ref: '#/components/schemas/GuardrailsConfig'
        tools:
          description: List of tools to be used during tool calling
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        tool_choice:
          $ref: '#/components/schemas/ToolChoice'
        provisioned_throughput_id:
          type: string
          description: The provisioned throughput ID to be used with the request.
          nullable: true
        sf-ml-xp-inflight-prompt-action:
          type: string
          description: Reserved
        sf-ml-xp-inflight-prompt-client-id:
          type: string
          description: Reserved
        sf-ml-xp-inflight-prompt-public-key:
          type: string
          description: Reserved
        stream:
          type: boolean
          default: true
          nullable: true
          description: Reserved
      required:
        - model
        - messages
    GuardrailsConfig:
      type: object
      title: GuardrailsConfig
      description: Guardrails configuration
      nullable: true
      properties:
        enabled:
          type: boolean
          description: Controls whether guardrails are enabled
        response_when_unsafe:
          type: string
          description: The response when the guardrails model marks the completion as unsafe
          example: Response filtered by Cortex Guard
    Image:
      type: object
      description: reserved
      properties:
        type:
          type: string
          enum:
            - image
        details:
          $ref: '#/components/schemas/ImageDetails'
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    ImageDetails:
      type: object
      description: reserved
      properties:
        type:
          type: string
          description: Whether the image content is base64.
          enum:
            - base64
        content:
          type: string
          description: base64 encoded image.
        content_type:
          type: string
          description: Type of image.
          enum:
            - image/jpeg
            - image/jpg
            - image/png
            - image/gif
            - image/webp
            - image/heic
            - image/heif
        detail:
          type: string
          description: Level of detail to process the image. Only applicable for OpenAI models
          enum:
            - auto
            - low
            - high
    CacheControl:
      description: reserved
      type: object
      nullable: true
      properties:
        type:
          type: string
          description: |
            Identifies the type of cache control.
            “ephemeral” is the only supported cache type currently, which has a 5-minute lifetime.
          enum:
            - ephemeral
    ToolChoice:
      type: object
      nullable: true
      description: |
        Configures how tools should be selected and used during the interaction.
        Controls whether tool use is automatic, required, or specific tools should be used.
      required:
        - type
      properties:
        type:
          type: string
          description: |
            Determines how tools are selected:
            * auto - Automatic tool selection (default)
            * required - Must use at least one tool
            * tool - Use specific named tools
          example: required
        name:
          type: array
          description: List of specific tool names to use when type is 'tool'
          example:
            - Analyst1
            - Search1
          items:
            type: string
    TextContent:
      type: object
      description: |
        Represents plain text content in a message.
        Used for simple text exchanges and natural language responses.
      required:
        - type
        - text
      properties:
        type:
          type: string
          description: Identifies this as text content.
          enum:
            - text
        text:
          type: string
          description: The actual text content of the message.
          example: Based on the analysis, our top three customers by revenue are Acme Corp ($1.2M), TechGiant ($980K), and MegaCorp ($875K).
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    StreamingTextContent:
      type: object
      description: |
        Represents plain text content in a message.
        Used for simple text exchanges and natural language responses.
      properties:
        type:
          type: string
          description: Identifies this as text content.
          enum:
            - text
        content:
          type: string
          description: The actual text content of the message.
          example: Based on the analysis, our top three customers by revenue are Acme Corp ($1.2M), TechGiant ($980K), and MegaCorp ($875K).
    JSONContent:
      type: object
      description: Represents structured JSON data in a message
      required:
        - type
        - json
      properties:
        type:
          type: string
          description: Identifies this as JSON content
          enum:
            - json
        json:
          type: object
          description: Arbitrary JSON data structure
          example:
            key: value
            numbers:
              - 1
              - 2
              - 3
          additionalProperties: true
    ToolResults:
      type: object
      description: |
        Represents the results of a tool execution. Contains both the input parameters
        and output results from the tool execution.
      required:
        - type
        - tool_results
      properties:
        type:
          type: string
          description: Identifies this as tool results content
          enum:
            - tool_results
        tool_results:
          type: object
          description: Container for tool execution results and metadata
          required:
            - tool_use_id
            - name
            - content
          properties:
            tool_use_id:
              type: string
              description: Unique identifier linking this result to its corresponding tool use request
              example: tool_123456
            name:
              type: string
              description: Name of the tool that was executed. Must match a tool name from the tools array
              example: Analyst1
            content:
              type: array
              description: Array of content elements produced by the tool execution
              example:
                - type: json
                  json:
                    sql_query: SELECT * FROM sales LIMIT 10
                - type: text
                  text: Query generated successfully
              items:
                discriminator:
                  propertyName: type
                  mapping:
                    json: '#/components/schemas/JSONContent'
                    text: '#/components/schemas/TextContent'
            status:
              type: string
              description: status indicators for the tool execution
              example: success
            result:
              type: object
              description: Additional result data in an arbitrary structure
              example:
                query_id: abc123
                row_count: 150
              additionalProperties: true
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    ToolUse:
      type: object
      description: |
        Represents a request to use a specific tool. Contains the tool identifier
        and input parameters for the execution.
      required:
        - type
        - tool_use
      properties:
        type:
          type: string
          description: Identifies this as a tool use request
          enum:
            - tool_use
        tool_use:
          type: object
          description: Container for tool use request details
          required:
            - tool_use_id
            - name
            - input
          properties:
            tool_use_id:
              type: string
              description: Unique identifier for this tool use request
              example: tool_001
            name:
              type: string
              description: Name of the tool to execute. Must match a tool name from the tools array
              example: Analyst1
            input:
              type: object
              description: Input parameters for the tool execution
              example:
                query: What are the top selling products?
                limit: 5
              additionalProperties: true
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    StreamingToolUse:
      type: object
      description: |
        Represents a request to use a specific tool. Contains the tool identifier
        and input parameters for the execution.
      properties:
        tool_use_id:
          type: string
          description: Unique identifier for this tool use request
        name:
          type: string
          description: Name of the tool to execute. Must match a tool name from the tools array
        input:
          type: string
    Tool:
      type: object
      description: |
        Defines a tool that can be used by the agent.
        Tools provide specific capabilities like data analysis, search, or generic functions.
      required:
        - tool_spec
      properties:
        tool_spec:
          type: object
          description: Specification of the tool's type, configuration, and input requirements
          required:
            - type
            - name
          properties:
            type:
              type: string
              description: |
                The type of tool capability. Can be specialized types like
                'cortex_analyst_text_to_sql' or 'generic' for general-purpose tools.
              example: generic
            name:
              type: string
              description: |
                Unique identifier for referencing this tool instance.
                Used to match with configuration in tool_resources.
              example: get_weather
            description:
              type: string
              description: Description of the tool to be considered for tool use
            input_schema:
              type: object
              description: |
                JSON Schema definition of the expected input parameters for this tool.
                Required for generic tools to specify their input requirements.
              properties:
                type:
                  type: string
                  description: The type of the input schema object
                  example: object
                properties:
                  type: string
                  description: Definitions of each input parameter (opaque JSON object)
                required:
                  type: array
                  description: List of required input parameter names
                  items:
                    type: string
              additionalProperties: true
              example:
                type: object
                properties:
                  location:
                    type: string
                    description: The city and state, e.g. San Francisco, CA
                required:
                  - location
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    OpenAIOutput:
      type: object
      description: OpenAI specific output.
      properties:
        reasoning:
          $ref: '#/components/schemas/OpenAIReasoning'
    OpenAIReasoning:
      type: object
      nullable: true
      description: OpenAI reasoning output.
      properties:
        summary:
          type: string
          description: |
            Reasoning summary tokens generated during the model response.
        encrypted_content:
          type: string
          description: |
            The encrypted_content field is an opaque field and should not be interpreted or parsed.
            It should only be used for verifying that the reasoning blocks were generated by that specific model.
      required:
        - summary
        - encrypted_content
    AnthropicOutput:
      type: object
      description: Anthropic specific output.
      properties:
        thinking:
          $ref: '#/components/schemas/AnthropicThinking'
    AnthropicThinking:
      type: object
      nullable: true
      description: Anthropic thinking output.
      properties:
        thinking:
          type: string
          description: |
            Thinking tokens generated during the model response.
            This field can also be used in the follow-up requests to continue the conversation.
        signature:
          type: string
          description: |
            The signature field is an opaque field and should not be interpreted or parsed.
            It should only be used for verifying that the thinking blocks were generated by that specific model.
      required:
        - thinking
        - signature
    StreamingOpenAIOutput:
      type: object
      description: OpenAI reasoning output.
      properties:
        reasoning:
          $ref: '#/components/schemas/StreamingOpenAIReasoning'
    StreamingOpenAIReasoning:
      type: object
      nullable: true
      description: OpenAI reasoning output.
      properties:
        summary:
          type: string
          description: |
            Reasoning summary tokens generated during the model response.
          nullable: true
        encrypted_content:
          type: string
          description: |
            The encrypted_content field is an opaque field and should not be interpreted or parsed.
            It should only be used for verifying that the reasoning blocks were generated by that specific model.
          nullable: true
    StreamingAnthropicOutput:
      type: object
      description: |
        Represents the thinking response from model. Contains either the thinking tokens or signature.
      properties:
        thinking:
          $ref: '#/components/schemas/StreamingAnthropicThinking'
    StreamingAnthropicThinking:
      type: object
      nullable: true
      description: Anthropic thinking output.
      properties:
        thinking:
          type: string
          description: |
            Thinking tokens generated during the model response.
            This field can also be used in the follow-up requests to continue the conversation.
          nullable: true
        signature:
          type: string
          description: |
            The signature field is an opaque field and should not be interpreted or parsed.
            It should only be used for verifying that the thinking blocks were generated by that specific model.
          nullable: true
    NonStreamingCompleteResponse:
      type: object
      description: Text-completion response for non-streaming request.
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              message:
                type: object
                properties:
                  content:
                    type: string
                    description: The text completion response.
                  content_list:
                    type: array
                    description: Contents of text and toolUse response.
                    items:
                      discriminator:
                        propertyName: type
                        mapping:
                          text: '#/components/schemas/TextContent'
                          tool_use: '#/components/schemas/ToolUse'
                          anthropic: '#/components/schemas/AnthropicOutput'
                          openai: '#/components/schemas/OpenAIOutput'
        finish_reason:
          type: string
          nullable: true
          description: The reason the request was finished.
          enum:
            - stop
            - content_filter
            - tool_calls
            - length
        usage:
          type: object
          title: Usage
          properties:
            prompt_tokens:
              type: integer
              description: Input token count.
            completion_tokens:
              type: integer
              description: Output token count.
            guard_tokens:
              type: integer
              description: Tokens used by cortex guard.
            total_tokens:
              type: integer
              description: Sum of all tokens.
            cache_read_input_tokens:
              type: integer
              description: reserved
              nullable: true
              minimum: 0
            cache_write_input_tokens:
              type: integer
              description: reserved
              nullable: true
              minimum: 0
    StreamingCompleteResponse:
      type: string
      description: Server-sent events for streaming text-completion updates. (opaque JSON object)
      x-events:
        data:
          $ref: '#/components/schemas/StreamingCompleteResponseDataEvent'
    StreamingCompleteResponseDataEvent:
      type: object
      description: Streaming text-completion response event.
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              delta:
                $ref: '#/components/schemas/StreamingCompleteResponseDelta'
    StreamingCompleteResponseDelta:
      type: string
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/StreamingTextContent'
          tool_use: '#/components/schemas/StreamingToolUse'
          anthropic: '#/components/schemas/StreamingAnthropicOutput'
          openai: '#/components/schemas/StreamingOpenAIOutput'
      description: (opaque JSON object)
    QueryRequest:
      type: object
      description: A search query and additional parameters for search.
      properties:
        query:
          description: Unstructured text query.  Exactly one of 'query' or 'multi_index_query' must be specified.
          type: string
        multi_index_query:
          description: A search query expressed as a collection of multiple column-level queries.  Exactly one of 'query' or 'multi_index_query' must be specified. A column/index can be queried with multiple queries.
          type: object
          additionalProperties: true
        columns:
          description: List of columns to return.
          type: array
          items:
            type: string
        filter:
          description: Filter query. (opaque JSON object)
          type: string
        limit:
          description: Max number of results to return.
          type: integer
          default: 10
        scoring_config:
          $ref: '#/components/schemas/ScoringConfig'
        scoring_profile:
          description: Mutually exclusive with scoring_config. Specifies the pre-defined name of a profile on the cortex search service that resolves to scoring_config.
          type: string
        experimental:
          description: reserved
          type: object
          additionalProperties: true
    ScoringConfig:
      type: object
      description: reserved
      properties:
        functions:
          $ref: '#/components/schemas/Functions'
        reranker:
          $ref: '#/components/schemas/Reranker'
        weights:
          $ref: '#/components/schemas/Weights'
        retrieval_weights:
          $ref: '#/components/schemas/RetrievalWeights'
        ranking_weights:
          $ref: '#/components/schemas/RankingWeights'
    Weights:
      type: object
      description: Weights to apply to each scoring component.
      properties:
        texts:
          description: Weight to apply to all text-specific columns.
          type: number
          example: 0.5
        vectors:
          description: Weight to apply to all vector-specific columns.
          type: number
          example: 0.5
        reranker:
          description: Weight to apply to reranker-specific scoring component.
          type: number
          example: 0.5
    RetrievalWeights:
      type: object
      description: Weights to apply to retrieval stage components.
      properties:
        texts:
          description: Multiplier for text-based scoring in retrieval.
          type: number
          example: 1
        vectors:
          description: Multiplier for vector-based scoring in retrieval.
          type: number
          example: 1
    RankingWeights:
      type: object
      description: Weights to apply to ranking stage components.
      properties:
        texts:
          description: Multiplier for text-based scoring in ranking.
          type: number
          example: 1
        vectors:
          description: Multiplier for vector-based scoring in ranking.
          type: number
          example: 1
        reranker:
          description: Multiplier for reranker score in ranking.
          type: number
          example: 1
    Functions:
      type: object
      description: Functions to apply for scoring this request.
      properties:
        numeric_boosts:
          type: array
          items:
            $ref: '#/components/schemas/NumericBoost'
        time_decays:
          type: array
          items:
            $ref: '#/components/schemas/TimeDecay'
        text_boosts:
          type: array
          items:
            $ref: '#/components/schemas/TextBoost'
        vector_boosts:
          type: array
          items:
            $ref: '#/components/schemas/VectorBoost'
        query_similarity_boosts:
          type: array
          items:
            $ref: '#/components/schemas/QuerySimilarityBoost'
    Column:
      type: string
      description: Column to apply this function to.
    NumericBoost:
      type: object
      properties:
        column:
          $ref: '#/components/schemas/Column'
        weight:
          type: number
          description: Weight to apply for boosting this numerical column. It will be normalized across all scored columns specified in the scoring config so that all weights sum to 1. If a weight is not provided, the weight defaults to 1 pre-normalization.
          example: 0.5
      required:
        - column
    TimeDecay:
      type: object
      properties:
        column:
          $ref: '#/components/schemas/Column'
        weight:
          type: number
          description: Weight to apply for decaying this timestamp column. Normalized across all scored columns in the scoring config so that all weights sum to 1. If a weight is not provided, the weight defaults to 1 pre-normalization.
          example: 0.5
        limit_hours:
          type: number
          description: Optional limit in hours after which the decay does not apply.
          example: 24
        now:
          type: string
          format: date-time
          description: Optional reference timestamp to calculate decay from.
          example: '2022-01-01T00:00:00Z'
      required:
        - column
    TextBoost:
      type: object
      properties:
        column:
          $ref: '#/components/schemas/Column'
        weight:
          description: Weight to apply for boosting this text column.
          type: number
          example: 0.5
    VectorBoost:
      type: object
      properties:
        column:
          $ref: '#/components/schemas/Column'
        weight:
          description: Weight to apply for boosting this vector column.
          type: number
          example: 0.5
    QuerySimilarityBoost:
      type: object
      properties:
        cortex_search_service:
          description: Fully-qualified name of a Cortex Search Service through which to find similar previous queries.
          type: string
          example: MY_DB.MY_SCHEMA.MY_SEARCH_SERVICE
        previous_query_column:
          description: Name of a TEXT column indexed in the specified previous queries search service that contains the previous query strings.
          type: string
        documents_column:
          description: Name of an ARRAY column indexed in the specified previous queries search service that contains a list of documents that matched the corresponding previous query. Each document is represented as an OBJECT mapping all primary key columns to their corresponding values.
          type: string
    Reranker:
      type: string
      description: Model to use for the reranker, or "none" if the reranker should be turned off. If excluded or null, the default reranker is used.
      example: none
    ColumnQuery:
      description: Query specification of a given column. Exactly one of 'text' or 'vector' must be specified.
      type: object
      properties:
        text:
          description: Unstructured text query for querying a text index.
          type: string
        vector:
          description: Query embedding vector. Must be computed using the same model as used for embedding the column being queried.
          type: array
          items:
            type: number
            format: float
    QueryResponse:
      type: object
      description: Search results.
      properties:
        results:
          type: array
          description: List of result rows.
          items:
            type: object
            additionalProperties: true
            description: Map of column names to values (as bytes).
        request_id:
          type: string
          description: ID of the request.
      required:
        - results
        - request_id
    ResultRow:
      type: object
      description: Map of column names to values.
      properties:
        columns:
          type: string
          description: (opaque JSON object)
    SuggestQueryRequest:
      type: object
      description: A Suggest request.
      properties:
        query:
          description: The text query on which to suggest.
          type: string
        columns:
          description: List of columns to return.
          type: array
          items:
            type: string
        limit:
          description: Max number of results to return.
          type: integer
          default: 5
      required:
        - query
    SuggestResult:
      type: object
      description: Suggest results.
      properties:
        rows:
          type: array
          description: List of result rows.
          items:
            $ref: '#/components/schemas/ResultRow'
    SuggestQueryResponse:
      type: object
      description: Suggest results.
      properties:
        results:
          type: array
          description: List of result rows.
          items:
            $ref: '#/components/schemas/SuggestResult'
        request_id:
          type: string
          description: ID of the request.
      required:
        - results
        - request_id
    CortexSearchService:
      type: object
      description: A Snowflake cortex search service object.
      properties:
        name:
          type: string
          description: Specifies the name for the cortex search service, must be unique for the schema in which the cortex search service is created
        search_column:
          type: string
          description: Specifies the name of the search column for the cortex search service.
        columns:
          type: array
          items:
            type: string
          description: Specifies all columns included in the cortex search service and that can be returned in search queries.
        attribute_columns:
          type: array
          items:
            type: string
          description: Specifies the attribute columns, which can be referenced in filters in search queries to the cortex search service.
        target_lag:
          $ref: '#/components/schemas/TargetLag'
          description: Specifies the schedule for periodically refreshing the cortex search service.
        warehouse:
          type: string
          description: Specifies the name of the warehouse that provides the compute resources for refreshing the cortex search service
          example: test_wh
        definition:
          type: string
          description: Specifies the definition (source query) used to create the cortex search service
          example: SELECT col1, col2 FROM foo
        comment:
          type: string
          description: Specifies a comment for the cortex search service
        created_on:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the cortex search service was created.
        database_name:
          type: string
          readOnly: true
          description: Database in which the cortex search service is stored
        schema_name:
          type: string
          readOnly: true
          description: Schema in which the cortex search service is stored
        source_data_num_rows:
          type: integer
          format: int64
          readOnly: true
          description: Number of rows in the materialized source data feeding into the cortex search service.
        data_timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Date and time as of which data existent in base tables is now serving.
        indexing_state:
          $ref: '#/components/schemas/SchedulingState'
          description: Current state of the indexing pipeline for the cortex search service; one of 'SUSPENDED' or 'ACTIVE'.
        serving_state:
          $ref: '#/components/schemas/SchedulingState'
          description: Whether the cortex search service is currently actively serving; one of 'SUSPENDED' or 'ACTIVE'.
        indexing_error:
          type: string
          readOnly: true
          description: Error encountered during the latest indexing pipeline of the cortex search service, if any.
        serving_data_bytes:
          type: integer
          format: int64
          readOnly: true
          description: Size of the serving index, in bytes.
    SchedulingState:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - INITIALIZING
    SendFeedbackRequest_cortex_search_service:
      type: object
      description: The request object for sending user feedback on Cortex Search results
      properties:
        request_id:
          type: string
          description: Request id associated with the feedback
        positive:
          type: boolean
          description: Whether the results were good (true) or bad (false)
        feedback_message:
          type: string
          description: The text for the detailed feedback message
      required:
        - request_id
        - positive
    CortexAnthropicMessagesRequest:
      type: object
      description: Anthropic Messages API compatible request (JSON mode).
      required:
        - model
        - messages
        - max_tokens
      properties:
        model:
          type: string
          description: Model that will complete the prompt.
        messages:
          type: array
          description: Input messages.
          items:
            type: string
            description: (opaque JSON object)
        max_tokens:
          type: integer
          description: Maximum number of tokens to generate.
        system:
          type: string
          description: System prompt.
        temperature:
          type: number
          description: Amount of randomness injected into the response.
        top_p:
          type: number
          description: Nucleus sampling threshold.
        top_k:
          type: integer
          description: Only sample from the top K options for each token.
        stop_sequences:
          type: array
          description: Custom sequences that will stop generation.
          items:
            type: string
        stream:
          type: boolean
          description: Must be false or omitted - streaming (SSE) responses are out of scope.
          default: false
        tools:
          type: array
          description: Definitions of tools the model may use.
          items:
            type: string
            description: (opaque JSON object)
        tool_choice:
          type: string
          description: How the model should use the provided tools. (opaque JSON object)
    CortexAnthropicMessagesResponse:
      type: object
      description: Anthropic Messages API compatible response.
      properties:
        id:
          type: string
          description: Unique message identifier.
        type:
          type: string
          description: Object type (message).
        role:
          type: string
          description: Conversational role of the generated message (assistant).
        model:
          type: string
          description: Model that handled the request.
        content:
          type: array
          description: Generated content blocks.
          items:
            type: string
            description: (opaque JSON object)
        stop_reason:
          type: string
          description: Reason generation stopped.
        stop_sequence:
          type: string
          description: Which custom stop sequence was generated, if any.
        usage:
          type: string
          description: Billing and rate-limit token usage. (opaque JSON object)
    CortexOpenAIChatCompletionsRequest:
      type: object
      description: OpenAI Chat Completions API compatible request (JSON mode).
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: Model to use for the completion.
        messages:
          type: array
          description: Messages comprising the conversation so far.
          items:
            type: string
            description: (opaque JSON object)
        max_completion_tokens:
          type: integer
          description: Upper bound for generated completion tokens.
        temperature:
          type: number
          description: Sampling temperature.
        top_p:
          type: number
          description: Nucleus sampling threshold.
        'n':
          type: integer
          description: Number of chat completion choices to generate.
        stream:
          type: boolean
          description: Must be false or omitted - streaming (SSE) responses are out of scope.
          default: false
        stop:
          type: array
          description: Sequences where the API will stop generating.
          items:
            type: string
        presence_penalty:
          type: number
          description: Penalize new tokens based on presence so far.
        frequency_penalty:
          type: number
          description: Penalize new tokens based on frequency so far.
        response_format:
          type: string
          description: Output format specification (e.g. JSON mode). (opaque JSON object)
        tools:
          type: array
          description: Tools the model may call.
          items:
            type: string
            description: (opaque JSON object)
        tool_choice:
          type: string
          description: Controls which (if any) tool is called. (opaque JSON object)
        user:
          type: string
          description: Stable end-user identifier.
    CortexOpenAIChatCompletionsResponse:
      type: object
      description: OpenAI Chat Completions API compatible response.
      properties:
        id:
          type: string
          description: Unique completion identifier.
        object:
          type: string
          description: Object type (chat.completion).
        created:
          type: integer
          description: Unix timestamp of creation.
        model:
          type: string
          description: Model used for the completion.
        choices:
          type: array
          description: Completion choices.
          items:
            type: string
            description: (opaque JSON object)
        usage:
          type: string
          description: Completion token usage. (opaque JSON object)
        system_fingerprint:
          type: string
          description: Backend configuration fingerprint.
    ListCortexSearchServicesResponse:
      type: object
      properties:
        cortex_search_services:
          type: array
          items:
            $ref: '#/components/schemas/CortexSearchService'
  securitySchemes:
    KeyPair:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Set `X-Snowflake-Authorization-Token-Type` to `KEYPAIR_JWT` if the token is a key-pair authentication JWT.
    ExternalOAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Configure External Oauth with Snowflake (see <a href=https://docs.snowflake.com/en/user-guide/oauth-ext-overview>External OAuth overview</a>.) Set `X-Snowflake-Authorization-Token-Type` to `OAUTH` and set the Token to the auth token received from the external Auth server.
    SnowflakeOAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: /oauth/authorize
          scopes: {}
      description: Set `X-Snowflake-Authorization-Token-Type` to `OAUTH` if the token is snowflakeOAuth
  parameters:
    application:
      name: application
      description: Identifier (i.e. name) for the application to which the resource belongs. You can use the `/api/v2/applications/{application}` GET request to get a list of available applications.
      required: true
      in: path
      schema:
        example: TEST_APPLICATION
        $ref: '#/components/schemas/Identifier'
    name:
      name: name
      description: Identifier (i.e. name) for the resource.
      required: true
      in: path
      schema:
        example: TEST_NAME
        $ref: '#/components/schemas/Identifier'
    createMode:
      name: createMode
      description: |-
        Parameter allowing support for different modes of resource creation. Possible values include:
        - `errorIfExists`: Throws an error if you try to create a resource that already exists.
        - `orReplace`: Automatically replaces the existing resource with the current one.
        - `ifNotExists`: Creates a new resource when an alter is requested for a non-existent resource.
      in: query
      schema:
        type: string
        enum:
          - errorIfExists
          - orReplace
          - ifNotExists
        example: ifNotExists
        default: errorIfExists
    mode:
      name: mode
      description: |-
        Parameter determines whether the revoke operation succeeds or fails for the privileges, based on the whether the privileges had been re-granted to another role.
        - restrict: If the privilege being revoked has been re-granted to another role, the REVOKE command fails.
        - cascade: If the privilege being revoked has been re-granted, the REVOKE command recursively revokes these dependent grants. If the same privilege on an object has been granted to the target role by a different grantor (parallel grant), that grant is not affected and the target role retains the privilege.
      in: query
      schema:
        type: string
        enum:
          - restrict
          - cascade
        example: restrict
    ifExists:
      name: ifExists
      description: |-
        Parameter that specifies how to handle the request for a resource that does not exist:
        - `true`: The endpoint does not throw an error if the resource does not exist. It returns a 200 success response, but does not take any action on the resource.
        - `false`: The endpoint throws an error if the resource doesn't exist.
      in: query
      schema:
        type: boolean
        example: true
        default: false
    like:
      name: like
      description: Parameter to filter the command output by resource name. Uses case-insensitive pattern matching, with support for SQL wildcard characters.
      in: query
      schema:
        type: string
        example: test_%
    pattern:
      name: pattern
      description: Parameter that filters the command output by a regular expression pattern.
      in: query
      schema:
        type: string
        example: .*data_0.*
    startsWith:
      name: startsWith
      description: Parameter to filter the command output based on the string of characters that appear at the beginning of the object name. Uses case-sensitive pattern matching.
      in: query
      schema:
        type: string
        example: test
    rootOnly:
      name: rootOnly
      description: Parameter to filter the command output to return only root resources (resources with no predecessors).
      in: query
      schema:
        type: boolean
        example: false
        default: false
    showLimit:
      name: showLimit
      description: Parameter to limit the maximum number of rows returned by a command.
      in: query
      schema:
        type: integer
        example: 10
        minimum: 1
        maximum: 10000
    fromName:
      name: fromName
      description: Parameter to enable fetching rows only following the first row whose object name matches the specified string. Case-sensitive and does not have to be the full name.
      in: query
      schema:
        type: string
        example: from_test
    copyGrants:
      name: copyGrants
      description: Parameter to enable copy grants when creating the object.
      in: query
      schema:
        type: boolean
        example: false
        default: false
    asyncExec:
      name: asyncExec
      in: query
      description: Asynchronous execution enable/disable. Default is disable.
      schema:
        type: boolean
        default: false
    sessionId:
      name: sessionId
      description: Unique ID for the current session.
      required: true
      in: path
      schema:
        type: integer
        format: uuid
        example: 524514326772799
    content-type:
      name: Content-Type
      description: Type of content for the resource. Currently supports `application/json`.
      in: header
      schema:
        type: string
        enum:
          - application/json
    accept:
      name: Accept
      description: Type of data format accepted by the resource. Currently supports `application/json`.
      in: header
      schema:
        type: string
        enum:
          - application/json
    x-snowflake-authorization-token-type:
      name: X-Snowflake-Authorization-Token-Type
      description: Type of the Snowflake authorization token. Currently, keypair-jwt (`KEYPAIR_JWT`) and OAuth tokens are supported.
      in: header
      schema:
        type: string
        enum:
          - KEYPAIR_JWT
          - OAUTH
    x-sfc-session:
      name: X-Sfc-Session
      description: Token for the current Snowflake session.
      in: header
      required: false
      schema:
        type: string
        description: Snowflake session token.
        example: ver:3-hint:1000-ABCD=
    database_name:
      name: database_name
      description: Identifier (i.e. name) for the database to which the resource belongs. You can use the `/api/v2/databases` GET request to get a list of available databases.
      required: true
      in: path
      schema:
        example: TEST_DB
        $ref: '#/components/schemas/Identifier'
    schema_name:
      name: schema_name
      description: Identifier (i.e. name) for the schema to which the resource belongs. You can use the `/api/v2/databases/{database}/schemas` GET request to get a list of available schemas for the specified database.
      required: true
      in: path
      schema:
        example: TEST_SCHEMA
        $ref: '#/components/schemas/Identifier'
    name_with_args:
      name: name_with_args
      description: Function's name with Args
      required: true
      in: path
      schema:
        type: string
        example: foo(a number, b number)
    suspendResumeTarget:
      name: target
      description: Query parameter that identifies the target to which suspension or resumption of the cortex search service should be applied.
      in: query
      schema:
        type: string
        enum:
          - indexing
          - INDEXING
          - serving
          - SERVING
        example: indexing
  headers:
    X-Snowflake-Request-ID:
      description: Unique ID of the API request.
      schema:
        type: string
        format: uuid
    Link:
      description: Links to the page of results (e.g. the first page, the last page, etc.). The header can include multiple 'url' entries with different 'rel' attribute values that specify the page to return ('first', 'next', 'prev', and 'last').
      schema:
        type: string
        example: </api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=0>; rel="first",</api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=1>; rel="next",</api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=9>; rel="last"
  responses:
    200SuccessResponse:
      description: Successful request.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    201SuccessCreatedResponse:
      description: Successfully created a new resource on the server.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    202SuccessAcceptedResponse:
      headers:
        Location:
          schema:
            type: string
            description: Relative path for checking request status or getting the result, if available.
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      description: Successfully accepted the request, but it is not completed yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessAcceptedResponse'
    400BadRequest:
      description: Bad Request. The request payload is invalid or malformed. This happens if the application didn't send the correct request payload. The response body may include the error code and message indicating the actual cause. The application must reconstruct the request body for retry.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Unauthorized. The request is not authorized. This happens if the attached access token is invalid or missing. The response body may include the error code and message indicating the actual cause, e.g., expired, invalid token. The application must obtain a new access token for retry.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    403Forbidden:
      description: Forbidden. The request is forbidden. This can also happen if the request is made even if the API is not enabled.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Not Found. The request endpoint is not valid. This happens if the API endpoint does not exist, or if the API is not enabled.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    405MethodNotAllowed:
      description: Method Not Allowed. The request method doesn't match the supported API. This happens, for example, if the application calls the API with GET method but the endpoint accepts only POST.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    408RequestTimeout:
      description: Request Timeout. This indicates that the request from the client timed out and was not completed by the server.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    409Conflict:
      description: Conflict. The requested operation could not be performed due to a conflicting state that could not be resolved. This usually happens when a CREATE request was performed when there is a pre-existing resource with the same name, and also without one of the options orReplace/ifNotExists.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    410Gone:
      description: Gone. This error is primarily intended to assist the task of web maintenance by notifying the recipient that the resource is intentionally unavailable.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    415UnsupportedMediaType:
      description: The request header Content-Type includes an unsupported media type. The API supports application/json only. If none specified, the request payload is taken as JSON, but if any other media type is specified, this error is returned.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    429LimitExceeded:
      description: Limit Exceeded. The number of requests hit the rate limit. The application must slow down the frequency of hitting the API endpoints.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    500InternalServerError:
      description: Internal Server Error. The server hit an unrecoverable system error. The response body may include the error code and message for further guidance. The application owner may need to reach out the customer support.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    503ServiceUnavailable:
      description: Service Unavailable. The request was not processed due to server side timeouts. The application may retry with backoff. The jittered backoff is recommended.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    504GatewayTimeout:
      description: Gateway Timeout. The request was not processed due to server side timeouts. The application may retry with backoff. The jittered backoff is recommended.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
