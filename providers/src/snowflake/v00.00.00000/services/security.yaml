components:
  schemas:
    NetworkPolicy:
      type: object
      description: A Snowflake network policy
      properties:
        name:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          description: Name of the network policy
        allowed_network_rule_list:
          type: array
          items:
            type: string
          description: List of names of allowed network rules in a network policy
        blocked_network_rule_list:
          type: array
          items:
            type: string
          description: List of names of blocked network rules in a network policy
        allowed_ip_list:
          type: array
          items:
            type: string
          description: List of allowed IPs in a network policy
        blocked_ip_list:
          type: array
          items:
            type: string
          description: List of blocked IPs in a network policy
        comment:
          type: string
          description: user comment associated to an object in the dictionary
        created_on:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the network policy was created.
        owner:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          readOnly: true
          description: Role that owns the network policy
        owner_role_type:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          readOnly: true
          description: The type of role that owns the network policy
      required:
        - name
    Identifier:
      type: string
      description: A Snowflake object identifier. If the identifier contains spaces or special characters, the entire string must be enclosed in double quotes. Identifiers enclosed in double quotes are also case-sensitive.
      pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
      example: TEST_NAME
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message returned by the server
        code:
          type: string
          description: Error code.
        error_code:
          type: string
          description: Error code, same as `code` above. This property has been deprecated and will be removed in a future release, but is temporarily supported for for short-term backward compatibility.
        request_id:
          type: string
          description: Unique request ID.
      example:
        message: Compilation error!
        error_code: '390189'
        request_id: 01afef9d-0607-0550-0001-dd270c3902d7
    SuccessResponse:
      type: object
      description: Schema for all the success responses returned by the server.
      properties:
        status:
          type: string
          description: Message returned by the server.
      example:
        status: Request successfully completed
    SuccessAcceptedResponse:
      type: object
      description: Schema for a request in progress response returned by the server.
      properties:
        code:
          type: string
          description: Message code returned by the server.
        message:
          type: string
          description: Message returned by the server
        resultHandler:
          type: string
          description: Opaque result ID used for checking for request completion through one or more subsequent completion check operations.
      example:
        code: '392604'
        message: Request execution in progress. Use the provided location header or result handler ID to perform query monitoring and management.
    PointOfTime:
      type: object
      description: Point of time.
      required:
        - point_of_time_type
      properties:
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeTimestamp:
      description: Point of time identified by a timestamp.
      properties:
        timestamp:
          type: string
          description: Timestamp of the point of time (e.g. TO_TIMESTAMP(1749423600))
          example: TO_TIMESTAMP(1749423600)
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeOffset:
      description: Point of time identified by an offset in reference to the current time
      properties:
        offset:
          type: string
          description: The difference in seconds from the current time in the form -N where N can be an integer or arithmetic expression (e.g. -120).
          example: '-120'
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeStatement:
      description: Point of time indicating when a statement was executed.
      properties:
        statement:
          type: string
          description: Query ID of a statement to use as the reference point (e.g. 01bcf40d-0002-197f-0000-045701e2306e).
          example: 01bcf40d-0002-197f-0000-045701e2306e
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    Parameter:
      description: Snowflake parameter defined at the system, account, user, session, or object level.
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Parameter name.
        value:
          type: string
          description: Parameter value.
        defaultValue:
          type: string
          description: Default parameter value.
        dataType:
          type: string
          description: Data type of the parameter value. Either BOOLEAN, NUMBER, FLOAT, or STRING.
        level:
          type: string
          description: Level at which parameter is defined.
        description:
          type: string
          description: Parameter description.
      example:
        name: SAMPLE_SNOWAPI_PARAM
        value: true
        defaultValue: false
        dataType: boolean
        level: ACCOUNT
        description: Sample snowflake parameter.
    TargetLag:
      type: object
      description: Specifies the schedule for periodically refreshing the dynamic table.
      properties:
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    UserDefinedLag:
      description: User-defined target lag.
      properties:
        seconds:
          type: integer
          format: int64
          description: Target lag time in seconds.
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      example:
        seconds: 3600
      required:
        - seconds
      type: object
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    DownstreamLag:
      description: Downstream target lag
      type: object
      properties:
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    NetworkRule:
      type: object
      description: A Snowflake network rule
      properties:
        type:
          type: string
          description: Type of the network rule
        mode:
          type: string
          description: 'Specifies what is restricted by the network rule. Possible values: INGRESS, INTERNAL_STAGE, EGRESS'
        value_list:
          type: array
          items:
            type: string
          description: List of values in a network rule
        comment:
          type: string
          description: Comment for the network rule
        name:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          description: Name of the network rule
        created_on:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the network rule was created
        database_name:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          readOnly: true
          description: Database in which the network rule is stored
        schema_name:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          readOnly: true
          description: Schema in which the network rule is stored
        owner:
          type: string
          pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
          readOnly: true
          description: Role that owns the network rule
        owner_role_type:
          type: string
          readOnly: true
          description: The type of role that owns the network rule
      required:
        - type
        - name
    PasswordPolicy:
      type: object
      description: A Snowflake password policy
      properties:
        comment:
          type: string
          description: Comment for the password policy
        password_min_length:
          type: integer
          description: Minimum length of new password.
        password_max_length:
          type: integer
          description: Maximum length of new password.
