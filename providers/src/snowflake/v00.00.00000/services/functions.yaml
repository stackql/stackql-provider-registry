components:
  schemas:
    Function:
      type: object
      description: A Snowflake function
      discriminator:
        propertyName: function_type
        mapping:
          service-function: '#/components/schemas/ServiceFunction'
      properties:
        function_type:
          type: string
          default: service-function
        name:
          type: string
          description: >-
            Specifies the name for the function, must be unique for the schema
            in which the function is created
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/FunctionArgument'
        returns:
          type: string
          description: Specifies the type for the function return value.
          default: TEXT
        max_batch_rows:
          type: integer
          description: Specifies the max rows for batch operation.
        created_on:
          type: string
          format: date-time
          description: Date and time when the function was created.
        signature:
          type: string
          description: Function's arguments.
        language:
          type: string
          description: Function's language.
        body:
          type: string
          description: Function's body.
      required:
        - name
        - arguments
    FunctionArgument:
      type: object
      description: An argument of function
      properties:
        name:
          type: string
          description: Argument's name
        datatype:
          description: Argument's type
          type: string
          default: TEXT
        value:
          description: Argument's value
    FunctionArguments:
      type: array
      items:
        $ref: '#/components/schemas/FunctionArgument'
    ServiceFunction:
      description: Service based function
      required:
        - service
        - endpoint
        - path
        - name
        - arguments
      properties:
        service:
          $ref: '#/components/schemas/Identifier'
          description: Service's name
        service_database:
          $ref: '#/components/schemas/Identifier'
          description: Service's database name
        service_schema:
          $ref: '#/components/schemas/Identifier'
          description: Service's schema name
        endpoint:
          type: string
          description: Function's endpoint
        path:
          type: string
          description: Function's path
        function_type:
          type: string
          default: service-function
        name:
          type: string
          description: >-
            Specifies the name for the function, must be unique for the schema
            in which the function is created
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/FunctionArgument'
        returns:
          type: string
          description: Specifies the type for the function return value.
          default: TEXT
        max_batch_rows:
          type: integer
          description: Specifies the max rows for batch operation.
        created_on:
          type: string
          format: date-time
          description: Date and time when the function was created.
        signature:
          type: string
          description: Function's arguments.
        language:
          type: string
          description: Function's language.
        body:
          type: string
          description: Function's body.
      type: object
      discriminator:
        propertyName: function_type
        mapping:
          service-function: '#/components/schemas/ServiceFunction'
    Identifier:
      type: string
      description: >-
        A Snowflake object identifier. If the identifier contains spaces or
        special characters, the entire string must be enclosed in double quotes.
        Identifiers enclosed in double quotes are also case-sensitive.
      pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
      example: TEST_NAME
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message returned by the server
        code:
          type: string
          description: Error code.
        error_code:
          type: string
          description: >-
            Error code, same as `code` above. This property has been deprecated
            and will be removed in a future release, but is temporarily
            supported for for short-term backward compatibility.
        request_id:
          type: string
          description: Unique request ID.
      example:
        message: Compilation error!
        error_code: '390189'
        request_id: 01afef9d-0607-0550-0001-dd270c3902d7
    SuccessResponse:
      type: object
      description: Schema for all the success responses returned by the server.
      properties:
        status:
          type: string
          description: Message returned by the server.
      example:
        status: Request successfully completed
    SuccessAcceptedResponse:
      type: object
      description: Schema for a request in progress response returned by the server.
      properties:
        code:
          type: string
          description: Message code returned by the server.
        message:
          type: string
          description: Message returned by the server
        resultHandler:
          type: string
          description: >-
            Opaque result ID used for checking for request completion through
            one or more subsequent completion check operations.
      example:
        code: '392604'
        message: >-
          Request execution in progress. Use the provided location header or
          result handler ID to perform query monitoring and management.
    PointOfTime:
      type: object
      description: Point of time.
      required:
        - point_of_time_type
      properties:
        point_of_time_type:
          description: >-
            Type of the point of time. Possible values include:

            - `timestamp`: Exact time using the standard timezone format.
            Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative
            to 'now.' in the form -N where N can be an integer or arithmetic
            expression. Example: `-120` - `statement`: ID of a query statement
            to use as the reference point for <a
            href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time
            Travel</a>.

            For more information, see
            https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: >-
            Relation to the point of time. Currently, the API supports `at` and
            `before`.
          example: at
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeTimestamp:
      description: Point of time identified by a timestamp.
      properties:
        timestamp:
          type: string
          description: Timestamp of the point of time (e.g. TO_TIMESTAMP(1749423600))
          example: TO_TIMESTAMP(1749423600)
        point_of_time_type:
          description: >-
            Type of the point of time. Possible values include:

            - `timestamp`: Exact time using the standard timezone format.
            Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative
            to 'now.' in the form -N where N can be an integer or arithmetic
            expression. Example: `-120` - `statement`: ID of a query statement
            to use as the reference point for <a
            href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time
            Travel</a>.

            For more information, see
            https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: >-
            Relation to the point of time. Currently, the API supports `at` and
            `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeOffset:
      description: Point of time identified by an offset in reference to the current time
      properties:
        offset:
          type: string
          description: >-
            The difference in seconds from the current time in the form -N where
            N can be an integer or arithmetic expression (e.g. -120).
          example: '-120'
        point_of_time_type:
          description: >-
            Type of the point of time. Possible values include:

            - `timestamp`: Exact time using the standard timezone format.
            Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative
            to 'now.' in the form -N where N can be an integer or arithmetic
            expression. Example: `-120` - `statement`: ID of a query statement
            to use as the reference point for <a
            href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time
            Travel</a>.

            For more information, see
            https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: >-
            Relation to the point of time. Currently, the API supports `at` and
            `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeStatement:
      description: Point of time indicating when a statement was executed.
      properties:
        statement:
          type: string
          description: >-
            Query ID of a statement to use as the reference point (e.g.
            01bcf40d-0002-197f-0000-045701e2306e).
          example: 01bcf40d-0002-197f-0000-045701e2306e
        point_of_time_type:
          description: >-
            Type of the point of time. Possible values include:

            - `timestamp`: Exact time using the standard timezone format.
            Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative
            to 'now.' in the form -N where N can be an integer or arithmetic
            expression. Example: `-120` - `statement`: ID of a query statement
            to use as the reference point for <a
            href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time
            Travel</a>.

            For more information, see
            https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: >-
            Relation to the point of time. Currently, the API supports `at` and
            `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
