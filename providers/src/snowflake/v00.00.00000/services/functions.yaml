  securitySchemes:
    KeyPair:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Set `X-Snowflake-Authorization-Token-Type` to `KEYPAIR_JWT` if the token
        is a key-pair authentication JWT.
    ExternalOAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Configure External Oauth with Snowflake (see <a
        href=https://docs.snowflake.com/en/user-guide/oauth-ext-overview>External
        OAuth overview</a>.) Set `X-Snowflake-Authorization-Token-Type` to
        `OAUTH` and set the Token to the auth token received from the external
        Auth server.
    SnowflakeOAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: /oauth/authorize
          scopes: {}
      description: >-
        Set `X-Snowflake-Authorization-Token-Type` to `OAUTH` if the token is
        snowflakeOAuth
  parameters:
    application:
      name: application
      description: >-
        Identifier (i.e. name) for the application to which the resource
        belongs. You can use the `/api/v2/applications/{application}` GET
        request to get a list of available applications.
      required: true
      in: path
      schema:
        example: TEST_APPLICATION
        $ref: '#/components/schemas/Identifier'
    name:
      name: name
      description: Identifier (i.e. name) for the resource.
      required: true
      in: path
      schema:
        example: TEST_NAME
        $ref: '#/components/schemas/Identifier'
    createMode:
      name: createMode
      description: >-
        Parameter allowing support for different modes of resource creation.
        Possible values include:

        - `errorIfExists`: Throws an error if you try to create a resource that
        already exists.

        - `orReplace`: Automatically replaces the existing resource with the
        current one.

        - `ifNotExists`: Creates a new resource when an alter is requested for a
        non-existent resource.
      in: query
      schema:
        type: string
        enum:
          - errorIfExists
          - orReplace
          - ifNotExists
        example: ifNotExists
        default: errorIfExists
    mode:
      name: mode
      description: >-
        Parameter determines whether the revoke operation succeeds or fails for
        the privileges, based on the whether the privileges had been re-granted
        to another role.

        - restrict: If the privilege being revoked has been re-granted to
        another role, the REVOKE command fails.

        - cascade: If the privilege being revoked has been re-granted, the
        REVOKE command recursively revokes these dependent grants. If the same
        privilege on an object has been granted to the target role by a
        different grantor (parallel grant), that grant is not affected and the
        target role retains the privilege.
      in: query
      schema:
        type: string
        enum:
          - restrict
          - cascade
        example: restrict
    ifExists:
      name: ifExists
      description: >-
        Parameter that specifies how to handle the request for a resource that
        does not exist:

        - `true`: The endpoint does not throw an error if the resource does not
        exist. It returns a 200 success response, but does not take any action
        on the resource.

        - `false`: The endpoint throws an error if the resource doesn't exist.
      in: query
      schema:
        type: boolean
        example: true
        default: false
    like:
      name: like
      description: >-
        Parameter to filter the command output by resource name. Uses
        case-insensitive pattern matching, with support for SQL wildcard
        characters.
      in: query
      schema:
        type: string
        example: test_%
    pattern:
      name: pattern
      description: >-
        Parameter that filters the command output by a regular expression
        pattern.
      in: query
      schema:
        type: string
        example: .*data_0.*
    startsWith:
      name: startsWith
      description: >-
        Parameter to filter the command output based on the string of characters
        that appear at the beginning of the object name. Uses case-sensitive
        pattern matching.
      in: query
      schema:
        type: string
        example: test
    rootOnly:
      name: rootOnly
      description: >-
        Parameter to filter the command output to return only root resources
        (resources with no predecessors).
      in: query
      schema:
        type: boolean
        example: false
        default: false
    showLimit:
      name: showLimit
      description: Parameter to limit the maximum number of rows returned by a command.
      in: query
      schema:
        type: integer
        example: 10
        minimum: 1
        maximum: 10000
    fromName:
      name: fromName
      description: >-
        Parameter to enable fetching rows only following the first row whose
        object name matches the specified string. Case-sensitive and does not
        have to be the full name.
      in: query
      schema:
        type: string
        example: from_test
    copyGrants:
      name: copyGrants
      description: Parameter to enable copy grants when creating the object.
      in: query
      schema:
        type: boolean
        example: false
        default: false
    asyncExec:
      name: asyncExec
      in: query
      description: Asynchronous execution enable/disable. Default is disable.
      schema:
        type: boolean
        default: false
    sessionId:
      name: sessionId
      description: Unique ID for the current session.
      required: true
      in: path
      schema:
        type: integer
        format: uuid
        example: 524514326772799
    content-type:
      name: Content-Type
      description: Type of content for the resource. Currently supports `application/json`.
      in: header
      schema:
        type: string
        enum:
          - application/json
    accept:
      name: Accept
      description: >-
        Type of data format accepted by the resource. Currently supports
        `application/json`.
      in: header
      schema:
        type: string
        enum:
          - application/json
    x-snowflake-authorization-token-type:
      name: X-Snowflake-Authorization-Token-Type
      description: >-
        Type of the Snowflake authorization token. Currently, keypair-jwt
        (`KEYPAIR_JWT`) and OAuth tokens are supported.
      in: header
      schema:
        type: string
        enum:
          - KEYPAIR_JWT
          - OAUTH
    x-sfc-session:
      name: X-Sfc-Session
      description: Token for the current Snowflake session.
      in: header
      required: false
      schema:
        type: string
        description: Snowflake session token.
        example: ver:3-hint:1000-ABCD=
    database_name:
      name: database_name
      description: >-
        Identifier (i.e. name) for the database to which the resource belongs.
        You can use the `/api/v2/databases` GET request to get a list of
        available databases.
      required: true
      in: path
      schema:
        example: TEST_DB
        $ref: '#/components/schemas/Identifier'
    schema_name:
      name: schema_name
      description: >-
        Identifier (i.e. name) for the schema to which the resource belongs. You
        can use the `/api/v2/databases/{database}/schemas` GET request to get a
        list of available schemas for the specified database.
      required: true
      in: path
      schema:
        example: TEST_SCHEMA
        $ref: '#/components/schemas/Identifier'
    name_with_args:
      name: name_with_args
      description: Function's name with Args
      required: true
      in: path
      schema:
        type: string
        example: foo(a number, b number)
  headers:
    X-Snowflake-Request-ID:
      description: Unique ID of the API request.
      schema:
        type: string
        format: uuid
    Link:
      description: >-
        Links to the page of results (e.g. the first page, the last page, etc.).
        The header can include multiple 'url' entries with different 'rel'
        attribute values that specify the page to return ('first', 'next',
        'prev', and 'last').
      schema:
        type: string
        example: >-
          </api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=0>;
          rel="first",</api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=1>;
          rel="next",</api/v2/results/01b66701-0000-001c-0000-0030000b91521?page=9>;
          rel="last"
  responses:
    200SuccessResponse:
      description: Successful request.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    201SuccessCreatedResponse:
      description: Successfully created a new resource on the server.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    202SuccessAcceptedResponse:
      headers:
        Location:
          schema:
            type: string
            description: >-
              Relative path for checking request status or getting the result,
              if available.
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      description: Successfully accepted the request, but it is not completed yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessAcceptedResponse'
    400BadRequest:
      description: >-
        Bad Request. The request payload is invalid or malformed. This happens
        if the application didn't send the correct request payload. The response
        body may include the error code and message indicating the actual cause.
        The application must reconstruct the request body for retry.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: >-
        Unauthorized. The request is not authorized. This happens if the
        attached access token is invalid or missing. The response body may
        include the error code and message indicating the actual cause, e.g.,
        expired, invalid token. The application must obtain a new access token
        for retry.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    403Forbidden:
      description: >-
        Forbidden. The request is forbidden. This can also happen if the request
        is made even if the API is not enabled.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: >-
        Not Found. The request endpoint is not valid. This happens if the API
        endpoint does not exist, or if the API is not enabled.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    405MethodNotAllowed:
      description: >-
        Method Not Allowed. The request method doesn't match the supported API.
        This happens, for example, if the application calls the API with GET
        method but the endpoint accepts only POST.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    408RequestTimeout:
      description: >-
        Request Timeout. This indicates that the request from the client timed
        out and was not completed by the server.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    409Conflict:
      description: >-
        Conflict. The requested operation could not be performed due to a
        conflicting state that could not be resolved. This usually happens when
        a CREATE request was performed when there is a pre-existing resource
        with the same name, and also without one of the options
        orReplace/ifNotExists.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    410Gone:
      description: >-
        Gone. This error is primarily intended to assist the task of web
        maintenance by notifying the recipient that the resource is
        intentionally unavailable.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    415UnsupportedMediaType:
      description: >-
        The request header Content-Type includes an unsupported media type. The
        API supports application/json only. If none specified, the request
        payload is taken as JSON, but if any other media type is specified, this
        error is returned.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    429LimitExceeded:
      description: >-
        Limit Exceeded. The number of requests hit the rate limit. The
        application must slow down the frequency of hitting the API endpoints.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    500InternalServerError:
      description: >-
        Internal Server Error. The server hit an unrecoverable system error. The
        response body may include the error code and message for further
        guidance. The application owner may need to reach out the customer
        support.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    503ServiceUnavailable:
      description: >-
        Service Unavailable. The request was not processed due to server side
        timeouts. The application may retry with backoff. The jittered backoff
        is recommended.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    504GatewayTimeout:
      description: >-
        Gateway Timeout. The request was not processed due to server side
        timeouts. The application may retry with backoff. The jittered backoff
        is recommended.
      headers:
        X-Snowflake-Request-ID:
          $ref: '#/components/headers/X-Snowflake-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  x-stackQL-resources:
    functions:
      id: snowflake.functions.functions
      name: functions
      title: Functions
      methods:
        list:
          operation:
            $ref: >-
              #/paths/~1api~1v2~1databases~1{database_name}~1schemas~1{schema_name}~1functions/get
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.functions
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/ListFunctionsResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"functions\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: >-
              #/paths/~1api~1v2~1databases~1{database_name}~1schemas~1{schema_name}~1functions/post
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        get:
          operation:
            $ref: >-
              #/paths/~1api~1v2~1databases~1{database_name}~1schemas~1{schema_name}~1functions~1{name_with_args}/get
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete:
          operation:
            $ref: >-
              #/paths/~1api~1v2~1databases~1{database_name}~1schemas~1{schema_name}~1functions~1{name_with_args}/delete
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        execute:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: >-
              #/paths/~1api~1v2~1databases~1{database_name}~1schemas~1{schema_name}~1functions~1{name}:execute/post
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/functions/methods/get'
          - $ref: '#/components/x-stackQL-resources/functions/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/functions/methods/create'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/functions/methods/delete'
        replace: []
    procedures:
      id: snowflake.functions.procedures
      name: procedures
      title: Procedures
      methods:
        list:
          operation:
            $ref: >-
              #/paths/~1api~1v2~1databases~1{database_name}~1schemas~1{schema_name}~1procedures/get
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.procedures
