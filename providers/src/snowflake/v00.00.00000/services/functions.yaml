openapi: 3.0.0
servers:
  - url: https://{endpoint}.snowflakecomputing.com
    variables:
      endpoint:
        default: orgname-accountname
        description: Organization and account identifier (orgname-accountname)
info:
  version: 0.0.1
  title: Snowflake Functions API
  description: >-
    The Snowflake REST API surface for the functions service, combining the
    vendor spec(s): function.yaml, procedure.yaml, user-defined-function.yaml.
  contact:
    name: Snowflake, Inc.
    url: https://snowflake.com
    email: support@snowflake.com
paths:
  /api/v2/databases/{database_name}/schemas/{schema_name}/functions:
    get:
      summary: List Functions
      tags:
        - function
      description: Lists the user functions under the database and schema.
      operationId: listFunctions
      parameters:
        - $ref: '#/components/parameters/database_name'
        - $ref: '#/components/parameters/schema_name'
        - $ref: '#/components/parameters/like'
      responses:
        '200':
          description: successful
          headers:
            X-Snowflake-Request-ID:
              $ref: '#/components/headers/X-Snowflake-Request-ID'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFunctionsResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
    post:
      summary: Create a Function
      tags:
        - function
      description: Create a function.
      operationId: createFunction
      parameters:
        - $ref: '#/components/parameters/database_name'
        - $ref: '#/components/parameters/schema_name'
        - $ref: '#/components/parameters/createMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Function'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '408':
          $ref: '#/components/responses/408RequestTimeout'
        '409':
          $ref: '#/components/responses/409Conflict'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
  /api/v2/databases/{database_name}/schemas/{schema_name}/functions/{name_with_args}:
    get:
      summary: Fetch a Function.
      tags:
        - function
      description: Fetch a Function using the describe command output.
      operationId: fetchFunction
      parameters:
        - $ref: '#/components/parameters/database_name'
        - $ref: '#/components/parameters/schema_name'
        - $ref: '#/components/parameters/name_with_args'
      responses:
        '200':
          description: successful
