openapi: 3.0.0
servers:
  - url: https://{endpoint}.snowflakecomputing.com
    variables:
      endpoint:
        default: orgname-accountname
        description: Organization and account identifier (orgname-accountname)
info:
  version: 0.0.1
  title: Snowflake Grants API
  description: 'The Snowflake REST API surface for the grants service, combining the vendor spec(s): grant.yaml.'
  contact:
    name: Snowflake, Inc.
    url: https://snowflake.com
    email: support@snowflake.com
paths:
  /api/v2/grants/{grantee_type}/{grantee_name}/{securable_type}/{securable_name}/privileges:
    post:
      summary: Grant the specified privilege(s) on the named securable to the named grantee.
      description: Endpoint to indicate that the privileges listed in the request body should be granted.
      operationId: grantPrivilege
      deprecated: true
      tags:
        - grant
      parameters:
        - $ref: '#/components/parameters/grantee_type'
        - $ref: '#/components/parameters/grantee_name'
        - $ref: '#/components/parameters/securable_type'
        - $ref: '#/components/parameters/securable_name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Grant'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '408':
          $ref: '#/components/responses/408RequestTimeout'
        '409':
          $ref: '#/components/responses/409Conflict'
        '410':
          $ref: '#/components/responses/410Gone'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
  /api/v2/grants/{grantee_type}/{grantee_name}/{bulk_grant_type}/{securable_type_plural}/{scope_type}/{scope_name}/privileges:
    post:
      summary: Grant the specified privilege(s) on all/future (as specified by bulkGrantType) securables of this type in a given scope to the named grantee.
      description: Endpoint to indicate that the privileges listed in the request body should be granted to all securables of this type in the given scope.
      operationId: grantGroupPrivilege
      deprecated: true
      tags:
        - grant
      parameters:
        - $ref: '#/components/parameters/grantee_type'
        - $ref: '#/components/parameters/grantee_name'
        - $ref: '#/components/parameters/bulk_grant_type'
        - $ref: '#/components/parameters/securable_type_plural'
        - $ref: '#/components/parameters/scope_type'
        - $ref: '#/components/parameters/scope_name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Grant'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '408':
          $ref: '#/components/responses/408RequestTimeout'
        '409':
          $ref: '#/components/responses/409Conflict'
        '410':
          $ref: '#/components/responses/410Gone'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
  /api/v2/grants/{grantee_type}/{grantee_name}/{securable_type}/{securable_name}/privileges/{privilege}:
    delete:
      summary: Revoke the specified privilege on the named securable from the named grantee.
      description: Endpoint to indicate that the privilege listed in the path should be revoked.
      operationId: revokePrivilege
      deprecated: true
      tags:
        - grant
      parameters:
        - $ref: '#/components/parameters/grantee_type'
        - $ref: '#/components/parameters/grantee_name'
        - $ref: '#/components/parameters/securable_type'
        - $ref: '#/components/parameters/securable_name'
        - $ref: '#/components/parameters/privilege'
        - $ref: '#/components/parameters/deleteMode'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '408':
          $ref: '#/components/responses/408RequestTimeout'
        '409':
          $ref: '#/components/responses/409Conflict'
        '410':
          $ref: '#/components/responses/410Gone'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
  /api/v2/grants/{grantee_type}/{grantee_name}/{securable_type}/{securable_name}/privileges/{privilege}/grant-option:
    delete:
      summary: Revoke the grant option for the specified privilege on the named securable from the named grantee.
      description: Endpoint to indicate that the grant option for the privilege listed in the path should be revoked.
      operationId: revokePrivilegeGrantOption
      deprecated: true
      tags:
        - grant
      parameters:
        - $ref: '#/components/parameters/grantee_type'
        - $ref: '#/components/parameters/grantee_name'
        - $ref: '#/components/parameters/securable_type'
        - $ref: '#/components/parameters/securable_name'
        - $ref: '#/components/parameters/privilege'
        - $ref: '#/components/parameters/deleteMode'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '408':
          $ref: '#/components/responses/408RequestTimeout'
        '409':
          $ref: '#/components/responses/409Conflict'
        '410':
          $ref: '#/components/responses/410Gone'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
  /api/v2/grants/{grantee_type}/{grantee_name}/{bulk_grant_type}/{securable_type_plural}/{scope_type}/{scope_name}/privileges/{privilege}:
    delete:
      summary: Revoke the specified privilege on the specified all/future securable in the given scope from the named grantee.
      description: Endpoint to indicate that the privilege listed on the group securable in the given scope should be revoked.
      operationId: revokeGroupPrivilege
      deprecated: true
      tags:
        - grant
      parameters:
        - $ref: '#/components/parameters/grantee_type'
        - $ref: '#/components/parameters/grantee_name'
        - $ref: '#/components/parameters/bulk_grant_type'
        - $ref: '#/components/parameters/securable_type_plural'
        - $ref: '#/components/parameters/scope_type'
        - $ref: '#/components/parameters/scope_name'
        - $ref: '#/components/parameters/privilege'
        - $ref: '#/components/parameters/deleteMode'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '408':
          $ref: '#/components/responses/408RequestTimeout'
        '409':
          $ref: '#/components/responses/409Conflict'
        '410':
          $ref: '#/components/responses/410Gone'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
  /api/v2/grants/{grantee_type}/{grantee_name}/{bulk_grant_type}/{securable_type_plural}/{scope_type}/{scope_name}/privileges/{privilege}/grant-option:
    delete:
      summary: Revoke the grant option for the specified privilege on the specified all/future securable in the given scope from the named grantee.
      description: Endpoint to indicate that the grant option for the privilege listed on the group securable in the given scope should be revoked.
      operationId: revokeGroupPrivilegeGrantOption
      deprecated: true
      tags:
        - grant
      parameters:
        - $ref: '#/components/parameters/grantee_type'
        - $ref: '#/components/parameters/grantee_name'
        - $ref: '#/components/parameters/bulk_grant_type'
        - $ref: '#/components/parameters/securable_type_plural'
        - $ref: '#/components/parameters/scope_type'
        - $ref: '#/components/parameters/scope_name'
        - $ref: '#/components/parameters/privilege'
        - $ref: '#/components/parameters/deleteMode'
      responses:
        '200':
          $ref: '#/components/responses/200SuccessResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '408':
          $ref: '#/components/responses/408RequestTimeout'
        '409':
          $ref: '#/components/responses/409Conflict'
        '410':
          $ref: '#/components/responses/410Gone'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
  /api/v2/grants/{grantee_type}/{grantee_name}:
    get:
      summary: List of privileges associated with this grantee type and name
      description: List the roles and privileges granted to the specified grantee using the output of SHOW GRANTS TO
      operationId: listGrantsTo
      deprecated: true
      tags:
        - grant
      parameters:
        - $ref: '#/components/parameters/grantee_type'
        - $ref: '#/components/parameters/grantee_name'
        - $ref: '#/components/parameters/showLimit'
      responses:
        '200':
          description: successful
          headers:
            X-Snowflake-Request-ID:
              $ref: '#/components/headers/X-Snowflake-Request-ID'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGrantsToResponse'
        '202':
          $ref: '#/components/responses/202SuccessAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          $ref: '#/components/responses/405MethodNotAllowed'
        '408':
          $ref: '#/components/responses/408RequestTimeout'
        '409':
          $ref: '#/components/responses/409Conflict'
        '410':
          $ref: '#/components/responses/410Gone'
        '429':
          $ref: '#/components/responses/429LimitExceeded'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'
components:
  parameters:
    privilege:
      name: privilege
      description: String that specifies a privilege to be revoked
      required: true
      in: path
      schema:
        example: SELECT
        type: string
    deleteMode:
      name: deleteMode
      description: If "cascade", recursively revoke the grant from sub-grantees to which this privilege was re-granted. Acceptable values are "restrict" or "cascade".
      required: false
      in: query
      schema:
        type: string
        example: restrict
    application:
      name: application
      description: Identifier (i.e. name) for the application to which the resource belongs. You can use the `/api/v2/applications/{application}` GET request to get a list of available applications.
      required: true
      in: path
      schema:
        example: TEST_APPLICATION
        $ref: '#/components/schemas/Identifier'
    name:
      name: name
      description: Identifier (i.e. name) for the resource.
      required: true
      in: path
      schema:
        example: TEST_NAME
        $ref: '#/components/schemas/Identifier'
    createMode:
      name: createMode
      description: |-
        Parameter allowing support for different modes of resource creation. Possible values include:
        - `errorIfExists`: Throws an error if you try to create a resource that already exists.
        - `orReplace`: Automatically replaces the existing resource with the current one.
        - `ifNotExists`: Creates a new resource when an alter is requested for a non-existent resource.
      in: query
      schema:
        type: string
        enum:
          - errorIfExists
          - orReplace
          - ifNotExists
        example: ifNotExists
        default: errorIfExists
    mode:
      name: mode
      description: |-
        Parameter determines whether the revoke operation succeeds or fails for the privileges, based on the whether the privileges had been re-granted to another role.
        - restrict: If the privilege being revoked has been re-granted to another role, the REVOKE command fails.
        - cascade: If the privilege being revoked has been re-granted, the REVOKE command recursively revokes these dependent grants. If the same privilege on an object has been granted to the target role by a different grantor (parallel grant), that grant is not affected and the target role retains the privilege.
      in: query
      schema:
        type: string
        enum:
          - restrict
          - cascade
        example: restrict
    ifExists:
      name: ifExists
      description: |-
        Parameter that specifies how to handle the request for a resource that does not exist:
        - `true`: The endpoint does not throw an error if the resource does not exist. It returns a 200 success response, but does not take any action on the resource.
        - `false`: The endpoint throws an error if the resource doesn't exist.
      in: query
      schema:
        type: boolean
        example: true
        default: false
    like:
      name: like
      description: Parameter to filter the command output by resource name. Uses case-insensitive pattern matching, with support for SQL wildcard characters.
      in: query
      schema:
        type: string
        example: test_%
    pattern:
      name: pattern
      description: Parameter that filters the command output by a regular expression pattern.
      in: query
      schema:
        type: string
        example: .*data_0.*
    startsWith:
      name: startsWith
      description: Parameter to filter the command output based on the string of characters that appear at the beginning of the object name. Uses case-sensitive pattern matching.
      in: query
      schema:
        type: string
        example: test
    rootOnly:
      name: rootOnly
      description: Parameter to filter the command output to return only root resources (resources with no predecessors).
      in: query
      schema:
        type: boolean
        example: false
        default: false
    showLimit:
      name: showLimit
      description: Parameter to limit the maximum number of rows returned by a command.
      in: query
      schema:
        type: integer
        example: 10
        minimum: 1
        maximum: 10000
    fromName:
      name: fromName
      description: Parameter to enable fetching rows only following the first row whose object name matches the specified string. Case-sensitive and does not have to be the full name.
      in: query
      schema:
        type: string
        example: from_test
    copyGrants:
      name: copyGrants
      description: Parameter to enable copy grants when creating the object.
      in: query
      schema:
        type: boolean
        example: false
        default: false
    asyncExec:
      name: asyncExec
      in: query
      description: Asynchronous execution enable/disable. Default is disable.
      schema:
        type: boolean
        default: false
    sessionId:
      name: sessionId
      description: Unique ID for the current session.
      required: true
      in: path
      schema:
        type: integer
        format: uuid
        example: 524514326772799
    content-type:
      name: Content-Type
      description: Type of content for the resource. Currently supports `application/json`.
      in: header
      schema:
        type: string
        enum:
          - application/json
    accept:
      name: Accept
      description: Type of data format accepted by the resource. Currently supports `application/json`.
      in: header
      schema:
        type: string
        enum:
          - application/json
    x-snowflake-authorization-token-type:
      name: X-Snowflake-Authorization-Token-Type
      description: Type of the Snowflake authorization token. Currently, keypair-jwt (`KEYPAIR_JWT`) and OAuth tokens are supported.
      in: header
      schema:
        type: string
        enum:
          - KEYPAIR_JWT
          - OAUTH
    x-sfc-session:
      name: X-Sfc-Session
      description: Token for the current Snowflake session.
      in: header
      required: false
      schema:
        type: string
        description: Snowflake session token.
        example: ver:3-hint:1000-ABCD=
    database_name:
      name: database_name
      description: Identifier (i.e. name) for the database to which the resource belongs. You can use the `/api/v2/databases` GET request to get a list of available databases.
      required: true
      in: path
      schema:
        example: TEST_DB
        $ref: '#/components/schemas/Identifier'
    schema_name:
      name: schema_name
      description: Identifier (i.e. name) for the schema to which the resource belongs. You can use the `/api/v2/databases/{database}/schemas` GET request to get a list of available schemas for the specified database.
      required: true
      in: path
      schema:
        example: TEST_SCHEMA
        $ref: '#/components/schemas/Identifier'
    name_with_args:
      name: name_with_args
      description: Function's name with Args
      required: true
      in: path
      schema:
        type: string
        example: foo(a number, b number)
    grantee_type:
      name: grantee_type
      description: String that specifies the type of resource that is the privilege grantee.
      required: true
      in: path
      schema:
        example: role
        type: string
        enum:
          - user
          - role
          - application-role
          - database-role
          - share
    grantee_name:
      name: grantee_name
      description: String that specifies the name of the privilege grantee.
      required: true
      in: path
      schema:
        example: SYSADMIN
        type: string
    securable_type:
      name: securable_type
      description: String that specifies the type of resource that is being secured by a privilege.
      required: true
      in: path
      schema:
        example: DATABASE
        type: string
    securable_name:
      name: securable_name
      description: String that specifies the name of resource that is being secured by a privilege.
      required: true
      in: path
      schema:
        example: MY_DB
        type: string
    bulk_grant_type:
      name: bulk_grant_type
      description: String that species whether this group privilege should be on ALL or FUTURE resources of the specified plural type
      required: true
      in: path
      schema:
        example: all
        type: string
        enum:
          - all
          - future
    securable_type_plural:
      name: securable_type_plural
      description: String that specifies the plural of the type of resource that is being secured by an ALL/FUTURE privilege. Must be either "schemas" or any plural object type that can nest under a schema such as "tables"
      required: true
      in: path
      schema:
        example: tables
        type: string
    scope_type:
      name: scope_type
      description: String that specifies the type of resource that is the scope of an ALL/FUTURE privilege. Can only be DATABASE or SCHEMA
      required: true
      in: path
      schema:
        example: schema
        type: string
        enum:
          - database
          - schema
    scope_name:
      name: scope_name
      description: String that specifies the name of resource that is the scope of an ALL/FUTURE privilege
      required: true
      in: path
      schema:
        example: MY_DB.MY_SC
        type: string
  schemas:
    Grant:
      description: Properties of a grant that can be granted to a role or user.
      type: object
      properties:
        privileges:
          type: array
          description: Privilege type
          items:
            type: string
          example:
            - CREATE DATABASE
            - EXECUTE TASK
        grant_option:
          type: boolean
          description: Can grantee pass this privilege down?
        created_on:
          type: string
          format: date-time
        grantee_type:
          type: string
          description: Entity type being granted to
          example: ROLE
        grantee_name:
          type: string
          description: Specific name of object being granted to
          example: ACCOUNTADMIN
        securable_type:
          type: string
          description: Type of object granted on
          example: ACCOUNT
        securable_name:
          type: string
          description: Name of specific object granted on (not name of privilege!)
        granted_by_role_type:
          type: string
          description: Type of role that granted this privilege to this grantee
          example: ROLE
        granted_by_name:
          type: string
          description: The role that granted this privilege to this grantee
          example: SUBADMIN
    Identifier:
      type: string
      description: A Snowflake object identifier. If the identifier contains spaces or special characters, the entire string must be enclosed in double quotes. Identifiers enclosed in double quotes are also case-sensitive.
      pattern: ^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$
      example: TEST_NAME
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message returned by the server
        code:
          type: string
          description: Error code.
        error_code:
          type: string
          description: Error code, same as `code` above. This property has been deprecated and will be removed in a future release, but is temporarily supported for for short-term backward compatibility.
        request_id:
          type: string
          description: Unique request ID.
      example:
        message: Compilation error!
        error_code: '390189'
        request_id: 01afef9d-0607-0550-0001-dd270c3902d7
    SuccessResponse:
      type: object
      description: Schema for all the success responses returned by the server.
      properties:
        status:
          type: string
          description: Message returned by the server.
      example:
        status: Request successfully completed
    SuccessAcceptedResponse:
      type: object
      description: Schema for a request in progress response returned by the server.
      properties:
        code:
          type: string
          description: Message code returned by the server.
        message:
          type: string
          description: Message returned by the server
        resultHandler:
          type: string
          description: Opaque result ID used for checking for request completion through one or more subsequent completion check operations.
      example:
        code: '392604'
        message: Request execution in progress. Use the provided location header or result handler ID to perform query monitoring and management.
    PointOfTime:
      type: object
      description: Point of time.
      required:
        - point_of_time_type
      properties:
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeTimestamp:
      description: Point of time identified by a timestamp.
      properties:
        timestamp:
          type: string
          description: Timestamp of the point of time (e.g. TO_TIMESTAMP(1749423600))
          example: TO_TIMESTAMP(1749423600)
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeOffset:
      description: Point of time identified by an offset in reference to the current time
      properties:
        offset:
          type: string
          description: The difference in seconds from the current time in the form -N where N can be an integer or arithmetic expression (e.g. -120).
          example: '-120'
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    PointOfTimeStatement:
      description: Point of time indicating when a statement was executed.
      properties:
        statement:
          type: string
          description: Query ID of a statement to use as the reference point (e.g. 01bcf40d-0002-197f-0000-045701e2306e).
          example: 01bcf40d-0002-197f-0000-045701e2306e
        point_of_time_type:
          description: |-
            Type of the point of time. Possible values include:
            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to 'now.' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.
            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.
          type: string
          example: timestamp
        reference:
          type: string
          description: Relation to the point of time. Currently, the API supports `at` and `before`.
          example: at
      type: object
      required:
        - point_of_time_type
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    Parameter:
      description: Snowflake parameter defined at the system, account, user, session, or object level.
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Parameter name.
        value:
          type: string
          description: Parameter value.
        defaultValue:
          type: string
          description: Default parameter value.
        dataType:
          type: string
          description: Data type of the parameter value. Either BOOLEAN, NUMBER, FLOAT, or STRING.
        level:
          type: string
          description: Level at which parameter is defined.
        description:
          type: string
          description: Parameter description.
      example:
        name: SAMPLE_SNOWAPI_PARAM
        value: true
        defaultValue: false
        dataType: boolean
        level: ACCOUNT
        description: Sample snowflake parameter.
    TargetLag:
      type: object
      description: Specifies the schedule for periodically refreshing the dynamic table.
      properties:
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    UserDefinedLag:
      description: User-defined target lag.
      properties:
        seconds:
          type: integer
          format: int64
          description: Target lag time in seconds.
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      example:
        seconds: 3600
      required:
        - seconds
      type: object
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
    DownstreamLag:
      description: Downstream target lag
      type: object
      properties:
        type:
          description: Type of lag, can be either USER_DEFINED or DOWNSTREAM.
          type: string
      discriminator:
        propertyName: type
        mapping:
          USER_DEFINED: UserDefinedLag
          DOWNSTREAM: DownstreamLag
