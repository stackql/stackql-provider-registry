            Optional. Following fields are sortable: SignalType Product Location
            IssueSeverity The default order is ascending. Add "DESC" after the
            field name to indicate descending order. Add "ASC" after the field
            name to indicate ascending order. It only supports a single field at
            a time.
          type: string
        parent:
          description: >-
            Required. Parent can be a project, a folder, or an organization. The
            list is limited to the one attached to resources within the `scope`
            that a user has access to. The allowed values are: *
            projects/{PROJECT_ID} (e.g., "projects/foo-bar") *
            projects/{PROJECT_NUMBER} (e.g., "projects/12345678") *
            folders/{FOLDER_NUMBER} (e.g., "folders/1234567") *
            organizations/{ORGANIZATION_NUMBER} (e.g., "organizations/123456")
          type: string
        pageToken:
          description: >-
            Optional. A page token, received from a previous `QueryIssues` call.
            Provide this to retrieve the subsequent page. All parameters except
            page size should match the parameters used in the call that provided
            the page token.
          type: string
        filter:
          description: >-
            Optional. Supported fields are: 'product', `location`,
            `issue_severity`, 'tags', 'labels',
          type: string
        pageSize:
          format: int32
          type: integer
          description: >-
            Optional. If unspecified, at most 50 issues will be returned. The
            maximum value is 1000; values above 1000 will be coerced to 1000.
      description: QueryIssuesRequest is the request to get a list of issues.
      id: QueryIssuesRequest
