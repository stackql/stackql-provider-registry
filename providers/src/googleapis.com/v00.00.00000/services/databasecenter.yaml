            - SIGNAL_TYPE_DISCONNECTIONS_NOT_LOGGED
            - SIGNAL_TYPE_LOGGING_EXCESSIVE_STATEMENT_INFO
            - SIGNAL_TYPE_EXPOSED_TO_REMOTE_ACCESS
            - SIGNAL_TYPE_DATABASE_NAMES_EXPOSED
