            - SIGNAL_TYPE_PUBLIC_IP_ENABLED
            - SIGNAL_TYPE_IDLE
            - SIGNAL_TYPE_OVERPROVISIONED
            - SIGNAL_TYPE_HIGH_NUMBER_OF_OPEN_TABLES
            - SIGNAL_TYPE_HIGH_NUMBER_OF_TABLES
            - SIGNAL_TYPE_HIGH_TRANSACTION_ID_UTILIZATION
            - SIGNAL_TYPE_UNDERPROVISIONED
