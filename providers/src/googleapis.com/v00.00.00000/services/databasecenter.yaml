    QueryDatabaseResourceGroupsRequest:
      description: >-
        QueryDatabaseResourceGroupsRequest is the request to get a list of
        database groups.
      id: QueryDatabaseResourceGroupsRequest
      type: object
      properties:
        orderBy:
          description: >-
            Optional. A field that specifies the sort order of the results. The
            following fields are sortable: * full_resource_name * product.type *
            product.engine * product.version * container * issue_count *
            machine_config.vcpu_count * machine_config.memory_size_bytes *
            machine_config.shard_count * resource_name * issue_severity *
            signal_type * location * resource_type * instance_type * edition *
            metrics.p99_cpu_utilization * metrics.p95_cpu_utilization *
            metrics.current_storage_used_bytes * metrics.node_count *
            metrics.processing_unit_count * metrics.current_memory_used_bytes *
            metrics.peak_storage_utilization * metrics.peak_number_connections *
            metrics.peak_memory_utilization The default order is ascending. Add
            "DESC" after the field name to indicate descending order. Add "ASC"
            after the field name to indicate ascending order. It only supports a
            single field at a time. For example: `order_by =
            "full_resource_name"` sorts response in ascending order `order_by =
            "full_resource_name DESC"` sorts response in descending order
            `order_by = "issue_count DESC"` sorts response in descending order
            of count of all issues associated with a resource. More explicitly,
            `order_by = "full_resource_name, product"` is not supported.
          type: string
        parent:
          description: >-
            Required. Parent can be a project, a folder, or an organization. The
            search is limited to the resources within the `scope`. The allowed
            values are: * projects/{PROJECT_ID} (e.g., "projects/foo-bar") *
            projects/{PROJECT_NUMBER} (e.g., "projects/12345678") *
            folders/{FOLDER_NUMBER} (e.g., "folders/1234567") *
            organizations/{ORGANIZATION_NUMBER} (e.g., "organizations/123456")
          type: string
        signalTypeGroups:
          description: Optional. Groups of signal types that are requested.
          items:
            $ref: '#/components/schemas/SignalTypeGroup'
          type: array
        pageToken:
          description: >-
            Optional. A page token, received from a previous
            `QueryDatabaseResourceGroupsRequest` call. Provide this to retrieve
            the subsequent page. All parameters except page_token should match
            the parameters in the call that provided the page page token.
          type: string
        signalProductsFilters:
          type: array
          description: >-
            Optional. Filters based on signal and product. The filter list will
            be ORed across pairs and ANDed within a signal and products pair.
          items:
            $ref: '#/components/schemas/SignalProductsFilters'
        signalFilters:
          description: >-
            Optional. Filters based on signals. The list will be ORed together
            and then ANDed with the `filters` field above.
          items:
            $ref: '#/components/schemas/SignalFilter'
          type: array
        filter:
          description: >-
            Optional. The expression to filter resources. The following fields
            are filterable: * full_resource_name * resource_type * container *
            product.type * product.engine * product.version * location * labels
            * resource_category * machine_config.cpu_count *
            machine_config.memory_size_bytes * machine_config.shard_count *
            resource_name * tags * backupdr_config.backupdr_managed * edition
            The expression is a list of zero or more restrictions combined via
            logical operators `AND` and `OR`. When `AND` and `OR` are both used
            in the expression, parentheses must be appropriately used to group
            the combinations. Example: `location="us-east1"` Example:
            `container="projects/123" OR container="projects/456"` Example:
            `(container="projects/123" OR container="projects/456") AND
            location="us-east1"` Example: `full_resource_name=~"test"` Example:
            `full_resource_name=~"test.*master"`
          type: string
        pageSize:
          description: >-
            Optional. If unspecified, at most 50 resource groups will be
