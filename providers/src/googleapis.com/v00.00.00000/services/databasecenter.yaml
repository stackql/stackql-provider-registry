          description: Title of a signal group corresponding to the request.
          type: string
        issueCount:
          format: int32
          type: integer
          description: >-
            The count of the number of issues associated with those resources
            that are explicitly filtered in by the filters present in the
            request. A signal is an issue when its SignalStatus field is set to
            SIGNAL_STATUS_ISSUE.
      id: IssueCount
      description: Count of issues for a group of signals.
    TimeOfDay:
      type: object
      properties:
        hours:
          description: >-
            Hours of a day in 24 hour format. Must be greater than or equal to 0
            and typically must be less than or equal to 23. An API may choose to
            allow the value "24:00:00" for scenarios like business closing time.
          type: integer
          format: int32
        minutes:
          description: >-
            Minutes of an hour. Must be greater than or equal to 0 and less than
            or equal to 59.
          format: int32
          type: integer
        nanos:
          description: >-
            Fractions of seconds, in nanoseconds. Must be greater than or equal
            to 0 and less than or equal to 999,999,999.
          format: int32
          type: integer
        seconds:
          description: >-
            Seconds of a minute. Must be greater than or equal to 0 and
            typically must be less than or equal to 59. An API may allow the
            value 60 if it allows leap-seconds.
          type: integer
          format: int32
      description: >-
        Represents a time of day. The date and time zone are either not
        significant or are specified elsewhere. An API may choose to allow leap
        seconds. Related types are google.type.Date and
        `google.protobuf.Timestamp`.
      id: TimeOfDay
