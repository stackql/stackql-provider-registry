              PostgreSQL instance is not set to DDL (all data definition
              statements).
            - >-
              Represents if the log_statement_stats database flag for a Cloud
              SQL for PostgreSQL instance is not set to off.
            - >-
              Represents if the log_temp_files database flag for a Cloud SQL for
              PostgreSQL instance is not set to "0". (NOTE: 0 = ON)
            - >-
              Represents if the user connections database flag for a Cloud SQL
              for SQL Server instance is configured.
            - >-
              Represents if the user options database flag for Cloud SQL SQL
              Server instance is configured or not.
            - Represents if a resource is exposed to public access.
            - >-
              Represents if a resources requires all incoming connections to use
              SSL or not.
            - >-
              Represents if a Cloud SQL database has a password configured for
              the root account or not.
            - >-
              Represents if a Cloud SQL database has a weak password configured
              for the root account.
            - >-
              Represents if a SQL database instance is not encrypted with
              customer-managed encryption keys (CMEK).
            - >-
              Represents if The contained database authentication database flag
              for a Cloud SQL for SQL Server instance is not set to off.
            - >-
              Represents if he external scripts enabled database flag for a
              Cloud SQL for SQL Server instance is not set to off.
            - >-
              Represents if the local_infile database flag for a Cloud SQL for
              MySQL instance is not set to off.
            - >-
              Represents if the log_connections database flag for a Cloud SQL
              for PostgreSQL instance is not set to on.
            - >-
              Represents if the log_disconnections database flag for a Cloud SQL
              for PostgreSQL instance is not set to on.
            - >-
              Represents if the log_min_duration_statement database flag for a
              Cloud SQL for PostgreSQL instance is not set to -1.
            - >-
              Represents if the remote access database flag for a Cloud SQL for
              SQL Server instance is not set to off.
            - >-
              Represents if the skip_show_database database flag for a Cloud SQL
              for MySQL instance is not set to on.
            - >-
              Represents if the 3625 (trace flag) database flag for a Cloud SQL
              for SQL Server instance is not set to on.
            - Represents if public IP is enabled.
            - Represents idle instance helps to reduce costs.
            - >-
              Represents instances that are unnecessarily large for given
              workload.
            - Represents high number of concurrently opened tables.
            - Represents high table count close to SLA limit.
            - Represents high number of unvacuumed transactions
            - Represents need for more CPU and/or memory
            - Represents out of disk.
            - Represents server certificate is near expiry.
            - Represents database auditing is disabled.
            - Represents not restricted to authorized networks.
            - Represents violate org policy restrict public ip.
            - Cluster nearing quota limit
            - No password policy set on resources
            - Performance impact of connections settings
            - Performance impact of temporary tables settings
            - Performance impact of transaction logs settings
            - Performance impact of high joins without indexes
            - >-
              Detects events where a database superuser (postgres for PostgreSQL
              servers or root for MySQL users) writes to non-system tables.
            - >-
              Detects events where a database user or role has been granted all
              privileges to a database, or to all tables, procedures, or
              functions in a schema.
            - >-
              Detects if database instance data exported to a Cloud Storage
              bucket outside of the organization.
            - >-
              Detects if database instance data exported to a Cloud Storage
              bucket that is owned by the organization and is publicly
              accessible.
            - >-
              Detects if a database instance is using a weak password hash
              algorithm.
            - Detects if a database instance has no user password policy set.
            - Detects if a database instance/cluster has a hot node.
            - Deletion Protection Disabled for the resource
            - >-
              Detects if a database instance has no point in time recovery
              enabled.
            - Detects if a database instance/cluster has suspended resources.
            - >-
              Detects that expensive commands are being run on a database
              instance impacting overall performance.
            - >-
              Indicates that the instance does not have a maintenance policy
              configured.
            - Indicates that the instance has inefficient queries detected.
            - Indicates that the instance has read intensive workload.
            - Indicates that the instance is nearing memory limit.
            - >-
              Indicates that the instance's max server memory is configured
              higher than the recommended value.
            - >-
              Indicates that the database has large rows beyond the recommended
              limit.
            - Heavy write pressure on the database rows.
            - Heavy read pressure on the database rows.
            - Encryption org policy not satisfied.
            - Location org policy not satisfied.
            - Outdated DB minor version.
            - Schema not optimized.
            - Replication delay.
            - Outdated client.
            - Databoost is disabled.
            - Recommended maintenance policy.
            - Resource version is in extended support.
            - Represents a database version nearing end of life.
            - Indicates a high risk of maintenance downtime.
            - >-
              Indicates both a low cache hit rate and a risk of maintenance
              downtime.
            - Indicates that the resource is missing enhanced protection.
        products:
          type: array
          description: >-
            Optional. Product type of the resource. The version of the product
            will be ignored in filtering.
          items:
            $ref: '#/components/schemas/Product'
      id: SignalProductsFilters
      description: >-
        SignalProductsFilters represents a signal and list of supported
        products.
    AggregateIssueStatsRequest:
      type: object
      properties:
        parent:
          description: >-
            Required. Parent can be a project, a folder, or an organization. The
            search is limited to the resources within the `scope`. The allowed
            values are: * projects/{PROJECT_ID} (e.g., "projects/foo-bar") *
            projects/{PROJECT_NUMBER} (e.g., "projects/12345678") *
            folders/{FOLDER_NUMBER} (e.g., "folders/1234567") *
            organizations/{ORGANIZATION_NUMBER} (e.g., "organizations/123456")
          type: string
        signalTypeGroups:
          description: Optional. Lists of signal types that are issues.
          items:
            $ref: '#/components/schemas/SignalTypeGroup'
          type: array
        baselineDate:
          description: >-
            Optional. The baseline date w.r.t. which the delta counts are
            calculated. If not set, delta counts are not included in the
            response and the response indicates the current state of the fleet.
          $ref: '#/components/schemas/Date'
        filter:
          description: >-
            Optional. The expression to filter resources. Supported fields are:
            `full_resource_name`, `resource_type`, `container`, `product.type`,
            `product.engine`, `product.version`, `location`, `labels`, `issues`,
            fields of availability_info, data_protection_info,'resource_name',
            etc. The expression is a list of zero or more restrictions combined
            via logical operators `AND` and `OR`. When `AND` and `OR` are both
            used in the expression, parentheses must be appropriately used to
            group the combinations. Example: `location="us-east1"` Example:
            `container="projects/123" OR container="projects/456"` Example:
            `(container="projects/123" OR container="projects/456") AND
            location="us-east1"`
          type: string
      description: >-
        AggregateIssueStatsRequest represents the input to the
        AggregateIssueStats method.
      id: AggregateIssueStatsRequest
    OutdatedMinorVersionInfo:
      description: Info associated with outdated minor version.
      id: OutdatedMinorVersionInfo
      type: object
      properties:
        recommendedMinorVersion:
          description: >-
            Recommended minor version of the underlying database engine. Example
            values: For MySQL, it could be "8.0.35", "5.7.25" etc. For
            PostgreSQL, it could be "14.4", "15.5" etc.
          type: string
    MaintenanceInfo:
      description: MaintenanceInfo to capture the maintenance details of database resource.
      id: MaintenanceInfo
      type: object
      properties:
        possibleFailureReasons:
          type: array
          description: >-
            Output only. List of possible reasons why the maintenance is not
            completed. This is an optional field and is only populated if there
            are any reasons for failures recorded for the maintenance by DB
            Center. FAILURE maintenance status may not always have a failure
            reason.
          readOnly: true
          items:
            type: string
            enum:
              - POSSIBLE_FAILURE_REASON_UNSPECIFIED
              - POSSIBLE_FAILURE_REASON_DENY_POLICY_CONFLICT
              - POSSIBLE_FAILURE_REASON_INSTANCE_IN_STOPPED_STATE
            enumDescriptions:
              - Failure reason is unspecified.
              - >-
                Maintenance may not be completed because there is a deny policy
                overlapping with upcoming maintenance schedule.
              - >-
                Maintenance may not be completed because the instance is
                stopped.
        state:
          enumDescriptions:
            - Status is unspecified.
            - Maintenance is scheduled.
            - Maintenance is in progress.
            - Maintenance is completed.
            - Maintenance has failed.
          description: >-
            Output only. Resource maintenance state. This is to capture the
            current state of the maintenance.
          type: string
          readOnly: true
          enum:
            - MAINTENANCE_STATE_UNSPECIFIED
            - MAINTENANCE_STATE_SCHEDULED
            - MAINTENANCE_STATE_IN_PROGRESS
            - MAINTENANCE_STATE_COMPLETED
            - MAINTENANCE_STATE_FAILED
        previousMaintenanceVersion:
          description: >-
            Output only. Previous maintenance version of the database resource.
            Example: "MYSQL_8_0_41.R20250531.01_15". This is available once a
            minor version maintenance is complete on a database resource.
          readOnly: true
          type: string
        denyMaintenanceSchedules:
          type: array
          description: Optional. List of Deny maintenance period for the database resource.
          items:
            $ref: '#/components/schemas/ResourceMaintenanceDenySchedule'
        maintenanceSchedule:
          $ref: '#/components/schemas/ResourceMaintenanceSchedule'
          description: Optional. Maintenance window for the database resource.
        maintenanceVersion:
          description: >-
            Output only. Current Maintenance version of the database resource.
            Example: "MYSQL_8_0_41.R20250531.01_15"
          readOnly: true
          type: string
        currentVersionReleaseDate:
          $ref: '#/components/schemas/Date'
          description: Output only. The date when the maintenance version was released.
          readOnly: true
        upcomingMaintenance:
          description: >-
            Output only. Upcoming maintenance window for the database resource.
            This is only populated for an engine, if upcoming maintenance is
            scheduled for the resource. This schedule is generated per engine
            and engine version, and there is only one upcoming maintenance
            window at any given time. In case of upcoming maintenance, the
            maintenance_state will be set to SCHEDULED first, and then
            IN_PROGRESS when the maintenance window starts.
          readOnly: true
          $ref: '#/components/schemas/UpcomingMaintenance'
    IssueGroupStats:
      type: object
      properties:
        healthyResourceGroupsCount:
          format: int32
          type: integer
          description: >-
            The number of resource groups from the total groups as defined above
            that are healthy with respect to all of the specified issues.
        resourcesCount:
          format: int32
          type: integer
          description: >-
            Total count of resources returned by the filter for which any of the
            specified issues are applicable.
        resourceGroupsCount:
          type: integer
          format: int32
          description: >-
            Total count of the groups of resources returned by the filter that
            also have one or more resources for which any of the specified
            issues are applicable.
        healthyResourcesCount:
          description: >-
            The number of resources from the total defined above in field
            total_resources_count that are healthy with respect to all of the
            specified issues.
          type: integer
          format: int32
        displayName:
          description: >-
            Database resource level health card name. This will corresponds to
            one of the requested input group names.
          type: string
        issueStats:
          description: >-
            List of issues stats containing count of resources having particular
            issue category.
          items:
            $ref: '#/components/schemas/IssueStats'
          type: array
      description: >-
        IssueGroupStats refers to stats for a particulare combination of
        relevant health issues of database resources.
      id: IssueGroupStats
    AggregateFleetRow:
      type: object
      properties:
        dimension:
          description: Group by dimension.
          items:
            $ref: '#/components/schemas/Dimension'
          type: array
        deltaDetails:
          $ref: '#/components/schemas/DeltaDetails'
          description: >-
            Optional. Delta counts and details of resources which were added
            to/deleted from fleet.
        resourcesCount:
          description: Number of resources that have a particular dimension.
          type: integer
          format: int32
        resourceGroupsCount:
          description: Number of resource groups that have a particular dimension.
          format: int32
          type: integer
      description: Individual row grouped by a particular dimension.
      id: AggregateFleetRow
    SubResource:
      description: >-
        Sub resource details For Spanner/Bigtable instance certain data
        protection settings are at sub resource level like database/table. This
        message is used to capture such sub resource details.
      id: SubResource
      type: object
      properties:
        product:
          description: >-
            Optional. Product information associated with the sub resource where
            backup retention settings are configured. e.g. ``` product: { type :
            PRODUCT_TYPE_SPANNER engine :
            ENGINE_CLOUD_SPANNER_WITH_POSTGRES_DIALECT } ``` for Spanner where
            backup is configured on database within an instance OPTIONAL
          $ref: '#/components/schemas/Product'
        resourceType:
          description: >-
            Optional. Resource type associated with the sub resource where
            backup settings are configured. E.g.
            "spanner.googleapis.com/Database" for Spanner where backup retention
            is configured on database within an instance OPTIONAL
          type: string
        container:
          description: >-
            Specifies where the resource is created. For Google Cloud resources,
            it is the full name of the project.
          type: string
        fullResourceName:
          description: >-
            Optional. Resource name associated with the sub resource where
            backup settings are configured.
            E.g."//spanner.googleapis.com/projects/project1/instances/inst1/databases/db1"
            for Spanner where backup retention is configured on database within
            an instance OPTIONAL
          type: string
    DeletionProtectionInfo:
      type: object
      properties:
        subResource:
          $ref: '#/components/schemas/SubResource'
          description: Optional. Sub resource details associated with the signal.
        deletionProtectionEnabled:
          description: Is deletion protection enabled.
          type: boolean
      description: Deletion protection signal info for a database resource.
      id: DeletionProtectionInfo
    InefficientQueryInfo:
      description: Metadata about inefficient query signal info for a database resource.
      id: InefficientQueryInfo
      type: object
      properties:
        impactedQueriesCount:
          format: int64
          type: string
          description: Count of queries to be impacted if index is applied
        database:
          description: >-
            Name of the database where index is required. For example, "db1",
            which is the name of the database present in the instance.
          type: string
        table:
          description: Name of the table where index is required
          type: string
        sqlIndexStatement:
          description: >-
            SQL statement of the index. Based on the ddl type, this will be
            either CREATE INDEX or DROP INDEX.
          type: string
        storageCostBytes:
          type: string
          format: int64
          description: Cost of additional disk usage in bytes
    MetricData:
      id: MetricData
      description: MetricData represents the metric data for a database resource.
      type: object
      properties:
        value:
          description: The value associated with the metric.
          $ref: '#/components/schemas/TypedValue'
        observationTime:
          description: The time the metric was observed in the metric source service.
          format: google-datetime
          type: string
    TypedValue:
      type: object
      properties:
        doubleValue:
          description: The value of the metric as double.
          format: double
          type: number
        int64Value:
          type: string
          format: int64
          description: The value of the metric as int.
      description: TypedValue represents the value of the metric based on data type.
      id: TypedValue
    QueryStats:
      type: object
      properties:
        queryMetrics:
          description: Metrics related to the query performance.
          $ref: '#/components/schemas/QueryMetrics'
        normalizedQuery:
          description: The query string is normalized query without any PII data.
          type: string
        resourceIds:
          type: array
          description: The resource ids for which the query stats are collected.
          items:
            $ref: '#/components/schemas/ResourceId'
        inefficientQueryInfo:
          $ref: '#/components/schemas/InefficientQueryInfo'
          description: Information about inefficient query.
        queryHash:
          description: The query hash of the query.
          type: string
        resourceType:
          description: >-
            The type of the resource. sqladmin.googleapis.com/Instance
            alloydb.googleapis.com/Cluster alloydb.googleapis.com/Instance
          type: string
      id: QueryStats
      description: >-
        QueryStats contains the stats for a particular combination of
        query_hash, query_string and resource_type.
    AggregateFleetResponse:
      id: AggregateFleetResponse
      description: The response message to aggregate a fleet by some group by fields.
      type: object
      properties:
        nextPageToken:
          description: >-
            A token that can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
          type: string
        totalSize:
          type: string
          format: int64
          description: Output only. The total number of rows in the entire list.
          readOnly: true
        resourceGroupsTotalCount:
          description: >-
            Count of all resource groups in the fleet. This includes counts from
            all pages.
          type: integer
          format: int32
        unreachable:
          type: array
          description: >-
            Unordered list. List of unreachable regions from where data could
            not be retrieved.
          items:
            type: string
        rows:
          type: array
          description: Represents a row grouped by the fields in the input.
          items:
            $ref: '#/components/schemas/AggregateFleetRow'
        resourceTotalCount:
          type: integer
          format: int32
          description: >-
            Count of all resources in the fleet. This includes counts from all
            pages.
    Date:
      type: object
      properties:
        month:
          description: >-
            Month of a year. Must be from 1 to 12, or 0 to specify a year
            without a month and day.
          type: integer
          format: int32
        year:
          description: >-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date
            without a year.
          type: integer
          format: int32
        day:
          format: int32
          type: integer
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0 to specify a year by itself or a year and month where
            the day isn't significant.
      description: >-
        Represents a whole or partial calendar date, such as a birthday. The
        time of day and time zone are either specified elsewhere or are
        insignificant. The date is relative to the Gregorian Calendar. This can
        represent one of the following: * A full date, with non-zero year,
        month, and day values. * A month and day, with a zero year (for example,
        an anniversary). * A year on its own, with a zero month and a zero day.
        * A year and month, with a zero day (for example, a credit card
        expiration date). Related types: * google.type.TimeOfDay *
        google.type.DateTime * google.protobuf.Timestamp
      id: Date
    DatabaseResource:
      description: >-
        DatabaseResource represents every individually configured database unit
        representing compute and/or storage.
      id: DatabaseResource
      type: object
      properties:
        metrics:
          description: >-
            Observable metrics for the resource e.g. CPU utilization, memory
            utilization, etc.
          $ref: '#/components/schemas/Metrics'
        tags:
          description: >-
            Tags applied on the resource. The requirements for tags assigned to
            Google Cloud resources may be found at
            https://cloud.google.com/resource-manager/docs/tags/tags-overview
          items:
            $ref: '#/components/schemas/Tag'
          type: array
        edition:
          type: string
          description: The edition of the resource.
          enum:
            - EDITION_UNSPECIFIED
            - EDITION_ENTERPRISE
            - EDITION_ENTERPRISE_PLUS
            - EDITION_STANDARD
          enumDescriptions:
            - Default, to make it consistent with instance edition enum.
            - Represents the enterprise edition.
            - Represents the enterprise plus edition.
            - Represents the standard edition.
        resourceName:
          description: >-
            The name of the resource(The last part of the full resource name).
            Example: For full resource name -
            `//cloudsql.googleapis.com/projects/project-number/instances/mysql-1`,
            resource name - `mysql-1` For full resource name -
            `//cloudsql.googleapis.com/projects/project-number/instances/postgres-1`
            , resource name - `postgres-1` Note: In some cases, there might be
            more than one resource with the same resource name.
          type: string
        maintenanceInfo:
          description: Optional. The maintenance information of the resource.
          $ref: '#/components/schemas/MaintenanceInfo'
        location:
          description: >-
            The location of the resources. It supports returning only regional
            locations in Google Cloud. These are of the form: "us-central1",
            "us-east1", etc. See https://cloud.google.com/about/locations for a
            list of such regions.
          type: string
        machineConfig:
          description: Machine configuration like CPU, memory, etc for the resource.
          $ref: '#/components/schemas/MachineConfig'
        fullResourceName:
          description: >-
            The full resource name, based on CAIS resource name format
            https://cloud.google.com/asset-inventory/docs/resource-name-format
            Example:
            `//cloudsql.googleapis.com/projects/project-number/instances/mysql-1`
            `//cloudsql.googleapis.com/projects/project-number/instances/postgres-1`
            `//spanner.googleapis.com/projects/project-number/instances/spanner-instance-1`
            `//alloydb.googleapis.com/projects/project-number/locations/us-central1/clusters/c1`
            `//alloydb.googleapis.com/projects/project-number/locations/us-central1/clusters/c1/instances/i1`
          type: string
        subResourceType:
          description: Subtype of the resource specified at creation time.
          enum:
            - SUB_RESOURCE_TYPE_UNSPECIFIED
            - SUB_RESOURCE_TYPE_PRIMARY
            - SUB_RESOURCE_TYPE_SECONDARY
            - SUB_RESOURCE_TYPE_READ_REPLICA
            - SUB_RESOURCE_TYPE_EXTERNAL_PRIMARY
            - SUB_RESOURCE_TYPE_READ_POOL
            - SUB_RESOURCE_TYPE_RESERVATION
            - SUB_RESOURCE_TYPE_DATASET
            - SUB_RESOURCE_TYPE_OTHER
          enumDescriptions:
            - Unspecified.
            - A resource acting as a primary.
            - A resource acting as a secondary.
            - A resource acting as a read-replica.
            - A resource acting as an external primary.
            - A resource acting as a read pool.
            - Represents a reservation resource.
            - Represents a dataset resource.
            - For the rest of the categories.
          type: string
        signalGroups:
          type: array
          description: >-
            The list of signal groups and count of issues related to the
            resource. Only those signals which have been requested would be
            included.
          items:
            $ref: '#/components/schemas/SignalGroup'
        childResources:
          description: List of children associated with a database group.
          items:
            $ref: '#/components/schemas/DatabaseResource'
          type: array
        resourceCategory:
          type: string
          enumDescriptions:
            - Unspecified.
            - A resource that is an Instance.
            - A resource that is a Cluster.
            - A resource that is a Database.
            - A resource that is a Dataset.
            - A resource that is a Reservation.
          description: The category of the resource.
          enum:
            - RESOURCE_CATEGORY_UNSPECIFIED
            - INSTANCE
            - CLUSTER
            - DATABASE
            - DATASET
            - RESERVATION
        affiliations:
          description: Optional. Affiliation details of the resource.
          items:
            $ref: '#/components/schemas/Affiliation'
          type: array
        resourceType:
          description: >-
            The type of resource defined according to the pattern: {Service
            Name}/{Type}. Ex: sqladmin.googleapis.com/Instance
            alloydb.googleapis.com/Cluster alloydb.googleapis.com/Instance
            spanner.googleapis.com/Instance
          type: string
        backupdrConfig:
          $ref: '#/components/schemas/BackupDRConfig'
          description: Optional. Backup and disaster recovery details for the resource.
        container:
          description: >-
            Specifies where the resource is created. For Google Cloud resources,
            it is the full name of the project.
          type: string
        product:
          $ref: '#/components/schemas/Product'
          description: The product this resource represents.
        labels:
          type: array
          description: >-
            Labels applied on the resource. The requirements for labels assigned
            to Google Cloud resources may be found at
            https://cloud.google.com/resource-manager/docs/labels-overview#requirements
          items:
            $ref: '#/components/schemas/Label'
    DatabaseResourceGroup:
      type: object
      properties:
        signalGroups:
          type: array
          description: >-
            The filtered signal groups and the count of issues associated with
            the resources that have been filtered in.
          items:
            $ref: '#/components/schemas/IssueCount'
        rootResources:
          type: array
          description: >-
            A database resource that serves as a root of the group of database
            resources. It is repeated just in case we have the concept of
            multiple roots in the future, however, it will only be populated
            with a single value for now.
          items:
            $ref: '#/components/schemas/DatabaseResource'
      description: >-
        DatabaseResourceGroup represents all resources that serve a common data
        set. It is considered notionally as a single entity, powered by any
        number of units of compute and storage.
      id: DatabaseResourceGroup
    AdditionalDetail:
      id: AdditionalDetail
      description: Details related to signal.
      type: object
      properties:
        resourceSuspensionInfo:
          description: >-
            Resource suspension information applies to signals with type
            SIGNAL_TYPE_RESOURCE_SUSPENDED.
          $ref: '#/components/schemas/ResourceSuspensionInfo'
        inefficientQueryInfo:
          description: >-
            Inefficient query information applies to signals with type
            SIGNAL_TYPE_INEFFICIENT_QUERY.
          $ref: '#/components/schemas/InefficientQueryInfo'
        maintenanceRecommendationInfo:
          $ref: '#/components/schemas/MaintenanceRecommendationInfo'
          description: >-
            Maintenance recommendation information applies to signals with type
            SIGNAL_TYPE_RECOMMENDED_MAINTENANCE_POLICIES.
        deletionProtectionInfo:
          description: >-
            Deletion protection information applies to signals with type
            SIGNAL_TYPE_NO_DELETION_PROTECTION
          $ref: '#/components/schemas/DeletionProtectionInfo'
        shortBackupRetentionInfo:
          $ref: '#/components/schemas/RetentionSettingsInfo'
          description: >-
            Short backup retention information applies to signals with type
            SIGNAL_TYPE_SHORT_BACKUP_RETENTION.
        backupRunInfo:
          description: >-
            Backup run information applies to signals with types
            SIGNAL_TYPE_LAST_BACKUP_FAILED and SIGNAL_TYPE_LAST_BACKUP_OLD.
          $ref: '#/components/schemas/BackupRunInfo'
