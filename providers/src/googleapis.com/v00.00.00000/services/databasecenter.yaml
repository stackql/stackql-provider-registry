openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Database Center API
  description: >-
    Database Center offers a comprehensive, organization-wide platform for
    monitoring database fleet health across various products. It simplifies
    management and reduces risk by automatically aggregating and summarizing key
    health signals, removing the need for custom dashboards. The platform
    provides a unified view through its dashboard and API, enabling teams
    focused on reliability, compliance, security, cost, and administration to
    quickly identify and address relevant issues within their database fleets. 
  version: v1beta
  x-discovery-doc-revision: '20260715'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://docs.cloud.google.com/database-center/docs/overview
servers:
  - url: https://databasecenter.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    QueryProductsResponse:
      type: object
      properties:
        products:
          type: array
          description: List of database products returned.
          items:
            $ref: '#/components/schemas/Product'
        nextPageToken:
          description: >-
            A token that can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages
          type: string
        unreachable:
          type: array
          description: >-
            Unordered list. List of unreachable regions from where data could
            not be retrieved.
          items:
            type: string
      description: >-
        QueryProductsResponse represents the response containing a list of
        products.
      id: QueryProductsResponse
    RetentionSettingsInfo:
      type: object
      properties:
        durationBasedRetention:
          description: Duration based retention period i.e. 172800 seconds (2 days)
          type: string
          format: google-duration
        quantityBasedRetention:
          type: integer
          format: int32
          description: Number of backups that will be retained.
        timestampBasedRetentionTime:
          format: google-datetime
          type: string
          description: Timestamp based retention period i.e. till 2024-05-01T00:00:00Z
        subResource:
          description: >-
            Optional. Sub resource details associated with the backup
            configuration.
          $ref: '#/components/schemas/SubResource'
      description: Metadata about backup retention settings for a database resource.
      id: RetentionSettingsInfo
    SignalFilter:
      type: object
      properties:
        signalType:
          enumDescriptions:
            - Unspecified.
            - >-
              Represents if a resource is protected by automatic failover.
              Checks for resources that are configured to have redundancy within
              a region that enables automatic failover.
            - >-
              Represents if a group is replicating across regions. Checks for
              resources that are configured to have redundancy, and ongoing
              replication, across regions.
            - Represents if a resource has an automated backup policy.
            - Represents if a resources has a short backup retention period.
            - Represents if the last backup of a resource failed.
            - >-
              Represents if the last backup of a resource is older than some
              threshold value.
            - >-
              Represents if a resource violates CIS Google Cloud Platform
              Foundation 2.0.
            - >-
              Represents if a resource violates CIS Google Cloud Platform
              Foundation 1.3.
            - >-
              Represents if a resource violates CIS Google Cloud Platform
              Foundation 1.2.
            - >-
              Represents if a resource violates CIS Google Cloud Platform
              Foundation 1.1.
            - >-
              Represents if a resource violates CIS Google Cloud Platform
              Foundation 1.0.
            - Represents if a resource violates CIS Controls 8.0.
            - Represents if a resource violates NIST 800-53.
            - Represents if a resource violates NIST 800-53 R5.
            - >-
              Represents if a resource violates NIST Cybersecurity Framework
              1.0.
            - Represents if a resource violates ISO-27001.
            - Represents if a resource violates ISO 27001 2022.
            - Represents if a resource violates PCI-DSS v3.2.1.
            - Represents if a resource violates PCI-DSS v4.0.
            - Represents if a resource violates Cloud Controls Matrix v4.0.
            - Represents if a resource violates HIPAA.
            - Represents if a resource violates SOC2 v2017.
            - >-
              Represents if log_checkpoints database flag for a Cloud SQL for
              PostgreSQL instance is not set to on.
            - >-
              Represents if the log_duration database flag for a Cloud SQL for
              PostgreSQL instance is not set to on.
            - >-
              Represents if the log_error_verbosity database flag for a Cloud
              SQL for PostgreSQL instance is not set to default or stricter
              (default or terse).
            - >-
              Represents if the log_lock_waits database flag for a Cloud SQL for
              PostgreSQL instance is not set to on.
            - >-
              Represents if the log_min_error_statement database flag for a
              Cloud SQL for PostgreSQL instance is not set appropriately.
            - >-
              Represents if the log_min_error_statement database flag for a
              Cloud SQL for PostgreSQL instance does not have an appropriate
