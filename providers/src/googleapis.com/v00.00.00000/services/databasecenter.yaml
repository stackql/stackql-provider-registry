              - Outdated DB minor version.
              - Schema not optimized.
              - Replication delay.
              - Outdated client.
              - Databoost is disabled.
              - Recommended maintenance policy.
              - Resource version is in extended support.
              - Represents a database version nearing end of life.
              - Indicates a high risk of maintenance downtime.
              - >-
                Indicates both a low cache hit rate and a risk of maintenance
                downtime.
              - Indicates that the resource is missing enhanced protection.
