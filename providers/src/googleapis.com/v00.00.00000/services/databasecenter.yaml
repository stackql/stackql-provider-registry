          type: string
        signalStatus:
          enumDescriptions:
            - Unspecified.
            - Signal is not applicable to the resource.
            - Signal is not an issue.
            - Signal is an issue.
            - Signal is not enabled for the resource.
          description: >-
            Optional. Represents the status of the Signal for which the filter
            is for.
          enum:
            - SIGNAL_STATUS_UNSPECIFIED
            - SIGNAL_STATUS_NOT_APPLICABLE
            - SIGNAL_STATUS_OK
            - SIGNAL_STATUS_ISSUE
            - SIGNAL_STATUS_NOT_ENABLED
          type: string
      id: SignalFilter
      description: >-
        A filter for Signals. If signal_type is left unset, all signals should
        be returned. For example, the following filter returns all issues.
        signal_filter: { signal_status: SIGNAL_STATUS_ISSUE; } Another example,
        the following filter returns issues of the given type: signal_filter: {
        type: SIGNAL_TYPE_NO_PROMOTABLE_REPLICA signal_status: ISSUE } If
        signal_status is left unset or set to SIGNAL_STATE_UNSPECIFIED, an error
        should be returned.
    ResourceMaintenanceSchedule:
      description: >-
        Maintenance window for the database resource. It specifies preferred
        time and day of the week and phase in some cases, when the maintenance
        can start.
      id: ResourceMaintenanceSchedule
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/TimeOfDay'
          description: >-
            Optional. Preferred time to start the maintenance operation on the
            specified day.
        day:
          type: string
          enumDescriptions:
            - The day of the week is unspecified.
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          description: >-
            Optional. Preferred day of the week for maintenance, e.g. MONDAY,
            TUESDAY, etc.
          enum:
            - DAY_OF_WEEK_UNSPECIFIED
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
        phase:
          enumDescriptions:
            - Phase is unspecified.
            - Week 1.
            - Week 2.
            - Week 5.
            - Any phase.
          description: >-
            Optional. Phase of the maintenance window. This is to capture order
            of maintenance. For example, for Cloud SQL resources, this can be
            used to capture if the maintenance window is in Week1, Week2, Week5,
            etc. Non production resources are usually part of early phase. For
            more details, refer to Cloud SQL resources -
            https://cloud.google.com/sql/docs/mysql/maintenance
          enum:
            - PHASE_UNSPECIFIED
            - PHASE_WEEK1
            - PHASE_WEEK2
            - PHASE_WEEK5
            - PHASE_ANY
          type: string
    MaintenanceRecommendationInfo:
      type: object
      properties:
        resourceMaintenanceSchedules:
          description: >-
            Optional. List of recommended maintenance schedules for the database
            resource.
          items:
            $ref: '#/components/schemas/ResourceMaintenanceSchedule'
          type: array
      id: MaintenanceRecommendationInfo
      description: Info associated with maintenance recommendation.
    DatabaseResourceIssue:
      id: DatabaseResourceIssue
      description: DatabaseResource and Issue associated with it.
      type: object
      properties:
        resource:
          description: Resource associated with the issue.
          $ref: '#/components/schemas/DatabaseResource'
        signal:
          description: Signal associated with the issue.
          $ref: '#/components/schemas/Signal'
    ResourceDetails:
      type: object
      properties:
        container:
          description: >-
            Specifies where the resource is created. For Google Cloud resources,
            it is the full name of the project.
          type: string
        location:
          description: Location of the resource.
          type: string
        fullResourceName:
          description: Full resource name of the resource.
          type: string
        product:
          description: Product type of the resource.
          $ref: '#/components/schemas/Product'
      description: >-
        Capture the resource details for resources that are included in the
        delta counts.
      id: ResourceDetails
    AutomatedBackupPolicyInfo:
      id: AutomatedBackupPolicyInfo
      description: Automated backup policy signal info
      type: object
      properties:
        subResource:
          description: Optional. Sub resource details associated with the signal.
          $ref: '#/components/schemas/SubResource'
        isEnabled:
          description: Is automated policy enabled.
          type: boolean
    QueryMetrics:
      id: QueryMetrics
      description: QueryMetrics contains the metrics related to the query execution.
      type: object
      properties:
        executionCount:
          description: The number of times the query was executed.
          type: string
          format: int64
        totalCpuTime:
          description: The total CPU time consumed by the query across all runs.
          type: string
          format: google-duration
        metricsWindow:
          type: string
          enumDescriptions:
            - Unspecified. Default value.
            - Metrics are aggregated over the last 1 day.
            - Metrics are aggregated over the last 7 days.
            - Metrics are aggregated over the last 14 days.
          description: The window over which the metrics are aggregated.
          enum:
            - METRICS_WINDOW_UNSPECIFIED
            - LAST_ONE_DAY
            - LAST_ONE_WEEK
            - LAST_TWO_WEEKS
        avgCpuTime:
          description: The average execution period of the query across all runs.
          type: string
          format: google-duration
        rowsProcessed:
          description: The average number of rows processed by the query across all runs.
          format: int64
          type: string
    AggregateQueryStatsRequest:
      id: AggregateQueryStatsRequest
      description: >-
        AggregateQueryStatsRequest represents the input to the
        AggregateQueryStats method.
      type: object
      properties:
        orderBy:
          description: >-
            Optional. The expression to order the results by. Example:
            `order_by="execution_count"` Example: `order_by="execution_count
            desc"` Supported order by fields are `execution_count`,
            `rows_processed`, `total_cpu_time`, `avg_cpu_time`.
          type: string
        pageToken:
          description: >-
            Optional. A page token, received from a previous
            `AggregateQueryStatsRequest` call. Provide this to retrieve the
            subsequent page. All parameters except page_token should match the
            parameters in the call that provided the page token.
          type: string
        filter:
          description: >-
            Optional. The expression to filter resources. Supported fields are:
            `full_resource_name`, `resource_type`, `container`, `product.type`,
            `product.engine`, `product.version`, `location`, `labels`, `issues`,
            fields of availability_info, data_protection_info,'resource_name',
            etc. The expression is a list of zero or more restrictions combined
            via logical operators `AND` and `OR`. When `AND` and `OR` are both
            used in the expression, parentheses must be appropriately used to
            group the combinations. Example: `location="us-east1"` Example:
            `container="projects/123" OR container="projects/456"` Example:
            `(container="projects/123" OR container="projects/456") AND
            location="us-east1"` Additional specific fields for query stats are:
            `metric_window`, `query_hash`, `normalized_query`. Example:
            `metric_window="LAST_ONE_DAY"` (Possible values for `metric_window`
            are: `LAST_ONE_DAY`, `LAST_ONE_WEEK`, `LAST_TWO_WEEKS`) Example:
            `query_hash="12345678"` Example: `normalized_query="SELECT * FROM
            table"`
          type: string
        pageSize:
          description: >-
            Optional. If unspecified, at most 100 query stats will be returned.
            The maximum value is 1000; values above 1000 will be coerced to
            1000.
          format: int32
          type: integer
    MachineConfig:
      id: MachineConfig
      description: >-
        MachineConfig describes the configuration of a machine specific to a
        Database Resource.
      type: object
      properties:
        vcpuCount:
          description: Optional. The number of vCPUs (if applicable).
          format: double
          type: number
        baselineSlotCount:
          type: string
          format: int64
          description: >-
            Optional. Baseline slots for BigQuery Reservations. Baseline slots
            are in increments of 50.
        maxReservationSlotCount:
          description: >-
            Optional. Max slots for BigQuery Reservations. Max slots are in
            increments of 50.
          type: string
          format: int64
        memorySizeBytes:
          description: Memory size in bytes.
          format: int64
          type: string
        shardCount:
          type: integer
          format: int32
          description: Optional. The number of Shards (if applicable).
    Metrics:
      id: Metrics
      description: Metrics represents the metrics for a database resource.
      type: object
      properties:
        processingUnitCount:
          $ref: '#/components/schemas/MetricData'
          description: Number of processing units in spanner.
        currentMemoryUsedBytes:
          description: Current memory used by the resource in bytes.
          $ref: '#/components/schemas/MetricData'
        peakMemoryUtilization:
          $ref: '#/components/schemas/MetricData'
          description: >-
            Peak memory utilization observed for the resource. The value is a
            fraction between 0.0 and 1.0 (may momentarily exceed 1.0 in some
            cases).
        p95CpuUtilization:
          description: >-
            P95 CPU utilization observed for the resource. The value is a
            fraction between 0.0 and 1.0 (may momentarily exceed 1.0 in some
            cases).
          $ref: '#/components/schemas/MetricData'
        currentStorageUsedBytes:
          $ref: '#/components/schemas/MetricData'
          description: Current storage used by the resource in bytes.
        peakNumberConnections:
          $ref: '#/components/schemas/MetricData'
          description: >-
            Peak number of connections observed for the resource. The value is a
            positive integer.
        nodeCount:
          description: Number of nodes in instance for spanner or bigtable.
          $ref: '#/components/schemas/MetricData'
        p99CpuUtilization:
          description: >-
            P99 CPU utilization observed for the resource. The value is a
            fraction between 0.0 and 1.0 (may momentarily exceed 1.0 in some
            cases).
          $ref: '#/components/schemas/MetricData'
        peakStorageUtilization:
          $ref: '#/components/schemas/MetricData'
          description: >-
            Peak storage utilization observed for the resource. The value is a
            fraction between 0.0 and 1.0 (may momentarily exceed 1.0 in some
            cases).
    QueryStatsInfo:
      type: object
      properties:
        queryStats:
          type: array
          description: >-
            List of query stats for the resources in the group. This stats is
            stats at resource level for the resources having same normalized
            query.
          items:
            $ref: '#/components/schemas/QueryStats'
        aggregatedQueryStats:
          description: Aggregated query stats for the resources for same normalized query.
          $ref: '#/components/schemas/QueryStats'
      id: QueryStatsInfo
      description: >-
        QueryStatsInfo contains the aggregated and detailed query stats for a
        particular combination of relevant query stats for queries having same
        normalized query.
    ResourceId:
      type: object
      properties:
        product:
          description: >-
            The product of the resource, including the type, engine, and
            version.
          $ref: '#/components/schemas/Product'
        resourceType:
          description: >-
            The type of the resource. sqladmin.googleapis.com/Instance
            alloydb.googleapis.com/Cluster alloydb.googleapis.com/Instance
          type: string
        fullResourceName:
          description: The full resource name of the resource.
          type: string
      id: ResourceId
      description: >-
        ResourceId contains the identifier for a database resource, including
        the full resource name, resource type, and product.
    QueryIssuesResponse:
      id: QueryIssuesResponse
      description: QueryIssuesResponse is the response containing a list of issues.
      type: object
      properties:
        resourceIssues:
          description: List of issues and resource details.
          items:
            $ref: '#/components/schemas/DatabaseResourceIssue'
          type: array
        unreachable:
          type: array
          description: >-
            Unordered list. List of unreachable regions from where data could
            not be retrieved.
          items:
            type: string
        nextPageToken:
          description: >-
            A token that can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
          type: string
    BackupRunInfo:
      description: Metadata about latest backup run state for a database resource.
      id: BackupRunInfo
      type: object
      properties:
        startTime:
          description: The time the backup operation started.
          format: google-datetime
          type: string
        subResource:
          $ref: '#/components/schemas/SubResource'
          description: Optional. Sub resource details associated with the backup run.
        endTime:
          type: string
          format: google-datetime
          description: The time the backup operation completed.
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - SUCCEEDED
            - FAILED
          type: string
          description: Output only. The state of this run.
          enumDescriptions:
            - Unspecified.
            - The backup succeeded.
            - The backup was unsuccessful.
        errorMessage:
          description: Additional information about the error encountered.
          type: string
        operationErrorType:
          type: string
          description: >-
            Optional. OperationErrorType to expose specific error when backup
            operation of database resource failed, that is state is FAILED.
          enum:
            - OPERATION_ERROR_TYPE_UNSPECIFIED
            - KMS_KEY_ERROR
            - DATABASE_ERROR
            - STOCKOUT_ERROR
            - CANCELLATION_ERROR
            - SQLSERVER_ERROR
            - INTERNAL_ERROR
          enumDescriptions:
            - UNSPECIFIED means operation error type is not known or available.
            - >-
              Key destroyed, expired, not found, unreachable or permission
              denied.
            - Database is not accessible.
            - >-
              The zone or region does not have sufficient resources to handle
              the request at the moment.
            - User initiated cancellation.
            - SQL server specific error.
            - Any other internal error.
    Tag:
      id: Tag
      description: Tag is a key value pair attached to a resource.
      type: object
      properties:
        value:
          description: The value part of the tag.
          type: string
        source:
          description: >-
            The source of the tag. According to
            https://cloud.google.com/resource-manager/docs/tags/tags-overview#tags_and_labels,
            tags can be created only at the project or organization level. Tags
            can be inherited from different project as well not just the current
            project where the database resource is present. Format:
            "projects/{PROJECT_ID}", "projects/{PROJECT_NUMBER}",
            "organizations/{ORGANIZATION_ID}"
          type: string
        inherited:
          description: >-
            Indicates the inheritance status of a tag value attached to the
            given resource. If the tag value is inherited from one of the
            resource's ancestors, inherited will be true. If false, then the tag
            value is directly attached to the resource.
          type: boolean
        key:
          type: string
    Lineage:
      type: object
      properties:
        targetFqn:
          description: Optional. FQN of target table / column
          type: string
        processFqn:
          description: >-
            Optional. FQN of process which created the lineage i.e. dataplex,
            datastream etc.
          type: string
        processType:
          type: string
          enumDescriptions:
            - Unspecified process type.
            - Composer process type.
            - Datastream process type.
            - Dataflow process type.
            - Bigquery process type.
            - Data fusion process type.
            - Dataproc process type.
          description: Optional. Type of process which created the lineage.
          enum:
            - PROCESS_TYPE_UNSPECIFIED
            - COMPOSER
            - DATASTREAM
            - DATAFLOW
            - BIGQUERY
            - DATA_FUSION
            - DATAPROC
        sourceFqn:
          description: Optional. FQN of source table / column
          type: string
      description: >-
        lineage information of the affiliated resources This captures source,
        target and process which created the lineage.
      id: Lineage
    RecommendationInfo:
      description: Info associated with recommendation.
      id: RecommendationInfo
      type: object
      properties:
        recommender:
          description: >-
            Name of recommendation. Examples:
            organizations/1234/locations/us-central1/recommenders/google.cloudsql.instance.PerformanceRecommender/recommendations/9876
          type: string
        recommenderId:
          description: >-
            ID of recommender. Examples:
            "google.cloudsql.instance.PerformanceRecommender"
          type: string
        recommenderSubtype:
          description: >-
            Contains an identifier for a subtype of recommendations produced for
            the same recommender. Subtype is a function of content and impact,
            meaning a new subtype might be added when significant changes to
            `content` or `primary_impact.category` are introduced. See the
            Recommenders section to see a list of subtypes for a given
            Recommender. Examples: For recommender =
            "google.cloudsql.instance.PerformanceRecommender",
            recommender_subtype can be
            "MYSQL_HIGH_NUMBER_OF_OPEN_TABLES_BEST_PRACTICE"/"POSTGRES_HIGH_TRANSACTION_ID_UTILIZATION_BEST_PRACTICE"
          type: string
