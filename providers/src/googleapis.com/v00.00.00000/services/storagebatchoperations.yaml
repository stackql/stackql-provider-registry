openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Storage Batch Operations API
  description: ''
  version: v1
  x-discovery-doc-revision: '20260722'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/storage/docs/batch-operations/overview
servers:
  - url: https://storagebatchoperations.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    ListBucketOperationsResponse:
      description: Message for response to listing BucketOperations
      id: ListBucketOperationsResponse
      type: object
      properties:
        nextPageToken:
          type: string
          description: A token identifying a page of results.
        unreachable:
          items:
            type: string
          description: Locations that could not be reached.
          type: array
        bucketOperations:
          items:
            $ref: '#/components/schemas/BucketOperation'
          description: A list of storage batch bucket operations.
          type: array
    AccessControlsUpdates:
      id: AccessControlsUpdates
      type: object
      properties:
        removeEntities:
          type: array
          items:
            type: string
          description: >-
            Optional. Entities for which all grants should be removed. An entity
            can't be in both `grants` and `remove_entities`.
        grants:
          items:
            $ref: '#/components/schemas/ObjectAccessControl'
          description: >-
            Optional. Grants to add or update. If a grant for same entity
            exists, its role is updated.
          type: array
      description: Represents updates to existing access-control entries on an object.
    ErrorLogEntry:
      id: ErrorLogEntry
      type: object
      properties:
        objectUri:
          description: Required. Output only. Object URL. e.g. gs://my_bucket/object.txt
          readOnly: true
          type: string
        errorDetails:
          type: array
          readOnly: true
          items:
            type: string
          description: >-
            Optional. Output only. At most 5 error log entries are recorded for
            a given error code for a job.
      description: An entry describing an error that has occurred.
    Manifest:
      description: Describes list of objects to be transformed.
      id: Manifest
      type: object
      properties:
        manifestLocation:
          description: >-
            Required. Specify the manifest file location. The format of manifest
            location can be an absolute path to the object in the format of
            `gs://bucket_name/path/object_name`. For example,
            `gs://bucket_name/path/object_name.csv`. Alternatively, you can
            specify an absolute path with a single wildcard character in the
            file name, for example `gs://bucket_name/path/file_name*.csv`. If
            the manifest location is specified with a wildcard, objects in all
            manifest files matching the pattern will be acted upon. The manifest
            is a CSV file, uploaded to Cloud Storage, that contains one object
            or a list of objects that you want to process. Each row in the
            manifest must include the `bucket` and `name` of the object. You can
            optionally specify the `generation` of the object. If you don't
            specify the `generation`, the current version of the object is used.
            You can optionally include a header row with the following format:
            `bucket,name,generation`. For example, bucket,name,generation
            bucket_1,object_1,generation_1 bucket_1,object_2,generation_2
            bucket_1,object_3,generation_3 Note: The manifest file must specify
            only objects within the bucket provided to the job. Rows referencing
            objects in other buckets are ignored.
          type: string
    Counters:
      description: Describes details about the progress of the job.
      id: Counters
      type: object
      properties:
        succeededObjectCount:
          type: string
          format: int64
          readOnly: true
          description: Output only. Number of objects completed.
        objectCustomContextsCreated:
          description: >-
            Output only. Number of object custom contexts created. This field is
            only populated for jobs with the UpdateObjectCustomContext
            transformation.
          readOnly: true
          type: string
          format: int64
        totalBytesTransformed:
          type: string
          format: int64
          description: >-
            Output only. The total number of bytes affected by the
            transformation. For example, this counts bytes deleted for
            `DeleteObject` operations and bytes rewritten for `RewriteObject`
            operations.
          readOnly: true
        totalObjectCount:
          type: string
          format: int64
          description: Output only. Number of objects listed.
          readOnly: true
        objectCustomContextsDeleted:
          description: >-
            Output only. Number of object custom contexts deleted. This field is
            only populated for jobs with the UpdateObjectCustomContext
            transformation.
          readOnly: true
          type: string
          format: int64
        totalBytesFound:
          readOnly: true
          description: >-
            Output only. Number of bytes found from source. This field is only
            populated for jobs with a prefix list object configuration.
          type: string
          format: int64
        failedObjectCount:
          type: string
          format: int64
          readOnly: true
          description: >-
            Output only. The number of objects that failed due to user errors or
            service errors.
        objectCustomContextsUpdated:
          readOnly: true
          description: >-
            Output only. Number of object custom contexts updated. This counter
            tracks custom contexts where the key already existed, but the
            payload was modified. This field is only populated for jobs with the
            UpdateObjectCustomContext transformation.
          type: string
          format: int64
    Bucket:
      description: >-
        Describes configuration of a single bucket and its objects to be
        transformed.
      id: Bucket
      type: object
      properties:
        bucket:
          type: string
          description: Required. Bucket name for the objects to be transformed.
        prefixList:
          description: Specifies objects matching a prefix set.
          $ref: '#/components/schemas/PrefixList'
        manifest:
          description: Specifies objects in a manifest file.
          $ref: '#/components/schemas/Manifest'
    ObjectAccessControl:
      id: ObjectAccessControl
      type: object
      properties:
        entity:
          description: >-
            Required. The entity holding the permission, in one of the following
            forms: * `allUsers` * `allAuthenticatedUsers`
          type: string
        role:
          type: string
          description: >-
            Required. The role to grant. Acceptable values are: * `READER` -
            gives read access to the object. * `OWNER` - gives owner access to
            the object.
      description: Represents an access control entry on an object.
    CancelOperationRequest:
      id: CancelOperationRequest
      type: object
      properties: {}
      description: The request message for Operations.CancelOperation.
    Job:
      id: Job
      type: object
      properties:
        updateObjectCustomContext:
          description: Update object custom context.
          $ref: '#/components/schemas/UpdateObjectCustomContext'
        state:
          type: string
          enumDescriptions:
            - Default value. This value is unused.
            - In progress.
            - Completed successfully.
            - Cancelled by the user.
            - Terminated due to an unrecoverable failure.
            - Queued but not yet started.
          description: Output only. State of the job.
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - RUNNING
            - SUCCEEDED
            - CANCELED
            - FAILED
            - QUEUED
        counters:
          readOnly: true
          description: Output only. Information about the progress of the job.
          $ref: '#/components/schemas/Counters'
        setObjectAcls:
          description: Updates object ACLs.
          $ref: '#/components/schemas/SetObjectAcls'
        completeTime:
          type: string
          format: google-datetime
          description: Output only. The time that the job was completed.
          readOnly: true
        errorSummaries:
          readOnly: true
          items:
            $ref: '#/components/schemas/ErrorSummary'
          description: >-
            Output only. Summarizes errors encountered with sample error log
            entries.
          type: array
        name:
          description: >-
            Identifier. The resource name of the job. Format:
            `projects/{project_id}/locations/global/jobs/{job_id}`. For example:
            `projects/123456/locations/global/jobs/job01`. `job_id` is unique in
            a given project.
          type: string
        createTime:
          type: string
          format: google-datetime
          readOnly: true
          description: Output only. The time that the job was created.
        scheduleTime:
          type: string
          format: google-datetime
          readOnly: true
          description: Output only. The time that the job was scheduled.
        putMetadata:
          description: >-
            Updates object metadata. Allows updating fixed-key and custom
            metadata. For example, `Cache-Control`, `Content-Disposition`,
            `Content-Encoding`, `Content-Language`, `Content-Type`,
            `Custom-Time`, and `Retention configuration`.
          $ref: '#/components/schemas/PutMetadata'
        bucketList:
          description: Specifies a list of buckets and their objects to be transformed.
          $ref: '#/components/schemas/BucketList'
        putObjectHold:
          description: Changes object hold status.
          $ref: '#/components/schemas/PutObjectHold'
        projectSource:
          description: >-
            Specifies a project source and filters to identify objects to be
            transformed.
          $ref: '#/components/schemas/ProjectSource'
        rewriteObject:
          description: Rewrite the object and updates metadata like KMS key.
          $ref: '#/components/schemas/RewriteObject'
        dryRun:
          type: boolean
          description: >-
            Optional. If true, the job runs in dry run mode, returning the total
            object count and, if the object configuration is a prefix list, the
            bytes found from source. No transformations are performed.
        isMultiBucketJob:
          readOnly: true
          description: >-
            Output only. If true, this job operates on multiple buckets.
            Multi-bucket jobs are subject to different quota limits than
            single-bucket jobs.
          type: boolean
        deleteObject:
          description: Delete objects.
          $ref: '#/components/schemas/DeleteObject'
        description:
          description: >-
            Optional. A user-provided description for the job. Maximum length:
            1024 bytes when unicode-encoded.
          type: string
        loggingConfig:
          description: Optional. Logging configuration.
          $ref: '#/components/schemas/LoggingConfig'
      description: The storage batch operations job description.
    PutObjectHold:
      id: PutObjectHold
      type: object
      properties:
        eventBasedHold:
          type: string
          enumDescriptions:
            - Default value, Object hold status isn't changed.
            - Places the hold.
            - Releases the hold.
          enum:
            - HOLD_STATUS_UNSPECIFIED
            - SET
            - UNSET
          description: >-
            Required. Updates object event based holds state. When object event
            based hold is set, object can't be deleted or replaced. Resets
            object's time in the bucket for the purposes of the retention
            period.
        temporaryHold:
          enumDescriptions:
            - Default value, Object hold status isn't changed.
            - Places the hold.
            - Releases the hold.
          type: string
          description: >-
            Required. Updates object temporary holds state. When object
            temporary hold is set, object can't be deleted or replaced.
          enum:
            - HOLD_STATUS_UNSPECIFIED
            - SET
            - UNSET
      description: Describes options to update object hold.
    TargetLocations:
      description: Describes the Cloud Storage locations to include in a ProjectSource job.
      id: TargetLocations
      type: object
      properties:
        snapshotTime:
          description: >-
            Optional. OPTIONAL. The exact Storage Insights snapshot timestamp to
            use for the job compatible with the RFC 3339 format (e.g.,
            `2024-01-02T03:04:05Z`). If specified, this exact snapshot must
            exist in BOTH the `object_attributes_view` and
            `bucket_attributes_view` for every location listed in `locations`.
            If the snapshot is missing from either view in any of the locations,
            the job fails.
          type: string
          format: google-datetime
        locations:
          description: >-
            Required. REQUIRED. A list of Cloud Storage locations (e.g.,
            `us-central1`) to include in the job. If `snapshot_time` is omitted,
            the job automatically defaults to the most recent snapshot timestamp
            that is successfully populated in BOTH the `object_attributes_view`
            and `bucket_attributes_view` across ALL specified locations. For
            details on Storage Insights dataset snapshots and views, see:
            https://docs.cloud.google.com/storage/docs/insights/dataset-tables-and-schemas#schema
          items:
            type: string
          type: array
    PutMetadata:
      id: PutMetadata
      type: object
      properties:
        objectRetention:
          description: >-
            Optional. Updates an object's retention configuration. To clear an
            object's retention, both `retentionMode` and `retainUntilTime` must
            be left unset (omitted). Setting `retentionMode` to
            `RETENTION_MODE_UNSPECIFIED` is treated as a no-op. Unlike an unset
            field, it doesn't modify or clear the retention settings. An object
            with `LOCKED` retention mode can't have its retention cleared or its
            `retainUntilTime` reduced. For more information, see [Object
            retention](https://cloud.google.com/storage/docs/batch-operations/create-manage-batch-operation-jobs#retain-until-time).
          $ref: '#/components/schemas/ObjectRetention'
        contentType:
          description: >-
            Optional. Updates objects `Content-Type` fixed metadata. Unset
            values in the request are ignored. To clear the metadata, set an
            empty value. For details, see
            [Content-Type](https://cloud.google.com/storage/docs/metadata#content-type).
          type: string
        contentDisposition:
          type: string
          description: >-
            Optional. Updates objects `Content-Disposition` fixed metadata.
            Unset values in the request are ignored. To clear the metadata, set
            an empty value. For details, see
            [Content-Disposition](https://cloud.google.com/storage/docs/metadata#content-disposition).
        contentEncoding:
          type: string
          description: >-
            Optional. Updates the objects `Content-Encoding` fixed metadata.
            Unset values in the request are ignored. To clear the metadata, set
            an empty value. For details, see
            [Content-Encoding](https://cloud.google.com/storage/docs/metadata#content-encoding).
        contentLanguage:
          type: string
          description: >-
            Optional. Updates the objects `Content-Language` fixed metadata.
            Metadata values must use ISO 639-1 language codes. The maximum
            length for metadata values is 100 characters. Unset values in the
            request are ignored. To clear the metadata, set an empty value. For
            details, see
            [Content-Language](https://cloud.google.com/storage/docs/metadata#content-language).
        customTime:
          description: >-
            Optional. Updates the objects `Custom-Time` fixed metadata. Unset
            values in the request are ignored. To clear the metadata, set an
            empty value. The time must be specified in RFC 3339 format, for
            example `YYYY-MM-DD'T'HH:MM:SS'Z'` or `YYYY-MM-DD'T'HH:MM:SS.SS'Z'`.
            For details, see
            [Custom-Time](https://cloud.google.com/storage/docs/metadata#custom-time).
          type: string
        customMetadata:
          type: object
          additionalProperties:
            type: string
          description: >-
            Optional. Updates the object's custom metadata. This operation adds
            or sets individual custom metadata key-value pairs. Keys specified
            with empty values have their values cleared. Existing custom
            metadata keys not included in the request remain unchanged. For
            details, see [Custom
            metadata](https://cloud.google.com/storage/docs/metadata#custom-metadata).
        cacheControl:
          type: string
          description: >-
            Optional. Updates the objects `Cache-Control` fixed metadata. Unset
            values in the request are ignored. To clear the metadata, set an
            empty value. Additionally, the value for `Custom-Time` can't
            decrease. For details, see
            [Cache-Control](https://cloud.google.com/storage/docs/metadata#caching_data).
      description: Describes options for object metadata update.
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      type: object
      properties:
        metadata:
          type: object
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        response:
          type: object
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        done:
          type: boolean
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
    BucketOperation:
      description: BucketOperation represents a bucket-level breakdown of a Job.
      id: BucketOperation
      type: object
      properties:
        counters:
          readOnly: true
          description: Output only. Information about the progress of the bucket operation.
          $ref: '#/components/schemas/Counters'
        updateObjectCustomContext:
          description: Update object custom context.
          $ref: '#/components/schemas/UpdateObjectCustomContext'
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - CANCELED
            - FAILED
          description: Output only. State of the BucketOperation.
          type: string
          enumDescriptions:
            - Default value. This value is unused.
            - Created but not yet started.
            - In progress.
            - Completed successfully.
            - Cancelled by the user.
            - Terminated due to an unrecoverable failure.
        name:
          description: >-
            Identifier. The resource name of the BucketOperation. This is
            defined by the service. Format:
            `projects/{project_id}/locations/global/jobs/{job_id}/bucketOperations/{bucket_operation}`.
          type: string
        prefixList:
          description: Specifies objects matching a prefix set.
          $ref: '#/components/schemas/PrefixList'
        createTime:
          type: string
          format: google-datetime
          readOnly: true
          description: Output only. The time that the BucketOperation was created.
        setObjectAcls:
          description: Updates object ACLs.
          $ref: '#/components/schemas/SetObjectAcls'
        completeTime:
          readOnly: true
          description: Output only. The time that the BucketOperation was completed.
          type: string
          format: google-datetime
        errorSummaries:
          type: array
          description: >-
            Output only. Summarizes errors encountered with sample error log
            entries.
          readOnly: true
          items:
            $ref: '#/components/schemas/ErrorSummary'
        putObjectHold:
          description: Changes object hold status.
          $ref: '#/components/schemas/PutObjectHold'
        bucketName:
          type: string
          description: >-
            The bucket name of the objects to be transformed in the
            BucketOperation.
        projectSource:
          description: Specifies objects matching the object filters in a project source.
          $ref: '#/components/schemas/ProjectSource'
        startTime:
          type: string
          format: google-datetime
          readOnly: true
          description: Output only. The time that the BucketOperation was started.
        rewriteObject:
          description: Rewrite the object and updates metadata like KMS key.
          $ref: '#/components/schemas/RewriteObject'
        putMetadata:
          description: >-
            Updates object metadata. Allows updating fixed-key and custom
            metadata and fixed-key metadata i.e. Cache-Control,
            Content-Disposition, Content-Encoding, Content-Language,
            Content-Type, Custom-Time.
          $ref: '#/components/schemas/PutMetadata'
        deleteObject:
          description: Delete objects.
          $ref: '#/components/schemas/DeleteObject'
        manifest:
          description: Specifies objects in a manifest file.
          $ref: '#/components/schemas/Manifest'
    PrefixList:
      id: PrefixList
      type: object
      properties:
        includedObjectPrefixes:
          description: >-
            Optional. Specify one or more object prefixes. For example: * To
            match one object, use a single prefix, `prefix1`. * To match
            multiple objects, use comma-separated prefixes, `prefix1, prefix2`.
            * To match all objects, use an empty prefix, `''`
          items:
            type: string
          type: array
      description: Describes prefixes of objects to be transformed.
    SetObjectAcls:
      id: SetObjectAcls
      type: object
      properties:
        accessControlsUpdates:
          description: >-
            Required. Add, update, or remove grants from the object's existing
            ACLs.
          $ref: '#/components/schemas/AccessControlsUpdates'
      description: Describes options for setting object ACLs.
    ProjectSource:
      id: ProjectSource
      type: object
      properties:
        project:
          description: >-
            Required. Project name of the objects to be transformed. e.g.
            projects/my-project or projects/123456.
          type: string
        bucketFilters:
          description: >-
            Optional. Filters expressed in Common Expression Language (CEL) to
            apply to buckets to identify buckets with objects to be transformed.
          $ref: '#/components/schemas/Expr'
        dryRunJobId:
          type: string
          description: >-
            Optional. The unique identifier of a dry run job to use as the
            baseline for the current job. Specifying this ID ensures the job is
            executed against the same set of objects validated during the dry
            run. The value corresponds to the {job_id} segment of the resource
            name: `projects/{project_id}/locations/{location}/jobs/{job_id}`.
        snapshotTime:
          type: string
          format: google-datetime
          description: >-
            Output only. The snapshot time used by the job to read the Storage
            Insights dataset for bucket and object discovery. This field is
            populated by the service and reflects the exact timestamp of the
            dataset snapshot used.
          readOnly: true
        insightsDatasetConfig:
          type: string
          description: >-
            Required. The resource identifier of the Storage Insights dataset
            configuration. Storage batch operations uses the latest snapshot
            from this dataset as the source to list and filter target objects.
            Format:
            `projects/{project_id}/locations/{location}/datasetConfigs/{dataset_config}`.
        objectFilters:
          description: >-
            Optional. Filters expressed in Common Expression Language (CEL) to
            apply to objects to identify objects to be transformed.
          $ref: '#/components/schemas/Expr'
        targetLocations:
          description: >-
            Optional. Specifies the Cloud Storage locations to include in the
            job. If provided, only buckets and objects within these locations
            will be discovered from the Storage Insights dataset as configured
            in the `insights_dataset_config`. If omitted, the job will discover
            buckets and objects from all locations configured in the
            `insights_dataset_config`.
          $ref: '#/components/schemas/TargetLocations'
      description: >-
        Describes the project source where the objects satisfying the filters
        will be transformed.
    RewriteObject:
      id: RewriteObject
      type: object
      properties:
        kmsKey:
          description: >-
            Optional. Resource name of the Cloud KMS key that is used to encrypt
            the object. The Cloud KMS key must be located in same location as
            the object. For details, see
            https://cloud.google.com/storage/docs/encryption/using-customer-managed-keys#add-object-key
            Format:
            `projects/{project_id}/locations/{location}/keyRings/{keyring}/cryptoKeys/{key}`
            For example:
            `projects/123456/locations/us-central1/keyRings/my-keyring/cryptoKeys/my-key`.
            The object will be rewritten and set with the specified KMS key.
          type: string
        storageClass:
          enumDescriptions:
            - The storage class is not specified.
            - Standard storage class.
            - Nearline storage class.
            - Coldline storage class.
            - Archive storage class.
          type: string
          description: >-
            Optional. Rewrites the object to the specified storage class.
            Setting this field will perform a full byte copy of the object if
            the storage class is different from the object's current storage
            class. If Autoclass is enabled on the bucket, storage class changes
            are ignored by Cloud Storage.
          enum:
            - STORAGE_CLASS_UNSPECIFIED
            - STANDARD
            - NEARLINE
            - COLDLINE
            - ARCHIVE
      description: Describes options for object rewrite.
    ObjectCustomContextPayload:
      description: Describes the payload of a user-defined object custom context.
      id: ObjectCustomContextPayload
      type: object
      properties:
        value:
          description: >-
            The value of the object custom context. If set, `value` can't be an
            empty string because it is a required field in custom context. If
            unset, `value` is ignored and no changes are made to the `value`
            field of the custom context payload.
          type: string
    LoggingConfig:
      id: LoggingConfig
      type: object
      properties:
        logActions:
          type: array
          items:
            enum:
              - LOGGABLE_ACTION_UNSPECIFIED
              - TRANSFORM
            type: string
            enumDescriptions:
              - Illegal value, to avoid allowing a default.
              - The corresponding transform action in this job.
          description: Required. Specifies the actions to be logged.
        logActionStates:
          items:
            type: string
            enumDescriptions:
              - Illegal value, to avoid allowing a default.
              - >-
                `LoggableAction` completed successfully. `SUCCEEDED` actions are
                logged as INFO.
              - >-
                `LoggableAction` terminated in an error state. `FAILED` actions
                are logged as ERROR.
            enum:
              - LOGGABLE_ACTION_STATE_UNSPECIFIED
              - SUCCEEDED
              - FAILED
          description: >-
            Required. States in which Action are logged.If empty, no logs are
            generated.
          type: array
      description: Specifies the Cloud Logging behavior.
    CancelJobRequest:
      description: Message for Job to Cancel
      id: CancelJobRequest
      type: object
      properties:
        requestId:
