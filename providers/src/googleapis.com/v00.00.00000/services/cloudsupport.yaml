          type: string
      id: ListCasesResponse
    Escalation:
      id: Escalation
      type: object
      properties:
        reason:
          type: string
          enumDescriptions:
            - >-
              The escalation reason is in an unknown state or has not been
              specified.
            - The case is taking too long to resolve.
            - >-
              The support agent does not have the expertise required to
              successfully resolve the issue.
            - The issue is having a significant business impact.
          enum:
            - REASON_UNSPECIFIED
            - RESOLUTION_TIME
            - TECHNICAL_EXPERTISE
            - BUSINESS_IMPACT
          description: Required. The reason why the Case is being escalated.
        justification:
          description: >-
            Required. A free text description to accompany the `reason` field
            above. Provides additional context on why the case is being
            escalated.
          type: string
      description: An escalation of a support case.
    SupportEventSubscription:
      description: A support event subscription.
      type: object
      properties:
        state:
          readOnly: true
          type: string
          enumDescriptions:
            - Unspecified state.
            - Subscription is active and working.
            - >-
              Subscription is failing. Notifications cannot be published for
              some reason.
            - >-
              Subscription has been deleted and is pending purge. Notifications
              are not sent for deleted subscriptions. Deleted subscriptions are
              purged after their `purge_time` has passed.
          enum:
            - STATE_UNSPECIFIED
            - WORKING
            - FAILING
            - DELETED
          description: Output only. The state of the subscription.
        name:
          description: Identifier. The resource name of the support event subscription.
          type: string
        pubSubTopic:
          description: >-
            Required. The name of the Pub/Sub topic to publish notifications to.
            Format: projects/{project}/topics/{topic}
          type: string
        createTime:
          description: Output only. The time at which the subscription was created.
          readOnly: true
          type: string
          format: google-datetime
        failureReason:
          description: >-
            Output only. Reason why subscription is failing. State of
            subscription must be FAILING in order for this to have a value.
          readOnly: true
          type: string
          enumDescriptions:
            - Unspecified failure reason.
            - >-
              The service account (i.e.
              cloud-support-apievents@system.gserviceaccount.com) lacks the
              permission to publish to the customer's Pub/Sub topic.
            - The specified Pub/Sub topic does not exist.
            - Message failed to publish due to a system-side error.
          enum:
            - FAILURE_REASON_UNSPECIFIED
            - PERMISSION_DENIED
            - TOPIC_NOT_FOUND
            - OTHER
        updateTime:
          readOnly: true
          type: string
          format: google-datetime
          description: Output only. The time at which the subscription was last updated.
        purgeTime:
          description: Output only. The time at which the subscription will be purged.
          readOnly: true
          type: string
          format: google-datetime
        deleteTime:
          readOnly: true
          type: string
          format: google-datetime
          description: Output only. The time at which the subscription was deleted.
      id: SupportEventSubscription
