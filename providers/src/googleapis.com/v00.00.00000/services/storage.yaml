components:
  parameters:
    alt:
      description: Data format for the response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        An opaque string that represents a user for quota purposes. Must not
        exceed 40 characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Upload protocol for media (e.g. "media", "multipart", "resumable").
      in: query
      name: uploadType
      schema:
        type: string
    userIp:
      description: Deprecated. Please use quotaUser instead.
      in: query
      name: userIp
      schema:
        type: string
  schemas:
    AdvanceRelocateBucketOperationRequest:
      description: An AdvanceRelocateBucketOperation request.
      id: AdvanceRelocateBucketOperationRequest
      properties:
        expireTime:
          description: >-
            Specifies the time when the relocation will revert to the sync stage
            if the relocation hasn't succeeded.
          format: date-time
          type: string
        ttl:
          description: >-
            Specifies the duration after which the relocation will revert to the
            sync stage if the relocation hasn't succeeded. Optional, if not
            supplied, a default value of 12h will be used.
          format: google-duration
          type: string
      type: object
    AnywhereCache:
      description: An Anywhere Cache instance.
      id: AnywhereCache
      properties:
        admissionPolicy:
          description: The cache-level entry admission policy.
          type: string
        anywhereCacheId:
          description: The ID of the Anywhere cache instance.
          type: string
        bucket:
          description: The name of the bucket containing this cache instance.
          type: string
        createTime:
          description: The creation time of the cache instance in RFC 3339 format.
          format: date-time
          type: string
        id:
          description: >-
            The ID of the resource, including the project number, bucket name
            and anywhere cache ID.
          type: string
        ingestOnWrite:
          description: Specifies whether objects are ingested into the cache upon write.
          type: boolean
        kind:
          default: storage#anywhereCache
          description: >-
            The kind of item this is. For Anywhere Cache, this is always
            storage#anywhereCache.
          type: string
        pendingUpdate:
          description: >-
            True if the cache instance has an active Update long-running
            operation.
          type: boolean
        selfLink:
          description: The link to this cache instance.
          type: string
        state:
          description: The current state of the cache instance.
          type: string
        ttl:
          description: 'The TTL of all cache entries in whole seconds. e.g., "7200s". '
          format: google-duration
          type: string
        updateTime:
          description: >-
            The modification time of the cache instance metadata in RFC 3339
            format.
          format: date-time
          type: string
        zone:
          description: >-
            The zone in which the cache instance is running. For example,
            us-central1-a.
          type: string
      type: object
    AnywhereCaches:
      description: A list of Anywhere Caches.
      id: AnywhereCaches
      properties:
        items:
          description: The list of items.
          items:
            $ref: '#/components/schemas/AnywhereCache'
          type: array
        kind:
          default: storage#anywhereCaches
          description: >-
            The kind of item this is. For lists of Anywhere Caches, this is
            always storage#anywhereCaches.
          type: string
        nextPageToken:
          description: >-
            The continuation token, used to page through large result sets.
            Provide this value in a subsequent request to return the next page
            of results.
          type: string
      type: object
    Bucket:
      description: A bucket.
      id: Bucket
      properties:
        acl:
          annotations:
            required:
              - storage.buckets.update
          description: Access controls on the bucket.
          items:
            $ref: '#/components/schemas/BucketAccessControl'
          type: array
        autoclass:
          description: The bucket's Autoclass configuration.
          properties:
            enabled:
              description: Whether or not Autoclass is enabled on this bucket
              type: boolean
            terminalStorageClass:
              description: >-
                The storage class that objects in the bucket eventually
                transition to if they are not read for a certain length of time.
                Valid values are NEARLINE and ARCHIVE.
              type: string
            terminalStorageClassUpdateTime:
              description: >-
                A date and time in RFC 3339 format representing the time of the
                most recent update to "terminalStorageClass".
              format: date-time
              type: string
            toggleTime:
              description: >-
                A date and time in RFC 3339 format representing the instant at
                which "enabled" was last toggled.
              format: date-time
              type: string
          type: object
        billing:
          description: The bucket's billing configuration.
          properties:
            requesterPays:
              description: When set to true, Requester Pays is enabled for this bucket.
              type: boolean
          type: object
        cors:
          description: The bucket's Cross-Origin Resource Sharing (CORS) configuration.
          items:
            properties:
              maxAgeSeconds:
                description: >-
                  The value, in seconds, to return in the 
                  Access-Control-Max-Age header used in preflight responses.
                format: int32
                type: integer
              method:
                description: >-
                  The list of HTTP methods on which to include CORS response
                  headers, (GET, OPTIONS, POST, etc) Note: "*" is permitted in
                  the list of methods, and means "any method".
                items:
                  type: string
                type: array
              origin:
                description: >-
                  The list of Origins eligible to receive CORS response headers.
                  Note: "*" is permitted in the list of origins, and means "any
                  Origin".
                items:
                  type: string
                type: array
              responseHeader:
                description: >-
                  The list of HTTP headers other than the simple response
                  headers to give permission for the user-agent to share across
                  domains.
                items:
                  type: string
                type: array
            type: object
          type: array
        customPlacementConfig:
          description: The bucket's custom placement configuration for Custom Dual Regions.
          properties:
            dataLocations:
              description: The list of regional locations in which data is placed.
              items:
                type: string
              type: array
          type: object
        defaultEventBasedHold:
          description: >-
            The default value for event-based hold on newly created objects in
            this bucket. Event-based hold is a way to retain objects
            indefinitely until an event occurs, signified by the hold's release.
            After being released, such objects will be subject to bucket-level
            retention (if any). One sample use case of this flag is for banks to
            hold loan documents for at least 3 years after loan is paid in full.
            Here, bucket-level retention is 3 years and the event is loan being
            paid in full. In this example, these objects will be held intact for
            any number of years until the event has occurred (event-based hold
            on the object is released) and then 3 more years after that. That
            means retention duration of the objects begins from the moment
            event-based hold transitioned from true to false. Objects under
            event-based hold cannot be deleted, overwritten or archived until
            the hold is removed.
          type: boolean
        defaultObjectAcl:
          description: >-
            Default access controls to apply to new objects when no ACL is
            provided.
          items:
            $ref: '#/components/schemas/ObjectAccessControl'
          type: array
        encryption:
          description: Encryption configuration for a bucket.
          properties:
            customerManagedEncryptionEnforcementConfig:
              description: >-
                If set, the new objects created in this bucket must comply with
                this enforcement config. Changing this has no effect on existing
                objects; it applies to new objects only. If omitted, the new
                objects are allowed to be encrypted with Customer Managed
                Encryption type by default.
              properties:
                effectiveTime:
                  description: >-
                    Server-determined value that indicates the time from which
                    configuration was enforced and effective. This value is in
                    RFC 3339 format.
                  format: date-time
                  type: string
                restrictionMode:
                  description: >-
                    Restriction mode for Customer-Managed Encryption Keys.
                    Defaults to NotRestricted.
                  enum:
                    - NotRestricted
                    - FullyRestricted
                  enumDescriptions:
                    - >-
                      Creation of new objects with Customer-Managed Encryption
                      is not restricted.
                    - >-
                      Creation of new objects with Customer-Managed Encryption
                      is fully restricted.
                  type: string
              type: object
            customerSuppliedEncryptionEnforcementConfig:
              description: >-
                If set, the new objects created in this bucket must comply with
                this enforcement config. Changing this has no effect on existing
                objects; it applies to new objects only. If omitted, the new
                objects are allowed to be encrypted with Customer Supplied
                Encryption type by default.
              properties:
                effectiveTime:
                  description: >-
                    Server-determined value that indicates the time from which
                    configuration was enforced and effective. This value is in
                    RFC 3339 format.
                  format: date-time
                  type: string
                restrictionMode:
                  description: >-
                    Restriction mode for Customer-Supplied Encryption Keys.
                    Defaults to NotRestricted.
                  enum:
                    - NotRestricted
                    - FullyRestricted
                  enumDescriptions:
                    - >-
                      Creation of new objects with Customer-Supplied Encryption
                      is not restricted.
                    - >-
                      Creation of new objects with Customer-Supplied Encryption
                      is fully restricted.
                  type: string
              type: object
            defaultKmsKeyName:
              description: >-
                A Cloud KMS key that will be used to encrypt objects inserted
                into this bucket, if no encryption method is specified.
              type: string
            googleManagedEncryptionEnforcementConfig:
              description: >-
                If set, the new objects created in this bucket must comply with
                this enforcement config. Changing this has no effect on existing
                objects; it applies to new objects only. If omitted, the new
                objects are allowed to be encrypted with Google Managed
                Encryption type by default.
              properties:
                effectiveTime:
                  description: >-
                    Server-determined value that indicates the time from which
                    configuration was enforced and effective. This value is in
                    RFC 3339 format.
                  format: date-time
                  type: string
                restrictionMode:
                  description: >-
                    Restriction mode for Google-Managed Encryption Keys.
                    Defaults to NotRestricted.
                  enum:
                    - NotRestricted
                    - FullyRestricted
                  enumDescriptions:
                    - >-
                      Creation of new objects with Google Managed Encryption is
                      not restricted.
                    - >-
                      Creation of new objects with Google Managed Encryption is
                      fully restricted.
                  type: string
              type: object
          type: object
        etag:
          description: HTTP 1.1 Entity tag for the bucket.
          type: string
        generation:
          description: The generation of this bucket.
          format: int64
          type: string
        hardDeleteTime:
          description: The hard delete time of the bucket in RFC 3339 format.
          format: date-time
          type: string
        hierarchicalNamespace:
          description: The bucket's hierarchical namespace configuration.
          properties:
            enabled:
              description: >-
                When set to true, hierarchical namespace is enabled for this
                bucket.
              type: boolean
          type: object
        iamConfiguration:
          description: The bucket's IAM configuration.
          properties:
            bucketPolicyOnly:
              description: >-
                The bucket's uniform bucket-level access configuration. The
                feature was formerly known as Bucket Policy Only. For backward
                compatibility, this field will be populated with identical
                information as the uniformBucketLevelAccess field. We recommend
                using the uniformBucketLevelAccess field to enable and disable
                the feature.
              properties:
                enabled:
                  description: >-
                    If set, access is controlled only by bucket-level or above
                    IAM policies.
                  type: boolean
                lockedTime:
                  description: >-
                    The deadline for changing
                    iamConfiguration.bucketPolicyOnly.enabled from true to false
                    in RFC 3339 format.
                    iamConfiguration.bucketPolicyOnly.enabled may be changed
                    from true to false until the locked time, after which the
                    field is immutable.
                  format: date-time
                  type: string
              type: object
            publicAccessPrevention:
              description: >-
                The bucket's Public Access Prevention configuration. Currently,
                'inherited' and 'enforced' are supported.
              type: string
            uniformBucketLevelAccess:
              description: The bucket's uniform bucket-level access configuration.
              properties:
                enabled:
                  description: >-
                    If set, access is controlled only by bucket-level or above
                    IAM policies.
                  type: boolean
                lockedTime:
                  description: >-
                    The deadline for changing
                    iamConfiguration.uniformBucketLevelAccess.enabled from true
                    to false in RFC 3339  format.
                    iamConfiguration.uniformBucketLevelAccess.enabled may be
                    changed from true to false until the locked time, after
                    which the field is immutable.
                  format: date-time
                  type: string
              type: object
          type: object
        id:
          description: >-
            The ID of the bucket. For buckets, the id and name properties are
            the same.
          type: string
        ipFilter:
          description: >-
            The bucket's IP filter configuration. Specifies the network sources
            that are allowed to access the operations on the bucket, as well as
            its underlying objects. Only enforced when the mode is set to
            'Enabled'.
          properties:
            allowAllServiceAgentAccess:
              description: >-
                Whether to allow all service agents to access the bucket
                regardless of the IP filter configuration.
              type: boolean
            allowCrossOrgVpcs:
              description: >-
                Whether to allow cross-org VPCs in the bucket's IP filter
                configuration.
              type: boolean
            mode:
              description: >-
                The mode of the IP filter. Valid values are 'Enabled' and
                'Disabled'.
              type: string
            publicNetworkSource:
              description: The public network source of the bucket's IP filter.
              properties:
                allowedIpCidrRanges:
                  description: >-
                    The list of public IPv4, IPv6 cidr ranges that are allowed
                    to access the bucket.
                  items:
                    type: string
                  type: array
              type: object
            vpcNetworkSources:
              description: >-
                The list of [VPC network](https://cloud.google.com/vpc/docs/vpc)
                sources of the bucket's IP filter.
              items:
                properties:
                  allowedIpCidrRanges:
                    description: >-
                      The list of IPv4, IPv6 cidr ranges subnetworks that are
                      allowed to access the bucket.
                    items:
                      type: string
                    type: array
                  network:
                    description: >-
                      Name of the network. Format:
                      projects/{PROJECT_ID}/global/networks/{NETWORK_NAME}
                    type: string
                type: object
              type: array
          type: object
        kind:
          default: storage#bucket
          description: >-
            The kind of item this is. For buckets, this is always
            storage#bucket.
          type: string
        labels:
          additionalProperties:
            description: An individual label entry.
            type: string
          description: User-provided labels, in key/value pairs.
          type: object
        lifecycle:
          description: >-
            The bucket's lifecycle configuration. See [Lifecycle
            Management](https://cloud.google.com/storage/docs/lifecycle) for
            more information.
          properties:
            rule:
              description: >-
                A lifecycle management rule, which is made of an action to take
                and the condition(s) under which the action will be taken.
              items:
                properties:
                  action:
                    description: The action to take.
                    properties:
                      storageClass:
                        description: >-
                          Target storage class. Required iff the type of the
                          action is SetStorageClass.
                        type: string
                      type:
                        description: >-
                          Type of the action. Currently, only Delete,
                          SetStorageClass, and AbortIncompleteMultipartUpload
                          are supported.
                        type: string
                    type: object
                  condition:
                    description: The condition(s) under which the action will be taken.
                    properties:
                      age:
                        description: >-
                          Age of an object (in days). This condition is
                          satisfied when an object reaches the specified age.
                        format: int32
                        type: integer
                      createdBefore:
                        description: >-
                          A date in RFC 3339 format with only the date part (for
                          instance, "2013-01-15"). This condition is satisfied
                          when an object is created before midnight of the
                          specified date in UTC.
                        format: date
                        type: string
                      customTimeBefore:
                        description: >-
                          A date in RFC 3339 format with only the date part (for
                          instance, "2013-01-15"). This condition is satisfied
                          when the custom time on an object is before this date
                          in UTC.
                        format: date
                        type: string
                      daysSinceCustomTime:
                        description: >-
                          Number of days elapsed since the user-specified
                          timestamp set on an object. The condition is satisfied
                          if the days elapsed is at least this number. If no
                          custom timestamp is specified on an object, the
                          condition does not apply.
                        format: int32
                        type: integer
                      daysSinceNoncurrentTime:
                        description: >-
                          Number of days elapsed since the noncurrent timestamp
                          of an object. The condition is satisfied if the days
                          elapsed is at least this number. This condition is
                          relevant only for versioned objects. The value of the
                          field must be a nonnegative integer. If it's zero, the
                          object version will become eligible for Lifecycle
                          action as soon as it becomes noncurrent.
                        format: int32
                        type: integer
                      isLive:
                        description: >-
                          Relevant only for versioned objects. If the value is
                          true, this condition matches live objects; if the
                          value is false, it matches archived objects.
                        type: boolean
                      matchesPattern:
                        description: >-
                          A regular expression that satisfies the RE2 syntax.
                          This condition is satisfied when the name of the
                          object matches the RE2 pattern. Note: This feature is
                          currently in the "Early Access" launch stage and is
                          only available to a whitelisted set of users; that
                          means that this feature may be changed in
                          backward-incompatible ways and that it is not
                          guaranteed to be released.
                        type: string
                      matchesPrefix:
                        description: >-
                          List of object name prefixes. This condition will be
                          satisfied when at least one of the prefixes exactly
                          matches the beginning of the object name.
                        items:
                          type: string
                        type: array
                      matchesStorageClass:
                        description: >-
                          Objects having any of the storage classes specified by
                          this condition will be matched. Values include
                          MULTI_REGIONAL, REGIONAL, NEARLINE, COLDLINE, ARCHIVE,
                          STANDARD, and DURABLE_REDUCED_AVAILABILITY.
                        items:
                          type: string
                        type: array
                      matchesSuffix:
                        description: >-
                          List of object name suffixes. This condition will be
                          satisfied when at least one of the suffixes exactly
                          matches the end of the object name.
                        items:
                          type: string
                        type: array
                      noncurrentTimeBefore:
                        description: >-
                          A date in RFC 3339 format with only the date part (for
                          instance, "2013-01-15"). This condition is satisfied
                          when the noncurrent time on an object is before this
                          date in UTC. This condition is relevant only for
                          versioned objects.
                        format: date
                        type: string
                      numNewerVersions:
                        description: >-
                          Relevant only for versioned objects. If the value is
                          N, this condition is satisfied when there are at least
                          N versions (including the live version) newer than
                          this version of the object.
                        format: int32
                        type: integer
                      sizeAboveBytes:
                        description: >-
                          Objects having a size greater than this value in bytes
                          will be matched.
                        format: int64
                        type: string
                      sizeBelowBytes:
                        description: >-
                          Objects having a size less than this value in bytes
                          will be matched.
                        format: int64
                        type: string
                    type: object
                type: object
              type: array
          type: object
        location:
          description: >-
            The location of the bucket. Object data for objects in the bucket
            resides in physical storage within this region. Defaults to US. See
            the [Developer's
            Guide](https://cloud.google.com/storage/docs/locations) for the
            authoritative list.
          type: string
        locationType:
          description: The type of the bucket location.
          type: string
        logging:
          description: >-
            The bucket's logging configuration, which defines the destination
            bucket and optional name prefix for the current bucket's logs.
          properties:
            logBucket:
              description: >-
                The destination bucket where the current bucket's logs should be
                placed.
              type: string
            logObjectPrefix:
              description: A prefix for log object names.
              type: string
          type: object
        metageneration:
          description: The metadata generation of this bucket.
          format: int64
          type: string
        name:
          annotations:
            required:
              - storage.buckets.insert
          description: The name of the bucket.
          type: string
        objectRetention:
          description: The bucket's object retention config.
          properties:
            mode:
              description: The bucket's object retention mode. Can be Enabled.
              type: string
          type: object
        owner:
          description: >-
            The owner of the bucket. This is always the project team's owner
            group.
          properties:
            entity:
              description: The entity, in the form project-owner-projectId.
              type: string
            entityId:
              description: The ID for the entity.
              type: string
          type: object
        projectNumber:
          description: The project number of the project the bucket belongs to.
          format: uint64
          type: string
        retentionPolicy:
          description: >-
            The bucket's retention policy. The retention policy enforces a
            minimum retention time for all objects contained in the bucket,
            based on their creation time. Any attempt to overwrite or delete
            objects younger than the retention period will result in a
            PERMISSION_DENIED error. An unlocked retention policy can be
            modified or removed from the bucket via a storage.buckets.update
            operation. A locked retention policy cannot be removed or shortened
            in duration for the lifetime of the bucket. Attempting to remove or
            decrease period of a locked retention policy will result in a
            PERMISSION_DENIED error.
          properties:
            effectiveTime:
              description: >-
                Server-determined value that indicates the time from which
                policy was enforced and effective. This value is in RFC 3339
                format.
              format: date-time
              type: string
            isLocked:
              description: Once locked, an object retention policy cannot be modified.
              type: boolean
            retentionPeriod:
              description: >-
                The duration in seconds that objects need to be retained.
                Retention duration must be greater than zero and less than 100
                years. Note that enforcement of retention periods less than a
                day is not guaranteed. Such periods should only be used for
                testing purposes.
              format: int64
              type: string
          type: object
        rpo:
          description: >-
            The Recovery Point Objective (RPO) of this bucket. Set to
            ASYNC_TURBO to turn on Turbo Replication on a bucket.
          type: string
        satisfiesPZI:
          description: Reserved for future use.
          type: boolean
        satisfiesPZS:
          description: Reserved for future use.
          type: boolean
        selfLink:
          description: The URI of this bucket.
          type: string
        softDeletePolicy:
          description: >-
            The bucket's soft delete policy, which defines the period of time
            that soft-deleted objects will be retained, and cannot be
            permanently deleted.
          properties:
            effectiveTime:
              description: >-
                Server-determined value that indicates the time from which the
                policy, or one with a greater retention, was effective. This
                value is in RFC 3339 format.
              format: date-time
              type: string
            retentionDurationSeconds:
              description: >-
                The duration in seconds that soft-deleted objects in the bucket
                will be retained and cannot be permanently deleted.
              format: int64
              type: string
          type: object
        softDeleteTime:
          description: The soft delete time of the bucket in RFC 3339 format.
          format: date-time
          type: string
        storageClass:
          description: >-
            The bucket's default storage class, used whenever no storageClass is
            specified for a newly-created object. This defines how objects in
            the bucket are stored and determines the SLA and the cost of
            storage. Values include MULTI_REGIONAL, REGIONAL, STANDARD,
            NEARLINE, COLDLINE, ARCHIVE, and DURABLE_REDUCED_AVAILABILITY. If
            this value is not specified when the bucket is created, it will
            default to STANDARD. For more information, see [Storage
            Classes](https://cloud.google.com/storage/docs/storage-classes).
          type: string
        timeCreated:
          description: The creation time of the bucket in RFC 3339 format.
          format: date-time
          type: string
        updated:
          description: The modification time of the bucket in RFC 3339 format.
          format: date-time
          type: string
        versioning:
          description: The bucket's versioning configuration.
          properties:
            enabled:
              description: While set to true, versioning is fully enabled for this bucket.
              type: boolean
          type: object
        website:
          description: >-
            The bucket's website configuration, controlling how the service
            behaves when accessing bucket contents as a web site. See the
            [Static Website
            Examples](https://cloud.google.com/storage/docs/static-website) for
            more information.
          properties:
            mainPageSuffix:
              description: >-
                If the requested object path is missing, the service will ensure
                the path has a trailing '/', append this suffix, and attempt to
                retrieve the resulting object. This allows the creation of
                index.html objects to represent directory pages.
              type: string
            notFoundPage:
              description: >-
                If the requested object path is missing, and any mainPageSuffix
                object is missing, if applicable, the service will return the
                named object from this bucket as the content for a 404 Not Found
                result.
              type: string
          type: object
      type: object
    BucketAccessControl:
      description: An access-control entry.
      id: BucketAccessControl
      properties:
        bucket:
          description: The name of the bucket.
          type: string
        domain:
          description: The domain associated with the entity, if any.
          type: string
        email:
          description: The email address associated with the entity, if any.
          type: string
        entity:
          annotations:
            required:
              - storage.bucketAccessControls.insert
          description: >-
            The entity holding the permission, in one of the following forms: 

            - user-userId 

            - user-email 

            - group-groupId 

            - group-email 

            - domain-domain 

            - project-team-projectId 

            - allUsers 

            - allAuthenticatedUsers Examples: 

            - The user liz@example.com would be user-liz@example.com. 

            - The group example@googlegroups.com would be
            group-example@googlegroups.com. 

            - To refer to all members of the Google Apps for Business domain
            example.com, the entity would be domain-example.com.
          type: string
        entityId:
          description: The ID for the entity, if any.
          type: string
        etag:
