          type: string
        size:
          description: Content-Length of the data in bytes.
          format: uint64
          type: string
        softDeleteTime:
          description: The time at which the object became soft-deleted in RFC 3339 format.
          format: date-time
          type: string
        storageClass:
          description: Storage class of the object.
          type: string
        temporaryHold:
          description: >-
            Whether an object is under temporary hold. While this flag is set to
            true, the object is protected against deletion and overwrites. A
            common use case of this flag is regulatory investigations where
            objects need to be retained while the investigation is ongoing. Note
            that unlike event-based hold, temporary hold does not impact
            retention expiration time of an object.
          type: boolean
        timeCreated:
          description: The creation time of the object in RFC 3339 format.
          format: date-time
          type: string
        timeDeleted:
          description: >-
            The time at which the object became noncurrent in RFC 3339 format.
            Will be returned if and only if this version of the object has been
            deleted.
          format: date-time
          type: string
        timeFinalized:
          description: The time when the object was finalized.
          format: date-time
          type: string
        timeStorageClassUpdated:
          description: >-
            The time at which the object's storage class was last changed. When
            the object is initially created, it will be set to timeCreated.
          format: date-time
          type: string
        updated:
          description: >-
            The modification time of the object metadata in RFC 3339 format. Set
            initially to object creation time and then updated whenever any
            metadata of the object changes. This includes changes made by a
            requester, such as modifying custom metadata, as well as changes
            made by Cloud Storage on behalf of a requester, such as changing the
            storage class based on an Object Lifecycle Configuration.
          format: date-time
          type: string
      type: object
    ObjectAccessControl:
      description: An access-control entry.
      id: ObjectAccessControl
      properties:
        bucket:
          description: The name of the bucket.
          type: string
        domain:
          description: The domain associated with the entity, if any.
          type: string
        email:
          description: The email address associated with the entity, if any.
          type: string
        entity:
          annotations:
            required:
              - storage.defaultObjectAccessControls.insert
              - storage.objectAccessControls.insert
          description: >-
            The entity holding the permission, in one of the following forms: 

            - user-userId 

            - user-email 

            - group-groupId 

            - group-email 

            - domain-domain 

            - project-team-projectId 

            - allUsers 

            - allAuthenticatedUsers Examples: 

            - The user liz@example.com would be user-liz@example.com. 

            - The group example@googlegroups.com would be
            group-example@googlegroups.com. 

            - To refer to all members of the Google Apps for Business domain
            example.com, the entity would be domain-example.com.
          type: string
        entityId:
          description: The ID for the entity, if any.
          type: string
        etag:
          description: HTTP 1.1 Entity tag for the access-control entry.
          type: string
        generation:
          description: The content generation of the object, if applied to an object.
          format: int64
          type: string
        id:
          description: The ID of the access-control entry.
          type: string
        kind:
          default: storage#objectAccessControl
          description: >-
            The kind of item this is. For object access control entries, this is
            always storage#objectAccessControl.
          type: string
        object:
          description: The name of the object, if applied to an object.
          type: string
        projectTeam:
          description: The project team associated with the entity, if any.
          properties:
            projectNumber:
              description: The project number.
              type: string
            team:
              description: The team.
              type: string
          type: object
        role:
          annotations:
            required:
              - storage.defaultObjectAccessControls.insert
              - storage.objectAccessControls.insert
          description: The access permission for the entity.
          type: string
        selfLink:
          description: The link to this access-control entry.
          type: string
      type: object
    ObjectAccessControls:
      description: An access-control list.
      id: ObjectAccessControls
      properties:
        items:
          description: The list of items.
          items:
            $ref: '#/components/schemas/ObjectAccessControl'
          type: array
        kind:
          default: storage#objectAccessControls
          description: >-
            The kind of item this is. For lists of object access control
            entries, this is always storage#objectAccessControls.
          type: string
      type: object
    ObjectContentUploadBody:
      properties:
        contents:
          description: The text content of the object. Text (non-binary) content only.
          type: string
      required:
        - contents
      type: object
    ObjectCustomContextPayload:
      description: The payload of a single user-defined object context.
      id: ObjectCustomContextPayload
      properties:
        createTime:
          description: The time at which the object context was created in RFC 3339 format.
          format: date-time
          type: string
        updateTime:
          description: >-
            The time at which the object context was last updated in RFC 3339
            format.
          format: date-time
          type: string
        value:
          description: The value of the object context.
          type: string
      type: object
    Objects:
      description: A list of objects.
      id: Objects
      properties:
        items:
          description: The list of items.
          items:
            $ref: '#/components/schemas/Object'
          type: array
        kind:
          default: storage#objects
          description: >-
            The kind of item this is. For lists of objects, this is always
            storage#objects.
          type: string
        nextPageToken:
          description: >-
            The continuation token, used to page through large result sets.
            Provide this value in a subsequent request to return the next page
            of results.
          type: string
        prefixes:
          description: >-
            The list of prefixes of objects matching-but-not-listed up to and
            including the requested delimiter.
          items:
            type: string
          type: array
      type: object
    Policy:
      description: A bucket/object/managedFolder IAM policy.
      id: Policy
      properties:
        bindings:
          annotations:
            required:
              - storage.buckets.setIamPolicy
              - storage.objects.setIamPolicy
              - storage.managedFolders.setIamPolicy
          description: >-
            An association between a role, which comes with a set of
            permissions, and members who may assume that role.
          items:
            properties:
              condition:
                $ref: '#/components/schemas/Expr'
                description: >-
                  The condition that is associated with this binding. NOTE: an
                  unsatisfied condition will not allow user access via current
                  binding. Different bindings, including their conditions, are
                  examined independently.
              members:
                annotations:
                  required:
                    - storage.buckets.setIamPolicy
                    - storage.objects.setIamPolicy
                    - storage.managedFolders.setIamPolicy
                description: >-
                  A collection of identifiers for members who may assume the
                  provided role. Recognized identifiers are as follows:  

                  - allUsers - A special identifier that represents anyone on
                  the internet; with or without a Google account.  

                  - allAuthenticatedUsers - A special identifier that represents
                  anyone who is authenticated with a Google account or a service
                  account.  

                  - user:emailid - An email address that represents a specific
                  account. For example, user:alice@gmail.com or
                  user:joe@example.com.  

                  - serviceAccount:emailid - An email address that represents a
                  service account. For example, 
                  serviceAccount:my-other-app@appspot.gserviceaccount.com .  

                  - group:emailid - An email address that represents a Google
                  group. For example, group:admins@example.com.  

                  - domain:domain - A Google Apps domain name that represents
                  all the users of that domain. For example, domain:google.com
                  or domain:example.com.  

                  - projectOwner:projectid - Owners of the given project. For
                  example, projectOwner:my-example-project  

                  - projectEditor:projectid - Editors of the given project. For
                  example, projectEditor:my-example-project  

                  - projectViewer:projectid - Viewers of the given project. For
                  example, projectViewer:my-example-project
                items:
                  type: string
                type: array
              role:
                annotations:
                  required:
                    - storage.buckets.setIamPolicy
                    - storage.objects.setIamPolicy
                    - storage.managedFolders.setIamPolicy
                description: >-
                  The role to which members belong. Two types of roles are
                  supported: new IAM roles, which grant permissions that do not
                  map directly to those provided by ACLs, and legacy IAM roles,
                  which do map directly to ACL permissions. All roles are of the
                  format roles/storage.specificRole.

                  The new IAM roles are:  

                  - roles/storage.admin - Full control of Google Cloud Storage
                  resources.  

                  - roles/storage.objectViewer - Read-Only access to Google
                  Cloud Storage objects.  

                  - roles/storage.objectCreator - Access to create objects in
                  Google Cloud Storage.  

                  - roles/storage.objectAdmin - Full control of Google Cloud
                  Storage objects.   The legacy IAM roles are:  

                  - roles/storage.legacyObjectReader - Read-only access to
                  objects without listing. Equivalent to an ACL entry on an
                  object with the READER role.  

                  - roles/storage.legacyObjectOwner - Read/write access to
                  existing objects without listing. Equivalent to an ACL entry
                  on an object with the OWNER role.  

                  - roles/storage.legacyBucketReader - Read access to buckets
                  with object listing. Equivalent to an ACL entry on a bucket
                  with the READER role.  

                  - roles/storage.legacyBucketWriter - Read access to buckets
                  with object listing/creation/deletion. Equivalent to an ACL
                  entry on a bucket with the WRITER role.  

                  - roles/storage.legacyBucketOwner - Read and write access to
                  existing buckets with object listing/creation/deletion.
                  Equivalent to an ACL entry on a bucket with the OWNER role.
                type: string
            type: object
          type: array
        etag:
          description: HTTP 1.1  Entity tag for the policy.
          format: byte
          type: string
        kind:
          default: storage#policy
          description: >-
            The kind of item this is. For policies, this is always
            storage#policy. This field is ignored on input.
          type: string
        resourceId:
          description: >-
            The ID of the resource to which this policy belongs. Will be of the
            form projects/_/buckets/bucket for buckets,
            projects/_/buckets/bucket/objects/object for objects, and
            projects/_/buckets/bucket/managedFolders/managedFolder. A specific
            generation may be specified by appending #generationNumber to the
            end of the object name, e.g.
            projects/_/buckets/my-bucket/objects/data.txt#17. The current
            generation can be denoted with #0. This field is ignored on input.
          type: string
        version:
          description: The IAM policy format version.
          format: int32
          type: integer
      type: object
    RapidCache:
      description: A Rapid Cache instance.
      id: RapidCache
      properties:
        admissionPolicy:
          description: The cache-level entry admission policy.
          type: string
        bucket:
          description: The name of the bucket containing this cache instance.
          type: string
        cacheType:
          description: >-
            The type of Rapid Cache this represents. Valid values include:
            "rapid-cache" and "rapid-cache-ultra".
          type: string
        createTime:
          description: The creation time of the cache instance in RFC 3339 format.
          format: date-time
          type: string
        id:
          description: >-
            The ID of the resource, including the project number, bucket name
            and rapid cache ID.
          type: string
        ingestOnWrite:
          description: Specifies whether objects are ingested into the cache upon write.
          type: boolean
        kind:
          default: storage#rapidCache
          description: >-
            The kind of item this is. For Rapid Cache, this is always
            storage#rapidCache.
          type: string
        pendingUpdate:
          description: >-
            True if the cache instance has an active Update long-running
            operation.
          type: boolean
        rapidCacheId:
          description: The ID of the Rapid cache instance.
          type: string
        selfLink:
          description: The link to this cache instance.
          type: string
        state:
          description: The current state of the cache instance.
          type: string
        ttl:
          description: The TTL of all cache entries in whole seconds. e.g., "7200s".
          format: google-duration
          type: string
        updateTime:
          description: >-
            The modification time of the cache instance metadata in RFC 3339
            format.
          format: date-time
          type: string
        zone:
          description: >-
            The zone in which the cache instance is running. For example,
            us-central1-a.
          type: string
      type: object
    RapidCacheConfig:
      description: Configuration options for the rapid cache of a managed folder.
      id: RapidCacheConfig
      properties:
        policies:
          additionalProperties:
            $ref: '#/components/schemas/RapidCachePolicy'
          description: >-
            A map of rapid cache IDs to the corresponding `RapidCachePolicy`
            configurations for a managed folder.
          type: object
      type: object
    RapidCachePolicy:
      description: The rapid cache policy configuration for a managed folder.
      id: RapidCachePolicy
      properties:
        ingestOnWrite:
          description: >-
            The ingest-on-write policy for objects in the managed folder. When
            set to `enabled`, objects are automatically ingested into the cache
            when they are written to the managed folder.
          enum:
            - enabled
            - unspecified
          enumDescriptions:
            - Ingestion on write is explicitly enabled for the managed folder.
            - >-
              Ingestion on write isn't specified at the managed folder level and
              is inherited from the parent resource's configuration. This is the
              default value.
          type: string
        rapidCacheId:
          description: The unique identifier of the rapid cache.
          type: string
      type: object
    RapidCaches:
      description: A list of Rapid Caches.
      id: RapidCaches
      properties:
        items:
          description: The list of items.
          items:
            $ref: '#/components/schemas/RapidCache'
          type: array
        kind:
          default: storage#rapidCaches
          description: >-
            The kind of item this is. For lists of Rapid Caches, this is always
            storage#rapidCaches.
          type: string
        nextPageToken:
          description: >-
            The continuation token, used to page through large result sets.
            Provide this value in a subsequent request to return the next page
            of results.
          type: string
      type: object
    RelocateBucketRequest:
      description: A Relocate Bucket request.
      id: RelocateBucketRequest
      properties:
        destinationCustomPlacementConfig:
          description: >-
            The bucket's new custom placement configuration if relocating to a
            Custom Dual Region.
          properties:
            dataLocations:
              description: The list of regional locations in which data is placed.
              items:
                type: string
              type: array
          type: object
        destinationKmsKeyName:
          description: >-
            Resource name of a Cloud KMS key, of the form
            projects/my-project/locations/global/keyRings/my-kr/cryptoKeys/my-key.
            If set, is used to encrypt all objects in the destination bucket.
          type: string
        destinationLocation:
          description: The new location the bucket will be relocated to.
          type: string
        validateOnly:
          description: >-
            If true, validate the operation, but do not actually relocate the
            bucket.
          type: boolean
      type: object
    RewriteResponse:
      description: A rewrite response.
      id: RewriteResponse
      properties:
        done:
          description: >-
            true if the copy is finished; otherwise, false if the copy is in
            progress. This property is always present in the response.
          type: boolean
        kind:
          default: storage#rewriteResponse
          description: The kind of item this is.
          type: string
        objectSize:
          description: >-
            The total size of the object being copied in bytes. This property is
            always present in the response.
          format: int64
          type: string
        resource:
          $ref: '#/components/schemas/Object'
          description: >-
            A resource containing the metadata for the copied-to object. This
            property is present in the response only when copying completes.
        rewriteToken:
          description: >-
            A token to use in subsequent requests to continue copying data. This
            token is present in the response only when there is more data to
            copy.
          type: string
        totalBytesRewritten:
          description: >-
            The total bytes written so far, which can be used to provide a
            waiting user with a progress indicator. This property is always
            present in the response.
          format: int64
          type: string
      type: object
    ServiceAccount:
      description: A subscription to receive Google PubSub notifications.
      id: ServiceAccount
      properties:
        email_address:
          description: The ID of the notification.
          type: string
        kind:
          default: storage#serviceAccount
          description: >-
            The kind of item this is. For notifications, this is always
            storage#notification.
          type: string
      type: object
    TestIamPermissionsResponse:
      description: A storage.(buckets|objects|managedFolders).testIamPermissions response.
      id: TestIamPermissionsResponse
      properties:
        kind:
          default: storage#testIamPermissionsResponse
          description: The kind of item this is.
          type: string
        permissions:
          description: >-
            The permissions held by the caller. Permissions are always of the
            format storage.resource.capability, where resource is one of
            buckets, objects, or managedFolders. The supported permissions are
            as follows:  

            - storage.buckets.delete - Delete bucket.  

            - storage.buckets.get - Read bucket metadata.  

            - storage.buckets.getIamPolicy - Read bucket IAM policy.  

            - storage.buckets.create - Create bucket.  

            - storage.buckets.list - List buckets.  

            - storage.buckets.setIamPolicy - Update bucket IAM policy.  

            - storage.buckets.update - Update bucket metadata.  

            - storage.objects.delete - Delete object.  

            - storage.objects.get - Read object data and metadata.  

            - storage.objects.getIamPolicy - Read object IAM policy.  

            - storage.objects.create - Create object.  

            - storage.objects.list - List objects.  

            - storage.objects.setIamPolicy - Update object IAM policy.  

            - storage.objects.update - Update object metadata. 

            - storage.managedFolders.delete - Delete managed folder.  

            - storage.managedFolders.get - Read managed folder metadata.  

            - storage.managedFolders.getIamPolicy - Read managed folder IAM
            policy.  

            - storage.managedFolders.create - Create managed folder.  

            - storage.managedFolders.list - List managed folders.  

            - storage.managedFolders.setIamPolicy - Update managed folder IAM
            policy.
          items:
            type: string
          type: array
      type: object
