openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Migration Center API
  description: >-
    A unified platform that helps you accelerate your end-to-end cloud journey
    from your current on-premises or cloud environments to Google Cloud.
  version: v1
  x-discovery-doc-revision: '20260721'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/migration-center
servers:
  - url: https://migrationcenter.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    NfsExport:
      id: NfsExport
      properties:
        exportDirectory:
          description: The directory being exported.
          type: string
        hosts:
          items:
            type: string
          type: array
          description: The hosts or networks to which the export is being shared.
      type: object
      description: NFS export.
    CascadeLogicalDBsRule:
      description: Cascading rule for related logical DBs.
      type: object
      id: CascadeLogicalDBsRule
      properties: {}
    MySqlSchemaDetails:
      type: object
      id: MySqlSchemaDetails
      properties:
        storageEngines:
          description: Optional. Mysql storage engine tables.
          items:
            $ref: '#/components/schemas/MySqlStorageEngineDetails'
          type: array
      description: Specific details for a Mysql database.
    PostgreSqlExtension:
      id: PostgreSqlExtension
      properties:
        extension:
          type: string
          description: Required. The extension name.
        version:
          description: Required. The extension version.
          type: string
      type: object
      description: PostgreSql extension.
    ReportSummarySoleTenantFinding:
      id: ReportSummarySoleTenantFinding
      properties:
        allocatedAssetCount:
          description: Count of assets which are allocated
          type: string
          format: int64
        nodeAllocations:
          items:
            $ref: '#/components/schemas/ReportSummarySoleTenantNodeAllocation'
          type: array
          description: Set of per-nodetype allocation records
        allocatedRegions:
          items:
            type: string
          type: array
          description: Set of regions in which the assets are allocated
      type: object
      description: A set of findings that applies to assets destined for Sole-Tenant nodes.
    AssetsExportJobPerformanceData:
      description: Configuration for performance data exports.
      type: object
      id: AssetsExportJobPerformanceData
      properties:
        maxDays:
          type: integer
          format: int32
          description: >-
            Optional. When this value is set to a positive integer, performance
            data will be returned for the most recent days for which data is
            available. When this value is unset (or set to zero), all available
            data is returned. The maximum value is 420; values above 420 will be
            coerced to 420. If unset (0 value) a default value of 40 will be
            used.
    GuestOsDetails:
      id: GuestOsDetails
      properties:
        family:
          enum:
            - OS_FAMILY_UNKNOWN
            - OS_FAMILY_WINDOWS
            - OS_FAMILY_LINUX
            - OS_FAMILY_UNIX
          type: string
          description: What family the OS belong to, if known.
          enumDescriptions:
            - ''
            - Microsoft Windows Server and Desktop.
            - Various Linux flavors.
            - Non-Linux Unix flavors.
        osName:
          type: string
          description: The name of the operating system.
        version:
          description: The version of the operating system.
          type: string
        config:
          $ref: '#/components/schemas/GuestConfigDetails'
          description: OS and app configuration.
        runtime:
          $ref: '#/components/schemas/GuestRuntimeDetails'
          description: Runtime information.
      type: object
      description: Information from Guest-level collections.
    PostgreSqlSchemaDetails:
      description: Specific details for a PostgreSql schema.
      type: object
      id: PostgreSqlSchemaDetails
      properties:
        foreignTablesCount:
          description: Optional. PostgreSql foreign tables.
          format: int32
          type: integer
        postgresqlExtensions:
          type: array
          items:
            $ref: '#/components/schemas/PostgreSqlExtension'
          description: Optional. PostgreSql extensions.
    ReportSummaryChartDataDataPoint:
      description: Describes a single data point in the Chart.
      type: object
      id: ReportSummaryChartDataDataPoint
      properties:
        label:
          description: The X-axis label for this data point.
          type: string
        value:
          format: double
          type: number
          description: The Y-axis value for this data point.
    MigrationInsight:
      id: MigrationInsight
      properties:
        fit:
          description: >-
            Output only. Description of how well the asset this insight is
            associated with fits the proposed migration.
          readOnly: true
          $ref: '#/components/schemas/FitDescriptor'
        computeEngineTarget:
          readOnly: true
          $ref: '#/components/schemas/ComputeEngineMigrationTarget'
          description: Output only. A Google Compute Engine target.
      type: object
      description: An insight about potential migrations for an asset.
    RunningServiceList:
      description: List of running guest OS services.
      type: object
      id: RunningServiceList
      properties:
        entries:
          description: Running service entries.
          items:
            $ref: '#/components/schemas/RunningService'
          type: array
    DatabaseObjects:
      id: DatabaseObjects
      properties:
        category:
          enum:
            - CATEGORY_UNSPECIFIED
            - TABLE
            - INDEX
            - CONSTRAINTS
            - VIEWS
            - SOURCE_CODE
            - OTHER
          type: string
          description: Optional. The category of the objects.
          enumDescriptions:
            - Unspecified type.
            - Table.
            - Index.
            - Constraints.
            - Views.
            - Source code, e.g. procedures.
            - Uncategorized objects.
        count:
          format: int64
          type: string
          description: Optional. The number of objects.
      type: object
      description: Details of a group of database objects.
    ListAssetsExportJobsResponse:
      description: Response message for listing assets export jobs.
      id: ListAssetsExportJobsResponse
      properties:
        assetsExportJobs:
          items:
            $ref: '#/components/schemas/AssetsExportJob'
          readOnly: true
          type: array
          description: Output only. The list of assets export jobs.
        nextPageToken:
          description: >-
            Output only. A token identifying a page of results the server should
            return.
          readOnly: true
          type: string
      type: object
    GenericInsight:
      description: A generic insight about an asset.
      id: GenericInsight
      properties:
        defaultMessage:
          description: >-
            Output only. In case message_code is not yet known by the client
            default_message will be the message to be used instead.
          readOnly: true
          type: string
        messageId:
          format: int64
          readOnly: true
          type: string
          description: >-
            Output only. Represents a globally unique message id for this
            insight, can be used for localization purposes, in case message_code
            is not yet known by the client use default_message instead.
        additionalInformation:
          readOnly: true
          type: array
          items:
            type: string
          description: >-
            Output only. Additional information about the insight, each entry
            can be a logical entry and must make sense if it is displayed with
            line breaks between each entry. Text can contain md style links.
      type: object
    SqlServerSchemaDetails:
      id: SqlServerSchemaDetails
      properties:
        clrObjectCount:
          format: int32
          type: integer
          description: Optional. SqlServer number of CLR objects.
      type: object
      description: Specific details for a SqlServer database.
    DatabaseDeploymentDetailsAggregatedStats:
      description: Aggregated stats for the database deployment.
      type: object
      id: DatabaseDeploymentDetailsAggregatedStats
      properties:
        databaseCount:
          description: Output only. The number of databases in the deployment.
          format: int32
          readOnly: true
          type: integer
    ExecutionReport:
      id: ExecutionReport
      properties:
        framesReported:
          type: integer
          format: int32
          description: Total number of asset frames reported for the import job.
        executionErrors:
          description: >-
            Validation errors encountered during the execution of the import
            job.
          $ref: '#/components/schemas/ValidationReport'
        totalRowsCount:
          readOnly: true
          type: integer
          format: int32
          description: Output only. Total number of rows in the import job.
      type: object
      description: A resource that reports result of the import job execution.
    SoleTenancyPreferences:
      description: Preferences concerning Sole Tenancy nodes and VMs.
      type: object
      id: SoleTenancyPreferences
      properties:
        nodeTypes:
          items:
            $ref: '#/components/schemas/SoleTenantNodeType'
          type: array
          description: >-
            A list of sole tenant node types. An empty list means that all
            possible node types will be considered.
        hostMaintenancePolicy:
          enum:
            - HOST_MAINTENANCE_POLICY_UNSPECIFIED
            - HOST_MAINTENANCE_POLICY_DEFAULT
            - HOST_MAINTENANCE_POLICY_RESTART_IN_PLACE
            - HOST_MAINTENANCE_POLICY_MIGRATE_WITHIN_NODE_GROUP
          type: string
          description: Sole Tenancy nodes maintenance policy.
          enumDescriptions:
            - Unspecified host maintenance policy.
            - Default host maintenance policy.
            - Restart in place host maintenance policy.
            - Migrate within node group host maintenance policy.
        commitmentPlan:
          enum:
            - COMMITMENT_PLAN_UNSPECIFIED
            - ON_DEMAND
            - COMMITMENT_1_YEAR
            - COMMITMENT_3_YEAR
          type: string
          description: >-
            Commitment plan to consider when calculating costs for virtual
            machine insights and recommendations. If you are unsure which value
            to set, a 3 year commitment plan is often a good value to start
            with.
          enumDescriptions:
            - Unspecified commitment plan.
            - No commitment plan (on-demand usage).
            - 1 year commitment.
            - 3 years commitment.
        cpuOvercommitRatio:
          description: >-
            CPU overcommit ratio. Acceptable values are between 1.0 and 2.0
            inclusive.
          type: number
          format: double
    ImportDataFile:
      type: object
      id: ImportDataFile
      properties:
        displayName:
          type: string
          description: >-
            Optional. User-friendly display name. Maximum length is 63
            characters.
        state:
          description: Output only. The state of the import data file.
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
          enumDescriptions:
            - Default value.
            - The data file is being created.
            - The data file completed initialization.
          type: string
        createTime:
          description: Output only. The timestamp when the file was created.
          format: google-datetime
          readOnly: true
          type: string
        uploadFileInfo:
          description: Information about a file that is uploaded to a storage service.
          $ref: '#/components/schemas/UploadFileInfo'
        name:
          readOnly: true
          type: string
          description: Output only. The name of the file.
        format:
          type: string
          enum:
            - IMPORT_JOB_FORMAT_UNSPECIFIED
            - IMPORT_JOB_FORMAT_RVTOOLS_XLSX
            - IMPORT_JOB_FORMAT_RVTOOLS_CSV
            - IMPORT_JOB_FORMAT_EXPORTED_AWS_CSV
            - IMPORT_JOB_FORMAT_EXPORTED_AZURE_CSV
            - IMPORT_JOB_FORMAT_STRATOZONE_CSV
            - IMPORT_JOB_FORMAT_DATABASE_ZIP
          enumDescriptions:
            - Default value.
            - RVTools format (XLSX).
            - RVTools format (CSV).
            - CSV format exported from AWS using the AWS collection script.
            - CSV format exported from Azure using the Azure collection script.
            - >-
              CSV format created manually and following the StratoZone format.
              For more information, see Manually create and upload data tables.
            - ZIP file with nested CSV files generated by a database collector.
          description: Required. The payload format.
      description: A resource that represents a payload file in an import job.
    MemoryUsageSample:
      type: object
      id: MemoryUsageSample
      properties:
        utilizedPercentage:
          format: float
          type: number
          description: >-
            Percentage of system memory utilized. Must be in the interval [0,
            100].
      description: Memory usage sample.
    Settings:
      description: Describes the Migration Center settings related to the project.
      id: Settings
      properties:
        preferenceSet:
          description: The preference set used by default for a project.
          type: string
        disableCloudLogging:
          type: boolean
          description: >-
            Disable Cloud Logging for the Migration Center API. Users are billed
            for the logs.
        name:
          readOnly: true
          type: string
          description: Output only. The name of the resource.
      type: object
    ErrorFrame:
      description: >-
        Message representing a frame which failed to be processed due to an
        error.
      id: ErrorFrame
      properties:
        violations:
          description: Output only. All the violations that were detected for the frame.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/FrameViolationEntry'
        originalFrame:
          readOnly: true
          $ref: '#/components/schemas/AssetFrame'
          description: Output only. The frame that was originally reported.
        name:
          readOnly: true
          type: string
          description: Output only. The identifier of the ErrorFrame.
        ingestionTime:
          description: Output only. Frame ingestion time.
          readOnly: true
          type: string
          format: google-datetime
      type: object
    ListGroupsResponse:
      type: object
      id: ListGroupsResponse
      properties:
        unreachable:
          description: Locations that could not be reached.
          type: array
          items:
            type: string
        groups:
          items:
            $ref: '#/components/schemas/Group'
          type: array
          description: The list of Group
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
      description: A response for listing groups.
    SignedUriDestination:
      type: object
      id: SignedUriDestination
      properties:
        fileFormat:
          enum:
            - FILE_FORMAT_UNSPECIFIED
            - CSV
            - XLSX
          type: string
          description: Required. The file format to export.
          enumDescriptions:
            - Unspecified file format will be treated as CSV.
            - CSV file format.
            - XLSX file format which used in Excel.
      description: Signed URI destination configuration.
    CsvOutputFile:
      description: Contains a single output file of type CSV.
      id: CsvOutputFile
      properties:
        columnsCount:
          description: Output only. Number of columns in the file.
          readOnly: true
          type: integer
          format: int32
        rowCount:
          format: int32
          readOnly: true
          type: integer
          description: Output only. Number of rows in the file.
        signedUri:
          description: Output only. Signed URI destination.
          readOnly: true
          $ref: '#/components/schemas/SignedUri'
      type: object
    DatabaseInstanceNetwork:
      description: Network details of a database instance.
      id: DatabaseInstanceNetwork
      properties:
        primaryMacAddress:
          type: string
          description: Optional. The instance's primary MAC address.
        hostNames:
          type: array
          items:
            type: string
          description: Optional. The instance's host names.
        ipAddresses:
          description: Optional. The instance's IP addresses.
          items:
            type: string
          type: array
      type: object
    VirtualMachinePreferences:
      type: object
      id: VirtualMachinePreferences
      properties:
        soleTenancyPreferences:
          $ref: '#/components/schemas/SoleTenancyPreferences'
          description: Preferences concerning Sole Tenant nodes and virtual machines.
        computeEnginePreferences:
          $ref: '#/components/schemas/ComputeEnginePreferences'
          description: >-
            Compute Engine preferences concern insights and recommendations for
            Compute Engine target.
        targetProduct:
          enum:
            - COMPUTE_MIGRATION_TARGET_PRODUCT_UNSPECIFIED
            - COMPUTE_MIGRATION_TARGET_PRODUCT_COMPUTE_ENGINE
            - COMPUTE_MIGRATION_TARGET_PRODUCT_VMWARE_ENGINE
            - COMPUTE_MIGRATION_TARGET_PRODUCT_SOLE_TENANCY
          type: string
          description: >-
            Target product for assets using this preference set. Specify either
            target product or business goal, but not both.
          enumDescriptions:
            - Unspecified (default value).
            - Prefer to migrate to Google Cloud Compute Engine.
            - Prefer to migrate to Google Cloud VMware Engine.6278
            - Prefer to migrate to Google Cloud Sole Tenant Nodes.
        commitmentPlan:
          enum:
            - COMMITMENT_PLAN_UNSPECIFIED
            - COMMITMENT_PLAN_NONE
            - COMMITMENT_PLAN_ONE_YEAR
            - COMMITMENT_PLAN_THREE_YEARS
          type: string
          description: >-
            Commitment plan to consider when calculating costs for virtual
            machine insights and recommendations. If you are unsure which value
            to set, a 3 year commitment plan is often a good value to start
            with.
          enumDescriptions:
            - Unspecified commitment plan.
            - No commitment plan.
            - 1 year commitment.
            - 3 years commitment.
        vmwareEnginePreferences:
          description: >-
            Preferences concerning insights and recommendations for Google Cloud
            VMware Engine.
          $ref: '#/components/schemas/VmwareEnginePreferences'
        regionPreferences:
          description: >-
            Region preferences for assets using this preference set. If you are
            unsure which value to set, the migration service API region is often
            a good value to start with.
          $ref: '#/components/schemas/RegionPreferences'
        sizingOptimizationStrategy:
          enum:
            - SIZING_OPTIMIZATION_STRATEGY_UNSPECIFIED
            - SIZING_OPTIMIZATION_STRATEGY_SAME_AS_SOURCE
            - SIZING_OPTIMIZATION_STRATEGY_MODERATE
            - SIZING_OPTIMIZATION_STRATEGY_AGGRESSIVE
          type: string
          description: >-
            Sizing optimization strategy specifies the preferred strategy used
            when extrapolating usage data to calculate insights and
            recommendations for a virtual machine. If you are unsure which value
            to set, a moderate sizing optimization strategy is often a good
            value to start with.
          enumDescriptions:
            - Unspecified (default value).
            - >-
              No optimization applied. Virtual machine sizing matches as closely
              as possible the machine shape on the source site, not considering
              any actual performance data.
            - >-
              Virtual machine sizing will match the reported usage and shape,
              with some slack. This a good value to start with.
            - >-
              Virtual machine sizing will match the reported usage, with little
              slack. Using this option can help reduce costs.
      description: >-
        VirtualMachinePreferences enables you to create sets of assumptions, for
        example, a geographical location and pricing track, for your migrated
        virtual machines. The set of preferences influence recommendations for
        migrating virtual machine assets.
    ImportRowError:
      description: A resource that reports the import job errors at row level.
      id: ImportRowError
      properties:
        vmUuid:
          description: The VM UUID.
          type: string
        xlsxError:
          description: Error details for an XLSX file.
          $ref: '#/components/schemas/ImportRowErrorXlsxErrorDetails'
        rowNumber:
          description: The row number where the error was detected.
          type: integer
          deprecated: true
          format: int32
        assetTitle:
          readOnly: true
          type: string
          description: Output only. The asset title.
        archiveError:
          $ref: '#/components/schemas/ImportRowErrorArchiveErrorDetails'
          description: Error details for an archive file.
        errors:
          items:
            $ref: '#/components/schemas/ImportError'
          type: array
          description: The list of errors detected in the row.
        vmName:
          description: The name of the VM in the row.
          type: string
        csvError:
          description: Error details for a CSV file.
          $ref: '#/components/schemas/ImportRowErrorCsvErrorDetails'
      type: object
    DiskEntry:
      type: object
      id: DiskEntry
      properties:
        capacityBytes:
          type: string
          format: int64
          description: Disk capacity.
        diskLabel:
          type: string
          description: Disk label.
        interfaceType:
          description: Disks interface type.
          enumDescriptions:
            - Interface type unknown or unspecified.
            - IDE interface type.
            - SATA interface type.
            - SAS interface type.
            - SCSI interface type.
            - NVME interface type.
            - FC interface type.
            - iSCSI interface type.
          enum:
            - INTERFACE_TYPE_UNSPECIFIED
            - IDE
            - SATA
            - SAS
            - SCSI
            - NVME
            - FC
            - ISCSI
          type: string
        partitions:
          $ref: '#/components/schemas/DiskPartitionList'
          description: Partition layout.
        vmware:
          description: VMware disk details.
          $ref: '#/components/schemas/VmwareDiskConfig'
        diskLabelType:
          description: Disk label type (e.g. BIOS/GPT)
          type: string
        hwAddress:
          description: Disk hardware address (e.g. 0:1 for SCSI).
          type: string
        freeBytes:
          format: int64
          type: string
          description: Disk free space.
      description: Single disk entry.
    Aggregation:
      id: Aggregation
      properties:
        frequency:
          $ref: '#/components/schemas/AggregationFrequency'
          description: Creates a frequency distribution of all field values.
        field:
          description: The name of the field on which to aggregate.
          type: string
        histogram:
          $ref: '#/components/schemas/AggregationHistogram'
          description: Creates a bucketed histogram of field values.
        count:
          description: Count the number of matching objects.
          $ref: '#/components/schemas/AggregationCount'
        sum:
          description: Sum over a numeric field.
          $ref: '#/components/schemas/AggregationSum'
      type: object
      description: >-
        Message describing an aggregation. The message includes the aggregation
        type, parameters, and the field on which to perform the aggregation.
    ImportRowErrorArchiveErrorDetails:
      description: Error details for an archive file.
      id: ImportRowErrorArchiveErrorDetails
      properties:
        csvError:
          $ref: '#/components/schemas/ImportRowErrorCsvErrorDetails'
          description: Error details for a CSV file.
        filePath:
          readOnly: true
          type: string
          description: >-
            Output only. The file path inside the archive where the error was
            detected.
      type: object
    ReportConfigGroupPreferenceSetAssignment:
      type: object
      id: ReportConfigGroupPreferenceSetAssignment
      properties:
        group:
          type: string
          description: Required. Name of the group.
        preferenceSet:
          description: Required. Name of the Preference Set.
          type: string
      description: Represents a combination of a group with a preference set.
    ReportConfig:
      description: >-
        The groups and associated preference sets on which we can generate
        reports.
      type: object
      id: ReportConfig
      properties:
        displayName:
          type: string
          description: User-friendly display name. Maximum length is 63 characters.
        updateTime:
          description: Output only. The timestamp when the resource was last updated.
          format: google-datetime
          readOnly: true
          type: string
        description:
          type: string
          description: Free-text description.
        createTime:
          format: google-datetime
          readOnly: true
          type: string
          description: Output only. The timestamp when the resource was created.
        groupPreferencesetAssignments:
          description: Required. Collection of combinations of groups and preference sets.
          type: array
          items:
            $ref: '#/components/schemas/ReportConfigGroupPreferenceSetAssignment'
        name:
          description: Output only. Name of resource.
          readOnly: true
          type: string
    MySqlProperty:
      id: MySqlProperty
      properties:
        numericValue:
          description: Required. The property numeric value.
          format: int64
          type: string
        property:
          description: Required. The property name.
          type: string
        enabled:
          description: Required. The property is enabled.
          type: boolean
      type: object
      description: MySql property.
    GuestInstalledApplicationList:
      description: Guest installed application list.
      id: GuestInstalledApplicationList
      properties:
        entries:
          items:
            $ref: '#/components/schemas/GuestInstalledApplication'
          type: array
          description: Application entries.
      type: object
    DatabaseDeploymentTopology:
      type: object
      id: DatabaseDeploymentTopology
      properties:
        diskAllocatedBytes:
          type: string
          format: int64
          description: Optional. Disk allocated in bytes.
        diskUsedBytes:
          format: int64
          type: string
          description: Optional. Disk used in bytes.
        instances:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseInstance'
          description: Optional. List of database instances.
        physicalCoreLimit:
          format: int32
          type: integer
          description: Optional. Number of total physical cores limited by db deployment.
        memoryBytes:
          description: Optional. Total memory in bytes.
          type: string
          format: int64
        coreLimit:
          description: Optional. Number of total logical cores limited by db deployment.
          type: integer
          format: int32
        memoryLimitBytes:
          description: Optional. Total memory in bytes limited by db deployment.
          type: string
          format: int64
        coreCount:
          description: Optional. Number of total logical cores.
          format: int32
          type: integer
        physicalCoreCount:
          format: int32
          type: integer
          description: Optional. Number of total physical cores.
      description: Details of database deployment's topology.
    DiskEntryList:
      description: VM disks.
      id: DiskEntryList
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DiskEntry'
          description: Disk entries.
      type: object
    ListOperationsResponse:
      type: object
      id: ListOperationsResponse
      properties:
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
          description: >-
            A list of operations that matches the specified filter in the
            request.
        nextPageToken:
          type: string
          description: The standard List next-page token.
      description: The response message for Operations.ListOperations.
