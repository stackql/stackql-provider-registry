        sortOrder:
          description: >-
            Output only. The decimal sort order of this PolicyQuery. The value
            is relative to all other policies with the same setting type for the
            customer. (There are no duplicates within this set).
          readOnly: true
          format: double
          type: number
        query:
          description: >-
            Immutable. The CEL query that defines which entities the Policy
            applies to (ex. a User entity). For details about CEL see
            https://opensource.google.com/projects/cel. The OrgUnits the Policy
            applies to are represented by a clause like so:
            entity.org_units.exists(org_unit, org_unit.org_unit_id ==
            orgUnitId('{orgUnitId}')) The Group the Policy applies to are
            represented by a clause like so: entity.groups.exists(group,
            group.group_id == groupId('{groupId}')) The Licenses the Policy
            applies to are represented by a clause like so:
            entity.licenses.exists(license, license in
            ['/product/{productId}/sku/{skuId}']) **Note:** The licenses clause
            is not supported in mutate endpoints. The above clauses can be
            present in any combination, and used in conjunction with the &&, ||
            and ! operators. The org_unit and group fields below are helper
            fields that contain the corresponding value(s) as the query to make
            the query easier to use.
          type: string
        group:
          description: >-
            Immutable. The group that the query applies to. This field is only
            set if there is a single value for group that satisfies all clauses
            of the query. If no group applies, this will be the empty string.
          type: string
      id: PolicyQuery
      type: object
