        cryptoKeys:
          description: The list of CryptoKeys.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudKmsV1CryptoKey'
        nextPageToken:
          description: >-
            The page token returned from the previous response if the next page
            is desired.
          type: string
      id: GoogleCloudKmsInventoryV1ListCryptoKeysResponse
      type: object
