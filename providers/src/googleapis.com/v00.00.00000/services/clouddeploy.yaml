        state:
          type: string
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - DISABLED
            - IN_PROGRESS
            - SUCCEEDED
            - FAILED
            - ABORTED
            - SKIPPED
            - IGNORED
          description: Output only. The current state of the Job.
          enumDescriptions:
            - The Job has an unspecified state.
