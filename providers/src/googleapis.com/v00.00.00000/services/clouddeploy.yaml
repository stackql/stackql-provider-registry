            - TYPE_RESTRICTION_VIOLATED
            - TYPE_RESOURCE_DELETED
            - TYPE_ROLLOUT_UPDATE
            - TYPE_DEPLOY_POLICY_EVALUATION
            - TYPE_RENDER_STATUES_CHANGE
          enumDeprecated:
            - false
            - false
            - false
            - false
            - false
            - false
            - false
            - false
            - true
          enumDescriptions:
            - Type is unspecified.
