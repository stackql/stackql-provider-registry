        backupPlanLocation:
          description: >-
            Optional. The location where the BackupPlan will be created. This
            field is required for multi-region BackupVaults and is optional for
            regional BackupVaults. It is useful when creating a Backup Vault in
            a multi-region, allowing the BackupPlan to reside in a specific
