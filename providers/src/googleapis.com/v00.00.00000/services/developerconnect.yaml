openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Developer Connect API
  description: Connect third-party source code management to Google
  version: v1
  x-discovery-doc-revision: '20260723'
  x-generated-date: '2026-07-31'
externalDocs:
  url: http://cloud.google.com/developer-connect/docs/overview
servers:
  - url: https://developerconnect.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    AppHubWorkload:
      properties:
        environment:
          readOnly: true
          description: Output only. The environment of the App Hub Workload.
          type: string
        criticality:
          description: Output only. The criticality of the App Hub Workload.
          type: string
          readOnly: true
        workload:
          readOnly: true
          type: string
          description: >-
            Required. Output only. Immutable. The name of the App Hub Workload.
            Format:
            `projects/{project}/locations/{location}/applications/{application}/workloads/{workload}`.
      id: AppHubWorkload
      type: object
      description: AppHubWorkload represents the App Hub Workload.
    AccountConnector:
      properties:
        annotations:
          type: object
          description: Optional. Allows users to store small amounts of arbitrary data.
          additionalProperties:
            type: string
        oauthStartUri:
          readOnly: true
          type: string
          description: Output only. Start OAuth flow by clicking on this URL.
        customOauthConfig:
          $ref: '#/components/schemas/CustomOAuthConfig'
          description: Custom OAuth config.
        uid:
          description: >-
            Output only. A system-assigned unique identifier for the Account
            Connector.
          type: string
          readOnly: true
        providerOauthConfig:
          $ref: '#/components/schemas/ProviderOAuthConfig'
          description: Optional. Provider OAuth config.
        name:
          type: string
          description: >-
            Identifier. The resource name of the accountConnector, in the format
            `projects/{project}/locations/{location}/accountConnectors/{account_connector_id}`.
        createTime:
          readOnly: true
          description: Output only. The timestamp when the accountConnector was created.
          format: google-datetime
          type: string
        labels:
          description: Optional. Labels as key value pairs
          additionalProperties:
            type: string
          type: object
        etag:
          description: >-
            Optional. This checksum is computed by the server based on the value
            of other fields, and may be sent on update and delete requests to
            ensure the client has an up-to-date value before proceeding.
          type: string
        proxyConfig:
          $ref: '#/components/schemas/ProxyConfig'
          description: Optional. Configuration for the http and git proxy features.
        updateTime:
          description: Output only. The timestamp when the accountConnector was updated.
          format: google-datetime
          type: string
          readOnly: true
      description: >-
        AccountConnector encapsulates what a platform administrator needs to
        configure for users to connect to the service providers, which includes,
        among other fields, the OAuth client ID, client secret, and
        authorization and token endpoints.
      id: AccountConnector
      type: object
    FetchUserRepositoriesResponse:
      description: Response message for FetchUserRepositories.
      id: FetchUserRepositoriesResponse
      type: object
      properties:
        userRepos:
          type: array
          description: >-
            The repositories that the user can access with this account
            connector.
          items:
            $ref: '#/components/schemas/UserRepository'
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
    FetchGitRefsResponse:
      description: Response for fetching git refs.
      id: FetchGitRefsResponse
      type: object
      properties:
        refNames:
          type: array
          description: Name of the refs fetched.
          items:
            type: string
        nextPageToken:
          type: string
          description: A token identifying a page of results the server should return.
    ArtifactConfig:
      properties:
        uri:
          type: string
          description: >-
            Required. Immutable. The URI of the artifact that is deployed. e.g.
            `us-docker.pkg.dev/my-project/my-repo/image`. The URI does not
            include the tag / digest because it captures a lineage of artifacts.
        googleArtifactAnalysis:
          $ref: '#/components/schemas/GoogleArtifactAnalysis'
          description: >-
            Optional. Set if the artifact metadata is stored in Artifact
            analysis.
        googleArtifactRegistry:
          $ref: '#/components/schemas/GoogleArtifactRegistry'
          description: Optional. Set if the artifact is stored in Artifact registry.
      id: ArtifactConfig
      type: object
      description: The artifact config of the artifact that is deployed.
    ProcessGitLabWebhookRequest:
      properties:
        body:
          $ref: '#/components/schemas/HttpBody'
          description: Required. HTTP request body.
      id: ProcessGitLabWebhookRequest
      type: object
      description: RPC request object accepted by the ProcessGitLabWebhook RPC method.
    ProcessBitbucketCloudWebhookRequest:
      properties:
        body:
          $ref: '#/components/schemas/HttpBody'
          description: Required. HTTP request body.
      description: >-
        RPC request object accepted by the ProcessBitbucketCloudWebhook RPC
        method.
      id: ProcessBitbucketCloudWebhookRequest
      type: object
    ExchangeError:
      properties:
        code:
          description: https://datatracker.ietf.org/doc/html/rfc6749#section-5.2 - error
          type: string
        description:
          type: string
          description: >-
            https://datatracker.ietf.org/doc/html/rfc6749#section-5.2 -
            error_description
      description: Message for representing an error from exchanging OAuth tokens.
      id: ExchangeError
      type: object
    FetchAccessTokenRequest:
      id: FetchAccessTokenRequest
      type: object
      description: Message for fetching an OAuth access token.
      properties: {}
    GenericHTTPEndpointConfig:
      properties:
        hostUri:
          type: string
          description: Required. Immutable. The service provider's https endpoint.
        basicAuthentication:
          description: Optional. Basic authentication with username and password.
          $ref: '#/components/schemas/BasicAuthentication'
        bearerTokenAuthentication:
          $ref: '#/components/schemas/BearerTokenAuthentication'
          description: Optional. Bearer token authentication with a token.
        serviceDirectoryConfig:
          $ref: '#/components/schemas/ServiceDirectoryConfig'
          description: >-
            Optional. Configuration for using Service Directory to privately
            connect to a HTTP service provider. This should only be set if the
            Http service provider is hosted on-premises and not reachable by
            public internet. If this field is left empty, calls to the HTTP
            service provider will be made over the public internet.
        sslCaCertificate:
          type: string
          description: >-
            Optional. The SSL certificate to use for requests to the HTTP
            service provider.
      description: Defines the configuration for connections to an HTTP service provider.
      id: GenericHTTPEndpointConfig
      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      type: object
      properties:
        code:
          type: integer
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
    Connection:
      id: Connection
      type: object
      description: Message describing Connection object
      properties:
        disabled:
          description: >-
            Optional. If disabled is set to true, functionality is disabled for
            this connection. Repository based API methods and webhooks
            processing for repositories in this connection will be disabled.
          type: boolean
        gitProxyConfig:
          description: >-
            Optional. Configuration for the git proxy feature. Enabling the git
            proxy allows clients to perform git operations on the repositories
            linked in the connection. [Learn
            more](https://docs.cloud.google.com/developer-connect/docs/configure-git-proxy).
          $ref: '#/components/schemas/GitProxyConfig'
        githubEnterpriseConfig:
          description: Configuration for connections to an instance of GitHub Enterprise.
          $ref: '#/components/schemas/GitHubEnterpriseConfig'
        httpConfig:
          $ref: '#/components/schemas/GenericHTTPEndpointConfig'
          description: Optional. Configuration for connections to an HTTP service provider.
        githubConfig:
          $ref: '#/components/schemas/GitHubConfig'
          description: Configuration for connections to github.com.
        secureSourceManagerInstanceConfig:
          $ref: '#/components/schemas/SecureSourceManagerInstanceConfig'
          description: >-
            Configuration for connections to an instance of Secure Source
            Manager.
        cryptoKeyConfig:
          description: >-
            Optional. The crypto key configuration. This field is used by the
            Customer-Managed Encryption Keys (CMEK) feature.
          $ref: '#/components/schemas/CryptoKeyConfig'
        deleteTime:
          readOnly: true
          description: Output only. [Output only] Delete timestamp
          format: google-datetime
          type: string
        gitlabEnterpriseConfig:
          description: Configuration for connections to an instance of GitLab Enterprise.
          $ref: '#/components/schemas/GitLabEnterpriseConfig'
        uid:
          type: string
          description: Output only. A system-assigned unique identifier for the Connection.
          readOnly: true
        bitbucketCloudConfig:
          description: Configuration for connections to an instance of Bitbucket Clouds.
          $ref: '#/components/schemas/BitbucketCloudConfig'
        name:
          description: >-
            Identifier. The resource name of the connection, in the format
            `projects/{project}/locations/{location}/connections/{connection_id}`.
          type: string
        createTime:
          type: string
          description: Output only. [Output only] Create timestamp
          format: google-datetime
          readOnly: true
        labels:
          type: object
          description: Optional. Labels as key value pairs
          additionalProperties:
            type: string
        reconciling:
          type: boolean
          description: >-
            Output only. Set to true when the connection is being set up or
            updated in the background.
          readOnly: true
        installationState:
          $ref: '#/components/schemas/InstallationState'
          readOnly: true
          description: Output only. Installation state of the Connection.
        etag:
          type: string
          description: >-
            Optional. This checksum is computed by the server based on the value
            of other fields, and may be sent on update and delete requests to
            ensure the client has an up-to-date value before proceeding.
        gitlabConfig:
          $ref: '#/components/schemas/GitLabConfig'
          description: Configuration for connections to gitlab.com.
        bitbucketDataCenterConfig:
          $ref: '#/components/schemas/BitbucketDataCenterConfig'
          description: >-
            Configuration for connections to an instance of Bitbucket Data
            Center.
        updateTime:
          readOnly: true
          type: string
          description: Output only. [Output only] Update timestamp
          format: google-datetime
        annotations:
          type: object
          description: Optional. Allows clients to store small amounts of arbitrary data.
          additionalProperties:
            type: string
    ListAccountConnectorsResponse:
      id: ListAccountConnectorsResponse
      type: object
      description: Message for response to listing AccountConnectors
      properties:
        unreachable:
          type: array
          description: Locations that could not be reached.
          items:
            type: string
        accountConnectors:
          type: array
          description: The list of AccountConnectors
          items:
            $ref: '#/components/schemas/AccountConnector'
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      type: object
      properties: {}
    OAuthCredential:
      id: OAuthCredential
      type: object
      description: >-
        Represents an OAuth token of the account that authorized the Connection,
        and associated metadata.
      properties:
        username:
          type: string
          description: Output only. The username associated with this token.
          readOnly: true
        oauthTokenSecretVersion:
          type: string
          description: >-
            Required. A SecretManager resource containing the OAuth token that
            authorizes the connection. Format: `projects/*/secrets/*/versions/*`
            or `projects/*/locations/*/secrets/*/versions/*` (if regional
            secrets are supported in that location).
    GitLabEnterpriseConfig:
      id: GitLabEnterpriseConfig
      type: object
      description: Configuration for connections to an instance of GitLab Enterprise.
      properties:
        sslCaCertificate:
          description: >-
            Optional. SSL Certificate Authority certificate to use for requests
            to GitLab Enterprise instance.
          type: string
        serverVersion:
          readOnly: true
          description: >-
            Output only. Version of the GitLab Enterprise server running on the
            `host_uri`.
          type: string
        authorizerCredential:
          description: >-
            Required. A GitLab personal access token with the minimum `api`
            scope access and a minimum role of `maintainer`. The GitLab Projects
            visible to this Personal Access Token will control which Projects
            Developer Connect has access to.
          $ref: '#/components/schemas/UserCredential'
        serviceDirectoryConfig:
          description: >-
            Optional. Configuration for using Service Directory to privately
            connect to a GitLab Enterprise instance. This should only be set if
            the GitLab Enterprise server is hosted on-premises and not reachable
            by public internet. If this field is left empty, calls to the GitLab
            Enterprise server will be made over the public internet.
          $ref: '#/components/schemas/ServiceDirectoryConfig'
        hostUri:
          description: >-
            Required. The URI of the GitLab Enterprise host this connection is
            for.
          type: string
        webhookSecretSecretVersion:
          type: string
          description: >-
            Required. Immutable. SecretManager resource containing the webhook
            secret of a GitLab project, formatted as
            `projects/*/secrets/*/versions/*` or
            `projects/*/locations/*/secrets/*/versions/*` (if regional secrets
            are supported in that location). This is used to validate webhooks.
        readAuthorizerCredential:
          $ref: '#/components/schemas/UserCredential'
          description: >-
            Required. A GitLab personal access token with the minimum `read_api`
            scope access and a minimum role of `reporter`. The GitLab Projects
            visible to this Personal Access Token will control which Projects
            Developer Connect has access to.
    FetchGitHubInstallationsResponse:
      description: Response of fetching github installations.
      id: FetchGitHubInstallationsResponse
      type: object
      properties:
        installations:
          type: array
          description: >-
            List of installations available to the OAuth user (for github.com)
            or all the installations (for GitHub enterprise).
          items:
            $ref: '#/components/schemas/Installation'
    GitHubEnterpriseConfig:
      properties:
        installationUri:
          description: >-
            Output only. The URI to navigate to in order to manage the
            installation associated with this GitHubEnterpriseConfig.
          type: string
          readOnly: true
        appSlug:
          type: string
          description: Output only. The URL-friendly name of the GitHub App.
          readOnly: true
        serverVersion:
          type: string
          description: Output only. GitHub Enterprise version installed at the host_uri.
          readOnly: true
        sslCaCertificate:
          description: Optional. SSL certificate to use for requests to GitHub Enterprise.
          type: string
        appId:
          type: string
          description: Optional. ID of the GitHub App created from the manifest.
          format: int64
        privateKeySecretVersion:
          type: string
          description: >-
            Optional. SecretManager resource containing the private key of the
            GitHub App, formatted as `projects/*/secrets/*/versions/*` or
            `projects/*/locations/*/secrets/*/versions/*` (if regional secrets
            are supported in that location).
        organization:
          description: >-
            Optional. Immutable. GitHub Enterprise organization in which the
            GitHub App is created.
          type: string
        hostUri:
          description: >-
            Required. The URI of the GitHub Enterprise host this connection is
            for.
          type: string
        webhookSecretSecretVersion:
          type: string
          description: >-
            Optional. SecretManager resource containing the webhook secret of
            the GitHub App, formatted as `projects/*/secrets/*/versions/*` or
            `projects/*/locations/*/secrets/*/versions/*` (if regional secrets
            are supported in that location).
        appInstallationId:
          description: Optional. ID of the installation of the GitHub App.
          format: int64
          type: string
        serviceDirectoryConfig:
          $ref: '#/components/schemas/ServiceDirectoryConfig'
          description: >-
            Optional. Configuration for using Service Directory to privately
            connect to a GitHub Enterprise server. This should only be set if
            the GitHub Enterprise server is hosted on-premises and not reachable
            by public internet. If this field is left empty, calls to the GitHub
            Enterprise server will be made over the public internet.
      description: Configuration for connections to an instance of GitHub Enterprise.
      id: GitHubEnterpriseConfig
      type: object
    ArtifactDeployment:
      properties:
        id:
          readOnly: true
          type: string
          description: Output only. Unique identifier of `ArtifactDeployment`.
        artifactReference:
          readOnly: true
          type: string
          description: Output only. The artifact that is deployed.
        undeployTime:
          type: string
          description: >-
            Output only. The time at which the deployment was undeployed, all
            artifacts are considered undeployed once this time is set.
          format: google-datetime
          readOnly: true
        containerStatusSummary:
          description: >-
            Output only. The summary of container status of the artifact
            deployment. Format as `ContainerStatusState-Reason : restartCount`
            e.g. "Waiting-ImagePullBackOff : 3"
          type: string
          readOnly: true
        artifactAlias:
          readOnly: true
          type: string
          description: >-
            Output only. The artifact alias in the deployment spec, with
            Tag/SHA. e.g. us-docker.pkg.dev/my-project/my-repo/image:1.0.0
        sourceCommitUris:
          readOnly: true
          type: array
          description: >-
            Output only. The source commits at which this artifact was built.
            Extracted from provenance.
          items:
            type: string
        deployTime:
          type: string
          description: Output only. The time at which the deployment was deployed.
          format: google-datetime
          readOnly: true
        sourceCodeUris:
          type: array
          description: >-
            Output only. The URIs of the source code, if available. For Cloud
            Run source deploy for example:
            `gs://my-bucket/my-folder/1234567890.abcde-fdbe.zip#1234567890`
          items:
            type: string
          readOnly: true
      id: ArtifactDeployment
      type: object
      description: >-
        The ArtifactDeployment resource represents the deployment of the
        artifact within the InsightsConfig resource.
    CustomOAuthConfig:
      properties:
        clientSecret:
          description: >-
            Required. Input only. The client secret of the OAuth application. It
            will be provided as plain text, but encrypted and stored in
            developer connect. As INPUT_ONLY field, it will not be included in
            the output.
          type: string
        authUri:
          type: string
          description: Required. Immutable. The OAuth2 authorization server URL.
        hostUri:
          type: string
          description: Required. The host URI of the OAuth application.
        scmProvider:
          type: string
          enum:
            - SCM_PROVIDER_UNKNOWN
            - GITHUB_ENTERPRISE
            - GITLAB_ENTERPRISE
            - BITBUCKET_DATA_CENTER
          description: Required. The type of the SCM provider.
          enumDescriptions:
            - The SCM is not specified or BYO Account Connector is not an SCM.
            - BYO Account Connector is an instance of GitHub Enterprise.
            - BYO Account Connector is an instance of GitLab Enterprise.
            - BYO Account Connector is an instance of Bitbucket Data Center.
        serviceDirectoryConfig:
          description: >-
            Optional. Configuration for using Service Directory to connect to a
            private service.
          $ref: '#/components/schemas/ServiceDirectoryConfig'
        scopes:
          type: array
          description: Required. The scopes to be requested during OAuth.
          items:
            type: string
        clientId:
          type: string
          description: Required. The client ID of the OAuth application.
        sslCaCertificate:
          type: string
          description: Optional. SSL certificate to use for requests to a private service.
        pkceDisabled:
          type: boolean
          description: >-
            Optional. Disable PKCE for this OAuth config. PKCE is enabled by
            default.
        serverVersion:
          description: Output only. SCM server version installed at the host URI.
          type: string
          readOnly: true
        tokenUri:
          type: string
          description: Required. Immutable. The OAuth2 token request URL.
      id: CustomOAuthConfig
      type: object
      description: Message for a customized OAuth config.
    GoogleArtifactAnalysis:
      properties:
        projectId:
          description: >-
            Required. The project id of the project where the provenance is
            stored.
          type: string
      id: GoogleArtifactAnalysis
      type: object
      description: Google Artifact Analysis configurations.
    ListGitRepositoryLinksResponse:
      properties:
        gitRepositoryLinks:
          description: The list of GitRepositoryLinks
          items:
            $ref: '#/components/schemas/GitRepositoryLink'
          type: array
        unreachable:
          type: array
          description: Locations that could not be reached.
          items:
            type: string
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
      description: Message for response to listing GitRepositoryLinks
      id: ListGitRepositoryLinksResponse
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      type: object
      properties:
        createTime:
          readOnly: true
          type: string
          description: Output only. The time the operation was created.
          format: google-datetime
        endTime:
          readOnly: true
          description: Output only. The time the operation finished running.
          format: google-datetime
          type: string
        target:
          type: string
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of 1, corresponding to `Code.CANCELLED`.
          type: boolean
          readOnly: true
        statusMessage:
          readOnly: true
          type: string
          description: Output only. Human-readable status of the operation, if any.
        verb:
          description: Output only. Name of the verb executed by the operation.
          type: string
          readOnly: true
        apiVersion:
          readOnly: true
          description: Output only. API version used to start the operation.
          type: string
    ListOperationsResponse:
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          type: array
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
        unreachable:
          type: array
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
      id: ListOperationsResponse
      type: object
      description: The response message for Operations.ListOperations.
    ProviderOAuthConfig:
      description: ProviderOAuthConfig is the OAuth config for a provider.
      id: ProviderOAuthConfig
      type: object
      properties:
        systemProviderId:
          type: string
          enum:
            - SYSTEM_PROVIDER_UNSPECIFIED
            - GITHUB
            - GITLAB
            - GOOGLE
            - SENTRY
            - ROVO
            - NEW_RELIC
            - DATASTAX
            - DYNATRACE
          description: Optional. Immutable. Developer Connect provided OAuth.
          enumDescriptions:
            - No system provider specified.
            - >-
              GitHub provider. Scopes can be found at
              https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/scopes-for-oauth-apps#available-scopes
            - >-
              GitLab provider. Scopes can be found at
              https://docs.gitlab.com/user/profile/personal_access_tokens/#personal-access-token-scopes
            - >-
              Google provider. Recommended scopes:
              "https://www.googleapis.com/auth/drive.readonly",
              "https://www.googleapis.com/auth/documents.readonly"
            - >-
              Sentry provider. Scopes can be found at
              https://docs.sentry.io/api/permissions/
            - Rovo provider. Must select the "rovo" scope.
            - New Relic provider. No scopes are allowed.
            - Datastax provider. No scopes are allowed.
            - Dynatrace provider.
        scopes:
          type: array
          description: >-
            Required. User selected scopes to apply to the Oauth config In the
            event of changing scopes, user records under AccountConnector will
            be deleted and users will re-auth again.
          items:
            type: string
    Installation:
      properties:
        name:
          description: Name of the GitHub user or organization that owns this installation.
          type: string
        id:
          description: ID of the installation in GitHub.
          format: int64
          type: string
        type:
          description: Either "user" or "organization".
          type: string
      id: Installation
      type: object
      description: Represents an installation of the GitHub App.
    UserRepository:
      properties:
        gitProxyUri:
          description: >-
            Output only. The Git proxy URL for this repo. For example:
            https://us-west1-git.developerconnect.dev/a/my-proj/my-ac/myuser/myrepo.git.
            Populated only when `proxy_config.enabled` is set to `true` in the
            Account Connector. This URL is used by other Google services that
            integrate with Developer Connect.
          type: string
          readOnly: true
        displayName:
          type: string
          description: Output only. The user friendly repo name (e.g., myuser/myrepo)
          readOnly: true
        cloneUri:
          readOnly: true
          description: >-
            Output only. The git clone URL of the repo. For example:
            https://github.com/myuser/myrepo.git
          type: string
      id: UserRepository
      type: object
      description: >-
        A user repository that can be linked to the account connector. Consists
        of the repo name and the git proxy URL to forward requests to this repo.
    FetchReadTokenResponse:
      properties:
        gitUsername:
          type: string
          description: >-
            The git_username to specify when making a git clone with the token.
            For example, for GitHub GitRepositoryLinks, this would be
            "x-access-token"
        expirationTime:
          description: Expiration timestamp. Can be empty if unknown or non-expiring.
          format: google-datetime
          type: string
        token:
          description: The token content.
          type: string
      description: Message for responding to get read token.
      id: FetchReadTokenResponse
      type: object
    FetchReadTokenRequest:
      id: FetchReadTokenRequest
      type: object
      description: Message for fetching SCM read token.
      properties: {}
    InstallationState:
      properties:
        actionUri:
          readOnly: true
          description: >-
            Output only. Link to follow for next action. Empty string if the
            installation is already complete.
          type: string
        stage:
          type: string
          readOnly: true
          enum:
            - STAGE_UNSPECIFIED
            - PENDING_CREATE_APP
            - PENDING_USER_OAUTH
            - PENDING_INSTALL_APP
            - COMPLETE
          description: Output only. Current step of the installation process.
          enumDescriptions:
            - No stage specified.
            - >-
              Only for GitHub Enterprise. An App creation has been requested.
              The user needs to confirm the creation in their GitHub enterprise
              host.
            - User needs to authorize the GitHub (or Enterprise) App via OAuth.
            - >-
              User needs to follow the link to install the GitHub (or
              Enterprise) App.
            - Installation process has been completed.
        message:
          type: string
          description: >-
            Output only. Message of what the user should do next to continue the
            installation. Empty string if the installation is already complete.
          readOnly: true
      description: >-
        Describes stage and necessary actions to be taken by the user to
        complete the installation. Used for GitHub and GitHub Enterprise based
        connections.
      id: InstallationState
      type: object
    GKEWorkload:
      description: GKEWorkload represents the Google Kubernetes Engine runtime.
      id: GKEWorkload
      type: object
      properties:
        cluster:
          type: string
          description: >-
            Required. Immutable. The name of the GKE cluster. Format:
            `projects/{project}/locations/{location}/clusters/{cluster}`.
        deployment:
          description: >-
            Output only. The name of the GKE deployment. Format:
            `projects/{project}/locations/{location}/clusters/{cluster}/namespaces/{namespace}/deployments/{deployment}`.
          type: string
          readOnly: true
    BearerTokenAuthentication:
      properties:
        tokenSecretVersion:
          description: Optional. The token SecretManager secret version to authenticate as.
          type: string
      description: Bearer token authentication with a token.
      id: BearerTokenAuthentication
      type: object
    FetchAccessTokenResponse:
      id: FetchAccessTokenResponse
      type: object
      description: Message for responding to getting an OAuth access token.
      properties:
        scopes:
          type: array
          description: The scopes of the access token.
          items:
            type: string
        expirationTime:
          type: string
          description: Expiration timestamp. Can be empty if unknown or non-expiring.
          format: google-datetime
        token:
          description: The token content.
          type: string
        exchangeError:
          description: >-
            The error resulted from exchanging OAuth tokens from the service
            provider.
          $ref: '#/components/schemas/ExchangeError'
    Empty:
      properties: {}
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      type: object
    ListUsersResponse:
      properties:
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
        users:
          description: The list of Users
          items:
            $ref: '#/components/schemas/User'
          type: array
        unreachable:
          type: array
          description: Locations that could not be reached.
          items:
            type: string
      description: Message for response to listing Users
      id: ListUsersResponse
      type: object
    GoogleArtifactRegistry:
      properties:
        artifactRegistryPackage:
          description: Required. Immutable. The name of the artifact registry package.
          type: string
        projectId:
          description: Required. The host project of Artifact Registry.
          type: string
      description: Google Artifact Registry configurations.
      id: GoogleArtifactRegistry
      type: object
    FetchReadWriteTokenResponse:
      id: FetchReadWriteTokenResponse
      type: object
      description: Message for responding to get read/write token.
      properties:
        token:
          type: string
          description: The token content.
        gitUsername:
          description: >-
            The git_username to specify when making a git clone with the token.
            For example, for GitHub GitRepositoryLinks, this would be
            "x-access-token"
          type: string
        expirationTime:
          description: Expiration timestamp. Can be empty if unknown or non-expiring.
          format: google-datetime
          type: string
    HttpBody:
      id: HttpBody
      type: object
      description: >-
        Message that represents an arbitrary HTTP body. It should only be used
        for payload formats that can't be represented as JSON, such as raw
        binary or an HTML page. This message can be used both in streaming and
        non-streaming API methods in the request as well as the response. It can
        be used as a top-level request field, which is convenient if one wants
        to extract parameters from either the URL or HTTP template into the
        request fields and also want access to the raw HTTP body. Example:
        message GetResourceRequest { // A unique request id. string request_id =
        1; // The raw HTTP body is bound to this field. google.api.HttpBody
        http_body = 2; } service ResourceService { rpc
        GetResource(GetResourceRequest) returns (google.api.HttpBody); rpc
        UpdateResource(google.api.HttpBody) returns (google.protobuf.Empty); }
        Example with streaming methods: service CaldavService { rpc
        GetCalendar(stream google.api.HttpBody) returns (stream
        google.api.HttpBody); rpc UpdateCalendar(stream google.api.HttpBody)
        returns (stream google.api.HttpBody); } Use of this type only changes
        how the request and response bodies are handled, all other features will
        continue to work unchanged.
      properties:
        contentType:
          type: string
          description: >-
            The HTTP Content-Type header value specifying the content type of
            the body.
        data:
          description: The HTTP request/response body as raw binary.
          format: byte
          type: string
        extensions:
          type: array
          description: >-
            Application specific response metadata. Must be set in the first
            response for streaming APIs.
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
    InsightsConfig:
      properties:
        state:
          type: string
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - COMPLETE
            - ERROR
          description: Optional. Output only. The state of the InsightsConfig.
          enumDescriptions:
            - No state specified.
            - >-
              The InsightsConfig is pending application discovery/runtime
              discovery.
            - The initial discovery process is complete.
            - The InsightsConfig is in an error state.
        annotations:
          description: >-
            Optional. User specified annotations. See
            https://google.aip.dev/148#annotations for more details such as
            format and size limitations.
          additionalProperties:
            type: string
          type: object
        errors:
          description: >-
            Output only. Any errors that occurred while setting up the
            InsightsConfig. Each error will be in the format: `field_name:
            error_message`, e.g. GetAppHubApplication: Permission denied while
            getting App Hub application. Please grant permissions to the P4SA.
          items:
            $ref: '#/components/schemas/Status'
          type: array
          readOnly: true
        artifactConfigs:
          type: array
          description: >-
            Optional. The artifact configurations of the artifacts that are
            deployed.
          items:
            $ref: '#/components/schemas/ArtifactConfig'
        updateTime:
          readOnly: true
          description: Output only. Update timestamp.
          format: google-datetime
          type: string
        runtimeConfigs:
          readOnly: true
          type: array
          description: >-
            Output only. The runtime configurations where the application is
            deployed.
          items:
            $ref: '#/components/schemas/RuntimeConfig'
        appHubApplication:
          description: >-
            Optional. The name of the App Hub Application. Format:
            projects/{project}/locations/{location}/applications/{application}
          type: string
        projects:
          description: Optional. The projects to track with the InsightsConfig.
          $ref: '#/components/schemas/Projects'
        labels:
          description: Optional. Set of labels associated with an InsightsConfig.
          additionalProperties:
            type: string
          type: object
        reconciling:
          description: >-
            Output only. Reconciling
            (https://google.aip.dev/128#reconciliation). Set to true if the
            current state of InsightsConfig does not match the user's intended
            state, and the service is actively updating the resource to
            reconcile them. This can happen due to user-triggered updates or
            system actions like failover or maintenance.
          type: boolean
          readOnly: true
        name:
          description: >-
            Identifier. The name of the InsightsConfig. Format:
            projects/{project}/locations/{location}/insightsConfigs/{insightsConfig}
          type: string
        createTime:
          type: string
          description: Output only. Create timestamp.
          format: google-datetime
          readOnly: true
      id: InsightsConfig
      type: object
      description: >-
        The InsightsConfig resource is the core configuration object to capture
        events from your Software Development Lifecycle. It acts as the central
        hub for managing how Developer Connect understands your application, its
        runtime environments, and the artifacts deployed within them.
    BitbucketCloudConfig:
      properties:
        workspace:
          description: >-
            Required. The Bitbucket Cloud Workspace ID to be connected to Google
            Cloud Platform.
          type: string
        webhookSecretSecretVersion:
          description: >-
            Required. Immutable. SecretManager resource containing the webhook
            secret used to verify webhook events, formatted as
            `projects/*/secrets/*/versions/*` or
            `projects/*/locations/*/secrets/*/versions/*` (if regional secrets
            are supported in that location). This is used to validate and create
            webhooks.
          type: string
        readAuthorizerCredential:
          description: >-
            Required. An access token with the minimum `repository` access. It
            can either be a workspace, project or repository access token. It's
            recommended to use a system account to generate the credentials.
          $ref: '#/components/schemas/UserCredential'
        authorizerCredential:
          description: >-
            Required. An access token with the minimum `repository`,
            `pullrequest` and `webhook` scope access. It can either be a
            workspace, project or repository access token. This is needed to
            create webhooks. It's recommended to use a system account to
            generate these credentials.
          $ref: '#/components/schemas/UserCredential'
      id: BitbucketCloudConfig
      type: object
      description: Configuration for connections to an instance of Bitbucket Cloud.
    GitProxyConfig:
      properties:
        httpProxyBaseUri:
          type: string
          description: >-
            Output only. The base URI for the HTTP proxy endpoint. Has the
            format
            `https://{generatedID}-c-h-{shortRegion}.developerconnect.dev`
            Populated only when enabled is set to true. This endpoint is used by
            other Google services that integrate with Developer Connect.
          readOnly: true
        enabled:
          description: >-
            Optional. Setting this to true allows the git proxy to be used for
            performing git operations on the repositories linked in the
            connection.
          type: boolean
      description: The git proxy configuration.
      id: GitProxyConfig
      type: object
    User:
      description: >-
        User represents a user connected to the service providers through a
        AccountConnector.
      id: User
      type: object
      properties:
        name:
          description: >-
            Identifier. Resource name of the user, in the format
            `projects/*/locations/*/accountConnectors/*/users/*`.
          type: string
        createTime:
          readOnly: true
          type: string
          description: Output only. The timestamp when the user was created.
          format: google-datetime
        displayName:
          description: >-
            Output only. Developer Connect automatically converts user identity
            to some human readable description, e.g., email address.
          type: string
          readOnly: true
        lastTokenRequestTime:
          readOnly: true
          description: Output only. The timestamp when the token was last requested.
          format: google-datetime
          type: string
    DeploymentEvent:
      properties:
        name:
          description: >-
            Identifier. The name of the DeploymentEvent. This name is provided
            by Developer Connect insights. Format:
            projects/{project}/locations/{location}/insightsConfigs/{insights_config}/deploymentEvents/{uuid}
          type: string
        createTime:
          readOnly: true
          description: Output only. The create time of the DeploymentEvent.
          format: google-datetime
          type: string
        updateTime:
          readOnly: true
          type: string
          description: Output only. The update time of the DeploymentEvent.
          format: google-datetime
        deployTime:
          readOnly: true
          type: string
          description: >-
            Output only. The time at which the DeploymentEvent was deployed.
            This would be the min of all ArtifactDeployment deploy_times.
          format: google-datetime
        runtimeConfig:
          description: >-
            Output only. The runtime configurations where the DeploymentEvent
            happened.
          $ref: '#/components/schemas/RuntimeConfig'
          readOnly: true
        runtimeDeploymentUri:
          readOnly: true
          type: string
          description: >-
            Output only. The runtime assigned URI of the DeploymentEvent. For
            GKE, this is the fully qualified replica set uri. e.g.
            container.googleapis.com/projects/{project}/locations/{location}/clusters/{cluster}/k8s/namespaces/{namespace}/apps/replicasets/{replica-set-id}
            For Cloud Run, this is the revision name.
        undeployTime:
          readOnly: true
          type: string
          description: >-
            Output only. The time at which the DeploymentEvent was undeployed,
            all artifacts are considered undeployed once this time is set. This
            would be the max of all ArtifactDeployment undeploy_times. If any
            ArtifactDeployment is still active (i.e. does not have an
            undeploy_time), this field will be empty.
          format: google-datetime
        artifactDeployments:
          readOnly: true
          description: >-
            Output only. The artifact deployments of the DeploymentEvent. Each
            artifact deployment contains the artifact uri and the runtime
            configuration uri. For GKE, this would be all the containers images
            that are deployed in the pod.
          items:
            $ref: '#/components/schemas/ArtifactDeployment'
          type: array
        state:
          type: string
          enum:
            - STATE_UNSPECIFIED
            - STATE_ACTIVE
            - STATE_INACTIVE
          description: Output only. The state of the DeploymentEvent.
          enumDescriptions:
            - No state specified.
            - The deployment is active in the runtime.
            - The deployment is not in the runtime.
          readOnly: true
      id: DeploymentEvent
      type: object
      description: >-
        The DeploymentEvent resource represents the deployment of the artifact
        within the InsightsConfig resource.
    ProxyConfig:
      id: ProxyConfig
      type: object
      description: The proxy configuration.
      properties:
        enabled:
          type: boolean
          description: >-
            Optional. Setting this to true allows the git and http proxies to
            perform actions on behalf of the user configured under the account
            connector.
        httpProxyBaseUri:
          type: string
          description: >-
            Output only. The base URI for the HTTP proxy endpoint. Has the
            format
            `https://{generatedID}-a-h-{shortRegion}.developerconnect.dev`
            Populated only when `enabled` is set to `true`. This endpoint is
            used by other Google services that integrate with Developer Connect.
          readOnly: true
    GoogleCloudRun:
      properties:
        serviceUri:
          type: string
          description: >-
            Required. Immutable. The name of the Cloud Run service. Format:
            `projects/{project}/locations/{location}/services/{service}`.
      description: GoogleCloudRun represents the Cloud Run runtime.
      id: GoogleCloudRun
      type: object
    SecureSourceManagerInstanceConfig:
      description: Configuration for connections to Secure Source Manager instance
      id: SecureSourceManagerInstanceConfig
      type: object
      properties:
        instance:
          type: string
          description: >-
            Required. Immutable. Secure Source Manager instance resource,
            formatted as `projects/*/locations/*/instances/*`
    GitRepositoryLink:
      properties:
        annotations:
          type: object
          description: Optional. Allows clients to store small amounts of arbitrary data.
          additionalProperties:
            type: string
        cloneUri:
          type: string
          description: Required. Git Clone URI.
        gitProxyUri:
          readOnly: true
          description: >-
            Output only. URI to access the linked repository through the Git
            Proxy. This field is only populated if the git proxy is enabled for
            the connection.
          type: string
        deleteTime:
          description: Output only. [Output only] Delete timestamp
          format: google-datetime
          type: string
          readOnly: true
        webhookId:
          type: string
          description: Output only. External ID of the webhook created for the repository.
          readOnly: true
        uid:
          readOnly: true
          description: >-
            Output only. A system-assigned unique identifier for the
            GitRepositoryLink.
          type: string
        name:
          description: >-
            Identifier. Resource name of the repository, in the format
            `projects/*/locations/*/connections/*/gitRepositoryLinks/*`.
          type: string
        createTime:
          readOnly: true
          type: string
          description: Output only. [Output only] Create timestamp
          format: google-datetime
        labels:
          description: Optional. Labels as key value pairs
          additionalProperties:
            type: string
          type: object
        reconciling:
          readOnly: true
          type: boolean
          description: >-
            Output only. Set to true when the connection is being set up or
            updated in the background.
        etag:
          description: >-
            Optional. This checksum is computed by the server based on the value
            of other fields, and may be sent on update and delete requests to
            ensure the client has an up-to-date value before proceeding.
          type: string
        updateTime:
          readOnly: true
          type: string
          description: Output only. [Output only] Update timestamp
          format: google-datetime
      id: GitRepositoryLink
      type: object
      description: Message describing the GitRepositoryLink object
    AppHubService:
      description: AppHubService represents the App Hub Service.
      id: AppHubService
      type: object
      properties:
        environment:
          readOnly: true
          type: string
          description: Output only. The environment of the App Hub Service.
        apphubService:
          type: string
          description: >-
            Required. Output only. Immutable. The name of the App Hub Service.
            Format:
            `projects/{project}/locations/{location}/applications/{application}/services/{service}`.
          readOnly: true
        criticality:
          readOnly: true
          description: Output only. The criticality of the App Hub Service.
          type: string
    ServiceDirectoryConfig:
      description: >-
        ServiceDirectoryConfig represents Service Directory configuration for a
        connection.
      id: ServiceDirectoryConfig
      type: object
      properties:
        service:
          type: string
          description: >-
            Required. The Service Directory service name. Format:
            projects/{project}/locations/{location}/namespaces/{namespace}/services/{service}.
    FinishOAuthResponse:
      description: Message for responding to finishing an OAuth flow.
      id: FinishOAuthResponse
      type: object
      properties:
        exchangeError:
          $ref: '#/components/schemas/ExchangeError'
          description: >-
            The error resulted from exchanging OAuth tokens from the service
            provider.
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      type: object
      properties:
        locationId:
          type: string
          description: 'The canonical id for this location. For example: `"us-east1"`.'
        displayName:
          type: string
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
        metadata:
          type: object
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
        labels:
          type: object
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          additionalProperties:
            type: string
    CryptoKeyConfig:
      id: CryptoKeyConfig
      type: object
      description: >-
        The crypto key configuration. This field is used by the Customer-managed
        encryption keys (CMEK) feature.
      properties:
        keyReference:
          type: string
          description: >-
            Required. The name of the key which is used to encrypt/decrypt
            customer data. For key in Cloud KMS, the key should be in the format
            of `projects/*/locations/*/keyRings/*/cryptoKeys/*`.
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      type: object
      properties:
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        response:
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          type: object
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
    StartOAuthResponse:
      properties:
        ticket:
          type: string
          description: >-
            The ticket to be used for post processing the callback from the
            service provider.
        clientId:
          type: string
          description: The client ID to the OAuth App of the service provider.
        systemProviderId:
          description: The ID of the system provider.
          enumDescriptions:
            - No system provider specified.
            - >-
              GitHub provider. Scopes can be found at
              https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/scopes-for-oauth-apps#available-scopes
            - >-
              GitLab provider. Scopes can be found at
              https://docs.gitlab.com/user/profile/personal_access_tokens/#personal-access-token-scopes
            - >-
              Google provider. Recommended scopes:
              "https://www.googleapis.com/auth/drive.readonly",
              "https://www.googleapis.com/auth/documents.readonly"
            - >-
              Sentry provider. Scopes can be found at
              https://docs.sentry.io/api/permissions/
            - Rovo provider. Must select the "rovo" scope.
            - New Relic provider. No scopes are allowed.
            - Datastax provider. No scopes are allowed.
            - Dynatrace provider.
          type: string
          enum:
            - SYSTEM_PROVIDER_UNSPECIFIED
            - GITHUB
            - GITLAB
            - GOOGLE
            - SENTRY
            - ROVO
            - NEW_RELIC
            - DATASTAX
            - DYNATRACE
        codeChallenge:
          description: >-
            Please refer to
            https://datatracker.ietf.org/doc/html/rfc7636#section-4.1
          type: string
        authUri:
          type: string
          description: >-
            The authorization server URL to the OAuth flow of the service
            provider.
        codeChallengeMethod:
          type: string
          description: >-
            Please refer to
            https://datatracker.ietf.org/doc/html/rfc7636#section-4.2
        scopes:
          type: array
          description: The list of scopes requested by the application.
          items:
            type: string
      description: Message for responding to starting an OAuth flow.
      id: StartOAuthResponse
      type: object
    UserCredential:
      id: UserCredential
      type: object
      description: >-
        Represents a personal access token that authorized the Connection, and
        associated metadata.
      properties:
        userTokenSecretVersion:
          description: >-
            Required. A SecretManager resource containing the user token that
            authorizes the Developer Connect connection. Format:
            `projects/*/secrets/*/versions/*` or
            `projects/*/locations/*/secrets/*/versions/*` (if regional secrets
            are supported in that location).
          type: string
        username:
          type: string
          description: Output only. The username associated with this token.
          readOnly: true
    ListInsightsConfigsResponse:
      properties:
        nextPageToken:
          type: string
          description: A token identifying a page of results the server should return.
        insightsConfigs:
          description: The list of InsightsConfigs.
          items:
            $ref: '#/components/schemas/InsightsConfig'
          type: array
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      description: Request for response to listing InsightsConfigs.
      id: ListInsightsConfigsResponse
      type: object
    BitbucketDataCenterConfig:
      properties:
        authorizerCredential:
          $ref: '#/components/schemas/UserCredential'
          description: >-
            Required. An http access token with the minimum `Repository admin`
            scope access. This is needed to create webhooks. It's recommended to
            use a system account to generate these credentials.
        serviceDirectoryConfig:
          $ref: '#/components/schemas/ServiceDirectoryConfig'
          description: >-
            Optional. Configuration for using Service Directory to privately
            connect to a Bitbucket Data Center instance. This should only be set
            if the Bitbucket Data Center is hosted on-premises and not reachable
            by public internet. If this field is left empty, calls to the
