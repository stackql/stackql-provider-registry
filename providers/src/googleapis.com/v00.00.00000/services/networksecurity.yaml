            - OUT_OF_SYNC
            - DELETE_FAILED
          enumDescriptions:
            - Not set.
            - >-
              The association is ready and in sync with the linked endpoint
              group.
            - The association is being created.
            - The association is being deleted.
            - >-
              The association is disabled due to a breaking change in another
              resource.
            - >-
              The association is out of sync with the linked endpoint group. In
              most cases, this is a result of a transient issue within the
              system (e.g. an inaccessible location) and the system is expected
              to recover automatically. Check the `locations_details` field for
              more details.
            - >-
              An attempt to delete the association has failed. This is a
              terminal state and the association is not expected to be usable as
              some of its resources have been deleted. The only permitted
              operation is to retry deleting the association.
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Optional. Labels are key/value pairs that help to organize and
            filter resources.
        mirroringEndpointGroup:
          description: >-
            Immutable. The endpoint group that this association is connected to,
            for example:
            `projects/123456789/locations/global/mirroringEndpointGroups/my-eg`.
            See https://google.aip.dev/124.
          type: string
        updateTime:
          format: google-datetime
          description: >-
            Output only. The timestamp when the resource was most recently
            updated. See https://google.aip.dev/148#timestamps.
          readOnly: true
          type: string
        networkCookie:
          readOnly: true
          type: integer
          description: >-
            Output only. Identifier used by the data-path. See the NSI GENEVE
            format for more details:
            https://docs.cloud.google.com/network-security-integration/docs/understand-geneve#network_id
          format: uint32
        name:
          type: string
          description: >-
            Immutable. Identifier. The resource name of this endpoint group
            association, for example:
            `projects/123456789/locations/global/mirroringEndpointGroupAssociations/my-eg-association`.
            See https://google.aip.dev/122 for more details.
      id: MirroringEndpointGroupAssociation
      description: >-
        An endpoint group association represents a link between a network and an
        endpoint group in the organization. Creating an association creates the
        networking infrastructure linking the network to the endpoint group, but
        does not enable mirroring by itself. To enable mirroring, the user must
        also create a network firewall policy containing mirroring rules and
        associate it with the network.
    SACRealmPairingKey:
      type: object
      properties:
        key:
          description: Output only. Key value.
          readOnly: true
          type: string
        expireTime:
          readOnly: true
          type: string
          format: google-datetime
          description: >-
            Output only. Timestamp in UTC of when this resource is considered
            expired. It expires 7 days after creation.
      id: SACRealmPairingKey
      description: >-
        Key to be shared with SSE service provider to establish global
        handshake.
    AuthzPolicyTarget:
      type: object
      properties:
        loadBalancingScheme:
          description: >-
            Optional. All gateways and forwarding rules referenced by this
            policy and extensions must share the same load balancing scheme.
            Required only when targeting forwarding rules. If targeting Secure
            Web Proxy, this field must be `INTERNAL_MANAGED` or not specified.
            Must not be specified when targeting Agent Gateway. Supported
            values: `INTERNAL_MANAGED` and `EXTERNAL_MANAGED`. For more
            information, refer to [Backend services
            overview](https://cloud.google.com/load-balancing/docs/backend-service).
          enum:
            - LOAD_BALANCING_SCHEME_UNSPECIFIED
            - INTERNAL_MANAGED
            - EXTERNAL_MANAGED
            - INTERNAL_SELF_MANAGED
          type: string
          enumDescriptions:
            - Default value. Do not use.
            - >-
              Signifies that this is used for Regional internal or Cross-region
              internal Application Load Balancing.
            - >-
              Signifies that this is used for Global external or Regional
              external Application Load Balancing.
            - >-
              Signifies that this is used for Cloud Service Mesh. Meant for use
              by CSM GKE controller only.
        resources:
          type: array
          items:
            type: string
          description: >-
            Required. A list of references to the Forwarding Rules, Secure Web
            Proxy Gateways, or Agent Gateways on which this policy will be
            applied.
      description: Specifies the set of targets to which this policy should be applied to.
      id: AuthzPolicyTarget
    ClientTlsPolicy:
      description: >-
        ClientTlsPolicy is a resource that specifies how a client should
        authenticate connections to backends of a service. This resource itself
        does not affect configuration unless it is attached to a backend service
        resource.
      id: ClientTlsPolicy
      type: object
      properties:
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
          description: Optional. Set of label tags associated with the resource.
        serverValidationCa:
          description: >-
            Optional. Defines the mechanism to obtain the Certificate Authority
            certificate to validate the server certificate. If empty, client
            does not validate the server certificate.
          type: array
          items:
            $ref: '#/components/schemas/ValidationCA'
        updateTime:
          format: google-datetime
          description: Output only. The timestamp when the resource was updated.
          readOnly: true
          type: string
        name:
          description: >-
            Required. Name of the ClientTlsPolicy resource. It matches the
            pattern
            `projects/{project}/locations/{location}/clientTlsPolicies/{client_tls_policy}`
          type: string
        sni:
          description: >-
            Optional. Server Name Indication string to present to the server
            during TLS handshake. E.g: "secure.example.com".
          type: string
        clientCertificate:
          $ref: '#/components/schemas/GoogleCloudNetworksecurityV1CertificateProvider'
          description: >-
            Optional. Defines a mechanism to provision client identity (public
            and private keys) for peer to peer authentication. The presence of
            this dictates mTLS.
        description:
          type: string
          description: Optional. Free-text description of the resource.
    GoogleIamV1Binding:
      id: GoogleIamV1Binding
      description: Associates `members`, or principals, with a `role`.
      type: object
      properties:
        role:
          description: >-
            Role that is assigned to the list of `members`, or principals. For
            example, `roles/viewer`, `roles/editor`, or `roles/owner`. For an
            overview of the IAM roles and permissions, see the [IAM
            documentation](https://cloud.google.com/iam/docs/roles-overview).
            For a list of the available pre-defined roles, see
            [here](https://cloud.google.com/iam/docs/understanding-roles).
          type: string
        members:
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. `members` can have the following values: * `allUsers`: A
            special identifier that represents anyone who is on the internet;
            with or without a Google account. * `allAuthenticatedUsers`: A
            special identifier that represents anyone who is authenticated with
            a Google account or a service account. Does not include identities
            that come from external identity providers (IdPs) through identity
            federation. * `user:{emailid}`: An email address that represents a
            specific Google account. For example, `alice@example.com` . *
            `serviceAccount:{emailid}`: An email address that represents a
            Google service account. For example,
            `my-other-app@appspot.gserviceaccount.com`. *
            `serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]`:
            An identifier for a [Kubernetes service
            account](https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example,
            `my-project.svc.id.goog[my-namespace/my-kubernetes-sa]`. *
            `group:{emailid}`: An email address that represents a Google group.
            For example, `admins@example.com`. * `domain:{domain}`: The G Suite
            domain (primary) that represents all the users of that domain. For
            example, `google.com` or `example.com`. *
            `principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workforce identity pool. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}`:
            All workforce identities in a group. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All workforce identities with a specific attribute value. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*`:
            All identities in a workforce identity pool. *
            `principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workload identity pool. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}`:
            A workload identity pool group. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All identities in a workload identity pool with a certain attribute.
            *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*`:
            All identities in a workload identity pool. *
            `deleted:user:{emailid}?uid={uniqueid}`: An email address (plus
            unique identifier) representing a user that has been recently
            deleted. For example, `alice@example.com?uid=123456789012345678901`.
            If the user is recovered, this value reverts to `user:{emailid}` and
            the recovered user retains the role in the binding. *
            `deleted:serviceAccount:{emailid}?uid={uniqueid}`: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            `my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901`.
            If the service account is undeleted, this value reverts to
            `serviceAccount:{emailid}` and the undeleted service account retains
            the role in the binding. * `deleted:group:{emailid}?uid={uniqueid}`:
            An email address (plus unique identifier) representing a Google
            group that has been recently deleted. For example,
            `admins@example.com?uid=123456789012345678901`. If the group is
            recovered, this value reverts to `group:{emailid}` and the recovered
            group retains the role in the binding. *
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            Deleted single identity in a workforce identity pool. For example,
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value`.
          type: array
          items:
            type: string
        condition:
          $ref: '#/components/schemas/Expr'
          description: >-
            The condition that is associated with this binding. If the condition
            evaluates to `true`, then this binding applies to the current
            request. If the condition evaluates to `false`, then this binding
            does not apply to the current request. However, a different role
            binding might grant the same role to one or more of the principals
            in this binding. To learn which resources support conditions in
            their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
    GoogleIamV1SetIamPolicyRequest:
      type: object
      properties:
        policy:
          description: >-
            REQUIRED: The complete policy to be applied to the `resource`. The
            size of the policy is limited to a few 10s of KB. An empty policy is
            a valid policy but certain Google Cloud services (such as Projects)
            might reject them.
          $ref: '#/components/schemas/GoogleIamV1Policy'
        updateMask:
          description: >-
            OPTIONAL: A FieldMask specifying which fields of the policy to
            modify. Only the fields in the mask will be modified. If no mask is
            provided, the following default mask is used: `paths: "bindings,
            etag"`
          format: google-fieldmask
          type: string
      description: Request message for `SetIamPolicy` method.
      id: GoogleIamV1SetIamPolicyRequest
    GoogleCloudNetworksecurityV1GrpcEndpoint:
      description: Specification of the GRPC Endpoint.
      id: GoogleCloudNetworksecurityV1GrpcEndpoint
      type: object
      properties:
        targetUri:
          type: string
          description: >-
            Required. The target URI of the gRPC endpoint. Only UDS path is
            supported, and should start with "unix:".
    SecurityProfileGroup:
      type: object
      properties:
        createTime:
          readOnly: true
          type: string
          format: google-datetime
          description: Output only. Resource creation timestamp.
        threatPreventionProfile:
          type: string
          description: >-
            Optional. Reference to a SecurityProfile with the ThreatPrevention
            configuration.
        urlFilteringProfile:
          description: >-
            Optional. Reference to a SecurityProfile with the UrlFiltering
            configuration.
          type: string
        updateTime:
          format: google-datetime
          description: Output only. Last resource update timestamp.
          readOnly: true
          type: string
        customInterceptProfile:
          type: string
          description: >-
            Optional. Reference to a SecurityProfile with the CustomIntercept
            configuration.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Optional. Labels as key value pairs.
        description:
          type: string
          description: >-
            Optional. An optional description of the profile group. Max length
            2048 characters.
        customMirroringProfile:
          description: >-
            Optional. Reference to a SecurityProfile with the CustomMirroring
            configuration.
          type: string
        name:
          type: string
          description: >-
            Immutable. Identifier. Name of the SecurityProfileGroup resource. It
            matches pattern
            `projects|organizations/*/locations/{location}/securityProfileGroups/{security_profile_group}`.
        etag:
          description: >-
            Output only. This checksum is computed by the server based on the
            value of other fields, and may be sent on update and delete requests
            to ensure the client has an up-to-date value before proceeding.
          readOnly: true
          type: string
        dataPathId:
          description: >-
            Output only. Identifier used by the data-path. Unique within
            `{container, location}`.
          format: uint64
          readOnly: true
          type: string
      id: SecurityProfileGroup
      description: >-
        SecurityProfileGroup is a resource that defines the behavior for various
        ProfileTypes.
    HttpHeaderMatch:
      type: object
      properties:
        regexMatch:
          type: string
          description: >-
            Required. The value of the header must match the regular expression
            specified in regexMatch. For regular expression grammar, please see:
            en.cppreference.com/w/cpp/regex/ecmascript For matching against a
            port specified in the HTTP request, use a headerMatch with
            headerName set to Host and a regular expression that satisfies the
            RFC2616 Host header's port specifier.
        headerName:
          type: string
          description: >-
            Required. The name of the HTTP header to match. For matching against
            the HTTP request's authority, use a headerMatch with the header name
            ":authority". For matching a request's method, use the headerName
            ":method".
      description: Specification of HTTP header match attributes.
      id: HttpHeaderMatch
    ListGatewaySecurityPoliciesResponse:
      id: ListGatewaySecurityPoliciesResponse
      description: Response returned by the ListGatewaySecurityPolicies method.
      type: object
      properties:
        nextPageToken:
          type: string
          description: >-
            If there might be more results than those appearing in this
            response, then 'next_page_token' is included. To get the next set of
            results, call this method again using the value of 'next_page_token'
            as 'page_token'.
        gatewaySecurityPolicies:
          description: List of GatewaySecurityPolicies resources.
          type: array
          items:
            $ref: '#/components/schemas/GatewaySecurityPolicy'
        unreachable:
          description: Locations that could not be reached.
          type: array
          items:
            type: string
    TlsInspectionPolicy:
      id: TlsInspectionPolicy
      description: >-
        The TlsInspectionPolicy resource contains references to CA pools in
        Certificate Authority Service and associated metadata.
      type: object
      properties:
        minTlsVersion:
          enum:
            - TLS_VERSION_UNSPECIFIED
            - TLS_1_0
            - TLS_1_1
            - TLS_1_2
            - TLS_1_3
          description: >-
            Optional. Minimum TLS version that the firewall should use when
            negotiating connections with both clients and servers. If this is
            not set, then the default value is to allow the broadest set of
            clients and servers (TLS 1.0 or higher). Setting this to more
            restrictive values may improve security, but may also prevent the
            firewall from connecting to some clients or servers. Note that
            Secure Web Proxy does not yet honor this field.
          type: string
          enumDescriptions:
            - Indicates no TLS version was specified.
            - TLS 1.0
            - TLS 1.1
            - TLS 1.2
            - TLS 1.3
        updateTime:
          readOnly: true
          type: string
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
        tlsFeatureProfile:
          description: >-
            Optional. The selected Profile. If this is not set, then the default
            value is to allow the broadest set of clients and servers
            ("PROFILE_COMPATIBLE"). Setting this to more restrictive values may
            improve security, but may also prevent the TLS inspection proxy from
            connecting to some clients or servers. Note that Secure Web Proxy
            does not yet honor this field.
          enum:
            - PROFILE_UNSPECIFIED
            - PROFILE_COMPATIBLE
            - PROFILE_MODERN
            - PROFILE_RESTRICTED
            - PROFILE_CUSTOM
          type: string
          enumDescriptions:
            - Indicates no profile was specified.
            - >-
              Compatible profile. Allows the broadest set of clients, even those
              which support only out-of-date SSL features to negotiate with the
              TLS inspection proxy.
            - >-
              Modern profile. Supports a wide set of SSL features, allowing
              modern clients to negotiate SSL with the TLS inspection proxy.
            - >-
              Restricted profile. Supports a reduced set of SSL features,
              intended to meet stricter compliance requirements.
            - >-
              Custom profile. Allow only the set of allowed SSL features
              specified in the custom_features field of SslPolicy.
        caPool:
          description: >-
            Required. A CA pool resource used to issue interception
            certificates. The CA pool string has a relative resource path
            following the form
            "projects/{project}/locations/{location}/caPools/{ca_pool}".
          type: string
        excludePublicCaSet:
          type: boolean
          description: >-
            Optional. If FALSE (the default), use our default set of public CAs
            in addition to any CAs specified in trust_config. These public CAs
            are currently based on the Mozilla Root Program and are subject to
            change over time. If TRUE, do not accept our default set of public
            CAs. Only CAs specified in trust_config will be accepted. This
            defaults to FALSE (use public CAs in addition to trust_config) for
            backwards compatibility, but trusting public root CAs is *not
            recommended* unless the traffic in question is outbound to public
            web servers. When possible, prefer setting this to "false" and
            explicitly specifying trusted CAs and certificates in a TrustConfig.
            Note that Secure Web Proxy does not yet honor this field.
        description:
          description: Optional. Free-text description of the resource.
          type: string
        name:
          type: string
          description: >-
            Required. Name of the resource. Name is of the form
            projects/{project}/locations/{location}/tlsInspectionPolicies/{tls_inspection_policy}
            tls_inspection_policy should match the
            pattern:(^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$).
        trustConfig:
          type: string
          description: >-
            Optional. A TrustConfig resource used when making a connection to
            the TLS server. This is a relative resource path following the form
            "projects/{project}/locations/{location}/trustConfigs/{trust_config}".
            This is necessary to intercept TLS connections to servers with
            certificates signed by a private CA or self-signed certificates.
            Note that Secure Web Proxy does not yet honor this field.
        customTlsFeatures:
          description: >-
            Optional. List of custom TLS cipher suites selected. This field is
            valid only if the selected tls_feature_profile is CUSTOM. The
            compute.SslPoliciesService.ListAvailableFeatures method returns the
            set of features that can be specified in this list. Note that Secure
            Web Proxy does not yet honor this field.
          type: array
          items:
            type: string
        createTime:
          readOnly: true
          type: string
          format: google-datetime
          description: Output only. The timestamp when the resource was created.
    ServerTlsPolicy:
      type: object
      properties:
        labels:
          description: Set of label tags associated with the resource.
          additionalProperties:
            type: string
          type: object
        serverCertificate:
          description: >-
            Optional if policy is to be used with Traffic Director. For
            Application Load Balancers must be empty. Defines a mechanism to
            provision server identity (public and private keys). Cannot be
            combined with `allow_open` as a permissive mode that allows both
            plain text and TLS is not supported.
          $ref: '#/components/schemas/GoogleCloudNetworksecurityV1CertificateProvider'
        updateTime:
          readOnly: true
          type: string
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        mtlsPolicy:
          $ref: '#/components/schemas/MTLSPolicy'
          description: >-
            This field is required if the policy is used with Application Load
            Balancers. This field can be empty for Traffic Director. Defines a
            mechanism to provision peer validation certificates for peer to peer
            authentication (Mutual TLS - mTLS). If not specified, client
            certificate will not be requested. The connection is treated as TLS
            and not mTLS. If `allow_open` and `mtls_policy` are set, server
            allows both plain text and mTLS connections.
        description:
          description: Free-text description of the resource.
          type: string
        name:
          description: >-
            Required. Name of the ServerTlsPolicy resource. It matches the
            pattern
            `projects/*/locations/{location}/serverTlsPolicies/{server_tls_policy}`
          type: string
        allowOpen:
          description: >-
            This field applies only for Traffic Director policies. It is must be
            set to false for Application Load Balancer policies. Determines if
            server allows plaintext connections. If set to true, server allows
            plain text connections. By default, it is set to false. This setting
            is not exclusive of other encryption modes. For example, if
            `allow_open` and `mtls_policy` are set, server allows both plain
            text and mTLS connections. See documentation of other encryption
            modes to confirm compatibility. Consider using it if you wish to
            upgrade in place your deployment to TLS while having mixed TLS and
            non-TLS traffic reaching port :80.
          type: boolean
      id: ServerTlsPolicy
      description: >-
        ServerTlsPolicy is a resource that specifies how a server should
        authenticate incoming requests. This resource itself does not affect
        configuration unless it is attached to a target HTTPS proxy or endpoint
        config selector resource. ServerTlsPolicy in the form accepted by
        Application Load Balancers can be attached only to TargetHttpsProxy with
        an `EXTERNAL`, `EXTERNAL_MANAGED` or `INTERNAL_MANAGED` load balancing
        scheme. Traffic Director compatible ServerTlsPolicies can be attached to
        EndpointPolicy and TargetHttpsProxy with Traffic Director
        `INTERNAL_SELF_MANAGED` load balancing scheme.
    Expr:
      type: object
      properties:
        expression:
          type: string
          description: >-
            Textual representation of an expression in Common Expression
            Language syntax.
        title:
          type: string
          description: >-
            Optional. Title for the expression, i.e. a short string describing
            its purpose. This can be used e.g. in UIs which allow to enter the
            expression.
        description:
          description: >-
            Optional. Description of the expression. This is a longer text which
            describes the expression, e.g. when hovered over it in a UI.
          type: string
        location:
          type: string
          description: >-
            Optional. String indicating the location of the expression for error
            reporting, e.g. a file name and a position in the file.
      description: >-
        Represents a textual expression in the Common Expression Language (CEL)
        syntax. CEL is a C-like expression language. The syntax and semantics of
        CEL are documented at https://github.com/google/cel-spec. Example
        (Comparison): title: "Summary size limit" description: "Determines if a
        summary is less than 100 chars" expression: "document.summary.size() <
        100" Example (Equality): title: "Requestor is owner" description:
        "Determines if requestor is the document owner" expression:
        "document.owner == request.auth.claims.email" Example (Logic): title:
        "Public documents" description: "Determine whether the document should
        be publicly visible" expression: "document.type != 'private' &&
        document.type != 'internal'" Example (Data Manipulation): title:
        "Notification string" description: "Create a notification string with a
        timestamp." expression: "'New message received at ' +
        string(document.create_time)" The exact variables and functions that may
        be referenced within an expression are determined by the service that
        evaluates it. See the service documentation for additional information.
      id: Expr
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
        locationId:
          type: string
          description: 'The canonical id for this location. For example: `"us-east1"`.'
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        metadata:
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          type: object
    AddressGroup:
      description: >-
        AddressGroup is a resource that specifies how a collection of IP/DNS
        used in Firewall Policy.
      id: AddressGroup
      type: object
      properties:
        capacity:
          type: integer
          description: Required. Capacity of the Address Group
          format: int32
        createTime:
          readOnly: true
          type: string
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
        purpose:
          type: array
          items:
            enum:
              - PURPOSE_UNSPECIFIED
              - DEFAULT
              - CLOUD_ARMOR
            type: string
            enumDescriptions:
              - Default value. Should never happen.
              - >-
                Address Group is distributed to VMC, and is usable in Firewall
                Policies and other systems that rely on VMC.
              - Address Group is usable in Cloud Armor.
          description: Optional. List of supported purposes of the Address Group.
        description:
          type: string
          description: Optional. Free-text description of the resource.
        selfLink:
