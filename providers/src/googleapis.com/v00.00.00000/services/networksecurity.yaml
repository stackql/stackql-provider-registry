        clientValidationTrustConfig:
          type: string
          description: >-
            Reference to the TrustConfig from certificatemanager.googleapis.com
            namespace. If specified, the chain validation will be performed
            against certificates configured in the given TrustConfig. Allowed
            only if the policy is to be used with Application Load Balancers.
        clientValidationMode:
          type: string
          enumDescriptions:
            - Not allowed.
            - >-
              Allow connection even if certificate chain validation of the
              client certificate failed or no client certificate was presented.
              The proof of possession of the private key is always checked if
              client certificate was presented. This mode requires the backend
              to implement processing of data extracted from a client
              certificate to authenticate the peer, or to reject connections if
