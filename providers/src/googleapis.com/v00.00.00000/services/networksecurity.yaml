          description: Output only. List of associations to this endpoint group.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/InterceptEndpointGroupAssociationDetails'
        description:
          type: string
          description: >-
            Optional. User-provided description of the endpoint group. Used as
            additional context for the endpoint group.
        state:
          readOnly: true
          type: string
          description: >-
            Output only. The current state of the endpoint group. See
            https://google.aip.dev/216.
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - CLOSED
            - CREATING
            - DELETING
            - OUT_OF_SYNC
            - DELETE_FAILED
          enumDescriptions:
            - State not set (this is not a valid state).
            - >-
              The endpoint group is ready and in sync with the target deployment
              group.
            - >-
              The deployment group backing this endpoint group has been
              force-deleted. This endpoint group cannot be used and interception
              is effectively disabled.
            - The endpoint group is being created.
            - The endpoint group is being deleted.
            - >-
              The endpoint group is out of sync with the backing deployment
              group. In most cases, this is a result of a transient issue within
              the system (e.g. an inaccessible location) and the system is
              expected to recover automatically. See the associations field for
              details per network and location.
            - >-
              An attempt to delete the endpoint group has failed. This is a
              terminal state and the endpoint group is not expected to recover.
              The only permitted operation is to retry deleting the endpoint
              group.
        labels:
          additionalProperties:
            type: string
          type: object
          description: >-
            Optional. Labels are key/value pairs that help to organize and
            filter resources.
        updateTime:
          description: >-
            Output only. The timestamp when the resource was most recently
            updated. See https://google.aip.dev/148#timestamps.
          format: google-datetime
          readOnly: true
          type: string
        connectedDeploymentGroup:
