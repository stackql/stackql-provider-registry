components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AddAddressGroupItemsRequest:
      description: Request used by the AddAddressGroupItems method.
      id: AddAddressGroupItemsRequest
      properties:
        items:
          description: Required. List of items to add.
          items:
            type: string
          type: array
        requestId:
          description: >-
            Optional. An optional request ID to identify requests. Specify a
            unique request ID so that if you must retry your request, the server
            will know to ignore the request if it has already been completed.
            The server will guarantee that for at least 60 minutes since the
            first request. For example, consider a situation where you make an
            initial request and the request times out. If you make the request
            again with the same request ID, the server can check if original
            operation with the same request ID was received, and if so, will
            ignore the second request. This prevents clients from accidentally
            creating duplicate commitments. The request ID must be a valid UUID
            with the exception that zero UUID is not supported
            (00000000-0000-0000-0000-000000000000).
          type: string
      type: object
    AddressGroup:
      description: >-
        AddressGroup is a resource that specifies how a collection of IP/DNS
        used in Firewall Policy.
      id: AddressGroup
      properties:
        capacity:
          description: Required. Capacity of the Address Group
          format: int32
          type: integer
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Free-text description of the resource.
          type: string
        items:
          description: Optional. List of items.
          items:
            type: string
          type: array
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of label tags associated with the AddressGroup
            resource.
          type: object
        name:
          description: >-
            Required. Name of the AddressGroup resource. It matches pattern
            `projects/*/locations/{location}/addressGroups/`.
          type: string
        purpose:
          description: Optional. List of supported purposes of the Address Group.
          items:
            enum:
              - PURPOSE_UNSPECIFIED
              - DEFAULT
              - CLOUD_ARMOR
            enumDescriptions:
              - Default value. Should never happen.
              - >-
                Address Group is distributed to VMC, and is usable in Firewall
                Policies and other systems that rely on VMC.
              - Address Group is usable in Cloud Armor.
            type: string
          type: array
        selfLink:
          description: Output only. Server-defined fully-qualified URL for this resource.
          readOnly: true
          type: string
        type:
          description: >-
            Required. The type of the Address Group. Possible values are "IPv4"
            or "IPV6".
          enum:
            - TYPE_UNSPECIFIED
            - IPV4
            - IPV6
          enumDescriptions:
            - Default value.
            - IP v4 ranges.
            - IP v6 ranges.
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    AntivirusOverride:
      description: Defines what action to take for antivirus threats per protocol.
      id: AntivirusOverride
      properties:
        action:
          description: >-
            Required. Threat action override. For some threat types, only a
            subset of actions applies.
          enum:
            - THREAT_ACTION_UNSPECIFIED
            - DEFAULT_ACTION
            - ALLOW
            - ALERT
            - DENY
          enumDescriptions:
            - Threat action not specified.
            - The default action (as specified by the vendor) is taken.
            - The packet matching this rule will be allowed to transmit.
            - >-
              The packet matching this rule will be allowed to transmit, but a
              threat_log entry will be sent to the consumer project.
            - >-
              The packet matching this rule will be dropped, and a threat_log
              entry will be sent to the consumer project.
          type: string
        protocol:
          description: Required. Protocol to match.
          enum:
            - PROTOCOL_UNSPECIFIED
            - SMTP
            - SMB
            - POP3
            - IMAP
            - HTTP2
            - HTTP
            - FTP
          enumDescriptions:
            - Protocol not specified.
            - SMTP protocol
            - SMB protocol
            - POP3 protocol
            - IMAP protocol
            - HTTP2 protocol
            - HTTP protocol
            - FTP protocol
          type: string
      type: object
    AuthorizationPolicy:
      description: >-
        AuthorizationPolicy is a resource that specifies how a server should
        authorize incoming connections. This resource in itself does not change
        the configuration unless it's attached to a target https proxy or
        endpoint config selector resource.
      id: AuthorizationPolicy
      properties:
        action:
          description: >-
            Required. The action to take when a rule match is found. Possible
            values are "ALLOW" or "DENY".
          enum:
            - ACTION_UNSPECIFIED
            - ALLOW
            - DENY
          enumDescriptions:
            - Default value.
            - Grant access.
            - >-
              Deny access. Deny rules should be avoided unless they are used to
              provide a default "deny all" fallback.
          type: string
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Free-text description of the resource.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of label tags associated with the AuthorizationPolicy
            resource.
          type: object
        name:
          description: >-
            Required. Name of the AuthorizationPolicy resource. It matches
            pattern
            `projects/{project}/locations/{location}/authorizationPolicies/`.
          type: string
        rules:
          description: >-
            Optional. List of rules to match. Note that at least one of the
            rules must match in order for the action specified in the 'action'
            field to be taken. A rule is a match if there is a matching source
            and destination. If left blank, the action specified in the `action`
            field will be applied on every request.
          items:
            $ref: '#/components/schemas/Rule'
          type: array
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    AuthzPolicy:
      description: >-
        `AuthzPolicy` is a resource that allows to forward traffic to a callout
        backend designed to scan the traffic for security purposes.
      id: AuthzPolicy
      properties:
        action:
          description: >-
            Required. Can be one of `ALLOW`, `DENY`, `CUSTOM`. When the action
            is `CUSTOM`, `customProvider` must be specified. When the action is
            `ALLOW`, only requests matching the policy will be allowed. When the
            action is `DENY`, only requests matching the policy will be denied.
            When a request arrives, the policies are evaluated in the following
            order: 1. If there is a `CUSTOM` policy that matches the request,
            the `CUSTOM` policy is evaluated using the custom authorization
            providers and the request is denied if the provider rejects the
            request. 2. If there are any `DENY` policies that match the request,
            the request is denied. 3. If there are no `ALLOW` policies for the
            resource or if any of the `ALLOW` policies match the request, the
            request is allowed. 4. Else the request is denied by default if none
            of the configured AuthzPolicies with `ALLOW` action match the
            request.
          enum:
            - AUTHZ_ACTION_UNSPECIFIED
            - ALLOW
            - DENY
            - CUSTOM
          enumDescriptions:
            - Unspecified action.
            - Allow request to pass through to the backend.
            - Deny the request and return a HTTP 404 to the client.
            - >-
              Delegate the authorization decision to an external authorization
              engine.
          type: string
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        customProvider:
          $ref: '#/components/schemas/AuthzPolicyCustomProvider'
          description: >-
            Optional. Required if the action is `CUSTOM`. Allows delegating
            authorization decisions to Cloud IAP or to Service Extensions. One
            of `cloudIap` or `authzExtension` must be specified.
        description:
          description: Optional. A human-readable description of the resource.
          type: string
        httpRules:
          description: >-
            Optional. A list of authorization HTTP rules to match against the
            incoming request. A policy match occurs when at least one HTTP rule
            matches the request or when no HTTP rules are specified in the
            policy. At least one HTTP Rule is required for Allow or Deny Action.
            Limited to 5 rules.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRule'
          type: array
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of labels associated with the `AuthzPolicy` resource.
            The format must comply with [the following
            requirements](/compute/docs/labeling-resources#requirements).
          type: object
        name:
          description: >-
            Required. Identifier. Name of the `AuthzPolicy` resource in the
            following format:
            `projects/{project}/locations/{location}/authzPolicies/{authz_policy}`.
          type: string
        networkRules:
          description: >-
            Optional. A list of authorization network rules to match against the
            incoming request. A policy match occurs when at least one network
            rule matches the request. At least one network rule is required for
            Allow or Deny Action if no HTTP rules are provided. Network rules
            are mutually exclusive with HTTP rules. Limited to 5 rules.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRule'
          type: array
        policyProfile:
          description: >-
            Optional. Immutable. Defines the type of authorization being
            performed. If not specified, `REQUEST_AUTHZ` is applied. This field
            cannot be changed once AuthzPolicy is created.
          enum:
            - POLICY_PROFILE_UNSPECIFIED
            - REQUEST_AUTHZ
            - CONTENT_AUTHZ
          enumDescriptions:
            - Unspecified policy profile.
            - >-
              Applies to request authorization. `CUSTOM` authorization policies
              with Authz extensions will be allowed with `EXT_AUTHZ_GRPC` or
              `EXT_PROC_GRPC` protocols. Extensions are invoked only for request
              header events.
            - >-
              Applies to content security, sanitization, etc. Only `CUSTOM`
              action is allowed in this policy profile. AuthzExtensions in the
              custom provider must support `EXT_PROC_GRPC` protocol only and be
              capable of receiving all `EXT_PROC_GRPC` events (REQUEST_HEADERS,
              REQUEST_BODY, REQUEST_TRAILERS, RESPONSE_HEADERS, RESPONSE_BODY,
              RESPONSE_TRAILERS) with `FULL_DUPLEX_STREAMED` body send mode.
          type: string
        target:
          $ref: '#/components/schemas/AuthzPolicyTarget'
          description: >-
            Required. Specifies the set of resources to which this policy should
            be applied to.
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    AuthzPolicyAuthzRule:
      description: Conditions to match against the incoming request.
      id: AuthzPolicyAuthzRule
      properties:
        from:
          $ref: '#/components/schemas/AuthzPolicyAuthzRuleFrom'
          description: Optional. Describes properties of a source of a request.
        to:
          $ref: '#/components/schemas/AuthzPolicyAuthzRuleTo'
          description: Optional. Describes properties of a target of a request.
        when:
          description: >-
            Optional. CEL expression that describes the conditions to be
            satisfied for the action. The result of the CEL expression is ANDed
            with the from and to. Refer to the CEL language reference for a list
            of available attributes.
          type: string
      type: object
    AuthzPolicyAuthzRuleFrom:
      description: Describes properties of one or more sources of a request.
      id: AuthzPolicyAuthzRuleFrom
      properties:
        notSources:
          description: >-
            Optional. Describes the negated properties of request sources.
            Matches requests from sources that do not match the criteria
            specified in this field. At least one of sources or notSources must
            be specified.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleFromRequestSource'
          type: array
        sources:
          description: >-
            Optional. Describes the properties of a request's sources. At least
            one of sources or notSources must be specified. Limited to 1 source.
            A match occurs when ANY source (in sources or notSources) matches
            the request. Within a single source, the match follows AND semantics
            across fields and OR semantics within a single field, i.e. a match
            occurs when ANY principal matches AND ANY ipBlocks match.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleFromRequestSource'
          type: array
      type: object
    AuthzPolicyAuthzRuleFromRequestSource:
      description: Describes the properties of a single source.
      id: AuthzPolicyAuthzRuleFromRequestSource
      properties:
        ipBlocks:
          description: >-
            Optional. A list of IP addresses or IP address ranges to match
            against the source IP address of the request. Limited to 10
            ip_blocks per Authorization Policy
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleIpBlock'
          type: array
        principals:
          description: >-
            Optional. A list of identities derived from the client's
            certificate. This field will not match on a request unless frontend
            mutual TLS is enabled for the forwarding rule or Gateway and the
            client certificate has been successfully validated by mTLS. Each
            identity is a string whose value is matched against a list of URI
            SANs, DNS Name SANs, or the common name in the client's certificate.
            A match happens when any principal matches with the rule. Limited to
            50 principals per Authorization Policy for regional internal
            Application Load Balancers, regional external Application Load
            Balancers, cross-region internal Application Load Balancers, and
            Cloud Service Mesh while 25 principals per Authorization Policy for
            global external Application Load Balancers.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRulePrincipal'
          type: array
        resources:
          description: >-
            Optional. A list of resources to match against the resource of the
            source VM of a request. Limited to 10 resources per Authorization
            Policy.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleRequestResource'
          type: array
      type: object
    AuthzPolicyAuthzRuleHeaderMatch:
      description: Determines how a HTTP header should be matched.
      id: AuthzPolicyAuthzRuleHeaderMatch
      properties:
        name:
          description: Optional. Specifies the name of the header in the request.
          type: string
        value:
          $ref: '#/components/schemas/AuthzPolicyAuthzRuleStringMatch'
          description: Optional. Specifies how the header match will be performed.
      type: object
    AuthzPolicyAuthzRuleIpBlock:
      description: Represents a range of IP Addresses.
      id: AuthzPolicyAuthzRuleIpBlock
      properties:
        length:
          description: Required. The length of the address range.
          format: int32
          type: integer
        prefix:
          description: Required. The address prefix.
          type: string
      type: object
    AuthzPolicyAuthzRulePrincipal:
      description: Describes the properties of a principal to be matched against.
      id: AuthzPolicyAuthzRulePrincipal
      properties:
        principal:
          $ref: '#/components/schemas/AuthzPolicyAuthzRuleStringMatch'
          description: >-
            Required. A non-empty string whose value is matched against the
            principal value based on the principal_selector. Only exact match
            can be applied for CLIENT_CERT_URI_SAN, CLIENT_CERT_DNS_NAME_SAN,
            CLIENT_CERT_COMMON_NAME selectors.
        principalSelector:
          description: >-
            Optional. An enum to decide what principal value the principal rule
            will match against. If not specified, the PrincipalSelector is
            CLIENT_CERT_URI_SAN.
          enum:
            - PRINCIPAL_SELECTOR_UNSPECIFIED
            - CLIENT_CERT_URI_SAN
            - CLIENT_CERT_DNS_NAME_SAN
            - CLIENT_CERT_COMMON_NAME
          enumDescriptions:
            - >-
              Unspecified principal selector. It will be treated as
              CLIENT_CERT_URI_SAN by default.
            - >-
              The principal rule is matched against a list of URI SANs in the
              validated client's certificate. A match happens when there is any
              exact URI SAN value match. This is the default principal selector.
            - >-
              The principal rule is matched against a list of DNS Name SANs in
              the validated client's certificate. A match happens when there is
              any exact DNS Name SAN value match. This is only applicable for
              Application Load Balancers except for classic Global External
              Application load balancer. CLIENT_CERT_DNS_NAME_SAN is not
              supported for INTERNAL_SELF_MANAGED load balancing scheme.
            - >-
              The principal rule is matched against the common name in the
              client's certificate. Authorization against multiple common names
              in the client certificate is not supported. Requests with multiple
              common names in the client certificate will be rejected if
              CLIENT_CERT_COMMON_NAME is set as the principal selector. A match
              happens when there is an exact common name value match. This is
              only applicable for Application Load Balancers and not for Classic
              Application Load Balancer. CLIENT_CERT_COMMON_NAME is not
              supported for INTERNAL_SELF_MANAGED load balancing scheme.
          type: string
      type: object
    AuthzPolicyAuthzRuleRequestResource:
      description: >-
        Describes the properties of a client VM resource accessing the internal
        application load balancers.
      id: AuthzPolicyAuthzRuleRequestResource
      properties:
        iamServiceAccount:
          $ref: '#/components/schemas/AuthzPolicyAuthzRuleStringMatch'
          description: >-
            Optional. An IAM service account to match against the source service
            account of the VM sending the request.
        tagValueIdSet:
          $ref: >-
            #/components/schemas/AuthzPolicyAuthzRuleRequestResourceTagValueIdSet
          description: >-
            Optional. A list of resource tag value permanent IDs to match
            against the resource manager tags value associated with the source
            VM of a request.
      type: object
    AuthzPolicyAuthzRuleRequestResourceTagValueIdSet:
      description: >-
        Describes a set of resource tag value permanent IDs to match against the
        resource manager tags value associated with the source VM of a request.
      id: AuthzPolicyAuthzRuleRequestResourceTagValueIdSet
      properties:
        ids:
          description: >-
            Required. A list of resource tag value permanent IDs to match
            against the resource manager tags value associated with the source
            VM of a request. The match follows AND semantics which means all the
            ids must match. Limited to 5 ids in the Tag value id set.
          items:
            format: int64
            type: string
          type: array
      type: object
    AuthzPolicyAuthzRuleStringMatch:
      description: Determines how a string value should be matched.
      id: AuthzPolicyAuthzRuleStringMatch
      properties:
        contains:
          description: >-
            The input string must have the substring specified here. Note: empty
            contains match is not allowed, please use regex instead. Examples: *
            ``abc`` matches the value ``xyz.abc.def``
          type: string
        exact:
          description: >-
            The input string must match exactly the string specified here.
            Examples: * ``abc`` only matches the value ``abc``.
          type: string
        ignoreCase:
          description: >-
            If true, indicates the exact/prefix/suffix/contains matching should
            be case insensitive. For example, the matcher ``data`` will match
            both input string ``Data`` and ``data`` if set to true.
          type: boolean
        prefix:
          description: >-
            The input string must have the prefix specified here. Note: empty
            prefix is not allowed, please use regex instead. Examples: * ``abc``
            matches the value ``abc.xyz``
          type: string
        suffix:
          description: >-
            The input string must have the suffix specified here. Note: empty
            prefix is not allowed, please use regex instead. Examples: * ``abc``
            matches the value ``xyz.abc``
          type: string
      type: object
    AuthzPolicyAuthzRuleTo:
      description: Describes properties of one or more targets of a request.
      id: AuthzPolicyAuthzRuleTo
      properties:
        notOperations:
          description: >-
            Optional. Describes the negated properties of the targets of a
            request. Matches requests for operations that do not match the
            criteria specified in this field. At least one of operations or
            notOperations must be specified.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleToRequestOperation'
          type: array
        operations:
          description: >-
            Optional. Describes properties of one or more targets of a request.
            At least one of operations or notOperations must be specified.
            Limited to 1 operation. A match occurs when ANY operation (in
            operations or notOperations) matches. Within an operation, the match
            follows AND semantics across fields and OR semantics within a field,
            i.e. a match occurs when ANY path matches AND ANY header matches and
            ANY method matches.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleToRequestOperation'
          type: array
      type: object
    AuthzPolicyAuthzRuleToRequestOperation:
      description: Describes properties of one or more targets of a request.
      id: AuthzPolicyAuthzRuleToRequestOperation
      properties:
        headerSet:
          $ref: '#/components/schemas/AuthzPolicyAuthzRuleToRequestOperationHeaderSet'
          description: Optional. A list of headers to match against in http header.
        hosts:
          description: >-
            Optional. A list of HTTP Hosts to match against. The match can be
            one of exact, prefix, suffix, or contains (substring match). Matches
            are always case sensitive unless the ignoreCase is set. Limited to
            10 hosts per Authorization Policy.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleStringMatch'
          type: array
        mcp:
          $ref: '#/components/schemas/AuthzPolicyAuthzRuleToRequestOperationMCP'
          description: >-
            Optional. Defines the MCP protocol attributes to match on. If the
            MCP payload in the request body cannot be successfully parsed, the
            request will be denied. This field can be set only for AuthzPolicies
            targeting AgentGateway resources.
        methods:
          description: >-
            Optional. A list of HTTP methods to match against. Each entry must
            be a valid HTTP method name (GET, PUT, POST, HEAD, PATCH, DELETE,
            OPTIONS). It only allows exact match and is always case sensitive.
            Limited to 10 methods per Authorization Policy.
          items:
            type: string
          type: array
        paths:
          description: >-
            Optional. A list of paths to match against. The match can be one of
            exact, prefix, suffix, or contains (substring match). Matches are
            always case sensitive unless the ignoreCase is set. Limited to 10
            paths per Authorization Policy. Note that this path match includes
            the query parameters. For gRPC services, this should be a
            fully-qualified name of the form /package.service/method.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleStringMatch'
          type: array
        snis:
          description: >-
            Optional. A list of SNIs to match against. The match can be one of
            exact, prefix, suffix, or contains (substring match). If there is no
            SNI (i.e. plaintext HTTP traffic), the request will be denied.
            Matches are always case sensitive unless the ignoreCase is set.
            Limited to 10 SNIs per Authorization Policy.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleStringMatch'
          type: array
      type: object
    AuthzPolicyAuthzRuleToRequestOperationHeaderSet:
      description: Describes a set of HTTP headers to match against.
      id: AuthzPolicyAuthzRuleToRequestOperationHeaderSet
      properties:
        headers:
          description: >-
            Required. A list of headers to match against in http header. The
            match can be one of exact, prefix, suffix, or contains (substring
            match). The match follows AND semantics which means all the headers
            must match. Matches are always case sensitive unless the ignoreCase
            is set. Limited to 10 headers per Authorization Policy.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleHeaderMatch'
          type: array
      type: object
    AuthzPolicyAuthzRuleToRequestOperationMCP:
      description: >-
        Describes a set of MCP protocol attributes to match against for a given
        MCP request.
      id: AuthzPolicyAuthzRuleToRequestOperationMCP
      properties:
        baseProtocolMethodsOption:
          description: >-
            Optional. If specified, matches on the MCP protocol’s non-access
            specific methods namely: * initialize * completion/ * logging/ *
            notifications/ * ping Defaults to SKIP_BASE_PROTOCOL_METHODS if not
            specified.
          enum:
            - BASE_PROTOCOL_METHODS_OPTION_UNSPECIFIED
            - SKIP_BASE_PROTOCOL_METHODS
            - MATCH_BASE_PROTOCOL_METHODS
          enumDescriptions:
            - Unspecified option. Defaults to SKIP_BASE_PROTOCOL_METHODS.
            - Skip matching on the base MCP protocol methods.
            - Match on the base MCP protocol methods.
          type: string
        methods:
          description: >-
            Optional. A list of MCP methods and associated parameters to match
            on. It is recommended to use this field to match on tools, prompts
            and resource accesses while setting the baseProtocolMethodsOption to
            MATCH_BASE_PROTOCOL_METHODS to match on all the other MCP protocol
            methods. Limited to 10 MCP methods per Authorization Policy.
          items:
            $ref: >-
              #/components/schemas/AuthzPolicyAuthzRuleToRequestOperationMCPMethod
          type: array
      type: object
    AuthzPolicyAuthzRuleToRequestOperationMCPMethod:
      description: Describes a set of MCP methods to match against.
      id: AuthzPolicyAuthzRuleToRequestOperationMCPMethod
      properties:
        name:
          description: >-
            Required. The MCP method to match against. Allowed values are as
            follows: 1. `tools`, `prompts`, `resources` - these will match
            against all sub methods under the respective methods. 2.
            `prompts/list`, `tools/list`, `resources/list`,
            `resources/templates/list` 3. `prompts/get`, `tools/call`,
            `resources/subscribe`, `resources/unsubscribe`, `resources/read`
            Params cannot be specified for categories 1 and 2.
          type: string
        params:
          description: >-
            Optional. A list of MCP method parameters to match against. The
            match can be one of exact, prefix, suffix, or contains (substring
            match). Matches are always case sensitive unless the ignoreCase is
            set. Limited to 10 MCP method parameters per Authorization Policy.
          items:
            $ref: '#/components/schemas/AuthzPolicyAuthzRuleStringMatch'
          type: array
      type: object
    AuthzPolicyCustomProvider:
      description: >-
        Allows delegating authorization decisions to Cloud IAP or to Service
        Extensions.
      id: AuthzPolicyCustomProvider
      properties:
        authzExtension:
          $ref: '#/components/schemas/AuthzPolicyCustomProviderAuthzExtension'
          description: >-
            Optional. Delegate authorization decision to user authored Service
            Extension. Only one of cloudIap or authzExtension can be specified.
        cloudIap:
          $ref: '#/components/schemas/AuthzPolicyCustomProviderCloudIap'
          description: >-
            Optional. Delegates authorization decisions to Cloud IAP. Applicable
            only for managed load balancers. Enabling Cloud IAP at the
            AuthzPolicy level is not compatible with Cloud IAP settings in the
            BackendService. Enabling IAP in both places will result in request
            failure. Ensure that IAP is enabled in either the AuthzPolicy or the
            BackendService but not in both places.
      type: object
    AuthzPolicyCustomProviderAuthzExtension:
      description: >-
        Optional. Delegate authorization decision to user authored extension.
        Only one of cloudIap or authzExtension can be specified.
      id: AuthzPolicyCustomProviderAuthzExtension
      properties:
        resources:
          description: >-
            Required. A list of references to authorization extensions that will
            be invoked for requests matching this policy. Limited to 1 custom
            provider.
          items:
            type: string
          type: array
      type: object
    AuthzPolicyCustomProviderCloudIap:
      description: >-
        Optional. Delegates authorization decisions to Cloud IAP. Applicable
        only for managed load balancers. Enabling Cloud IAP at the AuthzPolicy
        level is not compatible with Cloud IAP settings in the BackendService.
        Enabling IAP in both places will result in request failure. Ensure that
        IAP is enabled in either the AuthzPolicy or the BackendService but not
        in both places.
      id: AuthzPolicyCustomProviderCloudIap
      properties: {}
      type: object
    AuthzPolicyTarget:
      description: Specifies the set of targets to which this policy should be applied to.
      id: AuthzPolicyTarget
      properties:
        loadBalancingScheme:
          description: >-
            Optional. All gateways and forwarding rules referenced by this
            policy and extensions must share the same load balancing scheme.
            Required only when targeting forwarding rules. If targeting Secure
            Web Proxy, this field must be `INTERNAL_MANAGED` or not specified.
            Must not be specified when targeting Agent Gateway. Supported
            values: `INTERNAL_MANAGED` and `EXTERNAL_MANAGED`. For more
            information, refer to [Backend services
            overview](https://cloud.google.com/load-balancing/docs/backend-service).
          enum:
            - LOAD_BALANCING_SCHEME_UNSPECIFIED
            - INTERNAL_MANAGED
            - EXTERNAL_MANAGED
            - INTERNAL_SELF_MANAGED
          enumDescriptions:
            - Default value. Do not use.
            - >-
              Signifies that this is used for Regional internal or Cross-region
              internal Application Load Balancing.
            - >-
              Signifies that this is used for Global external or Regional
              external Application Load Balancing.
            - >-
              Signifies that this is used for Cloud Service Mesh. Meant for use
              by CSM GKE controller only.
          type: string
        resources:
          description: >-
            Required. A list of references to the Forwarding Rules, Secure Web
            Proxy Gateways, or Agent Gateways on which this policy will be
            applied.
          items:
            type: string
          type: array
      type: object
    BackendAuthenticationConfig:
      description: >-
        BackendAuthenticationConfig message groups the TrustConfig together with
        other settings that control how the load balancer authenticates, and
        expresses its identity to, the backend: * `trustConfig` is the attached
        TrustConfig. * `wellKnownRoots` indicates whether the load balance
        should trust backend server certificates that are issued by public
        certificate authorities, in addition to certificates trusted by the
        TrustConfig. * `clientCertificate` is a client certificate that the load
        balancer uses to express its identity to the backend, if the connection
        to the backend uses mTLS. You can attach the BackendAuthenticationConfig
        to the load balancer's BackendService directly determining how that
        BackendService negotiates TLS.
      id: BackendAuthenticationConfig
      properties:
        clientCertificate:
          description: >-
            Optional. A reference to a
            certificatemanager.googleapis.com.Certificate resource. This is a
            relative resource path following the form
            "projects/{project}/locations/{location}/certificates/{certificate}".
            Used by a BackendService to negotiate mTLS when the backend
            connection uses TLS and the backend requests a client certificate.
            Must have a CLIENT_AUTH scope.
          type: string
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Free-text description of the resource.
          type: string
        etag:
          description: Output only. Etag of the resource.
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: Set of label tags associated with the resource.
          type: object
        name:
          description: >-
            Required. Name of the BackendAuthenticationConfig resource. It
            matches the pattern
            `projects/*/locations/{location}/backendAuthenticationConfigs/{backend_authentication_config}`
          type: string
        trustConfig:
          description: >-
            Optional. A reference to a TrustConfig resource from the
            certificatemanager.googleapis.com namespace. This is a relative
            resource path following the form
            "projects/{project}/locations/{location}/trustConfigs/{trust_config}".
            A BackendService uses the chain of trust represented by this
            TrustConfig, if specified, to validate the server certificates
            presented by the backend. Required unless wellKnownRoots is set to
            PUBLIC_ROOTS.
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
        wellKnownRoots:
          description: Well known roots to use for server certificate validation.
          enum:
            - WELL_KNOWN_ROOTS_UNSPECIFIED
            - NONE
            - PUBLIC_ROOTS
          enumDescriptions:
            - Equivalent to NONE.
            - >-
              The BackendService will only validate server certificates against
              roots specified in TrustConfig.
            - >-
              The BackendService uses a set of well-known public roots, in
              addition to any roots specified in the trustConfig field, when
              validating the server certificates presented by the backend.
              Validation with these roots is only considered when the
              TlsSettings.sni field in the BackendService is set. The well-known
              roots are a set of root CAs managed by Google. CAs in this set can
              be added or removed without notice.
          type: string
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    CertificateProviderInstance:
      description: >-
        Specification of a TLS certificate provider instance. Workloads may have
        one or more CertificateProvider instances (plugins) and one of them is
        enabled and configured by specifying this message. Workloads use the
        values from this message to locate and load the CertificateProvider
        instance configuration.
      id: CertificateProviderInstance
      properties:
        pluginInstance:
          description: >-
            Required. Plugin instance name, used to locate and load
            CertificateProvider instance configuration. Set to
            "google_cloud_private_spiffe" to use Certificate Authority Service
            certificate provider instance.
          type: string
      type: object
    ClientTlsPolicy:
      description: >-
        ClientTlsPolicy is a resource that specifies how a client should
        authenticate connections to backends of a service. This resource itself
        does not affect configuration unless it is attached to a backend service
        resource.
      id: ClientTlsPolicy
      properties:
        clientCertificate:
          $ref: '#/components/schemas/GoogleCloudNetworksecurityV1CertificateProvider'
          description: >-
            Optional. Defines a mechanism to provision client identity (public
            and private keys) for peer to peer authentication. The presence of
            this dictates mTLS.
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Free-text description of the resource.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Set of label tags associated with the resource.
          type: object
        name:
          description: >-
            Required. Name of the ClientTlsPolicy resource. It matches the
            pattern
            `projects/{project}/locations/{location}/clientTlsPolicies/{client_tls_policy}`
          type: string
        serverValidationCa:
          description: >-
            Optional. Defines the mechanism to obtain the Certificate Authority
            certificate to validate the server certificate. If empty, client
            does not validate the server certificate.
          items:
            $ref: '#/components/schemas/ValidationCA'
          type: array
        sni:
          description: >-
            Optional. Server Name Indication string to present to the server
            during TLS handshake. E.g: "secure.example.com".
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    CloneAddressGroupItemsRequest:
      description: Request used by the CloneAddressGroupItems method.
      id: CloneAddressGroupItemsRequest
      properties:
        requestId:
          description: >-
            Optional. An optional request ID to identify requests. Specify a
            unique request ID so that if you must retry your request, the server
            will know to ignore the request if it has already been completed.
            The server will guarantee that for at least 60 minutes since the
            first request. For example, consider a situation where you make an
            initial request and the request times out. If you make the request
            again with the same request ID, the server can check if original
            operation with the same request ID was received, and if so, will
            ignore the second request. This prevents clients from accidentally
            creating duplicate commitments. The request ID must be a valid UUID
            with the exception that zero UUID is not supported
            (00000000-0000-0000-0000-000000000000).
          type: string
        sourceAddressGroup:
          description: Required. Source address group to clone items from.
          type: string
      type: object
    CustomInterceptProfile:
      description: >-
        CustomInterceptProfile defines in-band integration behavior (intercept).
        It is used by firewall rules with an APPLY_SECURITY_PROFILE_GROUP
        action.
      id: CustomInterceptProfile
      properties:
        interceptEndpointGroup:
          description: >-
            Required. The target InterceptEndpointGroup. When a firewall rule
            with this security profile attached matches a packet, the packet
            will be intercepted to the location-local target in this group.
          type: string
      type: object
    CustomMirroringProfile:
      description: >-
        CustomMirroringProfile defines out-of-band integration behavior
        (mirroring). It is used by mirroring rules with a MIRROR action.
      id: CustomMirroringProfile
      properties:
        mirroringEndpointGroup:
          description: >-
            Required. Immutable. The target MirroringEndpointGroup. When a
            mirroring rule with this security profile attached matches a packet,
            a replica will be mirrored to the location-local target in this
            group.
          type: string
      type: object
    Destination:
      description: Specification of traffic destination attributes.
      id: Destination
      properties:
        hosts:
          description: >-
            Required. List of host names to match. Matched against the
            ":authority" header in http requests. At least one host should
            match. Each host can be an exact match, or a prefix match (example
            "mydomain.*") or a suffix match (example "*.myorg.com") or a
            presence (any) match "*".
          items:
            type: string
          type: array
        httpHeaderMatch:
          $ref: '#/components/schemas/HttpHeaderMatch'
          description: >-
            Optional. Match against key:value pair in http header. Provides a
            flexible match based on HTTP headers, for potentially advanced use
            cases. At least one header should match. Avoid using header matches
            to make authorization decisions unless there is a strong guarantee
            that requests arrive through a trusted client or proxy.
        methods:
          description: >-
            Optional. A list of HTTP methods to match. At least one method
            should match. Should not be set for gRPC services.
          items:
            type: string
          type: array
        ports:
          description: >-
            Required. List of destination ports to match. At least one port
            should match.
          items:
            format: uint32
            type: integer
          type: array
      type: object
    DnsThreatDetector:
      description: >-
        A DNS threat detector sends DNS query logs to a _provider_ that then
        analyzes the logs to identify threat events in the DNS queries. By
        default, all VPC networks in your projects are included. You can exclude
        specific networks by supplying `excluded_networks`.
      id: DnsThreatDetector
      properties:
        createTime:
          description: Output only. Create time stamp.
          format: google-datetime
          readOnly: true
          type: string
        excludedNetworks:
          description: >-
            Optional. A list of network resource names which aren't monitored by
            this DnsThreatDetector. Example:
            `projects/PROJECT_ID/global/networks/NETWORK_NAME`.
          items:
            type: string
          type: array
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Any labels associated with the DnsThreatDetector, listed
            as key value pairs.
          type: object
        name:
          description: Immutable. Identifier. Name of the DnsThreatDetector resource.
          type: string
        provider:
          description: Required. The provider used for DNS threat analysis.
          enum:
            - PROVIDER_UNSPECIFIED
            - INFOBLOX
          enumDescriptions:
            - An unspecified provider.
            - The Infoblox DNS threat detector provider.
          type: string
        updateTime:
          description: Output only. Update time stamp.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    Expr:
      description: >-
        Represents a textual expression in the Common Expression Language (CEL)
        syntax. CEL is a C-like expression language. The syntax and semantics of
        CEL are documented at https://github.com/google/cel-spec. Example
        (Comparison): title: "Summary size limit" description: "Determines if a
        summary is less than 100 chars" expression: "document.summary.size() <
        100" Example (Equality): title: "Requestor is owner" description:
        "Determines if requestor is the document owner" expression:
        "document.owner == request.auth.claims.email" Example (Logic): title:
        "Public documents" description: "Determine whether the document should
        be publicly visible" expression: "document.type != 'private' &&
        document.type != 'internal'" Example (Data Manipulation): title:
        "Notification string" description: "Create a notification string with a
        timestamp." expression: "'New message received at ' +
        string(document.create_time)" The exact variables and functions that may
        be referenced within an expression are determined by the service that
        evaluates it. See the service documentation for additional information.
      id: Expr
      properties:
        description:
          description: >-
            Optional. Description of the expression. This is a longer text which
            describes the expression, e.g. when hovered over it in a UI.
          type: string
        expression:
          description: >-
            Textual representation of an expression in Common Expression
            Language syntax.
          type: string
        location:
          description: >-
            Optional. String indicating the location of the expression for error
            reporting, e.g. a file name and a position in the file.
          type: string
        title:
          description: >-
            Optional. Title for the expression, i.e. a short string describing
            its purpose. This can be used e.g. in UIs which allow to enter the
            expression.
          type: string
      type: object
    FirewallEndpoint:
      description: Message describing Endpoint object.
      id: FirewallEndpoint
      properties:
        associatedNetworks:
          deprecated: true
          description: >-
            Output only. Deprecated: List of networks that are associated with
            this endpoint in the local zone. This is a projection of the
            FirewallEndpointAssociations pointing at this endpoint. A network
            will only appear in this list after traffic routing is fully
            configured. Format: projects/{project}/global/networks/{name}.
          items:
            type: string
          readOnly: true
          type: array
        associations:
          description: >-
            Output only. List of FirewallEndpointAssociations that are
            associated to this endpoint. An association will only appear in this
            list after traffic routing is fully configured.
          items:
            $ref: '#/components/schemas/FirewallEndpointAssociationReference'
          readOnly: true
          type: array
        billingProjectId:
          description: >-
            Optional. Project to charge for the deployed firewall endpoint. This
            field must be specified when creating the endpoint in the
            organization scope, and should be omitted otherwise.
          type: string
        createTime:
          description: Output only. Create time stamp.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. Description of the firewall endpoint. Max length 2048
            characters.
          type: string
        endpointSettings:
          $ref: '#/components/schemas/FirewallEndpointEndpointSettings'
          description: Optional. Settings for the endpoint.
        labels:
          additionalProperties:
            type: string
          description: Optional. Labels as key value pairs
          type: object
        name:
          description: Immutable. Identifier. Name of resource.
          type: string
        reconciling:
          description: >-
            Output only. Whether reconciling is in progress, recommended per
            https://google.aip.dev/128.
          readOnly: true
          type: boolean
        satisfiesPzi:
          description: Output only. [Output Only] Reserved for future use.
          readOnly: true
          type: boolean
        satisfiesPzs:
          description: Output only. [Output Only] Reserved for future use.
          readOnly: true
          type: boolean
        state:
          description: Output only. Current state of the endpoint.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
            - DELETING
            - INACTIVE
          enumDescriptions:
            - Not set.
            - Being created.
            - Processing configuration updates.
            - Being deleted.
            - Down or in an error state.
          readOnly: true
          type: string
        updateTime:
          description: Output only. Update time stamp
          format: google-datetime
          readOnly: true
          type: string
      type: object
    FirewallEndpointAssociation:
      description: Message describing Association object
      id: FirewallEndpointAssociation
      properties:
        createTime:
          description: Output only. Create time stamp
          format: google-datetime
          readOnly: true
          type: string
        disabled:
          description: >-
            Optional. Whether the association is disabled. True indicates that
            traffic won't be intercepted
          type: boolean
        firewallEndpoint:
          description: Required. The URL of the FirewallEndpoint that is being associated.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Labels as key value pairs
          type: object
        name:
          description: Immutable. Identifier. name of resource
          type: string
        network:
          description: Required. The URL of the network that is being associated.
          type: string
        reconciling:
          description: >-
            Output only. Whether reconciling is in progress, recommended per
            https://google.aip.dev/128.
          readOnly: true
          type: boolean
        state:
          description: Output only. Current state of the association.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
            - DELETING
            - INACTIVE
            - ORPHAN
          enumDescriptions:
            - Not set.
            - Being created.
            - Active and ready for traffic.
            - Being deleted.
            - Down or in an error state.
            - The project that housed the association has been deleted.
          readOnly: true
          type: string
        tlsInspectionPolicy:
          description: >-
            Optional. The URL of the TlsInspectionPolicy that is being
            associated.
          type: string
        updateTime:
          description: Output only. Update time stamp
          format: google-datetime
          readOnly: true
          type: string
      type: object
    FirewallEndpointAssociationReference:
      description: >-
        This is a subset of the FirewallEndpointAssociation message, containing
        fields to be used by the consumer.
      id: FirewallEndpointAssociationReference
      properties:
        name:
          description: >-
            Output only. The resource name of the FirewallEndpointAssociation.
            Format:
            projects/{project}/locations/{location}/firewallEndpointAssociations/{id}
          readOnly: true
          type: string
        network:
          description: >-
            Output only. The VPC network associated. Format:
            projects/{project}/global/networks/{name}.
          readOnly: true
          type: string
      type: object
    FirewallEndpointEndpointSettings:
      description: Settings for the endpoint.
      id: FirewallEndpointEndpointSettings
      properties:
        jumboFramesEnabled:
          description: >-
            Optional. Immutable. Indicates whether Jumbo Frames are enabled.
            Default value is false.
          type: boolean
      type: object
    GatewaySecurityPolicy:
      description: >-
        The GatewaySecurityPolicy resource contains a collection of
        GatewaySecurityPolicyRules and associated metadata.
      id: GatewaySecurityPolicy
      properties:
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Free-text description of the resource.
          type: string
        name:
          description: >-
            Required. Name of the resource. Name is of the form
            projects/{project}/locations/{location}/gatewaySecurityPolicies/{gateway_security_policy}
            gateway_security_policy should match the
            pattern:(^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$).
          type: string
        tlsInspectionPolicy:
          description: >-
            Optional. Name of a TLS Inspection Policy resource that defines how
            TLS inspection will be performed for any rule(s) which enables it.
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GatewaySecurityPolicyRule:
      description: >-
        The GatewaySecurityPolicyRule resource is in a nested collection within
        a GatewaySecurityPolicy and represents a traffic matching condition and
        associated action to perform.
      id: GatewaySecurityPolicyRule
      properties:
        applicationMatcher:
          description: >-
            Optional. CEL expression for matching on L7/application level
            criteria.
          type: string
        basicProfile:
          description: Required. Profile which tells what the primitive action should be.
          enum:
            - BASIC_PROFILE_UNSPECIFIED
            - ALLOW
            - DENY
          enumDescriptions:
            - If there is not a mentioned action for the target.
            - Allow the matched traffic.
            - Deny the matched traffic.
          type: string
        createTime:
          description: Output only. Time when the rule was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Free-text description of the resource.
          type: string
        enabled:
          description: Required. Whether the rule is enforced.
          type: boolean
        name:
          description: >-
            Required. Immutable. Name of the resource. ame is the full resource
            name so
            projects/{project}/locations/{location}/gatewaySecurityPolicies/{gateway_security_policy}/rules/{rule}
            rule should match the pattern: (^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$).
          type: string
        priority:
          description: >-
            Required. Priority of the rule. Lower number corresponds to higher
            precedence.
          format: int32
          type: integer
        sessionMatcher:
          description: Required. CEL expression for matching on session criteria.
          type: string
        tlsInspectionEnabled:
          description: >-
            Optional. Flag to enable TLS inspection of traffic matching on , can
            only be true if the parent GatewaySecurityPolicy references a
            TLSInspectionConfig.
          type: boolean
        updateTime:
          description: Output only. Time when the rule was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudNetworksecurityV1CertificateProvider:
      description: >-
        Specification of certificate provider. Defines the mechanism to obtain
        the certificate and private key for peer to peer authentication.
      id: GoogleCloudNetworksecurityV1CertificateProvider
      properties:
        certificateProviderInstance:
          $ref: '#/components/schemas/CertificateProviderInstance'
          description: >-
            The certificate provider instance specification that will be passed
            to the data plane, which will be used to load necessary credential
            information.
        grpcEndpoint:
          $ref: '#/components/schemas/GoogleCloudNetworksecurityV1GrpcEndpoint'
          description: >-
            gRPC specific configuration to access the gRPC server to obtain the
            cert and private key.
      type: object
    GoogleCloudNetworksecurityV1GrpcEndpoint:
      description: Specification of the GRPC Endpoint.
      id: GoogleCloudNetworksecurityV1GrpcEndpoint
      properties:
        targetUri:
          description: >-
            Required. The target URI of the gRPC endpoint. Only UDS path is
            supported, and should start with "unix:".
          type: string
      type: object
    GoogleIamV1AuditConfig:
      description: >-
        Specifies the audit configuration for a service. The configuration
        determines which permission types are logged, and what identities, if
        any, are exempted from logging. An AuditConfig must have one or more
        AuditLogConfigs. If there are AuditConfigs for both `allServices` and a
        specific service, the union of the two AuditConfigs is used for that
        service: the log_types specified in each AuditConfig are enabled, and
        the exempted_members in each AuditLogConfig are exempted. Example Policy
        with multiple AuditConfigs: { "audit_configs": [ { "service":
        "allServices", "audit_log_configs": [ { "log_type": "DATA_READ",
        "exempted_members": [ "user:jose@example.com" ] }, { "log_type":
        "DATA_WRITE" }, { "log_type": "ADMIN_READ" } ] }, { "service":
        "sampleservice.googleapis.com", "audit_log_configs": [ { "log_type":
        "DATA_READ" }, { "log_type": "DATA_WRITE", "exempted_members": [
        "user:aliya@example.com" ] } ] } ] } For sampleservice, this policy
        enables DATA_READ, DATA_WRITE and ADMIN_READ logging. It also exempts
        `jose@example.com` from DATA_READ logging, and `aliya@example.com` from
        DATA_WRITE logging.
      id: GoogleIamV1AuditConfig
      properties:
        auditLogConfigs:
          description: The configuration for logging of each type of permission.
          items:
            $ref: '#/components/schemas/GoogleIamV1AuditLogConfig'
          type: array
        service:
          description: >-
            Specifies a service that will be enabled for audit logging. For
            example, `storage.googleapis.com`, `cloudsql.googleapis.com`.
            `allServices` is a special value that covers all services.
          type: string
      type: object
    GoogleIamV1AuditLogConfig:
      description: >-
        Provides the configuration for logging a type of permissions. Example: {
        "audit_log_configs": [ { "log_type": "DATA_READ", "exempted_members": [
        "user:jose@example.com" ] }, { "log_type": "DATA_WRITE" } ] } This
        enables 'DATA_READ' and 'DATA_WRITE' logging, while exempting
        jose@example.com from DATA_READ logging.
      id: GoogleIamV1AuditLogConfig
      properties:
        exemptedMembers:
          description: >-
            Specifies the identities that do not cause logging for this type of
            permission. Follows the same format of Binding.members.
          items:
            type: string
          type: array
        logType:
          description: The log type that this config enables.
          enum:
            - LOG_TYPE_UNSPECIFIED
            - ADMIN_READ
            - DATA_WRITE
            - DATA_READ
          enumDescriptions:
            - Default case. Should never be this.
            - 'Admin reads. Example: CloudIAM getIamPolicy'
            - 'Data writes. Example: CloudSQL Users create'
            - 'Data reads. Example: CloudSQL Users list'
          type: string
      type: object
    GoogleIamV1Binding:
      description: Associates `members`, or principals, with a `role`.
      id: GoogleIamV1Binding
      properties:
        condition:
          $ref: '#/components/schemas/Expr'
          description: >-
            The condition that is associated with this binding. If the condition
            evaluates to `true`, then this binding applies to the current
            request. If the condition evaluates to `false`, then this binding
            does not apply to the current request. However, a different role
            binding might grant the same role to one or more of the principals
            in this binding. To learn which resources support conditions in
            their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
        members:
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. `members` can have the following values: * `allUsers`: A
            special identifier that represents anyone who is on the internet;
            with or without a Google account. * `allAuthenticatedUsers`: A
            special identifier that represents anyone who is authenticated with
            a Google account or a service account. Does not include identities
            that come from external identity providers (IdPs) through identity
            federation. * `user:{emailid}`: An email address that represents a
            specific Google account. For example, `alice@example.com` . *
            `serviceAccount:{emailid}`: An email address that represents a
            Google service account. For example,
            `my-other-app@appspot.gserviceaccount.com`. *
            `serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]`:
            An identifier for a [Kubernetes service
            account](https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example,
            `my-project.svc.id.goog[my-namespace/my-kubernetes-sa]`. *
            `group:{emailid}`: An email address that represents a Google group.
            For example, `admins@example.com`. * `domain:{domain}`: The G Suite
            domain (primary) that represents all the users of that domain. For
            example, `google.com` or `example.com`. *
            `principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workforce identity pool. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}`:
            All workforce identities in a group. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All workforce identities with a specific attribute value. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*`:
            All identities in a workforce identity pool. *
            `principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workload identity pool. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}`:
            A workload identity pool group. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All identities in a workload identity pool with a certain attribute.
            *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*`:
            All identities in a workload identity pool. *
            `deleted:user:{emailid}?uid={uniqueid}`: An email address (plus
            unique identifier) representing a user that has been recently
            deleted. For example, `alice@example.com?uid=123456789012345678901`.
            If the user is recovered, this value reverts to `user:{emailid}` and
            the recovered user retains the role in the binding. *
            `deleted:serviceAccount:{emailid}?uid={uniqueid}`: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            `my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901`.
            If the service account is undeleted, this value reverts to
            `serviceAccount:{emailid}` and the undeleted service account retains
            the role in the binding. * `deleted:group:{emailid}?uid={uniqueid}`:
            An email address (plus unique identifier) representing a Google
            group that has been recently deleted. For example,
            `admins@example.com?uid=123456789012345678901`. If the group is
            recovered, this value reverts to `group:{emailid}` and the recovered
            group retains the role in the binding. *
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            Deleted single identity in a workforce identity pool. For example,
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value`.
          items:
            type: string
          type: array
        role:
          description: >-
            Role that is assigned to the list of `members`, or principals. For
            example, `roles/viewer`, `roles/editor`, or `roles/owner`. For an
            overview of the IAM roles and permissions, see the [IAM
            documentation](https://cloud.google.com/iam/docs/roles-overview).
            For a list of the available pre-defined roles, see
            [here](https://cloud.google.com/iam/docs/understanding-roles).
          type: string
      type: object
    GoogleIamV1Policy:
      description: >-
        An Identity and Access Management (IAM) policy, which specifies access
        controls for Google Cloud resources. A `Policy` is a collection of
        `bindings`. A `binding` binds one or more `members`, or principals, to a
        single `role`. Principals can be user accounts, service accounts, Google
        groups, and domains (such as G Suite). A `role` is a named list of
        permissions; each `role` can be an IAM predefined role or a user-created
        custom role. For some types of Google Cloud resources, a `binding` can
        also specify a `condition`, which is a logical expression that allows
        access to a resource only if the expression evaluates to `true`. A
        condition can add constraints based on attributes of the request, the
        resource, or both. To learn which resources support conditions in their
        IAM policies, see the [IAM
        documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
        **JSON example:** ``` { "bindings": [ { "role":
        "roles/resourcemanager.organizationAdmin", "members": [
        "user:mike@example.com", "group:admins@example.com",
        "domain:google.com",
        "serviceAccount:my-project-id@appspot.gserviceaccount.com" ] }, {
        "role": "roles/resourcemanager.organizationViewer", "members": [
        "user:eve@example.com" ], "condition": { "title": "expirable access",
        "description": "Does not grant access after Sep 2020", "expression":
        "request.time < timestamp('2020-10-01T00:00:00.000Z')", } } ], "etag":
        "BwWWja0YfJA=", "version": 3 } ``` **YAML example:** ``` bindings: -
        members: - user:mike@example.com - group:admins@example.com -
        domain:google.com -
        serviceAccount:my-project-id@appspot.gserviceaccount.com role:
        roles/resourcemanager.organizationAdmin - members: -
        user:eve@example.com role: roles/resourcemanager.organizationViewer
        condition: title: expirable access description: Does not grant access
        after Sep 2020 expression: request.time <
        timestamp('2020-10-01T00:00:00.000Z') etag: BwWWja0YfJA= version: 3 ```
        For a description of IAM and its features, see the [IAM
        documentation](https://cloud.google.com/iam/docs/).
      id: GoogleIamV1Policy
      properties:
        auditConfigs:
          description: Specifies cloud audit logging configuration for this policy.
          items:
            $ref: '#/components/schemas/GoogleIamV1AuditConfig'
          type: array
        bindings:
          description: >-
            Associates a list of `members`, or principals, with a `role`.
            Optionally, may specify a `condition` that determines how and when
            the `bindings` are applied. Each of the `bindings` must contain at
            least one principal. The `bindings` in a `Policy` can refer to up to
            1,500 principals; up to 250 of these principals can be Google
            groups. Each occurrence of a principal counts towards these limits.
            For example, if the `bindings` grant 50 different roles to
            `user:alice@example.com`, and not to any other principal, then you
            can add another 1,450 principals to the `bindings` in the `Policy`.
          items:
            $ref: '#/components/schemas/GoogleIamV1Binding'
          type: array
        etag:
          description: >-
            `etag` is used for optimistic concurrency control as a way to help
            prevent simultaneous updates of a policy from overwriting each
            other. It is strongly suggested that systems make use of the `etag`
            in the read-modify-write cycle to perform policy updates in order to
            avoid race conditions: An `etag` is returned in the response to
            `getIamPolicy`, and systems are expected to put that etag in the
            request to `setIamPolicy` to ensure that their change will be
            applied to the same version of the policy. **Important:** If you use
            IAM Conditions, you must include the `etag` field whenever you call
            `setIamPolicy`. If you omit this field, then IAM allows you to
            overwrite a version `3` policy with a version `1` policy, and all of
            the conditions in the version `3` policy are lost.
          format: byte
          type: string
        version:
          description: >-
            Specifies the format of the policy. Valid values are `0`, `1`, and
            `3`. Requests that specify an invalid value are rejected. Any
            operation that affects conditional role bindings must specify
            version `3`. This requirement applies to the following operations: *
            Getting a policy that includes a conditional role binding * Adding a
            conditional role binding to a policy * Changing a conditional role
            binding in a policy * Removing any role binding, with or without a
            condition, from a policy that includes conditions **Important:** If
            you use IAM Conditions, you must include the `etag` field whenever
            you call `setIamPolicy`. If you omit this field, then IAM allows you
            to overwrite a version `3` policy with a version `1` policy, and all
            of the conditions in the version `3` policy are lost. If a policy
            does not include any conditions, operations on that policy may
            specify any valid version or leave the field unset. To learn which
            resources support conditions in their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
          format: int32
          type: integer
      type: object
    GoogleIamV1SetIamPolicyRequest:
      description: Request message for `SetIamPolicy` method.
      id: GoogleIamV1SetIamPolicyRequest
      properties:
        policy:
          $ref: '#/components/schemas/GoogleIamV1Policy'
          description: >-
            REQUIRED: The complete policy to be applied to the `resource`. The
            size of the policy is limited to a few 10s of KB. An empty policy is
            a valid policy but certain Google Cloud services (such as Projects)
            might reject them.
        updateMask:
          description: >-
            OPTIONAL: A FieldMask specifying which fields of the policy to
            modify. Only the fields in the mask will be modified. If no mask is
            provided, the following default mask is used: `paths: "bindings,
            etag"`
          format: google-fieldmask
          type: string
      type: object
    GoogleIamV1TestIamPermissionsRequest:
      description: Request message for `TestIamPermissions` method.
      id: GoogleIamV1TestIamPermissionsRequest
      properties:
        permissions:
          description: >-
            The set of permissions to check for the `resource`. Permissions with
            wildcards (such as `*` or `storage.*`) are not allowed. For more
            information see [IAM
            Overview](https://cloud.google.com/iam/docs/overview#permissions).
          items:
            type: string
          type: array
      type: object
    GoogleIamV1TestIamPermissionsResponse:
      description: Response message for `TestIamPermissions` method.
      id: GoogleIamV1TestIamPermissionsResponse
      properties:
        permissions:
          description: >-
            A subset of `TestPermissionsRequest.permissions` that the caller is
            allowed.
          items:
            type: string
          type: array
      type: object
    HttpHeaderMatch:
      description: Specification of HTTP header match attributes.
      id: HttpHeaderMatch
      properties:
        headerName:
          description: >-
            Required. The name of the HTTP header to match. For matching against
            the HTTP request's authority, use a headerMatch with the header name
            ":authority". For matching a request's method, use the headerName
            ":method".
          type: string
        regexMatch:
          description: >-
            Required. The value of the header must match the regular expression
            specified in regexMatch. For regular expression grammar, please see:
            en.cppreference.com/w/cpp/regex/ecmascript For matching against a
            port specified in the HTTP request, use a headerMatch with
            headerName set to Host and a regular expression that satisfies the
            RFC2616 Host header's port specifier.
          type: string
      type: object
    InterceptDeployment:
      description: >-
        A deployment represents a zonal intercept backend ready to accept
        GENEVE-encapsulated traffic, e.g. a zonal instance group fronted by an
        internal passthrough load balancer. Deployments are always part of a
        global deployment group which represents a global intercept service.
      id: InterceptDeployment
      properties:
        createTime:
          description: >-
            Output only. The timestamp when the resource was created. See
            https://google.aip.dev/148#timestamps.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. User-provided description of the deployment. Used as
            additional context for the deployment.
          type: string
        forwardingRule:
          description: >-
            Required. Immutable. The regional forwarding rule that fronts the
            interceptors, for example:
            `projects/123456789/regions/us-central1/forwardingRules/my-rule`.
            See https://google.aip.dev/124.
          type: string
        interceptDeploymentGroup:
          description: >-
            Required. Immutable. The deployment group that this deployment is a
            part of, for example:
            `projects/123456789/locations/global/interceptDeploymentGroups/my-dg`.
            See https://google.aip.dev/124.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Labels are key/value pairs that help to organize and
            filter resources.
          type: object
        name:
          description: >-
            Immutable. Identifier. The resource name of this deployment, for
            example:
            `projects/123456789/locations/us-central1-a/interceptDeployments/my-dep`.
            See https://google.aip.dev/122 for more details.
          type: string
        reconciling:
          description: >-
            Output only. The current state of the resource does not match the
            user's intended state, and the system is working to reconcile them.
            This part of the normal operation (e.g. linking a new association to
            the parent group). See https://google.aip.dev/128.
          readOnly: true
          type: boolean
        state:
          description: >-
            Output only. The current state of the deployment. See
            https://google.aip.dev/216.
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - CREATING
            - DELETING
            - OUT_OF_SYNC
            - DELETE_FAILED
          enumDescriptions:
            - State not set (this is not a valid state).
            - The deployment is ready and in sync with the parent group.
            - The deployment is being created.
            - The deployment is being deleted.
            - >-
              The deployment is out of sync with the parent group. In most
              cases, this is a result of a transient issue within the system
              (e.g. a delayed data-path config) and the system is expected to
              recover automatically. See the parent deployment group's state for
              more details.
            - >-
              An attempt to delete the deployment has failed. This is a terminal
              state and the deployment is not expected to recover. The only
              permitted operation is to retry deleting the deployment.
          readOnly: true
          type: string
        updateTime:
          description: >-
            Output only. The timestamp when the resource was most recently
            updated. See https://google.aip.dev/148#timestamps.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    InterceptDeploymentGroup:
      description: >-
        A deployment group aggregates many zonal intercept backends
        (deployments) into a single global intercept service. Consumers can
        connect this service using an endpoint group.
      id: InterceptDeploymentGroup
      properties:
        connectedEndpointGroups:
          description: >-
            Output only. The list of endpoint groups that are connected to this
            resource.
          items:
            $ref: >-
              #/components/schemas/InterceptDeploymentGroupConnectedEndpointGroup
          readOnly: true
          type: array
        createTime:
          description: >-
            Output only. The timestamp when the resource was created. See
            https://google.aip.dev/148#timestamps.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. User-provided description of the deployment group. Used as
            additional context for the deployment group.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Labels are key/value pairs that help to organize and
            filter resources.
          type: object
        locations:
          description: >-
            Output only. The list of locations where the deployment group is
            present.
          items:
            $ref: '#/components/schemas/InterceptLocation'
          readOnly: true
          type: array
        name:
          description: >-
            Immutable. Identifier. The resource name of this deployment group,
            for example:
            `projects/123456789/locations/global/interceptDeploymentGroups/my-dg`.
            See https://google.aip.dev/122 for more details.
          type: string
        nestedDeployments:
          deprecated: true
          description: >-
            Output only. The list of Intercept Deployments that belong to this
            group.
          items:
            $ref: '#/components/schemas/InterceptDeploymentGroupDeployment'
          readOnly: true
          type: array
        network:
          description: >-
            Required. Immutable. The network that will be used for all child
            deployments, for example:
            `projects/{project}/global/networks/{network}`. See
            https://google.aip.dev/124.
          type: string
        reconciling:
          description: >-
            Output only. The current state of the resource does not match the
            user's intended state, and the system is working to reconcile them.
            This is part of the normal operation (e.g. adding a new deployment
            to the group) See https://google.aip.dev/128.
          readOnly: true
          type: boolean
        state:
          description: >-
            Output only. The current state of the deployment group. See
            https://google.aip.dev/216.
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - CREATING
            - DELETING
          enumDescriptions:
            - State not set (this is not a valid state).
            - The deployment group is ready.
            - The deployment group is being created.
            - The deployment group is being deleted.
          readOnly: true
          type: string
        updateTime:
          description: >-
            Output only. The timestamp when the resource was most recently
            updated. See https://google.aip.dev/148#timestamps.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    InterceptDeploymentGroupConnectedEndpointGroup:
      description: An endpoint group connected to this deployment group.
      id: InterceptDeploymentGroupConnectedEndpointGroup
      properties:
        name:
          description: >-
            Output only. The connected endpoint group's resource name, for
            example:
            `projects/123456789/locations/global/interceptEndpointGroups/my-eg`.
            See https://google.aip.dev/124.
          readOnly: true
          type: string
      type: object
    InterceptDeploymentGroupDeployment:
      description: A deployment belonging to this deployment group.
      id: InterceptDeploymentGroupDeployment
      properties:
        name:
          description: >-
            Output only. The name of the Intercept Deployment, in the format:
            `projects/{project}/locations/{location}/interceptDeployments/{intercept_deployment}`.
          readOnly: true
          type: string
        state:
          description: Output only. Most recent known state of the deployment.
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - CREATING
            - DELETING
            - OUT_OF_SYNC
            - DELETE_FAILED
          enumDescriptions:
            - State not set (this is not a valid state).
            - The deployment is ready and in sync with the parent group.
            - The deployment is being created.
            - The deployment is being deleted.
            - >-
              The deployment is out of sync with the parent group. In most
              cases, this is a result of a transient issue within the system
              (e.g. a delayed data-path config) and the system is expected to
              recover automatically. See the parent deployment group's state for
              more details.
            - >-
              An attempt to delete the deployment has failed. This is a terminal
              state and the deployment is not expected to recover. The only
              permitted operation is to retry deleting the deployment.
          readOnly: true
          type: string
      type: object
    InterceptEndpointGroup:
      description: >-
        An endpoint group is a consumer frontend for a deployment group
        (backend). In order to configure intercept for a network, consumers must
        create: - An association between their network and the endpoint group. -
        A security profile that points to the endpoint group. - A firewall rule
        that references the security profile (group).
      id: InterceptEndpointGroup
      properties:
        associations:
          description: Output only. List of associations to this endpoint group.
          items:
            $ref: '#/components/schemas/InterceptEndpointGroupAssociationDetails'
          readOnly: true
          type: array
        connectedDeploymentGroup:
          $ref: '#/components/schemas/InterceptEndpointGroupConnectedDeploymentGroup'
          description: >-
            Output only. Details about the connected deployment group to this
            endpoint group.
          readOnly: true
        createTime:
          description: >-
            Output only. The timestamp when the resource was created. See
            https://google.aip.dev/148#timestamps.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. User-provided description of the endpoint group. Used as
            additional context for the endpoint group.
          type: string
        interceptDeploymentGroup:
          description: >-
            Required. Immutable. The deployment group that this endpoint group
            is connected to, for example:
            `projects/123456789/locations/global/interceptDeploymentGroups/my-dg`.
            See https://google.aip.dev/124.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Labels are key/value pairs that help to organize and
            filter resources.
          type: object
        name:
          description: >-
            Immutable. Identifier. The resource name of this endpoint group, for
            example:
            `projects/123456789/locations/global/interceptEndpointGroups/my-eg`.
            See https://google.aip.dev/122 for more details.
          type: string
        reconciling:
          description: >-
            Output only. The current state of the resource does not match the
            user's intended state, and the system is working to reconcile them.
            This is part of the normal operation (e.g. adding a new association
            to the group). See https://google.aip.dev/128.
          readOnly: true
          type: boolean
        state:
          description: >-
            Output only. The current state of the endpoint group. See
            https://google.aip.dev/216.
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - CLOSED
            - CREATING
            - DELETING
            - OUT_OF_SYNC
            - DELETE_FAILED
          enumDescriptions:
            - State not set (this is not a valid state).
            - >-
              The endpoint group is ready and in sync with the target deployment
              group.
            - >-
              The deployment group backing this endpoint group has been
              force-deleted. This endpoint group cannot be used and interception
              is effectively disabled.
            - The endpoint group is being created.
            - The endpoint group is being deleted.
            - >-
              The endpoint group is out of sync with the backing deployment
              group. In most cases, this is a result of a transient issue within
              the system (e.g. an inaccessible location) and the system is
              expected to recover automatically. See the associations field for
              details per network and location.
            - >-
              An attempt to delete the endpoint group has failed. This is a
              terminal state and the endpoint group is not expected to recover.
              The only permitted operation is to retry deleting the endpoint
              group.
          readOnly: true
          type: string
        updateTime:
          description: >-
            Output only. The timestamp when the resource was most recently
            updated. See https://google.aip.dev/148#timestamps.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    InterceptEndpointGroupAssociation:
      description: >-
        An endpoint group association represents a link between a network and an
        endpoint group in the organization. Creating an association creates the
        networking infrastructure linking the network to the endpoint group, but
        does not enable intercept by itself. To enable intercept, the user must
        also create a network firewall policy containing intercept rules and
        associate it with the network.
      id: InterceptEndpointGroupAssociation
      properties:
        createTime:
          description: >-
            Output only. The timestamp when the resource was created. See
            https://google.aip.dev/148#timestamps.
          format: google-datetime
          readOnly: true
          type: string
        interceptEndpointGroup:
          description: >-
            Required. Immutable. The endpoint group that this association is
            connected to, for example:
            `projects/123456789/locations/global/interceptEndpointGroups/my-eg`.
            See https://google.aip.dev/124.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Labels are key/value pairs that help to organize and
            filter resources.
          type: object
        locations:
          description: >-
            Output only. The list of locations where the association is
            configured. This information is retrieved from the linked endpoint
            group.
          items:
            $ref: '#/components/schemas/InterceptLocation'
