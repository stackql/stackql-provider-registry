          description: >-
            Identifier. Resource name, in the form
            `projects/{project}/locations/{location}/sacAttachments/{sac_attachment}`.
          type: string
        nccGateway:
          description: >-
            Required. NCC Gateway associated with the attachment. This can be
            input as an ID or a full resource name. The output always has the
            form
            `projects/{project_number}/locations/{location}/spokes/{ncc_gateway}`.
          type: string
        sacRealm:
          description: >-
            Required. SAC Realm which owns the attachment. This can be input as
            an ID or a full resource name. The output always has the form
            `projects/{project_number}/locations/{location}/sacRealms/{sac_realm}`.
          type: string
        state:
          description: Output only. State of the attachment.
          enum:
            - STATE_UNSPECIFIED
            - PENDING_PARTNER_ATTACHMENT
            - PARTNER_ATTACHED
            - PARTNER_DETACHED
          enumDescriptions:
            - No state specified. This should not be used.
            - Has never been attached to a partner.
            - Currently attached to a partner.
            - Was once attached to a partner but has been detached.
          readOnly: true
          type: string
        updateTime:
          description: Output only. Timestamp when the attachment was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    SACRealm:
      description: >-
        Represents a Secure Access Connect (SAC) realm resource. A Secure Access
        Connect realm establishes a connection between your Google Cloud project
        and an SSE service.
      id: SACRealm
      properties:
        createTime:
          description: Output only. Timestamp when the realm was created.
          format: google-datetime
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Optional list of labels applied to the resource.
          type: object
        name:
          description: >-
            Identifier. Resource name, in the form
            `projects/{project}/locations/global/sacRealms/{sacRealm}`.
          type: string
        pairingKey:
          $ref: '#/components/schemas/SACRealmPairingKey'
          description: >-
            Output only. Key to be shared with SSE service provider during
            pairing.
          readOnly: true
        securityService:
          description: Immutable. SSE service provider associated with the realm.
          enum:
            - SECURITY_SERVICE_UNSPECIFIED
            - PALO_ALTO_PRISMA_ACCESS
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - >-
              [Palo Alto Networks Prisma
              Access](https://www.paloaltonetworks.com/sase/access).
          type: string
        state:
          description: Output only. State of the realm.
          enum:
            - STATE_UNSPECIFIED
            - PENDING_PARTNER_ATTACHMENT
            - PARTNER_ATTACHED
            - PARTNER_DETACHED
            - KEY_EXPIRED
          enumDescriptions:
            - No state specified. This should not be used.
            - Has never been attached to a partner. Used only for Prisma Access.
            - Currently attached to a partner.
            - Was once attached to a partner but has been detached.
            - >-
              Is not attached to a partner and has an expired pairing key. Used
              only for Prisma Access.
          readOnly: true
          type: string
        updateTime:
          description: Output only. Timestamp when the realm was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    SACRealmPairingKey:
      description: >-
        Key to be shared with SSE service provider to establish global
        handshake.
      id: SACRealmPairingKey
      properties:
        expireTime:
          description: >-
            Output only. Timestamp in UTC of when this resource is considered
            expired. It expires 7 days after creation.
          format: google-datetime
          readOnly: true
          type: string
        key:
          description: Output only. Key value.
          readOnly: true
          type: string
      type: object
    SecurityProfile:
      description: >-
        SecurityProfile is a resource that defines the behavior for one of many
        ProfileTypes.
      id: SecurityProfile
      properties:
        createTime:
          description: Output only. Resource creation timestamp.
          format: google-datetime
          readOnly: true
          type: string
        customInterceptProfile:
          $ref: '#/components/schemas/CustomInterceptProfile'
          description: The custom TPPI configuration for the SecurityProfile.
        customMirroringProfile:
          $ref: '#/components/schemas/CustomMirroringProfile'
          description: >-
            The custom Packet Mirroring v2 configuration for the
            SecurityProfile.
        description:
          description: >-
            Optional. An optional description of the profile. Max length 512
            characters.
          type: string
        etag:
          description: >-
            Output only. This checksum is computed by the server based on the
            value of other fields, and may be sent on update and delete requests
            to ensure the client has an up-to-date value before proceeding.
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Labels as key value pairs.
          type: object
        name:
          description: >-
            Immutable. Identifier. Name of the SecurityProfile resource. It
            matches pattern
            `projects|organizations/*/locations/{location}/securityProfiles/{security_profile}`.
          type: string
        threatPreventionProfile:
          $ref: '#/components/schemas/ThreatPreventionProfile'
          description: The threat prevention configuration for the SecurityProfile.
        type:
          description: >-
            Immutable. The single ProfileType that the SecurityProfile resource
            configures.
          enum:
            - PROFILE_TYPE_UNSPECIFIED
            - THREAT_PREVENTION
            - CUSTOM_MIRRORING
            - CUSTOM_INTERCEPT
            - URL_FILTERING
          enumDescriptions:
            - Profile type not specified.
            - Profile type for threat prevention.
            - Profile type for packet mirroring v2
            - Profile type for TPPI.
            - Profile type for URL filtering.
          type: string
        updateTime:
          description: Output only. Last resource update timestamp.
          format: google-datetime
          readOnly: true
          type: string
        urlFilteringProfile:
          $ref: '#/components/schemas/UrlFilteringProfile'
          description: The URL filtering configuration for the SecurityProfile.
      type: object
    SecurityProfileGroup:
      description: >-
        SecurityProfileGroup is a resource that defines the behavior for various
        ProfileTypes.
      id: SecurityProfileGroup
      properties:
        createTime:
          description: Output only. Resource creation timestamp.
          format: google-datetime
          readOnly: true
          type: string
        customInterceptProfile:
          description: >-
            Optional. Reference to a SecurityProfile with the CustomIntercept
            configuration.
          type: string
        customMirroringProfile:
          description: >-
            Optional. Reference to a SecurityProfile with the CustomMirroring
            configuration.
          type: string
        dataPathId:
          description: >-
            Output only. Identifier used by the data-path. Unique within
            `{container, location}`.
          format: uint64
          readOnly: true
          type: string
        description:
          description: >-
            Optional. An optional description of the profile group. Max length
            2048 characters.
          type: string
        etag:
          description: >-
            Output only. This checksum is computed by the server based on the
            value of other fields, and may be sent on update and delete requests
            to ensure the client has an up-to-date value before proceeding.
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Labels as key value pairs.
          type: object
        name:
          description: >-
            Immutable. Identifier. Name of the SecurityProfileGroup resource. It
            matches pattern
            `projects|organizations/*/locations/{location}/securityProfileGroups/{security_profile_group}`.
          type: string
        threatPreventionProfile:
          description: >-
            Optional. Reference to a SecurityProfile with the ThreatPrevention
            configuration.
          type: string
        updateTime:
          description: Output only. Last resource update timestamp.
          format: google-datetime
          readOnly: true
          type: string
        urlFilteringProfile:
          description: >-
            Optional. Reference to a SecurityProfile with the UrlFiltering
            configuration.
          type: string
      type: object
    ServerTlsPolicy:
      description: >-
        ServerTlsPolicy is a resource that specifies how a server should
        authenticate incoming requests. This resource itself does not affect
        configuration unless it is attached to a target HTTPS proxy or endpoint
        config selector resource. ServerTlsPolicy in the form accepted by
        Application Load Balancers can be attached only to TargetHttpsProxy with
        an `EXTERNAL`, `EXTERNAL_MANAGED` or `INTERNAL_MANAGED` load balancing
        scheme. Traffic Director compatible ServerTlsPolicies can be attached to
        EndpointPolicy and TargetHttpsProxy with Traffic Director
        `INTERNAL_SELF_MANAGED` load balancing scheme.
      id: ServerTlsPolicy
      properties:
        allowOpen:
          description: >-
            This field applies only for Traffic Director policies. It is must be
            set to false for Application Load Balancer policies. Determines if
            server allows plaintext connections. If set to true, server allows
            plain text connections. By default, it is set to false. This setting
            is not exclusive of other encryption modes. For example, if
            `allow_open` and `mtls_policy` are set, server allows both plain
            text and mTLS connections. See documentation of other encryption
            modes to confirm compatibility. Consider using it if you wish to
            upgrade in place your deployment to TLS while having mixed TLS and
            non-TLS traffic reaching port :80.
          type: boolean
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Free-text description of the resource.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Set of label tags associated with the resource.
          type: object
        mtlsPolicy:
          $ref: '#/components/schemas/MTLSPolicy'
          description: >-
            This field is required if the policy is used with Application Load
            Balancers. This field can be empty for Traffic Director. Defines a
            mechanism to provision peer validation certificates for peer to peer
            authentication (Mutual TLS - mTLS). If not specified, client
            certificate will not be requested. The connection is treated as TLS
            and not mTLS. If `allow_open` and `mtls_policy` are set, server
            allows both plain text and mTLS connections.
        name:
          description: >-
            Required. Name of the ServerTlsPolicy resource. It matches the
            pattern
            `projects/*/locations/{location}/serverTlsPolicies/{server_tls_policy}`
          type: string
        serverCertificate:
          $ref: '#/components/schemas/GoogleCloudNetworksecurityV1CertificateProvider'
          description: >-
            Optional if policy is to be used with Traffic Director. For
            Application Load Balancers must be empty. Defines a mechanism to
            provision server identity (public and private keys). Cannot be
            combined with `allow_open` as a permissive mode that allows both
            plain text and TLS is not supported.
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    SeverityOverride:
      description: Defines what action to take for a specific severity match.
      id: SeverityOverride
      properties:
        action:
          description: Required. Threat action override.
          enum:
            - THREAT_ACTION_UNSPECIFIED
            - DEFAULT_ACTION
            - ALLOW
            - ALERT
            - DENY
          enumDescriptions:
            - Threat action not specified.
            - The default action (as specified by the vendor) is taken.
            - The packet matching this rule will be allowed to transmit.
            - >-
              The packet matching this rule will be allowed to transmit, but a
              threat_log entry will be sent to the consumer project.
            - >-
              The packet matching this rule will be dropped, and a threat_log
              entry will be sent to the consumer project.
          type: string
        severity:
          description: Required. Severity level to match.
          enum:
            - SEVERITY_UNSPECIFIED
            - INFORMATIONAL
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
          enumDescriptions:
            - Severity level not specified.
            - >-
              Suspicious events that do not pose an immediate threat, but that
              are reported to call attention to deeper problems that could
              possibly exist.
            - >-
              Warning-level threats that have very little impact on an
              organization's infrastructure. They usually require local or
              physical system access and may often result in victim privacy
              issues and information leakage.
            - >-
              Minor threats in which impact is minimized, that do not compromise
              the target or exploits that require an attacker to reside on the
              same local network as the victim, affect only non-standard
              configurations or obscure applications, or provide very limited
              access.
            - >-
              Threats that have the ability to become critical but have
              mitigating factors; for example, they may be difficult to exploit,
              do not result in elevated privileges, or do not have a large
              victim pool.
            - >-
              Serious threats, such as those that affect default installations
              of widely deployed software, result in root compromise of servers,
              and the exploit code is widely available to attackers. The
              attacker usually does not need any special authentication
              credentials or knowledge about the individual victims and the
              target does not need to be manipulated into performing any special
              functions.
          type: string
      type: object
    Source:
      description: Specification of traffic source attributes.
      id: Source
      properties:
        ipBlocks:
          description: >-
            Optional. List of CIDR ranges to match based on source IP address.
            At least one IP block should match. Single IP (e.g., "1.2.3.4") and
            CIDR (e.g., "1.2.3.0/24") are supported. Authorization based on
            source IP alone should be avoided. The IP addresses of any load
            balancers or proxies should be considered untrusted.
          items:
            type: string
          type: array
        principals:
          description: >-
            Optional. List of peer identities to match for authorization. At
            least one principal should match. Each peer can be an exact match,
            or a prefix match (example, "namespace/*") or a suffix match
            (example, "*/service-account") or a presence match "*".
            Authorization based on the principal name without certificate
            validation (configured by ServerTlsPolicy resource) is considered
            insecure.
          items:
            type: string
          type: array
      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      type: object
    ThreatOverride:
      description: Defines what action to take for a specific threat_id match.
      id: ThreatOverride
      properties:
        action:
          description: >-
            Required. Threat action override. For some threat types, only a
            subset of actions applies.
          enum:
            - THREAT_ACTION_UNSPECIFIED
            - DEFAULT_ACTION
            - ALLOW
            - ALERT
            - DENY
          enumDescriptions:
            - Threat action not specified.
            - The default action (as specified by the vendor) is taken.
            - The packet matching this rule will be allowed to transmit.
            - >-
              The packet matching this rule will be allowed to transmit, but a
              threat_log entry will be sent to the consumer project.
            - >-
              The packet matching this rule will be dropped, and a threat_log
              entry will be sent to the consumer project.
          type: string
        threatId:
          description: Required. Vendor-specific ID of a threat to override.
          type: string
        type:
          description: Output only. Type of the threat (read only).
          enum:
            - THREAT_TYPE_UNSPECIFIED
            - UNKNOWN
            - VULNERABILITY
            - ANTIVIRUS
            - SPYWARE
            - DNS
          enumDescriptions:
            - Type of threat not specified.
            - >-
              Type of threat is not derivable from threat ID. An override will
              be created for all types. Firewall will ignore overridden
              signature ID's that don't exist in the specific type.
            - >-
              Threats related to system flaws that an attacker might otherwise
              attempt to exploit.
            - >-
              Threats related to viruses and malware found in executables and
              file types.
            - >-
              Threats related to command-and-control (C2) activity, where
              spyware on an infected client is collecting data without the
              user's consent and/or communicating with a remote attacker.
            - Threats related to DNS.
          readOnly: true
          type: string
      type: object
    ThreatPreventionProfile:
      description: >-
        ThreatPreventionProfile defines an action for specific threat signatures
        or severity levels.
      id: ThreatPreventionProfile
      properties:
        antivirusOverrides:
          description: >-
            Optional. Configuration for overriding antivirus actions per
            protocol.
          items:
            $ref: '#/components/schemas/AntivirusOverride'
          type: array
        severityOverrides:
          description: >-
            Optional. Configuration for overriding threats actions by severity
            match.
          items:
            $ref: '#/components/schemas/SeverityOverride'
          type: array
        threatOverrides:
          description: >-
            Optional. Configuration for overriding threats actions by threat_id
            match. If a threat is matched both by configuration provided in
            severity_overrides and threat_overrides, the threat_overrides action
            is applied.
          items:
            $ref: '#/components/schemas/ThreatOverride'
          type: array
      type: object
    TlsInspectionPolicy:
      description: >-
        The TlsInspectionPolicy resource contains references to CA pools in
        Certificate Authority Service and associated metadata.
      id: TlsInspectionPolicy
      properties:
        caPool:
          description: >-
            Required. A CA pool resource used to issue interception
            certificates. The CA pool string has a relative resource path
            following the form
            "projects/{project}/locations/{location}/caPools/{ca_pool}".
          type: string
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        customTlsFeatures:
          description: >-
            Optional. List of custom TLS cipher suites selected. This field is
            valid only if the selected tls_feature_profile is CUSTOM. The
            compute.SslPoliciesService.ListAvailableFeatures method returns the
            set of features that can be specified in this list. Note that Secure
            Web Proxy does not yet honor this field.
          items:
            type: string
          type: array
        description:
          description: Optional. Free-text description of the resource.
          type: string
        excludePublicCaSet:
          description: >-
            Optional. If FALSE (the default), use our default set of public CAs
            in addition to any CAs specified in trust_config. These public CAs
            are currently based on the Mozilla Root Program and are subject to
            change over time. If TRUE, do not accept our default set of public
            CAs. Only CAs specified in trust_config will be accepted. This
            defaults to FALSE (use public CAs in addition to trust_config) for
            backwards compatibility, but trusting public root CAs is *not
            recommended* unless the traffic in question is outbound to public
            web servers. When possible, prefer setting this to "false" and
            explicitly specifying trusted CAs and certificates in a TrustConfig.
            Note that Secure Web Proxy does not yet honor this field.
          type: boolean
        minTlsVersion:
          description: >-
            Optional. Minimum TLS version that the firewall should use when
            negotiating connections with both clients and servers. If this is
            not set, then the default value is to allow the broadest set of
            clients and servers (TLS 1.0 or higher). Setting this to more
            restrictive values may improve security, but may also prevent the
            firewall from connecting to some clients or servers. Note that
            Secure Web Proxy does not yet honor this field.
          enum:
            - TLS_VERSION_UNSPECIFIED
            - TLS_1_0
            - TLS_1_1
            - TLS_1_2
            - TLS_1_3
          enumDescriptions:
            - Indicates no TLS version was specified.
            - TLS 1.0
            - TLS 1.1
            - TLS 1.2
            - TLS 1.3
          type: string
        name:
          description: >-
            Required. Name of the resource. Name is of the form
            projects/{project}/locations/{location}/tlsInspectionPolicies/{tls_inspection_policy}
            tls_inspection_policy should match the
            pattern:(^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$).
          type: string
        tlsFeatureProfile:
          description: >-
            Optional. The selected Profile. If this is not set, then the default
            value is to allow the broadest set of clients and servers
            ("PROFILE_COMPATIBLE"). Setting this to more restrictive values may
            improve security, but may also prevent the TLS inspection proxy from
            connecting to some clients or servers. Note that Secure Web Proxy
            does not yet honor this field.
          enum:
            - PROFILE_UNSPECIFIED
            - PROFILE_COMPATIBLE
            - PROFILE_MODERN
            - PROFILE_RESTRICTED
            - PROFILE_CUSTOM
          enumDescriptions:
            - Indicates no profile was specified.
            - >-
              Compatible profile. Allows the broadest set of clients, even those
              which support only out-of-date SSL features to negotiate with the
              TLS inspection proxy.
            - >-
              Modern profile. Supports a wide set of SSL features, allowing
              modern clients to negotiate SSL with the TLS inspection proxy.
            - >-
              Restricted profile. Supports a reduced set of SSL features,
              intended to meet stricter compliance requirements.
            - >-
              Custom profile. Allow only the set of allowed SSL features
              specified in the custom_features field of SslPolicy.
          type: string
        trustConfig:
          description: >-
            Optional. A TrustConfig resource used when making a connection to
            the TLS server. This is a relative resource path following the form
            "projects/{project}/locations/{location}/trustConfigs/{trust_config}".
            This is necessary to intercept TLS connections to servers with
            certificates signed by a private CA or self-signed certificates.
            Note that Secure Web Proxy does not yet honor this field.
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    UrlFilter:
      description: A URL filter defines an action to take for some URL match.
      id: UrlFilter
      properties:
        filteringAction:
          description: Required. The action taken when this filter is applied.
          enum:
            - URL_FILTERING_ACTION_UNSPECIFIED
            - ALLOW
            - DENY
          enumDescriptions:
            - Filtering action not specified.
            - The connection matching this filter will be allowed to transmit.
            - The connection matching this filter will be dropped.
          type: string
        priority:
          description: >-
            Required. The priority of this filter within the URL Filtering
            Profile. Lower integers indicate higher priorities. The priority of
            a filter must be unique within a URL Filtering Profile.
          format: int32
          type: integer
        urls:
          description: >-
            Required. The list of strings that a URL must match with for this
            filter to be applied.
          items:
            type: string
          type: array
      type: object
    UrlFilteringProfile:
      description: UrlFilteringProfile defines filters based on URL.
      id: UrlFilteringProfile
      properties:
        urlFilters:
          description: >-
            Optional. The list of filtering configs in which each config defines
            an action to take for some URL match.
          items:
            $ref: '#/components/schemas/UrlFilter'
          type: array
      type: object
    UrlList:
      description: >-
        UrlList proto helps users to set reusable, independently manageable
        lists of hosts, host patterns, URLs, URL patterns.
      id: UrlList
      properties:
        createTime:
          description: Output only. Time when the security policy was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Free-text description of the resource.
          type: string
        name:
          description: >-
            Required. Name of the resource provided by the user. Name is of the
            form projects/{project}/locations/{location}/urlLists/{url_list}
            url_list should match the
            pattern:(^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$).
          type: string
        updateTime:
          description: Output only. Time when the security policy was updated.
          format: google-datetime
          readOnly: true
          type: string
        values:
          description: Required. FQDNs and URLs.
          items:
            type: string
          type: array
      type: object
    ValidationCA:
      description: >-
        Specification of ValidationCA. Defines the mechanism to obtain the
        Certificate Authority certificate to validate the peer certificate.
      id: ValidationCA
      properties:
        certificateProviderInstance:
          $ref: '#/components/schemas/CertificateProviderInstance'
          description: >-
            The certificate provider instance specification that will be passed
            to the data plane, which will be used to load necessary credential
            information.
        grpcEndpoint:
          $ref: '#/components/schemas/GoogleCloudNetworksecurityV1GrpcEndpoint'
          description: >-
            gRPC specific configuration to access the gRPC server to obtain the
            CA certificate.
      type: object
  securitySchemes:
    Oauth2:
      description: Oauth 2.0 implicit authentication
      flows:
