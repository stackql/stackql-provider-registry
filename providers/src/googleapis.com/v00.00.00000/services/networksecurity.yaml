            openAPIDocKey: '200'
        organizations_locations_address_groups_create:
          operation:
            $ref: >-
              #/paths/~1v1~1organizations~1{organizationsId}~1locations~1{locationsId}~1addressGroups/post
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        organizations_locations_address_groups_delete:
          operation:
            $ref: >-
