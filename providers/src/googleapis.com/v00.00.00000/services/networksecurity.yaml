            is connected to, for example:
            `projects/123456789/locations/global/interceptDeploymentGroups/my-dg`.
            See https://google.aip.dev/124.
          type: string
        reconciling:
          description: >-
            Output only. The current state of the resource does not match the
            user's intended state, and the system is working to reconcile them.
