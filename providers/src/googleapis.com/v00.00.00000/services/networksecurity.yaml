            - ACTIVE
            - CREATING
            - DELETING
            - OUT_OF_SYNC
            - DELETE_FAILED
          enumDescriptions:
            - State not set (this is not a valid state).
            - The deployment is ready and in sync with the parent group.
            - The deployment is being created.
            - The deployment is being deleted.
            - >-
              The deployment is out of sync with the parent group. In most
              cases, this is a result of a transient issue within the system
              (e.g. a delayed data-path config) and the system is expected to
              recover automatically. See the parent deployment group's state for
              more details.
            - >-
              An attempt to delete the deployment has failed. This is a terminal
              state and the deployment is not expected to recover. The only
              permitted operation is to retry deleting the deployment.
