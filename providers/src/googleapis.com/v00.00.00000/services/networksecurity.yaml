      description: Describes the properties of a principal to be matched against.
      type: object
      properties:
        principal:
          description: >-
            Required. A non-empty string whose value is matched against the
            principal value based on the principal_selector. Only exact match
            can be applied for CLIENT_CERT_URI_SAN, CLIENT_CERT_DNS_NAME_SAN,
            CLIENT_CERT_COMMON_NAME selectors.
          $ref: '#/components/schemas/AuthzPolicyAuthzRuleStringMatch'
        principalSelector:
          enum:
            - PRINCIPAL_SELECTOR_UNSPECIFIED
            - CLIENT_CERT_URI_SAN
            - CLIENT_CERT_DNS_NAME_SAN
            - CLIENT_CERT_COMMON_NAME
          description: >-
            Optional. An enum to decide what principal value the principal rule
            will match against. If not specified, the PrincipalSelector is
            CLIENT_CERT_URI_SAN.
          type: string
          enumDescriptions:
            - >-
              Unspecified principal selector. It will be treated as
              CLIENT_CERT_URI_SAN by default.
            - >-
              The principal rule is matched against a list of URI SANs in the
              validated client's certificate. A match happens when there is any
              exact URI SAN value match. This is the default principal selector.
            - >-
              The principal rule is matched against a list of DNS Name SANs in
              the validated client's certificate. A match happens when there is
              any exact DNS Name SAN value match. This is only applicable for
              Application Load Balancers except for classic Global External
              Application load balancer. CLIENT_CERT_DNS_NAME_SAN is not
              supported for INTERNAL_SELF_MANAGED load balancing scheme.
            - >-
              The principal rule is matched against the common name in the
              client's certificate. Authorization against multiple common names
              in the client certificate is not supported. Requests with multiple
              common names in the client certificate will be rejected if
              CLIENT_CERT_COMMON_NAME is set as the principal selector. A match
              happens when there is an exact common name value match. This is
              only applicable for Application Load Balancers and not for Classic
              Application Load Balancer. CLIENT_CERT_COMMON_NAME is not
              supported for INTERNAL_SELF_MANAGED load balancing scheme.
    GoogleIamV1AuditConfig:
      id: GoogleIamV1AuditConfig
      description: >-
        Specifies the audit configuration for a service. The configuration
        determines which permission types are logged, and what identities, if
        any, are exempted from logging. An AuditConfig must have one or more
        AuditLogConfigs. If there are AuditConfigs for both `allServices` and a
        specific service, the union of the two AuditConfigs is used for that
        service: the log_types specified in each AuditConfig are enabled, and
        the exempted_members in each AuditLogConfig are exempted. Example Policy
        with multiple AuditConfigs: { "audit_configs": [ { "service":
        "allServices", "audit_log_configs": [ { "log_type": "DATA_READ",
        "exempted_members": [ "user:jose@example.com" ] }, { "log_type":
        "DATA_WRITE" }, { "log_type": "ADMIN_READ" } ] }, { "service":
        "sampleservice.googleapis.com", "audit_log_configs": [ { "log_type":
        "DATA_READ" }, { "log_type": "DATA_WRITE", "exempted_members": [
        "user:aliya@example.com" ] } ] } ] } For sampleservice, this policy
        enables DATA_READ, DATA_WRITE and ADMIN_READ logging. It also exempts
        `jose@example.com` from DATA_READ logging, and `aliya@example.com` from
        DATA_WRITE logging.
      type: object
      properties:
        service:
          description: >-
            Specifies a service that will be enabled for audit logging. For
            example, `storage.googleapis.com`, `cloudsql.googleapis.com`.
            `allServices` is a special value that covers all services.
          type: string
        auditLogConfigs:
          description: The configuration for logging of each type of permission.
          type: array
          items:
            $ref: '#/components/schemas/GoogleIamV1AuditLogConfig'
