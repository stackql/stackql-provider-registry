    BackendAuthenticationConfig:
      id: BackendAuthenticationConfig
      description: >-
        BackendAuthenticationConfig message groups the TrustConfig together with
        other settings that control how the load balancer authenticates, and
        expresses its identity to, the backend: * `trustConfig` is the attached
        TrustConfig. * `wellKnownRoots` indicates whether the load balance
        should trust backend server certificates that are issued by public
        certificate authorities, in addition to certificates trusted by the
        TrustConfig. * `clientCertificate` is a client certificate that the load
        balancer uses to express its identity to the backend, if the connection
        to the backend uses mTLS. You can attach the BackendAuthenticationConfig
        to the load balancer's BackendService directly determining how that
        BackendService negotiates TLS.
      type: object
      properties:
        name:
          description: >-
            Required. Name of the BackendAuthenticationConfig resource. It
            matches the pattern
            `projects/*/locations/{location}/backendAuthenticationConfigs/{backend_authentication_config}`
          type: string
        etag:
          description: Output only. Etag of the resource.
          readOnly: true
          type: string
        clientCertificate:
          description: >-
            Optional. A reference to a
            certificatemanager.googleapis.com.Certificate resource. This is a
            relative resource path following the form
            "projects/{project}/locations/{location}/certificates/{certificate}".
            Used by a BackendService to negotiate mTLS when the backend
            connection uses TLS and the backend requests a client certificate.
            Must have a CLIENT_AUTH scope.
          type: string
        description:
          description: Optional. Free-text description of the resource.
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
          description: Set of label tags associated with the resource.
        wellKnownRoots:
          type: string
          enumDescriptions:
            - Equivalent to NONE.
            - >-
              The BackendService will only validate server certificates against
              roots specified in TrustConfig.
            - >-
              The BackendService uses a set of well-known public roots, in
              addition to any roots specified in the trustConfig field, when
              validating the server certificates presented by the backend.
              Validation with these roots is only considered when the
              TlsSettings.sni field in the BackendService is set. The well-known
              roots are a set of root CAs managed by Google. CAs in this set can
              be added or removed without notice.
          description: Well known roots to use for server certificate validation.
          enum:
            - WELL_KNOWN_ROOTS_UNSPECIFIED
            - NONE
            - PUBLIC_ROOTS
        updateTime:
          readOnly: true
          type: string
          format: google-datetime
          description: Output only. The timestamp when the resource was updated.
        createTime:
          format: google-datetime
          description: Output only. The timestamp when the resource was created.
          readOnly: true
          type: string
        trustConfig:
          type: string
          description: >-
            Optional. A reference to a TrustConfig resource from the
            certificatemanager.googleapis.com namespace. This is a relative
            resource path following the form
            "projects/{project}/locations/{location}/trustConfigs/{trust_config}".
            A BackendService uses the chain of trust represented by this
            TrustConfig, if specified, to validate the server certificates
            presented by the backend. Required unless wellKnownRoots is set to
            PUBLIC_ROOTS.
