            to the group). See https://google.aip.dev/128.
          readOnly: true
          type: boolean
        createTime:
          format: google-datetime
          description: >-
            Output only. The timestamp when the resource was created. See
            https://google.aip.dev/148#timestamps.
          readOnly: true
          type: string
