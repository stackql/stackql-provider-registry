          description: >-
            Optional. The peer database name to switch over to. Required for
            cross-region standby, and must be omitted for in-region Data Guard.
          type: string
      type: object
    TestConnectionAssignmentError:
      description: Error details for TestGoldengateConnectionAssignment.
      id: TestConnectionAssignmentError
      properties:
        action:
          description: The text describing the action required to fix the issue.
          type: string
        code:
          description: >-
            A short error code that defines the error, meant for programmatic
            parsing.
          type: string
        issue:
          description: The text describing the root cause of the reported issue.
          type: string
        message:
          description: A human-readable error message.
          type: string
      type: object
    TestGoldengateConnectionAssignmentRequest:
      description: Request message for TestGoldengateConnectionAssignment.
      id: TestGoldengateConnectionAssignmentRequest
      properties:
        type:
          description: >-
            Optional. The type of the test of the assigned connection. The only
            type actually supported is DEFAULT.
          enum:
            - TEST_TYPE_UNSPECIFIED
            - DEFAULT
          enumDescriptions:
            - The default value. This value is unused.
            - The default connection test.
          type: string
      type: object
    TestGoldengateConnectionAssignmentResponse:
      description: >-
        The result of the connectivity test performed between the Goldengate
        deployment and the associated database / service.
      id: TestGoldengateConnectionAssignmentResponse
      properties:
        error:
          $ref: '#/components/schemas/TestConnectionAssignmentError'
          description: Error details if test connection failed.
        errors:
          description: List of test connection assignment error objects.
          items:
            $ref: '#/components/schemas/TestConnectionAssignmentError'
          type: array
        resultType:
          description: Type of the result i.e. Success, Failure or Timeout.
          enum:
            - RESULT_TYPE_UNSPECIFIED
            - SUCCEEDED
            - FAILED
            - TIMED_OUT
          enumDescriptions:
            - Result type is unspecified.
            - Test connection succeeded.
            - Test connection failed.
            - Test connection timed out.
          type: string
      type: object
    TimeOfDay:
      description: >-
        Represents a time of day. The date and time zone are either not
        significant or are specified elsewhere. An API may choose to allow leap
        seconds. Related types are google.type.Date and
        `google.protobuf.Timestamp`.
      id: TimeOfDay
      properties:
        hours:
          description: >-
            Hours of a day in 24 hour format. Must be greater than or equal to 0
            and typically must be less than or equal to 23. An API may choose to
            allow the value "24:00:00" for scenarios like business closing time.
          format: int32
          type: integer
        minutes:
          description: >-
            Minutes of an hour. Must be greater than or equal to 0 and less than
            or equal to 59.
          format: int32
          type: integer
        nanos:
          description: >-
            Fractions of seconds, in nanoseconds. Must be greater than or equal
            to 0 and less than or equal to 999,999,999.
          format: int32
          type: integer
        seconds:
          description: >-
            Seconds of a minute. Must be greater than or equal to 0 and
            typically must be less than or equal to 59. An API may allow the
            value 60 if it allows leap-seconds.
          format: int32
          type: integer
      type: object
    TimeZone:
      description: >-
        Represents a time zone from the [IANA Time Zone
        Database](https://www.iana.org/time-zones).
      id: TimeZone
      properties:
        id:
          description: IANA Time Zone Database time zone. For example "America/New_York".
          type: string
        version:
          description: >-
            Optional. IANA Time Zone Database version number. For example
            "2019a".
          type: string
      type: object
