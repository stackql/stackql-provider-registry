            projects/{project}/locations/{region}/goldengateConnectionAssignments/{goldengate_connection_assignment}
          type: string
        labels:
          description: >-
            Optional. The labels or tags associated with the
            GoldengateConnectionAssignment.
          additionalProperties:
            type: string
          type: object
      description: Represents the metadata of a Goldengate Connection Assignment.
    IdentityConnector:
      id: IdentityConnector
      type: object
      properties:
        connectionState:
          type: string
          enumDescriptions:
            - Default unspecified value.
            - The identity pool connection is connected.
            - The identity pool connection is partially connected.
            - The identity pool connection is disconnected.
            - The identity pool connection is in an unknown state.
          description: Output only. The connection state of the identity connector.
          readOnly: true
          enum:
            - CONNECTION_STATE_UNSPECIFIED
            - CONNECTED
            - PARTIALLY_CONNECTED
            - DISCONNECTED
            - UNKNOWN
        serviceAgentEmail:
          description: >-
            Output only. A google managed service account on which customers can
            grant roles to access resources in the customer project. Example:
            `p176944527254-55-75119d87fd8f@gcp-sa-oci.iam.gserviceaccount.com`
          type: string
          readOnly: true
      description: >-
        The identity connector details which will allow OCI to securely access
        the resources in the customer project.
    RemoveVirtualMachineExadbVmClusterRequest:
      properties:
        requestId:
          description: >-
            Optional. An optional ID to identify the request. This value is used
            to identify duplicate requests. If you make a request with the same
            request ID and the original request is still in progress or
            completed, the server ignores the second request. This prevents
            clients from accidentally creating duplicate commitments. The
            request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
          type: string
        hostnames:
          items:
            type: string
          type: array
          description: >-
            Required. The list of host names of db nodes to be removed from the
            ExadbVmCluster.
      description: The request for `ExadbVmCluster.RemoveVirtualMachine`.
      id: RemoveVirtualMachineExadbVmClusterRequest
      type: object
    DatabaseCharacterSet:
      description: Details of the Database character set resource.
      properties:
        name:
          description: >-
            Identifier. The name of the Database Character Set resource in the
            following format:
            projects/{project}/locations/{region}/databaseCharacterSets/{database_character_set}
          type: string
        characterSet:
          readOnly: true
          type: string
          description: >-
            Output only. The character set name for the Database which is the ID
            in the resource name.
        characterSetType:
          description: Output only. The character set type for the Database.
          enumDescriptions:
            - Character set type is not specified.
            - Character set type is set to database.
            - Character set type is set to national.
          type: string
          enum:
            - CHARACTER_SET_TYPE_UNSPECIFIED
            - DATABASE
            - NATIONAL
          readOnly: true
      type: object
      id: DatabaseCharacterSet
    GoldengateOciObjectStorageConnectionProperties:
      type: object
      id: GoldengateOciObjectStorageConnectionProperties
      description: The properties of GoldengateOciObjectStorageConnection.
      properties:
        technologyType:
          description: Optional. The technology type of OciObjectStorageConnection.
          type: string
        privateKeyPassphraseSecret:
          description: Optional. The passphrase of the private key.
          type: string
        tenancyId:
          description: Optional. The OCID of the related OCI tenancy.
          type: string
        publicKeyFingerprint:
          description: >-
            Optional. The fingerprint of the API Key of the user specified by
            the userId.
          type: string
        privateKeyFile:
          description: >-
            Optional. The content of the private key file (PEM file)
            corresponding to the API key of the fingerprint.
          type: string
        useResourcePrincipal:
          description: >-
            Optional. Specifies that the user intends to authenticate to the
            instance using a resource principal.
          type: boolean
        region:
          description: >-
            Optional. The name of the region of OCI Object Storage. e.g.:
            us-ashburn-1 If the region is not provided, backend will default to
            the default region.
