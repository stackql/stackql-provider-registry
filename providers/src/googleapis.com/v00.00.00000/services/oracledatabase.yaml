            - STATE_UNSPECIFIED
            - PROVISIONING
            - AVAILABLE
            - STOPPING
            - STOPPED
            - STARTING
            - TERMINATING
            - TERMINATED
            - UNAVAILABLE
            - RESTORE_IN_PROGRESS
            - RESTORE_FAILED
            - BACKUP_IN_PROGRESS
            - SCALE_IN_PROGRESS
            - AVAILABLE_NEEDS_ATTENTION
            - UPDATING
            - MAINTENANCE_IN_PROGRESS
            - RESTARTING
            - RECREATING
            - ROLE_CHANGE_IN_PROGRESS
            - UPGRADING
            - INACCESSIBLE
            - STANDBY
          readOnly: true
        ociUrl:
          description: >-
            Output only. The Oracle Cloud Infrastructure link for the Autonomous
            Database.
          readOnly: true
          type: string
        dataStorageSizeTb:
          type: integer
          description: >-
            Optional. Immutable. The size of the data stored in the database, in
            terabytes.
          format: int32
        encryptionKeyHistoryEntries:
          description: >-
            Output only. The history of the encryption keys used to encrypt the
            Autonomous Database.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/EncryptionKeyHistoryEntry'
      description: The properties of an Autonomous Database.
    OdbSubnet:
