    DbBackupConfig:
      description: Backup Options for the Database.
      id: DbBackupConfig
      properties:
        autoBackupEnabled:
          description: Optional. If set to true, enables automatic backups on the database.
          type: boolean
        autoFullBackupDay:
          description: >-
            Optional. The day of the week on which the full backup should be
            performed on the database. If no value is provided, it will default
            to Sunday.
          enum:
            - DAY_OF_WEEK_UNSPECIFIED
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          enumDescriptions:
            - The day of the week is unspecified.
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          type: string
        autoFullBackupWindow:
          description: >-
            Optional. The window in which the full backup should be performed on
            the database. If no value is provided, the default is anytime.
          enum:
            - BACKUP_WINDOW_UNSPECIFIED
            - SLOT_ONE
            - SLOT_TWO
            - SLOT_THREE
            - SLOT_FOUR
            - SLOT_FIVE
            - SLOT_SIX
            - SLOT_SEVEN
            - SLOT_EIGHT
            - SLOT_NINE
            - SLOT_TEN
            - SLOT_ELEVEN
            - SLOT_TWELVE
          enumDescriptions:
            - Default unspecified value.
            - 12:00 AM - 2:00 AM
            - 2:00 AM - 4:00 AM
            - 4:00 AM - 6:00 AM
            - 6:00 AM - 8:00 AM
            - 8:00 AM - 10:00 AM
            - 10:00 AM - 12:00 PM
            - 12:00 PM - 2:00 PM
            - 2:00 PM - 4:00 PM
            - 4:00 PM - 6:00 PM
            - 6:00 PM - 8:00 PM
            - 8:00 PM - 10:00 PM
            - 10:00 PM - 12:00 AM
          type: string
        autoIncrementalBackupWindow:
          description: >-
            Optional. The window in which the incremental backup should be
            performed on the database. If no value is provided, the default is
            anytime except the auto full backup day.
          enum:
            - BACKUP_WINDOW_UNSPECIFIED
            - SLOT_ONE
            - SLOT_TWO
            - SLOT_THREE
            - SLOT_FOUR
            - SLOT_FIVE
            - SLOT_SIX
            - SLOT_SEVEN
            - SLOT_EIGHT
            - SLOT_NINE
            - SLOT_TEN
            - SLOT_ELEVEN
            - SLOT_TWELVE
          enumDescriptions:
            - Default unspecified value.
            - 12:00 AM - 2:00 AM
            - 2:00 AM - 4:00 AM
            - 4:00 AM - 6:00 AM
            - 6:00 AM - 8:00 AM
            - 8:00 AM - 10:00 AM
            - 10:00 AM - 12:00 PM
            - 12:00 PM - 2:00 PM
            - 2:00 PM - 4:00 PM
            - 4:00 PM - 6:00 PM
            - 6:00 PM - 8:00 PM
            - 8:00 PM - 10:00 PM
            - 10:00 PM - 12:00 AM
          type: string
        backupDeletionPolicy:
          description: >-
            Optional. This defines when the backups will be deleted after
            Database termination.
          enum:
            - BACKUP_DELETION_POLICY_UNSPECIFIED
            - DELETE_IMMEDIATELY
            - DELETE_AFTER_RETENTION_PERIOD
          enumDescriptions:
            - Default unspecified value.
            - >-
              Keeps the backup for predefined time i.e. 72 hours and then delete
              permanently.
            - Keeps the backups as per the policy defined for database backups.
          type: string
        backupDestinationDetails:
          description: Optional. Details of the database backup destinations.
          items:
            $ref: '#/components/schemas/BackupDestinationDetails'
          type: array
        retentionPeriodDays:
          description: >-
            Optional. The number of days an automatic backup is retained before
            being automatically deleted. This value determines the earliest
            point in time to which a database can be restored. Min: 1, Max: 60.
          format: int32
          type: integer
      type: object
