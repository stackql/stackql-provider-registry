components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AllConnectionStrings:
      description: >-
        A list of all connection strings that can be used to connect to the
        Autonomous Database.
      id: AllConnectionStrings
      properties:
        high:
          description: >-
            Output only. The database service provides the highest level of
            resources to each SQL statement.
          readOnly: true
          type: string
        low:
          description: >-
            Output only. The database service provides the least level of
            resources to each SQL statement.
          readOnly: true
          type: string
        medium:
          description: >-
            Output only. The database service provides a lower level of
            resources to each SQL statement.
          readOnly: true
          type: string
      type: object
    AmazonS3IcebergStorage:
      description: The Amazon S3 Iceberg storage.
      id: AmazonS3IcebergStorage
      properties:
        accessKeyId:
          description: Required. The access key ID of Amazon S3.
          type: string
        bucket:
          description: Required. The bucket of Amazon S3.
          type: string
        endpoint:
          description: Optional. The endpoint of Amazon S3.
          type: string
        region:
          description: Required. The region of Amazon S3.
          type: string
        schemeType:
          description: Required. The scheme type of Amazon S3.
          enum:
            - SCHEME_TYPE_UNSPECIFIED
            - S3
            - S3A
          enumDescriptions:
            - Scheme type not specified.
            - S3 scheme.
            - S3A scheme.
          type: string
        secretAccessKeySecret:
          description: Optional. The secret access key of Amazon S3.
          type: string
      type: object
    AutonomousDatabase:
      description: >-
        Details of the Autonomous Database resource.
        https://docs.oracle.com/en-us/iaas/api/#/en/database/20160918/AutonomousDatabase/
      id: AutonomousDatabase
      properties:
        adminPassword:
          description: >-
            Optional. Immutable. The password for the default ADMIN user. Note:
            Only one of `admin_password_secret_version` or `admin_password` can
            be populated.
          type: string
        adminPasswordSecretVersion:
          description: >-
            Optional. Immutable. The resource name of a secret version in Secret
            Manager which contains the database admin user's password. Format:
            projects/{project}/secrets/{secret}/versions/{version}. Note: Only
            one of `admin_password_secret_version` or `admin_password` can be
            populated.
          type: string
        cidr:
          description: >-
            Optional. Immutable. The subnet CIDR range for the Autonomous
            Database.
          type: string
        createTime:
          description: >-
            Output only. The date and time that the Autonomous Database was
            created.
          format: google-datetime
          readOnly: true
          type: string
        database:
          description: >-
            Optional. Immutable. The name of the Autonomous Database. The
            database name must be unique in the project. The name must begin
            with a letter and can contain a maximum of 30 alphanumeric
            characters.
          type: string
        disasterRecoverySupportedLocations:
          description: >-
            Output only. List of supported GCP region to clone the Autonomous
            Database for disaster recovery. Format:
            `project/{project}/locations/{location}`.
          items:
            type: string
          readOnly: true
          type: array
        displayName:
          description: >-
            Optional. Immutable. The display name for the Autonomous Database.
            The name does not have to be unique within your project.
          type: string
        entitlementId:
          description: >-
            Output only. The ID of the subscription entitlement associated with
            the Autonomous Database.
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. The labels or tags associated with the Autonomous
            Database.
          type: object
        name:
          description: >-
            Identifier. The name of the Autonomous Database resource in the
            following format:
            projects/{project}/locations/{region}/autonomousDatabases/{autonomous_database}
          type: string
        network:
          description: >-
            Optional. Immutable. The name of the VPC network used by the
            Autonomous Database in the following format:
            projects/{project}/global/networks/{network}
          type: string
        odbNetwork:
          description: >-
            Optional. Immutable. The name of the OdbNetwork associated with the
            Autonomous Database. Format:
            projects/{project}/locations/{location}/odbNetworks/{odb_network} It
            is optional but if specified, this should match the parent
            ODBNetwork of the OdbSubnet.
          type: string
        odbSubnet:
          description: >-
            Optional. Immutable. The name of the OdbSubnet associated with the
            Autonomous Database. Format:
            projects/{project}/locations/{location}/odbNetworks/{odb_network}/odbSubnets/{odb_subnet}
          type: string
        peerAutonomousDatabases:
          description: >-
            Output only. The peer Autonomous Database names of the given
            Autonomous Database.
          items:
            type: string
          readOnly: true
          type: array
        properties:
          $ref: '#/components/schemas/AutonomousDatabaseProperties'
          description: Optional. The properties of the Autonomous Database.
        sourceConfig:
          $ref: '#/components/schemas/SourceConfig'
          description: >-
            Optional. Immutable. The source Autonomous Database configuration
            for the standby Autonomous Database. The source Autonomous Database
            is configured while creating the Peer Autonomous Database and can't
            be updated after creation.
      type: object
    AutonomousDatabaseApex:
      description: >-
        Oracle APEX Application Development.
        https://docs.oracle.com/en-us/iaas/api/#/en/database/20160918/datatypes/AutonomousDatabaseApex
      id: AutonomousDatabaseApex
      properties:
        apexVersion:
          description: Output only. The Oracle APEX Application Development version.
          readOnly: true
          type: string
        ordsVersion:
          description: Output only. The Oracle REST Data Services (ORDS) version.
          readOnly: true
          type: string
      type: object
    AutonomousDatabaseBackup:
      description: >-
        Details of the Autonomous Database Backup resource.
        https://docs.oracle.com/en-us/iaas/api/#/en/database/20160918/AutonomousDatabaseBackup/
      id: AutonomousDatabaseBackup
      properties:
        autonomousDatabase:
          description: >-
            Required. The name of the Autonomous Database resource for which the
            backup is being created. Format:
            projects/{project}/locations/{region}/autonomousDatabases/{autonomous_database}
          type: string
        displayName:
          description: >-
            Optional. User friendly name for the Backup. The name does not have
            to be unique.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. labels or tags associated with the resource.
          type: object
        name:
          description: >-
            Identifier. The name of the Autonomous Database Backup resource with
            the format:
            projects/{project}/locations/{region}/autonomousDatabaseBackups/{autonomous_database_backup}
          type: string
        properties:
          $ref: '#/components/schemas/AutonomousDatabaseBackupProperties'
          description: Optional. Various properties of the backup.
      type: object
    AutonomousDatabaseBackupProperties:
      description: Properties of the Autonomous Database Backup resource.
      id: AutonomousDatabaseBackupProperties
      properties:
        availableTillTime:
          description: Output only. Timestamp until when the backup will be available.
          format: google-datetime
          readOnly: true
          type: string
        compartmentId:
          description: Output only. The OCID of the compartment.
          readOnly: true
          type: string
        databaseSizeTb:
          description: Output only. The quantity of data in the database, in terabytes.
          format: float
          readOnly: true
          type: number
        dbVersion:
          description: >-
            Output only. A valid Oracle Database version for Autonomous
            Database.
          readOnly: true
          type: string
        endTime:
          description: Output only. The date and time the backup completed.
          format: google-datetime
          readOnly: true
          type: string
        isAutomaticBackup:
          description: Output only. Indicates if the backup is automatic or user initiated.
          readOnly: true
          type: boolean
        isLongTermBackup:
          description: Output only. Indicates if the backup is long term backup.
          readOnly: true
          type: boolean
        isRestorable:
          description: >-
            Output only. Indicates if the backup can be used to restore the
            Autonomous Database.
          readOnly: true
          type: boolean
        keyStoreId:
          description: Optional. The OCID of the key store of Oracle Vault.
          type: string
        keyStoreWallet:
          description: Optional. The wallet name for Oracle Key Vault.
          type: string
        kmsKeyId:
          description: >-
            Optional. The OCID of the key container that is used as the master
            encryption key in database transparent data encryption (TDE)
            operations.
          type: string
        kmsKeyVersionId:
          description: >-
            Optional. The OCID of the key container version that is used in
            database transparent data encryption (TDE) operations KMS Key can
            have multiple key versions. If none is specified, the current key
            version (latest) of the Key Id is used for the operation. Autonomous
            Database Serverless does not use key versions, hence is not
            applicable for Autonomous Database Serverless instances.
          type: string
        lifecycleDetails:
          description: >-
            Output only. Additional information about the current lifecycle
            state.
          readOnly: true
          type: string
        lifecycleState:
          description: Output only. The lifecycle state of the backup.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
            - DELETING
            - DELETED
            - FAILED
            - UPDATING
          enumDescriptions:
            - Default unspecified value.
            - Indicates that the resource is in creating state.
            - Indicates that the resource is in active state.
            - Indicates that the resource is in deleting state.
            - Indicates that the resource is in deleted state.
            - Indicates that the resource is in failed state.
            - Indicates that the resource is in updating state.
          readOnly: true
          type: string
        ocid:
          description: >-
            Output only. OCID of the Autonomous Database backup.
            https://docs.oracle.com/en-us/iaas/Content/General/Concepts/identifiers.htm#Oracle
          readOnly: true
          type: string
        retentionPeriodDays:
          description: Optional. Retention period in days for the backup.
          format: int32
          type: integer
        sizeTb:
          description: Output only. The backup size in terabytes.
          format: float
          readOnly: true
          type: number
        startTime:
          description: Output only. The date and time the backup started.
          format: google-datetime
          readOnly: true
          type: string
        type:
          description: Output only. The type of the backup.
          enum:
            - TYPE_UNSPECIFIED
            - INCREMENTAL
            - FULL
            - LONG_TERM
          enumDescriptions:
            - Default unspecified value.
            - Incremental backups.
            - Full backups.
            - Long term backups.
          readOnly: true
          type: string
        vaultId:
          description: Optional. The OCID of the vault.
          type: string
      type: object
    AutonomousDatabaseCharacterSet:
      description: >-
        Details of the Autonomous Database character set resource.
        https://docs.oracle.com/en-us/iaas/api/#/en/database/20160918/AutonomousDatabaseCharacterSets/
      id: AutonomousDatabaseCharacterSet
      properties:
        characterSet:
          description: >-
            Output only. The character set name for the Autonomous Database
            which is the ID in the resource name.
          readOnly: true
          type: string
        characterSetType:
          description: Output only. The character set type for the Autonomous Database.
          enum:
            - CHARACTER_SET_TYPE_UNSPECIFIED
            - DATABASE
            - NATIONAL
          enumDescriptions:
            - Character set type is not specified.
            - Character set type is set to database.
            - Character set type is set to national.
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. The name of the Autonomous Database Character Set
            resource in the following format:
            projects/{project}/locations/{region}/autonomousDatabaseCharacterSets/{autonomous_database_character_set}
          type: string
      type: object
    AutonomousDatabaseConnectionStrings:
      description: >-
        The connection string used to connect to the Autonomous Database.
        https://docs.oracle.com/en-us/iaas/api/#/en/database/20160918/datatypes/AutonomousDatabaseConnectionStrings
      id: AutonomousDatabaseConnectionStrings
      properties:
        allConnectionStrings:
          $ref: '#/components/schemas/AllConnectionStrings'
          description: >-
            Output only. Returns all connection strings that can be used to
            connect to the Autonomous Database.
          readOnly: true
        dedicated:
          description: >-
            Output only. The database service provides the least level of
            resources to each SQL statement, but supports the most number of
            concurrent SQL statements.
          readOnly: true
          type: string
        high:
          description: >-
            Output only. The database service provides the highest level of
            resources to each SQL statement.
          readOnly: true
          type: string
        low:
          description: >-
            Output only. The database service provides the least level of
            resources to each SQL statement.
          readOnly: true
          type: string
        medium:
          description: >-
            Output only. The database service provides a lower level of
            resources to each SQL statement.
          readOnly: true
          type: string
        profiles:
          description: >-
            Output only. A list of connection string profiles to allow clients
            to group, filter, and select values based on the structured
            metadata.
          items:
            $ref: '#/components/schemas/DatabaseConnectionStringProfile'
          readOnly: true
          type: array
      type: object
    AutonomousDatabaseConnectionUrls:
      description: >-
        The URLs for accessing Oracle Application Express (APEX) and SQL
        Developer Web with a browser from a Compute instance.
        https://docs.oracle.com/en-us/iaas/api/#/en/database/20160918/datatypes/AutonomousDatabaseConnectionUrls
      id: AutonomousDatabaseConnectionUrls
      properties:
        apexUri:
          description: Output only. Oracle Application Express (APEX) URL.
          readOnly: true
          type: string
        databaseTransformsUri:
          description: >-
            Output only. The URL of the Database Transforms for the Autonomous
            Database.
          readOnly: true
          type: string
        graphStudioUri:
          description: >-
            Output only. The URL of the Graph Studio for the Autonomous
            Database.
          readOnly: true
          type: string
        machineLearningNotebookUri:
          description: >-
            Output only. The URL of the Oracle Machine Learning (OML) Notebook
            for the Autonomous Database.
          readOnly: true
          type: string
        machineLearningUserManagementUri:
          description: >-
            Output only. The URL of Machine Learning user management the
            Autonomous Database.
          readOnly: true
          type: string
        mongoDbUri:
          description: Output only. The URL of the MongoDB API for the Autonomous Database.
          readOnly: true
          type: string
        ordsUri:
          description: >-
            Output only. The Oracle REST Data Services (ORDS) URL of the Web
            Access for the Autonomous Database.
          readOnly: true
          type: string
        sqlDevWebUri:
          description: >-
            Output only. The URL of the Oracle SQL Developer Web for the
            Autonomous Database.
          readOnly: true
          type: string
      type: object
    AutonomousDatabaseProperties:
      description: The properties of an Autonomous Database.
      id: AutonomousDatabaseProperties
      properties:
        actualUsedDataStorageSizeTb:
          description: >-
            Output only. The amount of storage currently being used for user and
            system data, in terabytes.
          format: double
          readOnly: true
          type: number
        allocatedStorageSizeTb:
          description: >-
            Output only. The amount of storage currently allocated for the
            database tables and billed for, rounded up in terabytes.
          format: double
          readOnly: true
          type: number
        allowlistedIps:
          description: >-
            Optional. Immutable. The list of allowlisted IP addresses for the
            Autonomous Database.
          items:
            type: string
          type: array
        apexDetails:
          $ref: '#/components/schemas/AutonomousDatabaseApex'
          description: >-
            Output only. The details for the Oracle APEX Application
            Development.
          readOnly: true
        arePrimaryAllowlistedIpsUsed:
          description: >-
            Output only. This field indicates the status of Data Guard and
            Access control for the Autonomous Database. The field's value is
            null if Data Guard is disabled or Access Control is disabled. The
            field's value is TRUE if both Data Guard and Access Control are
            enabled, and the Autonomous Database is using primary IP access
            control list (ACL) for standby. The field's value is FALSE if both
            Data Guard and Access Control are enabled, and the Autonomous
            Database is using a different IP access control list (ACL) for
            standby compared to primary.
          readOnly: true
          type: boolean
        autonomousContainerDatabaseId:
          description: Output only. The Autonomous Container Database OCID.
          readOnly: true
          type: string
        availableUpgradeVersions:
          description: >-
            Output only. The list of available Oracle Database upgrade versions
            for an Autonomous Database.
          items:
            type: string
          readOnly: true
          type: array
        backupRetentionPeriodDays:
          description: >-
            Optional. Immutable. The retention period for the Autonomous
            Database. This field is specified in days, can range from 1 day to
            60 days, and has a default value of 60 days.
          format: int32
          type: integer
        characterSet:
          description: >-
            Optional. Immutable. The character set for the Autonomous Database.
            The default is AL32UTF8.
          type: string
        computeCount:
          description: >-
            Optional. Immutable. The number of compute servers for the
            Autonomous Database.
          format: float
          type: number
        connectionStrings:
          $ref: '#/components/schemas/AutonomousDatabaseConnectionStrings'
          description: >-
            Output only. The connection strings used to connect to an Autonomous
            Database.
          readOnly: true
        connectionUrls:
          $ref: '#/components/schemas/AutonomousDatabaseConnectionUrls'
          description: Output only. The Oracle Connection URLs for an Autonomous Database.
          readOnly: true
        cpuCoreCount:
          description: >-
            Optional. Immutable. The number of CPU cores to be made available to
            the database.
          format: int32
          type: integer
        customerContacts:
          description: Optional. Immutable. The list of customer contacts.
          items:
            $ref: '#/components/schemas/CustomerContact'
          type: array
        dataGuardRoleChangedTime:
          description: >-
            Output only. The date and time the Autonomous Data Guard role was
            changed for the standby Autonomous Database.
          format: google-datetime
          readOnly: true
          type: string
        dataSafeState:
          description: >-
            Output only. The current state of the Data Safe registration for the
            Autonomous Database.
          enum:
            - DATA_SAFE_STATE_UNSPECIFIED
            - REGISTERING
            - REGISTERED
            - DEREGISTERING
            - NOT_REGISTERED
            - FAILED
          enumDescriptions:
            - Default unspecified value.
            - Registering data safe state.
            - Registered data safe state.
            - Deregistering data safe state.
            - Not registered data safe state.
            - Failed data safe state.
          readOnly: true
          type: string
        dataStorageSizeGb:
          description: >-
            Optional. Immutable. The size of the data stored in the database, in
            gigabytes.
          format: int32
          type: integer
        dataStorageSizeTb:
          description: >-
            Optional. Immutable. The size of the data stored in the database, in
            terabytes.
          format: int32
          type: integer
        databaseManagementState:
          description: >-
            Output only. The current state of database management for the
            Autonomous Database.
          enum:
            - DATABASE_MANAGEMENT_STATE_UNSPECIFIED
            - ENABLING
            - ENABLED
            - DISABLING
            - NOT_ENABLED
            - FAILED_ENABLING
            - FAILED_DISABLING
          enumDescriptions:
            - Default unspecified value.
            - Enabling Database Management state
            - Enabled Database Management state
            - Disabling Database Management state
            - Not Enabled Database Management state
            - Failed enabling Database Management state
            - Failed disabling Database Management state
          readOnly: true
          type: string
        dbEdition:
          description: Optional. Immutable. The edition of the Autonomous Databases.
          enum:
            - DATABASE_EDITION_UNSPECIFIED
            - STANDARD_EDITION
            - ENTERPRISE_EDITION
          enumDescriptions:
            - Default unspecified value.
            - Standard Database Edition
            - Enterprise Database Edition
          type: string
        dbVersion:
          description: >-
            Optional. Immutable. The Oracle Database version for the Autonomous
            Database.
          type: string
        dbWorkload:
          description: Required. Immutable. The workload type of the Autonomous Database.
          enum:
            - DB_WORKLOAD_UNSPECIFIED
            - OLTP
            - DW
            - AJD
            - APEX
          enumDescriptions:
            - Default unspecified value.
            - Autonomous Transaction Processing database.
            - Autonomous Data Warehouse database.
            - Autonomous JSON Database.
            - >-
              Autonomous Database with the Oracle APEX Application Development
              workload type.
          type: string
        disasterRecoveryRoleChangedTime:
          description: >-
            Output only. The date and time the Disaster Recovery role was
            changed for the standby Autonomous Database.
          format: google-datetime
          readOnly: true
          type: string
        encryptionKey:
          $ref: '#/components/schemas/EncryptionKey'
          description: >-
            Optional. The encryption key used to encrypt the Autonomous
            Database. Updating this field will add a new entry in the
            `encryption_key_history_entries` field with the former version.
        encryptionKeyHistoryEntries:
          description: >-
            Output only. The history of the encryption keys used to encrypt the
            Autonomous Database.
          items:
            $ref: '#/components/schemas/EncryptionKeyHistoryEntry'
          readOnly: true
          type: array
        failedDataRecoveryDuration:
          description: >-
            Output only. This field indicates the number of seconds of data loss
            during a Data Guard failover.
          format: google-duration
          readOnly: true
          type: string
        isAutoScalingEnabled:
          description: >-
            Optional. Immutable. This field indicates if auto scaling is enabled
            for the Autonomous Database CPU core count.
          type: boolean
        isLocalDataGuardEnabled:
          deprecated: true
          description: >-
            Output only. Deprecated: Please use `local_data_guard_enabled`
            instead. This field indicates whether the Autonomous Database has
            local (in-region) Data Guard enabled.
          readOnly: true
          type: boolean
        isStorageAutoScalingEnabled:
          description: >-
            Optional. Immutable. This field indicates if auto scaling is enabled
            for the Autonomous Database storage.
          type: boolean
        licenseType:
          description: >-
            Required. Immutable. The license type used for the Autonomous
            Database.
          enum:
            - LICENSE_TYPE_UNSPECIFIED
            - LICENSE_INCLUDED
            - BRING_YOUR_OWN_LICENSE
          enumDescriptions:
            - Unspecified
            - License included part of offer
            - Bring your own license
          type: string
        lifecycleDetails:
          description: >-
            Output only. The details of the current lifestyle state of the
            Autonomous Database.
          readOnly: true
          type: string
        localAdgAutoFailoverMaxDataLossLimit:
          deprecated: true
          description: >-
            Output only. Deprecated: Please use
            `local_adg_auto_failover_max_data_loss_limit_duration` instead. This
            field indicates the maximum data loss limit for an Autonomous
            Database, in seconds.
          format: int32
          readOnly: true
          type: integer
        localAdgAutoFailoverMaxDataLossLimitDuration:
          description: >-
            Optional. This field indicates the maximum data loss limit for an
            Autonomous Database, in seconds.
          format: int32
          type: integer
        localDataGuardEnabled:
          description: >-
            Optional. Indicates whether the Autonomous Database has a local
            (in-region) standby database. Not applicable to cross-region Data
            Guard or dedicated Exadata infrastructure.
          type: boolean
        localDisasterRecoveryType:
          description: >-
            Output only. This field indicates the local disaster recovery (DR)
            type of an Autonomous Database.
          enum:
            - LOCAL_DISASTER_RECOVERY_TYPE_UNSPECIFIED
            - ADG
            - BACKUP_BASED
            - NOT_AVAILABLE
          enumDescriptions:
            - Default unspecified value.
            - Autonomous Data Guard recovery.
            - Backup based recovery.
            - Local disaster recovery is not available.
          readOnly: true
          type: string
        localStandbyDb:
          $ref: '#/components/schemas/AutonomousDatabaseStandbySummary'
          description: >-
            Output only. The details of the Autonomous Data Guard standby
            database.
          readOnly: true
        maintenanceBeginTime:
          description: Output only. The date and time when maintenance will begin.
          format: google-datetime
          readOnly: true
          type: string
        maintenanceEndTime:
          description: Output only. The date and time when maintenance will end.
          format: google-datetime
          readOnly: true
          type: string
        maintenanceScheduleType:
          description: >-
            Optional. Immutable. The maintenance schedule of the Autonomous
            Database.
          enum:
            - MAINTENANCE_SCHEDULE_TYPE_UNSPECIFIED
            - EARLY
            - REGULAR
          enumDescriptions:
            - Default unspecified value.
            - >-
