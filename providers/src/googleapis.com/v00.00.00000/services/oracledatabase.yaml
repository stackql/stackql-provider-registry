openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Oracle Database@Google Cloud API
  description: >-
    The Oracle Database@Google Cloud API provides a set of APIs to manage Oracle
    database services, such as Exadata and Autonomous Databases.
  version: v1
  x-discovery-doc-revision: '20260722'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/oracle/database/docs
servers:
  - url: https://oracledatabase.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    EncryptionKey:
      id: EncryptionKey
      type: object
      properties:
        kmsKey:
          description: >-
            Optional. The KMS key used to encrypt the Autonomous Database. This
            field is required if the provider is GOOGLE_MANAGED. The name of the
            KMS key resource in the following format:
            `projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{crypto_key}`.
          type: string
        provider:
          enumDescriptions:
            - Default unspecified value.
            - >-
              Google Managed KMS key, if selected, please provide the KMS key
              name.
            - Oracle Managed.
          type: string
          description: Optional. The provider of the encryption key.
          enum:
            - PROVIDER_UNSPECIFIED
            - GOOGLE_MANAGED
            - ORACLE_MANAGED
      description: The encryption key used to encrypt the Autonomous Database.
    ListGoldengateConnectionsResponse:
      properties:
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
        unreachable:
          description: Optional. Locations that could not be reached.
          items:
            type: string
          type: array
        goldengateConnections:
          items:
            $ref: '#/components/schemas/GoldengateConnection'
          type: array
          description: The list of GoldengateConnections.
      description: The response for `GoldengateConnection.List`.
      id: ListGoldengateConnectionsResponse
      type: object
    PluggableDatabase:
      id: PluggableDatabase
      type: object
      properties:
        name:
          description: >-
            Identifier. The name of the PluggableDatabase resource in the
            following format:
            projects/{project}/locations/{region}/pluggableDatabases/{pluggable_database}
          type: string
        createTime:
          type: string
          readOnly: true
          description: >-
            Output only. The date and time that the PluggableDatabase was
            created.
          format: google-datetime
        properties:
          description: Optional. The properties of the PluggableDatabase.
          $ref: '#/components/schemas/PluggableDatabaseProperties'
        ociUrl:
          description: >-
            Output only. HTTPS link to OCI resources exposed to Customer via UI
            Interface.
          type: string
          readOnly: true
      description: >-
        The PluggableDatabase resource.
        https://docs.oracle.com/en-us/iaas/api/#/en/database/20160918/PluggableDatabase/
    ListDbVersionsResponse:
      id: ListDbVersionsResponse
      type: object
      properties:
        dbVersions:
          description: The list of DbVersions.
          type: array
          items:
            $ref: '#/components/schemas/DbVersion'
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
      description: The response for `DbVersions.List`.
    GoldengateKafkaConnectionProperties:
      properties:
        streamPoolId:
          description: Optional. The OCID of the stream pool being referenced.
          type: string
        passwordSecretVersion:
          description: >-
            Optional. Input only. The resource name of a secret version in
            Secret Manager which contains the password for Kafka basic/SASL
            auth. Format:
            projects/{project}/secrets/{secret}/versions/{version}.
          type: string
        trustStorePassword:
          description: Optional. Input only. The TrustStore password in plain text.
          type: string
        sslKeyPassword:
          description: >-
            Optional. Input only. The password for the cert inside of the
            KeyStore in plain text.
          type: string
        bootstrapServers:
          type: array
          items:
            $ref: '#/components/schemas/KafkaBootstrapServer'
          description: >-
            Optional. Kafka bootstrap. Equivalent of bootstrap.servers
            configuration property in Kafka: list of KafkaBootstrapServer
            objects specified by host/port. Used for establishing the initial
            connection to the Kafka cluster. Example:
            "server1.example.com:9092,server2.example.com:9092"
        password:
          description: >-
            Optional. Input only. The password for Kafka basic/SASL auth in
            plain text.
          type: string
        keyStorePasswordSecretVersion:
          description: >-
            Optional. Input only. The resource name of a secret version in
            Secret Manager which contains the KeyStore password. Format:
            projects/{project}/secrets/{secret}/versions/{version}.
          type: string
        trustStorePasswordSecretVersion:
          description: >-
            Optional. Input only. The resource name of a secret version in
            Secret Manager which contains the TrustStore password. Format:
            projects/{project}/secrets/{secret}/versions/{version}.
          type: string
        sslKeyPasswordSecretVersion:
          description: >-
            Optional. Input only. The resource name of a secret version in
            Secret Manager which contains the password for the cert inside of
            the KeyStore. Format:
            projects/{project}/secrets/{secret}/versions/{version}.
          type: string
        producerPropertiesFile:
          description: >-
            Optional. The base64 encoded content of the producer.properties
            file.
          type: string
        keyStorePassword:
          description: Optional. Input only. The KeyStore password in plain text.
          type: string
        technologyType:
          description: Optional. The technology type of KafkaConnection.
          type: string
        clusterId:
          description: >-
            Optional. The OCID of the Kafka cluster being referenced from OCI
            Streaming with Apache Kafka.
          type: string
        useResourcePrincipal:
          description: >-
            Optional. Specifies that the user intends to authenticate to the
            instance using a resource principal. Applicable only for OCI
            Streaming connections.
          type: boolean
        securityProtocol:
          enumDescriptions:
            - Security type not specified.
            - SSL security protocol.
            - SASL SSL security protocol.
            - Plaintext security protocol.
            - SASL Plaintext security protocol.
          type: string
          description: Optional. Security Type for Kafka.
          enum:
            - KAFKA_SECURITY_PROTOCOL_UNSPECIFIED
            - SSL
            - SASL_SSL
            - PLAINTEXT
            - SASL_PLAINTEXT
        username:
          description: >-
            Optional. The username Oracle Goldengate uses to connect the
            associated system of the given technology.
          type: string
        keyStoreFile:
          description: Optional. The base64 encoded content of the KeyStore file.
          type: string
        consumerPropertiesFile:
          description: >-
            Optional. The base64 encoded content of the consumer.properties
            file.
          type: string
        trustStoreFile:
          description: Optional. The base64 encoded content of the TrustStore file.
          type: string
      description: The properties of GoldengateKafkaConnection.
      id: GoldengateKafkaConnectionProperties
      type: object
    CustomerContact:
      type: object
      id: CustomerContact
      description: >-
        The CustomerContact reference as defined by Oracle.
        https://docs.oracle.com/en-us/iaas/api/#/en/database/20160918/datatypes/CustomerContact
      properties:
        email:
          description: >-
            Required. The email address used by Oracle to send notifications
            regarding databases and infrastructure.
          type: string
    TimeOfDay:
      id: TimeOfDay
      type: object
      properties:
        seconds:
          format: int32
          description: >-
            Seconds of a minute. Must be greater than or equal to 0 and
            typically must be less than or equal to 59. An API may allow the
            value 60 if it allows leap-seconds.
          type: integer
        nanos:
          description: >-
            Fractions of seconds, in nanoseconds. Must be greater than or equal
            to 0 and less than or equal to 999,999,999.
          format: int32
          type: integer
        minutes:
          description: >-
            Minutes of an hour. Must be greater than or equal to 0 and less than
            or equal to 59.
          format: int32
          type: integer
        hours:
          description: >-
            Hours of a day in 24 hour format. Must be greater than or equal to 0
            and typically must be less than or equal to 23. An API may choose to
            allow the value "24:00:00" for scenarios like business closing time.
          format: int32
          type: integer
      description: >-
        Represents a time of day. The date and time zone are either not
        significant or are specified elsewhere. An API may choose to allow leap
        seconds. Related types are google.type.Date and
        `google.protobuf.Timestamp`.
    RestoreAutonomousDatabaseRequest:
      properties:
        restoreTime:
          description: Required. The time and date to restore the database to.
          format: google-datetime
          type: string
      description: The request for `AutonomousDatabase.Restore`.
      id: RestoreAutonomousDatabaseRequest
      type: object
    DbBackupConfig:
      id: DbBackupConfig
      type: object
      properties:
        autoBackupEnabled:
          description: Optional. If set to true, enables automatic backups on the database.
          type: boolean
        autoIncrementalBackupWindow:
          type: string
          enumDescriptions:
            - Default unspecified value.
            - 12:00 AM - 2:00 AM
            - 2:00 AM - 4:00 AM
            - 4:00 AM - 6:00 AM
            - 6:00 AM - 8:00 AM
            - 8:00 AM - 10:00 AM
            - 10:00 AM - 12:00 PM
            - 12:00 PM - 2:00 PM
            - 2:00 PM - 4:00 PM
            - 4:00 PM - 6:00 PM
            - 6:00 PM - 8:00 PM
            - 8:00 PM - 10:00 PM
            - 10:00 PM - 12:00 AM
          description: >-
            Optional. The window in which the incremental backup should be
            performed on the database. If no value is provided, the default is
            anytime except the auto full backup day.
          enum:
            - BACKUP_WINDOW_UNSPECIFIED
            - SLOT_ONE
            - SLOT_TWO
            - SLOT_THREE
            - SLOT_FOUR
            - SLOT_FIVE
            - SLOT_SIX
            - SLOT_SEVEN
            - SLOT_EIGHT
            - SLOT_NINE
            - SLOT_TEN
            - SLOT_ELEVEN
            - SLOT_TWELVE
        autoFullBackupDay:
          enumDescriptions:
            - The day of the week is unspecified.
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          type: string
          description: >-
            Optional. The day of the week on which the full backup should be
            performed on the database. If no value is provided, it will default
            to Sunday.
          enum:
            - DAY_OF_WEEK_UNSPECIFIED
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
        autoFullBackupWindow:
          description: >-
            Optional. The window in which the full backup should be performed on
            the database. If no value is provided, the default is anytime.
          enum:
            - BACKUP_WINDOW_UNSPECIFIED
            - SLOT_ONE
            - SLOT_TWO
            - SLOT_THREE
            - SLOT_FOUR
            - SLOT_FIVE
            - SLOT_SIX
            - SLOT_SEVEN
            - SLOT_EIGHT
            - SLOT_NINE
            - SLOT_TEN
            - SLOT_ELEVEN
            - SLOT_TWELVE
          type: string
          enumDescriptions:
            - Default unspecified value.
            - 12:00 AM - 2:00 AM
            - 2:00 AM - 4:00 AM
            - 4:00 AM - 6:00 AM
            - 6:00 AM - 8:00 AM
            - 8:00 AM - 10:00 AM
            - 10:00 AM - 12:00 PM
            - 12:00 PM - 2:00 PM
            - 2:00 PM - 4:00 PM
            - 4:00 PM - 6:00 PM
            - 6:00 PM - 8:00 PM
            - 8:00 PM - 10:00 PM
            - 10:00 PM - 12:00 AM
        backupDestinationDetails:
          type: array
          items:
            $ref: '#/components/schemas/BackupDestinationDetails'
          description: Optional. Details of the database backup destinations.
        retentionPeriodDays:
          format: int32
          description: >-
            Optional. The number of days an automatic backup is retained before
            being automatically deleted. This value determines the earliest
            point in time to which a database can be restored. Min: 1, Max: 60.
          type: integer
        backupDeletionPolicy:
          description: >-
            Optional. This defines when the backups will be deleted after
            Database termination.
          enum:
            - BACKUP_DELETION_POLICY_UNSPECIFIED
            - DELETE_IMMEDIATELY
            - DELETE_AFTER_RETENTION_PERIOD
          type: string
          enumDescriptions:
            - Default unspecified value.
            - >-
              Keeps the backup for predefined time i.e. 72 hours and then delete
              permanently.
            - Keeps the backups as per the policy defined for database backups.
      description: Backup Options for the Database.
    GoldengateBackupSchedule:
      id: GoldengateBackupSchedule
      type: object
      properties:
        compartmentId:
          type: string
          readOnly: true
          description: Output only. The compartment id.
        metadataOnly:
          readOnly: true
          type: boolean
          description: Output only. If metadata only.
        backupScheduledTime:
          description: Output only. The timestamp of when the backup was scheduled.
          format: google-datetime
          type: string
          readOnly: true
        frequencyBackupScheduled:
          description: Output only. The frequency backup scheduled.
          enumDescriptions:
            - The frequency backup scheduled is unspecified.
            - The frequency backup scheduled is daily.
            - The frequency backup scheduled is weekly.
            - The frequency backup scheduled is monthly.
          type: string
          enum:
            - FREQUENCY_BACKUP_SCHEDULED_UNSPECIFIED
            - DAILY
            - WEEKLY
            - MONTHLY
          readOnly: true
        bucket:
          type: string
          readOnly: true
          description: Output only. The bucket name.
        namespace:
          type: string
          readOnly: true
          description: Output only. The namespace name.
      description: The backup schedule of the GoldengateDeployment.
    PluggableDatabaseNodeLevelDetails:
      id: PluggableDatabaseNodeLevelDetails
      type: object
      properties:
        nodeName:
          description: Required. The Node name of the Database home.
          type: string
        openMode:
          type: string
          enumDescriptions:
            - The open mode is unspecified.
            - The pluggable database is opened in read-only mode.
            - The pluggable database is opened in read-write mode.
            - The pluggable database is mounted.
            - The pluggable database is migrated.
          description: Required. The mode that the pluggable database is in to open it.
          enum:
            - PLUGGABLE_DATABASE_OPEN_MODE_UNSPECIFIED
            - READ_ONLY
            - READ_WRITE
            - MOUNTED
            - MIGRATE
        pluggableDatabaseId:
          description: Required. The OCID of the Pluggable Database.
          type: string
      description: The Pluggable Database Node Level Details.
    EncryptionKeyHistoryEntry:
      type: object
      id: EncryptionKeyHistoryEntry
      description: >-
        The history of the encryption keys used to encrypt the Autonomous
        Database.
      properties:
        encryptionKey:
          readOnly: true
          description: >-
            Output only. The encryption key used to encrypt the Autonomous
            Database.
          $ref: '#/components/schemas/EncryptionKey'
        activationTime:
          description: >-
            Output only. The date and time when the encryption key was activated
            on the Autonomous Database..
          format: google-datetime
          type: string
          readOnly: true
    ListEntitlementsResponse:
      description: The response for `Entitlement.List`.
      properties:
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
          description: The list of Entitlements
      type: object
      id: ListEntitlementsResponse
    GoldengateMicrosoftFabricConnectionProperties:
      properties:
        tenantId:
          description: Optional. Azure tenant ID of the application.
          type: string
        endpoint:
          description: >-
            Optional. Optional Microsoft Fabric service endpoint. Default value:
            https://onelake.dfs.fabric.microsoft.com
          type: string
        clientId:
          description: Optional. Azure client ID of the application.
          type: string
        technologyType:
          description: Optional. The technology type of MicrosoftFabricConnection.
          type: string
        clientSecret:
          description: Optional. Client secret associated with the client id.
          type: string
      description: The properties of GoldengateMicrosoftFabricConnection.
      id: GoldengateMicrosoftFabricConnectionProperties
      type: object
    GoldengateDeployment:
      type: object
      id: GoldengateDeployment
      description: GoldengateDeployment Goldengate Deployment resource model.
      properties:
        displayName:
          description: Required. The display name for the GoldengateDeployment.
          type: string
        ociUrl:
          description: >-
            Output only. HTTPS link to OCI resources exposed to Customer via UI
            Interface.
          readOnly: true
          type: string
        odbNetwork:
          description: >-
            Optional. The name of the OdbNetwork associated with the
            GoldengateDeployment.
          type: string
        odbSubnet:
          description: >-
            Required. The name of the OdbSubnet associated with the
            GoldengateDeployment for IP allocation.
          type: string
        entitlementId:
          description: >-
            Output only. The ID of the subscription entitlement associated with
            the GoldengateDeployment
          readOnly: true
          type: string
        labels:
          description: >-
            Optional. The labels or tags associated with the
            GoldengateDeployment.
          additionalProperties:
            type: string
          type: object
        name:
          description: >-
            Identifier. The name of the GoldengateDeployment resource in the
            following format:
            projects/{project}/locations/{region}/goldengateDeployments/{goldengate_deployment}
          type: string
        gcpOracleZone:
          description: >-
            Optional. The GCP Oracle zone where Oracle GoldengateDeployment is
            hosted. Example: us-east4-b-r2. If not specified, the system will
            pick a zone based on availability.
          type: string
        createTime:
          description: >-
            Output only. The date and time that the GoldengateDeployment was
            created.
          format: google-datetime
          type: string
          readOnly: true
        properties:
          description: Required. The properties of the GoldengateDeployment.
          $ref: '#/components/schemas/GoldengateDeploymentProperties'
    Status:
      properties:
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          type: array
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
        code:
          type: integer
          format: int32
          description: The status code, which should be an enum value of google.rpc.Code.
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      type: object
    DeploymentDiagnosticData:
      description: The deployment diagnostic data.
      properties:
        diagnosticState:
          enum:
            - DIAGNOSTIC_STATE_UNSPECIFIED
            - IN_PROGRESS
            - SUCCEEDED
            - FAILED
          readOnly: true
          description: Output only. The diagnostic state.
          enumDescriptions:
            - The diagnostic state is unspecified.
            - The diagnostic is in progress.
            - The diagnostic completed successfully.
            - The diagnostic failed.
          type: string
        diagnosticEndTime:
          format: google-datetime
          description: Output only. The time diagnostic end.
          readOnly: true
          type: string
        namespace:
          description: Output only. The namespace name.
          type: string
          readOnly: true
        object:
          description: Output only. The object name.
          type: string
          readOnly: true
        bucket:
          readOnly: true
          type: string
          description: Output only. The bucket name.
        diagnosticStartTime:
          readOnly: true
          type: string
          format: google-datetime
          description: Output only. The time diagnostic start.
      type: object
      id: DeploymentDiagnosticData
    ListPluggableDatabasesResponse:
      id: ListPluggableDatabasesResponse
      type: object
      properties:
        pluggableDatabases:
          items:
            $ref: '#/components/schemas/PluggableDatabase'
          type: array
          description: The list of PluggableDatabases.
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
      description: The response for `PluggableDatabase.List`.
    GoldengateConnectionAssignment:
      id: GoldengateConnectionAssignment
      type: object
      properties:
        displayName:
          description: Optional. The display name for the GoldengateConnectionAssignment.
          type: string
        createTime:
          description: Output only. The time when the connection assignment was created.
          format: google-datetime
          type: string
          readOnly: true
        properties:
          $ref: '#/components/schemas/GoldengateConnectionAssignmentProperties'
          description: Required. The properties of the GoldengateConnectionAssignment.
        entitlementId:
          description: Output only. The OCID of the entitlement linked to this resource.
