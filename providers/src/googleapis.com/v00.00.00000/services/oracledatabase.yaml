      id: RestoreAutonomousDatabaseRequest
      properties:
        restoreTime:
          description: Required. The time and date to restore the database to.
          format: google-datetime
          type: string
      type: object
    ScheduledOperationDetails:
      description: >-
        Details of scheduled operation.
        https://docs.oracle.com/en-us/iaas/api/#/en/database/20160918/datatypes/ScheduledOperationDetails
      id: ScheduledOperationDetails
      properties:
        dayOfWeek:
          description: Output only. Day of week.
          enum:
            - DAY_OF_WEEK_UNSPECIFIED
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          enumDescriptions:
            - The day of the week is unspecified.
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          readOnly: true
          type: string
        startTime:
          $ref: '#/components/schemas/TimeOfDay'
          description: Output only. Auto start time.
          readOnly: true
        stopTime:
          $ref: '#/components/schemas/TimeOfDay'
          description: Output only. Auto stop time.
          readOnly: true
      type: object
    SourceConfig:
      description: The source configuration for the standby Autonomous Database.
      id: SourceConfig
      properties:
        autoRefreshFrequencySeconds:
          description: >-
            Optional. The frequency in seconds a refreshable clone is refreshed
            after auto-refresh is enabled.
          format: int32
          type: integer
        autoRefreshPointLagSeconds:
          description: >-
            Optional. The time, in seconds, the data of the automatic
            refreshable clone lags the primary database at the point of refresh.
          format: int32
          type: integer
        autoRefreshStartTime:
          description: >-
            Optional. The date and time that auto-refreshing will begin for an
            Autonomous Database refreshable clone. This value controls only the
            start time for the first refresh operation.
          format: google-datetime
          type: string
        automaticBackupsReplicationEnabled:
          description: >-
            Optional. This field specifies if the replication of automatic
            backups is enabled when creating a Data Guard.
          type: boolean
        autonomousDatabase:
          description: >-
            Optional. The name of the primary Autonomous Database that is used
            to create a Peer Autonomous Database from a source.
          type: string
        autonomousDatabaseBackup:
          description: >-
            Optional. The name of the Autonomous Database Backup resource with
            the format:
            projects/{project}/locations/{region}/autonomousDatabaseBackups/{autonomous_database_backup}
            Required when source_type is BACKUP_FROM_ID.
          type: string
        backupTime:
          description: >-
            Optional. The timestamp specified for the point-in-time clone of the
            source Autonomous Database. This field is only applicable in case of
            BACKUP_FROM_TIMESTAMP source type and when
            use_latest_available_backup is false.
          format: google-datetime
          type: string
        cloneType:
          description: >-
            Optional. The clone type of the Autonomous Database. This field is
            only applicable in case of cloning
          enum:
            - CLONE_TYPE_UNSPECIFIED
            - FULL
            - METADATA
          enumDescriptions:
            - Default unspecified value.
            - >-
              Creates a new database with the source database's data and
              metadata.
            - >-
              Creates a new database that includes all the source database
              schema metadata, but none of the source database data.
          type: string
        refreshableMode:
          description: Optional. The refresh mode of the clone.
          enum:
            - REFRESHABLE_MODE_UNSPECIFIED
            - AUTOMATIC
            - MANUAL
          enumDescriptions:
            - Default unspecified value.
            - Automatic refresh.
            - Manual refresh.
          type: string
        sourceType:
          description: Optional. The source type of the Autonomous Database.
          enum:
            - SOURCE_TYPE_UNSPECIFIED
            - CLONE_DATABASE
            - CROSS_REGION_DISASTER_RECOVERY
            - CLONE_TO_REFRESHABLE
            - BACKUP_FROM_ID
            - BACKUP_FROM_TIMESTAMP
          enumDescriptions:
            - Default unspecified value.
            - >-
              Clone database from an existing database specified in
              autonomous_database field.
            - >-
              Create a cross-region disaster recovery peer adb from an existing
              adb.
            - >-
              Create a refreshable clone from an existing database specified in
              autonomous_database field.
            - Create clone from the backup resource.
            - >-
              Create clone from backup specified by backup_time field, or use
              latest available backup if use_latest_available_backup is true.
              The autonomous_database field must specify the source database to
              clone from.
          type: string
        useLatestAvailableBackup:
          description: >-
            Optional. Clone from latest available backup timestamp. This field
            is only applicable in case of BACKUP_FROM_TIMESTAMP source type.
          type: boolean
      type: object
