    RefreshAutonomousDatabaseRequest:
      description: Request message for RefreshAutonomousDatabase method.
      id: RefreshAutonomousDatabaseRequest
      properties:
        refreshCutoffTime:
          description: >-
            Required. The timestamp to which the Autonomous Database refreshable
            clone will be refreshed. Changes made in the primary database after
            this timestamp are not part of the data refresh.
          format: google-datetime
          type: string
      type: object
    RemoveVirtualMachineExadbVmClusterRequest:
      description: The request for `ExadbVmCluster.RemoveVirtualMachine`.
      id: RemoveVirtualMachineExadbVmClusterRequest
      properties:
        hostnames:
          description: >-
            Required. The list of host names of db nodes to be removed from the
            ExadbVmCluster.
          items:
            type: string
          type: array
        requestId:
          description: >-
            Optional. An optional ID to identify the request. This value is used
            to identify duplicate requests. If you make a request with the same
            request ID and the original request is still in progress or
            completed, the server ignores the second request. This prevents
            clients from accidentally creating duplicate commitments. The
            request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
          type: string
      type: object
    RestIcebergCatalog:
      description: The REST Iceberg catalog.
      id: RestIcebergCatalog
      properties:
        properties:
          description: >-
            Optional. The base64 encoded content of the configuration file
            containing additional properties for the REST catalog.
          type: string
        uri:
          description: Required. The REST uri.
          type: string
      type: object
