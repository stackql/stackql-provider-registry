      description: The maintenance configuration of the GoldengateDeployment.
      id: GoldengateMaintenanceConfig
      properties:
        bundleReleaseUpgradePeriodDays:
          description: >-
            Optional. Defines auto upgrade period for bundle releases. Manually
            configured period cannot be longer than service defined period for
            bundle releases. This period must be shorter or equal to major
            release upgrade period. Not passing this field during create will
            equate to using the service default.
          format: int32
          type: integer
        interimReleaseUpgradePeriodDays:
          description: >-
            Optional. Defines auto upgrade period for interim releases. This
            period must be shorter or equal to bundle release upgrade period.
          format: int32
          type: integer
        isInterimReleaseAutoUpgradeEnabled:
          description: >-
            Optional. By default auto upgrade for interim releases are not
            enabled. If auto-upgrade is enabled for interim release, you have to
            specify interim_release_upgrade_period_days too.
          type: boolean
        majorReleaseUpgradePeriodDays:
          description: >-
            Optional. Defines auto upgrade period for major releases. Manually
            configured period cannot be longer than service defined period for
            major releases. Not passing this field during create will equate to
            using the service default.
          format: int32
          type: integer
        securityPatchUpgradePeriodDays:
          description: >-
            Optional. Defines auto upgrade period for releases with security
            fix. Manually configured period cannot be longer than service
            defined period for security releases. Not passing this field during
            create will equate to using the service default.
          format: int32
          type: integer
      type: object
