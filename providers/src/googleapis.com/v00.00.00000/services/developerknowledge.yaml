components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    Answer:
      description: An answer to a query.
      id: Answer
      properties:
        answerText:
          description: Contains the text of the answer.
          type: string
        citations:
          description: Output only. Contains citations for the answer.
          items:
            $ref: '#/components/schemas/AnswerCitation'
          readOnly: true
          type: array
        references:
          description: Output only. Contains references for the answer.
          items:
            $ref: '#/components/schemas/AnswerReference'
          readOnly: true
          type: array
      type: object
    AnswerCitation:
      description: Citation info for a segment.
      id: AnswerCitation
      properties:
        endIndex:
          description: >-
            Output only. Indicates the end of the segment, measured in bytes
            (UTF-8 unicode), exclusive. If there are multi-byte characters, such
            as non-ASCII characters, the index measurement is longer than the
            string length.
          format: int32
          readOnly: true
          type: integer
        sources:
          description: Output only. Contains citation sources for the attributed segment.
          items:
            $ref: '#/components/schemas/CitationSource'
          readOnly: true
          type: array
        startIndex:
          description: >-
            Output only. Indicates the start of the segment, measured in bytes
            (UTF-8 unicode), inclusive. If there are multi-byte characters, such
            as non-ASCII characters, the index measurement is longer than the
            string length.
          format: int32
          readOnly: true
          type: integer
      type: object
    AnswerQueryRequest:
      description: Request message for DeveloperKnowledge.AnswerQuery.
      id: AnswerQueryRequest
      properties:
        query:
          description: Required. The query to answer.
          type: string
      type: object
    AnswerQueryResponse:
      description: Response message for DeveloperKnowledge.AnswerQuery.
      id: AnswerQueryResponse
      properties:
        answer:
          $ref: '#/components/schemas/Answer'
          description: The answer to the query.
      type: object
    AnswerReference:
      description: Represents a reference to a source.
      id: AnswerReference
      properties:
        documentReference:
          $ref: '#/components/schemas/DocumentReference'
          description: Output only. The reference document.
          readOnly: true
      type: object
    BatchGetDocumentsResponse:
      description: Response message for DeveloperKnowledge.BatchGetDocuments.
      id: BatchGetDocumentsResponse
      properties:
        documents:
          description: Contains the documents requested.
          items:
            $ref: '#/components/schemas/Document'
          type: array
      type: object
    CitationSource:
      description: Citation source.
      id: CitationSource
      properties:
        referenceIndex:
          description: >-
            Output only. Contains the index of the Answer.AnswerReference in the
            `references` repeated field.
          format: int32
          readOnly: true
          type: integer
      type: object
    Document:
      description: >-
        A Document represents a page of documentation in the Developer Knowledge
        corpus, like the page at
        https://docs.cloud.google.com/storage/docs/creating-buckets.
      id: Document
      properties:
        content:
          description: >-
            Output only. Contains the full content of the document in Markdown
            format.
          readOnly: true
          type: string
        contentLengthBytes:
          description: Output only. The length of the `content` field in bytes.
          format: int32
          readOnly: true
          type: integer
        dataSource:
          description: >-
            Output only. Specifies the data source of the document. Example data
            source: `firebase.google.com`
          readOnly: true
          type: string
        description:
          description: Output only. Provides a description of the document.
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. Contains the resource name of the document. Format:
            `documents/{uri_without_scheme}` Example:
            `documents/docs.cloud.google.com/storage/docs/creating-buckets`
          type: string
        title:
          description: Output only. Provides the title of the document.
          readOnly: true
          type: string
        updateTime:
          description: >-
            Output only. Represents the timestamp when the content or metadata
            of the document was last updated.
          format: google-datetime
          readOnly: true
          type: string
        uri:
          description: >-
            Output only. Provides the URI of the content, such as
            `docs.cloud.google.com/storage/docs/creating-buckets`.
          readOnly: true
          type: string
        view:
          description: Output only. Specifies the DocumentView of the document.
          enum:
            - DOCUMENT_VIEW_UNSPECIFIED
            - DOCUMENT_VIEW_BASIC
            - DOCUMENT_VIEW_FULL
            - DOCUMENT_VIEW_CONTENT
          enumDescriptions:
            - >-
              The default / unset value. See each API method for its default
              value if DocumentView is not specified.
            - >-
              Includes only the basic metadata fields: - `name` - `uri` -
              `data_source` - `title` - `description` - `update_time` - `view` -
              `content_length_bytes` This is the default of view for
              DeveloperKnowledge.SearchDocumentChunks.
            - Includes all Document fields.
            - >-
              Includes the `DOCUMENT_VIEW_BASIC` fields and the `content` field.
              This is the default of view for DeveloperKnowledge.GetDocument and
              DeveloperKnowledge.BatchGetDocuments.
          readOnly: true
          type: string
      type: object
    DocumentChunk:
      description: >-
        A DocumentChunk represents a piece of content from a Document in the
        DeveloperKnowledge corpus. To fetch the entire document content, pass
        the `parent` to DeveloperKnowledge.GetDocument or
        DeveloperKnowledge.BatchGetDocuments.
      id: DocumentChunk
      properties:
        content:
          description: Output only. Contains the content of the document chunk.
          readOnly: true
          type: string
        document:
          $ref: '#/components/schemas/Document'
          description: >-
            Output only. Represents metadata about the Document this chunk is
            from. The DocumentView of this Document message will be set to
            `DOCUMENT_VIEW_BASIC`. It is included here for convenience so that
            clients do not need to call DeveloperKnowledge.GetDocument or
            DeveloperKnowledge.BatchGetDocuments if they only need the metadata
            fields. Otherwise, clients should use DeveloperKnowledge.GetDocument
            or DeveloperKnowledge.BatchGetDocuments to fetch the full document
            content.
          readOnly: true
        id:
          description: >-
            Output only. Specifies the ID of this chunk within the document. The
            chunk ID is unique within a document, but not globally unique across
            documents. The chunk ID is not stable and may change over time.
          readOnly: true
          type: string
        parent:
          description: >-
            Output only. Contains the resource name of the document this chunk
            is from. Format: `documents/{uri_without_scheme}` Example:
            `documents/docs.cloud.google.com/storage/docs/creating-buckets`
          readOnly: true
          type: string
        relevanceScore:
          description: >-
            Output only. Represents the relevance score of the chunk to the
            search query. Higher score indicates higher chunk relevance. The
            score is in range [0.0, 1.0].
          format: double
          readOnly: true
          type: number
      type: object
    DocumentReference:
      description: Represents a reference to a document.
      id: DocumentReference
      properties:
        documentChunk:
          $ref: '#/components/schemas/DocumentChunk'
          description: >-
            Output only. Contains the document chunk. The `document_chunk.id`
            field is not set and will be empty.
          readOnly: true
      type: object
    SearchDocumentChunksResponse:
      description: Response message for DeveloperKnowledge.SearchDocumentChunks.
      id: SearchDocumentChunksResponse
      properties:
        nextPageToken:
          description: >-
            Provides a token that can be sent as `page_token` to retrieve the
            next page. If this field is omitted, there are no subsequent pages.
          type: string
        results:
          description: >-
            Contains the search results for the given query. Each DocumentChunk
            in this list contains a snippet of content relevant to the search
            query. Use the DocumentChunk.parent field of each result with
            DeveloperKnowledge.GetDocument or
            DeveloperKnowledge.BatchGetDocuments to retrieve the full document
            content.
          items:
            $ref: '#/components/schemas/DocumentChunk'
          type: array
      type: object
  securitySchemes:
