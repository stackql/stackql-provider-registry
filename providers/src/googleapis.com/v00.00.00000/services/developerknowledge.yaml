      operationId: developerknowledge.answerQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerQueryRequest'
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerQueryResponse'
      parameters: []
