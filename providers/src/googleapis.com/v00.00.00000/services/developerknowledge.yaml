paths:
  /v1/documents:searchDocumentChunks:
    parameters: &ref_1
      - $ref: '#/components/parameters/_.xgafv'
      - $ref: '#/components/parameters/upload_protocol'
      - $ref: '#/components/parameters/uploadType'
      - $ref: '#/components/parameters/prettyPrint'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/oauth_token'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/key'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/quotaUser'
      - $ref: '#/components/parameters/callback'
    get:
      description: >-
        Searches for developer knowledge across Google's developer
        documentation. Returns DocumentChunks based on the user's query. There
        may be many chunks from the same Document. To retrieve full documents,
        use DeveloperKnowledge.GetDocument or
        DeveloperKnowledge.BatchGetDocuments with the DocumentChunk.parent
        returned in the SearchDocumentChunksResponse.results.
      operationId: developerknowledge.documents.searchDocumentChunks
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentChunksResponse'
      parameters:
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: pageSize
          schema:
            type: integer
            format: int32
        - in: query
          name: filter
          schema:
            type: string
        - in: query
          name: pageToken
          schema:
            type: string
  /v1/documents:batchGet:
    parameters: *ref_1
    get:
      description: Retrieves multiple documents, each with its full Markdown content.
      operationId: developerknowledge.documents.batchGet
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGetDocumentsResponse'
      parameters:
        - in: query
          name: names
          schema:
            type: string
        - in: query
          name: view
          schema:
            type: string
  /v1/documents/{documentsId}:
    parameters: *ref_1
    get:
      description: Retrieves a single document with its full Markdown content.
      operationId: developerknowledge.documents.get
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
      parameters:
        - in: path
          name: documentsId
          required: true
          schema:
            type: string
        - in: query
          name: view
          schema:
            type: string
  /v1:answerQuery:
    parameters: *ref_1
    post:
