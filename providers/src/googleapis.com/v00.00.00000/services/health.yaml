          type: string
          format: google-duration
      id: SedentaryPeriodRollupValue
    HeartRateVariability:
      id: HeartRateVariability
      description: >-
        Captures user's heart rate variability (HRV) as measured by the root
        mean square of successive differences (RMSSD) between normal heartbeats
        or by standard deviation of the inter-beat intervals (SDNN).
      type: object
      properties:
        sampleTime:
          $ref: '#/components/schemas/ObservationSampleTime'
          description: Required. The time of the heart rate variability measurement.
        rootMeanSquareOfSuccessiveDifferencesMilliseconds:
          description: >-
            Optional. The root mean square of successive differences between
