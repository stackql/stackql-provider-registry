          type: array
        description:
          description: Optional. The description of the food.
          type: string
        servings:
          items:
            $ref: '#/components/schemas/FoodServing'
          description: Optional. The serving of the food.
          type: array
        totalFat:
          $ref: '#/components/schemas/WeightQuantity'
          description: >-
            Optional. Value representing the total fat of the food for the
            default serving.
        energyMin:
          $ref: '#/components/schemas/EnergyQuantity'
          description: >-
            Optional. Value representing the minimum energy of the food for the
            default serving.
        mealType:
          description: Optional. The meal type associated with this food.
          type: string
          enum:
            - MEAL_TYPE_UNSPECIFIED
            - BEFORE_BREAKFAST
            - BREAKFAST
            - BEFORE_LUNCH
            - LUNCH
            - BEFORE_DINNER
            - DINNER
            - AFTER_DINNER
            - SNACK
            - ANYTIME
          enumDescriptions:
            - Unspecified meal type.
            - Value representing a meal before breakfast.
            - Value representing a breakfast.
            - Value representing a morning snack.
            - Value representing a lunch.
            - Value representing an afternoon snack.
            - Value representing dinner.
            - Value representing an evening snack.
            - >-
              Value representing any meal outside of the usual three meals per
              day.
            - Value representing any time (legacy NA).
      description: Represents a food item.
      type: object
      id: Food
    SedentaryPeriodRollupValue:
