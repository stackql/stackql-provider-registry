    Empty:
      id: Empty
      properties: {}
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      type: object
    Identity:
      id: Identity
      description: Represents details about the Google user's identity.
      type: object
      properties:
        legacyUserId:
          description: >-
            Output only. The legacy Fitbit User identifier. This is the Fitbit
            ID used in the legacy Fitbit APIs (v1-v3). It can be referenced by
            clients migrating from the legacy Fitbit APIs to map their existing
            identifiers to the new Google user ID. It **must not** be used for
            any other purpose. It is not of any use for new clients using only
            the Google Health APIs. Valid values are strings of 1-63 characters,
            and valid characters are lowercase and uppercase letters, numbers,
            and hyphens.
          type: string
          readOnly: true
        healthUserId:
          description: >-
            Output only. The Google User Identifier in the Google Health APIs.
            It matches the `{user}` resource ID segment in the resource name
            paths, e.g. `users/{user}/dataTypes/steps`. Valid values are strings
            of 1-63 characters, and valid characters are lowercase and uppercase
            letters, numbers, and hyphens.
          type: string
          readOnly: true
        name:
          description: >-
            Identifier. The resource name of this Identity resource. Format:
            `users/me/identity`
          type: string
    DailyHeartRateVariability:
      id: DailyHeartRateVariability
      description: >-
        Represents the daily heart rate variability data type. At least one of
        the following fields must be set: -
        `average_heart_rate_variability_milliseconds` -
        `non_rem_heart_rate_beats_per_minute` - `entropy` -
        `deep_sleep_root_mean_square_of_successive_differences_milliseconds`
      type: object
      properties:
        date:
          description: >-
            Required. Date (in the user's timezone) of heart rate variability
            measurement.
          $ref: '#/components/schemas/Date'
        averageHeartRateVariabilityMilliseconds:
          description: >-
            Optional. A user's average heart rate variability calculated using
            the root mean square of successive differences (RMSSD) in times
            between heartbeats.
          type: number
          format: double
        entropy:
          description: >-
            Optional. The Shanon entropy of heartbeat intervals. Entropy
            quantifies randomness or disorder in a system. High entropy
            indicates high HRV. Entropy is measured from the histogram of time
            interval between successive heart beats values measured during
            sleep.
          type: number
          format: double
        deepSleepRootMeanSquareOfSuccessiveDifferencesMilliseconds:
          description: >-
            Optional. The root mean square of successive differences (RMSSD)
            value during deep sleep.
          type: number
          format: double
        nonRemHeartRateBeatsPerMinute:
          description: Optional. Non-REM heart rate
          type: string
          format: int64
