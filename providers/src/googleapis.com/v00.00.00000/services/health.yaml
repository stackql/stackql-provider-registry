    SleepSummary:
      id: SleepSummary
      properties:
        minutesAfterWakeUp:
          description: >-
            Output only. Minutes after wake up calculated by restlessness
            algorithm.
          type: string
          format: int64
          readOnly: true
        minutesAsleep:
          description: >-
            Output only. Total number of minutes asleep. For classic sleep it is
            the sum of ASLEEP stages (excluding AWAKE and RESTLESS). For
            "stages" sleep it is the sum of LIGHT, REM and DEEP stages
            (excluding AWAKE).
          type: string
          format: int64
          readOnly: true
        stagesSummary:
          description: >-
            Output only. List of summaries (total duration and segment count)
            per each sleep stage type.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/StageSummary'
        minutesAwake:
          readOnly: true
          description: >-
            Output only. Total number of minutes awake. It is a sum of all AWAKE
            stages.
          type: string
          format: int64
        minutesInSleepPeriod:
          readOnly: true
          description: >-
            Output only. Delta between wake time and bedtime. It is the sum of
            all stages.
          type: string
          format: int64
        minutesToFallAsleep:
          description: >-
            Output only. Minutes to fall asleep calculated by restlessness
            algorithm.
          type: string
          format: int64
          readOnly: true
      description: ' Sleep summary: metrics and stages summary.'
      type: object
