          type: number
          format: double
        standardDeviationMilliseconds:
          description: >-
            Optional. The standard deviation of the heart rate variability
            measurement.
          type: number
          format: double
    DailyHeartRateZones:
      id: DailyHeartRateZones
      properties:
        heartRateZones:
          items:
            $ref: '#/components/schemas/HeartRateZone'
          description: Required. The heart rate zones.
          type: array
        date:
          description: Required. Date (in user's timezone) of the heart rate zones record.
          $ref: '#/components/schemas/Date'
      description: >-
        User's heart rate zone thresholds based on the Karvonen algorithm for a
