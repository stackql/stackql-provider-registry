    SubscriberConfig:
      description: >-
        Configuration for a subscriber. A notification is sent to a subscription
        ONLY if the subscriber has a config for the data type.
      type: object
      properties:
        dataTypes:
          items:
            type: string
          description: >-
            Required. See [Google Health API data
            types](https://developers.google.com/health/data-types) for the list
            of supported data types. Values should be in kebab-case.
          type: array
        subscriptionCreatePolicy:
          description: Required. Policy for subscription creation.
          type: string
          enum:
            - SUBSCRIPTION_CREATE_POLICY_UNSPECIFIED
            - AUTOMATIC
            - MANUAL
          enumDescriptions:
            - Represents an unspecified policy.
            - >-
              When using `AUTOMATIC`, individual subscriptions are not created
              or stored. Instead, eligibility for notifications is computed
              dynamically. When a data update occurs for a given data type,
              notifications are sent to all subscribers with an `AUTOMATIC`
              policy for that data type, provided the user has granted the
              necessary consents. This means you do not need to call
              `CreateSubscription` for each user; notifications are managed
              automatically based on user consents. As `Subscription` resources
              are not stored, they cannot be retrieved or managed through
              `GetSubscription`, `ListSubscriptions`, `UpdateSubscription`, or
              `DeleteSubscription`.
            - >-
              Requires subscriptions to be created manually for new users. The
              developer needs to call CreateSubscription for new users.
      id: SubscriberConfig
    ActiveMinutes:
      description: Record of active minutes in a given time interval.
