    Electrocardiogram:
      id: Electrocardiogram
      description: >-
        Represents an Electrocardiogram (ECG) measurement session. This data
        type is based on SaMD feature and any changes to it may require
        additional review.
      type: object
      properties:
        beatsPerMinuteAvg:
          description: >-
            Optional. Average heart rate recorded during ECG reading in beats
            per minute.
          type: string
          format: int64
        millivoltsScalingFactor:
          description: >-
            Optional. The factor by which to divide waveform samples to get
            voltage in millivolts: millivolts = waveform_sample /
            millivolts_scaling_factor.
          type: integer
          format: int32
        interval:
          description: >-
            Required. Observed interval. NOTE: Historical ECG data lacks
            timezone offsets, so `start_utc_offset` and `end_utc_offset` will be
            missing or default to zero. As a result, the civil time fields
            within this interval will default to UTC. It is recommended to use
            physical time fields instead for accurate time referencing. NOTE:
            The `start_time` and `end_time` of the interval are equal,
            representing the reading time.
          $ref: '#/components/schemas/SessionTimeInterval'
        resultClassification:
          description: Optional. The result classification of the ECG reading.
          type: string
          enum:
            - RESULT_CLASSIFICATION_UNSPECIFIED
            - NORMAL_SINUS_RHYTHM
            - ATRIAL_FIBRILLATION
            - INCONCLUSIVE
            - INCONCLUSIVE_HIGH_HEART_RATE
            - INCONCLUSIVE_LOW_HEART_RATE
            - UNREADABLE
            - NOT_ANALYZED
          enumDescriptions:
            - Unspecified result classification.
            - >-
              Heart rhythm appears normal. Corresponds to result "Normal Sinus
              Rhythm".
            - >-
              Signs of Atrial Fibrillation detected. Corresponds to result
              "Atrial Fibrillation".
            - >-
              The reading is inconclusive as it could not be classified.
              Corresponds to result "Inconclusive".
            - >-
              The reading is inconclusive as it could not be classified because
              heart rate is high (>120bpm). Corresponds to result "Inconclusive:
              High heart rate".
            - >-
              The reading is inconclusive as it could not be classified because
              heart rate is low (<50bpm). Corresponds to result "Inconclusive:
              Low heart rate".
            - The reading is unreadable.
            - The reading was not analyzed.
        waveformSamples:
          items:
            type: integer
            format: int32
          description: >-
            Optional. An array of voltage values representing lead I ECG values.
            Each sample represents voltage difference in ECG graph. The first
            value in array corresponds to the start of the reading.
          type: array
        samplingFrequencyHertz:
