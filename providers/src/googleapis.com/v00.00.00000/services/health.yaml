          type: string
          readOnly: true
        amount:
          description: Optional. Amount of food consumed, fractional values are supported.
          type: number
          format: double
      id: FoodServing
    SwimLengthsData:
      id: SwimLengthsData
      properties:
        interval:
          description: Required. Observed interval.
          $ref: '#/components/schemas/ObservationTimeInterval'
        strokeCount:
          description: Required. Number of strokes in the lap.
          type: string
          format: int64
        swimStrokeType:
          description: Required. Swim stroke type.
          type: string
          enum:
