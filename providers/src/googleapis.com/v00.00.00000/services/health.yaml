    WeightQuantityRollup:
      description: Rollup for the weight.
      type: object
      properties:
        userProvidedUnitLast:
          enumDescriptions:
            - Unspecified weight unit.
            - Value representing gram.
            - Value representing kilogram.
            - Value representing ounce.
            - Value representing pound.
            - Value representing stone.
            - Value representing milligram.
            - Value representing microgram.
            - Value representing nanogram.
          description: Optional. The user provided unit on the last element.
          type: string
          enum:
            - WEIGHT_UNIT_UNSPECIFIED
            - GRAM
            - KILOGRAM
            - OUNCE
            - POUND
            - STONE
            - MILLIGRAM
            - MICROGRAM
            - NANOGRAM
        gramsSum:
          description: Required. The sum of the weight in grams.
          type: number
          format: double
      id: WeightQuantityRollup
    ExerciseEvent:
      id: ExerciseEvent
      properties:
        exerciseEventType:
          description: Required. The type of the event, such as start, stop, pause, resume.
          type: string
          enum:
            - EXERCISE_EVENT_TYPE_UNSPECIFIED
            - START
            - STOP
            - PAUSE
            - RESUME
            - AUTO_PAUSE
            - AUTO_RESUME
          enumDescriptions:
            - Exercise event type is unspecified.
            - Exercise start event.
            - Exercise stop event.
            - Exercise pause event.
            - Exercise resume event.
            - Exercise auto-pause event.
            - Exercise auto-resume event.
        eventTime:
          description: Required. Exercise event time
          type: string
          format: google-datetime
        eventUtcOffset:
          description: Required. Exercise event time offset from UTC
          type: string
          format: google-duration
      description: >-
        Represents instantaneous events that happen during an exercise, such as
        start, stop, pause, split.
      type: object
    ActiveEnergyBurnedRollupValue:
      description: Represents the result of the rollup of active energy burned.
      type: object
      properties:
        kcalSum:
          readOnly: true
          description: Output only. Sum of the active energy burned in kilocalories.
          type: number
          format: double
      id: ActiveEnergyBurnedRollupValue
    PairedDevice:
      id: PairedDevice
      description: >-
        User's Paired 1P Device The PairedDevice details include information
        about the device type, battery status, battery level, last sync time,
        device version, mac address, and features.
      type: object
      properties:
        name:
          description: >-
            Identifier. The resource name of this Device resource. Format:
            `users/{user}/pairedDevices/{paired_device}` Example:
            `users/1234567890/pairedDevices/123` or `users/me/pairedDevices/123`
          type: string
        batteryStatus:
          readOnly: true
          description: >-
            Output only. The battery status of the device. Supported: High |
            Medium | Low | Empty
          type: string
        batteryLevel:
          readOnly: true
          description: Output only. The battery level of the device.
          type: integer
          format: int32
        lastSyncTime:
          description: >-
            Output only. The time of last sync with the Fitbit mobile
            application.
          type: string
          format: google-datetime
          readOnly: true
        macAddress:
          readOnly: true
          description: Output only. Mac ID number of the device.
          type: string
        deviceVersion:
          readOnly: true
          description: Output only. The product name of the device
          type: string
        deviceType:
          type: string
          enumDescriptions:
            - Device type is not specified.
            - Device type is tracker.
            - Device type is scale.
          description: 'Output only. The device type. Supported: TRACKER | SCALE'
          enum:
            - DEVICE_TYPE_UNSPECIFIED
            - TRACKER
            - SCALE
          readOnly: true
        features:
          readOnly: true
          items:
            type: string
          description: >-
            Output only. Lists of unique features supported by the device.
            Comprehensive list of supported features: **Fitness Tracking** -
            `ACTIVE_MINUTES`: Legacy active minutes. - `AUTOSTRIDE`: Automatic
            stride length calculation. - `BIKE_ONBOARDING`: Cycling UI support.
            - `CALORIES`: Daily burned calories. - `DISTANCE`: Daily distance
            tracking. - `ELEVATION`: Floors climbed. - `INACTIVITY_ALERTS`:
            Reminders to move. - `SEDENTARY_TIME`: Tracks inactive time. -
            `STEPS`: Daily steps. - `SWIM`: Swim tracking (laps/strokes). -
            `AUTORUN`: Automatic run detection. - `ACTIVE_ZONE_MINUTES`: Active
            Zone Minutes (AZM). **Heart Rate & Health** - `HEART_RATE`:
            Continuous heart rate (PPG). - `BAT_SIGNAL`: High/Low Heart Rate
            Alerts. **Advanced Sensors** - `SPO2`: Blood oxygen saturation. -
            `NIGHTTIME_OXYGEN_SATURATION`: Sleep SpO2. -
            `ESTIMATED_OXYGEN_VARIATION`: Estimated Oxygen Variation. - `EDA`:
            Electrodermal Activity (stress). - `SKIN_TEMPERATURE`: Skin
            temperature variation. - `INTERNAL_DEVICE_TEMPERATURE`: Internal
            device temperature. **Sleep & Wellness** - `SLEEP`: Basic sleep
            tracking. - `SMART_SLEEP`: Advanced sleep tracking (stages/score). -
            `BEDTIME_REMINDER`: Bedtime reminders. - `SOUNDSCAPE`: Snore and
            noise detection. **Advanced Workouts** - `WB`: Custom Workout
            Builder. - `AUTOCUES`: Auto Cues / Auto Lap. - `DWR_RUN`: Daily Run
            Recommendations. - `ADVANCED_RUNNING`: Advanced Running Dynamics
            (e.g., GCT, VO). **GPS & Location** - `GPS`: Built-in GPS. -
            `CONNECTED_GPS`: Connected GPS (uses phone). - `LOCATION_HINT`:
            Location helper. **Payments & NFC** - `PAYMENTS`: NFC payments
            (Fitbit Pay/Google Wallet). - `FELICA`: FeliCa support (Japan
            payments/transit). **Activity Detection** - `GROK`: SmartTrack
            automatic activity detection. - `RETRO_AR`: Retroactive Activity
            Recognition prompts. **Smart Features & UI** - `ALARMS`: Silent
            alarms. - `BLE_MUSIC_CONTROL`: BLE music control. - `MUSIC`: Direct
            music storage/control. - `YOUTUBE_MUSIC_SUPPORTED`: YouTube Music
            support. - `GALLERY`: App Gallery. - `TUTORIAL_SUPPORTED`: On-screen
            tutorials. - `SMILEY_EMOTE`: Legacy Zip face. -
            `MOBILE_TO_DEVICE_DEEPLINK`: Mobile to device settings deep link. -
            `HIDE_GALLERY`: Option to hide Gallery. - `HIDE_GOAL_SELECTION`:
            Option to hide goal selection. - `DIGITAL_WARRANTY_SUPPORTED`:
            Digital warranty display. - `DIRECT_DEVICE_SETTINGS_SUPPORTED`:
            Direct device settings management. **Gym HR Broadcasting** -
            `ASPEN_SUPPORTED`: Broadcast HR to gym equipment. -
            `ASPEN_REMOTE_UI_SUPPORTED`: Remote UI for HR sharing. **Privacy &
            Security** - `FINITE_IMPROBABILITY`: BLE Resolvable Private Address
            (RPA) privacy. - `DOMAIN_KEY_SYNC`: Domain key synchronization.
            **BLE Protocol** - `BONDING`: Secure BLE bonding. -
            `ADVERTISES_SERIAL`: Advertises serial number. -
            `STATUS_CHARACTERISTIC`: BLE Status Characteristic. -
            `TRACKER_CHANNEL_CHARACTERISTIC`: BLE Tracker Channel
            Characteristic. - `PING_CHARACTERISTIC`: BLE Ping Characteristic.
            **Cellular & Wi-Fi** - `MOBILE_DATA`: LTE cellular support. -
            `SINGLE_AP_WIFI`: Single AP Wi-Fi. - `MULTI_AP_WIFI`: Multi AP
            Wi-Fi. - `WIFI_FWUP`: Firmware updates over Wi-Fi. **Data Sync &
            Transfer** - `APP_SYNC`: Background app sync. - `LIVE_DATA`:
            Real-time data streaming. - `EVENT_BASED_SYNC_SUPPORTED`:
            Event-based sync. - `TIME_SERVICE`: Time synchronization service. -
            `REMOTE_FILE_PROVIDER`: Remote file transfer. -
            `DIRECT_COMMS_ALARMS`: Direct communication for alarms. -
            `DIRECT_COMMS_EXERCISE`: Direct communication for exercise. -
            `DIRECT_COMMS_BATTERY_ALERTS`: Direct communication for battery
            alerts. **Google Integrations** - `PARROT_TREE_SUPPORTED`: Find My
            Device support.
          type: array
    RestingHeartRatePersonalRangeRollupValue:
      properties:
        beatsPerMinuteMin:
          description: >-
            The lower bound of the user's daily resting heart rate personal
            range.
          type: number
          format: double
        beatsPerMinuteMax:
          description: >-
            The upper bound of the user's daily resting heart rate personal
            range.
          type: number
          format: double
      description: Represents the rollup value for the daily resting heart rate data type.
      type: object
      id: RestingHeartRatePersonalRangeRollupValue
    GoogleDevicesandservicesHealthV4DataType:
      id: GoogleDevicesandservicesHealthV4DataType
      properties:
        name:
          description: >-
            Identifier. The resource name of the data type. Format:
            `users/{user}/dataTypes/{data_type}` See DataPoint.name for examples
            and possible values.
          type: string
      description: >-
        Represents a type of health data a user can have data points recorded
        for. It matches the parent resource of collection containing data points
        of the given type. Clients currently do not need to interact with this
        resource directly.
      type: object
    MobilityMetrics:
      description: Mobility workouts specific metrics
      type: object
      properties:
        avgStrideLengthMillimeters:
          description: >-
            Optional. Stride length is a measure of the distance covered by a
            single stride
          type: string
          format: int64
        avgVerticalRatio:
          description: Optional. Vertical oscillation/stride length between [5.0, 11.0].
          type: number
          format: double
        avgCadenceStepsPerMinute:
          description: >-
            Optional. Cadence is a measure of the frequency of your foot
            strikes. Steps / min in real time during workout.
          type: number
          format: double
        avgVerticalOscillationMillimeters:
          description: >-
            Optional. Distance off the ground your center of mass moves with
            each stride while running
          type: string
          format: int64
        avgGroundContactTimeDuration:
          description: >-
            Optional. The ground contact time for a particular stride is the
            amount of time for which the foot was in contact with the ground on
            that stride
          type: string
          format: google-duration
      id: MobilityMetrics
    SwimLengthsDataRollupValue:
      id: SwimLengthsDataRollupValue
      properties:
        strokeCountSum:
          description: Total number of swim strokes in the interval.
          type: string
          format: int64
      description: Represents the result of the rollup of the swim lengths data type.
      type: object
    HeartRateRollupValue:
      id: HeartRateRollupValue
      properties:
        beatsPerMinuteAvg:
          description: The average heart rate value in the interval.
          type: number
          format: double
        beatsPerMinuteMin:
          description: The minimum heart rate value in the interval.
          type: number
          format: double
        beatsPerMinuteMax:
          description: The maximum heart rate value in the interval.
          type: number
          format: double
      description: Represents the result of the rollup of the heart rate data type.
      type: object
    Steps:
      description: Step count over the time interval.
      type: object
      properties:
        interval:
          description: Required. Observed interval.
          $ref: '#/components/schemas/ObservationTimeInterval'
        count:
          description: Required. Number of steps in the recorded interval.
          type: string
          format: int64
      id: Steps
    Distance:
      id: Distance
      description: Distance traveled over an interval of time.
      type: object
      properties:
        interval:
          description: Required. Observed interval.
          $ref: '#/components/schemas/ObservationTimeInterval'
        millimeters:
          description: Required. Distance in millimeters over the observed interval.
          type: string
          format: int64
    HeartBeat:
      description: A single heart beat measurement.
      type: object
      properties:
        physicalTime:
          description: Required. The time of the heart beat measurement.
          type: string
          format: google-datetime
        civilTime:
          $ref: '#/components/schemas/CivilDateTime'
          description: >-
            Output only. The civil time in the timezone the subject is in at the
            time of the observation.
          readOnly: true
        beatsPerMinute:
          description: >-
            Required. The beats-per-minute value extrapolated from the time
            before the following heart beat. This is calculated as 60000 / rr,
            where rr is the gap between heart beats in milliseconds (IBI -
            Interbeat Interval).
          type: integer
          format: int32
        utcOffset:
          description: >-
            Required. The UTC offset of the user's timezone when the heart beat
            measurement occurred.
          type: string
          format: google-duration
      id: HeartBeat
    IrregularRhythmNotification:
      id: IrregularRhythmNotification
      properties:
        alertWindows:
          description: >-
            Optional. The overlapping analysis windows that were used to
            evaluate rhythm for potential AFib, containing specific information
            about the user's heart rhythm.
          type: array
          items:
            $ref: '#/components/schemas/AlertWindow'
        interval:
          description: Required. Observed interval.
          $ref: '#/components/schemas/SessionTimeInterval'
        medicalDeviceInfo:
          $ref: '#/components/schemas/MedicalDeviceInfo'
          description: >-
            Output only. The meta information for the compatible device used to
            conduct the measurement. Irregular Rhythm Notification measurements
            typically populate `algorithm_version`, `service_version`, and
            `device_model`.
          readOnly: true
      description: >-
        Represents an Irregular Rhythm Notification alert, indicating a
        potential sign of atrial fibrillation (AFib). This data type is based on
        SaMD feature and any changes to it may require additional review.
      type: object
    Application:
      id: Application
      properties:
        packageName:
          readOnly: true
          description: >-
            Output only. A unique identifier for the mobile application that was
            the source of the data. This is typically the application's package
            name on Android (e.g., `com.google.fitbit`) or the bundle ID on iOS.
            This field is informational and helps trace data origin. This field
            is system-populated when the data is uploaded from the Fitbit mobile
            application, Health Connect or Health Kit.
          type: string
        googleWebClientId:
          description: >-
            Output only. The Google OAuth 2.0 client ID of the web application
            or service that recorded the data. This is the client ID used during
            the Google OAuth flow to obtain user credentials. This field is
            system-populated when the data is uploaded from Google Web API.
          type: string
          readOnly: true
        webClientId:
          readOnly: true
          description: >-
            Output only. The client ID of the application that recorded the
            data. This ID is a legacy Fitbit API client ID, which is different
            from a Google OAuth client ID. Example format: `ABC123`. This field
            is system-populated and used for tracing data from legacy Fitbit API
            integrations. This field is system-populated when the data is
            uploaded from a legacy Fitbit API integration.
          type: string
      description: Optional metadata for the application that provided this data.
      type: object
    ListDataPointsResponse:
      description: Response containing raw data points matching the query
      type: object
      properties:
        dataPoints:
          items:
            $ref: '#/components/schemas/DataPoint'
          description: Data points matching the query
          type: array
        nextPageToken:
          description: Next page token, empty if the response is complete
          type: string
      id: ListDataPointsResponse
    StageSummary:
      id: StageSummary
      description: Total duration and segment count for a stage.
      type: object
      properties:
        minutes:
          description: Output only. Total duration in minutes of a sleep stage.
          type: string
          format: int64
          readOnly: true
        count:
          readOnly: true
          description: Output only. Number of sleep stages segments.
          type: string
          format: int64
        type:
          description: 'Output only. Sleep stage type: AWAKE, DEEP, REM, LIGHT etc.'
          enum:
            - SLEEP_STAGE_TYPE_UNSPECIFIED
            - AWAKE
            - LIGHT
            - DEEP
            - REM
            - ASLEEP
            - RESTLESS
          readOnly: true
          type: string
          enumDescriptions:
            - The default unset value.
            - Sleep stage AWAKE.
            - Sleep stage LIGHT.
            - Sleep stage DEEP.
            - Sleep stage REM.
            - Sleep stage ASLEEP.
            - Sleep stage RESTLESS.
    DateTime:
      id: DateTime
      properties:
        utcOffset:
          description: >-
            UTC offset. Must be whole seconds, between -18 hours and +18 hours.
            For example, a UTC offset of -4:00 would be represented as {
            seconds: -14400 }.
          type: string
          format: google-duration
        day:
          description: >-
            Optional. Day of month. Must be from 1 to 31 and valid for the year
            and month, or 0 if specifying a datetime without a day.
          type: integer
          format: int32
        seconds:
          description: >-
            Optional. Seconds of minutes of the time. Must normally be from 0 to
            59, defaults to 0. An API may allow the value 60 if it allows
            leap-seconds.
          type: integer
          format: int32
        year:
          description: >-
            Optional. Year of date. Must be from 1 to 9999, or 0 if specifying a
            datetime without a year.
          type: integer
          format: int32
        minutes:
          description: >-
            Optional. Minutes of hour of day. Must be from 0 to 59, defaults to
            0.
          type: integer
          format: int32
        month:
          description: >-
            Optional. Month of year. Must be from 1 to 12, or 0 if specifying a
            datetime without a month.
          type: integer
          format: int32
        timeZone:
          $ref: '#/components/schemas/TimeZone'
          description: Time zone.
        nanos:
          description: >-
            Optional. Fractions of seconds in nanoseconds. Must be from 0 to
            999,999,999, defaults to 0.
          type: integer
          format: int32
        hours:
          description: >-
            Optional. Hours of day in 24 hour format. Should be from 0 to 23,
            defaults to 0 (midnight). An API may choose to allow the value
            "24:00:00" for scenarios like business closing time.
          type: integer
          format: int32
      description: >-
        Represents civil time (or occasionally physical time). This type can
        represent a civil time in one of a few possible ways: * When utc_offset
        is set and time_zone is unset: a civil time on a calendar day with a
        particular offset from UTC. * When time_zone is set and utc_offset is
        unset: a civil time on a calendar day in a particular time zone. * When
        neither time_zone nor utc_offset is set: a civil time on a calendar day
        in local time. The date is relative to the Proleptic Gregorian Calendar.
        If year, month, or day are 0, the DateTime is considered not to have a
        specific year, month, or day respectively. This type may also be used to
        represent a physical time if all the date and time fields are set and
        either case of the `time_offset` oneof is set. Consider using
        `Timestamp` message for physical time instead. If your use case also
        would like to store the user's timezone, that can be done in another
        field. This type is more flexible than some applications may want. Make
        sure to document and validate your application's limitations.
      type: object
    ActiveZoneMinutes:
      id: ActiveZoneMinutes
      properties:
        interval:
          $ref: '#/components/schemas/ObservationTimeInterval'
          description: Required. Observed interval.
        activeZoneMinutes:
          description: >-
            Required. Number of Active Zone Minutes earned in the given time
            interval. Note: active_zone_minutes equals to 1 for low intensity
            (fat burn) zones or 2 for high intensity zones (cardio, peak).
          type: string
          format: int64
        heartRateZone:
          enumDescriptions:
            - Unspecified heart rate zone.
            - The fat burn heart rate zone.
            - The cardio heart rate zone.
            - The peak heart rate zone.
          description: >-
            Required. Heart rate zone in which the active zone minutes have been
            earned, in the given time interval.
          type: string
          enum:
            - HEART_RATE_ZONE_UNSPECIFIED
            - FAT_BURN
            - CARDIO
            - PEAK
      description: Record of active zone minutes in a given time interval.
      type: object
    ActiveEnergyBurned:
      id: ActiveEnergyBurned
      description: Energy burned as part of an activity, excluding the basal energy burn.
      type: object
      properties:
        interval:
          description: Required. Observed interval
          $ref: '#/components/schemas/ObservationTimeInterval'
        kcal:
          description: >-
            Required. Energy burned during an activity, measured in
            kilocalories.
          type: number
          format: double
    TimeInHeartRateZone:
      description: >-
        Time in heart rate zone record. It's an interval spent in specific heart
        rate zone.
      type: object
      properties:
        interval:
          $ref: '#/components/schemas/ObservationTimeInterval'
          description: Required. Observed interval.
        heartRateZoneType:
          description: Required. Heart rate zone type.
          type: string
          enum:
            - HEART_RATE_ZONE_TYPE_UNSPECIFIED
            - LIGHT
            - MODERATE
            - VIGOROUS
            - PEAK
          enumDescriptions:
            - Unspecified heart rate zone.
            - The light heart rate zone.
            - The moderate heart rate zone.
            - The vigorous heart rate zone.
            - The peak heart rate zone.
      id: TimeInHeartRateZone
    Interval:
      properties:
        endTime:
          description: >-
            Optional. Exclusive end of the interval. If specified, a Timestamp
            matching this interval will have to be before the end.
          type: string
          format: google-datetime
        startTime:
          description: >-
            Optional. Inclusive start of the interval. If specified, a Timestamp
            matching this interval will have to be the same or after the start.
          type: string
          format: google-datetime
      description: >-
        Represents a time interval, encoded as a Timestamp start (inclusive) and
        a Timestamp end (exclusive). The start must be less than or equal to the
        end. When the start equals the end, the interval is empty (matches no
        time). When both start and end are unspecified, the interval matches any
        time.
      type: object
      id: Interval
    NutritionLogRollupValue:
      description: Represents the result of the rollup of the nutrition log data type.
      type: object
      properties:
        energyFromFat:
          $ref: '#/components/schemas/EnergyQuantityRollup'
          description: Value Energy from fat rollup.
        nutrients:
          items:
            $ref: '#/components/schemas/NutrientQuantityRollup'
          description: List of the nutrient roll-ups by the nutrient type.
          type: array
        totalCarbohydrate:
          description: Total carbohydrate rollup.
          $ref: '#/components/schemas/WeightQuantityRollup'
        energy:
          description: Energy rollup.
          $ref: '#/components/schemas/EnergyQuantityRollup'
        totalFat:
          description: Total fat rollup.
          $ref: '#/components/schemas/WeightQuantityRollup'
      id: NutritionLogRollupValue
    DailyRollUpDataPointsResponse:
      properties:
        rollupDataPoints:
          description: Values for each aggregation time window.
          type: array
          items:
            $ref: '#/components/schemas/DailyRollupDataPoint'
      description: Response containing the list of rolled up data points.
      type: object
      id: DailyRollUpDataPointsResponse
    ListSubscribersResponse:
      description: Response message for ListSubscribers.
      type: object
      properties:
        subscribers:
          items:
            $ref: '#/components/schemas/Subscriber'
          description: Subscribers from the specified project.
          type: array
        totalSize:
          description: The total number of subscribers matching the request.
          type: integer
          format: int32
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
          type: string
      id: ListSubscribersResponse
    ActivityLevel:
      id: ActivityLevel
      description: Internal type to capture activity level during a certain time interval.
      type: object
      properties:
        interval:
          description: Required. Observed interval.
          $ref: '#/components/schemas/ObservationTimeInterval'
        activityLevelType:
          enumDescriptions:
            - Unspecified activity level type.
            - Sedentary activity level.
            - Lightly active activity level.
            - Moderately active activity level.
            - Very active activity level.
          description: Required. Activity level type in the given time interval.
          type: string
          enum:
            - ACTIVITY_LEVEL_TYPE_UNSPECIFIED
            - SEDENTARY
            - LIGHTLY_ACTIVE
            - MODERATELY_ACTIVE
            - VERY_ACTIVE
    CreateSubscriberPayload:
      properties:
        endpointAuthorization:
          description: >-
            Required. Authorization mechanism for the subscriber endpoint. The
            `secret` within this message is crucial for endpoint verification
            and for securing webhook notifications.
          $ref: '#/components/schemas/EndpointAuthorization'
        endpointUri:
          description: >-
            Required. The full HTTPS URI where update notifications will be
            sent. The URI must be a valid URL and use HTTPS as the scheme. This
            endpoint will be verified during the `CreateSubscriber` call. See
            CreateSubscriber RPC documentation for verification details.
          type: string
        subscriberConfigs:
          description: Optional. Configuration for the subscriber.
          type: array
          items:
            $ref: '#/components/schemas/SubscriberConfig'
      description: Payload for creating a subscriber.
      type: object
      id: CreateSubscriberPayload
    OxygenSaturation:
      properties:
        sampleTime:
          $ref: '#/components/schemas/ObservationSampleTime'
          description: Required. The time at which oxygen saturation was measured.
        percentage:
          description: >-
            Required. The oxygen saturation percentage. Valid values are from 0
            to 100.
          type: number
          format: double
      description: Captures the user's instantaneous oxygen saturation percentage (SpO2).
      type: object
      id: OxygenSaturation
    SleepStage:
      id: SleepStage
      properties:
        createTime:
          readOnly: true
          description: Output only. Creation time of this sleep stages segment.
          type: string
          format: google-datetime
        startTime:
          description: Required. Sleep stage start time.
          type: string
          format: google-datetime
        startUtcOffset:
          description: >-
            Required. The offset of the user's local time at the start of the
            sleep stage relative to the Coordinated Universal Time (UTC).
          type: string
          format: google-duration
        type:
          description: 'Required. Sleep stage type: AWAKE, DEEP, REM, LIGHT etc.'
          type: string
          enum:
            - SLEEP_STAGE_TYPE_UNSPECIFIED
            - AWAKE
            - LIGHT
            - DEEP
            - REM
            - ASLEEP
            - RESTLESS
          enumDescriptions:
            - The default unset value.
            - Sleep stage AWAKE.
            - Sleep stage LIGHT.
            - Sleep stage DEEP.
            - Sleep stage REM.
            - Sleep stage ASLEEP.
            - Sleep stage RESTLESS.
        endTime:
          description: Required. Sleep stage end time.
          type: string
          format: google-datetime
        endUtcOffset:
          description: >-
            Required. The offset of the user's local time at the end of the
            sleep stage relative to the Coordinated Universal Time (UTC).
          type: string
          format: google-duration
        updateTime:
          description: Output only. Last update time of this sleep stages segment.
          type: string
          format: google-datetime
          readOnly: true
      description: Sleep stage segment.
      type: object
    ActiveMinutesRollupValue:
      properties:
        activeMinutesRollupByActivityLevel:
          description: >-
            Active minutes by activity level. At most one record per activity
            level is allowed.
          type: array
          items:
            $ref: '#/components/schemas/ActiveMinutesRollupByActivityLevel'
      description: Represents the result of the rollup of the active minutes data type.
      type: object
      id: ActiveMinutesRollupValue
    ExerciseMetadata:
      description: Additional exercise metadata.
      type: object
      properties:
        hasGps:
          description: Optional. Whether the exercise had GPS tracking.
          type: boolean
        poolLengthMillimeters:
          description: >-
            Optional. Pool length in millimeters. Only present in the swimming
            exercises.
          type: string
          format: int64
      id: ExerciseMetadata
    DailySleepTemperatureDerivations:
      id: DailySleepTemperatureDerivations
      description: >-
        Provides derived sleep temperature values, calculated from skin or
        internal device temperature readings during sleep.
      type: object
      properties:
        date:
          $ref: '#/components/schemas/Date'
          description: >-
            Required. Date for which the sleep temperature derivations are
            calculated.
        baselineTemperatureCelsius:
          description: >-
            Optional. The user's baseline skin temperature. It is the median of
            the user's nightly skin temperature over the past 30 days.
          type: number
          format: double
        nightlyTemperatureCelsius:
          description: >-
            Required. The user's nightly skin temperature. It is the mean of
            skin temperature samples taken from the user’s sleep.
          type: number
          format: double
        relativeNightlyStddev30dCelsius:
          description: >-
            Optional. The standard deviation of the user’s relative nightly skin
            temperature (temperature - baseline) over the past 30 days.
          type: number
          format: double
    CivilDateTime:
      id: CivilDateTime
      properties:
        time:
          description: >-
            Optional. Time of day. Defaults to the start of the day, at midnight
            if omitted.
          $ref: '#/components/schemas/TimeOfDay'
        date:
          description: Required. Calendar date.
          $ref: '#/components/schemas/Date'
      description: >-
        Civil time representation similar to google.type.DateTime, but ensures
        that neither the timezone nor the UTC offset can be set to avoid
        confusion between civil and physical time queries.
      type: object
    SplitSummary:
      id: SplitSummary
      properties:
        endTime:
          description: Required. Lap end time
          type: string
          format: google-datetime
        endUtcOffset:
          description: Required. Lap end time offset from UTC
          type: string
          format: google-duration
        activeDuration:
          description: Output only. Lap time excluding the pauses.
          type: string
          format: google-duration
          readOnly: true
        metricsSummary:
          description: Required. Summary metrics for this split.
          $ref: '#/components/schemas/MetricsSummary'
        splitType:
          enumDescriptions:
            - Split type is unspecified.
            - Manual split.
            - Split by duration.
            - Split by distance.
            - Split by calories.
          description: >-
            Required. Method used to split the exercise laps. Users may manually
            mark the lap as complete even if the tracking is automatic.
          type: string
          enum:
            - SPLIT_TYPE_UNSPECIFIED
            - MANUAL
            - DURATION
            - DISTANCE
            - CALORIES
        startTime:
          description: Required. Lap start time
          type: string
          format: google-datetime
        startUtcOffset:
          description: Required. Lap start time offset from UTC
          type: string
          format: google-duration
      description: >-
        Represents splits or laps recorded within an exercise. Lap events
        partition a workout into segments based on criteria like distance, time,
        or calories.
      type: object
    SleepMetadata:
      id: SleepMetadata
      description: Additional information about how the sleep was processed.
      type: object
      properties:
        processed:
          description: >-
            Output only. Sleep and sleep stages algorithms finished processing.
            A `true` value indicates whether all data processing for the session
            is complete. A `false` value means sleep period is detected but
            sleep stages is still processing.
          type: boolean
          readOnly: true
        stagesStatus:
          enumDescriptions:
            - Output only. Sleep stages status is unspecified.
            - >-
              Output only. Sleep stages cannot be computed due to low RR
              coverage.
            - >-
              Output only. Sleep stages cannot be computed due to the large
              middle gap (2h).
            - >-
              Output only. Sleep stages cannot be computed due to the large
              start gap (1h).
            - >-
              Output only. Sleep stages cannot be computed due to the large end
              gap (1h).
            - >-
              Output only. Sleep stages cannot be computed because the sleep log
              is a nap (has < 3h duration).
            - >-
              Output only. Sleep stages cannot be computed because input data is
              not available (PPGV2, wake magnitude, etc).
            - >-
              Output only. Sleep stages cannot be computed due to server
              timeout.
            - Output only. Sleep stages successfully computed.
            - >-
              Output only. Sleep stages cannot be computed due to server
              internal error.
          type: string
          readOnly: true
          description: Output only. Sleep stages algorithm processing status.
          enum:
            - STAGES_STATE_UNSPECIFIED
            - REJECTED_COVERAGE
            - REJECTED_MAX_GAP
            - REJECTED_START_GAP
            - REJECTED_END_GAP
            - REJECTED_NAP
            - REJECTED_SERVER
            - TIMEOUT
            - SUCCEEDED
            - PROCESSING_INTERNAL_ERROR
        externalId:
          description: >-
            Optional. Sleep identifier relevant in the context of the data
            source.
          type: string
        nap:
          description: >-
            Output only. Naps are sleeps without stages and relatively short
            durations.
          type: boolean
          readOnly: true
        manuallyEdited:
          readOnly: true
          description: >-
            Output only. Some sleeps autodetected by algorithms can be manually
            edited by users.
          type: boolean
        mainSleep:
          description: >-
            Output only. `main_sleep`: the longest sleep session with stages
            within one day. If no sleep session has stages, then the longest
            sleep is the `main_sleep`. If there are multiple days of sleep in
            the response, there is one `main_sleep` per day.
          type: boolean
          readOnly: true
    AlertWindow:
      description: >-
        An analysis window evaluated for AFib. Note: The current version of the
        algorithm will only produce alerts if all windows are positive. So
        anything returned from the API will always have the positive bit set to
        true. Internally, windows can be negative, however. We never save
        "inconclusive" windows (they aren't produced by the algorithm).
      type: object
      properties:
        endTime:
          description: Required. The end time of the analysis window.
          type: string
          format: google-datetime
        endUtcOffset:
          description: >-
            Required. The UTC offset of the user's timezone when the analysis
            window ended.
          type: string
          format: google-duration
        civilStartTime:
          $ref: '#/components/schemas/CivilDateTime'
          description: >-
            Output only. Observed interval start time in civil time in the
            timezone the subject is in at the start of the observed interval
          readOnly: true
        heartBeats:
          description: >-
            Optional. All heart beats in the interval contained in this analysis
            window.
          type: array
          items:
            $ref: '#/components/schemas/HeartBeat'
        startTime:
          description: Required. Observed interval. The start time of the analysis window.
          type: string
          format: google-datetime
        startUtcOffset:
          description: >-
            Required. The UTC offset of the user's timezone when the analysis
            window started.
          type: string
          format: google-duration
        positive:
          description: >-
            Optional. Flag indicating whether the window was positive for AFib
            or not. A `true` value indicates that AFib was detected in this
            window. A `false` value means AFib was not detected, but does not
            guarantee the absence of AFib.
          type: boolean
        civilEndTime:
          $ref: '#/components/schemas/CivilDateTime'
          description: >-
            Output only. Observed interval end time in civil time in the
            timezone the subject is in at the end of the observed interval
          readOnly: true
      id: AlertWindow
    Food:
      properties:
