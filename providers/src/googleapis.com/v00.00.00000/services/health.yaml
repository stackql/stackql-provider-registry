    VO2Max:
      description: VO2 max measurement.
      type: object
      properties:
        sampleTime:
          description: Required. The time at which VO2 max was measured.
          $ref: '#/components/schemas/ObservationSampleTime'
        vo2Max:
          description: >-
            Required. VO2 max value measured as in ml consumed oxygen / kg of
            body weight / min.
          type: number
          format: double
        measurementMethod:
          enumDescriptions:
            - Unspecified measurement method.
            - Fitbit specific, measures VO2 max rate during a run.
            - >-
              Google specific, measures VO2 max rate for a user based on their
              demographic data.
            - >-
              Run as far as possible for 12 minutes. Distance correlated with
              age and gender translates to a VO2 max value.
            - >-
              Maximum heart rate divided by the resting heart rate, with a
              multiplier applied. Does not require any exercise.
            - Measured by a medical device called metabolic cart.
            - >-
              Continuous 20m back-and-forth runs with increasing difficulty,
              until exhaustion.
            - Measured using walking exercise.
            - >-
              Healthkit specific, measures VO2 max rate by monitoring exercise
              to the user’s physical limit. Similar to COOPER_TEST or
              MULTISTAGE_FITNESS_TEST.
            - >-
              Healthkit specific, estimates VO2 max rate based on low-intensity
              exercise. Similar to ROCKPORT_FITNESS_TEST.
            - >-
              Healthkit specific, estimates VO2 max rate without any exercise.
              Similar to HEART_RATE_RATIO.
            - Use when the method is not covered in this enum.
          description: Optional. The method used to measure the VO2 max value.
          type: string
          enum:
            - MEASUREMENT_METHOD_UNSPECIFIED
            - FITBIT_RUN
            - GOOGLE_DEMOGRAPHIC
            - COOPER_TEST
            - HEART_RATE_RATIO
            - METABOLIC_CART
            - MULTISTAGE_FITNESS_TEST
            - ROCKPORT_FITNESS_TEST
            - MAX_EXERCISE
            - PREDICTION_SUB_MAX_EXERCISE
            - PREDICTION_NON_EXERCISE
            - OTHER
      id: VO2Max
    Weight:
      description: Body weight measurement.
      type: object
      properties:
        weightGrams:
          description: Required. Weight of a user in grams.
          type: number
          format: double
