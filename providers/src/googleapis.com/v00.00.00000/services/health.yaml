      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      type: object
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          type: integer
          format: int32
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          type: array
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
      id: Status
    DailyRollUpDataPointsRequest:
      id: DailyRollUpDataPointsRequest
      properties:
        pageSize:
          description: >-
            Optional. The maximum number of data points to return. If
            unspecified, at most 1440 data points will be returned. The maximum
            page size is 10000; values above that will be truncated accordingly.
          type: integer
          format: int32
        pageToken:
          description: >-
            Optional. The `next_page_token` from a previous request, if any. All
            other request fields need to be the same as in the initial request
            when the page token is specified.
          type: string
        windowSizeDays:
          description: >-
            Optional. Aggregation window size, in number of days. Defaults to 1
            if not specified.
          type: integer
          format: int32
        range:
          description: >-
            Required. Closed-open range of data points that will be rolled up.
            The start time must be aligned with the aggregation window. The
            maximum range for `calories-in-heart-rate-zone`, `heart-rate`,
            `active-minutes` and `total-calories` is 14 days. The maximum range
            for all other data types is 90 days.
          $ref: '#/components/schemas/CivilTimeInterval'
        dataSourceFamily:
          description: >-
            Optional. The data source family name to roll up. If empty, data
            points from all available data sources will be rolled up. Format:
            `users/me/dataSourceFamilies/{data_source_family}` The supported
            values are: - `users/me/dataSourceFamilies/all-sources` - default
            value - `users/me/dataSourceFamilies/google-wearables` - tracker
            devices - `users/me/dataSourceFamilies/google-sources` - Google
            first party sources
          type: string
      description: Request to roll up data points by civil time intervals.
      type: object
    SedentaryPeriod:
      id: SedentaryPeriod
      description: >-
        SedentaryPeriod SedentaryPeriod data represents the periods of time that
        the user was sedentary (i.e. not moving while wearing the device).
      type: object
      properties:
        interval:
          $ref: '#/components/schemas/ObservationTimeInterval'
          description: Required. Observed interval.
    RespiratoryRateSleepSummary:
      properties:
        sampleTime:
          description: Required. The time at which respiratory rate was measured.
          $ref: '#/components/schemas/ObservationSampleTime'
        lightSleepStats:
          description: Optional. Respiratory rate statistics for light sleep.
          $ref: '#/components/schemas/RespiratoryRateSleepSummaryStatistics'
        deepSleepStats:
          description: Optional. Respiratory rate statistics for deep sleep.
          $ref: '#/components/schemas/RespiratoryRateSleepSummaryStatistics'
        remSleepStats:
          $ref: '#/components/schemas/RespiratoryRateSleepSummaryStatistics'
          description: Optional. Respiratory rate statistics for REM sleep.
        fullSleepStats:
          description: Required. Full respiratory rate statistics.
          $ref: '#/components/schemas/RespiratoryRateSleepSummaryStatistics'
      description: >-
        Records respiratory rate details during sleep. Can have multiple per day
        if the user sleeps multiple times.
      type: object
      id: RespiratoryRateSleepSummary
    Settings:
      id: Settings
