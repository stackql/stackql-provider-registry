          description: >-
            Required. The lower bound of the confidence interval of oxygen
            saturation samples during sleep.
          type: number
          format: double
        upperBoundPercentage:
          description: >-
            Required. The upper bound of the confidence interval of oxygen
            saturation samples during sleep.
          type: number
          format: double
        averagePercentage:
          description: >-
            Required. The average value of the oxygen saturation samples during
            the sleep.
          type: number
          format: double
