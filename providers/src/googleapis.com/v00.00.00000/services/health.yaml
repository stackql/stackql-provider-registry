  /v4/projects/{projectsId}/subscribers:
    parameters: *ref_1
    get:
      description: Lists all subscribers registered within the owned Google Cloud Project.
      operationId: health.projects.subscribers.list
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSubscribersResponse'
      parameters:
        - in: path
          name: projectsId
          required: true
          schema:
            type: string
        - in: query
          name: pageSize
          schema:
            type: integer
            format: int32
        - in: query
          name: pageToken
          schema:
            type: string
    post:
      description: >-
        Registers a new subscriber endpoint to receive notifications. A
        subscriber represents an application or service that wishes to receive
        data change notifications for users who have granted consent. **Endpoint
        Verification:** For a subscriber to be successfully created, the
        provided `endpoint_uri` must be a valid HTTPS endpoint and must pass an
        automated verification check. The backend will send two HTTP POST
        requests to the `endpoint_uri`: 1. **Verification with Authorization:**
        * **Headers:** Includes `Content-Type: application/json` and
        `Authorization` (with the exact value from
        `CreateSubscriberPayload.endpoint_authorization.secret`). * **Body:**
        `{"type": "verification"}` * **Expected Response:** HTTP `201 Created`.
        2. **Verification without Authorization:** * **Headers:** Includes
        `Content-Type: application/json`. The `Authorization` header is OMITTED.
        * **Body:** `{"type": "verification"}` * **Expected Response:** HTTP
        `401 Unauthorized` or `403 Forbidden`. Both tests must pass for the
        subscriber creation to succeed. If verification fails, the operation
        will not be completed and an error will be returned. This process
        ensures the endpoint is reachable and correctly validates the
        `Authorization` header.
      operationId: health.projects.subscribers.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriberPayload'
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
      parameters:
        - in: path
          name: projectsId
          required: true
          schema:
            type: string
        - in: query
          name: subscriberId
          schema:
            type: string
  /v4/projects/{projectsId}/subscribers/{subscribersId}:
    parameters: *ref_1
    delete:
      description: >-
        Deletes a subscriber registration. This will stop all notifications to
        the subscriber's endpoint.
      operationId: health.projects.subscribers.delete
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
      parameters:
        - in: path
          name: projectsId
          required: true
          schema:
            type: string
        - in: path
          name: subscribersId
          required: true
          schema:
            type: string
        - in: query
          name: force
          schema:
            type: boolean
    patch:
      description: >-
        Updates the configuration of an existing subscriber, such as the
        endpoint URI or the data types it's interested in. **Endpoint
        Verification:** If the `endpoint_uri` or `endpoint_authorization` field
        is included in the `update_mask`, the backend will re-verify the
        endpoint. The verification process is the same as described in
        `CreateSubscriber`: 1. **Verification with Authorization:** POST to the
        new or existing `endpoint_uri` with the new or existing `Authorization`
        secret. Expects HTTP `201 Created`. 2. **Verification without
        Authorization:** POST to the `endpoint_uri` without the `Authorization`
        header. Expects HTTP `401 Unauthorized` or `403 Forbidden`. Both tests
        must pass using the potentially updated values for the subscriber update
        to succeed. If verification fails, the update will not be applied, and
        an error will be returned.
      operationId: health.projects.subscribers.patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscriber'
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
      parameters:
        - in: path
          name: projectsId
          required: true
          schema:
            type: string
        - in: path
          name: subscribersId
          required: true
          schema:
            type: string
        - in: query
          name: updateMask
          schema:
            type: string
            format: google-fieldmask
