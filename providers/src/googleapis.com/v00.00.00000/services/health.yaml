openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Google Health API
  description: >-
    The Google Health API lets you view and manage health and fitness metrics
    and measurement data.
  version: v4
  x-discovery-doc-revision: '20260730'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://developers.google.com/health
servers:
  - url: https://health.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly: >-
              Add activity and fitness data to Google Health, and edit or delete
              the data it adds.
            https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly: See your Google Health health metrics and measurement data
            https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.writeonly: >-
              Add health metric and measurements data to Google Health, and edit
              or delete the data it adds.
            https://www.googleapis.com/auth/googlehealth.location.writeonly: >-
              Add exercise GPS location data to Google Health, and edit or
              delete the data it adds.
            https://www.googleapis.com/auth/googlehealth.reproductive_health.writeonly: >-
              Add reproductive health data to Google Health, and edit or delete
              the data it adds
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
            https://www.googleapis.com/auth/googlehealth.ecg.readonly: See your Google Health ECG data
            https://www.googleapis.com/auth/googlehealth.settings.writeonly: >-
              Add settings data to Google Health, and edit or delete the data it
              adds.
            https://www.googleapis.com/auth/googlehealth.sleep.writeonly: >-
              Add sleep data to Google Health, and edit or delete the data it
              adds.
            https://www.googleapis.com/auth/googlehealth.mindfulness.writeonly: >-
              Add mindfulness data to Google Health, and edit or delete the data
              it adds
            https://www.googleapis.com/auth/googlehealth.sleep.readonly: See your Google Health sleep data
            https://www.googleapis.com/auth/googlehealth.irn.readonly: See your Google Health Irregular Rhythm Notifications data
            https://www.googleapis.com/auth/googlehealth.profile.readonly: See your Google Health profile data
            https://www.googleapis.com/auth/googlehealth.logged_symptoms.writeonly: >-
              Add logged symptoms data to Google Health, and edit or delete the
              data it adds
            https://www.googleapis.com/auth/googlehealth.settings.readonly: See your Google Health settings
            https://www.googleapis.com/auth/googlehealth.nutrition.writeonly: >-
              Add nutrition data to Google Health, and edit or delete the data
              it adds.
            https://www.googleapis.com/auth/googlehealth.location.readonly: See exercise GPS location data in Google Health
            https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly: See your Google Health activity and fitness data
            https://www.googleapis.com/auth/googlehealth.profile.writeonly: >-
              Add profile data to Google Health, and edit or delete the data it
              adds.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    Sleep:
      description: A sleep session possibly including stages.
      type: object
      properties:
        interval:
          description: Required. Observed sleep interval.
          $ref: '#/components/schemas/SessionTimeInterval'
        updateTime:
          description: Output only. Last update time of this sleep observation.
          type: string
          format: google-datetime
          readOnly: true
        type:
          description: 'Optional. SleepType: classic or stages.'
          type: string
          enum:
            - SLEEP_TYPE_UNSPECIFIED
            - CLASSIC
            - STAGES
          enumDescriptions:
            - Sleep type is unspecified.
            - >-
              Classic sleep is a sleep with 3 stages types: AWAKE, RESTLESS and
              ASLEEP.
            - >-
              On top of "classic" sleep stages an additional processing pass can
              calculate stages more precisely, overwriting the prior stages with
              AWAKE, LIGHT, REM and DEEP.
        stages:
          items:
            $ref: '#/components/schemas/SleepStage'
          description: >-
            Optional. List of non-overlapping contiguous sleep stage segments
            that cover the sleep period.
          type: array
        metadata:
          $ref: '#/components/schemas/SleepMetadata'
          description: >-
            Optional. Sleep metadata: `processed`, `main_sleep`,
            `manually_edited`, and `stages_status`.
        createTime:
          description: Output only. Creation time of this sleep observation.
          type: string
          format: google-datetime
          readOnly: true
        outOfBedSegments:
          items:
            $ref: '#/components/schemas/OutOfBedSegment'
          description: Optional. “Out of bed” segments that can overlap with sleep stages.
          type: array
        summary:
          readOnly: true
          $ref: '#/components/schemas/SleepSummary'
          description: 'Output only. Sleep summary: metrics and stages summary.'
      id: Sleep
    RollUpDataPointsRequest:
      id: RollUpDataPointsRequest
      properties:
        dataSourceFamily:
          description: >-
            Optional. The data source family name to roll up. If empty, data
            points from all available data sources will be rolled up. Format:
            `users/me/dataSourceFamilies/{data_source_family}` The supported
            values are: - `users/me/dataSourceFamilies/all-sources` - default
            value - `users/me/dataSourceFamilies/google-wearables` - tracker
            devices - `users/me/dataSourceFamilies/google-sources` - Google
            first party sources
          type: string
        range:
          $ref: '#/components/schemas/Interval'
          description: >-
            Required. Closed-open range of data points that will be rolled up.
            The maximum range for `calories-in-heart-rate-zone`, `heart-rate`,
            `active-minutes` and `total-calories` is 14 days. The maximum range
            for all other data types is 90 days.
        windowSize:
          description: >-
            Required. The size of the time window to group data points into
            before applying the aggregation functions. Must be at least 1
            second.
          type: string
          format: google-duration
        pageSize:
          description: >-
            Optional. The maximum number of data points to return. If
            unspecified, at most 1440 data points will be returned. The maximum
            page size is 10000; values above that will be truncated accordingly.
          type: integer
          format: int32
        pageToken:
          description: >-
            Optional. The next_page_token from a previous request, if any. All
            other request fields need to be the same as in the initial request
            when the page token is specified.
          type: string
      description: Request to roll up data points by physical time intervals.
      type: object
    HeartRateMetadata:
      properties:
        motionContext:
          description: >-
            Optional. Indicates the user’s level of activity when the heart rate
            sample was measured
          type: string
          enum:
            - MOTION_CONTEXT_UNSPECIFIED
            - ACTIVE
            - SEDENTARY
          enumDescriptions:
            - The default value when no data is available.
            - The user is active.
            - The user is inactive.
        sensorLocation:
          description: >-
            Optional. Indicates the location of the sensor that measured the
            heart rate.
          type: string
          enum:
            - SENSOR_LOCATION_UNSPECIFIED
            - CHEST
            - WRIST
            - FINGER
            - HAND
            - EAR_LOBE
            - FOOT
          enumDescriptions:
            - The default value when no data is available.
            - Chest sensor.
            - Wrist sensor.
            - Finger sensor.
            - Hand sensor.
            - Ear lobe sensor.
            - Foot sensor.
      description: Heart rate metadata.
      type: object
      id: HeartRateMetadata
    ListPairedDevicesResponse:
      properties:
        pairedDevices:
          items:
            $ref: '#/components/schemas/PairedDevice'
          description: The paired devices of the user.
          type: array
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
          type: string
      description: Response message for ListPairedDevices.
      type: object
      id: ListPairedDevicesResponse
    HttpHeader:
      id: HttpHeader
      description: Represents an HTTP header.
      type: object
      properties:
        value:
          description: The HTTP header value.
          type: string
        key:
          description: The HTTP header key. It is case insensitive.
          type: string
    DailyVO2Max:
      id: DailyVO2Max
      description: >-
        Contains a daily summary of the user's VO2 max (cardio fitness score),
        which is the maximum rate of oxygen the body can use during exercise.
      type: object
      properties:
        estimated:
          description: >-
            Optional. An estimated field is added to indicate when the
            confidence has decreased sufficiently to consider the value an
            estimation.
          type: boolean
        vo2Max:
          description: >-
            Required. Daily VO2 max value measured as in ml consumed oxygen / kg
            of body weight / min.
          type: number
          format: double
        cardioFitnessLevel:
          description: >-
            Optional. Represents the user's cardio fitness level based on their
            VO2 max.
          type: string
          enum:
            - CARDIO_FITNESS_LEVEL_UNSPECIFIED
            - POOR
            - FAIR
            - AVERAGE
            - GOOD
            - VERY_GOOD
            - EXCELLENT
          enumDescriptions:
            - Unspecified cardio fitness level.
            - Poor cardio fitness level.
            - Fair cardio fitness level.
            - Average cardio fitness level.
            - Good cardio fitness level.
            - Very good cardio fitness level.
            - Excellent cardio fitness level.
        date:
          description: Required. The date for which the Daily VO2 max was measured.
          $ref: '#/components/schemas/Date'
        vo2MaxCovariance:
          description: Optional. The covariance of the VO2 max value.
          type: number
          format: double
    ActiveMinutesByActivityLevel:
      properties:
        activeMinutes:
          description: Required. Number of whole minutes spent in activity.
          type: string
          format: int64
        activityLevel:
          description: Required. The level of activity.
          type: string
          enum:
            - ACTIVITY_LEVEL_UNSPECIFIED
            - LIGHT
            - MODERATE
            - VIGOROUS
          enumDescriptions:
            - Activity level is unspecified.
            - Light activity level.
            - Moderate activity level.
            - Vigorous activity level.
      description: Active minutes at a given activity level.
      type: object
      id: ActiveMinutesByActivityLevel
    IrnProfile:
      description: >-
        Irregular Rhythm Notifications (IRN) Profile details. The Irregular
        Rhythm Notifications (IRN) feature checks for signs of atrial
        fibrillation (AFib). The IrnProfile details include information about
        the user's onboarding status, enrollment status, and the last update
        time of analyzable data for this feature.
      type: object
      properties:
        onboardingStatus:
          description: >-
            Required. Whether or not the user has onboarded onto the IRN
            feature.
          type: boolean
        name:
          description: >-
            Identifier. The resource name of this IrnProfile resource. Format:
            `users/{user}/irnProfile` Example: `users/1234567890/irnProfile` or
            `users/me/irnProfile` The {user} ID is a system-generated Google
            Health API user ID, a string of 1-63 characters consisting of
            lowercase and uppercase letters, numbers, and hyphens. The literal
            `me` can also be used to refer to the authenticated user.
          type: string
        updateTime:
          description: >-
            Output only. The timestamp of the last piece of analyzable data
            synced by the user.
          type: string
          format: google-datetime
          readOnly: true
        enrollmentStatus:
          description: >-
            Required. Whether or not the user is currently enrolled in having
            their data processed for IRN alerts.
          type: boolean
      id: IrnProfile
    DataPoint:
      id: DataPoint
      properties:
        activeEnergyBurned:
          $ref: '#/components/schemas/ActiveEnergyBurned'
          description: >-
            Optional. Data for points in the `active-energy-burned` interval
            data type collection.
        heartRate:
          $ref: '#/components/schemas/HeartRate'
          description: >-
            Optional. Data for points in the `heart-rate` sample data type
            collection.
        dailyVo2Max:
          $ref: '#/components/schemas/DailyVO2Max'
          description: >-
            Optional. Data for points in the `daily-vo2-max` daily data type
            collection.
        steps:
          $ref: '#/components/schemas/Steps'
          description: >-
            Optional. Data for points in the `steps` interval data type
            collection.
        runVo2Max:
          $ref: '#/components/schemas/RunVO2Max'
          description: >-
            Optional. Data for points in the `run-vo2-max` sample data type
            collection.
        vo2Max:
          description: >-
            Optional. Data for points in the `vo2-max` sample data type
            collection.
          $ref: '#/components/schemas/VO2Max'
        dailyRestingHeartRate:
          description: >-
            Optional. Data for points in the `daily-resting-heart-rate` daily
            data type collection.
          $ref: '#/components/schemas/DailyRestingHeartRate'
        bloodGlucose:
          description: >-
            Optional. Data for points in the `blood-glucose` sample data type
            collection.
          $ref: '#/components/schemas/BloodGlucose'
        activeMinutes:
          description: >-
            Optional. Data for points in the `active-minutes` interval data type
            collection.
          $ref: '#/components/schemas/ActiveMinutes'
        dailyHeartRateVariability:
          $ref: '#/components/schemas/DailyHeartRateVariability'
          description: >-
            Optional. Data for points in the `daily-heart-rate-variability`
            daily data type collection.
        oxygenSaturation:
          description: >-
            Optional. Data for points in the `oxygen-saturation` sample data
            type collection.
          $ref: '#/components/schemas/OxygenSaturation'
        hydrationLog:
          $ref: '#/components/schemas/HydrationLog'
          description: >-
            Optional. Data for points in the `hydration-log` session data type
            collection.
        nutritionLog:
          description: >-
            Optional. Data for points in the `nutrition-log` session data type
            collection.
          $ref: '#/components/schemas/NutritionLog'
        heartRateVariability:
          $ref: '#/components/schemas/HeartRateVariability'
          description: >-
            Optional. Data for points in the `heart-rate-variability` sample
            data type collection.
        weight:
          $ref: '#/components/schemas/Weight'
          description: >-
            Optional. Data for points in the `weight` sample data type
            collection.
        sleep:
          description: >-
            Optional. Data for points in the `sleep` session data type
            collection.
          $ref: '#/components/schemas/Sleep'
        dailyOxygenSaturation:
          description: >-
            Optional. Data for points in the `daily-oxygen-saturation` daily
            data type collection.
          $ref: '#/components/schemas/DailyOxygenSaturation'
        food:
          description: Optional. The food details.
          $ref: '#/components/schemas/Food'
        altitude:
          description: >-
            Optional. Data for points in the `altitude` interval data type
            collection.
          $ref: '#/components/schemas/Altitude'
        swimLengthsData:
          $ref: '#/components/schemas/SwimLengthsData'
          description: >-
            Optional. Data for points in the `swim-lengths-data` interval data
            type collection.
        basalEnergyBurned:
          $ref: '#/components/schemas/BasalEnergyBurned'
          description: >-
            Optional. Data for points in the `basal-energy-burned` interval data
            type collection.
        dailyRespiratoryRate:
          description: >-
            Optional. Data for points in the `daily-respiratory-rate` daily data
            type collection.
          $ref: '#/components/schemas/DailyRespiratoryRate'
        irregularRhythmNotification:
          description: >-
            Optional. Data for points in the `irregular-rhythm-notification`
            session data type collection.
          $ref: '#/components/schemas/IrregularRhythmNotification'
        distance:
          $ref: '#/components/schemas/Distance'
          description: >-
            Optional. Data for points in the `distance` interval data type
            collection.
        exercise:
          $ref: '#/components/schemas/Exercise'
          description: >-
            Optional. Data for points in the `exercise` session data type
            collection.
        floors:
          $ref: '#/components/schemas/Floors'
          description: >-
            Optional. Data for points in the `floors` interval data type
            collection.
        respiratoryRateSleepSummary:
          $ref: '#/components/schemas/RespiratoryRateSleepSummary'
          description: >-
            Optional. Data for points in the `respiratory-rate-sleep-summary`
            sample data type collection.
        foodMeasurementUnit:
          description: Optional. The food measurement unit details.
          $ref: '#/components/schemas/FoodMeasurementUnit'
        activityLevel:
          description: >-
            Optional. Data for points in the `activity-level` daily data type
            collection.
          $ref: '#/components/schemas/ActivityLevel'
        timeInHeartRateZone:
          $ref: '#/components/schemas/TimeInHeartRateZone'
          description: >-
            Optional. Data for points in the `time-in-heart-rate-zone` interval
            data type collection.
        dailySleepTemperatureDerivations:
          description: >-
            Optional. Data for points in the
            `daily-sleep-temperature-derivations` daily data type collection.
          $ref: '#/components/schemas/DailySleepTemperatureDerivations'
        height:
          description: >-
            Optional. Data for points in the `height` sample data type
            collection.
          $ref: '#/components/schemas/Height'
        name:
          description: >-
            Identifier. Data point name, only supported for the subset of
            identifiable data types. For the majority of the data types,
            individual data points do not need to be identified and this field
            would be empty. Format:
            `users/{user}/dataTypes/{data_type}/dataPoints/{data_point}`
            Example:
            `users/abcd1234/dataTypes/sleep/dataPoints/a1b2c3d4-e5f6-7890-1234-567890abcdef`
            The `{user}` ID is a system-generated identifier, as described in
            Identity.health_user_id. The `{data_type}` ID corresponds to the
            kebab-case version of the field names in the DataPoint data union
            field, e.g. `heart-rate` for the `heart_rate` field. The
            `{data_point}` ID can be client-provided or system-generated. If
            client-provided, it must be a string of 4-63 characters, containing
            only lowercase letters, numbers, and hyphens.
          type: string
        electrocardiogram:
          description: >-
            Optional. Data for points in the `electrocardiogram` session data
            type collection.
          $ref: '#/components/schemas/Electrocardiogram'
        activeZoneMinutes:
          description: >-
            Optional. Data for points in the `active-zone-minutes` interval data
            type collection, measured in minutes.
          $ref: '#/components/schemas/ActiveZoneMinutes'
        coreBodyTemperature:
          description: >-
            Optional. Data for points in the `core-body-temperature` sample data
            type collection.
          $ref: '#/components/schemas/CoreBodyTemperature'
        sedentaryPeriod:
          description: >-
            Optional. Data for points in the `sedentary-period` interval data
            type collection.
          $ref: '#/components/schemas/SedentaryPeriod'
        dailyHeartRateZones:
          $ref: '#/components/schemas/DailyHeartRateZones'
          description: >-
            Optional. Data for points in the `daily-heart-rate-zones` daily data
            type collection.
        dataSource:
          $ref: '#/components/schemas/DataSource'
          description: Optional. Data source information for the metric
        bodyFat:
          $ref: '#/components/schemas/BodyFat'
          description: >-
            Optional. Data for points in the `body-fat` sample data type
            collection.
      description: A computed or recorded metric.
      type: object
    SessionTimeInterval:
      properties:
        startTime:
          description: Required. The start time of the observed session.
          type: string
          format: google-datetime
        startUtcOffset:
          description: >-
            Required. The offset of the user's local time at the start of the
            session relative to the Coordinated Universal Time (UTC).
          type: string
          format: google-duration
        civilEndTime:
          readOnly: true
          description: >-
            Output only. Session end time in civil time in the timezone the
            subject is in at the end of the session.
          $ref: '#/components/schemas/CivilDateTime'
        endTime:
          description: Required. The end time of the observed session.
          type: string
          format: google-datetime
        endUtcOffset:
          description: >-
            Required. The offset of the user's local time at the end of the
            session relative to the Coordinated Universal Time (UTC).
          type: string
          format: google-duration
        civilStartTime:
          $ref: '#/components/schemas/CivilDateTime'
          description: >-
            Output only. Session start time in civil time in the timezone the
            subject is in at the start of the session.
          readOnly: true
      description: >-
        Represents a time interval of session data point, which bundles multiple
        observed metrics together.
      type: object
      id: SessionTimeInterval
    ActiveZoneMinutesRollupValue:
      id: ActiveZoneMinutesRollupValue
      description: >-
        Represents the result of the rollup of the active zone minutes data
        type.
      type: object
      properties:
        sumInCardioHeartZone:
          description: Active zone minutes in `HeartRateZone.CARDIO`.
          type: string
          format: int64
        sumInFatBurnHeartZone:
          description: Active zone minutes in `HeartRateZone.FAT_BURN`.
          type: string
          format: int64
        sumInPeakHeartZone:
          description: Active zone minutes in `HeartRateZone.PEAK`.
          type: string
          format: int64
    WeightQuantity:
      properties:
        grams:
          description: Required. The weight value in grams.
          type: number
          format: double
        userProvidedUnit:
          description: Optional. Value representing the user provided unit.
          type: string
          enum:
            - WEIGHT_UNIT_UNSPECIFIED
            - GRAM
            - KILOGRAM
            - OUNCE
            - POUND
            - STONE
            - MILLIGRAM
            - MICROGRAM
            - NANOGRAM
          enumDescriptions:
            - Unspecified weight unit.
            - Value representing gram.
            - Value representing kilogram.
            - Value representing ounce.
            - Value representing pound.
            - Value representing stone.
            - Value representing milligram.
            - Value representing microgram.
            - Value representing nanogram.
      description: Represents the weight quantity.
      type: object
      id: WeightQuantity
    CaloriesInHeartRateZoneValue:
      id: CaloriesInHeartRateZoneValue
      properties:
        heartRateZone:
          enumDescriptions:
            - Unspecified heart rate zone.
            - The light heart rate zone.
            - The moderate heart rate zone.
            - The vigorous heart rate zone.
            - The peak heart rate zone.
          description: The heart rate zone.
          type: string
          enum:
            - HEART_RATE_ZONE_TYPE_UNSPECIFIED
            - LIGHT
            - MODERATE
            - VIGOROUS
            - PEAK
        kcal:
          description: The amount of kilocalories burned in the specified heart rate zone.
          type: number
          format: double
      description: >-
        Represents the amount of kilocalories burned in a specific heart rate
        zone.
      type: object
    HttpResponse:
      id: HttpResponse
      description: Represents an HTTP response.
      type: object
      properties:
        headers:
          items:
            $ref: '#/components/schemas/HttpHeader'
          description: >-
            The HTTP response headers. The ordering of the headers is
            significant. Multiple headers with the same key may present for the
            response.
          type: array
        status:
          description: The HTTP status code, such as 200 or 404.
          type: integer
          format: int32
        reason:
          description: The HTTP reason phrase, such as "OK" or "Not Found".
          type: string
        body:
          description: >-
            The HTTP response body. If the body is not expected, it should be
            empty.
          type: string
          format: byte
    DailyRestingHeartRate:
      id: DailyRestingHeartRate
      description: >-
        Measures the daily resting heart rate for a user, calculated using the
        all day heart rate measurements.
      type: object
      properties:
        dailyRestingHeartRateMetadata:
          description: Optional. Metadata for the daily resting heart rate.
          $ref: '#/components/schemas/DailyRestingHeartRateMetadata'
        date:
          $ref: '#/components/schemas/Date'
          description: >-
            Required. Date (in the user's timezone) of the resting heart rate
            measurement.
        beatsPerMinute:
          description: Required. The resting heart rate value in beats per minute.
          type: string
          format: int64
    MedicalDeviceInfo:
      properties:
        algorithmVersion:
          description: Output only. The algorithm version used by the feature.
          type: string
          readOnly: true
        serviceVersion:
          description: Output only. The service version used by the feature.
          type: string
          readOnly: true
        firmwareVersion:
          readOnly: true
          description: >-
            Output only. The firmware version running on the compatible device
            used to collect the data.
          type: string
        featureVersion:
          description: Output only. The version of the feature/app running on the device.
          type: string
          readOnly: true
        deviceModel:
          readOnly: true
          description: >-
            Output only. The model name or device type of the compatible device
            used to collect the data.
          type: string
      description: >-
        Software as Medical Device (SaMD) metadata. Used to construct the Unique
        Device Identifier (UDI).
      type: object
      id: MedicalDeviceInfo
    Subscription:
      id: Subscription
      description: >-
        A subscription to a data collection for a specific user, to be delivered
        to a subscriber.
      type: object
      properties:
        dataTypes:
          description: >-
            Optional. Data types subscribed to. A subscriber will only receive
            notifications for data types that are declared here. A subscription
            can only subscribe to the data types of the subscriber. The values
            should be in the format
            "users/{health_user_id}/dataTypes/{data_type}" where `{data_type}`
            is one of "altitude", "distance", "floors", "sleep", "steps",
            "weight".
          type: array
          items:
            type: string
        user:
          description: >-
            Immutable. The resource name of the user for whom this subscription
            is active. Format: `users/{user}` where `{user}` is the public
            `healthUserId` as returned by the `GetIdentity` action in the
            profile PAPI (see
            `google.devicesandservices.health.v4main.HealthProfileService.GetIdentity`).
          type: string
        name:
          description: >-
            Identifier. The resource name of the Subscription. Format:
            `projects/{project}/subscribers/{subscriber}/subscriptions/{subscription}`
            Example:
            `projects/my-project/subscribers/my-subscriber-123/subscriptions/my-subscription-456`
            The {project} ID is mandatory (6-30 characters, matching
            /a-z{6,30}/) The {subscriber} ID is user-settable (4-36 characters,
            matching /[a-z]([a-z0-9-]{2,34}[a-z0-9])/) if provided during
            creation, or system-generated otherwise. The {subscription} ID is
            user-settable (4-36 chars, matching
            /[a-z]([a-z0-9-]{2,34}[a-z0-9])/) or system-generated otherwise.
          type: string
    DailyOxygenSaturation:
