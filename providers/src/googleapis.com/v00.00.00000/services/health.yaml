    EndpointAuthorization:
      properties:
        secret:
          description: >-
            Required. Input only. Provides a client-provided secret that will be
            sent with each notification to the subscriber endpoint using the
            "Authorization" header. The value must include the authorization
            scheme, e.g., "Bearer " or "Basic ", as it will be used as the full
            Authorization header value. This secret is used by the API to test
            the endpoint during `CreateSubscriber` and `UpdateSubscriber` calls,
            and will be sent in the `Authorization` header for all subsequent
            webhook notifications to this endpoint.
          type: string
        secretSet:
          readOnly: true
          description: Output only. Whether the secret is set.
          type: boolean
      description: >-
        Authorization mechanism for a subscriber endpoint. For all requests sent
        by the Webhooks service, the JSON payload is cryptographically signed.
        The signature is delivered in the `GOOGLE-HEALTH-API-SIGNATURE` HTTP
        header. This is an ECDSA (NIST P256) signature of the JSON payload.
        Clients must verify this signature using Google Health API's public key
        to confirm the payload was sent by the Health API.
      type: object
      id: EndpointAuthorization
    Device:
      properties:
        manufacturer:
          description: Optional. An optional manufacturer of the device.
          type: string
        formFactor:
          enumDescriptions:
            - The form factor is unspecified.
            - The device is a fitness band.
            - The device is a watch.
            - The device is a phone.
            - The device is a ring.
            - The device is a chest strap.
            - The device is a scale.
            - The device is a tablet.
            - The device is a head mounted device.
            - The device is a smart display.
          description: Optional. Captures the form factor of the device.
          type: string
          enum:
            - FORM_FACTOR_UNSPECIFIED
            - FITNESS_BAND
            - WATCH
            - PHONE
            - RING
            - CHEST_STRAP
            - SCALE
            - TABLET
            - HEAD_MOUNTED
            - SMART_DISPLAY
        displayName:
          description: Optional. An optional name for the device.
          type: string
      description: Captures metadata about the device that recorded the measurement.
      type: object
      id: Device
    Subscriber:
      description: >-
        -- Resource Messages -- A subscriber receives notifications from Google
        Health API.
      type: object
      properties:
        state:
          enumDescriptions:
            - Represents an unspecified subscriber state.
            - >-
              Represents an unverified subscriber. This is the initial state of
              the subscriber when it is created. The backend will verify the
              subscriber's endpoint_uri.
            - Represents an active subscriber. The endpoint has been verified.
            - Represents an inactive subscriber.
          type: string
          readOnly: true
          description: Output only. The state of the subscriber.
          enum:
            - STATE_UNSPECIFIED
            - UNVERIFIED
            - ACTIVE
            - INACTIVE
        endpointAuthorization:
          $ref: '#/components/schemas/EndpointAuthorization'
          description: >-
            Required. Authorization mechanism for a subscriber endpoint. This is
            required to ensure the endpoint can be verified.
        createTime:
          readOnly: true
          description: Output only. The time at which the subscriber was created.
          type: string
          format: google-datetime
        name:
          description: >-
            Identifier. The resource name of the Subscriber. Format:
            projects/{project}/subscribers/{subscriber} The {project} ID is a
            Google Cloud Project ID or Project Number. The {subscriber} ID is
            user-settable (4-36 characters, matching
            /[a-z]([a-z0-9-]{2,34}[a-z0-9])/) if provided during creation, or
            system-generated otherwise (e.g., a UUID). Example (User-settable
            subscriber ID): projects/my-project/subscribers/my-sub-123 Example
            (System-generated subscriber ID):
            projects/my-project/subscribers/a1b2c3d4-e5f6-7890-1234-567890abcdef
          type: string
        updateTime:
          readOnly: true
          description: Output only. The time at which the subscriber was last updated.
          type: string
          format: google-datetime
        endpointUri:
          description: >-
            Required. The full HTTPS URI where update notifications will be
            sent. The URI must be a valid URL and use HTTPS as the scheme. This
            endpoint will be verified during CreateSubscriber and
            UpdateSubscriber calls. See RPC documentation for verification
            details.
          type: string
        subscriberConfigs:
          description: Optional. Configuration for the subscriber.
          type: array
          items:
            $ref: '#/components/schemas/SubscriberConfig'
      id: Subscriber
