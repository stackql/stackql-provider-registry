    NutritionLog:
      id: NutritionLog
      description: >-
        Holds information about food logged by a user. There are two ways of
        creating a nutrition log based on the food type: 1. Identified food:
        Using the food field, which is a reference to a Food resource. In this
        case fields `nutrients`, `energy`, `energy_from_fat`,
        `total_carbohydrate`, `total_fat`, `food_display_name` will be populated
        based on the referenced food. 2. Anonymous food: Using the
        `food_display_name` field and setting the `nutrients`, `energy`,
        `energy_from_fat`, `total_carbohydrate`, `total_fat` fields manually.
        The identified food is preferred over the anonymous food. Nutrition logs
        created from anonymous food are not editable.
      type: object
      properties:
        nutrients:
          description: >-
            Optional. An array of individual nutrient values for the nutrition
            log.
          type: array
          items:
            $ref: '#/components/schemas/NutrientQuantity'
        interval:
          description: Required. The time window when the food was logged.
          $ref: '#/components/schemas/SessionTimeInterval'
        serving:
          $ref: '#/components/schemas/Serving'
          description: Optional. The serving information for the logged food.
        foodDisplayName:
          description: >-
            The display name of the food. For identified food logs, this is
            populated automatically from the referenced food.
          type: string
        food:
          description: >-
            Optional. The resource name of the Food item. Required when creating
            a nutrition log from an identified food. For anonymous food logs,
            use the `food_display_name` field instead.
          type: string
        energy:
          description: >-
            Optional. The total energy of the food, measured in kilocalories
            (`kcal`).
          $ref: '#/components/schemas/EnergyQuantity'
        totalCarbohydrate:
          description: Optional. The total carbohydrate content, measured in grams.
          $ref: '#/components/schemas/WeightQuantity'
        energyFromFat:
          description: Optional. The energy from fat, measured in kilocalories (`kcal`).
          $ref: '#/components/schemas/EnergyQuantity'
        mealType:
          enumDescriptions:
            - Unspecified meal type.
            - Value representing a meal before breakfast.
            - Value representing a breakfast.
            - Value representing a morning snack.
            - Value representing a lunch.
            - Value representing an afternoon snack.
            - Value representing dinner.
            - Value representing an evening snack.
            - >-
              Value representing any meal outside of the usual three meals per
              day.
            - Value representing any time (legacy NA).
          description: >-
            Optional. The meal category. One of `BREAKFAST`, `LUNCH`, `DINNER`,
            or `SNACK`.
          type: string
          enum:
            - MEAL_TYPE_UNSPECIFIED
            - BEFORE_BREAKFAST
            - BREAKFAST
            - BEFORE_LUNCH
            - LUNCH
            - BEFORE_DINNER
            - DINNER
            - AFTER_DINNER
            - SNACK
            - ANYTIME
        totalFat:
          $ref: '#/components/schemas/WeightQuantity'
          description: Optional. The total fat content, measured in grams.
    Operation:
      id: Operation
      properties:
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
        response:
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      type: object
    CivilTimeInterval:
      description: Counterpart of google.type.Interval, but using CivilDateTime.
      type: object
      properties:
        end:
          description: Required. The exclusive end of the range.
          $ref: '#/components/schemas/CivilDateTime'
        start:
          $ref: '#/components/schemas/CivilDateTime'
          description: Required. The inclusive start of the range.
      id: CivilTimeInterval
    FoodServing:
      description: >-
        Represents different properties and information about the serving of a
        specific food.
      type: object
