            - FOOD_ACCESS_LEVEL_PUBLIC
            - FOOD_ACCESS_LEVEL_PRIVATE
          enumDescriptions:
            - Unspecified food access level.
            - Public food access level.
            - Private food access level.
        energyMax:
          description: >-
            Optional. Value representing the maximum energy of the food for the
