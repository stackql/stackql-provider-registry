          type: boolean
        references:
          description: Optional. The schema references used by the schema.
          items:
            $ref: '#/components/schemas/SchemaReference'
          type: array
        schema:
          description: Required. The schema payload
          type: string
        schemaType:
          description: Optional. The schema type of the schema.
          enum:
