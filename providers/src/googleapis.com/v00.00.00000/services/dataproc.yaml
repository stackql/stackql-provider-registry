        sessionId:
          description: Required. Session ID of the session.
          type: string
        startTimestamp:
          description: Timestamp when the session started.
          format: int64
          type: string
        totalExecution:
          description: Optional. Total number of executions in the session.
          format: int64
          type: string
        userId:
