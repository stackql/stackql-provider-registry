        taskResources:
          additionalProperties:
            $ref: '#/components/schemas/TaskResourceRequest'
          type: object
      type: object
    RuntimeConfig:
      description: Runtime configuration for a workload.
      id: RuntimeConfig
      properties:
        autotuningConfig:
          $ref: '#/components/schemas/AutotuningConfig'
