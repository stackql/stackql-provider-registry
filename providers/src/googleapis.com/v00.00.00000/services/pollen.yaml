        Returns up to 5 days of daily pollen information in more than 65
        countries, up to 1km resolution.
      operationId: pollen.forecast.lookup
      parameters:
        - in: query
          name: days
          schema:
            format: int32
            type: integer
        - in: query
          name: languageCode
          schema:
            type: string
        - in: query
          name: location.latitude
          schema:
            format: double
            type: number
        - in: query
          name: location.longitude
          schema:
            format: double
            type: number
        - in: query
          name: pageSize
          schema:
            format: int32
            type: integer
        - in: query
          name: pageToken
          schema:
            type: string
        - in: query
          name: plantsDescription
          schema:
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupForecastResponse'
          description: Successful response
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
    parameters: &ref_1
      - $ref: '#/components/parameters/_.xgafv'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/callback'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/key'
      - $ref: '#/components/parameters/oauth_token'
      - $ref: '#/components/parameters/prettyPrint'
      - $ref: '#/components/parameters/quotaUser'
      - $ref: '#/components/parameters/uploadType'
      - $ref: '#/components/parameters/upload_protocol'
  /v1/mapTypes/{mapType}/heatmapTiles/{zoom}/{x}/{y}:
    get:
      description: Returns a byte array containing the data of the tile PNG image.
      operationId: pollen.mapTypes.heatmapTiles.lookupHeatmapTile
      parameters:
        - in: path
          name: mapType
          required: true
          schema:
            type: string
        - in: path
          name: zoom
          required: true
          schema:
            type: string
        - in: path
          name: x
          required: true
          schema:
            type: string
        - in: path
