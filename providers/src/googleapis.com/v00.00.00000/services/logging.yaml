        exclusions:
          items:
            $ref: '#/components/schemas/LogExclusion'
          type: array
          description: A list of exclusions.
    LogView:
      properties:
        description:
          description: Optional. Describes this view.
          type: string
        updateTime:
          description: Output only. The last update timestamp of the view.
          format: google-datetime
          readOnly: true
          type: string
        createTime:
          readOnly: true
          type: string
          description: Output only. The creation timestamp of the view.
          format: google-datetime
        name:
          description: >-
            Output only. The resource name of the view.For
            example:projects/my-project/locations/global/buckets/my-bucket/views/my-view
          readOnly: true
          type: string
        filter:
          description: >-
            Optional. Filter that restricts which log entries in a bucket are
            visible in this view.Filters must be logical conjunctions that use
            the AND operator, and they can use any of the following qualifiers:
            SOURCE(), which specifies a project, folder, organization, or
            billing account of origin. resource.type, which specifies the
            resource type. LOG_ID(), which identifies the log.They can also use
            the negations of these qualifiers with the NOT operator.For
            example:SOURCE("projects/myproject") AND resource.type =
            "gce_instance" AND NOT LOG_ID("stdout")
          type: string
      type: object
      id: LogView
      description: Describes a view over log entries in a bucket.
    OpsAnalyticsQuery:
