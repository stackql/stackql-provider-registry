            of strings. For example: { "name": "my-test-instance",
            "security_group": ["a", "b", "c"], "spot_instance": false } 
          type: object
          additionalProperties:
            description: Properties of the object.
            type: any
    Binding:
      properties:
        members:
          type: array
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. members can have the following values: allUsers: A special
            identifier that represents anyone who is on the internet; with or
            without a Google account. allAuthenticatedUsers: A special
            identifier that represents anyone who is authenticated with a Google
            account or a service account. Does not include identities that come
            from external identity providers (IdPs) through identity federation.
            user:{emailid}: An email address that represents a specific Google
            account. For example, alice@example.com . serviceAccount:{emailid}:
            An email address that represents a Google service account. For
            example, my-other-app@appspot.gserviceaccount.com.
            serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]:
            An identifier for a Kubernetes service account
            (https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example, my-project.svc.id.goog[my-namespace/my-kubernetes-sa].
            group:{emailid}: An email address that represents a Google group.
            For example, admins@example.com. domain:{domain}: The G Suite domain
            (primary) that represents all the users of that domain. For example,
            google.com or example.com.
            principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}:
            A single identity in a workforce identity pool.
            principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}:
            All workforce identities in a group.
            principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}:
            All workforce identities with a specific attribute value.
            principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*:
            All identities in a workforce identity pool.
            principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}:
            A single identity in a workload identity pool.
            principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}:
            A workload identity pool group.
            principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}:
            All identities in a workload identity pool with a certain attribute.
            principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*:
            All identities in a workload identity pool.
            deleted:user:{emailid}?uid={uniqueid}: An email address (plus unique
            identifier) representing a user that has been recently deleted. For
            example, alice@example.com?uid=123456789012345678901. If the user is
            recovered, this value reverts to user:{emailid} and the recovered
            user retains the role in the binding.
            deleted:serviceAccount:{emailid}?uid={uniqueid}: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901.
            If the service account is undeleted, this value reverts to
            serviceAccount:{emailid} and the undeleted service account retains
            the role in the binding. deleted:group:{emailid}?uid={uniqueid}: An
            email address (plus unique identifier) representing a Google group
            that has been recently deleted. For example,
            admins@example.com?uid=123456789012345678901. If the group is
            recovered, this value reverts to group:{emailid} and the recovered
            group retains the role in the binding.
            deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}:
            Deleted single identity in a workforce identity pool. For example,
            deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value.
          items:
            type: string
        condition:
          description: >-
            The condition that is associated with this binding.If the condition
            evaluates to true, then this binding applies to the current
            request.If the condition evaluates to false, then this binding does
            not apply to the current request. However, a different role binding
            might grant the same role to one or more of the principals in this
            binding.To learn which resources support conditions in their IAM
            policies, see the IAM documentation
            (https://cloud.google.com/iam/help/conditions/resource-policies).
          $ref: '#/components/schemas/Expr'
        role:
          description: >-
            Role that is assigned to the list of members, or principals. For
            example, roles/viewer, roles/editor, or roles/owner.For an overview
            of the IAM roles and permissions, see the IAM documentation
            (https://cloud.google.com/iam/docs/roles-overview). For a list of
            the available pre-defined roles, see here
            (https://cloud.google.com/iam/docs/understanding-roles).
          type: string
      type: object
      id: Binding
      description: Associates members, or principals, with a role.
    Link:
      id: Link
      description: Describes a link connected to an analytics enabled bucket.
      type: object
      properties:
        description:
          description: >-
            Optional. Describes this link.The maximum length of the description
            is 8000 characters.
          type: string
        createTime:
          readOnly: true
          type: string
          description: Output only. The creation timestamp of the link.
          format: google-datetime
        name:
          description: >-
            Output only. The resource name of the link. The name can have up to
            100 characters. A valid link id (at the end of the link name) must
            only have alphanumeric characters and underscores within it.
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "organizations/[ORGANIZATION_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "billingAccounts/[BILLING_ACCOUNT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "folders/[FOLDER_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            For
            example:`projects/my-project/locations/global/buckets/my-bucket/links/my_link
          readOnly: true
          type: string
        lifecycleState:
          description: Output only. The resource lifecycle state.
          enumDescriptions:
            - >-
              Unspecified state. This is only used/useful for distinguishing
              unset values.
            - The normal and active state.
            - >-
              The resource has been marked for deletion by the user. For some
              resources (e.g. buckets), this can be reversed by an un-delete
              operation.
            - >-
              The resource has been marked for an update by the user. It will
              remain in this state until the update is complete.
            - >-
              The resource has been marked for creation by the user. It will
              remain in this state until the creation is complete.
            - The resource is in an INTERNAL error state.
          readOnly: true
          type: string
          enum:
            - LIFECYCLE_STATE_UNSPECIFIED
            - ACTIVE
            - DELETE_REQUESTED
            - UPDATING
            - CREATING
            - FAILED
        bigqueryDataset:
          description: >-
            Optional. The information of a BigQuery Dataset. When a link is
            created, a BigQuery dataset is created along with it, in the same
            project as the LogBucket it's linked to. This dataset will also have
            BigQuery Views corresponding to the LogViews in the bucket.
          $ref: '#/components/schemas/BigQueryDataset'
    LogScope:
      type: object
      id: LogScope
      description: Describes a group of resources to read log entries from.
      properties:
        name:
          readOnly: true
          type: string
          description: >-
            Output only. The resource name of the log scope.Log scopes are only
            available in the global location. For
            example:projects/my-project/locations/global/logScopes/my-log-scope
        createTime:
          description: Output only. The creation timestamp of the log scope.
          format: google-datetime
          readOnly: true
          type: string
        resourceNames:
          type: array
          description: >-
            Required. Names of one or more parent resources (organizations and
            folders are not supported.): projects/[PROJECT_ID]May alternatively
            be one or more views:
            projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]A
            log scope can include a maximum of 5 projects and a maximum of 100
            resources in total.
          items:
            type: string
        updateTime:
          description: Output only. The last update timestamp of the log scope.
          format: google-datetime
          readOnly: true
          type: string
        description:
          type: string
          description: >-
            Optional. Describes this log scope.The maximum length of the
            description is 8000 characters.
    ListSavedQueriesResponse:
      type: object
      id: ListSavedQueriesResponse
      description: The response from ListSavedQueries.
      properties:
        savedQueries:
          items:
            $ref: '#/components/schemas/SavedQuery'
          type: array
          description: A list of saved queries.
        nextPageToken:
          description: >-
            If there might be more results than appear in this response, then
            nextPageToken is included. To get the next set of results, call the
            same method again using the value of nextPageToken as pageToken.
          type: string
        unreachable:
          description: >-
            The unreachable resources. It can be either 1) a saved query if a
            specific query is unreachable or 2) a location if a specific
            location is unreachabe.
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/savedQueries/[QUERY_ID]"
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]" For example:
            "projects/my-project/locations/global/savedQueries/12345678"
            "projects/my-project/locations/global" If there are unreachable
            resources, the response will first return pages that contain saved
            queries, and then return pages that contain the unreachable
            resources.
          type: array
          items:
            type: string
    TestIamPermissionsRequest:
      properties:
        permissions:
          items:
            type: string
          description: >-
            The set of permissions to check for the resource. Permissions with
            wildcards (such as * or storage.*) are not allowed. For more
            information see IAM Overview
            (https://cloud.google.com/iam/docs/overview#permissions).
          type: array
      type: object
      id: TestIamPermissionsRequest
      description: Request message for TestIamPermissions method.
    MetricDescriptorMetadata:
      type: object
      id: MetricDescriptorMetadata
      description: Additional annotations that can be used to guide the usage of a metric.
      properties:
        ingestDelay:
          description: >-
            The delay of data points caused by ingestion. Data points older than
            this age are guaranteed to be ingested and available to be read,
            excluding data loss due to errors.
          format: google-duration
          type: string
        launchStage:
          enum:
            - LAUNCH_STAGE_UNSPECIFIED
            - UNIMPLEMENTED
            - PRELAUNCH
            - EARLY_ACCESS
            - ALPHA
            - BETA
            - GA
            - DEPRECATED
          deprecated: true
          type: string
          description: Deprecated. Must use the MetricDescriptor.launch_stage instead.
          enumDescriptions:
            - Do not use this default value.
            - The feature is not yet implemented. Users can not use it.
            - >-
              Prelaunch features are hidden from users and are only visible
              internally.
            - >-
              Early Access features are limited to a closed group of testers. To
              use these features, you must sign up in advance and sign a Trusted
              Tester agreement (which includes confidentiality provisions).
              These features may be unstable, changed in backward-incompatible
              ways, and are not guaranteed to be released.
            - >-
              Alpha is a limited availability test for releases before they are
              cleared for widespread use. By Alpha, all significant design
              issues are resolved and we are in the process of verifying
              functionality. Alpha customers need to apply for access, agree to
              applicable terms, and have their projects allowlisted. Alpha
              releases don't have to be feature complete, no SLAs are provided,
              and there are no technical support obligations, but they will be
              far enough along that customers can actually use them in test
              environments or for limited-use tests -- just like they would in
              normal production cases.
            - >-
              Beta is the point at which we are ready to open a release for any
              customer to use. There are no SLA or technical support obligations
              in a Beta release. Products will be complete from a feature
              perspective, but may have some open outstanding issues. Beta
              releases are suitable for limited production use cases.
            - >-
              GA features are open to all developers and are considered stable
              and fully qualified for production use.
            - >-
              Deprecated features are scheduled to be shut down and removed. For
              more information, see the "Deprecation Policy" section of our
              Terms of Service (https://cloud.google.com/terms/) and the Google
              Cloud Platform Subject to the Deprecation Policy
              (https://cloud.google.com/terms/deprecation) documentation.
        samplePeriod:
          type: string
          description: >-
            The sampling period of metric data points. For metrics which are
            written periodically, consecutive data points are stored at this
            time interval, excluding data loss due to errors. Metrics with a
            higher granularity have a smaller sampling period.
          format: google-duration
        timeSeriesResourceHierarchyLevel:
          items:
            enum:
              - TIME_SERIES_RESOURCE_HIERARCHY_LEVEL_UNSPECIFIED
              - PROJECT
              - ORGANIZATION
              - FOLDER
            type: string
            enumDescriptions:
              - Do not use this default value.
              - Scopes a metric to a project.
              - Scopes a metric to an organization.
              - Scopes a metric to a folder.
          description: The scope of the timeseries data of the metric.
          type: array
    SourceLocation:
      properties:
        functionName:
          type: string
          description: >-
            Human-readable name of the function or method being invoked, with
            optional context such as the class or package name. This information
            is used in contexts such as the logs viewer, where a file and line
            number are less meaningful. The format can vary by language. For
            example: qual.if.ied.Class.method (Java), dir/package.func (Go),
            function (Python).
        file:
          description: >-
            Source file name. Depending on the runtime environment, this might
            be a simple name or a fully-qualified name.
          type: string
        line:
          type: string
          description: Line within the source file.
          format: int64
      id: SourceLocation
      description: Specifies a location in a source code file.
      type: object
    CmekSettings:
      properties:
        name:
          description: Output only. The resource name of the CMEK settings.
          readOnly: true
          type: string
        serviceAccountId:
          readOnly: true
          type: string
          description: >-
            Output only. The service account that will be used by the Log Router
            to access your Cloud KMS key.Before enabling CMEK for Log Router,
            you must first assign the cloudkms.cryptoKeyEncrypterDecrypter role
            to the service account that the Log Router will use to access your
            Cloud KMS key. Use GetCmekSettings to obtain the service account
            ID.See Configure CMEK for Cloud Logging
            (https://docs.cloud.google.com/logging/docs/routing/managed-encryption)
            for more information.
        kmsKeyName:
          description: >-
            Optional. The resource name for the configured Cloud KMS key.KMS key
            name format:
            "projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]"
            For
            example:"projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key"To
            enable CMEK for the Log Router, set this field to a valid
            kms_key_name for which the associated service account has the needed
            cloudkms.cryptoKeyEncrypterDecrypter roles assigned for the key.The
            Cloud KMS key used by the Log Router can be updated by changing the
            kms_key_name to a new valid key name or disabled by setting the key
            name to an empty string. Encryption operations that are in progress
            will be completed with the key that was in use when they started.
            Decryption operations will be completed using the key that was used
            at the time of encryption unless access to that key has been
            revoked.To disable CMEK for the Log Router, set this field to an
            empty string.See Configure CMEK for Cloud Logging
            (https://docs.cloud.google.com/logging/docs/routing/managed-encryption)
            for more information.
          type: string
        kmsKeyVersionName:
          description: >-
            Output only. The CryptoKeyVersion resource name for the configured
            Cloud KMS key.KMS key name format:
            "projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]/cryptoKeyVersions/[VERSION]"
            For
            example:"projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key/cryptoKeyVersions/1"This
            is a read-only field used to convey the specific configured
            CryptoKeyVersion of kms_key that has been configured. It will be
            populated in cases where the CMEK settings are bound to a single key
            version.If this field is populated, the kms_key is tied to a
            specific CryptoKeyVersion.
          readOnly: true
          type: string
      id: CmekSettings
      description: >-
        Describes the customer-managed encryption key (CMEK) settings associated
        with a project, folder, organization, billing account, or flexible
        resource.Note: CMEK for the Log Router can currently only be configured
        for Google Cloud organizations. Once configured, it applies to all
        projects and folders in the Google Cloud organization.See Configure CMEK
        for Cloud Logging
        (https://docs.cloud.google.com/logging/docs/routing/managed-encryption)
        for more information.
      type: object
    ListLogEntriesResponse:
      type: object
      id: ListLogEntriesResponse
      description: Result returned from ListLogEntries.
      properties:
        nextPageToken:
          type: string
          description: >-
            If there might be more results than those appearing in this
            response, then nextPageToken is included. To get the next set of
            results, call this method again using the value of nextPageToken as
            pageToken.If a value for next_page_token appears and the entries
            field is empty, it means that the search found no log entries so far
            but it did not have time to search all the possible log entries.
            Retry the method with this value for page_token to continue the
            search. Alternatively, consider speeding up the search by changing
            your filter to specify a single log name or resource type, or to
            narrow the time range of the search.
        entries:
          items:
            $ref: '#/components/schemas/LogEntry'
          description: >-
            A list of log entries. If entries is empty, nextPageToken may still
