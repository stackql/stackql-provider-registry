    VirtualField:
      type: object
      id: VirtualField
      description: >-
        A virtual field is a field that is not physically present in the
        underlying data schema, but is created through specific operations
        within the query builder model based on other fields in the schema.
      properties:
        virtualFieldType:
          description: Required. The type of the virtual field.
          enumDescriptions:
            - Invalid value, do not use.
            - >-
              Creates a virtual field by selecting the first non-null value from
              the list of fields specified in underlying_field_sources, similar
              to a COALESCE function in SQL.
          type: string
          enum:
            - VIRTUAL_FIELD_TYPE_UNSPECIFIED
            - COALESCE
        underlyingFieldSources:
          items:
            $ref: '#/components/schemas/FieldSource'
          type: array
          description: >-
            The field sources that will be used to create the virtual field,
            based on the semantics of the virtual field type.The field sources
            must follow these rules, based on the virtual field type: - For
            VIRTUAL_FIELD_TYPE_UNSPECIFIED, this field must be empty. - For
            COALESCE, this field must be non-empty and include a minimum of two
            field sources. The underlying field sources must be actual projected
            fields that represent actual schema fields and that must not be
            transformed and aggregated in any way, except for casting. The type
            of all the underlying field sources must be equivalent so that
            picking one of them would result in the same value type.
    LogSplit:
