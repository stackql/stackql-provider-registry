openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Cloud Logging API
  description: Writes log entries and manages your Cloud Logging configuration.
  version: v2
  x-discovery-doc-revision: '20260706'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/logging/docs/
servers:
  - url: https://logging.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
            https://www.googleapis.com/auth/cloud-platform.read-only: >-
              View your data across Google Cloud services and see the email
              address of your Google Account
            https://www.googleapis.com/auth/logging.admin: Administrate log data for your projects
            https://www.googleapis.com/auth/logging.read: View log data for your projects
            https://www.googleapis.com/auth/logging.write: Submit log data for your projects
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    DeleteLinkRequest:
      properties:
        name:
          type: string
          description: >-
            Required. The full resource name of the link to delete.
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "organizations/[ORGANIZATION_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "billingAccounts/[BILLING_ACCOUNT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "folders/[FOLDER_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]" 
      id: DeleteLinkRequest
      description: The parameters to DeleteLink.
      type: object
    LogBucket:
      properties:
        updateTime:
          description: Output only. The last update timestamp of the bucket.
          format: google-datetime
          readOnly: true
          type: string
        retentionDays:
          description: >-
            Optional. Logs will be retained by default for this amount of time,
            after which they will automatically be deleted. The minimum
            retention period is 1 day. If this value is set to zero at bucket
            creation time, the default time of 30 days will be used.
          format: int32
          type: integer
        restrictedFields:
          items:
            type: string
          type: array
          description: >-
            Optional. Log entry field paths that are denied access in this
            bucket.The following fields and their children are eligible:
            textPayload, jsonPayload, protoPayload, httpRequest, labels,
            sourceLocation.Restricting a repeated field will restrict all
            values. Adding a parent will block all child fields. (e.g. foo.bar
            will block foo.bar.baz)
        name:
          description: >-
            Output only. The resource name of the bucket.For
            example:projects/my-project/locations/global/buckets/my-bucketFor a
            list of supported locations, see Supported Regions
            (https://docs.cloud.google.com/logging/docs/region-support)For the
            location of global it is unspecified where log entries are actually
            stored.After a bucket has been created, the location cannot be
            changed.
          readOnly: true
          type: string
        lifecycleState:
          readOnly: true
          type: string
          description: Output only. The bucket lifecycle state.
          enumDescriptions:
            - >-
              Unspecified state. This is only used/useful for distinguishing
              unset values.
            - The normal and active state.
            - >-
              The resource has been marked for deletion by the user. For some
              resources (e.g. buckets), this can be reversed by an un-delete
              operation.
            - >-
              The resource has been marked for an update by the user. It will
              remain in this state until the update is complete.
            - >-
              The resource has been marked for creation by the user. It will
              remain in this state until the creation is complete.
            - The resource is in an INTERNAL error state.
          enum:
            - LIFECYCLE_STATE_UNSPECIFIED
            - ACTIVE
            - DELETE_REQUESTED
            - UPDATING
            - CREATING
            - FAILED
        cmekSettings:
          description: >-
            Optional. The CMEK settings of the log bucket. If present, new log
            entries written to this log bucket are encrypted using the CMEK key
            provided in this configuration. If a log bucket has CMEK settings,
            the CMEK settings cannot be disabled later by updating the log
            bucket. Changing the KMS key is allowed.
          $ref: '#/components/schemas/CmekSettings'
        description:
          type: string
          description: Optional. Describes this bucket.
        indexConfigs:
          type: array
          description: Optional. A list of indexed fields and related configuration data.
          items:
            $ref: '#/components/schemas/IndexConfig'
        createTime:
          description: >-
            Output only. The creation timestamp of the bucket. This is not set
            for any of the default buckets.
          format: google-datetime
          readOnly: true
          type: string
        analyticsEnabled:
          type: boolean
          description: >-
            Optional. Whether log analytics is enabled for this bucket.Once
            enabled, log analytics features cannot be disabled.
        locked:
          description: >-
            Optional. Whether the bucket is locked.The retention period on a
            locked bucket cannot be changed. Locked buckets may only be deleted
            if they are empty.
          type: boolean
      id: LogBucket
      description: Describes a repository in which log entries are stored.
      type: object
    SuppressionInfo:
      properties:
        reason:
          type: string
          description: The reason that entries were omitted from the session.
          enumDescriptions:
            - Unexpected default.
            - >-
              Indicates suppression occurred due to relevant entries being
              received in excess of rate limits. For quotas and limits, see
              Logging API quotas and limits
              (https://docs.cloud.google.com/logging/quotas#api-limits).
            - >-
              Indicates suppression occurred due to the client not consuming
              responses quickly enough.
          enum:
            - REASON_UNSPECIFIED
            - RATE_LIMIT
            - NOT_CONSUMED
        suppressedCount:
          description: A lower bound on the count of entries omitted due to reason.
          format: int32
          type: integer
      id: SuppressionInfo
      description: Information about entries that were omitted from the session.
      type: object
    Operation:
      properties:
        response:
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as Delete, the response is
            google.protobuf.Empty. If the original method is standard
            Get/Create/Update, the response should be the resource. For other
            methods, the response should have the type XxxResponse, where Xxx is
            the original method name. For example, if the original method name
            is TakeSnapshot(), the inferred response type is
            TakeSnapshotResponse.
        metadata:
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the name should be a resource name ending with
            operations/{unique_id}.
          type: string
        done:
          description: >-
            If the value is false, it means the operation is still in progress.
            If true, the operation is completed, and either error or response is
            available.
          type: boolean
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
      id: Operation
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      type: object
    ProjectedField:
      type: object
      id: ProjectedField
      description: >-
        Represents a field selected in the query, analogous to an item in a SQL
        SELECT clause. It specifies the source field and optionally applies
        transformations like aggregation, casting, regex extraction, or assigns
        an alias. Use ProjectedField when you need more than just the raw source
        field name (for which you might use FieldSource directly in
        QueryBuilderConfig's field_sources list if no transformations or
        specific operation type are needed).A ProjectedField can represent
        either a field present in the data schema (specified via the field
        property) or a virtual field that is computed from other fields
        (specified via the virtual_field property).
      properties:
        cast:
          type: string
          description: >-
            The cast for the field. This can any SQL cast type. Examples: -
            STRING - CHAR - DATE - TIMESTAMP - DATETIME - INT - FLOAT
        field:
          type: string
          description: >-
            Optional. The field name. This will be the field that is selected
            using the dot notation to display the drill down value.
        operation:
          enum:
            - FIELD_OPERATION_UNSPECIFIED
            - NO_SETTING
            - GROUP_BY
            - AGGREGATE
          type: string
          description: >-
            Specifies the role of this field (direct selection, grouping, or
            aggregation).
          enumDescriptions:
            - Invalid value. Operation must be specified.
            - >-
              Select the field directly without grouping or aggregation.
              Corresponds to including the raw field (potentially with cast,
              regex, or alias) in the SELECT list.
            - >-
              Group the query results by the distinct values of this field.
              Corresponds to including the field (potentially truncated) in the
              GROUP BY clause.
            - >-
              Apply an aggregation function to this field across grouped
              results. Corresponds to applying a function like COUNT, SUM, AVG
              in the SELECT list. Requires sql_aggregation_function to be set.
        alias:
          description: >-
            The alias name for the field. Valid alias examples are: - single
            word alias: TestAlias - numbers in an alias: Alias123 - multi word
            alias should be enclosed in quotes: "Test Alias" Invalid alias
            examples are: - alias containing keywords: WHERE, SELECT, FROM, etc.
            - alias starting with a number: 1stAlias
          type: string
        truncationGranularity:
          type: string
          description: >-
            The truncation granularity when grouping by a time/date field. This
            will be used to truncate the field to the granularity specified.
            This can be either a date or a time granularity found at
            https://cloud.google.com/bigquery/docs/reference/standard-sql/timestamp_functions#timestamp_trunc_granularity_date
            and
            https://cloud.google.com/bigquery/docs/reference/standard-sql/timestamp_functions#timestamp_trunc_granularity_time
            respectively.
        virtualField:
          $ref: '#/components/schemas/VirtualField'
          description: >-
            Optional. A virtual field definition, used in place of field to
            define a field that is computed from other fields rather than being
            directly present in the data schema.For example, a virtual field can
            be defined using COALESCE to select the first non-null value from a
            list of fields.If virtual_field is set, field must not be set.
        sqlAggregationFunction:
          description: The function to apply to the field.
          $ref: '#/components/schemas/FunctionApplication'
        regexExtraction:
          type: string
          description: >-
            The re2 extraction for the field. This will be used to extract the
            value from the field using REGEXP_EXTRACT. More information on re2
            can be found here: https://github.com/google/re2/wiki/Syntax. Meta
            characters like +?()| will need to be escaped. Examples: -
            ".(autoscaler.*)$" will be converted to
            REGEXP_EXTRACT(JSON_VALUE(field),"request(.*(autoscaler.*)$)")in
            SQL. - "\(test_value\)$" will be converted to
            REGEXP_EXTRACT(JSON_VALUE(field),"request(\(test_value\)$)") in SQL.
    SortOrderParameter:
      type: object
      id: SortOrderParameter
      description: A sort order for a query based on a column.
      properties:
        fieldSource:
          $ref: '#/components/schemas/FieldSource'
          description: >-
            The field to sort on. Can be one of the FieldSource types: field
            name, alias ref, variable ref, or a literal value.
        sortOrderDirection:
          enum:
            - SORT_ORDER_UNSPECIFIED
            - SORT_ORDER_NONE
            - SORT_ORDER_ASCENDING
            - SORT_ORDER_DESCENDING
          type: string
          description: The sort order to use for the query.
          enumDescriptions:
            - Invalid value, do not use.
            - >-
              No sorting will be applied. This is used to determine if the query
              is in pass thru mode. To correctly chart a query in pass thru
              mode, NONE will need to be sent
            - The lowest-valued entries will be selected.
            - The highest-valued entries will be selected.
    QueryBuilderConfig:
      type: object
      id: QueryBuilderConfig
      description: >-
        Defines a structured query configuration that can be used instead of
        writing raw SQL. This configuration represents the components of a SQL
        query (FROM, SELECT, WHERE, ORDER BY, LIMIT) and is typically converted
        into an executable query (e.g., BigQuery SQL) by the backend service to
        retrieve data for analysis or visualization.
      properties:
        filter:
          description: >-
            The filter to use for the query. This equates to the WHERE clause in
            SQL.
          $ref: '#/components/schemas/FilterPredicate'
        limit:
          type: string
          description: >-
            The limit to use for the query. This equates to the LIMIT clause in
            SQL. A limit of 0 will be treated as not enabled.
          format: int64
        searchTerm:
          type: string
          description: >-
            The plain text search to use for the query. There is no support for
            multiple search terms. This uses the SEARCH functionality in
            BigQuery. For example, a search_term = 'ERROR' would result in the
            following SQL:SELECT * FROM resource WHERE SEARCH(resource, 'ERROR')
            LIMIT 100
        resourceNames:
          description: >-
            Required. The view/resource to query. For now only a single
            view/resource will be sent, but there are plans to allow multiple
            views in the future. Marking as repeated for that purpose. Example:
            - "projects/123/locations/global/buckets/456/views/_Default" -
            "projects/123/locations/global/metricBuckets/456/views/_Default"
          type: array
          items:
            type: string
        orderBys:
          items:
            $ref: '#/components/schemas/SortOrderParameter'
          type: array
          description: >-
            The sort orders to use for the query. This equates to the ORDER BY
            clause in SQL.
        fieldSources:
          items:
            $ref: '#/components/schemas/FieldSource'
          description: >-
            Defines the items to include in the query result, analogous to a SQL
            SELECT clause.
          type: array
    SourceReference:
      id: SourceReference
      description: >-
        A reference to a particular snapshot of the source tree used to build
        and deploy an application.
      type: object
      properties:
        revisionId:
          type: string
          description: >-
            The canonical and persistent identifier of the deployed revision.
            Example (git): "0035781c50ec7aa23385dc841529ce8a4b70db1b"
        repository:
          description: >-
            Optional. A URI string identifying the repository. Example:
            "https://github.com/GoogleCloudPlatform/kubernetes.git"
          type: string
    Expr:
      properties:
        title:
          type: string
          description: >-
            Optional. Title for the expression, i.e. a short string describing
            its purpose. This can be used e.g. in UIs which allow to enter the
            expression.
        expression:
          description: >-
            Textual representation of an expression in Common Expression
            Language syntax.
          type: string
        description:
          type: string
          description: >-
            Optional. Description of the expression. This is a longer text which
            describes the expression, e.g. when hovered over it in a UI.
        location:
          description: >-
            Optional. String indicating the location of the expression for error
            reporting, e.g. a file name and a position in the file.
          type: string
      id: Expr
      description: >-
        Represents a textual expression in the Common Expression Language (CEL)
        syntax. CEL is a C-like expression language. The syntax and semantics of
        CEL are documented at https://github.com/google/cel-spec.Example
        (Comparison): title: "Summary size limit" description: "Determines if a
        summary is less than 100 chars" expression: "document.summary.size() <
        100" Example (Equality): title: "Requestor is owner" description:
        "Determines if requestor is the document owner" expression:
        "document.owner == request.auth.claims.email" Example (Logic): title:
        "Public documents" description: "Determine whether the document should
        be publicly visible" expression: "document.type != 'private' &&
        document.type != 'internal'" Example (Data Manipulation): title:
        "Notification string" description: "Create a notification string with a
        timestamp." expression: "'New message received at ' +
        string(document.create_time)" The exact variables and functions that may
        be referenced within an expression are determined by the service that
        evaluates it. See the service documentation for additional information.
      type: object
    FilterExpression:
      properties:
        literalValue:
          type: any
          description: >-
            The Value will be used to hold user defined constants set as the
            Right Hand Side of the filter.
        comparator:
          enum:
            - COMPARATOR_UNSPECIFIED
            - EQUALS
            - MATCHES_REGEXP
            - GREATER_THAN
            - LESS_THAN
            - GREATER_THAN_EQUALS
            - LESS_THAN_EQUALS
            - IS_NULL
            - IN
            - LIKE
          type: string
          description: The comparison type to use for the filter.
          enumDescriptions:
            - Invalid value, do not use.
            - The value is equal to the inputted value.
            - The value is equal to the inputted regex value.
            - The value is greater than the inputted value.
            - The value is less than the inputted value.
            - The value is greater than or equal to the inputted value.
            - The value is less than or equal to the inputted value.
            - >-
              Requires the filter_value to be a Value type with null_value set
              to true.
            - The value is in the inputted array value.
            - The value is like the inputted value.
        fieldSource:
          $ref: '#/components/schemas/FieldSource'
          description: >-
            Can be one of the FieldSource types: field name, alias ref, variable
            ref, or a literal value.
        isNegation:
          description: Determines if the NOT flag should be added to the comparator.
          type: boolean
        fieldSourceValue:
          description: >-
            The field. This will be the field that is set as the Right Hand Side
            of the filter.
          $ref: '#/components/schemas/FieldSource'
      id: FilterExpression
      description: >-
        This is a leaf of the FilterPredicate. Ex: { field:
        json_payload.message.error_code, filter_value: {numeric_value: 400},
        comparator: EQUAL_TO} The field will be schema field that is selected
        using the . annotation to display the drill down value. The value will
        be the user inputted text that the filter is comparing against.
      type: object
    ListLocationsResponse:
      type: object
      id: ListLocationsResponse
      description: The response message for Locations.ListLocations.
      properties:
        locations:
          type: array
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
        nextPageToken:
          type: string
          description: The standard List next-page token.
    WriteLogEntriesRequest:
      id: WriteLogEntriesRequest
      description: The parameters to WriteLogEntries.
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/MonitoredResource'
          description: >-
            Optional. A default monitored resource object that is assigned to
            all log entries in entries that do not specify a value for resource.
            Example: { "type": "gce_instance", "labels": { "zone":
            "us-central1-a", "instance_id": "00000000000000000000" }} See
            LogEntry.
        labels:
          description: >-
            Optional. Default labels that are added to the labels field of all
            log entries in entries. If a log entry already has a label with the
            same key as a label in this parameter, then the log entry's label is
            not changed. See LogEntry.
          type: object
          additionalProperties:
            type: string
        partialSuccess:
          type: boolean
          description: >-
            Optional. Whether a batch's valid entries should be written even if
            some other entry failed due to a permanent error such as
            INVALID_ARGUMENT or PERMISSION_DENIED. If any entry failed, then the
            response status is the response status of one of the failed entries.
            The response will include error details in
            WriteLogEntriesPartialErrors.log_entry_errors keyed by the entries'
            zero-based index in the entries. Failed requests for which no
            entries are written will not include per-entry errors.
        logName:
          type: string
          description: >-
            Optional. A default log resource name that is assigned to all log
            entries in entries that do not specify a value for log_name:
            projects/[PROJECT_ID]/logs/[LOG_ID]
            organizations/[ORGANIZATION_ID]/logs/[LOG_ID]
            billingAccounts/[BILLING_ACCOUNT_ID]/logs/[LOG_ID]
            folders/[FOLDER_ID]/logs/[LOG_ID][LOG_ID] must be URL-encoded. For
            example: "projects/my-project-id/logs/syslog"
            "organizations/123/logs/cloudaudit.googleapis.com%2Factivity" The
            permission logging.logEntries.create is needed on each project,
            organization, billing account, or folder that is receiving new log
            entries, whether the resource is specified in logName or in an
            individual log entry.
        entries:
          items:
            $ref: '#/components/schemas/LogEntry'
          type: array
          description: >-
            Required. The log entries to send to Logging. The order of log
            entries in this list does not matter. Values supplied in this
            method's log_name, resource, and labels fields are copied into those
            log entries in this list that do not include values for their
            corresponding fields. For more information, see the LogEntry type.If
            the timestamp or insert_id fields are missing in log entries, then
            this method supplies the current time or a unique identifier,
            respectively. The supplied values are chosen so that, among the log
            entries that did not supply their own values, the entries earlier in
            the list will sort before the entries later in the list. See the
            entries.list method.Log entries with timestamps that are more than
            the logs retention period
            (https://docs.cloud.google.com/logging/quotas) in the past or more
            than 24 hours in the future will not be available when calling
            entries.list. However, those log entries can still be exported with
            LogSinks
            (https://docs.cloud.google.com/logging/docs/routing/overview).To
            improve throughput and to avoid exceeding the quota limit
            (https://docs.cloud.google.com/logging/quotas) for calls to
            entries.write, you should try to include several log entries in this
            list, rather than calling this method for each individual log entry.
        dryRun:
          description: >-
            Optional. If true, the request should expect normal response, but
            the entries won't be persisted nor exported. Useful for checking
            whether the logging API endpoints are working properly before
            sending valuable data.
          type: boolean
    MetricDescriptor:
      type: object
      id: MetricDescriptor
      description: >-
        Defines a metric type and its schema. Once a metric descriptor is
        created, deleting or altering it stops data collection and makes the
        metric type's existing data unusable.
      properties:
        metricKind:
          description: >-
            Whether the metric records instantaneous values, changes to a value,
            etc. Some combinations of metric_kind and value_type might not be
            supported.
          enumDescriptions:
            - Do not use this default value.
            - An instantaneous measurement of a value.
            - The change in a value during a time interval.
            - >-
              A value accumulated over a time interval. Cumulative measurements
              in a time series should have the same start time and increasing
              end times, until an event resets the cumulative value to zero and
              sets a new start time for the following points.
          type: string
          enum:
            - METRIC_KIND_UNSPECIFIED
            - GAUGE
            - DELTA
            - CUMULATIVE
        displayName:
          type: string
          description: >-
            A concise name for the metric, which can be displayed in user
            interfaces. Use sentence case without an ending period, for example
            "Request count". This field is optional but it is recommended to be
            set for any metrics associated with user-visible concepts, such as
            Quota.
        description:
          description: >-
            A detailed description of the metric, which can be used in
            documentation.
          type: string
        metadata:
          $ref: '#/components/schemas/MetricDescriptorMetadata'
          description: Optional. Metadata which can be used to guide usage of the metric.
        type:
          type: string
          description: >-
            The metric type, including its DNS name prefix. The type is not
            URL-encoded. All user-defined metric types have the DNS name
            custom.googleapis.com or external.googleapis.com. Metric types
            should use a natural hierarchical grouping. For example:
            "custom.googleapis.com/invoice/paid/amount"
            "external.googleapis.com/prometheus/up"
            "appengine.googleapis.com/http/server/response_latencies" 
        monitoredResourceTypes:
          description: >-
            Read-only. If present, then a time series, which is identified
            partially by a metric type and a MonitoredResourceDescriptor, that
            is associated with this metric type can only be associated with one
            of the monitored resource types listed here.
          type: array
          items:
            type: string
        labels:
          items:
            $ref: '#/components/schemas/LabelDescriptor'
          type: array
          description: >-
            The set of labels that can be used to describe a specific instance
            of this metric type. For example, the
            appengine.googleapis.com/http/server/response_latencies metric type
            has a label for the HTTP response code, response_code, so you can
            look at latencies for successful responses or just for responses
            that failed.
        unit:
          description: >-
            The units in which the metric value is reported. It is only
            applicable if the value_type is INT64, DOUBLE, or DISTRIBUTION. The
            unit defines the representation of the stored metric
            values.Different systems might scale the values to be more easily
            displayed (so a value of 0.02kBy might be displayed as 20By, and a
            value of 3523kBy might be displayed as 3.5MBy). However, if the unit
            is kBy, then the value of the metric is always in thousands of
            bytes, no matter how it might be displayed.If you want a custom
            metric to record the exact number of CPU-seconds used by a job, you
            can create an INT64 CUMULATIVE metric whose unit is s{CPU} (or
            equivalently 1s{CPU} or just s). If the job uses 12,005 CPU-seconds,
            then the value is written as 12005.Alternatively, if you want a
            custom metric to record data in a more granular way, you can create
            a DOUBLE CUMULATIVE metric whose unit is ks{CPU}, and then write the
            value 12.005 (which is 12005/1000), or use Kis{CPU} and write 11.723
            (which is 12005/1024).The supported units are a subset of The
            Unified Code for Units of Measure
            (https://unitsofmeasure.org/ucum.html) standard:Basic units (UNIT)
            bit bit By byte s second min minute h hour d day 1
            dimensionlessPrefixes (PREFIX) k kilo (10^3) M mega (10^6) G giga
            (10^9) T tera (10^12) P peta (10^15) E exa (10^18) Z zetta (10^21) Y
            yotta (10^24) m milli (10^-3) u micro (10^-6) n nano (10^-9) p pico
            (10^-12) f femto (10^-15) a atto (10^-18) z zepto (10^-21) y yocto
            (10^-24) Ki kibi (2^10) Mi mebi (2^20) Gi gibi (2^30) Ti tebi (2^40)
            Pi pebi (2^50)GrammarThe grammar also includes these connectors: /
            division or ratio (as an infix operator). For examples, kBy/{email}
            or MiBy/10ms (although you should almost never have /s in a metric
            unit; rates should always be computed at query time from the
            underlying cumulative or delta value). . multiplication or
            composition (as an infix operator). For examples, GBy.d or
            k{watt}.h.The grammar for a unit is as follows: Expression =
            Component { "." Component } { "/" Component } ; Component = ( [
            PREFIX ] UNIT | "%" ) [ Annotation ] | Annotation | "1" ; Annotation
            = "{" NAME "}" ; Notes: Annotation is just a comment if it follows a
            UNIT. If the annotation is used alone, then the unit is equivalent
            to 1. For examples, {request}/s == 1/s, By{transmitted}/s == By/s.
            NAME is a sequence of non-blank printable ASCII characters not
            containing { or }. 1 represents a unitary dimensionless unit
            (https://en.wikipedia.org/wiki/Dimensionless_quantity) of 1, such as
            in 1/s. It is typically used when none of the basic units are
            appropriate. For example, "new users per day" can be represented as
            1/d or {new-users}/d (and a metric value 5 would mean "5 new users).
            Alternatively, "thousands of page views per day" would be
            represented as 1000/d or k1/d or k{page_views}/d (and a metric value
            of 5.3 would mean "5300 page views per day"). % represents
            dimensionless value of 1/100, and annotates values giving a
            percentage (so the metric values are typically in the range of
            0..100, and a metric value 3 means "3 percent"). 10^2.% indicates a
            metric contains a ratio, typically in the range 0..1, that will be
            multiplied by 100 and displayed as a percentage (so a metric value
            0.03 means "3 percent").
          type: string
        name:
          description: The resource name of the metric descriptor.
          type: string
        valueType:
          enum:
            - VALUE_TYPE_UNSPECIFIED
            - BOOL
            - INT64
            - DOUBLE
            - STRING
            - DISTRIBUTION
            - MONEY
          type: string
          description: >-
            Whether the measurement is an integer, a floating-point number, etc.
            Some combinations of metric_kind and value_type might not be
            supported.
          enumDescriptions:
            - Do not use this default value.
            - >-
              The value is a boolean. This value type can be used only if the
              metric kind is GAUGE.
            - The value is a signed 64-bit integer.
            - The value is a double precision floating point number.
            - >-
              The value is a text string. This value type can be used only if
              the metric kind is GAUGE.
            - The value is a Distribution.
            - The value is money.
        launchStage:
          description: Optional. The launch stage of the metric definition.
          enumDescriptions:
            - Do not use this default value.
            - The feature is not yet implemented. Users can not use it.
            - >-
              Prelaunch features are hidden from users and are only visible
              internally.
            - >-
              Early Access features are limited to a closed group of testers. To
              use these features, you must sign up in advance and sign a Trusted
              Tester agreement (which includes confidentiality provisions).
              These features may be unstable, changed in backward-incompatible
              ways, and are not guaranteed to be released.
            - >-
              Alpha is a limited availability test for releases before they are
              cleared for widespread use. By Alpha, all significant design
              issues are resolved and we are in the process of verifying
              functionality. Alpha customers need to apply for access, agree to
              applicable terms, and have their projects allowlisted. Alpha
              releases don't have to be feature complete, no SLAs are provided,
              and there are no technical support obligations, but they will be
              far enough along that customers can actually use them in test
              environments or for limited-use tests -- just like they would in
              normal production cases.
            - >-
              Beta is the point at which we are ready to open a release for any
              customer to use. There are no SLA or technical support obligations
              in a Beta release. Products will be complete from a feature
              perspective, but may have some open outstanding issues. Beta
              releases are suitable for limited production use cases.
            - >-
              GA features are open to all developers and are considered stable
              and fully qualified for production use.
            - >-
              Deprecated features are scheduled to be shut down and removed. For
              more information, see the "Deprecation Policy" section of our
              Terms of Service (https://cloud.google.com/terms/) and the Google
              Cloud Platform Subject to the Deprecation Policy
              (https://cloud.google.com/terms/deprecation) documentation.
          type: string
          enum:
            - LAUNCH_STAGE_UNSPECIFIED
            - UNIMPLEMENTED
            - PRELAUNCH
            - EARLY_ACCESS
            - ALPHA
            - BETA
            - GA
            - DEPRECATED
    ListViewsResponse:
