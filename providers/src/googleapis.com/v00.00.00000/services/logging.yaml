            COShysOX0r_51QE.This field can be used to search for log entries
            belonging to a specific error group in Logs Explorer (e.g.,
            error_groups.id = "ID") or Observability Analytics.The id is derived
            from key parts of the error-log content and is treated as Service
            Data. For information about how Service Data is handled, see Google
            Cloud Privacy Notice
            (https://cloud.google.com/terms/cloud-privacy-notice).
      id: LogErrorGroup
      description: >-
        Contains metadata that associates the LogEntry to Error Reporting error
        groups.
      type: object
    LogLine:
      id: LogLine
      description: Application log line emitted while processing a request.
      type: object
      properties:
        time:
          description: Approximate time when this log entry was made.
          format: google-datetime
          type: string
        sourceLocation:
          description: Where in the source code this log message was written.
          $ref: '#/components/schemas/SourceLocation'
        severity:
          description: Severity of this log entry.
          enumDescriptions:
            - (0) The log entry has no assigned severity level.
            - (100) Debug or trace information.
            - (200) Routine information, such as ongoing status or performance.
            - >-
              (300) Normal but significant events, such as start up, shut down,
              or a configuration change.
            - (400) Warning events might cause problems.
            - (500) Error events are likely to cause problems.
            - (600) Critical events cause more severe problems or outages.
            - (700) A person must take an action immediately.
            - (800) One or more systems are unusable.
          type: string
          enum:
            - DEFAULT
            - DEBUG
            - INFO
            - NOTICE
            - WARNING
            - ERROR
            - CRITICAL
            - ALERT
            - EMERGENCY
        logMessage:
          type: string
          description: App-provided log message.
