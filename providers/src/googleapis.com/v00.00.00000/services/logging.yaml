          description: The standard List next-page token.
          type: string
      type: object
    ListLogEntriesRequest:
      description: The parameters to ListLogEntries.
      id: ListLogEntriesRequest
      properties:
        filter:
          description: >-
            Optional. A filter that chooses which log entries to return. For
            more information, see Logging query language
            (https://docs.cloud.google.com/logging/docs/view/logging-query-language).Only
            log entries that match the filter are returned. An empty filter
            matches all log entries in the resources listed in resource_names.
            Referencing a parent resource that is not listed in resource_names
            will cause the filter to return no results. The maximum length of a
            filter is 20,000 characters.To make queries faster, you can make the
            filter more selective by using restrictions on indexed fields
            (https://docs.cloud.google.com/logging/docs/view/logging-query-language#indexed-fields)
            as well as limit the time range of the query by adding range
            restrictions on the timestamp field.
          type: string
        orderBy:
          description: >-
            Optional. How the results should be sorted. Presently, the only
            permitted values are "timestamp asc" (default) and "timestamp desc".
            The first option returns entries in order of increasing values of
            LogEntry.timestamp (oldest first), and the second option returns
            entries in order of decreasing timestamps (newest first). Entries
            with equal timestamps are returned in order of their insert_id
            values.We recommend setting the order_by field to "timestamp desc"
            when listing recently ingested log entries. If not set, the default
            value of "timestamp asc" may take a long time to fetch matching logs
            that are only recently ingested.
          type: string
        pageSize:
          description: >-
            Optional. The maximum number of results to return from this request.
            Default is 50. If the value is negative, the request is rejected.The
            presence of next_page_token in the response indicates that more
            results might be available.
          format: int32
          type: integer
        pageToken:
          description: >-
            Optional. If present, then retrieve the next batch of results from
            the preceding call to this method. page_token must be the value of
            next_page_token from the previous response. The values of other
            method parameters should be identical to those in the previous call.
          type: string
        projectIds:
          deprecated: true
          description: >-
            Optional. Deprecated. Use resource_names instead. One or more
            project identifiers or project numbers from which to retrieve log
            entries. Example: "my-project-1A".
          items:
            type: string
          type: array
        resourceNames:
          description: >-
            Required. Names of one or more parent resources from which to
            retrieve log entries. Resources may either be resource containers or
            specific LogViews. For the case of resource containers, all logs
            ingested into that container will be returned regardless of which
            LogBuckets they are actually stored in - i.e. these queries may fan
            out to multiple regions. In the event of region unavailability,
            specify a specific set of LogViews that do not include the
            unavailable region. projects/[PROJECT_ID]
            organizations/[ORGANIZATION_ID] billingAccounts/[BILLING_ACCOUNT_ID]
            folders/[FOLDER_ID]
            projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]
            organizations/[ORGANIZATION_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]
            billingAccounts/[BILLING_ACCOUNT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]
            folders/[FOLDER_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]Projects
            listed in the project_ids field are added to this list. A maximum of
            100 resources may be specified in a single request.
          items:
            type: string
          type: array
      type: object
    ListLogEntriesResponse:
      description: Result returned from ListLogEntries.
      id: ListLogEntriesResponse
      properties:
        entries:
          description: >-
            A list of log entries. If entries is empty, nextPageToken may still
            be returned, indicating that more entries may exist. See
            nextPageToken for more information.
          items:
            $ref: '#/components/schemas/LogEntry'
          type: array
        nextPageToken:
          description: >-
            If there might be more results than those appearing in this
            response, then nextPageToken is included. To get the next set of
            results, call this method again using the value of nextPageToken as
            pageToken.If a value for next_page_token appears and the entries
            field is empty, it means that the search found no log entries so far
            but it did not have time to search all the possible log entries.
            Retry the method with this value for page_token to continue the
            search. Alternatively, consider speeding up the search by changing
            your filter to specify a single log name or resource type, or to
            narrow the time range of the search.
          type: string
      type: object
