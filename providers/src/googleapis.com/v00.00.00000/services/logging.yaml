            If there might be more results than appear in this response, then
            nextPageToken is included. To get the next set of results, call the
            same method again using the value of nextPageToken as pageToken.
          type: string
        recentQueries:
          description: A list of recent queries.
          items:
            $ref: '#/components/schemas/RecentQuery'
          type: array
        unreachable:
          description: >-
            The unreachable resources. Each resource can be either 1) a saved
            query if a specific query is unreachable or 2) a location if a
            specific location is unreachable.
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/recentQueries/[QUERY_ID]"
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]" For
            example:"projects/my-project/locations/global/recentQueries/12345678"
            "projects/my-project/locations/global"If there are unreachable
            resources, the response will first return pages that contain recent
            queries, and then return pages that contain the unreachable
            resources.
          items:
            type: string
          type: array
      type: object
    ListSavedQueriesResponse:
      description: The response from ListSavedQueries.
      id: ListSavedQueriesResponse
      properties:
        nextPageToken:
          description: >-
            If there might be more results than appear in this response, then
            nextPageToken is included. To get the next set of results, call the
            same method again using the value of nextPageToken as pageToken.
          type: string
        savedQueries:
          description: A list of saved queries.
          items:
            $ref: '#/components/schemas/SavedQuery'
          type: array
        unreachable:
          description: >-
            The unreachable resources. It can be either 1) a saved query if a
            specific query is unreachable or 2) a location if a specific
            location is unreachabe.
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/savedQueries/[QUERY_ID]"
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]" For example:
            "projects/my-project/locations/global/savedQueries/12345678"
            "projects/my-project/locations/global" If there are unreachable
            resources, the response will first return pages that contain saved
            queries, and then return pages that contain the unreachable
            resources.
          items:
            type: string
          type: array
      type: object
    ListSinksResponse:
      description: Result returned from ListSinks.
      id: ListSinksResponse
      properties:
        nextPageToken:
          description: >-
            If there might be more results than appear in this response, then
            nextPageToken is included. To get the next set of results, call the
            same method again using the value of nextPageToken as pageToken.
          type: string
        sinks:
          description: A list of sinks.
          items:
            $ref: '#/components/schemas/LogSink'
          type: array
      type: object
    ListViewsResponse:
      description: The response from ListViews.
      id: ListViewsResponse
      properties:
        nextPageToken:
          description: >-
            If there might be more results than appear in this response, then
            nextPageToken is included. To get the next set of results, call the
            same method again using the value of nextPageToken as pageToken.
          type: string
        views:
          description: A list of views.
          items:
            $ref: '#/components/schemas/LogView'
          type: array
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"} 
          type: object
        locationId:
          description: 'The canonical id for this location. For example: "us-east1".'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            "projects/example-project/locations/us-east1"
          type: string
      type: object
    LocationMetadata:
      description: Cloud Logging specific location metadata.
      id: LocationMetadata
      properties:
        logAnalyticsEnabled:
          description: >-
            Indicates whether or not Log Analytics features are supported in the
            given location.
          type: boolean
      type: object
    LogBucket:
      description: Describes a repository in which log entries are stored.
      id: LogBucket
      properties:
        analyticsEnabled:
          description: >-
            Optional. Whether log analytics is enabled for this bucket.Once
            enabled, log analytics features cannot be disabled.
          type: boolean
        cmekSettings:
          $ref: '#/components/schemas/CmekSettings'
          description: >-
            Optional. The CMEK settings of the log bucket. If present, new log
            entries written to this log bucket are encrypted using the CMEK key
            provided in this configuration. If a log bucket has CMEK settings,
            the CMEK settings cannot be disabled later by updating the log
            bucket. Changing the KMS key is allowed.
        createTime:
          description: >-
            Output only. The creation timestamp of the bucket. This is not set
            for any of the default buckets.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Describes this bucket.
          type: string
        indexConfigs:
          description: Optional. A list of indexed fields and related configuration data.
          items:
            $ref: '#/components/schemas/IndexConfig'
          type: array
        lifecycleState:
          description: Output only. The bucket lifecycle state.
          enum:
            - LIFECYCLE_STATE_UNSPECIFIED
            - ACTIVE
            - DELETE_REQUESTED
            - UPDATING
            - CREATING
            - FAILED
          enumDescriptions:
            - >-
              Unspecified state. This is only used/useful for distinguishing
              unset values.
            - The normal and active state.
            - >-
              The resource has been marked for deletion by the user. For some
              resources (e.g. buckets), this can be reversed by an un-delete
              operation.
            - >-
              The resource has been marked for an update by the user. It will
              remain in this state until the update is complete.
            - >-
              The resource has been marked for creation by the user. It will
              remain in this state until the creation is complete.
            - The resource is in an INTERNAL error state.
          readOnly: true
          type: string
        locked:
          description: >-
            Optional. Whether the bucket is locked.The retention period on a
            locked bucket cannot be changed. Locked buckets may only be deleted
            if they are empty.
          type: boolean
        name:
          description: >-
            Output only. The resource name of the bucket.For
            example:projects/my-project/locations/global/buckets/my-bucketFor a
            list of supported locations, see Supported Regions
            (https://docs.cloud.google.com/logging/docs/region-support)For the
            location of global it is unspecified where log entries are actually
            stored.After a bucket has been created, the location cannot be
            changed.
          readOnly: true
          type: string
        restrictedFields:
          description: >-
            Optional. Log entry field paths that are denied access in this
            bucket.The following fields and their children are eligible:
            textPayload, jsonPayload, protoPayload, httpRequest, labels,
            sourceLocation.Restricting a repeated field will restrict all
            values. Adding a parent will block all child fields. (e.g. foo.bar
            will block foo.bar.baz)
          items:
            type: string
          type: array
        retentionDays:
          description: >-
            Optional. Logs will be retained by default for this amount of time,
            after which they will automatically be deleted. The minimum
            retention period is 1 day. If this value is set to zero at bucket
            creation time, the default time of 30 days will be used.
          format: int32
          type: integer
        updateTime:
          description: Output only. The last update timestamp of the bucket.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    LogEntry:
      description: An individual entry in a log.
      id: LogEntry
      properties:
        apphub:
          $ref: '#/components/schemas/AppHub'
          description: >-
            Output only. AppHub application metadata associated with this
            LogEntry. May be empty if there is no associated AppHub application
            or multiple associated applications (such as for VPC flow logs)
          readOnly: true
        apphubDestination:
          $ref: '#/components/schemas/AppHub'
          description: >-
            Output only. AppHub application metadata associated with the
            destination application. This is only populated if the log
            represented "edge"-like data (such as for VPC flow logs) with a
            destination.
          readOnly: true
        apphubSource:
          $ref: '#/components/schemas/AppHub'
          description: >-
            Output only. AppHub application metadata associated with the source
            application. This is only populated if the log represented
            "edge"-like data (such as for VPC flow logs) with a source.
          readOnly: true
        errorGroups:
          description: >-
            Output only. The Error Reporting
            (https://cloud.google.com/error-reporting) error groups associated
            with this LogEntry. Error Reporting sets the values for this field
            during error group creation.This field is populated only when log
            entries are stored in Cloud Logging storage (Logs Explorer and
            Observability Analytics). It is not available for use in log sink
            filters, log-based metrics, or log-based alerts, and it is excluded
            from log exports (Cloud Storage, BigQuery, and Pub/Sub).For more
            information, see View error details(
            https://cloud.google.com/error-reporting/docs/viewing-errors#view_error_details)
          items:
            $ref: '#/components/schemas/LogErrorGroup'
          readOnly: true
          type: array
        httpRequest:
          $ref: '#/components/schemas/HttpRequest'
          description: >-
            Optional. Information about the HTTP request associated with this
            log entry, if applicable.
        insertId:
          description: >-
            Optional. A unique identifier for the log entry. If you provide a
            value, then Logging considers other log entries in the same project,
            with the same timestamp, and with the same insert_id to be
            duplicates which are removed in a single query result. However,
            there are no guarantees of de-duplication in the export of logs.If
            the insert_id is omitted when writing a log entry, the Logging API
            assigns its own unique identifier in this field.In queries, the
            insert_id is also used to order log entries that have the same
            log_name and timestamp values.
          type: string
        jsonPayload:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            The log entry payload, represented as a structure that is expressed
            as a JSON object.
          type: object
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. A map of key, value pairs that provides additional
            information about the log entry. The labels can be user-defined or
            system-defined.User-defined labels are arbitrary key, value pairs
            that you can use to classify logs.System-defined labels are defined
            by cloud services for platform logs. They have two components - a
            service namespace component and the attribute name. For example:
            compute.googleapis.com/resource_name.Cloud Logging truncates label
            keys that exceed 512 B and label values that exceed 64 KB upon their
            associated log entry being written. The truncation is indicated by
            an ellipsis at the end of the character string.
          type: object
        logName:
          description: >-
            Required. The resource name of the log to which this log entry
            belongs: "projects/[PROJECT_ID]/logs/[LOG_ID]"
            "organizations/[ORGANIZATION_ID]/logs/[LOG_ID]"
            "billingAccounts/[BILLING_ACCOUNT_ID]/logs/[LOG_ID]"
            "folders/[FOLDER_ID]/logs/[LOG_ID]" A project number may be used in
            place of PROJECT_ID. The project number is translated to its
            corresponding PROJECT_ID internally and the log_name field will
            contain PROJECT_ID in queries and exports.[LOG_ID] must be
            URL-encoded within log_name. Example:
            "organizations/1234567890/logs/cloudresourcemanager.googleapis.com%2Factivity".[LOG_ID]
            must be less than 512 characters long and can only include the
            following characters: upper and lower case alphanumeric characters,
            forward-slash, underscore, hyphen, and period.For backward
            compatibility, if log_name begins with a forward-slash, such as
            /projects/..., then the log entry is processed as usual, but the
            forward-slash is removed. Listing the log entry will not show the
            leading slash and filtering for a log name with a leading slash will
            never return any results.
          type: string
        metadata:
          $ref: '#/components/schemas/MonitoredResourceMetadata'
          deprecated: true
          description: >-
            Output only. Deprecated. This field is not used by Logging. Any
            value written to it is cleared.
          readOnly: true
        operation:
          $ref: '#/components/schemas/LogEntryOperation'
          description: >-
            Optional. Information about an operation associated with the log
            entry, if applicable.
        otel:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Optional. The structured OpenTelemetry protocol payload. Contains
            the OpenTelemetry Resource, Instrumentation Scope, and Entities
            attributes for this log as they are defined in the OTLP
            specification, and any other fields that do not have a direct analog
            in the LogEntry. See
            https://opentelemetry.io/docs/specs/otel/logs/data-model/
          type: object
        protoPayload:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The log entry payload, represented as a protocol buffer. Some Google
            Cloud Platform services use this field for their log entry
            payloads.The following protocol buffer types are supported;
            user-defined types are not
            supported:"type.googleapis.com/google.cloud.audit.AuditLog"
            "type.googleapis.com/google.appengine.logging.v1.RequestLog"
          type: object
        receiveTimestamp:
          description: Output only. The time the log entry was received by Logging.
          format: google-datetime
          readOnly: true
          type: string
        resource:
          $ref: '#/components/schemas/MonitoredResource'
          description: >-
            Required. The monitored resource that produced this log
            entry.Example: a log entry that reports a database error would be
            associated with the monitored resource designating the particular
            database that reported the error.
        severity:
          description: >-
            Optional. The severity of the log entry. The default value is
            LogSeverity.DEFAULT.
          enum:
            - DEFAULT
            - DEBUG
            - INFO
            - NOTICE
            - WARNING
            - ERROR
            - CRITICAL
            - ALERT
            - EMERGENCY
          enumDescriptions:
            - (0) The log entry has no assigned severity level.
            - (100) Debug or trace information.
            - (200) Routine information, such as ongoing status or performance.
            - >-
              (300) Normal but significant events, such as start up, shut down,
              or a configuration change.
            - (400) Warning events might cause problems.
            - (500) Error events are likely to cause problems.
            - (600) Critical events cause more severe problems or outages.
            - (700) A person must take an action immediately.
            - (800) One or more systems are unusable.
          type: string
        sourceLocation:
          $ref: '#/components/schemas/LogEntrySourceLocation'
          description: >-
            Optional. Source code location information associated with the log
            entry, if any.
        spanId:
          description: >-
            Optional. The ID of the Cloud Trace
            (https://docs.cloud.google.com/trace/docs) span associated with the
            current operation in which the log is being written.A Span
            (https://docs.cloud.google.com/trace/docs/reference/v2/rest/v2/projects.traces/batchWrite#Span)
            represents a single operation within a trace. Whereas a trace may
            involve multiple different microservices running on multiple
            different machines, a span generally corresponds to a single logical
            operation being performed in a single instance of a microservice on
            one specific machine. Spans are the nodes within the tree that is a
            trace.Applications that are instrumented for tracing
            (https://docs.cloud.google.com/trace/docs/setup) will generally
            assign a new, unique span ID on each incoming request. It is also
            common to create and record additional spans corresponding to
            internal processing elements as well as issuing requests to
            dependencies.The span ID is expected to be a 16-character,
            hexadecimal encoding of an 8-byte array and should not be zero. It
            should be unique within the trace and should, ideally, be generated
            in a manner that is uniformly random.Example values:
            000000000000004a 7a2190356c3fc94b 0000f00300090021 d39223e101960076
          type: string
        split:
          $ref: '#/components/schemas/LogSplit'
          description: >-
            Optional. Information indicating this LogEntry is part of a sequence
            of multiple log entries split from a single LogEntry.
        textPayload:
          description: The log entry payload, represented as a Unicode string (UTF-8).
          type: string
        timestamp:
          description: >-
            Optional. The time the event described by the log entry occurred.
            This time is used to compute the log entry's age and to enforce the
            logs retention period. If this field is omitted in a new log entry,
            then Logging assigns it the current time. Timestamps have nanosecond
            accuracy, but trailing zeros in the fractional seconds might be
            omitted when the timestamp is displayed.
          format: google-datetime
          type: string
        trace:
          description: >-
            Optional. The trace ID being written to Cloud Trace
            (https://docs.cloud.google.com/trace/docs) in association with this
            log entry. For example, if your trace data is stored in the Cloud
            project "my-trace-project" and if the service that is creating the
            log entry receives a trace header that includes the trace ID
            "12345", then the service should use "12345".The REST resource name
            of the trace is also supported, but using this format is not
            recommended. An example trace REST resource name is similar to
            "projects/my-trace-project/traces/12345".The trace field provides
            the link between logs and traces. By using this field, you can
            navigate from a log entry to a trace.
          type: string
        traceSampled:
          description: >-
            Optional. The sampling decision of the span associated with the log
            entry at the time the log entry was created. This field corresponds
            to the sampled flag in the W3C trace-context specification
            (https://www.w3.org/TR/trace-context/#sampled-flag). A non-sampled
            trace value is still useful as a request correlation identifier. The
            default is False.
          type: boolean
      type: object
    LogEntryOperation:
      description: >-
        Additional information about a potentially long-running operation with
        which a log entry is associated.
      id: LogEntryOperation
      properties:
        first:
          description: >-
            Optional. Set this to True if this is the first log entry in the
            operation.
          type: boolean
        id:
          description: >-
            Optional. An arbitrary operation identifier. Log entries with the
            same identifier are assumed to be part of the same operation.
          type: string
        last:
          description: >-
            Optional. Set this to True if this is the last log entry in the
            operation.
          type: boolean
        producer:
          description: >-
            Optional. An arbitrary producer identifier. The combination of id
            and producer must be globally unique. Examples for producer:
            "MyDivision.MyBigCompany.com", "github.com/MyProject/MyApplication".
          type: string
      type: object
    LogEntrySourceLocation:
      description: >-
        Additional information about the source code location that produced the
        log entry.
      id: LogEntrySourceLocation
      properties:
        file:
          description: >-
            Optional. Source file name. Depending on the runtime environment,
            this might be a simple name or a fully-qualified name.
          type: string
        function:
          description: >-
            Optional. Human-readable name of the function or method being
            invoked, with optional context such as the class or package name.
            This information may be used in contexts such as the logs viewer,
            where a file and line number are less meaningful. The format can
            vary by language. For example: qual.if.ied.Class.method (Java),
            dir/package.func (Go), function (Python).
          type: string
        line:
          description: >-
            Optional. Line within the source file. 1-based; 0 indicates no line
            number available.
          format: int64
          type: string
      type: object
    LogErrorGroup:
      description: >-
        Contains metadata that associates the LogEntry to Error Reporting error
        groups.
      id: LogErrorGroup
      properties:
        id:
          description: >-
            The id is a unique identifier for a particular error group; it is
            the last part of the error group resource name:
            /project/[PROJECT_ID]/errors/[ERROR_GROUP_ID]. Example:
            COShysOX0r_51QE.This field can be used to search for log entries
            belonging to a specific error group in Logs Explorer (e.g.,
            error_groups.id = "ID") or Observability Analytics.The id is derived
            from key parts of the error-log content and is treated as Service
            Data. For information about how Service Data is handled, see Google
            Cloud Privacy Notice
            (https://cloud.google.com/terms/cloud-privacy-notice).
          type: string
      type: object
    LogExclusion:
      description: >-
        Specifies a set of log entries that are filtered out by a sink. If your
        Google Cloud resource receives a large volume of log entries, you can
        use exclusions to reduce your chargeable logs. Note that exclusions on
        organization-level and folder-level sinks don't apply to child
        resources. Note also that you cannot modify the _Required sink or
        exclude logs from it.
      id: LogExclusion
      properties:
        createTime:
          description: >-
            Output only. The creation timestamp of the exclusion.This field may
            not be present for older exclusions.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. A description of this exclusion.
          type: string
        disabled:
          description: >-
            Optional. If set to True, then this exclusion is disabled and it
            does not exclude any log entries. You can update an exclusion to
            change the value of this field.
          type: boolean
        filter:
          description: >-
            Required. An advanced logs filter
            (https://docs.cloud.google.com/logging/docs/view/building-queries#queries-by-expression)
            that matches the log entries to be excluded. By using the sample
            function
            (https://docs.cloud.google.com/logging/docs/view/logging-query-language#sample),
            you can exclude less than 100% of the matching log entries.For
            example, the following query matches 99% of low-severity log entries
            from Google Cloud Storage buckets:resource.type=gcs_bucket
            severity<ERROR sample(insertId, 0.99)
          type: string
        name:
          description: >-
            Optional. A client-assigned identifier, such as
            "load-balancer-exclusion". Identifiers are limited to 100 characters
            and can include only letters, digits, underscores, hyphens, and
            periods. First character has to be alphanumeric.
          type: string
        updateTime:
          description: >-
            Output only. The last update timestamp of the exclusion.This field
            may not be present for older exclusions.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    LogLine:
      description: Application log line emitted while processing a request.
      id: LogLine
      properties:
        logMessage:
          description: App-provided log message.
          type: string
        severity:
          description: Severity of this log entry.
          enum:
            - DEFAULT
            - DEBUG
            - INFO
            - NOTICE
            - WARNING
            - ERROR
            - CRITICAL
            - ALERT
            - EMERGENCY
          enumDescriptions:
            - (0) The log entry has no assigned severity level.
            - (100) Debug or trace information.
            - (200) Routine information, such as ongoing status or performance.
            - >-
              (300) Normal but significant events, such as start up, shut down,
              or a configuration change.
            - (400) Warning events might cause problems.
            - (500) Error events are likely to cause problems.
            - (600) Critical events cause more severe problems or outages.
            - (700) A person must take an action immediately.
            - (800) One or more systems are unusable.
          type: string
        sourceLocation:
          $ref: '#/components/schemas/SourceLocation'
          description: Where in the source code this log message was written.
        time:
          description: Approximate time when this log entry was made.
          format: google-datetime
          type: string
      type: object
    LogMetric:
      description: >-
        Describes a logs-based metric. The value of the metric is the number of
        log entries that match a logs filter in a given time interval.Logs-based
        metrics can also be used to extract values from logs and create a
        distribution of the values. The distribution records the statistics of
        the extracted values along with an optional histogram of the values as
        specified by the bucket options.
      id: LogMetric
      properties:
        bucketName:
          description: >-
            Optional. The resource name of the Log Bucket that owns the Log
            Metric. Only Log Buckets in projects are supported. The bucket has
            to be in the same project as the metric.For
            example:projects/my-project/locations/global/buckets/my-bucketIf
            empty, then the Log Metric is considered a non-Bucket Log Metric.
          type: string
        bucketOptions:
          $ref: '#/components/schemas/BucketOptions'
          description: >-
            Optional. The bucket_options are required when the logs-based metric
            is using a DISTRIBUTION value type and it describes the bucket
            boundaries used to create a histogram of the extracted values.
        createTime:
          description: >-
            Output only. The creation timestamp of the metric.This field may not
            be present for older metrics.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. A description of this metric, which is used in
            documentation. The maximum length of the description is 8000
            characters.
          type: string
        disabled:
          description: >-
            Optional. If set to True, then this metric is disabled and it does
            not generate any points.
          type: boolean
        filter:
          description: >-
            Required. An advanced logs filter
            (https://cloud.google.com/logging/docs/view/advanced_filters) which
            is used to match log entries. Example: "resource.type=gae_app AND
            severity>=ERROR" The maximum length of the filter is 20000
            characters.
          type: string
        labelExtractors:
          additionalProperties:
            type: string
          description: >-
            Optional. A map from a label key string to an extractor expression
            which is used to extract data from a log entry field and assign as
            the label value. Each label key specified in the LabelDescriptor
            must have an associated extractor expression in this map. The syntax
            of the extractor expression is the same as for the value_extractor
            field.The extracted value is converted to the type defined in the
            label descriptor. If either the extraction or the type conversion
            fails, the label will have a default value. The default value for a
            string label is an empty string, for an integer label its 0, and for
            a boolean label its false.Note that there are upper bounds on the
            maximum number of labels and the number of active time series that
            are allowed in a project.
          type: object
        metricDescriptor:
          $ref: '#/components/schemas/MetricDescriptor'
          description: >-
            Optional. The metric descriptor associated with the logs-based
            metric. If unspecified, it uses a default metric descriptor with a
            DELTA metric kind, INT64 value type, with no labels and a unit of
            "1". Such a metric counts the number of log entries matching the
            filter expression.The name, type, and description fields in the
            metric_descriptor are output only, and is constructed using the name
            and description field in the LogMetric.To create a logs-based metric
            that records a distribution of log values, a DELTA metric kind with
            a DISTRIBUTION value type must be used along with a value_extractor
            expression in the LogMetric.Each label in the metric descriptor must
            have a matching label name as the key and an extractor expression as
            the value in the label_extractors map.The metric_kind and value_type
            fields in the metric_descriptor cannot be updated once initially
            configured. New labels can be added in the metric_descriptor, but
            existing labels cannot be modified except for their description.
        name:
          description: >-
            Required. The client-assigned metric identifier. Examples:
            "error_count", "nginx/requests".Metric identifiers are limited to
            100 characters and can include only the following characters: A-Z,
            a-z, 0-9, and the special characters _-.,+!*',()%/. The
            forward-slash character (/) denotes a hierarchy of name pieces, and
            it cannot be the first character of the name.This field is the
            [METRIC_ID] part of a metric resource name in the format
            "projects/PROJECT_ID/metrics/METRIC_ID". Example: If the resource
            name of a metric is "projects/my-project/metrics/nginx%2Frequests",
            this field's value is "nginx/requests".
          type: string
        resourceName:
          description: >-
            Output only. The resource name of the metric:
            "projects/[PROJECT_ID]/metrics/[METRIC_ID]" 
          readOnly: true
          type: string
        updateTime:
          description: >-
            Output only. The last update timestamp of the metric.This field may
            not be present for older metrics.
          format: google-datetime
          readOnly: true
          type: string
        valueExtractor:
          description: >-
            Optional. A value_extractor is required when using a distribution
            logs-based metric to extract the values to record from a log entry.
            Two functions are supported for value extraction: EXTRACT(field) or
            REGEXP_EXTRACT(field, regex). The arguments are: field: The name of
            the log entry field from which the value is to be extracted. regex:
            A regular expression using the Google RE2 syntax
            (https://github.com/google/re2/wiki/Syntax) with a single capture
            group to extract data from the specified log entry field. The value
            of the field is converted to a string before applying the regex. It
            is an error to specify a regex that does not include exactly one
            capture group.The result of the extraction must be convertible to a
            double type, as the distribution always records double values. If
            either the extraction or the conversion to double fails, then those
            values are not recorded in the distribution.Example:
            REGEXP_EXTRACT(jsonPayload.request, ".*quantity=(\d+).*")
          type: string
        version:
          deprecated: true
          description: >-
            Deprecated. The API version that created or updated this metric. The
            v2 format is used by default and cannot be changed.
          enum:
            - V2
            - V1
          enumDescriptions:
            - Logging API v2.
            - Logging API v1.
          type: string
      type: object
    LogScope:
      description: Describes a group of resources to read log entries from.
      id: LogScope
      properties:
        createTime:
          description: Output only. The creation timestamp of the log scope.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. Describes this log scope.The maximum length of the
            description is 8000 characters.
          type: string
        name:
          description: >-
            Output only. The resource name of the log scope.Log scopes are only
            available in the global location. For
            example:projects/my-project/locations/global/logScopes/my-log-scope
          readOnly: true
          type: string
        resourceNames:
          description: >-
            Required. Names of one or more parent resources (organizations and
            folders are not supported.): projects/[PROJECT_ID]May alternatively
            be one or more views:
            projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]A
            log scope can include a maximum of 5 projects and a maximum of 100
            resources in total.
          items:
            type: string
          type: array
        updateTime:
          description: Output only. The last update timestamp of the log scope.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    LogSink:
      description: >-
        Describes a sink used to export log entries to one of the following
        destinations: a Cloud Logging log bucket, a Cloud Storage bucket, a
        BigQuery dataset, a Pub/Sub topic, a Cloud project.A logs filter
        controls which log entries are exported. The sink must be created within
        a project, organization, billing account, or folder.
      id: LogSink
      properties:
        bigqueryOptions:
          $ref: '#/components/schemas/BigQueryOptions'
          description: Optional. Options that affect sinks exporting data to BigQuery.
        createTime:
          description: >-
            Output only. The creation timestamp of the sink.This field may not
            be present for older sinks.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. A description of this sink.The maximum length of the
            description is 8000 characters.
          type: string
        destination:
          description: >-
            Required. The export destination:
            "storage.googleapis.com/[GCS_BUCKET]"
            "bigquery.googleapis.com/projects/[PROJECT_ID]/datasets/[DATASET]"
            "pubsub.googleapis.com/projects/[PROJECT_ID]/topics/[TOPIC_ID]"
            "logging.googleapis.com/projects/[PROJECT_ID]"
            "logging.googleapis.com/projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]"
            The sink's writer_identity, set when the sink is created, must have
            permission to write to the destination or else the log entries are
            not exported. For more information, see Route logs to supported
            destinations
            (https://docs.cloud.google.com/logging/docs/export/configure_export_v2).
          type: string
        disabled:
          description: >-
            Optional. If set to true, then this sink is disabled and it does not
            export any log entries.
          type: boolean
        exclusions:
          description: >-
            Optional. Log entries that match any of these exclusion filters will
            not be exported.If a log entry is matched by both filter and one of
            exclusions it will not be exported.
          items:
            $ref: '#/components/schemas/LogExclusion'
          type: array
        filter:
          description: >-
            Optional. An advanced logs filter
            (https://docs.cloud.google.com/logging/docs/view/building-queries#queries-by-expression).
            The only exported log entries are those that are in the resource
            owning the sink and that match the filter.For
            example:logName="projects/[PROJECT_ID]/logs/[LOG_ID]" AND
            severity>=ERROR
          type: string
        includeChildren:
          description: >-
            Optional. This field applies only to sinks owned by organizations
            and folders. If the field is false, the default, only the logs owned
            by the sink's parent resource are available for export. If the field
            is true, then log entries from all the projects, folders, and
            billing accounts contained in the sink's parent resource are also
            available for export. Whether a particular log entry from the
            children is exported depends on the sink's filter expression.For
            example, if this field is true, then the filter
            resource.type=gce_instance would export all Compute Engine VM
            instance log entries from all projects in the sink's parent.To only
            export entries from certain child projects, filter on the project
            part of the log name:logName:("projects/test-project1/" OR
            "projects/test-project2/") AND resource.type=gce_instance
          type: boolean
        interceptChildren:
          description: >-
            Optional. This field applies only to sinks owned by organizations
            and folders.When the value of 'intercept_children' is true, the
            following restrictions apply: The sink must have the
            include_children flag set to true. The sink destination must be a
            Cloud project.Also, the following behaviors apply: Any logs matched
            by the sink won't be included by non-_Required sinks owned by child
            resources. The sink appears in the results of a ListSinks call from
            a child resource if the value of the filter field in its request is
            either 'in_scope("ALL")' or 'in_scope("ANCESTOR")'.
          type: boolean
        name:
          description: >-
            Optional. The client-assigned sink identifier, unique within the
            project.For example: "my-syslog-errors-to-pubsub".Sink identifiers
            are limited to 100 characters and can include only the following
            characters: upper and lower-case alphanumeric characters,
            underscores, hyphens, periods.First character has to be
            alphanumeric.
          type: string
        outputVersionFormat:
          deprecated: true
          description: Deprecated. This field is unused.
          enum:
            - VERSION_FORMAT_UNSPECIFIED
            - V2
            - V1
          enumDescriptions:
            - An unspecified format version that will default to V2.
            - LogEntry version 2 format.
            - LogEntry version 1 format.
          type: string
        resourceName:
          description: >-
            Output only. The resource name of the sink.
            "projects/[PROJECT_ID]/sinks/[SINK_NAME]
            "organizations/[ORGANIZATION_ID]/sinks/[SINK_NAME]
            "billingAccounts/[BILLING_ACCOUNT_ID]/sinks/[SINK_NAME]
            "folders/[FOLDER_ID]/sinks/[SINK_NAME] For example:
            projects/my_project/sinks/SINK_NAME
          readOnly: true
          type: string
        updateTime:
          description: >-
            Output only. The last update timestamp of the sink.This field may
            not be present for older sinks.
          format: google-datetime
          readOnly: true
          type: string
        writerIdentity:
          description: >-
            Output only. An IAM identity—a service account or group—under which
            Cloud Logging writes the exported log entries to the sink's
            destination. This field is either set by specifying
            custom_writer_identity or set automatically by sinks.create and
            sinks.update based on the value of unique_writer_identity in those
            methods.Until you grant this identity write-access to the
            destination, log entry exports from this sink will fail. For more
            information, see Manage access to projects, folders, and
            organizations
            (https://docs.cloud.google.com/iam/docs/granting-roles-to-service-accounts#granting_access_to_a_service_account_for_a_resource).
            Consult the destination service's documentation to determine the
            appropriate IAM roles to assign to the identity.Sinks that have a
            destination that is a log bucket in the same project as the sink
            cannot have a writer_identity and no additional permissions are
            required.
          readOnly: true
          type: string
      type: object
    LogSplit:
      description: >-
        Additional information used to correlate multiple log entries. Used when
        a single LogEntry would exceed the Google Cloud Logging size limit and
        is split across multiple log entries.
      id: LogSplit
      properties:
        index:
          description: >-
            The index of this LogEntry in the sequence of split log entries. Log
            entries are given |index| values 0, 1, ..., n-1 for a sequence of n
            log entries.
          format: int32
          type: integer
        totalSplits:
          description: >-
            The total number of log entries that the original LogEntry was split
            into.
          format: int32
          type: integer
        uid:
          description: >-
            A globally unique identifier for all log entries in a sequence of
            split log entries. All log entries with the same |LogSplit.uid| are
            assumed to be part of the same sequence of split log entries.
          type: string
      type: object
    LogView:
      description: Describes a view over log entries in a bucket.
      id: LogView
      properties:
        createTime:
          description: Output only. The creation timestamp of the view.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Describes this view.
          type: string
        filter:
          description: >-
            Optional. Filter that restricts which log entries in a bucket are
            visible in this view.Filters must be logical conjunctions that use
            the AND operator, and they can use any of the following qualifiers:
            SOURCE(), which specifies a project, folder, organization, or
            billing account of origin. resource.type, which specifies the
            resource type. LOG_ID(), which identifies the log.They can also use
            the negations of these qualifiers with the NOT operator.For
            example:SOURCE("projects/myproject") AND resource.type =
            "gce_instance" AND NOT LOG_ID("stdout")
          type: string
        name:
          description: >-
            Output only. The resource name of the view.For
            example:projects/my-project/locations/global/buckets/my-bucket/views/my-view
          readOnly: true
          type: string
        updateTime:
          description: Output only. The last update timestamp of the view.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    LoggingQuery:
      description: >-
        Describes a Cloud Logging query that can be run in Logs Explorer UI or
        via the logging API.In addition to the query itself, additional
        information may be stored to capture the display configuration and other
        UI state used in association with analysis of query results.
      id: LoggingQuery
      properties:
        filter:
          description: >-
            Required. An advanced query using the Logging Query Language
            (https://docs.cloud.google.com/logging/docs/view/logging-query-language).
            The maximum length of the filter is 20000 characters.
          type: string
        summaryFieldEnd:
          description: Characters will be counted from the end of the string.
          format: int32
          type: integer
        summaryFieldStart:
          description: Characters will be counted from the start of the string.
          format: int32
          type: integer
        summaryFields:
          description: Optional. The set of summary fields to display for this saved query.
          items:
            $ref: '#/components/schemas/SummaryField'
          type: array
      type: object
    MetricDescriptor:
      description: >-
        Defines a metric type and its schema. Once a metric descriptor is
        created, deleting or altering it stops data collection and makes the
        metric type's existing data unusable.
      id: MetricDescriptor
      properties:
        description:
          description: >-
            A detailed description of the metric, which can be used in
            documentation.
          type: string
        displayName:
          description: >-
            A concise name for the metric, which can be displayed in user
            interfaces. Use sentence case without an ending period, for example
            "Request count". This field is optional but it is recommended to be
            set for any metrics associated with user-visible concepts, such as
            Quota.
          type: string
        labels:
          description: >-
            The set of labels that can be used to describe a specific instance
            of this metric type. For example, the
            appengine.googleapis.com/http/server/response_latencies metric type
            has a label for the HTTP response code, response_code, so you can
            look at latencies for successful responses or just for responses
            that failed.
          items:
            $ref: '#/components/schemas/LabelDescriptor'
          type: array
        launchStage:
          description: Optional. The launch stage of the metric definition.
          enum:
            - LAUNCH_STAGE_UNSPECIFIED
            - UNIMPLEMENTED
            - PRELAUNCH
            - EARLY_ACCESS
            - ALPHA
            - BETA
            - GA
            - DEPRECATED
          enumDescriptions:
            - Do not use this default value.
            - The feature is not yet implemented. Users can not use it.
            - >-
              Prelaunch features are hidden from users and are only visible
              internally.
            - >-
              Early Access features are limited to a closed group of testers. To
              use these features, you must sign up in advance and sign a Trusted
              Tester agreement (which includes confidentiality provisions).
              These features may be unstable, changed in backward-incompatible
              ways, and are not guaranteed to be released.
            - >-
              Alpha is a limited availability test for releases before they are
              cleared for widespread use. By Alpha, all significant design
              issues are resolved and we are in the process of verifying
              functionality. Alpha customers need to apply for access, agree to
              applicable terms, and have their projects allowlisted. Alpha
              releases don't have to be feature complete, no SLAs are provided,
              and there are no technical support obligations, but they will be
              far enough along that customers can actually use them in test
              environments or for limited-use tests -- just like they would in
              normal production cases.
            - >-
              Beta is the point at which we are ready to open a release for any
              customer to use. There are no SLA or technical support obligations
              in a Beta release. Products will be complete from a feature
              perspective, but may have some open outstanding issues. Beta
              releases are suitable for limited production use cases.
            - >-
              GA features are open to all developers and are considered stable
              and fully qualified for production use.
            - >-
              Deprecated features are scheduled to be shut down and removed. For
              more information, see the "Deprecation Policy" section of our
              Terms of Service (https://cloud.google.com/terms/) and the Google
              Cloud Platform Subject to the Deprecation Policy
              (https://cloud.google.com/terms/deprecation) documentation.
          type: string
        metadata:
          $ref: '#/components/schemas/MetricDescriptorMetadata'
          description: Optional. Metadata which can be used to guide usage of the metric.
        metricKind:
          description: >-
            Whether the metric records instantaneous values, changes to a value,
            etc. Some combinations of metric_kind and value_type might not be
            supported.
          enum:
            - METRIC_KIND_UNSPECIFIED
            - GAUGE
            - DELTA
            - CUMULATIVE
          enumDescriptions:
            - Do not use this default value.
            - An instantaneous measurement of a value.
            - The change in a value during a time interval.
            - >-
              A value accumulated over a time interval. Cumulative measurements
              in a time series should have the same start time and increasing
              end times, until an event resets the cumulative value to zero and
              sets a new start time for the following points.
          type: string
        monitoredResourceTypes:
          description: >-
            Read-only. If present, then a time series, which is identified
            partially by a metric type and a MonitoredResourceDescriptor, that
            is associated with this metric type can only be associated with one
            of the monitored resource types listed here.
          items:
            type: string
          type: array
        name:
          description: The resource name of the metric descriptor.
          type: string
        type:
          description: >-
            The metric type, including its DNS name prefix. The type is not
            URL-encoded. All user-defined metric types have the DNS name
            custom.googleapis.com or external.googleapis.com. Metric types
            should use a natural hierarchical grouping. For example:
            "custom.googleapis.com/invoice/paid/amount"
            "external.googleapis.com/prometheus/up"
            "appengine.googleapis.com/http/server/response_latencies" 
          type: string
        unit:
          description: >-
            The units in which the metric value is reported. It is only
            applicable if the value_type is INT64, DOUBLE, or DISTRIBUTION. The
            unit defines the representation of the stored metric
            values.Different systems might scale the values to be more easily
            displayed (so a value of 0.02kBy might be displayed as 20By, and a
            value of 3523kBy might be displayed as 3.5MBy). However, if the unit
            is kBy, then the value of the metric is always in thousands of
            bytes, no matter how it might be displayed.If you want a custom
            metric to record the exact number of CPU-seconds used by a job, you
            can create an INT64 CUMULATIVE metric whose unit is s{CPU} (or
            equivalently 1s{CPU} or just s). If the job uses 12,005 CPU-seconds,
            then the value is written as 12005.Alternatively, if you want a
            custom metric to record data in a more granular way, you can create
            a DOUBLE CUMULATIVE metric whose unit is ks{CPU}, and then write the
            value 12.005 (which is 12005/1000), or use Kis{CPU} and write 11.723
            (which is 12005/1024).The supported units are a subset of The
            Unified Code for Units of Measure
            (https://unitsofmeasure.org/ucum.html) standard:Basic units (UNIT)
            bit bit By byte s second min minute h hour d day 1
            dimensionlessPrefixes (PREFIX) k kilo (10^3) M mega (10^6) G giga
            (10^9) T tera (10^12) P peta (10^15) E exa (10^18) Z zetta (10^21) Y
            yotta (10^24) m milli (10^-3) u micro (10^-6) n nano (10^-9) p pico
            (10^-12) f femto (10^-15) a atto (10^-18) z zepto (10^-21) y yocto
            (10^-24) Ki kibi (2^10) Mi mebi (2^20) Gi gibi (2^30) Ti tebi (2^40)
            Pi pebi (2^50)GrammarThe grammar also includes these connectors: /
            division or ratio (as an infix operator). For examples, kBy/{email}
            or MiBy/10ms (although you should almost never have /s in a metric
            unit; rates should always be computed at query time from the
            underlying cumulative or delta value). . multiplication or
            composition (as an infix operator). For examples, GBy.d or
            k{watt}.h.The grammar for a unit is as follows: Expression =
            Component { "." Component } { "/" Component } ; Component = ( [
            PREFIX ] UNIT | "%" ) [ Annotation ] | Annotation | "1" ; Annotation
            = "{" NAME "}" ; Notes: Annotation is just a comment if it follows a
            UNIT. If the annotation is used alone, then the unit is equivalent
            to 1. For examples, {request}/s == 1/s, By{transmitted}/s == By/s.
            NAME is a sequence of non-blank printable ASCII characters not
            containing { or }. 1 represents a unitary dimensionless unit
            (https://en.wikipedia.org/wiki/Dimensionless_quantity) of 1, such as
            in 1/s. It is typically used when none of the basic units are
            appropriate. For example, "new users per day" can be represented as
            1/d or {new-users}/d (and a metric value 5 would mean "5 new users).
            Alternatively, "thousands of page views per day" would be
            represented as 1000/d or k1/d or k{page_views}/d (and a metric value
            of 5.3 would mean "5300 page views per day"). % represents
            dimensionless value of 1/100, and annotates values giving a
            percentage (so the metric values are typically in the range of
            0..100, and a metric value 3 means "3 percent"). 10^2.% indicates a
            metric contains a ratio, typically in the range 0..1, that will be
            multiplied by 100 and displayed as a percentage (so a metric value
            0.03 means "3 percent").
          type: string
        valueType:
          description: >-
            Whether the measurement is an integer, a floating-point number, etc.
            Some combinations of metric_kind and value_type might not be
            supported.
          enum:
            - VALUE_TYPE_UNSPECIFIED
            - BOOL
            - INT64
            - DOUBLE
            - STRING
            - DISTRIBUTION
            - MONEY
          enumDescriptions:
            - Do not use this default value.
            - >-
              The value is a boolean. This value type can be used only if the
              metric kind is GAUGE.
            - The value is a signed 64-bit integer.
            - The value is a double precision floating point number.
            - >-
              The value is a text string. This value type can be used only if
              the metric kind is GAUGE.
            - The value is a Distribution.
            - The value is money.
          type: string
      type: object
    MetricDescriptorMetadata:
      description: Additional annotations that can be used to guide the usage of a metric.
      id: MetricDescriptorMetadata
      properties:
        ingestDelay:
          description: >-
            The delay of data points caused by ingestion. Data points older than
            this age are guaranteed to be ingested and available to be read,
            excluding data loss due to errors.
          format: google-duration
          type: string
        launchStage:
          deprecated: true
          description: Deprecated. Must use the MetricDescriptor.launch_stage instead.
          enum:
            - LAUNCH_STAGE_UNSPECIFIED
            - UNIMPLEMENTED
            - PRELAUNCH
            - EARLY_ACCESS
            - ALPHA
            - BETA
            - GA
            - DEPRECATED
          enumDescriptions:
            - Do not use this default value.
            - The feature is not yet implemented. Users can not use it.
            - >-
              Prelaunch features are hidden from users and are only visible
              internally.
            - >-
              Early Access features are limited to a closed group of testers. To
              use these features, you must sign up in advance and sign a Trusted
              Tester agreement (which includes confidentiality provisions).
              These features may be unstable, changed in backward-incompatible
              ways, and are not guaranteed to be released.
            - >-
              Alpha is a limited availability test for releases before they are
              cleared for widespread use. By Alpha, all significant design
              issues are resolved and we are in the process of verifying
              functionality. Alpha customers need to apply for access, agree to
              applicable terms, and have their projects allowlisted. Alpha
              releases don't have to be feature complete, no SLAs are provided,
              and there are no technical support obligations, but they will be
              far enough along that customers can actually use them in test
              environments or for limited-use tests -- just like they would in
              normal production cases.
            - >-
              Beta is the point at which we are ready to open a release for any
              customer to use. There are no SLA or technical support obligations
              in a Beta release. Products will be complete from a feature
              perspective, but may have some open outstanding issues. Beta
              releases are suitable for limited production use cases.
            - >-
              GA features are open to all developers and are considered stable
              and fully qualified for production use.
            - >-
              Deprecated features are scheduled to be shut down and removed. For
              more information, see the "Deprecation Policy" section of our
              Terms of Service (https://cloud.google.com/terms/) and the Google
              Cloud Platform Subject to the Deprecation Policy
              (https://cloud.google.com/terms/deprecation) documentation.
          type: string
        samplePeriod:
          description: >-
            The sampling period of metric data points. For metrics which are
            written periodically, consecutive data points are stored at this
            time interval, excluding data loss due to errors. Metrics with a
            higher granularity have a smaller sampling period.
          format: google-duration
          type: string
        timeSeriesResourceHierarchyLevel:
          description: The scope of the timeseries data of the metric.
          items:
            enum:
              - TIME_SERIES_RESOURCE_HIERARCHY_LEVEL_UNSPECIFIED
              - PROJECT
              - ORGANIZATION
              - FOLDER
            enumDescriptions:
              - Do not use this default value.
              - Scopes a metric to a project.
              - Scopes a metric to an organization.
              - Scopes a metric to a folder.
            type: string
          type: array
      type: object
    MonitoredResource:
      description: >-
        An object representing a resource that can be used for monitoring,
        logging, billing, or other purposes. Examples include virtual machine
        instances, databases, and storage devices such as disks. The type field
        identifies a MonitoredResourceDescriptor object that describes the
        resource's schema. Information in the labels field identifies the actual
        resource and its attributes according to the schema. For example, a
        particular Compute Engine VM instance could be represented by the
        following object, because the MonitoredResourceDescriptor for
        "gce_instance" has labels "project_id", "instance_id" and "zone": {
        "type": "gce_instance", "labels": { "project_id": "my-project",
        "instance_id": "12345678901234", "zone": "us-central1-a" }} 
      id: MonitoredResource
      properties:
        labels:
          additionalProperties:
            type: string
          description: >-
            Required. Values for all of the labels listed in the associated
            monitored resource descriptor. For example, Compute Engine VM
            instances use the labels "project_id", "instance_id", and "zone".
          type: object
        type:
          description: >-
            Required. The monitored resource type. This field must match the
            type field of a MonitoredResourceDescriptor object. For example, the
            type of a Compute Engine VM instance is gce_instance. Some
            descriptors include the service name in the type; for example, the
            type of a Datastream stream is datastream.googleapis.com/Stream.
          type: string
      type: object
    MonitoredResourceDescriptor:
      description: >-
        An object that describes the schema of a MonitoredResource object using
        a type name and a set of labels. For example, the monitored resource
        descriptor for Google Compute Engine VM instances has a type of
        "gce_instance" and specifies the use of the labels "instance_id" and
        "zone" to identify particular VM instances.Different APIs can support
        different monitored resource types. APIs generally provide a list method
        that returns the monitored resource descriptors used by the API.
      id: MonitoredResourceDescriptor
      properties:
        description:
          description: >-
            Optional. A detailed description of the monitored resource type that
            might be used in documentation.
          type: string
        displayName:
          description: >-
            Optional. A concise name for the monitored resource type that might
            be displayed in user interfaces. It should be a Title Cased Noun
            Phrase, without any article or other determiners. For example,
            "Google Cloud SQL Database".
          type: string
        labels:
          description: >-
            Required. A set of labels used to describe instances of this
            monitored resource type. For example, an individual Google Cloud SQL
            database is identified by values for the labels "database_id" and
            "zone".
          items:
            $ref: '#/components/schemas/LabelDescriptor'
          type: array
        launchStage:
          description: Optional. The launch stage of the monitored resource definition.
          enum:
            - LAUNCH_STAGE_UNSPECIFIED
            - UNIMPLEMENTED
            - PRELAUNCH
            - EARLY_ACCESS
            - ALPHA
            - BETA
            - GA
            - DEPRECATED
          enumDescriptions:
            - Do not use this default value.
            - The feature is not yet implemented. Users can not use it.
            - >-
              Prelaunch features are hidden from users and are only visible
              internally.
            - >-
              Early Access features are limited to a closed group of testers. To
              use these features, you must sign up in advance and sign a Trusted
              Tester agreement (which includes confidentiality provisions).
              These features may be unstable, changed in backward-incompatible
              ways, and are not guaranteed to be released.
            - >-
              Alpha is a limited availability test for releases before they are
              cleared for widespread use. By Alpha, all significant design
              issues are resolved and we are in the process of verifying
              functionality. Alpha customers need to apply for access, agree to
              applicable terms, and have their projects allowlisted. Alpha
              releases don't have to be feature complete, no SLAs are provided,
              and there are no technical support obligations, but they will be
              far enough along that customers can actually use them in test
              environments or for limited-use tests -- just like they would in
              normal production cases.
            - >-
              Beta is the point at which we are ready to open a release for any
              customer to use. There are no SLA or technical support obligations
              in a Beta release. Products will be complete from a feature
              perspective, but may have some open outstanding issues. Beta
              releases are suitable for limited production use cases.
            - >-
              GA features are open to all developers and are considered stable
              and fully qualified for production use.
            - >-
              Deprecated features are scheduled to be shut down and removed. For
              more information, see the "Deprecation Policy" section of our
              Terms of Service (https://cloud.google.com/terms/) and the Google
              Cloud Platform Subject to the Deprecation Policy
              (https://cloud.google.com/terms/deprecation) documentation.
          type: string
        name:
          description: >-
            Optional. The resource name of the monitored resource descriptor:
            "projects/{project_id}/monitoredResourceDescriptors/{type}" where
            {type} is the value of the type field in this object and
            {project_id} is a project ID that provides API-specific context for
            accessing the type. APIs that do not use project information can use
            the resource name format "monitoredResourceDescriptors/{type}".
          type: string
        type:
          description: >-
            Required. The monitored resource type. For example, the type
            "cloudsql_database" represents databases in Google Cloud SQL. For a
            list of types, see Monitored resource types
            (https://cloud.google.com/monitoring/api/resources) and Logging
            resource types
            (https://cloud.google.com/logging/docs/api/v2/resource-list).
          type: string
      type: object
    MonitoredResourceMetadata:
      description: >-
        Auxiliary metadata for a MonitoredResource object. MonitoredResource
        objects contain the minimum set of information to uniquely identify a
        monitored resource instance. There is some other useful auxiliary
        metadata. Monitoring and Logging use an ingestion pipeline to extract
        metadata for cloud resources of all types, and store the metadata in
        this message.
      id: MonitoredResourceMetadata
      properties:
        systemLabels:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Output only. Values for predefined system metadata labels. System
            labels are a kind of metadata extracted by Google, including
            "machine_image", "vpc", "subnet_id", "security_group", "name", etc.
            System label values can be only strings, Boolean values, or a list
            of strings. For example: { "name": "my-test-instance",
            "security_group": ["a", "b", "c"], "spot_instance": false } 
          type: object
        userLabels:
          additionalProperties:
            type: string
          description: Output only. A map of user-defined metadata labels.
          type: object
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is false, it means the operation is still in progress.
            If true, the operation is completed, and either error or response is
            available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the name should be a resource name ending with
            operations/{unique_id}.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as Delete, the response is
            google.protobuf.Empty. If the original method is standard
            Get/Create/Update, the response should be the resource. For other
            methods, the response should have the type XxxResponse, where Xxx is
            the original method name. For example, if the original method name
            is TakeSnapshot(), the inferred response type is
            TakeSnapshotResponse.
          type: object
      type: object
    OpsAnalyticsQuery:
      description: Describes a query that can be run in Log Analytics.
      id: OpsAnalyticsQuery
      properties:
        queryBuilder:
          $ref: '#/components/schemas/QueryBuilderConfig'
          description: >-
            Optional. A query builder configuration used in Log Analytics.If
            both query_builder and sql_query_text fields are set, then the
            sql_query_text will be used, if its non-empty. At least one of the
            two fields must be set.
        sqlQueryText:
          description: >-
            Optional. A Log Analytics SQL query in text format.If both
            sql_query_text and query_builder fields are set, then the
            sql_query_text will be used, if its non-empty. At least one of the
            two fields must be set.
          type: string
      type: object
    Policy:
      description: >-
        An Identity and Access Management (IAM) policy, which specifies access
        controls for Google Cloud resources.A Policy is a collection of
        bindings. A binding binds one or more members, or principals, to a
        single role. Principals can be user accounts, service accounts, Google
        groups, and domains (such as G Suite). A role is a named list of
        permissions; each role can be an IAM predefined role or a user-created
        custom role.For some types of Google Cloud resources, a binding can also
        specify a condition, which is a logical expression that allows access to
        a resource only if the expression evaluates to true. A condition can add
        constraints based on attributes of the request, the resource, or both.
        To learn which resources support conditions in their IAM policies, see
        the IAM documentation
        (https://cloud.google.com/iam/help/conditions/resource-policies).JSON
        example: { "bindings": [ { "role":
        "roles/resourcemanager.organizationAdmin", "members": [
        "user:mike@example.com", "group:admins@example.com",
        "domain:google.com",
        "serviceAccount:my-project-id@appspot.gserviceaccount.com" ] }, {
        "role": "roles/resourcemanager.organizationViewer", "members": [
        "user:eve@example.com" ], "condition": { "title": "expirable access",
        "description": "Does not grant access after Sep 2020", "expression":
        "request.time < timestamp('2020-10-01T00:00:00.000Z')", } } ], "etag":
        "BwWWja0YfJA=", "version": 3 } YAML example: bindings: - members: -
        user:mike@example.com - group:admins@example.com - domain:google.com -
        serviceAccount:my-project-id@appspot.gserviceaccount.com role:
        roles/resourcemanager.organizationAdmin - members: -
        user:eve@example.com role: roles/resourcemanager.organizationViewer
        condition: title: expirable access description: Does not grant access
        after Sep 2020 expression: request.time <
        timestamp('2020-10-01T00:00:00.000Z') etag: BwWWja0YfJA= version: 3 For
        a description of IAM and its features, see the IAM documentation
        (https://cloud.google.com/iam/docs/).
      id: Policy
      properties:
        bindings:
          description: >-
            Associates a list of members, or principals, with a role.
            Optionally, may specify a condition that determines how and when the
            bindings are applied. Each of the bindings must contain at least one
            principal.The bindings in a Policy can refer to up to 1,500
            principals; up to 250 of these principals can be Google groups. Each
            occurrence of a principal counts towards these limits. For example,
            if the bindings grant 50 different roles to user:alice@example.com,
            and not to any other principal, then you can add another 1,450
            principals to the bindings in the Policy.
          items:
            $ref: '#/components/schemas/Binding'
          type: array
        etag:
          description: >-
            etag is used for optimistic concurrency control as a way to help
            prevent simultaneous updates of a policy from overwriting each
            other. It is strongly suggested that systems make use of the etag in
            the read-modify-write cycle to perform policy updates in order to
            avoid race conditions: An etag is returned in the response to
            getIamPolicy, and systems are expected to put that etag in the
            request to setIamPolicy to ensure that their change will be applied
            to the same version of the policy.Important: If you use IAM
            Conditions, you must include the etag field whenever you call
            setIamPolicy. If you omit this field, then IAM allows you to
            overwrite a version 3 policy with a version 1 policy, and all of the
            conditions in the version 3 policy are lost.
          format: byte
          type: string
        version:
          description: >-
            Specifies the format of the policy.Valid values are 0, 1, and 3.
            Requests that specify an invalid value are rejected.Any operation
            that affects conditional role bindings must specify version 3. This
            requirement applies to the following operations: Getting a policy
            that includes a conditional role binding Adding a conditional role
            binding to a policy Changing a conditional role binding in a policy
            Removing any role binding, with or without a condition, from a
            policy that includes conditionsImportant: If you use IAM Conditions,
            you must include the etag field whenever you call setIamPolicy. If
            you omit this field, then IAM allows you to overwrite a version 3
            policy with a version 1 policy, and all of the conditions in the
            version 3 policy are lost.If a policy does not include any
            conditions, operations on that policy may specify any valid version
            or leave the field unset.To learn which resources support conditions
            in their IAM policies, see the IAM documentation
            (https://cloud.google.com/iam/help/conditions/resource-policies).
          format: int32
          type: integer
      type: object
    ProjectedField:
      description: >-
        Represents a field selected in the query, analogous to an item in a SQL
        SELECT clause. It specifies the source field and optionally applies
        transformations like aggregation, casting, regex extraction, or assigns
        an alias. Use ProjectedField when you need more than just the raw source
        field name (for which you might use FieldSource directly in
        QueryBuilderConfig's field_sources list if no transformations or
        specific operation type are needed).A ProjectedField can represent
        either a field present in the data schema (specified via the field
        property) or a virtual field that is computed from other fields
        (specified via the virtual_field property).
      id: ProjectedField
      properties:
        alias:
          description: >-
            The alias name for the field. Valid alias examples are: - single
            word alias: TestAlias - numbers in an alias: Alias123 - multi word
            alias should be enclosed in quotes: "Test Alias" Invalid alias
            examples are: - alias containing keywords: WHERE, SELECT, FROM, etc.
            - alias starting with a number: 1stAlias
          type: string
        cast:
          description: >-
            The cast for the field. This can any SQL cast type. Examples: -
            STRING - CHAR - DATE - TIMESTAMP - DATETIME - INT - FLOAT
          type: string
        field:
          description: >-
            Optional. The field name. This will be the field that is selected
            using the dot notation to display the drill down value.
          type: string
        operation:
          description: >-
            Specifies the role of this field (direct selection, grouping, or
            aggregation).
          enum:
            - FIELD_OPERATION_UNSPECIFIED
            - NO_SETTING
            - GROUP_BY
            - AGGREGATE
          enumDescriptions:
            - Invalid value. Operation must be specified.
            - >-
              Select the field directly without grouping or aggregation.
              Corresponds to including the raw field (potentially with cast,
              regex, or alias) in the SELECT list.
            - >-
              Group the query results by the distinct values of this field.
              Corresponds to including the field (potentially truncated) in the
              GROUP BY clause.
            - >-
              Apply an aggregation function to this field across grouped
              results. Corresponds to applying a function like COUNT, SUM, AVG
              in the SELECT list. Requires sql_aggregation_function to be set.
          type: string
        regexExtraction:
          description: >-
            The re2 extraction for the field. This will be used to extract the
            value from the field using REGEXP_EXTRACT. More information on re2
            can be found here: https://github.com/google/re2/wiki/Syntax. Meta
            characters like +?()| will need to be escaped. Examples: -
            ".(autoscaler.*)$" will be converted to
            REGEXP_EXTRACT(JSON_VALUE(field),"request(.*(autoscaler.*)$)")in
            SQL. - "\(test_value\)$" will be converted to
            REGEXP_EXTRACT(JSON_VALUE(field),"request(\(test_value\)$)") in SQL.
          type: string
        sqlAggregationFunction:
          $ref: '#/components/schemas/FunctionApplication'
          description: The function to apply to the field.
        truncationGranularity:
          description: >-
            The truncation granularity when grouping by a time/date field. This
            will be used to truncate the field to the granularity specified.
            This can be either a date or a time granularity found at
            https://cloud.google.com/bigquery/docs/reference/standard-sql/timestamp_functions#timestamp_trunc_granularity_date
            and
            https://cloud.google.com/bigquery/docs/reference/standard-sql/timestamp_functions#timestamp_trunc_granularity_time
            respectively.
          type: string
        virtualField:
          $ref: '#/components/schemas/VirtualField'
          description: >-
            Optional. A virtual field definition, used in place of field to
            define a field that is computed from other fields rather than being
            directly present in the data schema.For example, a virtual field can
            be defined using COALESCE to select the first non-null value from a
            list of fields.If virtual_field is set, field must not be set.
      type: object
    QueryBuilderConfig:
      description: >-
        Defines a structured query configuration that can be used instead of
        writing raw SQL. This configuration represents the components of a SQL
        query (FROM, SELECT, WHERE, ORDER BY, LIMIT) and is typically converted
        into an executable query (e.g., BigQuery SQL) by the backend service to
        retrieve data for analysis or visualization.
      id: QueryBuilderConfig
      properties:
        fieldSources:
          description: >-
            Defines the items to include in the query result, analogous to a SQL
            SELECT clause.
          items:
            $ref: '#/components/schemas/FieldSource'
          type: array
        filter:
          $ref: '#/components/schemas/FilterPredicate'
          description: >-
            The filter to use for the query. This equates to the WHERE clause in
            SQL.
        limit:
          description: >-
            The limit to use for the query. This equates to the LIMIT clause in
            SQL. A limit of 0 will be treated as not enabled.
          format: int64
          type: string
        orderBys:
          description: >-
            The sort orders to use for the query. This equates to the ORDER BY
            clause in SQL.
          items:
            $ref: '#/components/schemas/SortOrderParameter'
          type: array
        resourceNames:
          description: >-
            Required. The view/resource to query. For now only a single
            view/resource will be sent, but there are plans to allow multiple
            views in the future. Marking as repeated for that purpose. Example:
            - "projects/123/locations/global/buckets/456/views/_Default" -
            "projects/123/locations/global/metricBuckets/456/views/_Default"
          items:
            type: string
          type: array
        searchTerm:
          description: >-
            The plain text search to use for the query. There is no support for
            multiple search terms. This uses the SEARCH functionality in
            BigQuery. For example, a search_term = 'ERROR' would result in the
            following SQL:SELECT * FROM resource WHERE SEARCH(resource, 'ERROR')
            LIMIT 100
          type: string
      type: object
    RecentQuery:
      description: >-
        Describes a recent query executed on the Logs Explorer or Log Analytics
        page within the last ~ 30 days.
      id: RecentQuery
      properties:
        lastRunTime:
          description: Output only. The timestamp when this query was last run.
          format: google-datetime
          readOnly: true
          type: string
        loggingQuery:
          $ref: '#/components/schemas/LoggingQuery'
          description: >-
            Logging query that can be executed in Logs Explorer or via Logging
            API.
        name:
          description: >-
            Output only. Resource name of the recent query.In the format:
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/recentQueries/[QUERY_ID]"
            For a list of supported locations, see Supported Regions
            (https://docs.cloud.google.com/logging/docs/region-support)The
            QUERY_ID is a system generated alphanumeric ID.
          readOnly: true
          type: string
        opsAnalyticsQuery:
          $ref: '#/components/schemas/OpsAnalyticsQuery'
          description: Analytics query that can be executed in Log Analytics.
      type: object
    RequestLog:
      description: >-
        Complete log information about a single HTTP request to an App Engine
        application.
      id: RequestLog
      properties:
        appEngineRelease:
          description: App Engine release version.
          type: string
        appId:
          description: Application that handled this request.
          type: string
        cost:
          description: An indication of the relative cost of serving this request.
          format: double
          type: number
        endTime:
          description: Time when the request finished.
          format: google-datetime
          type: string
        finished:
          description: Whether this request is finished or active.
          type: boolean
        first:
          description: >-
            Whether this is the first RequestLog entry for this request. If an
            active request has several RequestLog entries written to Stackdriver
            Logging, then this field will be set for one of them.
          type: boolean
        host:
          description: Internet host and port number of the resource being requested.
          type: string
        httpVersion:
          description: 'HTTP version of request. Example: "HTTP/1.1".'
          type: string
        instanceId:
          description: An identifier for the instance that handled the request.
          type: string
        instanceIndex:
          description: >-
            If the instance processing this request belongs to a manually scaled
            module, then this is the 0-based index of the instance. Otherwise,
            this value is -1.
          format: int32
          type: integer
        ip:
          description: Origin IP address.
          type: string
        latency:
          description: Latency of the request.
          format: google-duration
          type: string
        line:
          description: >-
            A list of log lines emitted by the application while serving this
            request.
          items:
            $ref: '#/components/schemas/LogLine'
          type: array
        megaCycles:
          description: Number of CPU megacycles used to process request.
          format: int64
          type: string
        method:
          description: 'Request method. Example: "GET", "HEAD", "PUT", "POST", "DELETE".'
          type: string
        moduleId:
          description: Module of the application that handled this request.
          type: string
        nickname:
          description: >-
            The logged-in user who made the request.Most likely, this is the
            part of the user's email before the @ sign. The field value is the
            same for different requests from the same user, but different users
            can have similar names. This information is also available to the
            application via the App Engine Users API.This field will be
            populated starting with App Engine 1.9.21.
          type: string
        pendingTime:
          description: Time this request spent in the pending request queue.
          format: google-duration
          type: string
        referrer:
          description: Referrer URL of request.
          type: string
        requestId:
          description: >-
            Globally unique identifier for a request, which is based on the
            request start time. Request IDs for requests which started later
            will compare greater as strings than those for requests which
            started earlier.
          type: string
        resource:
          description: >-
            Contains the path and query portion of the URL that was requested.
            For example, if the URL was "http://example.com/app?name=val", the
            resource would be "/app?name=val". The fragment identifier, which is
            identified by the # character, is not included.
          type: string
        responseSize:
          description: Size in bytes sent back to client by request.
          format: int64
          type: string
        sourceReference:
          description: >-
            Source code for the application that handled this request. There can
            be more than one source reference per deployed application if source
            code is distributed among multiple repositories.
          items:
            $ref: '#/components/schemas/SourceReference'
          type: array
        spanId:
          description: Stackdriver Trace span identifier for this request.
          type: string
        startTime:
          description: Time when the request started.
          format: google-datetime
          type: string
        status:
          description: 'HTTP response status code. Example: 200, 404.'
          format: int32
          type: integer
        taskName:
          description: Task name of the request, in the case of an offline request.
          type: string
        taskQueueName:
          description: Queue name of the request, in the case of an offline request.
          type: string
        traceId:
          description: Stackdriver Trace identifier for this request.
          type: string
        traceSampled:
          description: >-
            If true, the value in the 'trace_id' field was sampled for storage
            in a trace backend.
          type: boolean
        urlMapEntry:
          description: File or class that handled the request.
          type: string
        userAgent:
          description: User agent that made the request.
          type: string
        versionId:
          description: Version of the application that handled this request.
          type: string
        wasLoadingRequest:
          description: Whether this was a loading request for the instance.
          type: boolean
      type: object
    SavedQuery:
      description: Describes a query that has been saved by a user.
      id: SavedQuery
      properties:
        createTime:
          description: Output only. The timestamp when the saved query was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. A human readable description of the saved query.
          type: string
        displayName:
          description: Required. The user specified title for the SavedQuery.
          type: string
        loggingQuery:
          $ref: '#/components/schemas/LoggingQuery'
          description: >-
            Logging query that can be executed in Logs Explorer or via Logging
            API.
        name:
          description: >-
            Output only. Resource name of the saved query.In the format:
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/savedQueries/[QUERY_ID]"
            For a list of supported locations, see Supported Regions
            (https://docs.cloud.google.com/logging/docs/region-support#bucket-regions)After
            the saved query is created, the location cannot be changed.If the
            user doesn't provide a QUERY_ID, the system will generate an
            alphanumeric ID.
          readOnly: true
          type: string
        opsAnalyticsQuery:
          $ref: '#/components/schemas/OpsAnalyticsQuery'
          description: Analytics query that can be executed in Log Analytics.
        updateTime:
          description: Output only. The timestamp when the saved query was last updated.
          format: google-datetime
          readOnly: true
          type: string
        visibility:
          description: >-
            Required. The visibility status of this query, which determines its
            ownership.
          enum:
            - VISIBILITY_UNSPECIFIED
            - PRIVATE
            - SHARED
          enumDescriptions:
            - >-
              The saved query visibility is unspecified. A CreateSavedQuery
              request with an unspecified visibility will be rejected.
            - The saved query is only visible to the user that created it.
            - The saved query is visible to anyone in the project.
          type: string
      type: object
    SetIamPolicyRequest:
      description: Request message for SetIamPolicy method.
      id: SetIamPolicyRequest
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
          description: >-
            REQUIRED: The complete policy to be applied to the resource. The
            size of the policy is limited to a few 10s of KB. An empty policy is
            a valid policy but certain Google Cloud services (such as Projects)
            might reject them.
        updateMask:
          description: >-
            OPTIONAL: A FieldMask specifying which fields of the policy to
            modify. Only the fields in the mask will be modified. If no mask is
            provided, the following default mask is used:paths: "bindings, etag"
          format: google-fieldmask
          type: string
      type: object
    Settings:
      description: >-
        Describes the settings associated with a project, folder, organization,
        or billing account.
      id: Settings
      properties:
        defaultSinkConfig:
          $ref: '#/components/schemas/DefaultSinkConfig'
          description: Optional. Overrides the built-in configuration for _Default sink.
        disableDefaultSink:
          description: >-
            Optional. If set to true, the _Default sink in newly created
            projects and folders will created in a disabled state. This can be
            used to automatically disable log storage if there is already an
            aggregated sink configured in the hierarchy. The _Default sink can
            be re-enabled manually if needed.
          type: boolean
        kmsKeyName:
          description: >-
            Optional. The resource name for the configured Cloud KMS key.KMS key
            name format:
            "projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]"
            For
            example:"projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key"To
            enable CMEK, set this field to a valid kms_key_name for which the
            associated service account has the required
            roles/cloudkms.cryptoKeyEncrypterDecrypter role assigned for the
            key.The Cloud KMS key used by the Log Router can be updated by
            changing the kms_key_name to a new valid key name.To disable CMEK
            for the Log Router, set this field to an empty string.See Configure
            CMEK for Cloud Logging
            (https://docs.cloud.google.com/logging/docs/routing/managed-encryption)
            for more information.
          type: string
        kmsServiceAccountId:
          description: >-
            Output only. The service account that will be used by the Log Router
            to access your Cloud KMS key.Before enabling CMEK, you must first
            assign the role roles/cloudkms.cryptoKeyEncrypterDecrypter to the
            service account that will be used to access your Cloud KMS key. Use
            GetSettings to obtain the service account ID.See Configure CMEK for
            Cloud Logging
            (https://docs.cloud.google.com/logging/docs/routing/managed-encryption)
            for more information.
          readOnly: true
          type: string
        loggingServiceAccountId:
          description: >-
            Output only. The service account for the given resource container,
            such as project or folder. Log sinks use this service account as
            their writer_identity if no custom service account is provided in
            the request when calling the create sink method.
          readOnly: true
          type: string
        name:
          description: Output only. The resource name of the settings.
          readOnly: true
          type: string
        storageLocation:
          description: >-
            Optional. The storage location for the _Default and _Required log
            buckets of newly created projects and folders, unless the storage
            location is explicitly provided.Example value: europe-west1.Note:
            this setting does not affect the location of resources where a
            location is explicitly provided when created, such as custom log
            buckets.
          type: string
      type: object
    SortOrderParameter:
      description: A sort order for a query based on a column.
      id: SortOrderParameter
      properties:
        fieldSource:
          $ref: '#/components/schemas/FieldSource'
          description: >-
            The field to sort on. Can be one of the FieldSource types: field
            name, alias ref, variable ref, or a literal value.
        sortOrderDirection:
          description: The sort order to use for the query.
          enum:
            - SORT_ORDER_UNSPECIFIED
            - SORT_ORDER_NONE
            - SORT_ORDER_ASCENDING
            - SORT_ORDER_DESCENDING
          enumDescriptions:
            - Invalid value, do not use.
            - >-
              No sorting will be applied. This is used to determine if the query
              is in pass thru mode. To correctly chart a query in pass thru
              mode, NONE will need to be sent
            - The lowest-valued entries will be selected.
            - The highest-valued entries will be selected.
          type: string
      type: object
    SourceLocation:
      description: Specifies a location in a source code file.
      id: SourceLocation
      properties:
        file:
          description: >-
            Source file name. Depending on the runtime environment, this might
            be a simple name or a fully-qualified name.
          type: string
        functionName:
          description: >-
            Human-readable name of the function or method being invoked, with
            optional context such as the class or package name. This information
            is used in contexts such as the logs viewer, where a file and line
            number are less meaningful. The format can vary by language. For
            example: qual.if.ied.Class.method (Java), dir/package.func (Go),
            function (Python).
          type: string
        line:
          description: Line within the source file.
          format: int64
          type: string
      type: object
    SourceReference:
      description: >-
        A reference to a particular snapshot of the source tree used to build
        and deploy an application.
      id: SourceReference
      properties:
        repository:
          description: >-
            Optional. A URI string identifying the repository. Example:
            "https://github.com/GoogleCloudPlatform/kubernetes.git"
          type: string
        revisionId:
          description: >-
            The canonical and persistent identifier of the deployed revision.
            Example (git): "0035781c50ec7aa23385dc841529ce8a4b70db1b"
          type: string
      type: object
    Status:
      description: >-
        The Status type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by gRPC (https://github.com/grpc). Each Status message contains
        three pieces of data: error code, error message, and error details.You
        can find out more about this error model and how to work with it in the
        API Design Guide (https://cloud.google.com/apis/design/errors).
      id: Status
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      type: object
    SummaryField:
      description: >-
        A field from the LogEntry that is added to the summary line
        (https://docs.cloud.google.com/logging/docs/view/logs-explorer-interface#preferences)
        for a query in the Logs Explorer.
      id: SummaryField
      properties:
        field:
          description: >-
            Optional. The field from the LogEntry to include in the summary
            line, for example resource.type or jsonPayload.name.
          type: string
      type: object
    SuppressionInfo:
      description: Information about entries that were omitted from the session.
      id: SuppressionInfo
      properties:
        reason:
          description: The reason that entries were omitted from the session.
          enum:
            - REASON_UNSPECIFIED
            - RATE_LIMIT
            - NOT_CONSUMED
          enumDescriptions:
            - Unexpected default.
            - >-
              Indicates suppression occurred due to relevant entries being
              received in excess of rate limits. For quotas and limits, see
              Logging API quotas and limits
              (https://docs.cloud.google.com/logging/quotas#api-limits).
            - >-
              Indicates suppression occurred due to the client not consuming
              responses quickly enough.
          type: string
        suppressedCount:
          description: A lower bound on the count of entries omitted due to reason.
          format: int32
          type: integer
      type: object
    TailLogEntriesRequest:
      description: The parameters to TailLogEntries.
      id: TailLogEntriesRequest
      properties:
        bufferWindow:
          description: >-
            Optional. The amount of time to buffer log entries at the server
            before being returned to prevent out of order results due to late
            arriving log entries. Valid values are between 0-60000 milliseconds.
            Defaults to 2000 milliseconds.
          format: google-duration
          type: string
        filter:
          description: >-
            Optional. A filter that chooses which log entries to return. For
            more information, see Logging query language
            (https://docs.cloud.google.com/logging/docs/view/logging-query-language).Only
            log entries that match the filter are returned. An empty filter
            matches all log entries in the resources listed in resource_names.
            Referencing a parent resource that is not listed in resource_names
            will cause the filter to return no results. The maximum length of a
            filter is 20,000 characters.
          type: string
        resourceNames:
          description: >-
            Required. Name of a parent resource from which to retrieve log
            entries: projects/[PROJECT_ID] organizations/[ORGANIZATION_ID]
            billingAccounts/[BILLING_ACCOUNT_ID] folders/[FOLDER_ID]May
            alternatively be one or more views:
            projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]
            organizations/[ORGANIZATION_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]
            billingAccounts/[BILLING_ACCOUNT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]
            folders/[FOLDER_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]
          items:
            type: string
          type: array
      type: object
    TailLogEntriesResponse:
      description: Result returned from TailLogEntries.
      id: TailLogEntriesResponse
      properties:
        entries:
          description: >-
            A list of log entries. Each response in the stream will order
            entries with increasing values of LogEntry.timestamp. Ordering is
            not guaranteed between separate responses.
          items:
            $ref: '#/components/schemas/LogEntry'
          type: array
        suppressionInfo:
          description: >-
            If entries that otherwise would have been included in the session
            were not sent back to the client, counts of relevant entries omitted
            from the session with the reason that they were not included. There
            will be at most one of each reason per response. The counts
            represent the number of suppressed entries since the last streamed
            response.
          items:
            $ref: '#/components/schemas/SuppressionInfo'
          type: array
      type: object
    TestIamPermissionsRequest:
      description: Request message for TestIamPermissions method.
      id: TestIamPermissionsRequest
      properties:
        permissions:
          description: >-
            The set of permissions to check for the resource. Permissions with
            wildcards (such as * or storage.*) are not allowed. For more
            information see IAM Overview
            (https://cloud.google.com/iam/docs/overview#permissions).
          items:
            type: string
          type: array
      type: object
    TestIamPermissionsResponse:
      description: Response message for TestIamPermissions method.
      id: TestIamPermissionsResponse
      properties:
        permissions:
          description: >-
            A subset of TestPermissionsRequest.permissions that the caller is
            allowed.
          items:
            type: string
          type: array
      type: object
    UndeleteBucketRequest:
      description: The parameters to UndeleteBucket.
      id: UndeleteBucketRequest
      properties: {}
      type: object
    UpdateBucketRequest:
      description: The parameters to UpdateBucket.
      id: UpdateBucketRequest
      properties:
        bucket:
          $ref: '#/components/schemas/LogBucket'
          description: Required. The updated bucket.
        name:
          description: >-
            Required. The full resource name of the bucket to update.
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]"
            "organizations/[ORGANIZATION_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]"
            "billingAccounts/[BILLING_ACCOUNT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]"
            "folders/[FOLDER_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]"
            For example:"projects/my-project/locations/global/buckets/my-bucket"
          type: string
        updateMask:
          description: >-
            Required. Field mask that specifies the fields in bucket that need
            an update. A bucket field will be overwritten if, and only if, it is
            in the update mask. name and output only fields cannot be
            updated.For a detailed FieldMask definition, see:
            https://developers.google.com/protocol-buffers/docs/reference/google.protobuf#google.protobuf.FieldMaskFor
            example: updateMask=retention_days
          format: google-fieldmask
          type: string
      type: object
    VirtualField:
      description: >-
        A virtual field is a field that is not physically present in the
        underlying data schema, but is created through specific operations
        within the query builder model based on other fields in the schema.
      id: VirtualField
      properties:
        underlyingFieldSources:
          description: >-
            The field sources that will be used to create the virtual field,
            based on the semantics of the virtual field type.The field sources
            must follow these rules, based on the virtual field type: - For
            VIRTUAL_FIELD_TYPE_UNSPECIFIED, this field must be empty. - For
            COALESCE, this field must be non-empty and include a minimum of two
            field sources. The underlying field sources must be actual projected
            fields that represent actual schema fields and that must not be
            transformed and aggregated in any way, except for casting. The type
            of all the underlying field sources must be equivalent so that
            picking one of them would result in the same value type.
          items:
            $ref: '#/components/schemas/FieldSource'
          type: array
        virtualFieldType:
          description: Required. The type of the virtual field.
          enum:
            - VIRTUAL_FIELD_TYPE_UNSPECIFIED
            - COALESCE
          enumDescriptions:
            - Invalid value, do not use.
            - >-
              Creates a virtual field by selecting the first non-null value from
              the list of fields specified in underlying_field_sources, similar
              to a COALESCE function in SQL.
          type: string
      type: object
    WriteLogEntriesRequest:
      description: The parameters to WriteLogEntries.
      id: WriteLogEntriesRequest
      properties:
        dryRun:
          description: >-
            Optional. If true, the request should expect normal response, but
            the entries won't be persisted nor exported. Useful for checking
            whether the logging API endpoints are working properly before
            sending valuable data.
          type: boolean
        entries:
          description: >-
            Required. The log entries to send to Logging. The order of log
            entries in this list does not matter. Values supplied in this
            method's log_name, resource, and labels fields are copied into those
            log entries in this list that do not include values for their
            corresponding fields. For more information, see the LogEntry type.If
            the timestamp or insert_id fields are missing in log entries, then
            this method supplies the current time or a unique identifier,
            respectively. The supplied values are chosen so that, among the log
            entries that did not supply their own values, the entries earlier in
            the list will sort before the entries later in the list. See the
            entries.list method.Log entries with timestamps that are more than
            the logs retention period
            (https://docs.cloud.google.com/logging/quotas) in the past or more
            than 24 hours in the future will not be available when calling
            entries.list. However, those log entries can still be exported with
            LogSinks
            (https://docs.cloud.google.com/logging/docs/routing/overview).To
            improve throughput and to avoid exceeding the quota limit
            (https://docs.cloud.google.com/logging/quotas) for calls to
            entries.write, you should try to include several log entries in this
            list, rather than calling this method for each individual log entry.
          items:
            $ref: '#/components/schemas/LogEntry'
          type: array
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Default labels that are added to the labels field of all
            log entries in entries. If a log entry already has a label with the
            same key as a label in this parameter, then the log entry's label is
            not changed. See LogEntry.
          type: object
        logName:
          description: >-
            Optional. A default log resource name that is assigned to all log
            entries in entries that do not specify a value for log_name:
            projects/[PROJECT_ID]/logs/[LOG_ID]
            organizations/[ORGANIZATION_ID]/logs/[LOG_ID]
            billingAccounts/[BILLING_ACCOUNT_ID]/logs/[LOG_ID]
            folders/[FOLDER_ID]/logs/[LOG_ID][LOG_ID] must be URL-encoded. For
            example: "projects/my-project-id/logs/syslog"
            "organizations/123/logs/cloudaudit.googleapis.com%2Factivity" The
            permission logging.logEntries.create is needed on each project,
            organization, billing account, or folder that is receiving new log
            entries, whether the resource is specified in logName or in an
            individual log entry.
          type: string
        partialSuccess:
          description: >-
            Optional. Whether a batch's valid entries should be written even if
            some other entry failed due to a permanent error such as
            INVALID_ARGUMENT or PERMISSION_DENIED. If any entry failed, then the
            response status is the response status of one of the failed entries.
            The response will include error details in
            WriteLogEntriesPartialErrors.log_entry_errors keyed by the entries'
            zero-based index in the entries. Failed requests for which no
            entries are written will not include per-entry errors.
          type: boolean
        resource:
          $ref: '#/components/schemas/MonitoredResource'
          description: >-
            Optional. A default monitored resource object that is assigned to
            all log entries in entries that do not specify a value for resource.
            Example: { "type": "gce_instance", "labels": { "zone":
            "us-central1-a", "instance_id": "00000000000000000000" }} See
            LogEntry.
      type: object
    WriteLogEntriesResponse:
      description: Result returned from WriteLogEntries.
      id: WriteLogEntriesResponse
      properties: {}
      type: object
