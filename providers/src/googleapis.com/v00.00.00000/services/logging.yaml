components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AppHub:
      description: Metadata associated with App Hub.
      id: AppHub
      properties:
        application:
          $ref: '#/components/schemas/AppHubApplication'
          description: Metadata associated with the application.
        service:
          $ref: '#/components/schemas/AppHubService'
          description: Metadata associated with the service.
        workload:
          $ref: '#/components/schemas/AppHubWorkload'
          description: Metadata associated with the workload.
      type: object
    AppHubApplication:
      description: >-
        Resource identifiers associated with an AppHub application AppHub
        resources are of the form projects//locations//applications/
        projects//locations//applications//services/
        projects//locations//applications//workloads/ These resources can be
        reconstructed from the components below.
      id: AppHubApplication
      properties:
        container:
          description: >-
            Resource container that owns the application. Example:
            "projects/management_project"
          type: string
        id:
          description: 'Application Id. Example: "my-app"'
          type: string
        location:
          description: 'Location associated with the Application. Example: "us-east1"'
          type: string
      type: object
    AppHubService:
      description: Metadata associated with an App Hub service.
      id: AppHubService
      properties:
        criticalityType:
          description: 'Service criticality type Example: "CRITICAL"'
          type: string
        environmentType:
          description: 'Service environment type Example: "DEV"'
          type: string
        id:
          description: 'Service Id. Example: "my-service"'
          type: string
      type: object
    AppHubWorkload:
      description: Metadata associated with an App Hub workload.
      id: AppHubWorkload
      properties:
        criticalityType:
          description: 'Workload criticality type Example: "CRITICAL"'
          type: string
        environmentType:
          description: 'Workload environment type Example: "DEV"'
          type: string
        id:
          description: 'Workload Id. Example: "my-workload"'
          type: string
      type: object
    BigQueryDataset:
      description: Describes a BigQuery dataset that was created by a link.
      id: BigQueryDataset
      properties:
        datasetId:
          description: >-
            Output only. The full resource name of the BigQuery dataset. The
            DATASET_ID will match the ID of the link, so the link must match the
            naming restrictions of BigQuery datasets (alphanumeric characters
            and underscores only).The dataset will have a resource path of
            "bigquery.googleapis.com/projects/PROJECT_ID/datasets/DATASET_ID"
          readOnly: true
          type: string
      type: object
    BigQueryOptions:
      description: Options that change functionality of a sink exporting data to BigQuery.
      id: BigQueryOptions
      properties:
        usePartitionedTables:
          description: >-
            Optional. Whether to use BigQuery's partition tables
            (https://docs.cloud.google.com/bigquery/docs/partitioned-tables). By
            default, Cloud Logging creates dated tables based on the log
            entries' timestamps, e.g. syslog_20170523. With partitioned tables
            the date suffix is no longer present and special query syntax
            (https://docs.cloud.google.com/bigquery/docs/querying-partitioned-tables)
            has to be used instead. In both cases, tables are sharded based on
            UTC timezone.
          type: boolean
        usesTimestampColumnPartitioning:
          description: >-
            Output only. True if new timestamp column based partitioning is in
            use, false if legacy ingress-time partitioning is in use.All new
            sinks will have this field set true and will use timestamp column
            based partitioning. If use_partitioned_tables is false, this value
            has no meaning and will be false. Legacy sinks using partitioned
            tables will have this field set to false.
          readOnly: true
          type: boolean
      type: object
    Binding:
      description: Associates members, or principals, with a role.
      id: Binding
      properties:
        condition:
          $ref: '#/components/schemas/Expr'
          description: >-
            The condition that is associated with this binding.If the condition
            evaluates to true, then this binding applies to the current
            request.If the condition evaluates to false, then this binding does
            not apply to the current request. However, a different role binding
            might grant the same role to one or more of the principals in this
            binding.To learn which resources support conditions in their IAM
            policies, see the IAM documentation
            (https://cloud.google.com/iam/help/conditions/resource-policies).
        members:
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. members can have the following values: allUsers: A special
            identifier that represents anyone who is on the internet; with or
            without a Google account. allAuthenticatedUsers: A special
            identifier that represents anyone who is authenticated with a Google
            account or a service account. Does not include identities that come
            from external identity providers (IdPs) through identity federation.
            user:{emailid}: An email address that represents a specific Google
            account. For example, alice@example.com . serviceAccount:{emailid}:
            An email address that represents a Google service account. For
            example, my-other-app@appspot.gserviceaccount.com.
            serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]:
            An identifier for a Kubernetes service account
            (https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example, my-project.svc.id.goog[my-namespace/my-kubernetes-sa].
            group:{emailid}: An email address that represents a Google group.
            For example, admins@example.com. domain:{domain}: The G Suite domain
            (primary) that represents all the users of that domain. For example,
            google.com or example.com.
            principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}:
            A single identity in a workforce identity pool.
            principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}:
            All workforce identities in a group.
            principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}:
            All workforce identities with a specific attribute value.
            principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*:
            All identities in a workforce identity pool.
            principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}:
            A single identity in a workload identity pool.
            principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}:
            A workload identity pool group.
            principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}:
            All identities in a workload identity pool with a certain attribute.
            principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*:
            All identities in a workload identity pool.
            deleted:user:{emailid}?uid={uniqueid}: An email address (plus unique
            identifier) representing a user that has been recently deleted. For
            example, alice@example.com?uid=123456789012345678901. If the user is
            recovered, this value reverts to user:{emailid} and the recovered
            user retains the role in the binding.
            deleted:serviceAccount:{emailid}?uid={uniqueid}: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901.
            If the service account is undeleted, this value reverts to
            serviceAccount:{emailid} and the undeleted service account retains
            the role in the binding. deleted:group:{emailid}?uid={uniqueid}: An
            email address (plus unique identifier) representing a Google group
            that has been recently deleted. For example,
            admins@example.com?uid=123456789012345678901. If the group is
            recovered, this value reverts to group:{emailid} and the recovered
            group retains the role in the binding.
            deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}:
            Deleted single identity in a workforce identity pool. For example,
            deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value.
          items:
            type: string
          type: array
        role:
          description: >-
            Role that is assigned to the list of members, or principals. For
            example, roles/viewer, roles/editor, or roles/owner.For an overview
            of the IAM roles and permissions, see the IAM documentation
            (https://cloud.google.com/iam/docs/roles-overview). For a list of
            the available pre-defined roles, see here
            (https://cloud.google.com/iam/docs/understanding-roles).
          type: string
      type: object
    BucketMetadata:
      description: Metadata for LongRunningUpdateBucket Operations.
      id: BucketMetadata
      properties:
        createBucketRequest:
          $ref: '#/components/schemas/CreateBucketRequest'
          description: LongRunningCreateBucket RPC request.
        endTime:
          description: The end time of an operation.
          format: google-datetime
          type: string
        startTime:
          description: The create time of an operation.
          format: google-datetime
          type: string
        state:
          description: Output only. State of an operation.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - OPERATION_STATE_SCHEDULED
            - OPERATION_STATE_WAITING_FOR_PERMISSIONS
            - OPERATION_STATE_RUNNING
            - OPERATION_STATE_SUCCEEDED
            - OPERATION_STATE_FAILED
            - OPERATION_STATE_CANCELLED
            - OPERATION_STATE_PENDING
          enumDescriptions:
            - Should not be used.
            - The operation is scheduled.
            - Waiting for necessary permissions.
            - The operation is running.
            - The operation was completed successfully.
            - The operation failed.
            - The operation was cancelled by the user.
            - The operation is waiting for quota.
          readOnly: true
          type: string
        updateBucketRequest:
          $ref: '#/components/schemas/UpdateBucketRequest'
          description: LongRunningUpdateBucket RPC request.
      type: object
    BucketOptions:
      description: >-
        BucketOptions describes the bucket boundaries used to create a histogram
        for the distribution. The buckets can be in a linear sequence, an
        exponential sequence, or each bucket can be specified explicitly.
        BucketOptions does not include the number of values in each bucket.A
        bucket has an inclusive lower bound and exclusive upper bound for the
        values that are counted for that bucket. The upper bound of a bucket
        must be strictly greater than the lower bound. The sequence of N buckets
        for a distribution consists of an underflow bucket (number 0), zero or
        more finite buckets (number 1 through N - 2) and an overflow bucket
        (number N - 1). The buckets are contiguous: the lower bound of bucket i
        (i > 0) is the same as the upper bound of bucket i - 1. The buckets span
        the whole range of finite values: lower bound of the underflow bucket is
        -infinity and the upper bound of the overflow bucket is +infinity. The
        finite buckets are so-called because both bounds are finite.
      id: BucketOptions
      properties:
        explicitBuckets:
          $ref: '#/components/schemas/Explicit'
          description: The explicit buckets.
        exponentialBuckets:
          $ref: '#/components/schemas/Exponential'
          description: The exponential buckets.
        linearBuckets:
          $ref: '#/components/schemas/Linear'
          description: The linear bucket.
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    CmekSettings:
      description: >-
        Describes the customer-managed encryption key (CMEK) settings associated
        with a project, folder, organization, billing account, or flexible
        resource.Note: CMEK for the Log Router can currently only be configured
        for Google Cloud organizations. Once configured, it applies to all
        projects and folders in the Google Cloud organization.See Configure CMEK
        for Cloud Logging
        (https://docs.cloud.google.com/logging/docs/routing/managed-encryption)
        for more information.
      id: CmekSettings
      properties:
        kmsKeyName:
          description: >-
            Optional. The resource name for the configured Cloud KMS key.KMS key
            name format:
            "projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]"
            For
            example:"projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key"To
            enable CMEK for the Log Router, set this field to a valid
            kms_key_name for which the associated service account has the needed
            cloudkms.cryptoKeyEncrypterDecrypter roles assigned for the key.The
            Cloud KMS key used by the Log Router can be updated by changing the
            kms_key_name to a new valid key name or disabled by setting the key
            name to an empty string. Encryption operations that are in progress
            will be completed with the key that was in use when they started.
            Decryption operations will be completed using the key that was used
            at the time of encryption unless access to that key has been
            revoked.To disable CMEK for the Log Router, set this field to an
            empty string.See Configure CMEK for Cloud Logging
            (https://docs.cloud.google.com/logging/docs/routing/managed-encryption)
            for more information.
          type: string
        kmsKeyVersionName:
          description: >-
            Output only. The CryptoKeyVersion resource name for the configured
            Cloud KMS key.KMS key name format:
            "projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]/cryptoKeyVersions/[VERSION]"
            For
            example:"projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key/cryptoKeyVersions/1"This
            is a read-only field used to convey the specific configured
            CryptoKeyVersion of kms_key that has been configured. It will be
            populated in cases where the CMEK settings are bound to a single key
            version.If this field is populated, the kms_key is tied to a
            specific CryptoKeyVersion.
          readOnly: true
          type: string
        name:
          description: Output only. The resource name of the CMEK settings.
          readOnly: true
          type: string
        serviceAccountId:
          description: >-
            Output only. The service account that will be used by the Log Router
            to access your Cloud KMS key.Before enabling CMEK for Log Router,
            you must first assign the cloudkms.cryptoKeyEncrypterDecrypter role
            to the service account that the Log Router will use to access your
            Cloud KMS key. Use GetCmekSettings to obtain the service account
            ID.See Configure CMEK for Cloud Logging
            (https://docs.cloud.google.com/logging/docs/routing/managed-encryption)
            for more information.
          readOnly: true
          type: string
      type: object
    CopyLogEntriesMetadata:
      description: Metadata for CopyLogEntries long running operations.
      id: CopyLogEntriesMetadata
      properties:
        cancellationRequested:
          description: >-
            Identifies whether the user has requested cancellation of the
            operation.
          type: boolean
        destination:
          description: >-
            Destination to which to copy log entries.For example, a Cloud
            Storage bucket:"storage.googleapis.com/my-cloud-storage-bucket"
          type: string
        endTime:
          description: The end time of an operation.
          format: google-datetime
          type: string
        progress:
          description: Estimated progress of the operation (0 - 100%).
          format: int32
          type: integer
        request:
          $ref: '#/components/schemas/CopyLogEntriesRequest'
          deprecated: true
          description: CopyLogEntries RPC request. This field is deprecated and not used.
        source:
          description: >-
            Source from which to copy log entries.For example, a log
            bucket:"projects/my-project/locations/global/buckets/my-source-bucket"
          type: string
        startTime:
          description: The create time of an operation.
          format: google-datetime
          type: string
        state:
          description: Output only. State of an operation.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - OPERATION_STATE_SCHEDULED
            - OPERATION_STATE_WAITING_FOR_PERMISSIONS
            - OPERATION_STATE_RUNNING
            - OPERATION_STATE_SUCCEEDED
            - OPERATION_STATE_FAILED
            - OPERATION_STATE_CANCELLED
            - OPERATION_STATE_PENDING
          enumDescriptions:
            - Should not be used.
            - The operation is scheduled.
            - Waiting for necessary permissions.
            - The operation is running.
            - The operation was completed successfully.
            - The operation failed.
            - The operation was cancelled by the user.
            - The operation is waiting for quota.
          readOnly: true
          type: string
        verb:
          description: Name of the verb executed by the operation.For example,"copy"
          type: string
        writerIdentity:
          description: >-
            The IAM identity of a service account that must be granted access to
            the destination.If the service account is not granted permission to
            the destination within an hour, the operation will be cancelled.For
            example: "serviceAccount:foo@bar.com"
          type: string
      type: object
    CopyLogEntriesRequest:
      description: The parameters to CopyLogEntries.
      id: CopyLogEntriesRequest
      properties:
        destination:
          description: >-
            Required. Destination to which to copy log entries. For example:
            "storage.googleapis.com/GCS_BUCKET"
          type: string
        filter:
          description: >-
            Optional. A filter specifying which log entries to copy. The filter
            must be no more than 20k characters. An empty filter matches all log
            entries.
          type: string
        name:
          description: >-
            Required. Log bucket from which to copy log entries.For
            example:"projects/my-project/locations/global/buckets/my-source-bucket"
          type: string
      type: object
    CopyLogEntriesResponse:
      description: Response type for CopyLogEntries long running operations.
      id: CopyLogEntriesResponse
      properties:
        logEntriesCopiedCount:
          description: Number of log entries copied.
          format: int64
          type: string
      type: object
    CreateBucketRequest:
      description: The parameters to CreateBucket.
      id: CreateBucketRequest
      properties:
        bucket:
          $ref: '#/components/schemas/LogBucket'
          description: >-
            Required. The new bucket. The region specified in the new bucket
            must be compliant with any Location Restriction Org Policy. The name
            field in the bucket is ignored.
        bucketId:
          description: >-
            Required. A client-assigned identifier such as "my-bucket".
            Identifiers are limited to 100 characters and can include only
            letters, digits, underscores, hyphens, and periods. Bucket
            identifiers must start with an alphanumeric character.
          type: string
        parent:
          description: >-
            Required. The resource in which to create the log bucket:
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]" For
            example:"projects/my-project/locations/global"
          type: string
      type: object
    CreateLinkRequest:
      description: The parameters to CreateLink.
      id: CreateLinkRequest
      properties:
        link:
          $ref: '#/components/schemas/Link'
          description: Required. The new link.
        linkId:
          description: >-
            Required. The ID to use for the link. The link_id can have up to 100
            characters. A valid link_id must only have alphanumeric characters
            and underscores within it.
          type: string
        parent:
          description: >-
            Required. The full resource name of the bucket to create a link for.
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]" 
          type: string
      type: object
    DefaultSinkConfig:
      description: >-
        Describes the custom _Default sink configuration that is used to
        override the built-in _Default sink configuration in newly created
        resource containers, such as projects or folders.
      id: DefaultSinkConfig
      properties:
        exclusions:
          description: >-
            Optional. Specifies the set of exclusions to be added to the
            _Default sink in newly created resource containers.
          items:
            $ref: '#/components/schemas/LogExclusion'
          type: array
        filter:
          description: >-
            Optional. An advanced logs filter
            (https://docs.cloud.google.com/logging/docs/view/building-queries#queries-by-expression).
            The only exported log entries are those that are in the resource
            owning the sink and that match the filter.For
            example:logName="projects/[PROJECT_ID]/logs/[LOG_ID]" AND
            severity>=ERRORTo match all logs, don't add exclusions and use the
            following line as the value of filter:logName:*Cannot be empty or
            unset when the value of mode is OVERWRITE.
          type: string
        mode:
          description: >-
            Required. Determines the behavior to apply to the built-in _Default
            sink inclusion filter.Exclusions are always appended, as built-in
            _Default sinks have no exclusions.
          enum:
            - FILTER_WRITE_MODE_UNSPECIFIED
            - APPEND
            - OVERWRITE
          enumDescriptions:
            - >-
              The filter's write mode is unspecified. This mode must not be
              used.
            - >-
              The contents of filter will be appended to the built-in _Default
              sink filter. Using the append mode with an empty filter will keep
              the sink inclusion filter unchanged.
            - >-
              The contents of filter will overwrite the built-in _Default sink
              filter.
          type: string
      type: object
    DeleteLinkRequest:
      description: The parameters to DeleteLink.
      id: DeleteLinkRequest
      properties:
        name:
          description: >-
            Required. The full resource name of the link to delete.
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "organizations/[ORGANIZATION_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "billingAccounts/[BILLING_ACCOUNT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "folders/[FOLDER_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]" 
          type: string
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); } 
      id: Empty
      properties: {}
      type: object
    Explicit:
      description: >-
        Specifies a set of buckets with arbitrary widths.There are size(bounds)
        + 1 (= N) buckets. Bucket i has the following boundaries:Upper bound (0
        <= i < N-1): boundsi Lower bound (1 <= i < N); boundsi - 1The bounds
        field must contain at least one element. If bounds has only one element,
        then there are no finite buckets, and that single element is the common
        boundary of the overflow and underflow buckets.
      id: Explicit
      properties:
        bounds:
          description: The values must be monotonically increasing.
          items:
            format: double
            type: number
          type: array
      type: object
    Exponential:
      description: >-
        Specifies an exponential sequence of buckets that have a width that is
        proportional to the value of the lower bound. Each bucket represents a
        constant relative uncertainty on a specific value in the bucket.There
        are num_finite_buckets + 2 (= N) buckets. Bucket i has the following
        boundaries:Upper bound (0 <= i < N-1): scale * (growth_factor ^ i).Lower
        bound (1 <= i < N): scale * (growth_factor ^ (i - 1)).
      id: Exponential
      properties:
        growthFactor:
          description: Must be greater than 1.
          format: double
          type: number
        numFiniteBuckets:
          description: Must be greater than 0.
          format: int32
          type: integer
        scale:
          description: Must be greater than 0.
          format: double
          type: number
      type: object
    Expr:
      description: >-
        Represents a textual expression in the Common Expression Language (CEL)
        syntax. CEL is a C-like expression language. The syntax and semantics of
        CEL are documented at https://github.com/google/cel-spec.Example
        (Comparison): title: "Summary size limit" description: "Determines if a
        summary is less than 100 chars" expression: "document.summary.size() <
        100" Example (Equality): title: "Requestor is owner" description:
        "Determines if requestor is the document owner" expression:
        "document.owner == request.auth.claims.email" Example (Logic): title:
        "Public documents" description: "Determine whether the document should
        be publicly visible" expression: "document.type != 'private' &&
        document.type != 'internal'" Example (Data Manipulation): title:
        "Notification string" description: "Create a notification string with a
        timestamp." expression: "'New message received at ' +
        string(document.create_time)" The exact variables and functions that may
        be referenced within an expression are determined by the service that
        evaluates it. See the service documentation for additional information.
      id: Expr
      properties:
        description:
          description: >-
            Optional. Description of the expression. This is a longer text which
            describes the expression, e.g. when hovered over it in a UI.
          type: string
        expression:
          description: >-
            Textual representation of an expression in Common Expression
            Language syntax.
          type: string
        location:
          description: >-
            Optional. String indicating the location of the expression for error
            reporting, e.g. a file name and a position in the file.
          type: string
        title:
          description: >-
            Optional. Title for the expression, i.e. a short string describing
            its purpose. This can be used e.g. in UIs which allow to enter the
            expression.
          type: string
      type: object
    FieldSource:
      description: >-
        A source that can be used to represent a "field of data" within various
        parts of a structured query, such as in SELECT, WHERE, or ORDER BY
        clauses. The term "field of data" is used here because it is not limited
        to literal fields in the underlying data schema.
      id: FieldSource
      properties:
        aliasRef:
          description: >-
            The alias name for a field that has already been aliased within a
            different ProjectedField type elsewhere in the query model. The
            alias must be defined in the QueryBuilderConfig's field_sources
            list, otherwise the model is invalid.
          type: string
        columnType:
          description: >-
            The type of the selected field. This comes from the schema. Can be
            one of the BigQuery data types: - STRING - INT64 - FLOAT64 - BOOL -
            TIMESTAMP - DATE - RECORD - JSON
          type: string
        field:
          description: >-
            The fully qualified, dot-delimited path to the selected atomic field
            (the leaf value). This path is used for primary selection and
            actions like drill-down or projection.The path components should
            match the exact field names or keys as they appear in the underlying
            data schema. For JSON fields, this means respecting the original
            casing (e.g., camelCase or snake_case as present in the JSON).To
            reference field names containing special characters (e.g., hyphens,
            spaces), enclose the individual path segment in backticks
            (`).Examples: * json_payload.labels.message *
            json_payload.request_id * httpRequest.status *
            json_payload.\my-custom-field`.value *jsonPayload.`my key with
            spaces`.data`
          type: string
        isJson:
          description: >-
            Whether the field is a JSON field, or has a parent that is a JSON
            field. This value is used to determine JSON extractions in generated
            SQL queries. Note that this is_json flag may be true when the
            column_type is not JSON if the parent is a JSON field. Ex: - A
            json_payload.message field might have is_json=true, since the
            'json_payload' parent is of type JSON, and columnType='STRING' if
            the 'message' field is of type STRING.
          type: boolean
        parentPath:
          description: >-
            The dot-delimited path of the parent container that holds the target
            field.This path defines the structural hierarchy and is essential
            for correctly generating SQL when field keys contain special
            characters (e.g., dots or brackets).Example: json_payload.labels
            (This points to the 'labels' object). This is an empty string if the
            target field is at the root level.
          type: string
        projectedField:
          $ref: '#/components/schemas/ProjectedField'
          description: >-
            A projected field option for when a user wants to use a field with
            some additional transformations such as casting or extractions.
      type: object
    FilterExpression:
      description: >-
        This is a leaf of the FilterPredicate. Ex: { field:
        json_payload.message.error_code, filter_value: {numeric_value: 400},
        comparator: EQUAL_TO} The field will be schema field that is selected
        using the . annotation to display the drill down value. The value will
        be the user inputted text that the filter is comparing against.
      id: FilterExpression
      properties:
        comparator:
          description: The comparison type to use for the filter.
          enum:
            - COMPARATOR_UNSPECIFIED
            - EQUALS
            - MATCHES_REGEXP
            - GREATER_THAN
            - LESS_THAN
            - GREATER_THAN_EQUALS
            - LESS_THAN_EQUALS
            - IS_NULL
            - IN
            - LIKE
          enumDescriptions:
            - Invalid value, do not use.
            - The value is equal to the inputted value.
            - The value is equal to the inputted regex value.
            - The value is greater than the inputted value.
            - The value is less than the inputted value.
            - The value is greater than or equal to the inputted value.
            - The value is less than or equal to the inputted value.
            - >-
              Requires the filter_value to be a Value type with null_value set
              to true.
            - The value is in the inputted array value.
            - The value is like the inputted value.
          type: string
        fieldSource:
          $ref: '#/components/schemas/FieldSource'
          description: >-
            Can be one of the FieldSource types: field name, alias ref, variable
            ref, or a literal value.
        fieldSourceValue:
          $ref: '#/components/schemas/FieldSource'
          description: >-
            The field. This will be the field that is set as the Right Hand Side
            of the filter.
        isNegation:
          description: Determines if the NOT flag should be added to the comparator.
          type: boolean
        literalValue:
          description: >-
            The Value will be used to hold user defined constants set as the
            Right Hand Side of the filter.
          type: any
      type: object
    FilterPredicate:
      description: A filter for a query. This equates to the WHERE clause in SQL.
      id: FilterPredicate
      properties:
        childPredicates:
          description: >-
            The children of the filter predicate. This equates to the branches
            of the filter predicate that could contain further nested leaves.
          items:
            $ref: '#/components/schemas/FilterPredicate'
          type: array
        leafPredicate:
          $ref: '#/components/schemas/FilterExpression'
          description: >-
            The leaves of the filter predicate. This equates to the last leaves
            of the filter predicate associated with an operator.
        operatorType:
          description: >-
            The operator type for the filter. Currently there is no support for
            multiple levels of nesting, so this will be a single value with no
            joining of different operator types
          enum:
            - OPERATOR_TYPE_UNSPECIFIED
            - AND
            - OR
            - LEAF
          enumDescriptions:
            - Invalid value, do not use.
            - AND will be the default operator type.
            - OR operator type.
            - LEAF operator type.
          type: string
      type: object
    FunctionApplication:
      description: >-
        Defines the aggregation function to apply to this field. This message is
        used only when operation is set to AGGREGATE.
      id: FunctionApplication
      properties:
        parameters:
          description: >-
            Optional. Parameters to be applied to the aggregation. Aggregations
            that support or require parameters are listed above.
          items:
            type: any
          type: array
        type:
          description: >-
            Required. Specifies the aggregation function. Use one of the
            following string identifiers: "average": Computes the average (AVG).
            Applies only to numeric values. "count": Counts the number of values
            (COUNT). "count-distinct": Counts the number of distinct values
            (COUNT DISTINCT). "count-distinct-approx": Approximates the count of
            distinct values (APPROX_COUNT_DISTINCT). "max": Finds the maximum
            value (MAX). Applies only to numeric values. "min": Finds the
            minimum value (MIN). Applies only to numeric values. "sum": Computes
            the sum (SUM). Applies only to numeric values.
          type: string
      type: object
    GetIamPolicyRequest:
      description: Request message for GetIamPolicy method.
      id: GetIamPolicyRequest
      properties:
        options:
          $ref: '#/components/schemas/GetPolicyOptions'
          description: >-
            OPTIONAL: A GetPolicyOptions object for specifying options to
            GetIamPolicy.
      type: object
    GetPolicyOptions:
      description: Encapsulates settings provided to GetIamPolicy.
      id: GetPolicyOptions
      properties:
        requestedPolicyVersion:
          description: >-
            Optional. The maximum policy version that will be used to format the
            policy.Valid values are 0, 1, and 3. Requests specifying an invalid
            value will be rejected.Requests for policies with any conditional
            role bindings must specify version 3. Policies with no conditional
            role bindings may specify any valid value or leave the field
            unset.The policy in the response might use the policy version that
            you specified, or it might use a lower policy version. For example,
            if you specify version 3, but the policy has no conditional role
            bindings, the response uses version 1.To learn which resources
            support conditions in their IAM policies, see the IAM documentation
            (https://cloud.google.com/iam/help/conditions/resource-policies).
          format: int32
          type: integer
      type: object
    HttpRequest:
      description: >-
        A common proto for logging HTTP requests. Only contains semantics
        defined by the HTTP specification. Product-specific logging information
        MUST be defined in a separate message.
      id: HttpRequest
      properties:
        cacheFillBytes:
          description: >-
            The number of HTTP response bytes inserted into cache. Set only when
            a cache fill was attempted.
          format: int64
          type: string
        cacheHit:
          description: >-
            Whether or not an entity was served from cache (with or without
            validation).
          type: boolean
        cacheLookup:
          description: Whether or not a cache lookup was attempted.
          type: boolean
        cacheValidatedWithOriginServer:
          description: >-
            Whether or not the response was validated with the origin server
            before being served from cache. This field is only meaningful if
            cache_hit is True.
          type: boolean
        latency:
          description: >-
            The request processing latency on the server, from the time the
            request was received until the response was sent. For WebSocket
            connections, this field refers to the entire time duration of the
            connection.
          format: google-duration
          type: string
        protocol:
          description: 'Protocol used for the request. Examples: "HTTP/1.1", "HTTP/2"'
          type: string
        referer:
          description: >-
            The referer URL of the request, as defined in HTTP/1.1 Header Field
            Definitions
            (https://datatracker.ietf.org/doc/html/rfc2616#section-14.36).
          type: string
        remoteIp:
          description: >-
            The IP address (IPv4 or IPv6) of the client that issued the HTTP
            request. This field can include port information. Examples:
            "192.168.1.1", "10.0.0.1:80", "FE80::0202:B3FF:FE1E:8329".
          type: string
        requestMethod:
          description: 'The request method. Examples: "GET", "HEAD", "PUT", "POST".'
          type: string
        requestSize:
          description: >-
            The size of the HTTP request message in bytes, including the request
            headers and the request body.
          format: int64
          type: string
        requestUrl:
          description: >-
            The scheme (http, https), the host name, the path and the query
            portion of the URL that was requested. Example:
            "http://example.com/some/info?color=red".
          type: string
        responseSize:
          description: >-
            The size of the HTTP response message sent back to the client, in
            bytes, including the response headers and the response body.
          format: int64
          type: string
        serverIp:
          description: >-
            The IP address (IPv4 or IPv6) of the origin server that the request
            was sent to. This field can include port information. Examples:
            "192.168.1.1", "10.0.0.1:80", "FE80::0202:B3FF:FE1E:8329".
          type: string
        status:
          description: >-
            The response code indicating the status of response. Examples: 200,
            404.
          format: int32
          type: integer
        userAgent:
          description: >-
            The user agent sent by the client. Example: "Mozilla/4.0
            (compatible; MSIE 6.0; Windows 98; Q312461; .NET CLR 1.0.3705)".
          type: string
      type: object
    IndexConfig:
      description: Configuration for an indexed field.
      id: IndexConfig
      properties:
        createTime:
          description: >-
            Output only. The timestamp when the index was last modified.This is
            used to return the timestamp, and will be ignored if supplied during
            update.
          format: google-datetime
          readOnly: true
          type: string
        fieldPath:
          description: >-
            Required. The LogEntry field path to index.Note that some paths are
            automatically indexed, and other paths are not eligible for
            indexing. See indexing documentation(
            https://docs.cloud.google.com/logging/docs/analyze/custom-index) for
            details.For example: jsonPayload.request.status
          type: string
        type:
          description: Required. The type of data in this index.
          enum:
            - INDEX_TYPE_UNSPECIFIED
            - INDEX_TYPE_STRING
            - INDEX_TYPE_INTEGER
          enumDescriptions:
            - The index's type is unspecified.
            - The index is a string-type index.
            - The index is a integer-type index.
          type: string
      type: object
    LabelDescriptor:
      description: A description of a label.
      id: LabelDescriptor
      properties:
        description:
          description: A human-readable description for the label.
          type: string
        key:
          description: The label key.
          type: string
        valueType:
          description: The type of data that can be assigned to the label.
          enum:
            - STRING
            - BOOL
            - INT64
          enumDescriptions:
            - A variable-length string. This is the default.
            - Boolean; true or false.
            - A 64-bit signed integer.
          type: string
      type: object
    Linear:
      description: >-
        Specifies a linear sequence of buckets that all have the same width
        (except overflow and underflow). Each bucket represents a constant
        absolute uncertainty on the specific value in the bucket.There are
        num_finite_buckets + 2 (= N) buckets. Bucket i has the following
        boundaries:Upper bound (0 <= i < N-1): offset + (width * i).Lower bound
        (1 <= i < N): offset + (width * (i - 1)).
      id: Linear
      properties:
        numFiniteBuckets:
          description: Must be greater than 0.
          format: int32
          type: integer
        offset:
          description: Lower bound of the first bucket.
          format: double
          type: number
        width:
          description: Must be greater than 0.
          format: double
          type: number
      type: object
    Link:
      description: Describes a link connected to an analytics enabled bucket.
      id: Link
      properties:
        bigqueryDataset:
          $ref: '#/components/schemas/BigQueryDataset'
          description: >-
            Optional. The information of a BigQuery Dataset. When a link is
            created, a BigQuery dataset is created along with it, in the same
            project as the LogBucket it's linked to. This dataset will also have
            BigQuery Views corresponding to the LogViews in the bucket.
        createTime:
          description: Output only. The creation timestamp of the link.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. Describes this link.The maximum length of the description
            is 8000 characters.
          type: string
        lifecycleState:
          description: Output only. The resource lifecycle state.
          enum:
            - LIFECYCLE_STATE_UNSPECIFIED
            - ACTIVE
            - DELETE_REQUESTED
            - UPDATING
            - CREATING
            - FAILED
          enumDescriptions:
            - >-
              Unspecified state. This is only used/useful for distinguishing
              unset values.
            - The normal and active state.
            - >-
              The resource has been marked for deletion by the user. For some
              resources (e.g. buckets), this can be reversed by an un-delete
              operation.
            - >-
              The resource has been marked for an update by the user. It will
              remain in this state until the update is complete.
            - >-
              The resource has been marked for creation by the user. It will
              remain in this state until the creation is complete.
            - The resource is in an INTERNAL error state.
          readOnly: true
          type: string
        name:
          description: >-
            Output only. The resource name of the link. The name can have up to
            100 characters. A valid link id (at the end of the link name) must
            only have alphanumeric characters and underscores within it.
            "projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "organizations/[ORGANIZATION_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "billingAccounts/[BILLING_ACCOUNT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            "folders/[FOLDER_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/links/[LINK_ID]"
            For
            example:`projects/my-project/locations/global/buckets/my-bucket/links/my_link
          readOnly: true
          type: string
      type: object
    LinkMetadata:
      description: Metadata for long running Link operations.
      id: LinkMetadata
      properties:
        createLinkRequest:
          $ref: '#/components/schemas/CreateLinkRequest'
          description: CreateLink RPC request.
        deleteLinkRequest:
          $ref: '#/components/schemas/DeleteLinkRequest'
          description: DeleteLink RPC request.
        endTime:
          description: The end time of an operation.
          format: google-datetime
          type: string
        startTime:
          description: The start time of an operation.
          format: google-datetime
          type: string
        state:
          description: Output only. State of an operation.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - OPERATION_STATE_SCHEDULED
            - OPERATION_STATE_WAITING_FOR_PERMISSIONS
            - OPERATION_STATE_RUNNING
            - OPERATION_STATE_SUCCEEDED
            - OPERATION_STATE_FAILED
            - OPERATION_STATE_CANCELLED
            - OPERATION_STATE_PENDING
          enumDescriptions:
            - Should not be used.
            - The operation is scheduled.
            - Waiting for necessary permissions.
            - The operation is running.
            - The operation was completed successfully.
            - The operation failed.
            - The operation was cancelled by the user.
            - The operation is waiting for quota.
          readOnly: true
          type: string
      type: object
    ListBucketsResponse:
