    PasswordStatus:
      description: Read-only password status.
      id: PasswordStatus
      properties:
        locked:
          description: If true, user does not have login privileges.
          type: boolean
        passwordExpirationTime:
          description: The expiration time of the current password.
          format: google-datetime
          type: string
      type: object
    PasswordValidationPolicy:
      description: >-
        Database instance local user password validation policy. This message
        defines the password policy for local database users. When enabled, it
        enforces constraints on password complexity, length, and reuse. Keep
        this policy enabled to help prevent unauthorized access.
      id: PasswordValidationPolicy
      properties:
        complexity:
          description: The complexity of the password.
          enum:
            - COMPLEXITY_UNSPECIFIED
            - COMPLEXITY_DEFAULT
          enumDescriptions:
            - Complexity check is not specified.
            - >-
              A combination of lowercase, uppercase, numeric, and
              non-alphanumeric characters.
          type: string
        disallowCompromisedCredentials:
          deprecated: true
          description: >-
            This field is deprecated and will be removed in a future version of
            the API.
          type: boolean
        disallowUsernameSubstring:
          description: Disallow username as a part of the password.
          type: boolean
        enablePasswordPolicy:
          description: >-
            Whether to enable the password policy or not. When enabled,
            passwords must meet complexity requirements. Keep this policy
            enabled to help prevent unauthorized access. Disabling this policy
            allows weak passwords.
          type: boolean
        minLength:
          description: Minimum number of characters allowed.
          format: int32
          type: integer
        passwordChangeInterval:
          description: >-
            Minimum interval after which the password can be changed. This flag
            is only supported for PostgreSQL.
          format: google-duration
          type: string
        reuseInterval:
          description: Number of previous passwords that cannot be reused.
          format: int32
          type: integer
      type: object
    PerformDiskShrinkContext:
      description: Perform disk shrink context.
      id: PerformDiskShrinkContext
      properties:
        targetSizeGb:
          description: The target disk shrink size in GigaBytes.
          format: int64
          type: string
      type: object
    PerformanceCaptureConfig:
      description: Performance capture configuration.
      id: PerformanceCaptureConfig
      properties:
        cpuUtilizationThresholdPercent:
          description: >-
            Optional. Specifies the minimum percentage of CPU utilization to
            trigger the performance capture. Valid integers range from `10` to
            `99`. Enter `0` to disable the check.
          format: int32
          type: integer
        enabled:
          description: Optional. Enables or disables the performance capture feature.
          type: boolean
        historyListLengthThresholdCount:
          description: >-
            Optional. Specifies the minimum number of undo log entries in the
            history list length to trigger the performance capture. Valid
            integers range from `10000` to `10000000`. Enter `0` to disable the
            check.
          format: int32
          type: integer
        memoryUsageThresholdPercent:
          description: >-
            Optional. Specifies the minimum percentage of memory usage to
            trigger the performance capture. Valid integers range from `10` to
            `99`. Enter `0` to disable the check.
          format: int32
          type: integer
        probeThreshold:
          description: >-
            Optional. Specifies the minimum number of consecutive probe
            threshold that triggers performance capture.
          format: int32
          type: integer
        probingIntervalSeconds:
          description: >-
            Optional. Specifies the interval in seconds between consecutive
            probes that check if any trigger condition thresholds have been
            reached.
          format: int32
          type: integer
        runningThreadsThreshold:
          description: >-
            Optional. Specifies the minimum number of MySQL `Threads_running` to
            trigger the performance capture on the primary instance.
          format: int32
          type: integer
        secondsBehindSourceThreshold:
          description: >-
            Optional. Specifies the minimum number of seconds replica must be
            lagging behind primary instance to trigger the performance capture
            on replica.
          format: int32
          type: integer
        semaphoreWaitThresholdCount:
          description: >-
            Optional. Specifies the minimum allowed number of semaphore waits to
            trigger the performance capture. Valid integers range from `10` to
            `10000`. Enter `0` to disable the check.
          format: int32
          type: integer
        transactionDurationThreshold:
          description: >-
            Optional. Specifies the amount of time in seconds that a transaction
            needs to have been open before the watcher starts recording it.
          format: int32
          type: integer
        transactionKillExcludedUserHosts:
          description: >-
            Optional. Specifies a customer-defined list of users to exclude from
            transaction termination. Entries can be in the format 'user@host' or
            just 'user'. A standalone 'user' implies 'user@%', excluding the
            user from any host. Wildcard '%' is allowed in the host part of the
            'user@host' format. Example: `["app_user", "db_admin@10.1.2.3",
            "report_user@%"]`
          items:
            type: string
          type: array
        transactionKillThresholdSeconds:
          description: >-
            Optional. Specifies the amount of time in seconds that a transaction
            needs to have been open before the watcher starts terminating it.
            Valid integers range from `60` to `604800` (7 days). Enter `0` to
            disable. If enabled (i.e., > 0), this value must be greater than or
            equal to `transaction_duration_threshold`. Configurations where `0 <
            transaction_kill_threshold_seconds < transaction_duration_threshold`
            will be rejected.
          format: int32
          type: integer
        transactionKillType:
          description: >-
            Optional. Determines which transactions are allowed to be terminated
            when they exceed `transaction_kill_threshold_seconds`. This allows
            protecting write-heavy transactions from auto-termination if
            desired. Defaults to `READ_ONLY_TRANSACTIONS` if unspecified.
          enum:
            - TRANSACTION_KILL_TYPE_UNSPECIFIED
            - READ_ONLY_TRANSACTIONS
            - ALL_TRANSACTIONS
          enumDescriptions:
            - Unspecified.
            - Only read-only transactions are eligible for termination.
            - >-
              All transactions are eligible for termination, including those
              with write operations (such as INSERT, UPDATE, DELETE, or DDL).
          type: string
        transactionLockWaitThresholdCount:
          description: >-
            Optional. Specifies the minimum allowed number of transactions in
            lock wait state to trigger the performance capture. Valid integers
            range from `10` to `10000`. Enter `0` to disable the check.
          format: int32
          type: integer
      type: object
    PointInTimeRestoreContext:
      description: >-
        The context to perform a point-in-time recovery of an instance managed
        by Backup and Disaster Recovery (DR) Service.
      id: PointInTimeRestoreContext
      properties:
        allocatedIpRange:
          description: >-
            Optional. The name of the allocated IP range for the internal IP
            Cloud SQL instance. For example: "google-managed-services-default".
            If you set this, then Cloud SQL creates the IP address for the
            cloned instance in the allocated range. This range must comply with
            [RFC 1035](https://tools.ietf.org/html/rfc1035) standards.
            Specifically, the name must be 1-63 characters long and match the
            regular expression [a-z]([-a-z0-9]*[a-z0-9])?. Reserved for future
            use.
          type: string
        datasource:
          description: >-
            The Backup and Disaster Recovery (DR) Service Datasource URI.
            Format:
            projects/{project}/locations/{region}/backupVaults/{backupvault}/dataSources/{datasource}.
          type: string
        pointInTime:
          description: >-
            Required. The date and time to which you want to restore the
            instance.
          format: google-datetime
          type: string
        preferredSecondaryZone:
          description: >-
            Optional. Point-in-time recovery of a regional instance in the
            specified zones. If not specified, clone to the same secondary zone
            as the source instance. This value cannot be the same as the
            preferred_zone field.
          type: string
        preferredZone:
          description: >-
            Optional. Point-in-time recovery of an instance to the specified
            zone. If no zone is specified, then clone to the same primary zone
            as the source instance.
          type: string
        privateNetwork:
          description: >-
            Optional. The resource link for the VPC network from which the Cloud
            SQL instance is accessible for private IP. For example,
            `/projects/myProject/global/networks/default`.
          type: string
        region:
          description: >-
            Optional. The region of the target instance where the datasource
            will be restored. For example: "us-central1".
          type: string
        targetInstance:
          description: Target instance name.
          type: string
        targetInstanceClearSettingsFieldNames:
          description: >-
            Optional. Specifies the instance settings that will be cleared from
            the source instance. This field is only applicable for cross project
            PITRs.
          items:
            type: string
          type: array
        targetInstanceSettings:
          $ref: '#/components/schemas/DatabaseInstance'
          description: >-
            Optional. Specifies the instance settings that will be overridden
            from the source instance. This field is only applicable for cross
            project PITRs.
      type: object
