          type: string
        iamStatus:
          description: >-
            Indicates if a group is active or inactive for IAM database
            authentication.
          enum:
            - IAM_STATUS_UNSPECIFIED
            - INACTIVE
            - ACTIVE
          enumDescriptions:
            - >-
              The default value for users that are not of type CLOUD_IAM_GROUP.
              Only CLOUD_IAM_GROUP users will be inactive or active. Users with
              an IamStatus of IAM_STATUS_UNSPECIFIED will not display whether
              they are active or inactive as that is not applicable to them.
            - >-
              INACTIVE indicates a group is not available for IAM database
              authentication.
            - >-
              ACTIVE indicates a group is available for IAM database
              authentication.
          type: string
        instance:
          description: >-
            The name of the Cloud SQL instance. This does not include the
            project ID. Can be omitted for `update` because it is already
            specified on the URL.
          type: string
        kind:
          description: This is always `sql#user`.
          type: string
        name:
          description: >-
            The name of the user in the Cloud SQL instance. Can be omitted for
            `update` because it is already specified in the URL.
          type: string
        password:
          description: The password for the user.
          type: string
