          description: >-
            Output only. This output contains the encryption status for a backup
            and the version of the KMS key that's used to encrypt the Cloud SQL
            instance.
          readOnly: true
          type: string
        location:
          description: >-
            The storage location of the backups. The location can be
            multi-regional.
          type: string
