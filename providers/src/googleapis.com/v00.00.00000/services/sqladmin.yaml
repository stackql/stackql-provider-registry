          enum:
            - BUILT_IN
            - CLOUD_IAM_USER
            - CLOUD_IAM_SERVICE_ACCOUNT
            - CLOUD_IAM_GROUP
            - CLOUD_IAM_GROUP_USER
            - CLOUD_IAM_GROUP_SERVICE_ACCOUNT
            - CLOUD_IAM_WORKFORCE_IDENTITY
            - ENTRAID_USER
          enumDescriptions:
            - The database's built-in user type.
            - Cloud IAM user.
            - Cloud IAM service account.
            - Cloud IAM group. Not used for login.
            - Read-only. Login for a user that belongs to the Cloud IAM group.
            - >-
              Read-only. Login for a service account that belongs to the Cloud
              IAM group.
            - >-
              Cloud IAM workforce identity user managed via workforce identity
              federation.
            - Microsoft Entra ID user.
          type: string
      type: object
