        backupReencryptionConfig:
          description: Configuration specific to backup re-encryption
          $ref: '#/components/schemas/BackupReencryptionConfig'
      type: object
    Row:
      properties:
        values:
          items:
            $ref: '#/components/schemas/Value'
          type: array
          description: The values for the row.
      type: object
      id: Row
