openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Notebooks API
  description: Notebooks API is used to manage notebook resources in Google Cloud.
  version: v2
  x-discovery-doc-revision: '20260530'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/notebooks/docs/
servers:
  - url: https://notebooks.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    UpgradeInstanceSystemRequest:
      description: Request for upgrading a notebook instance from within the VM
      properties:
        vmId:
          description: >-
            Required. The VM hardware token for authenticating the VM.
            https://cloud.google.com/compute/docs/instances/verifying-instance-identity
          type: string
      type: object
      id: UpgradeInstanceSystemRequest
    DefaultValues:
      id: DefaultValues
      type: object
      description: DefaultValues represents the default configuration values.
      properties:
        machineType:
          description: >-
            Output only. The default machine type used by the backend if not
            provided by the user.
          readOnly: true
          type: string
    GenerateAccessTokenRequest:
      type: object
      id: GenerateAccessTokenRequest
      description: Request message for generating an EUC for the instance owner.
      properties:
        vmToken:
          type: string
          description: >-
            Required. The VM identity token (a JWT) for authenticating the VM.
            https://cloud.google.com/compute/docs/instances/verifying-instance-identity
    StartInstanceRequest:
      description: Request for starting a notebook instance
      properties: {}
      id: StartInstanceRequest
      type: object
    Config:
      id: Config
      type: object
      description: Response for getting WbI configurations in a location
      properties:
        supportedValues:
          description: Output only. The supported values for configuration.
          readOnly: true
          $ref: '#/components/schemas/SupportedValues'
        availableImages:
          type: array
          items:
            $ref: '#/components/schemas/ImageRelease'
          description: Output only. The list of available images to create a WbI.
          readOnly: true
        defaultValues:
          description: Output only. The default values for configuration.
          readOnly: true
          $ref: '#/components/schemas/DefaultValues'
        disableWorkbenchLegacyCreation:
          description: >-
            Output only. Flag to disable the creation of legacy Workbench
            notebooks (User-managed notebooks and Google-managed notebooks).
          readOnly: true
          type: boolean
    ContainerImage:
      description: >-
        Definition of a container image for starting a notebook instance with
        the environment installed in a container.
      properties:
        repository:
          description: >-
            Required. The path to the container image repository. For example:
            `gcr.io/{project_id}/{image_name}`
          type: string
        tag:
          type: string
          description: >-
            Optional. The tag of the container image. If not specified, this
            defaults to the latest tag.
      type: object
      id: ContainerImage
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      properties:
        response:
          type: object
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        metadata:
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        done:
          type: boolean
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
      id: Operation
      type: object
    AccessConfig:
      type: object
      id: AccessConfig
      description: An access configuration attached to an instance's network interface.
      properties:
        externalIp:
          type: string
          description: >-
            An external IP address associated with this instance. Specify an
            unused static external IP address available to the project or leave
            this field undefined to use an IP from a shared ephemeral IP address
            pool. If you specify a static external IP address, it must live in
            the same region as the zone of the instance.
    ResizeDiskRequest:
      description: Request for resizing the notebook instance disks
      properties:
        dataDisk:
          description: >-
            Required. The data disk to be resized. Only disk_size_gb will be
            used.
          $ref: '#/components/schemas/DataDisk'
        bootDisk:
          description: >-
            Required. The boot disk to be resized. Only disk_size_gb will be
            used.
          $ref: '#/components/schemas/BootDisk'
      id: ResizeDiskRequest
      type: object
    GenerateAccessTokenResponse:
      id: GenerateAccessTokenResponse
      type: object
      description: Response message for generating an EUC for the instance owner.
      properties:
        expires_in:
          description: >-
            The time in seconds when the access token expires. Typically that's
            3600.
          type: integer
          format: int32
        token_type:
          description: >-
            Type of the returned access token (e.g. "Bearer"). It specifies how
            the token must be used. Bearer tokens may be used by any entity
            without proof of identity.
          type: string
        access_token:
          description: >-
            Short-lived access token string which may be used to access Google
            APIs.
          type: string
        scope:
          type: string
          description: >-
            Space-separated list of scopes contained in the returned token.
            https://cloud.google.com/docs/authentication/token-types#access-contents
    SetIamPolicyRequest:
      id: SetIamPolicyRequest
      type: object
      description: Request message for `SetIamPolicy` method.
      properties:
        policy:
          description: >-
            REQUIRED: The complete policy to be applied to the `resource`. The
            size of the policy is limited to a few 10s of KB. An empty policy is
            a valid policy but certain Google Cloud services (such as Projects)
            might reject them.
          $ref: '#/components/schemas/Policy'
    Policy:
      type: object
      id: Policy
      description: >-
        An Identity and Access Management (IAM) policy, which specifies access
        controls for Google Cloud resources. A `Policy` is a collection of
        `bindings`. A `binding` binds one or more `members`, or principals, to a
        single `role`. Principals can be user accounts, service accounts, Google
        groups, and domains (such as G Suite). A `role` is a named list of
        permissions; each `role` can be an IAM predefined role or a user-created
        custom role. For some types of Google Cloud resources, a `binding` can
        also specify a `condition`, which is a logical expression that allows
        access to a resource only if the expression evaluates to `true`. A
        condition can add constraints based on attributes of the request, the
        resource, or both. To learn which resources support conditions in their
        IAM policies, see the [IAM
        documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
        **JSON example:** ``` { "bindings": [ { "role":
        "roles/resourcemanager.organizationAdmin", "members": [
        "user:mike@example.com", "group:admins@example.com",
        "domain:google.com",
        "serviceAccount:my-project-id@appspot.gserviceaccount.com" ] }, {
        "role": "roles/resourcemanager.organizationViewer", "members": [
        "user:eve@example.com" ], "condition": { "title": "expirable access",
        "description": "Does not grant access after Sep 2020", "expression":
        "request.time < timestamp('2020-10-01T00:00:00.000Z')", } } ], "etag":
        "BwWWja0YfJA=", "version": 3 } ``` **YAML example:** ``` bindings: -
        members: - user:mike@example.com - group:admins@example.com -
        domain:google.com -
        serviceAccount:my-project-id@appspot.gserviceaccount.com role:
        roles/resourcemanager.organizationAdmin - members: -
        user:eve@example.com role: roles/resourcemanager.organizationViewer
        condition: title: expirable access description: Does not grant access
        after Sep 2020 expression: request.time <
        timestamp('2020-10-01T00:00:00.000Z') etag: BwWWja0YfJA= version: 3 ```
        For a description of IAM and its features, see the [IAM
        documentation](https://cloud.google.com/iam/docs/).
      properties:
        version:
          description: >-
            Specifies the format of the policy. Valid values are `0`, `1`, and
            `3`. Requests that specify an invalid value are rejected. Any
            operation that affects conditional role bindings must specify
            version `3`. This requirement applies to the following operations: *
            Getting a policy that includes a conditional role binding * Adding a
            conditional role binding to a policy * Changing a conditional role
            binding in a policy * Removing any role binding, with or without a
            condition, from a policy that includes conditions **Important:** If
            you use IAM Conditions, you must include the `etag` field whenever
            you call `setIamPolicy`. If you omit this field, then IAM allows you
            to overwrite a version `3` policy with a version `1` policy, and all
            of the conditions in the version `3` policy are lost. If a policy
            does not include any conditions, operations on that policy may
            specify any valid version or leave the field unset. To learn which
            resources support conditions in their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
          type: integer
          format: int32
        etag:
          description: >-
            `etag` is used for optimistic concurrency control as a way to help
            prevent simultaneous updates of a policy from overwriting each
            other. It is strongly suggested that systems make use of the `etag`
            in the read-modify-write cycle to perform policy updates in order to
            avoid race conditions: An `etag` is returned in the response to
            `getIamPolicy`, and systems are expected to put that etag in the
            request to `setIamPolicy` to ensure that their change will be
            applied to the same version of the policy. **Important:** If you use
            IAM Conditions, you must include the `etag` field whenever you call
            `setIamPolicy`. If you omit this field, then IAM allows you to
            overwrite a version `3` policy with a version `1` policy, and all of
            the conditions in the version `3` policy are lost.
          type: string
          format: byte
        bindings:
          description: >-
            Associates a list of `members`, or principals, with a `role`.
            Optionally, may specify a `condition` that determines how and when
            the `bindings` are applied. Each of the `bindings` must contain at
            least one principal. The `bindings` in a `Policy` can refer to up to
            1,500 principals; up to 250 of these principals can be Google
            groups. Each occurrence of a principal counts towards these limits.
            For example, if the `bindings` grant 50 different roles to
            `user:alice@example.com`, and not to any other principal, then you
            can add another 1,450 principals to the `bindings` in the `Policy`.
          type: array
          items:
            $ref: '#/components/schemas/Binding'
    DataDisk:
      id: DataDisk
      type: object
      description: An instance-attached disk resource.
      properties:
        diskSizeGb:
          type: string
          format: int64
          description: >-
            Optional. The size of the disk in GB attached to this VM instance,
            up to a maximum of 64000 GB (64 TB). If not specified, this defaults
            to 100.
        diskEncryption:
          enum:
            - DISK_ENCRYPTION_UNSPECIFIED
            - GMEK
            - CMEK
          description: >-
            Optional. Input only. Disk encryption method used on the boot and
            data disks, defaults to GMEK.
          type: string
          enumDescriptions:
            - Disk encryption is not specified.
            - Use Google managed encryption keys to encrypt the boot disk.
            - Use customer managed encryption keys to encrypt the boot disk.
        resourcePolicies:
          description: Optional. The resource policies to apply to the data disk.
          items:
            type: string
          type: array
        kmsKey:
          type: string
          description: >-
            Optional. Input only. The KMS key used to encrypt the disks, only
            applicable if disk_encryption is CMEK. Format:
            `projects/{project_id}/locations/{location}/keyRings/{key_ring_id}/cryptoKeys/{key_id}`
            Learn more about using your own encryption keys.
        diskType:
          type: string
          enumDescriptions:
            - Disk type not set.
            - Standard persistent disk type.
            - SSD persistent disk type.
            - Balanced persistent disk type.
            - Extreme persistent disk type.
            - >-
              Represents the Hyperdisk Balanced persistent disk type. Can be
              used as a boot disk or data disk.
            - >-
              Represents the Hyperdisk Extreme persistent disk type. Can only be
              used as a data disk.
            - >-
              Represents the Hyperdisk Throughput persistent disk type. Can only
              be used as a data disk.
            - >-
              Represents the Hyperdisk Balanced High Availability persistent
              disk type. Can be used as a boot disk or data disk.
            - >-
              Represents the Hyperdisk ML persistent disk type. Can be used as a
              boot disk or data disk.
          description: Optional. Input only. Indicates the type of the disk.
          enum:
            - DISK_TYPE_UNSPECIFIED
            - PD_STANDARD
            - PD_SSD
            - PD_BALANCED
            - PD_EXTREME
            - HYPERDISK_BALANCED
            - HYPERDISK_EXTREME
            - HYPERDISK_THROUGHPUT
            - HYPERDISK_BALANCED_HIGH_AVAILABILITY
            - HYPERDISK_ML
    TestIamPermissionsRequest:
      description: Request message for `TestIamPermissions` method.
      properties:
        permissions:
          description: >-
            The set of permissions to check for the `resource`. Permissions with
            wildcards (such as `*` or `storage.*`) are not allowed. For more
            information see [IAM
            Overview](https://cloud.google.com/iam/docs/overview#permissions).
          items:
            type: string
          type: array
      id: TestIamPermissionsRequest
      type: object
    Binding:
      type: object
      id: Binding
      description: Associates `members`, or principals, with a `role`.
      properties:
        role:
          description: >-
            Role that is assigned to the list of `members`, or principals. For
            example, `roles/viewer`, `roles/editor`, or `roles/owner`. For an
            overview of the IAM roles and permissions, see the [IAM
            documentation](https://cloud.google.com/iam/docs/roles-overview).
            For a list of the available pre-defined roles, see
            [here](https://cloud.google.com/iam/docs/understanding-roles).
          type: string
        condition:
          description: >-
            The condition that is associated with this binding. If the condition
            evaluates to `true`, then this binding applies to the current
            request. If the condition evaluates to `false`, then this binding
            does not apply to the current request. However, a different role
            binding might grant the same role to one or more of the principals
            in this binding. To learn which resources support conditions in
            their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
          $ref: '#/components/schemas/Expr'
        members:
          type: array
          items:
            type: string
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. `members` can have the following values: * `allUsers`: A
            special identifier that represents anyone who is on the internet;
            with or without a Google account. * `allAuthenticatedUsers`: A
            special identifier that represents anyone who is authenticated with
            a Google account or a service account. Does not include identities
            that come from external identity providers (IdPs) through identity
            federation. * `user:{emailid}`: An email address that represents a
            specific Google account. For example, `alice@example.com` . *
            `serviceAccount:{emailid}`: An email address that represents a
            Google service account. For example,
            `my-other-app@appspot.gserviceaccount.com`. *
            `serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]`:
            An identifier for a [Kubernetes service
            account](https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example,
            `my-project.svc.id.goog[my-namespace/my-kubernetes-sa]`. *
            `group:{emailid}`: An email address that represents a Google group.
            For example, `admins@example.com`. * `domain:{domain}`: The G Suite
            domain (primary) that represents all the users of that domain. For
            example, `google.com` or `example.com`. *
            `principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workforce identity pool. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}`:
            All workforce identities in a group. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All workforce identities with a specific attribute value. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*`:
            All identities in a workforce identity pool. *
            `principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workload identity pool. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}`:
            A workload identity pool group. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All identities in a workload identity pool with a certain attribute.
            *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*`:
            All identities in a workload identity pool. *
            `deleted:user:{emailid}?uid={uniqueid}`: An email address (plus
            unique identifier) representing a user that has been recently
            deleted. For example, `alice@example.com?uid=123456789012345678901`.
            If the user is recovered, this value reverts to `user:{emailid}` and
            the recovered user retains the role in the binding. *
            `deleted:serviceAccount:{emailid}?uid={uniqueid}`: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            `my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901`.
            If the service account is undeleted, this value reverts to
            `serviceAccount:{emailid}` and the undeleted service account retains
            the role in the binding. * `deleted:group:{emailid}?uid={uniqueid}`:
            An email address (plus unique identifier) representing a Google
            group that has been recently deleted. For example,
            `admins@example.com?uid=123456789012345678901`. If the group is
            recovered, this value reverts to `group:{emailid}` and the recovered
            group retains the role in the binding. *
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            Deleted single identity in a workforce identity pool. For example,
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value`.
    DiagnoseInstanceRequest:
      description: Request for creating a notebook instance diagnostic file.
      properties:
        diagnosticConfig:
          description: Required. Defines flags that are used to run the diagnostic tool
          $ref: '#/components/schemas/DiagnosticConfig'
        timeoutMinutes:
          type: integer
          format: int32
          description: >-
            Optional. Maximum amount of time in minutes before the operation
            times out.
      type: object
      id: DiagnoseInstanceRequest
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      properties:
        operations:
          items:
            $ref: '#/components/schemas/Operation'
          type: array
          description: >-
            A list of operations that matches the specified filter in the
            request.
        nextPageToken:
          description: The standard List next-page token.
          type: string
        unreachable:
          type: array
          items:
            type: string
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
      id: ListOperationsResponse
      type: object
    AcceleratorConfig:
      type: object
      id: AcceleratorConfig
      description: >-
        An accelerator configuration for a VM instance Definition of a hardware
        accelerator. Note that there is no check on `type` and `core_count`
        combinations. TPUs are not supported. See [GPUs on Compute
        Engine](https://cloud.google.com/compute/docs/gpus/#gpus-list) to find a
        valid combination.
      properties:
        type:
          type: string
          enumDescriptions:
            - Accelerator type is not specified.
            - Accelerator type is Nvidia Tesla P100.
            - Accelerator type is Nvidia Tesla V100.
            - Accelerator type is Nvidia Tesla P4.
            - Accelerator type is Nvidia Tesla T4.
            - Accelerator type is Nvidia Tesla A100 - 40GB.
            - Accelerator type is Nvidia Tesla A100 - 80GB.
            - Accelerator type is Nvidia Tesla L4.
            - Accelerator type is Nvidia Tesla H100 - 80GB.
            - Accelerator type is Nvidia Tesla H100 - MEGA 80GB.
            - Accelerator type is Nvidia Tesla H200 - 141GB.
            - Accelerator type is NVIDIA Tesla T4 Virtual Workstations.
            - Accelerator type is NVIDIA Tesla P100 Virtual Workstations.
            - Accelerator type is NVIDIA Tesla P4 Virtual Workstations.
            - Accelerator type is NVIDIA B200.
            - NVIDIA RTX 6000.
          enum:
            - ACCELERATOR_TYPE_UNSPECIFIED
            - NVIDIA_TESLA_P100
            - NVIDIA_TESLA_V100
            - NVIDIA_TESLA_P4
            - NVIDIA_TESLA_T4
            - NVIDIA_TESLA_A100
            - NVIDIA_A100_80GB
            - NVIDIA_L4
            - NVIDIA_H100_80GB
            - NVIDIA_H100_MEGA_80GB
            - NVIDIA_H200_141GB
            - NVIDIA_TESLA_T4_VWS
            - NVIDIA_TESLA_P100_VWS
            - NVIDIA_TESLA_P4_VWS
            - NVIDIA_B200
            - NVIDIA_RTX6000
          description: Optional. Type of this accelerator.
        coreCount:
          type: string
          format: int64
          description: Optional. Count of cores of this accelerator.
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      properties: {}
      type: object
      id: Empty
    BootDisk:
      type: object
      id: BootDisk
      description: The definition of a boot disk.
      properties:
        kmsKey:
          description: >-
            Optional. Input only. The KMS key used to encrypt the disks, only
            applicable if disk_encryption is CMEK. Format:
            `projects/{project_id}/locations/{location}/keyRings/{key_ring_id}/cryptoKeys/{key_id}`
            Learn more about using your own encryption keys.
          type: string
        diskSizeGb:
          description: >-
            Optional. The size of the boot disk in GB attached to this instance,
            up to a maximum of 64000 GB (64 TB). If not specified, this defaults
            to the recommended value of 150GB.
          type: string
          format: int64
        diskType:
          description: Optional. Indicates the type of the disk.
          enum:
            - DISK_TYPE_UNSPECIFIED
            - PD_STANDARD
            - PD_SSD
            - PD_BALANCED
            - PD_EXTREME
            - HYPERDISK_BALANCED
            - HYPERDISK_EXTREME
            - HYPERDISK_THROUGHPUT
            - HYPERDISK_BALANCED_HIGH_AVAILABILITY
            - HYPERDISK_ML
          type: string
          enumDescriptions:
            - Disk type not set.
            - Standard persistent disk type.
            - SSD persistent disk type.
            - Balanced persistent disk type.
            - Extreme persistent disk type.
            - >-
              Represents the Hyperdisk Balanced persistent disk type. Can be
              used as a boot disk or data disk.
            - >-
              Represents the Hyperdisk Extreme persistent disk type. Can only be
              used as a data disk.
            - >-
              Represents the Hyperdisk Throughput persistent disk type. Can only
              be used as a data disk.
            - >-
              Represents the Hyperdisk Balanced High Availability persistent
              disk type. Can be used as a boot disk or data disk.
            - >-
              Represents the Hyperdisk ML persistent disk type. Can be used as a
              boot disk or data disk.
        diskEncryption:
          type: string
          enumDescriptions:
            - Disk encryption is not specified.
            - Use Google managed encryption keys to encrypt the boot disk.
            - Use customer managed encryption keys to encrypt the boot disk.
          description: >-
            Optional. Input only. Disk encryption method used on the boot and
            data disks, defaults to GMEK.
          enum:
            - DISK_ENCRYPTION_UNSPECIFIED
            - GMEK
            - CMEK
    ServiceAccount:
      id: ServiceAccount
      type: object
      description: A service account that acts as an identity.
      properties:
        email:
          type: string
          description: Optional. Email address of the service account.
        scopes:
          items:
            type: string
          type: array
          description: >-
            Output only. The list of scopes to be made available for this
            service account. Set by the CLH to
            https://www.googleapis.com/auth/cloud-platform
          readOnly: true
    CheckAuthorizationRequest:
      description: Request message for checking authorization for the instance owner.
      properties:
        authorizationDetails:
          additionalProperties:
            type: string
          description: >-
            Optional. The details of the OAuth authorization response. This may
            include additional params such as dry_run, version_info, origin,
            propagate, etc.
          type: object
      type: object
      id: CheckAuthorizationRequest
    OperationMetadata:
      id: OperationMetadata
      type: object
      description: Represents the metadata of the long-running operation.
      properties:
        verb:
          type: string
          description: Name of the verb executed by the operation.
        createTime:
          description: The time the operation was created.
          format: google-datetime
          type: string
        apiVersion:
          type: string
          description: API version used to start the operation.
        statusMessage:
          description: Human-readable status of the operation, if any.
          type: string
        target:
          type: string
          description: Server-defined resource path for the target of the operation.
        requestedCancellation:
          description: >-
            Identifies whether the user has requested cancellation of the
            operation. Operations that have successfully been cancelled have
            google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
          type: boolean
        endpoint:
          type: string
          description: API endpoint name of this operation.
        endTime:
          type: string
          format: google-datetime
          description: The time the operation finished running.
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      properties:
        message:
          type: string
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            type: object
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
          type: array
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          type: integer
          format: int32
      id: Status
      type: object
    NetworkInterface:
      description: The definition of a network interface resource attached to a VM.
      properties:
        subnet:
          type: string
          description: >-
            Optional. The name of the subnet that this VM instance is in.
            Format:
            `projects/{project_id}/regions/{region}/subnetworks/{subnetwork_id}`
        nicType:
          type: string
          enumDescriptions:
            - No type specified.
            - VIRTIO
            - GVNIC
          enum:
            - NIC_TYPE_UNSPECIFIED
            - VIRTIO_NET
            - GVNIC
          description: >-
            Optional. The type of vNIC to be used on this interface. This may be
            gVNIC or VirtioNet.
        accessConfigs:
          items:
            $ref: '#/components/schemas/AccessConfig'
          type: array
          description: >-
            Optional. An array of configurations for this interface. Currently,
            only one access config, ONE_TO_ONE_NAT, is supported. If no
            accessConfigs specified, the instance will have an external internet
            access through an ephemeral external IP address.
        network:
          type: string
          description: >-
            Optional. The name of the VPC that this VM instance is in. Format:
            `projects/{project_id}/global/networks/{network_id}`
      type: object
      id: NetworkInterface
    CheckAuthorizationResponse:
      description: Response message for checking authorization for the instance owner.
      properties:
        success:
          description: >-
            Success indicates that the user completed OAuth consent and access
            tokens can be generated.
          type: boolean
        createTime:
          description: Output only. Timestamp when this Authorization request was created.
          readOnly: true
          format: google-datetime
          type: string
        oauth_uri:
          type: string
          description: >-
            If the user has not completed OAuth consent, then the oauth_url is
            returned. Otherwise, this field is not set.
      type: object
      id: CheckAuthorizationResponse
    DiagnosticConfig:
      type: object
      id: DiagnosticConfig
      description: Defines flags that are used to run the diagnostic tool
      properties:
        enableRepairFlag:
          description: Optional. Enables flag to repair service for instance
          type: boolean
        gcsBucket:
          type: string
          description: >-
            Required. User Cloud Storage bucket location (REQUIRED). Must be
            formatted with path prefix (`gs://$GCS_BUCKET`). Permissions: User
            Managed Notebooks: - storage.buckets.writer: Must be given to the
            project's service account attached to VM. Google Managed Notebooks:
            - storage.buckets.writer: Must be given to the project's service
            account or user credentials attached to VM depending on
            authentication mode. Cloud Storage bucket Log file will be written
            to `gs://$GCS_BUCKET/$RELATIVE_PATH/$VM_DATE_$TIME.tar.gz`
        relativePath:
          description: >-
            Optional. Defines the relative storage path in the Cloud Storage
            bucket where the diagnostic logs will be written: Default path will
            be the root directory of the Cloud Storage bucket
            (`gs://$GCS_BUCKET/$DATE_$TIME.tar.gz`) Example of full path where
            Log file will be written: `gs://$GCS_BUCKET/$RELATIVE_PATH/`
          type: string
        enableCopyHomeFilesFlag:
          description: Optional. Enables flag to copy all `/home/jupyter` folder contents
          type: boolean
        enablePacketCaptureFlag:
          description: >-
            Optional. Enables flag to capture packets from the instance for 30
            seconds
          type: boolean
    ShieldedInstanceConfig:
      id: ShieldedInstanceConfig
      type: object
      description: >-
        A set of Shielded Instance options. See [Images using supported Shielded
        VM
        features](https://cloud.google.com/compute/docs/instances/modifying-shielded-vm).
        Not all combinations are valid.
      properties:
        enableVtpm:
          type: boolean
          description: Optional. Defines whether the VM instance has the vTPM enabled.
        enableSecureBoot:
          description: >-
            Optional. Defines whether the VM instance has Secure Boot enabled.
            Secure Boot helps ensure that the system only runs authentic
            software by verifying the digital signature of all boot components,
            and halting the boot process if signature verification fails.
            Disabled by default.
          type: boolean
        enableIntegrityMonitoring:
          description: >-
            Optional. Defines whether the VM instance has integrity monitoring
            enabled. Enables monitoring and attestation of the boot integrity of
            the VM instance. The attestation is performed against the integrity
            policy baseline. This baseline is initially derived from the
            implicitly trusted boot image when the VM instance is created.
          type: boolean
    VmImage:
      type: object
      id: VmImage
      description: >-
        Definition of a custom Compute Engine virtual machine image for starting
        a notebook instance with the environment installed directly on the VM.
      properties:
        name:
          description: Optional. Use VM image name to find the image.
          type: string
        family:
          type: string
          description: >-
            Optional. Use this VM image family to find the image; the newest
            image in this family will be used.
        project:
          description: >-
            Required. The name of the Google Cloud project that this VM image
            belongs to. Format: `{project_id}`
          type: string
    ImageRelease:
      id: ImageRelease
      type: object
      description: ConfigImage represents an image release available to create a WbI
      properties:
        imageName:
          type: string
          description: >-
            Output only. The name of the image of the form
            workbench-instances-vYYYYmmdd--
          readOnly: true
        imageFamily:
          description: >-
            Output only. The image family of the image. (ex: workbench-instances
            or workbench-2603)
          readOnly: true
          type: string
        description:
          description: Output only. The description of the image.
          readOnly: true
          type: string
        releaseName:
          description: Output only. The release of the image of the form m123
          readOnly: true
          type: string
    ListInstancesResponse:
      id: ListInstancesResponse
      type: object
      description: Response for listing notebook instances.
      properties:
        nextPageToken:
          type: string
          description: >-
            Page token that can be used to continue listing from the last result
            in the next list call.
        instances:
          description: A list of returned instances.
          type: array
          items:
            $ref: '#/components/schemas/Instance'
        unreachable:
          description: >-
            Unordered list. Locations that could not be reached. For example,
            ['projects/{project_id}/locations/us-west1-a',
            'projects/{project_id}/locations/us-central1-b']. A
            ListInstancesResponse will only contain either instances or
            unreachables,
          type: array
          items:
            type: string
    GPUDriverConfig:
      type: object
      id: GPUDriverConfig
      description: A GPU driver configuration
      properties:
        customGpuDriverPath:
          description: >-
            Optional. Specify a custom Cloud Storage path where the GPU driver
            is stored. If not specified, we'll automatically choose from
            official GPU drivers.
          type: string
        enableGpuDriver:
          type: boolean
          description: >-
            Optional. Whether the end user authorizes Google Cloud to install
            GPU driver on this VM instance. If this field is empty or set to
            false, the GPU driver won't be installed. Only applicable to
            instances with GPUs.
    TestIamPermissionsResponse:
      type: object
      id: TestIamPermissionsResponse
      description: Response message for `TestIamPermissions` method.
      properties:
        permissions:
          description: >-
            A subset of `TestPermissionsRequest.permissions` that the caller is
            allowed.
          items:
            type: string
          type: array
    UpgradeInstanceRequest:
      description: Request for upgrading a notebook instance
      properties:
        imageFamily:
          description: >-
            Optional. The Compute Engine image family resource name to upgrade
            to. Format:
            `projects/{project_id}/global/images/family/{image_family}` If
            specified, the instance will be upgraded to the latest image in the
            specified image family, allowing upgrades across image families. If
            not specified, the instance will be upgraded to the latest image in
            its current image family.
          type: string
      type: object
      id: UpgradeInstanceRequest
    Location:
      id: Location
      type: object
      description: A resource that represents a Google Cloud location.
      properties:
        name:
          type: string
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
        displayName:
          type: string
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
        metadata:
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
    ResetInstanceRequest:
      description: Request for resetting a notebook instance
      properties: {}
      id: ResetInstanceRequest
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      properties: {}
      id: CancelOperationRequest
      type: object
    UpgradeHistoryEntry:
      id: UpgradeHistoryEntry
      type: object
      description: The entry of VM image upgrade history.
      properties:
        framework:
          description: Optional. The framework of this notebook instance.
          type: string
        vmImage:
          description: Optional. The VM image before this instance upgrade.
          type: string
        snapshot:
          description: >-
            Optional. The snapshot of the boot disk of this notebook instance
            before upgrade.
          type: string
        state:
          type: string
          enumDescriptions:
            - State is not specified.
            - The instance upgrade is started.
            - The instance upgrade is succeeded.
            - The instance upgrade is failed.
          description: Output only. The state of this instance upgrade history entry.
          enum:
            - STATE_UNSPECIFIED
            - STARTED
            - SUCCEEDED
            - FAILED
          readOnly: true
        targetVersion:
          description: Optional. Target VM Version, like m63.
          type: string
        containerImage:
          description: Optional. The container image before this instance upgrade.
          type: string
        createTime:
          format: google-datetime
          type: string
          description: >-
            Immutable. The time that this instance upgrade history entry is
            created.
        version:
          type: string
          description: Optional. The version of the notebook instance before this upgrade.
        action:
          description: Optional. Action. Rolloback or Upgrade.
          enum:
            - ACTION_UNSPECIFIED
            - UPGRADE
            - ROLLBACK
          type: string
          enumDescriptions:
            - Operation is not specified.
            - Upgrade.
            - Rollback.
    Event:
      description: >-
        The definition of an Event for a managed / semi-managed notebook
        instance.
      properties:
        details:
          type: object
          description: >-
            Optional. Event details. This field is used to pass event
            information.
          additionalProperties:
            type: string
        reportTime:
          description: Optional. Event report time.
          format: google-datetime
          type: string
        type:
          type: string
          enumDescriptions:
            - Event is not specified.
            - The instance / runtime is idle
            - >-
              The instance / runtime is available. This event indicates that
              instance / runtime underlying compute is operational.
            - >-
              The instance / runtime health is available. This event indicates
              that instance / runtime health information.
            - >-
              The instance / runtime is available. This event allows instance /
              runtime to send Host maintenance information to Control Plane.
              https://cloud.google.com/compute/docs/gpus/gpu-host-maintenance
            - >-
              The instance / runtime is available. This event indicates that the
              instance had metadata that needs to be modified.
          enum:
            - EVENT_TYPE_UNSPECIFIED
            - IDLE
            - HEARTBEAT
            - HEALTH
            - MAINTENANCE
            - METADATA_CHANGE
          description: Optional. Event type.
      type: object
      id: Event
    ListLocationsResponse:
      type: object
      id: ListLocationsResponse
      description: The response message for Locations.ListLocations.
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          type: string
          description: The standard List next-page token.
    RestoreInstanceRequest:
      type: object
      id: RestoreInstanceRequest
      description: Request for restoring the notebook instance from a BackupSource.
      properties:
        snapshot:
          description: Snapshot to be used for restore.
          $ref: '#/components/schemas/Snapshot'
    RollbackInstanceRequest:
      id: RollbackInstanceRequest
      type: object
      description: Request for rollbacking a notebook instance
      properties:
        revisionId:
          description: Required. Output only. Revision Id
          readOnly: true
          type: string
        targetSnapshot:
          type: string
          description: >-
            Required. The snapshot for rollback. Example:
            "projects/test-project/global/snapshots/krwlzipynril".
    Snapshot:
      type: object
      id: Snapshot
      description: >-
        Snapshot represents the snapshot of the data disk used to restore the
        Workbench Instance from. Refers to:
        compute/v1/projects/{project_id}/global/snapshots/{snapshot_id}
      properties:
        snapshotId:
          type: string
          description: Required. The ID of the snapshot.
        projectId:
          description: Required. The project ID of the snapshot.
          type: string
    SupportedValues:
      description: SupportedValues represents the values supported by the configuration.
      properties:
        machineTypes:
          description: Output only. The machine types supported by WbI.
          readOnly: true
          type: array
          items:
            type: string
        acceleratorTypes:
          description: Output only. The accelerator types supported by WbI.
          readOnly: true
          type: array
          items:
            type: string
      type: object
      id: SupportedValues
    ReportInstanceInfoSystemRequest:
      description: Request for notebook instances to report information to Notebooks API.
      properties:
        vmId:
          type: string
          description: >-
            Required. The VM hardware token for authenticating the VM.
            https://cloud.google.com/compute/docs/instances/verifying-instance-identity
        event:
          description: Required. The Event to be reported.
          $ref: '#/components/schemas/Event'
      type: object
      id: ReportInstanceInfoSystemRequest
    Expr:
      type: object
      id: Expr
      description: >-
        Represents a textual expression in the Common Expression Language (CEL)
        syntax. CEL is a C-like expression language. The syntax and semantics of
        CEL are documented at https://github.com/google/cel-spec. Example
        (Comparison): title: "Summary size limit" description: "Determines if a
        summary is less than 100 chars" expression: "document.summary.size() <
        100" Example (Equality): title: "Requestor is owner" description:
        "Determines if requestor is the document owner" expression:
        "document.owner == request.auth.claims.email" Example (Logic): title:
        "Public documents" description: "Determine whether the document should
        be publicly visible" expression: "document.type != 'private' &&
        document.type != 'internal'" Example (Data Manipulation): title:
        "Notification string" description: "Create a notification string with a
        timestamp." expression: "'New message received at ' +
        string(document.create_time)" The exact variables and functions that may
        be referenced within an expression are determined by the service that
        evaluates it. See the service documentation for additional information.
      properties:
        description:
          description: >-
            Optional. Description of the expression. This is a longer text which
            describes the expression, e.g. when hovered over it in a UI.
          type: string
        expression:
          type: string
          description: >-
            Textual representation of an expression in Common Expression
            Language syntax.
        title:
          description: >-
            Optional. Title for the expression, i.e. a short string describing
            its purpose. This can be used e.g. in UIs which allow to enter the
            expression.
          type: string
        location:
          description: >-
            Optional. String indicating the location of the expression for error
            reporting, e.g. a file name and a position in the file.
          type: string
    ReservationAffinity:
      description: A reservation that an instance can consume from.
      properties:
        consumeReservationType:
          description: >-
            Required. Specifies the type of reservation from which this instance
            can consume resources: RESERVATION_ANY (default),
            RESERVATION_SPECIFIC, or RESERVATION_NONE. See Consuming reserved
            instances for examples.
          enum:
            - RESERVATION_UNSPECIFIED
            - RESERVATION_NONE
            - RESERVATION_ANY
            - RESERVATION_SPECIFIC
          type: string
          enumDescriptions:
            - Default type.
            - Do not consume from any allocated capacity.
            - Consume any reservation available.
            - >-
              Must consume from a specific reservation. Must specify key value
              fields for specifying the reservations.
        values:
          description: >-
            Optional. Corresponds to the label values of a reservation resource.
            This can be either a name to a reservation in the same project or
            "projects/different-project/reservations/some-reservation-name" to
            target a shared reservation in the same zone but in a different
            project.
          type: array
          items:
            type: string
        key:
          description: >-
            Optional. Corresponds to the label key of a reservation resource. To
            target a RESERVATION_SPECIFIC by name, use
            compute.googleapis.com/reservation-name as the key and specify the
            name of your reservation as its value.
          type: string
      id: ReservationAffinity
      type: object
    GceSetup:
      type: object
      id: GceSetup
      description: >-
        The definition of how to configure a VM instance outside of Resources
        and Identity.
      properties:
        dataDisks:
          type: array
          items:
            $ref: '#/components/schemas/DataDisk'
          description: >-
            Optional. Data disks attached to the VM instance. Currently supports
            only one data disk.
        gpuDriverConfig:
          description: Optional. Configuration for GPU drivers.
          $ref: '#/components/schemas/GPUDriverConfig'
        tags:
          type: array
          items:
            type: string
          description: >-
            Optional. The Compute Engine network tags to add to runtime (see
            [Add network
            tags](https://cloud.google.com/vpc/docs/add-remove-network-tags)).
        enableIpForwarding:
          description: >-
            Optional. Flag to enable ip forwarding or not, default false/off.
            https://cloud.google.com/vpc/docs/using-routes#canipforward
          type: boolean
        reservationAffinity:
          description: >-
            Optional. Specifies the reservations that this instance can consume
            from.
          $ref: '#/components/schemas/ReservationAffinity'
        serviceAccounts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount'
          description: >-
            Optional. The service account that serves as an identity for the VM
            instance. Currently supports only one service account.
        containerImage:
          description: Optional. Use a container image to start the notebook instance.
          $ref: '#/components/schemas/ContainerImage'
        metadata:
          additionalProperties:
            type: string
          description: Optional. Custom metadata to apply to this instance.
          type: object
        machineType:
          type: string
          description: >-
            Optional. The machine type of the VM instance.
            https://cloud.google.com/compute/docs/machine-resource
        disablePublicIp:
          type: boolean
          description: >-
            Optional. If true, no external IP will be assigned to this VM
            instance.
        acceleratorConfigs:
          type: array
          items:
            $ref: '#/components/schemas/AcceleratorConfig'
          description: >-
            Optional. The hardware accelerators used on this instance. If you
            use accelerators, make sure that your configuration has [enough
            vCPUs and memory to support the `machine_type` you have
            selected](https://cloud.google.com/compute/docs/gpus/#gpus-list).
            Currently supports only one accelerator configuration.
        bootDisk:
          description: Optional. The boot disk for the VM.
          $ref: '#/components/schemas/BootDisk'
        instanceId:
          type: string
          description: Output only. The unique ID of the Compute Engine instance resource.
          readOnly: true
        shieldedInstanceConfig:
          description: >-
            Optional. Shielded VM configuration. [Images using supported
            Shielded VM
            features](https://cloud.google.com/compute/docs/instances/modifying-shielded-vm).
          $ref: '#/components/schemas/ShieldedInstanceConfig'
        minCpuPlatform:
          description: >-
            Optional. The minimum CPU platform to use for this instance. The
            list of valid values can be found in
            https://cloud.google.com/compute/docs/instances/specify-min-cpu-platform#availablezones
          type: string
        networkInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/NetworkInterface'
          description: >-
            Optional. The network interfaces for the VM. Supports only one
            interface.
        confidentialInstanceConfig:
          description: Optional. Confidential instance configuration.
          $ref: '#/components/schemas/ConfidentialInstanceConfig'
        vmImage:
          description: >-
            Optional. Use a Compute Engine VM image to start the notebook
            instance.
          $ref: '#/components/schemas/VmImage'
    StopInstanceRequest:
      type: object
      id: StopInstanceRequest
      description: Request for stopping a notebook instance
      properties: {}
    Instance:
      description: The definition of a notebook instance.
      properties:
        createTime:
          format: google-datetime
          type: string
          description: Output only. Instance creation time.
          readOnly: true
        creator:
          type: string
          description: >-
            Output only. Email address of entity that sent original
            CreateInstance request.
          readOnly: true
        updateTime:
          type: string
          format: google-datetime
          description: Output only. Instance update time.
          readOnly: true
        enableManagedEuc:
          description: >-
            Optional. Flag to enable managed end user credentials for the
            instance.
          type: boolean
        gceSetup:
          description: >-
            Optional. Compute Engine setup for the notebook. Uses
            notebook-defined fields.
          $ref: '#/components/schemas/GceSetup'
        disableProxyAccess:
          description: >-
            Optional. If true, the notebook instance will not register with the
            proxy.
          type: boolean
        proxyUri:
          description: >-
            Output only. The proxy endpoint that is used to access the Jupyter
            notebook.
          readOnly: true
          type: string
        healthInfo:
          additionalProperties:
            type: string
          description: >-
            Output only. Additional information about instance health. Example:
            healthInfo": { "docker_proxy_agent_status": "1", "docker_status":
            "1", "jupyterlab_api_status": "-1", "jupyterlab_status": "-1",
            "updated": "2020-10-18 09:40:03.573409" }
          readOnly: true
          type: object
        instanceOwners:
          description: >-
            Optional. The owner of this instance after creation. Format:
            `alias@example.com` Currently supports one owner only. If not
            specified, all of the service account users of your VM instance's
            service account can use the instance.
          type: array
          items:
            type: string
        upgradeHistory:
          items:
            $ref: '#/components/schemas/UpgradeHistoryEntry'
          type: array
          description: Output only. The upgrade history of this instance.
          readOnly: true
        satisfiesPzi:
          description: Output only. Reserved for future use for Zone Isolation.
          readOnly: true
          type: boolean
        enableDeletionProtection:
          description: >-
            Optional. If true, deletion protection will be enabled for this
            Workbench Instance. If false, deletion protection will be disabled
            for this Workbench Instance.
          type: boolean
        labels:
          description: >-
            Optional. Labels to apply to this instance. These can be later
            modified by the UpdateInstance method.
          additionalProperties:
            type: string
          type: object
        thirdPartyProxyUrl:
          description: >-
            Output only. The workforce pools proxy endpoint that is used to
            access the Jupyter notebook.
          readOnly: true
          type: string
        name:
          type: string
          description: >-
            Output only. Identifier. The name of this notebook instance. Format:
            `projects/{project_id}/locations/{location}/instances/{instance_id}`
          readOnly: true
        enableThirdPartyIdentity:
          type: boolean
