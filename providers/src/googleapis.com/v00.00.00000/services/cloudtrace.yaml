openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Cloud Trace API
  description: >-
    Sends application trace data to Cloud Trace for viewing. Trace data is
    collected for all App Engine applications by default. Trace data from other
    applications can be provided using this API. This library is used to
    interact with the Cloud Trace API directly. If you are looking to instrument
    your application for Cloud Trace, we recommend using OpenTelemetry. 
  version: v2
  x-discovery-doc-revision: '20260724'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/trace/
servers:
  - url: https://cloudtrace.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
            https://www.googleapis.com/auth/trace.append: Write Trace data for a project or application
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    Annotation:
      id: Annotation
      description: Text annotation with a set of attributes.
      type: object
      properties:
        description:
          description: >-
            Optional. A user-supplied message describing the event. The maximum
            length for the description is 256 bytes.
          $ref: '#/components/schemas/TruncatableString'
        attributes:
          $ref: '#/components/schemas/Attributes'
          description: >-
            Optional. A set of attributes on the annotation. You can have up to
            4 attributes per Annotation.
    TruncatableString:
      properties:
        value:
          description: >-
            Optional. The shortened string. For example, if the original string
            is 500 bytes long and the limit of the string is 128 bytes, then
            `value` contains the first 128 bytes of the 500-byte string.
            Truncation always happens on a UTF8 character boundary. If there are
            multi-byte characters in the string, then the length of the
            shortened string might be less than the size limit.
          type: string
        truncatedByteCount:
          format: int32
          description: >-
            Optional. The number of bytes removed from the original string. If
            this value is 0, then the string was not shortened.
          type: integer
      id: TruncatableString
      description: Represents a string that might be shortened to a specified length.
      type: object
    Empty:
      properties: {}
      id: Empty
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      type: object
    TimeEvents:
      properties:
        droppedMessageEventsCount:
          format: int32
          description: >-
            Optional. The number of dropped message events in all the included
            time events. If the value is 0, then no message events were dropped.
          type: integer
        timeEvent:
          items:
            $ref: '#/components/schemas/TimeEvent'
          description: Optional. A collection of `TimeEvent`s.
          type: array
        droppedAnnotationsCount:
          format: int32
          description: >-
            Optional. The number of dropped annotations in all the included time
            events. If the value is 0, then no annotations were dropped.
          type: integer
      id: TimeEvents
      description: >-
        A collection of `TimeEvent`s. A `TimeEvent` is a time-stamped annotation
        on the span, consisting of either user-supplied key:value pairs, or
        details of a message sent/received between Spans.
      type: object
    Span:
      properties:
        name:
          description: >-
            Identifier. The resource name of the span in the following format: *
            `projects/[PROJECT_ID]/traces/[TRACE_ID]/spans/[SPAN_ID]`
            `[TRACE_ID]` is a unique identifier for a trace within a project; it
            is a 32-character hexadecimal encoding of a 16-byte array. It should
            not be zero. `[SPAN_ID]` is a unique identifier for a span within a
            trace; it is a 16-character hexadecimal encoding of an 8-byte array.
            It should not be zero. .
          type: string
        parentSpanId:
          description: >-
            Optional. The `[SPAN_ID]` of this span's parent span. If this is a
            root span, then this field must be empty.
          type: string
        endTime:
          format: google-datetime
          description: >-
            Required. The end time of the span. On the client side, this is the
            time kept by the local machine where the span execution ends. On the
            server side, this is the time when the server application handler
            stops running.
          type: string
        attributes:
          $ref: '#/components/schemas/Attributes'
          description: >-
            Optional. A set of attributes on the span. You can have up to 32
            attributes per span.
        stackTrace:
          description: Optional. Stack trace captured at the start of the span.
          $ref: '#/components/schemas/StackTrace'
        links:
          description: >-
            Optional. Links associated with the span. You can have up to 128
            links per Span.
          $ref: '#/components/schemas/Links'
        status:
          description: Optional. The final status for this span.
          $ref: '#/components/schemas/Status'
        spanId:
          description: Required. The `[SPAN_ID]` portion of the span's resource name.
          type: string
        spanKind:
          enum:
            - SPAN_KIND_UNSPECIFIED
            - INTERNAL
            - SERVER
            - CLIENT
            - PRODUCER
            - CONSUMER
          description: >-
            Optional. Distinguishes between spans generated in a particular
            context. For example, two spans with the same name may be
            distinguished using `CLIENT` (caller) and `SERVER` (callee) to
            identify an RPC call.
          type: string
          enumDescriptions:
            - >-
              Unspecified. Do NOT use as default. Implementations MAY assume
              SpanKind.INTERNAL to be default.
            - Indicates that the span is used internally. Default value.
            - >-
              Indicates that the span covers server-side handling of an RPC or
              other remote network request.
            - >-
              Indicates that the span covers the client-side wrapper around an
              RPC or other remote request.
            - >-
              Indicates that the span describes producer sending a message to a
              broker. Unlike client and server, there is no direct critical path
              latency relationship between producer and consumer spans (e.g.
              publishing a message to a pubsub service).
            - >-
              Indicates that the span describes consumer receiving a message
              from a broker. Unlike client and server, there is no direct
              critical path latency relationship between producer and consumer
              spans (e.g. receiving a message from a pubsub service
              subscription).
        displayName:
          $ref: '#/components/schemas/TruncatableString'
          description: >-
            Required. A description of the span's operation (up to 128 bytes).
            Cloud Trace displays the description in the Cloud console. For
            example, the display name can be a qualified method name or a file
            name and a line number where the operation is called. A best
            practice is to use the same display name within an application and
            at the same call point. This makes it easier to correlate spans in
            different traces.
        startTime:
          description: >-
            Required. The start time of the span. On the client side, this is
            the time kept by the local machine where the span execution starts.
            On the server side, this is the time when the server's application
            handler starts running.
          type: string
          format: google-datetime
        childSpanCount:
          description: >-
            Optional. The number of child spans that were generated while this
            span was active. If set, allows implementation to detect missing
            child spans.
          type: integer
          format: int32
        timeEvents:
          $ref: '#/components/schemas/TimeEvents'
          description: >-
            Optional. A set of time events. You can have up to 32 annotations
            and 128 message events per span.
        sameProcessAsParentSpan:
          description: >-
            Optional. Set this parameter to indicate whether this span is in the
            same process as its parent. If you do not set this parameter, Trace
            is unable to take advantage of this helpful information.
          type: boolean
      id: Span
      description: >-
        A span represents a single operation within a trace. Spans can be nested
        to form a trace tree. Often, a trace contains a root span that describes
        the end-to-end latency, and one or more subspans for its sub-operations.
        A trace can also contain multiple root spans, or none at all. Spans do
        not need to be contiguous. There might be gaps or overlaps between spans
        in a trace.
      type: object
    Module:
      properties:
        buildId:
          description: >-
            Optional. A unique identifier for the module, usually a hash of its
            contents (up to 128 bytes).
          $ref: '#/components/schemas/TruncatableString'
        module:
          description: >-
            Optional. For example: main binary, kernel modules, and dynamic
            libraries such as libc.so, sharedlib.so (up to 256 bytes).
          $ref: '#/components/schemas/TruncatableString'
      id: Module
      description: Binary module.
      type: object
    Links:
      properties:
        link:
          description: Optional. A collection of links.
          type: array
          items:
            $ref: '#/components/schemas/Link'
        droppedLinksCount:
          description: >-
            Optional. The number of dropped links after the maximum size was
            enforced. If this value is 0, then no links were dropped.
          type: integer
          format: int32
      id: Links
      description: >-
        A collection of links, which are references from this span to a span in
        the same or different trace.
      type: object
    StackFrame:
      id: StackFrame
      description: Represents a single stack frame in a stack trace.
      type: object
      properties:
        originalFunctionName:
          description: >-
            Optional. An un-mangled function name, if `function_name` is
            mangled. To get information about name mangling, run [this
            search](https://www.google.com/search?q=cxx+name+mangling). The name
            can be fully-qualified (up to 1024 bytes).
          $ref: '#/components/schemas/TruncatableString'
        fileName:
          $ref: '#/components/schemas/TruncatableString'
          description: >-
            Optional. The name of the source file where the function call
            appears (up to 256 bytes).
        functionName:
          description: >-
            Optional. The fully-qualified name that uniquely identifies the
            function or method that is active in this frame (up to 1024 bytes).
          $ref: '#/components/schemas/TruncatableString'
        lineNumber:
          format: int64
          description: >-
            Optional. The line number in `file_name` where the function call
            appears.
          type: string
        columnNumber:
          format: int64
          description: >-
            Optional. The column number where the function call appears, if
            available. This is important in JavaScript because of its anonymous
            functions.
          type: string
        loadModule:
          $ref: '#/components/schemas/Module'
          description: Optional. The binary module from where the code was loaded.
        sourceVersion:
          description: Optional. The version of the deployed source code (up to 128 bytes).
          $ref: '#/components/schemas/TruncatableString'
    StackFrames:
      id: StackFrames
      description: A collection of stack frames, which can be truncated.
      type: object
      properties:
        frame:
          description: Optional. Stack frames in this call stack.
          type: array
          items:
            $ref: '#/components/schemas/StackFrame'
        droppedFramesCount:
          description: >-
            Optional. The number of stack frames that were dropped because there
            were too many stack frames. If this value is 0, then no stack frames
            were dropped.
          type: integer
          format: int32
    Link:
      id: Link
      description: >-
        A pointer from the current span to another span in the same trace or in
        a different trace. For example, this can be used in batching operations,
        where a single batch handler processes multiple requests from different
        traces or when the handler receives a request from a different project.
      type: object
      properties:
        traceId:
          description: Optional. The `[TRACE_ID]` for a trace within a project.
          type: string
        spanId:
          description: Optional. The `[SPAN_ID]` for a span within a trace.
          type: string
        attributes:
          $ref: '#/components/schemas/Attributes'
          description: >-
            Optional. A set of attributes on the link. Up to 32 attributes can
            be specified per link.
        type:
          description: >-
            Optional. The relationship of the current span relative to the
            linked span.
          type: string
          enum:
            - TYPE_UNSPECIFIED
            - CHILD_LINKED_SPAN
            - PARENT_LINKED_SPAN
          enumDescriptions:
            - The relationship of the two spans is unknown.
            - The linked span is a child of the current span.
            - The linked span is a parent of the current span.
    Status:
      id: Status
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      type: object
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          type: integer
          format: int32
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
        details:
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          type: array
    AttributeValue:
      id: AttributeValue
      description: The allowed types for `[VALUE]` in a `[KEY]:[VALUE]` attribute.
      type: object
      properties:
        intValue:
          format: int64
          description: Optional. A 64-bit signed integer.
          type: string
        stringValue:
          description: Optional. A string up to 256 bytes long.
          $ref: '#/components/schemas/TruncatableString'
        boolValue:
          description: Optional. A Boolean value represented by `true` or `false`.
          type: boolean
    Attributes:
      id: Attributes
      description: A set of attributes as key-value pairs.
      type: object
      properties:
        droppedAttributesCount:
          description: >-
            Optional. The number of attributes that were discarded. Attributes
            can be discarded because their keys are too long or because there
            are too many attributes. If this value is 0 then all attributes are
            valid.
          type: integer
          format: int32
        attributeMap:
          description: >-
            Optional. A set of attributes. Each attribute's key can be up to 128
            bytes long. The value can be a string up to 256 bytes, a signed
            64-bit integer, or the boolean values `true` or `false`. For
            example: "/instance_id": { "string_value": { "value": "my-instance"
            } } "/http/request_bytes": { "int_value": 300 }
            "example.com/myattribute": { "bool_value": false }
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AttributeValue'
    TimeEvent:
      id: TimeEvent
      description: A time-stamped annotation or message event in the Span.
      type: object
      properties:
        messageEvent:
          $ref: '#/components/schemas/MessageEvent'
          description: An event describing a message sent/received between Spans.
        time:
          description: Optional. The timestamp indicating the time the event occurred.
          type: string
          format: google-datetime
        annotation:
          $ref: '#/components/schemas/Annotation'
          description: Text annotation with a set of attributes.
    StackTrace:
      id: StackTrace
      description: A call stack appearing in a trace.
      type: object
      properties:
        stackFrames:
          description: >-
            Optional. Stack frames in this stack trace. A maximum of 128 frames
            are allowed.
          $ref: '#/components/schemas/StackFrames'
        stackTraceHashId:
          description: >-
            Optional. The hash ID is used to conserve network bandwidth for
            duplicate stack traces within a single trace. Often multiple spans
            will have identical stack traces. The first occurrence of a stack
            trace should contain both the `stackFrame` content and a value in
            `stackTraceHashId`. Subsequent spans within the same request can
            refer to that stack trace by only setting `stackTraceHashId`.
          type: string
          format: int64
    BatchWriteSpansRequest:
      properties:
        spans:
          items:
            $ref: '#/components/schemas/Span'
          description: >-
            Required. A list of new spans. The span names must not match
            existing spans, otherwise the results are undefined.
          type: array
      id: BatchWriteSpansRequest
      description: The request message for the `BatchWriteSpans` method.
      type: object
    MessageEvent:
      properties:
        type:
          enum:
            - TYPE_UNSPECIFIED
            - SENT
            - RECEIVED
          description: >-
            Optional. Type of MessageEvent. Indicates whether the message was
            sent or received.
          type: string
          enumDescriptions:
            - Unknown event type.
            - Indicates a sent message.
            - Indicates a received message.
        id:
          description: >-
            Optional. An identifier for the MessageEvent's message that can be
            used to match `SENT` and `RECEIVED` MessageEvents.
          type: string
          format: int64
        compressedSizeBytes:
          format: int64
          description: >-
            Optional. The number of compressed bytes sent or received. If
            missing, the compressed size is assumed to be the same size as the
            uncompressed size.
          type: string
        uncompressedSizeBytes:
          format: int64
          description: Optional. The number of uncompressed bytes sent or received.
          type: string
      id: MessageEvent
      description: An event describing a message sent/received between Spans.
      type: object
  parameters:
