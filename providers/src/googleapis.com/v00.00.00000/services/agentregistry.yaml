components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    A2ASkill:
      description: Represents the skills of an Agent.
      id: A2ASkill
      properties:
        description:
          description: Output only. A more detailed description of the skill.
          readOnly: true
          type: string
        examples:
          description: Output only. Example prompts or scenarios this skill can handle.
          items:
            type: string
          readOnly: true
          type: array
        id:
          description: Output only. A unique identifier for the agent's skill.
          readOnly: true
          type: string
        name:
          description: Output only. A human-readable name for the agent's skill.
          readOnly: true
          type: string
        tags:
          description: Output only. Keywords describing the skill.
          items:
            type: string
          readOnly: true
          type: array
      type: object
    Agent:
      description: Represents an Agent. "A2A" below refers to the Agent-to-Agent protocol.
      id: Agent
      properties:
        agentId:
          description: Output only. A stable, globally unique identifier for agents.
          readOnly: true
          type: string
        attributes:
          additionalProperties:
            additionalProperties:
              description: Properties of the object.
              type: any
            type: object
          description: >-
            Output only. Attributes of the Agent. Valid values: *
            `agentregistry.googleapis.com/system/Framework`: {"framework":
            "google-adk"} - the agent framework used to develop the Agent.
            Example values: "google-adk", "langchain", "custom". *
            `agentregistry.googleapis.com/system/RuntimeIdentity`: {"principal":
            "principal://..."} - the runtime identity associated with the Agent.
            * `agentregistry.googleapis.com/system/RuntimeReference`: {"uri":
            "//..."} - the URI of the underlying resource hosting the Agent, for
            example, the Reasoning Engine URI.
          readOnly: true
          type: object
        card:
          $ref: '#/components/schemas/Card'
          description: Output only. Full Agent Card payload, when available.
          readOnly: true
        createTime:
          description: Output only. Create time.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Output only. The description of the Agent, often obtained from the
            A2A Agent Card. Empty if Agent Card has no description.
          readOnly: true
          type: string
        displayName:
          description: >-
            Output only. The display name of the agent, often obtained from the
            A2A Agent Card.
          readOnly: true
          type: string
        location:
          description: >-
            Output only. The location where agent is hosted. The value is
            defined by the hosting environment (i.e. cloud provider).
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. The resource name of an Agent. Format:
            `projects/{project}/locations/{location}/agents/{agent}`.
          type: string
        protocols:
          description: Output only. The connection details for the Agent.
          items:
            $ref: '#/components/schemas/Protocol'
          readOnly: true
          type: array
        skills:
          description: >-
            Output only. Skills the agent possesses, often obtained from the A2A
            Agent Card.
          items:
            $ref: '#/components/schemas/A2ASkill'
          readOnly: true
          type: array
        uid:
          description: Output only. A universally unique identifier for the Agent.
          readOnly: true
          type: string
        updateTime:
          description: Output only. Update time.
          format: google-datetime
          readOnly: true
          type: string
        version:
          description: >-
            Output only. The version of the Agent, often obtained from the A2A
            Agent Card. Empty if Agent Card has no version or agent is not an
            A2A Agent.
          readOnly: true
          type: string
      type: object
    AgentSpec:
      description: The spec of the agent.
      id: AgentSpec
      properties:
        content:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Optional. The content of the Agent spec in the JSON format. This
            payload is validated against the schema for the specified type. The
            content size is limited to `10KB`.
          type: object
        type:
          description: Required. The type of the agent spec content.
          enum:
            - TYPE_UNSPECIFIED
            - NO_SPEC
            - A2A_AGENT_CARD
          enumDescriptions:
            - Unspecified type.
            - There is no spec for the Agent. The `content` field must be empty.
            - >-
              The content is an A2A Agent Card following the A2A specification.
              The `interfaces` field must be empty.
          type: string
      type: object
    Annotations:
      description: >-
        Annotations describing the characteristics and behavior of a tool or
        operation.
      id: Annotations
      properties:
        destructiveHint:
          description: >-
            Output only. If true, the tool may perform destructive updates to
            its environment. If false, the tool performs only additive updates.
            NOTE: This property is meaningful only when `read_only_hint ==
            false` Default: true
          readOnly: true
          type: boolean
        idempotentHint:
          description: >-
            Output only. If true, calling the tool repeatedly with the same
            arguments will have no additional effect on its environment. NOTE:
            This property is meaningful only when `read_only_hint == false`
            Default: false
          readOnly: true
          type: boolean
        openWorldHint:
          description: >-
            Output only. If true, this tool may interact with an "open world" of
            external entities. If false, the tool's domain of interaction is
            closed. For example, the world of a web search tool is open, whereas
            that of a memory tool is not. Default: true
          readOnly: true
          type: boolean
        readOnlyHint:
          description: >-
            Output only. If true, the tool does not modify its environment.
            Default: false
          readOnly: true
          type: boolean
        title:
          description: Output only. A human-readable title for the tool.
          readOnly: true
          type: string
      type: object
    AuthProviderBinding:
      description: The AuthProvider of the Binding.
      id: AuthProviderBinding
      properties:
        authProvider:
          description: >-
            Required. The resource name of the target AuthProvider. Format: *
            `projects/{project}/locations/{location}/authProviders/{auth_provider}`
          type: string
        continueUri:
          description: >-
            Optional. The continue URI of the AuthProvider. The URI is used to
            reauthenticate the user and finalize the managed OAuth flow.
          type: string
        scopes:
          description: Optional. The list of OAuth2 scopes of the AuthProvider.
          items:
            type: string
          type: array
      type: object
    Binding:
      description: Represents a user-defined Binding.
      id: Binding
      properties:
        authProviderBinding:
          $ref: '#/components/schemas/AuthProviderBinding'
          description: The binding for AuthProvider.
        createTime:
          description: Output only. Timestamp when this binding was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. User-defined description of a Binding. Can have a maximum
            length of `2048` characters.
          type: string
        displayName:
          description: >-
            Optional. User-defined display name for the Binding. Can have a
            maximum length of `63` characters.
          type: string
        name:
          description: >-
            Required. Identifier. The resource name of the Binding. Format:
            `projects/{project}/locations/{location}/bindings/{binding}`.
          type: string
        source:
          $ref: '#/components/schemas/Source'
          description: Required. The target Agent of the Binding.
        target:
          $ref: '#/components/schemas/Target'
          description: Required. The target Agent Registry Resource of the Binding.
        updateTime:
          description: Output only. Timestamp when this binding was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    Card:
      description: Full Agent Card payload, often obtained from the A2A Agent Card.
      id: Card
      properties:
        content:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: Output only. The content of the agent card.
          readOnly: true
          type: object
        type:
          description: Output only. The type of agent card.
          enum:
            - TYPE_UNSPECIFIED
            - A2A_AGENT_CARD
          enumDescriptions:
            - Unspecified type.
            - Indicates that the card is an A2A Agent Card.
          readOnly: true
          type: string
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    Endpoint:
      description: Represents an Endpoint.
      id: Endpoint
      properties:
        attributes:
          additionalProperties:
            additionalProperties:
              description: Properties of the object.
              type: any
            type: object
          description: >-
            Output only. Attributes of the Endpoint. Valid values: *
            `agentregistry.googleapis.com/system/RuntimeReference`: {"uri":
            "//..."} - the URI of the underlying resource hosting the Endpoint,
            for example, the GKE Deployment.
          readOnly: true
          type: object
        createTime:
          description: Output only. Create time.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Output only. Description of an Endpoint.
          readOnly: true
          type: string
        displayName:
          description: Output only. Display name for the Endpoint.
          readOnly: true
          type: string
        endpointId:
          description: Output only. A stable, globally unique identifier for Endpoint.
          readOnly: true
          type: string
        interfaces:
          description: Required. The connection details for the Endpoint.
          items:
            $ref: '#/components/schemas/Interface'
          type: array
        name:
          description: >-
            Identifier. The resource name of the Endpoint. Format:
            `projects/{project}/locations/{location}/endpoints/{endpoint}`.
          type: string
        updateTime:
          description: Output only. Update time.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    EndpointSpec:
      description: The spec of the endpoint.
      id: EndpointSpec
      properties:
        content:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: Optional. The content of the endpoint spec. Reserved for future use.
          type: object
        type:
          description: Required. The type of the endpoint spec content.
          enum:
            - TYPE_UNSPECIFIED
            - NO_SPEC
          enumDescriptions:
            - Unspecified type.
            - >-
              There is no spec for the Endpoint. The `content` field must be
              empty.
          type: string
      type: object
    FetchAvailableBindingsResponse:
      description: Message for response to fetching available Bindings.
      id: FetchAvailableBindingsResponse
      properties:
        bindings:
          description: The list of Bindings.
          items:
            $ref: '#/components/schemas/Binding'
          type: array
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
      type: object
    Interface:
      description: Represents the connection details for an Agent or MCP Server.
      id: Interface
      properties:
        protocolBinding:
          description: Required. The protocol binding of the interface.
          enum:
            - PROTOCOL_BINDING_UNSPECIFIED
            - JSONRPC
            - GRPC
            - HTTP_JSON
          enumDescriptions:
            - Unspecified transport protocol.
            - JSON-RPC specification.
            - gRPC specification.
            - HTTP+JSON specification.
          type: string
        url:
          description: Required. The destination URL.
          type: string
      type: object
    ListAgentsResponse:
      description: Message for response to listing Agents
      id: ListAgentsResponse
      properties:
        agents:
          description: The list of Agents.
          items:
            $ref: '#/components/schemas/Agent'
          type: array
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
      type: object
    ListBindingsResponse:
      description: Message for response to listing Bindings
      id: ListBindingsResponse
      properties:
        bindings:
          description: >-
            The list of Binding resources matching the parent and filter
            criteria in the request. Each Binding resource follows the format:
            `projects/{project}/locations/{location}/bindings/{binding}`.
          items:
            $ref: '#/components/schemas/Binding'
          type: array
        nextPageToken:
          description: >-
            A token identifying a page of results the server should return. Used
            in page_token.
          type: string
      type: object
    ListEndpointsResponse:
      description: Message for response to listing Endpoints
      id: ListEndpointsResponse
      properties:
        endpoints:
          description: >-
            The list of Endpoint resources matching the parent and filter
            criteria in the request. Each Endpoint resource follows the format:
            `projects/{project}/locations/{location}/endpoints/{endpoint}`.
          items:
            $ref: '#/components/schemas/Endpoint'
          type: array
        nextPageToken:
          description: >-
            A token identifying a page of results the server should return. Used
            in page_token.
          type: string
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListMcpServersResponse:
      description: Message for response to listing McpServers
      id: ListMcpServersResponse
      properties:
        mcpServers:
          description: The list of McpServers.
          items:
            $ref: '#/components/schemas/McpServer'
          type: array
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    ListServicesResponse:
      description: Message for response to listing Services
      id: ListServicesResponse
      properties:
        nextPageToken:
          description: >-
            A token identifying a page of results the server should return. Used
            in page_token.
          type: string
        services:
          description: >-
            The list of Service resources matching the parent and filter
            criteria in the request. Each Service resource follows the format:
            `projects/{project}/locations/{location}/services/{service}`.
          items:
            $ref: '#/components/schemas/Service'
          type: array
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    McpServer:
      description: Represents an MCP (Model Context Protocol) Server.
      id: McpServer
      properties:
        attributes:
          additionalProperties:
            additionalProperties:
              description: Properties of the object.
              type: any
            type: object
          description: >-
            Output only. Attributes of the MCP Server. Valid values: *
            `agentregistry.googleapis.com/system/RuntimeIdentity`: {"principal":
            "principal://..."} - the runtime identity associated with the MCP
            Server. * `agentregistry.googleapis.com/system/RuntimeReference`:
            {"uri": "//..."} - the URI of the underlying resource hosting the
            MCP Server, for example, the GKE Deployment.
          readOnly: true
          type: object
        createTime:
          description: Output only. Create time.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Output only. The description of the MCP Server.
          readOnly: true
          type: string
        displayName:
          description: Output only. The display name of the MCP Server.
          readOnly: true
          type: string
        interfaces:
          description: Output only. The connection details for the MCP Server.
          items:
            $ref: '#/components/schemas/Interface'
          readOnly: true
          type: array
        mcpServerId:
          description: Output only. A stable, globally unique identifier for MCP Servers.
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. The resource name of the MCP Server. Format:
            `projects/{project}/locations/{location}/mcpServers/{mcp_server}`.
          type: string
        tools:
          description: Output only. Tools provided by the MCP Server.
          items:
            $ref: '#/components/schemas/Tool'
          readOnly: true
          type: array
        updateTime:
          description: Output only. Update time.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    McpServerSpec:
      description: The spec of the MCP Server.
      id: McpServerSpec
      properties:
        content:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Optional. The content of the MCP Server spec. This payload is
            validated against the schema for the specified type. The content
            size is limited to `10KB`.
          type: object
        type:
          description: Required. The type of the MCP Server spec content.
          enum:
            - TYPE_UNSPECIFIED
            - NO_SPEC
            - TOOL_SPEC
          enumDescriptions:
            - Unspecified type.
            - >-
              There is no spec for the MCP Server. The `content` field must be
              empty.
            - >-
              The content is a MCP Tool Spec following the One MCP
              specification. The payload is the same as the `tools/list`
              response.
          type: string
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        statusMessage:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    Protocol:
      description: Represents the protocol of an Agent.
      id: Protocol
      properties:
        interfaces:
          description: Output only. The connection details for the Agent.
          items:
            $ref: '#/components/schemas/Interface'
          readOnly: true
          type: array
        protocolVersion:
          description: >-
            Output only. The version of the protocol, for example, the A2A Agent
            Card version.
          readOnly: true
          type: string
        type:
          description: Output only. The type of the protocol.
          enum:
            - TYPE_UNSPECIFIED
            - A2A_AGENT
            - CUSTOM
          enumDescriptions:
            - Unspecified type.
            - >-
              The interfaces point to an A2A Agent following the A2A
              specification.
            - Agent does not follow any standard protocol.
          readOnly: true
          type: string
      type: object
    SearchAgentsRequest:
      description: Message for searching Agents
      id: SearchAgentsRequest
      properties:
        pageSize:
          description: >-
            Optional. The maximum number of search results to return per page.
            The page size is capped at `100`, even if a larger value is
            specified. A negative value will result in an `INVALID_ARGUMENT`
            error. If unspecified or set to `0`, a default value of `20` will be
            used. The server may return fewer results than requested.
          format: int32
          type: integer
        pageToken:
          description: >-
            Optional. If present, retrieve the next batch of results from the
            preceding call to this method. `page_token` must be the value of
            `next_page_token` from the previous response. The values of all
            other method parameters, must be identical to those in the previous
            call.
          type: string
        searchString:
          description: >-
            Optional. Search criteria used to select the Agents to return. If no
            search criteria is specified then all accessible Agents will be
            returned. Search expressions can be used to restrict results based
            upon searchable fields, where the operators can be used along with
            the suffix wildcard symbol `*`. See
            [instructions](https://docs.cloud.google.com/agent-registry/search-agents-and-tools)
            for more details. Allowed operators: `=`, `:`, `NOT`, `AND`, `OR`,
            and `()`. Searchable fields: | Field | `=` | `:` | `*` | Keyword
            Search | |--------------------|-----|-----|-----|----------------| |
            agentId | Yes | Yes | Yes | Included | | name | No | Yes | Yes |
            Included | | displayName | No | Yes | Yes | Included | | description
            | No | Yes | No | Included | | skills | No | Yes | No | Included | |
            skills.id | No | Yes | No | Included | | skills.name | No | Yes | No
            | Included | | skills.description | No | Yes | No | Included | |
            skills.tags | No | Yes | No | Included | | skills.examples | No |
            Yes | No | Included | Examples: *
            `agentId="urn:agent:projects-123:projects:123:locations:us-central1:reasoningEngines:1234"`
            to find the agent with the specified agent ID. * `name:important` to
