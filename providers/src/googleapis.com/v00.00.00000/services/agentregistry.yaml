      description: Message for response to listing Services
      type: object
      id: ListServicesResponse
    Service:
      type: object
      id: Service
      properties:
        registryResource:
          type: string
          description: >-
            Output only. The resource name of the resulting Agent, MCP Server,
            or Endpoint. Format: *
            `projects/{project}/locations/{location}/mcpServers/{mcp_server}` *
            `projects/{project}/locations/{location}/agents/{agent}` *
            `projects/{project}/locations/{location}/endpoints/{endpoint}`
          readOnly: true
        mcpServerSpec:
          description: >-
            Optional. The spec of the MCP Server. When `mcp_server_spec` is set,
            the type of the service is MCP Server.
          $ref: '#/components/schemas/McpServerSpec'
        createTime:
          format: google-datetime
          type: string
          description: Output only. Create time.
          readOnly: true
        agentSpec:
          description: >-
            Optional. The spec of the Agent. When `agent_spec` is set, the type
            of the service is Agent.
          $ref: '#/components/schemas/AgentSpec'
        name:
          type: string
          description: >-
            Identifier. The resource name of the Service. Format:
            `projects/{project}/locations/{location}/services/{service}`.
        displayName:
          description: >-
            Optional. User-defined display name for the Service. Can have a
            maximum length of `63` characters.
          type: string
        endpointSpec:
          description: >-
            Optional. The spec of the Endpoint. When `endpoint_spec` is set, the
            type of the service is Endpoint.
          $ref: '#/components/schemas/EndpointSpec'
        description:
          description: >-
            Optional. User-defined description of an Service. Can have a maximum
            length of `2048` characters.
          type: string
        interfaces:
          description: Optional. The connection details for the Service.
          items:
            $ref: '#/components/schemas/Interface'
          type: array
        updateTime:
          description: Output only. Update time.
          readOnly: true
          format: google-datetime
          type: string
      description: Represents a user-defined Service.
    FetchAvailableBindingsResponse:
      type: object
      id: FetchAvailableBindingsResponse
      properties:
        bindings:
          type: array
          description: The list of Bindings.
          items:
            $ref: '#/components/schemas/Binding'
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
      description: Message for response to fetching available Bindings.
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          type: integer
          format: int32
        message:
          type: string
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
      id: Status
      type: object
    Protocol:
      description: Represents the protocol of an Agent.
      properties:
        type:
          readOnly: true
          enumDescriptions:
            - Unspecified type.
            - >-
              The interfaces point to an A2A Agent following the A2A
              specification.
            - Agent does not follow any standard protocol.
          description: Output only. The type of the protocol.
          enum:
            - TYPE_UNSPECIFIED
            - A2A_AGENT
