          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Condition'
          readOnly: true
          type: array
        containers:
          description: >-
            Holds the single container that defines the unit of execution for
            this task.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Container'
          type: array
        createTime:
          description: >-
            Output only. Represents time when the task was created by the
            system. It is not guaranteed to be set in happens-before order
            across separate operations.
          format: google-datetime
          readOnly: true
          type: string
        deleteTime:
          description: >-
            Output only. For a deleted resource, the deletion time. It is only
            populated as a response to a Delete request.
          format: google-datetime
          readOnly: true
          type: string
        encryptionKey:
          description: >-
            Output only. A reference to a customer managed encryption key (CMEK)
            to use to encrypt this container image. For more information, go to
            https://cloud.google.com/run/docs/securing/using-cmek
          readOnly: true
          type: string
        etag:
          description: >-
            Output only. A system-generated fingerprint for this version of the
            resource. May be used to detect modification conflict during
            updates.
          readOnly: true
          type: string
        execution:
          description: Output only. The name of the parent Execution.
          readOnly: true
          type: string
        executionEnvironment:
          description: The execution environment being used to host this Task.
          enum:
            - EXECUTION_ENVIRONMENT_UNSPECIFIED
            - EXECUTION_ENVIRONMENT_GEN1
            - EXECUTION_ENVIRONMENT_GEN2
          enumDescriptions:
            - Unspecified
            - Uses the First Generation environment.
            - Uses Second Generation environment.
          type: string
        expireTime:
          description: >-
            Output only. For a deleted resource, the time after which it will be
            permamently deleted. It is only populated as a response to a Delete
            request.
          format: google-datetime
          readOnly: true
          type: string
        generation:
          description: >-
            Output only. A number that monotonically increases every time the
            user modifies the desired state.
          format: int64
          readOnly: true
          type: string
        gpuZonalRedundancyDisabled:
          description: >-
            Optional. Output only. True if GPU zonal redundancy is disabled on
            this task.
          readOnly: true
          type: boolean
        index:
          description: >-
            Output only. Index of the Task, unique per execution, and beginning
            at 0.
          format: int32
          readOnly: true
          type: integer
        job:
          description: Output only. The name of the parent Job.
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Output only. Unstructured key value map that can be used to organize
            and categorize objects. User-provided labels are shared with
            Google's billing system, so they can be used to filter, or break
            down billing charges by team, component, environment, state, etc.
            For more information, visit
            https://cloud.google.com/resource-manager/docs/creating-managing-labels
            or https://cloud.google.com/run/docs/configuring/labels
          readOnly: true
          type: object
        lastAttemptResult:
          $ref: '#/components/schemas/GoogleCloudRunV2TaskAttemptResult'
          description: Output only. Result of the last attempt of this Task.
          readOnly: true
        logUri:
          description: >-
            Output only. URI where logs for this execution can be found in Cloud
            Console.
          readOnly: true
          type: string
        maxRetries:
          description: Number of retries allowed per Task, before marking this Task failed.
          format: int32
          type: integer
        name:
          description: Output only. The unique name of this Task.
          readOnly: true
          type: string
        nodeSelector:
          $ref: '#/components/schemas/GoogleCloudRunV2NodeSelector'
          description: Output only. The node selector for the task.
          readOnly: true
        observedGeneration:
          description: >-
            Output only. The generation of this Task. See comments in
            `Job.reconciling` for additional information on reconciliation
            process in Cloud Run.
          format: int64
          readOnly: true
          type: string
        reconciling:
          description: >-
            Output only. Indicates whether the resource's reconciliation is
            still in progress. See comments in `Job.reconciling` for additional
            information on reconciliation process in Cloud Run.
          readOnly: true
          type: boolean
        retried:
          description: >-
            Output only. The number of times this Task was retried. Tasks are
            retried when they fail up to the maxRetries limit.
          format: int32
          readOnly: true
          type: integer
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        scheduledTime:
          description: >-
            Output only. Represents time when the task was scheduled to run by
            the system. It is not guaranteed to be set in happens-before order
            across separate operations.
          format: google-datetime
          readOnly: true
          type: string
        serviceAccount:
          description: >-
            Email address of the IAM service account associated with the Task of
            a Job. The service account represents the identity of the running
            task, and determines what permissions the task has. If not provided,
            the task will use the project's default service account.
          type: string
        startTime:
          description: >-
            Output only. Represents time when the task started to run. It is not
            guaranteed to be set in happens-before order across separate
            operations.
          format: google-datetime
          readOnly: true
          type: string
        timeout:
          description: >-
            Max allowed time duration the Task may be active before the system
            will actively try to mark it failed and kill associated containers.
            This applies per attempt of a task, meaning each retry can run for
            the full timeout.
          format: google-duration
          type: string
        uid:
          description: >-
            Output only. Server assigned unique identifier for the Task. The
            value is a UUID4 string and guaranteed to remain unchanged until the
            resource is deleted.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The last-modified time.
          format: google-datetime
          readOnly: true
          type: string
        volumes:
          description: A list of Volumes to make available to containers.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Volume'
          type: array
        vpcAccess:
          $ref: '#/components/schemas/GoogleCloudRunV2VpcAccess'
          description: >-
            Output only. VPC Access configuration to use for this Task. For more
            information, visit
            https://cloud.google.com/run/docs/configuring/connecting-vpc.
          readOnly: true
      type: object
    GoogleCloudRunV2TaskAttemptResult:
      description: Result of a task attempt.
      id: GoogleCloudRunV2TaskAttemptResult
      properties:
        exitCode:
          description: >-
            Output only. The exit code of this attempt. This may be unset if the
            container was unable to exit cleanly with a code due to some other
            failure. See status field for possible failure details. At most one
            of exit_code or term_signal will be set.
          format: int32
          readOnly: true
          type: integer
        status:
          $ref: '#/components/schemas/GoogleRpcStatus'
          description: >-
            Output only. The status of this attempt. If the status code is OK,
            then the attempt succeeded.
          readOnly: true
        termSignal:
          description: >-
            Output only. Termination signal of the container. This is set to
            non-zero if the container is terminated by the system. At most one
            of exit_code or term_signal will be set.
          format: int32
          readOnly: true
          type: integer
      type: object
    GoogleCloudRunV2TaskTemplate:
      description: >-
        TaskTemplate describes the data a task should have when created from a
        template.
      id: GoogleCloudRunV2TaskTemplate
      properties:
        containers:
          description: >-
            Holds the single container that defines the unit of execution for
            this task.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Container'
          type: array
        encryptionKey:
          description: >-
            A reference to a customer managed encryption key (CMEK) to use to
            encrypt this container image. For more information, go to
            https://cloud.google.com/run/docs/securing/using-cmek
          type: string
        executionEnvironment:
          description: Optional. The execution environment being used to host this Task.
          enum:
            - EXECUTION_ENVIRONMENT_UNSPECIFIED
            - EXECUTION_ENVIRONMENT_GEN1
            - EXECUTION_ENVIRONMENT_GEN2
          enumDescriptions:
            - Unspecified
            - Uses the First Generation environment.
            - Uses Second Generation environment.
          type: string
        gpuZonalRedundancyDisabled:
          description: >-
            Optional. True if GPU zonal redundancy is disabled on this task
            template.
          type: boolean
        maxRetries:
          description: >-
            Number of retries allowed per Task, before marking this Task failed.
            Defaults to 3.
          format: int32
          type: integer
        nodeSelector:
          $ref: '#/components/schemas/GoogleCloudRunV2NodeSelector'
          description: Optional. The node selector for the task template.
        serviceAccount:
          description: >-
            Optional. Email address of the IAM service account associated with
            the Task of a Job. The service account represents the identity of
            the running task, and determines what permissions the task has. If
            not provided, the task will use the project's default service
            account.
          type: string
        timeout:
          description: >-
            Optional. Max allowed time duration the Task may be active before
            the system will actively try to mark it failed and kill associated
            containers. This applies per attempt of a task, meaning each retry
            can run for the full timeout. Defaults to 600 seconds.
          format: google-duration
          type: string
        volumes:
          description: Optional. A list of Volumes to make available to containers.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Volume'
          type: array
        vpcAccess:
          $ref: '#/components/schemas/GoogleCloudRunV2VpcAccess'
          description: >-
            Optional. VPC Access configuration to use for this Task. For more
            information, visit
            https://cloud.google.com/run/docs/configuring/connecting-vpc.
      type: object
    GoogleCloudRunV2TrafficTarget:
      description: >-
        Holds a single traffic routing entry for the Service. Allocations can be
        done to a specific Revision name, or pointing to the latest Ready
        Revision.
      id: GoogleCloudRunV2TrafficTarget
      properties:
        percent:
          description: >-
            Specifies percent of the traffic to this Revision. This defaults to
            zero if unspecified.
          format: int32
          type: integer
        revision:
          description: >-
            Revision to which to send this portion of traffic, if traffic
            allocation is by revision.
          type: string
        tag:
          description: >-
            Indicates a string to be part of the URI to exclusively reference
            this target.
          type: string
        type:
          description: The allocation type for this traffic target.
          enum:
            - TRAFFIC_TARGET_ALLOCATION_TYPE_UNSPECIFIED
            - TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
            - TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION
          enumDescriptions:
            - Unspecified instance allocation type.
            - Allocates instances to the Service's latest ready Revision.
            - Allocates instances to a Revision by name.
          type: string
      type: object
    GoogleCloudRunV2TrafficTargetStatus:
      description: Represents the observed state of a single `TrafficTarget` entry.
      id: GoogleCloudRunV2TrafficTargetStatus
      properties:
        percent:
          description: Specifies percent of the traffic to this Revision.
          format: int32
          type: integer
        revision:
          description: Revision to which this traffic is sent.
          type: string
        tag:
          description: >-
            Indicates the string used in the URI to exclusively reference this
            target.
          type: string
        type:
          description: The allocation type for this traffic target.
          enum:
            - TRAFFIC_TARGET_ALLOCATION_TYPE_UNSPECIFIED
            - TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
            - TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION
          enumDescriptions:
            - Unspecified instance allocation type.
            - Allocates instances to the Service's latest ready Revision.
            - Allocates instances to a Revision by name.
          type: string
        uri:
          description: Displays the target URI.
          type: string
      type: object
    GoogleCloudRunV2UploadSourceRequest:
      description: The request message for the UploadSource method.
      id: GoogleCloudRunV2UploadSourceRequest
      properties:
        service:
          description: >-
            The name of Cloud Run Service upload source archive will be used
            for.
          type: string
      type: object
    GoogleCloudRunV2UploadSourceResponse:
      description: The response message for the UploadSource method.
      id: GoogleCloudRunV2UploadSourceResponse
      properties:
        cloudStorageSource:
          $ref: '#/components/schemas/GoogleCloudRunV2CloudStorageSource'
          description: The Cloud Storage object path the source archive is uploaded to.
      type: object
    GoogleCloudRunV2VersionToPath:
      description: >-
        VersionToPath maps a specific version of a secret to a relative file to
        mount to, relative to VolumeMount's mount_path.
      id: GoogleCloudRunV2VersionToPath
      properties:
        mode:
          description: >-
            Integer octal mode bits to use on this file, must be a value between
            01 and 0777 (octal). If 0 or not set, the Volume's default mode will
            be used. Notes * Internally, a umask of 0222 will be applied to any
            non-zero value. * This is an integer representation of the mode
            bits. So, the octal integer value should look exactly as the chmod
            numeric notation with a leading zero. Some examples: for chmod 640
            (u=rw,g=r), set to 0640 (octal) or 416 (base-10). For chmod 755
            (u=rwx,g=rx,o=rx), set to 0755 (octal) or 493 (base-10). * This
            might be in conflict with other options that affect the file mode,
            like fsGroup, and the result can be other mode bits set.
          format: int32
          type: integer
        path:
          description: Required. The relative path of the secret in the container.
          type: string
        version:
          description: >-
            The Cloud Secret Manager secret version. Can be 'latest' for the
            latest value, or an integer or a secret alias for a specific
            version.
          type: string
      type: object
    GoogleCloudRunV2Volume:
      description: Volume represents a named volume in a container.
      id: GoogleCloudRunV2Volume
      properties:
        cloudSqlInstance:
          $ref: '#/components/schemas/GoogleCloudRunV2CloudSqlInstance'
          description: >-
            For Cloud SQL volumes, contains the specific instances that should
            be mounted. Visit
            https://cloud.google.com/sql/docs/mysql/connect-run for more
            information on how to connect Cloud SQL and Cloud Run.
        emptyDir:
          $ref: '#/components/schemas/GoogleCloudRunV2EmptyDirVolumeSource'
          description: Ephemeral storage used as a shared volume.
        gcs:
          $ref: '#/components/schemas/GoogleCloudRunV2GCSVolumeSource'
          description: Persistent storage backed by a Google Cloud Storage bucket.
        name:
          description: Required. Volume's name.
          type: string
        nfs:
          $ref: '#/components/schemas/GoogleCloudRunV2NFSVolumeSource'
          description: For NFS Voumes, contains the path to the nfs Volume
        secret:
          $ref: '#/components/schemas/GoogleCloudRunV2SecretVolumeSource'
          description: Secret represents a secret that should populate this volume.
      type: object
    GoogleCloudRunV2VolumeMount:
      description: VolumeMount describes a mounting of a Volume within a container.
      id: GoogleCloudRunV2VolumeMount
      properties:
        mountPath:
          description: >-
            Required. Path within the container at which the volume should be
            mounted. Must not contain ':'. For Cloud SQL volumes, it can be left
            empty, or must otherwise be `/cloudsql`. All instances defined in
            the Volume will be available as `/cloudsql/[instance]`. For more
            information on Cloud SQL volumes, visit
            https://cloud.google.com/sql/docs/mysql/connect-run
          type: string
        name:
          description: Required. This must match the Name of a Volume.
          type: string
        subPath:
          description: >-
            Optional. Path within the volume from which the container's volume
            should be mounted. Defaults to "" (volume's root). This field is
            currently rejected in Secret volume mounts.
          type: string
      type: object
    GoogleCloudRunV2VpcAccess:
      description: >-
        VPC Access settings. For more information on sending traffic to a VPC
        network, visit
        https://cloud.google.com/run/docs/configuring/connecting-vpc.
      id: GoogleCloudRunV2VpcAccess
      properties:
        connector:
          description: >-
            VPC Access connector name. Format:
            `projects/{project}/locations/{location}/connectors/{connector}`,
            where `{project}` can be project id or number. For more information
            on sending traffic to a VPC network via a connector, visit
            https://cloud.google.com/run/docs/configuring/vpc-connectors.
          type: string
        egress:
          description: >-
            Optional. Traffic VPC egress settings. If not provided, it defaults
            to PRIVATE_RANGES_ONLY.
          enum:
            - VPC_EGRESS_UNSPECIFIED
            - ALL_TRAFFIC
            - PRIVATE_RANGES_ONLY
          enumDescriptions:
            - Unspecified
            - All outbound traffic is routed through the VPC connector.
            - Only private IP ranges are routed through the VPC connector.
          type: string
        networkInterfaces:
          description: >-
            Optional. Direct VPC egress settings. Currently only single network
            interface is supported.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2NetworkInterface'
          type: array
      type: object
    GoogleCloudRunV2WorkerPool:
      description: >-
        WorkerPool acts as a top-level container that manages a set of
        configurations and revision templates which implement a pull-based
        workload. WorkerPool exists to provide a singular abstraction which can
        be access controlled, reasoned about, and which encapsulates software
        lifecycle decisions such as rollout policy and team resource ownership.
      id: GoogleCloudRunV2WorkerPool
      properties:
        annotations:
          additionalProperties:
            type: string
          description: >-
            Optional. Unstructured key value map that may be set by external
            tools to store and arbitrary metadata. They are not queryable and
            should be preserved when modifying objects. Cloud Run API v2 does
            not support annotations with `run.googleapis.com`,
            `cloud.googleapis.com`, `serving.knative.dev`, or
            `autoscaling.knative.dev` namespaces, and they will be rejected in
            new resources. All system annotations in v1 now have a corresponding
            field in v2 WorkerPool. This field follows Kubernetes annotations'
            namespacing, limits, and rules.
          type: object
        binaryAuthorization:
          $ref: '#/components/schemas/GoogleCloudRunV2BinaryAuthorization'
          description: Optional. Settings for the Binary Authorization feature.
        client:
          description: Arbitrary identifier for the API client.
          type: string
        clientVersion:
          description: Arbitrary version identifier for the API client.
          type: string
        conditions:
          description: >-
            Output only. The Conditions of all other associated sub-resources.
            They contain additional diagnostics information in case the
            WorkerPool does not reach its Serving state. See comments in
            `reconciling` for additional information on reconciliation process
            in Cloud Run.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Condition'
          readOnly: true
          type: array
        createTime:
          description: Output only. The creation time.
          format: google-datetime
          readOnly: true
          type: string
        creator:
          description: Output only. Email address of the authenticated creator.
          readOnly: true
          type: string
        customAudiences:
          deprecated: true
          description: 'Deprecated: Not supported, and ignored by Cloud Run.'
          items:
            type: string
          type: array
        deleteTime:
          description: >-
            Output only. The deletion time. It is only populated as a response
            to a Delete request.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            User-provided description of the WorkerPool. This field currently
            has a 512-character limit.
          type: string
        etag:
          description: >-
            Optional. A system-generated fingerprint for this version of the
            resource. May be used to detect modification conflict during
            updates.
          type: string
        expireTime:
          description: >-
            Output only. For a deleted resource, the time after which it will be
            permamently deleted.
          format: google-datetime
          readOnly: true
          type: string
        generation:
          description: >-
            Output only. A number that monotonically increases every time the
            user modifies the desired state. Please note that unlike v1, this is
            an int64 value. As with most Google APIs, its JSON representation
            will be a `string` instead of an `integer`.
          format: int64
          readOnly: true
          type: string
        instanceSplitStatuses:
          description: >-
            Output only. Detailed status information for corresponding instance
            splits. See comments in `reconciling` for additional information on
            reconciliation process in Cloud Run.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2InstanceSplitStatus'
          readOnly: true
          type: array
        instanceSplits:
          description: >-
            Optional. Specifies how to distribute instances over a collection of
            Revisions belonging to the WorkerPool. If instance split is empty or
            not provided, defaults to 100% instances assigned to the latest
            `Ready` Revision.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2InstanceSplit'
          type: array
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Unstructured key value map that can be used to organize
            and categorize objects. User-provided labels are shared with
            Google's billing system, so they can be used to filter, or break
            down billing charges by team, component, environment, state, etc.
            For more information, visit
            https://cloud.google.com/resource-manager/docs/creating-managing-labels
            or https://cloud.google.com/run/docs/configuring/labels. Cloud Run
            API v2 does not support labels with `run.googleapis.com`,
            `cloud.googleapis.com`, `serving.knative.dev`, or
            `autoscaling.knative.dev` namespaces, and they will be rejected. All
            system labels in v1 now have a corresponding field in v2 WorkerPool.
          type: object
        lastModifier:
          description: Output only. Email address of the last authenticated modifier.
          readOnly: true
          type: string
        latestCreatedRevision:
          description: >-
            Output only. Name of the last created revision. See comments in
            `reconciling` for additional information on reconciliation process
            in Cloud Run.
          readOnly: true
          type: string
        latestReadyRevision:
          description: >-
            Output only. Name of the latest revision that is serving workloads.
            See comments in `reconciling` for additional information on
            reconciliation process in Cloud Run.
          readOnly: true
          type: string
        launchStage:
          description: >-
            Optional. The launch stage as defined by [Google Cloud Platform
            Launch Stages](https://cloud.google.com/terms/launch-stages). Cloud
            Run supports `ALPHA`, `BETA`, and `GA`. If no value is specified, GA
            is assumed. Set the launch stage to a preview stage on input to
            allow use of preview features in that stage. On read (or output),
            describes whether the resource uses preview features. For example,
            if ALPHA is provided as input, but only BETA and GA-level features
            are used, this field will be BETA on output.
          enum:
            - LAUNCH_STAGE_UNSPECIFIED
            - UNIMPLEMENTED
            - PRELAUNCH
            - EARLY_ACCESS
            - ALPHA
            - BETA
            - GA
            - DEPRECATED
          enumDescriptions:
            - Do not use this default value.
            - The feature is not yet implemented. Users can not use it.
            - >-
              Prelaunch features are hidden from users and are only visible
              internally.
            - >-
              Early Access features are limited to a closed group of testers. To
              use these features, you must sign up in advance and sign a Trusted
              Tester agreement (which includes confidentiality provisions).
              These features may be unstable, changed in backward-incompatible
              ways, and are not guaranteed to be released.
            - >-
              Alpha is a limited availability test for releases before they are
              cleared for widespread use. By Alpha, all significant design
              issues are resolved and we are in the process of verifying
              functionality. Alpha customers need to apply for access, agree to
              applicable terms, and have their projects allowlisted. Alpha
              releases don't have to be feature complete, no SLAs are provided,
              and there are no technical support obligations, but they will be
              far enough along that customers can actually use them in test
              environments or for limited-use tests -- just like they would in
              normal production cases.
            - >-
              Beta is the point at which we are ready to open a release for any
              customer to use. There are no SLA or technical support obligations
              in a Beta release. Products will be complete from a feature
              perspective, but may have some open outstanding issues. Beta
              releases are suitable for limited production use cases.
            - >-
              GA features are open to all developers and are considered stable
              and fully qualified for production use.
            - >-
              Deprecated features are scheduled to be shut down and removed. For
              more information, see the "Deprecation Policy" section of our
              [Terms of Service](https://cloud.google.com/terms/) and the
              [Google Cloud Platform Subject to the Deprecation
              Policy](https://cloud.google.com/terms/deprecation) documentation.
          type: string
        name:
          description: >-
            The fully qualified name of this WorkerPool. In
            CreateWorkerPoolRequest, this field is ignored, and instead composed
            from CreateWorkerPoolRequest.parent and
            CreateWorkerPoolRequest.worker_id. Format:
            `projects/{project}/locations/{location}/workerPools/{worker_id}`
          type: string
        observedGeneration:
          description: >-
            Output only. The generation of this WorkerPool currently serving
            workloads. See comments in `reconciling` for additional information
            on reconciliation process in Cloud Run. Please note that unlike v1,
            this is an int64 value. As with most Google APIs, its JSON
            representation will be a `string` instead of an `integer`.
          format: int64
          readOnly: true
          type: string
        reconciling:
          description: >-
            Output only. Returns true if the WorkerPool is currently being acted
            upon by the system to bring it into the desired state. When a new
            WorkerPool is created, or an existing one is updated, Cloud Run will
            asynchronously perform all necessary steps to bring the WorkerPool
            to the desired serving state. This process is called reconciliation.
            While reconciliation is in process, `observed_generation`,
            `latest_ready_revison`, `instance_split_statuses`, and `uri` will
            have transient values that might mismatch the intended state: Once
            reconciliation is over (and this field is false), there are two
            possible outcomes: reconciliation succeeded and the serving state
            matches the WorkerPool, or there was an error, and reconciliation
            failed. This state can be found in `terminal_condition.state`. If
            reconciliation succeeded, the following fields will match:
            `instance_splits` and `instance_split_statuses`,
            `observed_generation` and `generation`, `latest_ready_revision` and
            `latest_created_revision`. If reconciliation failed,
            `instance_split_statuses`, `observed_generation`, and
            `latest_ready_revision` will have the state of the last serving
            revision, or empty for newly created WorkerPools. Additional
            information on the failure can be found in `terminal_condition` and
            `conditions`.
          readOnly: true
          type: boolean
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        scaling:
          $ref: '#/components/schemas/GoogleCloudRunV2WorkerPoolScaling'
          description: Optional. Specifies worker-pool-level scaling settings
        template:
          $ref: '#/components/schemas/GoogleCloudRunV2WorkerPoolRevisionTemplate'
          description: Required. The template used to create revisions for this WorkerPool.
        terminalCondition:
          $ref: '#/components/schemas/GoogleCloudRunV2Condition'
          description: >-
            Output only. The Condition of this WorkerPool, containing its
            readiness status, and detailed error information in case it did not
            reach a serving state. See comments in `reconciling` for additional
            information on reconciliation process in Cloud Run.
          readOnly: true
        threatDetectionEnabled:
          description: >-
            Output only. Indicates whether Cloud Run Threat Detection monitoring
            is enabled for the parent project of this worker pool.
          readOnly: true
          type: boolean
        uid:
          description: >-
            Output only. Server assigned unique identifier for the trigger. The
            value is a UUID4 string and guaranteed to remain unchanged until the
            resource is deleted.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The last-modified time.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudRunV2WorkerPoolRevisionTemplate:
      description: >-
        WorkerPoolRevisionTemplate describes the data a worker pool revision
        should have when created from a template.
      id: GoogleCloudRunV2WorkerPoolRevisionTemplate
      properties:
        annotations:
          additionalProperties:
            type: string
          description: >-
            Optional. Unstructured key value map that may be set by external
            tools to store and arbitrary metadata. They are not queryable and
            should be preserved when modifying objects. Cloud Run API v2 does
            not support annotations with `run.googleapis.com`,
            `cloud.googleapis.com`, `serving.knative.dev`, or
            `autoscaling.knative.dev` namespaces, and they will be rejected. All
            system annotations in v1 now have a corresponding field in v2
            WorkerPoolRevisionTemplate. This field follows Kubernetes
            annotations' namespacing, limits, and rules.
          type: object
        client:
          description: Optional. Arbitrary identifier for the API client.
          type: string
        clientVersion:
          description: Optional. Arbitrary version identifier for the API client.
          type: string
        containers:
          description: >-
            Holds list of the containers that defines the unit of execution for
            this Revision.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Container'
          type: array
        encryptionKey:
          description: >-
            A reference to a customer managed encryption key (CMEK) to use to
            encrypt this container image. For more information, go to
            https://cloud.google.com/run/docs/securing/using-cmek
          type: string
        encryptionKeyRevocationAction:
          description: Optional. The action to take if the encryption key is revoked.
          enum:
            - ENCRYPTION_KEY_REVOCATION_ACTION_UNSPECIFIED
            - PREVENT_NEW
            - SHUTDOWN
          enumDescriptions:
            - Unspecified
            - Prevents the creation of new instances.
            - Shuts down existing instances, and prevents creation of new ones.
          type: string
        encryptionKeyShutdownDuration:
          description: >-
            Optional. If encryption_key_revocation_action is SHUTDOWN, the
            duration before shutting down all instances. The minimum increment
            is 1 hour.
          format: google-duration
          type: string
        gpuZonalRedundancyDisabled:
          description: >-
            Optional. True if GPU zonal redundancy is disabled on this worker
            pool.
          type: boolean
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Unstructured key value map that can be used to organize
            and categorize objects. User-provided labels are shared with
            Google's billing system, so they can be used to filter, or break
            down billing charges by team, component, environment, state, etc.
            For more information, visit
            https://cloud.google.com/resource-manager/docs/creating-managing-labels
            or https://cloud.google.com/run/docs/configuring/labels. Cloud Run
            API v2 does not support labels with `run.googleapis.com`,
            `cloud.googleapis.com`, `serving.knative.dev`, or
            `autoscaling.knative.dev` namespaces, and they will be rejected. All
            system labels in v1 now have a corresponding field in v2
            WorkerPoolRevisionTemplate.
          type: object
        nodeSelector:
          $ref: '#/components/schemas/GoogleCloudRunV2NodeSelector'
          description: Optional. The node selector for the revision template.
        revision:
          description: >-
            Optional. The unique name for the revision. If this field is
            omitted, it will be automatically generated based on the WorkerPool
            name.
          type: string
        serviceAccount:
          description: >-
            Optional. Email address of the IAM service account associated with
            the revision of the service. The service account represents the
            identity of the running revision, and determines what permissions
            the revision has. If not provided, the revision will use the
            project's default service account.
          type: string
        serviceMesh:
          $ref: '#/components/schemas/GoogleCloudRunV2ServiceMesh'
          description: Optional. Enables service mesh connectivity.
        volumes:
          description: Optional. A list of Volumes to make available to containers.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Volume'
          type: array
        vpcAccess:
          $ref: '#/components/schemas/GoogleCloudRunV2VpcAccess'
          description: >-
            Optional. VPC Access configuration to use for this Revision. For
            more information, visit
            https://cloud.google.com/run/docs/configuring/connecting-vpc.
      type: object
    GoogleCloudRunV2WorkerPoolScaling:
      description: Worker pool scaling settings.
      id: GoogleCloudRunV2WorkerPoolScaling
      properties:
        manualInstanceCount:
          description: Optional. The total number of instances in manual scaling mode.
          format: int32
          type: integer
      type: object
    GoogleDevtoolsCloudbuildV1ApprovalConfig:
      description: ApprovalConfig describes configuration for manual approval of a build.
      id: GoogleDevtoolsCloudbuildV1ApprovalConfig
      properties:
        approvalRequired:
          description: >-
            Whether or not approval is needed. If this is set on a build, it
            will become pending when created, and will need to be explicitly
            approved to start.
          type: boolean
      type: object
    GoogleDevtoolsCloudbuildV1ApprovalResult:
      description: >-
        ApprovalResult describes the decision and associated metadata of a
        manual approval of a build.
      id: GoogleDevtoolsCloudbuildV1ApprovalResult
      properties:
        approvalTime:
          description: Output only. The time when the approval decision was made.
          format: google-datetime
          readOnly: true
          type: string
        approverAccount:
          description: >-
            Output only. Email of the user that called the ApproveBuild API to
            approve or reject a build at the time that the API was called.
          readOnly: true
          type: string
        comment:
          description: Optional. An optional comment for this manual approval result.
          type: string
        decision:
          description: Required. The decision of this manual approval.
          enum:
            - DECISION_UNSPECIFIED
            - APPROVED
            - REJECTED
          enumDescriptions:
            - Default enum type. This should not be used.
            - Build is approved.
            - Build is rejected.
          type: string
        url:
          description: >-
            Optional. An optional URL tied to this manual approval result. This
            field is essentially the same as comment, except that it will be
            rendered by the UI differently. An example use case is a link to an
            external job that approved this Build.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1ArtifactObjects:
      description: >-
        Files in the workspace to upload to Cloud Storage upon successful
        completion of all build steps.
      id: GoogleDevtoolsCloudbuildV1ArtifactObjects
      properties:
        location:
          description: >-
            Cloud Storage bucket and optional object path, in the form
            "gs://bucket/path/to/somewhere/". (see [Bucket Name
            Requirements](https://cloud.google.com/storage/docs/bucket-naming#requirements)).
            Files in the workspace matching any path pattern will be uploaded to
            Cloud Storage with this location as a prefix.
          type: string
        paths:
          description: Path globs used to match files in the build's workspace.
          items:
            type: string
          type: array
        timing:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: >-
            Output only. Stores timing information for pushing all artifact
            objects.
          readOnly: true
      type: object
    GoogleDevtoolsCloudbuildV1Artifacts:
      description: >-
        Artifacts produced by a build that should be uploaded upon successful
        completion of all build steps.
      id: GoogleDevtoolsCloudbuildV1Artifacts
      properties:
        genericArtifacts:
          description: >-
            Optional. A list of generic artifacts to be uploaded to Artifact
            Registry upon successful completion of all build steps. If any
            artifacts fail to be pushed, the build is marked FAILURE.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1GenericArtifact'
          type: array
        goModules:
          description: >-
            Optional. A list of Go modules to be uploaded to Artifact Registry
            upon successful completion of all build steps. If any objects fail
            to be pushed, the build is marked FAILURE.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1GoModule'
          type: array
        images:
          description: >-
            A list of images to be pushed upon the successful completion of all
            build steps. The images will be pushed using the builder service
            account's credentials. The digests of the pushed images will be
            stored in the Build resource's results field. If any of the images
            fail to be pushed, the build is marked FAILURE.
          items:
            type: string
          type: array
        mavenArtifacts:
          description: >-
            A list of Maven artifacts to be uploaded to Artifact Registry upon
            successful completion of all build steps. Artifacts in the workspace
            matching specified paths globs will be uploaded to the specified
            Artifact Registry repository using the builder service account's
            credentials. If any artifacts fail to be pushed, the build is marked
            FAILURE.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1MavenArtifact'
          type: array
        npmPackages:
          description: >-
            A list of npm packages to be uploaded to Artifact Registry upon
            successful completion of all build steps. Npm packages in the
            specified paths will be uploaded to the specified Artifact Registry
            repository using the builder service account's credentials. If any
            packages fail to be pushed, the build is marked FAILURE.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1NpmPackage'
          type: array
        objects:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1ArtifactObjects'
          description: >-
            A list of objects to be uploaded to Cloud Storage upon successful
            completion of all build steps. Files in the workspace matching
            specified paths globs will be uploaded to the specified Cloud
            Storage location using the builder service account's credentials.
            The location and generation of the uploaded objects will be stored
            in the Build resource's results field. If any objects fail to be
            pushed, the build is marked FAILURE.
        oci:
          description: >-
            Optional. A list of OCI images to be uploaded to Artifact Registry
            upon successful completion of all build steps. OCI images in the
            specified paths will be uploaded to the specified Artifact Registry
            repository using the builder service account's credentials. If any
            images fail to be pushed, the build is marked FAILURE.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Oci'
          type: array
        pythonPackages:
          description: >-
            A list of Python packages to be uploaded to Artifact Registry upon
            successful completion of all build steps. The build service account
            credentials will be used to perform the upload. If any objects fail
            to be pushed, the build is marked FAILURE.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1PythonPackage'
          type: array
      type: object
    GoogleDevtoolsCloudbuildV1Build:
      description: >-
        A build resource in the Cloud Build API. At a high level, a `Build`
        describes where to find source code, how to build it (for example, the
        builder image to run on the source), and where to store the built
        artifacts. Fields can include the following variables, which will be
        expanded when the build is created: - $PROJECT_ID: the project ID of the
        build. - $PROJECT_NUMBER: the project number of the build. - $LOCATION:
        the location/region of the build. - $BUILD_ID: the autogenerated ID of
        the build. - $REPO_NAME: the source repository name specified by
        RepoSource. - $BRANCH_NAME: the branch name specified by RepoSource. -
        $TAG_NAME: the tag name specified by RepoSource. - $REVISION_ID or
        $COMMIT_SHA: the commit SHA specified by RepoSource or resolved from the
        specified branch or tag. - $SHORT_SHA: first 7 characters of
        $REVISION_ID or $COMMIT_SHA.
      id: GoogleDevtoolsCloudbuildV1Build
      properties:
        approval:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1BuildApproval'
          description: >-
            Output only. Describes this build's approval configuration, status,
            and result.
          readOnly: true
        artifacts:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Artifacts'
          description: >-
            Artifacts produced by the build that should be uploaded upon
            successful completion of all build steps.
        availableSecrets:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Secrets'
          description: Secrets and secret environment variables.
        buildTriggerId:
          description: >-
            Output only. The ID of the `BuildTrigger` that triggered this build,
            if it was triggered automatically.
          readOnly: true
          type: string
        createTime:
          description: >-
            Output only. Time at which the request to create the build was
            received.
          format: google-datetime
          readOnly: true
          type: string
        dependencies:
          description: >-
            Optional. Dependencies that the Cloud Build worker will fetch before
            executing user steps.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Dependency'
          type: array
        failureInfo:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1FailureInfo'
          description: >-
            Output only. Contains information about the build when
            status=FAILURE.
          readOnly: true
        finishTime:
          description: >-
            Output only. Time at which execution of the build was finished. The
            difference between finish_time and start_time is the duration of the
            build's execution.
          format: google-datetime
          readOnly: true
          type: string
        gitConfig:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1GitConfig'
          description: Optional. Configuration for git operations.
        id:
          description: Output only. Unique identifier of the build.
          readOnly: true
          type: string
        images:
          description: >-
            A list of images to be pushed upon the successful completion of all
            build steps. The images are pushed using the builder service
            account's credentials. The digests of the pushed images will be
            stored in the `Build` resource's results field. If any of the images
            fail to be pushed, the build status is marked `FAILURE`.
          items:
            type: string
          type: array
        logUrl:
          description: Output only. URL to logs for this build in Google Cloud Console.
          readOnly: true
          type: string
        logsBucket:
          description: >-
            Cloud Storage bucket where logs should be written (see [Bucket Name
            Requirements](https://cloud.google.com/storage/docs/bucket-naming#requirements)).
            Logs file names will be of the format
            `${logs_bucket}/log-${build_id}.txt`.
          type: string
        name:
          description: >-
            Output only. The 'Build' name with format:
            `projects/{project}/locations/{location}/builds/{build}`, where
            {build} is a unique identifier generated by the service.
          readOnly: true
          type: string
        options:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1BuildOptions'
          description: Special options for this build.
        projectId:
          description: Output only. ID of the project.
          readOnly: true
          type: string
        queueTtl:
          description: >-
            TTL in queue for this build. If provided and the build is enqueued
            longer than this value, the build will expire and the build status
            will be `EXPIRED`. The TTL starts ticking from create_time.
          format: google-duration
          type: string
        results:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Results'
          description: Output only. Results of the build.
          readOnly: true
        secrets:
          description: >-
            Secrets to decrypt using Cloud Key Management Service. Note: Secret
            Manager is the recommended technique for managing sensitive data
            with Cloud Build. Use `available_secrets` to configure builds to
            access secrets from Secret Manager. For instructions, see:
            https://cloud.google.com/cloud-build/docs/securing-builds/use-secrets
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Secret'
          type: array
        serviceAccount:
          description: >-
            IAM service account whose credentials will be used at build runtime.
            Must be of the format
            `projects/{PROJECT_ID}/serviceAccounts/{ACCOUNT}`. ACCOUNT can be
            email address or uniqueId of the service account. 
          type: string
        source:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Source'
          description: Optional. The location of the source files to build.
        sourceProvenance:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1SourceProvenance'
          description: Output only. A permanent fixed identifier for source.
          readOnly: true
        startTime:
          description: Output only. Time at which execution of the build was started.
          format: google-datetime
          readOnly: true
          type: string
        status:
          description: Output only. Status of the build.
          enum:
            - STATUS_UNKNOWN
            - PENDING
            - QUEUED
            - WORKING
            - SUCCESS
            - FAILURE
            - INTERNAL_ERROR
            - TIMEOUT
            - CANCELLED
            - EXPIRED
          enumDescriptions:
            - Status of the build is unknown.
            - >-
              Build has been created and is pending execution and queuing. It
              has not been queued.
            - Build or step is queued; work has not yet begun.
            - Build or step is being executed.
            - Build or step finished successfully.
            - Build or step failed to complete successfully.
            - Build or step failed due to an internal cause.
            - Build or step took longer than was allowed.
            - Build or step was canceled by a user.
            - Build was enqueued for longer than the value of `queue_ttl`.
          readOnly: true
          type: string
        statusDetail:
          description: Output only. Customer-readable message about the current status.
          readOnly: true
          type: string
        steps:
          description: Required. The operations to be performed on the workspace.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1BuildStep'
          type: array
        substitutions:
          additionalProperties:
            type: string
          description: Substitutions data for `Build` resource.
          type: object
        tags:
          description: Tags for annotation of a `Build`. These are not docker tags.
          items:
            type: string
          type: array
        timeout:
          description: >-
            Amount of time that this build should be allowed to run, to second
            granularity. If this amount of time elapses, work on the build will
            cease and the build status will be `TIMEOUT`. `timeout` starts
            ticking from `startTime`. Default time is 60 minutes.
          format: google-duration
          type: string
        timing:
          additionalProperties:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: >-
            Output only. Stores timing information for phases of the build.
            Valid keys are: * BUILD: time to execute all build steps. * PUSH:
            time to push all artifacts including docker images and non docker
            artifacts. * FETCHSOURCE: time to fetch source. * SETUPBUILD: time
            to set up build. If the build does not specify source or images,
            these keys will not be included.
          readOnly: true
          type: object
        warnings:
          description: >-
            Output only. Non-fatal problems encountered during the execution of
            the build.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Warning'
          readOnly: true
          type: array
      type: object
    GoogleDevtoolsCloudbuildV1BuildApproval:
      description: >-
        BuildApproval describes a build's approval configuration, state, and
        result.
      id: GoogleDevtoolsCloudbuildV1BuildApproval
      properties:
        config:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1ApprovalConfig'
          description: Output only. Configuration for manual approval of this build.
          readOnly: true
        result:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1ApprovalResult'
          description: Output only. Result of manual approval for this Build.
          readOnly: true
        state:
          description: Output only. The state of this build's approval.
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - APPROVED
            - REJECTED
            - CANCELLED
          enumDescriptions:
            - Default enum type. This should not be used.
            - Build approval is pending.
            - Build approval has been approved.
            - Build approval has been rejected.
            - Build was cancelled while it was still pending approval.
          readOnly: true
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1BuildOperationMetadata:
      description: Metadata for build operations.
      id: GoogleDevtoolsCloudbuildV1BuildOperationMetadata
      properties:
        build:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Build'
          description: The build that the operation is tracking.
      type: object
    GoogleDevtoolsCloudbuildV1BuildOptions:
      description: Optional arguments to enable specific features of builds.
      id: GoogleDevtoolsCloudbuildV1BuildOptions
      properties:
        automapSubstitutions:
          description: >-
            Option to include built-in and custom substitutions as env variables
            for all build steps.
          type: boolean
        defaultLogsBucketBehavior:
          description: Optional. Option to specify how default logs buckets are setup.
          enum:
            - DEFAULT_LOGS_BUCKET_BEHAVIOR_UNSPECIFIED
            - REGIONAL_USER_OWNED_BUCKET
            - LEGACY_BUCKET
          enumDescriptions:
            - Unspecified.
            - >-
              Bucket is located in user-owned project in the same region as the
              build. The builder service account must have access to create and
              write to Cloud Storage buckets in the build project.
            - >-
              Bucket is located in a Google-owned project and is not
              regionalized.
          type: string
        diskSizeGb:
          description: >-
            Requested disk size for the VM that runs the build. Note that this
            is *NOT* "disk free"; some of the space will be used by the
            operating system and build utilities. Also note that this is the
            minimum disk size that will be allocated for the build -- the build
            may run with a larger disk than requested. At present, the maximum
            disk size is 4000GB; builds that request more than the maximum are
            rejected with an error.
          format: int64
          type: string
        dynamicSubstitutions:
          description: >-
            Option to specify whether or not to apply bash style string
            operations to the substitutions. NOTE: this is always enabled for
            triggered builds and cannot be overridden in the build configuration
            file.
          type: boolean
        enableStructuredLogging:
          description: >-
            Optional. Option to specify whether structured logging is enabled.
            If true, JSON-formatted logs are parsed as structured logs.
          type: boolean
        env:
          description: >-
            A list of global environment variable definitions that will exist
            for all build steps in this build. If a variable is defined in both
            globally and in a build step, the variable will use the build step
            value. The elements are of the form "KEY=VALUE" for the environment
            variable "KEY" being given the value "VALUE".
          items:
            type: string
          type: array
        logStreamingOption:
          description: Option to define build log streaming behavior to Cloud Storage.
          enum:
            - STREAM_DEFAULT
            - STREAM_ON
            - STREAM_OFF
          enumDescriptions:
            - Service may automatically determine build log streaming behavior.
            - Build logs should be streamed to Cloud Storage.
            - >-
              Build logs should not be streamed to Cloud Storage; they will be
              written when the build is completed.
          type: string
        logging:
          description: >-
            Option to specify the logging mode, which determines if and where
            build logs are stored.
          enum:
            - LOGGING_UNSPECIFIED
            - LEGACY
            - GCS_ONLY
            - STACKDRIVER_ONLY
            - CLOUD_LOGGING_ONLY
            - NONE
          enumDeprecated:
            - false
            - false
            - false
            - true
            - false
            - false
          enumDescriptions:
            - >-
              The service determines the logging mode. The default is `LEGACY`.
              Do not rely on the default logging behavior as it may change in
              the future.
            - Build logs are stored in Cloud Logging and Cloud Storage.
            - Build logs are stored in Cloud Storage.
            - This option is the same as CLOUD_LOGGING_ONLY.
            - >-
              Build logs are stored in Cloud Logging. Selecting this option will
              not allow [logs
              streaming](https://cloud.google.com/sdk/gcloud/reference/builds/log).
            - Turn off all logging. No build logs will be captured.
          type: string
        machineType:
          description: Compute Engine machine type on which to run the build.
          enum:
            - UNSPECIFIED
            - N1_HIGHCPU_8
            - N1_HIGHCPU_32
            - E2_HIGHCPU_8
            - E2_HIGHCPU_32
            - E2_MEDIUM
            - E2_STANDARD_2
          enumDeprecated:
            - false
            - true
            - true
            - false
            - false
            - false
            - false
          enumDescriptions:
            - Standard machine type.
            - Highcpu machine with 8 CPUs.
            - Highcpu machine with 32 CPUs.
            - Highcpu e2 machine with 8 CPUs.
            - Highcpu e2 machine with 32 CPUs.
            - E2 machine with 1 CPU.
            - E2 machine with 2 CPUs.
          type: string
        pool:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1PoolOption'
          description: >-
            Optional. Specification for execution on a `WorkerPool`. See
            [running builds in a private
            pool](https://cloud.google.com/build/docs/private-pools/run-builds-in-private-pool)
            for more information.
        pubsubTopic:
          description: >-
            Optional. Option to specify the Pub/Sub topic to receive build
            status updates.
          type: string
        requestedVerifyOption:
          description: Requested verifiability options.
          enum:
            - NOT_VERIFIED
            - VERIFIED
          enumDescriptions:
            - Not a verifiable build (the default).
            - Build must be verified.
          type: string
        secretEnv:
          description: >-
            A list of global environment variables, which are encrypted using a
            Cloud Key Management Service crypto key. These values must be
            specified in the build's `Secret`. These variables will be available
            to all build steps in this build.
          items:
            type: string
          type: array
        sourceProvenanceHash:
          description: Requested hash for SourceProvenance.
          items:
            enum:
              - NONE
              - SHA256
              - MD5
              - GO_MODULE_H1
              - SHA512
              - DIRSUM_SHA256
            enumDescriptions:
              - No hash requested.
              - Use a sha256 hash.
              - Use a md5 hash.
              - Dirhash of a Go module's source code which is then hex-encoded.
              - Use a sha512 hash.
              - Use a dirsum_sha256 hash.
            type: string
          type: array
        substitutionOption:
          description: >-
            Option to specify behavior when there is an error in the
            substitution checks. NOTE: this is always set to ALLOW_LOOSE for
            triggered builds and cannot be overridden in the build configuration
            file.
          enum:
            - MUST_MATCH
            - ALLOW_LOOSE
          enumDescriptions:
            - >-
              Fails the build if error in substitutions checks, like missing a
              substitution in the template or in the map.
            - Do not fail the build if error in substitutions checks.
          type: string
        volumes:
          description: >-
            Global list of volumes to mount for ALL build steps Each volume is
            created as an empty volume prior to starting the build process. Upon
            completion of the build, volumes and their contents are discarded.
            Global volume names and paths cannot conflict with the volumes
            defined a build step. Using a global volume in a build with only one
            step is not valid as it is indicative of a build request with an
            incorrect configuration.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Volume'
          type: array
        workerPool:
          deprecated: true
          description: This field deprecated; please use `pool.name` instead.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1BuildStep:
      description: A step in the build pipeline.
      id: GoogleDevtoolsCloudbuildV1BuildStep
      properties:
        allowExitCodes:
          description: >-
            Allow this build step to fail without failing the entire build if
            and only if the exit code is one of the specified codes. If
            allow_failure is also specified, this field will take precedence.
          items:
            format: int32
            type: integer
          type: array
        allowFailure:
          description: >-
            Allow this build step to fail without failing the entire build. If
            false, the entire build will fail if this step fails. Otherwise, the
            build will succeed, but this step will still have a failure status.
            Error information will be reported in the failure_detail field.
          type: boolean
        args:
          description: >-
            A list of arguments that will be presented to the step when it is
            started. If the image used to run the step's container has an
            entrypoint, the `args` are used as arguments to that entrypoint. If
            the image does not define an entrypoint, the first element in args
            is used as the entrypoint, and the remainder will be used as
            arguments.
          items:
            type: string
          type: array
        automapSubstitutions:
          description: >-
            Option to include built-in and custom substitutions as env variables
            for this build step. This option will override the global option in
            BuildOption.
          type: boolean
        dir:
          description: >-
            Working directory to use when running this step's container. If this
            value is a relative path, it is relative to the build's working
            directory. If this value is absolute, it may be outside the build's
            working directory, in which case the contents of the path may not be
            persisted across build step executions, unless a `volume` for that
            path is specified. If the build specifies a `RepoSource` with `dir`
            and a step with a `dir`, which specifies an absolute path, the
            `RepoSource` `dir` is ignored for the step's execution.
          type: string
        entrypoint:
          description: >-
            Entrypoint to be used instead of the build step image's default
            entrypoint. If unset, the image's default entrypoint is used.
          type: string
        env:
          description: >-
            A list of environment variable definitions to be used when running a
            step. The elements are of the form "KEY=VALUE" for the environment
            variable "KEY" being given the value "VALUE".
          items:
            type: string
          type: array
        exitCode:
          description: Output only. Return code from running the step.
          format: int32
          readOnly: true
          type: integer
        id:
          description: >-
            Unique identifier for this build step, used in `wait_for` to
            reference this build step as a dependency.
          type: string
        name:
          description: >-
            Required. The name of the container image that will run this
            particular build step. If the image is available in the host's
            Docker daemon's cache, it will be run directly. If not, the host
            will attempt to pull the image first, using the builder service
            account's credentials if necessary. The Docker daemon's cache will
            already have the latest versions of all of the officially supported
            build steps
            ([https://github.com/GoogleCloudPlatform/cloud-builders](https://github.com/GoogleCloudPlatform/cloud-builders)).
            The Docker daemon will also have cached many of the layers for some
            popular images, like "ubuntu", "debian", but they will be refreshed
            at the time you attempt to use them. If you built an image in a
            previous build step, it will be stored in the host's Docker daemon's
            cache and is available to use as the name for a later build step.
          type: string
        pullTiming:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: >-
            Output only. Stores timing information for pulling this build step's
            builder image only.
          readOnly: true
        results:
          description: Declaration of results for this build step.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1StepResult'
          type: array
        script:
          description: >-
            A shell script to be executed in the step. When script is provided,
            the user cannot specify the entrypoint or args.
          type: string
        secretEnv:
          description: >-
            A list of environment variables which are encrypted using a Cloud
            Key Management Service crypto key. These values must be specified in
            the build's `Secret`.
          items:
            type: string
          type: array
        status:
          description: >-
            Output only. Status of the build step. At this time, build step
            status is only updated on build completion; step status is not
            updated in real-time as the build progresses.
          enum:
            - STATUS_UNKNOWN
            - PENDING
            - QUEUED
            - WORKING
            - SUCCESS
            - FAILURE
            - INTERNAL_ERROR
            - TIMEOUT
            - CANCELLED
            - EXPIRED
          enumDescriptions:
            - Status of the build is unknown.
            - >-
              Build has been created and is pending execution and queuing. It
              has not been queued.
            - Build or step is queued; work has not yet begun.
            - Build or step is being executed.
            - Build or step finished successfully.
            - Build or step failed to complete successfully.
            - Build or step failed due to an internal cause.
            - Build or step took longer than was allowed.
            - Build or step was canceled by a user.
            - Build was enqueued for longer than the value of `queue_ttl`.
          readOnly: true
          type: string
        timeout:
          description: >-
            Time limit for executing this build step. If not defined, the step
            has no time limit and will be allowed to continue to run until
            either it completes or the build itself times out.
          format: google-duration
          type: string
        timing:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: >-
            Output only. Stores timing information for executing this build
            step.
          readOnly: true
        volumes:
          description: >-
            List of volumes to mount into the build step. Each volume is created
            as an empty volume prior to execution of the build step. Upon
            completion of the build, volumes and their contents are discarded.
            Using a named volume in only one step is not valid as it is
            indicative of a build request with an incorrect configuration.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Volume'
          type: array
        waitFor:
          description: >-
            The ID(s) of the step(s) that this build step depends on. This build
            step will not start until all the build steps in `wait_for` have
            completed successfully. If `wait_for` is empty, this build step will
            start when all previous build steps in the `Build.Steps` list have
            completed successfully.
          items:
            type: string
          type: array
      type: object
    GoogleDevtoolsCloudbuildV1BuildStepResults:
      description: Results for a build step.
      id: GoogleDevtoolsCloudbuildV1BuildStepResults
      properties:
        results:
          additionalProperties:
            type: string
          description: Results for a build step.
          type: object
      type: object
    GoogleDevtoolsCloudbuildV1BuiltImage:
      description: An image built by the pipeline.
      id: GoogleDevtoolsCloudbuildV1BuiltImage
      properties:
        artifactRegistryPackage:
          description: Output only. Path to the artifact in Artifact Registry.
          readOnly: true
          type: string
        digest:
          description: Docker Registry 2.0 digest.
          type: string
        name:
          description: >-
            Name used to push the container image to Google Container Registry,
            as presented to `docker push`.
          type: string
        ociMediaType:
          description: >-
            Output only. The OCI media type of the artifact. Non-OCI images,
            such as Docker images, will have an unspecified value.
          enum:
            - OCI_MEDIA_TYPE_UNSPECIFIED
            - IMAGE_MANIFEST
            - IMAGE_INDEX
          enumDescriptions:
            - Default value.
            - >-
              The artifact is an image manifest, which represents a single image
              with all its layers.
            - >-
              The artifact is an image index, which can contain a list of image
              manifests.
          readOnly: true
          type: string
        pushTiming:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: >-
            Output only. Stores timing information for pushing the specified
            image.
          readOnly: true
      type: object
    GoogleDevtoolsCloudbuildV1ConnectedRepository:
      description: >-
        Location of the source in a 2nd-gen Google Cloud Build repository
        resource.
      id: GoogleDevtoolsCloudbuildV1ConnectedRepository
      properties:
        dir:
          description: >-
            Optional. Directory, relative to the source root, in which to run
            the build.
          type: string
        repository:
          description: >-
            Required. Name of the Google Cloud Build repository, formatted as
            `projects/*/locations/*/connections/*/repositories/*`.
          type: string
        revision:
          description: >-
            Required. The revision to fetch from the Git repository such as a
            branch, a tag, a commit SHA, or any Git ref.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1Dependency:
      description: >-
        A dependency that the Cloud Build worker will fetch before executing
        user steps.
      id: GoogleDevtoolsCloudbuildV1Dependency
      properties:
        empty:
          description: >-
            If set to true disable all dependency fetching (ignoring the default
            source as well).
          type: boolean
        genericArtifact:
          $ref: >-
            #/components/schemas/GoogleDevtoolsCloudbuildV1GenericArtifactDependency
          description: Represents a generic artifact as a build dependency.
        gitSource:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1GitSourceDependency'
          description: Represents a git repository as a build dependency.
      type: object
    GoogleDevtoolsCloudbuildV1DeveloperConnectConfig:
      description: This config defines the location of a source through Developer Connect.
      id: GoogleDevtoolsCloudbuildV1DeveloperConnectConfig
      properties:
        dir:
          description: >-
            Required. Directory, relative to the source root, in which to run
            the build.
          type: string
        gitRepositoryLink:
          description: >-
            Required. The Developer Connect Git repository link, formatted as
            `projects/*/locations/*/connections/*/gitRepositoryLink/*`.
          type: string
        revision:
          description: >-
            Required. The revision to fetch from the Git repository such as a
            branch, a tag, a commit SHA, or any Git ref.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1FailureInfo:
      description: A fatal problem encountered during the execution of the build.
      id: GoogleDevtoolsCloudbuildV1FailureInfo
      properties:
        detail:
          description: Explains the failure issue in more detail using hard-coded text.
          type: string
        type:
          description: The name of the failure.
          enum:
            - FAILURE_TYPE_UNSPECIFIED
            - PUSH_FAILED
            - PUSH_IMAGE_NOT_FOUND
            - PUSH_NOT_AUTHORIZED
            - LOGGING_FAILURE
            - USER_BUILD_STEP
            - FETCH_SOURCE_FAILED
          enumDescriptions:
            - Type unspecified
            - Unable to push the image to the repository.
            - Final image not found.
            - Unauthorized push of the final image.
            - Backend logging failures. Should retry.
            - A build step has failed.
            - The source fetching has failed.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1FileHashes:
      description: >-
        Container message for hashes of byte content of files, used in
        SourceProvenance messages to verify integrity of source input to the
        build.
      id: GoogleDevtoolsCloudbuildV1FileHashes
      properties:
        fileHash:
          description: Collection of file hashes.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1Hash'
          type: array
      type: object
    GoogleDevtoolsCloudbuildV1GenericArtifact:
      description: >-
        Generic artifact to upload to Artifact Registry upon successful
        completion of all build steps.
      id: GoogleDevtoolsCloudbuildV1GenericArtifact
      properties:
        folder:
          description: >-
            Required. Path to the generic artifact in the build's workspace to
            be uploaded to Artifact Registry.
          type: string
        registryPath:
          description: >-
            Required. Registry path to upload the generic artifact to, in the
            form
            projects/$PROJECT/locations/$LOCATION/repositories/$REPO/packages/$PACKAGE/versions/$VERSION
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1GenericArtifactDependency:
      description: Represents a generic artifact as a build dependency.
      id: GoogleDevtoolsCloudbuildV1GenericArtifactDependency
      properties:
        destPath:
          description: Required. Where the artifact files should be placed on the worker.
          type: string
        resource:
          description: >-
            Required. The location to download the artifact files from. Ex:
            projects/p1/locations/us/repositories/r1/packages/p1/versions/v1
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1GitConfig:
      description: GitConfig is a configuration for git operations.
      id: GoogleDevtoolsCloudbuildV1GitConfig
      properties:
        http:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1HttpConfig'
          description: Configuration for HTTP related git operations.
      type: object
    GoogleDevtoolsCloudbuildV1GitSource:
      description: Location of the source in any accessible Git repository.
      id: GoogleDevtoolsCloudbuildV1GitSource
      properties:
        dir:
          description: >-
            Optional. Directory, relative to the source root, in which to run
            the build. This must be a relative path. If a step's `dir` is
            specified and is an absolute path, this value is ignored for that
            step's execution.
          type: string
        revision:
          description: >-
            Optional. The revision to fetch from the Git repository such as a
            branch, a tag, a commit SHA, or any Git ref. Cloud Build uses `git
            fetch` to fetch the revision from the Git repository; therefore make
            sure that the string you provide for `revision` is parsable by the
            command. For information on string values accepted by `git fetch`,
            see https://git-scm.com/docs/gitrevisions#_specifying_revisions. For
            information on `git fetch`, see https://git-scm.com/docs/git-fetch.
          type: string
        url:
          description: >-
            Required. Location of the Git repo to build. This will be used as a
            `git remote`, see https://git-scm.com/docs/git-remote.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1GitSourceDependency:
      description: Represents a git repository as a build dependency.
      id: GoogleDevtoolsCloudbuildV1GitSourceDependency
      properties:
        depth:
          description: >-
            Optional. How much history should be fetched for the build (default
            1, -1 for all history).
          format: int64
          type: string
        destPath:
          description: Required. Where should the files be placed on the worker.
          type: string
        fetchTags:
          description: >-
            Optional. True if remote tags should be fetched too (default false).
            Note: when depth is 1 (default), git fetch only retrieves tags
            pointing to commits within the shallow boundary. Set depth to -1 to
            fetch all historical tags.
          type: boolean
        recurseSubmodules:
          description: Optional. True if submodules should be fetched too (default false).
          type: boolean
        repository:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1GitSourceRepository'
          description: Required. The kind of repo (url or dev connect).
        revision:
          description: Required. The revision that we will fetch the repo at.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1GitSourceRepository:
      description: A repository for a git source.
      id: GoogleDevtoolsCloudbuildV1GitSourceRepository
      properties:
        developerConnect:
          description: >-
            The Developer Connect Git repository link formatted as
            `projects/*/locations/*/connections/*/gitRepositoryLink/*`
          type: string
        url:
          description: Location of the Git repository.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1GoModule:
      description: >-
        Go module to upload to Artifact Registry upon successful completion of
        all build steps. A module refers to all dependencies in a go.mod file.
      id: GoogleDevtoolsCloudbuildV1GoModule
      properties:
        modulePath:
          description: Optional. The Go module's "module path". e.g. example.com/foo/v2
          type: string
        moduleVersion:
          description: >-
            Optional. The Go module's semantic version in the form vX.Y.Z. e.g.
            v0.1.1 Pre-release identifiers can also be added by appending a dash
            and dot separated ASCII alphanumeric characters and hyphens. e.g.
            v0.2.3-alpha.x.12m.5
          type: string
        repositoryLocation:
          description: >-
            Optional. Location of the Artifact Registry repository. i.e.
            us-east1 Defaults to the build’s location.
          type: string
        repositoryName:
          description: >-
            Optional. Artifact Registry repository name. Specified Go modules
            will be zipped and uploaded to Artifact Registry with this location
            as a prefix. e.g. my-go-repo
          type: string
        repositoryProjectId:
          description: >-
            Optional. Project ID of the Artifact Registry repository. Defaults
            to the build project.
          type: string
        sourcePath:
          description: >-
            Optional. Source path of the go.mod file in the build's workspace.
            If not specified, this will default to the current directory. e.g.
            ~/code/go/mypackage
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1Hash:
      description: Container message for hash values.
      id: GoogleDevtoolsCloudbuildV1Hash
      properties:
        type:
          description: The type of hash that was performed.
          enum:
            - NONE
            - SHA256
            - MD5
            - GO_MODULE_H1
            - SHA512
            - DIRSUM_SHA256
          enumDescriptions:
            - No hash requested.
            - Use a sha256 hash.
            - Use a md5 hash.
            - Dirhash of a Go module's source code which is then hex-encoded.
            - Use a sha512 hash.
            - Use a dirsum_sha256 hash.
          type: string
        value:
          description: The hash value.
          format: byte
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1HttpConfig:
      description: HttpConfig is a configuration for HTTP related git operations.
      id: GoogleDevtoolsCloudbuildV1HttpConfig
      properties:
        proxySecretVersionName:
          description: >-
            SecretVersion resource of the HTTP proxy URL. The Service Account
            used in the build (either the default Service Account or
            user-specified Service Account) should have
            `secretmanager.versions.access` permissions on this secret. The
            proxy URL should be in format `protocol://@]proxyhost[:port]`.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1InlineSecret:
      description: >-
        Pairs a set of secret environment variables mapped to encrypted values
        with the Cloud KMS key to use to decrypt the value.
      id: GoogleDevtoolsCloudbuildV1InlineSecret
      properties:
        envMap:
          additionalProperties:
            format: byte
            type: string
          description: >-
            Map of environment variable name to its encrypted value. Secret
            environment variables must be unique across all of a build's
            secrets, and must be used by at least one build step. Values can be
            at most 64 KB in size. There can be at most 100 secret values across
            all of a build's secrets.
          type: object
        kmsKeyName:
          description: >-
            Resource name of Cloud KMS crypto key to decrypt the encrypted
            value. In format: projects/*/locations/*/keyRings/*/cryptoKeys/*
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1MavenArtifact:
      description: >-
        A Maven artifact to upload to Artifact Registry upon successful
        completion of all build steps.
      id: GoogleDevtoolsCloudbuildV1MavenArtifact
      properties:
        artifactId:
          description: >-
            Maven `artifactId` value used when uploading the artifact to
            Artifact Registry.
          type: string
        deployFolder:
          description: >-
            Optional. Path to a folder containing the files to upload to
            Artifact Registry. This can be either an absolute path, e.g.
            `/workspace/my-app/target/`, or a relative path from /workspace,
            e.g. `my-app/target/`. This field is mutually exclusive with the
            `path` field.
          type: string
        groupId:
          description: >-
            Maven `groupId` value used when uploading the artifact to Artifact
            Registry.
          type: string
        path:
          description: >-
            Optional. Path to an artifact in the build's workspace to be
            uploaded to Artifact Registry. This can be either an absolute path,
            e.g. /workspace/my-app/target/my-app-1.0.SNAPSHOT.jar or a relative
            path from /workspace, e.g. my-app/target/my-app-1.0.SNAPSHOT.jar.
          type: string
        repository:
          description: >-
            Artifact Registry repository, in the form
            "https://$REGION-maven.pkg.dev/$PROJECT/$REPOSITORY" Artifact in the
            workspace specified by path will be uploaded to Artifact Registry
            with this location as a prefix.
          type: string
        version:
          description: >-
            Maven `version` value used when uploading the artifact to Artifact
            Registry.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1NpmPackage:
      description: >-
        Npm package to upload to Artifact Registry upon successful completion of
        all build steps.
      id: GoogleDevtoolsCloudbuildV1NpmPackage
      properties:
        packagePath:
          description: >-
            Optional. Path to the package.json. e.g. workspace/path/to/package
            Only one of `archive` or `package_path` can be specified.
          type: string
        repository:
          description: >-
            Artifact Registry repository, in the form
            "https://$REGION-npm.pkg.dev/$PROJECT/$REPOSITORY" Npm package in
            the workspace specified by path will be zipped and uploaded to
            Artifact Registry with this location as a prefix.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1Oci:
      description: >-
        OCI image to upload to Artifact Registry upon successful completion of
        all build steps.
      id: GoogleDevtoolsCloudbuildV1Oci
      properties:
        file:
          description: >-
            Required. Path on the local file system where to find the container
            to upload. e.g. /workspace/my-image.tar
          type: string
        registryPath:
          description: >-
            Required. Registry path to upload the container to. e.g.
            us-east1-docker.pkg.dev/my-project/my-repo/my-image
          type: string
        tags:
          description: Optional. Tags to apply to the uploaded image. e.g. latest, 1.0.0
          items:
            type: string
          type: array
      type: object
    GoogleDevtoolsCloudbuildV1PoolOption:
      description: >-
        Details about how a build should be executed on a `WorkerPool`. See
        [running builds in a private
        pool](https://cloud.google.com/build/docs/private-pools/run-builds-in-private-pool)
        for more information.
      id: GoogleDevtoolsCloudbuildV1PoolOption
      properties:
        name:
          description: >-
            The `WorkerPool` resource to execute the build on. You must have
            `cloudbuild.workerpools.use` on the project hosting the WorkerPool.
            Format
            projects/{project}/locations/{location}/workerPools/{workerPoolId}
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1PythonPackage:
      description: >-
        Python package to upload to Artifact Registry upon successful completion
        of all build steps. A package can encapsulate multiple objects to be
        uploaded to a single repository.
      id: GoogleDevtoolsCloudbuildV1PythonPackage
      properties:
        paths:
          description: >-
            Path globs used to match files in the build's workspace. For Python/
            Twine, this is usually `dist/*`, and sometimes additionally an
            `.asc` file.
          items:
            type: string
          type: array
        repository:
          description: >-
            Artifact Registry repository, in the form
            "https://$REGION-python.pkg.dev/$PROJECT/$REPOSITORY" Files in the
            workspace matching any path pattern will be uploaded to Artifact
            Registry with this location as a prefix.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1RepoSource:
      description: Location of the source in a Google Cloud Source Repository.
      id: GoogleDevtoolsCloudbuildV1RepoSource
      properties:
        branchName:
          description: >-
            Regex matching branches to build. The syntax of the regular
            expressions accepted is the syntax accepted by RE2 and described at
            https://github.com/google/re2/wiki/Syntax
          type: string
        commitSha:
          description: Explicit commit SHA to build.
          type: string
        dir:
          description: >-
            Optional. Directory, relative to the source root, in which to run
            the build. This must be a relative path. If a step's `dir` is
            specified and is an absolute path, this value is ignored for that
            step's execution.
          type: string
        invertRegex:
          description: >-
            Optional. Only trigger a build if the revision regex does NOT match
            the revision regex.
          type: boolean
        projectId:
          description: >-
            Optional. ID of the project that owns the Cloud Source Repository.
            If omitted, the project ID requesting the build is assumed.
          type: string
        repoName:
          description: Required. Name of the Cloud Source Repository.
          type: string
        substitutions:
          additionalProperties:
            type: string
          description: >-
            Optional. Substitutions to use in a triggered build. Should only be
            used with RunBuildTrigger
          type: object
        tagName:
          description: >-
            Regex matching tags to build. The syntax of the regular expressions
            accepted is the syntax accepted by RE2 and described at
            https://github.com/google/re2/wiki/Syntax
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1Results:
      description: Artifacts created by the build pipeline.
      id: GoogleDevtoolsCloudbuildV1Results
      properties:
        artifactManifest:
          description: >-
            Path to the artifact manifest for non-container artifacts uploaded
            to Cloud Storage. Only populated when artifacts are uploaded to
            Cloud Storage.
          type: string
        artifactTiming:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: Time to push all non-container artifacts to Cloud Storage.
        buildStepImages:
          description: >-
            List of build step digests, in the order corresponding to build step
            indices.
          items:
            type: string
          type: array
        buildStepOutputs:
          description: >-
            List of build step outputs, produced by builder images, in the order
            corresponding to build step indices. [Cloud
            Builders](https://cloud.google.com/cloud-build/docs/cloud-builders)
            can produce this output by writing to `$BUILDER_OUTPUT/output`. Only
            the first 50KB of data is stored. Note that the `$BUILDER_OUTPUT`
            variable is read-only and can't be substituted.
          items:
            format: byte
            type: string
          type: array
        buildStepResults:
          additionalProperties:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1BuildStepResults'
          description: 'Results for build steps. step_id -> '
          type: object
        genericArtifacts:
          description: >-
            Output only. Generic artifacts uploaded to Artifact Registry at the
            end of the build.
          items:
            $ref: >-
              #/components/schemas/GoogleDevtoolsCloudbuildV1UploadedGenericArtifact
          readOnly: true
          type: array
        goModules:
          description: >-
            Optional. Go module artifacts uploaded to Artifact Registry at the
            end of the build.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1UploadedGoModule'
          type: array
        images:
          description: Container images that were built as a part of the build.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1BuiltImage'
          type: array
        mavenArtifacts:
          description: >-
            Maven artifacts uploaded to Artifact Registry at the end of the
            build.
          items:
            $ref: >-
              #/components/schemas/GoogleDevtoolsCloudbuildV1UploadedMavenArtifact
          type: array
        npmPackages:
          description: Npm packages uploaded to Artifact Registry at the end of the build.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1UploadedNpmPackage'
          type: array
        numArtifacts:
          description: >-
            Number of non-container artifacts uploaded to Cloud Storage. Only
            populated when artifacts are uploaded to Cloud Storage.
          format: int64
          type: string
        pythonPackages:
          description: >-
            Python artifacts uploaded to Artifact Registry at the end of the
            build.
          items:
            $ref: >-
              #/components/schemas/GoogleDevtoolsCloudbuildV1UploadedPythonPackage
          type: array
      type: object
    GoogleDevtoolsCloudbuildV1Secret:
      description: >-
        Pairs a set of secret environment variables containing encrypted values
        with the Cloud KMS key to use to decrypt the value. Note: Use
        `kmsKeyName` with `available_secrets` instead of using `kmsKeyName` with
        `secret`. For instructions see:
        https://cloud.google.com/cloud-build/docs/securing-builds/use-encrypted-credentials.
      id: GoogleDevtoolsCloudbuildV1Secret
      properties:
        kmsKeyName:
          description: Cloud KMS key name to use to decrypt these envs.
          type: string
        secretEnv:
          additionalProperties:
            format: byte
            type: string
          description: >-
            Map of environment variable name to its encrypted value. Secret
            environment variables must be unique across all of a build's
            secrets, and must be used by at least one build step. Values can be
            at most 64 KB in size. There can be at most 100 secret values across
            all of a build's secrets.
          type: object
      type: object
    GoogleDevtoolsCloudbuildV1SecretManagerSecret:
      description: >-
        Pairs a secret environment variable with a SecretVersion in Secret
        Manager.
      id: GoogleDevtoolsCloudbuildV1SecretManagerSecret
      properties:
        env:
          description: >-
            Environment variable name to associate with the secret. Secret
            environment variables must be unique across all of a build's
            secrets, and must be used by at least one build step.
          type: string
        versionName:
          description: >-
            Resource name of the SecretVersion. In format:
            projects/*/secrets/*/versions/*
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1Secrets:
      description: Secrets and secret environment variables.
      id: GoogleDevtoolsCloudbuildV1Secrets
      properties:
        inline:
          description: >-
            Secrets encrypted with KMS key and the associated secret environment
            variable.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1InlineSecret'
          type: array
        secretManager:
          description: >-
            Secrets in Secret Manager and associated secret environment
            variable.
          items:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1SecretManagerSecret'
          type: array
      type: object
    GoogleDevtoolsCloudbuildV1Source:
      description: Location of the source in a supported storage service.
      id: GoogleDevtoolsCloudbuildV1Source
      properties:
        connectedRepository:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1ConnectedRepository'
          description: >-
            Optional. If provided, get the source from this 2nd-gen Google Cloud
            Build repository resource.
        developerConnectConfig:
          $ref: >-
            #/components/schemas/GoogleDevtoolsCloudbuildV1DeveloperConnectConfig
          description: If provided, get the source from this Developer Connect config.
        gitSource:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1GitSource'
          description: If provided, get the source from this Git repository.
        repoSource:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1RepoSource'
          description: >-
            If provided, get the source from this location in a Cloud Source
            Repository.
        storageSource:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1StorageSource'
          description: If provided, get the source from this location in Cloud Storage.
        storageSourceManifest:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1StorageSourceManifest'
          description: >-
            If provided, get the source from this manifest in Cloud Storage.
            This feature is in Preview; see description
            [here](https://github.com/GoogleCloudPlatform/cloud-builders/tree/master/gcs-fetcher).
      type: object
    GoogleDevtoolsCloudbuildV1SourceProvenance:
      description: >-
        Provenance of the source. Ways to find the original source, or verify
        that some source was used for this build.
      id: GoogleDevtoolsCloudbuildV1SourceProvenance
      properties:
        fileHashes:
          additionalProperties:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1FileHashes'
          description: >-
            Output only. Hash(es) of the build source, which can be used to
            verify that the original source integrity was maintained in the
            build. Note that `FileHashes` will only be populated if
            `BuildOptions` has requested a `SourceProvenanceHash`. The keys to
            this map are file paths used as build source and the values contain
            the hash values for those files. If the build source came in a
            single package such as a gzipped tarfile (`.tar.gz`), the `FileHash`
            will be for the single path to that file.
          readOnly: true
          type: object
        resolvedConnectedRepository:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1ConnectedRepository'
          description: >-
            Output only. A copy of the build's `source.connected_repository`, if
            exists, with any revisions resolved.
          readOnly: true
        resolvedGitSource:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1GitSource'
          description: >-
            Output only. A copy of the build's `source.git_source`, if exists,
            with any revisions resolved.
          readOnly: true
        resolvedRepoSource:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1RepoSource'
          description: >-
            A copy of the build's `source.repo_source`, if exists, with any
            revisions resolved.
        resolvedStorageSource:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1StorageSource'
          description: >-
            A copy of the build's `source.storage_source`, if exists, with any
            generations resolved.
        resolvedStorageSourceManifest:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1StorageSourceManifest'
          description: >-
            A copy of the build's `source.storage_source_manifest`, if exists,
            with any revisions resolved. This feature is in Preview.
      type: object
    GoogleDevtoolsCloudbuildV1StepResult:
      description: StepResult is the declaration of a result for a build step.
      id: GoogleDevtoolsCloudbuildV1StepResult
      properties:
        attestationContent:
          description: Optional. The content of the attestation to be generated.
          type: string
        attestationType:
          description: Optional. The type of attestation to be generated.
          type: string
        name:
          description: Required. The name of the result.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1StorageSource:
      description: Location of the source in an archive file in Cloud Storage.
      id: GoogleDevtoolsCloudbuildV1StorageSource
      properties:
        bucket:
          description: >-
            Cloud Storage bucket containing the source (see [Bucket Name
            Requirements](https://cloud.google.com/storage/docs/bucket-naming#requirements)).
          type: string
        generation:
          description: >-
            Optional. Cloud Storage generation for the object. If the generation
            is omitted, the latest generation will be used.
          format: int64
          type: string
        object:
          description: >-
            Required. Cloud Storage object containing the source. This object
            must be a zipped (`.zip`) or gzipped archive file (`.tar.gz`)
            containing source to build.
          type: string
        sourceFetcher:
          description: >-
            Optional. Option to specify the tool to fetch the source file for
            the build.
          enum:
            - SOURCE_FETCHER_UNSPECIFIED
            - GSUTIL
            - GCS_FETCHER
          enumDescriptions:
            - Unspecified defaults to GSUTIL.
            - Use the "gsutil" tool to download the source file.
            - Use the Cloud Storage Fetcher tool to download the source file.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1StorageSourceManifest:
      description: >-
        Location of the source manifest in Cloud Storage. This feature is in
        Preview; see description
        [here](https://github.com/GoogleCloudPlatform/cloud-builders/tree/master/gcs-fetcher).
      id: GoogleDevtoolsCloudbuildV1StorageSourceManifest
      properties:
        bucket:
          description: >-
            Required. Cloud Storage bucket containing the source manifest (see
            [Bucket Name
            Requirements](https://cloud.google.com/storage/docs/bucket-naming#requirements)).
          type: string
        generation:
          description: >-
            Cloud Storage generation for the object. If the generation is
            omitted, the latest generation will be used.
          format: int64
          type: string
        object:
          description: >-
            Required. Cloud Storage object containing the source manifest. This
            object must be a JSON file.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1TimeSpan:
      description: Start and end times for a build execution phase.
      id: GoogleDevtoolsCloudbuildV1TimeSpan
      properties:
        endTime:
          description: End of time span.
          format: google-datetime
          type: string
        startTime:
          description: Start of time span.
          format: google-datetime
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1UploadedGenericArtifact:
      description: >-
        A generic artifact uploaded to Artifact Registry using the
        GenericArtifact directive.
      id: GoogleDevtoolsCloudbuildV1UploadedGenericArtifact
      properties:
        artifactFingerprint:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1FileHashes'
          description: Output only. The hash of the whole artifact.
          readOnly: true
        artifactRegistryPackage:
          description: Output only. Path to the artifact in Artifact Registry.
          readOnly: true
          type: string
        fileHashes:
          additionalProperties:
            $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1FileHashes'
          description: Output only. The file hashes that make up the generic artifact.
          readOnly: true
          type: object
        pushTiming:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: >-
            Output only. Stores timing information for pushing the specified
            artifact.
          readOnly: true
        uri:
          description: >-
            Output only. URI of the uploaded artifact. Ex:
            projects/p1/locations/us/repositories/r1/packages/p1/versions/v1
          readOnly: true
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1UploadedGoModule:
      description: >-
        A Go module artifact uploaded to Artifact Registry using the GoModule
        directive.
      id: GoogleDevtoolsCloudbuildV1UploadedGoModule
      properties:
        artifactRegistryPackage:
          description: Output only. Path to the artifact in Artifact Registry.
          readOnly: true
          type: string
        fileHashes:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1FileHashes'
          description: Hash types and values of the Go Module Artifact.
        pushTiming:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: >-
            Output only. Stores timing information for pushing the specified
            artifact.
          readOnly: true
        uri:
          description: URI of the uploaded artifact.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1UploadedMavenArtifact:
      description: A Maven artifact uploaded using the MavenArtifact directive.
      id: GoogleDevtoolsCloudbuildV1UploadedMavenArtifact
      properties:
        artifactRegistryPackage:
          description: Output only. Path to the artifact in Artifact Registry.
          readOnly: true
          type: string
        fileHashes:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1FileHashes'
          description: Hash types and values of the Maven Artifact.
        pushTiming:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: >-
            Output only. Stores timing information for pushing the specified
            artifact.
          readOnly: true
        uri:
          description: URI of the uploaded artifact.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1UploadedNpmPackage:
      description: >-
        An npm package uploaded to Artifact Registry using the NpmPackage
        directive.
      id: GoogleDevtoolsCloudbuildV1UploadedNpmPackage
      properties:
        artifactRegistryPackage:
          description: Output only. Path to the artifact in Artifact Registry.
          readOnly: true
          type: string
        fileHashes:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1FileHashes'
          description: Hash types and values of the npm package.
        pushTiming:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: >-
            Output only. Stores timing information for pushing the specified
            artifact.
          readOnly: true
        uri:
          description: URI of the uploaded npm package.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1UploadedPythonPackage:
      description: Artifact uploaded using the PythonPackage directive.
      id: GoogleDevtoolsCloudbuildV1UploadedPythonPackage
      properties:
        artifactRegistryPackage:
          description: Output only. Path to the artifact in Artifact Registry.
          readOnly: true
          type: string
        fileHashes:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1FileHashes'
          description: Hash types and values of the Python Artifact.
        pushTiming:
          $ref: '#/components/schemas/GoogleDevtoolsCloudbuildV1TimeSpan'
          description: >-
            Output only. Stores timing information for pushing the specified
            artifact.
          readOnly: true
        uri:
          description: URI of the uploaded artifact.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1Volume:
      description: >-
        Volume describes a Docker container volume which is mounted into build
        steps in order to persist files across build step execution.
      id: GoogleDevtoolsCloudbuildV1Volume
      properties:
        name:
          description: >-
            Name of the volume to mount. Volume names must be unique per build
            step and must be valid names for Docker volumes. Each named volume
            must be used by at least two build steps.
          type: string
        path:
          description: >-
            Path at which to mount the volume. Paths must be absolute and cannot
            conflict with other volume paths on the same build step or with
            certain reserved volume paths.
          type: string
      type: object
    GoogleDevtoolsCloudbuildV1Warning:
      description: A non-fatal problem encountered during the execution of the build.
      id: GoogleDevtoolsCloudbuildV1Warning
      properties:
        priority:
          description: The priority for this warning.
          enum:
            - PRIORITY_UNSPECIFIED
            - INFO
            - WARNING
            - ALERT
          enumDescriptions:
            - Should not be used.
            - e.g. deprecation warnings and alternative feature highlights.
            - e.g. automated detection of possible issues with the build.
            - e.g. alerts that a feature used in the build is pending removal
          type: string
        text:
          description: Explanation of the warning generated.
          type: string
      type: object
    GoogleIamV1AuditConfig:
      description: >-
        Specifies the audit configuration for a service. The configuration
        determines which permission types are logged, and what identities, if
        any, are exempted from logging. An AuditConfig must have one or more
        AuditLogConfigs. If there are AuditConfigs for both `allServices` and a
        specific service, the union of the two AuditConfigs is used for that
        service: the log_types specified in each AuditConfig are enabled, and
        the exempted_members in each AuditLogConfig are exempted. Example Policy
        with multiple AuditConfigs: { "audit_configs": [ { "service":
        "allServices", "audit_log_configs": [ { "log_type": "DATA_READ",
        "exempted_members": [ "user:jose@example.com" ] }, { "log_type":
        "DATA_WRITE" }, { "log_type": "ADMIN_READ" } ] }, { "service":
        "sampleservice.googleapis.com", "audit_log_configs": [ { "log_type":
        "DATA_READ" }, { "log_type": "DATA_WRITE", "exempted_members": [
        "user:aliya@example.com" ] } ] } ] } For sampleservice, this policy
        enables DATA_READ, DATA_WRITE and ADMIN_READ logging. It also exempts
        `jose@example.com` from DATA_READ logging, and `aliya@example.com` from
        DATA_WRITE logging.
      id: GoogleIamV1AuditConfig
      properties:
        auditLogConfigs:
          description: The configuration for logging of each type of permission.
          items:
            $ref: '#/components/schemas/GoogleIamV1AuditLogConfig'
          type: array
        service:
          description: >-
            Specifies a service that will be enabled for audit logging. For
            example, `storage.googleapis.com`, `cloudsql.googleapis.com`.
            `allServices` is a special value that covers all services.
          type: string
      type: object
    GoogleIamV1AuditLogConfig:
      description: >-
        Provides the configuration for logging a type of permissions. Example: {
        "audit_log_configs": [ { "log_type": "DATA_READ", "exempted_members": [
        "user:jose@example.com" ] }, { "log_type": "DATA_WRITE" } ] } This
        enables 'DATA_READ' and 'DATA_WRITE' logging, while exempting
        jose@example.com from DATA_READ logging.
      id: GoogleIamV1AuditLogConfig
      properties:
        exemptedMembers:
          description: >-
            Specifies the identities that do not cause logging for this type of
            permission. Follows the same format of Binding.members.
          items:
            type: string
          type: array
        logType:
          description: The log type that this config enables.
          enum:
            - LOG_TYPE_UNSPECIFIED
            - ADMIN_READ
            - DATA_WRITE
            - DATA_READ
          enumDescriptions:
            - Default case. Should never be this.
            - 'Admin reads. Example: CloudIAM getIamPolicy'
            - 'Data writes. Example: CloudSQL Users create'
            - 'Data reads. Example: CloudSQL Users list'
          type: string
      type: object
    GoogleIamV1Binding:
      description: Associates `members`, or principals, with a `role`.
      id: GoogleIamV1Binding
      properties:
        condition:
          $ref: '#/components/schemas/GoogleTypeExpr'
          description: >-
            The condition that is associated with this binding. If the condition
            evaluates to `true`, then this binding applies to the current
            request. If the condition evaluates to `false`, then this binding
            does not apply to the current request. However, a different role
            binding might grant the same role to one or more of the principals
            in this binding. To learn which resources support conditions in
            their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
        members:
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. `members` can have the following values: * `allUsers`: A
            special identifier that represents anyone who is on the internet;
            with or without a Google account. * `allAuthenticatedUsers`: A
            special identifier that represents anyone who is authenticated with
            a Google account or a service account. Does not include identities
            that come from external identity providers (IdPs) through identity
            federation. * `user:{emailid}`: An email address that represents a
            specific Google account. For example, `alice@example.com` . *
            `serviceAccount:{emailid}`: An email address that represents a
            Google service account. For example,
            `my-other-app@appspot.gserviceaccount.com`. *
            `serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]`:
            An identifier for a [Kubernetes service
            account](https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example,
            `my-project.svc.id.goog[my-namespace/my-kubernetes-sa]`. *
            `group:{emailid}`: An email address that represents a Google group.
            For example, `admins@example.com`. * `domain:{domain}`: The G Suite
            domain (primary) that represents all the users of that domain. For
            example, `google.com` or `example.com`. *
            `principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workforce identity pool. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}`:
            All workforce identities in a group. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All workforce identities with a specific attribute value. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*`:
            All identities in a workforce identity pool. *
            `principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workload identity pool. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}`:
            A workload identity pool group. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All identities in a workload identity pool with a certain attribute.
            *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*`:
            All identities in a workload identity pool. *
            `deleted:user:{emailid}?uid={uniqueid}`: An email address (plus
            unique identifier) representing a user that has been recently
            deleted. For example, `alice@example.com?uid=123456789012345678901`.
            If the user is recovered, this value reverts to `user:{emailid}` and
            the recovered user retains the role in the binding. *
            `deleted:serviceAccount:{emailid}?uid={uniqueid}`: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            `my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901`.
            If the service account is undeleted, this value reverts to
            `serviceAccount:{emailid}` and the undeleted service account retains
            the role in the binding. * `deleted:group:{emailid}?uid={uniqueid}`:
            An email address (plus unique identifier) representing a Google
            group that has been recently deleted. For example,
            `admins@example.com?uid=123456789012345678901`. If the group is
            recovered, this value reverts to `group:{emailid}` and the recovered
            group retains the role in the binding. *
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            Deleted single identity in a workforce identity pool. For example,
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value`.
          items:
            type: string
          type: array
        role:
          description: >-
            Role that is assigned to the list of `members`, or principals. For
            example, `roles/viewer`, `roles/editor`, or `roles/owner`. For an
            overview of the IAM roles and permissions, see the [IAM
            documentation](https://cloud.google.com/iam/docs/roles-overview).
            For a list of the available pre-defined roles, see
            [here](https://cloud.google.com/iam/docs/understanding-roles).
          type: string
      type: object
    GoogleIamV1Policy:
      description: >-
        An Identity and Access Management (IAM) policy, which specifies access
        controls for Google Cloud resources. A `Policy` is a collection of
        `bindings`. A `binding` binds one or more `members`, or principals, to a
        single `role`. Principals can be user accounts, service accounts, Google
        groups, and domains (such as G Suite). A `role` is a named list of
        permissions; each `role` can be an IAM predefined role or a user-created
        custom role. For some types of Google Cloud resources, a `binding` can
        also specify a `condition`, which is a logical expression that allows
        access to a resource only if the expression evaluates to `true`. A
        condition can add constraints based on attributes of the request, the
        resource, or both. To learn which resources support conditions in their
        IAM policies, see the [IAM
        documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
        **JSON example:** ``` { "bindings": [ { "role":
        "roles/resourcemanager.organizationAdmin", "members": [
        "user:mike@example.com", "group:admins@example.com",
        "domain:google.com",
        "serviceAccount:my-project-id@appspot.gserviceaccount.com" ] }, {
        "role": "roles/resourcemanager.organizationViewer", "members": [
        "user:eve@example.com" ], "condition": { "title": "expirable access",
        "description": "Does not grant access after Sep 2020", "expression":
        "request.time < timestamp('2020-10-01T00:00:00.000Z')", } } ], "etag":
        "BwWWja0YfJA=", "version": 3 } ``` **YAML example:** ``` bindings: -
        members: - user:mike@example.com - group:admins@example.com -
        domain:google.com -
        serviceAccount:my-project-id@appspot.gserviceaccount.com role:
        roles/resourcemanager.organizationAdmin - members: -
        user:eve@example.com role: roles/resourcemanager.organizationViewer
        condition: title: expirable access description: Does not grant access
        after Sep 2020 expression: request.time <
        timestamp('2020-10-01T00:00:00.000Z') etag: BwWWja0YfJA= version: 3 ```
        For a description of IAM and its features, see the [IAM
        documentation](https://cloud.google.com/iam/docs/).
      id: GoogleIamV1Policy
      properties:
        auditConfigs:
          description: Specifies cloud audit logging configuration for this policy.
          items:
            $ref: '#/components/schemas/GoogleIamV1AuditConfig'
          type: array
        bindings:
          description: >-
            Associates a list of `members`, or principals, with a `role`.
            Optionally, may specify a `condition` that determines how and when
            the `bindings` are applied. Each of the `bindings` must contain at
            least one principal. The `bindings` in a `Policy` can refer to up to
            1,500 principals; up to 250 of these principals can be Google
            groups. Each occurrence of a principal counts towards these limits.
            For example, if the `bindings` grant 50 different roles to
            `user:alice@example.com`, and not to any other principal, then you
            can add another 1,450 principals to the `bindings` in the `Policy`.
          items:
            $ref: '#/components/schemas/GoogleIamV1Binding'
          type: array
        etag:
          description: >-
            `etag` is used for optimistic concurrency control as a way to help
            prevent simultaneous updates of a policy from overwriting each
            other. It is strongly suggested that systems make use of the `etag`
            in the read-modify-write cycle to perform policy updates in order to
            avoid race conditions: An `etag` is returned in the response to
            `getIamPolicy`, and systems are expected to put that etag in the
            request to `setIamPolicy` to ensure that their change will be
            applied to the same version of the policy. **Important:** If you use
            IAM Conditions, you must include the `etag` field whenever you call
            `setIamPolicy`. If you omit this field, then IAM allows you to
            overwrite a version `3` policy with a version `1` policy, and all of
            the conditions in the version `3` policy are lost.
          format: byte
          type: string
        version:
          description: >-
            Specifies the format of the policy. Valid values are `0`, `1`, and
            `3`. Requests that specify an invalid value are rejected. Any
            operation that affects conditional role bindings must specify
            version `3`. This requirement applies to the following operations: *
            Getting a policy that includes a conditional role binding * Adding a
            conditional role binding to a policy * Changing a conditional role
            binding in a policy * Removing any role binding, with or without a
            condition, from a policy that includes conditions **Important:** If
            you use IAM Conditions, you must include the `etag` field whenever
            you call `setIamPolicy`. If you omit this field, then IAM allows you
            to overwrite a version `3` policy with a version `1` policy, and all
            of the conditions in the version `3` policy are lost. If a policy
            does not include any conditions, operations on that policy may
            specify any valid version or leave the field unset. To learn which
            resources support conditions in their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
          format: int32
          type: integer
      type: object
    GoogleIamV1SetIamPolicyRequest:
      description: Request message for `SetIamPolicy` method.
      id: GoogleIamV1SetIamPolicyRequest
      properties:
        policy:
          $ref: '#/components/schemas/GoogleIamV1Policy'
          description: >-
            REQUIRED: The complete policy to be applied to the `resource`. The
            size of the policy is limited to a few 10s of KB. An empty policy is
