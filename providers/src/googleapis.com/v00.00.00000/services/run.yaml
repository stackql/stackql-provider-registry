components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    GoogleCloudRunV2BinaryAuthorization:
      description: Settings for Binary Authorization feature.
      id: GoogleCloudRunV2BinaryAuthorization
      properties:
        breakglassJustification:
          description: >-
            Optional. If present, indicates to use Breakglass using this
            justification. If use_default is False, then it must be empty. For
            more information on breakglass, see
            https://cloud.google.com/binary-authorization/docs/using-breakglass
          type: string
        policy:
          description: >-
            Optional. The path to a binary authorization policy. Format:
            `projects/{project}/platforms/cloudRun/{policy-name}`
          type: string
        useDefault:
          description: >-
            Optional. If True, indicates to use the default project's binary
            authorization policy. If False, binary authorization will be
            disabled.
          type: boolean
      type: object
    GoogleCloudRunV2BuildConfig:
      description: >-
        Describes the Build step of the function that builds a container from
        the given source.
      id: GoogleCloudRunV2BuildConfig
      properties:
        baseImage:
          description: Optional. The base image used to build the function.
          type: string
        enableAutomaticUpdates:
          description: >-
            Optional. Sets whether the function will receive automatic base
            image updates.
          type: boolean
        environmentVariables:
          additionalProperties:
            type: string
          description: >-
            Optional. User-provided build-time environment variables for the
            function
          type: object
        functionTarget:
          description: >-
            Optional. The name of the function (as defined in source code) that
            will be executed. Defaults to the resource name suffix, if not
            specified. For backward compatibility, if function with given name
            is not found, then the system will try to use function named
            "function".
          type: string
        imageUri:
          description: Optional. Artifact Registry URI to store the built image.
          type: string
        name:
          description: >-
            Output only. The Cloud Build name of the latest successful
            deployment of the function.
          readOnly: true
          type: string
        serviceAccount:
          description: >-
            Optional. Service account to be used for building the container. The
            format of this field is
            `projects/{projectId}/serviceAccounts/{serviceAccountEmail}`.
          type: string
        sourceLocation:
          description: >-
            The Cloud Storage bucket URI where the function source code is
            located.
          type: string
        workerPool:
          description: >-
            Optional. Name of the Cloud Build Custom Worker Pool that should be
            used to build the Cloud Run function. The format of this field is
            `projects/{project}/locations/{region}/workerPools/{workerPool}`
            where `{project}` and `{region}` are the project id and region
            respectively where the worker pool is defined and `{workerPool}` is
            the short name of the worker pool.
          type: string
      type: object
    GoogleCloudRunV2BuildInfo:
      description: Build information of the image.
      id: GoogleCloudRunV2BuildInfo
      properties:
        functionTarget:
          description: >-
            Output only. Entry point of the function when the image is a Cloud
            Run function.
          readOnly: true
          type: string
        sourceLocation:
          description: Output only. Source code location of the image.
          readOnly: true
          type: string
      type: object
    GoogleCloudRunV2BuildpacksBuild:
      description: Build the source using Buildpacks.
      id: GoogleCloudRunV2BuildpacksBuild
      properties:
        baseImage:
          description: Optional. The base image to use for the build.
          type: string
        cacheImageUri:
          description: >-
            Optional. cache_image_uri is the GCR/AR URL where the cache image
            will be stored. cache_image_uri is optional and omitting it will
            disable caching. This URL must be stable across builds. It is used
            to derive a build-specific temporary URL by substituting the tag
            with the build ID. The build will clean up the temporary image on a
            best-effort basis.
          type: string
        enableAutomaticUpdates:
          description: >-
            Optional. Whether or not the application container will be enrolled
            in automatic base image updates. When true, the application will be
            built on a scratch base image, so the base layers can be appended at
            run time.
          type: boolean
        environmentVariables:
          additionalProperties:
            type: string
          description: Optional. User-provided build-time environment variables.
          type: object
        functionTarget:
          description: >-
            Optional. Name of the function target if the source is a function
            source. Required for function builds.
          type: string
        projectDescriptor:
          description: >-
            Optional. project_descriptor stores the path to the project
            descriptor file. When empty, it means that there is no project
            descriptor file in the source.
          type: string
        runtime:
          deprecated: true
          description: The runtime name, e.g. 'go113'. Leave blank for generic builds.
          type: string
      type: object
    GoogleCloudRunV2CancelExecutionRequest:
      description: Request message for deleting an Execution.
      id: GoogleCloudRunV2CancelExecutionRequest
      properties:
        etag:
          description: >-
            A system-generated fingerprint for this version of the resource.
            This may be used to detect modification conflict during updates.
          type: string
        validateOnly:
          description: >-
            Indicates that the request should be validated without actually
            cancelling any resources.
          type: boolean
      type: object
    GoogleCloudRunV2CloudSqlInstance:
      description: >-
        Represents a set of Cloud SQL instances. Each one will be available
        under /cloudsql/[instance]. Visit
        https://cloud.google.com/sql/docs/mysql/connect-run for more information
        on how to connect Cloud SQL and Cloud Run.
      id: GoogleCloudRunV2CloudSqlInstance
      properties:
        instances:
          description: >-
            A list of Cloud SQL instance connection names. Cloud Run uses these
            to establish connections to the specified Cloud SQL instances. While
            the SQL instance name itself is unique within a project, the full
            connection name requires the location for proper routing. Format:
            `{project}:{location}:{instance}` Example:
            `my-project:us-central1:my-instance` You can find this value on the
            instance's **Overview** page in the Google Cloud console or by using
            the following `gcloud` command: ```sh gcloud sql instances describe
            INSTANCE_NAME \ --format='value(connectionName)' ``` Visit
            https://cloud.google.com/sql/docs/mysql/connect-run for more
            information on how to connect Cloud SQL and Cloud Run.
          items:
            type: string
          type: array
      type: object
    GoogleCloudRunV2CloudStorageSource:
      description: Cloud Storage source.
      id: GoogleCloudRunV2CloudStorageSource
      properties:
        bucket:
          description: Required. The Cloud Storage bucket name.
          type: string
        generation:
          description: Optional. The Cloud Storage object generation.
          format: int64
          type: string
        object:
          description: Required. The Cloud Storage object name.
          type: string
      type: object
    GoogleCloudRunV2Condition:
      description: Defines a status condition for a resource.
      id: GoogleCloudRunV2Condition
      properties:
        executionReason:
          description: Output only. A reason for the execution condition.
          enum:
            - EXECUTION_REASON_UNDEFINED
            - JOB_STATUS_SERVICE_POLLING_ERROR
            - NON_ZERO_EXIT_CODE
            - CANCELLED
            - CANCELLING
            - DELETED
            - DELAYED_START_PENDING
            - DELAYED_EXECUTION_EXCEEDING_DURATION_LIMIT
          enumDescriptions:
            - Default value.
            - Internal system error getting execution status. System will retry.
            - >-
              A task reached its retry limit and the last attempt failed due to
              the user container exiting with a non-zero exit code.
            - The execution was cancelled by users.
            - The execution is in the process of being cancelled.
            - The execution was deleted.
            - A delayed execution is waiting for a start time.
            - A delayed execution exceeded the maximum runtime duration.
          readOnly: true
          type: string
        instanceReason:
          description: Output only. A reason for the instance condition.
          enum:
            - INSTANCE_REASON_UNSPECIFIED
            - INSTANCE_DELETED
            - INSTANCE_STOPPED
            - INSTANCE_STOPPING
            - INSTANCE_NON_ZERO_EXIT_CODE
          enumDescriptions:
            - Default value.
            - Instance deleted.
            - Instance stopped.
            - Instance stopping.
            - Instance exited with a non-zero exit code.
          readOnly: true
          type: string
        lastTransitionTime:
          description: Last time the condition transitioned from one status to another.
          format: google-datetime
          type: string
        message:
          description: Human readable message indicating details about the current status.
          type: string
        reason:
          description: Output only. A common (service-level) reason for this condition.
          enum:
            - COMMON_REASON_UNDEFINED
            - UNKNOWN
            - REVISION_FAILED
            - PROGRESS_DEADLINE_EXCEEDED
            - CONTAINER_MISSING
            - CONTAINER_PERMISSION_DENIED
            - CONTAINER_IMAGE_UNAUTHORIZED
            - CONTAINER_IMAGE_AUTHORIZATION_CHECK_FAILED
            - ENCRYPTION_KEY_PERMISSION_DENIED
            - ENCRYPTION_KEY_CHECK_FAILED
            - SECRETS_ACCESS_CHECK_FAILED
            - WAITING_FOR_OPERATION
            - IMMEDIATE_RETRY
            - POSTPONED_RETRY
            - INTERNAL
            - VPC_NETWORK_NOT_FOUND
          enumDescriptions:
            - Default value.
            - Reason unknown. Further details will be in message.
            - Revision creation process failed.
            - Timed out waiting for completion.
            - The container image path is incorrect.
            - Insufficient permissions on the container image.
            - Container image is not authorized by policy.
            - Container image policy authorization check failed.
            - Insufficient permissions on encryption key.
            - Permission check on encryption key failed.
            - At least one Access check on secrets failed.
            - Waiting for operation to complete.
            - System will retry immediately.
            - System will retry later; current attempt failed.
            - >-
              An internal error occurred. Further information may be in the
              message.
            - User-provided VPC network was not found.
          readOnly: true
          type: string
        revisionReason:
          description: Output only. A reason for the revision condition.
          enum:
            - REVISION_REASON_UNDEFINED
            - PENDING
            - RESERVE
            - RETIRED
            - RETIRING
            - RECREATING
            - HEALTH_CHECK_CONTAINER_ERROR
            - CUSTOMIZED_PATH_RESPONSE_PENDING
            - MIN_INSTANCES_NOT_PROVISIONED
            - ACTIVE_REVISION_LIMIT_REACHED
            - NO_DEPLOYMENT
            - HEALTH_CHECK_SKIPPED
            - MIN_INSTANCES_WARMING
          enumDescriptions:
            - Default value.
            - Revision in Pending state.
            - Revision is in Reserve state.
            - Revision is Retired.
            - Revision is being retired.
            - Revision is being recreated.
            - There was a health check error.
            - >-
              Health check failed due to user error from customized path of the
              container. System will retry.
            - >-
              A revision with min_instance_count > 0 was created and is
              reserved, but it was not configured to serve traffic, so it's not
              live. This can also happen momentarily during traffic migration.
            - The maximum allowed number of active revisions has been reached.
            - >-
              There was no deployment defined. This value is no longer used, but
              Services created in older versions of the API might contain this
              value.
            - >-
              A revision's container has no port specified since the revision is
              of a manually scaled service with 0 instance count
            - >-
              A revision with min_instance_count > 0 was created and is waiting
              for enough instances to begin a traffic migration.
          readOnly: true
          type: string
        severity:
          description: >-
            How to interpret failures of this condition, one of Error, Warning,
            Info
          enum:
            - SEVERITY_UNSPECIFIED
            - ERROR
            - WARNING
            - INFO
          enumDescriptions:
            - Unspecified severity
            - Error severity.
            - Warning severity.
            - Info severity.
          type: string
        state:
          description: State of the condition.
          enum:
            - STATE_UNSPECIFIED
            - CONDITION_PENDING
            - CONDITION_RECONCILING
            - CONDITION_FAILED
            - CONDITION_SUCCEEDED
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - 'Transient state: Reconciliation has not started yet.'
            - 'Transient state: reconciliation is still in progress.'
            - 'Terminal state: Reconciliation did not succeed.'
            - 'Terminal state: Reconciliation completed successfully.'
          type: string
        type:
          description: >-
            type is used to communicate the status of the reconciliation
            process. See also:
            https://github.com/knative/serving/blob/main/docs/spec/errors.md#error-conditions-and-reporting
            Types common to all resources include: * "Ready": True when the
            Resource is ready.
          type: string
      type: object
    GoogleCloudRunV2Container:
      description: >-
        A single application container. This specifies both the container to
        run, the command to run in the container and the arguments to supply to
        it. Note that additional arguments can be supplied by the system to the
        container at runtime.
      id: GoogleCloudRunV2Container
      properties:
        args:
          description: >-
            Arguments to the entrypoint. The docker image's CMD is used if this
            is not provided.
          items:
            type: string
          type: array
        baseImageUri:
          description: >-
            Base image for this container. Only supported for services. If set,
            it indicates that the service is enrolled into automatic base image
            update.
          type: string
        buildInfo:
          $ref: '#/components/schemas/GoogleCloudRunV2BuildInfo'
          description: Output only. The build info of the container image.
          readOnly: true
        command:
          description: >-
            Entrypoint array. Not executed within a shell. The docker image's
            ENTRYPOINT is used if this is not provided.
          items:
            type: string
          type: array
        dependsOn:
          description: Names of the containers that must start before this container.
          items:
            type: string
          type: array
        env:
          description: List of environment variables to set in the container.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2EnvVar'
          type: array
        image:
          description: >-
            Required. Name of the container image in Dockerhub, Google Artifact
            Registry, or Google Container Registry. If the host is not provided,
            Dockerhub is assumed.
          type: string
        livenessProbe:
          $ref: '#/components/schemas/GoogleCloudRunV2Probe'
          description: >-
            Periodic probe of container liveness. Container will be restarted if
            the probe fails.
        name:
          description: Name of the container specified as a DNS_LABEL (RFC 1123).
          type: string
        ports:
          description: >-
            List of ports to expose from the container. Only a single port can
            be specified. The specified ports must be listening on all
            interfaces (0.0.0.0) within the container to be accessible. If
            omitted, a port number will be chosen and passed to the container
            through the PORT environment variable for the container to listen
            on.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2ContainerPort'
          type: array
        readinessProbe:
          $ref: '#/components/schemas/GoogleCloudRunV2Probe'
          description: Readiness probe to be used for health checks.
        resources:
          $ref: '#/components/schemas/GoogleCloudRunV2ResourceRequirements'
          description: Compute Resource requirements by this container.
        sandboxLauncher:
          description: >-
            Optional. Indicates that this container can act as a sandbox
            supervisor and launch sandboxes.
          type: boolean
        sourceCode:
          $ref: '#/components/schemas/GoogleCloudRunV2SourceCode'
          description: Optional. Location of the source.
        startupProbe:
          $ref: '#/components/schemas/GoogleCloudRunV2Probe'
          description: >-
            Startup probe of application within the container. All other probes
            are disabled if a startup probe is provided, until it succeeds.
            Container will not be added to service endpoints if the probe fails.
        volumeMounts:
          description: Volume to mount into the container's filesystem.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2VolumeMount'
          type: array
        workingDir:
          description: >-
            Container's working directory. If not specified, the container
            runtime's default will be used, which might be configured in the
            container image.
          type: string
      type: object
    GoogleCloudRunV2ContainerOverride:
      description: Per-container override specification.
      id: GoogleCloudRunV2ContainerOverride
      properties:
        args:
          description: >-
            Optional. Arguments to the entrypoint. Will replace existing args
            for override.
          items:
            type: string
          type: array
        clearArgs:
          description: Optional. True if the intention is to clear out existing args list.
          type: boolean
        env:
          description: >-
            List of environment variables to set in the container. Will be
            merged with existing env for override.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2EnvVar'
          type: array
        name:
          description: The name of the container specified as a DNS_LABEL.
          type: string
      type: object
    GoogleCloudRunV2ContainerPort:
      description: ContainerPort represents a network port in a single container.
      id: GoogleCloudRunV2ContainerPort
      properties:
        containerPort:
          description: >-
            Port number the container listens on. This must be a valid TCP port
            number, 0 < container_port < 65536.
          format: int32
          type: integer
        name:
          description: >-
            If specified, used to specify which protocol to use. Allowed values
            are "http1" and "h2c".
          type: string
      type: object
    GoogleCloudRunV2ContainerStatus:
      description: >-
        ContainerStatus holds the information of container name and image digest
        value.
      id: GoogleCloudRunV2ContainerStatus
      properties:
        imageDigest:
          description: >-
            ImageDigest holds the resolved digest for the image specified and
            resolved during the creation of Revision. This field holds the
            digest value regardless of whether a tag or digest was originally
            specified in the Container object.
          type: string
        name:
          description: The name of the container, if specified.
          type: string
      type: object
    GoogleCloudRunV2DockerBuild:
      description: Build the source using Docker. This means the source has a Dockerfile.
      id: GoogleCloudRunV2DockerBuild
      properties: {}
      type: object
    GoogleCloudRunV2EmptyDirVolumeSource:
      description: >-
        In memory (tmpfs) ephemeral storage. It is ephemeral in the sense that
        when the sandbox is taken down, the data is destroyed with it (it does
        not persist across sandbox runs).
      id: GoogleCloudRunV2EmptyDirVolumeSource
      properties:
        medium:
          description: >-
            The medium on which the data is stored. Acceptable values today is
            only MEMORY or none. When none, the default will currently be backed
            by memory but could change over time. +optional
          enum:
            - MEDIUM_UNSPECIFIED
            - MEMORY
            - DISK
          enumDescriptions:
            - >-
              When not specified, falls back to the default implementation which
              is currently in memory (this may change over time).
            - Explicitly set the EmptyDir to be in memory. Uses tmpfs.
            - Explicitly sets the EmptyDir to be a disk.
          type: string
        sizeLimit:
          description: >-
            Limit on the storage usable by this EmptyDir volume. The size limit
            is also applicable for memory medium. The maximum usage on memory
            medium EmptyDir would be the minimum value between the SizeLimit
            specified here and the sum of memory limits of all containers. The
            default is nil which means that the limit is undefined. More info:
            https://cloud.google.com/run/docs/configuring/in-memory-volumes#configure-volume.
            Info in Kubernetes:
            https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
          type: string
      type: object
    GoogleCloudRunV2EnvVar:
      description: EnvVar represents an environment variable present in a Container.
      id: GoogleCloudRunV2EnvVar
      properties:
        name:
          description: >-
            Required. Name of the environment variable. Must not exceed 32768
            characters.
          type: string
        value:
          description: >-
            Literal value of the environment variable. Defaults to "", and the
            maximum length is 32768 bytes. Variable references are not supported
            in Cloud Run.
          type: string
        valueSource:
          $ref: '#/components/schemas/GoogleCloudRunV2EnvVarSource'
          description: Source for the environment variable's value.
      type: object
    GoogleCloudRunV2EnvVarSource:
      description: EnvVarSource represents a source for the value of an EnvVar.
      id: GoogleCloudRunV2EnvVarSource
      properties:
        secretKeyRef:
          $ref: '#/components/schemas/GoogleCloudRunV2SecretKeySelector'
          description: Selects a secret and a specific version from Cloud Secret Manager.
      type: object
    GoogleCloudRunV2Execution:
      description: >-
        Execution represents the configuration of a single execution. A
        execution an immutable resource that references a container image which
        is run to completion.
      id: GoogleCloudRunV2Execution
      properties:
        annotations:
          additionalProperties:
            type: string
          description: >-
            Output only. Unstructured key value map that may be set by external
            tools to store and arbitrary metadata. They are not queryable and
            should be preserved when modifying objects.
          readOnly: true
          type: object
        cancelledCount:
          description: Output only. The number of tasks which reached phase Cancelled.
          format: int32
          readOnly: true
          type: integer
        client:
          description: Output only. Arbitrary identifier for the API client.
          readOnly: true
          type: string
        clientVersion:
          description: Output only. Arbitrary version identifier for the API client.
          readOnly: true
          type: string
        completionTime:
          description: >-
            Output only. Represents time when the execution was completed. It is
            not guaranteed to be set in happens-before order across separate
            operations.
          format: google-datetime
          readOnly: true
          type: string
        conditions:
          description: >-
            Output only. The Condition of this Execution, containing its
            readiness status, and detailed error information in case it did not
            reach the desired state.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Condition'
          readOnly: true
          type: array
        createTime:
          description: >-
            Output only. Represents time when the execution was acknowledged by
            the execution controller. It is not guaranteed to be set in
            happens-before order across separate operations.
          format: google-datetime
          readOnly: true
          type: string
        creator:
          description: Output only. Email address of the authenticated creator.
          readOnly: true
          type: string
        deleteTime:
          description: >-
            Output only. For a deleted resource, the deletion time. It is only
            populated as a response to a Delete request.
          format: google-datetime
          readOnly: true
          type: string
        etag:
          description: >-
            Output only. A system-generated fingerprint for this version of the
            resource. May be used to detect modification conflict during
            updates.
          readOnly: true
          type: string
        expireTime:
          description: >-
            Output only. For a deleted resource, the time after which it will be
            permamently deleted. It is only populated as a response to a Delete
            request.
          format: google-datetime
          readOnly: true
          type: string
        failedCount:
          description: Output only. The number of tasks which reached phase Failed.
          format: int32
          readOnly: true
          type: integer
        generation:
          description: >-
            Output only. A number that monotonically increases every time the
            user modifies the desired state.
          format: int64
          readOnly: true
          type: string
        job:
          description: Output only. The name of the parent Job.
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Output only. Unstructured key value map that can be used to organize
            and categorize objects. User-provided labels are shared with
            Google's billing system, so they can be used to filter, or break
            down billing charges by team, component, environment, state, etc.
            For more information, visit
            https://cloud.google.com/resource-manager/docs/creating-managing-labels
            or https://cloud.google.com/run/docs/configuring/labels
          readOnly: true
          type: object
        launchStage:
          description: >-
            The least stable launch stage needed to create this resource, as
            defined by [Google Cloud Platform Launch
            Stages](https://cloud.google.com/terms/launch-stages). Cloud Run
            supports `ALPHA`, `BETA`, and `GA`. Note that this value might not
            be what was used as input. For example, if ALPHA was provided as
            input in the parent resource, but only BETA and GA-level features
            are used, this field will be BETA.
          enum:
            - LAUNCH_STAGE_UNSPECIFIED
            - UNIMPLEMENTED
            - PRELAUNCH
            - EARLY_ACCESS
            - ALPHA
            - BETA
            - GA
            - DEPRECATED
          enumDescriptions:
            - Do not use this default value.
            - The feature is not yet implemented. Users can not use it.
            - >-
              Prelaunch features are hidden from users and are only visible
              internally.
            - >-
              Early Access features are limited to a closed group of testers. To
              use these features, you must sign up in advance and sign a Trusted
              Tester agreement (which includes confidentiality provisions).
              These features may be unstable, changed in backward-incompatible
              ways, and are not guaranteed to be released.
            - >-
              Alpha is a limited availability test for releases before they are
              cleared for widespread use. By Alpha, all significant design
              issues are resolved and we are in the process of verifying
              functionality. Alpha customers need to apply for access, agree to
              applicable terms, and have their projects allowlisted. Alpha
              releases don't have to be feature complete, no SLAs are provided,
              and there are no technical support obligations, but they will be
              far enough along that customers can actually use them in test
              environments or for limited-use tests -- just like they would in
              normal production cases.
            - >-
              Beta is the point at which we are ready to open a release for any
              customer to use. There are no SLA or technical support obligations
              in a Beta release. Products will be complete from a feature
              perspective, but may have some open outstanding issues. Beta
              releases are suitable for limited production use cases.
            - >-
              GA features are open to all developers and are considered stable
              and fully qualified for production use.
            - >-
              Deprecated features are scheduled to be shut down and removed. For
              more information, see the "Deprecation Policy" section of our
              [Terms of Service](https://cloud.google.com/terms/) and the
              [Google Cloud Platform Subject to the Deprecation
              Policy](https://cloud.google.com/terms/deprecation) documentation.
          type: string
        logUri:
          description: >-
            Output only. URI where logs for this execution can be found in Cloud
            Console.
          readOnly: true
          type: string
        name:
          description: Output only. The unique name of this Execution.
          readOnly: true
          type: string
        observedGeneration:
          description: >-
            Output only. The generation of this Execution. See comments in
            `reconciling` for additional information on reconciliation process
            in Cloud Run.
          format: int64
          readOnly: true
          type: string
        parallelism:
          description: >-
            Output only. Specifies the maximum desired number of tasks the
            execution should run at any given time. Must be <= task_count. The
            actual number of tasks running in steady state will be less than
            this number when ((.spec.task_count - .status.successful) <
            .spec.parallelism), i.e. when the work left to do is less than max
            parallelism.
          format: int32
          readOnly: true
          type: integer
        reconciling:
          description: >-
            Output only. Indicates whether the resource's reconciliation is
            still in progress. See comments in `Job.reconciling` for additional
            information on reconciliation process in Cloud Run.
          readOnly: true
          type: boolean
        retriedCount:
          description: Output only. The number of tasks which have retried at least once.
          format: int32
          readOnly: true
          type: integer
        runningCount:
          description: Output only. The number of actively running tasks.
          format: int32
          readOnly: true
          type: integer
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        startTime:
          description: >-
            Output only. Represents time when the execution started to run. It
            is not guaranteed to be set in happens-before order across separate
            operations.
          format: google-datetime
          readOnly: true
          type: string
        succeededCount:
          description: Output only. The number of tasks which reached phase Succeeded.
          format: int32
          readOnly: true
          type: integer
        taskCount:
          description: >-
            Output only. Specifies the desired number of tasks the execution
            should run. Setting to 1 means that parallelism is limited to 1 and
            the success of that task signals the success of the execution.
          format: int32
          readOnly: true
          type: integer
        template:
          $ref: '#/components/schemas/GoogleCloudRunV2TaskTemplate'
          description: Output only. The template used to create tasks for this execution.
          readOnly: true
        uid:
          description: >-
            Output only. Server assigned unique identifier for the Execution.
            The value is a UUID4 string and guaranteed to remain unchanged until
            the resource is deleted.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The last-modified time.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudRunV2ExecutionReference:
      description: >-
        Reference to an Execution. Use /Executions.GetExecution with the given
        name to get full execution including the latest status.
      id: GoogleCloudRunV2ExecutionReference
      properties:
        completionStatus:
          description: Status for the execution completion.
          enum:
            - COMPLETION_STATUS_UNSPECIFIED
            - EXECUTION_SUCCEEDED
            - EXECUTION_FAILED
            - EXECUTION_RUNNING
            - EXECUTION_PENDING
            - EXECUTION_CANCELLED
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - Job execution has succeeded.
            - Job execution has failed.
            - Job execution is running normally.
            - Waiting for backing resources to be provisioned.
            - Job execution has been cancelled by the user.
          type: string
        completionTime:
          description: Creation timestamp of the execution.
          format: google-datetime
          type: string
        createTime:
          description: Creation timestamp of the execution.
          format: google-datetime
          type: string
        deleteTime:
          description: >-
            The deletion time of the execution. It is only populated as a
            response to a Delete request.
          format: google-datetime
          type: string
        name:
          description: Name of the execution.
          type: string
      type: object
    GoogleCloudRunV2ExecutionTemplate:
      description: >-
        ExecutionTemplate describes the data an execution should have when
        created from a template.
      id: GoogleCloudRunV2ExecutionTemplate
      properties:
        annotations:
          additionalProperties:
            type: string
          description: >-
            Unstructured key value map that may be set by external tools to
            store and arbitrary metadata. They are not queryable and should be
            preserved when modifying objects. Cloud Run API v2 does not support
            annotations with `run.googleapis.com`, `cloud.googleapis.com`,
            `serving.knative.dev`, or `autoscaling.knative.dev` namespaces, and
            they will be rejected. All system annotations in v1 now have a
            corresponding field in v2 ExecutionTemplate. This field follows
            Kubernetes annotations' namespacing, limits, and rules.
          type: object
        client:
          description: Optional. Arbitrary identifier for the API client.
          type: string
        clientVersion:
          description: Optional. Arbitrary version identifier for the API client.
          type: string
        delayExecution:
          description: >-
            Optional. If true, the system will start the execution within the
            next 12 hours depending on available capacity.
          type: boolean
        labels:
          additionalProperties:
            type: string
          description: >-
            Unstructured key value map that can be used to organize and
            categorize objects. User-provided labels are shared with Google's
            billing system, so they can be used to filter, or break down billing
            charges by team, component, environment, state, etc. For more
            information, visit
            https://cloud.google.com/resource-manager/docs/creating-managing-labels
            or https://cloud.google.com/run/docs/configuring/labels. Cloud Run
            API v2 does not support labels with `run.googleapis.com`,
            `cloud.googleapis.com`, `serving.knative.dev`, or
            `autoscaling.knative.dev` namespaces, and they will be rejected. All
            system labels in v1 now have a corresponding field in v2
            ExecutionTemplate.
          type: object
        parallelism:
          description: >-
            Optional. Specifies the maximum desired number of tasks the
            execution should run at given time. When the job is run, if this
            field is 0 or unset, the maximum possible value will be used for
            that execution. The actual number of tasks running in steady state
            will be less than this number when there are fewer tasks waiting to
            be completed remaining, i.e. when the work left to do is less than
            max parallelism.
          format: int32
          type: integer
        taskCount:
          description: >-
            Specifies the desired number of tasks the execution should run.
            Setting to 1 means that parallelism is limited to 1 and the success
            of that task signals the success of the execution. Defaults to 1.
          format: int32
          type: integer
        template:
          $ref: '#/components/schemas/GoogleCloudRunV2TaskTemplate'
          description: >-
            Required. Describes the task(s) that will be created when executing
            an execution.
      type: object
    GoogleCloudRunV2ExportImageRequest:
      description: Request message for exporting Cloud Run image.
      id: GoogleCloudRunV2ExportImageRequest
      properties:
        destinationRepo:
          description: Required. The export destination url (the Artifact Registry repo).
          type: string
      type: object
    GoogleCloudRunV2ExportImageResponse:
      description: >-
        ExportImageResponse contains an operation Id to track the image export
        operation.
      id: GoogleCloudRunV2ExportImageResponse
      properties:
        operationId:
          description: >-
            An operation ID used to track the status of image exports tied to
