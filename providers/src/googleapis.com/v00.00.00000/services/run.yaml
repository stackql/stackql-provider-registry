            will be a `string` instead of an `integer`.
          format: int64
          readOnly: true
          type: string
        gpuZonalRedundancyDisabled:
          description: Optional. True if GPU zonal redundancy is disabled on this instance.
          type: boolean
        iapEnabled:
          description: Optional. IAP settings on the Instance.
          type: boolean
        ingress:
          description: >-
            Optional. Provides the ingress settings for this Instance. On
            output, returns the currently observed ingress settings, or
            `INGRESS_TRAFFIC_UNSPECIFIED` if no revision is active.
          enum:
            - INGRESS_TRAFFIC_UNSPECIFIED
            - INGRESS_TRAFFIC_ALL
            - INGRESS_TRAFFIC_INTERNAL_ONLY
            - INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER
            - INGRESS_TRAFFIC_NONE
          enumDescriptions:
            - Unspecified
            - All inbound traffic is allowed.
            - Only internal traffic is allowed.
            - Both internal and Google Cloud Load Balancer traffic is allowed.
            - No ingress traffic is allowed.
          type: string
        invokerIamDisabled:
          description: >-
            Optional. Disables IAM permission check for `run.routes.invoke` for
            callers of this Instance. For more information, visit
            https://cloud.google.com/run/docs/securing/managing-access#invoker_check.
          type: boolean
        labels:
          additionalProperties:
            type: string
          type: object
        lastModifier:
          description: Output only. Email address of the last authenticated modifier.
          readOnly: true
          type: string
        launchStage:
          description: >-
            The launch stage as defined by [Google Cloud Platform Launch
            Stages](https://cloud.google.com/terms/launch-stages). Cloud Run
            supports `ALPHA`, `BETA`, and `GA`. If no value is specified, `GA`
            is assumed. Set the launch stage to a preview stage on input to
            allow use of preview features in that stage. On read (or output),
            describes whether the resource uses preview features. For example,
            if `ALPHA` is provided as input, but only `BETA` and `GA`-level
            features are used, this field will be `BETA` on output.
          enum:
            - LAUNCH_STAGE_UNSPECIFIED
            - UNIMPLEMENTED
            - PRELAUNCH
            - EARLY_ACCESS
            - ALPHA
            - BETA
            - GA
            - DEPRECATED
          enumDescriptions:
            - Do not use this default value.
            - The feature is not yet implemented. Users can not use it.
            - >-
              Prelaunch features are hidden from users and are only visible
              internally.
            - >-
              Early Access features are limited to a closed group of testers. To
              use these features, you must sign up in advance and sign a Trusted
              Tester agreement (which includes confidentiality provisions).
              These features may be unstable, changed in backward-incompatible
              ways, and are not guaranteed to be released.
            - >-
              Alpha is a limited availability test for releases before they are
              cleared for widespread use. By Alpha, all significant design
              issues are resolved and we are in the process of verifying
              functionality. Alpha customers need to apply for access, agree to
              applicable terms, and have their projects allowlisted. Alpha
              releases don't have to be feature complete, no SLAs are provided,
              and there are no technical support obligations, but they will be
              far enough along that customers can actually use them in test
              environments or for limited-use tests -- just like they would in
              normal production cases.
            - >-
              Beta is the point at which we are ready to open a release for any
              customer to use. There are no SLA or technical support obligations
              in a Beta release. Products will be complete from a feature
              perspective, but may have some open outstanding issues. Beta
              releases are suitable for limited production use cases.
            - >-
              GA features are open to all developers and are considered stable
              and fully qualified for production use.
            - >-
              Deprecated features are scheduled to be shut down and removed. For
              more information, see the "Deprecation Policy" section of our
              [Terms of Service](https://cloud.google.com/terms/) and the
              [Google Cloud Platform Subject to the Deprecation
              Policy](https://cloud.google.com/terms/deprecation) documentation.
          type: string
        logUri:
          description: Output only. The Google Console URI to obtain logs for the Instance.
          readOnly: true
          type: string
        name:
          description: >-
            The fully qualified name of this Instance. In
            `CreateInstanceRequest`, this field is ignored, and instead composed
            from `CreateInstanceRequest.parent` and
            `CreateInstanceRequest.instance_id`.
          type: string
        nodeSelector:
          $ref: '#/components/schemas/GoogleCloudRunV2NodeSelector'
          description: Optional. The node selector for the instance.
        observedGeneration:
          description: >-
            Output only. The generation of this Instance currently serving
            traffic. See comments in `reconciling` for additional information on
            reconciliation process in Cloud Run. Please note that unlike v1,
            this is an `int64` value. As with most Google APIs, its JSON
            representation will be a `string` instead of an `integer`.
          format: int64
          readOnly: true
          type: string
        reconciling:
          description: >-
            Output only. Returns `true` if the Instance is currently being acted
            upon by the system to bring it into the desired state. When a new
            Instance is created, or an existing one is updated, Cloud Run will
            asynchronously perform all necessary steps to bring the Instance to
            the desired serving state. This process is called reconciliation.
            While reconciliation is in process, `observed_generation` will have
            a transient value that might mismatch the intended state. Once
            reconciliation is over (and this field is `false`), there are two
            possible outcomes: reconciliation succeeded and the serving state
            matches the Instance, or there was an error, and reconciliation
            failed. This state can be found in `terminal_condition.state`.
          readOnly: true
          type: boolean
        restartPolicy:
          description: Optional. Restart policy for the Instance.
          enum:
            - RESTART_POLICY_UNSPECIFIED
            - ALWAYS
            - ON_FAILURE
            - NEVER
          enumDescriptions:
            - Unspecified restart policy.
            - Always restart the instance.
            - Restart if the instance terminates with non-zero exit code.
            - Never restart the instance.
          type: string
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        serviceAccount:
          type: string
        terminalCondition:
          $ref: '#/components/schemas/GoogleCloudRunV2Condition'
          description: >-
            Output only. The Condition of this Instance, containing its
            readiness status, and detailed error information in case it did not
            reach a serving state. See comments in `reconciling` for additional
            information on reconciliation process in Cloud Run.
          readOnly: true
        uid:
          description: >-
            Output only. Server assigned unique identifier for the trigger. The
            value is a UUID4 string and guaranteed to remain unchanged until the
            resource is deleted.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The last-modified time.
          format: google-datetime
          readOnly: true
          type: string
        urls:
          description: Output only. All URLs serving traffic for this Instance.
          items:
            type: string
          readOnly: true
          type: array
        volumes:
          description: A list of Volumes to make available to containers.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Volume'
          type: array
        vpcAccess:
          $ref: '#/components/schemas/GoogleCloudRunV2VpcAccess'
          description: >-
            Optional. VPC Access configuration to use for this Revision. For
            more information, visit
            https://cloud.google.com/run/docs/configuring/connecting-vpc.
      type: object
    GoogleCloudRunV2InstanceSplit:
