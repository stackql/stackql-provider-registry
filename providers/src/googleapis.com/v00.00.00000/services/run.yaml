            $ref: '#/components/schemas/GoogleCloudRunV2Volume'
          type: array
        vpcAccess:
          $ref: '#/components/schemas/GoogleCloudRunV2VpcAccess'
          description: >-
            VPC Access configuration for this Revision. For more information,
            visit https://cloud.google.com/run/docs/configuring/connecting-vpc.
      type: object
    GoogleCloudRunV2RevisionScaling:
      description: Settings for revision-level scaling settings.
      id: GoogleCloudRunV2RevisionScaling
      properties:
        concurrencyUtilization:
          description: >-
            Optional. Determines a threshold for concurrency utilization before
            scaling begins. Accepted values are between `0.1` and `0.95`
            (inclusive) or `0.0` to disable concurrency utilization as threshold
            for scaling. CPU and concurrency scaling cannot both be disabled.
          format: float
          type: number
        cpuUtilization:
          description: >-
            Optional. Determines a threshold for CPU utilization before scaling
            begins. Accepted values are between `0.1` and `0.90` (inclusive) or
            `0.0` to disable CPU utilization as threshold for scaling. CPU and
            concurrency scaling cannot both be disabled.
          format: float
          type: number
        maxInstanceCount:
          description: >-
            Optional. Maximum number of serving instances that this resource
            should have. When unspecified, the field is set to the server
            default value of 100. For more information see
            https://cloud.google.com/run/docs/configuring/max-instances
          format: int32
          type: integer
        minInstanceCount:
          description: >-
            Optional. Minimum number of serving instances that this resource
            should have.
          format: int32
          type: integer
      type: object
    GoogleCloudRunV2RevisionScalingStatus:
      description: Effective settings for the current revision
      id: GoogleCloudRunV2RevisionScalingStatus
      properties:
        desiredMinInstanceCount:
          description: The current number of min instances provisioned for this revision.
          format: int32
          type: integer
      type: object
    GoogleCloudRunV2RevisionTemplate:
      description: >-
        RevisionTemplate describes the data a revision should have when created
        from a template.
      id: GoogleCloudRunV2RevisionTemplate
      properties:
        annotations:
          additionalProperties:
            type: string
          description: >-
            Optional. Unstructured key value map that may be set by external
            tools to store and arbitrary metadata. They are not queryable and
            should be preserved when modifying objects. Cloud Run API v2 does
            not support annotations with `run.googleapis.com`,
            `cloud.googleapis.com`, `serving.knative.dev`, or
            `autoscaling.knative.dev` namespaces, and they will be rejected. All
            system annotations in v1 now have a corresponding field in v2
            RevisionTemplate. This field follows Kubernetes annotations'
            namespacing, limits, and rules.
          type: object
        client:
          description: Optional. Arbitrary identifier for the API client.
          type: string
        clientVersion:
          description: Optional. Arbitrary version identifier for the API client.
          type: string
        containers:
          description: >-
            Holds the list which define the units of execution for this
            Revision.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Container'
          type: array
        encryptionKey:
          description: >-
            A reference to a customer managed encryption key (CMEK) to use to
            encrypt this container image. For more information, go to
            https://cloud.google.com/run/docs/securing/using-cmek
          type: string
        encryptionKeyRevocationAction:
          description: Optional. The action to take if the encryption key is revoked.
          enum:
            - ENCRYPTION_KEY_REVOCATION_ACTION_UNSPECIFIED
            - PREVENT_NEW
            - SHUTDOWN
          enumDescriptions:
            - Unspecified
            - Prevents the creation of new instances.
            - Shuts down existing instances, and prevents creation of new ones.
          type: string
        encryptionKeyShutdownDuration:
          description: >-
            Optional. If encryption_key_revocation_action is SHUTDOWN, the
            duration before shutting down all instances. The minimum increment
            is 1 hour.
          format: google-duration
          type: string
        executionEnvironment:
          description: Optional. The sandbox environment to host this Revision.
          enum:
            - EXECUTION_ENVIRONMENT_UNSPECIFIED
            - EXECUTION_ENVIRONMENT_GEN1
            - EXECUTION_ENVIRONMENT_GEN2
          enumDescriptions:
            - Unspecified
            - Uses the First Generation environment.
            - Uses Second Generation environment.
          type: string
        gpuZonalRedundancyDisabled:
          description: Optional. True if GPU zonal redundancy is disabled on this revision.
          type: boolean
        healthCheckDisabled:
          description: Optional. Disables health checking containers during deployment.
          type: boolean
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Unstructured key value map that can be used to organize
            and categorize objects. User-provided labels are shared with
            Google's billing system, so they can be used to filter, or break
            down billing charges by team, component, environment, state, etc.
            For more information, visit
            https://cloud.google.com/resource-manager/docs/creating-managing-labels
            or https://cloud.google.com/run/docs/configuring/labels. Cloud Run
            API v2 does not support labels with `run.googleapis.com`,
            `cloud.googleapis.com`, `serving.knative.dev`, or
            `autoscaling.knative.dev` namespaces, and they will be rejected. All
            system labels in v1 now have a corresponding field in v2
            RevisionTemplate.
          type: object
        maxInstanceRequestConcurrency:
          description: >-
            Optional. Sets the maximum number of requests that each serving
            instance can receive. If not specified or 0, concurrency defaults to
            80 when requested `CPU >= 1` and defaults to 1 when requested `CPU <
            1`.
          format: int32
          type: integer
        nodeSelector:
          $ref: '#/components/schemas/GoogleCloudRunV2NodeSelector'
          description: Optional. The node selector for the revision template.
        revision:
          description: >-
            Optional. The unique name for the revision. If this field is
            omitted, it will be automatically generated based on the Service
            name.
          type: string
        scaling:
          $ref: '#/components/schemas/GoogleCloudRunV2RevisionScaling'
          description: Optional. Scaling settings for this Revision.
        serviceAccount:
          description: >-
            Optional. Email address of the IAM service account associated with
            the revision of the service. The service account represents the
            identity of the running revision, and determines what permissions
            the revision has. If not provided, the revision will use the
            project's default service account.
          type: string
        serviceMesh:
          $ref: '#/components/schemas/GoogleCloudRunV2ServiceMesh'
          description: Optional. Enables service mesh connectivity.
        sessionAffinity:
          description: Optional. Enable session affinity.
          type: boolean
        timeout:
          description: Optional. Max allowed time for an instance to respond to a request.
          format: google-duration
          type: string
        volumes:
          description: Optional. A list of Volumes to make available to containers.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Volume'
          type: array
        vpcAccess:
          $ref: '#/components/schemas/GoogleCloudRunV2VpcAccess'
          description: >-
            Optional. VPC Access configuration to use for this Revision. For
            more information, visit
            https://cloud.google.com/run/docs/configuring/connecting-vpc.
      type: object
    GoogleCloudRunV2RunJobRequest:
      description: Request message to create a new Execution of a Job.
      id: GoogleCloudRunV2RunJobRequest
      properties:
        etag:
          description: >-
            A system-generated fingerprint for this version of the resource. May
            be used to detect modification conflict during updates.
          type: string
        overrides:
          $ref: '#/components/schemas/GoogleCloudRunV2Overrides'
          description: >-
            Overrides specification for a given execution of a job. If provided,
            overrides will be applied to update the execution or task spec.
        validateOnly:
          description: >-
            Indicates that the request should be validated without actually
            deleting any resources.
          type: boolean
      type: object
    GoogleCloudRunV2SecretKeySelector:
      description: SecretEnvVarSource represents a source for the value of an EnvVar.
      id: GoogleCloudRunV2SecretKeySelector
      properties:
        secret:
          description: >-
            Required. The name of the secret in Cloud Secret Manager. Format:
            {secret_name} if the secret is in the same project.
            projects/{project}/secrets/{secret_name} if the secret is in a
            different project.
          type: string
        version:
          description: >-
            The Cloud Secret Manager secret version. Can be 'latest' for the
            latest version, an integer for a specific version, or a version
            alias.
          type: string
      type: object
    GoogleCloudRunV2SecretVolumeSource:
      description: >-
        The secret's value will be presented as the content of a file whose name
        is defined in the item path. If no items are defined, the name of the
        file is the secret.
      id: GoogleCloudRunV2SecretVolumeSource
      properties:
        defaultMode:
          description: >-
            Integer representation of mode bits to use on created files by
            default. Must be a value between 0000 and 0777 (octal), defaulting
            to 0444. Directories within the path are not affected by this
            setting. Notes * Internally, a umask of 0222 will be applied to any
            non-zero value. * This is an integer representation of the mode
            bits. So, the octal integer value should look exactly as the chmod
            numeric notation with a leading zero. Some examples: for chmod 640
            (u=rw,g=r), set to 0640 (octal) or 416 (base-10). For chmod 755
            (u=rwx,g=rx,o=rx), set to 0755 (octal) or 493 (base-10). * This
            might be in conflict with other options that affect the file mode,
            like fsGroup, and the result can be other mode bits set. This might
            be in conflict with other options that affect the file mode, like
            fsGroup, and as a result, other mode bits could be set.
          format: int32
          type: integer
        items:
          description: >-
            If unspecified, the volume will expose a file whose name is the
            secret, relative to VolumeMount.mount_path + VolumeMount.sub_path.
            If specified, the key will be used as the version to fetch from
            Cloud Secret Manager and the path will be the name of the file
            exposed in the volume. When items are defined, they must specify a
            path and a version.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2VersionToPath'
          type: array
        secret:
          description: >-
            Required. The name of the secret in Cloud Secret Manager. Format:
            {secret} if the secret is in the same project.
            projects/{project}/secrets/{secret} if the secret is in a different
            project.
          type: string
      type: object
    GoogleCloudRunV2Service:
      description: >-
        Service acts as a top-level container that manages a set of
        configurations and revision templates which implement a network service.
        Service exists to provide a singular abstraction which can be access
        controlled, reasoned about, and which encapsulates software lifecycle
        decisions such as rollout policy and team resource ownership.
      id: GoogleCloudRunV2Service
      properties:
        annotations:
          additionalProperties:
            type: string
          description: >-
            Optional. Unstructured key value map that may be set by external
            tools to store and arbitrary metadata. They are not queryable and
            should be preserved when modifying objects. Cloud Run API v2 does
            not support annotations with `run.googleapis.com`,
            `cloud.googleapis.com`, `serving.knative.dev`, or
            `autoscaling.knative.dev` namespaces, and they will be rejected in
            new resources. All system annotations in v1 now have a corresponding
            field in v2 Service. This field follows Kubernetes annotations'
            namespacing, limits, and rules.
          type: object
        binaryAuthorization:
          $ref: '#/components/schemas/GoogleCloudRunV2BinaryAuthorization'
          description: Optional. Settings for the Binary Authorization feature.
        buildConfig:
          $ref: '#/components/schemas/GoogleCloudRunV2BuildConfig'
          description: Optional. Configuration for building a Cloud Run function.
        client:
          description: Arbitrary identifier for the API client.
          type: string
        clientVersion:
          description: Arbitrary version identifier for the API client.
          type: string
        conditions:
          description: >-
            Output only. The Conditions of all other associated sub-resources.
            They contain additional diagnostics information in case the Service
            does not reach its Serving state. See comments in `reconciling` for
            additional information on reconciliation process in Cloud Run.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Condition'
          readOnly: true
          type: array
        createTime:
          description: Output only. The creation time.
          format: google-datetime
          readOnly: true
          type: string
        creator:
          description: Output only. Email address of the authenticated creator.
          readOnly: true
          type: string
        customAudiences:
          description: >-
            One or more custom audiences that you want this service to support.
            Specify each custom audience as the full URL in a string. The custom
            audiences are encoded in the token and used to authenticate
            requests. For more information, see
            https://cloud.google.com/run/docs/configuring/custom-audiences.
          items:
            type: string
          type: array
        defaultUriDisabled:
          description: >-
            Optional. Disables public resolution of the default URI of this
            service.
          type: boolean
        deleteTime:
          description: >-
            Output only. The deletion time. It is only populated as a response
            to a Delete request.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            User-provided description of the Service. This field currently has a
            512-character limit.
          type: string
        durableExecution:
          description: >-
            Optional. Immutable. Indicates whether the Service has durable
            execution enabled. This field is immutable once the Service is
            created.
          type: boolean
        etag:
          description: >-
            Optional. A system-generated fingerprint for this version of the
            resource. May be used to detect modification conflict during
            updates.
          type: string
        expireTime:
          description: >-
            Output only. For a deleted resource, the time after which it will be
            permanently deleted.
          format: google-datetime
          readOnly: true
          type: string
        generation:
          description: >-
            Output only. A number that monotonically increases every time the
            user modifies the desired state. Please note that unlike v1, this is
            an int64 value. As with most Google APIs, its JSON representation
            will be a `string` instead of an `integer`.
          format: int64
          readOnly: true
          type: string
        iapEnabled:
          description: Optional. IAP settings on the Service.
          type: boolean
        ingress:
          description: >-
            Optional. Provides the ingress settings for this Service. On output,
            returns the currently observed ingress settings, or
            INGRESS_TRAFFIC_UNSPECIFIED if no revision is active.
          enum:
            - INGRESS_TRAFFIC_UNSPECIFIED
            - INGRESS_TRAFFIC_ALL
            - INGRESS_TRAFFIC_INTERNAL_ONLY
            - INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER
            - INGRESS_TRAFFIC_NONE
          enumDescriptions:
            - Unspecified
            - All inbound traffic is allowed.
            - Only internal traffic is allowed.
            - Both internal and Google Cloud Load Balancer traffic is allowed.
            - No ingress traffic is allowed.
          type: string
        invokerIamDisabled:
          description: >-
            Optional. Disables IAM permission check for run.routes.invoke for
            callers of this service. For more information, visit
            https://cloud.google.com/run/docs/securing/managing-access#invoker_check.
          type: boolean
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Unstructured key value map that can be used to organize
            and categorize objects. User-provided labels are shared with
            Google's billing system, so they can be used to filter, or break
            down billing charges by team, component, environment, state, etc.
            For more information, visit
            https://cloud.google.com/resource-manager/docs/creating-managing-labels
            or https://cloud.google.com/run/docs/configuring/labels. Cloud Run
            API v2 does not support labels with `run.googleapis.com`,
            `cloud.googleapis.com`, `serving.knative.dev`, or
            `autoscaling.knative.dev` namespaces, and they will be rejected. All
            system labels in v1 now have a corresponding field in v2 Service.
          type: object
        lastModifier:
          description: Output only. Email address of the last authenticated modifier.
          readOnly: true
          type: string
        latestCreatedRevision:
          description: >-
            Output only. Name of the last created revision. See comments in
            `reconciling` for additional information on reconciliation process
            in Cloud Run.
          readOnly: true
          type: string
        latestReadyRevision:
          description: >-
            Output only. Name of the latest revision that is serving traffic.
            See comments in `reconciling` for additional information on
            reconciliation process in Cloud Run.
          readOnly: true
          type: string
        launchStage:
          description: >-
            Optional. The launch stage as defined by [Google Cloud Platform
            Launch Stages](https://cloud.google.com/terms/launch-stages). Cloud
            Run supports `ALPHA`, `BETA`, and `GA`. If no value is specified, GA
            is assumed. Set the launch stage to a preview stage on input to
            allow use of preview features in that stage. On read (or output),
            describes whether the resource uses preview features. For example,
            if ALPHA is provided as input, but only BETA and GA-level features
            are used, this field will be BETA on output.
          enum:
            - LAUNCH_STAGE_UNSPECIFIED
            - UNIMPLEMENTED
            - PRELAUNCH
            - EARLY_ACCESS
            - ALPHA
            - BETA
            - GA
            - DEPRECATED
          enumDescriptions:
            - Do not use this default value.
            - The feature is not yet implemented. Users can not use it.
            - >-
              Prelaunch features are hidden from users and are only visible
              internally.
            - >-
              Early Access features are limited to a closed group of testers. To
              use these features, you must sign up in advance and sign a Trusted
              Tester agreement (which includes confidentiality provisions).
              These features may be unstable, changed in backward-incompatible
              ways, and are not guaranteed to be released.
            - >-
              Alpha is a limited availability test for releases before they are
              cleared for widespread use. By Alpha, all significant design
              issues are resolved and we are in the process of verifying
              functionality. Alpha customers need to apply for access, agree to
              applicable terms, and have their projects allowlisted. Alpha
              releases don't have to be feature complete, no SLAs are provided,
              and there are no technical support obligations, but they will be
              far enough along that customers can actually use them in test
              environments or for limited-use tests -- just like they would in
              normal production cases.
            - >-
              Beta is the point at which we are ready to open a release for any
              customer to use. There are no SLA or technical support obligations
              in a Beta release. Products will be complete from a feature
              perspective, but may have some open outstanding issues. Beta
              releases are suitable for limited production use cases.
            - >-
              GA features are open to all developers and are considered stable
              and fully qualified for production use.
            - >-
              Deprecated features are scheduled to be shut down and removed. For
              more information, see the "Deprecation Policy" section of our
              [Terms of Service](https://cloud.google.com/terms/) and the
              [Google Cloud Platform Subject to the Deprecation
              Policy](https://cloud.google.com/terms/deprecation) documentation.
          type: string
        multiRegionSettings:
          $ref: '#/components/schemas/GoogleCloudRunV2MultiRegionSettings'
          description: Optional. Settings for multi-region deployment.
        name:
          description: >-
            Identifier. The fully qualified name of this Service. In
            CreateServiceRequest, this field is ignored, and instead composed
            from CreateServiceRequest.parent and
            CreateServiceRequest.service_id. Format:
            projects/{project}/locations/{location}/services/{service_id}
          type: string
        observedGeneration:
          description: >-
            Output only. The generation of this Service currently serving
            traffic. See comments in `reconciling` for additional information on
            reconciliation process in Cloud Run. Please note that unlike v1,
            this is an int64 value. As with most Google APIs, its JSON
            representation will be a `string` instead of an `integer`.
          format: int64
          readOnly: true
          type: string
        reconciling:
          description: >-
            Output only. Returns true if the Service is currently being acted
            upon by the system to bring it into the desired state. When a new
            Service is created, or an existing one is updated, Cloud Run will
            asynchronously perform all necessary steps to bring the Service to
            the desired serving state. This process is called reconciliation.
            While reconciliation is in process, `observed_generation`,
            `latest_ready_revision`, `traffic_statuses`, and `uri` will have
            transient values that might mismatch the intended state: Once
            reconciliation is over (and this field is false), there are two
            possible outcomes: reconciliation succeeded and the serving state
            matches the Service, or there was an error, and reconciliation
            failed. This state can be found in `terminal_condition.state`. If
            reconciliation succeeded, the following fields will match: `traffic`
            and `traffic_statuses`, `observed_generation` and `generation`,
            `latest_ready_revision` and `latest_created_revision`. If
            reconciliation failed, `traffic_statuses`, `observed_generation`,
            and `latest_ready_revision` will have the state of the last serving
            revision, or empty for newly created Services. Additional
            information on the failure can be found in `terminal_condition` and
            `conditions`.
          readOnly: true
          type: boolean
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        scaling:
          $ref: '#/components/schemas/GoogleCloudRunV2ServiceScaling'
          description: Optional. Specifies service-level scaling settings
        sshEnabled:
          description: Optional. Enables SSH access to the Service.
          type: boolean
        template:
          $ref: '#/components/schemas/GoogleCloudRunV2RevisionTemplate'
          description: Required. The template used to create revisions for this Service.
        terminalCondition:
          $ref: '#/components/schemas/GoogleCloudRunV2Condition'
          description: >-
            Output only. The Condition of this Service, containing its readiness
            status, and detailed error information in case it did not reach a
            serving state. See comments in `reconciling` for additional
            information on reconciliation process in Cloud Run.
          readOnly: true
        threatDetectionEnabled:
          description: >-
            Output only. True if Cloud Run Threat Detection monitoring is
            enabled for the parent project of this Service.
          readOnly: true
          type: boolean
        traffic:
          description: >-
            Optional. Specifies how to distribute traffic over a collection of
            Revisions belonging to the Service. If traffic is empty or not
            provided, defaults to 100% traffic to the latest `Ready` Revision.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2TrafficTarget'
          type: array
        trafficStatuses:
          description: >-
            Output only. Detailed status information for corresponding traffic
            targets. See comments in `reconciling` for additional information on
            reconciliation process in Cloud Run.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2TrafficTargetStatus'
          readOnly: true
          type: array
        uid:
          description: >-
            Output only. Server assigned unique identifier for the trigger. The
            value is a UUID4 string and guaranteed to remain unchanged until the
            resource is deleted.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The last-modified time.
          format: google-datetime
          readOnly: true
          type: string
        uri:
          description: Output only. The main URI in which this Service is serving traffic.
          readOnly: true
          type: string
        urls:
          description: Output only. All URLs serving traffic for this Service.
          items:
            type: string
          readOnly: true
          type: array
      type: object
    GoogleCloudRunV2ServiceMesh:
      description: >-
        Settings for Cloud Service Mesh. For more information see
        https://cloud.google.com/service-mesh/docs/overview.
      id: GoogleCloudRunV2ServiceMesh
      properties:
        mesh:
          description: >-
            The Mesh resource name. Format:
            `projects/{project}/locations/global/meshes/{mesh}`, where
            `{project}` can be project id or number.
          type: string
      type: object
    GoogleCloudRunV2ServiceScaling:
      description: >-
        Scaling settings applied at the service level rather than at the
        revision level.
      id: GoogleCloudRunV2ServiceScaling
      properties:
        manualInstanceCount:
          description: >-
            Optional. total instance count for the service in manual scaling
            mode. This number of instances is divided among all revisions with
            specified traffic based on the percent of traffic they are
            receiving.
          format: int32
          type: integer
        maxInstanceCount:
          description: >-
            Optional. total max instances for the service. This number of
            instances is divided among all revisions with specified traffic
            based on the percent of traffic they are receiving.
          format: int32
          type: integer
        minInstanceCount:
          description: >-
            Optional. total min instances for the service. This number of
            instances is divided among all revisions with specified traffic
            based on the percent of traffic they are receiving.
          format: int32
          type: integer
        scalingMode:
          description: Optional. The scaling mode for the service.
          enum:
            - SCALING_MODE_UNSPECIFIED
            - AUTOMATIC
            - MANUAL
          enumDescriptions:
            - Unspecified.
            - Scale based on traffic between min and max instances.
            - Scale to exactly min instances and ignore max instances.
          type: string
      type: object
    GoogleCloudRunV2SourceCode:
      description: Source type for the container.
      id: GoogleCloudRunV2SourceCode
      properties:
        cloudStorageSource:
          $ref: '#/components/schemas/GoogleCloudRunV2CloudStorageSource'
          description: The source is a Cloud Storage bucket.
        inlinedSource:
          $ref: '#/components/schemas/GoogleCloudRunV2InlinedSource'
          description: >-
            Optional. Input only. Source code inlined in the request. Cloud Run
            will store the inlined_source to Cloud Storage and replace the field
            with cloud_storage_source.
      type: object
    GoogleCloudRunV2SourceFile:
      description: Source file.
      id: GoogleCloudRunV2SourceFile
      properties:
        content:
          description: >-
            Required. Input only. Represents the exact, literal, and complete
            source code of the file. Placeholders like `...` or comments such as
            `# [rest of code]` should NEVER be used as omission. Every character
            in this field will be built into the final container. Any omission
            will result in a broken application.
          type: string
        filename:
          description: >-
            Required. Input only. The file name for the source code. e.g.,
            `"index.js"` or `"node_modules/dependency.js"`. The filename must be
            less than 255 characters and cannot contain `..`, `./`, `//`, or end
            with a `/`. Cloud Run will place the files in the container
            subdirectories, please use relative path to access the file.
          type: string
      type: object
    GoogleCloudRunV2StartInstanceRequest:
      description: Request message for starting an Instance.
      id: GoogleCloudRunV2StartInstanceRequest
      properties:
        etag:
          description: >-
            Optional. A system-generated fingerprint for this version of the
            resource. This may be used to detect modification conflict during
            updates.
          type: string
        validateOnly:
          description: >-
            Optional. Indicates that the request should be validated without
            actually stopping any resources.
          type: boolean
      type: object
    GoogleCloudRunV2StopInstanceRequest:
      description: Request message for deleting an Instance.
      id: GoogleCloudRunV2StopInstanceRequest
      properties:
        etag:
          description: >-
            Optional. A system-generated fingerprint for this version of the
            resource. This may be used to detect modification conflict during
            updates.
          type: string
        validateOnly:
          description: >-
            Optional. Indicates that the request should be validated without
            actually stopping any resources.
          type: boolean
      type: object
    GoogleCloudRunV2StorageSource:
      description: Location of the source in an archive file in Google Cloud Storage.
      id: GoogleCloudRunV2StorageSource
      properties:
        bucket:
          description: >-
            Required. Google Cloud Storage bucket containing the source (see
            [Bucket Name
            Requirements](https://cloud.google.com/storage/docs/bucket-naming#requirements)).
          type: string
        generation:
          description: >-
            Optional. Google Cloud Storage generation for the object. If the
            generation is omitted, the latest generation will be used.
          format: int64
          type: string
        object:
          description: >-
            Required. Google Cloud Storage object containing the source. This
            object must be a gzipped archive file (`.tar.gz`) containing source
            to build.
          type: string
      type: object
    GoogleCloudRunV2SubmitBuildRequest:
      description: Request message for submitting a Build.
      id: GoogleCloudRunV2SubmitBuildRequest
      properties:
        buildpackBuild:
          $ref: '#/components/schemas/GoogleCloudRunV2BuildpacksBuild'
          description: Build the source using Buildpacks.
        client:
          description: Optional. The client that initiated the build request.
          type: string
        dockerBuild:
          $ref: '#/components/schemas/GoogleCloudRunV2DockerBuild'
          description: >-
            Build the source using Docker. This means the source has a
            Dockerfile.
        imageUri:
          description: Required. Artifact Registry URI to store the built image.
          type: string
        machineType:
          description: >-
            Optional. The machine type from default pool to use for the build.
            If left blank, cloudbuild will use a sensible default. Currently
            only E2_HIGHCPU_8 is supported. If worker_pool is set, this field
            will be ignored.
          type: string
        releaseTrack:
          description: >-
            Optional. The release track of the client that initiated the build
            request.
          enum:
            - LAUNCH_STAGE_UNSPECIFIED
            - UNIMPLEMENTED
            - PRELAUNCH
            - EARLY_ACCESS
            - ALPHA
            - BETA
            - GA
            - DEPRECATED
          enumDescriptions:
            - Do not use this default value.
            - The feature is not yet implemented. Users can not use it.
            - >-
              Prelaunch features are hidden from users and are only visible
              internally.
            - >-
              Early Access features are limited to a closed group of testers. To
              use these features, you must sign up in advance and sign a Trusted
              Tester agreement (which includes confidentiality provisions).
              These features may be unstable, changed in backward-incompatible
              ways, and are not guaranteed to be released.
            - >-
              Alpha is a limited availability test for releases before they are
              cleared for widespread use. By Alpha, all significant design
              issues are resolved and we are in the process of verifying
              functionality. Alpha customers need to apply for access, agree to
              applicable terms, and have their projects allowlisted. Alpha
              releases don't have to be feature complete, no SLAs are provided,
              and there are no technical support obligations, but they will be
              far enough along that customers can actually use them in test
              environments or for limited-use tests -- just like they would in
              normal production cases.
            - >-
              Beta is the point at which we are ready to open a release for any
              customer to use. There are no SLA or technical support obligations
              in a Beta release. Products will be complete from a feature
              perspective, but may have some open outstanding issues. Beta
              releases are suitable for limited production use cases.
            - >-
              GA features are open to all developers and are considered stable
              and fully qualified for production use.
            - >-
              Deprecated features are scheduled to be shut down and removed. For
              more information, see the "Deprecation Policy" section of our
              [Terms of Service](https://cloud.google.com/terms/) and the
              [Google Cloud Platform Subject to the Deprecation
              Policy](https://cloud.google.com/terms/deprecation) documentation.
          type: string
        serviceAccount:
          description: >-
            Optional. The service account to use for the build. If not set, the
            default Cloud Build service account for the project will be used.
          type: string
        storageSource:
          $ref: '#/components/schemas/GoogleCloudRunV2StorageSource'
          description: Required. Source for the build.
        tags:
          description: Optional. Additional tags to annotate the build.
          items:
            type: string
          type: array
        workerPool:
          description: >-
            Optional. Name of the Cloud Build Custom Worker Pool that should be
            used to build the function. The format of this field is
            `projects/{project}/locations/{region}/workerPools/{workerPool}`
            where `{project}` and `{region}` are the project id and region
            respectively where the worker pool is defined and `{workerPool}` is
            the short name of the worker pool.
          type: string
      type: object
    GoogleCloudRunV2SubmitBuildResponse:
      description: Response message for submitting a Build.
      id: GoogleCloudRunV2SubmitBuildResponse
      properties:
        baseImageUri:
          description: >-
            URI of the base builder image in Artifact Registry being used in the
            build. Used to opt into automatic base image updates.
          type: string
        baseImageWarning:
          description: Warning message for the base image.
          type: string
        buildOperation:
          $ref: '#/components/schemas/GoogleLongrunningOperation'
          description: Cloud Build operation to be polled via CloudBuild API.
      type: object
    GoogleCloudRunV2TCPSocketAction:
      description: TCPSocketAction describes an action based on opening a socket
      id: GoogleCloudRunV2TCPSocketAction
      properties:
        port:
          description: >-
            Optional. Port number to access on the container. Must be in the
            range 1 to 65535. If not specified, defaults to the exposed port of
            the container, which is the value of
            container.ports[0].containerPort.
          format: int32
          type: integer
      type: object
    GoogleCloudRunV2Task:
      description: Task represents a single run of a container to completion.
      id: GoogleCloudRunV2Task
      properties:
        annotations:
          additionalProperties:
            type: string
          description: >-
            Output only. Unstructured key value map that may be set by external
            tools to store and arbitrary metadata. They are not queryable and
            should be preserved when modifying objects.
          readOnly: true
          type: object
        completionTime:
          description: >-
            Output only. Represents time when the Task was completed. It is not
