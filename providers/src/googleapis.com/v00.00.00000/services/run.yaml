          type: string
      type: object
    GoogleCloudRunV2ExportStatusResponse:
      description: >-
        ExportStatusResponse contains the status of image export operation, with
        the status of each image export job.
      id: GoogleCloudRunV2ExportStatusResponse
      properties:
        imageExportStatuses:
          description: The status of each image export job.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2ImageExportStatus'
          type: array
        operationId:
          description: The operation id.
          type: string
        operationState:
          description: Output only. The state of the overall export operation.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - IN_PROGRESS
            - FINISHED
          enumDescriptions:
            - State unspecified.
            - Operation still in progress.
            - Operation finished.
          readOnly: true
          type: string
      type: object
    GoogleCloudRunV2GCSVolumeSource:
      description: >-
        Represents a volume backed by a Cloud Storage bucket using Cloud Storage
        FUSE.
      id: GoogleCloudRunV2GCSVolumeSource
      properties:
        bucket:
          description: Cloud Storage Bucket name.
          type: string
