    GoogleCloudRunV2GRPCAction:
      description: GRPCAction describes an action involving a GRPC port.
      id: GoogleCloudRunV2GRPCAction
      properties:
        port:
          description: >-
            Optional. Port number of the gRPC service. Number must be in the
