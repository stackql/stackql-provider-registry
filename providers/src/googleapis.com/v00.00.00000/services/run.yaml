          items:
            $ref: '#/components/schemas/GoogleCloudRunV2HTTPHeader'
          type: array
        path:
          description: Optional. Path to access on the HTTP server. Defaults to '/'.
          type: string
        port:
          description: >-
            Optional. Port number to access on the container. Must be in the
            range 1 to 65535. If not specified, defaults to the exposed port of
            the container, which is the value of
            container.ports[0].containerPort.
          format: int32
          type: integer
      type: object
    GoogleCloudRunV2HTTPHeader:
      description: HTTPHeader describes a custom header to be used in HTTP probes
