          type: object
        binaryAuthorization:
          $ref: '#/components/schemas/GoogleCloudRunV2BinaryAuthorization'
          description: Settings for the Binary Authorization feature.
        client:
          description: Arbitrary identifier for the API client.
          type: string
        clientVersion:
          description: Arbitrary version identifier for the API client.
          type: string
        conditions:
          description: >-
            Output only. The Conditions of all other associated sub-resources.
            They contain additional diagnostics information in case the Instance
            does not reach its Serving state. See comments in `reconciling` for
            additional information on reconciliation process in Cloud Run.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Condition'
          readOnly: true
          type: array
        containerStatuses:
          description: >-
            Output only. Status information for each of the specified
            containers. The status includes the resolved digest for specified
            images.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2ContainerStatus'
          readOnly: true
          type: array
        containers:
          description: >-
            Required. Holds the single container that defines the unit of
            execution for this Instance.
          items:
            $ref: '#/components/schemas/GoogleCloudRunV2Container'
          type: array
        createTime:
          description: Output only. The creation time.
          format: google-datetime
          readOnly: true
          type: string
        creator:
          description: Output only. Email address of the authenticated creator.
          readOnly: true
          type: string
        defaultUriDisabled:
          description: >-
            Optional. Disables public resolution of the default URI of this
            Instance.
          type: boolean
        deleteTime:
          description: Output only. The deletion time.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            User-provided description of the Instance. This field currently has
            a 512-character limit.
          type: string
        encryptionKey:
          description: >-
            A reference to a customer managed encryption key (CMEK) to use to
            encrypt this container image. For more information, go to
            https://cloud.google.com/run/docs/securing/using-cmek
          type: string
        encryptionKeyRevocationAction:
          description: The action to take if the encryption key is revoked.
          enum:
            - ENCRYPTION_KEY_REVOCATION_ACTION_UNSPECIFIED
            - PREVENT_NEW
            - SHUTDOWN
          enumDescriptions:
            - Unspecified
            - Prevents the creation of new instances.
            - Shuts down existing instances, and prevents creation of new ones.
          type: string
        encryptionKeyShutdownDuration:
          description: >-
            If `encryption_key_revocation_action` is `SHUTDOWN`, the duration
            before shutting down all instances. The minimum increment is 1 hour.
          format: google-duration
          type: string
        etag:
          description: >-
            Optional. A system-generated fingerprint for this version of the
            resource. May be used to detect modification conflict during
            updates.
          type: string
        expireTime:
          description: >-
            Output only. For a deleted resource, the time after which it will be
            permamently deleted.
          format: google-datetime
          readOnly: true
          type: string
        generation:
          description: >-
            Output only. A number that monotonically increases every time the
            user modifies the desired state. Please note that unlike v1, this is
