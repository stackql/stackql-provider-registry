            preserved when modifying objects. Cloud Run API v2 does not support
            annotations with `run.googleapis.com`, `cloud.googleapis.com`,
            `serving.knative.dev`, or `autoscaling.knative.dev` namespaces, and
            they will be rejected on new resources. All system annotations in v1
