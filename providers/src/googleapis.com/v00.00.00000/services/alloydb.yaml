    StorageDatabasecenterPartnerapiV1mainResourceMaintenanceSchedule:
      type: object
      id: StorageDatabasecenterPartnerapiV1mainResourceMaintenanceSchedule
      description: >-
        Maintenance window for the database resource. It specifies preferred
        time and day of the week and phase in some cases, when the maintenance
        can start. This is configured by the customer.
      properties:
        time:
          description: >-
            Optional. Preferred time to start the maintenance operation on the
            specified day.
          $ref: '#/components/schemas/GoogleTypeTimeOfDay'
        phase:
          type: string
          enum:
            - PHASE_UNSPECIFIED
            - ANY
            - WEEK1
            - WEEK2
            - WEEK5
          description: >-
            Optional. Phase of the maintenance window. This is to capture order
            of maintenance. For example, for Cloud SQL resources, this can be
            used to capture if the maintenance window is in Week1, Week2, Week5,
            etc. Non production resources are usually part of early phase. For
            more details, refer to Cloud SQL resources -
            https://cloud.google.com/sql/docs/mysql/maintenance
          enumDescriptions:
            - Phase is unspecified.
            - Any phase.
            - Week 1.
            - Week 2.
            - Week 5.
        day:
          enumDescriptions:
            - The day of the week is unspecified.
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          description: >-
            Optional. Preferred day of the week for maintenance, e.g. MONDAY,
            TUESDAY, etc.
          enum:
            - DAY_OF_WEEK_UNSPECIFIED
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          type: string
    BackupDrInfo:
      id: BackupDrInfo
      description: Information about BackupDR protection for this cluster.
      properties:
        currentWindow:
          description: >-
            The current BackupDR configuration for this cluster. If BackupDR
            protection is not enabled for this cluster, this field will be
            empty.
          $ref: '#/components/schemas/BackupDrEnabledWindow'
        previousWindows:
          items:
            $ref: '#/components/schemas/BackupDrEnabledWindow'
          description: >-
            Windows during which BackupDR was enabled for this cluster, along
            with associated configuration for that window. These are used to
            determine points-in-time for which restores can be performed. The
            windows are ordered with the most recent window last. Windows are
            mutally exclusive. Windows which closed more than 1 year ago will be
            removed from this list.
          type: array
      type: object
    StorageDatabasecenterPartnerapiV1mainRetentionSettings:
      id: StorageDatabasecenterPartnerapiV1mainRetentionSettings
      properties:
        retentionUnit:
