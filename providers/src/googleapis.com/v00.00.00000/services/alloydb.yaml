        nextAvailableMaintenanceVersions:
          items:
            type: string
          description: Optional. List of next available maintenance versions.
          type: array
        denyMaintenanceSchedules:
          description: Optional. List of Deny maintenance period for the database resource.
          items:
            $ref: >-
              #/components/schemas/StorageDatabasecenterPartnerapiV1mainResourceMaintenanceDenySchedule
          type: array
        maintenanceSchedule:
          description: Optional. Maintenance window for the database resource.
          $ref: >-
            #/components/schemas/StorageDatabasecenterPartnerapiV1mainResourceMaintenanceSchedule
        upcomingMaintenance:
          description: >-
            Optional. Upcoming maintenance for the database resource. This field
            is populated once SLM generates and publishes upcoming maintenance
            window.
          $ref: >-
            #/components/schemas/StorageDatabasecenterPartnerapiV1mainUpcomingMaintenance
        maintenanceVersion:
          description: >-
            Optional. Current Maintenance version of the database resource.
            Example: "MYSQL_8_0_41.R20250531.01_15"
          type: string
        isInstanceStopped:
          description: >-
            Optional. Whether the instance is in stopped state. This information
