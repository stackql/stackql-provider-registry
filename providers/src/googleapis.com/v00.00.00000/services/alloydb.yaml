      type: object
    WeeklySchedule:
      id: WeeklySchedule
      description: >-
        A weekly schedule starts a backup at prescribed start times within a
        day, for the specified days of the week. The weekly schedule message is
        flexible and can be used to create many types of schedules. For example,
        to have a daily backup that starts at 22:00, configure the `start_times`
        field to have one element "22:00" and the `days_of_week` field to have
        all seven days of the week.
      properties:
        startTimes:
          items:
            $ref: '#/components/schemas/GoogleTypeTimeOfDay'
          description: >-
            The times during the day to start a backup. The start times are
            assumed to be in UTC and to be an exact hour (e.g., 04:00:00). If no
            start times are provided, a single fixed start time is chosen
            arbitrarily.
          type: array
        daysOfWeek:
          type: array
          description: >-
            The days of the week to perform a backup. If this field is left
            empty, the default of every day of the week is used.
          items:
            enumDescriptions:
              - The day of the week is unspecified.
              - Monday
              - Tuesday
              - Wednesday
              - Thursday
              - Friday
              - Saturday
              - Sunday
            enum:
              - DAY_OF_WEEK_UNSPECIFIED
              - MONDAY
              - TUESDAY
              - WEDNESDAY
              - THURSDAY
              - FRIDAY
              - SATURDAY
              - SUNDAY
            type: string
      type: object
    EncryptionConfig:
      id: EncryptionConfig
      description: >-
        EncryptionConfig describes the encryption config of a cluster or a
        backup that is encrypted with a CMEK (customer-managed encryption key).
      properties:
        kmsKeyName:
          description: >-
            The fully-qualified resource name of the KMS key. Each Cloud KMS key
            is regionalized and has the following format:
            projects/[PROJECT]/locations/[REGION]/keyRings/[RING]/cryptoKeys/[KEY_NAME]
          type: string
      type: object
    StorageDatabasecenterPartnerapiV1mainBackupDRConfiguration:
      id: StorageDatabasecenterPartnerapiV1mainBackupDRConfiguration
      description: >-
        BackupDRConfiguration to capture the backup and disaster recovery
        details of database resource.
      properties:
        backupdrManaged:
          description: Indicates if the resource is managed by BackupDR.
          type: boolean
      type: object
    MaintenanceSchedule:
      id: MaintenanceSchedule
      description: >-
        MaintenanceSchedule stores the maintenance schedule generated from the
        MaintenanceUpdatePolicy, once a maintenance rollout is triggered, if
        MaintenanceWindow is set, and if there is no conflicting DenyPeriod. The
        schedule is cleared once the update takes place. This field cannot be
        manually changed; modify the MaintenanceUpdatePolicy instead.
      properties:
        startTime:
          description: Output only. The scheduled start time for the maintenance.
          readOnly: true
          type: string
          format: google-datetime
      type: object
    StorageDatabasecenterPartnerapiV1mainGCBDRConfiguration:
      id: StorageDatabasecenterPartnerapiV1mainGCBDRConfiguration
      description: GCBDR Configuration for the resource.
      properties:
        gcbdrManaged:
          description: Whether the resource is managed by GCBDR.
          type: boolean
      type: object
    QuantityBasedRetention:
      id: QuantityBasedRetention
      description: >-
        A quantity based policy specifies that a certain number of the most
        recent successful backups should be retained.
      properties:
        count:
          type: integer
          format: int32
          description: The number of backups to retain.
      type: object
    StorageDatabasecenterPartnerapiV1mainTags:
      id: StorageDatabasecenterPartnerapiV1mainTags
      description: >-
        Message type for storing tags. Tags provide a way to create annotations
        for resources, and in some cases conditionally allow or deny policies
        based on whether a resource has a specific tag.
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
          description: The Tag key/value mappings.
      type: object
    StorageDatabasecenterPartnerapiV1mainBackupConfiguration:
      type: object
      id: StorageDatabasecenterPartnerapiV1mainBackupConfiguration
      description: Configuration for automatic backups
      properties:
        automatedBackupEnabled:
          description: >-
            Whether customer visible automated backups are enabled on the
            instance.
          type: boolean
        backupRetentionSettings:
          description: Backup retention settings.
          $ref: >-
            #/components/schemas/StorageDatabasecenterPartnerapiV1mainRetentionSettings
        pointInTimeRecoveryEnabled:
          description: >-
            Whether point-in-time recovery is enabled. This is optional field,
            if the database service does not have this feature or metadata is
            not available in control plane, this can be omitted.
          type: boolean
    ListClustersResponse:
      type: object
      id: ListClustersResponse
      description: Message for response to listing Clusters
      properties:
        clusters:
          description: The list of Cluster
          items:
            $ref: '#/components/schemas/Cluster'
          type: array
        unreachable:
          items:
            type: string
          description: Locations that could not be reached.
          type: array
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
    ReadPoolInstancesUpgradeStageStatus:
      type: object
      id: ReadPoolInstancesUpgradeStageStatus
      description: Read pool instances upgrade specific status.
      properties:
        upgradeStats:
          description: Read pool instances upgrade statistics.
          $ref: '#/components/schemas/Stats'
    StorageDatabasecenterPartnerapiV1mainConfigBasedSignalData:
      id: StorageDatabasecenterPartnerapiV1mainConfigBasedSignalData
      description: >-
        Config based signal data. This is used to send signals to Condor which
        are based on the DB level configurations. These will be used to send
        signals for self managed databases.
      properties:
        lastRefreshTime:
          description: Required. Last time signal was refreshed
          type: string
          format: google-datetime
        signalType:
          type: string
          enum:
            - SIGNAL_TYPE_UNSPECIFIED
            - SIGNAL_TYPE_OUTDATED_MINOR_VERSION
            - SIGNAL_TYPE_DATABASE_AUDITING_DISABLED
            - SIGNAL_TYPE_NO_ROOT_PASSWORD
            - SIGNAL_TYPE_EXPOSED_TO_PUBLIC_ACCESS
            - SIGNAL_TYPE_UNENCRYPTED_CONNECTIONS
            - SIGNAL_TYPE_EXTENDED_SUPPORT
            - SIGNAL_TYPE_NO_AUTOMATED_BACKUP_POLICY
            - SIGNAL_TYPE_VERSION_NEARING_END_OF_LIFE
            - SIGNAL_TYPE_LAST_BACKUP_OLD
            - SIGNAL_TYPE_NOT_PROTECTED_BY_AUTOMATIC_FAILOVER
          description: Required. Signal type of the signal
          enumDescriptions:
            - Unspecified signal type.
            - Outdated Minor Version
            - Represents database auditing is disabled.
            - >-
              Represents if a database has a password configured for the root
              account or not.
            - Represents if a resource is exposed to public access.
            - >-
              Represents if a resources requires all incoming connections to use
              SSL or not.
            - Represents if a resource version is in extended support.
            - Represents if a resource has no automated backup policy.
            - Represents if a resource version is nearing end of life.
            - >-
              Represents if the last backup of a resource is older than 24
              hours.
            - Represents if a resource is not protected by automatic failover.
        fullResourceName:
          description: Required. Full Resource name of the source resource.
          type: string
        signalBoolValue:
          description: Signal data for boolean signals.
          type: boolean
        resourceId:
          description: Database resource id.
          $ref: >-
            #/components/schemas/StorageDatabasecenterPartnerapiV1mainDatabaseResourceId
      type: object
    FailoverInstanceRequest:
      id: FailoverInstanceRequest
      description: Message for triggering failover on an Instance
      properties:
        requestId:
          description: >-
            Optional. An optional request ID to identify requests. Specify a
            unique request ID so that if you must retry your request, the server
            ignores the request if it has already been completed. The server
            guarantees that for at least 60 minutes since the first request. For
            example, consider a situation where you make an initial request and
            the request times out. If you make the request again with the same
            request ID, the server can check if the original operation with the
            same request ID was received, and if so, ignores the second request.
            This prevents clients from accidentally creating duplicate
            commitments. The request ID must be a valid UUID with the exception
            that zero UUID is not supported
            (00000000-0000-0000-0000-000000000000).
          type: string
        validateOnly:
          description: >-
            Optional. If set, performs request validation, for example,
            permission checks and any other type of validation, but does not
            actually execute the create request.
          type: boolean
      type: object
    StorageDatabasecenterPartnerapiV1mainCustomMetadataData:
      type: object
      id: StorageDatabasecenterPartnerapiV1mainCustomMetadataData
      description: >-
        Any custom metadata associated with the resource. e.g. A spanner
        instance can have multiple databases with its own unique metadata.
        Information for these individual databases can be captured in custom
        metadata data
      properties:
        internalResourceMetadata:
          type: array
          description: >-
            Metadata for individual internal resources in an instance. e.g.
            spanner instance can have multiple databases with unique
            configuration.
          items:
            $ref: >-
              #/components/schemas/StorageDatabasecenterPartnerapiV1mainInternalResourceMetadata
    Instance:
      type: object
      id: Instance
      description: >-
        An Instance is a computing unit that an end customer can connect to.
        It's the main unit of computing resources in AlloyDB.
      properties:
        state:
          enum:
            - STATE_UNSPECIFIED
            - READY
            - STOPPED
            - CREATING
            - DELETING
            - MAINTENANCE
            - FAILED
            - BOOTSTRAPPING
            - PROMOTING
            - SWITCHOVER
            - STOPPING
            - STARTING
          type: string
          readOnly: true
          enumDescriptions:
            - The state of the instance is unknown.
            - The instance is active and running.
            - >-
              The instance is stopped. Instance name and IP resources are
              preserved.
            - The instance is being created.
            - The instance is being deleted.
            - The instance is down for maintenance.
            - >-
              The creation of the instance failed or a fatal error occurred
              during an operation on the instance. Note: Instances in this state
              would tried to be auto-repaired. And Customers should be able to
              restart, update or delete these instances.
            - >-
              The instance has been configured to sync data from some other
              source.
            - The instance is being promoted.
            - >-
              The instance has entered switchover state. All updates on instance
              are restricted while the instance is in this state.
            - The instance is being stopped.
            - The instance is being started.
          description: Output only. The current serving state of the instance.
        observabilityConfig:
          description: Configuration for observability.
          $ref: '#/components/schemas/ObservabilityInstanceConfig'
        labels:
          type: object
          description: Labels as key value pairs
          additionalProperties:
            type: string
        updateTime:
          description: Output only. Update time stamp
          readOnly: true
          type: string
          format: google-datetime
        nodes:
          items:
            $ref: '#/components/schemas/Node'
          description: >-
            Output only. List of available read-only VMs in this instance,
            including the standby for a PRIMARY instance.
          readOnly: true
          type: array
        ipAddress:
          description: >-
            Output only. The IP address for the Instance. This is the connection
            endpoint for an end-user application.
          readOnly: true
          type: string
        dataApiAccess:
          type: string
          enum:
            - DEFAULT_DATA_API_ENABLED_FOR_GOOGLE_CLOUD_SERVICES
            - DISABLED
            - ENABLED
          description: >-
            Optional. Controls whether the Data API is enabled for this
            instance. When enabled, this allows authorized users to connect to
            the instance from the public internet using the `executeSql` API,
            even for private IP instances. If this is not specified, the data
            API is enabled by default for Google internal services like AlloyDB
            Studio. Disable it explicitly to disallow Google internal services
            as well.
          enumDescriptions:
            - >-
              DEFAULT_DATA_API_ENABLED_FOR_GOOGLE_CLOUD_SERVICES is a default
              value that allows Google internal services like AlloyDB Studio to
              access the instance.
            - Data API access is disabled for this instance.
            - >-
              Data API access is enabled for this instance. For private IP
              instances, this allows authorized users to access the instance
              from the public internet using the ExecuteSql API.
        uid:
          type: string
          description: >-
            Output only. The system-generated UID of the resource. The UID is
            assigned when the resource is created, and it is retained until it
            is deleted.
          readOnly: true
        gceZone:
          description: >-
            The Compute Engine zone that the instance should serve from, per
            https://cloud.google.com/compute/docs/regions-zones This can ONLY be
            specified for ZONAL instances. If present for a REGIONAL instance,
            an error will be thrown. If this is absent for a ZONAL instance,
            instance is created in a random zone with available capacity.
          type: string
        etag:
          description: For Resource freshness validation (https://google.aip.dev/154)
          type: string
        maintenanceVersionName:
          description: >-
            Output only. Maintenance version of the instance, for example:
            POSTGRES_15.2025_07_15.04_00. Output only. Update this field via the
            parent cluster's maintenance_version field(s).
          readOnly: true
          type: string
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        availabilityType:
          enumDescriptions:
            - This is an unknown Availability type.
            - Zonal available instance.
            - Regional (or Highly) available instance.
          description: >-
            Availability type of an Instance. If empty, defaults to REGIONAL for
            primary instances. For read pools, availability_type is always
            UNSPECIFIED. Instances in the read pools are evenly distributed
            across available zones within the region (i.e. read pools with more
            than one node will have a node in at least two zones).
          enum:
            - AVAILABILITY_TYPE_UNSPECIFIED
            - ZONAL
            - REGIONAL
          type: string
        publicIpAddress:
          type: string
          description: >-
            Output only. The public IP addresses for the Instance. This is
            available ONLY when enable_public_ip is set. This is the connection
            endpoint for an end-user application.
          readOnly: true
        databaseFlags:
          additionalProperties:
            type: string
          description: >-
            Database flags. Set at the instance level. They are copied from the
            primary instance on secondary instance creation. Flags that have
            restrictions default to the value at primary instance on read
            instances during creation. Read instances can set new flags or
            override existing flags that are relevant for reads, for example,
            for enabling columnar cache on a read instance. Flags set on read
            instance might or might not be present on the primary instance. This
            is a list of "key": "value" pairs. "key": The name of the flag.
            These flags are passed at instance setup time, so include both
            server options and system variables for Postgres. Flags are
            specified with underscores, not hyphens. "value": The value of the
            flag. Booleans are set to **on** for true and **off** for false.
            This field must be omitted if the flag doesn't take a value.
          type: object
        annotations:
          type: object
          additionalProperties:
            type: string
          description: >-
            Annotations to allow client tools to store small amount of arbitrary
            data. This is distinct from labels. https://google.aip.dev/128
        pscInstanceConfig:
          description: >-
            Optional. The configuration for Private Service Connect (PSC) for
            the instance.
          $ref: '#/components/schemas/PscInstanceConfig'
        activationPolicy:
          type: string
          enum:
            - ACTIVATION_POLICY_UNSPECIFIED
            - ALWAYS
            - NEVER
          description: >-
            Optional. Specifies whether an instance needs to spin up. Once the
            instance is active, the activation policy can be updated to the
            `NEVER` to stop the instance. Likewise, the activation policy can be
            updated to `ALWAYS` to start the instance. There are restrictions
            around when an instance can/cannot be activated (for example, a read
            pool instance should be stopped before stopping primary etc.).
            Please refer to the API documentation for more details.
          enumDescriptions:
            - The policy is not specified.
            - The instance is running.
            - The instance is not running.
        outboundPublicIpAddresses:
          type: array
          description: >-
            Output only. All outbound public IP addresses configured for the
            instance.
          readOnly: true
          items:
            type: string
        instanceType:
          enum:
            - INSTANCE_TYPE_UNSPECIFIED
            - PRIMARY
            - READ_POOL
            - SECONDARY
          type: string
          enumDescriptions:
            - The type of the instance is unknown.
            - PRIMARY instances support read and write operations.
            - >-
              READ POOL instances support read operations only. Each read pool
              instance consists of one or more homogeneous nodes. * Read pool of
              size 1 can only have zonal availability. * Read pools with node
              count of 2 or more can have regional availability (nodes are
              present in 2 or more zones in a region).
            - >-
              SECONDARY instances support read operations only. SECONDARY
              instance is a cross-region read replica
          description: Required. The type of the instance. Specified at creation time.
        displayName:
          description: User-settable and human-readable display name for the Instance.
          type: string
        name:
          description: >-
            Output only. The name of the instance resource with the format: *
            projects/{project}/locations/{region}/clusters/{cluster_id}/instances/{instance_id}
            where the cluster and instance ID segments should satisfy the regex
            expression `[a-z]([a-z0-9-]{0,61}[a-z0-9])?`, e.g. 1-63 characters
            of lowercase letters, numbers, and dashes, starting with a letter,
            and ending with a letter or number. For more details see
            https://google.aip.dev/122. The prefix of the instance resource name
            is the name of the parent resource: *
            projects/{project}/locations/{region}/clusters/{cluster_id}
          readOnly: true
          type: string
        createTime:
          description: Output only. Create time stamp
          readOnly: true
          type: string
          format: google-datetime
        machineConfig:
          description: >-
            Configurations for the machines that host the underlying database
            engine.
          $ref: '#/components/schemas/MachineConfig'
        queryInsightsConfig:
          description: Configuration for query insights.
          $ref: '#/components/schemas/QueryInsightsInstanceConfig'
        reconciling:
          type: boolean
          description: >-
            Output only. Reconciling
            (https://google.aip.dev/128#reconciliation). Set to true if the
            current state of Instance does not match the user's intended state,
            and the service is actively updating the resource to reconcile them.
            This can happen due to user-triggered updates or system actions like
            failover or maintenance.
          readOnly: true
        readPoolConfig:
          description: >-
            Read pool instance configuration. This is required if the value of
            instanceType is READ_POOL.
          $ref: '#/components/schemas/ReadPoolConfig'
        connectionPoolConfig:
          description: Optional. The configuration for Managed Connection Pool (MCP).
          $ref: '#/components/schemas/ConnectionPoolConfig'
        clientConnectionConfig:
          description: Optional. Client connection specific configurations
          $ref: '#/components/schemas/ClientConnectionConfig'
        networkConfig:
          description: Optional. Instance-level network configuration.
          $ref: '#/components/schemas/InstanceNetworkConfig'
        writableNode:
          description: >-
            Output only. This is set for the read-write VM of the PRIMARY
            instance only.
          readOnly: true
          $ref: '#/components/schemas/Node'
        deleteTime:
          type: string
          format: google-datetime
          description: Output only. Delete time stamp
          readOnly: true
    PscInterfaceConfig:
      type: object
      id: PscInterfaceConfig
      description: >-
        Configuration for setting up a PSC interface to enable outbound
        connectivity.
      properties:
        networkAttachmentResource:
          description: >-
            The network attachment resource created in the consumer network to
            which the PSC interface will be linked. This is of the format:
            "projects/${CONSUMER_PROJECT}/regions/${REGION}/networkAttachments/${NETWORK_ATTACHMENT_NAME}".
            The network attachment must be in the same region as the instance.
          type: string
    StorageDatabasecenterPartnerapiV1mainResourceFlags:
      id: StorageDatabasecenterPartnerapiV1mainResourceFlags
      description: Message type for storing resource flags.
      properties:
        key:
          description: Optional. Key of the resource flag.
          type: string
        value:
          description: Optional. Value of the resource flag.
          type: string
      type: object
    TrialMetadata:
      type: object
      id: TrialMetadata
      description: Contains information and all metadata related to TRIAL clusters.
      properties:
        startTime:
          type: string
          format: google-datetime
          description: start time of the trial cluster.
        upgradeTime:
          description: Upgrade time of trial cluster to Standard cluster.
          type: string
          format: google-datetime
        graceEndTime:
          type: string
          format: google-datetime
          description: grace end time of the cluster.
        endTime:
          description: End time of the trial cluster.
          type: string
          format: google-datetime
    CsvExportOptions:
      id: CsvExportOptions
      description: Options for exporting data in CSV format.
      properties:
        selectQuery:
          description: Required. The SELECT query used to extract the data.
          type: string
        quoteCharacter:
          description: >-
            Optional. Specifies the quoting character to be used when a data
            value is quoted. The default is double-quote. The value of this
            argument has to be a character in Hex ASCII Code.
          type: string
        escapeCharacter:
          description: >-
            Optional. Specifies the character that should appear before a data
            character that needs to be escaped. The default is the same as quote
            character. The value of this argument has to be a character in Hex
            ASCII Code.
          type: string
        fieldDelimiter:
          description: >-
            Optional. Specifies the character that separates columns within each
            row (line) of the file. The default is comma. The value of this
            argument has to be a character in Hex ASCII Code.
          type: string
      type: object
    InjectFaultRequest:
      id: InjectFaultRequest
      description: Message for triggering fault injection on an instance
      properties:
        requestId:
          description: >-
            Optional. An optional request ID to identify requests. Specify a
            unique request ID so that if you must retry your request, the server
            ignores the request if it has already been completed. The server
            guarantees that for at least 60 minutes since the first request. For
            example, consider a situation where you make an initial request and
            the request times out. If you make the request again with the same
            request ID, the server can check if the original operation with the
            same request ID was received, and if so, ignores the second request.
            This prevents clients from accidentally creating duplicate
            commitments. The request ID must be a valid UUID with the exception
            that zero UUID is not supported
            (00000000-0000-0000-0000-000000000000).
          type: string
        validateOnly:
          description: >-
            Optional. If set, performs request validation, for example,
            permission checks and any other type of validation, but does not
            actually execute the create request.
          type: boolean
        faultType:
          enum:
            - FAULT_TYPE_UNSPECIFIED
            - STOP_VM
          type: string
          enumDescriptions:
            - The fault type is unknown.
            - Stop the VM
          description: Required. The type of fault to be injected in an instance.
      type: object
    GoogleTypeTimeOfDay:
      id: GoogleTypeTimeOfDay
      description: >-
        Represents a time of day. The date and time zone are either not
        significant or are specified elsewhere. An API may choose to allow leap
        seconds. Related types are google.type.Date and
        `google.protobuf.Timestamp`.
      properties:
        minutes:
          description: >-
            Minutes of an hour. Must be greater than or equal to 0 and less than
            or equal to 59.
          type: integer
          format: int32
        seconds:
          description: >-
            Seconds of a minute. Must be greater than or equal to 0 and
            typically must be less than or equal to 59. An API may allow the
            value 60 if it allows leap-seconds.
          type: integer
          format: int32
        hours:
          type: integer
          format: int32
          description: >-
            Hours of a day in 24 hour format. Must be greater than or equal to 0
            and typically must be less than or equal to 23. An API may choose to
            allow the value "24:00:00" for scenarios like business closing time.
        nanos:
          type: integer
          format: int32
          description: >-
            Fractions of seconds, in nanoseconds. Must be greater than or equal
            to 0 and less than or equal to 999,999,999.
      type: object
    ImportClusterRequest:
      id: ImportClusterRequest
      description: Import cluster request.
      properties:
        database:
          description: >-
            Optional. Name of the database to which the import will be done. For
            import from SQL file, this is required only if the file does not
            specify a database. Note - Value provided should be the same as
            expected from `SELECT current_database();` and NOT as a resource
            reference.
          type: string
        gcsUri:
          description: >-
            Required. The path to the file in Google Cloud Storage where the
            source file for import will be stored. The URI is in the form
            `gs://bucketName/fileName`.
          type: string
        user:
          description: >-
            Optional. Database user to be used for importing the data. Note -
            Value provided should be the same as expected from `SELECT
            current_user;` and NOT as a resource reference.
          type: string
        sqlImportOptions:
          description: Options for importing data in SQL format.
          $ref: '#/components/schemas/SqlImportOptions'
        csvImportOptions:
          description: Options for importing data in CSV format.
          $ref: '#/components/schemas/CsvImportOptions'
      type: object
    Stats:
      id: Stats
      description: Upgrade stats for read pool instances.
      properties:
        ongoing:
          description: Number of read pool instances undergoing upgrade.
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
          description: Number of read pool instances which failed to upgrade.
        notStarted:
          description: Number of read pool instances for which upgrade has not started.
          type: integer
          format: int32
        success:
          type: integer
          format: int32
          description: Number of read pool instances successfully upgraded.
      type: object
    ListOperationsResponse:
      type: object
      id: ListOperationsResponse
      description: The response message for Operations.ListOperations.
      properties:
        unreachable:
          items:
            type: string
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          type: array
        operations:
          type: array
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
        nextPageToken:
          description: The standard List next-page token.
          type: string
    StorageDatabasecenterPartnerapiV1mainEntitlement:
      id: StorageDatabasecenterPartnerapiV1mainEntitlement
      description: >-
        Proto representing the access that a user has to a specific
        feature/service. NextId: 3.
      properties:
        type:
          description: An enum that represents the type of this entitlement.
          enumDescriptions:
            - The entitlement type is unspecified.
            - >-
              The root entitlement representing Gemini package ownership.This
              will no longer be supported in the future.
            - >-
              The entitlement representing Native Tier, This will be the default
              Entitlement going forward with GCA Enablement.
            - The entitlement representing GCA-Standard Tier.
          type: string
          enumDeprecated:
            - false
            - true
            - false
            - false
          enum:
            - ENTITLEMENT_TYPE_UNSPECIFIED
            - GEMINI
            - NATIVE
            - GCA_STANDARD
        entitlementState:
          description: The current state of user's accessibility to a feature/benefit.
          enumDescriptions:
            - ''
            - >-
              User is entitled to a feature/benefit, but whether it has been
              successfully provisioned is decided by provisioning state.
            - >-
              User is entitled to a feature/benefit, but it was requested to be
              revoked. Whether the revoke has been successful is decided by
              provisioning state.
          type: string
          enum:
            - ENTITLEMENT_STATE_UNSPECIFIED
            - ENTITLED
            - REVOKED
      type: object
    StorageDatabasecenterPartnerapiV1mainMachineConfiguration:
      id: StorageDatabasecenterPartnerapiV1mainMachineConfiguration
      description: >-
        MachineConfiguration describes the configuration of a machine specific
        to Database Resource.
      properties:
        memorySizeInBytes:
          description: >-
            Memory size in bytes. TODO(b/342344482) add proto validations again
            after bug fix.
          type: string
          format: int64
        shardCount:
          description: Optional. Number of shards (if applicable).
          type: integer
          format: int32
        cpuCount:
          deprecated: true
          type: integer
          format: int32
          description: >-
            The number of CPUs. Deprecated. Use vcpu_count instead.
            TODO(b/342344482) add proto validations again after bug fix.
        maxReservationSlots:
          type: string
          format: int64
          description: >-
            Optional. Max slots for BigQuery Reservations. Max slots are in
            increments of 50.
        baselineSlots:
          type: string
          format: int64
          description: >-
            Optional. Baseline slots for BigQuery Reservations. Baseline slots
            are in increments of 50.
        vcpuCount:
          description: >-
            Optional. The number of vCPUs. TODO(b/342344482) add proto
            validations again after bug fix.
          type: number
          format: double
      type: object
    GoogleTypeDate:
      type: object
      id: GoogleTypeDate
      description: >-
        Represents a whole or partial calendar date, such as a birthday. The
        time of day and time zone are either specified elsewhere or are
        insignificant. The date is relative to the Gregorian Calendar. This can
        represent one of the following: * A full date, with non-zero year,
        month, and day values. * A month and day, with a zero year (for example,
        an anniversary). * A year on its own, with a zero month and a zero day.
        * A year and month, with a zero day (for example, a credit card
        expiration date). Related types: * google.type.TimeOfDay *
        google.type.DateTime * google.protobuf.Timestamp
      properties:
        day:
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0 to specify a year by itself or a year and month where
            the day isn't significant.
          type: integer
          format: int32
        month:
          type: integer
          format: int32
          description: >-
            Month of a year. Must be from 1 to 12, or 0 to specify a year
            without a month and day.
        year:
          type: integer
          format: int32
          description: >-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date
            without a year.
    PrimaryConfig:
      id: PrimaryConfig
      description: >-
        Configuration for the primary cluster. It has the list of clusters that
        are replicating from this cluster. This should be set if and only if the
        cluster is of type PRIMARY.
      properties:
        secondaryClusterNames:
          type: array
          description: >-
            Output only. Names of the clusters that are replicating from this
            cluster.
          readOnly: true
          items:
            type: string
      type: object
    Operation:
      id: Operation
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      properties:
        metadata:
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
        response:
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
      type: object
    StageInfo:
      type: object
      id: StageInfo
      description: Stage information for different stages in the upgrade process.
      properties:
        status:
          description: Status of the stage.
          enumDescriptions:
            - Unspecified status.
            - Not started.
            - In progress.
            - Operation succeeded.
            - Operation failed.
            - Operation partially succeeded.
            - Cancel is in progress.
            - Cancellation complete.
          type: string
          enum:
            - STATUS_UNSPECIFIED
            - NOT_STARTED
            - IN_PROGRESS
            - SUCCESS
            - FAILED
            - PARTIAL_SUCCESS
            - CANCEL_IN_PROGRESS
            - CANCELLED
        logsUrl:
          description: >-
            logs_url is the URL for the logs associated with a stage if that
            stage has logs. Right now, only three stages have logs:
            ALLOYDB_PRECHECK, PG_UPGRADE_CHECK, PRIMARY_INSTANCE_UPGRADE.
          type: string
        stage:
          type: string
          enum:
            - STAGE_UNSPECIFIED
            - ALLOYDB_PRECHECK
            - PG_UPGRADE_CHECK
            - PREPARE_FOR_UPGRADE
            - PRIMARY_INSTANCE_UPGRADE
            - READ_POOL_INSTANCES_UPGRADE
            - ROLLBACK
            - CLEANUP
          description: The stage.
          enumDescriptions:
            - Unspecified stage.
            - Pre-upgrade custom checks, not covered by pg_upgrade.
            - Pre-upgrade pg_upgrade checks.
            - Clone the original cluster.
            - Upgrade the primary instance(downtime).
            - This stage is read pool upgrade.
            - Rollback in case of critical failures.
            - Cleanup.
    RestartInstanceRequest:
      id: RestartInstanceRequest
      properties:
        nodeIds:
          items:
            type: string
          description: >-
            Optional. Full name of the nodes as obtained from INSTANCE_VIEW_FULL
            to restart upon. Applicable only to read instances.
          type: array
        requestId:
          description: >-
            Optional. An optional request ID to identify requests. Specify a
            unique request ID so that if you must retry your request, the server
            ignores the request if it has already been completed. The server
            guarantees that for at least 60 minutes since the first request. For
            example, consider a situation where you make an initial request and
            the request times out. If you make the request again with the same
            request ID, the server can check if the original operation with the
            same request ID was received, and if so, ignores the second request.
            This prevents clients from accidentally creating duplicate
            commitments. The request ID must be a valid UUID with the exception
            that zero UUID is not supported
            (00000000-0000-0000-0000-000000000000).
          type: string
        validateOnly:
          description: >-
            Optional. If set, performs request validation, for example,
            permission checks and any other type of validation, but does not
            actually execute the create request.
          type: boolean
      type: object
    DataplexConfig:
      type: object
      id: DataplexConfig
      description: Configuration for Dataplex integration.
      properties:
        enabled:
          description: >-
            Dataplex is enabled by default for resources such as clusters and
            instances. This flag controls the integration of AlloyDB PG
            resources (like databases, schemas, and tables) with Dataplex."
          type: boolean
