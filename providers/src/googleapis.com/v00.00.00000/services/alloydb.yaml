            - SECURITY_FINDING_DATA
            - RECOMMENDATION_SIGNAL_DATA
            - CONFIG_BASED_SIGNAL_DATA
            - BACKUPDR_METADATA
            - DATABASE_RESOURCE_SIGNAL_DATA
