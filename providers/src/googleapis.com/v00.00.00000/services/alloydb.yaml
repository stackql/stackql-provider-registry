          type: string
          format: google-datetime
        disabledTime:
          description: >-
            Time when the BackupDR protection for this cluster was disabled.
            This field will be empty if this BackupDR window is the
            `current_window`.
          type: string
          format: google-datetime
        logRetentionPeriod:
          type: string
          format: google-duration
          description: >-
            The retention period for logs generated by BackupDR for this
            cluster.
        backupPlanAssociation:
          description: >-
            The BackupPlanAssociation resource that was used to enable BackupDR
            protection for this cluster.
