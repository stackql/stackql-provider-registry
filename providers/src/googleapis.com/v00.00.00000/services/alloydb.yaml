          type: boolean
        trackWaitEvents:
          description: >-
            Track wait events during query execution for an instance. This flag
            is turned "on" by default but tracking is enabled only after
            observability enabled flag is also turned on.
          type: boolean
        maxQueryStringLength:
          description: Query string length. The default value is 10k.
          type: integer
          format: int32
        preserveComments:
          description: >-
            Preserve comments in query string for an instance. This flag is
            turned "off" by default.
          type: boolean
        queryPlansPerMinute:
          type: integer
          format: int32
          description: >-
            Number of query execution plans captured by Insights per minute for
            all queries combined. The default value is 200. Any integer between
            0 to 200 is considered valid.
        trackWaitEventTypes:
          type: boolean
          description: >-
            Output only. Track wait event types during query execution for an
            instance. This flag is turned "on" by default but tracking is
            enabled only after observability enabled flag is also turned on.
            This is read-only flag and only modifiable by internal API.
          readOnly: true
      type: object
    QuantityBasedExpiry:
      id: QuantityBasedExpiry
      description: >-
        A backup's position in a quantity-based retention queue, of backups with
        the same source cluster and type, with length, retention, specified by
        the backup's retention policy. Once the position is greater than the
        retention, the backup is eligible to be garbage collected. Example: 5
        backups from the same source cluster and type with a quantity-based
        retention of 3 and denoted by backup_id (position, retention). Safe:
        backup_5 (1, 3), backup_4, (2, 3), backup_3 (3, 3). Awaiting garbage
        collection: backup_2 (4, 3), backup_1 (5, 3)
      properties:
        retentionCount:
          description: >-
            Output only. The backup's position among its backups with the same
            source cluster and type, by descending chronological order create
            time(i.e. newest first).
          readOnly: true
          type: integer
          format: int32
        totalRetentionCount:
          description: >-
            Output only. The length of the quantity-based queue, specified by
            the backup's retention policy.
          readOnly: true
          type: integer
          format: int32
      type: object
