            - POOLER_NONE
            - POOLER_MACHINE_SIZED
            - POOLER_MANUAL_OVERRIDE
          type: string
          enumDescriptions:
            - The scaling type is not specified.
            - No pooler is enabled.
            - >-
              The number of poolers is automatically determined by the service
