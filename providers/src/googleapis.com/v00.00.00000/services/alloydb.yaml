          type: array
          description: >-
            Optional. A list of external network authorized to access this
            instance.
          items:
            $ref: '#/components/schemas/AuthorizedNetwork'
        enablePublicIp:
          description: Optional. Enabling public ip for the instance.
          type: boolean
        network:
          description: >-
            Output only. The resource link for the VPC network in which instance
            resources are created and from which they are accessible via Private
            IP. This will be the same value as the parent cluster's network. It
            is specified in the form: //
            `projects/{project_number}/global/networks/{network_id}`.
          readOnly: true
          type: string
        allocatedIpRangeOverride:
          description: >-
            Optional. Name of the allocated IP range for the private IP AlloyDB
            instance, for example: "google-managed-services-default". If set,
            the instance IPs will be created from this allocated range and will
            override the IP range used by the parent cluster. The range name
            must comply with [RFC
            1035](https://datatracker.ietf.org/doc/html/rfc1035). Specifically,
            the name must be 1-63 characters long and match the regular
            expression [a-z]([-a-z0-9]*[a-z0-9])?.
          type: string
        enableOutboundPublicIp:
          description: >-
            Optional. Enabling an outbound public IP address to support a
            database server sending requests out into the internet.
          type: boolean
      type: object
    ClusterUpgradeDetails:
      type: object
      id: ClusterUpgradeDetails
      description: Upgrade details of a cluster. This cluster can be primary or secondary.
      properties:
        upgradeStatus:
          description: Upgrade status of the cluster.
          enumDescriptions:
            - Unspecified status.
            - Not started.
            - In progress.
            - Operation succeeded.
            - Operation failed.
            - Operation partially succeeded.
            - Cancel is in progress.
            - Cancellation complete.
          type: string
          enum:
            - STATUS_UNSPECIFIED
            - NOT_STARTED
            - IN_PROGRESS
            - SUCCESS
            - FAILED
            - PARTIAL_SUCCESS
            - CANCEL_IN_PROGRESS
            - CANCELLED
        instanceUpgradeDetails:
          description: >-
            Upgrade details of the instances directly associated with this
            cluster.
          items:
            $ref: '#/components/schemas/InstanceUpgradeDetails'
          type: array
        stageInfo:
          items:
            $ref: '#/components/schemas/StageInfo'
          description: Array containing stage info associated with this cluster.
          type: array
        name:
          description: Normalized name of the cluster
          type: string
        clusterType:
          type: string
          enum:
            - CLUSTER_TYPE_UNSPECIFIED
            - PRIMARY
            - SECONDARY
          description: Cluster type which can either be primary or secondary.
          enumDescriptions:
            - The type of the cluster is unknown.
            - Primary cluster that support read and write operations.
            - >-
              Secondary cluster that is replicating from another region. This
              only supports read.
        databaseVersion:
          enumDescriptions:
            - This is an unknown database version.
            - DEPRECATED - The database version is Postgres 13.
            - The database version is Postgres 14.
            - The database version is Postgres 15.
            - The database version is Postgres 16.
            - The database version is Postgres 17.
            - The database version is Postgres 18.
          description: >-
            Database version of the cluster after the upgrade operation. This
            will be the target version if the upgrade was successful otherwise
            it remains the same as that before the upgrade operation.
          enumDeprecated:
            - false
            - true
            - false
            - false
            - false
            - false
            - false
          enum:
            - DATABASE_VERSION_UNSPECIFIED
            - POSTGRES_13
            - POSTGRES_14
            - POSTGRES_15
            - POSTGRES_16
            - POSTGRES_17
            - POSTGRES_18
          type: string
    DenyMaintenancePeriod:
      type: object
      id: DenyMaintenancePeriod
      description: >-
        DenyMaintenancePeriod definition. Excepting emergencies, maintenance
        will not be scheduled to start within this deny period. The start_date
        must be less than the end_date.
      properties:
        time:
          description: >-
            Time in UTC when the deny period starts on start_date and ends on
            end_date. This can be: * Full time OR * All zeros for 00:00:00 UTC
          $ref: '#/components/schemas/GoogleTypeTimeOfDay'
        startDate:
          description: >-
            Deny period start date. This can be: * A full date, with non-zero
            year, month and day values OR * A month and day value, with a zero
            year for recurring
          $ref: '#/components/schemas/GoogleTypeDate'
        endDate:
          description: >-
            Deny period end date. This can be: * A full date, with non-zero
            year, month and day values OR * A month and day value, with a zero
            year for recurring
          $ref: '#/components/schemas/GoogleTypeDate'
    PscAutoConnectionConfig:
      type: object
      id: PscAutoConnectionConfig
      description: >-
        Configuration for setting up PSC service automation. Consumer projects
        in the configs will be allowlisted automatically for the instance.
      properties:
        status:
          description: >-
            Output only. The status of the PSC service automation connection.
            Possible values: "STATE_UNSPECIFIED" - An invalid state as the
            default case. "ACTIVE" - The connection has been created
            successfully. "FAILED" - The connection is not functional since some
            resources on the connection fail to be created. "CREATING" - The
            connection is being created. "DELETING" - The connection is being
            deleted. "CREATE_REPAIRING" - The connection is being repaired to
            complete creation. "DELETE_REPAIRING" - The connection is being
            repaired to complete deletion.
          readOnly: true
          type: string
        ipAddress:
          type: string
          description: Output only. The IP address of the PSC service automation endpoint.
          readOnly: true
        consumerProject:
          description: >-
            The consumer project to which the PSC service automation endpoint
            will be created.
          type: string
        consumerNetwork:
          description: >-
            The consumer network for the PSC service automation, example:
            "projects/vpc-host-project/global/networks/default". The consumer
            network might be hosted a different project than the consumer
            project.
          type: string
        consumerNetworkStatus:
          type: string
          description: >-
            Output only. The status of the service connection policy. Possible
            values: "STATE_UNSPECIFIED" - Default state, when Connection Map is
            created initially. "VALID" - Set when policy and map configuration
            is valid, and their matching can lead to allowing creation of PSC
            Connections subject to other constraints like connections limit.
            "CONNECTION_POLICY_MISSING" - No Service Connection Policy found for
            this network and Service Class "POLICY_LIMIT_REACHED" - Service
            Connection Policy limit reached for this network and Service Class
            "CONSUMER_INSTANCE_PROJECT_NOT_ALLOWLISTED" - The consumer instance
            project is not in AllowedGoogleProducersResourceHierarchyLevels of
            the matching ServiceConnectionPolicy.
          readOnly: true
    Empty:
      type: object
      id: Empty
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      properties: {}
    PromoteClusterRequest:
      id: PromoteClusterRequest
      description: Message for promoting a Cluster
      properties:
        requestId:
          description: >-
            Optional. An optional request ID to identify requests. Specify a
            unique request ID so that if you must retry your request, the server
            ignores the request if it has already been completed. The server
            guarantees that for at least 60 minutes since the first request. For
            example, consider a situation where you make an initial request and
            the request times out. If you make the request again with the same
            request ID, the server can check if original operation with the same
            request ID was received, and if so, will ignore the second request.
            This prevents clients from accidentally creating duplicate
            commitments. The request ID must be a valid UUID with the exception
            that zero UUID is not supported
            (00000000-0000-0000-0000-000000000000).
          type: string
        etag:
          description: >-
            Optional. The current etag of the Cluster. If an etag is provided
            and does not match the current etag of the Cluster, deletion will be
            blocked and an ABORTED error will be returned.
          type: string
        validateOnly:
          description: >-
            Optional. If set, performs request validation, for example,
            permission checks and any other type of validation, but does not
            actually execute the create request.
          type: boolean
      type: object
    User:
      id: User
      description: Message describing User object.
      properties:
        userType:
          enumDescriptions:
            - Unspecified user type.
            - >-
              The default user type that authenticates via password-based
              authentication.
            - Database user that can authenticate via IAM-Based authentication.
          description: Optional. Type of this user.
          enum:
