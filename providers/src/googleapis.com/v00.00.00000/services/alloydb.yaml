    StorageDatabasecenterPartnerapiV1mainDatabaseResourceSignalData:
      type: object
      id: StorageDatabasecenterPartnerapiV1mainDatabaseResourceSignalData
      description: >-
        Database resource signal data. This is used to send signals to Condor
        which are based on the DB/Instance/Fleet level configurations. These
        will be used to send signals for all inventory types. Next ID: 10
      properties:
        location:
          description: Required. Resource location.
          type: string
        lastRefreshTime:
          type: string
          format: google-datetime
          description: Required. Last time signal was refreshed
        resourceId:
          description: Database resource id.
          $ref: >-
            #/components/schemas/StorageDatabasecenterPartnerapiV1mainDatabaseResourceId
        backupRun:
          deprecated: true
          description: 'Deprecated: Use signal_metadata_list instead.'
          $ref: '#/components/schemas/StorageDatabasecenterPartnerapiV1mainBackupRun'
        signalMetadataList:
          description: >-
            This will support array of OneOf signal metadata information for a
            given signal type.
          items:
            $ref: >-
              #/components/schemas/StorageDatabasecenterPartnerapiV1mainSignalMetadata
          type: array
        signalState:
          description: Required. Output only. Signal state of the signal
          enumDescriptions:
            - Unspecified signal state.
            - Signal is active and requires attention.
            - Signal is inactive and does not require attention.
            - >-
              Signal is dismissed by the user and should not be shown to the
              user again.
          type: string
          enum:
            - SIGNAL_STATE_UNSPECIFIED
            - ACTIVE
            - INACTIVE
            - DISMISSED
          readOnly: true
        fullResourceName:
          description: Required. Full Resource name of the source resource.
          type: string
        signalBoolValue:
          description: 'Deprecated: Use signal_metadata_list instead.'
          deprecated: true
          type: boolean
        signalType:
          enumDescriptions:
            - Unspecified signal type.
            - Outdated Minor Version
            - Represents database auditing is disabled.
            - >-
              Represents if a database has a password configured for the root
              account or not.
            - Represents if a resource is exposed to public access.
            - >-
              Represents if a resources requires all incoming connections to use
              SSL or not.
            - Represents if a resource version is in extended support.
            - Represents if a resource has no automated backup policy.
            - Represents if a resource version is nearing end of life.
            - >-
              Represents if the last backup of a resource is older than 24
              hours.
            - Represents if a resource is not protected by automatic failover.
          description: Required. Signal type of the signal
          enum:
            - SIGNAL_TYPE_UNSPECIFIED
            - SIGNAL_TYPE_OUTDATED_MINOR_VERSION
            - SIGNAL_TYPE_DATABASE_AUDITING_DISABLED
            - SIGNAL_TYPE_NO_ROOT_PASSWORD
            - SIGNAL_TYPE_EXPOSED_TO_PUBLIC_ACCESS
            - SIGNAL_TYPE_UNENCRYPTED_CONNECTIONS
            - SIGNAL_TYPE_EXTENDED_SUPPORT
            - SIGNAL_TYPE_NO_AUTOMATED_BACKUP_POLICY
            - SIGNAL_TYPE_VERSION_NEARING_END_OF_LIFE
            - SIGNAL_TYPE_LAST_BACKUP_OLD
            - SIGNAL_TYPE_NOT_PROTECTED_BY_AUTOMATIC_FAILOVER
          type: string
