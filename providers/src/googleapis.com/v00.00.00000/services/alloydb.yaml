          description: >-
            Observability feature status for an instance. This flag is turned
            "off" by default.
          type: boolean
        trackActiveQueries:
          description: >-
            Track actively running queries on the instance. If not set, this
            flag is "off" by default.
          type: boolean
        recordApplicationTags:
          description: >-
            Record application tags for an instance. This flag is turned "off"
