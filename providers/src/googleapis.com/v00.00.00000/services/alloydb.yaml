        observabilityMetricData:
          description: Observability metric data.
          $ref: >-
            #/components/schemas/StorageDatabasecenterPartnerapiV1mainObservabilityMetricData
        backupdrMetadata:
          description: BackupDR metadata is used to ingest metadata from BackupDR.
          $ref: >-
            #/components/schemas/StorageDatabasecenterPartnerapiV1mainBackupDRMetadata
        configBasedSignalData:
          description: >-
            Config based signal data is used to ingest signals that are
