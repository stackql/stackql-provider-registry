      description: Salesforce field.
      id: SalesforceField
      properties:
        dataType:
          description: The data type.
          type: string
        name:
          description: The field name.
          type: string
        nillable:
          description: Indicates whether the field can accept nil values.
          type: boolean
      type: object
    SalesforceMarketingCloudProfile:
      description: Profile for connecting to a Salesforce Marketing Cloud source.
      id: SalesforceMarketingCloudProfile
      properties:
        oauthClientCredentials:
          $ref: '#/components/schemas/OauthClientCredentials'
          description: >-
            Required. Input only. Credentials for authenticating with the
            Salesforce Marketing Cloud API.
        subdomain:
          description: >-
            Required. Subdomain for the Salesforce Marketing Cloud connection.
            Example: if your specific endpoint is
            `https://{your-specific-subdomain}.rest.marketingcloudapis.com/`,
            the subdomain is `{your-specific-subdomain}`. Must be 1-63
            characters, start and end with an alphanumeric character, and
            contain only lowercase letters, numbers, and hyphens (-).
          type: string
      type: object
    SalesforceMarketingCloudSourceConfig:
      description: Configuration for syncing data from a Salesforce Marketing Cloud source.
      id: SalesforceMarketingCloudSourceConfig
      properties:
        excludeObjects:
          $ref: '#/components/schemas/SourceCatalog'
          description: Optional. The objects to exclude from the stream.
        fullRefreshPollingInterval:
          description: >-
            Required. Specifies the polling interval for a full refresh of
            objects that do not support incremental sync. If not set, a default
            value of 24 hours is used. The duration must be between 1 and 24
            hours, inclusive.
          format: google-duration
          type: string
        includeObjects:
          $ref: '#/components/schemas/SourceCatalog'
          description: Optional. The objects to retrieve from the source.
        pollingInterval:
          description: >-
            Required. Incremental sync polling interval for all objects. If not
            set, a default value of `5 minutes` is used. The duration must be
            from `5 minutes` to `24 hours`, inclusive.
          format: google-duration
          type: string
      type: object
    SalesforceObject:
      description: Salesforce object.
      id: SalesforceObject
      properties:
        fields:
          description: >-
            Salesforce fields. When unspecified as part of include objects,
            includes everything, when unspecified as part of exclude objects,
            excludes nothing.
          items:
            $ref: '#/components/schemas/SalesforceField'
          type: array
        objectName:
          description: The object name.
          type: string
      type: object
    SalesforceObjectIdentifier:
      description: Salesforce data source object identifier.
      id: SalesforceObjectIdentifier
      properties:
        objectName:
          description: Required. The object name.
          type: string
      type: object
    SalesforceOrg:
      description: Salesforce organization structure.
      id: SalesforceOrg
      properties:
        objects:
          description: Salesforce objects in the database server.
          items:
            $ref: '#/components/schemas/SalesforceObject'
          type: array
      type: object
    SalesforceProfile:
      description: Profile for connecting to a Salesforce source.
      id: SalesforceProfile
      properties:
        domain:
          description: Required. Domain endpoint for the Salesforce connection.
          type: string
        oauth2ClientCredentials:
          $ref: '#/components/schemas/Oauth2ClientCredentials'
          description: Connected app authentication.
        userCredentials:
          $ref: '#/components/schemas/UserCredentials'
          deprecated: true
          description: >-
            Deprecated: Salesforce is retiring Username-Password authentication.
            Use `oauth2_client_credentials` instead.
      type: object
    SalesforceSourceConfig:
      description: Configuration for syncing data from a Salesforce source.
      id: SalesforceSourceConfig
      properties:
        excludeObjects:
          $ref: '#/components/schemas/SalesforceOrg'
          description: The Salesforce objects to exclude from the stream.
        includeObjects:
          $ref: '#/components/schemas/SalesforceOrg'
          description: The Salesforce objects to retrieve from the source.
        pollingInterval:
          description: >-
            Required. Salesforce objects polling interval. The interval at which
            new changes will be polled for each object. The duration must be
            from `5 minutes` to `24 hours`, inclusive.
          format: google-duration
          type: string
      type: object
    Secret:
      description: >-
        A confidential piece of information where the actual value is either
        directly specified in the message as a raw string or stored in GCP
        secret manager.
      id: Secret
      properties:
        rawValue:
          description: >-
            Optional. Input only. The actual raw value of the secret as plain
            text.
          type: string
        secretVersion:
          description: >-
            Optional. A Secret Manager resource name storing the actual value of
            the secret. Supported formats: *
            projects/{project}/locations/{location}/secrets/{secret}/versions/{version}
            * projects/{project}/secrets/{secret}/versions/{version}
          type: string
      type: object
    ServerAndClientVerification:
      description: >-
        Message represents the option where Datastream will enforce the
        encryption and authenticate the server identity as well as the client
        identity. ca_certificate, client_certificate and client_key must be set
        if user selects this option.
      id: ServerAndClientVerification
      properties:
        caCertificate:
          description: Required. Input only. PEM-encoded server root CA certificate.
          type: string
        clientCertificate:
          description: >-
            Required. Input only. PEM-encoded certificate used by the source
            database to authenticate the client identity (i.e., the Datastream's
            identity). This certificate is signed by either a root certificate
            trusted by the server or one or more intermediate certificates
            (which is stored with the leaf certificate) to link the this
            certificate to the trusted root certificate.
          type: string
        clientKey:
          description: >-
            Optional. Input only. PEM-encoded private key associated with the
            client certificate. This value will be used during the SSL/TLS
            handshake, allowing the PostgreSQL server to authenticate the
            client's identity, i.e. identity of the Datastream.
          type: string
        serverCertificateHostname:
          description: >-
            Optional. The hostname mentioned in the Subject or SAN extension of
            the server certificate. If this field is not provided, the hostname
            in the server certificate is not validated.
          type: string
      type: object
    ServerVerification:
      description: >-
        Message represents the option where Datastream will enforce the
        encryption and authenticate the server identity. ca_certificate must be
        set if user selects this option.
      id: ServerVerification
      properties:
        caCertificate:
          description: Required. Input only. PEM-encoded server root CA certificate.
          type: string
        serverCertificateHostname:
          description: >-
            Optional. The hostname mentioned in the Subject or SAN extension of
            the server certificate. If this field is not provided, the hostname
            in the server certificate is not validated.
          type: string
      type: object
    ServiceNowProfile:
      description: Profile for connecting to a ServiceNow source.
      id: ServiceNowProfile
      properties:
        instance:
          description: >-
            Required. The instance of the ServiceNow account. This is the ``
            part of the URL `https://.service-now.com`.
          type: string
        oauthClientCredentials:
          $ref: '#/components/schemas/OauthClientCredentials'
          description: Credentials for authenticating with the ServiceNow API.
        userPasswordCredentials:
          $ref: '#/components/schemas/UserPasswordCredentials'
          description: User-password authentication.
      type: object
    ServiceNowSourceConfig:
      description: Configuration for syncing data from a ServiceNow source.
      id: ServiceNowSourceConfig
      properties:
        excludeObjects:
          $ref: '#/components/schemas/SourceCatalog'
          description: Optional. The objects to exclude from the stream.
        includeObjects:
          $ref: '#/components/schemas/SourceCatalog'
          description: Optional. The objects to retrieve from the source.
        pollingInterval:
          description: >-
            Required. Incremental sync polling interval for all objects. If not
            set, a default value of `5 minutes` is used. The duration must be
            from `5 minutes` to `24 hours`, inclusive.
          format: google-duration
          type: string
      type: object
    SingleTargetDataset:
      description: A single target dataset to which all data will be streamed.
      id: SingleTargetDataset
      properties:
        datasetId:
          description: >-
            The dataset ID of the target dataset. DatasetIds allowed characters:
            https://cloud.google.com/bigquery/docs/reference/rest/v2/datasets#datasetreference.
          type: string
      type: object
    SourceCatalog:
      description: Source catalog.
      id: SourceCatalog
      properties:
        objects:
          description: Optional. Source objects in the catalog.
          items:
            $ref: '#/components/schemas/SourceObject'
          type: array
      type: object
    SourceConfig:
      description: The configuration of the stream source.
      id: SourceConfig
      properties:
        dataverseSourceConfig:
          $ref: '#/components/schemas/DataverseSourceConfig'
          description: Dataverse data source configuration.
        mongodbSourceConfig:
          $ref: '#/components/schemas/MongodbSourceConfig'
          description: MongoDB data source configuration.
        mysqlSourceConfig:
          $ref: '#/components/schemas/MysqlSourceConfig'
          description: MySQL data source configuration.
        oracleSourceConfig:
          $ref: '#/components/schemas/OracleSourceConfig'
          description: Oracle data source configuration.
        postgresqlSourceConfig:
          $ref: '#/components/schemas/PostgresqlSourceConfig'
          description: PostgreSQL data source configuration.
        salesforceMarketingCloudSourceConfig:
          $ref: '#/components/schemas/SalesforceMarketingCloudSourceConfig'
          description: Salesforce Marketing Cloud data source configuration.
        salesforceSourceConfig:
          $ref: '#/components/schemas/SalesforceSourceConfig'
          description: Salesforce data source configuration.
        serviceNowSourceConfig:
          $ref: '#/components/schemas/ServiceNowSourceConfig'
          description: ServiceNow data source configuration.
        sourceConnectionProfile:
          description: >-
            Required. Source connection profile resource. Format:
            `projects/{project}/locations/{location}/connectionProfiles/{name}`
          type: string
        spannerSourceConfig:
          $ref: '#/components/schemas/SpannerSourceConfig'
          description: Spanner data source configuration.
        sqlServerSourceConfig:
          $ref: '#/components/schemas/SqlServerSourceConfig'
          description: SQLServer data source configuration.
        workdaySourceConfig:
          $ref: '#/components/schemas/WorkdaySourceConfig'
          description: Optional. Workday data source configuration.
      type: object
    SourceHierarchyDatasets:
      description: >-
        Destination datasets are created so that hierarchy of the destination
        data objects matches the source hierarchy.
      id: SourceHierarchyDatasets
      properties:
        datasetTemplate:
          $ref: '#/components/schemas/DatasetTemplate'
          description: The dataset template to use for dynamic dataset creation.
        projectId:
          description: >-
            Optional. The project id of the BigQuery dataset. If not specified,
            the project will be inferred from the stream resource.
          type: string
      type: object
    SourceObject:
      description: Source object.
      id: SourceObject
      properties:
        objectName:
          description: Required. The object name.
          type: string
        properties:
          description: >-
            Optional. Source properties. When unspecified as part of include
            objects, includes everything, when unspecified as part of exclude
            objects, excludes nothing.
          items:
            $ref: '#/components/schemas/SourceProperty'
          type: array
      type: object
    SourceObjectIdentifier:
      description: Represents an identifier of an object in the data source.
      id: SourceObjectIdentifier
      properties:
        mongodbIdentifier:
          $ref: '#/components/schemas/MongodbObjectIdentifier'
          description: MongoDB data source object identifier.
        mysqlIdentifier:
          $ref: '#/components/schemas/MysqlObjectIdentifier'
          description: Mysql data source object identifier.
        oracleIdentifier:
          $ref: '#/components/schemas/OracleObjectIdentifier'
          description: Oracle data source object identifier.
        postgresqlIdentifier:
          $ref: '#/components/schemas/PostgresqlObjectIdentifier'
          description: PostgreSQL data source object identifier.
        salesforceIdentifier:
          $ref: '#/components/schemas/SalesforceObjectIdentifier'
          description: Salesforce data source object identifier.
        spannerIdentifier:
          $ref: '#/components/schemas/SpannerObjectIdentifier'
          description: Spanner data source object identifier.
        sqlServerIdentifier:
          $ref: '#/components/schemas/SqlServerObjectIdentifier'
          description: SQLServer data source object identifier.
      type: object
    SourceProperty:
      description: Source property.
      id: SourceProperty
      properties:
        primaryKey:
          description: Optional. Whether or not the property is a primary key.
          type: boolean
        properties:
          description: >-
            Optional. Source properties. When specified, it means that the
            current property contains nested properties of its own. When
            unspecified as part of include objects, includes everything, when
            unspecified as part of exclude objects, excludes nothing.
          items:
            $ref: '#/components/schemas/SourceProperty'
          type: array
        propertyName:
          description: Required. The property name.
          type: string
      type: object
    SpannerChangeStreamPosition:
      description: >-
        Represents a position in a Spanner change stream from which to start
        replicating.
      id: SpannerChangeStreamPosition
      properties:
        startTime:
          description: >-
            Required. The timestamp to start change stream queries from. The
            timestamp must be a positive value.
          format: google-datetime
          type: string
      type: object
    SpannerColumn:
      description: Spanner column.
      id: SpannerColumn
      properties:
        column:
          description: Required. The column name.
          type: string
        dataType:
          description: Optional. Spanner data type.
          type: string
        isPrimaryKey:
          description: Optional. Whether or not the column is a primary key.
          type: boolean
        ordinalPosition:
          description: Optional. The ordinal position of the column in the table.
          format: int64
          type: string
      type: object
    SpannerDatabase:
      description: Spanner database structure.
      id: SpannerDatabase
      properties:
        schemas:
          description: Optional. Spanner schemas in the database.
          items:
            $ref: '#/components/schemas/SpannerSchema'
          type: array
      type: object
    SpannerObjectIdentifier:
      description: Spanner data source object identifier.
      id: SpannerObjectIdentifier
      properties:
        schema:
          description: Optional. The schema name.
          type: string
        table:
          description: Required. The table name.
          type: string
      type: object
    SpannerProfile:
      description: Profile for connecting to a Spanner source.
      id: SpannerProfile
      properties:
        database:
          description: >-
            Required. Immutable. Cloud Spanner database resource. This field is
            immutable. Must be in the format:
            projects/{project}/instances/{instance}/databases/{database_id}.
          type: string
        host:
          description: >-
            Optional. The Spanner endpoint to connect to. Defaults to the global
            endpoint (https://spanner.googleapis.com). Must be in the format:
            https://spanner.{region}.rep.googleapis.com.
          type: string
      type: object
    SpannerSchema:
      description: Spanner schema.
      id: SpannerSchema
      properties:
        schema:
          description: Required. The schema name.
          type: string
        tables:
          description: Optional. Spanner tables in the schema.
          items:
            $ref: '#/components/schemas/SpannerTable'
          type: array
      type: object
    SpannerSourceConfig:
      description: Configuration for syncing data from a Spanner source.
      id: SpannerSourceConfig
      properties:
        backfillDataBoostEnabled:
          description: >-
            Optional. Whether to use Data Boost for Spanner backfills. Defaults
            to false if not set.
          type: boolean
        changeStreamName:
          description: Required. Immutable. The change stream name to use for the stream.
          type: string
        excludeObjects:
          $ref: '#/components/schemas/SpannerDatabase'
          description: >-
            Optional. The Spanner objects to avoid retrieving. If some objects
            are both included and excluded, an error will be thrown.
        fgacRole:
          description: Optional. The FGAC role to use for the stream.
          type: string
        includeObjects:
          $ref: '#/components/schemas/SpannerDatabase'
          description: >-
            Optional. The Spanner objects to retrieve from the data source. If
            some objects are both included and excluded, an error will be
            thrown.
        maxConcurrentBackfillTasks:
          description: Optional. Maximum number of concurrent backfill tasks.
          format: int32
          type: integer
        maxConcurrentCdcTasks:
          description: Optional. Maximum number of concurrent CDC tasks.
          format: int32
          type: integer
        spannerRpcPriority:
          description: Optional. The RPC priority to use for the stream.
          enum:
            - SPANNER_RPC_PRIORITY_UNSPECIFIED
            - LOW
            - MEDIUM
            - HIGH
          enumDescriptions:
            - Unspecified RPC priority.
            - Low RPC priority.
            - Medium RPC priority.
            - High RPC priority.
          type: string
      type: object
    SpannerTable:
      description: Spanner table.
      id: SpannerTable
      properties:
        columns:
          description: Optional. Spanner columns in the table.
          items:
            $ref: '#/components/schemas/SpannerColumn'
          type: array
        table:
          description: Required. The table name.
          type: string
      type: object
    SpecificStartPosition:
      description: >-
        CDC strategy to start replicating from a specific position in the
        source.
      id: SpecificStartPosition
      properties:
        mongodbChangeStreamPosition:
          $ref: '#/components/schemas/MongodbChangeStreamPosition'
          description: MongoDB change stream position to start replicating from.
        mysqlGtidPosition:
          $ref: '#/components/schemas/MysqlGtidPosition'
          description: MySQL GTID set to start replicating from.
        mysqlLogPosition:
          $ref: '#/components/schemas/MysqlLogPosition'
          description: MySQL specific log position to start replicating from.
        oracleScnPosition:
          $ref: '#/components/schemas/OracleScnPosition'
          description: Oracle SCN to start replicating from.
        spannerChangeStreamPosition:
          $ref: '#/components/schemas/SpannerChangeStreamPosition'
          description: Optional. Spanner change stream position to start replicating from.
        sqlServerLsnPosition:
          $ref: '#/components/schemas/SqlServerLsnPosition'
          description: SqlServer LSN to start replicating from.
      type: object
    SqlServerChangeTables:
      description: Configuration to use Change Tables CDC read method.
      id: SqlServerChangeTables
      properties: {}
      type: object
    SqlServerColumn:
      description: SQLServer Column.
      id: SqlServerColumn
      properties:
        column:
          description: The column name.
          type: string
        dataType:
          description: The SQLServer data type.
          type: string
        length:
          description: Column length.
          format: int32
          type: integer
        nullable:
          description: Whether or not the column can accept a null value.
          type: boolean
        ordinalPosition:
          description: The ordinal position of the column in the table.
          format: int32
          type: integer
        precision:
          description: Column precision.
          format: int32
          type: integer
        primaryKey:
          description: Whether or not the column represents a primary key.
          type: boolean
        scale:
          description: Column scale.
          format: int32
          type: integer
      type: object
    SqlServerLsnPosition:
      description: SQL Server LSN position
      id: SqlServerLsnPosition
      properties:
        lsn:
          description: Required. Log sequence number (LSN) from where Logs will be read
          type: string
      type: object
    SqlServerObjectIdentifier:
      description: SQLServer data source object identifier.
      id: SqlServerObjectIdentifier
      properties:
        schema:
          description: Required. The schema name.
          type: string
        table:
          description: Required. The table name.
          type: string
      type: object
    SqlServerProfile:
      description: Profile for connecting to a SQLServer source.
      id: SqlServerProfile
      properties:
        database:
          description: Required. Database for the SQLServer connection.
          type: string
        hostname:
          description: Required. Hostname for the SQLServer connection.
          type: string
        password:
          description: >-
            Optional. Password for the SQLServer connection. Mutually exclusive
            with the `secret_manager_stored_password` field.
          type: string
        port:
          description: Port for the SQLServer connection, default value is 1433.
          format: int32
          type: integer
        secretManagerStoredPassword:
          description: >-
            Optional. A reference to a Secret Manager resource name storing the
            SQLServer connection password. Mutually exclusive with the
            `password` field.
          type: string
        sslConfig:
          $ref: '#/components/schemas/SqlServerSslConfig'
          description: Optional. SSL configuration for the SQLServer connection.
        username:
          description: Required. Username for the SQLServer connection.
          type: string
      type: object
    SqlServerRdbms:
      description: SQLServer database structure.
      id: SqlServerRdbms
      properties:
        schemas:
          description: SQLServer schemas in the database server.
          items:
            $ref: '#/components/schemas/SqlServerSchema'
          type: array
      type: object
    SqlServerSchema:
      description: SQLServer schema.
      id: SqlServerSchema
      properties:
        schema:
          description: The schema name.
          type: string
        tables:
          description: Tables in the schema.
          items:
            $ref: '#/components/schemas/SqlServerTable'
          type: array
      type: object
    SqlServerSourceConfig:
      description: Configuration for syncing data from a SQLServer source.
      id: SqlServerSourceConfig
      properties:
        changeTables:
          $ref: '#/components/schemas/SqlServerChangeTables'
          description: CDC reader reads from change tables.
        excludeObjects:
          $ref: '#/components/schemas/SqlServerRdbms'
          description: The SQLServer objects to exclude from the stream.
        includeObjects:
          $ref: '#/components/schemas/SqlServerRdbms'
          description: The SQLServer objects to include in the stream.
        maxConcurrentBackfillTasks:
          description: Max concurrent backfill tasks.
          format: int32
          type: integer
        maxConcurrentCdcTasks:
          description: Max concurrent CDC tasks.
          format: int32
          type: integer
        transactionLogs:
          $ref: '#/components/schemas/SqlServerTransactionLogs'
          description: CDC reader reads from transaction logs.
      type: object
    SqlServerSslConfig:
      description: SQL Server SSL configuration information.
      id: SqlServerSslConfig
      properties:
        basicEncryption:
          $ref: '#/components/schemas/BasicEncryption'
          description: >-
            If set, Datastream will enforce encryption without authenticating
            server identity. Server certificates will be trusted by default.
        encryptionAndServerValidation:
          $ref: '#/components/schemas/EncryptionAndServerValidation'
          description: >-
            If set, Datastream will enforce encryption and authenticate server
            identity.
        encryptionNotEnforced:
          $ref: '#/components/schemas/EncryptionNotEnforced'
          description: >-
            If set, Datastream will not enforce encryption. If the DB server
            mandates encryption, then connection will be encrypted but server
            identity will not be authenticated.
      type: object
    SqlServerTable:
      description: SQLServer table.
      id: SqlServerTable
      properties:
        columns:
          description: >-
            SQLServer columns in the schema. When unspecified as part of
            include/exclude objects, includes/excludes everything.
          items:
            $ref: '#/components/schemas/SqlServerColumn'
          type: array
        table:
          description: The table name.
          type: string
      type: object
    SqlServerTransactionLogs:
      description: Configuration to use Transaction Logs CDC read method.
      id: SqlServerTransactionLogs
      properties: {}
      type: object
    SrvConnectionFormat:
      description: Srv connection format.
      id: SrvConnectionFormat
      properties: {}
      type: object
    StandardConnectionFormat:
      description: Standard connection format.
      id: StandardConnectionFormat
      properties:
        directConnection:
          deprecated: true
          description: >-
            Optional. Deprecated: Use the `additional_options` map to specify
            the `directConnection` parameter instead. For example:
            `additional_options = {"directConnection": "true"}`. Specifies
            whether the client connects directly to the host[:port] in the
            connection URI.
          type: boolean
      type: object
    StartBackfillJobRequest:
      description: >-
        Request for manually initiating a backfill job for a specific stream
        object.
      id: StartBackfillJobRequest
      properties:
        eventFilter:
          $ref: '#/components/schemas/EventFilter'
          description: >-
            Optional. Optional event filter. If not set, or empty, the backfill
            will be performed on the entire object. This is currently used for
            partial backfill and only supported for SQL sources.
      type: object
    StartBackfillJobResponse:
      description: >-
        Response for manually initiating a backfill job for a specific stream
        object.
      id: StartBackfillJobResponse
      properties:
        object:
          $ref: '#/components/schemas/StreamObject'
          description: The stream object resource a backfill job was started for.
      type: object
    StaticServiceIpConnectivity:
      description: >-
        Static IP address connectivity. Used when the source database is
        configured to allow incoming connections from the Datastream public IP
        addresses for the region specified in the connection profile.
      id: StaticServiceIpConnectivity
      properties: {}
      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      type: object
    StopBackfillJobRequest:
      description: >-
        Request for manually stopping a running backfill job for a specific
        stream object.
      id: StopBackfillJobRequest
      properties: {}
      type: object
    StopBackfillJobResponse:
      description: Response for manually stop a backfill job for a specific stream object.
      id: StopBackfillJobResponse
      properties:
        object:
          $ref: '#/components/schemas/StreamObject'
          description: The stream object resource the backfill job was stopped for.
      type: object
    Stream:
      description: A resource representing streaming data from a source to a destination.
      id: Stream
      properties:
        backfillAll:
          $ref: '#/components/schemas/BackfillAllStrategy'
          description: >-
            Automatically backfill objects included in the stream source
            configuration. Specific objects can be excluded.
        backfillNone:
          $ref: '#/components/schemas/BackfillNoneStrategy'
          description: Do not automatically backfill any objects.
        createTime:
          description: Output only. The creation time of the stream.
          format: google-datetime
          readOnly: true
          type: string
        customerManagedEncryptionKey:
