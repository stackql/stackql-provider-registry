    StandardConnectionFormat:
      id: StandardConnectionFormat
      type: object
      description: Standard connection format.
      properties:
        directConnection:
          description: >-
            Optional. Deprecated: Use the `additional_options` map to specify
            the `directConnection` parameter instead. For example:
            `additional_options = {"directConnection": "true"}`. Specifies
