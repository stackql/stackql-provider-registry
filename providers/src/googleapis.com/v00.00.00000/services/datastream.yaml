          deprecated: true
          type: boolean
    OperationMetadata:
      id: OperationMetadata
      type: object
      description: Represents the metadata of the long-running operation.
      properties:
        createTime:
          format: google-datetime
          description: Output only. The time the operation was created.
          readOnly: true
          type: string
        apiVersion:
          readOnly: true
          type: string
          description: Output only. API version used to start the operation.
        target:
          readOnly: true
          type: string
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
        validationResult:
          description: Output only. Results of executed validations if there are any.
          $ref: '#/components/schemas/ValidationResult'
          readOnly: true
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
        statusMessage:
          readOnly: true
          type: string
          description: Output only. Human-readable status of the operation, if any.
        requestedCancellation:
          readOnly: true
          type: boolean
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have successfully been cancelled
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of 1, corresponding to `Code.CANCELLED`.
        endTime:
          format: google-datetime
          description: Output only. The time the operation finished running.
          readOnly: true
          type: string
    QuotaFailure:
      description: >-
        Describes how a quota check failed. For example if a daily limit was
        exceeded for the calling project, a service could respond with a
        QuotaFailure detail containing the project id and the description of the
        quota limit that was exceeded. If the calling project hasn't enabled the
        service in the developer console, then a service could respond with the
        project id and set `service_disabled` to true. Also see RetryInfo and
        Help types for other details about handling a quota failure.
      properties:
        violations:
          description: Describes all quota violations.
          type: array
          items:
            $ref: '#/components/schemas/QuotaFailureViolation'
      id: QuotaFailure
      type: object
    PostgresqlSourceConfig:
      id: PostgresqlSourceConfig
      type: object
      description: Configuration for syncing data from a PostgreSQL source.
      properties:
        includeObjects:
          description: The PostgreSQL objects to include in the stream.
          $ref: '#/components/schemas/PostgresqlRdbms'
        publication:
          description: >-
            Required. The name of the publication that includes the set of all
            tables that are defined in the stream's include_objects.
          type: string
        replicationSlot:
          type: string
          description: >-
            Required. Immutable. The name of the logical replication slot that's
            configured with the pgoutput plugin.
        excludeObjects:
          description: The PostgreSQL objects to exclude from the stream.
          $ref: '#/components/schemas/PostgresqlRdbms'
        maxConcurrentBackfillTasks:
          type: integer
          description: >-
            Maximum number of concurrent backfill tasks. The number should be
            non negative. If not set (or set to 0), the system's default value
            will be used.
          format: int32
    OracleAsmConfig:
      id: OracleAsmConfig
      type: object
      description: Configuration for Oracle Automatic Storage Management (ASM) connection.
      properties:
        port:
          format: int32
          description: Required. Port for the Oracle ASM connection.
          type: integer
        connectionAttributes:
          type: object
          description: Optional. Connection string attributes
          additionalProperties:
            type: string
        password:
          type: string
          description: >-
            Optional. Password for the Oracle ASM connection. Mutually exclusive
            with the `secret_manager_stored_password` field.
        hostname:
          type: string
          description: Required. Hostname for the Oracle ASM connection.
        asmService:
          type: string
          description: Required. ASM service name for the Oracle ASM connection.
        oracleSslConfig:
          description: Optional. SSL configuration for the Oracle connection.
          $ref: '#/components/schemas/OracleSslConfig'
        secretManagerStoredPassword:
          description: >-
            Optional. A reference to a Secret Manager resource name storing the
            Oracle ASM connection password. Mutually exclusive with the
            `password` field.
          type: string
        username:
          type: string
          description: Required. Username for the Oracle ASM connection.
    AppendOnly:
      description: >-
        AppendOnly mode defines that all changes to a table will be written to
        the destination table.
      properties: {}
      id: AppendOnly
      type: object
    MysqlGtidPosition:
      id: MysqlGtidPosition
      type: object
      description: MySQL GTID position
      properties:
        gtidSet:
          type: string
          description: Required. The gtid set to start replication from.
    ResourceInfo:
      id: ResourceInfo
      type: object
      description: Describes the resource that is being accessed.
      properties:
        owner:
          type: string
          description: >-
            The owner of the resource (optional). For example, "user:" or
            "project:".
        resourceName:
          type: string
          description: >-
            The name of the resource being accessed. For example, a shared
            calendar name: "example.com_4fghdhgsrgh@group.calendar.google.com",
            if the current error is google.rpc.Code.PERMISSION_DENIED.
        description:
          description: >-
            Describes what error is encountered when accessing this resource.
            For example, updating a cloud project may require the `writer`
            permission on the developer console project.
          type: string
        resourceType:
          description: >-
            A name for the type of resource being accessed, e.g. "sql table",
            "cloud storage bucket", "file", "Google calendar"; or the type URL
            of the resource: e.g. "type.googleapis.com/google.pubsub.v1.Topic".
          type: string
    SqlServerRdbms:
      id: SqlServerRdbms
      type: object
      description: SQLServer database structure.
      properties:
        schemas:
          description: SQLServer schemas in the database server.
          type: array
          items:
            $ref: '#/components/schemas/SqlServerSchema'
    CustomizationRule:
      description: A customization rule to apply to a set of objects.
      properties:
        bigqueryPartitioning:
          description: BigQuery partitioning rule.
          $ref: '#/components/schemas/BigQueryPartitioning'
        bigqueryClustering:
          description: BigQuery clustering rule.
          $ref: '#/components/schemas/BigQueryClustering'
      id: CustomizationRule
      type: object
    SqlServerObjectIdentifier:
      description: SQLServer data source object identifier.
      properties:
        schema:
          type: string
          description: Required. The schema name.
        table:
          description: Required. The table name.
          type: string
      id: SqlServerObjectIdentifier
      type: object
    MysqlSourceConfig:
      id: MysqlSourceConfig
      type: object
      description: Configuration for syncing data from a MySQL source.
      properties:
        excludeObjects:
          description: The MySQL objects to exclude from the stream.
          $ref: '#/components/schemas/MysqlRdbms'
        maxConcurrentBackfillTasks:
          format: int32
          type: integer
          description: >-
            Maximum number of concurrent backfill tasks. The number should be
            non negative. If not set (or set to 0), the system's default value
            will be used.
        binaryLogPosition:
          description: Use Binary log position based replication.
          $ref: '#/components/schemas/BinaryLogPosition'
        gtid:
          description: Use GTID based replication.
          $ref: '#/components/schemas/Gtid'
        maxConcurrentCdcTasks:
          format: int32
          description: >-
            Maximum number of concurrent CDC tasks. The number should be non
            negative. If not set (or set to 0), the system's default value will
            be used.
          type: integer
        includeObjects:
          description: The MySQL objects to retrieve from the source.
          $ref: '#/components/schemas/MysqlRdbms'
    BackfillNoneStrategy:
