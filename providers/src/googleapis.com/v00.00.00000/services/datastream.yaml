components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AppendOnly:
      description: >-
        AppendOnly mode defines that all changes to a table will be written to
        the destination table.
      id: AppendOnly
      properties: {}
      type: object
    AvroFileFormat:
      description: AVRO file format configuration.
      id: AvroFileFormat
      properties: {}
      type: object
    BackfillAllStrategy:
      description: >-
        Backfill strategy to automatically backfill the Stream's objects.
        Specific objects can be excluded.
      id: BackfillAllStrategy
      properties:
        mongodbExcludedObjects:
          $ref: '#/components/schemas/MongodbCluster'
          description: MongoDB data source objects to avoid backfilling
        mysqlExcludedObjects:
          $ref: '#/components/schemas/MysqlRdbms'
          description: MySQL data source objects to avoid backfilling.
        oracleExcludedObjects:
          $ref: '#/components/schemas/OracleRdbms'
          description: Oracle data source objects to avoid backfilling.
        postgresqlExcludedObjects:
          $ref: '#/components/schemas/PostgresqlRdbms'
          description: PostgreSQL data source objects to avoid backfilling.
        saasExcludedObjects:
          $ref: '#/components/schemas/SourceCatalog'
          description: >-
            Source catalog data source objects to avoid backfilling. This is
            mainly used to represent SaaS applications objects.
        salesforceExcludedObjects:
          $ref: '#/components/schemas/SalesforceOrg'
          description: Salesforce data source objects to avoid backfilling
        spannerExcludedObjects:
          $ref: '#/components/schemas/SpannerDatabase'
          description: Spanner data source objects to avoid backfilling.
        sqlServerExcludedObjects:
          $ref: '#/components/schemas/SqlServerRdbms'
          description: SQLServer data source objects to avoid backfilling
      type: object
    BackfillJob:
      description: Represents a backfill job on a specific stream object.
      id: BackfillJob
      properties:
        errors:
          description: Output only. Errors which caused the backfill job to fail.
          items:
            $ref: '#/components/schemas/Error'
          readOnly: true
          type: array
        eventFilter:
          $ref: '#/components/schemas/EventFilter'
          description: Output only. The filter for performing a partial backfill.
          readOnly: true
        lastEndTime:
          description: Output only. Backfill job's end time.
          format: google-datetime
          readOnly: true
          type: string
        lastStartTime:
          description: Output only. Backfill job's start time.
          format: google-datetime
          readOnly: true
          type: string
        state:
          description: Output only. Backfill job state.
          enum:
            - STATE_UNSPECIFIED
            - NOT_STARTED
            - PENDING
            - ACTIVE
            - STOPPED
            - FAILED
            - COMPLETED
            - UNSUPPORTED
          enumDescriptions:
            - Default value.
            - >-
              Backfill job was never started for the stream object (stream has
              backfill strategy defined as manual or object was explicitly
              excluded from automatic backfill).
            - Backfill job will start pending available resources.
            - Backfill job is running.
            - Backfill job stopped (next job run will start from beginning).
            - Backfill job failed (due to an error).
            - Backfill completed successfully.
            - >-
              Backfill job failed since the table structure is currently
              unsupported for backfill.
          readOnly: true
          type: string
        trigger:
          description: Backfill job's triggering reason.
          enum:
            - TRIGGER_UNSPECIFIED
            - AUTOMATIC
            - MANUAL
          enumDescriptions:
            - Default value.
            - >-
              Object backfill job was triggered automatically according to the
              stream's backfill strategy.
            - >-
              Object backfill job was triggered manually using the dedicated
              API.
          type: string
      type: object
    BackfillNoneStrategy:
      description: >-
        Backfill strategy to disable automatic backfill for the Stream's
        objects.
      id: BackfillNoneStrategy
      properties: {}
      type: object
    BadRequest:
      description: >-
        Describes violations in a client request. This error type focuses on the
        syntactic aspects of the request.
      id: BadRequest
      properties:
        fieldViolations:
          description: Describes all violations in a client request.
          items:
            $ref: '#/components/schemas/FieldViolation'
          type: array
      type: object
    BasicEncryption:
      description: >-
        Message to represent the option where Datastream will enforce encryption
        without authenticating server identity. Server certificates will be
        trusted by default.
      id: BasicEncryption
      properties: {}
      type: object
    BigQueryClustering:
      description: BigQuery clustering configuration.
      id: BigQueryClustering
      properties:
        columns:
          description: Required. Column names to set as clustering columns.
          items:
            type: string
          type: array
      type: object
    BigQueryDestinationConfig:
      description: BigQuery destination configuration
      id: BigQueryDestinationConfig
      properties:
        appendOnly:
          $ref: '#/components/schemas/AppendOnly'
          description: Append only mode
        blmtConfig:
          $ref: '#/components/schemas/BlmtConfig'
          description: Optional. Big Lake Managed Tables (BLMT) configuration.
        dataFreshness:
          description: >-
            The guaranteed data freshness (in seconds) when querying tables
            created by the stream. Editing this field will only affect new
            tables created in the future, but existing tables will not be
            impacted. Lower values mean that queries will return fresher data,
            but may result in higher cost.
          format: google-duration
          type: string
        merge:
          $ref: '#/components/schemas/Merge'
          description: The standard mode
        singleTargetDataset:
          $ref: '#/components/schemas/SingleTargetDataset'
          description: Single destination dataset.
        sourceHierarchyDatasets:
          $ref: '#/components/schemas/SourceHierarchyDatasets'
          description: Source hierarchy datasets.
      type: object
    BigQueryPartitioning:
      description: BigQuery partitioning configuration.
      id: BigQueryPartitioning
      properties:
        ingestionTimePartition:
          $ref: '#/components/schemas/IngestionTimePartition'
          description: Ingestion time partitioning.
        integerRangePartition:
          $ref: '#/components/schemas/IntegerRangePartition'
          description: Integer range partitioning.
        requirePartitionFilter:
          description: >-
            Optional. If true, queries over the table require a partition
            filter.
          type: boolean
        timeUnitPartition:
          $ref: '#/components/schemas/TimeUnitPartition'
          description: Time unit column partitioning.
      type: object
    BigQueryProfile:
      description: Profile for connecting to a BigQuery destination.
      id: BigQueryProfile
      properties: {}
      type: object
    BinaryLogParser:
      description: Configuration to use Binary Log Parser CDC technique.
      id: BinaryLogParser
      properties:
        logFileDirectories:
          $ref: '#/components/schemas/LogFileDirectories'
          description: Use Oracle directories.
        oracleAsmLogFileAccess:
          $ref: '#/components/schemas/OracleAsmLogFileAccess'
          description: Use Oracle ASM.
      type: object
    BinaryLogPosition:
      description: Use Binary log position based replication.
      id: BinaryLogPosition
      properties: {}
      type: object
    BlmtConfig:
      description: The configuration for BLMT.
      id: BlmtConfig
      properties:
        bucket:
          description: Required. The Cloud Storage bucket name.
          type: string
        connectionName:
          description: >-
            Required. The bigquery connection. Format:
            `{project}.{location}.{name}`
          type: string
        fileFormat:
          description: Required. The file format.
          enum:
            - FILE_FORMAT_UNSPECIFIED
            - PARQUET
          enumDescriptions:
            - Default value.
            - Parquet file format.
          type: string
        rootPath:
          description: The root path inside the Cloud Storage bucket.
          type: string
        tableFormat:
          description: Required. The table format.
          enum:
            - TABLE_FORMAT_UNSPECIFIED
            - ICEBERG
          enumDescriptions:
            - Default value.
            - Iceberg table format.
          type: string
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    CdcStrategy:
      description: The strategy that the stream uses for CDC replication.
      id: CdcStrategy
      properties:
        mostRecentStartPosition:
          $ref: '#/components/schemas/MostRecentStartPosition'
          description: >-
            Optional. Start replicating from the most recent position in the
            source.
        nextAvailableStartPosition:
          $ref: '#/components/schemas/NextAvailableStartPosition'
          description: >-
            Optional. Resume replication from the next available position in the
            source.
        specificStartPosition:
          $ref: '#/components/schemas/SpecificStartPosition'
          description: Optional. Start replicating from a specific position in the source.
      type: object
    ConnectionProfile:
      description: >-
        A set of reusable connection configurations to be used as a source or
        destination for a stream.
      id: ConnectionProfile
      properties:
        bigqueryProfile:
          $ref: '#/components/schemas/BigQueryProfile'
          description: Profile for connecting to a BigQuery destination.
        createTime:
          description: Output only. The create time of the resource.
          format: google-datetime
          readOnly: true
          type: string
        dataverseProfile:
          $ref: '#/components/schemas/DataverseProfile'
          description: Profile for connecting to a Dataverse source.
        displayName:
          description: Required. Display name.
          type: string
        forwardSshConnectivity:
          $ref: '#/components/schemas/ForwardSshTunnelConnectivity'
          description: Forward SSH tunnel connectivity.
        gcsProfile:
          $ref: '#/components/schemas/GcsProfile'
          description: Profile for connecting to a Cloud Storage destination.
        labels:
          additionalProperties:
            type: string
          description: Labels.
          type: object
        mongodbProfile:
          $ref: '#/components/schemas/MongodbProfile'
          description: Profile for connecting to a MongoDB source.
        mysqlProfile:
          $ref: '#/components/schemas/MysqlProfile'
          description: Profile for connecting to a MySQL source.
        name:
          description: Output only. Identifier. The resource's name.
          readOnly: true
          type: string
        oracleProfile:
          $ref: '#/components/schemas/OracleProfile'
          description: Profile for connecting to an Oracle source.
        postgresqlProfile:
          $ref: '#/components/schemas/PostgresqlProfile'
          description: Profile for connecting to a PostgreSQL source.
        privateConnectivity:
          $ref: '#/components/schemas/PrivateConnectivity'
          description: Private connectivity.
        salesforceMarketingCloudProfile:
          $ref: '#/components/schemas/SalesforceMarketingCloudProfile'
          description: Profile for connecting to a Salesforce Marketing Cloud source.
        salesforceProfile:
          $ref: '#/components/schemas/SalesforceProfile'
          description: Profile for connecting to a Salesforce source.
        satisfiesPzi:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        serviceNowProfile:
          $ref: '#/components/schemas/ServiceNowProfile'
          description: Profile for connecting to a ServiceNow source.
        spannerProfile:
          $ref: '#/components/schemas/SpannerProfile'
          description: Profile for connecting to a Spanner source.
        sqlServerProfile:
          $ref: '#/components/schemas/SqlServerProfile'
          description: Profile for connecting to a SQLServer source.
        staticServiceIpConnectivity:
          $ref: '#/components/schemas/StaticServiceIpConnectivity'
          description: Static Service IP connectivity.
        updateTime:
          description: Output only. The update time of the resource.
          format: google-datetime
          readOnly: true
          type: string
        workdayProfile:
          $ref: '#/components/schemas/WorkdayProfile'
          description: Optional. Profile for connecting to a Workday source.
      type: object
    CustomizationRule:
      description: A customization rule to apply to a set of objects.
      id: CustomizationRule
      properties:
        bigqueryClustering:
          $ref: '#/components/schemas/BigQueryClustering'
          description: BigQuery clustering rule.
        bigqueryPartitioning:
          $ref: '#/components/schemas/BigQueryPartitioning'
          description: BigQuery partitioning rule.
      type: object
    DatasetTemplate:
      description: Dataset template used for dynamic dataset creation.
      id: DatasetTemplate
      properties:
        datasetIdPrefix:
          description: >-
            If supplied, every created dataset will have its name prefixed by
            the provided value. The prefix and name will be separated by an
            underscore. i.e. _.
          type: string
        kmsKeyName:
          description: >-
            Describes the Cloud KMS encryption key that will be used to protect
            destination BigQuery table. The BigQuery Service Account associated
            with your project requires access to this encryption key. i.e.
            projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{cryptoKey}.
            See
            https://cloud.google.com/bigquery/docs/customer-managed-encryption
            for more information.
          type: string
        location:
          description: >-
            Required. The geographic location where the dataset should reside.
            See https://cloud.google.com/bigquery/docs/locations for supported
            locations.
          type: string
      type: object
    DataverseProfile:
      description: Profile for connecting to a Dataverse source.
      id: DataverseProfile
      properties:
        environmentUrl:
          description: >-
            Required. Environment URL of the Microsoft Dataverse instance.
            Example: `.crm.dynamics.com`
          type: string
        oauthClientCredentials:
          $ref: '#/components/schemas/OauthClientCredentials'
          description: Required. Credentials for authenticating with the Dataverse API.
        tenantId:
          description: Required. Tenant id of the Microsoft Dataverse instance.
          type: string
      type: object
    DataverseSourceConfig:
      description: Configuration for syncing data from a Dataverse source.
      id: DataverseSourceConfig
      properties:
        excludeObjects:
          $ref: '#/components/schemas/SourceCatalog'
          description: Optional. The objects to exclude from the stream.
        includeObjects:
          $ref: '#/components/schemas/SourceCatalog'
          description: Optional. The objects to retrieve from the source.
        pollingInterval:
          description: >-
            Required. Incremental sync polling interval for all objects. If not
            set, a default value of `5 minutes` is used. The duration must be
            from `5 minutes` to `24 hours`, inclusive.
          format: google-duration
          type: string
      type: object
    DebugInfo:
      description: Describes additional debugging info.
      id: DebugInfo
      properties:
        detail:
          description: Additional debugging information provided by the server.
          type: string
        stackEntries:
          description: The stack trace entries indicating where the error occurred.
          items:
            type: string
          type: array
      type: object
    DestinationConfig:
      description: The configuration of the stream destination.
      id: DestinationConfig
      properties:
        bigqueryDestinationConfig:
          $ref: '#/components/schemas/BigQueryDestinationConfig'
          description: BigQuery destination configuration.
        destinationConnectionProfile:
          description: >-
            Required. Destination connection profile resource. Format:
            `projects/{project}/locations/{location}/connectionProfiles/{name}`
          type: string
        gcsDestinationConfig:
          $ref: '#/components/schemas/GcsDestinationConfig'
          description: A configuration for how data should be loaded to Cloud Storage.
      type: object
    DiscoverConnectionProfileRequest:
      description: Request message for 'discover' ConnectionProfile request.
      id: DiscoverConnectionProfileRequest
      properties:
        connectionProfile:
          $ref: '#/components/schemas/ConnectionProfile'
          description: Optional. An ad-hoc connection profile configuration.
        connectionProfileName:
          description: Optional. A reference to an existing connection profile.
          type: string
        fullHierarchy:
          description: >-
            Optional. Whether to retrieve the full hierarchy of data objects
            (TRUE) or only the current level (FALSE).
          type: boolean
        hierarchyDepth:
          description: >-
            Optional. The number of hierarchy levels below the current level to
            be retrieved.
          format: int32
          type: integer
        mongodbCluster:
          $ref: '#/components/schemas/MongodbCluster'
          description: >-
            Optional. MongoDB cluster to enrich with child data objects and
            metadata.
        mysqlRdbms:
          $ref: '#/components/schemas/MysqlRdbms'
          description: >-
            Optional. MySQL RDBMS to enrich with child data objects and
            metadata.
        oracleRdbms:
          $ref: '#/components/schemas/OracleRdbms'
          description: >-
            Optional. Oracle RDBMS to enrich with child data objects and
            metadata.
        postgresqlRdbms:
          $ref: '#/components/schemas/PostgresqlRdbms'
          description: >-
            Optional. PostgreSQL RDBMS to enrich with child data objects and
            metadata.
        salesforceOrg:
          $ref: '#/components/schemas/SalesforceOrg'
          description: >-
            Optional. Salesforce organization to enrich with child data objects
            and metadata.
        sourceCatalog:
          $ref: '#/components/schemas/SourceCatalog'
          description: >-
            Optional. Source catalog to enrich with child data objects and
            metadata. This is mainly used to represent SaaS sources databases.
        spannerDatabase:
          $ref: '#/components/schemas/SpannerDatabase'
          description: >-
            Optional. Spanner database to enrich with child data objects and
            metadata.
        sqlServerRdbms:
          $ref: '#/components/schemas/SqlServerRdbms'
          description: >-
            Optional. SQLServer RDBMS to enrich with child data objects and
            metadata.
      type: object
    DiscoverConnectionProfileResponse:
      description: Response from a discover request.
      id: DiscoverConnectionProfileResponse
      properties:
        mongodbCluster:
          $ref: '#/components/schemas/MongodbCluster'
          description: Enriched MongoDB cluster.
        mysqlRdbms:
          $ref: '#/components/schemas/MysqlRdbms'
          description: Enriched MySQL RDBMS object.
        oracleRdbms:
          $ref: '#/components/schemas/OracleRdbms'
          description: Enriched Oracle RDBMS object.
        postgresqlRdbms:
          $ref: '#/components/schemas/PostgresqlRdbms'
          description: Enriched PostgreSQL RDBMS object.
        salesforceOrg:
          $ref: '#/components/schemas/SalesforceOrg'
          description: Enriched Salesforce organization.
        sourceCatalog:
          $ref: '#/components/schemas/SourceCatalog'
          description: >-
            Enriched source catalog. This is mainly used to represent SaaS
            sources databases.
        spannerDatabase:
          $ref: '#/components/schemas/SpannerDatabase'
          description: Enriched Spanner database.
        sqlServerRdbms:
          $ref: '#/components/schemas/SqlServerRdbms'
          description: Enriched SQLServer RDBMS object.
      type: object
    DropLargeObjects:
      description: Configuration to drop large object values.
      id: DropLargeObjects
      properties: {}
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    EncryptionAndServerValidation:
      description: >-
        Message to represent the option where Datastream will enforce encryption
        and authenticate server identity. ca_certificate must be set if user
        selects this option.
      id: EncryptionAndServerValidation
      properties:
        caCertificate:
          description: >-
            Optional. Input only. PEM-encoded certificate of the CA that signed
            the source database server's certificate.
          type: string
        serverCertificateHostname:
          description: >-
            Optional. The hostname mentioned in the Subject or SAN extension of
            the server certificate. This field is used for bypassing the
            hostname validation while verifying server certificate. This is
            required for scenarios where the host name that datastream connects
            to is different from the certificate's subject. This specifically
            happens for private connectivity. It could also happen when the
            customer provides a public IP in connection profile but the same is
            not present in the server certificate.
          type: string
      type: object
    EncryptionNotEnforced:
      description: >-
        Message to represent the option where encryption is not enforced. An
        empty message right now to allow future extensibility.
      id: EncryptionNotEnforced
      properties: {}
      type: object
    Error:
      description: Represent a user-facing Error.
      id: Error
      properties:
        details:
          additionalProperties:
            type: string
          description: Additional information about the error.
          type: object
        errorTime:
          description: The time when the error occurred.
          format: google-datetime
          type: string
        errorUuid:
          description: >-
            A unique identifier for this specific error, allowing it to be
            traced throughout the system in logs and API responses.
          type: string
        message:
          description: A message containing more information about the error that occurred.
          type: string
        reason:
          description: A title that explains the reason for the error.
          type: string
      type: object
    ErrorInfo:
      description: >-
        Describes the cause of the error with structured details. Example of an
        error when contacting the "pubsub.googleapis.com" API when it is not
        enabled: { "reason": "API_DISABLED" "domain": "googleapis.com"
        "metadata": { "resource": "projects/123", "service":
        "pubsub.googleapis.com" } } This response indicates that the
        pubsub.googleapis.com API is not enabled. Example of an error that is
        returned when attempting to create a Spanner instance in a region that
        is out of stock: { "reason": "STOCKOUT" "domain":
        "spanner.googleapis.com", "metadata": { "availableRegions":
        "us-central1,us-east2" } }
      id: ErrorInfo
      properties:
        domain:
          description: >-
            The logical grouping to which the "reason" belongs. The error domain
            is typically the registered service name of the tool or product that
            generates the error. Example: "pubsub.googleapis.com". If the error
            is generated by some common infrastructure, the error domain must be
            a globally unique value that identifies the infrastructure. For
            Google API infrastructure, the error domain is "googleapis.com".
          type: string
        metadata:
          additionalProperties:
            type: string
          description: >-
            Additional structured details about this error. Keys must match a
            regular expression of `a-z+` but should ideally be lowerCamelCase.
            Also, they must be limited to 64 characters in length. When
            identifying the current value of an exceeded limit, the units should
            be contained in the key, not the value. For example, rather than
            `{"instanceLimit": "100/request"}`, should be returned as,
            `{"instanceLimitPerRequest": "100"}`, if the client exceeds the
            number of instances that can be created in a single (batch) request.
          type: object
        reason:
          description: >-
            The reason for the error. This is a constant value that identifies
            the proximate cause of the error. Error reasons are unique within a
            particular domain of errors. This should be at most 63 characters
            and match a regular expression of `A-Z+[A-Z0-9]`, which represents
            UPPER_SNAKE_CASE.
          type: string
      type: object
    EventFilter:
      description: Represents a filter for included data on a stream object.
      id: EventFilter
      properties:
        sqlWhereClause:
          description: >-
            An SQL-query Where clause selecting which data should be included,
            not including the "WHERE" keyword. e.g., `t.key1 = 'value1' AND
            t.key2 = 'value2'`
          type: string
      type: object
    FetchStaticIpsResponse:
      description: Response message for a 'FetchStaticIps' response.
      id: FetchStaticIpsResponse
      properties:
        nextPageToken:
          description: >-
            A token that can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
          type: string
        staticIps:
          description: list of static ips by account
          items:
            type: string
          type: array
      type: object
    FieldViolation:
      description: A message type used to describe a single bad request field.
      id: FieldViolation
      properties:
        description:
          description: A description of why the request element is bad.
          type: string
        field:
          description: >-
            A path that leads to a field in the request body. The value will be
            a sequence of dot-separated identifiers that identify a protocol
            buffer field. Consider the following: message CreateContactRequest {
            message EmailAddress { enum Type { TYPE_UNSPECIFIED = 0; HOME = 1;
            WORK = 2; } optional string email = 1; repeated EmailType type = 2;
            } string full_name = 1; repeated EmailAddress email_addresses = 2; }
            In this example, in proto `field` could take one of the following
            values: * `full_name` for a violation in the `full_name` value *
            `email_addresses[0].email` for a violation in the `email` field of
            the first `email_addresses` message * `email_addresses[2].type[1]`
            for a violation in the second `type` value in the third
            `email_addresses` message. In JSON, the same values are represented
            as: * `fullName` for a violation in the `fullName` value *
            `emailAddresses[0].email` for a violation in the `email` field of
            the first `emailAddresses` message * `emailAddresses[2].type[1]` for
            a violation in the second `type` value in the third `emailAddresses`
            message.
          type: string
        localizedMessage:
          $ref: '#/components/schemas/LocalizedMessage'
          description: >-
            Provides a localized error message for field-level errors that is
            safe to return to the API consumer.
        reason:
          description: >-
            The reason for the field-level error. This is a constant value that
            identifies the proximate cause of the field-level error. It should
            uniquely identify the type of the FieldViolation within the scope of
            the google.rpc.ErrorInfo.domain. This should be at most 63
            characters and match a regular expression of `A-Z+[A-Z0-9]`, which
            represents UPPER_SNAKE_CASE.
          type: string
      type: object
    ForwardSshTunnelConnectivity:
      description: Forward SSH Tunnel connectivity.
      id: ForwardSshTunnelConnectivity
      properties:
        hostname:
          description: Required. Hostname for the SSH tunnel.
          type: string
        password:
          description: Input only. SSH password.
          type: string
        port:
          description: Port for the SSH tunnel, default value is 22.
          format: int32
          type: integer
        privateKey:
          description: Input only. SSH private key.
          type: string
        username:
          description: Required. Username for the SSH tunnel.
          type: string
      type: object
    GcsDestinationConfig:
      description: Google Cloud Storage destination configuration
      id: GcsDestinationConfig
      properties:
        avroFileFormat:
          $ref: '#/components/schemas/AvroFileFormat'
          description: AVRO file format configuration.
        fileRotationInterval:
          description: >-
            The maximum duration for which new events are added before a file is
            closed and a new file is created. Values within the range of 15-60
            seconds are allowed.
          format: google-duration
          type: string
        fileRotationMb:
          description: The maximum file size to be saved in the bucket.
          format: int32
          type: integer
        jsonFileFormat:
          $ref: '#/components/schemas/JsonFileFormat'
          description: JSON file format configuration.
        path:
          description: Path inside the Cloud Storage bucket to write data to.
          type: string
      type: object
    GcsProfile:
      description: Profile for connecting to a Cloud Storage destination.
      id: GcsProfile
      properties:
        bucket:
          description: Required. The Cloud Storage bucket name.
          type: string
        rootPath:
          description: Optional. The root path inside the Cloud Storage bucket.
          type: string
      type: object
    Gtid:
      description: Use GTID based replication.
      id: Gtid
      properties: {}
      type: object
    Help:
      description: >-
        Provides links to documentation or for performing an out of band action.
        For example, if a quota check failed with an error indicating the
        calling project hasn't enabled the accessed service, this can contain a
        URL pointing directly to the right place in the developer console to
        flip the bit.
      id: Help
      properties:
        links:
          description: >-
            URL(s) pointing to additional information on handling the current
            error.
          items:
            $ref: '#/components/schemas/Link'
          type: array
      type: object
    HostAddress:
      description: >-
        A HostAddress represents a transport end point, which is the combination
        of an IP address or hostname and a port number.
      id: HostAddress
      properties:
        hostname:
          description: Required. Hostname for the connection.
          type: string
        port:
          description: Optional. Port for the connection.
          format: int32
          type: integer
      type: object
    IngestionTimePartition:
      description: >-
        Ingestion time partitioning. see
        https://cloud.google.com/bigquery/docs/partitioned-tables#ingestion_time
      id: IngestionTimePartition
      properties:
        partitioningTimeGranularity:
          description: Optional. Partition granularity
          enum:
            - PARTITIONING_TIME_GRANULARITY_UNSPECIFIED
            - PARTITIONING_TIME_GRANULARITY_HOUR
            - PARTITIONING_TIME_GRANULARITY_DAY
            - PARTITIONING_TIME_GRANULARITY_MONTH
            - PARTITIONING_TIME_GRANULARITY_YEAR
          enumDescriptions:
            - Unspecified partitioing interval.
            - Hourly partitioning.
            - Daily partitioning.
            - Monthly partitioning.
            - Yearly partitioning.
          type: string
      type: object
    IntegerRangePartition:
      description: >-
        Integer range partitioning. see
        https://cloud.google.com/bigquery/docs/partitioned-tables#integer_range
      id: IntegerRangePartition
      properties:
        column:
          description: Required. The partitioning column.
          type: string
        end:
          description: Required. The ending value for range partitioning (exclusive).
          format: int64
          type: string
        interval:
          description: Required. The interval of each range within the partition.
          format: int64
          type: string
        start:
          description: Required. The starting value for range partitioning (inclusive).
          format: int64
          type: string
      type: object
    JsonFileFormat:
      description: JSON file format configuration.
      id: JsonFileFormat
      properties:
        compression:
          description: Compression of the loaded JSON file.
          enum:
            - JSON_COMPRESSION_UNSPECIFIED
            - NO_COMPRESSION
            - GZIP
          enumDescriptions:
            - Unspecified json file compression.
            - Do not compress JSON file.
            - Gzip compression.
          type: string
        schemaFileFormat:
          description: The schema file format along JSON data files.
          enum:
            - SCHEMA_FILE_FORMAT_UNSPECIFIED
            - NO_SCHEMA_FILE
            - AVRO_SCHEMA_FILE
          enumDescriptions:
            - Unspecified schema file format.
            - Do not attach schema file.
            - Avro schema format.
          type: string
      type: object
    Link:
      description: Describes a URL link.
      id: Link
      properties:
        description:
          description: Describes what the link offers.
          type: string
        url:
          description: The URL of the link.
          type: string
      type: object
    ListConnectionProfilesResponse:
      description: Response message for listing connection profiles.
      id: ListConnectionProfilesResponse
      properties:
        connectionProfiles:
          description: List of connection profiles.
          items:
            $ref: '#/components/schemas/ConnectionProfile'
          type: array
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    ListPrivateConnectionsResponse:
      description: Response containing a list of private connection configurations.
      id: ListPrivateConnectionsResponse
      properties:
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
          type: string
        privateConnections:
          description: List of private connectivity configurations.
          items:
            $ref: '#/components/schemas/PrivateConnection'
          type: array
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListRoutesResponse:
      description: Route list response.
      id: ListRoutesResponse
      properties:
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
          type: string
        routes:
          description: List of Routes.
          items:
            $ref: '#/components/schemas/Route'
          type: array
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListStreamObjectsResponse:
      description: Response containing the objects for a stream.
      id: ListStreamObjectsResponse
      properties:
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page.
          type: string
        streamObjects:
          description: List of stream objects.
          items:
            $ref: '#/components/schemas/StreamObject'
          type: array
      type: object
    ListStreamsResponse:
      description: Response message for listing streams.
      id: ListStreamsResponse
      properties:
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
          type: string
        streams:
          description: List of streams
          items:
            $ref: '#/components/schemas/Stream'
          type: array
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    LocalizedMessage:
      description: >-
        Provides a localized error message that is safe to return to the user
        which can be attached to an RPC error.
      id: LocalizedMessage
      properties:
        locale:
          description: >-
            The locale used following the specification defined at
            https://www.rfc-editor.org/rfc/bcp/bcp47.txt. Examples are: "en-US",
            "fr-CH", "es-MX"
          type: string
        message:
          description: The localized error message in the above locale.
          type: string
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    LogFileDirectories:
      description: Configuration to specify the Oracle directories to access the log files.
      id: LogFileDirectories
      properties:
        archivedLogDirectory:
          description: Required. Oracle directory for archived logs.
          type: string
        onlineLogDirectory:
          description: Required. Oracle directory for online logs.
          type: string
      type: object
    LogMiner:
      description: Configuration to use LogMiner CDC method.
      id: LogMiner
      properties: {}
      type: object
    LookupStreamObjectRequest:
      description: >-
        Request for looking up a specific stream object by its source object
        identifier.
      id: LookupStreamObjectRequest
      properties:
        sourceObjectIdentifier:
          $ref: '#/components/schemas/SourceObjectIdentifier'
          description: >-
            Required. The source object identifier which maps to the stream
            object.
      type: object
    Merge:
      description: >-
        Merge mode defines that all changes to a table will be merged at the
        destination table.
      id: Merge
      properties: {}
      type: object
    MongodbChangeStreamPosition:
      description: MongoDB change stream position
      id: MongodbChangeStreamPosition
      properties:
        startTime:
          description: Required. The timestamp to start change stream from.
          format: google-datetime
          type: string
      type: object
    MongodbCluster:
      description: MongoDB Cluster structure.
      id: MongodbCluster
      properties:
        databases:
          description: MongoDB databases in the cluster.
          items:
            $ref: '#/components/schemas/MongodbDatabase'
          type: array
      type: object
    MongodbCollection:
      description: MongoDB Collection.
      id: MongodbCollection
      properties:
        collection:
          description: The collection name.
          type: string
        fields:
          description: Fields in the collection.
          items:
            $ref: '#/components/schemas/MongodbField'
          type: array
      type: object
    MongodbDatabase:
      description: MongoDB Database.
      id: MongodbDatabase
      properties:
        collections:
          description: Collections in the database.
          items:
            $ref: '#/components/schemas/MongodbCollection'
          type: array
        database:
          description: The database name.
          type: string
      type: object
    MongodbField:
      description: MongoDB Field.
      id: MongodbField
      properties:
        field:
          description: The field name.
          type: string
      type: object
    MongodbObjectIdentifier:
      description: MongoDB data source object identifier.
      id: MongodbObjectIdentifier
      properties:
        collection:
          description: Required. The collection name.
          type: string
        database:
          description: Required. The database name.
          type: string
      type: object
    MongodbProfile:
      description: Profile for connecting to a MongoDB source.
      id: MongodbProfile
      properties:
        additionalOptions:
          additionalProperties:
            type: string
          description: >-
            Optional. Specifies additional options for the MongoDB connection.
            The options should be sent as key-value pairs, for example:
            `additional_options = {"serverSelectionTimeoutMS": "10000",
            "directConnection": "true"}`. Keys are case-sensitive and should
            match the official MongoDB connection string options:
            https://www.mongodb.com/docs/manual/reference/connection-string-options/
            The server will not modify the values provided by the user.
          type: object
        hostAddresses:
          description: >-
            Required. List of host addresses for a MongoDB cluster. For SRV
            connection format, this list must contain exactly one DNS host
            without a port. For Standard connection format, this list must
            contain all the required hosts in the cluster with their respective
            ports.
          items:
            $ref: '#/components/schemas/HostAddress'
          type: array
        password:
          description: >-
            Optional. Password for the MongoDB connection. Mutually exclusive
            with the `secret_manager_stored_password` field.
          type: string
        replicaSet:
          description: >-
            Optional. Name of the replica set. Only needed for self hosted
            replica set type MongoDB cluster. For SRV connection format, this
            field must be empty. For Standard connection format, this field must
            be specified.
          type: string
        secretManagerStoredPassword:
          description: >-
            Optional. A reference to a Secret Manager resource name storing the
            SQLServer connection password. Mutually exclusive with the
            `password` field.
          type: string
        srvConnectionFormat:
          $ref: '#/components/schemas/SrvConnectionFormat'
          description: Srv connection format.
        sslConfig:
          $ref: '#/components/schemas/MongodbSslConfig'
          description: Optional. SSL configuration for the MongoDB connection.
        standardConnectionFormat:
          $ref: '#/components/schemas/StandardConnectionFormat'
          description: Standard connection format.
        username:
          description: Required. Username for the MongoDB connection.
          type: string
      type: object
    MongodbSourceConfig:
      description: Configuration for syncing data from a MongoDB source.
      id: MongodbSourceConfig
      properties:
        excludeObjects:
          $ref: '#/components/schemas/MongodbCluster'
          description: The MongoDB collections to exclude from the stream.
        includeObjects:
          $ref: '#/components/schemas/MongodbCluster'
          description: The MongoDB collections to include in the stream.
        jsonMode:
          description: Optional. MongoDB JSON mode to use for the stream.
          enum:
            - MONGODB_JSON_MODE_UNSPECIFIED
            - STRICT
            - CANONICAL
          enumDescriptions:
            - Unspecified JSON mode.
            - Strict JSON mode.
            - Canonical JSON mode.
          type: string
        maxConcurrentBackfillTasks:
          description: >-
            Optional. Maximum number of concurrent backfill tasks. The number
            should be non-negative and less than or equal to 50. If not set (or
            set to 0), the system's default value is used
          format: int32
          type: integer
      type: object
    MongodbSslConfig:
      description: MongoDB SSL configuration information.
      id: MongodbSslConfig
      properties:
        caCertificate:
          description: >-
            Optional. Input only. PEM-encoded certificate of the CA that signed
            the source database server's certificate.
          type: string
        caCertificateSet:
          description: Output only. Indicates whether the ca_certificate field is set.
          readOnly: true
          type: boolean
        clientCertificate:
          description: >-
            Optional. Input only. PEM-encoded certificate that will be used by
            the replica to authenticate against the source database server. If
            this field is used then the 'client_key' and the 'ca_certificate'
            fields are mandatory.
          type: string
        clientCertificateSet:
          description: Output only. Indicates whether the client_certificate field is set.
          readOnly: true
          type: boolean
        clientKey:
          description: >-
            Optional. Input only. PEM-encoded private key associated with the
            Client Certificate. If this field is used then the
            'client_certificate' and the 'ca_certificate' fields are mandatory.
          type: string
        clientKeySet:
          description: Output only. Indicates whether the client_key field is set.
          readOnly: true
          type: boolean
        secretManagerStoredClientKey:
          description: >-
            Optional. Input only. A reference to a Secret Manager resource name
            storing the PEM-encoded private key associated with the Client
            Certificate. If this field is used then the 'client_certificate' and
            the 'ca_certificate' fields are mandatory. Mutually exclusive with
            the `client_key` field.
          type: string
      type: object
    MostRecentStartPosition:
      description: >-
        CDC strategy to start replicating from the most recent position in the
        source.
      id: MostRecentStartPosition
      properties: {}
      type: object
    MysqlColumn:
      description: MySQL Column.
      id: MysqlColumn
      properties:
        collation:
          description: Column collation.
          type: string
        column:
          description: The column name.
          type: string
        dataType:
          description: >-
            The MySQL data type. Full data types list can be found here:
            https://dev.mysql.com/doc/refman/8.0/en/data-types.html
          type: string
        length:
          description: Column length.
          format: int32
          type: integer
        nullable:
          description: Whether or not the column can accept a null value.
          type: boolean
        ordinalPosition:
          description: The ordinal position of the column in the table.
          format: int32
          type: integer
        precision:
          description: Column precision.
          format: int32
          type: integer
        primaryKey:
          description: Whether or not the column represents a primary key.
          type: boolean
        scale:
          description: Column scale.
          format: int32
          type: integer
      type: object
    MysqlDatabase:
      description: MySQL database.
      id: MysqlDatabase
      properties:
        database:
          description: The database name.
          type: string
        mysqlTables:
          description: Tables in the database.
          items:
            $ref: '#/components/schemas/MysqlTable'
          type: array
      type: object
    MysqlGtidPosition:
      description: MySQL GTID position
      id: MysqlGtidPosition
      properties:
        gtidSet:
          description: Required. The gtid set to start replication from.
          type: string
      type: object
    MysqlLogPosition:
      description: MySQL log position
      id: MysqlLogPosition
      properties:
        logFile:
          description: Required. The binary log file name.
          type: string
        logPosition:
          description: >-
            Optional. The position within the binary log file. Default is head
            of file.
          format: int32
          type: integer
      type: object
    MysqlObjectIdentifier:
      description: Mysql data source object identifier.
      id: MysqlObjectIdentifier
      properties:
        database:
          description: Required. The database name.
          type: string
        table:
          description: Required. The table name.
          type: string
      type: object
    MysqlProfile:
      description: Profile for connecting to a MySQL source.
      id: MysqlProfile
      properties:
        hostname:
          description: Required. Hostname for the MySQL connection.
          type: string
        password:
          description: >-
            Optional. Input only. Password for the MySQL connection. Mutually
            exclusive with the `secret_manager_stored_password` field.
          type: string
        port:
          description: Port for the MySQL connection, default value is 3306.
          format: int32
          type: integer
        secretManagerStoredPassword:
          description: >-
            Optional. A reference to a Secret Manager resource name storing the
            MySQL connection password. Mutually exclusive with the `password`
            field.
          type: string
        sslConfig:
          $ref: '#/components/schemas/MysqlSslConfig'
          description: SSL configuration for the MySQL connection.
        username:
          description: Required. Username for the MySQL connection.
          type: string
      type: object
    MysqlRdbms:
      description: MySQL database structure
      id: MysqlRdbms
      properties:
        mysqlDatabases:
          description: Mysql databases on the server
          items:
            $ref: '#/components/schemas/MysqlDatabase'
          type: array
      type: object
    MysqlSourceConfig:
      description: Configuration for syncing data from a MySQL source.
      id: MysqlSourceConfig
      properties:
        binaryLogPosition:
          $ref: '#/components/schemas/BinaryLogPosition'
          description: Use Binary log position based replication.
        excludeObjects:
          $ref: '#/components/schemas/MysqlRdbms'
          description: The MySQL objects to exclude from the stream.
        gtid:
          $ref: '#/components/schemas/Gtid'
          description: Use GTID based replication.
        includeObjects:
          $ref: '#/components/schemas/MysqlRdbms'
          description: The MySQL objects to retrieve from the source.
        maxConcurrentBackfillTasks:
          description: >-
            Maximum number of concurrent backfill tasks. The number should be
            non negative. If not set (or set to 0), the system's default value
            will be used.
          format: int32
          type: integer
        maxConcurrentCdcTasks:
          description: >-
            Maximum number of concurrent CDC tasks. The number should be non
            negative. If not set (or set to 0), the system's default value will
            be used.
          format: int32
          type: integer
      type: object
    MysqlSslConfig:
      description: MySQL SSL configuration information.
      id: MysqlSslConfig
      properties:
        caCertificate:
          description: >-
            Input only. PEM-encoded certificate of the CA that signed the source
            database server's certificate.
          type: string
        caCertificateSet:
          description: Output only. Indicates whether the ca_certificate field is set.
          readOnly: true
          type: boolean
        clientCertificate:
          description: >-
            Optional. Input only. PEM-encoded certificate that will be used by
            the replica to authenticate against the source database server. If
            this field is used then the 'client_key' and the 'ca_certificate'
            fields are mandatory.
          type: string
        clientCertificateSet:
          description: Output only. Indicates whether the client_certificate field is set.
          readOnly: true
          type: boolean
        clientKey:
          description: >-
            Optional. Input only. PEM-encoded private key associated with the
            Client Certificate. If this field is used then the
            'client_certificate' and the 'ca_certificate' fields are mandatory.
          type: string
        clientKeySet:
          description: Output only. Indicates whether the client_key field is set.
          readOnly: true
          type: boolean
      type: object
    MysqlTable:
      description: MySQL table.
      id: MysqlTable
      properties:
        mysqlColumns:
          description: >-
            MySQL columns in the database. When unspecified as part of
            include/exclude objects, includes/excludes everything.
          items:
            $ref: '#/components/schemas/MysqlColumn'
          type: array
        table:
          description: The table name.
          type: string
      type: object
    NextAvailableStartPosition:
      description: >-
        CDC strategy to resume replication from the next available position in
        the source.
      id: NextAvailableStartPosition
      properties: {}
      type: object
    Oauth2ClientCredentials:
      description: OAuth2 Client Credentials.
      id: Oauth2ClientCredentials
      properties:
        clientId:
          description: Required. Client ID for Salesforce OAuth2 Client Credentials.
          type: string
        clientSecret:
          description: >-
            Optional. Client secret for Salesforce OAuth2 Client Credentials.
            Mutually exclusive with the `secret_manager_stored_client_secret`
            field.
          type: string
        secretManagerStoredClientSecret:
          description: >-
            Optional. A reference to a Secret Manager resource name storing the
            Salesforce OAuth2 client_secret. Mutually exclusive with the
            `client_secret` field.
          type: string
      type: object
    OauthClientCredentials:
      description: OAuth Client Credentials.
      id: OauthClientCredentials
      properties:
        clientId:
          description: Required. Client ID for OAuth Client Credentials.
          type: string
        clientSecret:
          $ref: '#/components/schemas/Secret'
          description: Required. Client secret for OAuth Client Credentials.
      type: object
    OauthRefreshTokenCredentials:
      description: OAuth Refresh Token Credentials.
      id: OauthRefreshTokenCredentials
      properties:
        oauthClientCredentials:
          $ref: '#/components/schemas/OauthClientCredentials'
          description: Required. Specifies the OAuth Client Credentials.
        refreshToken:
          $ref: '#/components/schemas/Secret'
          description: Required. Specifies the OAuth Refresh Token.
      type: object
    ObjectFilter:
      description: Object filter to apply the rules to.
      id: ObjectFilter
      properties:
        sourceObjectIdentifier:
          $ref: '#/components/schemas/SourceObjectIdentifier'
          description: Specific source object identifier.
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
