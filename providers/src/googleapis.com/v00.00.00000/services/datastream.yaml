        clientId:
          description: Required. Client ID for Salesforce OAuth2 Client Credentials.
          type: string
        secretManagerStoredClientSecret:
          description: >-
            Optional. A reference to a Secret Manager resource name storing the
            Salesforce OAuth2 client_secret. Mutually exclusive with the
            `client_secret` field.
          type: string
      id: Oauth2ClientCredentials
      type: object
    SpannerSchema:
      id: SpannerSchema
      type: object
      description: Spanner schema.
      properties:
        tables:
          description: Optional. Spanner tables in the schema.
          type: array
          items:
            $ref: '#/components/schemas/SpannerTable'
        schema:
          description: Required. The schema name.
          type: string
    VpcPeeringConfig:
      description: >-
        The VPC Peering configuration is used to create VPC peering between
        Datastream and the consumer's VPC.
      properties:
        vpc:
          description: >-
            Required. Fully qualified name of the VPC that Datastream will peer
