openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Datastream API
  description: ''
  version: v1
  x-discovery-doc-revision: '20260722'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/datastream/
servers:
  - url: https://datastream.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    SqlServerTable:
      description: SQLServer table.
      properties:
        table:
          type: string
          description: The table name.
        columns:
          description: >-
            SQLServer columns in the schema. When unspecified as part of
            include/exclude objects, includes/excludes everything.
          type: array
          items:
            $ref: '#/components/schemas/SqlServerColumn'
      id: SqlServerTable
      type: object
    MongodbCluster:
      id: MongodbCluster
      type: object
      description: MongoDB Cluster structure.
      properties:
        databases:
          description: MongoDB databases in the cluster.
          type: array
          items:
            $ref: '#/components/schemas/MongodbDatabase'
    OracleScnPosition:
      description: Oracle SCN position
      properties:
        scn:
          format: int64
          type: string
          description: Required. SCN number from where Logs will be read
      id: OracleScnPosition
      type: object
    RuleSet:
      description: A set of rules to apply to a set of objects.
      properties:
        customizationRules:
          description: Required. List of customization rules to apply.
          type: array
          items:
            $ref: '#/components/schemas/CustomizationRule'
        objectFilter:
          description: Required. Object filter to apply the customization rules to.
          $ref: '#/components/schemas/ObjectFilter'
      id: RuleSet
      type: object
    MostRecentStartPosition:
      description: >-
        CDC strategy to start replicating from the most recent position in the
        source.
      properties: {}
      id: MostRecentStartPosition
      type: object
    BackfillAllStrategy:
      id: BackfillAllStrategy
      type: object
      description: >-
        Backfill strategy to automatically backfill the Stream's objects.
        Specific objects can be excluded.
      properties:
        mongodbExcludedObjects:
          description: MongoDB data source objects to avoid backfilling
          $ref: '#/components/schemas/MongodbCluster'
        salesforceExcludedObjects:
          description: Salesforce data source objects to avoid backfilling
          $ref: '#/components/schemas/SalesforceOrg'
        spannerExcludedObjects:
          description: Spanner data source objects to avoid backfilling.
          $ref: '#/components/schemas/SpannerDatabase'
        saasExcludedObjects:
          description: >-
            Source catalog data source objects to avoid backfilling. This is
            mainly used to represent SaaS applications objects.
          $ref: '#/components/schemas/SourceCatalog'
        oracleExcludedObjects:
          description: Oracle data source objects to avoid backfilling.
          $ref: '#/components/schemas/OracleRdbms'
        mysqlExcludedObjects:
          description: MySQL data source objects to avoid backfilling.
          $ref: '#/components/schemas/MysqlRdbms'
        sqlServerExcludedObjects:
          description: SQLServer data source objects to avoid backfilling
          $ref: '#/components/schemas/SqlServerRdbms'
        postgresqlExcludedObjects:
          description: PostgreSQL data source objects to avoid backfilling.
          $ref: '#/components/schemas/PostgresqlRdbms'
    SpannerObjectIdentifier:
      description: Spanner data source object identifier.
      properties:
        schema:
          description: Optional. The schema name.
          type: string
        table:
          type: string
          description: Required. The table name.
      id: SpannerObjectIdentifier
      type: object
    LookupStreamObjectRequest:
      description: >-
        Request for looking up a specific stream object by its source object
        identifier.
      properties:
        sourceObjectIdentifier:
          description: >-
            Required. The source object identifier which maps to the stream
            object.
          $ref: '#/components/schemas/SourceObjectIdentifier'
      id: LookupStreamObjectRequest
      type: object
    BadRequest:
      description: >-
        Describes violations in a client request. This error type focuses on the
        syntactic aspects of the request.
      properties:
        fieldViolations:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
          description: Describes all violations in a client request.
      id: BadRequest
      type: object
    ListConnectionProfilesResponse:
      id: ListConnectionProfilesResponse
      type: object
      description: Response message for listing connection profiles.
      properties:
        unreachable:
          type: array
          items:
            type: string
          description: Locations that could not be reached.
        connectionProfiles:
          description: List of connection profiles.
          type: array
          items:
            $ref: '#/components/schemas/ConnectionProfile'
        nextPageToken:
          type: string
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
    Stream:
      id: Stream
      type: object
      description: A resource representing streaming data from a source to a destination.
      properties:
        displayName:
          type: string
          description: Required. Display name.
        destinationConfig:
          description: Required. Destination connection profile configuration.
          $ref: '#/components/schemas/DestinationConfig'
        backfillAll:
          description: >-
            Automatically backfill objects included in the stream source
            configuration. Specific objects can be excluded.
          $ref: '#/components/schemas/BackfillAllStrategy'
        lastRecoveryTime:
          format: google-datetime
          description: >-
            Output only. If the stream was recovered, the time of the last
            recovery. Note: This field is currently experimental.
          readOnly: true
          type: string
        sourceConfig:
          description: Required. Source connection profile configuration.
          $ref: '#/components/schemas/SourceConfig'
        labels:
          description: Labels.
          type: object
          additionalProperties:
            type: string
        name:
          readOnly: true
          type: string
          description: Output only. Identifier. The stream's name.
        customerManagedEncryptionKey:
          description: >-
            Immutable. A reference to a KMS encryption key. If provided, it will
            be used to encrypt the data. If left blank, data will be encrypted
            using an internal Stream-specific encryption key provisioned through
            KMS.
          type: string
        satisfiesPzi:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        backfillNone:
          description: Do not automatically backfill any objects.
          $ref: '#/components/schemas/BackfillNoneStrategy'
        errors:
          description: Output only. Errors on the Stream.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/Error'
        state:
          description: The state of the stream.
          enumDescriptions:
            - Unspecified stream state.
            - >-
              The stream has been created but has not yet started streaming
              data.
            - The stream is running.
            - The stream is paused.
            - >-
              The stream is in maintenance mode. Updates are rejected on the
              resource in this state.
            - >-
              The stream is experiencing an error that is preventing data from
              being streamed.
            - The stream has experienced a terminal failure.
            - The stream is starting, but not yet running.
            - >-
              The Stream is no longer reading new events, but still writing
              events in the buffer.
          enum:
            - STATE_UNSPECIFIED
            - NOT_STARTED
            - RUNNING
            - PAUSED
            - MAINTENANCE
            - FAILED
            - FAILED_PERMANENTLY
            - STARTING
            - DRAINING
          type: string
        updateTime:
          readOnly: true
          type: string
          description: Output only. The last update time of the stream.
          format: google-datetime
        ruleSets:
          type: array
          items:
            $ref: '#/components/schemas/RuleSet'
          description: Optional. Rule sets to apply to the stream.
        satisfiesPzs:
          readOnly: true
          type: boolean
          description: Output only. Reserved for future use.
        createTime:
          format: google-datetime
          readOnly: true
          type: string
          description: Output only. The creation time of the stream.
    ForwardSshTunnelConnectivity:
      id: ForwardSshTunnelConnectivity
      type: object
      description: Forward SSH Tunnel connectivity.
      properties:
        hostname:
          type: string
          description: Required. Hostname for the SSH tunnel.
        privateKey:
          type: string
          description: Input only. SSH private key.
        password:
          type: string
          description: Input only. SSH password.
        port:
          type: integer
          description: Port for the SSH tunnel, default value is 22.
          format: int32
        username:
          description: Required. Username for the SSH tunnel.
          type: string
    Validation:
      description: A validation to perform on a stream.
      properties:
        description:
          description: A short description of the validation.
          type: string
        state:
          enumDescriptions:
            - Unspecified state.
            - Validation did not execute.
            - Validation failed.
            - Validation passed.
            - Validation executed with warnings.
          readOnly: true
          description: Output only. Validation execution status.
          enum:
            - STATE_UNSPECIFIED
            - NOT_EXECUTED
            - FAILED
            - PASSED
            - WARNING
          type: string
        code:
          description: A custom code identifying this validation.
          type: string
        message:
          type: array
          items:
            $ref: '#/components/schemas/ValidationMessage'
          description: Messages reflecting the validation results.
      id: Validation
      type: object
    SalesforceObjectIdentifier:
      description: Salesforce data source object identifier.
      properties:
        objectName:
          description: Required. The object name.
          type: string
      id: SalesforceObjectIdentifier
      type: object
    Route:
      id: Route
      type: object
      description: >-
        The route resource is the child of the private connection resource, used
        for defining a route for a private connection.
      properties:
        updateTime:
          description: Output only. The update time of the resource.
          readOnly: true
          type: string
          format: google-datetime
        createTime:
          format: google-datetime
          description: Output only. The create time of the resource.
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
          description: Labels.
        destinationPort:
          type: integer
          description: Destination port for connection
          format: int32
        name:
          readOnly: true
          type: string
          description: Output only. Identifier. The resource's name.
        displayName:
          description: Required. Display name.
          type: string
        destinationAddress:
          description: Required. Destination address for connection
          type: string
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      properties: {}
      id: CancelOperationRequest
      type: object
    MysqlRdbms:
      description: MySQL database structure
      properties:
        mysqlDatabases:
          description: Mysql databases on the server
          type: array
          items:
            $ref: '#/components/schemas/MysqlDatabase'
      id: MysqlRdbms
      type: object
    DataverseProfile:
      id: DataverseProfile
      type: object
      description: Profile for connecting to a Dataverse source.
      properties:
        tenantId:
          description: Required. Tenant id of the Microsoft Dataverse instance.
          type: string
        environmentUrl:
          type: string
          description: >-
            Required. Environment URL of the Microsoft Dataverse instance.
            Example: `.crm.dynamics.com`
        oauthClientCredentials:
          description: Required. Credentials for authenticating with the Dataverse API.
          $ref: '#/components/schemas/OauthClientCredentials'
    SalesforceProfile:
      description: Profile for connecting to a Salesforce source.
      properties:
        userCredentials:
          description: >-
            Deprecated: Salesforce is retiring Username-Password authentication.
            Use `oauth2_client_credentials` instead.
          $ref: '#/components/schemas/UserCredentials'
          deprecated: true
        oauth2ClientCredentials:
          description: Connected app authentication.
          $ref: '#/components/schemas/Oauth2ClientCredentials'
        domain:
          type: string
          description: Required. Domain endpoint for the Salesforce connection.
      id: SalesforceProfile
      type: object
    MongodbField:
      id: MongodbField
      type: object
      description: MongoDB Field.
      properties:
        field:
          description: The field name.
          type: string
    ErrorInfo:
      description: >-
        Describes the cause of the error with structured details. Example of an
        error when contacting the "pubsub.googleapis.com" API when it is not
        enabled: { "reason": "API_DISABLED" "domain": "googleapis.com"
        "metadata": { "resource": "projects/123", "service":
        "pubsub.googleapis.com" } } This response indicates that the
        pubsub.googleapis.com API is not enabled. Example of an error that is
        returned when attempting to create a Spanner instance in a region that
        is out of stock: { "reason": "STOCKOUT" "domain":
        "spanner.googleapis.com", "metadata": { "availableRegions":
        "us-central1,us-east2" } }
      properties:
        domain:
          type: string
          description: >-
            The logical grouping to which the "reason" belongs. The error domain
            is typically the registered service name of the tool or product that
            generates the error. Example: "pubsub.googleapis.com". If the error
            is generated by some common infrastructure, the error domain must be
            a globally unique value that identifies the infrastructure. For
            Google API infrastructure, the error domain is "googleapis.com".
        reason:
          type: string
          description: >-
            The reason for the error. This is a constant value that identifies
            the proximate cause of the error. Error reasons are unique within a
            particular domain of errors. This should be at most 63 characters
            and match a regular expression of `A-Z+[A-Z0-9]`, which represents
            UPPER_SNAKE_CASE.
        metadata:
          additionalProperties:
            type: string
          type: object
          description: >-
            Additional structured details about this error. Keys must match a
            regular expression of `a-z+` but should ideally be lowerCamelCase.
            Also, they must be limited to 64 characters in length. When
            identifying the current value of an exceeded limit, the units should
            be contained in the key, not the value. For example, rather than
            `{"instanceLimit": "100/request"}`, should be returned as,
            `{"instanceLimitPerRequest": "100"}`, if the client exceeds the
            number of instances that can be created in a single (batch) request.
      id: ErrorInfo
      type: object
    CdcStrategy:
      description: The strategy that the stream uses for CDC replication.
      properties:
        specificStartPosition:
          description: Optional. Start replicating from a specific position in the source.
          $ref: '#/components/schemas/SpecificStartPosition'
        mostRecentStartPosition:
          description: >-
            Optional. Start replicating from the most recent position in the
            source.
          $ref: '#/components/schemas/MostRecentStartPosition'
        nextAvailableStartPosition:
          description: >-
            Optional. Resume replication from the next available position in the
            source.
          $ref: '#/components/schemas/NextAvailableStartPosition'
      id: CdcStrategy
      type: object
    ListStreamObjectsResponse:
      description: Response containing the objects for a stream.
      properties:
        streamObjects:
          type: array
          items:
            $ref: '#/components/schemas/StreamObject'
          description: List of stream objects.
        nextPageToken:
          type: string
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page.
      id: ListStreamObjectsResponse
      type: object
    SourceConfig:
      description: The configuration of the stream source.
      properties:
        serviceNowSourceConfig:
          description: ServiceNow data source configuration.
          $ref: '#/components/schemas/ServiceNowSourceConfig'
        postgresqlSourceConfig:
          description: PostgreSQL data source configuration.
          $ref: '#/components/schemas/PostgresqlSourceConfig'
        mysqlSourceConfig:
          description: MySQL data source configuration.
          $ref: '#/components/schemas/MysqlSourceConfig'
        spannerSourceConfig:
          description: Spanner data source configuration.
          $ref: '#/components/schemas/SpannerSourceConfig'
        salesforceSourceConfig:
          description: Salesforce data source configuration.
          $ref: '#/components/schemas/SalesforceSourceConfig'
        sourceConnectionProfile:
          type: string
          description: >-
            Required. Source connection profile resource. Format:
            `projects/{project}/locations/{location}/connectionProfiles/{name}`
        oracleSourceConfig:
          description: Oracle data source configuration.
          $ref: '#/components/schemas/OracleSourceConfig'
        mongodbSourceConfig:
          description: MongoDB data source configuration.
          $ref: '#/components/schemas/MongodbSourceConfig'
        salesforceMarketingCloudSourceConfig:
          description: Salesforce Marketing Cloud data source configuration.
          $ref: '#/components/schemas/SalesforceMarketingCloudSourceConfig'
        dataverseSourceConfig:
          description: Dataverse data source configuration.
          $ref: '#/components/schemas/DataverseSourceConfig'
        sqlServerSourceConfig:
          description: SQLServer data source configuration.
          $ref: '#/components/schemas/SqlServerSourceConfig'
        workdaySourceConfig:
          description: Optional. Workday data source configuration.
          $ref: '#/components/schemas/WorkdaySourceConfig'
      id: SourceConfig
      type: object
    Error:
      id: Error
      type: object
      description: Represent a user-facing Error.
      properties:
        message:
          description: A message containing more information about the error that occurred.
          type: string
        details:
          additionalProperties:
            type: string
          description: Additional information about the error.
          type: object
        reason:
          type: string
          description: A title that explains the reason for the error.
        errorUuid:
          description: >-
            A unique identifier for this specific error, allowing it to be
            traced throughout the system in logs and API responses.
          type: string
        errorTime:
          format: google-datetime
          description: The time when the error occurred.
          type: string
    FetchStaticIpsResponse:
      description: Response message for a 'FetchStaticIps' response.
      properties:
        staticIps:
          type: array
          items:
            type: string
          description: list of static ips by account
        nextPageToken:
          type: string
          description: >-
            A token that can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
      id: FetchStaticIpsResponse
      type: object
    StopBackfillJobRequest:
      id: StopBackfillJobRequest
      type: object
      description: >-
        Request for manually stopping a running backfill job for a specific
        stream object.
      properties: {}
    SqlServerSslConfig:
      description: SQL Server SSL configuration information.
      properties:
        encryptionNotEnforced:
          description: >-
            If set, Datastream will not enforce encryption. If the DB server
            mandates encryption, then connection will be encrypted but server
            identity will not be authenticated.
          $ref: '#/components/schemas/EncryptionNotEnforced'
        basicEncryption:
          description: >-
            If set, Datastream will enforce encryption without authenticating
            server identity. Server certificates will be trusted by default.
          $ref: '#/components/schemas/BasicEncryption'
        encryptionAndServerValidation:
          description: >-
            If set, Datastream will enforce encryption and authenticate server
            identity.
          $ref: '#/components/schemas/EncryptionAndServerValidation'
      id: SqlServerSslConfig
      type: object
    RunStreamRequest:
      description: Request message for running a stream.
      properties:
        cdcStrategy:
          description: >-
            Optional. The CDC strategy of the stream. If not set, the system's
            default value will be used.
          $ref: '#/components/schemas/CdcStrategy'
        force:
          type: boolean
          description: Optional. Update the stream without validating it.
      id: RunStreamRequest
      type: object
    SpannerChangeStreamPosition:
      id: SpannerChangeStreamPosition
      type: object
      description: >-
        Represents a position in a Spanner change stream from which to start
        replicating.
      properties:
        startTime:
          format: google-datetime
          type: string
          description: >-
            Required. The timestamp to start change stream queries from. The
            timestamp must be a positive value.
    StopBackfillJobResponse:
      id: StopBackfillJobResponse
      type: object
      description: Response for manually stop a backfill job for a specific stream object.
      properties:
        object:
          description: The stream object resource the backfill job was stopped for.
          $ref: '#/components/schemas/StreamObject'
    UserCredentials:
      deprecated: true
      type: object
      description: >-
        Deprecated: Salesforce is retiring Username-Password authentication. Use
        `Oauth2ClientCredentials` instead.
      properties:
        username:
          type: string
          description: Required. Username for the Salesforce connection.
        secretManagerStoredPassword:
          description: >-
            Optional. A reference to a Secret Manager resource name storing the
            Salesforce connection's password. Mutually exclusive with the
            `password` field.
          type: string
        secretManagerStoredSecurityToken:
          type: string
          description: >-
            Optional. A reference to a Secret Manager resource name storing the
            Salesforce connection's security token. Mutually exclusive with the
            `security_token` field.
        securityToken:
          description: >-
            Optional. Security token for the Salesforce connection. Mutually
            exclusive with the `secret_manager_stored_security_token` field.
          type: string
        password:
          description: >-
            Optional. Password for the Salesforce connection. Mutually exclusive
            with the `secret_manager_stored_password` field.
          type: string
      id: UserCredentials
    MongodbProfile:
      id: MongodbProfile
      type: object
      description: Profile for connecting to a MongoDB source.
      properties:
        srvConnectionFormat:
          description: Srv connection format.
          $ref: '#/components/schemas/SrvConnectionFormat'
        secretManagerStoredPassword:
          description: >-
            Optional. A reference to a Secret Manager resource name storing the
            SQLServer connection password. Mutually exclusive with the
            `password` field.
          type: string
        username:
          type: string
          description: Required. Username for the MongoDB connection.
        password:
          description: >-
            Optional. Password for the MongoDB connection. Mutually exclusive
            with the `secret_manager_stored_password` field.
          type: string
        replicaSet:
          type: string
          description: >-
            Optional. Name of the replica set. Only needed for self hosted
            replica set type MongoDB cluster. For SRV connection format, this
            field must be empty. For Standard connection format, this field must
            be specified.
        sslConfig:
          description: Optional. SSL configuration for the MongoDB connection.
          $ref: '#/components/schemas/MongodbSslConfig'
        additionalOptions:
          description: >-
            Optional. Specifies additional options for the MongoDB connection.
            The options should be sent as key-value pairs, for example:
            `additional_options = {"serverSelectionTimeoutMS": "10000",
            "directConnection": "true"}`. Keys are case-sensitive and should
            match the official MongoDB connection string options:
            https://www.mongodb.com/docs/manual/reference/connection-string-options/
            The server will not modify the values provided by the user.
          type: object
          additionalProperties:
            type: string
        standardConnectionFormat:
          description: Standard connection format.
          $ref: '#/components/schemas/StandardConnectionFormat'
        hostAddresses:
          description: >-
            Required. List of host addresses for a MongoDB cluster. For SRV
            connection format, this list must contain exactly one DNS host
            without a port. For Standard connection format, this list must
            contain all the required hosts in the cluster with their respective
            ports.
          type: array
          items:
            $ref: '#/components/schemas/HostAddress'
    FieldViolation:
      description: A message type used to describe a single bad request field.
      properties:
        field:
          description: >-
            A path that leads to a field in the request body. The value will be
            a sequence of dot-separated identifiers that identify a protocol
            buffer field. Consider the following: message CreateContactRequest {
            message EmailAddress { enum Type { TYPE_UNSPECIFIED = 0; HOME = 1;
            WORK = 2; } optional string email = 1; repeated EmailType type = 2;
            } string full_name = 1; repeated EmailAddress email_addresses = 2; }
            In this example, in proto `field` could take one of the following
            values: * `full_name` for a violation in the `full_name` value *
            `email_addresses[0].email` for a violation in the `email` field of
            the first `email_addresses` message * `email_addresses[2].type[1]`
            for a violation in the second `type` value in the third
            `email_addresses` message. In JSON, the same values are represented
            as: * `fullName` for a violation in the `fullName` value *
            `emailAddresses[0].email` for a violation in the `email` field of
            the first `emailAddresses` message * `emailAddresses[2].type[1]` for
            a violation in the second `type` value in the third `emailAddresses`
            message.
          type: string
        description:
          type: string
          description: A description of why the request element is bad.
        localizedMessage:
          description: >-
            Provides a localized error message for field-level errors that is
            safe to return to the API consumer.
          $ref: '#/components/schemas/LocalizedMessage'
        reason:
          description: >-
            The reason for the field-level error. This is a constant value that
            identifies the proximate cause of the field-level error. It should
            uniquely identify the type of the FieldViolation within the scope of
            the google.rpc.ErrorInfo.domain. This should be at most 63
            characters and match a regular expression of `A-Z+[A-Z0-9]`, which
            represents UPPER_SNAKE_CASE.
          type: string
      id: FieldViolation
      type: object
    Link:
      description: Describes a URL link.
      properties:
        description:
          type: string
          description: Describes what the link offers.
        url:
          type: string
          description: The URL of the link.
      id: Link
      type: object
    BlmtConfig:
      description: The configuration for BLMT.
      properties:
        rootPath:
          description: The root path inside the Cloud Storage bucket.
          type: string
        bucket:
          type: string
          description: Required. The Cloud Storage bucket name.
        tableFormat:
          type: string
          description: Required. The table format.
          enumDescriptions:
            - Default value.
            - Iceberg table format.
          enum:
            - TABLE_FORMAT_UNSPECIFIED
            - ICEBERG
        connectionName:
          type: string
          description: >-
            Required. The bigquery connection. Format:
            `{project}.{location}.{name}`
        fileFormat:
          type: string
          description: Required. The file format.
