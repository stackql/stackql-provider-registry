        username:
          type: string
          description: Required. Username for the MySQL connection.
      id: MysqlProfile
      type: object
    SqlServerColumn:
      id: SqlServerColumn
      type: object
      description: SQLServer Column.
      properties:
        primaryKey:
          description: Whether or not the column represents a primary key.
          type: boolean
        dataType:
          type: string
          description: The SQLServer data type.
        length:
          description: Column length.
          type: integer
          format: int32
        nullable:
          description: Whether or not the column can accept a null value.
          type: boolean
        ordinalPosition:
          format: int32
          description: The ordinal position of the column in the table.
          type: integer
        column:
          type: string
          description: The column name.
        precision:
          type: integer
          description: Column precision.
          format: int32
        scale:
          type: integer
          description: Column scale.
          format: int32
    DatasetTemplate:
      description: Dataset template used for dynamic dataset creation.
      properties:
        datasetIdPrefix:
          description: >-
            If supplied, every created dataset will have its name prefixed by
            the provided value. The prefix and name will be separated by an
            underscore. i.e. _.
          type: string
        location:
          type: string
          description: >-
            Required. The geographic location where the dataset should reside.
            See https://cloud.google.com/bigquery/docs/locations for supported
            locations.
        kmsKeyName:
          description: >-
            Describes the Cloud KMS encryption key that will be used to protect
            destination BigQuery table. The BigQuery Service Account associated
            with your project requires access to this encryption key. i.e.
            projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{cryptoKey}.
            See
            https://cloud.google.com/bigquery/docs/customer-managed-encryption
            for more information.
          type: string
      id: DatasetTemplate
      type: object
    ServiceNowProfile:
      id: ServiceNowProfile
      type: object
      description: Profile for connecting to a ServiceNow source.
      properties:
        instance:
          description: >-
            Required. The instance of the ServiceNow account. This is the ``
            part of the URL `https://.service-now.com`.
          type: string
        oauthClientCredentials:
          description: Credentials for authenticating with the ServiceNow API.
          $ref: '#/components/schemas/OauthClientCredentials'
        userPasswordCredentials:
          description: User-password authentication.
          $ref: '#/components/schemas/UserPasswordCredentials'
    HostAddress:
      id: HostAddress
      type: object
      description: >-
        A HostAddress represents a transport end point, which is the combination
        of an IP address or hostname and a port number.
      properties:
        port:
          description: Optional. Port for the connection.
          type: integer
          format: int32
        hostname:
          description: Required. Hostname for the connection.
          type: string
    StaticServiceIpConnectivity:
      id: StaticServiceIpConnectivity
      type: object
      description: >-
        Static IP address connectivity. Used when the source database is
        configured to allow incoming connections from the Datastream public IP
        addresses for the region specified in the connection profile.
      properties: {}
    UserPasswordCredentials:
      id: UserPasswordCredentials
      type: object
      description: User-password credentials.
      properties:
        password:
          description: Required. Password for the connection.
          $ref: '#/components/schemas/Secret'
        username:
          description: Required. Username for the connection.
          type: string
    SourceObject:
      description: Source object.
      properties:
        properties:
          type: array
          items:
            $ref: '#/components/schemas/SourceProperty'
          description: >-
            Optional. Source properties. When unspecified as part of include
            objects, includes everything, when unspecified as part of exclude
            objects, excludes nothing.
        objectName:
          description: Required. The object name.
          type: string
      id: SourceObject
      type: object
    IngestionTimePartition:
      id: IngestionTimePartition
      type: object
      description: >-
        Ingestion time partitioning. see
        https://cloud.google.com/bigquery/docs/partitioned-tables#ingestion_time
      properties:
        partitioningTimeGranularity:
          type: string
          description: Optional. Partition granularity
          enumDescriptions:
            - Unspecified partitioing interval.
            - Hourly partitioning.
            - Daily partitioning.
            - Monthly partitioning.
            - Yearly partitioning.
          enum:
            - PARTITIONING_TIME_GRANULARITY_UNSPECIFIED
            - PARTITIONING_TIME_GRANULARITY_HOUR
            - PARTITIONING_TIME_GRANULARITY_DAY
            - PARTITIONING_TIME_GRANULARITY_MONTH
            - PARTITIONING_TIME_GRANULARITY_YEAR
    MysqlObjectIdentifier:
      description: Mysql data source object identifier.
      properties:
        database:
          description: Required. The database name.
          type: string
        table:
          type: string
          description: Required. The table name.
      id: MysqlObjectIdentifier
      type: object
    ServerAndClientVerification:
      description: >-
        Message represents the option where Datastream will enforce the
        encryption and authenticate the server identity as well as the client
        identity. ca_certificate, client_certificate and client_key must be set
        if user selects this option.
      properties:
        caCertificate:
          description: Required. Input only. PEM-encoded server root CA certificate.
          type: string
        serverCertificateHostname:
          type: string
          description: >-
            Optional. The hostname mentioned in the Subject or SAN extension of
            the server certificate. If this field is not provided, the hostname
            in the server certificate is not validated.
        clientCertificate:
          type: string
          description: >-
            Required. Input only. PEM-encoded certificate used by the source
            database to authenticate the client identity (i.e., the Datastream's
            identity). This certificate is signed by either a root certificate
            trusted by the server or one or more intermediate certificates
            (which is stored with the leaf certificate) to link the this
            certificate to the trusted root certificate.
        clientKey:
          description: >-
            Optional. Input only. PEM-encoded private key associated with the
            client certificate. This value will be used during the SSL/TLS
            handshake, allowing the PostgreSQL server to authenticate the
            client's identity, i.e. identity of the Datastream.
          type: string
      id: ServerAndClientVerification
      type: object
    OracleRdbms:
      id: OracleRdbms
      type: object
      description: Oracle database structure.
      properties:
        oracleSchemas:
          description: Oracle schemas/databases in the database server.
          type: array
          items:
            $ref: '#/components/schemas/OracleSchema'
    OracleAsmLogFileAccess:
      id: OracleAsmLogFileAccess
      type: object
      description: Configuration to use Oracle ASM to access the log files.
      properties: {}
    EventFilter:
      description: Represents a filter for included data on a stream object.
      properties:
        sqlWhereClause:
          type: string
          description: >-
            An SQL-query Where clause selecting which data should be included,
            not including the "WHERE" keyword. e.g., `t.key1 = 'value1' AND
            t.key2 = 'value2'`
      id: EventFilter
      type: object
    GcsDestinationConfig:
      description: Google Cloud Storage destination configuration
      properties:
        avroFileFormat:
          description: AVRO file format configuration.
          $ref: '#/components/schemas/AvroFileFormat'
        jsonFileFormat:
          description: JSON file format configuration.
          $ref: '#/components/schemas/JsonFileFormat'
        path:
          description: Path inside the Cloud Storage bucket to write data to.
          type: string
        fileRotationMb:
          type: integer
          description: The maximum file size to be saved in the bucket.
          format: int32
        fileRotationInterval:
          description: >-
            The maximum duration for which new events are added before a file is
            closed and a new file is created. Values within the range of 15-60
            seconds are allowed.
          type: string
          format: google-duration
      id: GcsDestinationConfig
      type: object
    ConnectionProfile:
      description: >-
