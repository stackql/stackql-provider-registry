      id: StreamLargeObjects
      type: object
    SingleTargetDataset:
      id: SingleTargetDataset
      type: object
      description: A single target dataset to which all data will be streamed.
      properties:
        datasetId:
          description: >-
            The dataset ID of the target dataset. DatasetIds allowed characters:
            https://cloud.google.com/bigquery/docs/reference/rest/v2/datasets#datasetreference.
          type: string
    RequestInfo:
      description: >-
        Contains metadata about the request that clients can attach when filing
        a bug or providing other forms of feedback.
      properties:
        requestId:
          type: string
          description: >-
            An opaque string that should only be interpreted by the service
            generating it. For example, it can be used to identify requests in
            the service's logs.
        servingData:
          description: >-
            Any data that was used to serve this request. For example, an
            encrypted stack trace that can be sent back to the service provider
            for debugging.
          type: string
      id: RequestInfo
      type: object
    Oauth2ClientCredentials:
      description: OAuth2 Client Credentials.
      properties:
        clientSecret:
          type: string
          description: >-
            Optional. Client secret for Salesforce OAuth2 Client Credentials.
            Mutually exclusive with the `secret_manager_stored_client_secret`
