components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AggregatedData:
      description: Aggregated data for the RegistryBook.
      id: AggregatedData
      properties:
        customRangesCount:
          description: Output only. Number of CustomRanges in the RegistryBook.
          format: int32
          readOnly: true
          type: integer
        customRealmsCount:
          description: Output only. Number of custom Realms in the RegistryBook.
          format: int32
          readOnly: true
          type: integer
        discoveredRangesCount:
          description: Output only. Number of DiscoveredRanges in the RegistryBook.
          format: int32
          readOnly: true
          type: integer
        discoveredRealmsCount:
          description: Output only. Number of discovered Realms in the RegistryBook.
          format: int32
          readOnly: true
          type: integer
        uniqueScopesCount:
          description: Output only. Number of scopes unique to the RegistryBook.
          format: int32
          readOnly: true
          type: integer
      type: object
    Attribute:
      description: >-
        A key-value pair representing a custom attribute associated with a
        resource.
      id: Attribute
      properties:
        key:
          description: Required. The key of the attribute.
          type: string
        value:
          description: Required. The value of the attribute.
          type: string
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    CheckAvailabilityIpamAdminScopesResponse:
      description: >-
        Response message for the
        CloudNumberRegistry.CheckAvailabilityIpamAdminScopes method.
      id: CheckAvailabilityIpamAdminScopesResponse
      properties:
        scopeAvailabilities:
          description: The details of the requested scopes.
          items:
            $ref: '#/components/schemas/IpamAdminScopeAvailability'
          type: array
      type: object
    CleanupIpamAdminScopeRequest:
      description: >-
        Request message for the CloudNumberRegistry.CleanupIpamAdminScope
        method.
      id: CleanupIpamAdminScopeRequest
      properties:
        requestId:
          description: >-
            Optional. An optional request ID to identify requests. Specify a
            unique request ID so that if you must retry your request, the server
            will know to ignore the request if it has already been completed.
            The server will guarantee that for at least 60 minutes after the
            first request. For example, consider a situation where you make an
            initial request and the request times out. If you make the request
            again with the same request ID, the server can check if original
            operation with the same request ID was received, and if so, will
            ignore the second request. This prevents clients from accidentally
            creating duplicate commitments. The request ID must be a valid UUID
            with the exception that zero UUID is not supported
            (00000000-0000-0000-0000-000000000000).
          type: string
      type: object
    CustomRange:
      description: A CustomRange represents a user-defined IP address range.
      id: CustomRange
      properties:
        attributes:
          description: Optional. The attributes of the CustomRange.
          items:
            $ref: '#/components/schemas/Attribute'
          type: array
        description:
          description: Optional. The description of the CustomRange.
          type: string
        ipv4CidrRange:
          description: Optional. The IPv4 CIDR range of the CustomRange.
          type: string
        ipv6CidrRange:
          description: Optional. The IPv6 CIDR range of the CustomRange.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels.
          type: object
        name:
          description: >-
            Required. Identifier. The resource name of the CustomRange, in the
            format
            `projects/{project}/locations/{location}/customRanges/{custom_range}`.
          type: string
        parentRange:
          description: >-
            Optional. The resource name of the parent CustomRange, in the format
            `projects/{project}/locations/{location}/customRanges/{custom_range}`.
            If specified, the parent CustomRange must be in the same
            RegistryBook. This field is mutually exclusive with the `realm`
            field, as the Realm is inherited from the parent CustomRange.
          type: string
        realm:
          description: >-
            Optional. The resource name of the Realm associated with the
            CustomRange, in the format
            `projects/{project}/locations/{location}/realms/{realm}`. The Realm
            must be in the same project as the CustomRange. This field must not
            be set if the `parent_range` field is set, as the Realm will be
            inherited from the parent CustomRange.
          type: string
        registryBook:
          description: >-
            Output only. The RegistryBook of the CustomRange. This field is
            inherited from the Realm or parent CustomRange depending on which
            one is specified.
          readOnly: true
          type: string
      type: object
    DisableIpamAdminScopeRequest:
      description: >-
        Request message for the CloudNumberRegistry.DisableIpamAdminScope
        method.
      id: DisableIpamAdminScopeRequest
      properties:
        requestId:
          description: >-
            Optional. An optional request ID to identify requests. Specify a
            unique request ID so that if you must retry your request, the server
            will know to ignore the request if it has already been completed.
            The server will guarantee that for at least 60 minutes after the
            first request. For example, consider a situation where you make an
            initial request and the request times out. If you make the request
            again with the same request ID, the server can check if original
            operation with the same request ID was received, and if so, will
            ignore the second request. This prevents clients from accidentally
            creating duplicate commitments. The request ID must be a valid UUID
            with the exception that zero UUID is not supported
            (00000000-0000-0000-0000-000000000000).
          type: string
      type: object
    DiscoveredRange:
      description: >-
        A DiscoveredRange represents an IP address range automatically detected
        by the discovery pipeline.
      id: DiscoveredRange
      properties:
        attributes:
          description: Optional. The attributes of the DiscoveredRange.
          items:
            $ref: '#/components/schemas/Attribute'
          type: array
        childCidrOverlapAllowed:
          description: >-
            Output only. If true, allows child DiscoveredRanges of this
            DiscoveredRange to overlap with each other.
          readOnly: true
          type: boolean
        createTime:
          description: Output only. The time at which the DiscoveredRange was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the DiscoveredRange.
          type: string
        discoveryMetadata:
          $ref: '#/components/schemas/DiscoveryMetadata'
          description: >-
            Output only. Owner metadata for this DiscoveredRange. A unique set
            of metadata is associated with each DiscoveredRange. If an IP range
            is shared by multiple resources (e.g., an Address resource and an
            Instance resource, or multiple ForwardingRules),separate
            DiscoveredRanges are created, each with a distinct owner. This
            ensures each DiscoveredRange has its own unique set of attributes,
            labels, create time and update time.
          readOnly: true
        ipv4CidrRange:
          description: Optional. The IPv4 CIDR range of the DiscoveredRange.
          type: string
        ipv6CidrRange:
          description: Optional. The IPv6 CIDR range of the DiscoveredRange.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels.
          type: object
        name:
          description: >-
            Required. Identifier. The resource name of the DiscoveredRange, in
            the format
            `projects/{project}/locations/{location}/discoveredRanges/{discovered_range}`.
          type: string
        parentRange:
          description: >-
            Optional. The resource name of the parent DiscoveredRange, in the
            format
            `projects/{project}/locations/{location}/discoveredRanges/{discovered_range}`.
          type: string
        realm:
          description: Optional. The Realm of the DiscoveredRange.
          type: string
        registryBook:
          description: Output only. The RegistryBook of the DiscoveredRange.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time at which the DiscoveredRange was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    DiscoveryMetadata:
      description: >-
        Metadata about a discovered resource, tracking event times, state, and
        source information.
      id: DiscoveryMetadata
      properties:
        createTime:
          description: Output only. The time when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        eventTime:
          description: Output only. The time when the event happened.
          format: google-datetime
          readOnly: true
          type: string
        resource:
          description: >-
            Output only. The resource name of the discovered resource, should be
            API-agnostic. Example:
            "projects/{project_number}/networks/{network_id}".
          readOnly: true
          type: string
        resourceUri:
          description: Output only. The resource uri of the discovered resource.
          readOnly: true
          type: string
        sourceId:
          description: >-
            Output only. The canonical google.aip.dev/122 name of the source
            resource.
          readOnly: true
          type: string
        sourceSubId:
          description: >-
            Output only. A single source resource can be the source of multiple
            CNR resources. This sub_id is used to distinguish between the
            different CNR resources derived from the same upstream resource. For
            example, a single subnetwork can be the source of multiple Ranges,
            one for each protocol. In this case, the sub_id could be
            "private-ipv4" or "private-ipv6".
          readOnly: true
          type: string
        state:
          description: Output only. The state of the resource.
          enum:
            - RESOURCE_STATE_UNSPECIFIED
            - INVALID
            - EXISTS
            - DOES_NOT_EXIST
            - ERROR
          enumDescriptions:
            - Unspecified state.
            - The resource is in an invalid state.
            - >-
              The resource exists in the backing store (is not tombstoned or
              completely missing) and there were no failures reading out the
              resource level metadata.
            - Resource does not exist or has been deleted or soft-deleted.
            - There was an error reading out the resource level metadata.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the resource was last modified.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    FindCustomRangeFreeIpRangesResponse:
      description: >-
        Response message for the CloudNumberRegistry.FindCustomRangeFreeIpRanges
        method.
      id: FindCustomRangeFreeIpRangesResponse
      properties:
        freeIpCidrRanges:
          description: Output only. The free IP CIDR ranges found.
          items:
            type: string
          readOnly: true
          type: array
      type: object
    FindDiscoveredRangeFreeIpRangesResponse:
      description: >-
        Response message for the
        CloudNumberRegistry.FindDiscoveredRangeFreeIpRanges method.
      id: FindDiscoveredRangeFreeIpRangesResponse
      properties:
        freeIpCidrRanges:
          description: Output only. The free IP CIDR ranges found.
          items:
            type: string
          readOnly: true
          type: array
      type: object
    IpamAdminScope:
      description: >-
        An IpamAdminScope defines the administrative boundary for IP address
        discovery and management. It configures which platforms and
        organizational scopes are enabled for IP tracking.
      id: IpamAdminScope
      properties:
        createTime:
          description: Output only. The time at which the IpamAdminScope was created.
          format: google-datetime
          readOnly: true
          type: string
        enabledAddonPlatforms:
          description: >-
            Required. Add-on platforms that are enabled for this IpamAdminScope.
            Cloud Number Registry only discovers the IP addresses from the
            enabled platforms.
          items:
            enum:
              - ADD_ON_PLATFORM_UNSPECIFIED
              - COMPUTE_ENGINE
              - GCE
            enumDeprecated:
              - false
              - false
              - true
            enumDescriptions:
              - Unspecified add-on platform.
              - Google Compute Engine.
              - 'Deprecated: Use COMPUTE_ENGINE instead.'
            type: string
          type: array
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels.
          type: object
        name:
          description: Required. Identifier. The resource name of the IpamAdminScope.
          type: string
        scopes:
          description: >-
            Required. Administrative scopes enabled for IP address discovery and
            management. For example, "organizations/1234567890". Minimum of 1
            scope is required. In preview, only one organization scope is
            allowed.
          items:
            type: string
          type: array
        state:
          description: Output only. State of resource discovery pipeline.
          enum:
            - DISCOVERY_PIPELINE_STATE_UNSPECIFIED
            - INTERNAL_FAILURE
            - FAILED
            - SETUP_IN_PROGRESS
            - READY_FOR_USE
            - DELETING_IN_PROGRESS
            - UPDATING
            - RECOVERING
            - DISABLED
            - DELETION_COMPLETED
            - CLEANUP_IN_PROGRESS
            - READY_FOR_DELETION
          enumDescriptions:
            - Unspecified state.
            - Internal failure.
            - Failure.
            - Setup in progress.
            - Ready for use.
            - Deleting in progress.
            - Updating.
            - Recovering.
            - Disabled.
            - Deleting completed.
            - Cleanup in progress.
            - Ready for deletion.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time at which the IpamAdminScope was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    IpamAdminScopeAvailability:
      description: Availability details for a specific IpamAdminScope.
      id: IpamAdminScopeAvailability
      properties:
        adminProject:
          description: The admin project of the IpamAdminScope if it exists.
          format: int64
          type: string
        availability:
          description: The availability of the scope.
          enum:
            - AVAILABILITY_UNSPECIFIED
            - AVAILABLE
            - UNAVAILABLE
          enumDescriptions:
            - Unspecified availability.
            - The scope is available.
            - The scope is not available.
          type: string
        scope:
          description: The scope of the IpamAdminScope.
          type: string
      type: object
    ListCustomRangesResponse:
      description: Response message for the CloudNumberRegistry.ListCustomRanges method.
      id: ListCustomRangesResponse
      properties:
        customRanges:
          description: The list of CustomRanges.
          items:
            $ref: '#/components/schemas/CustomRange'
          type: array
        nextPageToken:
          description: >-
            A token to retrieve the next page of results, or empty if there are
            no more results in the list.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListDiscoveredRangesResponse:
      description: >-
        Response message for the CloudNumberRegistry.ListDiscoveredRanges
        method.
      id: ListDiscoveredRangesResponse
      properties:
        discoveredRanges:
          description: The list of DiscoveredRanges.
          items:
            $ref: '#/components/schemas/DiscoveredRange'
          type: array
        nextPageToken:
          description: >-
            A token to retrieve the next page of results, or empty if there are
            no more results in the list.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListIpamAdminScopesResponse:
      description: Response message for the CloudNumberRegistry.ListIpamAdminScopes method.
      id: ListIpamAdminScopesResponse
      properties:
        ipamAdminScopes:
          description: The list of IpamAdminScopes.
          items:
            $ref: '#/components/schemas/IpamAdminScope'
          type: array
        nextPageToken:
          description: >-
            A token to retrieve the next page of results, or empty if there are
            no more results in the list.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    ListRealmsResponse:
      description: Response message for the CloudNumberRegistry.ListRealms method.
      id: ListRealmsResponse
      properties:
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
        realms:
          description: The list of Realms.
          items:
            $ref: '#/components/schemas/Realm'
          type: array
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListRegistryBooksResponse:
      description: Response message for the CloudNumberRegistry.ListRegistryBooks method.
      id: ListRegistryBooksResponse
      properties:
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
        registryBooks:
          description: The list of RegistryBook
          items:
            $ref: '#/components/schemas/RegistryBook'
          type: array
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have Operation.error value with a google.rpc.Status.code of 1,
            corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        statusMessage:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    Range:
      description: Represents either a CustomRange or a DiscoveredRange.
      id: Range
      properties:
        customRange:
          $ref: '#/components/schemas/CustomRange'
          description: A CustomRange.
        discoveredRange:
          $ref: '#/components/schemas/DiscoveredRange'
          description: A DiscoveredRange.
        utilization:
          $ref: '#/components/schemas/RangeUtilization'
          description: The utilization of the Range.
      type: object
    RangeUtilization:
      description: >-
        Utilization metrics for an IP Range, including consumed and produced
        address counts.
      id: RangeUtilization
      properties:
        totalConsumed:
          description: Output only. The total number of IP addresses consumed in the Range.
          readOnly: true
          type: string
        totalProduced:
          description: Output only. The total number of IP addresses produced in the Range.
          readOnly: true
          type: string
        usage:
          description: >-
            Output only. The usage of the Range as a percentage. This is marked
            as optional so that we have presence tracking and API responses show
            0.0 instead of NULL.
          format: double
          readOnly: true
          type: number
      type: object
    Realm:
      description: >-
        A Realm represents a distinct network domain or security zone. It groups
        Ranges that share the same traffic and management characteristics. All
        the ranges in a Realm are routable to each other, meaning that they
        cannot overlap.
      id: Realm
      properties:
        aggregatedData:
          $ref: '#/components/schemas/RealmAggregatedData'
          description: >-
            Output only. Aggregated data for the Realm. Populated only when the
            view is AGGREGATE.
          readOnly: true
        createTime:
          description: Output only. The time at which the Realm was created.
          format: google-datetime
          readOnly: true
          type: string
        discoveryMetadata:
          $ref: '#/components/schemas/DiscoveryMetadata'
          description: Output only. Discovery metadata of the Realm.
          readOnly: true
        ipVersion:
          description: Optional. IP version of the Realm.
          enum:
            - IP_VERSION_UNSPECIFIED
            - IPV4
            - IPV6
          enumDescriptions:
            - Unspecified IP version.
            - IPv4 IP version.
            - IPv6 IP version.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels.
          type: object
        managementType:
          description: Optional. Management type of the Realm.
          enum:
            - MANAGEMENT_TYPE_UNSPECIFIED
            - CNR
            - USER
          enumDescriptions:
            - Unspecified management type.
            - Managed by Cloud Number Registry.
            - Managed by User.
          type: string
        name:
          description: Required. Identifier. The resource name of the Realm.
          type: string
