paths:
  /v1alpha/projects/{projectsId}/locations:
    get:
      description: >-
        Lists information about the supported locations for this service. This
        method lists locations based on the resource scope provided in the
        ListLocationsRequest.name field: * **Global locations**: If `name` is
        empty, the method lists the public locations available to all projects.
        * **Project-specific locations**: If `name` follows the format
        `projects/{project}`, the method lists locations visible to that
        specific project. This includes public, private, or other
        project-specific locations enabled for the project. For gRPC and client
        library implementations, the resource name is passed as the `name`
        field. For direct service calls, the resource name is incorporated into
        the request path based on the specific service implementation and
        version.
      operationId: cloudnumberregistry.projects.locations.list
      parameters:
        - in: path
          name: projectsId
          required: true
          schema:
            type: string
        - in: query
          name: extraLocationTypes
          schema:
            type: string
        - in: query
          name: filter
          schema:
            type: string
        - in: query
          name: pageSize
          schema:
            format: int32
            type: integer
        - in: query
          name: pageToken
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLocationsResponse'
          description: Successful response
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
    parameters: &ref_1
      - $ref: '#/components/parameters/_.xgafv'
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/alt'
      - $ref: '#/components/parameters/callback'
