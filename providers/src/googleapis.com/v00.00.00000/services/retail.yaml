    GoogleCloudRetailV2betaSetInventoryResponse:
      properties: {}
      description: >-
        Response of the SetInventoryRequest. Currently empty because there is no
        meaningful response populated from the ProductService.SetInventory
        method.
      id: GoogleCloudRetailV2betaSetInventoryResponse
      type: object
    GoogleCloudRetailV2RulePinAction:
      id: GoogleCloudRetailV2RulePinAction
      type: object
      properties:
        pinMap:
          description: >-
            Required. A map of positions to product_ids. Partial matches per
            action are allowed, if a certain position in the map is already
            filled that `[position, product_id]` pair will be ignored but the
            rest may still be applied. This case will only occur if multiple pin
            actions are matched to a single request, as the map guarantees that
            pin positions are unique within the same action. Duplicate
            product_ids are not permitted within a single pin map. The max size
            of this map is 120, equivalent to the max [request page
            size](https://cloud.google.com/retail/docs/reference/rest/v2/projects.locations.catalogs.placements/search#request-body).
          type: object
          additionalProperties:
            type: string
      description: >-
        Pins one or more specified products to a specific position in the
        results. * Rule Condition: Must specify non-empty Condition.query_terms
        (for search only) or Condition.page_categories (for browse only), but
        can't specify both. * Action Input: mapping of `[pin_position,
        product_id]` pairs (pin position uses 1-based indexing). * Action
        Result: Will pin products with matching ids to the position specified in
        the final result order. Example: Suppose the query is `shoes`, the
        Condition.query_terms is `shoes` and the pin_map has `{1, "pid1"}`, then
        product with `pid1` will be pinned to the top position in the final
        results. If multiple PinActions are matched to a single request the
        actions will be processed from most to least recently updated. Pins to
        positions larger than the max allowed page size of 120 are not allowed.
    GoogleCloudRetailV2alphaRejoinUserEventsResponse:
      id: GoogleCloudRetailV2alphaRejoinUserEventsResponse
      type: object
      description: Response message for `RejoinUserEvents` method.
      properties:
        rejoinedUserEventsCount:
          description: Number of user events that were joined with latest product catalog.
          format: int64
          type: string
    GoogleCloudRetailV2alphaUserEventImportSummary:
