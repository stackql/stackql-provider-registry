          description: >-
            Count of user events imported with complete existing catalog
            information.
          format: int64
          type: string
        unjoinedEventsCount:
          type: string
          format: int64
          description: >-
            Count of user events imported, but with catalog information not
            found in the imported catalog.
    GoogleCloudRetailV2betaExportAnalyticsMetricsResponse:
      description: >-
        Response of the ExportAnalyticsMetricsRequest. If the long running
