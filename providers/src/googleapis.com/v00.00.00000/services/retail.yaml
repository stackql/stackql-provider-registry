        Currently empty because there is no meaningful metadata populated from
        the ProductService.AddFulfillmentPlaces method.
      properties: {}
    GoogleCloudRetailV2ImportErrorsConfig:
      id: GoogleCloudRetailV2ImportErrorsConfig
      type: object
      properties:
        gcsPrefix:
          description: >-
            Google Cloud Storage prefix for import errors. This must be an
            empty, existing Cloud Storage directory. Import errors are written
            to sharded files in this directory, one per line, as a JSON-encoded
            `google.rpc.Status` message.
          type: string
      description: Configuration of destination for Import related errors.
    GoogleCloudRetailV2RuleForceReturnFacetAction:
      description: >-
        Force returns an attribute/facet in the request around a certain
        position or above. * Rule Condition: Must specify non-empty
        Condition.query_terms (for search only) or Condition.page_categories
        (for browse only), but can't specify both. * Action Inputs: attribute
        name, position * Action Result: Will force return a facet key around a
        certain position or above if the condition is satisfied. Example:
        Suppose the query is "shoes", the Condition.query_terms is "shoes", the
        ForceReturnFacetAction.FacetPositionAdjustment.attribute_name is "size"
        and the ForceReturnFacetAction.FacetPositionAdjustment.position is 8.
        Two cases: a) The facet key "size" is not already in the top 8 slots,
        then the facet "size" will appear at a position close to 8. b) The facet
        key "size" in among the top 8 positions in the request, then it will
        stay at its current rank.
      properties:
        facetPositionAdjustments:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2RuleForceReturnFacetActionFacetPositionAdjustment
          description: >-
            Each instance corresponds to a force return attribute for the given
            condition. There can't be more 15 instances here.
      id: GoogleCloudRetailV2RuleForceReturnFacetAction
      type: object
    GoogleCloudRetailV2RuleIgnoreAction:
      properties:
        ignoreTerms:
          type: array
          items:
            type: string
          description: Terms to ignore in the search query.
      description: >-
        Prevents a term in the query from being used in search. Example: Don't
        search for "shoddy".
      id: GoogleCloudRetailV2RuleIgnoreAction
      type: object
    GoogleCloudRetailV2ConversationalSearchResponseRefinedSearch:
      description: >-
        The proposed refined search for intent-refinement/bundled shopping
        conversation. When using CONVERSATIONAL_FILTER_ONLY mode, the
        refined_query from search response will be populated here.
      properties:
        query:
          description: The query to be used for search.
          type: string
      id: GoogleCloudRetailV2ConversationalSearchResponseRefinedSearch
      type: object
    GoogleCloudRetailV2alphaPurgeMetadata:
      description: >-
        Metadata related to the progress of the Purge operation. This will be
        returned by the google.longrunning.Operation.metadata field.
      properties: {}
      id: GoogleCloudRetailV2alphaPurgeMetadata
      type: object
    GoogleCloudRetailV2alphaRemoveLocalInventoriesResponse:
      description: >-
        Response of the ProductService.RemoveLocalInventories API. Currently
        empty because there is no meaningful response populated from the
        ProductService.RemoveLocalInventories method.
      properties: {}
      id: GoogleCloudRetailV2alphaRemoveLocalInventoriesResponse
      type: object
    GoogleCloudRetailV2AttributesConfig:
      properties:
        name:
          description: >-
            Required. Immutable. The fully qualified resource name of the
            attribute config. Format:
            `projects/*/locations/*/catalogs/*/attributesConfig`
          type: string
        catalogAttributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GoogleCloudRetailV2CatalogAttribute'
          description: >-
            Enable attribute(s) config at catalog level. For example, indexable,
            dynamic_facetable, or searchable for each attribute. The key is
            catalog attribute's name. For example: `color`, `brands`,
            `attributes.custom_attribute`, such as `attributes.xyz`. The maximum
            number of catalog attributes allowed in a request is 1000.
        attributeConfigLevel:
          readOnly: true
          enumDescriptions:
            - >-
              Value used when unset. In this case, server behavior defaults to
              CATALOG_LEVEL_ATTRIBUTE_CONFIG.
            - >-
              At this level, we honor the attribute configurations set in
              Product.attributes.
            - >-
              At this level, we honor the attribute configurations set in
              `CatalogConfig.attribute_configs`.
          enum:
            - ATTRIBUTE_CONFIG_LEVEL_UNSPECIFIED
            - PRODUCT_LEVEL_ATTRIBUTE_CONFIG
            - CATALOG_LEVEL_ATTRIBUTE_CONFIG
          type: string
          description: Output only. The AttributeConfigLevel used for this catalog.
      description: Catalog level attribute config.
      id: GoogleCloudRetailV2AttributesConfig
      type: object
    GoogleCloudRetailV2AddFulfillmentPlacesRequest:
      properties:
        type:
          type: string
          description: >-
            Required. The fulfillment type, including commonly used types (such
            as pickup in store and same day delivery), and custom types.
            Supported values: * "pickup-in-store" * "ship-to-store" *
            "same-day-delivery" * "next-day-delivery" * "custom-type-1" *
            "custom-type-2" * "custom-type-3" * "custom-type-4" *
            "custom-type-5" If this field is set to an invalid value other than
            these, an INVALID_ARGUMENT error is returned. This field directly
            corresponds to Product.fulfillment_info.type.
        placeIds:
          type: array
          items:
            type: string
          description: >-
            Required. The IDs for this type, such as the store IDs for
            "pickup-in-store" or the region IDs for "same-day-delivery" to be
            added for this type. Duplicate IDs will be automatically ignored. At
            least 1 value is required, and a maximum of 2000 values are allowed.
            Each value must be a string with a length limit of 10 characters,
            matching the pattern `[a-zA-Z0-9_-]+`, such as "store1" or
            "REGION-2". Otherwise, an INVALID_ARGUMENT error is returned. If the
            total number of place IDs exceeds 2000 for this type after adding,
            then the update will be rejected.
        addTime:
          type: string
          format: google-datetime
          description: >-
            The time when the fulfillment updates are issued, used to prevent
            out-of-order updates on fulfillment information. If not provided,
            the internal system time will be used.
        allowMissing:
          description: >-
            If set to true, and the Product is not found, the fulfillment
            information will still be processed and retained for at most 1 day
            and processed once the Product is created. If set to false, a
            NOT_FOUND error is returned if the Product is not found.
          type: boolean
      description: Request message for ProductService.AddFulfillmentPlaces method.
      id: GoogleCloudRetailV2AddFulfillmentPlacesRequest
      type: object
    GoogleCloudRetailV2GcsSource:
      id: GoogleCloudRetailV2GcsSource
      type: object
      description: Google Cloud Storage location for input content.
      properties:
        inputUris:
          type: array
          items:
            type: string
          description: >-
            Required. Google Cloud Storage URIs to input files. URI can be up to
            2000 characters long. URIs can match the full object path (for
            example, `gs://bucket/directory/object.json`) or a pattern matching
            one or more files, such as `gs://bucket/directory/*.json`. A request
            can contain at most 100 files, and each file can be up to 2 GB. See
            [Importing product
            information](https://cloud.google.com/retail/recommendations-ai/docs/upload-catalog)
            for the expected file format and setup instructions.
        dataSchema:
          description: >-
            The schema to use when parsing the data from the source. Supported
            values for product imports: * `product` (default): One JSON Product
            per line. Each product must have a valid Product.id. *
            `product_merchant_center`: See [Importing catalog data from Merchant
            Center](https://cloud.google.com/retail/recommendations-ai/docs/upload-catalog#mc).
            Supported values for user events imports: * `user_event` (default):
            One JSON UserEvent per line. * `user_event_ga360`: Using
            https://support.google.com/analytics/answer/3437719. Supported
            values for control imports: * `control` (default): One JSON Control
            per line. Supported values for catalog attribute imports: *
            `catalog_attribute` (default): One CSV CatalogAttribute per line.
          type: string
    GoogleCloudRetailV2ModelModelFeaturesConfig:
      id: GoogleCloudRetailV2ModelModelFeaturesConfig
      type: object
      description: Additional model features config.
      properties:
        frequentlyBoughtTogetherConfig:
          description: Additional configs for frequently-bought-together models.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2ModelFrequentlyBoughtTogetherFeaturesConfig
    GoogleCloudRetailV2alphaMerchantCenterAccountLink:
      properties:
        state:
          readOnly: true
          enumDescriptions:
            - Default value.
            - Link is created and LRO is not complete.
            - Link is active.
            - Link creation failed.
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - ACTIVE
            - FAILED
          description: Output only. Represents the state of the link.
          type: string
        id:
          type: string
          description: >-
            Output only. Immutable. MerchantCenterAccountLink identifier, which
            is the final component of name. This field is auto generated and
            follows the convention: `BranchId_MerchantCenterAccountId`.
            `projects/*/locations/global/catalogs/default_catalog/merchantCenterAccountLinks/id_1`.
          readOnly: true
        feedLabel:
          description: >-
            The FeedLabel used to perform filtering. Note: this replaces
            [region_id](https://developers.google.com/shopping-content/reference/rest/v2.1/products#Product.FIELDS.feed_label).
            Example value: `US`. Example value: `FeedLabel1`.
          type: string
        branchId:
          type: string
          description: >-
            Required. The branch ID (e.g. 0/1/2) within the catalog that
            products from merchant_center_account_id are streamed to. When
            updating this field, an empty value will use the currently
            configured default branch. However, changing the default branch
            later on won't change the linked branch here. A single branch ID can
            only have one linked Merchant Center account ID.
        source:
          type: string
          description: >-
            Optional. An optional arbitrary string that could be used as a tag
            for tracking link source.
        name:
          type: string
          description: >-
            Output only. Immutable. Full resource name of the Merchant Center
            Account Link, such as
            `projects/*/locations/global/catalogs/default_catalog/merchantCenterAccountLinks/merchant_center_account_link`.
          readOnly: true
        projectId:
          type: string
          readOnly: true
          description: Output only. Google Cloud project ID.
        merchantCenterAccountId:
          type: string
          description: >-
            Required. The linked [Merchant center account
            id](https://developers.google.com/shopping-content/guides/accountstatuses).
            The account must be a standalone account or a sub-account of a MCA.
          format: int64
        languageCode:
          type: string
          description: >-
            Language of the title/description and other string attributes. Use
            language tags defined by [BCP
            47](https://www.rfc-editor.org/rfc/bcp/bcp47.txt). ISO 639-1. This
            specifies the language of offers in Merchant Center that will be
            accepted. If empty, no language filtering will be performed. Example
            value: `en`.
        feedFilters:
          description: >-
            Criteria for the Merchant Center feeds to be ingested via the link.
            All offers will be ingested if the list is empty. Otherwise the
            offers will be ingested from selected feeds.
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2alphaMerchantCenterAccountLinkMerchantCenterFeedFilter
      description: >-
        Represents a link between a Merchant Center account and a branch. After
        a link is established, products from the linked Merchant Center account
        are streamed to the linked branch.
      id: GoogleCloudRetailV2alphaMerchantCenterAccountLink
      type: object
    GoogleCloudRetailV2IntentClassificationConfig:
      id: GoogleCloudRetailV2IntentClassificationConfig
      type: object
      description: >-
        The public proto to represent the intent classification config. It will
        be converted to the internal proto in the backend.
      properties:
        inlineSource:
          description: Optional. Inline source for intent classifications.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2IntentClassificationConfigInlineSource
        modelPreamble:
          description: >-
            Optional. Customers can use the preamble to specify any requirements
            for blocklisting intent classification. This preamble will be added
            to the blocklisting intent classification model prompt.
          type: string
        disabledIntentTypes:
          type: array
          items:
            type: string
          description: >-
            Optional. A list of intent types that will be disabled for this
            customer. The intent types must match one of the predefined intent
            types defined at
            https://cloud.google.com/retail/docs/reference/rpc/google.cloud.retail.v2alpha#querytype
        blocklistKeywords:
          type: array
          items:
            type: string
          description: >-
            Optional. A list of keywords that will be used to classify the query
            to the "BLOCKLISTED" intent type. The keywords are case insensitive.
        example:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2IntentClassificationConfigExample
          description: Optional. A list of examples for intent classification.
