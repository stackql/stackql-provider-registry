          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2UserEvent'
      id: GoogleCloudRetailV2UserEventInlineSource
      type: object
    GoogleCloudRetailV2PurgeProductsRequest:
      description: Request message for PurgeProducts method.
      properties:
        filter:
          description: >-
            Required. The filter string to specify the products to be deleted
            with a length limit of 5,000 characters. Empty string filter is not
            allowed. "*" implies delete all items in a branch. The eligible
            fields for filtering are: * `availability`: Double quoted
            Product.availability string. * `create_time` : in ISO 8601 "zulu"
            format. Supported syntax: * Comparators (">", "<", ">=", "<=", "=").
            Examples: * create_time <= "2015-02-13T17:05:46Z" * availability =
            "IN_STOCK" * Conjunctions ("AND") Examples: * create_time <=
            "2015-02-13T17:05:46Z" AND availability = "PREORDER" * Disjunctions
            ("OR") Examples: * create_time <= "2015-02-13T17:05:46Z" OR
            availability = "IN_STOCK" * Can support nested queries. Examples: *
            (create_time <= "2015-02-13T17:05:46Z" AND availability =
            "PREORDER") OR (create_time >= "2015-02-14T13:03:32Z" AND
            availability = "IN_STOCK") * Filter Limits: * Filter should not
            contain more than 6 conditions. * Max nesting depth should not
            exceed 2 levels. Examples queries: * Delete back order products
            created before a timestamp. create_time <= "2015-02-13T17:05:46Z" OR
            availability = "BACKORDER"
          type: string
        force:
          type: boolean
          description: >-
            Actually perform the purge. If `force` is set to false, the method
            will return the expected purge count without deleting any products.
      id: GoogleCloudRetailV2PurgeProductsRequest
      type: object
    GoogleCloudRetailV2CompleteQueryResponse:
      description: Response of the autocomplete query.
      properties:
        attributionToken:
          description: >-
            A unique complete token. This should be included in the
            UserEvent.completion_detail for search events resulting from this
            completion, which enables accurate attribution of complete model
            performance.
          type: string
        recentSearchResults:
          deprecated: true
          description: >-
            Deprecated. Matched recent searches of this user. The maximum number
            of recent searches is 10. This field is a restricted feature. If you
            want to enable it, contact Retail Search support. This feature is
            only available when CompleteQueryRequest.visitor_id field is set and
            UserEvent is imported. The recent searches satisfy the follow rules:
            * They are ordered from latest to oldest. * They are matched with
            CompleteQueryRequest.query case insensitively. * They are
            transformed to lower case. * They are UTF-8 safe. Recent searches
            are deduplicated. More recent searches will be reserved when
            duplication happens.
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2CompleteQueryResponseRecentSearchResult
        completionResults:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2CompleteQueryResponseCompletionResult
          description: >-
            Results of the matching suggestions. The result list is ordered and
            the first result is top suggestion.
        attributeResults:
          type: object
          additionalProperties:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2CompleteQueryResponseAttributeResult
          description: >-
            A map of matched attribute suggestions. This field is only available
            for `cloud-retail` dataset. Current supported keys: * `brands` *
            `categories`
      id: GoogleCloudRetailV2CompleteQueryResponse
      type: object
    GoogleCloudRetailV2PriceInfo:
      description: The price information of a Product.
      properties:
        price:
          type: number
          format: float
          description: >-
            Price of the product. Google Merchant Center property
            [price](https://support.google.com/merchants/answer/6324371).
            Schema.org property [Offer.price](https://schema.org/price).
        originalPrice:
          description: >-
            Price of the product without any discount. If zero, by default set
            to be the price. If set, original_price should be greater than or
            equal to price, otherwise an INVALID_ARGUMENT error is thrown.
          format: float
          type: number
        priceEffectiveTime:
          format: google-datetime
          description: >-
            The timestamp when the price starts to be effective. This can be set
            as a future timestamp, and the price is only used for search after
            price_effective_time. If so, the original_price must be set and
            original_price is used before price_effective_time. Do not set if
            price is always effective because it will cause additional latency
            during search.
          type: string
        cost:
          description: >-
            The costs associated with the sale of a particular product. Used for
            gross profit reporting. * Profit = price - cost Google Merchant
            Center property
            [cost_of_goods_sold](https://support.google.com/merchants/answer/9017895).
          format: float
          type: number
        priceRange:
          $ref: '#/components/schemas/GoogleCloudRetailV2PriceInfoPriceRange'
          description: >-
            Output only. The price range of all the child Product.Type.VARIANT
            Products grouped together on the Product.Type.PRIMARY Product. Only
            populated for Product.Type.PRIMARY Products. Note: This field is
            OUTPUT_ONLY for ProductService.GetProduct. Do not set this field in
            API requests.
          readOnly: true
        currencyCode:
          type: string
          description: >-
            The 3-letter currency code defined in [ISO
            4217](https://www.iso.org/iso-4217-currency-codes.html). If this
            field is an unrecognizable currency code, an INVALID_ARGUMENT error
            is returned. The Product.Type.VARIANT Products with the same
            Product.primary_product_id must share the same currency_code.
            Otherwise, a FAILED_PRECONDITION error is returned.
        priceExpireTime:
          description: >-
            The timestamp when the price stops to be effective. The price is
            used for search before price_expire_time. If this field is set, the
            original_price must be set and original_price is used after
            price_expire_time. Do not set if price is always effective because
            it will cause additional latency during search.
          format: google-datetime
          type: string
      id: GoogleCloudRetailV2PriceInfo
      type: object
    GoogleCloudRetailV2CompleteQueryResponseRecentSearchResult:
      id: GoogleCloudRetailV2CompleteQueryResponseRecentSearchResult
      type: object
      deprecated: true
      properties:
        recentSearch:
          description: The recent search query.
          type: string
      description: 'Deprecated: Recent search of this user.'
    GoogleCloudRetailV2RemoveLocalInventoriesResponse:
      id: GoogleCloudRetailV2RemoveLocalInventoriesResponse
      type: object
      description: >-
        Response of the ProductService.RemoveLocalInventories API. Currently
        empty because there is no meaningful response populated from the
        ProductService.RemoveLocalInventories method.
      properties: {}
    GoogleCloudRetailV2ProductInputConfig:
      id: GoogleCloudRetailV2ProductInputConfig
      type: object
      description: The input config source for products.
      properties:
        gcsSource:
          $ref: '#/components/schemas/GoogleCloudRetailV2GcsSource'
          description: Google Cloud Storage location for the input content.
        bigQuerySource:
          $ref: '#/components/schemas/GoogleCloudRetailV2BigQuerySource'
          description: BigQuery input source.
        productInlineSource:
          description: The Inline source for the input content for products.
          $ref: '#/components/schemas/GoogleCloudRetailV2ProductInlineSource'
    GoogleCloudRetailV2CompleteQueryResponseCompletionResult:
      id: GoogleCloudRetailV2CompleteQueryResponseCompletionResult
      type: object
      properties:
        suggestion:
          type: string
          description: The suggestion for the query.
        attributes:
          description: >-
            Custom attributes for the suggestion term. * For `user-data`, the
            attributes are additional custom attributes ingested through
            BigQuery. * For `cloud-retail`, the attributes are product
            attributes generated by Cloud Retail. It requires
            UserEvent.product_details is imported properly.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GoogleCloudRetailV2CustomAttribute'
      description: Resource that represents completion results.
    GoogleCloudRetailV2Product:
      id: GoogleCloudRetailV2Product
      type: object
      properties:
        id:
          type: string
          description: >-
            Immutable. Product identifier, which is the final component of name.
            For example, this field is "id_1", if name is
            `projects/*/locations/global/catalogs/default_catalog/branches/default_branch/products/id_1`.
            This field must be a UTF-8 encoded string with a length limit of 128
            characters. Otherwise, an INVALID_ARGUMENT error is returned.
            Corresponding properties: Google Merchant Center property
            [id](https://support.google.com/merchants/answer/6324405).
            Schema.org property [Product.sku](https://schema.org/sku).
        audience:
          $ref: '#/components/schemas/GoogleCloudRetailV2Audience'
          description: >-
            The target group associated with a given audience (e.g. male,
            veterans, car owners, musicians, etc.) of the product.
        patterns:
          type: array
          items:
            type: string
          description: >-
            The pattern or graphic print of the product. For example, "striped",
            "polka dot", "paisley". A maximum of 20 values are allowed per
            Product. Each value must be a UTF-8 encoded string with a length
            limit of 128 characters. Otherwise, an INVALID_ARGUMENT error is
            returned. Corresponding properties: Google Merchant Center property
            [pattern](https://support.google.com/merchants/answer/6324483).
            Schema.org property [Product.pattern](https://schema.org/pattern).
        gtin:
          description: >-
            The Global Trade Item Number (GTIN) of the product. This field must
            be a UTF-8 encoded string with a length limit of 128 characters.
            Otherwise, an INVALID_ARGUMENT error is returned. This field must be
            a Unigram. Otherwise, an INVALID_ARGUMENT error is returned.
            Corresponding properties: Google Merchant Center property
            [gtin](https://support.google.com/merchants/answer/6324461).
            Schema.org property [Product.isbn](https://schema.org/isbn),
            [Product.gtin8](https://schema.org/gtin8),
            [Product.gtin12](https://schema.org/gtin12),
            [Product.gtin13](https://schema.org/gtin13), or
            [Product.gtin14](https://schema.org/gtin14). If the value is not a
            valid GTIN, an INVALID_ARGUMENT error is returned.
          type: string
        description:
          description: >-
            Product description. This field must be a UTF-8 encoded string with
            a length limit of 5,000 characters. Otherwise, an INVALID_ARGUMENT
            error is returned. Corresponding properties: Google Merchant Center
            property
            [description](https://support.google.com/merchants/answer/6324468).
            Schema.org property
            [Product.description](https://schema.org/description).
          type: string
        conditions:
          type: array
          items:
            type: string
          description: >-
            The condition of the product. Strongly encouraged to use the
            standard values: "new", "refurbished", "used". A maximum of 1 value
            is allowed per Product. Each value must be a UTF-8 encoded string
            with a length limit of 128 characters. Otherwise, an
            INVALID_ARGUMENT error is returned. Corresponding properties: Google
            Merchant Center property
            [condition](https://support.google.com/merchants/answer/6324469).
            Schema.org property
            [Offer.itemCondition](https://schema.org/itemCondition).
        variants:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2Product'
          description: >-
            Output only. Product variants grouped together on primary product
            which share similar product attributes. It's automatically grouped
            by primary_product_id for all the product variants. Only populated
            for Type.PRIMARY Products. Note: This field is OUTPUT_ONLY for
            ProductService.GetProduct. Do not set this field in API requests.
          readOnly: true
        primaryProductId:
          type: string
          description: >-
            Variant group identifier. Must be an id, with the same parent branch
            with this product. Otherwise, an error is thrown. For Type.PRIMARY
            Products, this field can only be empty or set to the same value as
            id. For VARIANT Products, this field cannot be empty. A maximum of
            2,000 products are allowed to share the same Type.PRIMARY Product.
            Otherwise, an INVALID_ARGUMENT error is returned. Corresponding
            properties: Google Merchant Center property
            [item_group_id](https://support.google.com/merchants/answer/6324507).
            Schema.org property
            [Product.inProductGroupWithID](https://schema.org/inProductGroupWithID).
        availability:
          description: >-
            The online availability of the Product. Default to
            Availability.IN_STOCK. For primary products with variants set the
            availability of the primary as Availability.OUT_OF_STOCK and set the
            true availability at the variant level. This way the primary product
            will be considered "in stock" as long as it has at least one variant
            in stock. For primary products with no variants set the true
            availability at the primary level. Corresponding properties: Google
            Merchant Center property
            [availability](https://support.google.com/merchants/answer/6324448).
            Schema.org property
            [Offer.availability](https://schema.org/availability).
          enumDescriptions:
            - >-
              Default product availability. Default to Availability.IN_STOCK if
              unset.
            - Product in stock.
            - Product out of stock.
            - Product that is in pre-order state.
            - Product that is back-ordered (i.e. temporarily out of stock).
          enum:
            - AVAILABILITY_UNSPECIFIED
            - IN_STOCK
            - OUT_OF_STOCK
            - PREORDER
            - BACKORDER
          type: string
        priceInfo:
          $ref: '#/components/schemas/GoogleCloudRetailV2PriceInfo'
          description: >-
            Product price and cost information. Corresponding properties: Google
            Merchant Center property
            [price](https://support.google.com/merchants/answer/6324371).
        uri:
          description: >-
            Canonical URL directly linking to the product detail page. It is
            strongly recommended to provide a valid uri for the product,
            otherwise the service performance could be significantly degraded.
            This field must be a UTF-8 encoded string with a length limit of
            5,000 characters. Otherwise, an INVALID_ARGUMENT error is returned.
            Corresponding properties: Google Merchant Center property
            [link](https://support.google.com/merchants/answer/6324416).
            Schema.org property [Offer.url](https://schema.org/url).
          type: string
        ttl:
          description: >-
            Input only. The TTL (time to live) of the product. Note that this is
            only applicable to Type.PRIMARY and Type.COLLECTION, and ignored for
            Type.VARIANT. In general, we suggest the users to delete the stale
            products explicitly, instead of using this field to determine
            staleness. If it is set, it must be a non-negative value, and
            expire_time is set as current timestamp plus ttl. The derived
            expire_time is returned in the output and ttl is left blank when
            retrieving the Product. If it is set, the product is not available
            for SearchService.Search after current timestamp plus ttl. However,
            the product can still be retrieved by ProductService.GetProduct and
            ProductService.ListProducts.
          format: google-duration
          type: string
        fulfillmentInfo:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2FulfillmentInfo'
          description: >-
            Fulfillment information, such as the store IDs for in-store pickup
            or region IDs for different shipping methods. All the elements must
            have distinct FulfillmentInfo.type. Otherwise, an INVALID_ARGUMENT
            error is returned.
        materials:
          description: >-
            The material of the product. For example, "leather", "wooden". A
            maximum of 20 values are allowed. Each value must be a UTF-8 encoded
            string with a length limit of 200 characters. Otherwise, an
            INVALID_ARGUMENT error is returned. Corresponding properties: Google
            Merchant Center property
            [material](https://support.google.com/merchants/answer/6324410).
            Schema.org property [Product.material](https://schema.org/material).
          type: array
          items:
            type: string
        retrievableFields:
          type: string
          description: >-
            Indicates which fields in the Products are returned in
            SearchResponse. Supported fields for all types: * audience *
            availability * brands * color_info * conditions * gtin * materials *
            name * patterns * price_info * rating * sizes * title * uri
            Supported fields only for Type.PRIMARY and Type.COLLECTION: *
            categories * description * images Supported fields only for
            Type.VARIANT: * Only the first image in images To mark attributes as
            retrievable, include paths of the form "attributes.key" where "key"
            is the key of a custom attribute, as specified in attributes. For
            Type.PRIMARY and Type.COLLECTION, the following fields are always
            returned in SearchResponse by default: * name For Type.VARIANT, the
            following fields are always returned in by default: * name *
            color_info Note: Returning more fields in SearchResponse can
            increase response payload size and serving latency. This field is
            deprecated. Use the retrievable site-wide control instead.
          deprecated: true
          format: google-fieldmask
        categories:
          type: array
          items:
            type: string
          description: >-
            Optional. Product categories. This field is repeated for supporting
            one product belonging to several parallel categories. Strongly
            recommended using the full path for better search / recommendation
            quality. To represent the full path of category, use the '>' sign,
            with one space on each side, to separate different hierarchies. If
            '>' is part of the category name, replace it with other
            character(s). For example, if a shoes product belongs to both
            ["Shoes & Accessories" -> "Shoes"] and ["Sports & Fitness" ->
            "Athletic Clothing" -> "Shoes"], it could be represented as:
            "categories": [ "Shoes & Accessories > Shoes", "Sports & Fitness >
            Athletic Clothing > Shoes" ] Must be set for Type.PRIMARY Product
            otherwise an INVALID_ARGUMENT error is returned. At most 250 values
            are allowed per Product unless overridden through the Google Cloud
            console. Empty values are not allowed. Each value must be a UTF-8
            encoded string with a length limit of 5,000 characters. Otherwise,
            an INVALID_ARGUMENT error is returned. Corresponding properties:
            Google Merchant Center property google_product_category. Schema.org
            property [Product.category] (https://schema.org/category).
            [mc_google_product_category]:
            https://support.google.com/merchants/answer/6324436
        images:
          description: >-
            Product images for the product. We highly recommend putting the main
            image first. A maximum of 300 images are allowed. Corresponding
            properties: Google Merchant Center property
            [image_link](https://support.google.com/merchants/answer/6324350).
            Schema.org property [Product.image](https://schema.org/image).
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2Image'
        colorInfo:
          $ref: '#/components/schemas/GoogleCloudRetailV2ColorInfo'
          description: >-
            The color of the product. Corresponding properties: Google Merchant
            Center property
            [color](https://support.google.com/merchants/answer/6324487).
            Schema.org property [Product.color](https://schema.org/color).
        collectionMemberIds:
          description: >-
            The id of the collection members when type is Type.COLLECTION.
            Non-existent product ids are allowed. The type of the members must
            be either Type.PRIMARY or Type.VARIANT otherwise an INVALID_ARGUMENT
            error is thrown. Should not set it for other types. A maximum of
            1000 values are allowed. Otherwise, an INVALID_ARGUMENT error is
            return.
          type: array
          items:
            type: string
        localInventories:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2LocalInventory'
          description: >-
            Output only. A list of local inventories specific to different
            places. This field can be managed by
            ProductService.AddLocalInventories and
            ProductService.RemoveLocalInventories APIs if fine-grained,
            high-volume updates are necessary.
          readOnly: true
        languageCode:
          type: string
          description: >-
            Language of the title/description and other string attributes. Use
            language tags defined by [BCP
            47](https://www.rfc-editor.org/rfc/bcp/bcp47.txt). For product
            prediction, this field is ignored and the model automatically
            detects the text language. The Product can include text in different
            languages, but duplicating Products to provide text in multiple
            languages can result in degraded model performance. For product
            search this field is in use. It defaults to "en-US" if unset.
        name:
          type: string
          description: >-
            Immutable. Full resource name of the product, such as
            `projects/*/locations/global/catalogs/default_catalog/branches/default_branch/products/product_id`.
        brands:
          type: array
          items:
            type: string
          description: >-
            The brands of the product. A maximum of 30 brands are allowed unless
            overridden through the Google Cloud console. Each brand must be a
            UTF-8 encoded string with a length limit of 1,000 characters.
            Otherwise, an INVALID_ARGUMENT error is returned. Corresponding
            properties: Google Merchant Center property
            [brand](https://support.google.com/merchants/answer/6324351).
            Schema.org property [Product.brand](https://schema.org/brand).
        type:
          type: string
          description: >-
            Immutable. The type of the product. Default to
            Catalog.product_level_config.ingestion_product_type if unset.
          enumDescriptions:
            - >-
              Default value. Default to
              Catalog.product_level_config.ingestion_product_type if unset.
            - >-
              The primary type. As the primary unit for predicting, indexing and
              search serving, a Type.PRIMARY Product is grouped with multiple
              Type.VARIANT Products.
            - >-
              The variant type. Type.VARIANT Products usually share some common
              attributes on the same Type.PRIMARY Products, but they have
              variant attributes like different colors, sizes and prices, etc.
            - >-
              The collection type. Collection products are bundled Type.PRIMARY
              Products or Type.VARIANT Products that are sold together, such as
              a jewelry set with necklaces, earrings and rings, etc.
          enum:
            - TYPE_UNSPECIFIED
            - PRIMARY
            - VARIANT
            - COLLECTION
        title:
          type: string
          description: >-
            Required. Product title. This field must be a UTF-8 encoded string
            with a length limit of 1,000 characters. Otherwise, an
            INVALID_ARGUMENT error is returned. Corresponding properties: Google
            Merchant Center property
            [title](https://support.google.com/merchants/answer/6324415).
            Schema.org property [Product.name](https://schema.org/name).
        expireTime:
          type: string
          description: >-
            Note that this field is applied in the following ways: * If the
            Product is already expired when it is uploaded, this product is not
            indexed for search. * If the Product is not expired when it is
            uploaded, only the Type.PRIMARY's and Type.COLLECTION's expireTime
            is respected, and Type.VARIANT's expireTime is not used. In general,
            we suggest the users to delete the stale products explicitly,
            instead of using this field to determine staleness. expire_time must
            be later than available_time and publish_time, otherwise an
            INVALID_ARGUMENT error is thrown. Corresponding properties: Google
            Merchant Center property
            [expiration_date](https://support.google.com/merchants/answer/6324499).
          format: google-datetime
        availableTime:
          type: string
          format: google-datetime
          description: >-
            The timestamp when this Product becomes available for
            SearchService.Search. Note that this is only applicable to
            Type.PRIMARY and Type.COLLECTION, and ignored for Type.VARIANT.
        sizes:
          description: >-
            The size of the product. To represent different size systems or size
            types, consider using this format:
            [[[size_system:]size_type:]size_value]. For example, in "US:MENS:M",
            "US" represents size system; "MENS" represents size type; "M"
            represents size value. In "GIRLS:27", size system is empty; "GIRLS"
            represents size type; "27" represents size value. In "32 inches",
            both size system and size type are empty, while size value is "32
            inches". A maximum of 20 values are allowed per Product by default.
            This limit can be increased using dynamic override configurations.
            Each value must be a UTF-8 encoded string with a length limit of 128
            characters. Otherwise, an INVALID_ARGUMENT error is returned.
            Corresponding properties: Google Merchant Center property
            [size](https://support.google.com/merchants/answer/6324492),
            [size_type](https://support.google.com/merchants/answer/6324497),
            and
            [size_system](https://support.google.com/merchants/answer/6324502).
            Schema.org property [Product.size](https://schema.org/size).
          type: array
          items:
            type: string
        rating:
          description: The rating of this product.
          $ref: '#/components/schemas/GoogleCloudRetailV2Rating'
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2Promotion'
          description: >-
            The promotions applied to the product. A maximum of 10 values are
            allowed per Product. Only Promotion.promotion_id will be used, other
            fields will be ignored if set.
        attributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GoogleCloudRetailV2CustomAttribute'
          description: >-
            Highly encouraged. Extra product attributes to be included. For
            example, for products, this could include the store name, vendor,
            style, color, etc. These are very strong signals for recommendation
            model, thus we highly recommend providing the attributes here.
            Features that can take on one of a limited number of possible
            values. Two types of features can be set are: Textual features. some
            examples would be the brand/maker of a product, or country of a
            customer. Numerical features. Some examples would be the
            height/weight of a product, or age of a customer. For example: `{
            "vendor": {"text": ["vendor123", "vendor456"]}, "lengths_cm":
            {"numbers":[2.3, 15.4]}, "heights_cm": {"numbers":[8.1, 6.4]} }`.
            This field needs to pass all below criteria, otherwise an
            INVALID_ARGUMENT error is returned: * Max entries count: 200. * The
            key must be a UTF-8 encoded string with a length limit of 128
            characters. * For indexable attribute, the key must match the
            pattern: `a-zA-Z0-9*`. For example, `key0LikeThis` or
            `KEY_1_LIKE_THIS`. * For text attributes, at most 400 values are
            allowed. Empty values are not allowed. Each value must be a
            non-empty UTF-8 encoded string with a length limit of 256
            characters. * For number attributes, at most 400 values are allowed.
        availableQuantity:
          type: integer
          format: int32
          description: The available quantity of the item.
        publishTime:
          format: google-datetime
          description: >-
            The timestamp when the product is published by the retailer for the
            first time, which indicates the freshness of the products. Note that
            this field is different from available_time, given it purely
            describes product freshness regardless of when it is available on
            search and recommendation.
          type: string
        tags:
          description: >-
            Custom tags associated with the product. At most 250 values are
            allowed per Product. This value must be a UTF-8 encoded string with
            a length limit of 1,000 characters. Otherwise, an INVALID_ARGUMENT
            error is returned. This tag can be used for filtering recommendation
            results by passing the tag as part of the PredictRequest.filter.
            Corresponding properties: Google Merchant Center property
            [custom_label_0–4](https://support.google.com/merchants/answer/6324473).
          type: array
          items:
            type: string
      description: >-
        Product captures all metadata information of items to be recommended or
        searched.
    GoogleCloudRetailV2UserEventInputConfig:
      id: GoogleCloudRetailV2UserEventInputConfig
      type: object
      description: The input config source for user events.
      properties:
        bigQuerySource:
          $ref: '#/components/schemas/GoogleCloudRetailV2BigQuerySource'
          description: Required. BigQuery input source.
        gcsSource:
          $ref: '#/components/schemas/GoogleCloudRetailV2GcsSource'
          description: Required. Google Cloud Storage location for the input content.
        userEventInlineSource:
          description: Required. The Inline source for the input content for UserEvents.
          $ref: '#/components/schemas/GoogleCloudRetailV2UserEventInlineSource'
    GoogleCloudRetailV2betaAddFulfillmentPlacesResponse:
      properties: {}
      description: >-
        Response of the AddFulfillmentPlacesRequest. Currently empty because
        there is no meaningful response populated from the
