      id: GoogleCloudRetailV2alphaExportUserEventsResponse
      type: object
    GoogleCloudRetailV2Rule:
      properties:
        boostAction:
          $ref: '#/components/schemas/GoogleCloudRetailV2RuleBoostAction'
          description: A boost action.
        filterAction:
          description: Filters results.
          $ref: '#/components/schemas/GoogleCloudRetailV2RuleFilterAction'
        removeFacetAction:
          description: Remove an attribute as a facet in the request (if present).
          $ref: '#/components/schemas/GoogleCloudRetailV2RuleRemoveFacetAction'
        forceReturnFacetAction:
          description: Force returns an attribute as a facet in the request.
          $ref: '#/components/schemas/GoogleCloudRetailV2RuleForceReturnFacetAction'
        ignoreAction:
          $ref: '#/components/schemas/GoogleCloudRetailV2RuleIgnoreAction'
          description: Ignores specific terms from query during search.
        redirectAction:
          description: Redirects a shopper to a specific page.
          $ref: '#/components/schemas/GoogleCloudRetailV2RuleRedirectAction'
        twowaySynonymsAction:
          description: Treats a set of terms as synonyms of one another.
          $ref: '#/components/schemas/GoogleCloudRetailV2RuleTwowaySynonymsAction'
        onewaySynonymsAction:
          description: >-
            Treats specific term as a synonym with a group of terms. Group of
            terms will not be treated as synonyms with the specific term.
          $ref: '#/components/schemas/GoogleCloudRetailV2RuleOnewaySynonymsAction'
        doNotAssociateAction:
          $ref: '#/components/schemas/GoogleCloudRetailV2RuleDoNotAssociateAction'
          description: Prevents term from being associated with other terms.
        replacementAction:
          $ref: '#/components/schemas/GoogleCloudRetailV2RuleReplacementAction'
          description: Replaces specific terms in the query.
        condition:
          description: >-
            Required. The condition that triggers the rule. If the condition is
            empty, the rule will always apply.
          $ref: '#/components/schemas/GoogleCloudRetailV2Condition'
        pinAction:
          $ref: '#/components/schemas/GoogleCloudRetailV2RulePinAction'
          description: >-
            Pins one or more specified products to a specific position in the
            results.
      description: >-
        A rule is a condition-action pair * A condition defines when a rule is
        to be triggered. * An action specifies what occurs on that trigger.
        Currently rules only work for controls with SOLUTION_TYPE_SEARCH.
      id: GoogleCloudRetailV2Rule
      type: object
    GoogleCloudRetailV2Interval:
      id: GoogleCloudRetailV2Interval
      type: object
      properties:
        minimum:
          type: number
          format: double
