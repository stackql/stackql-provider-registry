    GoogleCloudRetailV2RuleRedirectAction:
      properties:
        redirectUri:
          description: URL must have length equal or less than 2000 characters.
          type: string
      description: >-
        Redirects a shopper to a specific page. * Rule Condition: Must specify
        Condition.query_terms. * Action Input: Request Query * Action Result:
        Redirects shopper to provided uri.
      id: GoogleCloudRetailV2RuleRedirectAction
      type: object
    GoogleCloudRetailV2RejoinUserEventsRequest:
      id: GoogleCloudRetailV2RejoinUserEventsRequest
      type: object
      description: Request message for RejoinUserEvents method.
      properties:
        userEventRejoinScope:
          type: string
          description: >-
            The type of the user event rejoin to define the scope and range of
            the user events to be rejoined with the latest product catalog.
            Defaults to `USER_EVENT_REJOIN_SCOPE_UNSPECIFIED` if this field is
            not set, or set to an invalid integer value.
          enumDescriptions:
            - >-
              Rejoin all events with the latest product catalog, including both
              joined events and unjoined events.
            - Only rejoin joined events with the latest product catalog.
            - Only rejoin unjoined events with the latest product catalog.
          enum:
            - USER_EVENT_REJOIN_SCOPE_UNSPECIFIED
            - JOINED_EVENTS
            - UNJOINED_EVENTS
    GoogleCloudRetailV2ExportErrorsConfig:
      id: GoogleCloudRetailV2ExportErrorsConfig
      type: object
      description: Configuration of destination for Export related errors.
      properties:
        gcsPrefix:
          type: string
          description: >-
            Google Cloud Storage path for import errors. This must be an empty,
            existing Cloud Storage bucket. Export errors will be written to a
            file in this bucket, one per line, as a JSON-encoded
            `google.rpc.Status` message.
    GoogleCloudRetailV2betaBigQueryOutputResult:
      id: GoogleCloudRetailV2betaBigQueryOutputResult
      type: object
      properties:
        tableId:
          description: The ID of a BigQuery Table.
          type: string
        datasetId:
          description: The ID of a BigQuery Dataset.
          type: string
      description: A BigQuery output result.
    GoogleCloudRetailV2SetDefaultBranchRequest:
      description: Request message to set a specified branch as new default_branch.
      properties:
        note:
          description: >-
            Some note on this request, this can be retrieved by
            CatalogService.GetDefaultBranch before next valid default branch set
            occurs. This field must be a UTF-8 encoded string with a length
            limit of 1,000 characters. Otherwise, an INVALID_ARGUMENT error is
            returned.
          type: string
        force:
          description: >-
            If set to true, it permits switching to a branch with branch_id even
            if it has no sufficient active products.
          type: boolean
        branchId:
          type: string
          description: >-
            The final component of the resource name of a branch. This field
            must be one of "0", "1" or "2". Otherwise, an INVALID_ARGUMENT error
            is returned. If there are no sufficient active products in the
            targeted branch and force is not set, a FAILED_PRECONDITION error is
            returned.
      id: GoogleCloudRetailV2SetDefaultBranchRequest
      type: object
    GoogleCloudRetailV2alphaAddFulfillmentPlacesResponse:
      id: GoogleCloudRetailV2alphaAddFulfillmentPlacesResponse
      type: object
      properties: {}
      description: >-
