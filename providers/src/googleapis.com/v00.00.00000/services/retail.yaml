    GoogleCloudRetailV2OutputConfigGcsDestination:
      description: The Google Cloud Storage output destination configuration.
      properties:
        outputUriPrefix:
          type: string
          description: >-
            Required. The output uri prefix for saving output data to json
            files. Some mapping examples are as follows: output_uri_prefix
            sample output(assuming the object is foo.json)
            ========================
            ============================================= gs://bucket/
            gs://bucket/foo.json gs://bucket/folder/ gs://bucket/folder/foo.json
            gs://bucket/folder/item_ gs://bucket/folder/item_foo.json
      id: GoogleCloudRetailV2OutputConfigGcsDestination
      type: object
    GoogleCloudRetailV2RejoinUserEventsResponse:
      properties:
        rejoinedUserEventsCount:
          description: Number of user events that were joined with latest product catalog.
          format: int64
          type: string
      description: Response message for `RejoinUserEvents` method.
      id: GoogleCloudRetailV2RejoinUserEventsResponse
      type: object
    GoogleCloudRetailV2betaImportErrorsConfig:
      properties:
        gcsPrefix:
          description: >-
            Google Cloud Storage prefix for import errors. This must be an
            empty, existing Cloud Storage directory. Import errors are written
            to sharded files in this directory, one per line, as a JSON-encoded
            `google.rpc.Status` message.
          type: string
      description: Configuration of destination for Import related errors.
      id: GoogleCloudRetailV2betaImportErrorsConfig
      type: object
    GoogleCloudRetailV2Control:
      id: GoogleCloudRetailV2Control
      type: object
      description: >-
        Configures dynamic metadata that can be linked to a ServingConfig and
        affect search or recommendation results at serving time.
      properties:
        name:
          description: >-
            Immutable. Fully qualified name
            `projects/*/locations/global/catalogs/*/controls/*`
          type: string
        rule:
          description: >-
            A rule control - a condition-action pair. Enacts a set action when
            the condition is triggered. For example: Boost "gShoe" when query
            full matches "Running Shoes".
          $ref: '#/components/schemas/GoogleCloudRetailV2Rule'
        associatedServingConfigIds:
          readOnly: true
          description: >-
            Output only. List of serving config ids that are associated with
            this control in the same Catalog. Note the association is managed
            via the ServingConfig, this is an output only denormalized view.
          type: array
          items:
            type: string
        solutionTypes:
          type: array
          items:
            type: string
            enumDescriptions:
              - Default value.
              - Used for Recommendations AI.
              - Used for Retail Search.
            enum:
              - SOLUTION_TYPE_UNSPECIFIED
              - SOLUTION_TYPE_RECOMMENDATION
              - SOLUTION_TYPE_SEARCH
          description: >-
            Required. Immutable. The solution types that the control is used
            for. Currently we support setting only one type of solution at
            creation time. Only `SOLUTION_TYPE_SEARCH` value is supported at the
            moment. If no solution type is provided at creation time, will
            default to SOLUTION_TYPE_SEARCH.
        searchSolutionUseCase:
          description: >-
            Specifies the use case for the control. Affects what condition
            fields can be set. Only settable by search controls. Will default to
            SEARCH_SOLUTION_USE_CASE_SEARCH if not specified. Currently only
            allow one search_solution_use_case per control.
          type: array
          items:
            type: string
            enumDescriptions:
              - >-
                The value when it's unspecified. In this case, server behavior
                defaults to SEARCH_SOLUTION_USE_CASE_SEARCH.
              - Search use case. Expects the traffic has a non-empty query.
              - Browse use case. Expects the traffic has an empty query.
            enum:
              - SEARCH_SOLUTION_USE_CASE_UNSPECIFIED
              - SEARCH_SOLUTION_USE_CASE_SEARCH
              - SEARCH_SOLUTION_USE_CASE_BROWSE
        displayName:
          type: string
          description: >-
            Required. The human readable control display name. Used in Retail
            UI. This field must be a UTF-8 encoded string with a length limit of
            128 characters. Otherwise, an INVALID_ARGUMENT error is thrown.
    GoogleCloudRetailV2RemoveFulfillmentPlacesMetadata:
      properties: {}
      description: >-
        Metadata related to the progress of the RemoveFulfillmentPlaces
        operation. Currently empty because there is no meaningful metadata
        populated from the ProductService.RemoveFulfillmentPlaces method.
      id: GoogleCloudRetailV2RemoveFulfillmentPlacesMetadata
      type: object
    GoogleCloudRetailV2SearchRequestDynamicFacetSpec:
      id: GoogleCloudRetailV2SearchRequestDynamicFacetSpec
      type: object
      description: The specifications of dynamically generated facets.
      properties:
        mode:
          type: string
          description: >-
            Mode of the DynamicFacet feature. Defaults to Mode.DISABLED if it's
            unset.
          enumDescriptions:
            - Default value.
            - Disable Dynamic Facet.
            - Automatic mode built by Google Retail Search.
          enum:
            - MODE_UNSPECIFIED
            - DISABLED
            - ENABLED
    GoogleCloudRetailV2SearchRequest:
      description: Request message for SearchService.Search method.
      properties:
        boostSpec:
          description: >-
            Boost specification to boost certain products. For more information,
            see [Boost results](https://cloud.google.com/retail/docs/boosting).
            Notice that if both ServingConfig.boost_control_ids and
            SearchRequest.boost_spec are set, the boost conditions from both
            places are evaluated. If a search request matches multiple boost
            conditions, the final boost score is equal to the sum of the boost
            scores from all matched boost conditions.
          $ref: '#/components/schemas/GoogleCloudRetailV2SearchRequestBoostSpec'
        orderBy:
          type: string
          description: >-
            The order in which products are returned. Products can be ordered by
            a field in an Product object. Leave it unset if ordered by
            relevance. OrderBy expression is case-sensitive. For more
            information, see
            [Order](https://cloud.google.com/retail/docs/filter-and-order#order).
            If this field is unrecognizable, an INVALID_ARGUMENT is returned.
        offset:
          format: int32
          description: >-
            A 0-indexed integer that specifies the current offset (that is,
            starting result location, amongst the Products deemed by the API as
            relevant) in search results. This field is only considered if
            page_token is unset. If this field is negative, an INVALID_ARGUMENT
            is returned.
          type: integer
        languageCode:
          type: string
          description: >-
            Optional. The BCP-47 language code, such as "en-US" or "sr-Latn"
            [list](https://www.unicode.org/cldr/charts/46/summary/root.html).
            For more information, see [Standardized
            codes](https://google.aip.dev/143). This field helps to better
            interpret the query. If a value isn't specified, the query language
            code is automatically detected, which may not be accurate.
        filter:
          description: >-
            The filter syntax consists of an expression language for
            constructing a predicate from one or more fields of the products
            being filtered. Filter expression is case-sensitive. For more
            information, see
            [Filter](https://cloud.google.com/retail/docs/filter-and-order#filter).
            If this field is unrecognizable, an INVALID_ARGUMENT is returned.
          type: string
        userAttributes:
          description: >-
            Optional. The user attributes that could be used for personalization
            of search results. * Populate at most 100 key-value pairs per query.
            * Only supports string keys and repeated string values. * Duplicate
            keys are not allowed within a single query. Example:
            user_attributes: [ { key: "pets" value { values: "dog" values: "cat"
            } }, { key: "state" value { values: "CA" } } ]
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GoogleCloudRetailV2StringList'
        visitorId:
          type: string
          description: >-
            Required. A unique identifier for tracking visitors. For example,
            this could be implemented with an HTTP cookie, which should be able
            to uniquely identify a visitor on a single device. This unique
            identifier should not change if the visitor logs in or out of the
            website. This should be the same identifier as UserEvent.visitor_id.
            The field must be a UTF-8 encoded string with a length limit of 128
            characters. Otherwise, an INVALID_ARGUMENT error is returned.
        query:
          type: string
          description: >-
            Raw search query. If this field is empty, the request is considered
            a category browsing request and returned results are based on filter
            and page_categories.
        regionCode:
          description: >-
            Optional. The Unicode country/region code (CLDR) of a location, such
            as "US" and "419"
            [list](https://www.unicode.org/cldr/charts/46/supplemental/territory_information.html).
            For more information, see [Standardized
            codes](https://google.aip.dev/143). If set, then results will be
            boosted based on the region_code provided.
          type: string
        queryExpansionSpec:
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestQueryExpansionSpec
          description: >-
            The query expansion specification that specifies the conditions
            under which query expansion occurs. For more information, see [Query
            expansion](https://cloud.google.com/retail/docs/result-size#query_expansion).
        personalizationSpec:
          description: >-
            The specification for personalization. Notice that if both
            ServingConfig.personalization_spec and
            SearchRequest.personalization_spec are set.
            SearchRequest.personalization_spec will override
            ServingConfig.personalization_spec.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestPersonalizationSpec
        conversationalSearchSpec:
          description: >-
            Optional. This field specifies all conversational related parameters
            addition to traditional retail search.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestConversationalSearchSpec
        userInfo:
          $ref: '#/components/schemas/GoogleCloudRetailV2UserInfo'
          description: User information.
        facetSpecs:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2SearchRequestFacetSpec'
          description: >-
            Facet specifications for faceted search. If empty, no facets are
            returned. A maximum of 200 values are allowed. Otherwise, an
            INVALID_ARGUMENT error is returned.
        placeId:
          description: >-
            Optional. An id corresponding to a place, such as a store id or
            region id. When specified, we use the price from the local inventory
            with the matching product's LocalInventory.place_id for revenue
            optimization. Note, the currency of the local inventory's price must
            match the currency of the product's price.
          type: string
        canonicalFilter:
          description: >-
            The default filter that is applied when a user performs a search
            without checking any filters on the search page. The filter applied
            to every search request when quality improvement such as query
            expansion is needed. In the case a query does not have a sufficient
            amount of results this filter will be used to determine whether or
            not to enable the query expansion flow. The original filter will
            still be used for the query expanded search. This field is strongly
            recommended to achieve high search quality. For more information
            about filter syntax, see SearchRequest.filter.
          type: string
        variantRollupKeys:
          type: array
          items:
            type: string
          description: >-
            The keys to fetch and rollup the matching variant Products
            attributes, FulfillmentInfo or LocalInventorys attributes. The
            attributes from all the matching variant Products or LocalInventorys
            are merged and de-duplicated. Notice that rollup attributes will
            lead to extra query latency. Maximum number of keys is 30. For
            FulfillmentInfo, a fulfillment type and a fulfillment ID must be
            provided in the format of "fulfillmentType.fulfillmentId". E.g., in
            "pickupInStore.store123", "pickupInStore" is fulfillment type and
            "store123" is the store ID. Supported keys are: * colorFamilies *
            price * originalPrice * discount * variantId *
            inventory(place_id,price) * inventory(place_id,original_price) *
            inventory(place_id,attributes.key), where key is any key in the
            Product.local_inventories.attributes map. * attributes.key, where
            key is any key in the Product.attributes map. * pickupInStore.id,
            where id is any FulfillmentInfo.place_ids for FulfillmentInfo.type
            "pickup-in-store". * shipToStore.id, where id is any
            FulfillmentInfo.place_ids for FulfillmentInfo.type "ship-to-store".
            * sameDayDelivery.id, where id is any FulfillmentInfo.place_ids for
            FulfillmentInfo.type "same-day-delivery". * nextDayDelivery.id,
            where id is any FulfillmentInfo.place_ids for FulfillmentInfo.type
            "next-day-delivery". * customFulfillment1.id, where id is any
            FulfillmentInfo.place_ids for FulfillmentInfo.type "custom-type-1".
            * customFulfillment2.id, where id is any FulfillmentInfo.place_ids
            for FulfillmentInfo.type "custom-type-2". * customFulfillment3.id,
            where id is any FulfillmentInfo.place_ids for FulfillmentInfo.type
            "custom-type-3". * customFulfillment4.id, where id is any
            FulfillmentInfo.place_ids for FulfillmentInfo.type "custom-type-4".
            * customFulfillment5.id, where id is any FulfillmentInfo.place_ids
            for FulfillmentInfo.type "custom-type-5". If this field is set to an
            invalid value other than these, an INVALID_ARGUMENT error is
            returned.
        pageCategories:
          description: >-
            Optional. The categories associated with a category page. Must be
            set for category navigation queries to achieve good search quality.
            The format should be the same as UserEvent.page_categories; To
            represent the full path of category, use '>' sign, with one space on
            each side, to separate different hierarchies. If '>' is part of the
            category name, replace it with other character(s). Category pages
            include special pages such as sales or promotions. For instance, a
            special sale page may have the category hierarchy: "pageCategories"
            : ["Sales > 2017 Black Friday Deals"].
          type: array
          items:
            type: string
        branch:
          description: >-
            The branch resource name, such as
            `projects/*/locations/global/catalogs/default_catalog/branches/0`.
            Use "default_branch" as the branch ID or leave this field empty, to
            search products under the default branch.
          type: string
        pageToken:
          description: >-
            A page token SearchResponse.next_page_token, received from a
            previous SearchService.Search call. Provide this to retrieve the
            subsequent page. When paginating, all other parameters provided to
            SearchService.Search must match the call that provided the page
            token. Otherwise, an INVALID_ARGUMENT error is returned.
          type: string
        tileNavigationSpec:
          description: Optional. This field specifies tile navigation related parameters.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestTileNavigationSpec
        entity:
          description: >-
            The entity for customers that may run multiple different entities,
            domains, sites or regions, for example, `Google US`, `Google Ads`,
            `Waymo`, `google.com`, `youtube.com`, etc. If this is set, it should
            be exactly matched with UserEvent.entity to get search results
            boosted by entity.
          type: string
        dynamicFacetSpec:
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestDynamicFacetSpec
          description: >-
            Deprecated. Refer to
            https://cloud.google.com/retail/docs/configs#dynamic to enable
            dynamic facets. Do not set this field. The specification for
            dynamically generated facets. Notice that only textual facets can be
            dynamically generated.
          deprecated: true
        searchMode:
          enumDescriptions:
            - >-
              Default value. In this case both product search and faceted search
              will be performed. Both SearchResponse.SearchResult and
              SearchResponse.Facet will be returned.
            - >-
              Only product search will be performed. The faceted search will be
              disabled. Only SearchResponse.SearchResult will be returned.
              SearchResponse.Facet will not be returned, even if
              SearchRequest.facet_specs or SearchRequest.dynamic_facet_spec is
              set.
            - >-
              Only faceted search will be performed. The product search will be
              disabled. When in this mode, one or both of
              SearchRequest.facet_specs and SearchRequest.dynamic_facet_spec
              should be set. Otherwise, an INVALID_ARGUMENT error is returned.
              Only SearchResponse.Facet will be returned.
              SearchResponse.SearchResult will not be returned.
          enum:
            - SEARCH_MODE_UNSPECIFIED
            - PRODUCT_SEARCH_ONLY
            - FACETED_SEARCH_ONLY
          description: >-
            The search mode of the search request. If not specified, a single
            search request triggers both product search and faceted search.
          type: string
        labels:
          description: >-
            The labels applied to a resource must meet the following
            requirements: * Each resource can have multiple labels, up to a
            maximum of 64. * Each label must be a key-value pair. * Keys have a
            minimum length of 1 character and a maximum length of 63 characters
            and cannot be empty. Values can be empty and have a maximum length
            of 63 characters. * Keys and values can contain only lowercase
            letters, numeric characters, underscores, and dashes. All characters
            must use UTF-8 encoding, and international characters are allowed. *
            The key portion of a label must be unique. However, you can use the
            same key with multiple resources. * Keys must start with a lowercase
            letter or international character. For more information, see
            [Requirements for
            labels](https://cloud.google.com/resource-manager/docs/creating-managing-labels#requirements)
            in the Resource Manager documentation.
          type: object
          additionalProperties:
            type: string
        spellCorrectionSpec:
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestSpellCorrectionSpec
          description: >-
            The spell correction specification that specifies the mode under
            which spell correction will take effect.
        pageSize:
          type: integer
          description: >-
            Maximum number of Products to return. If unspecified, defaults to a
            reasonable value. The maximum allowed value is 120. Values above 120
            will be coerced to 120. If this field is negative, an
            INVALID_ARGUMENT is returned.
          format: int32
