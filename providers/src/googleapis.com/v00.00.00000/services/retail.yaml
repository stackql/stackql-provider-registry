          description: The list of double values.
          type: array
          items:
            type: number
            format: double
    GoogleCloudRetailV2ConversationalSearchRequest:
      properties:
        userInfo:
          description: Optional. User information.
          $ref: '#/components/schemas/GoogleCloudRetailV2UserInfo'
        conversationalFilteringSpec:
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2ConversationalSearchRequestConversationalFilteringSpec
          description: >-
            Optional. This field specifies all conversational filtering related
            parameters.
        userLabels:
          description: >-
            Optional. The user labels applied to a resource must meet the
            following requirements: * Each resource can have multiple labels, up
            to a maximum of 64. * Each label must be a key-value pair. * Keys
            have a minimum length of 1 character and a maximum length of 63
            characters and cannot be empty. Values can be empty and have a
            maximum length of 63 characters. * Keys and values can contain only
            lowercase letters, numeric characters, underscores, and dashes. All
            characters must use UTF-8 encoding, and international characters are
            allowed. * The key portion of a label must be unique. However, you
            can use the same key with multiple resources. * Keys must start with
            a lowercase letter or international character. See [Google Cloud
            Document](https://cloud.google.com/resource-manager/docs/creating-managing-labels#requirements)
            for more details.
          type: object
          additionalProperties:
            type: string
        safetySettings:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2SafetySetting'
          description: >-
            Optional. The safety settings to be applied to the generated
            content.
        searchParams:
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2ConversationalSearchRequestSearchParams
          description: Optional. Search parameters.
        query:
          description: >-
            Optional. Raw search query to be searched for. If this field is
            empty, the request is considered a category browsing request.
          type: string
        pageCategories:
          description: >-
            Optional. The categories associated with a category page. Must be
            set for category navigation queries to achieve good search quality.
            The format should be the same as UserEvent.page_categories; To
            represent the full path of category, use the '>' sign, with one
            space on each side, to separate different hierarchies. If '>' is
            part of the category name, replace it with other character(s).
            Category pages include special pages such as sales or promotions.
            For instance, a special sale page may have the category hierarchy:
            "pageCategories" : ["Sales > 2017 Black Friday Deals"].
          type: array
          items:
            type: string
        visitorId:
          type: string
          description: >-
            Required. A unique identifier for tracking visitors. For example,
            this could be implemented with an HTTP cookie, which should be able
            to uniquely identify a visitor on a single device. This unique
            identifier should not change if the visitor logs in or out of the
            website. This should be the same identifier as UserEvent.visitor_id.
            The field must be a UTF-8 encoded string with a length limit of 128
            characters. Otherwise, an INVALID_ARGUMENT error is returned.
        branch:
          description: >-
            Required. The branch resource name, such as
            `projects/*/locations/global/catalogs/default_catalog/branches/0`.
            Use "default_branch" as the branch ID or leave this field empty, to
            search products under the default branch.
          type: string
        conversationId:
          type: string
          description: >-
            Optional. This field specifies the conversation id, which maintains
            the state of the conversation between client side and server side.
            Use the value from the previous
            ConversationalSearchResponse.conversation_id. For the initial
            request, this should be empty.
      description: >-
        Request message for ConversationalSearchService.ConversationalSearch
        method.
      id: GoogleCloudRetailV2ConversationalSearchRequest
      type: object
    GoogleCloudRetailV2PurgeMetadata:
      description: >-
