        maximum:
          format: double
          description: Inclusive upper bound.
          type: number
        exclusiveMaximum:
          type: number
          format: double
          description: Exclusive upper bound.
        exclusiveMinimum:
          type: number
          format: double
          description: Exclusive lower bound.
      description: A floating point interval.
    GoogleCloudRetailV2IntentClassificationConfigExample:
