    GoogleCloudRetailV2RuleOnewaySynonymsAction:
      properties:
        synonyms:
          description: >-
            Defines a set of synonyms. Cannot contain duplicates. Can specify up
            to 100 synonyms.
          type: array
          items:
            type: string
        onewayTerms:
          description: Will be [deprecated = true] post migration;
          type: array
          items:
            type: string
        queryTerms:
          type: array
          items:
            type: string
          description: >-
            Terms from the search query. Will treat synonyms as their synonyms.
            Not themselves synonyms of the synonyms. Can specify up to 100
            terms.
      description: >-
        Maps a set of terms to a set of synonyms. Set of synonyms will be
        treated as synonyms of each query term only. `query_terms` will not be
        treated as synonyms of each other. Example: "sneakers" will use a
        synonym of "shoes". "shoes" will not use a synonym of "sneakers".
      id: GoogleCloudRetailV2RuleOnewaySynonymsAction
      type: object
    GoogleCloudRetailV2ProductAttributeValue:
      properties:
        name:
          type: string
          description: The attribute name.
        value:
          description: The attribute value.
          type: string
      description: >-
        Product attribute which structured by an attribute name and value. This
        structure is used in conversational search filters and answers. For
        example, if we have `name=color` and `value=red`, this means that the
        color is `red`.
      id: GoogleCloudRetailV2ProductAttributeValue
      type: object
    GoogleCloudRetailV2SearchRequestFacetSpecFacetKey:
      description: Specifies how a facet is computed.
      properties:
        restrictedValues:
          type: array
          items:
            type: string
          description: >-
            Only get facet for the given restricted values. For example, when
            using "pickupInStore" as key and set restricted values to
            ["store123", "store456"], only facets for "store123" and "store456"
            are returned. Only supported on predefined textual fields, custom
            textual attributes and fulfillments. Maximum is 20. Must be set for
            the fulfillment facet keys: * pickupInStore * shipToStore *
            sameDayDelivery * nextDayDelivery * customFulfillment1 *
            customFulfillment2 * customFulfillment3 * customFulfillment4 *
            customFulfillment5
        contains:
          type: array
          items:
            type: string
          description: >-
            Only get facet values that contains the given strings. For example,
            suppose "categories" has three values "Women > Shoe", "Women >
            Dress" and "Men > Shoe". If set "contains" to "Shoe", the
            "categories" facet gives only "Women > Shoe" and "Men > Shoe". Only
            supported on textual fields. Maximum is 10.
        caseInsensitive:
          type: boolean
          description: >-
            True to make facet keys case insensitive when getting faceting
            values with prefixes or contains; false otherwise.
        key:
          type: string
          description: >-
            Required. Supported textual and numerical facet keys in Product
            object, over which the facet values are computed. Facet key is
            case-sensitive. Allowed facet keys when FacetKey.query is not
            specified: * textual_field = * "brands" * "categories" * "genders" *
            "ageGroups" * "availability" * "colorFamilies" * "colors" * "sizes"
            * "materials" * "patterns" * "conditions" * "attributes.key" *
            "pickupInStore" * "shipToStore" * "sameDayDelivery" *
            "nextDayDelivery" * "customFulfillment1" * "customFulfillment2" *
            "customFulfillment3" * "customFulfillment4" * "customFulfillment5" *
            "inventory(place_id,attributes.key)" * numerical_field = * "price" *
            "discount" * "rating" * "ratingCount" * "attributes.key" *
            "inventory(place_id,price)" * "inventory(place_id,original_price)" *
            "inventory(place_id,attributes.key)"
        orderBy:
          description: >-
            The order in which SearchResponse.Facet.values are returned. Allowed
            values are: * "count desc", which means order by
            SearchResponse.Facet.values.count descending. * "value desc", which
            means order by SearchResponse.Facet.values.value descending. Only
            applies to textual facets. If not set, textual values are sorted in
            [natural order](https://en.wikipedia.org/wiki/Natural_sort_order);
            numerical intervals are sorted in the order given by
            FacetSpec.FacetKey.intervals; FulfillmentInfo.place_ids are sorted
            in the order given by FacetSpec.FacetKey.restricted_values.
          type: string
        returnMinMax:
          type: boolean
          description: >-
            Returns the min and max value for each numerical facet intervals.
            Ignored for textual facets.
        intervals:
          description: >-
            Set only if values should be bucketized into intervals. Must be set
            for facets with numerical values. Must not be set for facet with
            text values. Maximum number of intervals is 40. For all numerical
            facet keys that appear in the list of products from the catalog, the
            percentiles 0, 10, 30, 50, 70, 90, and 100 are computed from their
            distribution weekly. If the model assigns a high score to a
            numerical facet key and its intervals are not specified in the
            search request, these percentiles become the bounds for its
            intervals and are returned in the response. If the facet key
            intervals are specified in the request, then the specified intervals
            are returned instead.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2Interval'
        prefixes:
          type: array
          items:
            type: string
          description: >-
            Only get facet values that start with the given string prefix. For
            example, suppose "categories" has three values "Women > Shoe",
            "Women > Dress" and "Men > Shoe". If set "prefixes" to "Women", the
            "categories" facet gives only "Women > Shoe" and "Women > Dress".
            Only supported on textual fields. Maximum is 10.
        query:
          description: >-
            The query that is used to compute facet for the given facet key.
            When provided, it overrides the default behavior of facet
            computation. The query syntax is the same as a filter expression.
            See SearchRequest.filter for detail syntax and limitations. Notice
            that there is no limitation on FacetKey.key when query is specified.
            In the response, SearchResponse.Facet.values.value is always "1" and
            SearchResponse.Facet.values.count is the number of results that
            match the query. For example, you can set a customized facet for
            "shipToStore", where FacetKey.key is "customizedShipToStore", and
            FacetKey.query is "availability: ANY(\"IN_STOCK\") AND shipToStore:
            ANY(\"123\")". Then the facet counts the products that are both in
            stock and ship to store "123".
          type: string
      id: GoogleCloudRetailV2SearchRequestFacetSpecFacetKey
      type: object
    GoogleCloudRetailV2ImportUserEventsResponse:
      description: >-
        Response of the ImportUserEventsRequest. If the long running operation
        was successful, then this message is returned by the
        google.longrunning.Operations.response field if the operation was
        successful.
      properties:
        errorsConfig:
          $ref: '#/components/schemas/GoogleCloudRetailV2ImportErrorsConfig'
          description: >-
            Echoes the destination for the complete errors if this field was set
