    GoogleCloudRetailV2ImportProductsRequest:
      id: GoogleCloudRetailV2ImportProductsRequest
      type: object
      description: Request message for Import methods.
      properties:
        requestId:
          type: string
          description: Deprecated. This field has no effect.
          deprecated: true
        updateMask:
          type: string
          format: google-fieldmask
          description: >-
            Indicates which fields in the provided imported `products` to
            update. If not set, all fields are updated. If provided, only the
            existing product fields are updated. Missing products will not be
            created.
        inputConfig:
          description: Required. The desired input location of the data.
          $ref: '#/components/schemas/GoogleCloudRetailV2ProductInputConfig'
        notificationPubsubTopic:
          description: >-
            Full Pub/Sub topic name for receiving notification. If this field is
            set, when the import is finished, a notification is sent to
            specified Pub/Sub topic. The message data is JSON string of a
            Operation. Format of the Pub/Sub topic is
            `projects/{project}/topics/{topic}`. It has to be within the same
            project as ImportProductsRequest.parent. Make sure that both
            `cloud-retail-customer-data-access@system.gserviceaccount.com` and
            `service-@gcp-sa-retail.iam.gserviceaccount.com` have the
            `pubsub.topics.publish` IAM permission on the topic. Only supported
            when ImportProductsRequest.reconciliation_mode is set to `FULL`.
          type: string
        errorsConfig:
          $ref: '#/components/schemas/GoogleCloudRetailV2ImportErrorsConfig'
          description: The desired location of errors incurred during the Import.
        reconciliationMode:
          enumDescriptions:
            - Defaults to INCREMENTAL.
            - Inserts new products or updates existing products.
            - >-
              Calculates diff and replaces the entire product dataset. Existing
              products may be deleted if they are not present in the source
              location.
          enum:
            - RECONCILIATION_MODE_UNSPECIFIED
            - INCREMENTAL
            - FULL
          description: >-
            The mode of reconciliation between existing products and the
            products to be imported. Defaults to ReconciliationMode.INCREMENTAL.
          type: string
    GoogleCloudRetailV2alphaPurgeProductsResponse:
