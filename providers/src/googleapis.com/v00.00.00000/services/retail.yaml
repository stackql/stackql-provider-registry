    GoogleCloudRetailV2ProductLevelConfig:
      description: >-
        Configures what level the product should be uploaded with regards to how
        users will be send events and how predictions will be made.
      properties:
        ingestionProductType:
          type: string
          description: >-
            The type of Products allowed to be ingested into the catalog.
            Acceptable values are: * `primary` (default): You can ingest
            Products of all types. When ingesting a Product, its type will
            default to Product.Type.PRIMARY if unset. * `variant` (incompatible
            with Retail Search): You can only ingest Product.Type.VARIANT
            Products. This means Product.primary_product_id cannot be empty. If
            this field is set to an invalid value other than these, an
            INVALID_ARGUMENT error is returned. If this field is `variant` and
            merchant_center_product_id_field is `itemGroupId`, an
            INVALID_ARGUMENT error is returned. See [Product
            levels](https://cloud.google.com/retail/docs/catalog#product-levels)
            for more details.
        merchantCenterProductIdField:
          type: string
          description: >-
            Which field of [Merchant Center
            Product](/bigquery-transfer/docs/merchant-center-products-schema)
            should be imported as Product.id. Acceptable values are: * `offerId`
            (default): Import `offerId` as the product ID. * `itemGroupId`:
            Import `itemGroupId` as the product ID. Notice that Retail API will
            choose one item from the ones with the same `itemGroupId`, and use
            it to represent the item group. If this field is set to an invalid
            value other than these, an INVALID_ARGUMENT error is returned. If
            this field is `itemGroupId` and ingestion_product_type is `variant`,
            an INVALID_ARGUMENT error is returned. See [Product
            levels](https://cloud.google.com/retail/docs/catalog#product-levels)
            for more details.
      id: GoogleCloudRetailV2ProductLevelConfig
      type: object
    GoogleTypeDate:
      properties:
        day:
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0 to specify a year by itself or a year and month where
            the day isn't significant.
          format: int32
          type: integer
        year:
          format: int32
          description: >-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date
            without a year.
          type: integer
        month:
          type: integer
          description: >-
            Month of a year. Must be from 1 to 12, or 0 to specify a year
            without a month and day.
          format: int32
      description: >-
        Represents a whole or partial calendar date, such as a birthday. The
        time of day and time zone are either specified elsewhere or are
        insignificant. The date is relative to the Gregorian Calendar. This can
        represent one of the following: * A full date, with non-zero year,
        month, and day values. * A month and day, with a zero year (for example,
        an anniversary). * A year on its own, with a zero month and a zero day.
        * A year and month, with a zero day (for example, a credit card
        expiration date). Related types: * google.type.TimeOfDay *
        google.type.DateTime * google.protobuf.Timestamp
      id: GoogleTypeDate
      type: object
    GoogleCloudRetailV2CatalogAttributeFacetConfigRerankConfig:
      id: GoogleCloudRetailV2CatalogAttributeFacetConfigRerankConfig
      type: object
      description: >-
        Options to rerank based on facet values engaged by the user for the
        current key. That key needs to be a custom textual key and facetable. To
        use this control, you also need to pass all the facet keys engaged by
        the user in the request using the field [SearchRequest.FacetSpec]. In
        particular, if you don't pass the facet keys engaged that you want to
        rerank on, this control won't be effective. Moreover, to obtain better
        results, the facet values that you want to rerank on should be close to
        English (ideally made of words, underscores, and spaces).
      properties:
        rerankFacet:
          type: boolean
          description: >-
            If set to true, then we also rerank the dynamic facets based on the
            facet values engaged by the user for the current attribute key
            during serving.
        facetValues:
          type: array
          items:
            type: string
          description: >-
            If empty, rerank on all facet values for the current key. Otherwise,
            will rerank on the facet values from this list only.
