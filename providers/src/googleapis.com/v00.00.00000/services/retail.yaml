        ProductService.AddLocalInventories method.
    GoogleCloudRetailV2ImportUserEventsRequest:
      description: Request message for the ImportUserEvents request.
      properties:
        inputConfig:
          description: Required. The desired input location of the data.
          $ref: '#/components/schemas/GoogleCloudRetailV2UserEventInputConfig'
        errorsConfig:
          $ref: '#/components/schemas/GoogleCloudRetailV2ImportErrorsConfig'
          description: >-
            The desired location of errors incurred during the Import. Cannot be
            set for inline user event imports.
      id: GoogleCloudRetailV2ImportUserEventsRequest
      type: object
    GoogleCloudRetailV2Image:
      description: >-
        Product image. Recommendations AI and Retail Search use product images
        to improve prediction and search results. Product images can be returned
        in results, and are shown in prediction or search previews in the
        console. Please try to provide correct product images and avoid using
        images with size too small.
      properties:
        height:
          type: integer
          description: >-
            Height of the image in number of pixels. This field must be
            nonnegative. Otherwise, an INVALID_ARGUMENT error is returned.
          format: int32
        width:
          description: >-
            Width of the image in number of pixels. This field must be
            nonnegative. Otherwise, an INVALID_ARGUMENT error is returned.
          format: int32
          type: integer
        uri:
          description: >-
            Required. URI of the image. This field must be a valid UTF-8 encoded
            URI with a length limit of 5,000 characters. Otherwise, an
            INVALID_ARGUMENT error is returned. Google Merchant Center property
            [image_link](https://support.google.com/merchants/answer/6324350).
            Schema.org property [Product.image](https://schema.org/image).
          type: string
      id: GoogleCloudRetailV2Image
      type: object
    GoogleCloudRetailV2ColorInfo:
      properties:
        colorFamilies:
          type: array
          items:
            type: string
          description: >-
            The standard color families. Strongly recommended to use the
            following standard color groups: "Red", "Pink", "Orange", "Yellow",
            "Purple", "Green", "Cyan", "Blue", "Brown", "White", "Gray", "Black"
            and "Mixed". Normally it is expected to have only 1 color family.
            May consider using single "Mixed" instead of multiple values. A
            maximum of 5 values are allowed. Each value must be a UTF-8 encoded
            string with a length limit of 128 characters. Otherwise, an
            INVALID_ARGUMENT error is returned. Google Merchant Center property
            [color](https://support.google.com/merchants/answer/6324487).
            Schema.org property [Product.color](https://schema.org/color). The
            colorFamilies field as a system attribute is not a required field
            but strongly recommended to be specified. Google Search models treat
            this field as more important than a custom product attribute when
            specified.
        colors:
          description: >-
            The color display names, which may be different from standard color
            family names, such as the color aliases used in the website
            frontend. Normally it is expected to have only 1 color. May consider
            using single "Mixed" instead of multiple values. A maximum of 75
            colors are allowed. Each value must be a UTF-8 encoded string with a
            length limit of 128 characters. Otherwise, an INVALID_ARGUMENT error
            is returned. Google Merchant Center property
            [color](https://support.google.com/merchants/answer/6324487).
            Schema.org property [Product.color](https://schema.org/color).
          type: array
          items:
            type: string
      description: The color information of a Product.
      id: GoogleCloudRetailV2ColorInfo
      type: object
    GoogleCloudRetailLoggingImportErrorContext:
      properties:
        product:
          description: The detailed content which caused the error on importing a product.
          type: string
        userEvent:
          type: string
          description: >-
            The detailed content which caused the error on importing a user
            event.
        operationName:
          description: The operation resource name of the LRO.
          type: string
        lineNumber:
          description: >-
            Line number of the content in file. Should be empty for permission
