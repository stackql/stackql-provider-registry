      properties:
        errorSamples:
          type: array
          items:
            $ref: '#/components/schemas/GoogleRpcStatus'
          description: A sample of errors encountered while processing the request.
        errorsConfig:
          $ref: '#/components/schemas/GoogleCloudRetailV2betaExportErrorsConfig'
          description: This field is never set.
        outputResult:
          $ref: '#/components/schemas/GoogleCloudRetailV2betaOutputResult'
          description: Output result indicating where the data were exported to.
      id: GoogleCloudRetailV2betaExportAnalyticsMetricsResponse
      type: object
    GoogleCloudRetailV2SafetySetting:
      id: GoogleCloudRetailV2SafetySetting
      type: object
      properties:
        threshold:
          type: string
          description: The harm block threshold.
          enumDescriptions:
            - Unspecified harm block threshold.
            - Block low threshold and above (i.e. block more).
            - Block medium threshold and above.
            - Block only high threshold (i.e. block less).
            - Block none.
            - Turn off the safety filter.
          enum:
            - HARM_BLOCK_THRESHOLD_UNSPECIFIED
            - BLOCK_LOW_AND_ABOVE
            - BLOCK_MEDIUM_AND_ABOVE
            - BLOCK_ONLY_HIGH
            - BLOCK_NONE
            - 'OFF'
        category:
          type: string
          enumDescriptions:
            - The harm category is unspecified.
            - The harm category is hate speech.
            - The harm category is dangerous content.
            - The harm category is harassment.
            - The harm category is sexually explicit content.
            - The harm category is civic integrity.
          enum:
            - HARM_CATEGORY_UNSPECIFIED
            - HARM_CATEGORY_HATE_SPEECH
            - HARM_CATEGORY_DANGEROUS_CONTENT
            - HARM_CATEGORY_HARASSMENT
            - HARM_CATEGORY_SEXUALLY_EXPLICIT
            - HARM_CATEGORY_CIVIC_INTEGRITY
          description: Harm category.
        method:
          description: >-
            Optional. Specify if the threshold is used for probability or
            severity score. If not specified, the threshold is used for
            probability score.
          enumDescriptions:
            - The harm block method is unspecified.
            - The harm block method uses both probability and severity scores.
            - The harm block method uses the probability score.
          enum:
            - HARM_BLOCK_METHOD_UNSPECIFIED
            - SEVERITY
            - PROBABILITY
          type: string
      description: Safety settings.
    GoogleCloudRetailV2PurchaseTransaction:
      id: GoogleCloudRetailV2PurchaseTransaction
      type: object
      properties:
        id:
          type: string
          description: The transaction ID with a length limit of 128 characters.
        cost:
          description: >-
            All the costs associated with the products. These can be
            manufacturing costs, shipping expenses not borne by the end user, or
            any other costs, such that: * Profit = revenue - tax - cost
          format: float
          type: number
        tax:
          format: float
          description: All the taxes associated with the transaction.
          type: number
        currencyCode:
          description: Required. Currency code. Use three-character ISO-4217 code.
          type: string
        revenue:
          description: >-
            Required. Total non-zero revenue or grand total associated with the
            transaction. This value include shipping, tax, or other adjustments
            to total revenue that you want to include as part of your revenue
            calculations.
          format: float
          type: number
      description: A transaction represents the entire purchase transaction.
    GoogleCloudRetailV2ConditionTimeRange:
      id: GoogleCloudRetailV2ConditionTimeRange
      type: object
      description: >-
        Used for time-dependent conditions. Example: Want to have rule applied
        for week long sale.
      properties:
        startTime:
          type: string
          format: google-datetime
          description: Start of time range. Range is inclusive.
        endTime:
          type: string
          description: End of time range. Range is inclusive.
          format: google-datetime
    GoogleCloudRetailV2betaModelModelFeaturesConfig:
      properties:
        frequentlyBoughtTogetherConfig:
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2betaModelFrequentlyBoughtTogetherFeaturesConfig
          description: Additional configs for frequently-bought-together models.
      description: Additional model features config.
      id: GoogleCloudRetailV2betaModelModelFeaturesConfig
      type: object
    GoogleCloudRetailV2SearchRequestFacetSpec:
      id: GoogleCloudRetailV2SearchRequestFacetSpec
      type: object
      properties:
        excludedFilterKeys:
          description: >-
            List of keys to exclude when faceting. By default, FacetKey.key is
            not excluded from the filter unless it is listed in this field.
            Listing a facet key in this field allows its values to appear as
            facet results, even when they are filtered out of search results.
            Using this field does not affect what search results are returned.
            For example, suppose there are 100 products with the color facet
            "Red" and 200 products with the color facet "Blue". A query
            containing the filter "colorFamilies:ANY("Red")" and having
            "colorFamilies" as FacetKey.key would by default return only "Red"
            products in the search results, and also return "Red" with count 100
            as the only color facet. Although there are also blue products
            available, "Blue" would not be shown as an available facet value. If
            "colorFamilies" is listed in "excludedFilterKeys", then the query
            returns the facet values "Red" with count 100 and "Blue" with count
            200, because the "colorFamilies" key is now excluded from the
            filter. Because this field doesn't affect search results, the search
            results are still correctly filtered to return only "Red" products.
            A maximum of 100 values are allowed. Otherwise, an INVALID_ARGUMENT
            error is returned.
          type: array
          items:
            type: string
        limit:
          type: integer
          description: >-
            Maximum of facet values that should be returned for this facet. If
            unspecified, defaults to 50. The maximum allowed value is 300.
            Values above 300 will be coerced to 300. If this field is negative,
            an INVALID_ARGUMENT is returned.
          format: int32
        enableDynamicPosition:
          description: >-
            Enables dynamic position for this facet. If set to true, the
            position of this facet among all facets in the response is
            determined by Google Retail Search. It is ordered together with
            dynamic facets if dynamic facets is enabled. If set to false, the
            position of this facet in the response is the same as in the
            request, and it is ranked before the facets with dynamic position
            enable and all dynamic facets. For example, you may always want to
            have rating facet returned in the response, but it's not necessarily
            to always display the rating facet at the top. In that case, you can
            set enable_dynamic_position to true so that the position of rating
            facet in response is determined by Google Retail Search. Another
            example, assuming you have the following facets in the request: *
            "rating", enable_dynamic_position = true * "price",
            enable_dynamic_position = false * "brands", enable_dynamic_position
            = false And also you have a dynamic facets enable, which generates a
            facet "gender". Then, the final order of the facets in the response
            can be ("price", "brands", "rating", "gender") or ("price",
            "brands", "gender", "rating") depends on how Google Retail Search
            orders "gender" and "rating" facets. However, notice that "price"
            and "brands" are always ranked at first and second position because
            their enable_dynamic_position values are false.
          type: boolean
        facetKey:
          description: Required. The facet key specification.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestFacetSpecFacetKey
      description: A facet specification to perform faceted search.
    GoogleCloudRetailV2CompletionConfig:
      description: >-
        Catalog level autocomplete config for customers to customize
        autocomplete feature's settings.
      properties:
        suggestionsInputConfig:
          description: >-
            Output only. The source data for the latest import of the
            autocomplete suggestion phrases.
          readOnly: true
          $ref: '#/components/schemas/GoogleCloudRetailV2CompletionDataInputConfig'
        lastSuggestionsImportOperation:
          description: >-
            Output only. Name of the LRO corresponding to the latest suggestion
            terms list import. Can use GetOperation API method to retrieve the
            latest state of the Long Running Operation.
          readOnly: true
          type: string
        name:
          type: string
          description: >-
            Required. Immutable. Fully qualified name
            `projects/*/locations/*/catalogs/*/completionConfig`
        minPrefixLength:
          description: >-
            The minimum number of characters needed to be typed in order to get
            suggestions. Default value is 2. If left unset or set to 0, then
            will fallback to default value. Value range is 1 to 20.
          format: int32
          type: integer
        autoLearning:
          description: >-
            If set to true, the auto learning function is enabled. Auto learning
            uses user data to generate suggestions using ML techniques. Default
            value is false. Only after enabling auto learning can users use
            `cloud-retail` data in CompleteQueryRequest.
          type: boolean
        allowlistInputConfig:
          $ref: '#/components/schemas/GoogleCloudRetailV2CompletionDataInputConfig'
          description: >-
            Output only. The source data for the latest import of the
            autocomplete allowlist phrases.
          readOnly: true
        denylistInputConfig:
          readOnly: true
          description: >-
            Output only. The source data for the latest import of the
            autocomplete denylist phrases.
          $ref: '#/components/schemas/GoogleCloudRetailV2CompletionDataInputConfig'
        lastDenylistImportOperation:
          type: string
          description: >-
            Output only. Name of the LRO corresponding to the latest denylist
            import. Can use GetOperation API to retrieve the latest state of the
            Long Running Operation.
          readOnly: true
        maxSuggestions:
          format: int32
          description: >-
            The maximum number of autocomplete suggestions returned per term.
            Default value is 20. If left unset or set to 0, then will fallback
            to default value. Value range is 1 to 20.
          type: integer
        matchingOrder:
          description: >-
            Specifies the matching order for autocomplete suggestions, e.g., a
            query consisting of 'sh' with 'out-of-order' specified would suggest
            "women's shoes", whereas a query of 'red s' with 'exact-prefix'
            specified would suggest "red shoes". Currently supported values: *
            'out-of-order' * 'exact-prefix' Default value: 'exact-prefix'.
          type: string
        lastAllowlistImportOperation:
          type: string
          description: >-
            Output only. Name of the LRO corresponding to the latest allowlist
            import. Can use GetOperation API to retrieve the latest state of the
            Long Running Operation.
          readOnly: true
      id: GoogleCloudRetailV2CompletionConfig
      type: object
    GoogleCloudRetailV2ConversationalSearchCustomizationConfig:
      id: GoogleCloudRetailV2ConversationalSearchCustomizationConfig
      type: object
      properties:
        catalog:
          type: string
          description: >-
            Required. Resource name of the catalog. Format:
            projects/{project}/locations/{location}/catalogs/{catalog}
        retailerDisplayName:
          type: string
          description: >-
            Optional. The retailer's display name that could be used in our LLM
            answers. Example - "Google"
        intentClassificationConfig:
          description: Optional. The configs for intent classification.
          $ref: '#/components/schemas/GoogleCloudRetailV2IntentClassificationConfig'
      description: >-
        The public proto to represent the conversational search customization
        config. It will be converted to the internal proto in the backend.
    GoogleCloudRetailV2PurgeUserEventsRequest:
      description: Request message for PurgeUserEvents method.
      properties:
        filter:
          type: string
          description: >-
            Required. The filter string to specify the events to be deleted with
            a length limit of 5,000 characters. Empty string filter is not
            allowed. The eligible fields for filtering are: * `eventType`:
            Double quoted UserEvent.event_type string. * `eventTime`: in ISO
            8601 "zulu" format. * `visitorId`: Double quoted string. Specifying
            this will delete all events associated with a visitor. * `userId`:
            Double quoted string. Specifying this will delete all events
            associated with a user. Examples: * Deleting all events in a time
            range: `eventTime > "2012-04-23T18:25:43.511Z" eventTime <
            "2012-04-23T18:30:43.511Z"` * Deleting specific eventType in time
            range: `eventTime > "2012-04-23T18:25:43.511Z" eventType =
            "detail-page-view"` * Deleting all events for a specific visitor:
            `visitorId = "visitor1024"` The filtering fields are assumed to have
            an implicit AND.
        force:
          type: boolean
          description: >-
            Actually perform the purge. If `force` is set to false, the method
            will return the expected purge count without deleting any user
            events.
      id: GoogleCloudRetailV2PurgeUserEventsRequest
      type: object
    GoogleCloudRetailV2SearchRequestConversationalSearchSpec:
      properties:
        followupConversationRequested:
          description: >-
            This field specifies whether the customer would like to do
            conversational search. If this field is set to true, conversational
            related extra information will be returned from server side,
            including follow-up question, answer options, etc.
          type: boolean
        conversationId:
          type: string
          description: >-
            This field specifies the conversation id, which maintains the state
            of the conversation between client side and server side. Use the
            value from the previous
            SearchResponse.ConversationalSearchResult.conversation_id. For the
            initial request, this should be empty.
        userAnswer:
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestConversationalSearchSpecUserAnswer
          description: >-
            This field specifies the current user answer during the
            conversational search. This can be either user selected from
            suggested answers or user input plain text.
      description: >-
        This field specifies all conversational related parameters addition to
        traditional retail search.
      id: GoogleCloudRetailV2SearchRequestConversationalSearchSpec
      type: object
