      type: object
      description: >-
        Replaces a set of textual facet values by the same (possibly different)
        merged facet value. Each facet value should appear at most once as a
        value per CatalogAttribute. This feature is available only for textual
        custom attributes.
      properties:
        values:
          type: array
          items:
            type: string
          description: >-
