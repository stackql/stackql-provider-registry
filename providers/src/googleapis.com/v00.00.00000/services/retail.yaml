            Optional. The intent_type must match one of the predefined intent
            types defined at
            https://cloud.google.com/retail/docs/reference/rpc/google.cloud.retail.v2alpha#querytype
        reason:
          description: >-
            Optional. The reason for the intent classification. This is used to
            explain the intent classification decision.
          type: string
        classifiedPositive:
          description: Required. Whether the example is classified positively.
