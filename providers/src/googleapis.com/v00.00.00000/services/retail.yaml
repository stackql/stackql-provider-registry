          description: >-
            The key for this facet. E.g., "colorFamilies" or "price" or
            "attributes.attr1".
        values:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2SearchResponseFacetFacetValue
          description: The facet values for this field.
    GoogleCloudRetailV2AddLocalInventoriesResponse:
      id: GoogleCloudRetailV2AddLocalInventoriesResponse
      type: object
      properties: {}
      description: >-
        Response of the ProductService.AddLocalInventories API. Currently empty
