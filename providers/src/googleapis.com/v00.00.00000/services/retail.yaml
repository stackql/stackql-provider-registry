      description: Request for RemoveControl method.
    GoogleCloudRetailV2SearchResponseSearchResult:
      id: GoogleCloudRetailV2SearchResponseSearchResult
      type: object
      properties:
        id:
          type: string
          description: Product.id of the searched Product.
        matchingVariantFields:
          description: >-
            If a variant Product matches the search query, this map indicates
            which Product fields are matched. The key is the Product.name, the
            value is a field mask of the matched Product fields. If matched
            attributes cannot be determined, this map will be empty. For
            example, a key "sku1" with field mask "products.color_info"
            indicates there is a match between "sku1" ColorInfo and the query.
          type: object
          additionalProperties:
            type: string
            format: google-fieldmask
        matchingVariantCount:
          description: The count of matched variant Products.
          format: int32
          type: integer
        personalLabels:
          description: >-
            Specifies previous events related to this product for this user
            based on UserEvent with same SearchRequest.visitor_id or
            UserInfo.user_id. This is set only when
            SearchRequest.PersonalizationSpec.mode is
            SearchRequest.PersonalizationSpec.Mode.AUTO. Possible values: *
            `purchased`: Indicates that this product has been purchased before.
          type: array
          items:
            type: string
        modelScores:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GoogleCloudRetailV2DoubleList'
          description: Google provided available scores.
        variantRollupValues:
          description: >-
            The rollup matching variant Product attributes. The key is one of
            the SearchRequest.variant_rollup_keys. The values are the merged and
            de-duplicated Product attributes. Notice that the rollup values are
            respect filter. For example, when filtering by
            "colorFamilies:ANY(\"red\")" and rollup "colorFamilies", only "red"
            is returned. For textual and numerical attributes, the rollup values
            is a list of string or double values with type
            google.protobuf.ListValue. For example, if there are two variants
            with colors "red" and "blue", the rollup values are { key:
            "colorFamilies" value { list_value { values { string_value: "red" }
            values { string_value: "blue" } } } } For FulfillmentInfo, the
            rollup values is a double value with type google.protobuf.Value. For
            example, `{key: "pickupInStore.store1" value { number_value: 10 }}`
            means a there are 10 variants in this product are available in the
            store "store1".
          type: object
          additionalProperties:
            type: any
        product:
          description: >-
            The product data snippet in the search response. Only Product.name
            is guaranteed to be populated. Product.variants contains the product
            variants that match the search query. If there are multiple product
            variants matching the query, top 5 most relevant product variants
            are returned and ordered by relevancy. If relevancy can be
            deternmined, use matching_variant_fields to look up matched product
            variants fields. If relevancy cannot be determined, e.g. when
            searching "shoe" all products in a shoe product can be a match, 5
            product variants are returned but order is meaningless.
          $ref: '#/components/schemas/GoogleCloudRetailV2Product'
      description: Represents the search results.
    GoogleCloudRetailV2Rating:
      properties:
        ratingCount:
          type: integer
          format: int32
          description: >-
            The total number of ratings. This value is independent of the value
            of rating_histogram. This value must be nonnegative. Otherwise, an
            INVALID_ARGUMENT error is returned.
        averageRating:
          format: float
          description: >-
            The average rating of the Product. The rating is scaled at 1-5.
            Otherwise, an INVALID_ARGUMENT error is returned.
          type: number
        ratingHistogram:
          type: array
          items:
            type: integer
            format: int32
          description: >-
            List of rating counts per rating value (index = rating - 1). The
            list is empty if there is no rating. If the list is non-empty, its
            size is always 5. Otherwise, an INVALID_ARGUMENT error is returned.
            For example, [41, 14, 13, 47, 303]. It means that the Product got 41
            ratings with 1 star, 14 ratings with 2 star, and so on.
      description: The rating of a Product.
      id: GoogleCloudRetailV2Rating
      type: object
