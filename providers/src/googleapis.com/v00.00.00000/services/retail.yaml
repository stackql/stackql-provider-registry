        errorSamples:
          type: array
          items:
            $ref: '#/components/schemas/GoogleRpcStatus'
          description: A sample of errors encountered while processing the request.
        importSummary:
          description: Aggregated statistics of user event import status.
          $ref: '#/components/schemas/GoogleCloudRetailV2UserEventImportSummary'
      id: GoogleCloudRetailV2ImportUserEventsResponse
      type: object
    GoogleCloudRetailV2alphaPurgeUserEventsResponse:
      id: GoogleCloudRetailV2alphaPurgeUserEventsResponse
      type: object
      properties:
        purgedEventsCount:
          format: int64
          description: The total count of events purged as a result of the operation.
          type: string
      description: >-
        Response of the PurgeUserEventsRequest. If the long running operation is
        successfully done, then this message is returned by the
        google.longrunning.Operations.response field.
    GoogleCloudRetailV2CustomAttribute:
      properties:
        text:
          type: array
          items:
            type: string
          description: >-
            The textual values of this custom attribute. For example,
            `["yellow", "green"]` when the key is "color". Empty string is not
            allowed. Otherwise, an INVALID_ARGUMENT error is returned. Exactly
            one of text or numbers should be set. Otherwise, an INVALID_ARGUMENT
            error is returned.
        searchable:
          type: boolean
          deprecated: true
          description: >-
            This field is normally ignored unless
            AttributesConfig.attribute_config_level of the Catalog is set to the
            deprecated 'PRODUCT_LEVEL_ATTRIBUTE_CONFIG' mode. For information
            about product-level attribute configuration, see [Configuration
            modes](https://cloud.google.com/retail/docs/attribute-config#config-modes).
            If true, custom attribute values are searchable by text queries in
            SearchService.Search. This field is ignored in a UserEvent. Only set
            if type text is set. Otherwise, a INVALID_ARGUMENT error is
            returned.
        numbers:
          description: >-
            The numerical values of this custom attribute. For example, `[2.3,
            15.4]` when the key is "lengths_cm". Exactly one of text or numbers
            should be set. Otherwise, an INVALID_ARGUMENT error is returned.
          type: array
          items:
            type: number
            format: double
        indexable:
          type: boolean
          description: >-
            This field is normally ignored unless
            AttributesConfig.attribute_config_level of the Catalog is set to the
            deprecated 'PRODUCT_LEVEL_ATTRIBUTE_CONFIG' mode. For information
            about product-level attribute configuration, see [Configuration
            modes](https://cloud.google.com/retail/docs/attribute-config#config-modes).
            If true, custom attribute values are indexed, so that they can be
            filtered, faceted or boosted in SearchService.Search. This field is
            ignored in a UserEvent. See SearchRequest.filter,
            SearchRequest.facet_specs and SearchRequest.boost_spec for more
            details.
          deprecated: true
      description: A custom attribute that is not explicitly modeled in Product.
      id: GoogleCloudRetailV2CustomAttribute
      type: object
    GoogleCloudRetailV2PurgeProductsResponse:
      description: >-
        Response of the PurgeProductsRequest. If the long running operation is
        successfully done, then this message is returned by the
        google.longrunning.Operations.response field.
      properties:
        purgeCount:
          description: The total count of products purged as a result of the operation.
          format: int64
          type: string
        purgeSample:
          description: >-
            A sample of the product names that will be deleted. Only populated
            if `force` is set to false. A max of 100 names will be returned and
            the names are chosen at random.
          type: array
          items:
            type: string
      id: GoogleCloudRetailV2PurgeProductsResponse
      type: object
    GoogleCloudRetailV2RuleFilterAction:
      id: GoogleCloudRetailV2RuleFilterAction
      type: object
      properties:
        filter:
          description: >-
            A filter to apply on the matching condition results. Supported
            features: * filter must be set. * Filter syntax is identical to
            SearchRequest.filter. For more information, see
            [Filter](/retail/docs/filter-and-order#filter). * To filter products
            with product ID "product_1" or "product_2", and color "Red" or
            "Blue": *(id: ANY("product_1", "product_2")) * *AND *
            *(colorFamilies: ANY("Red", "Blue")) *
          type: string
      description: >-
        * Rule Condition: - No Condition.query_terms provided is a global match.
        - 1 or more Condition.query_terms provided are combined with OR
        operator. * Action Input: The request query and filter that are applied
        to the retrieved products, in addition to any filters already provided
        with the SearchRequest. The AND operator is used to combine the query's
        existing filters with the filter rule(s). NOTE: May result in 0 results
        when filters conflict. * Action Result: Filters the returned objects to
        be ONLY those that passed the filter.
    GoogleCloudRetailV2ConversationalSearchResponse:
      id: GoogleCloudRetailV2ConversationalSearchResponse
      type: object
      description: >-
        Response message for ConversationalSearchService.ConversationalSearch
        method.
      properties:
        userQueryTypes:
          description: >-
            The types Retail classifies the search query as. Supported values
            are: - "ORDER_SUPPORT" - "SIMPLE_PRODUCT_SEARCH" -
            "INTENT_REFINEMENT" - "PRODUCT_DETAILS" - "PRODUCT_COMPARISON" -
            "DEALS_AND_COUPONS" - "STORE_RELEVANT" - "BLOCKLISTED" -
            "BEST_PRODUCT" - "RETAIL_SUPPORT" - "DISABLED"
          type: array
          items:
            type: string
        conversationId:
          description: >-
            Conversation UUID. This field will be stored in client side storage
            to maintain the conversation session with server and will be used
            for next search request's
            ConversationalSearchRequest.conversation_id to restore conversation
            state in server.
          type: string
        followupQuestion:
          description: >-
            The conversational followup question generated for Intent
            refinement.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2ConversationalSearchResponseFollowupQuestion
        refinedSearch:
          description: >-
            The proposed refined search queries. They can be used to fetch the
            relevant search results. When using CONVERSATIONAL_FILTER_ONLY mode,
            the refined_query from search response will be populated here.
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2ConversationalSearchResponseRefinedSearch
        state:
          readOnly: true
          enumDescriptions:
            - Unknown.
            - Response generation is being streamed.
            - Response generation has succeeded.
          enum:
            - STATE_UNSPECIFIED
            - STREAMING
            - SUCCEEDED
          type: string
          description: Output only. The state of the response generation.
        conversationalFilteringResult:
          description: >-
            This field specifies all related information that is needed on
            client side for UI rendering of conversational filtering search.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2ConversationalSearchResponseConversationalFilteringResult
        conversationalTextResponse:
          type: string
          description: >-
            The conversational answer-based text response generated by the
            Server.
    GoogleCloudRetailV2ConversationalSearchResponseFollowupQuestionSuggestedAnswer:
      properties:
        productAttributeValue:
          $ref: '#/components/schemas/GoogleCloudRetailV2ProductAttributeValue'
          description: >-
            Product attribute value, including an attribute key and an attribute
            value. Other types can be added here in the future.
      description: >-
        Suggested answers to the follow-up question. If it's numerical
        attribute, only ProductAttributeInterval will be set. If it's textual
        attribute, only productAttributeValue will be set.
      id: >-
        GoogleCloudRetailV2ConversationalSearchResponseFollowupQuestionSuggestedAnswer
      type: object
    GoogleCloudRetailV2RuleBoostAction:
      id: GoogleCloudRetailV2RuleBoostAction
      type: object
      description: A boost action to apply to results matching condition specified above.
      properties:
        productsFilter:
          description: >-
            The filter can have a max size of 5000 characters. An expression
            which specifies which products to apply an action to. The syntax and
            supported fields are the same as a filter expression. See
            SearchRequest.filter for detail syntax and limitations. Examples: *
            To boost products with product ID "product_1" or "product_2", and
            color "Red" or "Blue": *(id: ANY("product_1", "product_2")) * *AND *
            *(colorFamilies: ANY("Red", "Blue")) *
          type: string
        boost:
          type: number
          description: >-
            Strength of the condition boost, which must be in [-1, 1]. Negative
            boost means demotion. Default is 0.0. Setting to 1.0 gives the item
            a big promotion. However, it does not necessarily mean that the
            boosted item will be the top result at all times, nor that other
            items will be excluded. Results could still be shown even when none
            of them matches the condition. And results that are significantly
            more relevant to the search query can still trump your heavily
            favored but irrelevant items. Setting to -1.0 gives the item a big
            demotion. However, results that are deeply relevant might still be
            shown. The item will have an upstream battle to get a fairly high
            ranking, but it is not blocked out completely. Setting to 0.0 means
            no boost applied. The boosting condition is ignored.
          format: float
    GoogleCloudRetailV2betaSetInventoryMetadata:
      id: GoogleCloudRetailV2betaSetInventoryMetadata
      type: object
      description: >-
        Metadata related to the progress of the SetInventory operation.
        Currently empty because there is no meaningful metadata populated from
        the ProductService.SetInventory method.
      properties: {}
    GoogleCloudRetailV2alphaEnrollSolutionResponse:
