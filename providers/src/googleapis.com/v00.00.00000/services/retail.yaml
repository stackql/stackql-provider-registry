            $ref: '#/components/schemas/GoogleCloudRetailV2betaBigQueryOutputResult'
        gcsResult:
          description: The Google Cloud Storage location where the result is stored.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2betaGcsOutputResult'
      description: >-
        Output result that stores the information about where the exported data
        is stored.
    GoogleCloudRetailV2SearchRequestConversationalSearchSpecUserAnswer:
      id: GoogleCloudRetailV2SearchRequestConversationalSearchSpecUserAnswer
      type: object
      description: >-
        This field specifies the current user answer during the conversational
        search. This can be either user selected from suggested answers or user
        input plain text.
      properties:
        textAnswer:
          type: string
          description: >-
            This field specifies the incremental input text from the user during
            the conversational search.
        selectedAnswer:
          description: >-
            This field specifies the selected attributes during the
            conversational search. This should be a subset of
            SearchResponse.ConversationalSearchResult.suggested_answers.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestConversationalSearchSpecUserAnswerSelectedAnswer
    GoogleCloudRetailV2UserInfo:
      id: GoogleCloudRetailV2UserInfo
      type: object
      description: Information of an end user.
      properties:
        userId:
          type: string
          description: >-
            Highly recommended for logged-in users. Unique identifier for
            logged-in user, such as a user name. Don't set for anonymous users.
            Always use a hashed value for this ID. Don't set the field to the
            same fixed ID for different users. This mixes the event history of
            those users together, which results in degraded model quality. The
            field must be a UTF-8 encoded string with a length limit of 128
            characters. Otherwise, an INVALID_ARGUMENT error is returned.
        ipAddress:
          type: string
          description: >-
            The end user's IP address. This field is used to extract location
            information for personalization. This field must be either an IPv4
            address (e.g. "104.133.9.80") or an IPv6 address (e.g.
            "2001:0db8:85a3:0000:0000:8a2e:0370:7334"). Otherwise, an
            INVALID_ARGUMENT error is returned. This should not be set when: *
            setting SearchRequest.user_info. * using the JavaScript tag in
            UserEventService.CollectUserEvent or if direct_user_request is set.
        userAgent:
          description: >-
            User agent as included in the HTTP header. The field must be a UTF-8
            encoded string with a length limit of 1,000 characters. Otherwise,
            an INVALID_ARGUMENT error is returned. This should not be set when
            using the client side event reporting with GTM or JavaScript tag in
            UserEventService.CollectUserEvent or if direct_user_request is set.
          type: string
        directUserRequest:
          description: >-
            True if the request is made directly from the end user, in which
            case the ip_address and user_agent can be populated from the HTTP
            request. This flag should be set only if the API request is made
            directly from the end user such as a mobile app (and not if a
            gateway or a server is processing and pushing the user events). This
            should not be set when using the JavaScript tag in
            UserEventService.CollectUserEvent.
          type: boolean
    GoogleCloudRetailV2ConversationalSearchRequestUserAnswerSelectedAnswer:
      id: GoogleCloudRetailV2ConversationalSearchRequestUserAnswerSelectedAnswer
      type: object
      properties:
        productAttributeValue:
          description: >-
            Optional. This field specifies the selected answer which is a
            attribute key-value.
          $ref: '#/components/schemas/GoogleCloudRetailV2ProductAttributeValue'
      description: >-
        This field specifies the selected answers during the conversational
        search.
    GoogleCloudRetailV2alphaModelModelFeaturesConfig:
      id: GoogleCloudRetailV2alphaModelModelFeaturesConfig
      type: object
      description: Additional model features config.
      properties:
        frequentlyBoughtTogetherConfig:
          description: Additional configs for frequently-bought-together models.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2alphaModelFrequentlyBoughtTogetherFeaturesConfig
    GoogleCloudRetailV2betaModel:
      id: GoogleCloudRetailV2betaModel
      type: object
      properties:
        lastTuneTime:
          readOnly: true
          format: google-datetime
          description: Output only. The timestamp when the latest successful tune finished.
          type: string
        tuningOperation:
          type: string
          description: >-
            Output only. The tune operation associated with the model. Can be
            used to determine if there is an ongoing tune for this
            recommendation. Empty field implies no tune is goig on.
          readOnly: true
        servingConfigLists:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2betaModelServingConfigList'
          description: >-
            Output only. The list of valid serving configs associated with the
            PageOptimizationConfig.
          readOnly: true
        updateTime:
          type: string
          description: >-
            Output only. Timestamp the Recommendation Model was last updated.
            E.g. if a Recommendation Model was paused - this would be the time
            the pause was initiated.
          readOnly: true
          format: google-datetime
        displayName:
          type: string
          description: >-
            Required. The display name of the model. Should be human readable,
            used to display Recommendation Models in the Retail Cloud Console
            Dashboard. UTF-8 encoded string with limit of 1024 characters.
        optimizationObjective:
          description: >-
            Optional. The optimization objective e.g. `cvr`. Currently supported
            values: `ctr`, `cvr`, `revenue-per-order`. If not specified, we
            choose default based on model type. Default depends on type of
            recommendation: `recommended-for-you` => `ctr` `others-you-may-like`
            => `ctr` `frequently-bought-together` => `revenue_per_order` This
            field together with optimization_objective describe model metadata
            to use to control model training and serving. See
            https://cloud.google.com/retail/docs/models for more details on what
            the model metadata control and which combination of parameters are
            valid. For invalid combinations of parameters (e.g. type =
            `frequently-bought-together` and optimization_objective = `ctr`),
            you receive an error 400 if you try to create/update a
            recommendation with this set of knobs.
          type: string
        modelFeaturesConfig:
          $ref: '#/components/schemas/GoogleCloudRetailV2betaModelModelFeaturesConfig'
          description: Optional. Additional model features config.
        filteringOption:
          enumDescriptions:
            - >-
              Value used when unset. In this case, server behavior defaults to
              RECOMMENDATIONS_FILTERING_DISABLED.
            - Recommendation filtering is disabled.
            - Recommendation filtering is enabled.
          enum:
            - RECOMMENDATIONS_FILTERING_OPTION_UNSPECIFIED
            - RECOMMENDATIONS_FILTERING_DISABLED
            - RECOMMENDATIONS_FILTERING_ENABLED
          description: >-
            Optional. If `RECOMMENDATIONS_FILTERING_ENABLED`, recommendation
            filtering by attributes is enabled for the model.
          type: string
        dataState:
          type: string
          description: >-
            Output only. The state of data requirements for this model:
            `DATA_OK` and `DATA_ERROR`. Recommendation model cannot be trained
            if the data is in `DATA_ERROR` state. Recommendation model can have
            `DATA_ERROR` state even if serving state is `ACTIVE`: models were
            trained successfully before, but cannot be refreshed because model
            no longer has sufficient data for training.
          readOnly: true
          enumDescriptions:
            - Unspecified default value, should never be explicitly set.
            - The model has sufficient training data.
            - >-
              The model does not have sufficient training data. Error messages
              can be queried via Stackdriver.
          enum:
            - DATA_STATE_UNSPECIFIED
            - DATA_OK
            - DATA_ERROR
        servingState:
          readOnly: true
          enumDescriptions:
            - Unspecified serving state.
            - The model is not serving.
            - The model is serving and can be queried.
            - The model is trained on tuned hyperparameters and can be queried.
          enum:
            - SERVING_STATE_UNSPECIFIED
            - INACTIVE
            - ACTIVE
            - TUNED
          type: string
          description: 'Output only. The serving state of the model: `ACTIVE`, `NOT_ACTIVE`.'
        name:
          description: >-
            Required. The fully qualified resource name of the model. Format:
            `projects/{project_number}/locations/{location_id}/catalogs/{catalog_id}/models/{model_id}`
            catalog_id has char limit of 50. recommendation_model_id has char
            limit of 40.
          type: string
        createTime:
          description: Output only. Timestamp the Recommendation Model was created at.
          readOnly: true
          format: google-datetime
          type: string
        type:
          description: >-
            Required. The type of model e.g. `home-page`. Currently supported
            values: `recommended-for-you`, `others-you-may-like`,
            `frequently-bought-together`, `page-optimization`, `similar-items`,
            `buy-it-again`, `on-sale-items`, and `recently-viewed`(readonly
            value). This field together with optimization_objective describe
            model metadata to use to control model training and serving. See
            https://cloud.google.com/retail/docs/models for more details on what
            the model metadata control and which combination of parameters are
            valid. For invalid combinations of parameters (e.g. type =
            `frequently-bought-together` and optimization_objective = `ctr`),
            you receive an error 400 if you try to create/update a
            recommendation with this set of knobs.
          type: string
        periodicTuningState:
          enumDescriptions:
            - Unspecified default value, should never be explicitly set.
            - >-
              The model has periodic tuning disabled. Tuning can be reenabled by
              calling the `EnableModelPeriodicTuning` method or by calling the
              `TuneModel` method.
            - >-
              The model cannot be tuned with periodic tuning OR the `TuneModel`
              method. Hide the options in customer UI and reject any requests
              through the backend self serve API.
            - >-
              The model has periodic tuning enabled. Tuning can be disabled by
              calling the `DisableModelPeriodicTuning` method.
          enum:
            - PERIODIC_TUNING_STATE_UNSPECIFIED
            - PERIODIC_TUNING_DISABLED
            - ALL_TUNING_DISABLED
            - PERIODIC_TUNING_ENABLED
          description: >-
            Optional. The state of periodic tuning. The period we use is 3
            months - to do a one-off tune earlier use the `TuneModel` method.
            Default value is `PERIODIC_TUNING_ENABLED`.
          type: string
        trainingState:
          description: >-
            Optional. The training state that the model is in (e.g. `TRAINING`
            or `PAUSED`). Since part of the cost of running the service is
            frequency of training - this can be used to determine when to train
            model in order to control cost. If not specified: the default value
            for `CreateModel` method is `TRAINING`. The default value for
            `UpdateModel` method is to keep the state the same as before.
          enumDescriptions:
            - Unspecified training state.
            - The model training is paused.
            - The model is training.
          enum:
            - TRAINING_STATE_UNSPECIFIED
            - PAUSED
            - TRAINING
          type: string
      description: >-
        Metadata that describes the training and serving parameters of a Model.
        A Model can be associated with a ServingConfig and then queried through
        the Predict API.
    GoogleCloudRetailV2RemoveCatalogAttributeRequest:
      id: GoogleCloudRetailV2RemoveCatalogAttributeRequest
      type: object
      description: Request for CatalogService.RemoveCatalogAttribute method.
      properties:
        key:
          type: string
          description: Required. The attribute name key of the CatalogAttribute to remove.
