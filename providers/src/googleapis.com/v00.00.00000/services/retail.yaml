    GoogleCloudRetailV2alphaModelPageOptimizationConfig:
      id: GoogleCloudRetailV2alphaModelPageOptimizationConfig
      type: object
      description: >-
        The PageOptimizationConfig for model training. This determines how many
        panels to optimize for, and which serving configs to consider for each
        panel. The purpose of this model is to optimize which ServingConfig to
        show on which panels in way that optimizes the visitors shopping
        journey.
      properties:
        pageOptimizationEventType:
          description: >-
            Required. The type of UserEvent this page optimization is shown for.
            Each page has an associated event type - this will be the
            corresponding event type for the page that the page optimization
            model is used on. Supported types: * `add-to-cart`: Products being
            added to cart. * `detail-page-view`: Products detail page viewed. *
            `home-page-view`: Homepage viewed * `category-page-view`: Homepage
            viewed * `shopping-cart-page-view`: User viewing a shopping cart.
            `home-page-view` only allows models with type `recommended-for-you`.
            All other page_optimization_event_type allow all Model.types.
          type: string
        panels:
          description: Required. A list of panel configurations. Limit = 5.
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2alphaModelPageOptimizationConfigPanel
        restriction:
          description: >-
            Optional. How to restrict results across panels e.g. can the same
            ServingConfig be shown on multiple panels at once. If unspecified,
            default to `UNIQUE_MODEL_RESTRICTION`.
          enumDescriptions:
            - Unspecified value for restriction.
            - >-
              Allow any ServingConfig to be show on any number of panels.
              Example: `Panel1 candidates`: pdp_ctr, pdp_cvr,
              home_page_ctr_no_diversity `Panel2 candidates`:
              home_page_ctr_no_diversity, home_page_ctr_diversity,
              pdp_cvr_no_diversity `Restriction` = NO_RESTRICTION `Valid
              combinations`: * * (pdp_ctr, home_page_ctr_no_diversity) *
              (pdp_ctr, home_page_ctr_diversity) * (pdp_ctr,
              pdp_cvr_no_diversity) * (pdp_cvr, home_page_ctr_no_diversity) *
              (pdp_cvr, home_page_ctr_diversity) * (pdp_cvr,
              pdp_cvr_no_diversity) * (home_page_ctr_no_diversity,
              home_page_ctr_no_diversity) * (home_page_ctr_no_diversity,
              home_page_ctr_diversity) * (home_page_ctr_no_diversity,
              pdp_cvr_no_diversity) * `Invalid combinations`: []
            - >-
              Do not allow the same ServingConfig.name to be shown on multiple
              panels. Example: `Panel1 candidates`: * pdp_ctr, pdp_cvr,
              home_page_ctr_no_diversity * `Panel2 candidates`: *
              home_page_ctr_no_diversity, home_page_ctr_diversity_low,
              pdp_cvr_no_diversity * `Restriction` =
              `UNIQUE_SERVING_CONFIG_RESTRICTION` `Valid combinations`: * *
              (pdp_ctr, home_page_ctr_no_diversity) * (pdp_ctr,
              home_page_ctr_diversity_low) * (pdp_ctr, pdp_cvr_no_diversity) *
              (pdp_ctr, pdp_cvr_no_diversity) * (pdp_cvr,
              home_page_ctr_no_diversity) * (pdp_cvr,
              home_page_ctr_diversity_low) * (pdp_cvr, pdp_cvr_no_diversity) *
              (home_page_ctr_no_diversity, home_page_ctr_diversity_low) *
              (home_page_ctr_no_diversity, pdp_cvr_no_diversity) * `Invalid
              combinations`: * * (home_page_ctr_no_diversity,
              home_page_ctr_no_diversity) *
            - >-
              Do not allow multiple ServingConfigs with same Model.name to be
              show on on different panels. Example: `Panel1 candidates`: *
              pdp_ctr, pdp_cvr, home_page_ctr_no_diversity * `Panel2
              candidates`: * home_page_ctr_no_diversity,
              home_page_ctr_diversity_low, pdp_cvr_no_diversity * `Restriction`
              = `UNIQUE_MODEL_RESTRICTION` `Valid combinations`: * * (pdp_ctr,
              home_page_ctr_no_diversity) * (pdp_ctr, home_page_ctr_diversity) *
              (pdp_ctr, pdp_cvr_no_diversity) * (pdp_ctr, pdp_cvr_no_diversity)
              * (pdp_cvr, home_page_ctr_no_diversity) * (pdp_cvr,
              home_page_ctr_diversity_low) * (home_page_ctr_no_diversity,
              pdp_cvr_no_diversity) * `Invalid combinations`: * *
              (home_page_ctr_no_diversity, home_page_ctr_no_diversity) *
              (pdp_cvr, pdp_cvr_no_diversity) *
            - >-
              Do not allow multiple ServingConfigs with same Model.type to be
              shown on different panels. Example: `Panel1 candidates`: *
              pdp_ctr, pdp_cvr, home_page_ctr_no_diversity * `Panel2
              candidates`: * home_page_ctr_no_diversity,
              home_page_ctr_diversity_low, pdp_cvr_no_diversity * `Restriction`
              = `UNIQUE_MODEL_RESTRICTION` `Valid combinations`: * * (pdp_ctr,
              home_page_ctr_no_diversity) * (pdp_ctr, home_page_ctr_diversity) *
              (pdp_cvr, home_page_ctr_no_diversity) * (pdp_cvr,
              home_page_ctr_diversity_low) * (home_page_ctr_no_diversity,
              pdp_cvr_no_diversity) * `Invalid combinations`: * * (pdp_ctr,
              pdp_cvr_no_diversity) * (pdp_ctr, pdp_cvr_no_diversity) *
              (pdp_cvr, pdp_cvr_no_diversity) * (home_page_ctr_no_diversity,
              home_page_ctr_no_diversity) * (home_page_ctr_no_diversity,
              home_page_ctr_diversity) *
          enum:
            - RESTRICTION_UNSPECIFIED
            - NO_RESTRICTION
            - UNIQUE_SERVING_CONFIG_RESTRICTION
            - UNIQUE_MODEL_RESTRICTION
            - UNIQUE_MODEL_TYPE_RESTRICTION
          type: string
