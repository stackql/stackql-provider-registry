    GoogleCloudRetailV2BigQuerySource:
      id: GoogleCloudRetailV2BigQuerySource
      type: object
      properties:
        tableId:
          type: string
          description: >-
            Required. The BigQuery table to copy the data from with a length
            limit of 1,024 characters.
        partitionDate:
          $ref: '#/components/schemas/GoogleTypeDate'
          description: >-
            BigQuery time partitioned table's _PARTITIONDATE in YYYY-MM-DD
            format.
        projectId:
          description: >-
            The project ID (can be project # or ID) that the BigQuery source is
            in with a length limit of 128 characters. If not specified, inherits
            the project ID from the parent request.
          type: string
        datasetId:
          type: string
          description: >-
            Required. The BigQuery data set to copy the data from with a length
            limit of 1,024 characters.
        dataSchema:
          description: >-
            The schema to use when parsing the data from the source. Supported
            values for product imports: * `product` (default): One JSON Product
            per line. Each product must have a valid Product.id. *
            `product_merchant_center`: See [Importing catalog data from Merchant
            Center](https://cloud.google.com/retail/recommendations-ai/docs/upload-catalog#mc).
            Supported values for user events imports: * `user_event` (default):
            One JSON UserEvent per line. * `user_event_ga360`: The schema is
            available here: https://support.google.com/analytics/answer/3437719.
            * `user_event_ga4`: The schema is available here:
            https://support.google.com/analytics/answer/7029846. Supported
            values for autocomplete imports: * `suggestions` (default): One JSON
            completion suggestion per line. * `denylist`: One JSON deny
            suggestion per line. * `allowlist`: One JSON allow suggestion per
            line.
          type: string
        gcsStagingDir:
          type: string
          description: >-
            Intermediate Cloud Storage directory used for the import with a
            length limit of 2,000 characters. Can be specified if one wants to
            have the BigQuery export to a specific Cloud Storage directory.
      description: BigQuery source import data from.
