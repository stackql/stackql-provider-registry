    GoogleCloudRetailV2RemoveFulfillmentPlacesRequest:
      id: GoogleCloudRetailV2RemoveFulfillmentPlacesRequest
      type: object
      description: Request message for ProductService.RemoveFulfillmentPlaces method.
      properties:
        removeTime:
          type: string
          description: >-
            The time when the fulfillment updates are issued, used to prevent
            out-of-order updates on fulfillment information. If not provided,
            the internal system time will be used.
          format: google-datetime
        allowMissing:
          type: boolean
          description: >-
            If set to true, and the Product is not found, the fulfillment
            information will still be processed and retained for at most 1 day
            and processed once the Product is created. If set to false, a
            NOT_FOUND error is returned if the Product is not found.
        type:
          type: string
          description: >-
            Required. The fulfillment type, including commonly used types (such
            as pickup in store and same day delivery), and custom types.
            Supported values: * "pickup-in-store" * "ship-to-store" *
            "same-day-delivery" * "next-day-delivery" * "custom-type-1" *
            "custom-type-2" * "custom-type-3" * "custom-type-4" *
            "custom-type-5" If this field is set to an invalid value other than
            these, an INVALID_ARGUMENT error is returned. This field directly
            corresponds to Product.fulfillment_info.type.
        placeIds:
          type: array
          items:
            type: string
          description: >-
            Required. The IDs for this type, such as the store IDs for
            "pickup-in-store" or the region IDs for "same-day-delivery", to be
            removed for this type. At least 1 value is required, and a maximum
            of 2000 values are allowed. Each value must be a string with a
            length limit of 10 characters, matching the pattern
            `[a-zA-Z0-9_-]+`, such as "store1" or "REGION-2". Otherwise, an
            INVALID_ARGUMENT error is returned.
    GoogleRpcStatus:
      properties:
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
        code:
          type: integer
          format: int32
          description: The status code, which should be an enum value of google.rpc.Code.
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          type: array
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: GoogleRpcStatus
      type: object
    GoogleCloudRetailV2FulfillmentInfo:
      properties:
        type:
          description: >-
            The fulfillment type, including commonly used types (such as pickup
            in store and same day delivery), and custom types. Customers have to
            map custom types to their display names before rendering UI.
            Supported values: * "pickup-in-store" * "ship-to-store" *
            "same-day-delivery" * "next-day-delivery" * "custom-type-1" *
            "custom-type-2" * "custom-type-3" * "custom-type-4" *
            "custom-type-5" If this field is set to an invalid value other than
            these, an INVALID_ARGUMENT error is returned.
          type: string
        placeIds:
          type: array
          items:
            type: string
          description: >-
            The IDs for this type, such as the store IDs for
            FulfillmentInfo.type.pickup-in-store or the region IDs for
            FulfillmentInfo.type.same-day-delivery. A maximum of 3000 values are
            allowed. Each value must be a string with a length limit of 30
            characters, matching the pattern `[a-zA-Z0-9_-]+`, such as "store1"
            or "REGION-2". Otherwise, an INVALID_ARGUMENT error is returned.
      description: >-
