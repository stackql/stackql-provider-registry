    GoogleCloudRetailLoggingErrorLog:
      id: GoogleCloudRetailLoggingErrorLog
      type: object
      description: >-
        An error log which is reported to the Error Reporting system. This proto
        a superset of
        google.devtools.clouderrorreporting.v1beta1.ReportedErrorEvent.
      properties:
        responsePayload:
          type: object
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            The API response payload, represented as a protocol buffer. This is
            used to log some "soft errors", where the response is valid but we
            consider there are some quality issues like unjoined events. The
            following API responses are supported and no PII is included:
            "google.cloud.retail.v2.PredictionService.Predict"
            "google.cloud.retail.v2.UserEventService.WriteUserEvent"
            "google.cloud.retail.v2.UserEventService.CollectUserEvent"
        message:
          type: string
          description: A message describing the error.
        context:
          $ref: '#/components/schemas/GoogleCloudRetailLoggingErrorContext'
          description: A description of the context in which the error occurred.
        requestPayload:
          description: >-
            The API request payload, represented as a protocol buffer. Most API
            request types are supported. For example:
            "type.googleapis.com/google.cloud.retail.v2.ProductService.CreateProductRequest"
            "type.googleapis.com/google.cloud.retail.v2.UserEventService.WriteUserEventRequest"
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        serviceContext:
          description: The service context in which this error has occurred.
          $ref: '#/components/schemas/GoogleCloudRetailLoggingServiceContext'
        status:
          $ref: '#/components/schemas/GoogleRpcStatus'
          description: The RPC status associated with the error log.
        importPayload:
          description: The error payload that is populated on LRO import APIs.
          $ref: '#/components/schemas/GoogleCloudRetailLoggingImportErrorContext'
    GoogleCloudRetailV2SearchResponseFacetFacetValue:
      description: A facet value which contains value names and their count.
      properties:
        count:
          type: string
          format: int64
          description: Number of items that have this facet value.
        minValue:
          description: >-
            The minimum value in the FacetValue.interval. Only supported on
            numerical facets and returned if
            SearchRequest.FacetSpec.FacetKey.return_min_max is true.
          format: double
          type: number
        maxValue:
          format: double
          description: >-
            The maximum value in the FacetValue.interval. Only supported on
            numerical facets and returned if
            SearchRequest.FacetSpec.FacetKey.return_min_max is true.
          type: number
        value:
          description: Text value of a facet, such as "Black" for facet "colorFamilies".
          type: string
        interval:
          $ref: '#/components/schemas/GoogleCloudRetailV2Interval'
          description: Interval value for a facet, such as [10, 20) for facet "price".
      id: GoogleCloudRetailV2SearchResponseFacetFacetValue
