          type: string
          description: >-
            The resource name of the model that this create applies to. Format:
            `projects/{project_number}/locations/{location_id}/catalogs/{catalog_id}/models/{model_id}`
    GoogleCloudRetailV2PinControlMetadata:
      id: GoogleCloudRetailV2PinControlMetadata
      type: object
      description: >-
        Metadata for pinning to be returned in the response. This is used for
        distinguishing between applied vs dropped pins.
      properties:
        droppedPins:
          type: object
          additionalProperties:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2PinControlMetadataProductPins
          description: >-
            Map of pins that were dropped due to overlap with other matching
            pins, keyed by pin position.
        allMatchedPins:
          type: object
          additionalProperties:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2PinControlMetadataProductPins
          description: Map of all matched pins, keyed by pin position.
    GoogleCloudRetailV2UserEvent:
      id: GoogleCloudRetailV2UserEvent
      type: object
      properties:
        attributionToken:
          type: string
          description: >-
            Highly recommended for user events that are the result of
            PredictionService.Predict. This field enables accurate attribution
            of recommendation model performance. The value must be a valid
            PredictResponse.attribution_token for user events that are the
            result of PredictionService.Predict. The value must be a valid
            SearchResponse.attribution_token for user events that are the result
            of SearchService.Search. This token enables us to accurately
            attribute page view or purchase back to the event and the particular
            predict response containing this clicked/purchased product. If user
            clicks on product K in the recommendation results, pass
            PredictResponse.attribution_token as a URL parameter to product K's
            page. When recording events on product K's page, log the
            PredictResponse.attribution_token to this field.
        orderBy:
          type: string
          description: >-
            The order in which products are returned. See SearchRequest.order_by
            for definition and syntax. The value must be a UTF-8 encoded string
            with a length limit of 1,000 characters. Otherwise, an
            INVALID_ARGUMENT error is returned. This can only be set for
            `search` events. Other event types should not set this field.
            Otherwise, an INVALID_ARGUMENT error is returned.
        pageCategories:
          type: array
          items:
            type: string
          description: >-
            Optional. The categories associated with a category page. To
            represent the full path of category, use the '>' sign, with one
            space on each side, to separate different hierarchies. If '>' is
            part of the category name, replace it with other character(s).
            Category pages include special pages such as sales or promotions.
            For instance, a special sale page may have the category hierarchy:
            "pageCategories" : ["Sales > 2017 Black Friday Deals"]. Required for
            `category-page-view` events. At least one of search_query or
            page_categories is required for `search` events. Other event types
            should not set this field. Otherwise, an INVALID_ARGUMENT error is
            returned.
        sessionId:
          type: string
          description: >-
            A unique identifier for tracking a visitor session with a length
            limit of 128 bytes. A session is an aggregation of an end user
            behavior in a time span. A general guideline to populate the
            session_id: 1. If user has no activity for 30 min, a new session_id
            should be assigned. 2. The session_id should be unique across users,
            suggest use uuid or add visitor_id as prefix.
        eventTime:
          description: >-
            Only required for UserEventService.ImportUserEvents method.
            Timestamp of when the user event happened.
          format: google-datetime
          type: string
        entity:
          type: string
          description: >-
            The entity for customers that may run multiple different entities,
            domains, sites or regions, for example, `Google US`, `Google Ads`,
            `Waymo`, `google.com`, `youtube.com`, etc. We recommend that you set
            this field to get better per-entity search, completion, and
            prediction results.
        cartId:
          type: string
          description: >-
            The ID or name of the associated shopping cart. This ID is used to
            associate multiple items added or present in the cart before
            purchase. This can only be set for `add-to-cart`,
            `purchase-complete`, or `shopping-cart-page-view` events.
        filter:
          type: string
          description: >-
            The filter syntax consists of an expression language for
            constructing a predicate from one or more fields of the products
            being filtered. See SearchRequest.filter for definition and syntax.
            The value must be a UTF-8 encoded string with a length limit of
            1,000 characters. Otherwise, an INVALID_ARGUMENT error is returned.
        visitorId:
          type: string
          description: >-
            Required. A unique identifier for tracking visitors. For example,
            this could be implemented with an HTTP cookie, which should be able
            to uniquely identify a visitor on a single device. This unique
            identifier should not change if the visitor log in/out of the
            website. Don't set the field to the same fixed ID for different
            users. This mixes the event history of those users together, which
            results in degraded model quality. The field must be a UTF-8 encoded
            string with a length limit of 128 characters. Otherwise, an
            INVALID_ARGUMENT error is returned. The field should not contain PII
            or user-data. We recommend to use Google Analytics [Client
            ID](https://developers.google.com/analytics/devguides/collection/analyticsjs/field-reference#clientId)
            for this field.
        experimentIds:
          description: >-
            A list of identifiers for the independent experiment groups this
            user event belongs to. This is used to distinguish between user
            events associated with different experiment setups (such as by using
            AI Commerce Search API, or using different recommendation models).
          type: array
          items:
            type: string
        searchQuery:
          description: >-
            The user's search query. See SearchRequest.query for definition. The
            value must be a UTF-8 encoded string with a length limit of 5,000
            characters. Otherwise, an INVALID_ARGUMENT error is returned. At
            least one of search_query or page_categories is required for
            `search` events. Other event types should not set this field.
            Otherwise, an INVALID_ARGUMENT error is returned.
          type: string
        offset:
          type: integer
          format: int32
          description: >-
            An integer that specifies the current offset for pagination (the
            0-indexed starting location, amongst the products deemed by the API
            as relevant). See SearchRequest.offset for definition. If this field
            is negative, an INVALID_ARGUMENT is returned. This can only be set
            for `search` events. Other event types should not set this field.
            Otherwise, an INVALID_ARGUMENT error is returned.
        panels:
          description: >-
            Optional. List of panels associated with this event. Used for
            panel-level impression data.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2PanelInfo'
        completionDetail:
          description: >-
            The main auto-completion details related to the event. This field
            should be set for `search` event when autocomplete function is
            enabled and the user clicks a suggestion for search.
          $ref: '#/components/schemas/GoogleCloudRetailV2CompletionDetail'
        uri:
          type: string
          description: >-
            Complete URL (window.location.href) of the user's current page. When
            using the client side event reporting with JavaScript pixel and
            Google Tag Manager, this value is filled in automatically. Maximum
            length 5,000 characters.
        referrerUri:
          type: string
          description: >-
            The referrer URL of the current page. When using the client side
            event reporting with JavaScript pixel and Google Tag Manager, this
            value is filled in automatically.
        userInfo:
          description: User information.
          $ref: '#/components/schemas/GoogleCloudRetailV2UserInfo'
        attributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GoogleCloudRetailV2CustomAttribute'
          description: >-
            Extra user event features to include in the recommendation model. If
            you provide custom attributes for ingested user events, also include
            them in the user events that you associate with prediction requests.
            Custom attribute formatting must be consistent between imported
            events and events provided with prediction requests. This lets the
            AI Commerce Search API use those custom attributes when training
            models and serving predictions, which helps improve recommendation
            quality. This field needs to pass all below criteria, otherwise an
            INVALID_ARGUMENT error is returned: * The key must be a UTF-8
            encoded string with a length limit of 5,000 characters. * For text
            attributes, at most 400 values are allowed. Empty values are not
            allowed. Each value must be a UTF-8 encoded string with a length
            limit of 256 characters. * For number attributes, at most 400 values
            are allowed. For product recommendations, an example of extra user
            information is traffic_channel, which is how a user arrives at the
            site. Users can arrive at the site by coming to the site directly,
            coming through Google search, or in other ways.
        pageViewId:
          type: string
          description: >-
            A unique ID of a web page view. This should be kept the same for all
            user events triggered from the same pageview. For example, an item
            detail page view could trigger multiple events as the user is
            browsing the page. The `pageViewId` property should be kept the same
            for all these events so that they can be grouped together properly.
            When using the client side event reporting with JavaScript pixel and
            Google Tag Manager, this value is filled in automatically.
        eventType:
          description: >-
            Required. User event type. Allowed values are: * `add-to-cart`:
            Products being added to cart. * `remove-from-cart`: Products being
            removed from cart. * `category-page-view`: Special pages such as
            sale or promotion pages viewed. * `detail-page-view`: Products
            detail page viewed. * `home-page-view`: Homepage viewed. *
            `purchase-complete`: User finishing a purchase. * `search`: Product
            search. * `shopping-cart-page-view`: User viewing a shopping cart.
          type: string
        productDetails:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2ProductDetail'
          description: >-
            The main product details related to the event. This field is
            optional except for the following event types: * `add-to-cart` *
            `detail-page-view` * `purchase-complete` In a `search` event, this
            field represents the products returned to the end user on the
            current page (the end user may have not finished browsing the whole
            page yet). When a new page is returned to the end user, after
            pagination/filtering/ordering even for the same query, a new
            `search` event with different product_details is desired. The end
            user may have not finished browsing the whole page yet.
        purchaseTransaction:
          $ref: '#/components/schemas/GoogleCloudRetailV2PurchaseTransaction'
          description: >-
            A transaction represents the entire purchase transaction. Required
            for `purchase-complete` events. Other event types should not set
            this field. Otherwise, an INVALID_ARGUMENT error is returned.
      description: >-
        UserEvent captures all metadata information AI Commerce Search API needs
        to know about how end users interact with customers' website.
    GoogleCloudRetailV2betaTuneModelResponse:
      properties: {}
      description: Response associated with a tune operation.
      id: GoogleCloudRetailV2betaTuneModelResponse
      type: object
    GoogleCloudRetailV2SearchResponse:
      properties:
        queryExpansionInfo:
          description: Query expansion information for the returned results.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchResponseQueryExpansionInfo
        invalidConditionBoostSpecs:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2SearchRequestBoostSpecConditionBoostSpec
          description: >-
            The invalid SearchRequest.BoostSpec.condition_boost_specs that are
            not applied during serving.
        experimentInfo:
          description: >-
            Metadata related to A/B testing experiment associated with this
            response. Only exists when an experiment is triggered.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2ExperimentInfo'
        results:
          description: A list of matched items. The order represents the ranking.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2SearchResponseSearchResult'
        tileNavigationResult:
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchResponseTileNavigationResult
          description: >-
            This field specifies all related information for tile navigation
            that will be used in client side.
        appliedControls:
          type: array
          items:
            type: string
          description: >-
            The fully qualified resource name of applied
            [controls](https://cloud.google.com/retail/docs/serving-control-rules).
        pinControlMetadata:
          description: >-
            Metadata for pin controls which were applicable to the request. This
            contains two map fields, one for all matched pins and one for pins
            which were matched but not applied. The two maps are keyed by pin
            position, and the values are the product ids which were matched to
            that pin.
          $ref: '#/components/schemas/GoogleCloudRetailV2PinControlMetadata'
        correctedQuery:
          type: string
          description: >-
            Contains the spell corrected query, if found. The search results are
            based on corrected_query by default. However, if
            SearchRequest.SpellCorrectionSpec.mode is set to
            SearchRequest.SpellCorrectionSpec.Mode.SUGGESTION_ONLY, the original
            query is used for search.
        attributionToken:
          description: >-
            A unique search token. This should be included in the UserEvent logs
            resulting from this search, which enables accurate attribution of
            search model performance.
          type: string
        conversationalSearchResult:
          description: >-
            This field specifies all related information that is needed on
            client side for UI rendering of conversational retail search.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchResponseConversationalSearchResult
        facets:
          description: Results of facets requested by user.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2SearchResponseFacet'
        nextPageToken:
          description: >-
            A token that can be sent as SearchRequest.page_token to retrieve the
            next page. If this field is omitted, there are no subsequent pages.
          type: string
        totalSize:
          format: int32
          description: >-
            The estimated total count of matched items irrespective of
            pagination. The count of results returned by pagination may be less
            than the total_size that matches.
          type: integer
        redirectUri:
          type: string
          description: >-
            The URI of a customer-defined redirect page. If redirect action is
            triggered, no search is performed, and only redirect_uri and
            attribution_token are set in the response.
      description: Response message for SearchService.Search method.
      id: GoogleCloudRetailV2SearchResponse
      type: object
    GoogleCloudRetailV2ImportCompletionDataRequest:
      id: GoogleCloudRetailV2ImportCompletionDataRequest
      type: object
      properties:
        inputConfig:
          description: Required. The desired input location of the data.
          $ref: '#/components/schemas/GoogleCloudRetailV2CompletionDataInputConfig'
        notificationPubsubTopic:
          description: >-
            Pub/Sub topic for receiving notification. If this field is set, when
            the import is finished, a notification is sent to specified Pub/Sub
            topic. The message data is JSON string of a Operation. Format of the
            Pub/Sub topic is `projects/{project}/topics/{topic}`.
          type: string
      description: Request message for ImportCompletionData methods.
    GoogleCloudRetailV2CatalogAttributeFacetConfigMergedFacet:
      id: GoogleCloudRetailV2CatalogAttributeFacetConfigMergedFacet
      type: object
      properties:
        mergedFacetKey:
          description: >-
            The merged facet key should be a valid facet key that is different
            than the facet key of the current catalog attribute. We refer this
            is merged facet key as the child of the current catalog attribute.
            This merged facet key can't be a parent of another facet key (i.e.
            no directed path of length 2). This merged facet key needs to be
            either a textual custom attribute or a numerical custom attribute.
          type: string
      description: >-
        The current facet key (i.e. attribute config) maps into the
        merged_facet_key. A facet key can have at most one child. The current
        facet key and the merged facet key need both to be textual custom
        attributes or both numerical custom attributes (same type).
    GoogleCloudRetailV2betaExportErrorsConfig:
      id: GoogleCloudRetailV2betaExportErrorsConfig
      type: object
      description: Configuration of destination for Export related errors.
      properties:
        gcsPrefix:
          type: string
          description: >-
            Google Cloud Storage path for import errors. This must be an empty,
            existing Cloud Storage bucket. Export errors will be written to a
            file in this bucket, one per line, as a JSON-encoded
            `google.rpc.Status` message.
    GoogleCloudRetailV2Condition:
      id: GoogleCloudRetailV2Condition
      type: object
      properties:
        queryTerms:
          description: >-
            A list (up to 10 entries) of terms to match the query on. If not
            specified, match all queries. If many query terms are specified, the
            condition is matched if any of the terms is a match (i.e. using the
            OR operator).
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2ConditionQueryTerm'
        activeTimeRange:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2ConditionTimeRange'
          description: >-
            Range of time(s) specifying when Condition is active. Condition true
            if any time range matches.
        pageCategories:
          description: >-
            Used to support browse uses cases. A list (up to 10 entries) of
            categories or departments. The format should be the same as
            UserEvent.page_categories;
          type: array
          items:
            type: string
      description: >-
        Metadata that is used to define a condition that triggers an action. A
        valid condition must specify at least one of 'query_terms' or
        'products_filter'. If multiple fields are specified, the condition is
        met if all the fields are satisfied e.g. if a set of query terms and
        product_filter are set, then only items matching the product_filter for
        requests with a query matching the query terms wil get boosted.
    GoogleCloudRetailV2CompleteQueryResponseAttributeResult:
      id: GoogleCloudRetailV2CompleteQueryResponseAttributeResult
      type: object
      description: Resource that represents attribute results.
      properties:
        suggestions:
          type: array
          items:
            type: string
          description: The list of suggestions for the attribute.
    GoogleCloudRetailV2TuneModelResponse:
      properties: {}
      description: Response associated with a tune operation.
      id: GoogleCloudRetailV2TuneModelResponse
      type: object
    GoogleCloudRetailV2SearchRequestConversationalSearchSpecUserAnswerSelectedAnswer:
      id: >-
        GoogleCloudRetailV2SearchRequestConversationalSearchSpecUserAnswerSelectedAnswer
      type: object
      description: >-
        This field specifies the selected answers during the conversational
        search.
      properties:
        productAttributeValues:
          deprecated: true
          description: This field is deprecated and should not be set.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2ProductAttributeValue'
        productAttributeValue:
          description: >-
            This field specifies the selected answer which is a attribute
            key-value.
          $ref: '#/components/schemas/GoogleCloudRetailV2ProductAttributeValue'
    GoogleCloudRetailV2SearchResponseConversationalSearchResultSuggestedAnswer:
      id: >-
        GoogleCloudRetailV2SearchResponseConversationalSearchResultSuggestedAnswer
      type: object
      description: Suggested answers to the follow-up question.
      properties:
        productAttributeValue:
          $ref: '#/components/schemas/GoogleCloudRetailV2ProductAttributeValue'
          description: >-
            Product attribute value, including an attribute key and an attribute
            value. Other types can be added here in the future.
    GoogleCloudRetailV2RuleDoNotAssociateAction:
      properties:
        queryTerms:
          type: array
          items:
            type: string
          description: >-
            Terms from the search query. Will not consider
            do_not_associate_terms for search if in search query. Can specify up
            to 100 terms.
        doNotAssociateTerms:
          description: >-
            Cannot contain duplicates or the query term. Can specify up to 100
            terms.
          type: array
          items:
            type: string
        terms:
          description: Will be [deprecated = true] post migration;
          type: array
          items:
            type: string
      description: >-
        Prevents `query_term` from being associated with specified terms during
        search. Example: Don't associate "gShoe" and "cheap".
      id: GoogleCloudRetailV2RuleDoNotAssociateAction
      type: object
    GoogleCloudRetailV2RemoveLocalInventoriesRequest:
      id: GoogleCloudRetailV2RemoveLocalInventoriesRequest
      type: object
      properties:
        allowMissing:
          type: boolean
          description: >-
            If set to true, and the Product is not found, the local inventory
            removal request will still be processed and retained for at most 1
            day and processed once the Product is created. If set to false, a
            NOT_FOUND error is returned if the Product is not found.
        removeTime:
          format: google-datetime
          description: >-
            The time when the inventory deletions are issued. Used to prevent
            out-of-order updates and deletions on local inventory fields. If not
            provided, the internal system time will be used.
          type: string
        placeIds:
          description: >-
            Required. A list of place IDs to have their inventory deleted. At
            most 3000 place IDs are allowed per request.
          type: array
          items:
            type: string
      description: Request message for ProductService.RemoveLocalInventories method.
    GoogleCloudRetailV2RemoveLocalInventoriesMetadata:
      properties: {}
      description: >-
        Metadata related to the progress of the RemoveLocalInventories
        operation. Currently empty because there is no meaningful metadata
        populated from the ProductService.RemoveLocalInventories method.
      id: GoogleCloudRetailV2RemoveLocalInventoriesMetadata
      type: object
    GoogleCloudRetailV2betaAddLocalInventoriesMetadata:
      id: GoogleCloudRetailV2betaAddLocalInventoriesMetadata
      type: object
      description: >-
        Metadata related to the progress of the AddLocalInventories operation.
        Currently empty because there is no meaningful metadata populated from
        the ProductService.AddLocalInventories method.
      properties: {}
    GoogleCloudRetailV2ExportMetadata:
      description: >-
        Metadata related to the progress of the Export operation. This is
        returned by the google.longrunning.Operation.metadata field.
      properties:
        createTime:
          type: string
          description: Operation create time.
          format: google-datetime
        updateTime:
          description: >-
            Operation last update time. If the operation is done, this is also
            the finish time.
          format: google-datetime
          type: string
      id: GoogleCloudRetailV2ExportMetadata
      type: object
    GoogleCloudRetailV2RejoinUserEventsMetadata:
      properties: {}
      description: Metadata for `RejoinUserEvents` method.
      id: GoogleCloudRetailV2RejoinUserEventsMetadata
      type: object
    GoogleCloudRetailV2SearchRequestQueryExpansionSpec:
      id: GoogleCloudRetailV2SearchRequestQueryExpansionSpec
      type: object
      description: >-
        Specification to determine under which conditions query expansion should
        occur.
      properties:
        condition:
          enumDescriptions:
            - >-
              Unspecified query expansion condition. In this case, server
              behavior defaults to Condition.DISABLED.
            - >-
              Disabled query expansion. Only the exact search query is used,
              even if SearchResponse.total_size is zero.
            - Automatic query expansion built by Google Retail Search.
          enum:
            - CONDITION_UNSPECIFIED
            - DISABLED
            - AUTO
          description: >-
            The condition under which query expansion should occur. Default to
            Condition.DISABLED.
          type: string
        pinUnexpandedResults:
          type: boolean
          description: >-
            Whether to pin unexpanded results. The default value is false. If
            this field is set to true, unexpanded products are always at the top
            of the search results, followed by the expanded results.
    GoogleCloudRetailV2ModelFrequentlyBoughtTogetherFeaturesConfig:
      properties:
        contextProductsType:
          type: string
          description: >-
            Optional. Specifies the context of the model when it is used in
            predict requests. Can only be set for the
            `frequently-bought-together` type. If it isn't specified, it
            defaults to MULTIPLE_CONTEXT_PRODUCTS.
          enumDescriptions:
            - >-
              Unspecified default value, should never be explicitly set.
              Defaults to MULTIPLE_CONTEXT_PRODUCTS.
            - >-
              Use only a single product as context for the recommendation.
              Typically used on pages like add-to-cart or product details.
            - >-
              Use one or multiple products as context for the recommendation.
              Typically used on shopping cart pages.
          enum:
            - CONTEXT_PRODUCTS_TYPE_UNSPECIFIED
            - SINGLE_CONTEXT_PRODUCT
            - MULTIPLE_CONTEXT_PRODUCTS
      description: Additional configs for the frequently-bought-together model type.
      id: GoogleCloudRetailV2ModelFrequentlyBoughtTogetherFeaturesConfig
      type: object
    GoogleCloudRetailV2RuleForceReturnFacetActionFacetPositionAdjustment:
      properties:
        position:
          type: integer
          description: >-
            This is the position in the request as explained above. It should be
            strictly positive be at most 100.
          format: int32
        attributeName:
          type: string
          description: >-
            The attribute name to force return as a facet. Each attribute name
            should be a valid attribute name, be non-empty and contain at most
            80 characters long.
      description: >-
        Each facet position adjustment consists of a single attribute name (i.e.
        facet key) along with a specified position.
      id: GoogleCloudRetailV2RuleForceReturnFacetActionFacetPositionAdjustment
      type: object
    GoogleCloudRetailV2ProductInlineSource:
      id: GoogleCloudRetailV2ProductInlineSource
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2Product'
          description: >-
            Required. A list of products to update/create. Each product must
            have a valid Product.id. Recommended max of 100 items.
      description: The inline source for the input config for ImportProducts method.
    GoogleCloudRetailV2SearchRequestBoostSpecConditionBoostSpec:
      properties:
        condition:
          description: >-
            An expression which specifies a boost condition. The syntax and
            supported fields are the same as a filter expression. See
            SearchRequest.filter for detail syntax and limitations. Examples: *
            To boost products with product ID "product_1" or "product_2", and
            color "Red" or "Blue": * (id: ANY("product_1", "product_2")) AND
            (colorFamilies: ANY("Red","Blue"))
          type: string
        boost:
          format: float
          description: >-
            Strength of the condition boost, which should be in [-1, 1].
            Negative boost means demotion. Default is 0.0. Setting to 1.0 gives
            the item a big promotion. However, it does not necessarily mean that
            the boosted item will be the top result at all times, nor that other
            items will be excluded. Results could still be shown even when none
            of them matches the condition. And results that are significantly
            more relevant to the search query can still trump your heavily
            favored but irrelevant items. Setting to -1.0 gives the item a big
            demotion. However, results that are deeply relevant might still be
            shown. The item will have an upstream battle to get a fairly high
            ranking, but it is not blocked out completely. Setting to 0.0 means
            no boost applied. The boosting condition is ignored.
          type: number
      description: Boost applies to products which match a condition.
      id: GoogleCloudRetailV2SearchRequestBoostSpecConditionBoostSpec
      type: object
    GoogleCloudRetailV2GenerativeQuestionsFeatureConfig:
      id: GoogleCloudRetailV2GenerativeQuestionsFeatureConfig
      type: object
      properties:
        featureEnabled:
          type: boolean
          description: >-
            Optional. Determines whether questions will be used at serving time.
            Note: This feature cannot be enabled until initial data requirements
            are satisfied.
        catalog:
          type: string
          description: >-
            Required. Resource name of the affected catalog. Format:
            projects/{project}/locations/{location}/catalogs/{catalog}
        minimumProducts:
          type: integer
          description: >-
            Optional. Minimum number of products in the response to trigger
