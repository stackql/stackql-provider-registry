        ProductService.AddLocalInventories method.
      id: GoogleCloudRetailV2alphaAddLocalInventoriesResponse
      type: object
    GoogleCloudRetailV2SearchRequestPersonalizationSpec:
      id: GoogleCloudRetailV2SearchRequestPersonalizationSpec
      type: object
      description: The specification for personalization.
      properties:
        mode:
          type: string
          description: Defaults to Mode.AUTO.
          enumDescriptions:
            - >-
              Default value. In this case, server behavior defaults to
              Mode.AUTO.
            - >-
              Let CRS decide whether to use personalization based on quality of
              user event data.
            - Disable personalization.
          enum:
            - MODE_UNSPECIFIED
            - AUTO
            - DISABLED
    GoogleCloudRetailV2alphaGcsOutputResult:
      id: GoogleCloudRetailV2alphaGcsOutputResult
      type: object
      properties:
        outputUri:
          type: string
          description: The uri of Gcs output
      description: A Gcs output result.
    GoogleCloudRetailV2ServingConfig:
      id: GoogleCloudRetailV2ServingConfig
      type: object
      description: >-
        Configures metadata that is used to generate serving time results (e.g.
        search results or recommendation predictions).
      properties:
        dynamicFacetSpec:
          description: >-
            The specification for dynamically generated facets. Notice that only
            textual facets can be dynamically generated. Can only be set if
            solution_types is SOLUTION_TYPE_SEARCH.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestDynamicFacetSpec
        redirectControlIds:
          description: >-
            Condition redirect specifications. Only the first triggered redirect
            action is applied, even if multiple apply. Maximum number of
            specifications is 1000. Can only be set if solution_types is
            SOLUTION_TYPE_SEARCH.
          type: array
          items:
            type: string
        diversityLevel:
          type: string
          description: >-
            How much diversity to use in recommendation model results e.g.
            `medium-diversity` or `high-diversity`. Currently supported values:
            * `no-diversity` * `low-diversity` * `medium-diversity` *
            `high-diversity` * `auto-diversity` If not specified, we choose
            default based on recommendation model type. Default value:
            `no-diversity`. Can only be set if solution_types is
            SOLUTION_TYPE_RECOMMENDATION.
        personalizationSpec:
          description: >-
            The specification for personalization spec. Can only be set if
            solution_types is SOLUTION_TYPE_SEARCH. Notice that if both
            ServingConfig.personalization_spec and
            SearchRequest.personalization_spec are set.
            SearchRequest.personalization_spec will override
            ServingConfig.personalization_spec.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchRequestPersonalizationSpec
        displayName:
          description: >-
            Required. The human readable serving config display name. Used in
            Retail UI. This field must be a UTF-8 encoded string with a length
            limit of 128 characters. Otherwise, an INVALID_ARGUMENT error is
            returned.
          type: string
        boostControlIds:
          type: array
          items:
            type: string
          description: >-
            Condition boost specifications. If a product matches multiple
            conditions in the specifications, boost scores from these
            specifications are all applied and combined in a non-linear way.
            Maximum number of specifications is 100. Notice that if both
            ServingConfig.boost_control_ids and SearchRequest.boost_spec are
            set, the boost conditions from both places are evaluated. If a
            search request matches multiple boost conditions, the final boost
            score is equal to the sum of the boost scores from all matched boost
            conditions. Can only be set if solution_types is
            SOLUTION_TYPE_SEARCH.
        twowaySynonymsControlIds:
          description: >-
            Condition synonyms specifications. If multiple syonyms conditions
            match, all matching synonyms control in the list will execute. Order
            of controls in the list will not matter. Maximum number of
            specifications is 100. Can only be set if solution_types is
            SOLUTION_TYPE_SEARCH.
          type: array
          items:
            type: string
        diversityType:
          description: >-
            What kind of diversity to use - data driven or rule based. If unset,
            the server behavior defaults to RULE_BASED_DIVERSITY.
          enumDescriptions:
            - Default value.
            - Rule based diversity.
            - Data driven diversity.
          enum:
            - DIVERSITY_TYPE_UNSPECIFIED
            - RULE_BASED_DIVERSITY
            - DATA_DRIVEN_DIVERSITY
          type: string
        ignoreControlIds:
          description: >-
            Condition ignore specifications. If multiple ignore conditions
            match, all matching ignore controls in the list will execute. -
            Order does not matter. - Maximum number of specifications is 100.
            Can only be set if solution_types is SOLUTION_TYPE_SEARCH.
          type: array
          items:
            type: string
        doNotAssociateControlIds:
          description: >-
            Condition do not associate specifications. If multiple do not
            associate conditions match, all matching do not associate controls
            in the list will execute. - Order does not matter. - Maximum number
            of specifications is 100. Can only be set if solution_types is
            SOLUTION_TYPE_SEARCH.
          type: array
          items:
            type: string
        replacementControlIds:
          type: array
          items:
            type: string
          description: >-
            Condition replacement specifications. - Applied according to the
            order in the list. - A previously replaced term can not be
            re-replaced. - Maximum number of specifications is 100. Can only be
            set if solution_types is SOLUTION_TYPE_SEARCH.
        enableCategoryFilterLevel:
          description: >-
            Whether to add additional category filters on the `similar-items`
            model. If not specified, we enable it by default. Allowed values
            are: * `no-category-match`: No additional filtering of original
            results from the model and the customer's filters. *
            `relaxed-category-match`: Only keep results with categories that
            match at least one item categories in the PredictRequests's context
            item. * If customer also sends filters in the PredictRequest, then
            the results will satisfy both conditions (user given and category
            match). Can only be set if solution_types is
            SOLUTION_TYPE_RECOMMENDATION.
          type: string
        solutionTypes:
          type: array
          items:
            enumDescriptions:
              - Default value.
              - Used for Recommendations AI.
              - Used for Retail Search.
            enum:
              - SOLUTION_TYPE_UNSPECIFIED
              - SOLUTION_TYPE_RECOMMENDATION
              - SOLUTION_TYPE_SEARCH
            type: string
          description: >-
            Required. Immutable. Specifies the solution types that a serving
            config can be associated with. Currently we support setting only one
            type of solution.
        onewaySynonymsControlIds:
          description: >-
            Condition oneway synonyms specifications. If multiple oneway
            synonyms conditions match, all matching oneway synonyms controls in
            the list will execute. Order of controls in the list will not
            matter. Maximum number of specifications is 100. Can only be set if
            solution_types is SOLUTION_TYPE_SEARCH.
          type: array
          items:
            type: string
        facetControlIds:
          description: >-
            Facet specifications for faceted search. If empty, no facets are
            returned. The ids refer to the ids of Control resources with only
            the Facet control set. These controls are assumed to be in the same
            Catalog as the ServingConfig. A maximum of 100 values are allowed.
            Otherwise, an INVALID_ARGUMENT error is returned. Can only be set if
            solution_types is SOLUTION_TYPE_SEARCH.
          type: array
          items:
            type: string
        ignoreRecsDenylist:
          description: >-
            When the flag is enabled, the products in the denylist will not be
            filtered out in the recommendation filtering results.
          type: boolean
        priceRerankingLevel:
          type: string
          description: >-
            How much price ranking we want in serving results. Price reranking
            causes product items with a similar recommendation probability to be
            ordered by price, with the highest-priced items first. This setting
            could result in a decrease in click-through and conversion rates.
            Allowed values are: * `no-price-reranking` * `low-price-reranking` *
            `medium-price-reranking` * `high-price-reranking` If not specified,
            we choose default based on model type. Default value:
            `no-price-reranking`. Can only be set if solution_types is
            SOLUTION_TYPE_RECOMMENDATION.
        filterControlIds:
          description: >-
            Condition filter specifications. If a product matches multiple
            conditions in the specifications, filters from these specifications
            are all applied and combined via the AND operator. Maximum number of
            specifications is 100. Can only be set if solution_types is
            SOLUTION_TYPE_SEARCH.
          type: array
          items:
            type: string
        modelId:
          description: >-
            The id of the model in the same Catalog to use at serving time.
            Currently only RecommendationModels are supported:
            https://cloud.google.com/retail/recommendations-ai/docs/create-models
            Can be changed but only to a compatible model (e.g.
            others-you-may-like CTR to others-you-may-like CVR). Required when
            solution_types is SOLUTION_TYPE_RECOMMENDATION.
          type: string
        name:
          description: >-
            Immutable. Fully qualified name
            `projects/*/locations/global/catalogs/*/servingConfig/*`
          type: string
