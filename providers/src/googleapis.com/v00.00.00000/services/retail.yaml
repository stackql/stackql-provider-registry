    GoogleCloudRetailV2CatalogAttribute:
      id: GoogleCloudRetailV2CatalogAttribute
      type: object
      properties:
        exactSearchableOption:
          description: >-
            If EXACT_SEARCHABLE_ENABLED, attribute values will be exact
            searchable. This property only applies to textual custom attributes
            and requires indexable set to enabled to enable exact-searchable. If
            unset, the server behavior defaults to EXACT_SEARCHABLE_DISABLED.
          enumDescriptions:
            - Value used when unset.
            - Exact searchable option enabled for an attribute.
            - Exact searchable option disabled for an attribute.
          enum:
            - EXACT_SEARCHABLE_OPTION_UNSPECIFIED
            - EXACT_SEARCHABLE_ENABLED
            - EXACT_SEARCHABLE_DISABLED
          type: string
        inUse:
          description: >-
            Output only. Indicates whether this attribute has been used by any
            products. `True` if at least one Product is using this attribute in
            Product.attributes. Otherwise, this field is `False`.
            CatalogAttribute can be pre-loaded by using
            CatalogService.AddCatalogAttribute or
            CatalogService.UpdateAttributesConfig APIs. This field is `False`
            for pre-loaded CatalogAttributes. Only pre-loaded catalog attributes
            that are neither in use by products nor predefined can be deleted.
            Catalog attributes that are either in use by products or are
            predefined attributes cannot be deleted; however, their
            configuration properties will reset to default values upon removal
            request. After catalog changes, it takes about 10 minutes for this
            field to update.
          readOnly: true
          type: boolean
        searchableOption:
          type: string
          description: >-
            When AttributesConfig.attribute_config_level is
            CATALOG_LEVEL_ATTRIBUTE_CONFIG, if SEARCHABLE_ENABLED, attribute
            values are searchable by text queries in SearchService.Search. If
            SEARCHABLE_ENABLED but attribute type is numerical, attribute values
            will not be searchable by text queries in SearchService.Search, as
            there are no text values associated to numerical attributes. Must be
            specified, when AttributesConfig.attribute_config_level is
            CATALOG_LEVEL_ATTRIBUTE_CONFIG, otherwise throws INVALID_FORMAT
            error.
          enumDescriptions:
            - Value used when unset.
            - Searchable option enabled for an attribute.
            - Searchable option disabled for an attribute.
          enum:
            - SEARCHABLE_OPTION_UNSPECIFIED
            - SEARCHABLE_ENABLED
            - SEARCHABLE_DISABLED
        key:
          type: string
          description: >-
            Required. Attribute name. For example: `color`, `brands`,
            `attributes.custom_attribute`, such as `attributes.xyz`. To be
            indexable, the attribute name can contain only alpha-numeric
            characters and underscores. For example, an attribute named
            `attributes.abc_xyz` can be indexed, but an attribute named
            `attributes.abc-xyz` cannot be indexed. If the attribute key starts
            with `attributes.`, then the attribute is a custom attribute.
            Attributes such as `brands`, `patterns`, and `title` are built-in
            and called system attributes.
        indexableOption:
          type: string
          enumDescriptions:
            - Value used when unset.
            - Indexable option enabled for an attribute.
            - Indexable option disabled for an attribute.
          enum:
            - INDEXABLE_OPTION_UNSPECIFIED
            - INDEXABLE_ENABLED
            - INDEXABLE_DISABLED
          description: >-
            When AttributesConfig.attribute_config_level is
            CATALOG_LEVEL_ATTRIBUTE_CONFIG, if INDEXABLE_ENABLED attribute
            values are indexed so that it can be filtered, faceted, or boosted
            in SearchService.Search. Must be specified when
            AttributesConfig.attribute_config_level is
            CATALOG_LEVEL_ATTRIBUTE_CONFIG, otherwise throws INVALID_FORMAT
            error.
        type:
          description: >-
            Output only. The type of this attribute. This is derived from the
            attribute in Product.attributes.
          type: string
          readOnly: true
          enumDescriptions:
            - >-
              The type of the attribute is unknown. Used when type cannot be
              derived from attribute that is not in_use.
            - Textual attribute.
            - Numerical attribute.
          enum:
            - UNKNOWN
            - TEXTUAL
            - NUMERICAL
        dynamicFacetableOption:
          type: string
          description: >-
            If DYNAMIC_FACETABLE_ENABLED, attribute values are available for
            dynamic facet. Could only be DYNAMIC_FACETABLE_DISABLED if
            CatalogAttribute.indexable_option is INDEXABLE_DISABLED. Otherwise,
            an INVALID_ARGUMENT error is returned. Must be specified, otherwise
            throws INVALID_FORMAT error.
          enumDescriptions:
            - Value used when unset.
            - Dynamic facetable option enabled for an attribute.
            - Dynamic facetable option disabled for an attribute.
          enum:
            - DYNAMIC_FACETABLE_OPTION_UNSPECIFIED
            - DYNAMIC_FACETABLE_ENABLED
            - DYNAMIC_FACETABLE_DISABLED
        retrievableOption:
          enumDescriptions:
            - Value used when unset.
            - Retrievable option enabled for an attribute.
            - Retrievable option disabled for an attribute.
          enum:
            - RETRIEVABLE_OPTION_UNSPECIFIED
            - RETRIEVABLE_ENABLED
            - RETRIEVABLE_DISABLED
          description: >-
            If RETRIEVABLE_ENABLED, attribute values are retrievable in the
            search results. If unset, the server behavior defaults to
            RETRIEVABLE_DISABLED.
          type: string
        facetConfig:
          $ref: '#/components/schemas/GoogleCloudRetailV2CatalogAttributeFacetConfig'
          description: Contains facet options.
      description: >-
        Catalog level attribute config for an attribute. For example, if
        customers want to enable/disable facet for a specific attribute.
    GoogleCloudRetailV2AddFulfillmentPlacesMetadata:
      description: >-
        Metadata related to the progress of the AddFulfillmentPlaces operation.
        Currently empty because there is no meaningful metadata populated from
        the ProductService.AddFulfillmentPlaces method.
      properties: {}
      id: GoogleCloudRetailV2AddFulfillmentPlacesMetadata
      type: object
    GoogleCloudRetailV2alphaModel:
      id: GoogleCloudRetailV2alphaModel
      type: object
      description: >-
        Metadata that describes the training and serving parameters of a Model.
        A Model can be associated with a ServingConfig and then queried through
        the Predict API.
      properties:
        filteringOption:
          description: >-
            Optional. If `RECOMMENDATIONS_FILTERING_ENABLED`, recommendation
            filtering by attributes is enabled for the model.
          enumDescriptions:
            - >-
              Value used when unset. In this case, server behavior defaults to
              RECOMMENDATIONS_FILTERING_DISABLED.
            - Recommendation filtering is disabled.
            - Recommendation filtering is enabled.
          enum:
            - RECOMMENDATIONS_FILTERING_OPTION_UNSPECIFIED
            - RECOMMENDATIONS_FILTERING_DISABLED
            - RECOMMENDATIONS_FILTERING_ENABLED
          type: string
        modelFeaturesConfig:
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2alphaModelModelFeaturesConfig
          description: Optional. Additional model features config.
        pageOptimizationConfig:
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2alphaModelPageOptimizationConfig
          description: Optional. The page optimization config.
        displayName:
          description: >-
            Required. The display name of the model. Should be human readable,
            used to display Recommendation Models in the Retail Cloud Console
            Dashboard. UTF-8 encoded string with limit of 1024 characters.
          type: string
        optimizationObjective:
          type: string
          description: >-
            Optional. The optimization objective e.g. `cvr`. Currently supported
            values: `ctr`, `cvr`, `revenue-per-order`. If not specified, we
            choose default based on model type. Default depends on type of
            recommendation: `recommended-for-you` => `ctr` `others-you-may-like`
            => `ctr` `frequently-bought-together` => `revenue_per_order` This
            field together with optimization_objective describe model metadata
            to use to control model training and serving. See
            https://cloud.google.com/retail/docs/models for more details on what
            the model metadata control and which combination of parameters are
            valid. For invalid combinations of parameters (e.g. type =
            `frequently-bought-together` and optimization_objective = `ctr`),
            you receive an error 400 if you try to create/update a
            recommendation with this set of knobs.
        updateTime:
          type: string
          readOnly: true
          format: google-datetime
          description: >-
            Output only. Timestamp the Recommendation Model was last updated.
            E.g. if a Recommendation Model was paused - this would be the time
            the pause was initiated.
        tuningOperation:
          description: >-
            Output only. The tune operation associated with the model. Can be
            used to determine if there is an ongoing tune for this
            recommendation. Empty field implies no tune is goig on.
          readOnly: true
          type: string
        servingConfigLists:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2alphaModelServingConfigList
          readOnly: true
          description: >-
            Output only. The list of valid serving configs associated with the
            PageOptimizationConfig.
        lastTuneTime:
          description: Output only. The timestamp when the latest successful tune finished.
          readOnly: true
          format: google-datetime
          type: string
        trainingState:
          description: >-
            Optional. The training state that the model is in (e.g. `TRAINING`
            or `PAUSED`). Since part of the cost of running the service is
            frequency of training - this can be used to determine when to train
            model in order to control cost. If not specified: the default value
            for `CreateModel` method is `TRAINING`. The default value for
            `UpdateModel` method is to keep the state the same as before.
          enumDescriptions:
            - Unspecified training state.
            - The model training is paused.
            - The model is training.
          enum:
            - TRAINING_STATE_UNSPECIFIED
            - PAUSED
            - TRAINING
          type: string
        periodicTuningState:
          description: >-
            Optional. The state of periodic tuning. The period we use is 3
            months - to do a one-off tune earlier use the `TuneModel` method.
            Default value is `PERIODIC_TUNING_ENABLED`.
          enumDescriptions:
            - Unspecified default value, should never be explicitly set.
            - >-
              The model has periodic tuning disabled. Tuning can be reenabled by
              calling the `EnableModelPeriodicTuning` method or by calling the
              `TuneModel` method.
            - >-
              The model cannot be tuned with periodic tuning OR the `TuneModel`
              method. Hide the options in customer UI and reject any requests
              through the backend self serve API.
            - >-
              The model has periodic tuning enabled. Tuning can be disabled by
              calling the `DisableModelPeriodicTuning` method.
          enum:
            - PERIODIC_TUNING_STATE_UNSPECIFIED
            - PERIODIC_TUNING_DISABLED
            - ALL_TUNING_DISABLED
            - PERIODIC_TUNING_ENABLED
          type: string
        type:
          description: >-
            Required. The type of model e.g. `home-page`. Currently supported
            values: `recommended-for-you`, `others-you-may-like`,
            `frequently-bought-together`, `page-optimization`, `similar-items`,
            `buy-it-again`, `on-sale-items`, and `recently-viewed`(readonly
            value). This field together with optimization_objective describe
            model metadata to use to control model training and serving. See
            https://cloud.google.com/retail/docs/models for more details on what
            the model metadata control and which combination of parameters are
            valid. For invalid combinations of parameters (e.g. type =
            `frequently-bought-together` and optimization_objective = `ctr`),
            you receive an error 400 if you try to create/update a
            recommendation with this set of knobs.
          type: string
        name:
          type: string
          description: >-
            Required. The fully qualified resource name of the model. Format:
            `projects/{project_number}/locations/{location_id}/catalogs/{catalog_id}/models/{model_id}`
            catalog_id has char limit of 50. recommendation_model_id has char
            limit of 40.
        createTime:
          readOnly: true
          format: google-datetime
          description: Output only. Timestamp the Recommendation Model was created at.
          type: string
        servingState:
          readOnly: true
          enumDescriptions:
            - Unspecified serving state.
            - The model is not serving.
            - The model is serving and can be queried.
            - The model is trained on tuned hyperparameters and can be queried.
          enum:
            - SERVING_STATE_UNSPECIFIED
            - INACTIVE
            - ACTIVE
            - TUNED
          description: 'Output only. The serving state of the model: `ACTIVE`, `NOT_ACTIVE`.'
          type: string
        dataState:
          readOnly: true
          enumDescriptions:
            - Unspecified default value, should never be explicitly set.
            - The model has sufficient training data.
            - >-
              The model does not have sufficient training data. Error messages
              can be queried via Stackdriver.
          enum:
            - DATA_STATE_UNSPECIFIED
            - DATA_OK
            - DATA_ERROR
          description: >-
            Output only. The state of data requirements for this model:
            `DATA_OK` and `DATA_ERROR`. Recommendation model cannot be trained
            if the data is in `DATA_ERROR` state. Recommendation model can have
            `DATA_ERROR` state even if serving state is `ACTIVE`: models were
            trained successfully before, but cannot be refreshed because model
            no longer has sufficient data for training.
          type: string
    GoogleCloudRetailV2AddFulfillmentPlacesResponse:
