openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Vertex AI Search for commerce API
  description: >-
    Vertex AI Search for commerce API is made up of Retail Search, Browse and
    Recommendations. These discovery AI solutions help you implement
    personalized search, browse and recommendations, based on machine learning
    models, across your websites and mobile applications.
  version: v2
  x-discovery-doc-revision: '20260723'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/recommendations
servers:
  - url: https://retail.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    GoogleCloudRetailV2alphaBigQueryOutputResult:
      properties:
        datasetId:
          description: The ID of a BigQuery Dataset.
          type: string
        tableId:
          type: string
          description: The ID of a BigQuery Table.
      description: A BigQuery output result.
      id: GoogleCloudRetailV2alphaBigQueryOutputResult
      type: object
    GoogleCloudRetailV2SetInventoryRequest:
      id: GoogleCloudRetailV2SetInventoryRequest
      type: object
      description: Request message for ProductService.SetInventory method.
      properties:
        inventory:
          $ref: '#/components/schemas/GoogleCloudRetailV2Product'
          description: >-
            Required. The inventory information to update. The allowable fields
            to update are: * Product.price_info * Product.availability *
            Product.available_quantity * Product.fulfillment_info The updated
            inventory fields must be specified in SetInventoryRequest.set_mask.
            If SetInventoryRequest.inventory.name is empty or invalid, an
            INVALID_ARGUMENT error is returned. If the caller does not have
            permission to update the Product named in Product.name, regardless
            of whether or not it exists, a PERMISSION_DENIED error is returned.
            If the Product to update does not have existing inventory
            information, the provided inventory information will be inserted. If
            the Product to update has existing inventory information, the
            provided inventory information will be merged while respecting the
            last update time for each inventory field, using the provided or
            default value for SetInventoryRequest.set_time. The caller can
            replace place IDs for a subset of fulfillment types in the following
            ways: * Adds "fulfillment_info" in SetInventoryRequest.set_mask *
            Specifies only the desired fulfillment types and corresponding place
            IDs to update in SetInventoryRequest.inventory.fulfillment_info The
            caller can clear all place IDs from a subset of fulfillment types in
            the following ways: * Adds "fulfillment_info" in
            SetInventoryRequest.set_mask * Specifies only the desired
            fulfillment types to clear in
            SetInventoryRequest.inventory.fulfillment_info * Checks that only
            the desired fulfillment info types have empty
            SetInventoryRequest.inventory.fulfillment_info.place_ids The last
            update time is recorded for the following inventory fields: *
            Product.price_info * Product.availability *
            Product.available_quantity * Product.fulfillment_info If a full
            overwrite of inventory information while ignoring timestamps is
            needed, ProductService.UpdateProduct should be invoked instead.
        setTime:
          type: string
          format: google-datetime
          description: >-
            The time when the request is issued, used to prevent out-of-order
            updates on inventory fields with the last update time recorded. If
            not provided, the internal system time will be used.
        setMask:
          format: google-fieldmask
          description: >-
            Indicates which inventory fields in the provided Product to update.
            At least one field must be provided. If an unsupported or unknown
            field is provided, an INVALID_ARGUMENT error is returned and the
            entire update will be ignored.
          type: string
        allowMissing:
          description: >-
            If set to true, and the Product with name Product.name is not found,
            the inventory update will still be processed and retained for at
            most 1 day until the Product is created. If set to false, a
            NOT_FOUND error is returned if the Product is not found.
          type: boolean
    GoogleCloudRetailV2Model:
      description: >-
        Metadata that describes the training and serving parameters of a Model.
        A Model can be associated with a ServingConfig and then queried through
        the Predict API.
      properties:
        updateTime:
          readOnly: true
          format: google-datetime
          description: >-
            Output only. Timestamp the Recommendation Model was last updated.
            E.g. if a Recommendation Model was paused - this would be the time
            the pause was initiated.
          type: string
        tuningOperation:
          description: >-
            Output only. The tune operation associated with the model. Can be
            used to determine if there is an ongoing tune for this
            recommendation. Empty field implies no tune is goig on.
          readOnly: true
          type: string
        servingConfigLists:
          description: >-
            Output only. The list of valid serving configs associated with the
            PageOptimizationConfig.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2ModelServingConfigList'
        lastTuneTime:
          type: string
          description: Output only. The timestamp when the latest successful tune finished.
          readOnly: true
          format: google-datetime
        filteringOption:
          type: string
          enumDescriptions:
            - >-
              Value used when unset. In this case, server behavior defaults to
              RECOMMENDATIONS_FILTERING_DISABLED.
            - Recommendation filtering is disabled.
            - Recommendation filtering is enabled.
          enum:
            - RECOMMENDATIONS_FILTERING_OPTION_UNSPECIFIED
            - RECOMMENDATIONS_FILTERING_DISABLED
            - RECOMMENDATIONS_FILTERING_ENABLED
          description: >-
            Optional. If `RECOMMENDATIONS_FILTERING_ENABLED`, recommendation
            filtering by attributes is enabled for the model.
        modelFeaturesConfig:
          $ref: '#/components/schemas/GoogleCloudRetailV2ModelModelFeaturesConfig'
          description: Optional. Additional model features config.
        displayName:
          description: >-
            Required. The display name of the model. Should be human readable,
            used to display Recommendation Models in the Retail Cloud Console
            Dashboard. UTF-8 encoded string with limit of 1024 characters.
          type: string
        optimizationObjective:
          type: string
          description: >-
            Optional. The optimization objective e.g. `cvr`. Currently supported
            values: `ctr`, `cvr`, `revenue-per-order`. If not specified, we
            choose default based on model type. Default depends on type of
            recommendation: `recommended-for-you` => `ctr` `others-you-may-like`
            => `ctr` `frequently-bought-together` => `revenue_per_order` This
            field together with optimization_objective describe model metadata
            to use to control model training and serving. See
            https://cloud.google.com/retail/docs/models for more details on what
            the model metadata control and which combination of parameters are
            valid. For invalid combinations of parameters (e.g. type =
            `frequently-bought-together` and optimization_objective = `ctr`),
            you receive an error 400 if you try to create/update a
            recommendation with this set of knobs.
        type:
          type: string
          description: >-
            Required. The type of model e.g. `home-page`. Currently supported
            values: `recommended-for-you`, `others-you-may-like`,
            `frequently-bought-together`, `page-optimization`, `similar-items`,
            `buy-it-again`, `on-sale-items`, and `recently-viewed`(readonly
            value). This field together with optimization_objective describe
            model metadata to use to control model training and serving. See
            https://cloud.google.com/retail/docs/models for more details on what
            the model metadata control and which combination of parameters are
            valid. For invalid combinations of parameters (e.g. type =
            `frequently-bought-together` and optimization_objective = `ctr`),
            you receive an error 400 if you try to create/update a
            recommendation with this set of knobs.
        name:
          description: >-
            Required. The fully qualified resource name of the model. Format:
            `projects/{project_number}/locations/{location_id}/catalogs/{catalog_id}/models/{model_id}`
            catalog_id has char limit of 50. recommendation_model_id has char
            limit of 40.
          type: string
        createTime:
          description: Output only. Timestamp the Recommendation Model was created at.
          readOnly: true
          format: google-datetime
          type: string
        servingState:
          readOnly: true
          enumDescriptions:
            - Unspecified serving state.
            - The model is not serving.
            - The model is serving and can be queried.
            - The model is trained on tuned hyperparameters and can be queried.
          enum:
            - SERVING_STATE_UNSPECIFIED
            - INACTIVE
            - ACTIVE
            - TUNED
          description: 'Output only. The serving state of the model: `ACTIVE`, `NOT_ACTIVE`.'
          type: string
        dataState:
          readOnly: true
          enumDescriptions:
            - Unspecified default value, should never be explicitly set.
            - The model has sufficient training data.
            - >-
              The model does not have sufficient training data. Error messages
              can be queried via Stackdriver.
          enum:
            - DATA_STATE_UNSPECIFIED
            - DATA_OK
            - DATA_ERROR
          description: >-
            Output only. The state of data requirements for this model:
            `DATA_OK` and `DATA_ERROR`. Recommendation model cannot be trained
            if the data is in `DATA_ERROR` state. Recommendation model can have
            `DATA_ERROR` state even if serving state is `ACTIVE`: models were
            trained successfully before, but cannot be refreshed because model
            no longer has sufficient data for training.
          type: string
        trainingState:
          description: >-
            Optional. The training state that the model is in (e.g. `TRAINING`
            or `PAUSED`). Since part of the cost of running the service is
            frequency of training - this can be used to determine when to train
            model in order to control cost. If not specified: the default value
            for `CreateModel` method is `TRAINING`. The default value for
            `UpdateModel` method is to keep the state the same as before.
          enumDescriptions:
            - Unspecified training state.
            - The model training is paused.
            - The model is training.
          enum:
            - TRAINING_STATE_UNSPECIFIED
            - PAUSED
            - TRAINING
          type: string
        periodicTuningState:
          enumDescriptions:
            - Unspecified default value, should never be explicitly set.
            - >-
              The model has periodic tuning disabled. Tuning can be reenabled by
              calling the `EnableModelPeriodicTuning` method or by calling the
              `TuneModel` method.
            - >-
              The model cannot be tuned with periodic tuning OR the `TuneModel`
              method. Hide the options in customer UI and reject any requests
              through the backend self serve API.
            - >-
              The model has periodic tuning enabled. Tuning can be disabled by
              calling the `DisableModelPeriodicTuning` method.
          enum:
            - PERIODIC_TUNING_STATE_UNSPECIFIED
            - PERIODIC_TUNING_DISABLED
            - ALL_TUNING_DISABLED
            - PERIODIC_TUNING_ENABLED
          description: >-
            Optional. The state of periodic tuning. The period we use is 3
            months - to do a one-off tune earlier use the `TuneModel` method.
            Default value is `PERIODIC_TUNING_ENABLED`.
          type: string
      id: GoogleCloudRetailV2Model
      type: object
    GoogleCloudRetailV2ExportAnalyticsMetricsRequest:
      description: Request message for the `ExportAnalyticsMetrics` method.
      properties:
        outputConfig:
          description: >-
            Required. The output location of the data. Only
            `bigquery_destination` is supported, and
            `bigquery_destination.table_type` must be set to `view`.
          $ref: '#/components/schemas/GoogleCloudRetailV2OutputConfig'
        filter:
          type: string
          description: >-
            A filtering expression to specify restrictions on returned metrics.
            The expression is a sequence of terms. Each term applies a
            restriction to the returned metrics. Use this expression to restrict
            results to a specific time range. Currently we expect only one types
            of fields: * `timestamp`: This can be specified twice, once with a
            less than operator and once with a greater than operator. The
            `timestamp` restriction should result in one, contiguous, valid,
            `timestamp` range. Some examples of valid filters expressions: *
            Example 1: `timestamp > "2012-04-23T18:25:43.511Z" timestamp <
            "2012-04-23T18:30:43.511Z"` * Example 2: `timestamp >
            "2012-04-23T18:25:43.511Z"`
      id: GoogleCloudRetailV2ExportAnalyticsMetricsRequest
      type: object
    GoogleCloudRetailV2alphaAddFulfillmentPlacesMetadata:
      id: GoogleCloudRetailV2alphaAddFulfillmentPlacesMetadata
      type: object
      properties: {}
      description: >-
        Metadata related to the progress of the AddFulfillmentPlaces operation.
        Currently empty because there is no meaningful metadata populated from
        the ProductService.AddFulfillmentPlaces method.
    GoogleCloudRetailV2betaRejoinUserEventsMetadata:
      description: Metadata for `RejoinUserEvents` method.
      properties: {}
      id: GoogleCloudRetailV2betaRejoinUserEventsMetadata
      type: object
    GoogleCloudRetailV2SearchRequestSpellCorrectionSpec:
      properties:
        mode:
          enumDescriptions:
            - >-
              Unspecified spell correction mode. In this case, server behavior
              defaults to Mode.AUTO.
            - >-
              Google Retail Search will try to find a spell suggestion if there
              is any and put in the SearchResponse.corrected_query. The spell
              suggestion will not be used as the search query.
            - >-
              Automatic spell correction built by Google Retail Search. Search
              will be based on the corrected query if found.
          enum:
            - MODE_UNSPECIFIED
            - SUGGESTION_ONLY
            - AUTO
          description: >-
            The mode under which spell correction should take effect to replace
            the original search query. Default to Mode.AUTO.
          type: string
      description: The specification for query spell correction.
      id: GoogleCloudRetailV2SearchRequestSpellCorrectionSpec
      type: object
    GoogleLongrunningOperation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      properties:
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/GoogleRpcStatus'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        response:
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
        name:
          type: string
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
      id: GoogleLongrunningOperation
      type: object
    GoogleCloudRetailV2SetInventoryMetadata:
      id: GoogleCloudRetailV2SetInventoryMetadata
      type: object
      properties: {}
      description: >-
        Metadata related to the progress of the SetInventory operation.
        Currently empty because there is no meaningful metadata populated from
        the ProductService.SetInventory method.
    GoogleCloudRetailV2betaModelFrequentlyBoughtTogetherFeaturesConfig:
      id: GoogleCloudRetailV2betaModelFrequentlyBoughtTogetherFeaturesConfig
      type: object
      description: Additional configs for the frequently-bought-together model type.
      properties:
        contextProductsType:
          type: string
          description: >-
            Optional. Specifies the context of the model when it is used in
            predict requests. Can only be set for the
            `frequently-bought-together` type. If it isn't specified, it
            defaults to MULTIPLE_CONTEXT_PRODUCTS.
          enumDescriptions:
            - >-
              Unspecified default value, should never be explicitly set.
              Defaults to MULTIPLE_CONTEXT_PRODUCTS.
            - >-
              Use only a single product as context for the recommendation.
              Typically used on pages like add-to-cart or product details.
            - >-
              Use one or multiple products as context for the recommendation.
              Typically used on shopping cart pages.
          enum:
            - CONTEXT_PRODUCTS_TYPE_UNSPECIFIED
            - SINGLE_CONTEXT_PRODUCT
            - MULTIPLE_CONTEXT_PRODUCTS
    GoogleCloudRetailV2alphaSetInventoryMetadata:
      id: GoogleCloudRetailV2alphaSetInventoryMetadata
      type: object
      description: >-
        Metadata related to the progress of the SetInventory operation.
        Currently empty because there is no meaningful metadata populated from
        the ProductService.SetInventory method.
      properties: {}
    GoogleCloudRetailV2BatchUpdateGenerativeQuestionConfigsResponse:
      id: GoogleCloudRetailV2BatchUpdateGenerativeQuestionConfigsResponse
      type: object
      description: Aggregated response for UpdateGenerativeQuestionConfig method.
      properties:
        generativeQuestionConfigs:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2GenerativeQuestionConfig'
          description: Optional. The updates question configs.
    GoogleCloudRetailV2PredictResponse:
      properties:
        missingIds:
          type: array
          items:
            type: string
          description: IDs of products in the request that were missing from the inventory.
        validateOnly:
          description: True if the validateOnly property was set in the request.
          type: boolean
        attributionToken:
          type: string
          description: >-
            A unique attribution token. This should be included in the UserEvent
            logs resulting from this recommendation, which enables accurate
            attribution of recommendation model performance.
        results:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2PredictResponsePredictionResult
          description: >-
            A list of recommended products. The order represents the ranking
            (from the most relevant product to the least).
      description: Response message for predict method.
      id: GoogleCloudRetailV2PredictResponse
      type: object
    GoogleCloudRetailV2StringList:
      id: GoogleCloudRetailV2StringList
      type: object
      properties:
        values:
          type: array
          items:
            type: string
          description: String values.
      description: A list of string values.
    GoogleCloudRetailV2CatalogAttributeFacetConfigIgnoredFacetValues:
      properties:
        startTime:
          description: >-
            Time range for the current list of facet values to ignore. If
            multiple time ranges are specified for an facet value for the
            current attribute, consider all of them. If both are empty, ignore
            always. If start time and end time are set, then start time must be
            before end time. If start time is not empty and end time is empty,
            then will ignore these facet values after the start time.
          format: google-datetime
          type: string
        endTime:
          description: >-
            If start time is empty and end time is not empty, then ignore these
            facet values before end time.
          format: google-datetime
          type: string
        values:
          type: array
          items:
            type: string
          description: >-
            List of facet values to ignore for the following time range. The
            facet values are the same as the attribute values. There is a limit
            of 10 values per instance of IgnoredFacetValues. Each value can have
            at most 128 characters.
      description: >-
        Facet values to ignore on facets during the specified time range for the
        given SearchResponse.Facet.key attribute.
      id: GoogleCloudRetailV2CatalogAttributeFacetConfigIgnoredFacetValues
      type: object
    GoogleCloudRetailV2AddLocalInventoriesRequest:
      id: GoogleCloudRetailV2AddLocalInventoriesRequest
      type: object
      properties:
        localInventories:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudRetailV2LocalInventory'
          description: >-
            Required. A list of inventory information at difference places. Each
            place is identified by its place ID. At most 3000 inventories are
            allowed per request.
        addMask:
          type: string
          format: google-fieldmask
          description: >-
            Indicates which inventory fields in the provided list of
            LocalInventory to update. The field is updated to the provided
            value. If a field is set while the place does not have a previous
            local inventory, the local inventory at that store is created. If a
            field is set while the value of that field is not provided, the
            original field value, if it exists, is deleted. If the mask is not
            set or set with empty paths, all inventory fields will be updated.
            If an unsupported or unknown field is provided, an INVALID_ARGUMENT
            error is returned and the entire update will be ignored.
        addTime:
          type: string
          format: google-datetime
          description: >-
            The time when the inventory updates are issued. Used to prevent
            out-of-order updates on local inventory fields. If not provided, the
            internal system time will be used.
        allowMissing:
          type: boolean
          description: >-
            If set to true, and the Product is not found, the local inventory
            will still be processed and retained for at most 1 day and processed
            once the Product is created. If set to false, a NOT_FOUND error is
            returned if the Product is not found.
      description: Request message for ProductService.AddLocalInventories method.
    GoogleCloudRetailV2alphaImportErrorsConfig:
      id: GoogleCloudRetailV2alphaImportErrorsConfig
      type: object
      properties:
        gcsPrefix:
          description: >-
            Google Cloud Storage prefix for import errors. This must be an
            empty, existing Cloud Storage directory. Import errors are written
            to sharded files in this directory, one per line, as a JSON-encoded
            `google.rpc.Status` message.
          type: string
      description: Configuration of destination for Import related errors.
    GoogleCloudRetailV2alphaMerchantCenterAccountLinkMerchantCenterFeedFilter:
      id: >-
        GoogleCloudRetailV2alphaMerchantCenterAccountLinkMerchantCenterFeedFilter
      type: object
      description: Merchant Center Feed filter criterion.
      properties:
        dataSourceId:
          description: AFM data source ID.
          format: int64
          type: string
        primaryFeedId:
          type: string
          description: >-
            Merchant Center primary feed ID. Deprecated: use data_source_id
            instead.
          deprecated: true
          format: int64
        primaryFeedName:
          type: string
          description: >-
            Merchant Center primary feed name. The name is used for the display
            purposes only.
    GoogleCloudRetailV2SearchResponseConversationalSearchResult:
      properties:
        conversationId:
          description: >-
            Conversation UUID. This field will be stored in client side storage
            to maintain the conversation session with server and will be used
            for next search request's
            SearchRequest.ConversationalSearchSpec.conversation_id to restore
            conversation state in server.
          type: string
        followupQuestion:
          type: string
          description: The follow-up question. e.g., `What is the color?`
        additionalFilters:
          description: >-
            This field is deprecated but will be kept for backward
            compatibility. There is expected to have only one additional filter
            and the value will be the same to the same as field
            `additional_filter`.
          deprecated: true
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2SearchResponseConversationalSearchResultAdditionalFilter
        suggestedAnswers:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2SearchResponseConversationalSearchResultSuggestedAnswer
          description: The answer options provided to client for the follow-up question.
        additionalFilter:
          description: >-
            This is the incremental additional filters implied from the current
            user answer. User should add the suggested addition filters to the
            previous SearchRequest.filter, and use the merged filter in the
            follow up search request.
          $ref: >-
            #/components/schemas/GoogleCloudRetailV2SearchResponseConversationalSearchResultAdditionalFilter
        refinedQuery:
          description: >-
            The current refined query for the conversational search. This field
            will be used in customer UI that the query in the search bar should
            be replaced with the refined query. For example, if
            SearchRequest.query is `dress` and next
            SearchRequest.ConversationalSearchSpec.UserAnswer.text_answer is
            `red color`, which does not match any product attribute value
            filters, the refined query will be `dress, red color`.
          type: string
      description: >-
        This field specifies all related information that is needed on client
        side for UI rendering of conversational retail search.
      id: GoogleCloudRetailV2SearchResponseConversationalSearchResult
      type: object
    GoogleCloudRetailV2Catalog:
      id: GoogleCloudRetailV2Catalog
      type: object
      properties:
        name:
          description: >-
            Required. Immutable. The fully qualified resource name of the
            catalog.
          type: string
        displayName:
          type: string
          description: >-
            Required. Immutable. The catalog display name. This field must be a
            UTF-8 encoded string with a length limit of 128 characters.
            Otherwise, an INVALID_ARGUMENT error is returned.
        productLevelConfig:
          $ref: '#/components/schemas/GoogleCloudRetailV2ProductLevelConfig'
          description: Required. The product level configuration.
      description: The catalog configuration.
    GoogleCloudRetailV2SearchRequestBoostSpec:
      id: GoogleCloudRetailV2SearchRequestBoostSpec
      type: object
      description: Boost specification to boost certain items.
      properties:
        conditionBoostSpecs:
          description: >-
            Condition boost specifications. If a product matches multiple
            conditions in the specifications, boost scores from these
            specifications are all applied and combined in a non-linear way.
            Maximum number of specifications is 20.
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudRetailV2SearchRequestBoostSpecConditionBoostSpec
        skipBoostSpecValidation:
          type: boolean
          description: >-
            Whether to skip boostspec validation. If this field is set to true,
            invalid BoostSpec.condition_boost_specs will be ignored and valid
            BoostSpec.condition_boost_specs will still be applied.
    GoogleCloudRetailV2alphaTuneModelResponse:
      id: GoogleCloudRetailV2alphaTuneModelResponse
      type: object
      description: Response associated with a tune operation.
      properties: {}
    GoogleCloudRetailV2alphaCreateModelMetadata:
      description: Metadata associated with a create operation.
      properties:
        model:
          description: >-
            The resource name of the model that this create applies to. Format:
