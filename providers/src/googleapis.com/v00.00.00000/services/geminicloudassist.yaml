components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AskCloudAssistRequest:
      description: Request for AskCloudAssist
      id: AskCloudAssistRequest
      properties:
        contextId:
          description: Optional. This is an optional session ID to continue a conversation.
          type: string
        project:
          description: >-
            Required. The project resource name in the format
            `projects/{project}`.
          type: string
        userQuery:
          description: Required. The natural language prompt provided by the user.
          type: string
      type: object
    AuditConfig:
      description: >-
        Specifies the audit configuration for a service. The configuration
        determines which permission types are logged, and what identities, if
        any, are exempted from logging. An AuditConfig must have one or more
        AuditLogConfigs. If there are AuditConfigs for both `allServices` and a
        specific service, the union of the two AuditConfigs is used for that
        service: the log_types specified in each AuditConfig are enabled, and
        the exempted_members in each AuditLogConfig are exempted. Example Policy
        with multiple AuditConfigs: { "audit_configs": [ { "service":
        "allServices", "audit_log_configs": [ { "log_type": "DATA_READ",
        "exempted_members": [ "user:jose@example.com" ] }, { "log_type":
        "DATA_WRITE" }, { "log_type": "ADMIN_READ" } ] }, { "service":
        "sampleservice.googleapis.com", "audit_log_configs": [ { "log_type":
        "DATA_READ" }, { "log_type": "DATA_WRITE", "exempted_members": [
        "user:aliya@example.com" ] } ] } ] } For sampleservice, this policy
        enables DATA_READ, DATA_WRITE and ADMIN_READ logging. It also exempts
        `jose@example.com` from DATA_READ logging, and `aliya@example.com` from
        DATA_WRITE logging.
      id: AuditConfig
      properties:
        auditLogConfigs:
          description: The configuration for logging of each type of permission.
          items:
            $ref: '#/components/schemas/AuditLogConfig'
          type: array
        service:
          description: >-
            Specifies a service that will be enabled for audit logging. For
            example, `storage.googleapis.com`, `cloudsql.googleapis.com`.
            `allServices` is a special value that covers all services.
          type: string
      type: object
    AuditLogConfig:
      description: >-
        Provides the configuration for logging a type of permissions. Example: {
        "audit_log_configs": [ { "log_type": "DATA_READ", "exempted_members": [
        "user:jose@example.com" ] }, { "log_type": "DATA_WRITE" } ] } This
        enables 'DATA_READ' and 'DATA_WRITE' logging, while exempting
        jose@example.com from DATA_READ logging.
      id: AuditLogConfig
      properties:
        exemptedMembers:
          description: >-
            Specifies the identities that do not cause logging for this type of
            permission. Follows the same format of Binding.members.
          items:
            type: string
          type: array
        logType:
          description: The log type that this config enables.
          enum:
            - LOG_TYPE_UNSPECIFIED
            - ADMIN_READ
            - DATA_WRITE
            - DATA_READ
          enumDescriptions:
            - Default case. Should never be this.
            - 'Admin reads. Example: CloudIAM getIamPolicy'
            - 'Data writes. Example: CloudSQL Users create'
            - 'Data reads. Example: CloudSQL Users list'
          type: string
      type: object
    Binding:
      description: Associates `members`, or principals, with a `role`.
      id: Binding
      properties:
        condition:
          $ref: '#/components/schemas/Expr'
          description: >-
            The condition that is associated with this binding. If the condition
            evaluates to `true`, then this binding applies to the current
            request. If the condition evaluates to `false`, then this binding
            does not apply to the current request. However, a different role
            binding might grant the same role to one or more of the principals
            in this binding. To learn which resources support conditions in
            their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
        members:
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. `members` can have the following values: * `allUsers`: A
            special identifier that represents anyone who is on the internet;
            with or without a Google account. * `allAuthenticatedUsers`: A
            special identifier that represents anyone who is authenticated with
            a Google account or a service account. Does not include identities
            that come from external identity providers (IdPs) through identity
            federation. * `user:{emailid}`: An email address that represents a
            specific Google account. For example, `alice@example.com` . *
            `serviceAccount:{emailid}`: An email address that represents a
            Google service account. For example,
            `my-other-app@appspot.gserviceaccount.com`. *
            `serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]`:
            An identifier for a [Kubernetes service
            account](https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example,
            `my-project.svc.id.goog[my-namespace/my-kubernetes-sa]`. *
            `group:{emailid}`: An email address that represents a Google group.
            For example, `admins@example.com`. * `domain:{domain}`: The G Suite
            domain (primary) that represents all the users of that domain. For
            example, `google.com` or `example.com`. *
            `principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workforce identity pool. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}`:
            All workforce identities in a group. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All workforce identities with a specific attribute value. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*`:
            All identities in a workforce identity pool. *
            `principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workload identity pool. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}`:
            A workload identity pool group. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All identities in a workload identity pool with a certain attribute.
            *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*`:
            All identities in a workload identity pool. *
            `deleted:user:{emailid}?uid={uniqueid}`: An email address (plus
            unique identifier) representing a user that has been recently
            deleted. For example, `alice@example.com?uid=123456789012345678901`.
            If the user is recovered, this value reverts to `user:{emailid}` and
            the recovered user retains the role in the binding. *
            `deleted:serviceAccount:{emailid}?uid={uniqueid}`: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            `my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901`.
            If the service account is undeleted, this value reverts to
            `serviceAccount:{emailid}` and the undeleted service account retains
            the role in the binding. * `deleted:group:{emailid}?uid={uniqueid}`:
            An email address (plus unique identifier) representing a Google
            group that has been recently deleted. For example,
            `admins@example.com?uid=123456789012345678901`. If the group is
            recovered, this value reverts to `group:{emailid}` and the recovered
            group retains the role in the binding. *
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            Deleted single identity in a workforce identity pool. For example,
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value`.
          items:
            type: string
          type: array
        role:
          description: >-
            Role that is assigned to the list of `members`, or principals. For
            example, `roles/viewer`, `roles/editor`, or `roles/owner`. For an
            overview of the IAM roles and permissions, see the [IAM
            documentation](https://cloud.google.com/iam/docs/roles-overview).
            For a list of the available pre-defined roles, see
            [here](https://cloud.google.com/iam/docs/understanding-roles).
          type: string
      type: object
    CallToolResponse:
      description: >-
        CallToolResponse represents a single message in the tool execution
        stream.
      id: CallToolResponse
      properties:
        elicitation:
          $ref: '#/components/schemas/McpElicitation'
          description: The elicitation request for the tool execution.
        elicitationComplete:
          $ref: '#/components/schemas/McpElicitationComplete'
          description: The elicitation complete message in response to the `ElicitResult`.
        progress:
          $ref: '#/components/schemas/McpProgress'
          description: Intermediate progress information to be sent as an MCP notification.
        structuredContent:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: The final result of the tool execution.
          type: object
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    DesignInfraRequest:
      description: Request for DesignInfra
      id: DesignInfraRequest
      properties:
        command:
          description: >-
            Required. The command being invoked. Valid values are: -
            "manage_app_design" - "generate_terraform" - "generate_gcloud" -
            "generate_yaml" - "debug_deployment"
          type: string
        contextId:
          description: Optional. This is an optional session ID to continue a conversation.
          type: string
        project:
          description: >-
            Required. The project resource name in the format
            `projects/{project}`.
          type: string
        userQuery:
          description: Required. The natural language prompt provided by the user.
          type: string
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    Expr:
      description: >-
        Represents a textual expression in the Common Expression Language (CEL)
        syntax. CEL is a C-like expression language. The syntax and semantics of
        CEL are documented at https://github.com/google/cel-spec. Example
        (Comparison): title: "Summary size limit" description: "Determines if a
        summary is less than 100 chars" expression: "document.summary.size() <
        100" Example (Equality): title: "Requestor is owner" description:
        "Determines if requestor is the document owner" expression:
        "document.owner == request.auth.claims.email" Example (Logic): title:
        "Public documents" description: "Determine whether the document should
        be publicly visible" expression: "document.type != 'private' &&
        document.type != 'internal'" Example (Data Manipulation): title:
        "Notification string" description: "Create a notification string with a
        timestamp." expression: "'New message received at ' +
        string(document.create_time)" The exact variables and functions that may
        be referenced within an expression are determined by the service that
        evaluates it. See the service documentation for additional information.
      id: Expr
      properties:
        description:
          description: >-
            Optional. Description of the expression. This is a longer text which
            describes the expression, e.g. when hovered over it in a UI.
          type: string
        expression:
          description: >-
            Textual representation of an expression in Common Expression
            Language syntax.
          type: string
        location:
          description: >-
            Optional. String indicating the location of the expression for error
            reporting, e.g. a file name and a position in the file.
          type: string
        title:
          description: >-
            Optional. Title for the expression, i.e. a short string describing
            its purpose. This can be used e.g. in UIs which allow to enter the
            expression.
          type: string
      type: object
    Interval:
      description: >-
        Represents a time interval, encoded as a Timestamp start (inclusive) and
        a Timestamp end (exclusive). The start must be less than or equal to the
        end. When the start equals the end, the interval is empty (matches no
        time). When both start and end are unspecified, the interval matches any
        time.
      id: Interval
      properties:
        endTime:
          description: >-
            Optional. Exclusive end of the interval. If specified, a Timestamp
            matching this interval will have to be before the end.
          format: google-datetime
          type: string
        startTime:
          description: >-
            Optional. Inclusive start of the interval. If specified, a Timestamp
            matching this interval will have to be the same or after the start.
          format: google-datetime
          type: string
      type: object
    InvestigateIssueRequest:
      description: Request for InvestigateIssue
      id: InvestigateIssueRequest
      properties:
        contextId:
          description: Optional. This is an optional session ID to continue a conversation.
          type: string
        project:
          description: >-
            Required. The project resource name in the format
            `projects/{project}`.
          type: string
        userQuery:
          description: Required. The natural language prompt provided by the user.
          type: string
      type: object
    Investigation:
      description: >-
        Holds the contents of a Gemini Cloud Assist Troubleshooting
        investigation.
      id: Investigation
      properties:
        annotations:
          $ref: '#/components/schemas/InvestigationAnnotations'
          description: Optional. Additional annotations on the investigation.
        createTime:
          description: Output only. The time when the investigation was created.
          format: google-datetime
          readOnly: true
          type: string
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            Output only. The error if the investigation run failed. This field
            will only be set if `execution_state` is
            `INVESTIGATION_EXECUTION_STATE_FAILED`.
          readOnly: true
        executionState:
          description: Output only. The execution state of the investigation.
          enum:
            - INVESTIGATION_EXECUTION_STATE_UNSPECIFIED
            - INVESTIGATION_EXECUTION_STATE_RUNNING
            - INVESTIGATION_EXECUTION_STATE_MODIFIED
            - INVESTIGATION_EXECUTION_STATE_FAILED
            - INVESTIGATION_EXECUTION_STATE_CANCELLED
            - INVESTIGATION_EXECUTION_STATE_COMPLETED
          enumDescriptions:
            - Default value. This value is unused.
            - The investigation is being executed.
            - >-
              The investigation has not yet been executed since it was last
              updated.
            - >-
              The investigation execution has completed, but the execution has
              failed.
            - The investigation execution was cancelled.
            - >-
              All execution tasks have completed and the investigation is at
              rest.
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels for the investigation.
          type: object
        name:
          description: >-
            Identifier. Name of the investigation, of the form:
            projects/{project_number}/locations/{location_id}/investigations/{investigation_id}
          type: string
        observations:
          additionalProperties:
            $ref: '#/components/schemas/Observation'
          description: >-
            Optional. Observations about the project state that comprise the
            contents of the investigation.
          type: object
        observerStatuses:
          additionalProperties:
            $ref: '#/components/schemas/ObserverStatus'
          description: >-
            Optional. Statuses of observers which have been invoked in order to
            run the investigation.
          type: object
        operation:
          description: >-
            Output only. The resource name of the Run operation most recently
            performed on the investigation, of the form:
            projects/{project_number}/locations/{location_id}/operations/{operation_id}
          readOnly: true
          type: string
        revision:
          description: >-
            Output only. Resource name of the investigation's current revision,
            of the form:
            projects/{project_number}/locations/{location_id}/investigations/{investigation_id}/revisions/{revision_id}
          readOnly: true
          type: string
        revisionIndex:
          description: Output only. Index of the current revision of the investigation.
          format: int32
          readOnly: true
          type: integer
        revisionPredecessor:
          description: >-
            Optional. The name of the revision that was this revision's
            predecessor.
          type: string
        title:
          description: Optional. Human-readable display title for the investigation.
          type: string
        updateTime:
          description: Output only. The time when the investigation was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    InvestigationAnnotations:
      description: Additional annotations on an Investigation.
      id: InvestigationAnnotations
      properties:
        extrasMap:
          additionalProperties:
            type: string
          description: Optional. Additional client-specified annotations.
          type: object
        pagePath:
          description: >-
            Optional. The path of a web page from which this investigation was
            created.
          type: string
        revisionLastRunInterval:
          $ref: '#/components/schemas/Interval'
          description: >-
            Output only. The interval during which the investigation was last
            executed.
          readOnly: true
        supportCase:
          description: Optional. A support case ID associated with the investigation.
          type: string
      type: object
    InvestigationRevision:
      description: >-
        A revision holds a snapshot of the investigation at a past point in
        time. The most recent revision holds the investigation's current state,
        while previous revisions are immutable.
      id: InvestigationRevision
      properties:
        createTime:
          description: Output only. The time when the revision was created.
          format: google-datetime
          readOnly: true
          type: string
        index:
          description: Output only. Revision index number, in order of creation.
          format: int32
          readOnly: true
          type: integer
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels for the revision.
          type: object
        name:
          description: >-
            Identifier. The name of the revision resource, of the form:
            projects/{project_number}/locations/{location_id}/investigations/{investigation_id}/revisions/{revision_id}
          type: string
        snapshot:
          $ref: '#/components/schemas/Investigation'
          description: Optional. Snapshot of the investigation contents at this revision.
      type: object
    InvestigationRunParameters:
      deprecated: true
      description: >-
        Deprecated: This message is only used in the deprecated
        RunInvestigationRevision method. Represents user parameters for running
        an investigation.
      id: InvestigationRunParameters
      properties:
        accessTokens:
          additionalProperties:
            type: string
          description: >-
            Optional. If populated, map of project to IAM token granting access
            to that project.
          type: object
      type: object
    InvokeOperationRequest:
      description: Request for InvokeOperation
      id: InvokeOperationRequest
      properties:
        contextId:
          description: Optional. This is an optional session ID to continue a conversation.
          type: string
        project:
          description: >-
            Required. The project resource name in the format
            `projects/{project}`.
          type: string
        userQuery:
          description: Required. The natural language prompt provided by the user.
          type: string
      type: object
    ListInvestigationRevisionsResponse:
      description: Message for response to listing revisions of a given Investigation
      id: ListInvestigationRevisionsResponse
      properties:
        nextPageToken:
          description: >-
            A token to use in subsequent requests in order to return the next
            set of results.
          type: string
        revisions:
          description: The list of Investigation revisions
          items:
            $ref: '#/components/schemas/InvestigationRevision'
          type: array
        unreachable:
          description: Unordered list. Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListInvestigationsResponse:
      description: Message for response to listing Investigations
      id: ListInvestigationsResponse
      properties:
        investigations:
          description: The list of Investigations
          items:
            $ref: '#/components/schemas/Investigation'
          type: array
        nextPageToken:
          description: >-
            A token to use in subsequent requests in order to return the next
            set of results.
          type: string
        unreachable:
          description: Unordered list. Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    McpElicitation:
      id: McpElicitation
      properties:
        elicitationId:
          description: The ID of the elicitation. Required by ELICITATION_MODE_URL mode.
          type: string
        message:
          description: The message of the elicitation form or url.
          type: string
        mode:
          enum:
            - ELICITATION_MODE_UNSPECIFIED
            - ELICITATION_MODE_FORM
            - ELICITATION_MODE_URL
          enumDescriptions:
            - ''
            - ''
            - ''
          type: string
        requestedSchema:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            The schema of the elicitation form. The schema is limited to flat
            objects with primitive properties only. Only set if mode is
            ELICITATION_MODE_FORM.
          type: object
        url:
          description: >-
            The url of the elicitation, only set if mode is
            ELICITATION_MODE_URL.
          type: string
      type: object
    McpElicitationComplete:
      description: McpElicitationComplete is used to signal the end of an elicitation flow.
      id: McpElicitationComplete
      properties:
        errorMessage:
          description: The error message, only set if is_error is true.
          type: string
        isError:
          description: >-
            True if encountering an error, e.g., elicitation is not handled by
            the producer service.
          type: boolean
      type: object
    McpProgress:
      description: >-
        McpProgress details the current state of a long-running tool operation.
        See:
        https://modelcontextprotocol.io/specification/2025-11-25/basic/utilities/progress#progress-flow
      id: McpProgress
      properties:
        message:
          description: An optional descriptive message about the current progress.
          type: string
        progress:
          description: The amount of progress made so far.
          format: double
          type: number
        progressToken:
          description: >-
            The progress token provided in the _meta field on the request (if
            desired). The progress token is allowed to either be a string or
            numeric value, and must be identical to the progressToken value
            provided in the initial request.
          type: any
        total:
          description: The total amount of progress expected.
          format: double
          type: number
      type: object
    ModifyInvestigationRevisionRequest:
      deprecated: true
      description: >-
        Deprecated: This message is only used in the deprecated
        ModifyInvestigationRevision method. Request for modifying an
        investigation revision.
      id: ModifyInvestigationRevisionRequest
      properties:
        investigation:
          $ref: '#/components/schemas/Investigation'
          description: Required. The contents to modify the revision's snapshot with.
        updateMask:
          description: >-
            Optional. The fields of the revision's snapshot to update. Note that
            only user-writeable fields can be updated. Fields should be
            specified relative to the Investigation message, i.e. they should
            not include the prefix "snapshot".
          format: google-fieldmask
          type: string
      type: object
    Observation:
      description: >-
        An observation represents a single fact about the state of the system
        under investigation, along with a ranking of its relevance.
      id: Observation
      properties:
        baseObservations:
          description: >-
            Optional. The IDs of other observations that this observation is
            based on. For example, a hypothesis observation will record the
            observations that support that hypothesis.
          items:
            type: string
          type: array
        createTime:
          description: Output only. The time when the observation was created.
          format: google-datetime
          readOnly: true
          type: string
        data:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Optional. A structured representation of the observation. This is
            not required or guaranteed to conform to any particular schema.
          type: object
        dataUrls:
          additionalProperties:
            type: string
          description: >-
            Optional. URLs pointing to evidence in support of this observation.
            Maps from a human-readable description to a URL.
          type: object
        id:
          description: >-
            Output only. Uniquely identifies this observation. This is always
            equal to the map key of this observation in the parent
            investigation.
          readOnly: true
          type: string
        knowledgeUrls:
          additionalProperties:
            type: string
          description: >-
            Optional. URLs pointing to reference knowledge related to this
            observation. Maps from a human-readable description to a URL.
          type: object
        observationCompletionState:
          description: >-
            Optional. Represents whether the observation is fully formed and
            able to be used to draw conclusions.
          enum:
            - OBSERVATION_COMPLETION_STATE_UNSPECIFIED
            - OBSERVATION_COMPLETION_STATE_COMPLETE
            - OBSERVATION_COMPLETION_STATE_INCOMPLETE
          enumDescriptions:
            - Default value. Will be treated as COMPLETE.
            - This observation is fully formed.
            - >-
              This observation is missing some information, or needs further
              processing by a different observer. This type of observation may
              be discarded in future investigation runs.
          type: string
        observationType:
          description: Required. The type of the observation.
          enum:
            - OBSERVATION_TYPE_UNSPECIFIED
            - OBSERVATION_TYPE_CLOUD_LOG
            - OBSERVATION_TYPE_CLOUD_METRIC
            - OBSERVATION_TYPE_CAIS_CONFIG
            - OBSERVATION_TYPE_CAIS_CONFIG_DIFF
            - OBSERVATION_TYPE_CLOUD_ALERT
            - OBSERVATION_TYPE_CICD_EVENT
            - OBSERVATION_TYPE_TEXT_DESCRIPTION
            - OBSERVATION_TYPE_HYPOTHESIS
            - OBSERVATION_TYPE_STRUCTURED_INPUT
            - OBSERVATION_TYPE_COMPOSITE
            - OBSERVATION_TYPE_OTHER
            - OBSERVATION_TYPE_RELATED_RESOURCES
            - OBSERVATION_TYPE_LOG_THEME
            - OBSERVATION_TYPE_CONFIG_ANALYSIS
            - OBSERVATION_TYPE_OUTAGE
            - OBSERVATION_TYPE_KNOWLEDGE
            - OBSERVATION_TYPE_INVESTIGATION_RECAP
            - OBSERVATION_TYPE_WARNING
            - OBSERVATION_TYPE_REMEDIATION_PLAN
            - OBSERVATION_TYPE_INVESTIGATION_SUMMARY
            - OBSERVATION_TYPE_HYPOTHESIS_NEXT_STEPS
            - OBSERVATION_TYPE_PROGRESS_BAR_DYNAMIC_STATUS
          enumDescriptions:
            - Default value.
            - The text of this observation is a log entry.
            - The content of this observation is a metric or group of metrics.
            - A config
            - A change of config
            - An alert
            - >-
              An event from a continuous integration system, e.g. prober
              failure.
            - Free text input, such as the initial user input. Can be markdown.
            - >-
              This is for [tentative] conclusions drawn by the system. These can
              become inputs to a subsequent revision. In this case the
              recommendations will be used, but not the remediation.
            - Structured input, e.g. runbook parameters put into a form
            - >-
              Used for an observation that includes more than one kind of
              evidence, such as a runbook output.
            - Runbook output can be 'other' if none of the other types apply.
            - Resources we think are related to the investigation.
            - A theme discovered in the logs.
            - Signals output that includes a config analyzed by LLM.
            - Signals output that includes an outage from PSH.
            - >-
              Text that provides knowledge about a particular user's problem.
              For example, error catalog instructions/external links, RAG etc.
            - Provides a recap or summary of the investigation.
            - Indicates a warning about the investigation.
            - Indicates a remediation plan to fix the root cause(s).
            - Indicates a summary of the investigation.
            - >-
              Indicates the next steps to be taken by the user to help resolve
              the root cause(s).
            - >-
              Indicates dynamic status updates in the progress bar of an
              investigation.
          type: string
        observedNormalOperation:
          description: >-
            Optional. If false or unspecified, this observation gives
            information about an issue or root cause. If true, this observation
            indicates that a system was observed to be operating normally. Such
            negative results can be useful diagnostic findings, and this field
            has no correlation with the relevance score.
          type: boolean
        observerType:
          description: Required. The type of observer that produced this observation.
          enum:
            - OBSERVER_TYPE_UNSPECIFIED
            - OBSERVER_TYPE_DIAGNOSTICS
            - OBSERVER_TYPE_SIGNALS
            - OBSERVER_TYPE_DETERMINISTIC_CODE
            - OBSERVER_TYPE_AI
            - OBSERVER_TYPE_USER
            - OBSERVER_TYPE_ALERT
          enumDescriptions:
            - Default value. Unused.
            - >-
              Diagnostics have an explicit notion of root causes, e.g. via
              runbooks.
            - Signals is for processing that doesn't have explicit root causes.
            - >-
              This is for code that depends only on premises. In particular,
              error catalog lookups.
            - >-
              This is for AI inferences that depend only on observations listed
              as premises.
            - >-
              User-input observation, including answers to clarifications. All
              user-specified observations will be coerced to this type.
            - An observation from an alert.
          type: string
        recommendation:
          description: >-
            Optional. Natural language or markdown text which describes a
            recommended action to remediate the root cause or further
            investigate the issue.
          type: string
        relevanceOverride:
          description: Optional. The user's relevance judgement.
          enum:
            - USER_RELEVANCE_UNSPECIFIED
            - USER_RELEVANCE_PROMOTED
            - USER_RELEVANCE_REJECTED
          enumDescriptions:
            - >-
              The user has not marked this observation as relevant or
              irrelevant.
            - The user marked this observation as relevant.
            - The user marked this observation as irrelevant.
          type: string
        relevantResources:
          description: >-
            Optional. The Google Cloud resources relevant to the observation.
            These should be fully qualified resource URIs, e.g.:
            "//compute.googleapis.com/projects/my-project/zones/us-central1-a/instances/my-instance"
          items:
            type: string
          type: array
        systemRelevanceScore:
          description: >-
            Optional. How relevant the observer perceives this observation to
            be. This is used to rank observations in generating hypotheses. The
            system outputs observations in the range [-1, 1], where -1 means
            completely irrelevant, 0 means neutral, and 1 means complete
            confidence in its relevance.
          format: float
          type: number
        text:
          description: >-
            Optional. Natural-language or markdown text explaining the
            observation.
          type: string
        timeIntervals:
          description: Optional. When this observation occurred.
          items:
            $ref: '#/components/schemas/Interval'
          type: array
        title:
          description: Optional. Human-readable display title for the observation.
          type: string
      type: object
    ObserverStatus:
      description: >-
        An ObserverStatus represents the status of an observer at a particular
        point during execution of an investigation.
      id: ObserverStatus
      properties:
        observer:
          description: >-
            Output only. Uniquely identifies this observer. This is always equal
            to the map key of this observer in the parent investigation.
          readOnly: true
          type: string
        observerDisplayName:
          description: Required. Human-readable display name for the observer.
          type: string
        observerErrors:
          description: >-
            Optional. An error that blocked an observer from making a particular
            observation.
          items:
            $ref: '#/components/schemas/Status'
          type: array
        observerExecutionState:
          description: Optional. The current execution state of the observer.
          enum:
            - OBSERVER_EXECUTION_UNSPECIFIED
            - OBSERVER_EXECUTION_NOT_STARTED
            - OBSERVER_EXECUTION_RUNNING
            - OBSERVER_EXECUTION_COMPLETE
            - OBSERVER_EXECUTION_FAILED
            - OBSERVER_EXECUTION_BLOCKED
            - OBSERVER_EXECUTION_INVESTIGATION_BLOCKED
            - OBSERVER_EXECUTION_INVESTIGATION_DEGRADED
          enumDescriptions:
            - The observer state is unspecified.
            - The investigation has not yet started.
            - >-
              The investigation is running and this observer is runnable or
              running.
            - The observer has finished without an internal error.
            - >-
              The observer tried to run but failed due to an error. This is
              specific to a component and may be rendered in the UI if the
              observation is shown, as very low priority.
            - The observer is blocked pending an input.
            - >-
              The observer reports an error that blocks or severely impacts the
              investigation, for example CAIS or logging disabled. Should be
              rendered in the UI prominently.
            - >-
              The observer reports an error that degrades the investigation, may
              require user to escalate or re-run the investigation after
              mitigating the cause.
          type: string
        startTime:
          description: Optional. The time when the observer started its observation.
          format: google-datetime
          type: string
        updateComment:
          description: Optional. A status update from the observer.
          type: string
        updateTime:
          description: >-
            Optional. The time when the observer last updated the investigation.
            If the `observer_execution_state` is COMPLETE or FAILED, this is the
            time when the observer finished its observation.
          format: google-datetime
          type: string
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have Operation.error value with a google.rpc.Status.code of 1,
            corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        statusMessage:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    OptimizeCostsRequest:
      description: Request for OptimizeCosts
      id: OptimizeCostsRequest
      properties:
        contextId:
          description: Optional. This is an optional session ID to continue a conversation.
          type: string
        project:
          description: >-
            Required. The project resource name in the format
            `projects/{project}`.
          type: string
        userQuery:
          description: Required. The natural language prompt provided by the user.
          type: string
      type: object
    Policy:
      description: >-
        An Identity and Access Management (IAM) policy, which specifies access
        controls for Google Cloud resources. A `Policy` is a collection of
        `bindings`. A `binding` binds one or more `members`, or principals, to a
        single `role`. Principals can be user accounts, service accounts, Google
        groups, and domains (such as G Suite). A `role` is a named list of
        permissions; each `role` can be an IAM predefined role or a user-created
        custom role. For some types of Google Cloud resources, a `binding` can
        also specify a `condition`, which is a logical expression that allows
        access to a resource only if the expression evaluates to `true`. A
        condition can add constraints based on attributes of the request, the
        resource, or both. To learn which resources support conditions in their
        IAM policies, see the [IAM
        documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
        **JSON example:** ``` { "bindings": [ { "role":
        "roles/resourcemanager.organizationAdmin", "members": [
        "user:mike@example.com", "group:admins@example.com",
        "domain:google.com",
        "serviceAccount:my-project-id@appspot.gserviceaccount.com" ] }, {
        "role": "roles/resourcemanager.organizationViewer", "members": [
        "user:eve@example.com" ], "condition": { "title": "expirable access",
        "description": "Does not grant access after Sep 2020", "expression":
        "request.time < timestamp('2020-10-01T00:00:00.000Z')", } } ], "etag":
        "BwWWja0YfJA=", "version": 3 } ``` **YAML example:** ``` bindings: -
        members: - user:mike@example.com - group:admins@example.com -
        domain:google.com -
        serviceAccount:my-project-id@appspot.gserviceaccount.com role:
        roles/resourcemanager.organizationAdmin - members: -
        user:eve@example.com role: roles/resourcemanager.organizationViewer
        condition: title: expirable access description: Does not grant access
        after Sep 2020 expression: request.time <
        timestamp('2020-10-01T00:00:00.000Z') etag: BwWWja0YfJA= version: 3 ```
        For a description of IAM and its features, see the [IAM
        documentation](https://cloud.google.com/iam/docs/).
      id: Policy
      properties:
        auditConfigs:
          description: Specifies cloud audit logging configuration for this policy.
          items:
            $ref: '#/components/schemas/AuditConfig'
          type: array
        bindings:
          description: >-
            Associates a list of `members`, or principals, with a `role`.
            Optionally, may specify a `condition` that determines how and when
            the `bindings` are applied. Each of the `bindings` must contain at
            least one principal. The `bindings` in a `Policy` can refer to up to
            1,500 principals; up to 250 of these principals can be Google
            groups. Each occurrence of a principal counts towards these limits.
            For example, if the `bindings` grant 50 different roles to
            `user:alice@example.com`, and not to any other principal, then you
            can add another 1,450 principals to the `bindings` in the `Policy`.
          items:
            $ref: '#/components/schemas/Binding'
          type: array
        etag:
          description: >-
            `etag` is used for optimistic concurrency control as a way to help
            prevent simultaneous updates of a policy from overwriting each
            other. It is strongly suggested that systems make use of the `etag`
            in the read-modify-write cycle to perform policy updates in order to
            avoid race conditions: An `etag` is returned in the response to
            `getIamPolicy`, and systems are expected to put that etag in the
            request to `setIamPolicy` to ensure that their change will be
            applied to the same version of the policy. **Important:** If you use
            IAM Conditions, you must include the `etag` field whenever you call
            `setIamPolicy`. If you omit this field, then IAM allows you to
            overwrite a version `3` policy with a version `1` policy, and all of
            the conditions in the version `3` policy are lost.
          format: byte
          type: string
        version:
          description: >-
            Specifies the format of the policy. Valid values are `0`, `1`, and
            `3`. Requests that specify an invalid value are rejected. Any
            operation that affects conditional role bindings must specify
            version `3`. This requirement applies to the following operations: *
            Getting a policy that includes a conditional role binding * Adding a
            conditional role binding to a policy * Changing a conditional role
            binding in a policy * Removing any role binding, with or without a
            condition, from a policy that includes conditions **Important:** If
            you use IAM Conditions, you must include the `etag` field whenever
            you call `setIamPolicy`. If you omit this field, then IAM allows you
            to overwrite a version `3` policy with a version `1` policy, and all
            of the conditions in the version `3` policy are lost. If a policy
            does not include any conditions, operations on that policy may
            specify any valid version or leave the field unset. To learn which
            resources support conditions in their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
          format: int32
          type: integer
      type: object
    RunInvestigationRevisionRequest:
      deprecated: true
      description: >-
        Deprecated: This message is only used in the deprecated
        RunInvestigationRevision method. Request for running an investigation at
        a particular revision.
      id: RunInvestigationRevisionRequest
      properties:
        runParameters:
          $ref: '#/components/schemas/InvestigationRunParameters'
          description: Optional. Parameters to pass through.
      type: object
    SetIamPolicyRequest:
      description: Request message for `SetIamPolicy` method.
      id: SetIamPolicyRequest
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
          description: >-
            REQUIRED: The complete policy to be applied to the `resource`. The
            size of the policy is limited to a few 10s of KB. An empty policy is
            a valid policy but certain Google Cloud services (such as Projects)
            might reject them.
        updateMask:
          description: >-
            OPTIONAL: A FieldMask specifying which fields of the policy to
            modify. Only the fields in the mask will be modified. If no mask is
            provided, the following default mask is used: `paths: "bindings,
            etag"`
          format: google-fieldmask
          type: string
      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      type: object
    TestIamPermissionsRequest:
      description: Request message for `TestIamPermissions` method.
      id: TestIamPermissionsRequest
      properties:
        permissions:
          description: >-
            The set of permissions to check for the `resource`. Permissions with
            wildcards (such as `*` or `storage.*`) are not allowed. For more
            information see [IAM
            Overview](https://cloud.google.com/iam/docs/overview#permissions).
          items:
            type: string
          type: array
      type: object
    TestIamPermissionsResponse:
      description: Response message for `TestIamPermissions` method.
      id: TestIamPermissionsResponse
      properties:
        permissions:
          description: >-
            A subset of `TestPermissionsRequest.permissions` that the caller is
            allowed.
          items:
            type: string
          type: array
      type: object
