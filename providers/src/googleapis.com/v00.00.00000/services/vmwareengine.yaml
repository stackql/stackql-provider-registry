            - NSXT_MGR
            - HCX
            - VSAN
            - DVS
            - NAMESERVER_VM
            - KMS_VM
            - WITNESS_VM
            - NSXT
            - CLUSTER
            - VM_TOOLS
          enumDescriptions:
            - The default value. This value should never be used.
