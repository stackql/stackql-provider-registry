            For example:
            `projects/my-project/locations/global/vmwareEngineNetworks/my-network`
          readOnly: true
          type: string
        state:
          description: Output only. State of the VMware Engine network.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
            - UPDATING
            - DELETING
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
