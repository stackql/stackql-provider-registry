            - The VMware Engine network is ready.
            - The VMware Engine network is being updated.
            - The VMware Engine network is being deleted.
          readOnly: true
          type: string
        type:
          description: Required. VMware Engine network type.
          enum:
            - TYPE_UNSPECIFIED
            - LEGACY
