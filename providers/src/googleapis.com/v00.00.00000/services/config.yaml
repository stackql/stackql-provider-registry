            field in DeleteDeploymentRequest.
          type: boolean
        deletePolicy:
          description: >-
            Optional. Policy on how resources within each deployment should be
            handled during deletion. This policy is applied globally to the
            deletion of all deployments in this group. This corresponds to the
            'delete_policy' field in DeleteDeploymentRequest.
          type: string
          enumDescriptions:
            - Unspecified policy, resources will be deleted.
            - Deletes resources actuated by the deployment.
            - >-
              Abandons resources and only deletes the deployment and its
              metadata.
          enum:
            - DELETE_POLICY_UNSPECIFIED
            - DELETE
            - ABANDON
      description: The request message for the DeprovisionDeploymentGroup method.
      type: object
    PropertyDrift:
