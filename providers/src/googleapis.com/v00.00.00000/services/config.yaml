        name:
          description: >-
            Identifier. The name of the deployment group. Format:
            'projects/{project_id}/locations/{location}/deploymentGroups/{deployment_group}'.
          type: string
        provisioningState:
          description: Output only. The provisioning state of the deployment group.
          readOnly: true
          enum:
            - PROVISIONING_STATE_UNSPECIFIED
            - PROVISIONING
            - PROVISIONED
            - FAILED_TO_PROVISION
            - DEPROVISIONING
            - DEPROVISIONED
            - FAILED_TO_DEPROVISION
          type: string
          enumDescriptions:
            - Unspecified provisioning state.
            - The deployment group is being provisioned.
            - The deployment group is provisioned.
            - The deployment group failed to be provisioned.
            - The deployment group is being deprovisioned.
            - The deployment group is deprovisioned.
            - The deployment group failed to be deprovisioned.
        labels:
          description: Optional. User-defined metadata for the deployment group.
          type: object
          additionalProperties:
            type: string
        annotations:
          description: >-
            Optional. Arbitrary key-value metadata storage e.g. to help client
            tools identify deployment group during automation. See
            https://google.aip.dev/148#annotations for details on format and
            size limitations.
          type: object
          additionalProperties:
            type: string
        provisioningStateDescription:
          readOnly: true
          description: >-
            Output only. Additional information regarding the current
            provisioning state.
          type: string
        createTime:
          description: Output only. Time when the deployment group was created.
          type: string
          format: google-datetime
          readOnly: true
        stateDescription:
          description: Output only. Additional information regarding the current state.
          type: string
          readOnly: true
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
            - UPDATING
            - DELETING
            - FAILED
            - SUSPENDED
            - DELETED
          description: Output only. Current state of the deployment group.
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - The deployment group is being created.
            - The deployment group is healthy.
            - The deployment group is being updated.
            - The deployment group is being deleted.
            - The deployment group has encountered an unexpected error.
            - >-
              The deployment group is no longer being actively reconciled. This
              may be the result of recovering the project after deletion.
            - The deployment group has been deleted.
          type: string
      id: DeploymentGroup
