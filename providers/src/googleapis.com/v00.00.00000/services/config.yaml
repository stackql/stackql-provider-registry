    DeploymentSource:
      description: Configuration for a value sourced from a Deployment.
      type: object
      properties:
        deployment:
          description: >-
            Required. The resource name of the source Deployment to import the
            output from. Format:
            projects/{project}/locations/{location}/deployments/{deployment} The
            source deployment must be in the same project and location.
