          type: string
        endTime:
          readOnly: true
          description: Output only. Time when the operation finished running.
          type: string
          format: google-datetime
        previewMetadata:
          description: Output only. Metadata about the preview operation state.
          readOnly: true
          $ref: '#/components/schemas/PreviewOperationMetadata'
        apiVersion:
          readOnly: true
          description: Output only. API version used to start the operation.
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          type: string
          readOnly: true
        requestedCancellation:
          readOnly: true
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have successfully been cancelled
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
          type: boolean
        provisionDeploymentGroupMetadata:
          readOnly: true
          $ref: '#/components/schemas/ProvisionDeploymentGroupOperationMetadata'
          description: >-
            Output only. Metadata about ProvisionDeploymentGroup operation
            state.
        createTime:
          readOnly: true
          description: Output only. Time when the operation was created.
          type: string
          format: google-datetime
        deploymentMetadata:
          readOnly: true
          $ref: '#/components/schemas/DeploymentOperationMetadata'
          description: Output only. Metadata about the deployment operation state.
    PropertyChange:
      description: A property change represents a change to a property in the state file.
      type: object
      id: PropertyChange
      properties:
        beforeSensitivePaths:
          readOnly: true
          items:
            type: string
          description: >-
            Output only. The paths of sensitive fields in `before`. Paths are
            relative to `path`.
          type: array
        before:
          readOnly: true
          description: Output only. Representations of the object value before the actions.
          type: any
        afterSensitivePaths:
          readOnly: true
          items:
            type: string
          description: >-
            Output only. The paths of sensitive fields in `after`. Paths are
            relative to `path`.
          type: array
        after:
          readOnly: true
          description: Output only. Representations of the object value after the actions.
          type: any
        path:
          readOnly: true
          description: Output only. The path of the property change.
          type: string
    Location:
      description: A resource that represents a Google Cloud location.
      type: object
      id: Location
      properties:
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
          additionalProperties:
            type: string
    Revision:
      description: >-
        A child resource of a Deployment generated by a 'CreateDeployment' or
        'UpdateDeployment' call. Each Revision contains metadata pertaining to a
        snapshot of a particular Deployment.
      type: object
      properties:
        tfVersionConstraint:
          readOnly: true
          description: >-
            Output only. The user-specified Terraform version constraint.
            Example: "=1.3.10".
          type: string
        serviceAccount:
          readOnly: true
          description: >-
            Output only. User-specified Service Account (SA) to be used as
            credential to manage resources. Format:
            `projects/{projectID}/serviceAccounts/{serviceAccount}`
          type: string
        applyResults:
          description: Output only. Outputs and artifacts from applying a deployment.
          readOnly: true
          $ref: '#/components/schemas/ApplyResults'
        errorLogs:
          description: >-
            Output only. Location of Terraform error logs in Google Cloud
            Storage. Format: `gs://{bucket}/{object}`.
          type: string
          readOnly: true
        tfVersion:
          description: >-
            Output only. The version of Terraform used to create the Revision.
            It is in the format of "Major.Minor.Patch", for example, "1.3.10".
          type: string
          readOnly: true
        stateDetail:
          description: Output only. Additional info regarding the current state.
          type: string
          readOnly: true
        providerConfig:
          description: Output only. This field specifies the provider configurations.
          readOnly: true
          $ref: '#/components/schemas/ProviderConfig'
        updateTime:
          readOnly: true
          description: Output only. Time when the revision was last modified.
          type: string
          format: google-datetime
        action:
          type: string
          enumDescriptions:
            - The default value. This value is used if the action is omitted.
            - The revision was generated by creating a deployment.
            - The revision was generated by updating a deployment.
            - The revision was deleted.
          description: Output only. The action which created this revision
          readOnly: true
          enum:
            - ACTION_UNSPECIFIED
            - CREATE
            - UPDATE
            - DELETE
        errorCode:
          readOnly: true
          enum:
            - ERROR_CODE_UNSPECIFIED
            - CLOUD_BUILD_PERMISSION_DENIED
            - APPLY_BUILD_API_FAILED
            - APPLY_BUILD_RUN_FAILED
            - QUOTA_VALIDATION_FAILED
            - EXTERNAL_VALUE_SOURCE_IMPORT_FAILED
          description: Output only. Code describing any errors that may have occurred.
          type: string
          enumDescriptions:
            - No error code was specified.
            - Cloud Build failed due to a permission issue.
            - >-
              Cloud Build job associated with creating or updating a deployment
              could not be started.
            - >-
              Cloud Build job associated with creating or updating a deployment
              was started but failed.
            - >-
              quota validation failed for one or more resources in terraform
              configuration files.
            - Failed to import values from an external source.
        workerPool:
          readOnly: true
          description: >-
            Output only. The user-specified Cloud Build worker pool resource in
            which the Cloud Build job will execute. Format:
            `projects/{project}/locations/{location}/workerPools/{workerPoolId}`.
            If this field is unspecified, the default Cloud Build worker pool
            will be used.
          type: string
        importExistingResources:
          description: >-
            Output only. By default, Infra Manager will return a failure when
            Terraform encounters a 409 code (resource conflict error) during
            actuation. If this flag is set to true, Infra Manager will instead
            attempt to automatically import the resource into the Terraform
            state (for supported resource types) and continue actuation. Not all
            resource types are supported, refer to documentation.
          type: boolean
          readOnly: true
        terraformBlueprint:
          readOnly: true
          $ref: '#/components/schemas/TerraformBlueprint'
          description: >-
            Output only. A blueprint described using Terraform's HashiCorp
            Configuration Language as a root module.
        tfErrors:
          description: >-
            Output only. Errors encountered when creating or updating this
            deployment. Errors are truncated to 10 entries, see `delete_results`
            and `error_logs` for full details.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/TerraformError'
        build:
          description: >-
            Output only. Cloud Build instance UUID associated with this
            revision.
          type: string
          readOnly: true
        createTime:
          readOnly: true
          description: Output only. Time when the revision was created.
          type: string
          format: google-datetime
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - APPLYING
            - APPLIED
            - FAILED
          description: Output only. Current state of the revision.
          type: string
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - The revision is being applied.
            - The revision was applied successfully.
            - The revision could not be applied successfully.
        quotaValidation:
          description: >-
            Optional. Input to control quota checks for resources in terraform
            configuration files. There are limited resources on which quota
            validation applies.
          type: string
          enumDescriptions:
            - >-
              The default value. QuotaValidation on terraform configuration
              files will be disabled in this case.
            - >-
              Enable computing quotas for resources in terraform configuration
              files to get visibility on resources with insufficient quotas.
            - >-
              Enforce quota checks so deployment fails if there isn't sufficient
              quotas available to deploy resources in terraform configuration
              files.
          enum:
            - QUOTA_VALIDATION_UNSPECIFIED
            - ENABLED
            - ENFORCED
        quotaValidationResults:
          readOnly: true
          description: >-
            Output only. Cloud Storage path containing quota validation results.
            This field is set when a user sets Deployment.quota_validation field
            to ENABLED or ENFORCED. Format: `gs://{bucket}/{object}`.
          type: string
        logs:
          description: >-
            Output only. Location of Revision operation logs in
            `gs://{bucket}/{object}` format.
          type: string
          readOnly: true
        name:
          description: >-
            Revision name. Format:
            `projects/{project}/locations/{location}/deployments/{deployment}/
            revisions/{revision}`
          type: string
      id: Revision
