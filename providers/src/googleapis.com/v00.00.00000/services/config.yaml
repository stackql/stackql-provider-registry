          additionalProperties:
            type: string
        tfVersionConstraint:
          description: 'The user-specified Terraform version constraint. Example: "=1.3.10".'
          type: string
        deleteBuild:
          readOnly: true
          description: >-
            Output only. Cloud Build instance UUID associated with deleting this
            deployment.
          type: string
        providerConfig:
          description: Optional. This field specifies the provider configurations.
          $ref: '#/components/schemas/ProviderConfig'
        stateDetail:
          readOnly: true
          description: Output only. Additional information regarding the current state.
          type: string
        lockState:
          enumDescriptions:
            - >-
              The default value. This value is used if the lock state is
              omitted.
            - The deployment is locked.
            - The deployment is unlocked.
            - The deployment is being locked.
            - The deployment is being unlocked.
            - The deployment has failed to lock.
            - The deployment has failed to unlock.
          type: string
          description: Output only. Current lock state of the deployment.
          readOnly: true
          enum:
            - LOCK_STATE_UNSPECIFIED
            - LOCKED
            - UNLOCKED
            - LOCKING
            - UNLOCKING
            - LOCK_FAILED
            - UNLOCK_FAILED
        artifactsGcsBucket:
          description: >-
            User-defined location of Cloud Build logs and artifacts in Google
            Cloud Storage. Format: `gs://{bucket}/{folder}` A default bucket
            will be bootstrapped if the field is not set or empty. Default
            bucket format: `gs://--blueprint-config` Constraints: - The bucket
            needs to be in the same project as the deployment - The path cannot
            be within the path of `gcs_source` - The field cannot be updated,
            including changing its presence
          type: string
        deleteResults:
          readOnly: true
          $ref: '#/components/schemas/ApplyResults'
          description: >-
            Output only. Location of artifacts from a DeleteDeployment
            operation.
        name:
          description: >-
            Identifier. Resource name of the deployment. Format:
            `projects/{project}/locations/{location}/deployments/{deployment}`
          type: string
        tfErrors:
          readOnly: true
          items:
            $ref: '#/components/schemas/TerraformError'
          description: >-
            Output only. Errors encountered when deleting this deployment.
            Errors are truncated to 10 entries, see `delete_results` and
            `error_logs` for full details.
          type: array
        terraformBlueprint:
          description: >-
            A blueprint described using Terraform's HashiCorp Configuration
            Language as a root module.
          $ref: '#/components/schemas/TerraformBlueprint'
        state:
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - The deployment is being created.
            - The deployment is healthy.
            - The deployment is being updated.
            - The deployment is being deleted.
            - The deployment has encountered an unexpected error.
            - >-
              The deployment is no longer being actively reconciled. This may be
              the result of recovering the project after deletion.
            - The deployment has been deleted.
          type: string
          description: Output only. Current state of the deployment.
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
            - UPDATING
            - DELETING
            - FAILED
            - SUSPENDED
            - DELETED
        quotaValidation:
          enum:
            - QUOTA_VALIDATION_UNSPECIFIED
            - ENABLED
            - ENFORCED
          enumDescriptions:
            - >-
              The default value. QuotaValidation on terraform configuration
              files will be disabled in this case.
            - >-
              Enable computing quotas for resources in terraform configuration
              files to get visibility on resources with insufficient quotas.
            - >-
              Enforce quota checks so deployment fails if there isn't sufficient
              quotas available to deploy resources in terraform configuration
              files.
          description: >-
            Optional. Input to control quota checks for resources in terraform
            configuration files. There are limited resources on which quota
            validation applies.
          type: string
        createTime:
          description: Output only. Time when the deployment was created.
          type: string
          format: google-datetime
          readOnly: true
        deleteLogs:
          readOnly: true
          description: >-
            Output only. Location of Cloud Build logs in Google Cloud Storage,
            populated when deleting this deployment. Format:
            `gs://{bucket}/{object}`.
          type: string
      id: Deployment
      description: >-
        A Deployment is a group of resources and configs managed and provisioned
        by Infra Manager.
      type: object
    ResourceChange:
      description: A resource change represents a change to a resource in the state file.
      type: object
      id: ResourceChange
      properties:
        intent:
          readOnly: true
          enum:
            - INTENT_UNSPECIFIED
            - CREATE
            - UPDATE
            - DELETE
            - RECREATE
            - UNCHANGED
          description: Output only. The intent of the resource change.
          enumDescriptions:
            - The default value.
            - The resource will be created.
            - The resource will be updated.
            - The resource will be deleted.
            - The resource will be recreated.
            - The resource will be untouched.
          type: string
        name:
          description: >-
            Identifier. The name of the resource change. Format:
            'projects/{project_id}/locations/{location}/previews/{preview}/resourceChanges/{resource_change}'.
          type: string
        propertyChanges:
          description: Output only. The property changes of the resource change.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/PropertyChange'
        terraformInfo:
          description: Output only. Terraform info of the resource change.
          readOnly: true
          $ref: '#/components/schemas/ResourceChangeTerraformInfo'
    DeploymentSpec:
      description: Spec for a deployment to be created.
      type: object
      id: DeploymentSpec
      properties:
        deploymentId:
          description: >-
            Required. The id of the deployment to be created which doesn't
            include the project id and location.
          type: string
        deployment:
          description: Required. The deployment to be created.
          $ref: '#/components/schemas/Deployment'
