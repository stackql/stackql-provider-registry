openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Infrastructure Manager API
  description: Creates and manages Google Cloud Platform resources and infrastructure.
  version: v1
  x-discovery-doc-revision: '20260716'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/infrastructure-manager/docs
servers:
  - url: https://config.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    PreviewResult:
      properties:
        binarySignedUri:
          description: Output only. Plan binary signed URL
          type: string
          readOnly: true
        jsonSignedUri:
          readOnly: true
          description: Output only. Plan JSON signed URL
          type: string
      id: PreviewResult
      description: Contains a signed Cloud Storage URLs.
      type: object
    ListDeploymentsResponse:
      type: object
      id: ListDeploymentsResponse
      properties:
        nextPageToken:
          description: >-
            Token to be supplied to the next ListDeployments request via
            `page_token` to obtain the next set of results.
          type: string
        unreachable:
          description: Locations that could not be reached.
          type: array
          items:
            type: string
        deployments:
          description: List of Deployments.
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      type: object
      id: ListOperationsResponse
      properties:
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        nextPageToken:
          description: The standard List next-page token.
          type: string
        unreachable:
          items:
            type: string
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          type: array
    ResourceCAIInfo:
      description: CAI info of a Resource.
      type: object
      properties:
        fullResourceName:
          description: >-
            CAI resource name in the format following
            https://cloud.google.com/apis/design/resource_names#full_resource_name
          type: string
      id: ResourceCAIInfo
    TerraformOutput:
      properties:
        sensitive:
          description: >-
            Identifies whether Terraform has set this output as a potential
            sensitive value.
          type: boolean
        value:
          description: Value of output.
          type: any
      id: TerraformOutput
      description: Describes a Terraform output.
      type: object
    Preview:
      description: >-
        A preview represents a set of actions Infra Manager would perform to
        move the resources towards the desired state as specified in the
        configuration.
      type: object
      properties:
        errorStatus:
          description: Output only. Additional information regarding the current state.
          readOnly: true
          $ref: '#/components/schemas/Status'
        previewMode:
          enumDescriptions:
            - Unspecified policy, default mode will be used.
            - >-
              DEFAULT mode generates an execution plan for reconciling current
              resource state into expected resource state.
            - >-
              DELETE mode generates as execution plan for destroying current
              resources.
          description: Optional. Current mode of preview.
          type: string
          enum:
            - PREVIEW_MODE_UNSPECIFIED
            - DEFAULT
            - DELETE
        labels:
          description: Optional. User-defined labels for the preview.
          type: object
          additionalProperties:
            type: string
        deployment:
          description: >-
            Optional. Optional deployment reference. If specified, the preview
            will be performed using the provided deployment's current state and
            use any relevant fields from the deployment unless explicitly
            specified in the preview create request.
          type: string
        workerPool:
          description: >-
            The user-specified Worker Pool resource in which the Cloud Build job
            will execute. Format
            projects/{project}/locations/{location}/workerPools/{workerPoolId}
            If this field is unspecified, the default Cloud Build worker pool
            will be used. If omitted and deployment resource ref provided has
            worker_pool defined, that worker pool is used.
          type: string
        errorCode:
          enumDescriptions:
            - No error code was specified.
            - Cloud Build failed due to a permissions issue.
            - Cloud Storage bucket failed to create due to a permissions issue.
            - Cloud Storage bucket failed for a non-permissions-related issue.
            - Acquiring lock on provided deployment reference failed.
            - >-
              Preview encountered an error when trying to access Cloud Build
              API.
            - Preview created a build but build failed and logs were generated.
            - Failed to import values from an external source.
          type: string
          description: Output only. Code describing any errors that may have occurred.
          readOnly: true
          enum:
            - ERROR_CODE_UNSPECIFIED
            - CLOUD_BUILD_PERMISSION_DENIED
            - BUCKET_CREATION_PERMISSION_DENIED
            - BUCKET_CREATION_FAILED
            - DEPLOYMENT_LOCK_ACQUIRE_FAILED
            - PREVIEW_BUILD_API_FAILED
            - PREVIEW_BUILD_RUN_FAILED
            - EXTERNAL_VALUE_SOURCE_IMPORT_FAILED
        errorLogs:
          description: >-
            Output only. Link to tf-error.ndjson file, which contains the full
            list of the errors encountered during a Terraform preview. Format:
            `gs://{bucket}/{object}`.
          type: string
          readOnly: true
        tfVersion:
          readOnly: true
          description: >-
            Output only. The current Terraform version set on the preview. It is
            in the format of "Major.Minor.Patch", for example, "1.3.10".
          type: string
        annotations:
          description: >-
            Optional. Arbitrary key-value metadata storage e.g. to help client
            tools identify preview during automation. See
            https://google.aip.dev/148#annotations for details on format and
            size limitations.
          type: object
          additionalProperties:
            type: string
        serviceAccount:
          description: >-
            Required. User-specified Service Account (SA) credentials to be used
            when previewing resources. Format:
            `projects/{projectID}/serviceAccounts/{serviceAccount}`
          type: string
        tfVersionConstraint:
          description: 'The user-specified Terraform version constraint. Example: "=1.3.10".'
          type: string
        providerConfig:
          description: Optional. This field specifies the provider configurations.
          $ref: '#/components/schemas/ProviderConfig'
        logs:
          readOnly: true
          description: >-
            Output only. Location of preview logs in `gs://{bucket}/{object}`
            format.
          type: string
        artifactsGcsBucket:
          description: >-
            User-defined location of Cloud Build logs, artifacts, and in Google
            Cloud Storage. Format: `gs://{bucket}/{folder}` A default bucket
            will be bootstrapped if the field is not set or empty Default Bucket
            Format: `gs://--blueprint-config` Constraints: - The bucket needs to
            be in the same project as the deployment - The path cannot be within
            the path of `gcs_source` If omitted and deployment resource ref
            provided has artifacts_gcs_bucket defined, that artifact bucket is
            used.
          type: string
        name:
          description: >-
            Identifier. Resource name of the preview. Resource name can be user
            provided or server generated ID if unspecified. Format:
            `projects/{project}/locations/{location}/previews/{preview}`
          type: string
        previewArtifacts:
          description: Output only. Artifacts from preview.
          readOnly: true
          $ref: '#/components/schemas/PreviewArtifacts'
        tfErrors:
          readOnly: true
          items:
            $ref: '#/components/schemas/TerraformError'
          description: >-
            Output only. Summary of errors encountered during Terraform preview.
            It has a size limit of 10, i.e. only top 10 errors will be
            summarized here.
          type: array
        terraformBlueprint:
          description: The terraform blueprint to preview.
          $ref: '#/components/schemas/TerraformBlueprint'
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - SUCCEEDED
            - APPLYING
            - STALE
            - DELETING
            - FAILED
            - DELETED
          description: Output only. Current state of the preview.
          enumDescriptions:
            - The default value. This value is used if the state is unknown.
            - The preview is being created.
            - The preview has succeeded.
            - The preview is being applied.
            - >-
              The preview is stale. A preview can become stale if a revision has
              been applied after this preview was created.
            - The preview is being deleted.
            - The preview has encountered an unexpected error.
            - The preview has been deleted.
          type: string
        createTime:
          readOnly: true
          description: Output only. Time the preview was created.
          type: string
          format: google-datetime
        build:
          readOnly: true
          description: Output only. Cloud Build instance UUID associated with this preview.
          type: string
      id: Preview
    Policy:
      properties:
        auditConfigs:
          description: Specifies cloud audit logging configuration for this policy.
          type: array
          items:
            $ref: '#/components/schemas/AuditConfig'
        etag:
          description: >-
            `etag` is used for optimistic concurrency control as a way to help
            prevent simultaneous updates of a policy from overwriting each
            other. It is strongly suggested that systems make use of the `etag`
            in the read-modify-write cycle to perform policy updates in order to
            avoid race conditions: An `etag` is returned in the response to
            `getIamPolicy`, and systems are expected to put that etag in the
            request to `setIamPolicy` to ensure that their change will be
            applied to the same version of the policy. **Important:** If you use
            IAM Conditions, you must include the `etag` field whenever you call
            `setIamPolicy`. If you omit this field, then IAM allows you to
            overwrite a version `3` policy with a version `1` policy, and all of
            the conditions in the version `3` policy are lost.
          type: string
          format: byte
        version:
          description: >-
            Specifies the format of the policy. Valid values are `0`, `1`, and
            `3`. Requests that specify an invalid value are rejected. Any
            operation that affects conditional role bindings must specify
            version `3`. This requirement applies to the following operations: *
            Getting a policy that includes a conditional role binding * Adding a
            conditional role binding to a policy * Changing a conditional role
            binding in a policy * Removing any role binding, with or without a
            condition, from a policy that includes conditions **Important:** If
            you use IAM Conditions, you must include the `etag` field whenever
            you call `setIamPolicy`. If you omit this field, then IAM allows you
            to overwrite a version `3` policy with a version `1` policy, and all
            of the conditions in the version `3` policy are lost. If a policy
            does not include any conditions, operations on that policy may
            specify any valid version or leave the field unset. To learn which
            resources support conditions in their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
          type: integer
          format: int32
        bindings:
          description: >-
            Associates a list of `members`, or principals, with a `role`.
            Optionally, may specify a `condition` that determines how and when
            the `bindings` are applied. Each of the `bindings` must contain at
            least one principal. The `bindings` in a `Policy` can refer to up to
            1,500 principals; up to 250 of these principals can be Google
            groups. Each occurrence of a principal counts towards these limits.
            For example, if the `bindings` grant 50 different roles to
            `user:alice@example.com`, and not to any other principal, then you
            can add another 1,450 principals to the `bindings` in the `Policy`.
          type: array
          items:
            $ref: '#/components/schemas/Binding'
      id: Policy
      description: >-
        An Identity and Access Management (IAM) policy, which specifies access
        controls for Google Cloud resources. A `Policy` is a collection of
        `bindings`. A `binding` binds one or more `members`, or principals, to a
        single `role`. Principals can be user accounts, service accounts, Google
        groups, and domains (such as G Suite). A `role` is a named list of
        permissions; each `role` can be an IAM predefined role or a user-created
        custom role. For some types of Google Cloud resources, a `binding` can
        also specify a `condition`, which is a logical expression that allows
        access to a resource only if the expression evaluates to `true`. A
        condition can add constraints based on attributes of the request, the
        resource, or both. To learn which resources support conditions in their
        IAM policies, see the [IAM
        documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
        **JSON example:** ``` { "bindings": [ { "role":
        "roles/resourcemanager.organizationAdmin", "members": [
        "user:mike@example.com", "group:admins@example.com",
        "domain:google.com",
        "serviceAccount:my-project-id@appspot.gserviceaccount.com" ] }, {
        "role": "roles/resourcemanager.organizationViewer", "members": [
        "user:eve@example.com" ], "condition": { "title": "expirable access",
        "description": "Does not grant access after Sep 2020", "expression":
        "request.time < timestamp('2020-10-01T00:00:00.000Z')", } } ], "etag":
        "BwWWja0YfJA=", "version": 3 } ``` **YAML example:** ``` bindings: -
        members: - user:mike@example.com - group:admins@example.com -
        domain:google.com -
        serviceAccount:my-project-id@appspot.gserviceaccount.com role:
        roles/resourcemanager.organizationAdmin - members: -
        user:eve@example.com role: roles/resourcemanager.organizationViewer
        condition: title: expirable access description: Does not grant access
        after Sep 2020 expression: request.time <
        timestamp('2020-10-01T00:00:00.000Z') etag: BwWWja0YfJA= version: 3 ```
        For a description of IAM and its features, see the [IAM
        documentation](https://cloud.google.com/iam/docs/).
      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      type: object
      id: Status
      properties:
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          type: array
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          type: integer
          format: int32
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
    DeploymentUnit:
      description: >-
        A DeploymentUnit is a container for a deployment and its dependencies.
        An existing deployment can be provided directly in the unit, or the unit
        can act as a placeholder to define the DAG, with the deployment specs
        supplied in a `provisionDeploymentRequest`.
      type: object
      properties:
        dependencies:
          description: >-
            Required. The IDs of the deployment units within the deployment
            group that this unit depends on.
          type: array
          items:
            type: string
        id:
          description: >-
            The id of the deployment unit. Must be unique within the deployment
            group.
          type: string
        deployment:
          description: >-
            Optional. The name of the deployment to be provisioned. Format:
            'projects/{project_id}/locations/{location}/deployments/{deployment}'.
          type: string
      id: DeploymentUnit
    LockInfo:
      description: Details about the lock which locked the deployment.
      type: object
      properties:
        info:
          description: Extra information to store with the lock, provided by the caller.
          type: string
        createTime:
          description: Time that the lock was taken.
          type: string
          format: google-datetime
        lockId:
          description: >-
            Unique ID for the lock to be overridden with generation ID in the
            backend.
          type: string
          format: int64
        operation:
          description: Terraform operation, provided by the caller.
          type: string
        version:
          description: Terraform version
          type: string
        who:
          description: user@hostname when available
          type: string
      id: LockInfo
    ResourceDriftTerraformInfo:
      description: Terraform info of a ResourceChange.
      type: object
      properties:
        resourceName:
          readOnly: true
          description: Output only. TF resource name.
          type: string
        address:
          description: Output only. The address of the drifted resource.
          type: string
          readOnly: true
        provider:
          readOnly: true
          description: Output only. The provider of the drifted resource.
          type: string
        type:
          description: Output only. The type of the drifted resource.
          type: string
          readOnly: true
      id: ResourceDriftTerraformInfo
    Statefile:
      description: Contains info about a Terraform state file
      type: object
      properties:
        signedUri:
          readOnly: true
          description: >-
            Output only. Cloud Storage signed URI used for downloading or
            uploading the state file.
          type: string
      id: Statefile
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      type: object
      properties: {}
      id: CancelOperationRequest
    TerraformVersion:
      properties:
        state:
          type: string
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - The version is actively supported.
            - The version is deprecated.
            - The version is obsolete.
          description: >-
            Output only. The state of the version, ACTIVE, DEPRECATED or
            OBSOLETE.
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - DEPRECATED
            - OBSOLETE
        name:
          description: >-
            Identifier. The version name is in the format:
            'projects/{project_id}/locations/{location}/terraformVersions/{terraform_version}'.
          type: string
        deprecateTime:
          readOnly: true
          description: Output only. When the version is deprecated.
          type: string
          format: google-datetime
        supportTime:
          readOnly: true
          description: Output only. When the version is supported.
          type: string
          format: google-datetime
        obsoleteTime:
          description: Output only. When the version is obsolete.
          type: string
          format: google-datetime
          readOnly: true
      id: TerraformVersion
      description: >-
        A TerraformVersion represents the support state the corresponding
        Terraform version.
      type: object
    ProvisionDeploymentGroupRequest:
      description: The request message for the ProvisionDeploymentGroup method.
      type: object
      id: ProvisionDeploymentGroupRequest
      properties:
        deploymentSpecs:
          description: >-
            Optional. The deployment specs of the deployment units to be created
            within the same project and location of the deployment group. The
            key is the unit ID, and the value is the `DeploymentSpec`.
            Provisioning will fail if a `deployment_spec` has a `deployment_id`
            that matches an existing deployment in the same project and
            location. If an existing deployment was part of the last successful
            revision but is no longer in the current DeploymentGroup's
            `deployment_units`, it will be recreated if included in
            `deployment_specs`.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DeploymentSpec'
    AuditLogConfig:
      description: >-
        Provides the configuration for logging a type of permissions. Example: {
        "audit_log_configs": [ { "log_type": "DATA_READ", "exempted_members": [
        "user:jose@example.com" ] }, { "log_type": "DATA_WRITE" } ] } This
        enables 'DATA_READ' and 'DATA_WRITE' logging, while exempting
        jose@example.com from DATA_READ logging.
      type: object
      id: AuditLogConfig
      properties:
        exemptedMembers:
          items:
            type: string
          description: >-
            Specifies the identities that do not cause logging for this type of
            permission. Follows the same format of Binding.members.
          type: array
        logType:
          description: The log type that this config enables.
          type: string
          enumDescriptions:
            - Default case. Should never be this.
            - 'Admin reads. Example: CloudIAM getIamPolicy'
            - 'Data writes. Example: CloudSQL Users create'
            - 'Data reads. Example: CloudSQL Users list'
          enum:
            - LOG_TYPE_UNSPECIFIED
            - ADMIN_READ
            - DATA_WRITE
            - DATA_READ
    DeploymentUnitProgress:
      description: The progress of a deployment unit provisioning or deprovisioning.
      type: object
      id: DeploymentUnitProgress
      properties:
        unitId:
          description: Output only. The unit id of the deployment unit to be provisioned.
          type: string
          readOnly: true
        error:
          readOnly: true
          $ref: '#/components/schemas/Status'
          description: >-
            Output only. Holds the error status of the deployment unit
            provisioning.
        deployment:
          description: >-
            Output only. The name of the deployment to be provisioned. Format:
            'projects/{project}/locations/{location}/deployments/{deployment}'.
          type: string
          readOnly: true
        stateDescription:
          description: Output only. Additional information regarding the current state.
          type: string
          readOnly: true
        intent:
          readOnly: true
          enum:
            - INTENT_UNSPECIFIED
            - CREATE_DEPLOYMENT
            - UPDATE_DEPLOYMENT
            - DELETE_DEPLOYMENT
            - RECREATE_DEPLOYMENT
            - CLEAN_UP
            - UNCHANGED
          description: Output only. The intent of the deployment unit.
          type: string
          enumDescriptions:
            - Unspecified intent.
            - Create deployment in the unit from the deployment spec.
            - Update deployment in the unit.
            - Delete deployment in the unit.
            - Recreate deployment in the unit.
            - >-
              Delete deployment in latest successful revision while no longer
              referenced in any deployment unit in the current deployment group.
            - Expected to be unchanged.
        state:
          description: Output only. The current step of the deployment unit provisioning.
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - QUEUED
            - APPLYING_DEPLOYMENT
            - SUCCEEDED
            - FAILED
            - ABORTED
            - SKIPPED
            - DELETING_DEPLOYMENT
            - PREVIEWING_DEPLOYMENT
          enumDescriptions:
            - The default value. This value is unused.
            - The deployment unit is queued for deployment creation or update.
            - The underlying deployment of the unit is being created or updated.
            - The underlying deployment operation of the unit has succeeded.
            - The underlying deployment operation of the unit has failed.
            - >-
              The deployment unit was aborted, likely due to failures in other
              dependent deployment units.
            - >-
              The deployment unit was skipped because there were no changes to
              apply.
            - The deployment is being deleted.
            - The deployment is being previewed.
          type: string
        deploymentOperationSummary:
          readOnly: true
          $ref: '#/components/schemas/DeploymentOperationSummary'
          description: Output only. The summary of the deployment operation.
    DeleteStatefileRequest:
      id: DeleteStatefileRequest
      properties:
        lockId:
          description: >-
            Required. Lock ID of the lock file to verify that the user who is
            deleting the state file previously locked the Deployment.
          type: string
          format: int64
      description: A request to delete a state file passed to a 'DeleteStatefile' call.
      type: object
    PreviewArtifacts:
      id: PreviewArtifacts
      properties:
        artifacts:
          description: >-
            Output only. Location of artifacts in Google Cloud Storage. Format:
            `gs://{bucket}/{object}`
          type: string
          readOnly: true
        content:
          description: >-
            Output only. Location of a blueprint copy and other content in
            Google Cloud Storage. Format: `gs://{bucket}/{object}`
          type: string
          readOnly: true
      description: Artifacts created by preview.
      type: object
    TerraformError:
      properties:
        httpResponseCode:
          description: >-
            HTTP response code returned from Google Cloud Platform APIs when
            Terraform fails to provision the resource. If unset or 0, no HTTP
            response code was returned by Terraform.
          type: integer
          format: int32
        error:
          readOnly: true
          $ref: '#/components/schemas/Status'
          description: >-
            Output only. Original error response from underlying Google API, if
            available.
        resourceAddress:
          description: >-
            Address of the resource associated with the error, e.g.
            `google_compute_network.vpc_network`.
          type: string
        errorDescription:
          description: A human-readable error description.
          type: string
      id: TerraformError
      description: Errors encountered during actuation using Terraform
      type: object
    Binding:
      description: Associates `members`, or principals, with a `role`.
      type: object
      id: Binding
      properties:
        condition:
          description: >-
            The condition that is associated with this binding. If the condition
            evaluates to `true`, then this binding applies to the current
            request. If the condition evaluates to `false`, then this binding
            does not apply to the current request. However, a different role
            binding might grant the same role to one or more of the principals
            in this binding. To learn which resources support conditions in
            their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
          $ref: '#/components/schemas/Expr'
        role:
          description: >-
            Role that is assigned to the list of `members`, or principals. For
            example, `roles/viewer`, `roles/editor`, or `roles/owner`. For an
            overview of the IAM roles and permissions, see the [IAM
            documentation](https://cloud.google.com/iam/docs/roles-overview).
            For a list of the available pre-defined roles, see
            [here](https://cloud.google.com/iam/docs/understanding-roles).
          type: string
        members:
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. `members` can have the following values: * `allUsers`: A
            special identifier that represents anyone who is on the internet;
            with or without a Google account. * `allAuthenticatedUsers`: A
            special identifier that represents anyone who is authenticated with
            a Google account or a service account. Does not include identities
            that come from external identity providers (IdPs) through identity
            federation. * `user:{emailid}`: An email address that represents a
            specific Google account. For example, `alice@example.com` . *
            `serviceAccount:{emailid}`: An email address that represents a
            Google service account. For example,
            `my-other-app@appspot.gserviceaccount.com`. *
            `serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]`:
            An identifier for a [Kubernetes service
            account](https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example,
            `my-project.svc.id.goog[my-namespace/my-kubernetes-sa]`. *
            `group:{emailid}`: An email address that represents a Google group.
            For example, `admins@example.com`. * `domain:{domain}`: The G Suite
            domain (primary) that represents all the users of that domain. For
            example, `google.com` or `example.com`. *
            `principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workforce identity pool. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}`:
            All workforce identities in a group. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All workforce identities with a specific attribute value. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*`:
            All identities in a workforce identity pool. *
            `principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workload identity pool. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}`:
            A workload identity pool group. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All identities in a workload identity pool with a certain attribute.
            *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*`:
            All identities in a workload identity pool. *
            `deleted:user:{emailid}?uid={uniqueid}`: An email address (plus
            unique identifier) representing a user that has been recently
            deleted. For example, `alice@example.com?uid=123456789012345678901`.
            If the user is recovered, this value reverts to `user:{emailid}` and
            the recovered user retains the role in the binding. *
            `deleted:serviceAccount:{emailid}?uid={uniqueid}`: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            `my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901`.
            If the service account is undeleted, this value reverts to
            `serviceAccount:{emailid}` and the undeleted service account retains
            the role in the binding. * `deleted:group:{emailid}?uid={uniqueid}`:
            An email address (plus unique identifier) representing a Google
            group that has been recently deleted. For example,
            `admins@example.com?uid=123456789012345678901`. If the group is
            recovered, this value reverts to `group:{emailid}` and the recovered
            group retains the role in the binding. *
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            Deleted single identity in a workforce identity pool. For example,
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value`.
          type: array
          items:
            type: string
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      type: object
