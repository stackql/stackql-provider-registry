          description: Output only. The current step the deployment operation is running.
          readOnly: true
          enum:
            - DEPLOYMENT_STEP_UNSPECIFIED
            - PREPARING_STORAGE_BUCKET
            - DOWNLOADING_BLUEPRINT
            - RUNNING_TF_INIT
            - RUNNING_TF_PLAN
