            TRAIN|VALIDATION|TEST, or UNASSIGNED (by default) for auto split.
          type: string
      description: An input file.
    DetectLanguageResponse:
      id: DetectLanguageResponse
      type: object
      description: The response message for language detection.
      properties:
        languages:
          description: >-
            The most probable language detected by the Translation API. For each
            request, the Translation API will always return only one result.
          type: array
          items:
            $ref: '#/components/schemas/DetectedLanguage'
    DetectedLanguage:
      type: object
      id: DetectedLanguage
      properties:
        languageCode:
          type: string
          description: >-
            The ISO-639 language code of the source content in the request,
            detected automatically.
        confidence:
          type: number
          format: float
          description: The confidence of the detection result for this language.
      description: The response message for language detection.
    ListGlossariesResponse:
      properties:
        nextPageToken:
          type: string
          description: >-
            A token to retrieve a page of results. Pass this value in the
            [ListGlossariesRequest.page_token] field in the subsequent call to
            `ListGlossaries` method to retrieve the next page of results.
        glossaries:
          type: array
          items:
            $ref: '#/components/schemas/Glossary'
          description: The list of glossaries for a project.
      description: Response message for ListGlossaries.
      type: object
      id: ListGlossariesResponse
    RefinementEntry:
      properties:
        sourceText:
          description: Required. The source text to be refined.
          type: string
        originalTranslation:
          type: string
          description: Required. The original translation of the source text.
      description: A single refinement entry for RefineTextRequest.
      type: object
      id: RefinementEntry
    AdaptiveMtTranslation:
      id: AdaptiveMtTranslation
      type: object
      description: An AdaptiveMt translation.
      properties:
        translatedText:
          readOnly: true
          type: string
          description: Output only. The translated text.
    BatchTranslateDocumentRequest:
      type: object
      id: BatchTranslateDocumentRequest
      properties:
        inputConfigs:
          type: array
          items:
            $ref: '#/components/schemas/BatchDocumentInputConfig'
          description: >-
            Required. Input configurations. The total number of files matched
            should be <= 100. The total content size to translate should be <=
            100M Unicode codepoints. The files must use UTF-8 encoding.
        enableRotationCorrection:
          description: Optional. If true, enable auto rotation correction in DVS.
          type: boolean
        enableShadowRemovalNativePdf:
          type: boolean
          description: >-
            Optional. If true, use the text removal server to remove the shadow
            text on background image for native pdf translation. Shadow removal
            feature can only be enabled when is_translate_native_pdf_only: false
            && pdf_native_only: false
        formatConversions:
          description: >-
            Optional. The file format conversion map that is applied to all
            input files. The map key is the original mime_type. The map value is
            the target mime_type of translated documents. Supported file format
            conversion includes: - `application/pdf` to
            `application/vnd.openxmlformats-officedocument.wordprocessingml.document`
            If nothing specified, output files will be in the same format as the
            original file.
          type: object
          additionalProperties:
            type: string
        pdfNativeOnly:
          type: boolean
          description: Optional. If true, only native pdf pages will be translated.
        customizedAttribution:
          description: >-
            Optional. This flag is to support user customized attribution. If
            not provided, the default is `Machine Translated by Google`.
            Customized attribution should follow rules in
            https://cloud.google.com/translate/attribution#attribution_and_logos
          type: string
        outputConfig:
          description: >-
            Required. Output configuration. If 2 input configs match to the same
            file (that is, same input path), we don't generate output for
            duplicate inputs.
          $ref: '#/components/schemas/BatchDocumentOutputConfig'
        models:
          description: >-
            Optional. The models to use for translation. Map's key is target
            language code. Map's value is the model name. Value can be a
            built-in general model, or an AutoML Translation model. The value
            format depends on model type: - AutoML Translation models:
            `projects/{project-number-or-id}/locations/{location-id}/models/{model-id}`
            - General (built-in) models:
            `projects/{project-number-or-id}/locations/{location-id}/models/general/nmt`,
            If the map is empty or a specific model is not requested for a
            language pair, then default google model (nmt) is used.
          type: object
          additionalProperties:
            type: string
        targetLanguageCodes:
          type: array
          items:
            type: string
          description: >-
            Required. The ISO-639 language code to use for translation of the
            input document. Specify up to 10 language codes here. Supported
            language codes are listed in [Language
            Support](https://cloud.google.com/translate/docs/languages).
        glossaries:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TranslateTextGlossaryConfig'
          description: >-
            Optional. Glossaries to be applied. It's keyed by target language
            code.
        sourceLanguageCode:
          description: >-
            Required. The ISO-639 language code of the input document if known,
            for example, "en-US" or "sr-Latn". Supported language codes are
            listed in [Language
            Support](https://cloud.google.com/translate/docs/languages).
          type: string
      description: The BatchTranslateDocument request.
    TranslateTextResponse:
      properties:
        translations:
          type: array
          items:
            $ref: '#/components/schemas/Translation'
          description: >-
            Text translation responses with no glossary applied. This field has
            the same length as `contents`.
        glossaryTranslations:
          type: array
          items:
            $ref: '#/components/schemas/Translation'
          description: >-
            Text translation responses if a glossary is provided in the request.
            This can be the same as `translations` if no terms apply. This field
            has the same length as `contents`.
      type: object
      id: TranslateTextResponse
    SupportedLanguages:
      id: SupportedLanguages
      type: object
      description: The response message for discovering supported languages.
      properties:
        languages:
          description: >-
            A list of supported language responses. This list contains an entry
            for each language the Translation API supports.
          type: array
          items:
            $ref: '#/components/schemas/SupportedLanguage'
    WaitOperationRequest:
      type: object
      id: WaitOperationRequest
      properties:
        timeout:
          format: google-duration
          description: >-
            The maximum duration to wait before timing out. If left blank, the
            wait will be at most the time permitted by the underlying HTTP/RPC
            protocol. If RPC context deadline is also specified, the shorter one
            will be used.
          type: string
      description: The request message for Operations.WaitOperation.
