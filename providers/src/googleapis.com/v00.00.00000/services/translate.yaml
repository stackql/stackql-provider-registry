openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Cloud Translation API
  description: Integrates text translation into your website or application.
  version: v3
  x-discovery-doc-revision: '20260312'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/translate/docs/quickstarts
servers:
  - url: https://translation.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
            https://www.googleapis.com/auth/cloud-translation: Translate text from one language to another using Google Translate
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    AdaptiveMtTranslateResponse:
      type: object
      id: AdaptiveMtTranslateResponse
      properties:
        translations:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/AdaptiveMtTranslation'
          description: Output only. The translation.
        glossaryTranslations:
          type: array
          items:
            $ref: '#/components/schemas/AdaptiveMtTranslation'
          description: >-
            Text translation response if a glossary is provided in the request.
            This could be the same as 'translation' above if no terms apply.
        languageCode:
          readOnly: true
          type: string
          description: Output only. The translation's language code.
      description: An AdaptiveMtTranslate response.
    GcsSource:
      properties:
        inputUri:
          type: string
          description: Required. Source data URI. For example, `gs://my_bucket/my_object`.
      description: The Google Cloud Storage location for the input content.
      type: object
      id: GcsSource
    ListLocationsResponse:
      type: object
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          type: array
          items:
            $ref: '#/components/schemas/Location'
        nextPageToken:
          type: string
          description: The standard List next-page token.
      description: The response message for Locations.ListLocations.
    OutputConfig:
      id: OutputConfig
      type: object
      description: Output configuration for BatchTranslateText request.
      properties:
        gcsDestination:
          description: >-
            Google Cloud Storage destination for output content. For every
            single input file (for example, gs://a/b/c.[extension]), we generate
            at most 2 * n output files. (n is the # of target_language_codes in
            the BatchTranslateTextRequest). Output files (tsv) generated are
            compliant with RFC 4180 except that record delimiters are '\n'
            instead of '\r\n'. We don't provide any way to change record
            delimiters. While the input files are being processed, we
            write/update an index file 'index.csv' under 'output_uri_prefix'
            (for example, gs://translation-test/index.csv) The index file is
            generated/updated as new files are being translated. The format is:
            input_file,target_language_code,translations_file,errors_file,
            glossary_translations_file,glossary_errors_file input_file is one
            file we matched using gcs_source.input_uri. target_language_code is
            provided in the request. translations_file contains the
            translations. (details provided below) errors_file contains the
            errors during processing of the file. (details below). Both
            translations_file and errors_file could be empty strings if we have
            no content to output. glossary_translations_file and
            glossary_errors_file are always empty strings if the input_file is
            tsv. They could also be empty if we have no content to output. Once
            a row is present in index.csv, the input/output matching never
            changes. Callers should also expect all the content in input_file
            are processed and ready to be consumed (that is, no partial output
            file is written). Since index.csv will be keeping updated during the
            process, please make sure there is no custom retention policy
            applied on the output bucket that may avoid file updating.
            (https://cloud.google.com/storage/docs/bucket-lock#retention-policy)
            The format of translations_file (for target language code 'trg') is:
            `gs://translation_test/a_b_c_'trg'_translations.[extension]` If the
            input file extension is tsv, the output has the following columns:
            Column 1: ID of the request provided in the input, if it's not
            provided in the input, then the input row number is used (0-based).
            Column 2: source sentence. Column 3: translation without applying a
            glossary. Empty string if there is an error. Column 4 (only present
            if a glossary is provided in the request): translation after
            applying the glossary. Empty string if there is an error applying
            the glossary. Could be same string as column 3 if there is no
            glossary applied. If input file extension is a txt or html, the
            translation is directly written to the output file. If glossary is
            requested, a separate glossary_translations_file has format of
            `gs://translation_test/a_b_c_'trg'_glossary_translations.[extension]`
            The format of errors file (for target language code 'trg') is:
            `gs://translation_test/a_b_c_'trg'_errors.[extension]` If the input
            file extension is tsv, errors_file contains the following: Column 1:
            ID of the request provided in the input, if it's not provided in the
            input, then the input row number is used (0-based). Column 2: source
            sentence. Column 3: Error detail for the translation. Could be
            empty. Column 4 (only present if a glossary is provided in the
            request): Error when applying the glossary. If the input file
            extension is txt or html, glossary_error_file will be generated that
            contains error details. glossary_error_file has format of
            `gs://translation_test/a_b_c_'trg'_glossary_errors.[extension]`
          $ref: '#/components/schemas/GcsDestination'
    RefineTextResponse:
      properties:
        refinedTranslations:
          description: The refined translations obtained from the original translations.
          type: array
          items:
            type: string
      description: Response message for RefineText.
      type: object
      id: RefineTextResponse
    GlossaryInputConfig:
      properties:
        gcsSource:
          description: >-
            Required. Google Cloud Storage location of glossary data. File
            format is determined based on the filename extension. API returns
            [google.rpc.Code.INVALID_ARGUMENT] for unsupported URI-s and file
            formats. Wildcards are not allowed. This must be a single file in
            one of the following formats: For unidirectional glossaries: -
            TSV/CSV (`.tsv`/`.csv`): Two column file, tab- or comma-separated.
            The first column is source text. The second column is target text.
            No headers in this file. The first row contains data and not column
            names. - TMX (`.tmx`): TMX file with parallel data defining
            source/target term pairs. For equivalent term sets glossaries: - CSV
            (`.csv`): Multi-column CSV file defining equivalent glossary terms
            in multiple languages. See documentation for more information -
            [glossaries](https://cloud.google.com/translate/docs/advanced/glossary).
          $ref: '#/components/schemas/GcsSource'
      description: Input configuration for glossaries.
      type: object
      id: GlossaryInputConfig
    DocumentInputConfig:
      properties:
        content:
          description: Document's content represented as a stream of bytes.
          format: byte
          type: string
        gcsSource:
          description: >-
            Google Cloud Storage location. This must be a single file. For
            example: gs://example_bucket/example_file.pdf
          $ref: '#/components/schemas/GcsSource'
        mimeType:
          description: >-
            Specifies the input document's mime_type. If not specified it will
            be determined using the file extension for gcs_source provided
            files. For a file provided through bytes content the mime_type must
            be provided. Currently supported mime types are: - application/pdf -
            application/vnd.openxmlformats-officedocument.wordprocessingml.document
            -
            application/vnd.openxmlformats-officedocument.presentationml.presentation
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          type: string
      description: A document translation request input config.
      type: object
      id: DocumentInputConfig
    ListDatasetsResponse:
      type: object
      id: ListDatasetsResponse
      properties:
        nextPageToken:
          type: string
          description: >-
            A token to retrieve next page of results. Pass this token to the
            page_token field in the ListDatasetsRequest to obtain the
            corresponding page.
        datasets:
          description: The datasets read.
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
      description: Response message for ListDatasets.
    ListAdaptiveMtDatasetsResponse:
      properties:
        nextPageToken:
          type: string
          description: >-
            Optional. A token to retrieve a page of results. Pass this value in
            the [ListAdaptiveMtDatasetsRequest.page_token] field in the
            subsequent call to `ListAdaptiveMtDatasets` method to retrieve the
            next page of results.
        adaptiveMtDatasets:
          description: Output only. A list of Adaptive MT datasets.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/AdaptiveMtDataset'
      description: A list of AdaptiveMtDatasets.
      type: object
      id: ListAdaptiveMtDatasetsResponse
    BatchDocumentInputConfig:
      id: BatchDocumentInputConfig
      type: object
      description: Input configuration for BatchTranslateDocument request.
      properties:
        gcsSource:
          description: >-
            Google Cloud Storage location for the source input. This can be a
            single file (for example, `gs://translation-test/input.docx`) or a
            wildcard (for example, `gs://translation-test/*`). File mime type is
            determined based on extension. Supported mime type includes: -
            `pdf`, application/pdf - `docx`,
            application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - `pptx`,
            application/vnd.openxmlformats-officedocument.presentationml.presentation
            - `xlsx`,
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            The max file size to support for `.docx`, `.pptx` and `.xlsx` is
            100MB. The max file size to support for `.pdf` is 1GB and the max
            page limit is 1000 pages. The max file size to support for all input
            documents is 1GB.
          $ref: '#/components/schemas/GcsSource'
    Location:
      id: Location
      type: object
      description: A resource that represents a Google Cloud location.
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
        displayName:
          type: string
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
        metadata:
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        locationId:
          type: string
          description: 'The canonical id for this location. For example: `"us-east1"`.'
    ListOperationsResponse:
      id: ListOperationsResponse
      type: object
      description: The response message for Operations.ListOperations.
      properties:
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        nextPageToken:
          type: string
          description: The standard List next-page token.
        unreachable:
          type: array
          items:
            type: string
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
    DatasetInputConfig:
      properties:
        inputFiles:
          type: array
          items:
            $ref: '#/components/schemas/InputFile'
          description: Files containing the sentence pairs to be imported to the dataset.
      description: Input configuration for datasets.
      type: object
      id: DatasetInputConfig
    ListGlossaryEntriesResponse:
      description: Response message for ListGlossaryEntries
      properties:
        glossaryEntries:
          type: array
          items:
            $ref: '#/components/schemas/GlossaryEntry'
          description: Optional. The Glossary Entries
        nextPageToken:
          description: >-
            Optional. A token to retrieve a page of results. Pass this value in
            the [ListGLossaryEntriesRequest.page_token] field in the subsequent
            calls.
          type: string
      id: ListGlossaryEntriesResponse
      type: object
    CancelOperationRequest:
      id: CancelOperationRequest
      type: object
      description: The request message for Operations.CancelOperation.
      properties: {}
    TranslateTextRequest:
      type: object
      id: TranslateTextRequest
      properties:
        model:
          description: >-
            Optional. The `model` type requested for this translation. The
            format depends on model type: - AutoML Translation models:
            `projects/{project-number-or-id}/locations/{location-id}/models/{model-id}`
            - General (built-in) models:
            `projects/{project-number-or-id}/locations/{location-id}/models/general/nmt`,
            - Translation LLM models:
            `projects/{project-number-or-id}/locations/{location-id}/models/general/translation-llm`,
            For global (non-regionalized) requests, use `location-id` `global`.
            For example,
            `projects/{project-number-or-id}/locations/global/models/general/nmt`.
            If not provided, the default Google model (NMT) will be used
          type: string
        transliterationConfig:
          description: Optional. Transliteration to be applied.
          $ref: '#/components/schemas/TransliterationConfig'
        glossaryConfig:
          description: >-
            Optional. Glossary to be applied. The glossary must be within the
            same region (have the same location-id) as the model, otherwise an
            INVALID_ARGUMENT (400) error is returned.
          $ref: '#/components/schemas/TranslateTextGlossaryConfig'
        mimeType:
          type: string
          description: >-
            Optional. The format of the source text, for example, "text/html",
            "text/plain". If left blank, the MIME type defaults to "text/html".
        labels:
          description: >-
            Optional. The labels with user-defined metadata for the request.
            Label keys and values can be no longer than 63 characters (Unicode
            codepoints), can only contain lowercase letters, numeric characters,
            underscores and dashes. International characters are allowed. Label
            values are optional. Label keys must start with a letter. See
            https://cloud.google.com/translate/docs/advanced/labels for more
            information.
          type: object
          additionalProperties:
            type: string
        sourceLanguageCode:
          type: string
          description: >-
            Optional. The ISO-639 language code of the input text if known, for
            example, "en-US" or "sr-Latn". Supported language codes are listed
            in [Language
            Support](https://cloud.google.com/translate/docs/languages). If the
            source language isn't specified, the API attempts to identify the
            source language automatically and returns the source language within
            the response.
        contents:
          type: array
          items:
            type: string
          description: >-
            Required. The content of the input in string format. We recommend
            the total content be less than 30,000 codepoints. The max length of
            this field is 1024. Use BatchTranslateText for larger text.
        targetLanguageCode:
          description: >-
            Required. The ISO-639 language code to use for translation of the
            input text, set to one of the language codes listed in [Language
            Support](https://cloud.google.com/translate/docs/languages).
          type: string
      description: The request message for synchronous translation.
    Translation:
      description: A single translation response.
      properties:
        translatedText:
          type: string
          description: >-
            Text translated into the target language. If an error occurs during
            translation, this field might be excluded from the response.
        detectedLanguageCode:
          description: >-
            The ISO-639 language code of source text in the initial request,
            detected automatically, if no source language was passed within the
            initial request. If the source language was passed, auto-detection
            of the language does not occur and this field is empty.
          type: string
        glossaryConfig:
          description: The `glossary_config` used for this translation.
          $ref: '#/components/schemas/TranslateTextGlossaryConfig'
        model:
          description: >-
            Only present when `model` is present in the request. `model` here is
            normalized to have project number. For example: If the `model`
            requested in TranslationTextRequest is
            `projects/{project-id}/locations/{location-id}/models/general/nmt`
            then `model` here would be normalized to
            `projects/{project-number}/locations/{location-id}/models/general/nmt`.
          type: string
      id: Translation
      type: object
    AdaptiveMtTranslateRequest:
      description: The request for sending an AdaptiveMt translation query.
      properties:
        referenceSentenceConfig:
          description: Configuration for caller provided reference sentences.
          $ref: '#/components/schemas/ReferenceSentenceConfig'
        glossaryConfig:
          description: >-
            Optional. Glossary to be applied. The glossary must be within the
            same region (have the same location-id) as the model, otherwise an
            INVALID_ARGUMENT (400) error is returned.
          $ref: '#/components/schemas/GlossaryConfig'
        dataset:
          type: string
          description: >-
            Required. The resource name for the dataset to use for adaptive MT
            translation.
            `projects/{project}/locations/{location-id}/adaptiveMtDatasets/{dataset}`
        content:
          type: array
          items:
            type: string
          description: Required. The content of the input in string format.
      id: AdaptiveMtTranslateRequest
      type: object
    RomanizeTextResponse:
      id: RomanizeTextResponse
      type: object
      description: The response message for synchronous romanization.
      properties:
        romanizations:
          type: array
          items:
            $ref: '#/components/schemas/Romanization'
          description: >-
            Text romanization responses. This field has the same length as
            `contents`.
    ReferenceSentenceConfig:
      description: Message of caller-provided reference configuration.
      properties:
        sourceLanguageCode:
          description: Source language code.
          type: string
        referenceSentencePairLists:
          description: >-
            Reference sentences pair lists. Each list will be used as the
            references to translate the sentence under "content" field at the
            corresponding index. Length of the list is required to be equal to
            the length of "content" field.
          type: array
          items:
            $ref: '#/components/schemas/ReferenceSentencePairList'
        targetLanguageCode:
          description: Target language code.
          type: string
      id: ReferenceSentenceConfig
      type: object
    Dataset:
      type: object
      id: Dataset
      properties:
        trainExampleCount:
          description: Output only. Number of training examples (sentence pairs).
          format: int32
          readOnly: true
          type: integer
        name:
          type: string
          description: >-
            The resource name of the dataset, in form of
            `projects/{project-number-or-id}/locations/{location_id}/datasets/{dataset_id}`
        validateExampleCount:
          type: integer
          readOnly: true
          format: int32
          description: Output only. Number of validation examples (sentence pairs).
        updateTime:
          type: string
          readOnly: true
          format: google-datetime
          description: Output only. Timestamp when this dataset was last updated.
        testExampleCount:
          description: Output only. Number of test examples (sentence pairs).
          format: int32
          readOnly: true
          type: integer
        sourceLanguageCode:
          description: The BCP-47 language code of the source language.
          type: string
        exampleCount:
          readOnly: true
          type: integer
          description: Output only. The number of examples in the dataset.
          format: int32
        targetLanguageCode:
          description: The BCP-47 language code of the target language.
          type: string
        createTime:
          type: string
          readOnly: true
          format: google-datetime
          description: Output only. Timestamp when this dataset was created.
        displayName:
          description: >-
            The name of the dataset to show in the interface. The name can be up
            to 32 characters long and can consist only of ASCII Latin letters
            A-Z and a-z, underscores (_), and ASCII digits 0-9.
          type: string
      description: >-
        A dataset that hosts the examples (sentence pairs) used for translation
        models.
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      properties: {}
      id: Empty
      type: object
    ListAdaptiveMtFilesResponse:
      description: The response for listing all AdaptiveMt files under a given dataset.
      properties:
        nextPageToken:
          type: string
          description: >-
            Optional. A token to retrieve a page of results. Pass this value in
            the ListAdaptiveMtFilesRequest.page_token field in the subsequent
            call to `ListAdaptiveMtFiles` method to retrieve the next page of
            results.
        adaptiveMtFiles:
          description: Output only. The Adaptive MT files.
          type: array
          items:
            $ref: '#/components/schemas/AdaptiveMtFile'
          readOnly: true
      id: ListAdaptiveMtFilesResponse
      type: object
    RefineTextRequest:
      type: object
      id: RefineTextRequest
      properties:
        refinementEntries:
          type: array
          items:
            $ref: '#/components/schemas/RefinementEntry'
          description: >-
            Required. The source texts and original translations in the source
            and target languages.
        sourceLanguageCode:
          type: string
          description: >-
            Required. The BCP-47 language code of the source text in the
            request, for example, "en-US".
        targetLanguageCode:
          description: >-
            Required. The BCP-47 language code for translation output, for
            example, "zh-CN".
          type: string
      description: Request message for RefineText.
    GcsInputSource:
      id: GcsInputSource
      type: object
      description: The Google Cloud Storage location for the input content.
      properties:
        inputUri:
          description: Required. Source data URI. For example, `gs://my_bucket/my_object`.
          type: string
    AdaptiveMtSentence:
      type: object
      id: AdaptiveMtSentence
      properties:
        name:
          description: >-
            Identifier. The resource name of the file, in form of
            `projects/{project-number-or-id}/locations/{location_id}/adaptiveMtDatasets/{dataset}/adaptiveMtFiles/{file}/adaptiveMtSentences/{sentence}`
          type: string
        sourceSentence:
          type: string
          description: Required. The source sentence.
        targetSentence:
          type: string
          description: Required. The target sentence.
        createTime:
          format: google-datetime
          description: Output only. Timestamp when this sentence was created.
          type: string
          readOnly: true
        updateTime:
          type: string
          readOnly: true
          format: google-datetime
          description: Output only. Timestamp when this sentence was last updated.
      description: An AdaptiveMt sentence entry.
    GlossaryTermsSet:
      id: GlossaryTermsSet
      type: object
      description: >-
        Represents a single entry for an equivalent term set glossary. This is
        used for equivalent term sets where each term can be replaced by the
        other terms in the set.
      properties:
        terms:
          type: array
          items:
            $ref: '#/components/schemas/GlossaryTerm'
          description: >-
            Each term in the set represents a term that can be replaced by the
            other terms.
    Romanization:
      properties:
        romanizedText:
          type: string
          description: >-
            Romanized text. If an error occurs during romanization, this field
            might be excluded from the response.
        detectedLanguageCode:
          description: >-
            The ISO-639 language code of source text in the initial request,
            detected automatically, if no source language was passed within the
            initial request. If the source language was passed, auto-detection
            of the language does not occur and this field is empty.
          type: string
      description: A single romanization response.
      type: object
      id: Romanization
    ListExamplesResponse:
      type: object
      id: ListExamplesResponse
      properties:
        examples:
          type: array
          items:
            $ref: '#/components/schemas/Example'
          description: The sentence pairs.
        nextPageToken:
          description: >-
            A token to retrieve next page of results. Pass this token to the
            page_token field in the ListExamplesRequest to obtain the
            corresponding page.
          type: string
      description: Response message for ListExamples.
    Status:
      properties:
        code:
          type: integer
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      type: object
      id: Status
    ListAdaptiveMtSentencesResponse:
      properties:
        adaptiveMtSentences:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/AdaptiveMtSentence'
          description: Output only. The list of AdaptiveMtSentences.
        nextPageToken:
          description: 'Optional. '
          type: string
      description: List AdaptiveMt sentences response.
      type: object
      id: ListAdaptiveMtSentencesResponse
    TranslateDocumentRequest:
      properties:
        enableShadowRemovalNativePdf:
          type: boolean
          description: >-
            Optional. If true, use the text removal server to remove the shadow
            text on background image for native pdf translation. Shadow removal
            feature can only be enabled when is_translate_native_pdf_only: false
            && pdf_native_only: false
        isTranslateNativePdfOnly:
          type: boolean
          description: >-
            Optional. is_translate_native_pdf_only field for external customers.
            If true, the page limit of online native pdf translation is 300 and
            only native pdf pages will be translated.
        enableRotationCorrection:
          description: Optional. If true, enable auto rotation correction in DVS.
          type: boolean
        labels:
          description: >-
            Optional. The labels with user-defined metadata for the request.
            Label keys and values can be no longer than 63 characters (Unicode
            codepoints), can only contain lowercase letters, numeric characters,
            underscores and dashes. International characters are allowed. Label
            values are optional. Label keys must start with a letter. See
            https://cloud.google.com/translate/docs/advanced/labels for more
            information.
          type: object
          additionalProperties:
            type: string
        sourceLanguageCode:
          description: >-
            Optional. The ISO-639 language code of the input document if known,
            for example, "en-US" or "sr-Latn". Supported language codes are
            listed in [Language
            Support](https://cloud.google.com/translate/docs/languages). If the
            source language isn't specified, the API attempts to identify the
            source language automatically and returns the source language within
            the response. Source language must be specified if the request
            contains a glossary or a custom model.
          type: string
        documentOutputConfig:
          description: >-
            Optional. Output configurations. Defines if the output file should
            be stored within Cloud Storage as well as the desired output format.
            If not provided the translated file will only be returned through a
            byte-stream and its output mime type will be the same as the input
            file's mime type.
          $ref: '#/components/schemas/DocumentOutputConfig'
        targetLanguageCode:
          type: string
          description: >-
            Required. The ISO-639 language code to use for translation of the
            input document, set to one of the language codes listed in [Language
            Support](https://cloud.google.com/translate/docs/languages).
        customizedAttribution:
          description: >-
            Optional. This flag is to support user customized attribution. If
            not provided, the default is `Machine Translated by Google`.
            Customized attribution should follow rules in
            https://cloud.google.com/translate/attribution#attribution_and_logos
          type: string
        documentInputConfig:
          description: Required. Input configurations.
          $ref: '#/components/schemas/DocumentInputConfig'
        model:
          type: string
          description: >-
            Optional. The `model` type requested for this translation. The
            format depends on model type: - AutoML Translation models:
            `projects/{project-number-or-id}/locations/{location-id}/models/{model-id}`
            - General (built-in) models:
            `projects/{project-number-or-id}/locations/{location-id}/models/general/nmt`,
            If not provided, the default Google model (NMT) will be used for
            translation.
        glossaryConfig:
          description: >-
            Optional. Glossary to be applied. The glossary must be within the
            same region (have the same location-id) as the model, otherwise an
            INVALID_ARGUMENT (400) error is returned.
          $ref: '#/components/schemas/TranslateTextGlossaryConfig'
      description: A document translation request.
      type: object
      id: TranslateDocumentRequest
    BatchTranslateTextRequest:
      id: BatchTranslateTextRequest
      type: object
      description: The batch translation request.
      properties:
        models:
          type: object
          additionalProperties:
            type: string
          description: >-
            Optional. The models to use for translation. Map's key is target
            language code. Map's value is model name. Value can be a built-in
            general model, or an AutoML Translation model. The value format
            depends on model type: - AutoML Translation models:
            `projects/{project-number-or-id}/locations/{location-id}/models/{model-id}`
            - General (built-in) models:
            `projects/{project-number-or-id}/locations/{location-id}/models/general/nmt`,
            If the map is empty or a specific model is not requested for a
            language pair, then default google model (nmt) is used.
        targetLanguageCodes:
          description: >-
            Required. Specify up to 10 language codes here. Supported language
            codes are listed in [Language
            Support](https://cloud.google.com/translate/docs/languages).
          type: array
          items:
            type: string
        glossaries:
          description: >-
            Optional. Glossaries to be applied for translation. It's keyed by
            target language code.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TranslateTextGlossaryConfig'
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Optional. The labels with user-defined metadata for the request.
            Label keys and values can be no longer than 63 characters (Unicode
            codepoints), can only contain lowercase letters, numeric characters,
            underscores and dashes. International characters are allowed. Label
            values are optional. Label keys must start with a letter. See
            https://cloud.google.com/translate/docs/advanced/labels for more
            information.
        sourceLanguageCode:
          type: string
          description: >-
            Required. Source language code. Supported language codes are listed
            in [Language
            Support](https://cloud.google.com/translate/docs/languages).
        inputConfigs:
          type: array
          items:
            $ref: '#/components/schemas/InputConfig'
          description: >-
            Required. Input configurations. The total number of files matched
            should be <= 100. The total content size should be <= 100M Unicode
            codepoints. The files must use UTF-8 encoding.
        outputConfig:
          description: >-
            Required. Output configuration. If 2 input configs match to the same
            file (that is, same input path), we don't generate output for
            duplicate inputs.
          $ref: '#/components/schemas/OutputConfig'
    LanguageCodePair:
      id: LanguageCodePair
      type: object
      description: Used with unidirectional glossaries.
      properties:
        sourceLanguageCode:
          description: >-
            Required. The ISO-639 language code of the input text, for example,
            "en-US". Expected to be an exact match for
            GlossaryTerm.language_code.
          type: string
        targetLanguageCode:
          description: >-
            Required. The ISO-639 language code for translation output, for
            example, "zh-CN". Expected to be an exact match for
            GlossaryTerm.language_code.
          type: string
    SupportedLanguage:
      description: >-
        A single supported language response corresponds to information related
        to one supported language.
      properties:
        languageCode:
          description: >-
            Supported language code, generally consisting of its ISO 639-1
            identifier, for example, 'en', 'ja'. In certain cases, ISO-639 codes
            including language and region identifiers are returned (for example,
            'zh-TW' and 'zh-CN').
          type: string
        displayName:
          type: string
          description: >-
            Human-readable name of the language localized in the display
            language specified in the request.
        supportSource:
          type: boolean
          description: Can be used as a source language.
        supportTarget:
          description: Can be used as a target language.
          type: boolean
      id: SupportedLanguage
      type: object
    DocumentOutputConfig:
      description: A document translation request output config.
      properties:
        mimeType:
          description: >-
            Optional. Specifies the translated document's mime_type. If not
            specified, the translated file's mime type will be the same as the
            input file's mime type. Currently only support the output mime type
            to be the same as input mime type. - application/pdf -
            application/vnd.openxmlformats-officedocument.wordprocessingml.document
            -
            application/vnd.openxmlformats-officedocument.presentationml.presentation
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          type: string
        gcsDestination:
          description: >-
            Optional. Google Cloud Storage destination for the translation
            output, e.g., `gs://my_bucket/my_directory/`. The destination
            directory provided does not have to be empty, but the bucket must
            exist. If a file with the same name as the output file already
            exists in the destination an error will be returned. For a
            DocumentInputConfig.contents provided document, the output file will
            have the name "output_[trg]_translations.[ext]", where - [trg]
            corresponds to the translated file's language code, - [ext]
            corresponds to the translated file's extension according to its mime
            type. For a DocumentInputConfig.gcs_uri provided document, the
            output file will have a name according to its URI. For example: an
            input file with URI: `gs://a/b/c.[extension]` stored in a
            gcs_destination bucket with name "my_bucket" will have an output
            URI: `gs://my_bucket/a_b_c_[trg]_translations.[ext]`, where - [trg]
            corresponds to the translated file's language code, - [ext]
            corresponds to the translated file's extension according to its mime
            type. If the document was directly provided through the request,
            then the output document will have the format:
            `gs://my_bucket/translated_document_[trg]_translations.[ext]`, where
            - [trg] corresponds to the translated file's language code, - [ext]
            corresponds to the translated file's extension according to its mime
            type. If a glossary was provided, then the output URI for the
            glossary translation will be equal to the default output URI but
            have `glossary_translations` instead of `translations`. For the
            previous example, its glossary URI would be:
            `gs://my_bucket/a_b_c_[trg]_glossary_translations.[ext]`. Thus the
            max number of output files will be 2 (Translated document, Glossary
            translated document). Callers should expect no partial outputs. If
            there is any error during document translation, no output will be
            stored in the Cloud Storage bucket.
          $ref: '#/components/schemas/GcsDestination'
      id: DocumentOutputConfig
      type: object
    GcsOutputDestination:
      type: object
      id: GcsOutputDestination
      properties:
        outputUriPrefix:
          type: string
          description: >-
            Required. Google Cloud Storage URI to output directory. For example,
            `gs://bucket/directory`. The requesting user must have write
            permission to the bucket. The directory will be created if it
            doesn't exist.
      description: The Google Cloud Storage location for the output content.
    GlossaryEntry:
      id: GlossaryEntry
      type: object
      description: Represents a single entry in a glossary.
      properties:
        name:
          type: string
          description: >-
            Identifier. The resource name of the entry. Format:
            `projects/*/locations/*/glossaries/*/glossaryEntries/*`
        termsSet:
          description: Used for an equivalent term sets glossary.
          $ref: '#/components/schemas/GlossaryTermsSet'
        termsPair:
          description: Used for an unidirectional glossary.
          $ref: '#/components/schemas/GlossaryTermsPair'
        description:
          description: Describes the glossary entry.
          type: string
    GlossaryTermsPair:
      type: object
      id: GlossaryTermsPair
      properties:
        targetTerm:
          description: The term that will replace the match source term.
          $ref: '#/components/schemas/GlossaryTerm'
        sourceTerm:
          description: The source term is the term that will get match in the text,
          $ref: '#/components/schemas/GlossaryTerm'
      description: Represents a single entry for an unidirectional glossary.
    RomanizeTextRequest:
      description: The request message for synchronous romanization.
      properties:
        sourceLanguageCode:
          type: string
          description: >-
            Optional. The ISO-639 language code of the input text if known, for
            example, "hi" or "zh". Supported language codes are listed in
            [Language
            Support](https://cloud.google.com/translate/docs/languages#roman).
            If the source language isn't specified, the API attempts to identify
            the source language automatically and returns the source language
            for each content in the response.
        contents:
          description: Required. The content of the input in string format.
          type: array
          items:
            type: string
      id: RomanizeTextRequest
      type: object
    DetectLanguageRequest:
      type: object
      id: DetectLanguageRequest
      properties:
        mimeType:
          type: string
          description: >-
            Optional. The format of the source text, for example, "text/html",
            "text/plain". If left blank, the MIME type defaults to "text/html".
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Optional. The labels with user-defined metadata for the request.
            Label keys and values can be no longer than 63 characters (Unicode
            codepoints), can only contain lowercase letters, numeric characters,
            underscores and dashes. International characters are allowed. Label
            values are optional. Label keys must start with a letter. See
            https://cloud.google.com/translate/docs/advanced/labels for more
            information.
        model:
          type: string
          description: >-
            Optional. The language detection model to be used. Format:
            `projects/{project-number-or-id}/locations/{location-id}/models/language-detection/{model-id}`
            Only one language detection model is currently supported:
            `projects/{project-number-or-id}/locations/{location-id}/models/language-detection/default`.
            If not specified, the default model is used.
        content:
          type: string
          description: The content of the input stored as a string.
        documentInputConfig:
          description: Optional. The document configuration of the input.
          $ref: '#/components/schemas/DocumentInputConfig'
      description: The request message for language detection.
    ImportDataRequest:
      description: Request message for ImportData.
      properties:
        inputConfig:
          description: Required. The config for the input content.
          $ref: '#/components/schemas/DatasetInputConfig'
      id: ImportDataRequest
      type: object
    LanguageCodesSet:
      id: LanguageCodesSet
      type: object
      description: Used with equivalent term set glossaries.
      properties:
        languageCodes:
          description: >-
            Optional. The ISO-639 language code(s) for terms defined in the
            glossary. All entries are unique. The list contains at least two
            entries. Expected to be an exact match for
            GlossaryTerm.language_code.
          type: array
          items:
            type: string
    DatasetOutputConfig:
      properties:
        gcsDestination:
          description: Google Cloud Storage destination to write the output.
          $ref: '#/components/schemas/GcsOutputDestination'
      description: Output configuration for datasets.
      type: object
      id: DatasetOutputConfig
    TransliterationConfig:
      properties:
        enableTransliteration:
          type: boolean
          description: >-
            If true, source text in romanized form can be translated to the
            target language.
      description: Configures transliteration feature on top of translation.
      type: object
      id: TransliterationConfig
    Model:
      type: object
      id: Model
      properties:
        sourceLanguageCode:
          description: Output only. The BCP-47 language code of the source language.
          type: string
          readOnly: true
        targetLanguageCode:
          description: Output only. The BCP-47 language code of the target language.
          readOnly: true
          type: string
        createTime:
          format: google-datetime
          description: >-
            Output only. Timestamp when the model resource was created, which is
            also when the training started.
          type: string
          readOnly: true
        displayName:
          type: string
          description: >-
            The name of the model to show in the interface. The name can be up
            to 32 characters long and can consist only of ASCII Latin letters
            A-Z and a-z, underscores (_), and ASCII digits 0-9.
        trainExampleCount:
          readOnly: true
          type: integer
          description: >-
            Output only. Number of examples (sentence pairs) used to train the
            model.
          format: int32
        name:
          type: string
          description: >-
            The resource name of the model, in form of
            `projects/{project-number-or-id}/locations/{location_id}/models/{model_id}`
        dataset:
          type: string
          description: >-
            Required. The dataset from which the model is trained, in form of
            `projects/{project-number-or-id}/locations/{location_id}/datasets/{dataset_id}`
        validateExampleCount:
          type: integer
          readOnly: true
          format: int32
          description: >-
            Output only. Number of examples (sentence pairs) used to validate
            the model.
        updateTime:
          format: google-datetime
          description: Output only. Timestamp when this model was last updated.
          type: string
          readOnly: true
        testExampleCount:
          type: integer
          readOnly: true
          format: int32
          description: >-
            Output only. Number of examples (sentence pairs) used to test the
            model.
      description: A trained translation model.
    InputConfig:
      description: Input configuration for BatchTranslateText request.
      properties:
        gcsSource:
          description: >-
            Required. Google Cloud Storage location for the source input. This
            can be a single file (for example,
            `gs://translation-test/input.tsv`) or a wildcard (for example,
            `gs://translation-test/*`). If a file extension is `.tsv`, it can
            contain either one or two columns. The first column (optional) is
            the id of the text request. If the first column is missing, we use
            the row number (0-based) from the input file as the ID in the output
            file. The second column is the actual text to be translated. We
            recommend each row be <= 10K Unicode codepoints, otherwise an error
            might be returned. Note that the input tsv must be RFC 4180
            compliant. You could use https://github.com/Clever/csvlint to check
            potential formatting errors in your tsv file. csvlint
            --delimiter='\t' your_input_file.tsv The other supported file
            extensions are `.txt` or `.html`, which is treated as a single large
            chunk of text.
          $ref: '#/components/schemas/GcsSource'
        mimeType:
          type: string
          description: >-
            Optional. Can be "text/plain" or "text/html". For `.tsv`,
            "text/html" is used if mime_type is missing. For `.html`, this field
            must be "text/html" or empty. For `.txt`, this field must be
            "text/plain" or empty.
      id: InputConfig
      type: object
    FileInputSource:
      type: object
      id: FileInputSource
      properties:
        content:
          format: byte
          description: Required. The file's byte contents.
          type: string
        displayName:
          type: string
          description: Required. The file's display name.
        mimeType:
          type: string
          description: Required. The file's mime type.
      description: An inlined file.
    ListModelsResponse:
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/Model'
          description: The models read.
        nextPageToken:
          description: >-
            A token to retrieve next page of results. Pass this token to the
            page_token field in the ListModelsRequest to obtain the
            corresponding page.
          type: string
      description: Response message for ListModels.
      type: object
      id: ListModelsResponse
    ReferenceSentencePairList:
      type: object
      id: ReferenceSentencePairList
      properties:
        referenceSentencePairs:
          description: Reference sentence pairs.
          type: array
          items:
            $ref: '#/components/schemas/ReferenceSentencePair'
      description: A list of reference sentence pairs.
    AdaptiveMtDataset:
      id: AdaptiveMtDataset
      type: object
      description: An Adaptive MT Dataset.
      properties:
        createTime:
          description: Output only. Timestamp when this dataset was created.
          format: google-datetime
          readOnly: true
          type: string
        updateTime:
          description: Output only. Timestamp when this dataset was last updated.
          format: google-datetime
          readOnly: true
          type: string
        displayName:
          description: >-
            The name of the dataset to show in the interface. The name can be up
            to 32 characters long and can consist only of ASCII Latin letters
            A-Z and a-z, underscores (_), and ASCII digits 0-9.
          type: string
        sourceLanguageCode:
          description: The BCP-47 language code of the source language.
          type: string
        exampleCount:
          format: int32
          description: The number of examples in the dataset.
          type: integer
        name:
          type: string
          description: >-
            Identifier. The resource name of the dataset, in form of
            `projects/{project-number-or-id}/locations/{location_id}/adaptiveMtDatasets/{dataset_id}`
        targetLanguageCode:
          description: The BCP-47 language code of the target language.
          type: string
    AdaptiveMtFile:
      properties:
        name:
          type: string
          description: >-
            Identifier. The resource name of the file, in form of
            `projects/{project-number-or-id}/locations/{location_id}/adaptiveMtDatasets/{dataset}/adaptiveMtFiles/{file}`
        entryCount:
          description: The number of entries that the file contains.
          format: int32
          type: integer
        createTime:
          format: google-datetime
          description: Output only. Timestamp when this file was created.
          type: string
          readOnly: true
        updateTime:
          format: google-datetime
          description: Output only. Timestamp when this file was last updated.
          type: string
          readOnly: true
        displayName:
          description: The file's display name.
          type: string
      description: An AdaptiveMtFile.
      type: object
      id: AdaptiveMtFile
    ImportAdaptiveMtFileResponse:
      properties:
        adaptiveMtFile:
          readOnly: true
          description: Output only. The Adaptive MT file that was imported.
          $ref: '#/components/schemas/AdaptiveMtFile'
      description: The response for importing an AdaptiveMtFile
      type: object
      id: ImportAdaptiveMtFileResponse
    ReferenceSentencePair:
      properties:
        sourceSentence:
          type: string
          description: Source sentence in the sentence pair.
        targetSentence:
          description: Target sentence in the sentence pair.
          type: string
      description: A pair of sentences used as reference in source and target languages.
      type: object
      id: ReferenceSentencePair
    GlossaryConfig:
      description: >-
        Configures which glossary is used for a specific target language and
        defines options for applying that glossary.
      properties:
        glossary:
          type: string
          description: >-
            Required. The `glossary` to be applied for this translation. The
            format depends on the glossary: - User-provided custom glossary:
            `projects/{project-number-or-id}/locations/{location-id}/glossaries/{glossary-id}`
        ignoreCase:
          type: boolean
          description: >-
            Optional. Indicates match is case insensitive. The default value is
            `false` if missing.
        contextualTranslationEnabled:
          type: boolean
          description: >-
            Optional. If set to true, the glossary will be used for contextual
            translation.
      id: GlossaryConfig
      type: object
    Example:
      type: object
      id: Example
      properties:
        sourceText:
          type: string
          description: Sentence in source language.
        targetText:
          description: Sentence in target language.
          type: string
        name:
          description: >-
            Output only. The resource name of the example, in form of
            `projects/{project-number-or-id}/locations/{location_id}/datasets/{dataset_id}/examples/{example_id}`
          readOnly: true
          type: string
        usage:
          description: >-
            Output only. Usage of the sentence pair. Options are
            TRAIN|VALIDATION|TEST.
          readOnly: true
          type: string
      description: A sentence pair.
    DocumentTranslation:
      description: A translated document message.
      properties:
        mimeType:
          description: The translated document's mime type.
          type: string
        byteStreamOutputs:
          type: array
          items:
            type: string
            format: byte
          description: >-
            The array of translated documents. It is expected to be size 1 for
            now. We may produce multiple translated documents in the future for
            other type of file formats.
        detectedLanguageCode:
          description: >-
            The detected language for the input document. If the user did not
            provide the source language for the input document, this field will
            have the language code automatically detected. If the source
            language was passed, auto-detection of the language does not occur
            and this field is empty.
          type: string
      id: DocumentTranslation
      type: object
    GcsDestination:
      description: The Google Cloud Storage location for the output content.
      properties:
        outputUriPrefix:
          description: >-
            Required. The bucket used in 'output_uri_prefix' must exist and
            there must be no files under 'output_uri_prefix'.
            'output_uri_prefix' must end with "/" and start with "gs://". One
            'output_uri_prefix' can only be used by one batch translation job at
            a time. Otherwise an INVALID_ARGUMENT (400) error is returned.
          type: string
      id: GcsDestination
      type: object
    ExportDataRequest:
      properties:
        outputConfig:
          description: Required. The config for the output content.
          $ref: '#/components/schemas/DatasetOutputConfig'
      description: Request message for ExportData.
      type: object
      id: ExportDataRequest
    TranslateDocumentResponse:
      properties:
        documentTranslation:
          description: Translated document.
          $ref: '#/components/schemas/DocumentTranslation'
        model:
          type: string
          description: >-
            Only present when 'model' is present in the request. 'model' is
            normalized to have a project number. For example: If the 'model'
            field in TranslateDocumentRequest is:
            `projects/{project-id}/locations/{location-id}/models/general/nmt`
            then `model` here would be normalized to
            `projects/{project-number}/locations/{location-id}/models/general/nmt`.
        glossaryDocumentTranslation:
          description: >-
            The document's translation output if a glossary is provided in the
            request. This can be the same as
            [TranslateDocumentResponse.document_translation] if no glossary
            terms apply.
          $ref: '#/components/schemas/DocumentTranslation'
        glossaryConfig:
          description: The `glossary_config` used for this translation.
          $ref: '#/components/schemas/TranslateTextGlossaryConfig'
      description: A translated document response message.
      type: object
      id: TranslateDocumentResponse
    BatchDocumentOutputConfig:
      id: BatchDocumentOutputConfig
      type: object
      description: Output configuration for BatchTranslateDocument request.
      properties:
        gcsDestination:
          description: >-
            Google Cloud Storage destination for output content. For every
            single input document (for example, gs://a/b/c.[extension]), we
            generate at most 2 * n output files. (n is the # of
            target_language_codes in the BatchTranslateDocumentRequest). While
            the input documents are being processed, we write/update an index
            file `index.csv` under `gcs_destination.output_uri_prefix` (for
            example, gs://translation_output/index.csv) The index file is
            generated/updated as new files are being translated. The format is:
            input_document,target_language_code,translation_output,error_output,
            glossary_translation_output,glossary_error_output `input_document`
            is one file we matched using gcs_source.input_uri.
            `target_language_code` is provided in the request.
            `translation_output` contains the translations. (details provided
            below) `error_output` contains the error message during processing
            of the file. Both translations_file and errors_file could be empty
            strings if we have no content to output.
            `glossary_translation_output` and `glossary_error_output` are the
            translated output/error when we apply glossaries. They could also be
            empty if we have no content to output. Once a row is present in
            index.csv, the input/output matching never changes. Callers should
            also expect all the content in input_file are processed and ready to
            be consumed (that is, no partial output file is written). Since
            index.csv will be keeping updated during the process, please make
            sure there is no custom retention policy applied on the output
            bucket that may avoid file updating.
            (https://cloud.google.com/storage/docs/bucket-lock#retention-policy)
            The naming format of translation output files follows (for target
            language code [trg]): `translation_output`:
            `gs://translation_output/a_b_c_[trg]_translation.[extension]`
            `glossary_translation_output`:
            `gs://translation_test/a_b_c_[trg]_glossary_translation.[extension]`.
            The output document will maintain the same file format as the input
            document. The naming format of error output files follows (for
            target language code [trg]): `error_output`:
            `gs://translation_test/a_b_c_[trg]_errors.txt`
            `glossary_error_output`:
            `gs://translation_test/a_b_c_[trg]_glossary_translation.txt`. The
            error output is a txt file containing error details.
          $ref: '#/components/schemas/GcsDestination'
    TranslateTextGlossaryConfig:
      description: >-
        Configures which glossary is used for a specific target language and
        defines options for applying that glossary.
      properties:
        glossary:
          type: string
          description: >-
            Required. The `glossary` to be applied for this translation. The
            format depends on the glossary: - User-provided custom glossary:
            `projects/{project-number-or-id}/locations/{location-id}/glossaries/{glossary-id}`
        ignoreCase:
          type: boolean
          description: >-
            Optional. Indicates match is case insensitive. The default value is
            `false` if missing.
        contextualTranslationEnabled:
          description: >-
            Optional. If set to true, the glossary will be used for contextual
            translation.
          type: boolean
      id: TranslateTextGlossaryConfig
      type: object
    Glossary:
      id: Glossary
      type: object
      description: Represents a glossary built from user-provided data.
      properties:
        entryCount:
          format: int32
          description: Output only. The number of entries defined in the glossary.
          type: integer
          readOnly: true
        name:
          description: >-
            Identifier. The resource name of the glossary. Glossary names have
            the form
            `projects/{project-number-or-id}/locations/{location-id}/glossaries/{glossary-id}`.
          type: string
        inputConfig:
          description: >-
            Required. Provides examples to build the glossary from. Total
            glossary must not exceed 10M Unicode codepoints.
          $ref: '#/components/schemas/GlossaryInputConfig'
        endTime:
          format: google-datetime
          description: Output only. When the glossary creation was finished.
          type: string
          readOnly: true
        submitTime:
          description: Output only. When CreateGlossary was called.
          format: google-datetime
          readOnly: true
          type: string
        languagePair:
          description: Used with unidirectional glossaries.
          $ref: '#/components/schemas/LanguageCodePair'
        languageCodesSet:
          description: Used with equivalent term set glossaries.
          $ref: '#/components/schemas/LanguageCodesSet'
        displayName:
          type: string
          description: Optional. The display name of the glossary.
    GlossaryTerm:
      type: object
      id: GlossaryTerm
      properties:
        languageCode:
          type: string
          description: The language for this glossary term.
        text:
          description: The text for the glossary term.
          type: string
      description: Represents a single glossary term
    Operation:
      properties:
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        response:
          type: object
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
        name:
          type: string
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
        done:
          type: boolean
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      type: object
      id: Operation
    ImportAdaptiveMtFileRequest:
      description: The request for importing an AdaptiveMt file along with its sentences.
      properties:
        fileInputSource:
          description: Inline file source.
          $ref: '#/components/schemas/FileInputSource'
        gcsInputSource:
          description: Google Cloud Storage file source.
          $ref: '#/components/schemas/GcsInputSource'
      id: ImportAdaptiveMtFileRequest
      type: object
    InputFile:
