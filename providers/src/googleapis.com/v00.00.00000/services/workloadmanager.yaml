openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Workload Manager API
  description: >-
    Workload Manager is a service that provides tooling for enterprise workloads
    to automate the deployment and validation of your workloads against best
    practices and recommendations.
  version: v1
  x-discovery-doc-revision: '20260715'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/workload-manager/docs
servers:
  - url: https://workloadmanager.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      type: object
      properties: {}
    CloudResource:
      description: The resource on GCP
      id: CloudResource
      type: object
      properties:
        name:
          type: string
          description: >-
            Output only. resource name Example:
            compute.googleapis.com/projects/wlm-obs-dev/zones/us-central1-a/instances/sap-pri
          readOnly: true
        kind:
          type: string
          description: 'Output only. '
          readOnly: true
          enum:
            - RESOURCE_KIND_UNSPECIFIED
            - RESOURCE_KIND_INSTANCE
            - RESOURCE_KIND_DISK
            - RESOURCE_KIND_ADDRESS
            - RESOURCE_KIND_FILESTORE
            - RESOURCE_KIND_HEALTH_CHECK
            - RESOURCE_KIND_FORWARDING_RULE
            - RESOURCE_KIND_BACKEND_SERVICE
            - RESOURCE_KIND_SUBNETWORK
            - RESOURCE_KIND_NETWORK
            - RESOURCE_KIND_PUBLIC_ADDRESS
            - RESOURCE_KIND_INSTANCE_GROUP
          enumDescriptions:
            - Unspecified resource kind.
            - This is a compute instance.
            - This is a compute disk.
            - This is a compute address.
            - This is a filestore instance.
            - This is a compute health check.
            - This is a compute forwarding rule.
            - This is a compute backend service.
            - This is a compute subnetwork.
            - This is a compute network.
            - This is a public accessible IP Address.
            - This is a compute instance group.
        instanceProperties:
          description: Output only. All instance properties.
          readOnly: true
          $ref: '#/components/schemas/InstanceProperties'
    ViolationDetails:
      description: The violation in an evaluation result.
      id: ViolationDetails
      type: object
      properties:
        asset:
          description: The name of the asset.
          type: string
        ruleOutput:
          description: Output only. The rule output of the violation.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/RuleOutput'
        serviceAccount:
          type: string
          description: The service account associated with the resource.
        observed:
          type: object
          description: Details of the violation.
          additionalProperties:
            type: string
    Actuation:
      description: >-
        The Actuation object represents the bootstrap state and output results
        of deployed infrastructure and software.
      id: Actuation
      type: object
      properties:
        startTime:
          description: Output only. Start time stamp.
          readOnly: true
          type: string
          format: google-datetime
        endTime:
          format: google-datetime
          type: string
          description: Output only. End time stamp.
          readOnly: true
        name:
          type: string
          description: >-
            The name of the actuation resource. The format is
            projects/{project}/locations/{location}/deployments/{deployment}/actuations/{actuation}.
        actuationOutput:
          $ref: '#/components/schemas/ActuationOutput'
          description: Output only. Actuation output.
          readOnly: true
        state:
          enumDescriptions:
            - State unspecified.
            - Creating infrastructure in backend (Terraform applying).
            - Success.
            - >-
              Failed either in infra creating, post infra configuring, or infra
              destroying.
            - >-
              Configure workload after infrastructure is ready (Ansible
              running).
            - Destroying infrastructure in backend (Terraform destroying).
            - >-
              Ansible timed out due to losing heartbeat in post infra
              configuring.
          description: Output only. Actuation state.
          readOnly: true
          type: string
          enum:
            - STATE_UNSPECIFIED
            - INFRA_CREATING
            - SUCCEEDED
            - FAILED
            - POST_INFRA_CONFIGURING
            - INFRA_DESTROYING
            - TIMEOUT
        deploymentOutput:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentOutput'
          description: Output only. Deployment output.
          readOnly: true
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      type: object
      properties:
        done:
          type: boolean
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
        metadata:
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
    Deployment:
      description: >-
        The Deployment object represents user intent for deploying a specific
        type of workload.
      id: Deployment
      type: object
      properties:
        sapSystemS4Config:
          description: SAP system workload input.
          $ref: '#/components/schemas/SapSystemS4Config'
        serviceAccount:
          description: >-
            User-specified Service Account (SA) credentials to be used for Cloud
            Build. Format:
            `projects/{projectID}/serviceAccounts/{serviceAccount}` The default
            Cloud Build SA will be used initially if this field is not set
            during deployment creation.
          type: string
        updateTime:
          description: Output only. Update time stamp.
          readOnly: true
          type: string
          format: google-datetime
        state:
          description: Output only. Current state of the deployment.
          readOnly: true
          type: string
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
            - UPDATING
            - DELETING
            - FAILED
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - The deployment is being created.
            - The deployment is healthy.
            - The deployment is being updated.
            - The deployment is being deleted.
            - The deployment has encountered an unexpected error.
        description:
          type: string
          description: Description of the deployment.
        sqlServerWorkload:
          description: MS SQL workload input.
          $ref: '#/components/schemas/SqlServerWorkload'
        name:
          type: string
          description: >-
            The name of the deployment resource. The format is
            'projects/{project_id}/locations/{location_id}/deployments/{deployment_id}'.
        workerPool:
          type: string
          description: >-
            Optional. The user-specified Cloud Build worker pool resource in
            which the Cloud Build job will execute. Format:
            `projects/{project}/locations/{location}/workerPools/{workerPoolId}`.
            If this field is unspecified, the default Cloud Build worker pool
            will be used.
        workloadType:
          type: string
          description: Optional. Workload type of the deployment.
          enumDescriptions:
            - Unspecified workload type.
            - SAP S/4HANA workload type.
            - SQL Server workload type.
            - Oracle workload type.
          enum:
            - WORKLOAD_TYPE_UNSPECIFIED
            - SAP_S4
            - SQL_SERVER
            - ORACLE
        createTime:
          format: google-datetime
          type: string
          description: Output only. Create time stamp.
          readOnly: true
        terraformVariables:
          description: >-
            Optional. terraform_variables represents all the Terraform variables
            for the deployment workload. The key is the name of the Terraform
            variable, and the value is the TerraformVariable. For example: {
            "project_id": { "input_value": { "string_value": "my-project-id" }
            }, "zone": { "input_value": { "string_value": "us-central1-a" } } }
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TerraformVariable'
    Evaluation:
      properties:
        resourceFilter:
          description: >-
            Resource filter for an evaluation defining the scope of resources to
            be evaluated.
          $ref: '#/components/schemas/ResourceFilter'
        labels:
          description: Labels as key value pairs.
          type: object
          additionalProperties:
            type: string
        schedule:
          description: >-
            Crontab format schedule for scheduled evaluation, currently only
            supports the following fixed schedules: * `0 */1 * * *` # Hourly *
            `0 */6 * * *` # Every 6 hours * `0 */12 * * *` # Every 12 hours * `0
            0 */1 * *` # Daily * `0 0 */7 * *` # Weekly * `0 0 */14 * *` # Every
            14 days * `0 0 1 */1 *` # Monthly
          type: string
        customRulesBucket:
          description: The Cloud Storage bucket name for custom rules.
          type: string
        updateTime:
          type: string
          description: Output only. [Output only] Update time stamp.
          readOnly: true
          format: google-datetime
        description:
          description: Description of the Evaluation.
          type: string
        name:
          type: string
          description: >-
            Name of resource that has the form
            `projects/{project_id}/locations/{location_id}/evaluations/{evaluation_id}`.
        bigQueryDestination:
          description: >-
            Optional. The BigQuery destination for detailed evaluation results.
            If this field is specified, the results of each evaluation execution
            are exported to BigQuery.
          $ref: '#/components/schemas/BigQueryDestination'
        kmsKey:
          description: >-
            Optional. Immutable. Customer-managed encryption key name, in the
            format projects/*/locations/*/keyRings/*/cryptoKeys/*. The key will
            be used for CMEK encryption of the evaluation resource.
          type: string
        resourceStatus:
          description: >-
            Output only. [Output only] The current lifecycle state of the
            evaluation resource.
          readOnly: true
          $ref: '#/components/schemas/ResourceStatus'
        createTime:
          format: google-datetime
          type: string
          description: Output only. [Output only] Create time stamp.
          readOnly: true
        evaluationType:
          description: Evaluation type.
          enumDescriptions:
            - Not specified.
            - SAP best practices.
            - SQL best practices.
            - Customized best practices.
          type: string
          enum:
            - EVALUATION_TYPE_UNSPECIFIED
            - SAP
            - SQL_SERVER
            - OTHER
        ruleNames:
          description: The names of the rules used for this evaluation.
          type: array
          items:
            type: string
      description: >-
        Represents a Workload Manager Evaluation configuration. An Evaluation
        defines a set of rules to be validated against a scope of Cloud
        resources.
      id: Evaluation
      type: object
    SapValidation:
      properties:
        zone:
          type: string
          description: Optional. The zone of the instance that the Insight data comes from.
        validationDetails:
          description: Optional. A list of SAP validation metrics data.
          type: array
          items:
            $ref: '#/components/schemas/SapValidationValidationDetail'
        projectId:
          type: string
          description: >-
            Required. The project_id of the cloud project that the Insight data
            comes from.
      id: SapValidation
      type: object
      description: >-
        A presentation of SAP workload insight. The schema of SAP workloads
        validation related data.
    OperationMetadata:
      properties:
        endTime:
          description: Output only. The time the operation finished running.
          readOnly: true
          type: string
          format: google-datetime
        createTime:
          format: google-datetime
          type: string
          description: Output only. The time the operation was created.
          readOnly: true
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have Operation.error value with a google.rpc.Status.code of 1,
            corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        target:
          type: string
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
        statusMessage:
          type: string
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      type: object
    SapDiscoveryResourceInstancePropertiesDiskMount:
      description: Disk mount on the instance.
      id: SapDiscoveryResourceInstancePropertiesDiskMount
      type: object
      properties:
        mountPoint:
          description: Optional. Filesystem mount point.
          type: string
        diskNames:
          description: Optional. Names of the disks providing this mount point.
          type: array
          items:
            type: string
        name:
          type: string
          description: Optional. Name of the disk.
    TorsoValidation:
      id: TorsoValidation
      type: object
      description: The schema of torso workload validation data.
      properties:
        agentVersion:
          type: string
          description: >-
            Required. agent_version lists the version of the agent that
            collected this data.
        workloadType:
          description: Required. workload_type specifies the type of torso workload.
          enumDescriptions:
            - Unspecified workload type.
            - MySQL workload.
            - Oracle workload.
            - Redis workload.
          type: string
          enum:
            - WORKLOAD_TYPE_UNSPECIFIED
            - MYSQL
            - ORACLE
            - REDIS
        validationDetails:
          description: >-
            Required. validation_details contains the pairs of validation data:
            field name & field value.
          type: object
          additionalProperties:
            type: string
        projectId:
          type: string
          description: >-
            Required. project_id lists the human readable cloud project that the
            data comes from.
        instanceName:
          description: >-
            Optional. instance_name lists the human readable name of the
            instance that the data comes from.
          type: string
    SapSystemS4Config:
      description: Message for SAP system workload.
      id: SapSystemS4Config
      type: object
      properties:
        app:
          description: Instance details.
          $ref: '#/components/schemas/AppDetails'
        version:
          type: string
          description: Required. SAP HANA version.
          enumDescriptions:
            - ''
            - ''
            - ''
            - ''
          enum:
            - VERSION_UNSPECIFIED
            - S4_HANA_2021
            - S4_HANA_2022
            - S4_HANA_2023
        gcpProjectId:
          description: >-
            The project that infrastructure is deployed in. Currently only
            supports the same project where the deployment resource exists.
          type: string
        deploymentModel:
          description: Required. Supports non-HA and HA models.
          enumDescriptions:
            - ''
            - ''
            - ''
          type: string
          enum:
            - DEPLOYMENT_MODEL_UNSPECIFIED
            - DISTRIBUTED
            - DISTRIBUTED_HA
        database:
          description: Database details.
          $ref: '#/components/schemas/DatabaseDetails'
        ansibleRunnerServiceAccount:
          description: >-
            Ansible runner service account. Let customers bring their own
            service account for the Ansible runner.
          type: string
        allowStoppingForUpdate:
          type: boolean
        sapBootDiskImage:
          type: string
          description: Optional. SAP boot disk image.
        location:
          description: Database details.
          $ref: '#/components/schemas/LocationDetails'
        mediaBucketName:
          description: Required. Media bucket name.
          type: string
        scalingMethod:
          enum:
            - SCALE_METHOD_UNSPECIFIED
            - SCALE_UP
            - SCALE_OUT
          description: Required. Supports scale up and scale out.
          enumDescriptions:
            - ''
            - >-
              Scale up: Increases the size of a physical machine by increasing
              the amount of RAM and CPU available for processing.
            - >-
              Scale out: Combines multiple independent computers into one
              system.
          type: string
        environmentType:
          enum:
            - ENVIRONMENT_TYPE_UNSPECIFIED
            - NON_PRODUCTION
            - PRODUCTION
          type: string
          description: Required. Deployment environment.
          enumDescriptions:
            - Unspecified environment type.
            - Non-production environment type.
            - Production environment type.
        vmPrefix:
          type: string
          description: VM prefix.
    WriteInsightRequest:
      properties:
        insight:
          description: Required. The metrics data details.
          $ref: '#/components/schemas/Insight'
        requestId:
          description: >-
            Optional. An optional request ID to identify requests. Specify a
            unique request ID so that if you must retry your request, the server
            will know to ignore the request if it has already been completed.
            The server will guarantee that for at least 60 minutes since the
            first request. For example, consider a situation where you make an
            initial request and the request times out. If you make the request
            again with the same request ID, the server can check if original
            operation with the same request ID was received, and if so, will
            ignore the second request. This prevents clients from accidentally
            creating duplicate commitments. The request ID must be a valid UUID
            with the exception that zero UUID is not supported
            (00000000-0000-0000-0000-000000000000).
          type: string
        agentVersion:
          description: Optional. The agent version collected this data point.
          type: string
      description: Request for sending the data insights.
      id: WriteInsightRequest
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      type: object
      properties:
        locationId:
          type: string
          description: 'The canonical id for this location. For example: `"us-east1"`.'
        displayName:
          type: string
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
    SapInstanceProperties:
      id: SapInstanceProperties
      type: object
      description: SAP instance properties.
      properties:
        agentStates:
          description: Optional. Sap Instance Agent status.
          $ref: '#/components/schemas/AgentStates'
        numbers:
          description: Optional. SAP Instance numbers. They are from '00' to '99'.
          type: array
          items:
            type: string
    SapDiscoveryComponentApplicationProperties:
      id: SapDiscoveryComponentApplicationProperties
      type: object
      description: A set of properties describing an SAP Application layer.
      properties:
        ascsInstanceNumber:
          type: string
          description: Optional. Instance number of the ASCS instance.
        abap:
          description: >-
            Optional. Deprecated: ApplicationType now tells you whether this is
            ABAP or Java.
          deprecated: true
          type: boolean
        kernelVersion:
          description: Optional. Kernel version for Netweaver running in the system.
          type: string
        applicationType:
          enum:
            - APPLICATION_TYPE_UNSPECIFIED
            - NETWEAVER
            - NETWEAVER_ABAP
            - NETWEAVER_JAVA
          description: Required. Type of the application. Netweaver, etc.
          enumDescriptions:
            - Unspecified application type
            - SAP Netweaver
            - SAP Netweaver ABAP
            - SAP Netweaver Java
          type: string
        nfsUri:
          type: string
          description: >-
            Optional. Resource URI of the recognized shared NFS of the
            application. May be empty if the application server has only a
            single node.
        ersInstanceNumber:
          description: Optional. Instance number of the ERS instance.
          type: string
        appInstanceNumber:
          description: Optional. Instance number of the SAP application instance.
          type: string
        ascsUri:
          description: >-
            Optional. Resource URI of the recognized ASCS host of the
            application.
          type: string
    LocationDetails:
      description: Message for SAP instance details.
      id: LocationDetails
      type: object
      properties:
        zone2Name:
          description: Optional. Zone 2 name.
          type: string
        subnetName:
          type: string
          description: Required. Subnet name.
        dnsZone:
          description: Optional. DNS zone name.
          type: string
        deploymentDnsEnabled:
          description: >-
            Optional. When the user skips DNS configuration in the UI,
            `deployment_dns_enabled` is false; otherwise
            `deployment_dns_enabled` is true.
          type: boolean
        vpcName:
          type: string
          description: Required. VPC name.
        dnsZoneNameSuffix:
          type: string
          description: Optional. DNS zone name suffix.
        zone1Name:
          type: string
          description: Required. Zone 1 name.
        regionName:
          type: string
          description: Required. Region name.
        networkProject:
          description: Optional. Network project.
          type: string
        createCommsFirewall:
          description: >-
            Optional. Create firewall. If true, creates a firewall for the
            deployment. This field provides an option to not always create a
            firewall for the deployment.
          type: boolean
        customTags:
          description: Optional. Network tags.
          type: array
          items:
            type: string
        internetAccess:
          enum:
            - INTERNETACCESS_UNSPECIFIED
            - ALLOW_EXTERNAL_IP
            - CONFIGURE_NAT
          type: string
          enumDescriptions:
            - ''
            - ''
            - ''
    HealthCheck:
      id: HealthCheck
      type: object
      description: >-
        HealthCheck contains the detailed health check of a component based on
        asource.
      properties:
        state:
          enumDescriptions:
            - Unspecified
            - passed
            - failed
            - degraded
            - skipped
            - unsupported
          description: Output only. The state of the health check.
          readOnly: true
          type: string
          enum:
            - STATE_UNSPECIFIED
            - PASSED
            - FAILED
            - DEGRADED
            - SKIPPED
            - UNSUPPORTED
        message:
          description: Output only. The message of the health check.
          readOnly: true
          type: string
        metric:
          description: Output only. The health check source metric name.
          readOnly: true
          type: string
        source:
          type: string
          description: Output only. The source of the health check.
          readOnly: true
        resource:
          $ref: '#/components/schemas/CloudResource'
          description: Output only. The resource the check performs on.
          readOnly: true
    ListDiscoveredProfilesResponse:
      properties:
        workloadProfiles:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadProfile'
          description: Output only. The list of workload profiles
          readOnly: true
        nextPageToken:
          type: string
          description: >-
            Output only. A token identifying a page of results the server should
            return
          readOnly: true
        unreachable:
          type: array
          items:
            type: string
          description: Locations that could not be reached.
      description: List discovered profile Response returns discovered profiles from agents
      id: ListDiscoveredProfilesResponse
      type: object
    ListExecutionsResponse:
      description: Response message for the ListExecutions RPC.
      id: ListExecutionsResponse
      type: object
      properties:
        unreachable:
          description: Locations that could not be reached.
          type: array
          items:
            type: string
        executions:
          description: The list of Execution.
          type: array
          items:
            $ref: '#/components/schemas/Execution'
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
    AgentStates:
      properties:
        installedVersion:
          description: Optional. The installed version of the agent on the host.
          type: string
        processMetrics:
          description: Optional. The Process metrics of the agent.
          $ref: '#/components/schemas/ServiceStates'
        availableVersion:
          type: string
          description: Optional. The available version of the agent in artifact registry.
        hanaMonitoring:
          description: Optional. HANA monitoring metrics of the agent.
          $ref: '#/components/schemas/ServiceStates'
        isFullyEnabled:
          type: boolean
          description: >-
            Optional. Whether the agent is fully enabled. If false, the agent is
            has some issues.
        systemDiscovery:
          description: Optional. The System discovery metrics of the agent.
          $ref: '#/components/schemas/ServiceStates'
      description: Agent status.
      id: AgentStates
      type: object
    RuleExecutionResult:
