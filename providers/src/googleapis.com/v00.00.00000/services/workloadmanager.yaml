          type: object
        products:
          description: Output only. The products on this workload.
          items:
            $ref: '#/components/schemas/Product'
          readOnly: true
          type: array
      type: object
    ScannedResource:
      description: A scanned resource.
      id: ScannedResource
      properties:
        resource:
          description: Resource name.
          type: string
        type:
          description: Resource type.
          type: string
      type: object
    ServiceStates:
      description: The state of the service.
      id: ServiceStates
      properties:
        iamPermissions:
          description: Optional. Output only. The IAM permissions for the service.
          items:
            $ref: '#/components/schemas/IAMPermission'
          readOnly: true
          type: array
        state:
          description: Output only. The overall state of the service.
          enum:
            - STATE_UNSPECIFIED
            - CONFIG_FAILURE
            - IAM_FAILURE
            - FUNCTIONALITY_FAILURE
            - ENABLED
            - DISABLED
          enumDescriptions:
            - The state is unspecified.
            - The state means the service has config errors.
            - The state means the service has IAM permission errors.
            - The state means the service has functionality errors.
            - The state means the service has no error.
            - The state means the service disabled.
          readOnly: true
          type: string
      type: object
    ShellCommand:
      description: A ShellCommand is invoked via the agent's command line executor.
      id: ShellCommand
      properties:
        args:
          description: Arguments to be passed to the command.
          type: string
        command:
          description: The name of the command to be executed.
          type: string
        timeoutSeconds:
          description: Optional. If not specified, the default timeout is 60 seconds.
          format: int32
          type: integer
      type: object
    SqlLocationDetails:
      description: Location and networking details for configuring SQL server workload.
      id: SqlLocationDetails
      properties:
        dnsZone:
          description: >-
            Optional. Create a new DNS zone when the field is empty. Only shown
            for `Using an existing DNS`. List of existing DNS zones. Terraform
            variable name: existing_dns_zone_name.
          type: string
        gcpProjectId:
          description: >-
            Required. The project that infrastructure is deployed in. Currently
            only supports the same project where the deployment resource exists.
          type: string
        internetAccess:
          description: Required. Internet Access.
          enum:
            - INTERNET_ACCESS_UNSPECIFIED
            - ALLOW_EXTERNAL_IP
            - CONFIGURE_NAT
          enumDescriptions:
            - Unspecified internet access.
            - Allow external IP.
            - Configure NAT.
          type: string
        network:
          description: Required. Network name.
          type: string
        primaryZone:
          description: Required. Primary zone.
          type: string
        region:
          description: Required. Region name.
          type: string
        secondaryZone:
          description: >-
            Optional. Secondary zone cannot be the same as primary_zone and is
            only for High Availability deployment mode.
          type: string
        subnetwork:
          description: Required. Subnetwork name.
          type: string
        tertiaryZone:
          description: >-
            Optional. Tertiary zone cannot be the same as primary_zone and
            secondary_zone, and it is only for High Availability deployment
            mode.
          type: string
      type: object
    SqlServerWorkload:
      description: Message for MS SQL workload.
      id: SqlServerWorkload
      properties:
        activeDirectory:
          $ref: '#/components/schemas/ActiveDirectory'
          description: Required. Active Directory details.
        computeEngineServiceAccount:
          description: >-
            Compute Engine service account. Let customers bring their own
            service account for Compute Engine.
          type: string
        database:
          $ref: '#/components/schemas/Database'
          description: Required. Database details.
        deploymentModel:
          description: Required. HIGH_AVAILABILITY or SINGLE_INSTANCE.
          enum:
            - DEPLOYMENT_MODEL_UNSPECIFIED
            - HIGH_AVAILABILITY
            - SINGLE_INSTANCE
          enumDescriptions:
            - Unspecified deployment model.
            - High Availability deployment model.
            - Single instance deployment model.
          type: string
        environmentType:
          description: Required. Deployment environment.
          enum:
            - ENVIRONMENT_TYPE_UNSPECIFIED
            - NON_PRODUCTION
            - PRODUCTION
          enumDescriptions:
            - Unspecified environment type.
            - Non-production environment type.
            - Production environment type.
          type: string
        fciType:
          description: Optional. SHARED_DISK or S2D.
          enum:
            - FCI_TYPE_UNSPECIFIED
            - SHARED_DISK
            - S2D
          enumDescriptions:
            - Unspecified FCI type.
            - SHARED DISK FCI type.
            - S2D FCI type.
          type: string
        haType:
          description: >-
            Optional. AOAG or FCI. It is only needed for the High Availability
            deployment mode.
          enum:
            - HA_TYPE_UNSPECIFIED
            - AOAG
            - FCI
          enumDescriptions:
            - Unspecified HA type.
            - AOAG HA type.
            - FCI HA type.
          type: string
        isSqlPayg:
          description: Required. SQL licensing type.
          type: boolean
        location:
          $ref: '#/components/schemas/SqlLocationDetails'
          description: Required. Location details.
        mediaBucket:
          description: Required. Name of the media storing SQL server installation files.
          type: string
        operatingSystemType:
          description: >-
            Required. The type of the operating system the SQL server is going
            to run on top of.
          enum:
            - OPERATING_SYSTEM_TYPE_UNSPECIFIED
            - WINDOWS
            - UBUNTU
            - RED_HAT_ENTERPRISE_LINUX
            - SUSE
          enumDescriptions:
            - Unspecified operating system type.
            - Windows operating system type.
            - Ubuntu operating system type.
            - Red Hat Enterprise Linux operating system type.
            - SUSE operating system type.
          type: string
        osImage:
          description: Required. The image of the operating system.
          type: string
        osImageType:
          description: >-
            Optional. OS image type. It's used to create boot disks for VM
            instances. When either Windows licensing type or SQL licensing type
            is BYOL, this option is disabled and defaults to a custom image.
          enum:
            - OS_IMAGE_TYPE_UNSPECIFIED
            - PUBLIC_IMAGE
            - CUSTOM_IMAGE
          enumDescriptions:
            - Unspecified OS image type.
            - Public image.
            - Custom image.
          type: string
        pacemaker:
          $ref: '#/components/schemas/Pacemaker'
          description: >-
            Optional. Pacemaker configuration, only applicable for Linux HA
            deployments.
        sqlServerEdition:
          description: >-
            Optional. SQL Server Edition type, only applicable when the
            operating system is Linux.
          enum:
            - SQL_SERVER_EDITION_TYPE_UNSPECIFIED
            - SQL_SERVER_EDITION_TYPE_DEVELOPER
            - SQL_SERVER_EDITION_TYPE_ENTERPRISE
            - SQL_SERVER_EDITION_TYPE_STANDARD
            - SQL_SERVER_EDITION_TYPE_WEB
          enumDescriptions:
            - Unspecified type.
            - Developer type.
            - Enterprise type.
            - Standard type.
            - Web type.
          type: string
        sqlServerVersion:
          description: Optional. 2017, 2019, or 2022.
          enum:
            - SQL_SERVER_VERSION_TYPE_UNSPECIFIED
            - SQL_SERVER_VERSION_TYPE_2017
            - SQL_SERVER_VERSION_TYPE_2019
            - SQL_SERVER_VERSION_TYPE_2022
          enumDescriptions:
            - Unspecified type.
            - 2017 type.
            - 2019 type.
            - 2022 type.
          type: string
        vmPrefix:
          description: Required. Should be unique in the project.
          type: string
      type: object
    SqlserverValidation:
      description: >-
        A presentation of SQLServer workload insight. The schema of SqlServer
        workloads validation related data.
      id: SqlserverValidation
      properties:
        agentVersion:
          description: Optional. The agent version collected this data point
          type: string
        instance:
          description: >-
            Required. The instance_name of the instance that the Insight data
            comes from. According to https://linter.aip.dev/122/name-suffix:
            field names should not use the _name suffix unless the field would
            be ambiguous without it.
          type: string
        projectId:
          description: >-
            Required. The project_id of the cloud project that the Insight data
            comes from.
          type: string
        validationDetails:
          description: Optional. A list of SqlServer validation metrics data.
          items:
            $ref: '#/components/schemas/SqlserverValidationValidationDetail'
          type: array
      type: object
    SqlserverValidationDetails:
      description: Message containing collected data names and values.
      id: SqlserverValidationDetails
      properties:
        fields:
          additionalProperties:
            type: string
          description: Required. Collected data is in format.
          type: object
      type: object
    SqlserverValidationValidationDetail:
      description: Message describing the Sqlserver validation metrics.
      id: SqlserverValidationValidationDetail
      properties:
        details:
          description: >-
            Required. Details wraps map that represents collected data names and
            values.
          items:
            $ref: '#/components/schemas/SqlserverValidationDetails'
          type: array
        type:
          description: Optional. The Sqlserver system that the validation data is from.
          enum:
            - SQLSERVER_VALIDATION_TYPE_UNSPECIFIED
            - OS
            - DB_LOG_DISK_SEPARATION
            - DB_MAX_PARALLELISM
            - DB_CXPACKET_WAITS
            - DB_TRANSACTION_LOG_HANDLING
            - DB_VIRTUAL_LOG_FILE_COUNT
            - DB_BUFFER_POOL_EXTENSION
            - DB_MAX_SERVER_MEMORY
            - INSTANCE_METRICS
            - DB_INDEX_FRAGMENTATION
            - DB_TABLE_INDEX_COMPRESSION
            - DB_BACKUP_POLICY
          enumDescriptions:
            - Unspecified type.
            - The Sqlserver system named OS.
            - The LOG_DISK_SEPARATION table.
            - The MAX_PARALLELISM table.
            - The CXPACKET_WAITS table.
            - The TRANSACTION_LOG_HANDLING table.
            - The VIRTUAL_LOG_FILE_COUNT table.
            - The BUFFER_POOL_EXTENSION table.
            - The MAX_SERVER_MEMORY table.
            - The INSTANCE_METRICS table.
            - The DB_INDEX_FRAGMENTATION table.
            - The DB_TABLE_INDEX_COMPRESSION table.
            - The DB_BACKUP_POLICY table.
          type: string
      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      type: object
    Summary:
      description: Execution summary.
      id: Summary
      properties:
        failures:
          description: Output only. Number of failures.
          format: int64
          readOnly: true
          type: string
        newFailures:
          description: >-
            Output only. Number of new failures compared to the previous
            execution.
          format: int64
          readOnly: true
          type: string
        newFixes:
          description: Output only. Number of new fixes compared to the previous execution.
          format: int64
          readOnly: true
          type: string
      type: object
    TerraformVariable:
      description: >-
        In order to align with the Infra Manager dependency, we create the same
        TerraformVariable message to represent a Terraform input variable, by
        following Infra Manager's API documentation:
        https://cloud.google.com/infrastructure-manager/docs/reference/rest. A
        Terraform input variable.
      id: TerraformVariable
      properties:
        inputValue:
          description: Optional. Input variable value.
          type: any
      type: object
    TorsoValidation:
      description: The schema of torso workload validation data.
      id: TorsoValidation
      properties:
        agentVersion:
          description: >-
            Required. agent_version lists the version of the agent that
            collected this data.
          type: string
        instanceName:
          description: >-
            Optional. instance_name lists the human readable name of the
            instance that the data comes from.
          type: string
        projectId:
          description: >-
            Required. project_id lists the human readable cloud project that the
            data comes from.
          type: string
        validationDetails:
          additionalProperties:
            type: string
          description: >-
            Required. validation_details contains the pairs of validation data:
            field name & field value.
          type: object
        workloadType:
          description: Required. workload_type specifies the type of torso workload.
          enum:
            - WORKLOAD_TYPE_UNSPECIFIED
            - MYSQL
            - ORACLE
            - REDIS
          enumDescriptions:
            - Unspecified workload type.
            - MySQL workload.
            - Oracle workload.
            - Redis workload.
          type: string
      type: object
    UpcomingMaintenanceEvent:
      description: Maintenance Event
      id: UpcomingMaintenanceEvent
      properties:
        endTime:
          description: Optional. End time
          format: google-datetime
          type: string
        maintenanceStatus:
          description: Optional. Maintenance status
          type: string
        onHostMaintenance:
          description: >-
            Optional. Instance maintenance behavior. Could be `MIGRATE` or
            `TERMINATE`.
          type: string
        startTime:
          description: Optional. Start time
          format: google-datetime
          type: string
        type:
          description: Optional. Type
          type: string
      type: object
    ViolationDetails:
      description: The violation in an evaluation result.
      id: ViolationDetails
      properties:
        asset:
          description: The name of the asset.
          type: string
        observed:
          additionalProperties:
            type: string
          description: Details of the violation.
          type: object
        ruleOutput:
          description: Output only. The rule output of the violation.
          items:
            $ref: '#/components/schemas/RuleOutput'
          readOnly: true
          type: array
        serviceAccount:
          description: The service account associated with the resource.
          type: string
      type: object
    WorkloadProfile:
      description: Workload resource.
      id: WorkloadProfile
      properties:
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. such as name, description, version. More example can be
            found in deployment
          type: object
        name:
          description: >-
            Identifier. name of resource names have the form
            'projects/{project_id}/locations/{location}/workloadProfiles/{workload_id}'
          type: string
        refreshedTime:
          description: Required. time when the workload data was refreshed
          format: google-datetime
          type: string
        sapWorkload:
          $ref: '#/components/schemas/SapWorkload'
          description: The sap workload content
        workloadType:
          description: Required. The type of the workload
          enum:
            - WORKLOAD_TYPE_UNSPECIFIED
            - S4_HANA
          enumDescriptions:
            - unspecified workload type
            - running sap workload s4/hana
          type: string
      type: object
    WorkloadProfileHealth:
      description: WorkloadProfileHealth contains the detailed health check of workload.
      id: WorkloadProfileHealth
      properties:
        checkTime:
          description: The time when the health check was performed.
          format: google-datetime
          type: string
        componentsHealth:
          description: The detailed condition reports of each component.
          items:
            $ref: '#/components/schemas/ComponentHealth'
          type: array
        state:
          description: Output only. The health state of the workload.
          enum:
            - HEALTH_STATE_UNSPECIFIED
            - HEALTHY
            - UNHEALTHY
            - CRITICAL
            - UNSUPPORTED
          enumDescriptions:
            - Unspecified.
            - Healthy workload.
            - Unhealthy workload.
            - Has critical issues.
            - Unsupported.
          readOnly: true
          type: string
      type: object
    WriteInsightRequest:
      description: Request for sending the data insights.
      id: WriteInsightRequest
      properties:
        agentVersion:
          description: Optional. The agent version collected this data point.
          type: string
        insight:
          $ref: '#/components/schemas/Insight'
          description: Required. The metrics data details.
        requestId:
          description: >-
            Optional. An optional request ID to identify requests. Specify a
            unique request ID so that if you must retry your request, the server
            will know to ignore the request if it has already been completed.
            The server will guarantee that for at least 60 minutes since the
            first request. For example, consider a situation where you make an
            initial request and the request times out. If you make the request
            again with the same request ID, the server can check if original
            operation with the same request ID was received, and if so, will
            ignore the second request. This prevents clients from accidentally
            creating duplicate commitments. The request ID must be a valid UUID
            with the exception that zero UUID is not supported
            (00000000-0000-0000-0000-000000000000).
          type: string
      type: object
    WriteInsightResponse:
      description: The response for write insights request.
      id: WriteInsightResponse
      properties: {}
      type: object
