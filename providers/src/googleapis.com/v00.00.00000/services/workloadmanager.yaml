            `0 */6 * * *` # Every 6 hours * `0 */12 * * *` # Every 12 hours * `0
            0 */1 * *` # Daily * `0 0 */7 * *` # Weekly * `0 0 */14 * *` # Every
            14 days * `0 0 1 */1 *` # Monthly
