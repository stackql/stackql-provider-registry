components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    ActiveDirectory:
      description: Active Directory details.
      id: ActiveDirectory
      properties:
        dnsAddress:
          description: Optional. DNS IP address.
          type: string
        domain:
          description: Optional. Human readable form of a domain such as `example.com`.
          type: string
        domainUsername:
          description: Optional. Domain username.
          type: string
        secretManagerSecret:
          description: Required. Secret Manager secret.
          type: string
        type:
          description: Required. Active Directory type.
          enum:
            - ACTIVE_DIRECTORY_TYPE_UNSPECIFIED
            - GCP_MANAGED
            - SELF_MANAGED
          enumDescriptions:
            - Unspecified Active Directory type.
            - GCP managed Active Directory type.
            - Self managed Active Directory type.
          type: string
      type: object
    Actuation:
      description: >-
        The Actuation object represents the bootstrap state and output results
        of deployed infrastructure and software.
      id: Actuation
      properties:
        actuationOutput:
          $ref: '#/components/schemas/ActuationOutput'
          description: Output only. Actuation output.
          readOnly: true
        deploymentOutput:
          description: Output only. Deployment output.
          items:
            $ref: '#/components/schemas/DeploymentOutput'
          readOnly: true
          type: array
        endTime:
          description: Output only. End time stamp.
          format: google-datetime
          readOnly: true
          type: string
        name:
          description: >-
            The name of the actuation resource. The format is
            projects/{project}/locations/{location}/deployments/{deployment}/actuations/{actuation}.
          type: string
        startTime:
          description: Output only. Start time stamp.
          format: google-datetime
          readOnly: true
          type: string
        state:
          description: Output only. Actuation state.
          enum:
            - STATE_UNSPECIFIED
            - INFRA_CREATING
            - SUCCEEDED
            - FAILED
            - POST_INFRA_CONFIGURING
            - INFRA_DESTROYING
            - TIMEOUT
          enumDescriptions:
            - State unspecified.
            - Creating infrastructure in backend (Terraform applying).
            - Success.
            - >-
              Failed either in infra creating, post infra configuring, or infra
              destroying.
            - >-
              Configure workload after infrastructure is ready (Ansible
              running).
            - Destroying infrastructure in backend (Terraform destroying).
            - >-
              Ansible timed out due to losing heartbeat in post infra
              configuring.
          readOnly: true
          type: string
      type: object
    ActuationOutput:
      description: Message for output of actuation.
      id: ActuationOutput
      properties:
        actuateLogs:
          description: A link to the Cloud Storage file that stores build logs.
          type: string
        ansibleError:
          description: Output only. Error message returned from Ansible.
          readOnly: true
          type: string
        ansibleFailedTask:
          description: Output only. Failed task name returned from Ansible.
          items:
            type: string
          readOnly: true
          type: array
        blueprintId:
          description: >-
            Reference to the Blueprint Controller deployment and revision
            resource.
          type: string
        cloudbuildId:
          description: >-
            Cloud Build instance UUID associated with this revision, without any
            suffix or prefix
          type: string
        errorCode:
          description: >-
            Output only. Code describing any errors that may have occurred. If
            not specified, there is no error in actuation.
          enum:
            - ERROR_CODE_UNSPECIFIED
            - TERRAFORM_FAILED
            - PERMISSION_DENIED_IN_TERRAFORM
            - QUOTA_EXCEED_IN_TERRAFORM
            - ANSIBLE_FAILED
            - CONSTRAINT_VIOLATION_IN_TERRAFORM
            - RESOURCE_ALREADY_EXISTS_IN_TERRAFORM
            - RESOURCE_UNAVAILABLE_IN_TERRAFORM
            - PERMISSION_DENIED_IN_ANSIBLE
            - INVALID_SECRET_IN_ANSIBLE
            - TERRAFORM_DELETION_FAILED
            - RESOURCE_IN_USE_IN_TERRAFORM_DELETION
            - ANSIBLE_START_FAILED
          enumDescriptions:
            - No error code was specified.
            - General Terraform failure.
            - Permission error in Terraform.
            - Quota related error in Terraform.
            - General Ansible failure.
            - Constraint related error in Terraform.
            - Resource already exists error in Terraform.
            - Resource not found error in Terraform.
            - Permission denied error in Ansible.
            - Secret related error in Ansible.
            - General Terraform failure during deletion.
            - Resource in use error in Terraform deletion.
            - Startup failure in Ansible.
          readOnly: true
          type: string
        errorLogs:
          description: A link to the actuation Cloud Build log.
          type: string
        hasUserFacingErrorMsg:
          description: >-
            Output only. Whether the error message is user facing. If true, the
            error message will be shown in the UI.
          readOnly: true
          type: boolean
        terraformError:
          description: Output only. Error message returned from Terraform.
          readOnly: true
          type: string
        terraformTemplate:
          description: Reference to the Terraform template used.
          type: string
      type: object
    AgentCommand:
      description: >-
        An AgentCommand specifies a one-time executable program for the agent to
        run.
      id: AgentCommand
      properties:
        command:
          description: The name of the agent one-time executable that will be invoked.
          type: string
        parameters:
          additionalProperties:
            type: string
          description: >-
            A map of key/value pairs that can be used to specify additional
            one-time executable settings.
          type: object
      type: object
    AgentStates:
      description: Agent status.
      id: AgentStates
      properties:
        availableVersion:
          description: Optional. The available version of the agent in artifact registry.
          type: string
        hanaMonitoring:
          $ref: '#/components/schemas/ServiceStates'
          description: Optional. HANA monitoring metrics of the agent.
        installedVersion:
          description: Optional. The installed version of the agent on the host.
          type: string
        isFullyEnabled:
          description: >-
            Optional. Whether the agent is fully enabled. If false, the agent is
            has some issues.
          type: boolean
        processMetrics:
          $ref: '#/components/schemas/ServiceStates'
          description: Optional. The Process metrics of the agent.
        systemDiscovery:
          $ref: '#/components/schemas/ServiceStates'
          description: Optional. The System discovery metrics of the agent.
      type: object
    AgentStatus:
      description: The schema of agent status data.
      id: AgentStatus
      properties:
        agentName:
          description: Output only. The name of the agent.
          readOnly: true
          type: string
        availableVersion:
          description: >-
            Output only. The available version of the agent in artifact
            registry.
          readOnly: true
          type: string
        cloudApiAccessFullScopesGranted:
          description: Output only. Whether the agent has full access to Cloud APIs.
          enum:
            - UNSPECIFIED_STATE
            - SUCCESS_STATE
            - FAILURE_STATE
            - ERROR_STATE
          enumDescriptions:
            - The state is unspecified and has not been checked yet.
            - The state is successful (enabled, granted, fully functional).
            - The state is failed (disabled, denied, not fully functional).
            - >-
              There was an internal error while checking the state, state is
              unknown.
          readOnly: true
          type: string
        configurationErrorMessage:
          description: >-
            Output only. The error message for the agent configuration if
            invalid.
          readOnly: true
          type: string
        configurationFilePath:
          description: Output only. The path to the agent configuration file.
          readOnly: true
          type: string
        configurationValid:
          description: Output only. Whether the agent configuration is valid.
          enum:
            - UNSPECIFIED_STATE
            - SUCCESS_STATE
            - FAILURE_STATE
            - ERROR_STATE
          enumDescriptions:
            - The state is unspecified and has not been checked yet.
            - The state is successful (enabled, granted, fully functional).
            - The state is failed (disabled, denied, not fully functional).
            - >-
              There was an internal error while checking the state, state is
              unknown.
          readOnly: true
          type: string
        installedVersion:
          description: Output only. The installed version of the agent on the host.
          readOnly: true
          type: string
        instanceUri:
          description: >-
            Output only. The URI of the instance. Format:
            projects//zones//instances/
          readOnly: true
          type: string
        kernelVersion:
          $ref: >-
            #/components/schemas/SapDiscoveryResourceInstancePropertiesKernelVersion
          description: Output only. The kernel version of the system.
          readOnly: true
        references:
          description: Output only. Optional references to public documentation.
          items:
            $ref: '#/components/schemas/AgentStatusReference'
          readOnly: true
          type: array
        services:
          description: Output only. The services (process metrics, host metrics, etc.).
          items:
            $ref: '#/components/schemas/AgentStatusServiceStatus'
          readOnly: true
          type: array
        systemdServiceEnabled:
          description: Output only. Whether the agent service is enabled in systemd.
          enum:
            - UNSPECIFIED_STATE
            - SUCCESS_STATE
            - FAILURE_STATE
            - ERROR_STATE
          enumDescriptions:
            - The state is unspecified and has not been checked yet.
            - The state is successful (enabled, granted, fully functional).
            - The state is failed (disabled, denied, not fully functional).
            - >-
              There was an internal error while checking the state, state is
              unknown.
          readOnly: true
          type: string
        systemdServiceRunning:
          description: Output only. Whether the agent service is running in systemd.
          enum:
            - UNSPECIFIED_STATE
            - SUCCESS_STATE
            - FAILURE_STATE
            - ERROR_STATE
          enumDescriptions:
            - The state is unspecified and has not been checked yet.
            - The state is successful (enabled, granted, fully functional).
            - The state is failed (disabled, denied, not fully functional).
            - >-
              There was an internal error while checking the state, state is
              unknown.
          readOnly: true
          type: string
      type: object
    AgentStatusConfigValue:
      description: The configuration value.
      id: AgentStatusConfigValue
      properties:
        isDefault:
          description: >-
            Output only. Whether the configuration value is the default value or
            overridden.
          readOnly: true
          type: boolean
        name:
          description: Output only. The name of the configuration value.
          readOnly: true
          type: string
        value:
          description: Output only. The value of the configuration value.
          readOnly: true
          type: string
      type: object
    AgentStatusIAMPermission:
      description: The IAM permission status.
      id: AgentStatusIAMPermission
      properties:
        granted:
          description: Output only. Whether the permission is granted.
          enum:
            - UNSPECIFIED_STATE
            - SUCCESS_STATE
            - FAILURE_STATE
            - ERROR_STATE
          enumDescriptions:
            - The state is unspecified and has not been checked yet.
            - The state is successful (enabled, granted, fully functional).
            - The state is failed (disabled, denied, not fully functional).
            - >-
              There was an internal error while checking the state, state is
              unknown.
          readOnly: true
          type: string
        name:
          description: Output only. The name of the permission.
          readOnly: true
          type: string
      type: object
    AgentStatusReference:
      description: The reference to public documentation.
      id: AgentStatusReference
      properties:
        name:
          description: Output only. The name of the reference.
          readOnly: true
          type: string
        url:
          description: Output only. The URL of the reference.
          readOnly: true
          type: string
      type: object
    AgentStatusServiceStatus:
      description: The status of a service (process metrics, host metrics, etc.).
      id: AgentStatusServiceStatus
      properties:
        configValues:
          description: Output only. The configuration values for the service.
          items:
            $ref: '#/components/schemas/AgentStatusConfigValue'
          readOnly: true
          type: array
        errorMessage:
          description: >-
            Output only. The error message for the service if it is not fully
            functional.
          readOnly: true
          type: string
        fullyFunctional:
          description: >-
            Output only. Whether the service is fully functional (all checks
            passed).
          enum:
            - UNSPECIFIED_STATE
            - SUCCESS_STATE
            - FAILURE_STATE
            - ERROR_STATE
          enumDescriptions:
            - The state is unspecified and has not been checked yet.
            - The state is successful (enabled, granted, fully functional).
            - The state is failed (disabled, denied, not fully functional).
            - >-
              There was an internal error while checking the state, state is
              unknown.
          readOnly: true
          type: string
        iamPermissions:
          description: Output only. The permissions required for the service.
          items:
            $ref: '#/components/schemas/AgentStatusIAMPermission'
          readOnly: true
          type: array
        name:
          description: Output only. The name of the service.
          readOnly: true
          type: string
        state:
          description: >-
            Output only. The state of the service (enabled or disabled in the
            configuration).
          enum:
            - UNSPECIFIED_STATE
            - SUCCESS_STATE
            - FAILURE_STATE
            - ERROR_STATE
          enumDescriptions:
            - The state is unspecified and has not been checked yet.
            - The state is successful (enabled, granted, fully functional).
            - The state is failed (disabled, denied, not fully functional).
            - >-
              There was an internal error while checking the state, state is
              unknown.
          readOnly: true
          type: string
        unspecifiedStateMessage:
          description: >-
            Output only. The message to display when the service state is
            unspecified.
          readOnly: true
          type: string
      type: object
    AppDetails:
      description: Message for SAP instance details.
      id: AppDetails
      properties:
        appInstanceId:
          description: Optional. Instance ID for app.
          type: string
        appServiceAccount:
          description: >-
            Application service account. Let customers bring their own service
            account for the application.
          type: string
        appVmNames:
          description: Optional. Customized VM names.
          items:
            type: string
          type: array
        ascsImage:
          description: Required. Image for the ASCS server.
          type: string
        ascsInstanceId:
          description: Optional. Instance ID for ASCS.
          type: string
        ascsMachineType:
          description: Required. ASCS machine type.
          type: string
        ascsServiceAccount:
          description: >-
            ASCS service account. Let customers bring their own service account
            for ASCS.
          type: string
        ascsVm:
          description: Optional. ASCS VM name.
          type: string
        ersInstanceId:
          description: Optional. Instance ID for ERS.
          type: string
        ersVm:
          description: Optional. ERS VM name.
          type: string
        image:
          description: Required. Image for the app server and ASCS server.
          type: string
        machineType:
          description: Required. Machine type.
          type: string
        secretManagerSecret:
          description: Required. Secret Manager secret.
          type: string
        sharedStorage:
          description: Optional. Storage location.
          type: string
        sid:
          description: >-
            Required. The SAP SID is a three-digit server-specific unique
            identification code.
          type: string
        vmsMultiplier:
          description: Required. VMs multiplier.
          format: int32
          type: integer
      type: object
    BackupProperties:
      description: Backup properties.
      id: BackupProperties
      properties:
        latestBackupStatus:
          description: Output only. The state of the latest backup.
          enum:
            - BACKUP_STATE_UNSPECIFIED
            - BACKUP_STATE_SUCCESS
            - BACKUP_STATE_FAILURE
          enumDescriptions:
            - unspecified
            - SUCCESS state
            - FAILURE state
          readOnly: true
          type: string
        latestBackupTime:
          description: The time when the latest backup was performed.
          format: google-datetime
          type: string
      type: object
    BigQueryDestination:
      description: BigQuery destination for evaluation results.
      id: BigQueryDestination
      properties:
        createNewResultsTable:
          description: >-
            Optional. Determines if a new results table will be created when an
            Execution is created.
          type: boolean
        destinationDataset:
          description: Optional. Destination dataset to save evaluation results.
          type: string
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    CloudResource:
      description: The resource on GCP
      id: CloudResource
      properties:
        instanceProperties:
          $ref: '#/components/schemas/InstanceProperties'
          description: Output only. All instance properties.
          readOnly: true
        kind:
          description: 'Output only. '
          enum:
            - RESOURCE_KIND_UNSPECIFIED
            - RESOURCE_KIND_INSTANCE
            - RESOURCE_KIND_DISK
            - RESOURCE_KIND_ADDRESS
            - RESOURCE_KIND_FILESTORE
            - RESOURCE_KIND_HEALTH_CHECK
            - RESOURCE_KIND_FORWARDING_RULE
            - RESOURCE_KIND_BACKEND_SERVICE
            - RESOURCE_KIND_SUBNETWORK
            - RESOURCE_KIND_NETWORK
            - RESOURCE_KIND_PUBLIC_ADDRESS
            - RESOURCE_KIND_INSTANCE_GROUP
          enumDescriptions:
            - Unspecified resource kind.
            - This is a compute instance.
            - This is a compute disk.
            - This is a compute address.
            - This is a filestore instance.
            - This is a compute health check.
            - This is a compute forwarding rule.
            - This is a compute backend service.
            - This is a compute subnetwork.
            - This is a compute network.
            - This is a public accessible IP Address.
            - This is a compute instance group.
          readOnly: true
          type: string
        name:
          description: >-
            Output only. resource name Example:
            compute.googleapis.com/projects/wlm-obs-dev/zones/us-central1-a/instances/sap-pri
          readOnly: true
          type: string
      type: object
    Command:
      description: Command specifies the type of command to execute.
      id: Command
      properties:
        agentCommand:
          $ref: '#/components/schemas/AgentCommand'
          description: >-
            AgentCommand specifies a one-time executable program for the agent
            to run.
        shellCommand:
          $ref: '#/components/schemas/ShellCommand'
          description: ShellCommand is invoked via the agent's command line executor.
      type: object
    ComponentHealth:
      description: HealthCondition contains the detailed health check of each component.
      id: ComponentHealth
      properties:
        component:
          description: The component of a workload.
          type: string
        componentHealthChecks:
          description: The detailed health checks of the component.
          items:
            $ref: '#/components/schemas/HealthCheck'
          type: array
        componentHealthType:
          description: Output only. The type of the component health.
          enum:
            - TYPE_UNSPECIFIED
            - TYPE_REQUIRED
            - TYPE_OPTIONAL
            - TYPE_SPECIAL
          enumDescriptions:
            - Unspecified
            - required
            - optional
            - special
          readOnly: true
          type: string
        state:
          description: Output only. The health state of the component.
          enum:
            - HEALTH_STATE_UNSPECIFIED
            - HEALTHY
            - UNHEALTHY
            - CRITICAL
            - UNSUPPORTED
          enumDescriptions:
            - Unspecified.
            - Healthy workload.
            - Unhealthy workload.
            - Has critical issues.
            - Unsupported.
          readOnly: true
          type: string
        subComponentsHealth:
          description: Sub component health.
          items:
            $ref: '#/components/schemas/ComponentHealth'
          type: array
      type: object
    Database:
      description: Database details.
      id: Database
      properties:
        diskType:
          description: Required. Disk type.
          type: string
        floatingIpAddress:
          description: Optional. Only useful for Linux High Availability setup.
          type: string
        machineType:
          description: Required. Machine type.
          type: string
        secondarySoleTenantNode:
          description: Optional. The name of a secondary-sole-tenant node/node group.
          type: string
        secondarySoleTenantNodeType:
          description: >-
            Optional. The type of a secondary-sole-tenant node/node group. E.g.,
            compute.googleapis.com/node-name.
          type: string
        secretManagerSecret:
          description: Required. Secret Manager secret.
          type: string
        smt:
          description: Required. Whether simultaneous multithreading is enabled or not.
          type: boolean
        soleTenantNode:
          description: Optional. The name of a primary sole-tenant node/node group.
          type: string
        soleTenantNodeType:
          description: >-
            Optional. The type of a primary sole-tenant node/node group. E.g.,
            compute.googleapis.com/node-name.
          type: string
        tempdbOnSsd:
          description: Required. Whether to have TempDB on local SSD.
          type: boolean
        tenancyModel:
          description: Required. SHARED or SOLE_TENANT.
          enum:
            - TENANCY_MODEL_UNSPECIFIED
            - SHARED
            - SOLE_TENANT
          enumDescriptions:
            - Unspecified tenancy model.
            - Shared tenancy model.
            - Sole Tenant tenancy model.
          type: string
      type: object
    DatabaseDetails:
      description: Message for SAP instance details.
      id: DatabaseDetails
      properties:
        databaseServiceAccount:
          description: >-
            Database service account. Let customers bring their own SA for the
            database.
          type: string
        diskType:
          description: Required. Disk type.
          type: string
        image:
          description: Required. Image for the database server.
          type: string
        instanceId:
          description: Optional. Instance ID.
          type: string
        machineType:
          description: Required. Machine type.
          type: string
        primaryDbVm:
          description: Optional. Primary DB VM name.
          type: string
        secondaryDbVm:
          description: Optional. Secondary DB VM name.
          type: string
        secretManagerSecret:
          description: Required. Secret Manager secret.
          type: string
        sid:
          description: >-
            Required. The SID is a three-digit server-specific unique
            identification code.
          type: string
      type: object
    DatabaseProperties:
      description: Database Properties.
      id: DatabaseProperties
      properties:
        backupProperties:
          $ref: '#/components/schemas/BackupProperties'
          description: Output only. Backup properties.
          readOnly: true
        databaseType:
          description: Output only. Type of the database. `HANA`, `DB2`, etc.
          enum:
            - DATABASE_TYPE_UNSPECIFIED
            - HANA
            - MAX_DB
            - DB2
            - ORACLE
            - SQLSERVER
            - ASE
          enumDescriptions:
            - unspecified
            - SAP HANA
            - SAP MAX_DB
            - IBM DB2
            - Oracle Database
            - Microsoft SQL Server
            - SAP Sybase ASE
          readOnly: true
          type: string
      type: object
    Deployment:
      description: >-
        The Deployment object represents user intent for deploying a specific
        type of workload.
      id: Deployment
      properties:
        createTime:
          description: Output only. Create time stamp.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Description of the deployment.
          type: string
        name:
          description: >-
            The name of the deployment resource. The format is
            'projects/{project_id}/locations/{location_id}/deployments/{deployment_id}'.
          type: string
        sapSystemS4Config:
          $ref: '#/components/schemas/SapSystemS4Config'
          description: SAP system workload input.
        serviceAccount:
          description: >-
            User-specified Service Account (SA) credentials to be used for Cloud
            Build. Format:
            `projects/{projectID}/serviceAccounts/{serviceAccount}` The default
            Cloud Build SA will be used initially if this field is not set
            during deployment creation.
          type: string
        sqlServerWorkload:
          $ref: '#/components/schemas/SqlServerWorkload'
          description: MS SQL workload input.
        state:
          description: Output only. Current state of the deployment.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
            - UPDATING
            - DELETING
            - FAILED
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - The deployment is being created.
            - The deployment is healthy.
            - The deployment is being updated.
            - The deployment is being deleted.
            - The deployment has encountered an unexpected error.
          readOnly: true
          type: string
        terraformVariables:
          additionalProperties:
            $ref: '#/components/schemas/TerraformVariable'
          description: >-
            Optional. terraform_variables represents all the Terraform variables
            for the deployment workload. The key is the name of the Terraform
            variable, and the value is the TerraformVariable. For example: {
            "project_id": { "input_value": { "string_value": "my-project-id" }
            }, "zone": { "input_value": { "string_value": "us-central1-a" } } }
          type: object
        updateTime:
