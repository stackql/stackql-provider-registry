components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AdminUser:
      description: 'Message storing info about the first admin user. Next ID: 3'
      id: AdminUser
      properties:
        familyName:
          description: Optional. Last/family name of the first admin user.
          type: string
        givenName:
          description: Optional. First/given name of the first admin user.
          type: string
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    Component:
      description: >-
        Defines a logical CCAIP component that e.g. “EMAIL”, "CRM". For more
        information see go/ccaip-private-path-v2. Each logical component is
        associated with a list of service attachments.
      id: Component
      properties:
        name:
          description: Name of the component.
          type: string
        serviceAttachmentNames:
          description: >-
            Associated service attachments. The service attachment names that
            will be used for sending private traffic to the CCAIP tenant
            project. Example service attachment name:
            "projects/${TENANT_PROJECT_ID}/regions/${REGION}/serviceAttachments/ingress-default".
          items:
            type: string
          type: array
      type: object
    ContactCenter:
      description: Message describing ContactCenter object
      id: ContactCenter
      properties:
        adminUser:
          $ref: '#/components/schemas/AdminUser'
          description: >-
            Optional. Info about the first admin user, such as given name and
            family name.
        advancedReportingEnabled:
          description: Optional. Whether the advanced reporting feature is enabled.
          type: boolean
        ccaipManagedUsers:
          description: >-
            Optional. Whether to enable users to be created in the
            CCAIP-instance concurrently to having users in Cloud identity
          type: boolean
        createTime:
          description: Output only. [Output only] Create time stamp
          format: google-datetime
          readOnly: true
          type: string
        critical:
          $ref: '#/components/schemas/Critical'
          description: Optional. Critical release channel.
        customerDomainPrefix:
          description: >-
            Required. Immutable. At least 2 and max 16 char long, must conform
            to [RFC 1035](https://www.ietf.org/rfc/rfc1035.txt).
          type: string
        deleteTime:
          description: >-
            Output only. Timestamp in UTC of when this resource was
            soft-deleted.
          format: google-datetime
          readOnly: true
          type: string
        displayName:
          description: Required. A user friendly name for the ContactCenter.
          type: string
        early:
          $ref: '#/components/schemas/Early'
          description: Optional. Early release channel.
        expireTime:
          description: >-
            Output only. Timestamp in UTC of when this resource is considered
            expired.
          format: google-datetime
          readOnly: true
          type: string
        featureConfig:
          $ref: '#/components/schemas/FeatureConfig'
          description: Optional. Feature configuration to populate the feature flags.
        instanceConfig:
          $ref: '#/components/schemas/InstanceConfig'
          description: >-
            The configuration of this instance, it is currently immutable once
            created.
        kmsKey:
          description: >-
            Immutable. The KMS key name to encrypt the user input
            (`ContactCenter`).
          type: string
        labels:
          additionalProperties:
            type: string
          description: Labels as key value pairs
          type: object
        name:
          description: name of resource
          type: string
        normal:
          $ref: '#/components/schemas/Normal'
          description: Optional. Normal release channel.
        privateAccess:
          $ref: '#/components/schemas/PrivateAccess'
          description: Optional. VPC-SC related networking configuration.
        privateComponents:
          description: Output only. TODO(b/283407860) Deprecate this field.
          items:
            type: string
          readOnly: true
          type: array
        purgeTime:
          description: >-
            Output only. Timestamp in UTC of when this resource is going to be
            hard-deleted.
          format: google-datetime
          readOnly: true
          type: string
        releaseVersion:
          description: Output only. UJET release version, unique for each new release.
          readOnly: true
          type: string
        samlParams:
          $ref: '#/components/schemas/SAMLParams'
          description: Optional. Params that sets up Google as IdP.
        state:
          description: Output only. The state of this contact center.
          enum:
            - STATE_UNSPECIFIED
            - STATE_DEPLOYING
            - STATE_DEPLOYED
            - STATE_TERMINATING
            - STATE_FAILED
            - STATE_TERMINATING_FAILED
            - STATE_TERMINATED
            - STATE_IN_GRACE_PERIOD
            - STATE_FAILING_OVER
            - STATE_DEGRADED
            - STATE_REPAIRING
            - STATE_EXPIRING
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - State DEPLOYING
            - State DEPLOYED
            - State TERMINATING
            - State FAILED
            - State TERMINATING_FAILED
            - >-
              Reused for soft-deleted state because semantically equivalent to
              `DELETED` as implied by go/aip/164.
            - State IN_GRACE_PERIOD
            - >-
              State in STATE_FAILING_OVER. This State must ONLY be used by
              Multiregional Instances when a failover was triggered. Customers
              are not able to update instances in this state.
            - >-
              State DEGRADED. This State must ONLY be used by Multiregional
              Instances after a failover was executed successfully. Customers
              are not able to update instances in this state.
            - >-
              State REPAIRING. This State must ONLY be used by Multiregional
              Instances after a fallback was triggered. Customers are not able
              to update instancs in this state.
            - Flagged by an automation as soon to be expired.
          readOnly: true
          type: string
        updateTime:
          description: Output only. [Output only] Update time stamp
          format: google-datetime
          readOnly: true
          type: string
        uris:
          $ref: '#/components/schemas/URIs'
          description: Output only. URIs to access the deployed ContactCenters.
          readOnly: true
        userEmail:
          description: Optional. Email address of the first admin user.
          type: string
      type: object
    ContactCenterQuota:
      description: Represents a quota for contact centers.
      id: ContactCenterQuota
      properties:
        contactCenterCountLimit:
          deprecated: true
          description: >-
            Deprecated: Use the Quota fields instead. Reflects the count limit
            of contact centers on a billing account.
          format: int32
          type: integer
        contactCenterCountSum:
          deprecated: true
          description: >-
            Deprecated: Use the Quota fields instead. Reflects the count sum of
            contact centers on a billing account.
          format: int32
          type: integer
        quotas:
          description: Quota details per contact center instance type.
          items:
            $ref: '#/components/schemas/Quota'
          type: array
      type: object
    Critical:
      description: >-
        Instances in this Channel will receive updates after all instances in
        `Normal` were updated. They also will only be updated outside of their
        peak hours.
      id: Critical
      properties:
        peakHours:
          description: Required. Hours during which the instance should not be updated.
          items:
            $ref: '#/components/schemas/WeeklySchedule'
          type: array
      type: object
    Date:
      description: >-
        Represents a whole or partial calendar date, such as a birthday. The
        time of day and time zone are either specified elsewhere or are
        insignificant. The date is relative to the Gregorian Calendar. This can
        represent one of the following: * A full date, with non-zero year,
        month, and day values. * A month and day, with a zero year (for example,
        an anniversary). * A year on its own, with a zero month and a zero day.
        * A year and month, with a zero day (for example, a credit card
        expiration date). Related types: * google.type.TimeOfDay *
        google.type.DateTime * google.protobuf.Timestamp
      id: Date
      properties:
        day:
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0 to specify a year by itself or a year and month where
            the day isn't significant.
          format: int32
          type: integer
        month:
          description: >-
            Month of a year. Must be from 1 to 12, or 0 to specify a year
            without a month and day.
          format: int32
          type: integer
        year:
          description: >-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date
            without a year.
          format: int32
          type: integer
      type: object
    DateList:
      description: List of dates.
      id: DateList
      properties:
        values:
          description: Optional. Values in the list.
          items:
            $ref: '#/components/schemas/Date'
          type: array
      type: object
    DateTime:
      description: >-
        Represents civil time (or occasionally physical time). This type can
        represent a civil time in one of a few possible ways: * When utc_offset
        is set and time_zone is unset: a civil time on a calendar day with a
        particular offset from UTC. * When time_zone is set and utc_offset is
        unset: a civil time on a calendar day in a particular time zone. * When
        neither time_zone nor utc_offset is set: a civil time on a calendar day
        in local time. The date is relative to the Proleptic Gregorian Calendar.
        If year, month, or day are 0, the DateTime is considered not to have a
        specific year, month, or day respectively. This type may also be used to
        represent a physical time if all the date and time fields are set and
        either case of the `time_offset` oneof is set. Consider using
        `Timestamp` message for physical time instead. If your use case also
        would like to store the user's timezone, that can be done in another
        field. This type is more flexible than some applications may want. Make
        sure to document and validate your application's limitations.
      id: DateTime
      properties:
        day:
          description: >-
            Optional. Day of month. Must be from 1 to 31 and valid for the year
            and month, or 0 if specifying a datetime without a day.
          format: int32
          type: integer
        hours:
          description: >-
            Optional. Hours of day in 24 hour format. Should be from 0 to 23,
            defaults to 0 (midnight). An API may choose to allow the value
            "24:00:00" for scenarios like business closing time.
          format: int32
          type: integer
        minutes:
          description: >-
            Optional. Minutes of hour of day. Must be from 0 to 59, defaults to
            0.
          format: int32
          type: integer
        month:
          description: >-
            Optional. Month of year. Must be from 1 to 12, or 0 if specifying a
            datetime without a month.
          format: int32
          type: integer
        nanos:
          description: >-
            Optional. Fractions of seconds in nanoseconds. Must be from 0 to
            999,999,999, defaults to 0.
          format: int32
          type: integer
        seconds:
          description: >-
            Optional. Seconds of minutes of the time. Must normally be from 0 to
            59, defaults to 0. An API may allow the value 60 if it allows
            leap-seconds.
          format: int32
          type: integer
        timeZone:
          $ref: '#/components/schemas/TimeZone'
          description: Time zone.
        utcOffset:
          description: >-
            UTC offset. Must be whole seconds, between -18 hours and +18 hours.
            For example, a UTC offset of -4:00 would be represented as {
            seconds: -14400 }.
          format: google-duration
          type: string
        year:
          description: >-
            Optional. Year of date. Must be from 1 to 9999, or 0 if specifying a
            datetime without a year.
          format: int32
          type: integer
      type: object
    Early:
      description: >-
        LINT.IfChange First Channel to receive the updates. Meant to dev/test
        instances
      id: Early
      properties: {}
      type: object
    EmployeeInfo:
      description: Information about a particular employee for planning purposes.
      id: EmployeeInfo
      properties:
        id:
          description: Required. Unique ID of this employee.
          type: string
        unwantedEventIntervals:
          description: >-
            Optional. A list of unwanted event intervals for this employee. The
            start time of the interval must be in the planning horizon.
          items:
            $ref: '#/components/schemas/UnwantedEventInterval'
          type: array
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    EventTemplate:
      description: >-
        Template specifying rules for generating a single event that occurs
        during a shift. An event may represent a meeting, break, lunch, etc.
      id: EventTemplate
      properties:
        durationMinutes:
          description: Required. Fixed duration in minutes of this event.
          format: int32
          type: integer
        id:
          description: Required. Unique ID of this template.
          type: string
        maximumMinutesAfterShiftStart:
          description: >-
            Optional. Maximum number of minutes after the beginning of a shift
            that this event can start.
          format: int32
          type: integer
        minimumMinutesAfterShiftStart:
          description: >-
            Optional. Minimum number of minutes after the beginning of a shift
            that this event can start.
          format: int32
          type: integer
        startTimeIncrementMinutes:
          description: >-
            Required. The time increment (in minutes) used to generate the set
            of possible event start times between
            `minimum_minutes_after_shift_start` and
            `maximum_minutes_after_shift_start`. For example, if the minimum
            minutes after shift start are 30, maximum minutes after shift start
            are 45, and the start time increment is 5 minutes, the event can
            take place 30, 35, 40, or 45 minutes after the start of the shift.
          format: int32
          type: integer
      type: object
    FeatureConfig:
      id: FeatureConfig
      properties:
        agentDesktopEnabled:
          description: >-
            Optional. If true - enables the agent desktop feature. Default is
            false.
          type: boolean
      type: object
    GenerateShiftsRequest:
      description: >-
        Request with constraints for generating shifts. The shifts generated
        must adhere to these constraints.
      id: GenerateShiftsRequest
      properties:
        employeeInfo:
          description: >-
            Optional. Employee information that should be considered when
            generating shifts.
          items:
            $ref: '#/components/schemas/EmployeeInfo'
          type: array
        planningHorizon:
          $ref: '#/components/schemas/PlanningHorizon'
          description: >-
            Required. The solver will generate the maximum number of shifts per
            shift template.
        shiftTemplates:
          description: >-
            Required. Set of shift templates specifying rules for generating
            shifts. A shift template can be used for generating multiple shifts.
          items:
            $ref: '#/components/schemas/ShiftTemplate'
          type: array
        solverConfig:
          $ref: '#/components/schemas/SolverConfig'
          description: Required. Parameters for the solver.
        workforceDemands:
          $ref: '#/components/schemas/WorkforceDemandList'
          description: >-
            Required. All the workforce demands that the generated shifts need
            to cover. The planning horizon is defined between the earliest start
            time and the latest end time across all the entries. This field
            cannot be empty.
      type: object
    GoogleCloudCommonOperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: GoogleCloudCommonOperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        cancelRequested:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        statusDetail:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    InstanceConfig:
      description: Message storing the instance configuration.
      id: InstanceConfig
      properties:
        instanceSize:
          description: The instance size of this the instance configuration.
          enum:
            - INSTANCE_SIZE_UNSPECIFIED
            - STANDARD_SMALL
            - STANDARD_MEDIUM
            - STANDARD_LARGE
            - STANDARD_XLARGE
            - STANDARD_2XLARGE
            - STANDARD_3XLARGE
            - MULTIREGION_SMALL
            - MULTIREGION_MEDIUM
            - MULTIREGION_LARGE
            - MULTIREGION_XLARGE
            - MULTIREGION_2XLARGE
            - MULTIREGION_3XLARGE
            - DEV_SMALL
            - SANDBOX_SMALL
            - TRIAL_SMALL
            - TIME_LIMITED_TRIAL_SMALL
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - Instance Size STANDARD_SMALL.
            - Instance Size STANDARD_MEDIUM.
            - Instance Size STANDARD_LARGE.
            - Instance Size STANDARD_XLARGE.
            - Instance Size STANDARD_2XLARGE.
            - Instance Size STANDARD_3XLARGE.
            - Instance Size MULTIREGION_SMALL
            - Instance Size MULTIREGION_MEDIUM
            - Instance Size MULTIREGION_LARGE
            - Instance Size MULTIREGION_XLARGE
            - Instance Size MULTIREGION_2XLARGE.
            - Instance Size MULTIREGION_3XLARGE.
            - Instance Size DEV_SMALL
            - Instance Size SANDBOX_SMALL
            - Instance Size TRIAL_SMALL
            - Instance Size TIME_LIMITED_TRIAL_SMALL
          type: string
      type: object
    ListContactCentersResponse:
      description: Message for response to listing ContactCenters
      id: ListContactCentersResponse
      properties:
        contactCenters:
          description: The list of ContactCenter
          items:
            $ref: '#/components/schemas/ContactCenter'
          type: array
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    Normal:
      description: >-
        Instances in this Channel will receive updates after all instances in
        `Early` were updated + 2 days.
      id: Normal
      properties: {}
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        contactCenter:
          $ref: '#/components/schemas/ContactCenter'
          description: Contact center information for this request
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have Operation.error value with a google.rpc.Status.code of 1,
            corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        statusMessage:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    PlanningHorizon:
      description: >-
        Specifies the time interval during which the solver should generate
        shifts. The start time must be before the end time.
      id: PlanningHorizon
      properties:
        endTime:
          $ref: '#/components/schemas/DateTime'
          description: >-
            Required. End of the time interval for the given demand (exclusive).
            These values are read down to the minute; seconds and all smaller
            units are ignored.
        startTime:
          $ref: '#/components/schemas/DateTime'
          description: >-
            Required. Start of the time interval for the given demand
            (inclusive). These values are read down to the minute; seconds and
            all smaller units are ignored.
      type: object
    PrivateAccess:
      description: Defines ingress and egress private traffic settings for CCAIP instances.
      id: PrivateAccess
      properties:
        egressSettings:
          description: >-
            List of egress components that should not be accessed via the
            Internet. For more information see go/ccaip-private-path-v2.
          items:
