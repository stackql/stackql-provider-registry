      type: object
      id: Date
      properties:
        month:
          type: integer
          description: >-
            Month of a year. Must be from 1 to 12, or 0 to specify a year
            without a month and day.
          format: int32
        day:
          type: integer
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0 to specify a year by itself or a year and month where
            the day isn't significant.
          format: int32
        year:
          description: >-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date
            without a year.
          format: int32
          type: integer
      description: >-
        Represents a whole or partial calendar date, such as a birthday. The
        time of day and time zone are either specified elsewhere or are
        insignificant. The date is relative to the Gregorian Calendar. This can
        represent one of the following: * A full date, with non-zero year,
        month, and day values. * A month and day, with a zero year (for example,
        an anniversary). * A year on its own, with a zero month and a zero day.
        * A year and month, with a zero day (for example, a credit card
        expiration date). Related types: * google.type.TimeOfDay *
        google.type.DateTime * google.protobuf.Timestamp
    ShiftTemplate:
      type: object
      id: ShiftTemplate
      properties:
        startTimeIncrementMinutes:
          type: integer
          description: >-
            Optional. The time increment (in minutes) used to generate the set
            of possible start times between `earliest_start_time` and
            `latest_start_time`. For example, if the earliest start time is
            8:00, the latest start time is 8:30, and the start time increment is
            10 minutes, then all possible start times for this shift template
            are: 8:00, 8:10, 8:20, and 8:30.
          format: int32
        daysOffCountPerWeek:
          description: >-
            Optional. Fixed number of days off per week. An employee has a given
            day off if they are not assigned to a shift that starts on that day.
            A week is 7 days and begins on Sunday.
          format: int32
          type: integer
        eventTemplates:
          type: array
          items:
            $ref: '#/components/schemas/EventTemplate'
          description: >-
            Optional. Rules for generating events for each shift. Exactly one
            event will be included in each shift for each `EventTemplate`
            specified.
        earliestStartTime:
          description: >-
            Required. Earliest time in the day that a shift can start. This
            value is specified with hours and minutes; seconds and nanos are
            ignored.
          $ref: '#/components/schemas/TimeOfDay'
        durationMinutes:
          type: integer
          description: Required. Fixed duration of a shift generated by this template.
          format: int32
        daysOffDates:
          description: >-
            Optional. Fixed dates when shifts from this template should not be
            generated.
          $ref: '#/components/schemas/DateList'
        minimumIntereventGapMinutes:
          description: >-
            Optional. Minimum minutes between the end of one event and the start
            of the next.
          format: int32
          type: integer
        id:
          description: Required. Unique ID of this template.
          type: string
        minimumEmployeeCount:
          type: integer
          description: >-
            Optional. Minimum number of employees that can be assigned to all
            shifts generated by this template on working days.
          format: int32
        assignableEmployeeIds:
          type: array
          items:
            type: string
          description: >-
            Optional. A list of specific employee IDs that can be assigned to
            shifts generated by this template. If this field is present, there
            will be `EmployeeSchedule`s in the response for which the
            `EmployeeSchedule.employee_id` field is set to one of the IDs in
            this list. The number of employee schedules with an assigned
            employee ID will be between `minimum_employee_count` and
            `maximum_employee_count`. If this field is empty, between
            `minimum_employee_count` and `maximum_employee_count` employees can
            be assigned to shifts generated by this template and the employee
            schedules won't have an assigned employee ID. Currently, only one
            assignable employee ID is supported.
        latestStartTime:
          description: >-
            Required. Latest time in the day that a shift can start. This value
            is specified with hours and minutes; seconds and nanos are ignored.
            If this value is less than the `earliest_start_time`, it may imply
            an overnight shift.
          $ref: '#/components/schemas/TimeOfDay'
        maximumEmployeeCount:
          type: integer
          description: >-
            Required. Maximum number of employees that can be assigned to all
            shifts generated by this template on working days.
          format: int32
      description: >-
        Template specifying rules for generating shifts. A shift is a unit of
        work that specifies a start time, end time, and may contain events (e.g.
        lunch, breaks etc.). Shifts will be assigned to specific dates in the
        response.
