      type: object
    WeeklySchedule:
      description: Message representing a weekly schedule.
      id: WeeklySchedule
      properties:
        days:
          description: Required. Days of the week this schedule applies to.
          items:
            enum:
              - DAY_OF_WEEK_UNSPECIFIED
              - MONDAY
              - TUESDAY
              - WEDNESDAY
              - THURSDAY
              - FRIDAY
              - SATURDAY
              - SUNDAY
            enumDescriptions:
              - The day of the week is unspecified.
              - Monday
              - Tuesday
              - Wednesday
              - Thursday
              - Friday
              - Saturday
              - Sunday
            type: string
          type: array
        duration:
          description: Optional. Duration of the schedule.
          format: google-duration
          type: string
        endTime:
          $ref: '#/components/schemas/TimeOfDay'
          description: >-
            Optional. Daily end time of the schedule. If `end_time` is before
