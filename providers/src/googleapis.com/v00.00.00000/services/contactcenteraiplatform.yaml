          description: Required. Daily start time of the schedule.
      type: object
    WorkforceDemand:
      description: >-
        Specifies the number of employees required to cover the demand in the
        given time interval. The length of the interval must be strictly
        positive.
      id: WorkforceDemand
      properties:
        employeeCount:
          description: >-
            Optional. Number of employees needed to cover the demand for this
