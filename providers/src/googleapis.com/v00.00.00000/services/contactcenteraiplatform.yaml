openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Contact Center AI Platform API
  description: ''
  version: v1alpha1
  x-discovery-doc-revision: '20260625'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/solutions/contact-center-ai-platform
servers:
  - url: https://contactcenteraiplatform.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    URIs:
      type: object
      description: Message storing the URIs of the ContactCenter.
      id: URIs
      properties:
        rootUri:
          description: Root Uri of the ContactCenter.
          type: string
        chatBotUri:
          description: Chat Bot Uri of the ContactCenter
          type: string
        mediaUri:
          description: Media Uri of the ContactCenter.
          type: string
        virtualAgentStreamingServiceUri:
          description: Virtual Agent Streaming Service Uri of the ContactCenter.
          type: string
    ListContactCentersResponse:
      type: object
      description: Message for response to listing ContactCenters
      id: ListContactCentersResponse
      properties:
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
        contactCenters:
          type: array
          items:
            $ref: '#/components/schemas/ContactCenter'
          description: The list of ContactCenter
        unreachable:
          description: Locations that could not be reached.
          type: array
          items:
            type: string
    OperationMetadata:
      type: object
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        verb:
          readOnly: true
          type: string
          description: Output only. Name of the verb executed by the operation.
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          type: string
          readOnly: true
        statusMessage:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have Operation.error value with a google.rpc.Status.code of 1,
            corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        apiVersion:
          description: Output only. API version used to start the operation.
          type: string
          readOnly: true
        contactCenter:
          description: Contact center information for this request
          $ref: '#/components/schemas/ContactCenter'
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          type: string
          readOnly: true
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
    SAMLParams:
      description: Message storing SAML params to enable Google as IDP.
      id: SAMLParams
      properties:
        authenticationContexts:
          type: array
          items:
            enumDescriptions:
              - >-
                The Unspecified class indicates that the authentication was
                performed by unspecified means.
              - >-
                The Internet Protocol class is applicable when a principal is
                authenticated through the use of a provided IP address.
              - >-
                The Internet Protocol Password class is applicable when a
                principal is authenticated through the use of a provided IP
                address, in addition to a username/password.
              - >-
                This class is applicable when the principal has authenticated
                using a password to a local authentication authority, in order
                to acquire a Kerberos ticket. That Kerberos ticket is then used
                for subsequent network authentication.
              - >-
                Reflects no mobile customer registration procedures and an
                authentication of the mobile device without requiring explicit
                end-user interaction. This context class authenticates only the
                device and never the user; it is useful when services other than
                the mobile operator want to add a secure device authentication
                to their authentication process.
              - >-
                Reflects no mobile customer registration procedures and a
                two-factor based authentication, such as secure device and user
                PIN. This context class is useful when a service other than the
                mobile operator wants to link their customer ID to a mobile
                supplied two-factor authentication service by capturing mobile
                phone data at enrollment.
              - >-
                Reflects mobile contract customer registration procedures and a
                single factor authentication. For example, a digital signing
                device with tamper resistant memory for key storage, such as the
                mobile MSISDN, but no required PIN or biometric for real-time
                user authentication.
              - >-
                Reflects mobile contract customer registration procedures and a
                two-factor based authentication. For example, a digital signing
                device with tamper resistant memory for key storage, such as a
                GSM SIM, that requires explicit proof of user identity and
                intent, such as a PIN or biometric.
              - >-
                The Password class is applicable when a principal authenticates
                to an authentication authority through the presentation of a
                password over an unprotected HTTP session.
              - >-
                The PasswordProtectedTransport class is applicable when a
                principal authenticates to an authentication authority through
                the presentation of a password over a protected session.
              - >-
                The PreviousSession class is applicable when a principal had
                authenticated to an authentication authority at some point in
                the past using any authentication context supported by that
                authentication authority
              - >-
                The X509 context class indicates that the principal
                authenticated by means of a digital signature where the key was
                validated as part of an X.509 Public Key Infrastructure.
              - >-
                The PGP context class indicates that the principal authenticated
                by means of a digital signature where the key was validated as
                part of a PGP Public Key Infrastructure.
              - >-
                The SPKI context class indicates that the principal
                authenticated by means of a digital signature where the key was
                validated via an SPKI Infrastructure.
              - >-
                This context class indicates that the principal authenticated by
                means of a digital signature according to the processing rules
                specified in the XML Digital Signature specification [XMLSig].
              - >-
                The Smartcard class is identified when a principal authenticates
                to an authentication authority using a smartcard.
              - >-
                The SmartcardPKI class is applicable when a principal
                authenticates to an authentication authority through a
                two-factor authentication mechanism using a smartcard with
                enclosed private key and a PIN.
              - >-
                The Software-PKI class is applicable when a principal uses an
                X.509 certificate stored in software to authenticate to the
                authentication authority.
              - >-
                This class is used to indicate that the principal authenticated
                via the provision of a fixed-line telephone number, transported
                via a telephony protocol such as ADSL.
              - >-
                Indicates that the principal is "roaming" (perhaps using a phone
                card) and authenticates via the means of the line number, a user
                suffix, and a password element.
              - >-
                This class is used to indicate that the principal authenticated
                via the provision of a fixed-line telephone number and a user
                suffix, transported via a telephony protocol such as ADSL.
              - >-
                Indicates that the principal authenticated via the means of the
                line number, a user suffix, and a password element.
              - >-
                The Secure Remote Password class is applicable when the
                authentication was performed by means of Secure Remote Password
                as specified in [RFC 2945].
              - >-
                This class indicates that the principal authenticated by means
                of a client certificate, secured with the SSL/TLS transport.
              - >-
                The TimeSyncToken class is applicable when a principal
                authenticates through a time synchronization token.
            type: string
            enum:
              - AUTHENTICATION_CONTEXT_UNSPECIFIED
              - INTERNET_PROTOCOL
              - INTERNET_PROTOCOL_PASSWORD
              - KERBEROS
              - MOBILE_ONE_FACTOR_UNREGISTERED
              - MOBILE_TWO_FACTOR_UNREGISTERED
              - MOBILE_ONE_FACTOR_CONTRACT
              - MOBILE_TWO_FACTOR_CONTRACT
              - PASSWORD
              - PASSWORD_PROTECTED_TRANSPORT
              - PREVIOUS_SESSION
              - PUBLIC_KEY_X509
              - PUBLIC_KEY_PGP
              - PUBLIC_KEY_SPKI
              - PUBLIC_KEY_XML_DIGITAL_SIGNATURE
              - SMARTCARD
              - SMARTCARD_PKI
              - SOFTWARE_PKI
              - TELEPHONY
              - TELEPHONY_NOMADIC
              - TELEPHONY_PERSONALIZED
              - TELEPHONY_AUTHENTICATED
              - SECURE_REMOTE_PASSWORD
              - SSL_TLS_CERTIFICATE_BASED
              - TIME_SYNC_TOKEN
          description: Additional contexts used for authentication.
        certificate:
          description: SAML certificate
          type: string
        userEmail:
          description: Email address of the first admin users.
          deprecated: true
          type: string
        emailMapping:
          description: IdP field that maps to the user’s email address
          type: string
        ssoUri:
          description: Single sign-on URL
          type: string
        entityId:
          description: Entity id URL
          type: string
      type: object
    DateTime:
      id: DateTime
      properties:
        timeZone:
          description: Time zone.
          $ref: '#/components/schemas/TimeZone'
        minutes:
          description: >-
            Optional. Minutes of hour of day. Must be from 0 to 59, defaults to
            0.
          format: int32
          type: integer
        nanos:
          description: >-
            Optional. Fractions of seconds in nanoseconds. Must be from 0 to
            999,999,999, defaults to 0.
          format: int32
          type: integer
        hours:
          description: >-
            Optional. Hours of day in 24 hour format. Should be from 0 to 23,
            defaults to 0 (midnight). An API may choose to allow the value
            "24:00:00" for scenarios like business closing time.
          format: int32
          type: integer
        utcOffset:
          description: >-
            UTC offset. Must be whole seconds, between -18 hours and +18 hours.
            For example, a UTC offset of -4:00 would be represented as {
            seconds: -14400 }.
          format: google-duration
          type: string
        day:
          type: integer
          description: >-
            Optional. Day of month. Must be from 1 to 31 and valid for the year
            and month, or 0 if specifying a datetime without a day.
          format: int32
        seconds:
          type: integer
          description: >-
            Optional. Seconds of minutes of the time. Must normally be from 0 to
            59, defaults to 0. An API may allow the value 60 if it allows
            leap-seconds.
          format: int32
        year:
          type: integer
          description: >-
            Optional. Year of date. Must be from 1 to 9999, or 0 if specifying a
            datetime without a year.
          format: int32
        month:
          description: >-
            Optional. Month of year. Must be from 1 to 12, or 0 if specifying a
            datetime without a month.
          format: int32
          type: integer
      description: >-
        Represents civil time (or occasionally physical time). This type can
        represent a civil time in one of a few possible ways: * When utc_offset
        is set and time_zone is unset: a civil time on a calendar day with a
        particular offset from UTC. * When time_zone is set and utc_offset is
        unset: a civil time on a calendar day in a particular time zone. * When
        neither time_zone nor utc_offset is set: a civil time on a calendar day
        in local time. The date is relative to the Proleptic Gregorian Calendar.
        If year, month, or day are 0, the DateTime is considered not to have a
        specific year, month, or day respectively. This type may also be used to
        represent a physical time if all the date and time fields are set and
        either case of the `time_offset` oneof is set. Consider using
        `Timestamp` message for physical time instead. If your use case also
        would like to store the user's timezone, that can be done in another
        field. This type is more flexible than some applications may want. Make
        sure to document and validate your application's limitations.
      type: object
    Component:
      description: >-
        Defines a logical CCAIP component that e.g. “EMAIL”, "CRM". For more
        information see go/ccaip-private-path-v2. Each logical component is
        associated with a list of service attachments.
      id: Component
      properties:
        name:
          description: Name of the component.
          type: string
        serviceAttachmentNames:
          type: array
          items:
            type: string
          description: >-
            Associated service attachments. The service attachment names that
            will be used for sending private traffic to the CCAIP tenant
            project. Example service attachment name:
            "projects/${TENANT_PROJECT_ID}/regions/${REGION}/serviceAttachments/ingress-default".
      type: object
    PlanningHorizon:
      type: object
      id: PlanningHorizon
      properties:
        startTime:
          description: >-
            Required. Start of the time interval for the given demand
            (inclusive). These values are read down to the minute; seconds and
            all smaller units are ignored.
          $ref: '#/components/schemas/DateTime'
        endTime:
          description: >-
            Required. End of the time interval for the given demand (exclusive).
            These values are read down to the minute; seconds and all smaller
            units are ignored.
          $ref: '#/components/schemas/DateTime'
      description: >-
        Specifies the time interval during which the solver should generate
        shifts. The start time must be before the end time.
    Location:
      type: object
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        metadata:
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
    AdminUser:
      type: object
      description: 'Message storing info about the first admin user. Next ID: 3'
      id: AdminUser
      properties:
        givenName:
          description: Optional. First/given name of the first admin user.
          type: string
        familyName:
          description: Optional. Last/family name of the first admin user.
          type: string
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
          description: >-
            A list of locations that matches the specified filter in the
            request.
      type: object
    GenerateShiftsRequest:
      type: object
      description: >-
        Request with constraints for generating shifts. The shifts generated
        must adhere to these constraints.
      id: GenerateShiftsRequest
      properties:
        planningHorizon:
          description: >-
            Required. The solver will generate the maximum number of shifts per
            shift template.
          $ref: '#/components/schemas/PlanningHorizon'
        workforceDemands:
          description: >-
            Required. All the workforce demands that the generated shifts need
            to cover. The planning horizon is defined between the earliest start
            time and the latest end time across all the entries. This field
            cannot be empty.
          $ref: '#/components/schemas/WorkforceDemandList'
        solverConfig:
          description: Required. Parameters for the solver.
          $ref: '#/components/schemas/SolverConfig'
        employeeInfo:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeInfo'
          description: >-
            Optional. Employee information that should be considered when
            generating shifts.
        shiftTemplates:
          description: >-
            Required. Set of shift templates specifying rules for generating
            shifts. A shift template can be used for generating multiple shifts.
          type: array
          items:
            $ref: '#/components/schemas/ShiftTemplate'
    TimeOfDay:
      id: TimeOfDay
      properties:
        hours:
          description: >-
            Hours of a day in 24 hour format. Must be greater than or equal to 0
            and typically must be less than or equal to 23. An API may choose to
            allow the value "24:00:00" for scenarios like business closing time.
          format: int32
          type: integer
        minutes:
          description: >-
            Minutes of an hour. Must be greater than or equal to 0 and less than
            or equal to 59.
          format: int32
          type: integer
        seconds:
          type: integer
          description: >-
            Seconds of a minute. Must be greater than or equal to 0 and
            typically must be less than or equal to 59. An API may allow the
            value 60 if it allows leap-seconds.
          format: int32
        nanos:
          description: >-
            Fractions of seconds, in nanoseconds. Must be greater than or equal
            to 0 and less than or equal to 999,999,999.
          format: int32
          type: integer
      description: >-
        Represents a time of day. The date and time zone are either not
        significant or are specified elsewhere. An API may choose to allow leap
        seconds. Related types are google.type.Date and
        `google.protobuf.Timestamp`.
      type: object
    WeeklySchedule:
      type: object
      description: Message representing a weekly schedule.
      id: WeeklySchedule
      properties:
        startTime:
          description: Required. Daily start time of the schedule.
          $ref: '#/components/schemas/TimeOfDay'
        endTime:
          description: >-
            Optional. Daily end time of the schedule. If `end_time` is before
            `start_time`, the schedule will be considered as ending on the next
            day.
          $ref: '#/components/schemas/TimeOfDay'
        days:
          description: Required. Days of the week this schedule applies to.
          type: array
          items:
            enumDescriptions:
              - The day of the week is unspecified.
              - Monday
              - Tuesday
              - Wednesday
              - Thursday
              - Friday
              - Saturday
              - Sunday
            type: string
            enum:
              - DAY_OF_WEEK_UNSPECIFIED
              - MONDAY
              - TUESDAY
              - WEDNESDAY
              - THURSDAY
              - FRIDAY
              - SATURDAY
              - SUNDAY
        duration:
          type: string
          description: Optional. Duration of the schedule.
          format: google-duration
    WorkforceDemandList:
      type: object
      description: List of workforce demands.
      id: WorkforceDemandList
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/WorkforceDemand'
          description: Optional. Values in the list.
    DateList:
      id: DateList
      properties:
        values:
          description: Optional. Values in the list.
          type: array
          items:
            $ref: '#/components/schemas/Date'
      description: List of dates.
      type: object
    TimeZone:
      type: object
      description: >-
        Represents a time zone from the [IANA Time Zone
        Database](https://www.iana.org/time-zones).
      id: TimeZone
      properties:
        id:
          description: IANA Time Zone Database time zone. For example "America/New_York".
          type: string
        version:
          description: >-
            Optional. IANA Time Zone Database version number. For example
            "2019a".
          type: string
    Critical:
      description: >-
        Instances in this Channel will receive updates after all instances in
        `Normal` were updated. They also will only be updated outside of their
        peak hours.
      id: Critical
      properties:
        peakHours:
          description: Required. Hours during which the instance should not be updated.
          type: array
          items:
            $ref: '#/components/schemas/WeeklySchedule'
      type: object
    PrivateAccess:
      type: object
      description: Defines ingress and egress private traffic settings for CCAIP instances.
      id: PrivateAccess
      properties:
        ingressSettings:
          type: array
          items:
            $ref: '#/components/schemas/Component'
          description: >-
            List of ingress components that should not be accessed via the
            Internet. For more information see go/ccaip-private-path-v2.
        pscSetting:
          description: Private service connect settings.
          $ref: '#/components/schemas/PscSetting'
        egressSettings:
          type: array
          items:
            $ref: '#/components/schemas/Component'
          description: >-
            List of egress components that should not be accessed via the
            Internet. For more information see go/ccaip-private-path-v2.
    EmployeeInfo:
      id: EmployeeInfo
      properties:
        id:
          description: Required. Unique ID of this employee.
          type: string
        unwantedEventIntervals:
          description: >-
            Optional. A list of unwanted event intervals for this employee. The
            start time of the interval must be in the planning horizon.
          type: array
          items:
            $ref: '#/components/schemas/UnwantedEventInterval'
      description: Information about a particular employee for planning purposes.
      type: object
    Operation:
      type: object
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
        response:
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
    Early:
      description: >-
        LINT.IfChange First Channel to receive the updates. Meant to dev/test
        instances
      id: Early
      properties: {}
      type: object
    UnwantedEventInterval:
      type: object
      description: >-
        Specifies a time interval during which the overlap with events
        (generated from event templates) should be minimal.
      id: UnwantedEventInterval
      properties:
        durationMinutes:
          type: integer
          description: Required. Duration of the event.
          format: int32
        startTime:
          description: Required. Start time of the event.
          $ref: '#/components/schemas/DateTime'
    SolverConfig:
      type: object
      description: Specifies additional parameters for the solver generating shifts.
      id: SolverConfig
      properties:
        scheduleType:
          description: Required. Specifies the type of schedule to generate.
          enumDescriptions:
            - Unspecified schedule type. Should not be used.
            - Each `EmployeeSchedule` will include exactly one shift.
            - >-
              `EmployeeSchedule`s will include several shifts to generate a
              week-long schedule. The start and end time of events in a
              particular `EmployeeSchedule` will be identical. All the shifts
              have the same start and end time.
            - >-
              `EmployeeSchedule`s will include several shifts to generate a
              week-long schedule. The start and end time of events in a
              particular `EmployeeSchedule` can vary. All the shifts have the
              same start and end time. This option may result in longer solve
              times.
          type: string
          enum:
            - SCHEDULE_TYPE_UNSPECIFIED
            - SINGLE_SHIFT
            - WEEKLY_WITH_FIXED_EVENTS
            - WEEKLY_WITH_VARIABLE_EVENTS
        maximumProcessingDuration:
          type: string
          description: >-
            Optional. Maximum time the solver should spend on the problem. If
            not set, defaults to 1 minute. The choice of a time limit should
            depend on the size of the problem. To give an example, when solving
            a 7-day instance with 2 `ShiftTemplates`, each with ~20 possible
            start times and holding 2 events with ~30 possible start times, and
            two days off per week, recommended values are: <10s for fast
            solutions (and likely suboptimal), (10s, 300s) for good quality
            solutions, and >300s for an exhaustive search. Larger instances may
            require longer time limits. This value is not a hard limit and it
            does not account for the communication overhead. The expected
            latency to solve the problem may slightly exceed this value.
          format: google-duration
    CancelOperationRequest:
      type: object
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        unreachable:
          type: array
          items:
            type: string
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          type: array
          items:
            $ref: '#/components/schemas/Operation'
      type: object
    Status:
      type: object
      id: Status
      properties:
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          type: array
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
        code:
          type: integer
