      description: >-
        ClusterUpdate describes an update to the cluster. Exactly one update can
        be applied to a cluster with each request, so at most one field can be
        provided.
      id: ClusterUpdate
    EvictionSignals:
      type: object
      properties:
        nodefsInodesFree:
          description: >-
            Optional. Amount of inodes available on filesystem that kubelet uses
            for volumes, daemon logs, etc. Defines the amount of
            "nodefs.inodesFree" signal in kubelet. Default is unset, if not
            specified in the kubelet config. Linux only. It takses percentage
            value for now. Sample format: "30%". Must be >= 5% and <= 50%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        memoryAvailable:
          description: >-
            Optional. Memory available (i.e. capacity - workingSet), in bytes.
            Defines the amount of "memory.available" signal in kubelet. Default
            is unset, if not specified in the kubelet config. Format: positive
            number + unit, e.g. 100Ki, 10Mi, 5Gi. Valid units are Ki, Mi, Gi.
            Must be >= 100Mi and <= 50% of the node's memory. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        imagefsInodesFree:
          description: >-
            Optional. Amount of inodes available on filesystem that container
            runtime uses for storing images layers. Defines the amount of
            "imagefs.inodesFree" signal in kubelet. Default is unset, if not
            specified in the kubelet config. Linux only. It takses percentage
            value for now. Sample format: "30%". Must be >= 5% and <= 50%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        imagefsAvailable:
          description: >-
            Optional. Amount of storage available on filesystem that container
            runtime uses for storing images layers. If the container filesystem
            and image filesystem are not separate, then imagefs can store both
            image layers and writeable layers. Defines the amount of
            "imagefs.available" signal in kubelet. Default is unset, if not
            specified in the kubelet config. It takses percentage value for now.
            Sample format: "30%". Must be >= 15% and <= 50%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        pidAvailable:
          description: >-
            Optional. Amount of PID available for pod allocation. Defines the
            amount of "pid.available" signal in kubelet. Default is unset, if
            not specified in the kubelet config. It takses percentage value for
            now. Sample format: "30%". Must be >= 10% and <= 50%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        nodefsAvailable:
          description: >-
            Optional. Amount of storage available on filesystem that kubelet
            uses for volumes, daemon logs, etc. Defines the amount of
            "nodefs.available" signal in kubelet. Default is unset, if not
            specified in the kubelet config. It takses percentage value for now.
            Sample format: "30%". Must be >= 10% and <= 50%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
      description: >-
        Eviction signals are the current state of a particular resource at a
        specific point in time. The kubelet uses eviction signals to make
        eviction decisions by comparing the signals to eviction thresholds,
        which are the minimum amount of the resource that should be available on
        the node.
      id: EvictionSignals
    WindowsNodeConfig:
      id: WindowsNodeConfig
      description: >-
        Parameters that can be configured on Windows nodes. Windows Node Config
        that define the parameters that will be used to configure the Windows
        node pool settings.
      properties:
        osVersion:
          description: OSVersion specifies the Windows node config to be used on the node.
          enumDescriptions:
            - When OSVersion is not specified.
            - >-
              LTSC2019 specifies to use LTSC2019 as the Windows Servercore Base
              Image.
            - >-
              LTSC2022 specifies to use LTSC2022 as the Windows Servercore Base
              Image.
          enum:
            - OS_VERSION_UNSPECIFIED
            - OS_VERSION_LTSC2019
            - OS_VERSION_LTSC2022
          type: string
      type: object
    AutoIpamConfig:
      properties:
        enabled:
          description: The flag that enables Auto IPAM on this cluster
          type: boolean
      type: object
      id: AutoIpamConfig
      description: AutoIpamConfig contains all information related to Auto IPAM
    NetworkPolicyConfig:
      type: object
      properties:
        disabled:
          description: Whether NetworkPolicy is enabled for this cluster.
          type: boolean
      description: >-
        Configuration for NetworkPolicy. This only tracks whether the addon is
        enabled or not on the Master, it does not track whether network policy
        is enabled for the nodes.
      id: NetworkPolicyConfig
    ParentProductConfig:
      description: >-
        ParentProductConfig is the configuration of the parent product of the
        cluster. This field is used by Google internal products that are built
        on top of a GKE cluster and take the ownership of the cluster.
      id: ParentProductConfig
      type: object
      properties:
        productName:
          description: Name of the parent product associated with the cluster.
          type: string
        labels:
          description: Labels contain the configuration of the parent product.
          additionalProperties:
            type: string
          type: object
    K8sBetaAPIConfig:
      type: object
      properties:
        enabledApis:
          type: array
          items:
            type: string
          description: Enabled k8s beta APIs.
      description: K8sBetaAPIConfig , configuration for beta APIs
      id: K8sBetaAPIConfig
    BinaryAuthorization:
      description: Configuration for Binary Authorization.
      id: BinaryAuthorization
      type: object
      properties:
        evaluationMode:
          type: string
          description: >-
            Mode of operation for binauthz policy evaluation. If unspecified,
            defaults to DISABLED.
          enumDescriptions:
            - Default value
            - Disable BinaryAuthorization
            - >-
              Enforce Kubernetes admission requests with BinaryAuthorization
              using the project's singleton policy. This is equivalent to
              setting the enabled boolean to true.
          enum:
            - EVALUATION_MODE_UNSPECIFIED
            - DISABLED
            - PROJECT_SINGLETON_POLICY_ENFORCE
        enabled:
          type: boolean
          description: >-
            This field is deprecated. Leave this unset and instead configure
            BinaryAuthorization using evaluation_mode. If evaluation_mode is set
            to anything other than EVALUATION_MODE_UNSPECIFIED, this field is
            ignored.
          deprecated: true
    AccurateTimeConfig:
      type: object
      properties:
        enablePtpKvmTimeSync:
          description: Enables enhanced time synchronization using PTP-KVM.
          type: boolean
      description: >-
        AccurateTimeConfig contains configuration for the accurate time
        synchronization feature.
      id: AccurateTimeConfig
    ScheduleUpgradeConfig:
      properties:
        enabled:
          description: Optional. Whether or not scheduled upgrades are enabled.
          type: boolean
      type: object
      id: ScheduleUpgradeConfig
      description: Configuration for scheduled upgrades on the cluster.
    ControlPlaneEgress:
      properties:
        mode:
          type: string
          description: Defines the mode of control plane egress.
          enumDescriptions:
            - Default value not specified.
            - Control plane has public IP and no restriction on egress.
            - >-
              No public IP on control plane and only internal allowlisted
              egress.
          enum:
            - MODE_UNSPECIFIED
            - VIA_CONTROL_PLANE
            - NONE
      type: object
      id: ControlPlaneEgress
      description: >-
        ControlPlaneEgress defines the settings needed to enable control plane
        egress control.
    ListUsableSubnetworksResponse:
      id: ListUsableSubnetworksResponse
      description: >-
        ListUsableSubnetworksResponse is the response of
        ListUsableSubnetworksRequest.
      properties:
        subnetworks:
          items:
            $ref: '#/components/schemas/UsableSubnetwork'
          type: array
          description: A list of usable subnetworks in the specified network project.
        nextPageToken:
          description: >-
            This token allows you to get the next page of results for list
            requests. If the number of results is larger than `page_size`, use
            the `next_page_token` as a value for the query parameter
            `page_token` in the next request. The value will become empty when
            there are no more pages.
          type: string
      type: object
    NodeVfioConfig:
      description: >-
        Configuration settings for VFIO (Virtual Function I/O) on a node. VFIO
        allows safe, unprivileged, userspace drivers to access I/O devices.
      id: NodeVfioConfig
      type: object
      properties:
        dmaEntryLimit:
          type: integer
          description: >-
            Optional. Specifies the maximum number of DMA entries (pages) that
            can be mapped by the VFIO IOMMU type 1 driver for a container. This
            limit affects the total amount of host memory that can be pinned for
            direct device access, which is often critical for high-performance
            devices like TPUs and GPUs. This setting corresponds to the kernel
            parameter at:
            `/sys/module/vfio_iommu_type1/parameters/dma_entry_limit`. The
            default value in the kernel is `65535`. Higher values may be needed
            for workloads mapping large memory regions. Supported values are
            integers between `65535` and `4194304`.
          format: int32
    ManagedOpenTelemetryConfig:
      type: object
      properties:
        scope:
          type: string
          description: Scope of the Managed OpenTelemetry pipeline.
          enumDescriptions:
            - SCOPE_UNSPECIFIED is when the scope is not set.
            - NONE is used to disable the Managed OpenTelemetry pipeline.
            - >-
              COLLECTION_AND_INSTRUMENTATION_COMPONENTS is used to enable the
              Managed OpenTelemetry pipeline for collection and instrumentation
              components.
          enum:
            - SCOPE_UNSPECIFIED
            - NONE
            - COLLECTION_AND_INSTRUMENTATION_COMPONENTS
      description: >-
        ManagedOpenTelemetryConfig is the configuration for the GKE Managed
        OpenTelemetry pipeline.
      id: ManagedOpenTelemetryConfig
    UpgradeSettings:
      id: UpgradeSettings
      description: >-
        These upgrade settings control the level of parallelism and the level of
        disruption caused by an upgrade. maxUnavailable controls the number of
        nodes that can be simultaneously unavailable. maxSurge controls the
        number of additional nodes that can be added to the node pool
        temporarily for the time of the upgrade to increase the number of
        available nodes. (maxUnavailable + maxSurge) determines the level of
        parallelism (how many nodes are being upgraded at the same time). Note:
        upgrades inevitably introduce some disruption since workloads need to be
        moved from old nodes to new, upgraded ones. Even if maxUnavailable=0,
        this holds true. (Disruption stays within the limits of
        PodDisruptionBudget, if it is configured.) Consider a hypothetical node
        pool with 5 nodes having maxSurge=2, maxUnavailable=1. This means the
        upgrade process upgrades 3 nodes simultaneously. It creates 2 additional
        (upgraded) nodes, then it brings down 3 old (not yet upgraded) nodes at
        the same time. This ensures that there are always at least 4 nodes
        available. These upgrade settings configure the upgrade strategy for the
        node pool. Use strategy to switch between the strategies applied to the
        node pool. If the strategy is ROLLING, use max_surge and max_unavailable
        to control the level of parallelism and the level of disruption caused
        by upgrade. 1. maxSurge controls the number of additional nodes that can
        be added to the node pool temporarily for the time of the upgrade to
        increase the number of available nodes. 2. maxUnavailable controls the
        number of nodes that can be simultaneously unavailable. 3.
        (maxUnavailable + maxSurge) determines the level of parallelism (how
        many nodes are being upgraded at the same time). If the strategy is
        BLUE_GREEN, use blue_green_settings to configure the blue-green upgrade
        related settings. 1. standard_rollout_policy is the default policy. The
        policy is used to control the way blue pool gets drained. The draining
        is executed in the batch mode. The batch size could be specified as
        either percentage of the node pool size or the number of nodes.
        batch_soak_duration is the soak time after each batch gets drained. 2.
        node_pool_soak_duration is the soak time after all blue nodes are
        drained. After this period, the blue pool nodes will be deleted.
      properties:
        blueGreenSettings:
          description: Settings for blue-green upgrade strategy.
          $ref: '#/components/schemas/BlueGreenSettings'
        maxSurge:
          type: integer
          description: >-
            The maximum number of nodes that can be created beyond the current
            size of the node pool during the upgrade process.
          format: int32
        maxUnavailable:
          description: >-
            The maximum number of nodes that can be simultaneously unavailable
            during the upgrade process. A node is considered available if its
            status is Ready.
          format: int32
          type: integer
        strategy:
          type: string
          description: Update strategy of the node pool.
          enumDescriptions:
            - >-
              Default value if unset. GKE internally defaults the update
              strategy to SURGE for unspecified strategies.
            - blue-green upgrade.
            - >-
              SURGE is the traditional way of upgrade a node pool. max_surge and
              max_unavailable determines the level of upgrade parallelism.
            - >-
              SHORT_LIVED is the dedicated upgrade strategy for
              QueuedProvisioning and flex start node pools scaled up only by
              enqueueing to the Dynamic Workload Scheduler (DWS).
          enum:
            - NODE_POOL_UPDATE_STRATEGY_UNSPECIFIED
            - BLUE_GREEN
            - SURGE
            - SHORT_LIVED
      type: object
    MemoryManager:
      description: >-
        The option enables the Kubernetes NUMA-aware Memory Manager feature.
        Detailed description about the feature can be found
        [here](https://kubernetes.io/docs/tasks/administer-cluster/memory-manager/).
      id: MemoryManager
      type: object
      properties:
        policy:
          description: >-
            Controls the memory management policy on the Node. See
            https://kubernetes.io/docs/tasks/administer-cluster/memory-manager/#policies
            The following values are allowed. * "none" * "static" The default
            value is 'none' if unspecified.
          type: string
    VerticalPodAutoscaling:
      id: VerticalPodAutoscaling
      description: >-
        VerticalPodAutoscaling contains global, per-cluster information required
        by Vertical Pod Autoscaler to automatically adjust the resources of pods
        controlled by it.
      properties:
        enabled:
          description: Enables vertical pod autoscaling.
          type: boolean
      type: object
    NotificationConfig:
      properties:
        pubsub:
          $ref: '#/components/schemas/PubSub'
          description: Notification config for Pub/Sub.
      type: object
      id: NotificationConfig
      description: NotificationConfig is the configuration of notifications.
    NodePoolUpgradeInfo:
      id: NodePoolUpgradeInfo
      description: NodePoolUpgradeInfo contains the upgrade information of a node pool.
      properties:
        pausedReason:
          description: The auto upgrade paused reason.
          type: array
          items:
            type: string
            enumDescriptions:
              - >-
                AUTO_UPGRADE_PAUSED_REASON_UNSPECIFIED indicates an unspecified
                reason.
              - >-
                MAINTENANCE_WINDOW indicates the cluster is outside customer
                maintenance window.
              - >-
                MAINTENANCE_EXCLUSION_NO_UPGRADES indicates the cluster is in a
                maintenance exclusion with scope NO_UPGRADES.
              - >-
                MAINTENANCE_EXCLUSION_NO_MINOR_UPGRADES indicates the cluster is
                in a maintenance exclusion with scope NO_MINOR_UPGRADES.
              - >-
                SYSTEM_CONFIG indicates the cluster upgrade is paused by system
                config.
            enum:
              - AUTO_UPGRADE_PAUSED_REASON_UNSPECIFIED
              - MAINTENANCE_WINDOW
              - MAINTENANCE_EXCLUSION_NO_UPGRADES
              - MAINTENANCE_EXCLUSION_NO_MINOR_UPGRADES
              - SYSTEM_CONFIG
        endOfExtendedSupportTimestamp:
          description: >-
            The node pool's current minor version's end of extended support
            timestamp.
          type: string
        upgradeDetails:
          description: The list of past auto upgrades.
          type: array
          items:
            $ref: '#/components/schemas/UpgradeDetails'
        autoUpgradeStatus:
          items:
            enumDescriptions:
              - UNKNOWN indicates an unknown status.
              - ACTIVE indicates an active status.
              - >-
                MINOR_UPGRADE_PAUSED indicates the minor version upgrade is
                paused.
              - UPGRADE_PAUSED indicates the upgrade is paused.
            enum:
              - UNKNOWN
              - ACTIVE
              - MINOR_UPGRADE_PAUSED
              - UPGRADE_PAUSED
            type: string
          type: array
          description: The auto upgrade status.
        patchTargetVersion:
          description: patch_target_version indicates the target version for patch upgrade.
          type: string
        customImageInfo:
          description: >-
            Output only. Upgrade info for the node pool specific to the usage of
            custom images.
          $ref: '#/components/schemas/CustomImageInfo'
          readOnly: true
        minorTargetVersion:
          description: minor_target_version indicates the target version for minor upgrade.
          type: string
        endOfStandardSupportTimestamp:
          description: >-
            The node pool's current minor version's end of standard support
            timestamp.
          type: string
      type: object
    NodeConfig:
      properties:
        windowsNodeConfig:
          $ref: '#/components/schemas/WindowsNodeConfig'
          description: Parameters that can be configured on Windows nodes.
        gpuDirectConfig:
          description: The configuration for GPU Direct
          $ref: '#/components/schemas/GPUDirectConfig'
        metadata:
          type: object
          description: >-
            The metadata key/value pairs assigned to instances in the cluster.
            Keys must conform to the regexp `[a-zA-Z0-9-_]+` and be less than
            128 bytes in length. These are reflected as part of a URL in the
            metadata server. Additionally, to avoid ambiguity, keys must not
            conflict with any other metadata keys for the project or be one of
            the reserved keys: - "cluster-location" - "cluster-name" -
            "cluster-uid" - "configure-sh" - "containerd-configure-sh" -
            "enable-os-login" - "gci-ensure-gke-docker" - "gci-metrics-enabled"
            - "gci-update-strategy" - "instance-template" - "kube-env" -
            "startup-script" - "user-data" - "disable-address-manager" -
            "windows-startup-script-ps1" - "common-psm1" - "k8s-node-setup-psm1"
            - "install-ssh-psm1" - "user-profile-psm1" Values are free-form
            strings, and only have meaning as interpreted by the image running
            in the instance. The only restriction placed on them is that each
            value's size must be less than or equal to 32 KB. The total size of
            all keys and values must be less than 512 KB.
          additionalProperties:
            type: string
        diskSizeGb:
          type: integer
          description: >-
            Size of the disk attached to each node, specified in GB. The
            smallest allowed disk size is 10GB. If unspecified, the default disk
            size is 100GB.
          format: int32
        serviceAccount:
          description: >-
            The Google Cloud Platform Service Account to be used by the node
            VMs. Specify the email address of the Service Account; otherwise, if
            no Service Account is specified, the "default" service account is
            used.
          type: string
        machineType:
          description: >-
            The name of a Google Compute Engine [machine
            type](https://cloud.google.com/compute/docs/machine-types) If
            unspecified, the default machine type is `e2-medium`.
          type: string
        advancedMachineFeatures:
          $ref: '#/components/schemas/AdvancedMachineFeatures'
          description: Advanced features for the Compute Engine VM.
        bootDiskKmsKey:
          description: ' The Customer Managed Encryption Key used to encrypt the boot disk attached to each node in the node pool. This should be of the form projects/[KEY_PROJECT_ID]/locations/[LOCATION]/keyRings/[RING_NAME]/cryptoKeys/[KEY_NAME]. For more information about protecting resources with Cloud KMS Keys please see: https://cloud.google.com/compute/docs/disks/customer-managed-encryption'
          type: string
        sandboxConfig:
          description: Sandbox configuration for this node.
          $ref: '#/components/schemas/SandboxConfig'
        storagePools:
          description: List of Storage Pools where boot disks are provisioned.
          type: array
          items:
            type: string
        minCpuPlatform:
          description: >-
            Minimum CPU platform to be used by this instance. The instance may
            be scheduled on the specified or newer CPU platform. Applicable
            values are the friendly names of CPU platforms, such as
            `minCpuPlatform: "Intel Haswell"` or `minCpuPlatform: "Intel Sandy
            Bridge"`. For more information, read [how to specify min CPU
            platform](https://cloud.google.com/compute/docs/instances/specify-min-cpu-platform)
          type: string
        diskType:
          description: >-
            Type of the disk attached to each node (e.g. 'pd-standard', 'pd-ssd'
            or 'pd-balanced') If unspecified, the default disk type is
            'pd-standard'
          type: string
        resourceLabels:
          type: object
          description: >-
            The resource labels for the node pool to use to annotate any related
            Google Compute Engine resources.
          additionalProperties:
            type: string
        soleTenantConfig:
          description: >-
            Parameters for node pools to be backed by shared sole tenant node
            groups.
          $ref: '#/components/schemas/SoleTenantConfig'
        loggingConfig:
          description: Logging configuration.
          $ref: '#/components/schemas/NodePoolLoggingConfig'
        localSsdEncryptionMode:
          description: >-
            Specifies which method should be used for encrypting the Local SSDs
            attached to the node.
          enumDescriptions:
            - >-
              The given node will be encrypted using keys managed by Google
              infrastructure and the keys will be deleted when the node is
              deleted.
            - >-
              The given node will be encrypted using keys managed by Google
              infrastructure and the keys will be deleted when the node is
              deleted.
            - >-
              The given node will opt-in for using ephemeral key for encryption
              of Local SSDs. The Local SSDs will not be able to recover data in
              case of node crash.
          enum:
            - LOCAL_SSD_ENCRYPTION_MODE_UNSPECIFIED
            - STANDARD_ENCRYPTION
            - EPHEMERAL_KEY_ENCRYPTION
          type: string
        labels:
          description: >-
            The Kubernetes labels (key/value pairs) to apply to each node. The
            values in this field are added to the set of default labels
            Kubernetes applies to nodes. This field has the following
            restrictions: * Labels must use a valid Kubernetes syntax and
            character set, as defined in
            https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#syntax-and-character-set.
            * This field supports up to 1,024 total characters in a single
            request. Depending on the Kubernetes version, keys in this field
            might conflict with the keys of the default labels, which might
            change which of your labels are applied to the nodes. Assume that
            the behavior is unpredictable and avoid label key conflicts. For
            more information about the default labels, see:
            https://kubernetes.io/docs/reference/labels-annotations-taints/
          additionalProperties:
            type: string
          type: object
        preemptible:
          description: >-
            Whether the nodes are created as preemptible VM instances. See:
            https://cloud.google.com/compute/docs/instances/preemptible for more
            information about preemptible VM instances.
          type: boolean
        ephemeralStorageLocalSsdConfig:
          description: >-
            Parameters for the node ephemeral storage using Local SSDs. If
            unspecified, ephemeral storage is backed by the boot disk.
          $ref: '#/components/schemas/EphemeralStorageLocalSsdConfig'
        containerdConfig:
          $ref: '#/components/schemas/ContainerdConfig'
          description: Parameters for containerd customization.
        imageType:
          description: >-
            The image type to use for this node. Note that for a given image
            type, the latest version of it will be used. Please see
            https://cloud.google.com/kubernetes-engine/docs/concepts/node-images
            for available image types.
          type: string
        maxRunDuration:
          type: string
          description: >-
            The maximum duration for the nodes to exist. If unspecified, the
            nodes can exist indefinitely.
          format: google-duration
        spot:
          description: >-
            Spot flag for enabling Spot VM, which is a rebrand of the existing
            preemptible flag.
          type: boolean
        reservationAffinity:
          description: >-
            The optional reservation affinity. Setting this field will apply the
            specified [Zonal Compute
            Reservation](https://cloud.google.com/compute/docs/instances/reserving-zonal-resources)
            to this node pool.
          $ref: '#/components/schemas/ReservationAffinity'
        secondaryBootDiskUpdateStrategy:
          description: Secondary boot disk update strategy.
          $ref: '#/components/schemas/SecondaryBootDiskUpdateStrategy'
        localNvmeSsdBlockConfig:
          description: Parameters for using raw-block Local NVMe SSDs.
          $ref: '#/components/schemas/LocalNvmeSsdBlockConfig'
        flexStart:
          description: Flex Start flag for enabling Flex Start VM.
          type: boolean
        nodeGroup:
          description: >-
            Setting this field will assign instances of this pool to run on the
            specified node group. This is useful for running workloads on [sole
            tenant
            nodes](https://cloud.google.com/compute/docs/nodes/sole-tenant-nodes).
          type: string
        effectiveCgroupMode:
          enum:
            - EFFECTIVE_CGROUP_MODE_UNSPECIFIED
            - EFFECTIVE_CGROUP_MODE_V1
            - EFFECTIVE_CGROUP_MODE_V2
          readOnly: true
          description: >-
            Output only. effective_cgroup_mode is the cgroup mode actually used
            by the node pool. It is determined by the cgroup mode specified in
            the LinuxNodeConfig or the default cgroup mode based on the cluster
            creation version.
          enumDescriptions:
            - >-
              EFFECTIVE_CGROUP_MODE_UNSPECIFIED means the cgroup configuration
              for the node pool is unspecified, i.e. the node pool is a Windows
              node pool.
            - >-
              CGROUP_MODE_V1 means the node pool is configured to use cgroupv1
              for the cgroup configuration.
            - >-
              CGROUP_MODE_V2 means the node pool is configured to use cgroupv2
              for the cgroup configuration.
          type: string
        gcfsConfig:
          description: Google Container File System (image streaming) configs.
          $ref: '#/components/schemas/GcfsConfig'
        secondaryBootDisks:
          items:
            $ref: '#/components/schemas/SecondaryBootDisk'
          type: array
          description: List of secondary boot disks attached to the nodes.
        linuxNodeConfig:
          description: Parameters that can be configured on Linux nodes.
          $ref: '#/components/schemas/LinuxNodeConfig'
        confidentialNodes:
          description: >-
            Confidential nodes config. All the nodes in the node pool will be
            Confidential VM once enabled.
          $ref: '#/components/schemas/ConfidentialNodes'
        nodeImageConfig:
          $ref: '#/components/schemas/CustomImageConfig'
          description: >-
            The node image configuration to use for this node pool. Note that
            this is only applicable for node pools using image_type=CUSTOM.
        accelerators:
          type: array
          items:
            $ref: '#/components/schemas/AcceleratorConfig'
          description: >-
            A list of hardware accelerators to be attached to each node. See
            https://cloud.google.com/compute/docs/gpus for more information
            about support for GPUs.
        bootDisk:
          $ref: '#/components/schemas/BootDisk'
          description: The boot disk configuration for the node pool.
        workloadMetadataConfig:
          $ref: '#/components/schemas/WorkloadMetadataConfig'
          description: The workload metadata configuration for this node.
        gvnic:
          description: Enable or disable gvnic in the node pool.
          $ref: '#/components/schemas/VirtualNIC'
        fastSocket:
          $ref: '#/components/schemas/FastSocket'
          description: Enable or disable NCCL fast socket for the node pool.
        enableConfidentialStorage:
          description: Optional. Reserved for future use.
          type: boolean
        taints:
          description: >-
            List of kubernetes taints to be applied to each node. For more
            information, including usage and the valid values, see:
            https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
          items:
            $ref: '#/components/schemas/NodeTaint'
          type: array
        oauthScopes:
          type: array
          items:
            type: string
          description: >-
            The set of Google API scopes to be made available on all of the node
            VMs under the "default" service account. The following scopes are
            recommended, but not required, and by default are not included: *
            `https://www.googleapis.com/auth/compute` is required for mounting
            persistent storage on your nodes. *
            `https://www.googleapis.com/auth/devstorage.read_only` is required
            for communicating with **gcr.io** (the [Artifact
            Registry](https://cloud.google.com/artifact-registry/)). If
            unspecified, no scopes are added, unless Cloud Logging or Cloud
            Monitoring are enabled, in which case their required scopes will be
            added.
        resourceManagerTags:
          $ref: '#/components/schemas/ResourceManagerTags'
          description: >-
            A map of resource manager tag keys and values to be attached to the
            nodes.
        tags:
          description: >-
            The list of instance tags applied to all nodes. Tags are used to
            identify valid sources or targets for network firewalls and are
            specified by the client during cluster or node pool creation. Each
            tag within the list must comply with RFC1035.
          type: array
          items:
            type: string
        taintConfig:
          description: Optional. The taint configuration for the node pool.
          $ref: '#/components/schemas/TaintConfig'
        localSsdCount:
          type: integer
          description: >-
            The number of local SSD disks to be attached to the node. The limit
            for this value is dependent upon the maximum number of disks
            available on a machine per zone. See:
            https://cloud.google.com/compute/docs/disks/local-ssd for more
            information.
          format: int32
        shieldedInstanceConfig:
          $ref: '#/components/schemas/ShieldedInstanceConfig'
          description: Shielded Instance options.
        consolidationDelay:
          description: >-
            Consolidation delay defines duration after which the Cluster
            Autoscaler can scale down underutilized nodes. If not set, nodes are
            scaled down by default behavior, i.e. according to the chosen
            autoscaling profile.
          format: google-duration
          type: string
        kubeletConfig:
          $ref: '#/components/schemas/NodeKubeletConfig'
          description: Node kubelet configs.
      type: object
      id: NodeConfig
      description: >-
        Parameters that describe the nodes in a cluster. GKE Autopilot clusters
        do not recognize parameters in `NodeConfig`. Use
        AutoprovisioningNodePoolDefaults instead.
    SetMasterAuthRequest:
      type: object
      properties:
        clusterId:
          type: string
          description: >-
            Deprecated. The name of the cluster to upgrade. This field has been
            deprecated and replaced by the name field.
          deprecated: true
        update:
          description: Required. A description of the update.
          $ref: '#/components/schemas/MasterAuth'
        name:
          description: >-
            The name (project, location, cluster) of the cluster to set auth.
            Specified in the format `projects/*/locations/*/clusters/*`.
          type: string
        projectId:
          description: >-
            Deprecated. The Google Developers Console [project ID or project
            number](https://cloud.google.com/resource-manager/docs/creating-managing-projects).
            This field has been deprecated and replaced by the name field.
          deprecated: true
          type: string
        action:
          description: Required. The exact form of action to be taken on the master auth.
          enumDescriptions:
            - Operation is unknown and will error out.
            - Set the password to a user generated value.
            - Generate a new password and set it to that.
            - >-
              Set the username. If an empty username is provided, basic
              authentication is disabled for the cluster. If a non-empty
              username is provided, basic authentication is enabled, with either
              a provided password or a generated one.
          enum:
            - UNKNOWN
            - SET_PASSWORD
            - GENERATE_PASSWORD
            - SET_USERNAME
          type: string
        zone:
          type: string
          description: >-
            Deprecated. The name of the Google Compute Engine
            [zone](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster resides. This field has been deprecated and
            replaced by the name field.
          deprecated: true
      description: SetMasterAuthRequest updates the admin password of a cluster.
      id: SetMasterAuthRequest
    SetLabelsRequest:
      description: >-
        SetLabelsRequest sets the Google Cloud Platform labels on a Google
        Container Engine cluster, which will in turn set them for Google Compute
        Engine resources used by that cluster
      id: SetLabelsRequest
      type: object
      properties:
        name:
          description: >-
            The name (project, location, cluster name) of the cluster to set
            labels. Specified in the format `projects/*/locations/*/clusters/*`.
          type: string
        clusterId:
          description: >-
            Deprecated. The name of the cluster. This field has been deprecated
            and replaced by the name field.
          deprecated: true
          type: string
        resourceLabels:
          description: Required. The labels to set for that cluster.
          additionalProperties:
            type: string
          type: object
        labelFingerprint:
          description: >-
            Required. The fingerprint of the previous set of labels for this
            resource, used to detect conflicts. The fingerprint is initially
            generated by Kubernetes Engine and changes after every request to
            modify or update labels. You must always provide an up-to-date
            fingerprint hash when updating or changing labels. Make a `get()`
            request to the resource to get the latest fingerprint.
          type: string
        projectId:
          type: string
          description: >-
            Deprecated. The Google Developers Console [project ID or project
            number](https://cloud.google.com/resource-manager/docs/creating-managing-projects).
            This field has been deprecated and replaced by the name field.
          deprecated: true
        zone:
          type: string
          description: >-
            Deprecated. The name of the Google Compute Engine
            [zone](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster resides. This field has been deprecated and
            replaced by the name field.
          deprecated: true
    KubeletCertInfo:
      type: object
      properties:
        nonTpmBootstrapCertExpireTime:
          description: Output only.
          format: google-datetime
          readOnly: true
          type: string
        tpmBootstrapCertExpireTime:
          description: Output only.
          format: google-datetime
          readOnly: true
          type: string
      description: Contains expiry information about the kubelet certificate.
      id: KubeletCertInfo
    SecretSyncConfig:
      type: object
      properties:
        rotationConfig:
          $ref: '#/components/schemas/SyncRotationConfig'
          description: Rotation config for secret manager.
        enabled:
          description: Enable/Disable Secret Sync Config.
          type: boolean
      description: Configuration for sync Secret Manager secrets as k8s secrets.
      id: SecretSyncConfig
    NodeDrainConfig:
      id: NodeDrainConfig
      description: >-
        NodeDrainConfig contains the node drain related configurations for this
        node pool.
      properties:
        respectPdbDuringNodePoolDeletion:
          description: Whether to respect PDB during node pool deletion.
          type: boolean
        pdbTimeoutDuration:
          description: The duration of the PDB timeout period for node drain.
          format: google-duration
          type: string
        graceTerminationDuration:
          description: The duration of the grace termination period for node drain.
          format: google-duration
          type: string
      type: object
    MaintenanceWindow:
      type: object
      properties:
        maintenanceExclusions:
          type: object
          description: >-
            Exceptions to maintenance window. Non-emergency maintenance should
            not occur in these windows.
          additionalProperties:
            $ref: '#/components/schemas/TimeWindow'
        recurringWindow:
          $ref: '#/components/schemas/RecurringTimeWindow'
          description: >-
            RecurringWindow specifies some number of recurring time periods for
            maintenance to occur. The time windows may be overlapping. If no
            maintenance windows are set, maintenance can occur at any time.
        recurringMaintenanceWindow:
          description: >-
            RecurringMaintenanceWindow specifies some number of recurring time
            periods for maintenance to occur. The time windows may be
            overlapping. If no maintenance windows are set, maintenance can
            occur at any time. Alternative to RecurringWindow, with renamed
            fields.
          $ref: '#/components/schemas/RecurringMaintenanceWindow'
        dailyMaintenanceWindow:
          description: >-
            DailyMaintenanceWindow specifies a daily maintenance operation
            window.
          $ref: '#/components/schemas/DailyMaintenanceWindow'
      description: >-
        MaintenanceWindow defines the maintenance window to be used for the
        cluster.
      id: MaintenanceWindow
    NodeTaints:
      description: >-
        Collection of Kubernetes [node
        taints](https://kubernetes.io/docs/concepts/configuration/taint-and-toleration).
      id: NodeTaints
      type: object
      properties:
        taints:
          description: List of node taints.
          items:
            $ref: '#/components/schemas/NodeTaint'
          type: array
    MaxPodsConstraint:
      properties:
        maxPodsPerNode:
          type: string
          description: Constraint enforced on the max num of pods per node.
          format: int64
      type: object
      id: MaxPodsConstraint
      description: Constraints applied to pods.
    HostConfig:
      properties:
        header:
          type: array
          items:
            $ref: '#/components/schemas/RegistryHeader'
          description: Header configures the registry host headers.
        client:
          description: Client configures the registry host client certificate and key.
          items:
            $ref: '#/components/schemas/CertificateConfigPair'
          type: array
        capabilities:
          type: array
          items:
            type: string
            enumDescriptions:
              - UNKNOWN should never be set.
              - >-
                Pull represents the capability to fetch manifests and blobs by
                digest.
              - Resolve represents the capability to fetch manifests by name.
              - Push represents the capability to push blobs and manifests.
            enum:
              - HOST_CAPABILITY_UNSPECIFIED
              - HOST_CAPABILITY_PULL
              - HOST_CAPABILITY_RESOLVE
              - HOST_CAPABILITY_PUSH
          description: >-
            Capabilities represent the capabilities of the registry host,
            specifying what operations a host is capable of performing. If not
            set, containerd enables all capabilities by default.
        ca:
          description: CA configures the registry host certificate.
          type: array
          items:
            $ref: '#/components/schemas/CertificateConfig'
        overridePath:
          description: >-
            OverridePath is used to indicate the host's API root endpoint is
            defined in the URL path rather than by the API specification. This
            may be used with non-compliant OCI registries which are missing the
            /v2 prefix. If not set, containerd sets default false.
          type: boolean
        host:
          description: >-
            Host configures the registry host/mirror. It supports fully
            qualified domain names (FQDNs) and IP addresses. Specifying scheme,
            port or path is supported. Scheme can only be http or https.
            Wildcards are NOT supported. Examples: - `my.customdomain.com` -
            `https://my.customdomain.com/path` - `10.0.1.2:5000`
          type: string
        dialTimeout:
          type: string
          description: >-
            Specifies the maximum duration allowed for a connection attempt to
            complete. A shorter timeout helps reduce delays when falling back to
            the original registry if the mirror is unreachable. Maximum allowed
            value is 180s. If not set, containerd sets default 30s. The value
            should be a decimal number of seconds with an `s` suffix.
          format: google-duration
      type: object
      id: HostConfig
      description: HostConfig configures the registry host under a given Server.
    RecurringTimeWindow:
      description: Represents an arbitrary window of time that recurs.
      id: RecurringTimeWindow
      type: object
      properties:
        window:
          $ref: '#/components/schemas/TimeWindow'
          description: The window of the first recurrence.
        recurrence:
          description: >-
            An RRULE (https://tools.ietf.org/html/rfc5545#section-3.8.5.3) for
            how this window recurs. They go on for the span of time between the
            start and end time. For example, to have something repeat every
            weekday, you'd use: `FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR` To repeat
            some window daily (equivalent to the DailyMaintenanceWindow):
            `FREQ=DAILY` For the first weekend of every month:
            `FREQ=MONTHLY;BYSETPOS=1;BYDAY=SA,SU` This specifies how frequently
            the window starts. Eg, if you wanted to have a 9-5 UTC-4 window
            every weekday, you'd use something like: ``` start time =
            2019-01-01T09:00:00-0400 end time = 2019-01-01T17:00:00-0400
            recurrence = FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR ``` Windows can span
            multiple days. Eg, to make the window encompass every weekend from
            midnight Saturday till the last minute of Sunday UTC: ``` start time
            = 2019-01-05T00:00:00Z end time = 2019-01-07T23:59:00Z recurrence =
            FREQ=WEEKLY;BYDAY=SA ``` Note the start and end time's specific
            dates are largely arbitrary except to specify duration of the window
            and when it first starts. The FREQ values of HOURLY, MINUTELY, and
            SECONDLY are not supported.
          type: string
    CheckAutopilotCompatibilityResponse:
      id: CheckAutopilotCompatibilityResponse
      description: CheckAutopilotCompatibilityResponse has a list of compatibility issues.
      properties:
        issues:
          description: The list of issues for the given operation.
          type: array
          items:
            $ref: '#/components/schemas/AutopilotCompatibilityIssue'
        summary:
          description: The summary of the autopilot compatibility response.
          type: string
      type: object
    StatusCondition:
      id: StatusCondition
      description: >-
        StatusCondition describes why a cluster or a node pool has a certain
        status (e.g., ERROR or DEGRADED).
      properties:
        message:
          description: Human-friendly representation of the condition
          type: string
        code:
          enum:
            - UNKNOWN
            - GCE_STOCKOUT
            - GKE_SERVICE_ACCOUNT_DELETED
            - GCE_QUOTA_EXCEEDED
            - SET_BY_OPERATOR
            - CLOUD_KMS_KEY_ERROR
            - CA_EXPIRING
            - NODE_SERVICE_ACCOUNT_MISSING_PERMISSIONS
            - CLOUD_KMS_KEY_DESTROYED
          description: >-
            Machine-friendly representation of the condition Deprecated. Use
            canonical_code instead.
          deprecated: true
          enumDescriptions:
            - UNKNOWN indicates a generic condition.
            - >-
              GCE_STOCKOUT indicates that Google Compute Engine resources are
              temporarily unavailable.
            - >-
              GKE_SERVICE_ACCOUNT_DELETED indicates that the user deleted their
              robot service account.
            - Google Compute Engine quota was exceeded.
            - >-
              Cluster state was manually changed by an SRE due to a system logic
              error.
            - >-
              Unable to perform an encrypt operation against the CloudKMS key
              used for etcd level encryption.
            - Cluster CA is expiring soon.
            - Node service account is missing permissions.
            - >-
              Cloud KMS key version used for etcd level encryption has been
              destroyed. This is a permanent error.
          type: string
        canonicalCode:
          description: Canonical code of the condition.
          enumDescriptions:
            - 'Not an error; returned on success. HTTP Mapping: 200 OK'
            - >-
              The operation was cancelled, typically by the caller. HTTP
              Mapping: 499 Client Closed Request
            - >-
              Unknown error. For example, this error may be returned when a
              `Status` value received from another address space belongs to an
              error space that is not known in this address space. Also errors
              raised by APIs that do not return enough error information may be
              converted to this error. HTTP Mapping: 500 Internal Server Error
            - >-
              The client specified an invalid argument. Note that this differs
              from `FAILED_PRECONDITION`. `INVALID_ARGUMENT` indicates arguments
              that are problematic regardless of the state of the system (e.g.,
              a malformed file name). HTTP Mapping: 400 Bad Request
            - >-
              The deadline expired before the operation could complete. For
              operations that change the state of the system, this error may be
              returned even if the operation has completed successfully. For
              example, a successful response from a server could have been
              delayed long enough for the deadline to expire. HTTP Mapping: 504
              Gateway Timeout
            - >-
              Some requested entity (e.g., file or directory) was not found.
              Note to server developers: if a request is denied for an entire
              class of users, such as gradual feature rollout or undocumented
              allowlist, `NOT_FOUND` may be used. If a request is denied for
              some users within a class of users, such as user-based access
              control, `PERMISSION_DENIED` must be used. HTTP Mapping: 404 Not
              Found
            - >-
              The entity that a client attempted to create (e.g., file or
              directory) already exists. HTTP Mapping: 409 Conflict
            - >-
              The caller does not have permission to execute the specified
              operation. `PERMISSION_DENIED` must not be used for rejections
              caused by exhausting some resource (use `RESOURCE_EXHAUSTED`
              instead for those errors). `PERMISSION_DENIED` must not be used if
              the caller can not be identified (use `UNAUTHENTICATED` instead
              for those errors). This error code does not imply the request is
              valid or the requested entity exists or satisfies other
              pre-conditions. HTTP Mapping: 403 Forbidden
            - >-
              The request does not have valid authentication credentials for the
              operation. HTTP Mapping: 401 Unauthorized
            - >-
              Some resource has been exhausted, perhaps a per-user quota, or
              perhaps the entire file system is out of space. HTTP Mapping: 429
              Too Many Requests
            - >-
              The operation was rejected because the system is not in a state
              required for the operation's execution. For example, the directory
              to be deleted is non-empty, an rmdir operation is applied to a
              non-directory, etc. Service implementors can use the following
              guidelines to decide between `FAILED_PRECONDITION`, `ABORTED`, and
              `UNAVAILABLE`: (a) Use `UNAVAILABLE` if the client can retry just
              the failing call. (b) Use `ABORTED` if the client should retry at
              a higher level. For example, when a client-specified test-and-set
              fails, indicating the client should restart a read-modify-write
              sequence. (c) Use `FAILED_PRECONDITION` if the client should not
              retry until the system state has been explicitly fixed. For
              example, if an "rmdir" fails because the directory is non-empty,
              `FAILED_PRECONDITION` should be returned since the client should
              not retry unless the files are deleted from the directory. HTTP
              Mapping: 400 Bad Request
            - >-
              The operation was aborted, typically due to a concurrency issue
              such as a sequencer check failure or transaction abort. See the
              guidelines above for deciding between `FAILED_PRECONDITION`,
              `ABORTED`, and `UNAVAILABLE`. HTTP Mapping: 409 Conflict
            - >-
              The operation was attempted past the valid range. E.g., seeking or
              reading past end-of-file. Unlike `INVALID_ARGUMENT`, this error
              indicates a problem that may be fixed if the system state changes.
              For example, a 32-bit file system will generate `INVALID_ARGUMENT`
              if asked to read at an offset that is not in the range [0,2^32-1],
              but it will generate `OUT_OF_RANGE` if asked to read from an
              offset past the current file size. There is a fair bit of overlap
              between `FAILED_PRECONDITION` and `OUT_OF_RANGE`. We recommend
              using `OUT_OF_RANGE` (the more specific error) when it applies so
              that callers who are iterating through a space can easily look for
              an `OUT_OF_RANGE` error to detect when they are done. HTTP
              Mapping: 400 Bad Request
            - >-
              The operation is not implemented or is not supported/enabled in
              this service. HTTP Mapping: 501 Not Implemented
            - >-
              Internal errors. This means that some invariants expected by the
              underlying system have been broken. This error code is reserved
              for serious errors. HTTP Mapping: 500 Internal Server Error
            - >-
              The service is currently unavailable. This is most likely a
              transient condition, which can be corrected by retrying with a
              backoff. Note that it is not always safe to retry non-idempotent
              operations. See the guidelines above for deciding between
              `FAILED_PRECONDITION`, `ABORTED`, and `UNAVAILABLE`. HTTP Mapping:
              503 Service Unavailable
            - >-
              Unrecoverable data loss or corruption. HTTP Mapping: 500 Internal
              Server Error
          enum:
            - OK
            - CANCELLED
            - UNKNOWN
            - INVALID_ARGUMENT
            - DEADLINE_EXCEEDED
            - NOT_FOUND
            - ALREADY_EXISTS
            - PERMISSION_DENIED
            - UNAUTHENTICATED
            - RESOURCE_EXHAUSTED
            - FAILED_PRECONDITION
            - ABORTED
            - OUT_OF_RANGE
            - UNIMPLEMENTED
            - INTERNAL
            - UNAVAILABLE
            - DATA_LOSS
          type: string
      type: object
    LinuxNodeConfig:
      type: object
      properties:
        sysctls:
          type: object
          description: >-
            The Linux kernel parameters to be applied to the nodes and all pods
            running on the nodes. The following parameters are supported.
            net.core.busy_poll net.core.busy_read net.core.netdev_max_backlog
            net.core.rmem_max net.core.rmem_default net.core.wmem_default
            net.core.wmem_max net.core.optmem_max net.core.somaxconn
            net.ipv4.neigh.default.gc_thresh1 net.ipv4.neigh.default.gc_thresh2
            net.ipv4.neigh.default.gc_thresh3 net.ipv4.tcp_rmem
            net.ipv4.tcp_wmem net.ipv4.tcp_tw_reuse net.ipv4.tcp_mtu_probing
            net.ipv4.tcp_max_orphans net.ipv4.tcp_max_tw_buckets
            net.ipv4.tcp_syn_retries net.ipv4.tcp_ecn
            net.ipv4.tcp_congestion_control net.netfilter.nf_conntrack_max
            net.netfilter.nf_conntrack_buckets
            net.netfilter.nf_conntrack_tcp_timeout_close_wait
            net.netfilter.nf_conntrack_tcp_timeout_time_wait
            net.netfilter.nf_conntrack_tcp_timeout_established
            net.netfilter.nf_conntrack_acct kernel.keys.maxkeys
            kernel.keys.maxbytes kernel.shmmni kernel.shmmax kernel.shmall
            kernel.core_pattern kernel.perf_event_paranoid
            kernel.sched_rt_runtime_us kernel.softlockup_panic
            kernel.yama.ptrace_scope kernel.kptr_restrict kernel.dmesg_restrict
            kernel.sysrq fs.aio-max-nr fs.file-max fs.inotify.max_user_instances
            fs.inotify.max_user_watches fs.nr_open vm.dirty_background_ratio
            vm.dirty_background_bytes vm.dirty_expire_centisecs vm.dirty_ratio
            vm.dirty_bytes vm.dirty_writeback_centisecs vm.max_map_count
            vm.overcommit_memory vm.overcommit_ratio vm.vfs_cache_pressure
            vm.swappiness vm.watermark_scale_factor vm.min_free_kbytes
          additionalProperties:
            type: string
        transparentHugepageDefrag:
          type: string
          description: >-
            Optional. Defines the transparent hugepage defrag configuration on
            the node. VM hugepage allocation can be managed by either limiting
            defragmentation for delayed allocation or skipping it entirely for
            immediate allocation only. See
            https://docs.kernel.org/admin-guide/mm/transhuge.html for more
            details.
          enumDescriptions:
            - Default value. GKE will not modify the kernel configuration.
            - >-
              It means that an application requesting THP will stall on
              allocation failure and directly reclaim pages and compact memory
              in an effort to allocate a THP immediately.
            - >-
              It means that an application will wake kswapd in the background to
              reclaim pages and wake kcompactd to compact memory so that THP is
              available in the near future. It's the responsibility of
              khugepaged to then install the THP pages later.
            - >-
              It means that an application will enter direct reclaim and
              compaction like always, but only for regions that have used
              madvise(MADV_HUGEPAGE); all other regions will wake kswapd in the
              background to reclaim pages and wake kcompactd to compact memory
              so that THP is available in the near future.
            - >-
              It means that an application will enter direct reclaim like always
              but only for regions that are have used madvise(MADV_HUGEPAGE).
              This is the default kernel configuration.
            - >-
              It means that an application will never enter direct reclaim or
              compaction.
          enum:
            - TRANSPARENT_HUGEPAGE_DEFRAG_UNSPECIFIED
            - TRANSPARENT_HUGEPAGE_DEFRAG_ALWAYS
            - TRANSPARENT_HUGEPAGE_DEFRAG_DEFER
            - TRANSPARENT_HUGEPAGE_DEFRAG_DEFER_WITH_MADVISE
            - TRANSPARENT_HUGEPAGE_DEFRAG_MADVISE
            - TRANSPARENT_HUGEPAGE_DEFRAG_NEVER
        diskIoScheduler:
          $ref: '#/components/schemas/DiskIoScheduler'
          description: Optional. Controls the configuration for the disk IO scheduler.
        transparentHugepageEnabled:
          type: string
          description: >-
            Optional. Transparent hugepage support for anonymous memory can be
            entirely disabled (mostly for debugging purposes) or only enabled
            inside MADV_HUGEPAGE regions (to avoid the risk of consuming more
            memory resources) or enabled system wide. See
            https://docs.kernel.org/admin-guide/mm/transhuge.html for more
            details.
          enumDescriptions:
            - Default value. GKE will not modify the kernel configuration.
            - >-
              Transparent hugepage support for anonymous memory is enabled
              system wide.
            - >-
              Transparent hugepage support for anonymous memory is enabled
              inside MADV_HUGEPAGE regions. This is the default kernel
              configuration.
            - Transparent hugepage support for anonymous memory is disabled.
          enum:
            - TRANSPARENT_HUGEPAGE_ENABLED_UNSPECIFIED
            - TRANSPARENT_HUGEPAGE_ENABLED_ALWAYS
            - TRANSPARENT_HUGEPAGE_ENABLED_MADVISE
            - TRANSPARENT_HUGEPAGE_ENABLED_NEVER
        nodeKernelModuleLoading:
          description: >-
            Optional. Configuration for kernel module loading on nodes. When
            enabled, the node pool will be provisioned with a
            Container-Optimized OS image that enforces kernel module signature
            verification.
          $ref: '#/components/schemas/NodeKernelModuleLoading'
        nodeVfioConfig:
          description: Optional. Contains VFIO-related configurations for this node.
          $ref: '#/components/schemas/NodeVfioConfig'
        customNodeInit:
          $ref: '#/components/schemas/CustomNodeInit'
          description: >-
            Optional. Allow users to run arbitrary bash script or container on
            the node.
        hugepages:
          description: Optional. Amounts for 2M and 1G hugepages
          $ref: '#/components/schemas/HugepagesConfig'
        swapConfig:
          description: >-
            Optional. Enables and configures swap space on nodes. If omitted,
            swap is disabled.
          $ref: '#/components/schemas/SwapConfig'
        cgroupMode:
          description: cgroup_mode specifies the cgroup mode to be used on the node.
          enumDescriptions:
            - >-
              CGROUP_MODE_UNSPECIFIED is when unspecified cgroup configuration
              is used. The default for the GKE node OS image will be used.
            - >-
              CGROUP_MODE_V1 specifies to use cgroupv1 for the cgroup
              configuration on the node image.
            - >-
              CGROUP_MODE_V2 specifies to use cgroupv2 for the cgroup
              configuration on the node image.
          enum:
            - CGROUP_MODE_UNSPECIFIED
            - CGROUP_MODE_V1
            - CGROUP_MODE_V2
          type: string
        accurateTimeConfig:
          description: Optional. The accurate time configuration for the node pool.
          $ref: '#/components/schemas/AccurateTimeConfig'
      description: Parameters that can be configured on Linux nodes.
      id: LinuxNodeConfig
    OperationError:
      description: >-
        OperationError records errors seen from CloudKMS keys encountered during
        updates to DatabaseEncryption configuration.
      id: OperationError
      type: object
      properties:
        errorMessage:
          description: Description of the error seen during the operation.
          type: string
        timestamp:
          type: string
          description: Time when the CloudKMS error was seen.
          format: google-datetime
        keyName:
          description: CloudKMS key resource that had the error.
          type: string
    ClusterPolicyConfig:
      id: ClusterPolicyConfig
      description: ClusterPolicyConfig stores the configuration for cluster wide policies.
      properties:
        noSystemMutation:
          description: >-
            Denotes that preventing creation and mutation of resources in GKE
            managed namespaces and cluster-scoped GKE managed resources .
          type: boolean
        noStandardNodePools:
          description: >-
            Denotes preventing standard node pools and requiring only autopilot
            node pools.
          type: boolean
        noUnsafeWebhooks:
          description: Denotes preventing unsafe webhooks.
          type: boolean
        noSystemImpersonation:
          description: Denotes preventing impersonation and CSRs for GKE System users.
          type: boolean
      type: object
    StatefulHAConfig:
      id: StatefulHAConfig
      description: Configuration for the Stateful HA add-on.
      properties:
        enabled:
          description: Whether the Stateful HA add-on is enabled for this cluster.
          type: boolean
      type: object
    Filter:
      description: >-
        Allows filtering to one or more specific event types. If event types are
        present, those and only those event types will be transmitted to the
        cluster. Other types will be skipped. If no filter is specified, or no
        event types are present, all event types will be sent
      id: Filter
      type: object
      properties:
        eventType:
          description: Event types to allowlist.
          type: array
          items:
            enumDescriptions:
              - Not set, will be ignored.
              - Corresponds with UpgradeAvailableEvent.
              - Corresponds with UpgradeEvent.
              - Corresponds with SecurityBulletinEvent.
              - Corresponds with UpgradeInfoEvent.
            enum:
              - EVENT_TYPE_UNSPECIFIED
              - UPGRADE_AVAILABLE_EVENT
              - UPGRADE_EVENT
              - SECURITY_BULLETIN_EVENT
              - UPGRADE_INFO_EVENT
            type: string
    WritableCgroups:
      properties:
        enabled:
          description: Optional. Whether writable cgroups is enabled.
          type: boolean
      type: object
      id: WritableCgroups
      description: Defines writable cgroups configuration.
    Jwk:
      type: object
      properties:
        'y':
          description: Used for ECDSA keys.
          type: string
        use:
          description: Permitted uses for the public keys.
          type: string
        kid:
          description: Key ID.
          type: string
        crv:
          description: Used for ECDSA keys.
          type: string
        alg:
          description: Algorithm.
          type: string
        e:
          description: Used for RSA keys.
          type: string
        kty:
          description: Key Type.
          type: string
        'n':
          description: Used for RSA keys.
          type: string
        x:
          description: Used for ECDSA keys.
          type: string
      description: Jwk is a JSON Web Key as specified in RFC 7517
      id: Jwk
    CidrBlock:
      id: CidrBlock
      description: CidrBlock contains an optional name and one CIDR block.
      properties:
        displayName:
          description: display_name is an optional field for users to identify CIDR blocks.
          type: string
        cidrBlock:
          description: cidr_block must be specified in CIDR notation.
          type: string
      type: object
    DataplaneV2Config:
      description: DataplaneV2Config is the configuration for DPv2.
      id: DataplaneV2Config
      type: object
      properties:
        scalabilityMode:
          type: string
          description: Optional. Scalability mode for the cluster.
          enumDescriptions:
            - Default value.
            - Disables the scale optimized mode for DPv2.
            - Enables the scale optimized mode for DPv2.
          enum:
            - SCALABILITY_MODE_UNSPECIFIED
            - DISABLED
            - SCALE_OPTIMIZED
    Autopilot:
      type: object
      properties:
        workloadPolicyConfig:
          $ref: '#/components/schemas/WorkloadPolicyConfig'
          description: >-
            WorkloadPolicyConfig is the configuration related to GCW workload
            policy
        privilegedAdmissionConfig:
          description: >-
            PrivilegedAdmissionConfig is the configuration related to privileged
            admission control.
          $ref: '#/components/schemas/PrivilegedAdmissionConfig'
        enabled:
          description: Enable Autopilot
          type: boolean
        clusterPolicyConfig:
          $ref: '#/components/schemas/ClusterPolicyConfig'
          description: >-
            ClusterPolicyConfig denotes cluster level policies that are enforced
            for the cluster.
      description: Autopilot is the configuration for Autopilot settings on the cluster.
      id: Autopilot
    NodeTaint:
      type: object
      properties:
        key:
          description: Key for taint.
          type: string
        value:
          description: Value for taint.
          type: string
        effect:
          description: Effect for taint.
          enumDescriptions:
            - Not set
            - NoSchedule
            - PreferNoSchedule
            - NoExecute
          enum:
            - EFFECT_UNSPECIFIED
            - NO_SCHEDULE
            - PREFER_NO_SCHEDULE
            - NO_EXECUTE
          type: string
      description: >-
        Kubernetes taint is composed of three fields: key, value, and effect.
        Effect can only be one of three types: NoSchedule, PreferNoSchedule or
        NoExecute. See
        [here](https://kubernetes.io/docs/concepts/configuration/taint-and-toleration)
        for more information, including usage and the valid values.
      id: NodeTaint
    AnonymousAuthenticationConfig:
      description: >-
        AnonymousAuthenticationConfig defines the settings needed to limit
        endpoints that allow anonymous authentication.
      id: AnonymousAuthenticationConfig
      type: object
      properties:
        mode:
          description: Defines the mode of limiting anonymous access in the cluster.
          enumDescriptions:
            - Default value not specified.
            - Anonymous authentication is allowed for all endpoints.
            - >-
              Anonymous authentication is allowed for only health check
              endpoints.
          enum:
            - MODE_UNSPECIFIED
            - ENABLED
            - LIMITED
          type: string
    SetAddonsConfigRequest:
      type: object
      properties:
        clusterId:
          type: string
          description: >-
            Deprecated. The name of the cluster to upgrade. This field has been
            deprecated and replaced by the name field.
          deprecated: true
        name:
          description: >-
            The name (project, location, cluster) of the cluster to set addons.
            Specified in the format `projects/*/locations/*/clusters/*`.
          type: string
        zone:
          type: string
          description: >-
            Deprecated. The name of the Google Compute Engine
            [zone](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster resides. This field has been deprecated and
            replaced by the name field.
          deprecated: true
        addonsConfig:
          description: >-
            Required. The desired configurations for the various addons
            available to run in the cluster.
          $ref: '#/components/schemas/AddonsConfig'
        projectId:
          type: string
          description: >-
            Deprecated. The Google Developers Console [project ID or project
            number](https://cloud.google.com/resource-manager/docs/creating-managing-projects).
            This field has been deprecated and replaced by the name field.
          deprecated: true
      description: SetAddonsConfigRequest sets the addons associated with the cluster.
      id: SetAddonsConfigRequest
    ClientCertificateConfig:
      type: object
      properties:
        issueClientCertificate:
          description: Issue a client certificate.
          type: boolean
      description: Configuration for client certificates on the cluster.
      id: ClientCertificateConfig
    ResourceUsageExportConfig:
      properties:
        consumptionMeteringConfig:
          description: Configuration to enable resource consumption metering.
          $ref: '#/components/schemas/ConsumptionMeteringConfig'
        enableNetworkEgressMetering:
          description: >-
            Whether to enable network egress metering for this cluster. If
            enabled, a daemonset will be created in the cluster to meter network
            egress traffic.
          type: boolean
        bigqueryDestination:
          $ref: '#/components/schemas/BigQueryDestination'
          description: Configuration to use BigQuery as usage export destination.
      type: object
      id: ResourceUsageExportConfig
      description: Configuration for exporting cluster resource usages.
    GkeBackupAgentConfig:
      id: GkeBackupAgentConfig
      description: Configuration for the Backup for GKE Agent.
      properties:
        enabled:
          description: Whether the Backup for GKE agent is enabled for this cluster.
          type: boolean
      type: object
    ControlPlaneEndpointsConfig:
      id: ControlPlaneEndpointsConfig
      description: Configuration for all of the cluster's control plane endpoints.
      properties:
        dnsEndpointConfig:
          $ref: '#/components/schemas/DNSEndpointConfig'
          description: DNS endpoint configuration.
        ipEndpointsConfig:
          description: IP endpoints configuration.
          $ref: '#/components/schemas/IPEndpointsConfig'
      type: object
    RayClusterMonitoringConfig:
      description: >-
        RayClusterMonitoringConfig specifies monitoring configuration for Ray
        clusters.
      id: RayClusterMonitoringConfig
      type: object
      properties:
        enabled:
          description: Enable metrics collection for Ray clusters.
          type: boolean
    DisruptionBudget:
      id: DisruptionBudget
      description: >-
        DisruptionBudget defines the upgrade disruption budget for the cluster
        control plane.
      properties:
        lastMinorVersionDisruptionTime:
          description: >-
            Output only. The last time a minor version upgrade was performed on
            the control plane.
          format: google-datetime
          readOnly: true
          type: string
        minorVersionDisruptionInterval:
          type: string
          description: >-
            Optional. The minimum duration between two minor version upgrades of
            the control plane.
          format: google-duration
        patchVersionDisruptionInterval:
          description: >-
            Optional. The minimum duration between two patch version upgrades of
            the control plane.
          format: google-duration
          type: string
        lastDisruptionTime:
          readOnly: true
          type: string
          description: >-
            Output only. The last time a disruption was performed on the control
            plane.
          format: google-datetime
      type: object
    IntraNodeVisibilityConfig:
      description: >-
        IntraNodeVisibilityConfig contains the desired config of the intra-node
        visibility on this cluster.
      id: IntraNodeVisibilityConfig
      type: object
      properties:
        enabled:
          description: Enables intra node visibility for this cluster.
          type: boolean
    NodeKernelModuleLoading:
      description: Configuration for kernel module loading on nodes.
      id: NodeKernelModuleLoading
      type: object
      properties:
        policy:
          description: Set the node module loading policy for nodes in the node pool.
          enumDescriptions:
            - >-
              Default behavior. GKE selects the image based on node type. For
              CPU and TPU nodes, the image will not allow loading external
              kernel modules. For GPU nodes, the image will allow loading any
              module, whether it is signed or not.
            - >-
              Enforced signature verification: Node pools will use a
              Container-Optimized OS image configured to allow loading of
              *Google-signed* external kernel modules. Loadpin is enabled but
              configured to exclude modules, and kernel module signature
              checking is enforced.
            - >-
              Mirrors existing DEFAULT behavior: For CPU and TPU nodes, the
              image will not allow loading external kernel modules. For GPU
              nodes, the image will allow loading any module, whether it is
              signed or not.
          enum:
            - POLICY_UNSPECIFIED
            - ENFORCE_SIGNED_MODULES
            - DO_NOT_ENFORCE_SIGNED_MODULES
          type: string
    ShieldedInstanceConfig:
      id: ShieldedInstanceConfig
      description: A set of Shielded Instance options.
      properties:
        enableSecureBoot:
          description: >-
            Defines whether the instance has Secure Boot enabled. Secure Boot
            helps ensure that the system only runs authentic software by
            verifying the digital signature of all boot components, and halting
            the boot process if signature verification fails.
          type: boolean
        enableIntegrityMonitoring:
          description: >-
            Defines whether the instance has integrity monitoring enabled.
            Enables monitoring and attestation of the boot integrity of the
            instance. The attestation is performed against the integrity policy
            baseline. This baseline is initially derived from the implicitly
            trusted boot image when the instance is created.
          type: boolean
      type: object
    InitScript:
      type: object
      properties:
        args:
          description: >-
            Optional. The optional arguments line to be passed to the init
            script.
          items:
            type: string
          type: array
        gcsUri:
          description: >-
            The Cloud Storage URI for storing the init script. Format:
            gs://BUCKET_NAME/OBJECT_NAME The service account on the node pool
            must have read access to the object. User can't configure both
            gcs_uri and gcp_secret_manager_secret_uri.
          type: string
        gcsGeneration:
          description: >-
            The generation of the init script stored in Gloud Storage. This is
            the required field to identify the version of the init script. User
            can get the genetaion from `gcloud storage objects describe
            gs://BUCKET_NAME/OBJECT_NAME --format="value(generation)"` or from
            the "Version history" tab of the object in the Cloud Console UI.
          format: int64
          type: string
        gcpSecretManagerSecretUri:
          description: >-
            The resource name of the secret manager secret hosting the init
            script. Both global and regional secrets are supported with format
            below: Global secret:
            projects/{project}/secrets/{secret}/versions/{version} Regional
            secret:
            projects/{project}/locations/{location}/secrets/{secret}/versions/{version}
            Example: projects/1234567890/secrets/script_1/versions/1. Accept
            version number only, not support version alias. User can't configure
            both gcp_secret_manager_secret_uri and gcs_uri.
          type: string
      description: InitScript provide a simply bash script to be executed on the node.
      id: InitScript
    GetOpenIDConfigResponse:
      type: object
      properties:
        jwks_uri:
          description: JSON Web Key uri.
          type: string
        response_types_supported:
          description: Supported response types.
          items:
            type: string
          type: array
        cacheHeader:
          $ref: '#/components/schemas/HttpCacheControlResponseHeader'
          description: >-
            For HTTP requests, this field is automatically extracted into the
