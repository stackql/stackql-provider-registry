          items:
            $ref: '#/components/schemas/RegistryHostConfig'
          type: array
      type: object
      id: ContainerdConfig
      description: ContainerdConfig contains configuration to customize containerd.
    AcceleratorConfig:
      properties:
        gpuPartitionSize:
          description: >-
            Size of partitions to create on the GPU. Valid values are described
