          $ref: '#/components/schemas/CostManagementConfig'
        desiredAdditionalIpRangesConfig:
          description: >-
            The desired config for additional subnetworks attached to the
            cluster.
          $ref: '#/components/schemas/DesiredAdditionalIPRangesConfig'
        desiredL4ilbSubsettingConfig:
          description: The desired L4 Internal Load Balancer Subsetting configuration.
