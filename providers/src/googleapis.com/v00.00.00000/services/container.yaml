          deprecated: true
    CertificateConfig:
      description: CertificateConfig configures certificate for the registry.
      id: CertificateConfig
      type: object
      properties:
        gcpSecretManagerSecretUri:
          description: >-
            The URI configures a secret from [Secret
            Manager](https://cloud.google.com/secret-manager) in the format
            "projects/$PROJECT_ID/secrets/$SECRET_NAME/versions/$VERSION" for
            global secret or
            "projects/$PROJECT_ID/locations/$REGION/secrets/$SECRET_NAME/versions/$VERSION"
            for regional secret. Version can be fixed (e.g. "2") or "latest"
          type: string
    SyncRotationConfig:
      properties:
        enabled:
          description: Whether the rotation is enabled.
          type: boolean
        rotationInterval:
          description: >-
            The interval between two consecutive rotations. Default rotation
            interval is 2 minutes.
          format: google-duration
          type: string
      type: object
      id: SyncRotationConfig
      description: SyncRotationConfig is config for secret manager auto rotation.
    SecretManagerConfig:
      type: object
      properties:
        enabled:
          description: Enable/Disable Secret Manager Config.
          type: boolean
        rotationConfig:
          $ref: '#/components/schemas/RotationConfig'
          description: Rotation config for secret manager.
      description: SecretManagerConfig is config for secret manager enablement.
      id: SecretManagerConfig
    BootDisk:
      type: object
      properties:
        diskType:
          description: >-
            Disk type of the boot disk. (i.e. Hyperdisk-Balanced, PD-Balanced,
            etc.)
          type: string
        provisionedThroughput:
          description: >-
            For Hyperdisk-Balanced only, the provisioned throughput config
            value.
          format: int64
          type: string
        sizeGb:
          description: Disk size in GB. Replaces NodeConfig.disk_size_gb
          format: int64
          type: string
        provisionedIops:
          description: For Hyperdisk-Balanced only, the provisioned IOPS config value.
          format: int64
          type: string
      description: BootDisk specifies the boot disk configuration for node pools.
      id: BootDisk
    EphemeralLocalSsdProfile:
      description: Swap on the local SSD shared with pod ephemeral storage.
      id: EphemeralLocalSsdProfile
      type: object
      properties:
        swapSizeGib:
          type: string
          description: Specifies the size of the swap space in gibibytes (GiB).
          format: int64
        swapSizePercent:
          type: integer
          description: >-
            Specifies the size of the swap space as a percentage of the
            ephemeral local SSD capacity.
          format: int32
    PodCIDROverprovisionConfig:
      id: PodCIDROverprovisionConfig
      description: '[PRIVATE FIELD] Config for pod CIDR size overprovisioning.'
      properties:
        disable:
          description: >-
            Whether Pod CIDR overprovisioning is disabled. Note: Pod CIDR
            overprovisioning is enabled by default.
          type: boolean
      type: object
    DefaultComputeClassConfig:
      properties:
        enabled:
          description: Enables default compute class.
          type: boolean
      type: object
      id: DefaultComputeClassConfig
      description: DefaultComputeClassConfig defines default compute class configuration.
    ConfigConnectorConfig:
      properties:
        enabled:
          description: Whether Cloud Connector is enabled for this cluster.
          type: boolean
      type: object
      id: ConfigConnectorConfig
      description: Configuration options for the Config Connector add-on.
    BestEffortProvisioning:
      type: object
      properties:
        enabled:
          description: >-
            When this is enabled, cluster/node pool creations will ignore
            non-fatal errors like stockout to best provision as many nodes as
            possible right now and eventually bring up all target number of
            nodes
          type: boolean
        minProvisionNodes:
          type: integer
          description: >-
            Minimum number of nodes to be provisioned to be considered as
            succeeded, and the rest of nodes will be provisioned gradually and
            eventually when stockout issue has been resolved.
          format: int32
      description: Best effort provisioning.
      id: BestEffortProvisioning
    WorkloadIdentityConfig:
      properties:
        workloadPool:
          description: The workload pool to attach all Kubernetes service accounts to.
          type: string
      type: object
      id: WorkloadIdentityConfig
      description: >-
        Configuration for the use of Kubernetes Service Accounts in IAM
        policies.
    NodeLabels:
      type: object
      properties:
        labels:
          description: Map of node label keys and node label values.
          additionalProperties:
            type: string
          type: object
      description: >-
        Collection of node-level [Kubernetes
        labels](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels).
      id: NodeLabels
    NodeConfigDefaults:
      type: object
      properties:
        gcfsConfig:
          description: GCFS (Google Container File System, also known as Riptide) options.
          $ref: '#/components/schemas/GcfsConfig'
        loggingConfig:
          $ref: '#/components/schemas/NodePoolLoggingConfig'
          description: Logging configuration for node pools.
        containerdConfig:
          description: Parameters for containerd customization.
          $ref: '#/components/schemas/ContainerdConfig'
        nodeKubeletConfig:
          $ref: '#/components/schemas/NodeKubeletConfig'
          description: >-
            NodeKubeletConfig controls the defaults for new node-pools.
            Currently only `insecure_kubelet_readonly_port_enabled` can be set
            here.
      description: Subset of NodeConfig message that has defaults.
      id: NodeConfigDefaults
    UpdateNodePoolRequest:
      id: UpdateNodePoolRequest
      description: UpdateNodePoolRequests update a node pool's image and/or version.
      properties:
        fastSocket:
          description: Enable or disable NCCL fast socket for the node pool.
          $ref: '#/components/schemas/FastSocket'
        maintenancePolicy:
          description: >-
            Optional. Specifies the maintenance policy for the node pool,
            including maintenance exclusion options.
          $ref: '#/components/schemas/NodePoolMaintenancePolicy'
        taints:
          $ref: '#/components/schemas/NodeTaints'
          description: >-
            The desired node taints to be applied to all nodes in the node pool.
            If this field is not present, the taints will not be changed.
            Otherwise, the existing node taints will be *replaced* with the
            provided taints.
        nodeDrainConfig:
          $ref: '#/components/schemas/NodeDrainConfig'
          description: The desired node drain configuration for nodes in the node pool.
        nodePoolId:
          type: string
          description: >-
            Deprecated. The name of the node pool to upgrade. This field has
            been deprecated and replaced by the name field.
          deprecated: true
        labels:
          $ref: '#/components/schemas/NodeLabels'
          description: >-
            The desired node labels to be applied to all nodes in the node pool.
            If this field is not present, the labels will not be changed.
            Otherwise, the existing node labels will be *replaced* with the
            provided labels.
        resourceManagerTags:
          description: >-
            Desired resource manager tag keys and values to be attached to the
            nodes for managing Compute Engine firewalls using Network Firewall
            Policies. Existing tags will be replaced with new values.
          $ref: '#/components/schemas/ResourceManagerTags'
        tags:
          $ref: '#/components/schemas/NetworkTags'
          description: >-
            The desired network tags to be applied to all nodes in the node
            pool. If this field is not present, the tags will not be changed.
            Otherwise, the existing network tags will be *replaced* with the
            provided tags.
        taintConfig:
          $ref: '#/components/schemas/TaintConfig'
          description: The taint configuration for the node pool.
        containerdConfig:
          description: >-
            The desired containerd config for nodes in the node pool. Initiates
            an upgrade operation that recreates the nodes with the new config.
          $ref: '#/components/schemas/ContainerdConfig'
        imageType:
          description: >-
            Required. The desired image type for the node pool. Please see
            https://cloud.google.com/kubernetes-engine/docs/concepts/node-images
            for available image types.
          type: string
        maxRunDuration:
          description: >-
            The maximum duration for the nodes to exist. If unspecified, the
            nodes can exist indefinitely.
          format: google-duration
          type: string
        name:
          description: >-
            The name (project, location, cluster, node pool) of the node pool to
            update. Specified in the format
            `projects/*/locations/*/clusters/*/nodePools/*`.
          type: string
        locations:
          type: array
          items:
            type: string
          description: >-
            The desired list of Google Compute Engine
            [zones](https://cloud.google.com/compute/docs/zones#available) in
            which the node pool's nodes should be located. Changing the
            locations for a node pool will result in nodes being either created
            or removed from the node pool, depending on whether locations are
            being added or removed. Warning: It is recommended to update node
            pool locations in a standalone API call. Do not combine a location
            update with changes to other fields (such as `tags`, `labels`,
            `taints`, etc.) in the same request. Otherwise, the API performs a
            structural modification where changes to other fields will only
            apply to newly created nodes and will not be applied to existing
            nodes in the node pool. To ensure all nodes are updated
            consistently, use a separate API call for location changes.
        consolidationDelay:
          type: string
          description: >-
            Consolidation delay defines duration after which the Cluster
            Autoscaler can scale down underutilized nodes. If not set, nodes are
            scaled down by default behavior, i.e. according to the chosen
            autoscaling profile.
          format: google-duration
        nodeVersion:
          description: >-
            Required. The Kubernetes version to change the nodes to (typically
            an upgrade). Users may specify either explicit versions offered by
            Kubernetes Engine or version aliases, which have the following
            behavior: - "latest": picks the highest valid Kubernetes version -
            "1.X": picks the highest valid patch+gke.N patch in the 1.X version
            - "1.X.Y": picks the highest valid gke.N patch in the 1.X.Y version
            - "1.X.Y-gke.N": picks an explicit Kubernetes version - "-": picks
            the Kubernetes master version
          type: string
        kubeletConfig:
          $ref: '#/components/schemas/NodeKubeletConfig'
          description: Node kubelet configs.
        flexStart:
          description: Flex Start flag for enabling Flex Start VM.
          type: boolean
        windowsNodeConfig:
          description: Parameters that can be configured on Windows nodes.
          $ref: '#/components/schemas/WindowsNodeConfig'
        projectId:
          description: >-
            Deprecated. The Google Developers Console [project ID or project
            number](https://cloud.google.com/resource-manager/docs/creating-managing-projects).
            This field has been deprecated and replaced by the name field.
          deprecated: true
          type: string
        diskSizeGb:
          description: >-
            Optional. The desired disk size for nodes in the node pool specified
            in GB. The smallest allowed disk size is 10GB. Initiates an upgrade
            operation that migrates the nodes in the node pool to the specified
            disk size.
          format: int64
          type: string
        gcfsConfig:
          $ref: '#/components/schemas/GcfsConfig'
          description: GCFS config.
        clusterId:
          description: >-
            Deprecated. The name of the cluster to upgrade. This field has been
            deprecated and replaced by the name field.
          deprecated: true
          type: string
        machineType:
          description: >-
            Optional. The desired [Google Compute Engine machine
            type](https://cloud.google.com/compute/docs/machine-types) for nodes
            in the node pool. Initiates an upgrade operation that migrates the
            nodes in the node pool to the specified machine type.
          type: string
        nodeNetworkConfig:
          $ref: '#/components/schemas/NodeNetworkConfig'
          description: Node network config.
        zone:
          description: >-
            Deprecated. The name of the Google Compute Engine
            [zone](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster resides. This field has been deprecated and
            replaced by the name field.
          deprecated: true
          type: string
        linuxNodeConfig:
          $ref: '#/components/schemas/LinuxNodeConfig'
          description: Parameters that can be configured on Linux nodes.
        imageProject:
          description: >-
            The project containing the desired image to use for this node pool.
            This is used to create clusters using a custom image.
          type: string
        confidentialNodes:
          $ref: '#/components/schemas/ConfidentialNodes'
          description: >-
            Confidential nodes config. All the nodes in the node pool will be
            Confidential VM once enabled.
        accelerators:
          description: >-
            A list of hardware accelerators to be attached to each node. See
            https://cloud.google.com/compute/docs/gpus for more information
            about support for GPUs.
          items:
            $ref: '#/components/schemas/AcceleratorConfig'
          type: array
        bootDisk:
          description: >-
            The desired boot disk config for nodes in the node pool. Initiates
            an upgrade operation that migrates the nodes in the node pool to the
            specified boot disk config.
          $ref: '#/components/schemas/BootDisk'
        image:
          description: >-
            The desired name of the image name to use for this node. This is
            used to create clusters using a custom image.
          type: string
        workloadMetadataConfig:
          $ref: '#/components/schemas/WorkloadMetadataConfig'
          description: The desired workload metadata config for the node pool.
        queuedProvisioning:
          $ref: '#/components/schemas/QueuedProvisioning'
          description: Specifies the configuration of queued provisioning.
        storagePools:
          description: >-
            List of Storage Pools where boot disks are provisioned. Existing
            Storage Pools will be replaced with storage-pools.
          type: array
          items:
            type: string
        gvnic:
          $ref: '#/components/schemas/VirtualNIC'
          description: Enable or disable gvnic on the node pool.
        etag:
          description: >-
            The current etag of the node pool. If an etag is provided and does
            not match the current etag of the node pool, update will be blocked
            and an ABORTED error will be returned.
          type: string
        diskType:
          description: >-
            Optional. The desired disk type (e.g. 'pd-standard', 'pd-ssd' or
            'pd-balanced') for nodes in the node pool. Initiates an upgrade
            operation that migrates the nodes in the node pool to the specified
            disk type.
          type: string
        resourceLabels:
          $ref: '#/components/schemas/ResourceLabels'
          description: >-
            The resource labels for the node pool to use to annotate any related
            Google Compute Engine resources.
        loggingConfig:
          $ref: '#/components/schemas/NodePoolLoggingConfig'
          description: Logging configuration.
        upgradeSettings:
          description: Upgrade settings control disruption and speed of the upgrade.
          $ref: '#/components/schemas/UpgradeSettings'
      type: object
    RollbackSafeUpgradeStatus:
      type: object
      properties:
        previousVersion:
          readOnly: true
          type: string
          description: >-
            Output only. The GKE version that the cluster previously used before
            step-one upgrade.
        controlPlaneUpgradeRollbackEndTime:
          description: Output only. The rollback-safe mode expiration time.
          format: google-datetime
          readOnly: true
          type: string
        mode:
          description: Output only. The mode of the rollback-safe upgrade.
          enumDescriptions:
            - MODE_UNSPECIFIED means it's in regular upgrade mode.
            - >-
              KCP_MINOR_UPGRADE_ROLLBACK_SAFE_MODE means it's in rollback-safe
              mode after a KCP minor version step-one upgrade.
          type: string
          enum:
            - MODE_UNSPECIFIED
            - KCP_MINOR_UPGRADE_ROLLBACK_SAFE_MODE
          readOnly: true
      description: >-
        RollbackSafeUpgradeStatus contains the rollback-safe upgrade status of a
        cluster.
      id: RollbackSafeUpgradeStatus
    SetLoggingServiceRequest:
      description: SetLoggingServiceRequest sets the logging service of a cluster.
      id: SetLoggingServiceRequest
      type: object
      properties:
        projectId:
          description: >-
            Deprecated. The Google Developers Console [project ID or project
            number](https://cloud.google.com/resource-manager/docs/creating-managing-projects).
            This field has been deprecated and replaced by the name field.
          deprecated: true
          type: string
        zone:
          description: >-
            Deprecated. The name of the Google Compute Engine
            [zone](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster resides. This field has been deprecated and
            replaced by the name field.
          deprecated: true
          type: string
        name:
          description: >-
            The name (project, location, cluster) of the cluster to set logging.
            Specified in the format `projects/*/locations/*/clusters/*`.
          type: string
        clusterId:
          type: string
          description: >-
            Deprecated. The name of the cluster to upgrade. This field has been
            deprecated and replaced by the name field.
          deprecated: true
        loggingService:
          description: >-
            Required. The logging service the cluster should use to write logs.
            Currently available options: * `logging.googleapis.com/kubernetes` -
            The Cloud Logging service with a Kubernetes-native resource model *
            `logging.googleapis.com` - The legacy Cloud Logging service (no
            longer available as of GKE 1.15). * `none` - no logs will be
            exported from the cluster. If left as an empty
            string,`logging.googleapis.com/kubernetes` will be used for GKE
            1.14+ or `logging.googleapis.com` for earlier versions.
          type: string
    UsableSubnetwork:
      type: object
      properties:
        subnetwork:
          description: >-
            Subnetwork Name. Example:
            projects/my-project/regions/us-central1/subnetworks/my-subnet
          type: string
        ipCidrRange:
          description: The range of internal addresses that are owned by this subnetwork.
          type: string
        network:
          description: >-
            Network Name. Example:
            projects/my-project/global/networks/my-network
          type: string
        statusMessage:
          description: >-
            A human readable status message representing the reasons for cases
            where the caller cannot use the secondary ranges under the subnet.
            For example if the secondary_ip_ranges is empty due to a permission
            issue, an insufficient permission message will be given by
            status_message.
          type: string
        secondaryIpRanges:
          items:
            $ref: '#/components/schemas/UsableSubnetworkSecondaryRange'
          type: array
          description: Secondary IP ranges.
      description: >-
        UsableSubnetwork resource returns the subnetwork name, its associated
        network and the primary CIDR range.
      id: UsableSubnetwork
    ResourceManagerTags:
      id: ResourceManagerTags
      description: >-
        A map of resource manager tag keys and values to be attached to the
        nodes for managing Compute Engine firewalls using Network Firewall
        Policies. Tags must be according to specifications in
        https://cloud.google.com/vpc/docs/tags-firewalls-overview#specifications.
        A maximum of 5 tag key-value pairs can be specified. Existing tags will
        be replaced with new values.
      properties:
        tags:
          type: object
          description: >-
            TagKeyValue must be in one of the following formats ([KEY]=[VALUE])
            1. `tagKeys/{tag_key_id}=tagValues/{tag_value_id}` 2.
            `{org_id}/{tag_key_name}={tag_value_name}` 3.
            `{project_id}/{tag_key_name}={tag_value_name}`
          additionalProperties:
            type: string
      type: object
    MaintenanceExclusionOptions:
      properties:
        scope:
          type: string
          description: >-
            Scope specifies the upgrade scope which upgrades are blocked by the
            exclusion.
          enumDescriptions:
            - >-
              NO_UPGRADES excludes all upgrades, including patch upgrades and
              minor upgrades across control planes and nodes. This is the
              default exclusion behavior.
            - >-
              NO_MINOR_UPGRADES excludes all minor upgrades for the cluster,
              only patches are allowed.
            - >-
              NO_MINOR_OR_NODE_UPGRADES excludes all minor upgrades for the
              cluster, and also exclude all node pool upgrades. Only control
              plane patches are allowed.
          enum:
            - NO_UPGRADES
            - NO_MINOR_UPGRADES
            - NO_MINOR_OR_NODE_UPGRADES
        endTimeBehavior:
          description: EndTimeBehavior specifies the behavior of the exclusion end time.
          enumDescriptions:
            - >-
              END_TIME_BEHAVIOR_UNSPECIFIED is the default behavior, which is
              fixed end time.
            - >-
              UNTIL_END_OF_SUPPORT means the exclusion will be in effect until
              the end of the support of the cluster's current version.
          enum:
            - END_TIME_BEHAVIOR_UNSPECIFIED
            - UNTIL_END_OF_SUPPORT
          type: string
      type: object
      id: MaintenanceExclusionOptions
      description: Represents the Maintenance exclusion option.
    QueuedProvisioning:
      id: QueuedProvisioning
      description: >-
        QueuedProvisioning defines the queued provisioning used by the node
        pool.
      properties:
        enabled:
          description: >-
            Denotes that this node pool is QRM specific, meaning nodes can be
            only obtained through queuing via the Cluster Autoscaler
            ProvisioningRequest API.
          type: boolean
      type: object
    AdditionalIPRangesConfig:
      type: object
      properties:
        podIpv4RangeNames:
          type: array
          items:
            type: string
          description: >-
            List of secondary ranges names within this subnetwork that can be
            used for pod IPs. Example1: gke-pod-range1 Example2:
            gke-pod-range1,gke-pod-range2
        status:
          type: string
          description: Draining status of the additional subnet.
          enumDescriptions:
            - Not set, same as ACTIVE.
            - >-
              ACTIVE status indicates that the subnet is available for new node
              pool creation.
            - >-
              DRAINING status indicates that the subnet is not used for new node
              pool creation.
          enum:
            - STATUS_UNSPECIFIED
            - ACTIVE
            - DRAINING
        subnetwork:
          description: >-
            Name of the subnetwork. This can be the full path of the subnetwork
            or just the name. Example1: my-subnet Example2:
            projects/gke-project/regions/us-central1/subnetworks/my-subnet
          type: string
      description: >-
        AdditionalIPRangesConfig is the configuration for individual additional
        subnetwork attached to the cluster
      id: AdditionalIPRangesConfig
    ResourceLabels:
      type: object
      properties:
        labels:
          description: Map of node label keys and node label values.
          additionalProperties:
            type: string
          type: object
      description: >-
        Collection of [Resource Manager
        labels](https://cloud.google.com/resource-manager/docs/creating-managing-labels).
      id: ResourceLabels
    ListOperationsResponse:
      id: ListOperationsResponse
      description: ListOperationsResponse is the result of ListOperationsRequest.
      properties:
        operations:
          items:
            $ref: '#/components/schemas/Operation'
          type: array
          description: A list of operations in the project in the specified zone.
        missingZones:
          items:
            type: string
          type: array
          description: >-
            If any zones are listed here, the list of operations returned may be
            missing the operations from those zones.
      type: object
    SetLocationsRequest:
      description: SetLocationsRequest sets the locations of the cluster.
      id: SetLocationsRequest
      type: object
      properties:
        clusterId:
          description: >-
            Deprecated. The name of the cluster to upgrade. This field has been
            deprecated and replaced by the name field.
          deprecated: true
          type: string
        locations:
          items:
            type: string
          type: array
          description: >-
            Required. The desired list of Google Compute Engine
            [zones](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster's nodes should be located. Changing the locations
            a cluster is in will result in nodes being either created or removed
            from the cluster, depending on whether locations are being added or
            removed. This list must always include the cluster's primary zone.
        name:
          description: >-
            The name (project, location, cluster) of the cluster to set
            locations. Specified in the format
            `projects/*/locations/*/clusters/*`.
          type: string
        projectId:
          description: >-
            Deprecated. The Google Developers Console [project ID or project
            number](https://cloud.google.com/resource-manager/docs/creating-managing-projects).
            This field has been deprecated and replaced by the name field.
          deprecated: true
          type: string
        zone:
          type: string
          description: >-
            Deprecated. The name of the Google Compute Engine
            [zone](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster resides. This field has been deprecated and
            replaced by the name field.
          deprecated: true
    AdditionalPodRangesConfig:
      id: AdditionalPodRangesConfig
      description: >-
        AdditionalPodRangesConfig is the configuration for additional pod
        secondary ranges supporting the ClusterUpdate message.
      properties:
        podRangeNames:
          description: >-
            Name for pod secondary ipv4 range which has the actual range defined
            ahead.
          items:
            type: string
          type: array
        podRangeInfo:
          items:
            $ref: '#/components/schemas/RangeInfo'
          readOnly: true
          type: array
          description: Output only. Information for additional pod range.
      type: object
    GCPSecretManagerCertificateConfig:
      id: GCPSecretManagerCertificateConfig
      description: >-
        GCPSecretManagerCertificateConfig configures a secret from [Secret
        Manager](https://cloud.google.com/secret-manager).
      properties:
        secretUri:
          description: >-
            Secret URI, in the form
            "projects/$PROJECT_ID/secrets/$SECRET_NAME/versions/$VERSION".
            Version can be fixed (e.g. "2") or "latest"
          type: string
      type: object
    ReleaseChannelConfig:
      type: object
      properties:
        customVersions:
          description: Output only. List of custom versions for the channel.
          items:
            type: string
          readOnly: true
          type: array
        defaultVersion:
          description: The default version for newly created clusters on the channel.
          type: string
        validVersions:
          type: array
          items:
            type: string
          description: List of valid versions for the channel.
        channel:
          enumDeprecated:
            - true
            - false
            - false
            - false
            - false
          enum:
            - UNSPECIFIED
            - RAPID
            - REGULAR
            - STABLE
            - EXTENDED
          type: string
          description: The release channel this configuration applies to.
          enumDescriptions:
            - >-
              Deprecated: No channel specified. it will be removed in the
              future, use RAPID, REGULAR, STABLE or EXTENDED instead.
            - >-
              RAPID channel is offered on an early access basis for customers
              who want to test new releases. WARNING: Versions available in the
              RAPID Channel may be subject to unresolved issues with no known
              workaround and are not subject to any SLAs.
            - >-
              Clusters subscribed to REGULAR receive versions that are
              considered GA quality. REGULAR is intended for production users
              who want to take advantage of new features.
            - >-
              Clusters subscribed to STABLE receive versions that are known to
              be stable and reliable in production.
            - >-
              Clusters subscribed to EXTENDED receive extended support and
              availability for versions which are known to be stable and
              reliable in production.
        upgradeTargetVersion:
          description: The auto upgrade target version for clusters on the channel.
          type: string
      description: ReleaseChannelConfig exposes configuration for a release channel.
      id: ReleaseChannelConfig
    Cluster:
      type: object
      properties:
        nodePoolDefaults:
          description: >-
            Default NodePool settings for the entire cluster. These settings are
            overridden if specified on the specific NodePool object.
          $ref: '#/components/schemas/NodePoolDefaults'
        verticalPodAutoscaling:
          $ref: '#/components/schemas/VerticalPodAutoscaling'
          description: Cluster-level Vertical Pod Autoscaling configuration.
        privateClusterConfig:
          description: Configuration for private cluster.
          $ref: '#/components/schemas/PrivateClusterConfig'
        managedOpentelemetryConfig:
          description: Configuration for Managed OpenTelemetry pipeline.
          $ref: '#/components/schemas/ManagedOpenTelemetryConfig'
        confidentialNodes:
          $ref: '#/components/schemas/ConfidentialNodes'
          description: >-
            Configuration of Confidential Nodes. All the nodes in the cluster
            will be Confidential VM once enabled.
        nodePoolAutoConfig:
          $ref: '#/components/schemas/NodePoolAutoConfig'
          description: >-
            Node pool configs that apply to all auto-provisioned node pools in
            autopilot clusters and node auto-provisioning enabled clusters.
        labelFingerprint:
          description: The fingerprint of the set of labels for this cluster.
          type: string
        anonymousAuthenticationConfig:
          $ref: '#/components/schemas/AnonymousAuthenticationConfig'
          description: >-
            Configuration for limiting anonymous access to all endpoints except
            the health checks.
        id:
          description: Output only. Unique id for the cluster.
          readOnly: true
          type: string
        fleet:
          description: Fleet information for the cluster.
          $ref: '#/components/schemas/Fleet'
        subnetwork:
          description: >-
            The name of the Google Compute Engine
            [subnetwork](https://cloud.google.com/compute/docs/subnetworks) to
            which the cluster is connected.
          type: string
        zone:
          description: >-
            Output only. The name of the Google Compute Engine
            [zone](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster resides. This field is deprecated, use location
            instead.
          deprecated: true
          readOnly: true
          type: string
        secretSyncConfig:
          $ref: '#/components/schemas/SecretSyncConfig'
          description: Configuration for sync Secret Manager secrets as k8s secrets.
        nodeIpv4CidrSize:
          readOnly: true
          type: integer
          description: >-
            Output only. The size of the address space on each node for hosting
            containers. This is provisioned from within the
            `container_ipv4_cidr` range. This field will only be set when
            cluster is in route-based network mode.
          format: int32
        notificationConfig:
          $ref: '#/components/schemas/NotificationConfig'
          description: Notification configuration of the cluster.
        conditions:
          description: Which conditions caused the current cluster state.
          type: array
          items:
            $ref: '#/components/schemas/StatusCondition'
        satisfiesPzi:
          readOnly: true
          type: boolean
          description: Output only. Reserved for future use.
        location:
          readOnly: true
          type: string
          description: >-
            Output only. The name of the Google Compute Engine
            [zone](https://cloud.google.com/compute/docs/regions-zones/regions-zones#available)
            or
            [region](https://cloud.google.com/compute/docs/regions-zones/regions-zones#available)
            in which the cluster resides.
        gkeAutoUpgradeConfig:
          $ref: '#/components/schemas/GkeAutoUpgradeConfig'
          description: Configuration for GKE auto upgrades.
        name:
          description: >-
            The name of this cluster. The name must be unique within this
            project and location (e.g. zone or region), and can be up to 40
            characters with the following restrictions: * Lowercase letters,
            numbers, and hyphens only. * Must start with a letter. * Must end
            with a number or a letter.
          type: string
        locations:
          type: array
          items:
            type: string
          description: >-
            The list of Google Compute Engine
            [zones](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster's nodes should be located. This field provides a
            default value if
            [NodePool.Locations](https://cloud.google.com/kubernetes-engine/docs/reference/rest/v1/projects.locations.clusters.nodePools#NodePool.FIELDS.locations)
            are not specified during node pool creation. Warning: changing
            cluster locations will update the
            [NodePool.Locations](https://cloud.google.com/kubernetes-engine/docs/reference/rest/v1/projects.locations.clusters.nodePools#NodePool.FIELDS.locations)
            of all node pools and will result in nodes being added and/or
            removed.
        legacyAbac:
          description: Configuration for the legacy ABAC authorization mode.
          $ref: '#/components/schemas/LegacyAbac'
        instanceGroupUrls:
          items:
            type: string
          readOnly: true
          description: Output only. Deprecated. Use node_pools.instance_group_urls.
          deprecated: true
          type: array
        enterpriseConfig:
          description: >-
            GKE Enterprise Configuration. Deprecated: GKE Enterprise features
            are now available without an Enterprise tier.
          deprecated: true
          $ref: '#/components/schemas/EnterpriseConfig'
        networkConfig:
          $ref: '#/components/schemas/NetworkConfig'
          description: Configuration for cluster networking.
        networkPolicy:
          $ref: '#/components/schemas/NetworkPolicy'
          description: Configuration options for the NetworkPolicy feature.
        currentNodeVersion:
          description: >-
            Output only. Deprecated, use
            [NodePools.version](https://cloud.google.com/kubernetes-engine/docs/reference/rest/v1/projects.locations.clusters.nodePools)
            instead. The current version of the node software components. If
            they are currently at multiple versions because they're in the
            process of being upgraded, this reflects the minimum version of all
            nodes.
          deprecated: true
          readOnly: true
          type: string
        status:
          readOnly: true
          enum:
            - STATUS_UNSPECIFIED
            - PROVISIONING
            - RUNNING
            - RECONCILING
            - STOPPING
            - ERROR
            - DEGRADED
          type: string
          description: Output only. The current status of this cluster.
          enumDescriptions:
            - Not set.
            - The PROVISIONING state indicates the cluster is being created.
            - >-
              The RUNNING state indicates the cluster has been created and is
              fully usable.
            - >-
              The RECONCILING state indicates that some work is actively being
              done on the cluster, such as upgrading the master or node
              software. Details can be found in the `statusMessage` field.
            - The STOPPING state indicates the cluster is being deleted.
            - >-
              The ERROR state indicates the cluster is unusable. It will be
              automatically deleted. Details can be found in the `statusMessage`
              field.
            - >-
              The DEGRADED state indicates the cluster requires user action to
              restore full functionality. Details can be found in the
              `statusMessage` field.
        tpuIpv4CidrBlock:
          description: >-
            Output only. The IP address range of the Cloud TPUs in this cluster,
            in
            [CIDR](https://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing)
            notation (e.g. `1.2.3.4/29`). This field is deprecated due to the
            deprecation of 2VM TPU. The end of life date for 2VM TPU is
            2025-04-25.
          deprecated: true
          readOnly: true
          type: string
        servicesIpv4Cidr:
          readOnly: true
          type: string
          description: >-
            Output only. The IP address range of the Kubernetes services in this
            cluster, in
            [CIDR](https://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing)
            notation (e.g. `1.2.3.4/29`). Service addresses are typically put in
            the last `/16` from the container CIDR.
        shieldedNodes:
          $ref: '#/components/schemas/ShieldedNodes'
          description: Shielded Nodes configuration.
        currentNodeCount:
          type: integer
          description: >-
            Output only. The number of nodes currently in the cluster.
            Deprecated. Call Kubernetes API directly to retrieve node
            information.
          deprecated: true
          format: int32
          readOnly: true
        databaseEncryption:
          $ref: '#/components/schemas/DatabaseEncryption'
          description: Configuration of etcd encryption.
        releaseChannel:
          description: >-
            Release channel configuration. If left unspecified on cluster
            creation and a version is specified, the cluster is enrolled in the
            most mature release channel where the version is available (first
            checking STABLE, then REGULAR, and finally RAPID). Otherwise, if no
            release channel configuration and no version is specified, the
            cluster is enrolled in the REGULAR channel with its default version.
          $ref: '#/components/schemas/ReleaseChannel'
        meshCertificates:
          $ref: '#/components/schemas/MeshCertificates'
          description: >-
            Configuration for issuance of mTLS keys and certificates to
            Kubernetes pods.
        monitoringConfig:
          description: Monitoring configuration for the cluster.
          $ref: '#/components/schemas/MonitoringConfig'
        binaryAuthorization:
          description: Configuration for Binary Authorization.
          $ref: '#/components/schemas/BinaryAuthorization'
        currentMasterVersion:
          description: Output only. The current software version of the master endpoint.
          readOnly: true
          type: string
        expireTime:
          readOnly: true
          type: string
          description: >-
            Output only. The time the cluster will be automatically deleted in
            [RFC3339](https://www.ietf.org/rfc/rfc3339.txt) text format.
        resourceUsageExportConfig:
          description: >-
            Configuration for exporting resource usages. Resource usage export
            is disabled when this config is unspecified.
          $ref: '#/components/schemas/ResourceUsageExportConfig'
        masterAuthorizedNetworksConfig:
          $ref: '#/components/schemas/MasterAuthorizedNetworksConfig'
          description: >-
            The configuration options for master authorized networks feature.
            Deprecated: Use
            ControlPlaneEndpointsConfig.IPEndpointsConfig.authorized_networks_config
            instead.
          deprecated: true
        userManagedKeysConfig:
          $ref: '#/components/schemas/UserManagedKeysConfig'
          description: The Custom keys configuration for the cluster.
        defaultMaxPodsConstraint:
          $ref: '#/components/schemas/MaxPodsConstraint'
          description: >-
            The default constraint on the maximum number of pods that can be run
            simultaneously on a node in the node pool of this cluster. Only
            honored if cluster created with IP Alias support.
        parentProductConfig:
          description: >-
            The configuration of the parent product of the cluster. This field
            is used by Google internal products that are built on top of the GKE
            cluster and take the ownership of the cluster.
          $ref: '#/components/schemas/ParentProductConfig'
        etag:
          description: >-
            This checksum is computed by the server based on the value of
            cluster fields, and may be sent on update requests to ensure the
            client has an up-to-date value before proceeding.
          type: string
        resourceLabels:
          description: >-
            The resource labels for the cluster to use to annotate any related
            Google Compute Engine resources.
          additionalProperties:
            type: string
          type: object
        identityServiceConfig:
          $ref: '#/components/schemas/IdentityServiceConfig'
          description: Configuration for Identity Service component.
        loggingConfig:
          description: Logging configuration for the cluster.
          $ref: '#/components/schemas/LoggingConfig'
        nodeCreationConfig:
          $ref: '#/components/schemas/NodeCreationConfig'
          description: Optional. Configuration for Node Creation Mode.
        initialNodeCount:
          description: >-
            The number of nodes to create in this cluster. You must ensure that
            your Compute Engine [resource
            quota](https://cloud.google.com/compute/quotas) is sufficient for
            this number of instances. You must also have available firewall and
            routes quota. For requests, this field should only be used in lieu
            of a "node_pool" object, since this configuration (along with the
            "node_config") will be used to create a "NodePool" object with an
            auto-generated name. Do not use this and a node_pool at the same
            time. This field is deprecated, use node_pool.initial_node_count
            instead.
          deprecated: true
          format: int32
          type: integer
        loggingService:
          description: >-
            The logging service the cluster should use to write logs. Currently
            available options: * `logging.googleapis.com/kubernetes` - The Cloud
            Logging service with a Kubernetes-native resource model *
            `logging.googleapis.com` - The legacy Cloud Logging service (no
            longer available as of GKE 1.15). * `none` - no logs will be
            exported from the cluster. If left as an empty
            string,`logging.googleapis.com/kubernetes` will be used for GKE
            1.14+ or `logging.googleapis.com` for earlier versions.
          type: string
        enableKubernetesAlpha:
          description: >-
            Kubernetes alpha features are enabled on this cluster. This includes
            alpha API groups (e.g. v1alpha1) and features that may not be
            production ready in the kubernetes version of the master and nodes.
            The cluster has no SLA for uptime and master/node upgrades are
            disabled. Alpha enabled clusters are automatically deleted thirty
            days after creation.
          type: boolean
        scheduleUpgradeConfig:
          description: Optional. Configuration for scheduled upgrades.
          $ref: '#/components/schemas/ScheduleUpgradeConfig'
        autoscaling:
          $ref: '#/components/schemas/ClusterAutoscaling'
          description: Cluster-level autoscaling configuration.
        rbacBindingConfig:
          $ref: '#/components/schemas/RBACBindingConfig'
          description: >-
            RBACBindingConfig allows user to restrict ClusterRoleBindings an
            RoleBindings that can be created.
        ipAllocationPolicy:
          $ref: '#/components/schemas/IPAllocationPolicy'
          description: Configuration for cluster IP allocation.
        alphaClusterFeatureGates:
          description: >-
            The list of user specified Kubernetes feature gates. Each string
            represents the activation status of a feature gate (e.g.
            "featureX=true" or "featureX=false")
          type: array
          items:
            type: string
        description:
          description: An optional description of this cluster.
          type: string
        currentEmulatedVersion:
          description: >-
            Output only. The current emulated version of the master endpoint.
            The version is in minor version format, e.g. 1.30. No value or empty
            string means the cluster has no emulated version.
          readOnly: true
          type: string
        costManagementConfig:
          description: Configuration for the fine-grained cost management feature.
          $ref: '#/components/schemas/CostManagementConfig'
        podAutoscaling:
          $ref: '#/components/schemas/PodAutoscaling'
          description: The config for pod autoscaling.
        nodePools:
          items:
            $ref: '#/components/schemas/NodePool'
          type: array
          description: >-
            The node pools associated with this cluster. This field should not
            be set if "node_config" or "initial_node_count" are specified.
        statusMessage:
          readOnly: true
          type: string
          description: >-
            Output only. Deprecated. Use conditions instead. Additional
            information about the current status of this cluster, if available.
          deprecated: true
        masterAuth:
          $ref: '#/components/schemas/MasterAuth'
          description: >-
            The authentication information for accessing the master endpoint. If
            unspecified, the defaults are used: For clusters before v1.12, if
            master_auth is unspecified, `username` will be set to "admin", a
            random password will be generated, and a client certificate will be
            issued.
        managedMachineLearningDiagnosticsConfig:
          description: Configuration for Managed Machine Learning Diagnostics.
          $ref: '#/components/schemas/ManagedMachineLearningDiagnosticsConfig'
        controlPlaneEndpointsConfig:
          description: Configuration for all cluster's control plane endpoints.
          $ref: '#/components/schemas/ControlPlaneEndpointsConfig'
        endpoint:
          description: >-
            Output only. The IP address of this cluster's master endpoint. The
            endpoint can be accessed from the internet at
            `https://username:password@endpoint/`. See the `masterAuth` property
            of this resource for username and password information.
          readOnly: true
          type: string
        authenticatorGroupsConfig:
          $ref: '#/components/schemas/AuthenticatorGroupsConfig'
          description: Configuration controlling RBAC group membership information.
        initialClusterVersion:
          description: >-
            The initial Kubernetes version for this cluster. Valid versions are
            those found in validMasterVersions returned by getServerConfig. The
            version can be upgraded over time; such upgrades are reflected in
            currentMasterVersion and currentNodeVersion. Users may specify
            either explicit versions offered by Kubernetes Engine or version
            aliases, which have the following behavior: - "latest": picks the
            highest valid Kubernetes version - "1.X": picks the highest valid
            patch+gke.N patch in the 1.X version - "1.X.Y": picks the highest
            valid gke.N patch in the 1.X.Y version - "1.X.Y-gke.N": picks an
            explicit Kubernetes version - "","-": picks the default Kubernetes
            version
          type: string
        clusterIpv4Cidr:
          description: >-
            The IP address range of the container pods in this cluster, in
            [CIDR](https://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing)
            notation (e.g. `10.96.0.0/14`). Leave blank to have one
            automatically chosen or specify a `/14` block in `10.0.0.0/8`.
          type: string
        compliancePostureConfig:
          description: >-
            Optional. Deprecated: Compliance Posture is no longer supported. For
            more details, see
            https://cloud.google.com/kubernetes-engine/docs/deprecations/posture-management-deprecation.
            Enable/Disable Compliance Posture features for the cluster.
          deprecated: true
          $ref: '#/components/schemas/CompliancePostureConfig'
        satisfiesPzs:
          readOnly: true
          type: boolean
          description: Output only. Reserved for future use.
        addonsConfig:
          $ref: '#/components/schemas/AddonsConfig'
          description: >-
            Configurations for the various addons available to run in the
            cluster.
        enableK8sBetaApis:
          $ref: '#/components/schemas/K8sBetaAPIConfig'
          description: Beta APIs Config
        autopilot:
          description: Autopilot configuration for the cluster.
          $ref: '#/components/schemas/Autopilot'
        secretManagerConfig:
          $ref: '#/components/schemas/SecretManagerConfig'
          description: Secret CSI driver configuration.
        workloadIdentityConfig:
          $ref: '#/components/schemas/WorkloadIdentityConfig'
          description: >-
            Configuration for the use of Kubernetes Service Accounts in IAM
            policies.
        controlPlaneEgress:
          description: Configuration for control plane egress control.
          $ref: '#/components/schemas/ControlPlaneEgress'
        nodeConfig:
          description: >-
            Parameters used in creating the cluster's nodes. For requests, this
            field should only be used in lieu of a "node_pool" object, since
            this configuration (along with the "initial_node_count") will be
            used to create a "NodePool" object with an auto-generated name. Do
            not use this and a node_pool at the same time. For responses, this
            field will be populated with the node configuration of the first
            node pool. (For configuration of each node pool, see
            `node_pool.config`) If unspecified, the defaults are used. This
            field is deprecated, use node_pool.config instead.
          deprecated: true
          $ref: '#/components/schemas/NodeConfig'
        rollbackSafeUpgrade:
          $ref: '#/components/schemas/RollbackSafeUpgrade'
          description: >-
            Optional. The rollback safe upgrade information of the cluster. This
            field is used when user manually triggers a rollback safe upgrade.
        network:
          description: >-
            The name of the Google Compute Engine
            [network](https://cloud.google.com/compute/docs/networks-and-firewalls#networks)
            to which the cluster is connected. If left unspecified, the
            `default` network will be used.
          type: string
        enableTpu:
          description: >-
            Enable the ability to use Cloud TPUs in this cluster. This field is
            deprecated due to the deprecation of 2VM TPU. The end of life date
            for 2VM TPU is 2025-04-25.
          deprecated: true
          type: boolean
        securityPostureConfig:
          description: >-
            Optional. Enable/Disable Security Posture API features for the
            cluster.
          $ref: '#/components/schemas/SecurityPostureConfig'
        maintenancePolicy:
          description: Configure the maintenance policy for this cluster.
          $ref: '#/components/schemas/MaintenancePolicy'
        createTime:
          description: >-
            Output only. The time the cluster was created, in
            [RFC3339](https://www.ietf.org/rfc/rfc3339.txt) text format.
          readOnly: true
          type: string
        monitoringService:
          description: >-
            The monitoring service the cluster should use to write metrics.
            Currently available options: *
            `monitoring.googleapis.com/kubernetes` - The Cloud Monitoring
            service with a Kubernetes-native resource model *
            `monitoring.googleapis.com` - The legacy Cloud Monitoring service
            (no longer available as of GKE 1.15). * `none` - No metrics will be
            exported from the cluster. If left as an empty
            string,`monitoring.googleapis.com/kubernetes` will be used for GKE
            1.14+ or `monitoring.googleapis.com` for earlier versions.
          type: string
        selfLink:
          description: Output only. Server-defined URL for the resource.
          readOnly: true
          type: string
      description: A Google Kubernetes Engine cluster.
      id: Cluster
    EvictionMinimumReclaim:
      description: >-
        Eviction minimum reclaims are the resource amounts of minimum reclaims
        for each eviction signal.
      id: EvictionMinimumReclaim
      type: object
      properties:
        nodefsInodesFree:
          description: >-
            Optional. Minimum reclaim for eviction due to nodefs inodes free
            signal. Only take percentage value for now. Sample format: "10%".
            Must be <=10%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        memoryAvailable:
          description: >-
            Optional. Minimum reclaim for eviction due to memory available
            signal. Only take percentage value for now. Sample format: "10%".
            Must be <=10%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        imagefsInodesFree:
          description: >-
            Optional. Minimum reclaim for eviction due to imagefs inodes free
            signal. Only take percentage value for now. Sample format: "10%".
            Must be <=10%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        imagefsAvailable:
          description: >-
            Optional. Minimum reclaim for eviction due to imagefs available
            signal. Only take percentage value for now. Sample format: "10%".
            Must be <=10%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        nodefsAvailable:
          description: >-
            Optional. Minimum reclaim for eviction due to nodefs available
            signal. Only take percentage value for now. Sample format: "10%".
            Must be <=10%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        pidAvailable:
          description: >-
            Optional. Minimum reclaim for eviction due to pid available signal.
            Only take percentage value for now. Sample format: "10%". Must be
            <=10%. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
    HorizontalPodAutoscaling:
      id: HorizontalPodAutoscaling
      description: >-
        Configuration options for the horizontal pod autoscaling feature, which
        increases or decreases the number of replica pods a replication
        controller has based on the resource usage of the existing pods.
      properties:
        disabled:
          description: >-
            Whether the Horizontal Pod Autoscaling feature is enabled in the
            cluster. When enabled, it ensures that metrics are collected into
            Stackdriver Monitoring.
          type: boolean
      type: object
    CustomImageConfig:
      properties:
        image:
          description: The name of the image to use for this node.
          type: string
        imageProject:
          description: The project containing the image to use for this node.
          type: string
      type: object
      id: CustomImageConfig
      description: CustomImageConfig contains the information r
    RangeInfo:
      properties:
        rangeName:
          description: Output only. Name of a range.
          readOnly: true
          type: string
        utilization:
          readOnly: true
          type: number
          description: Output only. The utilization of the range.
          format: double
      type: object
      id: RangeInfo
      description: >-
        RangeInfo contains the range name and the range utilization by this
        cluster.
    ComplianceStandard:
      type: object
      properties:
        standard:
          description: Name of the compliance standard.
          type: string
      description: Defines the details of a compliance standard.
      id: ComplianceStandard
    ListClustersResponse:
      type: object
      properties:
        clusters:
          description: >-
            A list of clusters in the project in the specified zone, or across
            all ones.
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
        missingZones:
          items:
            type: string
          type: array
          description: >-
            If any zones are listed here, the list of clusters returned may be
            missing those zones.
      description: ListClustersResponse is the result of ListClustersRequest.
      id: ListClustersResponse
    EphemeralStorageLocalSsdConfig:
      id: EphemeralStorageLocalSsdConfig
      description: >-
        EphemeralStorageLocalSsdConfig contains configuration for the node
        ephemeral storage using Local SSDs.
      properties:
        localSsdCount:
          type: integer
          description: >-
            Number of local SSDs to use to back ephemeral storage. Uses NVMe
            interfaces. A zero (or unset) value has different meanings depending
            on machine type being used: 1. For pre-Gen3 machines, which support
            flexible numbers of local ssds, zero (or unset) means to disable
            using local SSDs as ephemeral storage. The limit for this value is
            dependent upon the maximum number of disk available on a machine per
            zone. See: https://cloud.google.com/compute/docs/disks/local-ssd for
            more information. 2. For Gen3 machines which dictate a specific
            number of local ssds, zero (or unset) means to use the default
            number of local ssds that goes with that machine type. For example,
            for a c3-standard-8-lssd machine, 2 local ssds would be provisioned.
            For c3-standard-8 (which doesn't support local ssds), 0 will be
            provisioned. See
            https://cloud.google.com/compute/docs/disks/local-ssd#choose_number_local_ssds
            for more info.
          format: int32
        dataCacheCount:
          type: integer
          description: Number of local SSDs to use for GKE Data Cache.
          format: int32
      type: object
    LocalNvmeSsdBlockConfig:
      id: LocalNvmeSsdBlockConfig
      description: >-
        LocalNvmeSsdBlockConfig contains configuration for using raw-block local
        NVMe SSDs
      properties:
        localSsdCount:
          description: >-
            Number of local NVMe SSDs to use. The limit for this value is
            dependent upon the maximum number of disk available on a machine per
            zone. See: https://cloud.google.com/compute/docs/disks/local-ssd for
            more information. A zero (or unset) value has different meanings
            depending on machine type being used: 1. For pre-Gen3 machines,
            which support flexible numbers of local ssds, zero (or unset) means
            to disable using local SSDs as ephemeral storage. 2. For Gen3
            machines which dictate a specific number of local ssds, zero (or
            unset) means to use the default number of local ssds that goes with
            that machine type. For example, for a c3-standard-8-lssd machine, 2
            local ssds would be provisioned. For c3-standard-8 (which doesn't
            support local ssds), 0 will be provisioned. See
            https://cloud.google.com/compute/docs/disks/local-ssd#choose_number_local_ssds
            for more info.
          format: int32
          type: integer
      type: object
    AgentSandboxConfig:
      type: object
      properties:
        enabled:
          description: Optional. Whether AgentSandbox is enabled for this cluster.
          type: boolean
      description: Configuration for the AgentSandbox addon.
      id: AgentSandboxConfig
    AutopilotCompatibilityIssue:
      id: AutopilotCompatibilityIssue
      description: >-
        AutopilotCompatibilityIssue contains information about a specific
        compatibility issue with Autopilot mode.
      properties:
        lastObservation:
          type: string
          description: The last time when this issue was observed.
          format: google-datetime
        description:
          description: The description of the issue.
          type: string
        constraintType:
          description: The constraint type of the issue.
          type: string
        documentationUrl:
          description: >-
            A URL to a public documentation, which addresses resolving this
            issue.
          type: string
        incompatibilityType:
          description: The incompatibility type of this issue.
          enumDescriptions:
            - Default value, should not be used.
            - >-
              Indicates that the issue is a known incompatibility between the
              cluster and Autopilot mode.
            - >-
              Indicates the issue is an incompatibility if customers take no
              further action to resolve.
            - >-
              Indicates the issue is not an incompatibility, but depending on
              the workloads business logic, there is a potential that they won't
              work on Autopilot.
          enum:
            - UNSPECIFIED
            - INCOMPATIBILITY
            - ADDITIONAL_CONFIG_REQUIRED
            - PASSED_WITH_OPTIONAL_CONFIG
          type: string
        subjects:
          type: array
          items:
            type: string
          description: The name of the resources which are subject to this issue.
      type: object
    SetMonitoringServiceRequest:
      id: SetMonitoringServiceRequest
      description: SetMonitoringServiceRequest sets the monitoring service of a cluster.
      properties:
        zone:
          type: string
          description: >-
            Deprecated. The name of the Google Compute Engine
            [zone](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster resides. This field has been deprecated and
            replaced by the name field.
          deprecated: true
        projectId:
          type: string
          description: >-
            Deprecated. The Google Developers Console [project ID or project
            number](https://cloud.google.com/resource-manager/docs/creating-managing-projects).
            This field has been deprecated and replaced by the name field.
          deprecated: true
        monitoringService:
          description: >-
            Required. The monitoring service the cluster should use to write
            metrics. Currently available options: *
            `monitoring.googleapis.com/kubernetes` - The Cloud Monitoring
            service with a Kubernetes-native resource model *
            `monitoring.googleapis.com` - The legacy Cloud Monitoring service
            (no longer available as of GKE 1.15). * `none` - No metrics will be
            exported from the cluster. If left as an empty
            string,`monitoring.googleapis.com/kubernetes` will be used for GKE
            1.14+ or `monitoring.googleapis.com` for earlier versions.
          type: string
        clusterId:
          description: >-
            Deprecated. The name of the cluster to upgrade. This field has been
            deprecated and replaced by the name field.
          deprecated: true
          type: string
        name:
          description: >-
            The name (project, location, cluster) of the cluster to set
            monitoring. Specified in the format
            `projects/*/locations/*/clusters/*`.
          type: string
      type: object
    IPEndpointsConfig:
      description: IP endpoints configuration.
      id: IPEndpointsConfig
      type: object
      properties:
        authorizedNetworksConfig:
          description: >-
            Configuration of authorized networks. If enabled, restricts access
            to the control plane based on source IP. It is invalid to specify
            both Cluster.masterAuthorizedNetworksConfig and this field at the
            same time.
          $ref: '#/components/schemas/MasterAuthorizedNetworksConfig'
        publicEndpoint:
          readOnly: true
          type: string
          description: >-
            Output only. The external IP address of this cluster's control
            plane. Only populated if enabled.
        enabled:
          description: Controls whether to allow direct IP access.
          type: boolean
        privateEndpointSubnetwork:
          description: >-
            Subnet to provision the master's private endpoint during cluster
            creation. Specified in projects/*/regions/*/subnetworks/* format. It
            is invalid to specify both
            PrivateClusterConfig.privateEndpointSubnetwork and this field at the
            same time.
          type: string
        enablePublicEndpoint:
          description: >-
            Controls whether the control plane allows access through a public
            IP. It is invalid to specify both
            PrivateClusterConfig.enablePrivateEndpoint and this field at the
            same time.
          type: boolean
        globalAccess:
          description: >-
            Controls whether the control plane's private endpoint is accessible
            from sources in other regions. It is invalid to specify both
            PrivateClusterMasterGlobalAccessConfig.enabled and this field at the
            same time.
          type: boolean
        privateEndpoint:
          description: >-
            Output only. The internal IP address of this cluster's control
            plane. Only populated if enabled.
          readOnly: true
          type: string
    StartIPRotationRequest:
      type: object
      properties:
        clusterId:
          type: string
          description: >-
            Deprecated. The name of the cluster. This field has been deprecated
            and replaced by the name field.
          deprecated: true
        rotateCredentials:
          description: Whether to rotate credentials during IP rotation.
          type: boolean
        name:
          description: >-
            The name (project, location, cluster name) of the cluster to start
            IP rotation. Specified in the format
            `projects/*/locations/*/clusters/*`.
          type: string
        projectId:
          type: string
          description: >-
            Deprecated. The Google Developers Console [project ID or project
            number](https://cloud.google.com/resource-manager/docs/creating-managing-projects).
            This field has been deprecated and replaced by the name field.
          deprecated: true
        zone:
          type: string
          description: >-
            Deprecated. The name of the Google Compute Engine
            [zone](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster resides. This field has been deprecated and
            replaced by the name field.
          deprecated: true
      description: >-
        StartIPRotationRequest creates a new IP for the cluster and then
        performs a node upgrade on each node pool to point to the new IP.
      id: StartIPRotationRequest
    NetworkConfig:
      id: NetworkConfig
      description: NetworkConfig reports the relative names of network & subnetwork.
      properties:
        enableCiliumClusterwideNetworkPolicy:
          description: Whether CiliumClusterwideNetworkPolicy is enabled on this cluster.
          type: boolean
        serviceExternalIpsConfig:
          description: >-
            ServiceExternalIPsConfig specifies if services with externalIPs
            field are blocked or not.
          $ref: '#/components/schemas/ServiceExternalIPsConfig'
        enableMultiNetworking:
          description: Whether multi-networking is enabled for this cluster.
          type: boolean
        enableL4ilbSubsetting:
          description: Whether L4ILB Subsetting is enabled for this cluster.
          type: boolean
        gatewayApiConfig:
          $ref: '#/components/schemas/GatewayAPIConfig'
          description: >-
            GatewayAPIConfig contains the desired config of Gateway API on this
            cluster.
        disableL4LbFirewallReconciliation:
          description: Disable L4 load balancer VPC firewalls to enable firewall policies.
          type: boolean
        privateIpv6GoogleAccess:
          type: string
          description: >-
            The desired state of IPv6 connectivity to Google Services. By
            default, no private IPv6 access to or from Google Services (all
            access will be via IPv4)
          enumDescriptions:
            - Default value. Same as DISABLED
            - No private access to or from Google Services
            - Enables private IPv6 access to Google Services from GKE
            - Enables private IPv6 access to and from Google Services
          enum:
            - PRIVATE_IPV6_GOOGLE_ACCESS_UNSPECIFIED
            - PRIVATE_IPV6_GOOGLE_ACCESS_DISABLED
            - PRIVATE_IPV6_GOOGLE_ACCESS_TO_GOOGLE
            - PRIVATE_IPV6_GOOGLE_ACCESS_BIDIRECTIONAL
        dataplaneV2Config:
          description: Optional. DataplaneV2Config specifies the DPv2 configuration.
          $ref: '#/components/schemas/DataplaneV2Config'
        networkPerformanceConfig:
          description: Network bandwidth tier configuration.
          $ref: '#/components/schemas/ClusterNetworkPerformanceConfig'
        enableFqdnNetworkPolicy:
          description: Whether FQDN Network Policy is enabled on this cluster.
          type: boolean
        defaultEnablePrivateNodes:
          description: >-
            Controls whether by default nodes have private IP addresses only. It
            is invalid to specify both PrivateClusterConfig.enablePrivateNodes
            and this field at the same time. To update the default setting, use
            ClusterUpdate.desired_default_enable_private_nodes
          type: boolean
        subnetwork:
          description: >-
            Output only. The relative name of the Google Compute Engine
            [subnetwork](https://cloud.google.com/compute/docs/vpc) to which the
            cluster is connected. Example:
            projects/my-project/regions/us-central1/subnetworks/my-subnet
          readOnly: true
          type: string
        datapathProvider:
          description: >-
            The desired datapath provider for this cluster. By default, uses the
            IPTables-based kube-proxy implementation.
          enumDescriptions:
            - Default value.
            - Use the IPTables implementation based on kube-proxy.
            - >-
              Use the eBPF based GKE Dataplane V2 with additional features. See
              the [GKE Dataplane V2
              documentation](https://cloud.google.com/kubernetes-engine/docs/how-to/dataplane-v2)
              for more.
          enum:
            - DATAPATH_PROVIDER_UNSPECIFIED
            - LEGACY_DATAPATH
            - ADVANCED_DATAPATH
          type: string
        enableIntraNodeVisibility:
          description: >-
            Whether Intra-node visibility is enabled for this cluster. This
            makes same node pod to pod traffic visible for VPC network.
          type: boolean
        defaultSnatStatus:
          $ref: '#/components/schemas/DefaultSnatStatus'
          description: >-
            Whether the cluster disables default in-node sNAT rules. In-node
            sNAT rules will be disabled when default_snat_status is disabled.
            When disabled is set to false, default IP masquerade rules will be
            applied to the nodes to prevent sNAT on cluster internal traffic.
        inTransitEncryptionConfig:
          type: string
          description: >-
            Specify the details of in-transit encryption. Now named inter-node
            transparent encryption.
          enumDescriptions:
            - >-
              Unspecified, will be inferred as default -
              IN_TRANSIT_ENCRYPTION_UNSPECIFIED.
            - In-transit encryption is disabled.
            - >-
              Data in-transit is encrypted using inter-node transparent
              encryption.
          enum:
            - IN_TRANSIT_ENCRYPTION_CONFIG_UNSPECIFIED
            - IN_TRANSIT_ENCRYPTION_DISABLED
            - IN_TRANSIT_ENCRYPTION_INTER_NODE_TRANSPARENT
        dnsConfig:
          description: DNSConfig contains clusterDNS config for this cluster.
          $ref: '#/components/schemas/DNSConfig'
        network:
          description: >-
            Output only. The relative name of the Google Compute Engine
            [network](https://cloud.google.com/compute/docs/networks-and-firewalls#networks)
            to which the cluster is connected. Example:
            projects/my-project/global/networks/my-network
          readOnly: true
          type: string
      type: object
    AddonsConfig:
      id: AddonsConfig
      description: >-
        Configuration for the addons that can be automatically spun up in the
        cluster, enabling additional functionality.
      properties:
        cloudRunConfig:
          description: >-
            Configuration for the Cloud Run addon, which allows the user to use
            a managed Knative service.
          $ref: '#/components/schemas/CloudRunConfig'
        highScaleCheckpointingConfig:
          description: Configuration for the High Scale Checkpointing add-on.
          $ref: '#/components/schemas/HighScaleCheckpointingConfig'
        sliceControllerConfig:
          $ref: '#/components/schemas/SliceControllerConfig'
          description: Optional. Configuration for the slice controller add-on.
        nodeReadinessConfig:
          $ref: '#/components/schemas/NodeReadinessConfig'
          description: Optional. Configuration for NodeReadinessController add-on.
        configConnectorConfig:
          description: >-
            Configuration for the ConfigConnector add-on, a Kubernetes extension
            to manage hosted Google Cloud services through the Kubernetes API.
          $ref: '#/components/schemas/ConfigConnectorConfig'
        lustreCsiDriverConfig:
          $ref: '#/components/schemas/LustreCsiDriverConfig'
          description: Configuration for the Lustre CSI driver.
        networkPolicyConfig:
          description: >-
            Configuration for NetworkPolicy. This only tracks whether the addon
            is enabled or not on the Master, it does not track whether network
            policy is enabled for the nodes.
          $ref: '#/components/schemas/NetworkPolicyConfig'
        gkeBackupAgentConfig:
          description: Configuration for the Backup for GKE agent addon.
          $ref: '#/components/schemas/GkeBackupAgentConfig'
        parallelstoreCsiDriverConfig:
          description: Configuration for the Cloud Storage Parallelstore CSI driver.
          $ref: '#/components/schemas/ParallelstoreCsiDriverConfig'
        gcpFilestoreCsiDriverConfig:
          $ref: '#/components/schemas/GcpFilestoreCsiDriverConfig'
          description: Configuration for the Filestore CSI driver.
        horizontalPodAutoscaling:
          description: >-
            Configuration for the horizontal pod autoscaling feature, which
            increases or decreases the number of replica pods a replication
            controller has based on the resource usage of the existing pods.
          $ref: '#/components/schemas/HorizontalPodAutoscaling'
        dnsCacheConfig:
          $ref: '#/components/schemas/DnsCacheConfig'
          description: Configuration for NodeLocalDNS, a dns cache running on cluster nodes
        rayOperatorConfig:
          description: Optional. Configuration for Ray Operator addon.
          $ref: '#/components/schemas/RayOperatorConfig'
        gcePersistentDiskCsiDriverConfig:
          $ref: '#/components/schemas/GcePersistentDiskCsiDriverConfig'
          description: Configuration for the Compute Engine Persistent Disk CSI driver.
        podSnapshotConfig:
          description: Optional. Configuration for the Pod Snapshot feature.
          $ref: '#/components/schemas/PodSnapshotConfig'
        agentSandboxConfig:
          $ref: '#/components/schemas/AgentSandboxConfig'
          description: Optional. Configuration for the AgentSandbox addon.
        kubernetesDashboard:
          description: >-
            Configuration for the Kubernetes Dashboard. This addon is
            deprecated, and will be disabled in 1.15. It is recommended to use
            the Cloud Console to manage and monitor your Kubernetes clusters,
            workloads and applications. For more information, see:
            https://cloud.google.com/kubernetes-engine/docs/concepts/dashboards
          deprecated: true
          $ref: '#/components/schemas/KubernetesDashboard'
        statefulHaConfig:
          $ref: '#/components/schemas/StatefulHAConfig'
          description: Optional. Configuration for the StatefulHA add-on.
        httpLoadBalancing:
          $ref: '#/components/schemas/HttpLoadBalancing'
          description: >-
            Configuration for the HTTP (L7) load balancing controller addon,
            which makes it easy to set up HTTP load balancers for services in a
            cluster.
        gcsFuseCsiDriverConfig:
          $ref: '#/components/schemas/GcsFuseCsiDriverConfig'
          description: Configuration for the Cloud Storage Fuse CSI driver.
        slurmOperatorConfig:
          description: Configuration for the Slurm Operator.
          $ref: '#/components/schemas/SlurmOperatorConfig'
      type: object
    ManagedPrometheusConfig:
      type: object
      properties:
        enabled:
          description: Enable Managed Collection.
          type: boolean
        autoMonitoringConfig:
          $ref: '#/components/schemas/AutoMonitoringConfig'
          description: GKE Workload Auto-Monitoring Configuration.
      description: >-
        ManagedPrometheusConfig defines the configuration for Google Cloud
        Managed Service for Prometheus.
      id: ManagedPrometheusConfig
    RollbackSafeUpgrade:
      properties:
        controlPlaneSoakDuration:
          type: string
          description: >-
            Optional. A user-defined period for the cluster remains in the
            rollbackable state. ex: {seconds: 21600}.
          format: google-duration
      type: object
      id: RollbackSafeUpgrade
      description: RollbackSafeUpgrade is the configuration for the rollback safe upgrade.
    DNSConfig:
      id: DNSConfig
      description: >-
        DNSConfig contains the desired set of options for configuring
        clusterDNS.
      properties:
        clusterDnsScope:
          description: >-
            cluster_dns_scope indicates the scope of access to cluster DNS
            records.
          enumDescriptions:
            - Default value, will be inferred as cluster scope.
            - DNS records are accessible from within the cluster.
            - DNS records are accessible from within the VPC.
          enum:
            - DNS_SCOPE_UNSPECIFIED
            - CLUSTER_SCOPE
            - VPC_SCOPE
          type: string
        additiveVpcScopeDnsDomain:
          description: Optional. The domain used in Additive VPC scope.
          type: string
        clusterDns:
          description: cluster_dns indicates which in-cluster DNS provider should be used.
          enumDescriptions:
            - Default value
            - Use GKE default DNS provider(kube-dns) for DNS resolution.
            - Use CloudDNS for DNS resolution.
            - Use KubeDNS for DNS resolution.
          enum:
            - PROVIDER_UNSPECIFIED
            - PLATFORM_DEFAULT
            - CLOUD_DNS
            - KUBE_DNS
          type: string
        clusterDnsDomain:
          description: >-
            cluster_dns_domain is the suffix used for all cluster service
            records.
          type: string
      type: object
    NodeReadinessConfig:
      type: object
      properties:
        enabled:
          description: >-
            Optional. Whether the GKE Node Readiness Controller is enabled for
            this cluster.
          type: boolean
      description: Configuration for the GKE Node Readiness Controller.
      id: NodeReadinessConfig
    AutopilotConfig:
      description: >-
        AutopilotConfig contains configuration of autopilot feature for this
        node pool.
      id: AutopilotConfig
      type: object
      properties:
        enabled:
          description: Denotes that nodes belonging to this node pool are Autopilot nodes.
          type: boolean
    LegacyAbac:
      id: LegacyAbac
      description: >-
        Configuration for the legacy Attribute Based Access Control
        authorization mode.
      properties:
        enabled:
          description: >-
            Whether the ABAC authorizer is enabled for this cluster. When
            enabled, identities in the system, including service accounts,
            nodes, and controllers, will have statically granted permissions
            beyond those provided by the RBAC configuration or IAM.
          type: boolean
      type: object
    VirtualNIC:
      description: Configuration of gVNIC feature.
      id: VirtualNIC
      type: object
      properties:
        enabled:
          description: Whether gVNIC features are enabled in the node pool.
          type: boolean
    TimeWindow:
      id: TimeWindow
      description: Represents an arbitrary window of time.
      properties:
        startTime:
          type: string
          description: The time that the window first starts.
          format: google-datetime
        maintenanceExclusionOptions:
          description: >-
            MaintenanceExclusionOptions provides maintenance exclusion related
            options.
          $ref: '#/components/schemas/MaintenanceExclusionOptions'
        endTime:
          type: string
          description: >-
            The time that the window ends. The end time should take place after
            the start time.
          format: google-datetime
      type: object
    NetworkTierConfig:
      description: NetworkTierConfig contains network tier information.
      id: NetworkTierConfig
      type: object
      properties:
        networkTier:
          description: Network tier configuration.
          enumDescriptions:
            - >-
              By default, use project-level configuration. When unspecified, the
              behavior defaults to NETWORK_TIER_DEFAULT. For cluster updates,
              this implies no action (no-op).
            - >-
              Default network tier. Use project-level configuration. User can
              specify this value, meaning they want to keep the same behaviour
              as before cluster level network tier configuration is introduced.
              This field ensures backward compatibility for the network tier of
              cluster resources, such as node pools and load balancers, for
              their external IP addresses.
            - Premium network tier.
            - Standard network tier.
          enum:
            - NETWORK_TIER_UNSPECIFIED
            - NETWORK_TIER_DEFAULT
            - NETWORK_TIER_PREMIUM
            - NETWORK_TIER_STANDARD
          type: string
    ClusterUpdate:
      type: object
      properties:
        desiredImage:
          description: >-
            The desired name of the image to use for this node. This is used to
            create clusters using a custom image. NOTE: Set the
            "desired_node_pool" field as well.
          type: string
        desiredStackType:
          description: >-
            The desired stack type of the cluster. If a stack type is provided
            and does not match the current stack type of the cluster, update
            will attempt to change the stack type to the new type.
          enumDescriptions:
            - Default value, will be defaulted as IPV4 only
            - Cluster is IPV4 only
            - Cluster can use both IPv4 and IPv6
          enum:
            - STACK_TYPE_UNSPECIFIED
            - IPV4
            - IPV4_IPV6
          type: string
        desiredIntraNodeVisibilityConfig:
          $ref: '#/components/schemas/IntraNodeVisibilityConfig'
          description: The desired config of Intra-node visibility.
        desiredAnonymousAuthenticationConfig:
          description: >-
            Configuration for limiting anonymous access to all endpoints except
            the health checks.
          $ref: '#/components/schemas/AnonymousAuthenticationConfig'
        desiredDefaultSnatStatus:
          description: >-
            The desired status of whether to disable default sNAT for this
            cluster.
          $ref: '#/components/schemas/DefaultSnatStatus'
        desiredFleet:
          description: The desired fleet configuration for the cluster.
          $ref: '#/components/schemas/Fleet'
        desiredLoggingConfig:
          description: The desired logging configuration.
          $ref: '#/components/schemas/LoggingConfig'
        enableK8sBetaApis:
          description: >-
            Kubernetes open source beta apis enabled on the cluster. Only beta
            apis
          $ref: '#/components/schemas/K8sBetaAPIConfig'
        desiredEnableCiliumClusterwideNetworkPolicy:
          description: Enable/Disable Cilium Clusterwide Network Policy for the cluster.
          type: boolean
        desiredNodeCreationConfig:
          $ref: '#/components/schemas/NodeCreationConfig'
          description: Optional. The desired NodeCreationConfig for the cluster.
        desiredLoggingService:
          description: >-
            The logging service the cluster should use to write logs. Currently
            available options: * `logging.googleapis.com/kubernetes` - The Cloud
            Logging service with a Kubernetes-native resource model *
            `logging.googleapis.com` - The legacy Cloud Logging service (no
            longer available as of GKE 1.15). * `none` - no logs will be
            exported from the cluster. If left as an empty
            string,`logging.googleapis.com/kubernetes` will be used for GKE
            1.14+ or `logging.googleapis.com` for earlier versions.
          type: string
        desiredManagedOpentelemetryConfig:
          description: The desired managed open telemetry configuration.
          $ref: '#/components/schemas/ManagedOpenTelemetryConfig'
        desiredPrivateClusterConfig:
          description: >-
            The desired private cluster configuration.
            master_global_access_config is the only field that can be changed
            via this field. See also
            ClusterUpdate.desired_enable_private_endpoint for modifying other
            fields within PrivateClusterConfig. Deprecated: Use
            desired_control_plane_endpoints_config.ip_endpoints_config.global_access
            instead.
          deprecated: true
          $ref: '#/components/schemas/PrivateClusterConfig'
        desiredInTransitEncryptionConfig:
          description: Specify the details of in-transit encryption.
          enumDescriptions:
            - >-
              Unspecified, will be inferred as default -
              IN_TRANSIT_ENCRYPTION_UNSPECIFIED.
            - In-transit encryption is disabled.
            - >-
              Data in-transit is encrypted using inter-node transparent
              encryption.
          enum:
            - IN_TRANSIT_ENCRYPTION_CONFIG_UNSPECIFIED
            - IN_TRANSIT_ENCRYPTION_DISABLED
            - IN_TRANSIT_ENCRYPTION_INTER_NODE_TRANSPARENT
          type: string
        desiredLocations:
          type: array
          items:
            type: string
          description: >-
            The desired list of Google Compute Engine
            [zones](https://cloud.google.com/compute/docs/zones#available) in
            which the cluster's nodes should be located. This list must always
            include the cluster's primary zone. Warning: changing cluster
            locations will update the locations of all node pools and will
            result in nodes being added and/or removed.
        desiredDatabaseEncryption:
          $ref: '#/components/schemas/DatabaseEncryption'
          description: Configuration of etcd encryption.
        desiredMasterVersion:
          description: >-
            The Kubernetes version to change the master to. Users may specify
            either explicit versions offered by Kubernetes Engine or version
            aliases, which have the following behavior: - "latest": picks the
            highest valid Kubernetes version - "1.X": picks the highest valid
            patch+gke.N patch in the 1.X version - "1.X.Y": picks the highest
            valid gke.N patch in the 1.X.Y version - "1.X.Y-gke.N": picks an
            explicit Kubernetes version - "-": picks the default Kubernetes
            version
          type: string
        desiredCompliancePostureConfig:
          $ref: '#/components/schemas/CompliancePostureConfig'
          description: >-
            Deprecated: Compliance Posture is no longer supported. For more
            details, see
            https://cloud.google.com/kubernetes-engine/docs/deprecations/posture-management-deprecation.
            Enable/Disable Compliance Posture features for the cluster.
          deprecated: true
        desiredDatapathProvider:
          description: The desired datapath provider for the cluster.
          enumDescriptions:
            - Default value.
            - Use the IPTables implementation based on kube-proxy.
            - >-
              Use the eBPF based GKE Dataplane V2 with additional features. See
              the [GKE Dataplane V2
              documentation](https://cloud.google.com/kubernetes-engine/docs/how-to/dataplane-v2)
              for more.
          enum:
            - DATAPATH_PROVIDER_UNSPECIFIED
            - LEGACY_DATAPATH
            - ADVANCED_DATAPATH
          type: string
        desiredResourceUsageExportConfig:
          description: The desired configuration for exporting resource usage.
          $ref: '#/components/schemas/ResourceUsageExportConfig'
        desiredPrivateIpv6GoogleAccess:
          description: The desired state of IPv6 connectivity to Google Services.
          enumDescriptions:
            - Default value. Same as DISABLED
            - No private access to or from Google Services
            - Enables private IPv6 access to Google Services from GKE
            - Enables private IPv6 access to and from Google Services
          enum:
            - PRIVATE_IPV6_GOOGLE_ACCESS_UNSPECIFIED
            - PRIVATE_IPV6_GOOGLE_ACCESS_DISABLED
            - PRIVATE_IPV6_GOOGLE_ACCESS_TO_GOOGLE
            - PRIVATE_IPV6_GOOGLE_ACCESS_BIDIRECTIONAL
          type: string
        desiredMeshCertificates:
          description: >-
            Configuration for issuance of mTLS keys and certificates to
            Kubernetes pods.
          $ref: '#/components/schemas/MeshCertificates'
        desiredAddonsConfig:
          description: >-
            Configurations for the various addons available to run in the
            cluster.
          $ref: '#/components/schemas/AddonsConfig'
        desiredEnterpriseConfig:
          $ref: '#/components/schemas/DesiredEnterpriseConfig'
          description: >-
            The desired enterprise configuration for the cluster. Deprecated:
            GKE Enterprise features are now available without an Enterprise
            tier.
          deprecated: true
        desiredContainerdConfig:
          description: The desired containerd config for the cluster.
          $ref: '#/components/schemas/ContainerdConfig'
        desiredNodePoolAutoConfigKubeletConfig:
          $ref: '#/components/schemas/NodeKubeletConfig'
          description: >-
            The desired node kubelet config for all auto-provisioned node pools
