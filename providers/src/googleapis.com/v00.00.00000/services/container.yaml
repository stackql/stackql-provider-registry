openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Kubernetes Engine API
  description: >-
    Builds and manages container-based applications, powered by the open source
    Kubernetes technology.
  version: v1
  x-discovery-doc-revision: '20260727'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/kubernetes-engine/docs/
servers:
  - url: https://container.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/container: >-
              See, edit, configure, and delete your Google Kubernetes Engine
              data and see the email address for your Google Account
            https://www.googleapis.com/auth/container.read-only: >-
              See your Google Kubernetes Engine data and the email address of
              your Google Account
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    PodSnapshotConfig:
      description: PodSnapshotConfig is the configuration for GKE Pod Snapshots feature.
      id: PodSnapshotConfig
      type: object
      properties:
        enabled:
          description: Whether or not the Pod Snapshots feature is enabled.
          type: boolean
    GatewayAPIConfig:
      description: >-
        GatewayAPIConfig contains the desired config of Gateway API on this
        cluster.
      id: GatewayAPIConfig
      type: object
      properties:
        channel:
          enumDeprecated:
            - false
            - false
            - true
            - false
          enum:
            - CHANNEL_UNSPECIFIED
            - CHANNEL_DISABLED
            - CHANNEL_EXPERIMENTAL
            - CHANNEL_STANDARD
          description: The Gateway API release channel to use for Gateway API.
          enumDescriptions:
            - Default value.
            - Gateway API support is disabled
            - >-
              Deprecated: use CHANNEL_STANDARD instead. Gateway API support is
              enabled, experimental CRDs are installed
            - Gateway API support is enabled, standard CRDs are installed
          type: string
    NodePoolDefaults:
      id: NodePoolDefaults
      description: Subset of Nodepool message that has defaults.
      properties:
        nodeConfigDefaults:
          description: Subset of NodeConfig message that has defaults.
          $ref: '#/components/schemas/NodeConfigDefaults'
      type: object
    CrashLoopBackOffConfig:
      description: >-
        Contains config to modify node-level parameters for container restart
        behavior.
      id: CrashLoopBackOffConfig
      type: object
      properties:
        maxContainerRestartPeriod:
          description: >-
            Optional. The maximum duration the backoff delay can accrue to for
            container restarts, minimum 1 second, maximum 300 seconds. If not
            set, defaults to the internal crashloopbackoff maximum. The string
            must be a sequence of decimal numbers, each with optional fraction
            and a unit suffix, such as "300ms". Valid time units are "ns", "us"
            (or "µs"), "ms", "s", "m", "h". See
            https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#configurable-container-restart-delay
            for more details.
          type: string
    BlueGreenInfo:
      description: Information relevant to blue-green upgrade.
      id: BlueGreenInfo
      type: object
      properties:
        greenPoolVersion:
          description: Version of green pool.
          type: string
        bluePoolDeletionStartTime:
          description: >-
            Time to start deleting blue pool to complete blue-green upgrade, in
            [RFC3339](https://www.ietf.org/rfc/rfc3339.txt) text format.
          type: string
        blueInstanceGroupUrls:
          description: >-
            The resource URLs of the [managed instance groups]
            (/compute/docs/instance-groups/creating-groups-of-managed-instances)
            associated with blue pool.
          type: array
          items:
            type: string
        phase:
          description: Current blue-green upgrade phase.
          enumDescriptions:
            - Unspecified phase.
            - blue-green upgrade has been initiated.
            - Start creating green pool nodes.
            - Start cordoning blue pool nodes.
            - Start draining blue pool nodes.
            - Start soaking time after draining entire blue pool.
            - Start deleting blue nodes.
            - Rollback has been initiated.
          enum:
            - PHASE_UNSPECIFIED
            - UPDATE_STARTED
            - CREATING_GREEN_POOL
            - CORDONING_BLUE_POOL
            - DRAINING_BLUE_POOL
            - NODE_POOL_SOAKING
            - DELETING_BLUE_POOL
            - ROLLBACK_STARTED
          type: string
        greenInstanceGroupUrls:
          description: >-
            The resource URLs of the [managed instance groups]
            (/compute/docs/instance-groups/creating-groups-of-managed-instances)
            associated with green pool.
          items:
            type: string
          type: array
    PrivateRegistryAccessConfig:
      type: object
      properties:
        enabled:
          description: Private registry access is enabled.
          type: boolean
        certificateAuthorityDomainConfig:
          description: Private registry access configuration.
          items:
            $ref: '#/components/schemas/CertificateAuthorityDomainConfig'
          type: array
      description: >-
        PrivateRegistryAccessConfig contains access configuration for private
        container registries.
      id: PrivateRegistryAccessConfig
    BigQueryDestination:
      type: object
      properties:
        datasetId:
          description: The ID of a BigQuery Dataset.
          type: string
      description: >-
        Parameters for using BigQuery as the destination of resource usage
        export.
      id: BigQueryDestination
    PodAutoscaling:
      properties:
        hpaProfile:
          description: Selected Horizontal Pod Autoscaling profile.
          enumDescriptions:
            - HPA_PROFILE_UNSPECIFIED is used when no custom HPA profile is set.
            - Customers explicitly opt-out of HPA profiles.
            - >-
              PERFORMANCE is used when customers opt-in to the performance HPA
              profile. In this profile we support a higher number of HPAs per
              cluster and faster metrics collection for workload autoscaling.
          enum:
            - HPA_PROFILE_UNSPECIFIED
            - NONE
            - PERFORMANCE
          type: string
      type: object
      id: PodAutoscaling
      description: >-
        PodAutoscaling is used for configuration of parameters for workload
        autoscaling.
    GkeAutoUpgradeConfig:
      type: object
      properties:
        patchMode:
          type: string
          description: >-
            PatchMode specifies how auto upgrade patch builds should be
            selected.
          enumDescriptions:
            - >-
              PATCH_MODE_UNSPECIFIED defaults to using the upgrade target from
              the channel's patch upgrade targets as the upgrade target for the
              version.
            - >-
              ACCELERATED denotes that the latest patch build in the channel
              should be used as the upgrade target for the version.
          enum:
            - PATCH_MODE_UNSPECIFIED
            - ACCELERATED
      description: GkeAutoUpgradeConfig is the configuration for GKE auto upgrades.
      id: GkeAutoUpgradeConfig
    Status:
      type: object
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          type: array
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
    SwapConfig:
      type: object
      properties:
        encryptionConfig:
          description: Optional. If omitted, swap space is encrypted by default.
          $ref: '#/components/schemas/EncryptionConfig'
        ephemeralLocalSsdProfile:
          description: Swap on the local SSD shared with pod ephemeral storage.
          $ref: '#/components/schemas/EphemeralLocalSsdProfile'
        dedicatedLocalSsdProfile:
          $ref: '#/components/schemas/DedicatedLocalSsdProfile'
          description: Provisions a new, separate local NVMe SSD exclusively for swap.
        enabled:
          description: Optional. Enables or disables swap for the node pool.
          type: boolean
        bootDiskProfile:
          $ref: '#/components/schemas/BootDiskProfile'
          description: Swap on the node's boot disk.
      description: Configuration for swap memory on a node pool.
      id: SwapConfig
    BlueGreenSettings:
      properties:
        nodePoolSoakDuration:
          type: string
          description: >-
            Time needed after draining entire blue pool. After this period, blue
            pool will be cleaned up.
          format: google-duration
        standardRolloutPolicy:
          description: Standard policy for the blue-green upgrade.
          $ref: '#/components/schemas/StandardRolloutPolicy'
        autoscaledRolloutPolicy:
          $ref: '#/components/schemas/AutoscaledRolloutPolicy'
          description: Autoscaled policy for cluster autoscaler enabled blue-green upgrade.
      type: object
      id: BlueGreenSettings
      description: Settings for blue-green upgrade.
    EvictionGracePeriod:
      description: Eviction grace periods are grace periods for each eviction signal.
      id: EvictionGracePeriod
      type: object
      properties:
        nodefsInodesFree:
          description: >-
            Optional. Grace period for eviction due to nodefs inodes free
            signal. Sample format: "10s". Must be >= 0. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        memoryAvailable:
          description: >-
            Optional. Grace period for eviction due to memory available signal.
            Sample format: "10s". Must be >= 0. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        imagefsInodesFree:
          description: >-
            Optional. Grace period for eviction due to imagefs inodes free
            signal. Sample format: "10s". Must be >= 0. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        imagefsAvailable:
          description: >-
            Optional. Grace period for eviction due to imagefs available signal.
            Sample format: "10s". Must be >= 0. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        nodefsAvailable:
          description: >-
            Optional. Grace period for eviction due to nodefs available signal.
            Sample format: "10s". Must be >= 0. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
        pidAvailable:
          description: >-
            Optional. Grace period for eviction due to pid available signal.
            Sample format: "10s". Must be >= 0. See
            https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
          type: string
    OperationProgress:
      properties:
        status:
          type: string
          description: Status of an operation stage. Unset for single-stage operations.
          enumDescriptions:
            - Not set.
            - The operation has been created.
            - The operation is currently running.
            - The operation is done, either cancelled or completed.
            - The operation is aborting.
          enum:
            - STATUS_UNSPECIFIED
            - PENDING
            - RUNNING
            - DONE
            - ABORTING
        name:
          description: >-
            A non-parameterized string describing an operation stage. Unset for
            single-stage operations.
          type: string
        stages:
          description: Substages of an operation or a stage.
          items:
            $ref: '#/components/schemas/OperationProgress'
          type: array
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
          description: >-
            Progress metric bundle, for example: metrics: [{name: "nodes done",
            int_value: 15}, {name: "nodes total", int_value: 32}] or metrics:
            [{name: "progress", double_value: 0.56}, {name: "progress scale",
            double_value: 1.0}]
      type: object
      id: OperationProgress
      description: Information about operation (or operation stage) progress.
    ListNodePoolsResponse:
      type: object
      properties:
        nodePools:
          type: array
          items:
            $ref: '#/components/schemas/NodePool'
          description: A list of node pools for a cluster.
      description: ListNodePoolsResponse is the result of ListNodePoolsRequest.
      id: ListNodePoolsResponse
    TaintConfig:
      description: TaintConfig contains the configuration for the taints of the node pool.
      id: TaintConfig
      type: object
      properties:
        architectureTaintBehavior:
          type: string
          description: Optional. Controls architecture tainting behavior.
          enumDescriptions:
            - Specifies that the behavior is unspecified, defaults to ARM.
            - Disables default architecture taints on the node pool.
            - Taints all the nodes in the node pool with the default ARM taint.
          enum:
            - ARCHITECTURE_TAINT_BEHAVIOR_UNSPECIFIED
            - NONE
            - ARM
    ConfidentialNodes:
      id: ConfidentialNodes
      description: >-
        ConfidentialNodes is configuration for the confidential nodes feature,
        which makes nodes run on confidential VMs.
      properties:
        enabled:
          description: Whether Confidential Nodes feature is enabled.
          type: boolean
        confidentialInstanceType:
          type: string
          description: Defines the type of technology used by the confidential node.
          enumDescriptions:
            - No type specified. Do not use this value.
            - AMD Secure Encrypted Virtualization.
            - AMD Secure Encrypted Virtualization - Secure Nested Paging.
            - Intel Trust Domain eXtension.
          enum:
            - CONFIDENTIAL_INSTANCE_TYPE_UNSPECIFIED
            - SEV
            - SEV_SNP
            - TDX
      type: object
    NodeKubeletConfig:
      id: NodeKubeletConfig
      description: Node kubelet configs.
      properties:
        singleProcessOomKill:
          description: >-
            Optional. Defines whether to enable single process OOM killer. If
            true, will prevent the memory.oom.group flag from being set for
            container cgroups in cgroups v2. This causes processes in the
            container to be OOM killed individually instead of as a group.
          type: boolean
        podPidsLimit:
          type: string
          description: >-
            Set the Pod PID limits. See
            https://kubernetes.io/docs/concepts/policy/pid-limiting/#pod-pid-limits
            Controls the maximum number of processes allowed to run in a pod.
            The value must be greater than or equal to 1024 and less than
            4194304.
          format: int64
        insecureKubeletReadonlyPortEnabled:
          description: Enable or disable Kubelet read only port.
          type: boolean
        containerLogMaxFiles:
          description: >-
            Optional. Defines the maximum number of container log files that can
            be present for a container. See
            https://kubernetes.io/docs/concepts/cluster-administration/logging/#log-rotation
            The value must be an integer between 2 and 10, inclusive. The
            default value is 5 if unspecified.
          format: int32
          type: integer
        memoryManager:
          description: >-
            Optional. Controls NUMA-aware Memory Manager configuration on the
            node. For more information, see:
            https://kubernetes.io/docs/tasks/administer-cluster/memory-manager/
          $ref: '#/components/schemas/MemoryManager'
        topologyManager:
          description: >-
            Optional. Controls Topology Manager configuration on the node. For
            more information, see:
            https://kubernetes.io/docs/tasks/administer-cluster/topology-manager/
          $ref: '#/components/schemas/TopologyManager'
        imageMinimumGcAge:
          description: >-
            Optional. Defines the minimum age for an unused image before it is
            garbage collected. The string must be a sequence of decimal numbers,
            each with optional fraction and a unit suffix, such as "300s",
            "1.5h", and "2h45m". Valid time units are "ns", "us" (or "µs"),
            "ms", "s", "m", "h". The value must be a positive duration less than
            or equal to 2 minutes. The default value is "2m0s" if unspecified.
          type: string
        imageGcHighThresholdPercent:
          description: >-
            Optional. Defines the percent of disk usage after which image
            garbage collection is always run. The percent is calculated as this
            field value out of 100. The value must be between 10 and 85,
            inclusive and greater than image_gc_low_threshold_percent. The
            default value is 85 if unspecified.
          format: int32
          type: integer
        cpuCfsQuotaPeriod:
          description: >-
            Set the CPU CFS quota period value 'cpu.cfs_period_us'. The string
            must be a sequence of decimal numbers, each with optional fraction
            and a unit suffix, such as "300ms". Valid time units are "ns", "us"
            (or "µs"), "ms", "s", "m", "h". The value must be a positive
            duration between 1ms and 1 second, inclusive.
          type: string
        shutdownGracePeriodSeconds:
          description: >-
            Optional. shutdown_grace_period_seconds is the maximum allowed grace
            period (in seconds) the total duration that the node should delay
            the shutdown during a graceful shutdown. This is the total grace
            period for pod termination for both regular and critical pods.
            https://kubernetes.io/docs/concepts/cluster-administration/node-shutdown/
            If set to 0, node will not enable the graceful node shutdown
            functionality. This field is only valid for Spot VMs. Allowed
            values: 0, 30, 120.
          format: int32
          type: integer
        cpuCfsQuota:
          description: >-
            Enable CPU CFS quota enforcement for containers that specify CPU
            limits. This option is enabled by default which makes kubelet use
            CFS quota
            (https://www.kernel.org/doc/Documentation/scheduler/sched-bwc.txt)
            to enforce container CPU limits. Otherwise, CPU limits will not be
            enforced at all. Disable this option to mitigate CPU throttling
            problems while still having your pods to be in Guaranteed QoS class
            by specifying the CPU limits. The default value is 'true' if
            unspecified.
          type: boolean
        imageGcLowThresholdPercent:
          description: >-
            Optional. Defines the percent of disk usage before which image
            garbage collection is never run. Lowest disk usage to garbage
            collect to. The percent is calculated as this field value out of
            100. The value must be between 10 and 85, inclusive and smaller than
            image_gc_high_threshold_percent. The default value is 80 if
            unspecified.
          format: int32
          type: integer
        allowedUnsafeSysctls:
          items:
            type: string
          type: array
          description: >-
            Optional. Defines a comma-separated allowlist of unsafe sysctls or
            sysctl patterns (ending in `*`). The unsafe namespaced sysctl groups
            are `kernel.shm*`, `kernel.msg*`, `kernel.sem`, `fs.mqueue.*`, and
            `net.*`. Leaving this allowlist empty means they cannot be set on
            Pods. To allow certain sysctls or sysctl patterns to be set on Pods,
            list them separated by commas. For example:
            `kernel.msg*,net.ipv4.route.min_pmtu`. See
            https://kubernetes.io/docs/tasks/administer-cluster/sysctl-cluster/
            for more details.
        evictionMinimumReclaim:
          description: >-
            Optional. eviction_minimum_reclaim is a map of signal names to
            quantities that defines minimum reclaims, which describe the minimum
            amount of a given resource the kubelet will reclaim when performing
            a pod eviction while that resource is under pressure.
          $ref: '#/components/schemas/EvictionMinimumReclaim'
        shutdownGracePeriodCriticalPodsSeconds:
          description: >-
            Optional. shutdown_grace_period_critical_pods_seconds is the maximum
            allowed grace period (in seconds) used to terminate critical pods
            during a node shutdown. This value should be <=
            shutdown_grace_period_seconds, and is only valid if
            shutdown_grace_period_seconds is set.
            https://kubernetes.io/docs/concepts/cluster-administration/node-shutdown/
            Range: [0, 120].
          format: int32
          type: integer
        evictionSoftGracePeriod:
          description: >-
            Optional. eviction_soft_grace_period is a map of signal names to
            quantities that defines grace periods for each soft eviction signal.
            The grace period is the amount of time that a pod must be under
            pressure before an eviction occurs.
          $ref: '#/components/schemas/EvictionGracePeriod'
        maxParallelImagePulls:
          description: >-
            Optional. Defines the maximum number of image pulls in parallel. The
            range is 2 to 5, inclusive. The default value is 2 or 3 depending on
            the disk type. See
            https://kubernetes.io/docs/concepts/containers/images/#maximum-parallel-image-pulls
            for more details.
          format: int32
          type: integer
        imageMaximumGcAge:
          description: >-
            Optional. Defines the maximum age an image can be unused before it
            is garbage collected. The string must be a sequence of decimal
            numbers, each with optional fraction and a unit suffix, such as
            "300s", "1.5h", and "2h45m". Valid time units are "ns", "us" (or
            "µs"), "ms", "s", "m", "h". The value must be a positive duration
            greater than image_minimum_gc_age or "0s". The default value is "0s"
            if unspecified, which disables this field, meaning images won't be
            garbage collected based on being unused for too long.
          type: string
        evictionSoft:
          description: >-
            Optional. eviction_soft is a map of signal names to quantities that
            defines soft eviction thresholds. Each signal is compared to its
            corresponding threshold to determine if a pod eviction should occur.
          $ref: '#/components/schemas/EvictionSignals'
        cpuManagerPolicy:
          description: >-
            Control the CPU management policy on the node. See
            https://kubernetes.io/docs/tasks/administer-cluster/cpu-management-policies/
            The following values are allowed. * "none": the default, which
            represents the existing scheduling behavior. * "static": allows pods
            with certain resource characteristics to be granted increased CPU
            affinity and exclusivity on the node. The default value is 'none' if
            unspecified.
          type: string
        evictionMaxPodGracePeriodSeconds:
          type: integer
          description: >-
            Optional. eviction_max_pod_grace_period_seconds is the maximum
            allowed grace period (in seconds) to use when terminating pods in
            response to a soft eviction threshold being met. This value
            effectively caps the Pod's terminationGracePeriodSeconds value
            during soft evictions. Default: 0. Range: [0, 300].
          format: int32
        crashLoopBackOff:
          description: >-
            Optional. Contains configuration options to modify node-level
            parameters for container restart behavior.
          $ref: '#/components/schemas/CrashLoopBackOffConfig'
        containerLogMaxSize:
          description: >-
            Optional. Defines the maximum size of the container log file before
            it is rotated. See
            https://kubernetes.io/docs/concepts/cluster-administration/logging/#log-rotation
            Valid format is positive number + unit, e.g. 100Ki, 10Mi. Valid
            units are Ki, Mi, Gi. The value must be between 10Mi and 500Mi,
            inclusive. Note that the total container log size
            (container_log_max_size * container_log_max_files) cannot exceed 1%
            of the total storage of the node, to avoid disk pressure caused by
            log files. The default value is 10Mi if unspecified.
          type: string
      type: object
    Metric:
      id: Metric
      description: Progress metric is (string, int|float|string) pair.
      properties:
        name:
          description: Required. Metric name, e.g., "nodes total", "percent done".
          type: string
        intValue:
          type: string
          description: For metrics with integer value.
          format: int64
        doubleValue:
          description: For metrics with floating point value.
          format: double
          type: number
        stringValue:
          description: For metrics with custom values (ratios, visual progress, etc.).
          type: string
      type: object
    AdditionalNodeNetworkConfig:
      description: >-
        AdditionalNodeNetworkConfig is the configuration for additional node
        networks within the NodeNetworkConfig message
      id: AdditionalNodeNetworkConfig
      type: object
      properties:
        network:
          description: Name of the VPC where the additional interface belongs
          type: string
        subnetwork:
          description: Name of the subnetwork where the additional interface belongs
          type: string
    ReleaseChannel:
      properties:
        channel:
          type: string
          description: >-
            channel specifies which release channel the cluster is subscribed
            to.
          enumDescriptions:
            - >-
              Deprecated: No channel specified. it will be removed in the
              future, use RAPID, REGULAR, STABLE or EXTENDED instead.
            - >-
              RAPID channel is offered on an early access basis for customers
              who want to test new releases. WARNING: Versions available in the
              RAPID Channel may be subject to unresolved issues with no known
              workaround and are not subject to any SLAs.
            - >-
              Clusters subscribed to REGULAR receive versions that are
              considered GA quality. REGULAR is intended for production users
              who want to take advantage of new features.
            - >-
              Clusters subscribed to STABLE receive versions that are known to
              be stable and reliable in production.
            - >-
              Clusters subscribed to EXTENDED receive extended support and
              availability for versions which are known to be stable and
              reliable in production.
          enumDeprecated:
            - true
            - false
            - false
            - false
            - false
          enum:
            - UNSPECIFIED
            - RAPID
            - REGULAR
            - STABLE
            - EXTENDED
      type: object
      id: ReleaseChannel
      description: >-
        ReleaseChannel indicates which release channel a cluster is subscribed
        to. Release channels are arranged in order of risk. When a cluster is
        subscribed to a release channel, Google maintains both the master
        version and the node version. Node auto-upgrade defaults to true and
        cannot be disabled.
    ClusterUpgradeInfo:
      id: ClusterUpgradeInfo
      description: ClusterUpgradeInfo contains the upgrade information of a cluster.
      properties:
        minorTargetVersion:
          description: minor_target_version indicates the target version for minor upgrade.
          type: string
        endOfStandardSupportTimestamp:
          description: >-
            The cluster's current minor version's end of standard support
            timestamp.
          type: string
        pausedReason:
          description: The auto upgrade paused reason.
          items:
            enumDescriptions:
              - >-
                AUTO_UPGRADE_PAUSED_REASON_UNSPECIFIED indicates an unspecified
                reason.
              - >-
                MAINTENANCE_WINDOW indicates the cluster is outside customer
                maintenance window.
              - >-
                MAINTENANCE_EXCLUSION_NO_UPGRADES indicates the cluster is in a
                maintenance exclusion with scope NO_UPGRADES.
              - >-
                MAINTENANCE_EXCLUSION_NO_MINOR_UPGRADES indicates the cluster is
                in a maintenance exclusion with scope NO_MINOR_UPGRADES.
              - >-
                CLUSTER_DISRUPTION_BUDGET indicates the cluster is outside the
                cluster disruption budget.
              - >-
                CLUSTER_DISRUPTION_BUDGET_MINOR_UPGRADE indicates the cluster is
                outside the cluster disruption budget for minor version upgrade.
              - >-
                SYSTEM_CONFIG indicates the cluster upgrade is paused by system
                config.
            enum:
              - AUTO_UPGRADE_PAUSED_REASON_UNSPECIFIED
              - MAINTENANCE_WINDOW
              - MAINTENANCE_EXCLUSION_NO_UPGRADES
              - MAINTENANCE_EXCLUSION_NO_MINOR_UPGRADES
              - CLUSTER_DISRUPTION_BUDGET
              - CLUSTER_DISRUPTION_BUDGET_MINOR_UPGRADE
              - SYSTEM_CONFIG
            type: string
          type: array
        endOfExtendedSupportTimestamp:
          description: >-
            The cluster's current minor version's end of extended support
            timestamp.
          type: string
        upgradeDetails:
          description: The list of past auto upgrades.
          items:
            $ref: '#/components/schemas/UpgradeDetails'
          type: array
        autoUpgradeStatus:
          items:
            type: string
            enumDescriptions:
              - UNKNOWN indicates an unknown status.
              - ACTIVE indicates an active status.
              - >-
                MINOR_UPGRADE_PAUSED indicates the minor version upgrade is
                paused.
              - UPGRADE_PAUSED indicates the upgrade is paused.
            enum:
              - UNKNOWN
              - ACTIVE
              - MINOR_UPGRADE_PAUSED
              - UPGRADE_PAUSED
          type: array
          description: The auto upgrade status.
        patchTargetVersion:
          description: patch_target_version indicates the target version for patch upgrade.
          type: string
        rollbackSafeUpgradeStatus:
          description: Output only. The cluster's rollback-safe upgrade status.
          $ref: '#/components/schemas/RollbackSafeUpgradeStatus'
          readOnly: true
      type: object
    EnterpriseConfig:
      properties:
        clusterTier:
          readOnly: true
          enum:
            - CLUSTER_TIER_UNSPECIFIED
            - STANDARD
            - ENTERPRISE
          type: string
          description: >-
            Output only. cluster_tier indicates the effective tier of the
            cluster.
          enumDescriptions:
            - CLUSTER_TIER_UNSPECIFIED is when cluster_tier is not set.
            - STANDARD indicates a standard GKE cluster.
            - ENTERPRISE indicates a GKE Enterprise cluster.
        desiredTier:
          type: string
          description: desired_tier specifies the desired tier of the cluster.
          enumDescriptions:
            - CLUSTER_TIER_UNSPECIFIED is when cluster_tier is not set.
            - STANDARD indicates a standard GKE cluster.
            - ENTERPRISE indicates a GKE Enterprise cluster.
          enum:
            - CLUSTER_TIER_UNSPECIFIED
            - STANDARD
            - ENTERPRISE
      type: object
      deprecated: true
      description: >-
        EnterpriseConfig is the cluster enterprise configuration. Deprecated:
        GKE Enterprise features are now available without an Enterprise tier.
      id: EnterpriseConfig
    NodeNetworkConfig:
      description: Parameters for node pool-level network config.
      id: NodeNetworkConfig
      type: object
      properties:
        network:
          description: Optional. Immutable. The VPC network for the node pool.
          type: string
        networkTierConfig:
          description: >-
            Output only. The network tier configuration for the node pool
            inherits from the cluster-level configuration and remains immutable
            throughout the node pool's lifecycle, including during upgrades.
          $ref: '#/components/schemas/NetworkTierConfig'
          readOnly: true
        podCidrOverprovisionConfig:
          description: >-
            [PRIVATE FIELD] Pod CIDR size overprovisioning config for the node
            pool. Pod CIDR size per node depends on max_pods_per_node. By
            default, the value of max_pods_per_node is rounded off to next power
            of 2 and we then double that to get the size of pod CIDR block per
            node. Example: max_pods_per_node of 30 would result in 64 IPs (/26).
            This config can disable the doubling of IPs (we still round off to
            next power of 2) Example: max_pods_per_node of 30 will result in 32
            IPs (/27) when overprovisioning is disabled.
          $ref: '#/components/schemas/PodCIDROverprovisionConfig'
        additionalPodNetworkConfigs:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalPodNetworkConfig'
          description: >-
            We specify the additional pod networks for this node pool using this
            list. Each pod network corresponds to an additional alias IP range
            for the node
        subnetwork:
          description: >-
            Optional. The subnetwork name/path for the node pool. Format:
            projects/{project}/regions/{region}/subnetworks/{subnetwork} If the
            cluster is associated with multiple subnetworks, the subnetwork can
            be either: - A user supplied subnetwork name during node pool
            creation (e.g., `my-subnet`). The name must be between 1 and 63
            characters long, start with a letter, contain only letters, numbers,
            and hyphens, and end with a letter or a number. - A full subnetwork
            path during node pool creation, such as
            `projects/gke-project/regions/us-central1/subnetworks/my-subnet` - A
            subnetwork path picked based on the IP utilization during node pool
            creation and is immutable.
          type: string
        acceleratorNetworkProfile:
          description: >-
            Immutable. The accelerator network profile for the node pool. For
            now the only valid value is "auto". If specified, the network
            configuration of the nodes in this node pool will be managed by this
            profile for the supported machine types, zone, etc.
          type: string
        networkPerformanceConfig:
          description: Network bandwidth tier configuration.
          $ref: '#/components/schemas/NetworkPerformanceConfig'
        podRange:
          description: >-
            The ID of the secondary range for pod IPs. If `create_pod_range` is
            true, this ID is used for the new range. If `create_pod_range` is
            false, uses an existing secondary range with this ID. Only
            applicable if `ip_allocation_policy.use_ip_aliases` is true. This
            field cannot be changed after the node pool has been created.
          type: string
        enablePrivateNodes:
          description: >-
            Whether nodes have internal IP addresses only. If
            enable_private_nodes is not specified, then the value is derived
            from Cluster.NetworkConfig.default_enable_private_nodes
          type: boolean
        podIpv4RangeUtilization:
          description: >-
            Output only. The utilization of the IPv4 range for the pod. The
            ratio is Usage/[Total number of IPs in the secondary range],
            Usage=numNodes*numZones*podIPsPerNode.
          format: double
          readOnly: true
          type: number
        createPodRange:
          description: >-
            Input only. Whether to create a new range for pod IPs in this node
            pool. Defaults are provided for `pod_range` and
            `pod_ipv4_cidr_block` if they are not specified. If neither
            `create_pod_range` or `pod_range` are specified, the cluster-level
            default (`ip_allocation_policy.cluster_ipv4_cidr_block`) is used.
            Only applicable if `ip_allocation_policy.use_ip_aliases` is true.
            This field cannot be changed after the node pool has been created.
          type: boolean
        podIpv4CidrBlock:
          description: >-
            The IP address range for pod IPs in this node pool. Only applicable
            if `create_pod_range` is true. Set to blank to have a range chosen
            with the default size. Set to /netmask (e.g. `/14`) to have a range
            chosen with a specific netmask. Set to a
            [CIDR](https://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing)
            notation (e.g. `10.96.0.0/14`) to pick a specific range to use. Only
            applicable if `ip_allocation_policy.use_ip_aliases` is true. This
            field cannot be changed after the node pool has been created.
          type: string
        additionalNodeNetworkConfigs:
          description: >-
            We specify the additional node networks for this node pool using
            this list. Each node network corresponds to an additional interface
          items:
            $ref: '#/components/schemas/AdditionalNodeNetworkConfig'
          type: array
    ConsumptionMeteringConfig:
      type: object
      properties:
        enabled:
          description: >-
            Whether to enable consumption metering for this cluster. If enabled,
            a second BigQuery table will be created to hold resource consumption
            records.
          type: boolean
      description: Parameters for controlling consumption metering.
      id: ConsumptionMeteringConfig
    AutoMonitoringConfig:
      properties:
        scope:
          type: string
          description: Scope for GKE Workload Auto-Monitoring.
          enumDescriptions:
            - Not set.
            - Auto-Monitoring is enabled for all supported applications.
            - Disable Auto-Monitoring.
          enum:
            - SCOPE_UNSPECIFIED
            - ALL
            - NONE
      type: object
      id: AutoMonitoringConfig
      description: >-
        AutoMonitoringConfig defines the configuration for GKE Workload
        Auto-Monitoring.
    UpdateInfo:
      id: UpdateInfo
      description: >-
        UpdateInfo contains resource (instance groups, etc), status and other
        intermediate information relevant to a node pool upgrade.
      properties:
        blueGreenInfo:
          description: Information of a blue-green upgrade.
          $ref: '#/components/schemas/BlueGreenInfo'
      type: object
    LoggingComponentConfig:
      type: object
      properties:
        enableComponents:
          description: >-
            Select components to collect logs. An empty set would disable all
            logging.
          items:
            enumDescriptions:
              - Default value. This shouldn't be used.
              - system components
              - workloads
              - kube-apiserver
              - kube-scheduler
              - kube-controller-manager
              - kcp-sshd
              - kcp connection logs
              - horizontal pod autoscaler decision logs
              - vertical pod autoscaler decision logs
            enum:
              - COMPONENT_UNSPECIFIED
              - SYSTEM_COMPONENTS
              - WORKLOADS
              - APISERVER
              - SCHEDULER
              - CONTROLLER_MANAGER
              - KCP_SSHD
              - KCP_CONNECTION
              - KCP_HPA
              - KCP_VPA
            type: string
          type: array
      description: LoggingComponentConfig is cluster logging component configuration.
      id: LoggingComponentConfig
    NetworkPerformanceConfig:
      properties:
        totalEgressBandwidthTier:
          type: string
          description: Specifies the total network bandwidth tier for the NodePool.
          enumDescriptions:
            - Default value
            - Higher bandwidth, actual values based on VM size.
          enum:
            - TIER_UNSPECIFIED
            - TIER_1
      type: object
      id: NetworkPerformanceConfig
      description: Configuration of all network bandwidth tiers
    CostManagementConfig:
      description: Configuration for fine-grained cost management feature.
      id: CostManagementConfig
      type: object
      properties:
        enabled:
          description: Whether the feature is enabled or not.
          type: boolean
    PrivilegedAdmissionConfig:
      type: object
      properties:
        allowlistPaths:
          description: >-
            The customer allowlist Cloud Storage paths for the cluster. These
            paths are used with the `--autopilot-privileged-admission` flag to
            authorize privileged workloads in Autopilot clusters. Paths can be
            GKE-owned, in the format `gke:////`, or customer-owned, in the
            format `gs:///`. Wildcards (`*`) are supported to authorize all
            allowlists under specific paths or directories. Example:
            `gs://my-bucket/*` will authorize all allowlists under the
            `my-bucket` bucket.
          type: array
          items:
            type: string
      description: >-
        PrivilegedAdmissionConfig stores the list of authorized allowlist paths
        for the cluster.
      id: PrivilegedAdmissionConfig
    SetNodePoolManagementRequest:
      properties:
        projectId:
          description: >-
            Deprecated. The Google Developers Console [project ID or project
