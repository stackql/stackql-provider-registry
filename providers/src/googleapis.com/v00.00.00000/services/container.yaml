              - Storage
              - Horizontal Pod Autoscaling
              - Pod
              - DaemonSet
              - Deployment
              - Statefulset
              - CADVISOR
              - KUBELET
              - NVIDIA Data Center GPU Manager (DCGM)
              - JobSet
            enum:
              - COMPONENT_UNSPECIFIED
              - SYSTEM_COMPONENTS
