            - exposed via external load balancer
          enum:
            - RELAY_MODE_UNSPECIFIED
            - DISABLED
            - INTERNAL_VPC_LB
            - EXTERNAL_LB
        enableMetrics:
          description: Expose flow metrics on nodes
          type: boolean
        enableRelay:
          description: Enable Relay component
          type: boolean
    ManagedMachineLearningDiagnosticsConfig:
