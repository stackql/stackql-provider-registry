            guide](https://docs.nvidia.com/datacenter/tesla/mig-user-guide/#partitioning).
          type: string
        acceleratorCount:
          type: string
          description: The number of the accelerator cards exposed to an instance.
          format: int64
        gpuDriverInstallationConfig:
          description: The configuration for auto installation of GPU driver.
          $ref: '#/components/schemas/GPUDriverInstallationConfig'
        gpuSharingConfig:
          $ref: '#/components/schemas/GPUSharingConfig'
          description: The configuration for GPU sharing options.
        acceleratorType:
          description: >-
            The accelerator type resource name. List of supported accelerators
            [here](https://cloud.google.com/compute/docs/gpus)
          type: string
      type: object
      id: AcceleratorConfig
      description: AcceleratorConfig represents a Hardware Accelerator request.
    StandardRolloutPolicy:
      type: object
      properties:
        batchNodeCount:
          description: Number of blue nodes to drain in a batch.
          format: int32
          type: integer
        batchPercentage:
          type: number
          description: >-
            Percentage of the blue pool nodes to drain in a batch. The range of
            this field should be (0.0, 1.0].
          format: float
        batchSoakDuration:
          description: Soak time after each batch gets drained. Default to zero.
          format: google-duration
          type: string
      description: Standard rollout policy is the default policy for blue-green.
      id: StandardRolloutPolicy
    RBACBindingConfig:
      type: object
      properties:
        enableInsecureBindingSystemUnauthenticated:
