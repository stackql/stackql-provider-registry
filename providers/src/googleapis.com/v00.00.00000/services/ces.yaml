          type: string
        tlsConfig:
          description: >-
            Optional. The TLS configuration. Includes the custom server
            certificates that the client will trust.
          $ref: '#/components/schemas/TlsConfig'
        serviceDirectoryConfig:
          description: Optional. Service Directory configuration.
          $ref: '#/components/schemas/ServiceDirectoryConfig'
      id: OpenApiTool
      description: A remote API tool defined by an OpenAPI schema.
      type: object
    LfA2aV1TaskPushNotificationConfig:
