    EndUserAuthConfigOauth2JwtBearerConfig:
      id: EndUserAuthConfigOauth2JwtBearerConfig
      description: JWT Profile Oauth 2.0 Authorization Grant authentication configuration.
      type: object
      properties:
        issuer:
          description: >-
            Required. Issuer parameter name to pass through. Must be in the
            format `$context.variables.`.
          type: string
        subject:
          description: >-
            Required. Subject parameter name to pass through. Must be in the
