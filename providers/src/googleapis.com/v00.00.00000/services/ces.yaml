openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Gemini Enterprise for Customer Experience API
  description: ''
  version: v1
  x-discovery-doc-revision: '20260708'
  x-generated-date: '2026-07-31'
externalDocs:
  url: >-
    https://docs.cloud.google.com/customer-engagement-ai/conversational-agents/ps
servers:
  - url: https://ces.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/ces: Create, update, delete, and manage your Next Gen Agents
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    LfA2aV1OAuthFlows:
      properties:
        implicit:
          deprecated: true
          description: 'Deprecated: Use Authorization Code + PKCE instead.'
          $ref: '#/components/schemas/LfA2aV1ImplicitOAuthFlow'
        password:
          deprecated: true
          description: 'Deprecated: Use Authorization Code + PKCE or Device Code.'
          $ref: '#/components/schemas/LfA2aV1PasswordOAuthFlow'
        deviceCode:
          description: Configuration for the OAuth Device Code flow.
          $ref: '#/components/schemas/LfA2aV1DeviceCodeOAuthFlow'
        clientCredentials:
          description: Configuration for the OAuth Client Credentials flow.
          $ref: '#/components/schemas/LfA2aV1ClientCredentialsOAuthFlow'
        authorizationCode:
          description: Configuration for the OAuth Authorization Code flow.
          $ref: '#/components/schemas/LfA2aV1AuthorizationCodeOAuthFlow'
      id: LfA2aV1OAuthFlows
      description: Defines the configuration for the supported OAuth 2.0 flows.
      type: object
    TransferRule:
      properties:
        disablePlannerTransfer:
          description: >-
            Optional. Rule that prevents the planner from transferring to the
            target agent.
          $ref: '#/components/schemas/TransferRuleDisablePlannerTransfer'
        deterministicTransfer:
          description: >-
            Optional. A rule that immediately transfers to the target agent when
            the condition is met.
          $ref: '#/components/schemas/TransferRuleDeterministicTransfer'
        childAgent:
          description: >-
            Required. The resource name of the child agent the rule applies to.
            Format:
            `projects/{project}/locations/{location}/apps/{app}/agents/{agent}`
          type: string
        direction:
          enum:
            - DIRECTION_UNSPECIFIED
            - PARENT_TO_CHILD
            - CHILD_TO_PARENT
          description: Required. The direction of the transfer.
          type: string
          enumDescriptions:
            - Unspecified direction.
            - Transfer from the parent agent to the child agent.
            - Transfer from the child agent to the parent agent.
      id: TransferRule
      description: Rule for transferring to a specific agent.
      type: object
    RetrieveToolSchemaResponse:
      properties:
        tool:
          description: >-
            The name of the tool that the schema is for. Format:
            `projects/{project}/locations/{location}/apps/{app}/tools/{tool}`
          type: string
        inputSchema:
          description: The schema of the tool input parameters.
          $ref: '#/components/schemas/Schema'
        toolsetTool:
          description: The toolset tool that the schema is for.
          $ref: '#/components/schemas/ToolsetTool'
        outputSchema:
          description: The schema of the tool output parameters.
          $ref: '#/components/schemas/Schema'
      id: RetrieveToolSchemaResponse
      description: Response message for ToolService.RetrieveToolSchema.
      type: object
    AgentTransfer:
      id: AgentTransfer
      description: >-
        Represents an event indicating the transfer of a conversation to a
        different agent.
      type: object
      properties:
        targetAgent:
          description: >-
            Required. The agent to which the conversation is being transferred.
            The agent will handle the conversation from this point forward.
            Format:
            `projects/{project}/locations/{location}/apps/{app}/agents/{agent}`
          type: string
        displayName:
          description: Output only. Display name of the agent.
          readOnly: true
          type: string
    RetrieveToolsRequest:
      properties:
        toolIds:
          description: >-
            Optional. The identifiers of the tools to retrieve from the toolset.
            If empty, all tools in the toolset will be returned.
          type: array
          items:
            type: string
        bypassPersistenceConfig:
          description: >-
            Optional. If true, the returned tools will contain raw descriptions
            and schemas directly from the server, bypassing any stored
            persistence configurations (overrides/snapshots).
          type: boolean
      id: RetrieveToolsRequest
      description: Request message for ToolService.RetrieveTools.
      type: object
    DataStoreToolBoostSpecs:
      id: DataStoreToolBoostSpecs
      description: >-
        Boost specifications to boost certain documents. For more information,
        please refer to
        https://cloud.google.com/generative-ai-app-builder/docs/boosting.
      type: object
      properties:
        spec:
          description: Required. A list of boosting specifications.
          type: array
          items:
            $ref: '#/components/schemas/DataStoreToolBoostSpec'
        dataStores:
          description: >-
            Required. The Data Store where the boosting configuration is
            applied. Full resource name of DataStore, such as
            projects/{project}/locations/{location}/collections/{collection}/dataStores/{dataStore}.
          type: array
          items:
            type: string
    LanguageSettings:
      id: LanguageSettings
      description: Language settings of the app.
      type: object
      properties:
        supportedLanguageCodes:
          description: >-
            Optional. List of languages codes supported by the app, in addition
            to the `default_language_code`.
          type: array
          items:
            type: string
        defaultLanguageCode:
          description: Optional. The default language code of the app.
          type: string
        fallbackAction:
          description: >-
            Optional. Deprecated: This feature is no longer supported. Use
            `enable_multilingual_support` instead to improve handling of
            multilingual input. The action to perform when an agent receives
            input in an unsupported language. This can be a predefined action or
            a custom tool call. Valid values are: - A tool's full resource name,
            which triggers a specific tool execution. - A predefined system
            action, such as "escalate" or "exit", which triggers an EndSession
            signal with corresponding metadata to terminate the conversation.
          type: string
          deprecated: true
        enableMultilingualSupport:
          description: >-
            Optional. Enables multilingual support. If true, agents in the app
            will use pre-built instructions to improve handling of multilingual
            input.
          type: boolean
    EndSession:
      properties:
        metadata:
          additionalProperties:
            type: any
            description: Properties of the object.
          description: >-
            Optional. Provides additional information about the end session
            signal, such as the reason for ending the session.
          type: object
      id: EndSession
      description: >-
        Indicates the session has terminated, due to either successful
        completion (e.g. user says "Good bye!" ) or an agent escalation. The
        agent will not process any further inputs after session is terminated
        and the client should half-close and disconnect after receiving all
        remaining responses from the agent.
      type: object
    LfA2aV1TaskStatus:
      properties:
        state:
          enum:
            - TASK_STATE_UNSPECIFIED
            - TASK_STATE_SUBMITTED
            - TASK_STATE_WORKING
            - TASK_STATE_COMPLETED
            - TASK_STATE_FAILED
            - TASK_STATE_CANCELED
            - TASK_STATE_INPUT_REQUIRED
            - TASK_STATE_REJECTED
            - TASK_STATE_AUTH_REQUIRED
          description: Required. The current state of this task.
          type: string
          enumDescriptions:
            - The task is in an unknown or indeterminate state.
            - >-
              Indicates that a task has been successfully submitted and
              acknowledged.
            - Indicates that a task is actively being processed by the agent.
            - >-
              Indicates that a task has finished successfully. This is a
              terminal state.
            - >-
              Indicates that a task has finished with an error. This is a
              terminal state.
            - >-
              Indicates that a task was canceled before completion. This is a
              terminal state.
            - >-
              Indicates that the agent requires additional user input to
              proceed. This is an interrupted state.
            - >-
              Indicates that the agent has decided to not perform the task. This
              may be done during initial task creation or later once an agent
              has determined it can't or won't proceed. This is a terminal
              state.
            - >-
              Indicates that authentication is required to proceed. This is an
              interrupted state.
        message:
          description: A message associated with the status.
          $ref: '#/components/schemas/LfA2aV1Message'
        timestamp:
          description: >-
            ISO 8601 Timestamp when the status was recorded. Example:
            "2023-10-27T10:00:00Z"
          type: string
          format: google-datetime
      id: LfA2aV1TaskStatus
      description: A container for the status of a task
      type: object
    AgentSkill:
      properties:
        name:
          description: Required. A human-readable name for the skill.
          type: string
        tags:
          description: Required. A set of keywords describing the skill's capabilities.
          type: array
          items:
            type: string
        examples:
          description: Example prompts or scenarios that this skill can handle.
          type: array
          items:
            type: string
        inputModes:
          description: >-
            The set of supported input media types for this skill, overriding
            the agent's defaults.
          type: array
          items:
            type: string
        id:
          description: Required. A unique identifier for the agent's skill.
          type: string
        description:
          description: Required. A detailed description of the skill.
          type: string
        outputModes:
          description: >-
            The set of supported output media types for this skill, overriding
            the agent's defaults.
          type: array
          items:
            type: string
      id: AgentSkill
      description: Represents a distinct capability or function that an agent can perform.
      type: object
    SynthesizeSpeechConfig:
      id: SynthesizeSpeechConfig
      description: Configuration for how the agent response should be synthesized.
      type: object
      properties:
        speakingRate:
          description: >-
            Optional. The speaking rate/speed in the range [0.25, 2.0]. 1.0 is
            the normal native speed supported by the specific voice. 2.0 is
            twice as fast, and 0.5 is half as fast. Values outside of the range
            [0.25, 2.0] will return an error.
          type: number
          format: double
        voiceSampleGcsUri:
          description: >-
            Optional. The Cloud Storage URI to the audio sample for voice
            cloning. The audio sample should be a mono-channel, 24kHz WAV file.
            Note: Please make sure the CES service agent
            `service-@gcp-sa-ces.iam.gserviceaccount.com` has
            `storage.objects.get` permission to the Cloud Storage object.
          type: string
        model:
          description: >-
            Optional. The model used to synthesize audio. Currently supported
            values: - "gemini-3.1-flash-tts-preview" If empty, Chirp3-HD is
            used.
          type: string
        voice:
          description: >-
            Optional. The name of the voice. If not set, the service will choose
            a voice based on the other parameters such as language_code. For the
            list of available voices, please refer to [Supported voices and
            languages](https://cloud.google.com/text-to-speech/docs/voices) from
            Cloud Text-to-Speech.
          type: string
        instruction:
          description: >-
            Optional. The instruction used to synthesize speech when using a
            generative model.
          type: string
    SessionInput:
      properties:
        audio:
          description: Optional. Audio data from the end user.
          type: string
          format: byte
        variables:
          description: >-
            Optional. Contextual variables for the session, keyed by name. Only
            variables declared in the app will be used by the CES agent.
            Unrecognized variables will still be sent to the Dialogflow agent as
            additional session parameters.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        text:
          description: Optional. Text data from the end user.
          type: string
        dtmf:
          description: Optional. DTMF digits from the end user.
          type: string
        blob:
          description: Optional. Blob data from the end user.
          $ref: '#/components/schemas/Blob'
        image:
          description: Optional. Image data from the end user.
          $ref: '#/components/schemas/Image'
        willContinue:
          description: >-
            Optional. A flag to indicate if the current message is a fragment of
            a larger input in the bidi streaming session. When set to `true`,
            the agent defers processing until it receives a subsequent message
            where `will_continue` is `false`, or until the system detects an
            endpoint in the audio input. NOTE: This field does not apply to
            audio and DTMF inputs, as they are always processed automatically
            based on the endpointing signal.
          type: boolean
        toolResponses:
          description: Optional. Execution results for the tool calls from the client.
          $ref: '#/components/schemas/ToolResponses'
        event:
          description: Optional. Event input.
          $ref: '#/components/schemas/Event'
      id: SessionInput
      description: Input for the session.
      type: object
    LfA2aV1AgentCardSignature:
      properties:
        signature:
          description: Required. The computed signature, base64url-encoded.
          type: string
        protected:
          description: >-
            Required. Required. The protected JWS header for the signature. This
            is always a base64url-encoded JSON object.
          type: string
        header:
          description: The unprotected JWS header values.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
      id: LfA2aV1AgentCardSignature
      description: >-
        AgentCardSignature represents a JWS signature of an AgentCard. This
        follows the JSON format of an RFC 7515 JSON Web Signature (JWS).
      type: object
    AgentTool:
      id: AgentTool
      description: Represents a tool that allows the agent to call another agent.
      type: object
      properties:
        name:
          description: Required. The name of the agent tool.
          type: string
        agent:
          description: >-
            Optional. The resource name of the agent that is the entry point of
            the tool. Format:
            `projects/{project}/locations/{location}/agents/{agent}`
          type: string
        description:
          description: Optional. Description of the tool's purpose.
          type: string
    CitationsCitedChunk:
      id: CitationsCitedChunk
      description: Piece of cited information.
      type: object
      properties:
        uri:
          description: URI used for citation.
          type: string
        title:
          description: Title of the cited document.
          type: string
        text:
          description: Text used for citation.
          type: string
        requiresAttribution:
          description: >-
            Whether this citation requires attribution to be shown to the end
            users.
          type: boolean
    OAuthConfig:
      properties:
        tokenEndpoint:
          description: >-
            Required. The token endpoint in the OAuth provider to exchange for
            an access token.
          type: string
        oauthGrantType:
          enumDescriptions:
            - Unspecified. Defaults to CLIENT_CREDENTIAL.
            - >-
              Represents the [client credential
              flow](https://oauth.net/2/grant-types/client-credentials).
          description: Required. OAuth grant types.
          type: string
          enum:
            - OAUTH_GRANT_TYPE_UNSPECIFIED
            - CLIENT_CREDENTIAL
        clientId:
          description: Required. The client ID from the OAuth provider.
          type: string
        clientSecretVersion:
          description: >-
            Required. The name of the SecretManager secret version resource
            storing the client secret. Format:
            `projects/{project}/secrets/{secret}/versions/{version}` Note: You
            should grant `roles/secretmanager.secretAccessor` role to the CES
            service agent `service-@gcp-sa-ces.iam.gserviceaccount.com`.
          type: string
        scopes:
          description: Optional. The OAuth scopes to grant.
          type: array
          items:
            type: string
      id: OAuthConfig
      description: Configurations for authentication with OAuth.
      type: object
    TransferRuleDeterministicTransfer:
      properties:
        pythonCodeCondition:
          description: >-
            Optional. A rule that uses Python code block to evaluate the
            conditions. If the condition evaluates to true, the transfer occurs.
          $ref: '#/components/schemas/PythonCodeCondition'
        expressionCondition:
          description: >-
            Optional. A rule that evaluates a session state condition. If the
            condition evaluates to true, the transfer occurs.
          $ref: '#/components/schemas/ExpressionCondition'
      id: TransferRuleDeterministicTransfer
      description: >-
        Deterministic transfer rule. When the condition evaluates to true, the
        transfer occurs.
      type: object
    McpToolDefinition:
      properties:
        description:
          description: >-
            Output only. The description of the MCP tool. This can be overridden
            by `description_override` in `McpToolOverride`.
          readOnly: true
          type: string
        inputSchema:
          description: Output only. The schema of the input arguments of the MCP tool.
          readOnly: true
          $ref: '#/components/schemas/Schema'
        outputSchema:
          description: Output only. The schema of the output arguments of the MCP tool.
          readOnly: true
          $ref: '#/components/schemas/Schema'
      id: McpToolDefinition
      description: >-
        Container for a tool's core definition elements that are snapshot.
        Schemas in the snapshot are used as-is and cannot be overridden.
      type: object
    ImportAppRequestImportOptions:
      id: ImportAppRequestImportOptions
      description: >-
        Configuration options for the app import process. These options control
        how the import behaves, particularly when conflicts arise with existing
        app data.
      type: object
      properties:
        conflictResolutionStrategy:
          enum:
            - CONFLICT_RESOLUTION_STRATEGY_UNSPECIFIED
            - REPLACE
            - OVERWRITE
          description: >-
            Optional. The strategy to use when resolving conflicts during
            import.
          type: string
          enumDescriptions:
            - The conflict resolution strategy is unspecified.
            - >-
              Replace existing data with imported data. If an app with the same
              `app_id` already exists, its content will be updated based on the
              imported app. - Resources (App, Agents, Tools, Examples,
              Guardrails, Toolsets) in the imported app that have the same
              display name as existing resources will overwrite the existing
              ones. - Imported resources with new display names will be created.
              - Existing resources that do not have a matching display name in
              the imported app will remain untouched.
            - >-
              Overwrite existing data with imported data. If an app with the
              same `app_id` already exists, its content will be overwritten with
              the imported app. - Existing resources (Agents, Tools, Examples,
              Guardrails, Toolsets) in the app will be deleted. - Imported
              resources will be created as new resources.
    MetricAnalysisSettings:
      id: MetricAnalysisSettings
      description: >-
        Settings to describe the conversation data collection behaviors for LLM
        analysis metrics pipeline.
      type: object
      properties:
        llmMetricsOptedOut:
          description: >-
            Optional. Whether to collect conversation data for llm analysis
            metrics. If true, conversation data will not be collected for llm
            analysis metrics; otherwise, conversation data will be collected.
          type: boolean
    ListDeploymentsResponse:
      id: ListDeploymentsResponse
      description: Response message for AgentService.ListDeployments.
      type: object
      properties:
        deployments:
          description: The list of deployments.
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
          type: string
    LfA2aV1ImplicitOAuthFlow:
      properties:
        authorizationUrl:
          description: >-
            The authorization URL to be used for this flow. This MUST be in the
            form of a URL. The OAuth2 standard requires the use of TLS
          type: string
        refreshUrl:
          description: >-
            The URL to be used for obtaining refresh tokens. This MUST be in the
            form of a URL. The OAuth2 standard requires the use of TLS.
          type: string
        scopes:
          description: >-
            The available scopes for the OAuth2 security scheme. A map between
            the scope name and a short description for it. The map MAY be empty.
          type: object
          additionalProperties:
            type: string
      id: LfA2aV1ImplicitOAuthFlow
      description: 'Deprecated: Use Authorization Code + PKCE instead.'
      type: object
    McpToolset:
      properties:
        serverAddress:
          description: >-
            Required. The address of the MCP server, for example,
            "https://example.com/mcp/". If the server is built with the MCP SDK,
            the url should be suffixed with "/mcp/". Only Streamable HTTP
            transport based servers are supported. See
            https://modelcontextprotocol.io/specification/2025-03-26/basic/transports#streamable-http
            for more details.
          type: string
        customHeaders:
          additionalProperties:
            type: string
          description: >-
            Optional. The custom headers to send in the request to the MCP
            server. The values must be in the format `$context.variables.` and
            can be set in the session variables. See
            https://docs.cloud.google.com/customer-engagement-ai/conversational-agents/ps/tool/open-api#openapi-injection
            for more details.
          type: object
        tlsConfig:
          description: >-
            Optional. The TLS configuration. Includes the custom server
            certificates that the client should trust.
          $ref: '#/components/schemas/TlsConfig'
        serviceDirectoryConfig:
          description: >-
            Optional. Service Directory configuration for VPC-SC, used to
            resolve service names within a perimeter.
          $ref: '#/components/schemas/ServiceDirectoryConfig'
        apiAuthentication:
          description: >-
            Optional. Authentication information required to access tools and
            execute a tool against the MCP server. For bearer token
            authentication, the token applies only to tool execution, not to
            listing tools. This requires that tools can be listed without
            authentication.
          $ref: '#/components/schemas/ApiAuthentication'
        toolOverrides:
          description: >-
            Optional. Overrides for individual tools within this toolset. This
            allows overriding specific details like descriptions, names, or
            pinning the tools' states so they aren't fully dynamic.
          type: array
          items:
            $ref: '#/components/schemas/McpToolOverride'
      id: McpToolset
      description: >-
        A toolset that contains a list of tools that are offered by the MCP
        server.
      type: object
    ChannelProfileInstagramConfig:
      id: ChannelProfileInstagramConfig
      description: Configuration specific to Instagram deployments.
      type: object
      properties:
        instagramAccountId:
          description: Required. The Instagram Account ID.
          type: string
        thumbnailUrl:
          description: Output only. The fetched Meta business profile thumbnail URL.
          readOnly: true
          type: string
        description:
          description: Output only. The description of the Meta business page or profile.
          readOnly: true
          type: string
        displayName:
          description: Output only. The fetched Meta business page name.
          readOnly: true
          type: string
    LfA2aV1StringList:
      id: LfA2aV1StringList
      description: protolint:disable REPEATED_FIELD_NAMES_PLURALIZED A list of strings.
      type: object
      properties:
        list:
          description: The individual string values.
          type: array
          items:
            type: string
    CodeBlock:
      properties:
        pythonCode:
          description: >-
            Required. Python code which will be invoked in tool fake mode.
            Expected Python function signature - To catch all tool calls: def
            fake_tool_call(tool: Tool, input: dict[str, Any], callback_context:
            CallbackContext) -> Optional[dict[str, Any]]: To catch a specific
            tool call: def fake_{tool_id}(tool: Tool, input: dict[str, Any],
            callback_context: CallbackContext) -> Optional[dict[str, Any]]: If
            the function returns None, the real tool will be invoked instead.
          type: string
      id: CodeBlock
      description: A code block to be executed instead of a real tool call.
      type: object
    DataStoreToolSummarizationConfig:
      id: DataStoreToolSummarizationConfig
      description: Summarization configuration.
      type: object
      properties:
        modelSettings:
          description: Optional. Configurations for the LLM model.
          $ref: '#/components/schemas/ModelSettings'
        prompt:
          description: >-
            Optional. The prompt definition. If not set, default prompt will be
            used.
          type: string
        disabled:
          description: Optional. Whether summarization is disabled.
          type: boolean
    GenerateChatTokenResponse:
      id: GenerateChatTokenResponse
      description: Response message for WidgetService.GenerateChatToken.
      type: object
      properties:
        expireTime:
          description: The time at which the chat token expires.
          type: string
          format: google-datetime
        chatToken:
          description: >-
            The session scoped token for chat widget to authenticate with
            Session APIs.
          type: string
    TriggerActionResponse:
      id: TriggerActionResponse
      description: Represents a response from the agent.
      type: object
      properties:
        disabled:
          description: >-
            Optional. Whether the response is disabled. Disabled responses are
            not used by the agent.
          type: boolean
        text:
          description: Required. Text for the agent to respond with.
          type: string
    LfA2aV1OpenIdConnectSecurityScheme:
      properties:
        openIdConnectUrl:
          description: >-
            Required. The [OpenID Connect Discovery
            URL](https://openid.net/specs/openid-connect-discovery-1_0.html) for
            the OIDC provider's metadata.
          type: string
        description:
          description: An optional description for the security scheme.
          type: string
      id: LfA2aV1OpenIdConnectSecurityScheme
      description: Defines a security scheme using OpenID Connect.
      type: object
    GoogleSearchToolPromptConfig:
      id: GoogleSearchToolPromptConfig
      description: >-
        Prompt settings used by the model when processing or summarizing the
        google search results.
      type: object
      properties:
        textPrompt:
          description: >-
            Optional. Defines the prompt used for the system instructions when
            interacting with the agent in chat conversations. If not set,
            default prompt will be used.
          type: string
        voicePrompt:
          description: >-
            Optional. Defines the prompt used for the system instructions when
            interacting with the agent in voice conversations. If not set,
            default prompt will be used.
          type: string
    BargeInConfig:
      id: BargeInConfig
      description: Configuration for how the user barge-in activities should be handled.
      type: object
      properties:
        disableBargeIn:
          deprecated: true
          description: >-
            Optional. Deprecated: `disable_barge_in` is deprecated in favor of
            `disable_barge_in_control` in ChannelProfile. Disables user barge-in
            while the agent is speaking. If true, user input during agent
            response playback will be ignored.
          type: boolean
        bargeInAwareness:
          description: >-
            Optional. If enabled, the agent will adapt its next response based
            on the assumption that the user hasn't heard the full preceding
            agent message. This should not be used in scenarios where agent
            responses are displayed visually.
          type: boolean
    ToolCall:
      properties:
        id:
          description: >-
            Optional. The unique identifier of the tool call. If populated, the
            client should return the execution result with the matching ID in
            ToolResponse.
          type: string
        toolsetTool:
          description: Optional. The toolset tool to execute.
          $ref: '#/components/schemas/ToolsetTool'
        tool:
          description: >-
            Optional. The name of the tool to execute. Format:
            `projects/{project}/locations/{location}/apps/{app}/tools/{tool}`
          type: string
        args:
          additionalProperties:
            type: any
            description: Properties of the object.
          description: >-
            Optional. The input parameters and values for the tool in JSON
            object format.
          type: object
        displayName:
          description: Output only. Display name of the tool.
          readOnly: true
          type: string
      id: ToolCall
      description: Request for the client or the agent to execute the specified tool.
      type: object
    ToolsetTool:
      properties:
        toolId:
          description: >-
            Optional. The tool ID to filter the tools to retrieve the schema
            for.
          type: string
        toolset:
          description: >-
            Required. The resource name of the Toolset from which this tool is
            derived. Format:
            `projects/{project}/locations/{location}/apps/{app}/toolsets/{toolset}`
          type: string
      id: ToolsetTool
      description: A tool that is created from a toolset.
      type: object
    SessionConfigRemoteDialogflowQueryParameters:
      properties:
        payload:
          additionalProperties:
            type: any
            description: Properties of the object.
          description: >-
            Optional. The payload to be sent in
            [QueryParameters](https://cloud.google.com/dialogflow/cx/docs/reference/rpc/google.cloud.dialogflow.cx.v3#queryparameters).
          type: object
        endUserMetadata:
          description: >-
            Optional. The end user metadata to be sent in
            [QueryParameters](https://cloud.google.com/dialogflow/cx/docs/reference/rpc/google.cloud.dialogflow.cx.v3#queryparameters).
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        webhookHeaders:
          additionalProperties:
            type: string
          description: >-
            Optional. The HTTP headers to be sent as webhook_headers in
            [QueryParameters](https://cloud.google.com/dialogflow/cx/docs/reference/rpc/google.cloud.dialogflow.cx.v3#queryparameters).
          type: object
      id: SessionConfigRemoteDialogflowQueryParameters
      description: >-
        [QueryParameters](https://cloud.google.com/dialogflow/cx/docs/reference/rpc/google.cloud.dialogflow.cx.v3#queryparameters)
        to send to the remote
        [Dialogflow](https://cloud.google.com/dialogflow/cx/docs/concept/console-conversational-agents)
        agent when the session control is transferred to the remote agent.
      type: object
    AmbientSoundConfig:
      id: AmbientSoundConfig
      description: >-
        Configuration for the ambient sound to be played with the synthesized
        agent response, to enhance the naturalness of the conversation.
      type: object
      properties:
        volumeGainDb:
          description: >-
            Optional. Volume gain (in dB) of the normal native volume supported
            by ambient noise, in the range [-96.0, 16.0]. If unset, or set to a
            value of 0.0 (dB), will play at normal native signal amplitude. A
            value of -6.0 (dB) will play at approximately half the amplitude of
            the normal native signal amplitude. A value of +6.0 (dB) will play
            at approximately twice the amplitude of the normal native signal
            amplitude. We strongly recommend not to exceed +10 (dB) as there's
            usually no effective increase in loudness for any value greater than
            that.
          type: number
          format: double
        prebuiltAmbientSound:
          description: >-
            Optional. Name of the prebuilt ambient sound. Valid values are: -
            "coffee_shop" - "keyboard" - "keypad" - "hum" - "office_1" -
            "office_2" - "office_3" - "room_1" - "room_2" - "room_3" - "room_4"
            - "room_5" - "air_conditioner"
          type: string
        gcsUri:
          description: >-
            Optional. Ambient noise as a mono-channel, 16kHz WAV file stored in
            [Cloud Storage](https://cloud.google.com/storage). Note: Please make
            sure the CES service agent
            `service-@gcp-sa-ces.iam.gserviceaccount.com` has
            `storage.objects.get` permission to the Cloud Storage object.
          type: string
        prebuiltAmbientNoise:
          enum:
            - PREBUILT_AMBIENT_NOISE_UNSPECIFIED
            - RETAIL_STORE
            - CONVENTION_HALL
            - OUTDOOR
          description: >-
            Optional. Deprecated: `prebuilt_ambient_noise` is deprecated in
            favor of `prebuilt_ambient_sound`.
          deprecated: true
          type: string
          enumDescriptions:
            - Not specified.
            - Ambient noise of a retail store.
            - Ambient noise of a convention hall.
            - Ambient noise of a street.
    ConnectorToolset:
      properties:
        connection:
          description: >-
            Required. The full resource name of the referenced Integration
            Connectors Connection. Format:
            `projects/{project}/locations/{location}/connections/{connection}`
          type: string
        authConfig:
          description: >-
            Optional. Configures how authentication is handled in Integration
            Connectors. By default, an admin authentication is passed in the
            Integration Connectors API requests. You can override it with a
            different end-user authentication config. **Note**: The Connection
            must have authentication override enabled in order to specify an EUC
            configuration here - otherwise, the Toolset creation will fail. See:
            https://cloud.google.com/application-integration/docs/configure-connectors-task#configure-authentication-override
          $ref: '#/components/schemas/EndUserAuthConfig'
        connectorActions:
          description: >-
            Required. The list of connector actions/entity operations to
            generate tools for.
          type: array
          items:
            $ref: '#/components/schemas/Action'
      id: ConnectorToolset
      description: >-
        A toolset that generates tools from an Integration Connectors
        Connection.
      type: object
    DataStore:
      properties:
        documentProcessingMode:
          readOnly: true
          type: string
          enumDescriptions:
            - Not specified.
            - Documents are processed as documents.
            - Documents are converted to chunks.
          enum:
            - DOCUMENT_PROCESSING_MODE_UNSPECIFIED
            - DOCUMENTS
            - CHUNKS
          description: >-
            Output only. The document processing mode for the data store
            connection. Only set for PUBLIC_WEB and UNSTRUCTURED data stores.
        createTime:
          description: Output only. Timestamp when the data store was created.
          readOnly: true
          type: string
          format: google-datetime
        type:
          enum:
            - DATA_STORE_TYPE_UNSPECIFIED
            - PUBLIC_WEB
            - UNSTRUCTURED
            - FAQ
            - CONNECTOR
          description: >-
            Output only. The type of the data store. This field is readonly and
            populated by the server.
          enumDescriptions:
            - >-
              Not specified. This value indicates that the data store type is
              not specified, so it will not be used during search.
            - A data store that contains public web content.
            - A data store that contains unstructured private data.
            - A data store that contains structured data used as FAQ.
            - >-
              A data store that is a connector to a first-party or a third-party
              service.
          readOnly: true
          type: string
        connectorConfig:
          description: Output only. The connector config for the data store connection.
          readOnly: true
          $ref: '#/components/schemas/DataStoreConnectorConfig'
        name:
          description: >-
            Required. Full resource name of the DataStore. Format:
            `projects/{project}/locations/{location}/collections/{collection}/dataStores/{dataStore}`
          type: string
        displayName:
          description: Output only. The display name of the data store.
          readOnly: true
          type: string
      id: DataStore
      description: A DataStore resource in Vertex AI Search.
      type: object
    SessionOutputDiagnosticInfo:
      id: SessionOutputDiagnosticInfo
      description: Contains execution details during the processing.
      type: object
      properties:
        rootSpan:
          description: >-
            A trace of the entire request processing, represented as a root
            span. This span can contain nested child spans for specific
            operations.
          $ref: '#/components/schemas/Span'
        messages:
          description: List of the messages that happened during the processing.
          type: array
          items:
            $ref: '#/components/schemas/Message'
    BigQueryExportSettings:
      properties:
        project:
          description: >-
            Optional. The **project ID** of the BigQuery dataset to export the
            data to. Note: If the BigQuery dataset is in a different project
            from the app, you should grant `roles/bigquery.admin` role to the
            CES service agent `service-@gcp-sa-ces.iam.gserviceaccount.com`.
          type: string
        dataset:
          description: Optional. The BigQuery **dataset ID** to export the data to.
          type: string
        enabled:
          description: Optional. Indicates whether the BigQuery export is enabled.
          type: boolean
      id: BigQueryExportSettings
      description: Settings to describe the BigQuery export behaviors for the app.
      type: object
    SessionConfig:
      properties:
        useToolFakes:
          description: >-
            Optional. Whether to use tool fakes for the session. If this field
            is set, the agent will attempt use tool fakes instead of calling the
            real tools.
          type: boolean
        enableTextStreaming:
          description: >-
            Optional. Whether to enable streaming text outputs from the model.
            By default, text outputs from the model are collected before sending
            to the client. NOTE: This is only supported for text (non-voice)
            sessions via StreamRunSession or BidiRunSession.
          type: boolean
        historicalContexts:
          description: >-
            Optional. The historical context of the session, including user
            inputs, agent responses, and other messages. Typically, CES agent
            would manage session automatically so client doesn't need to
            explicitly populate this field. However, client can optionally
            override the historical contexts to force the session start from
            certain state.
          type: array
          items:
            $ref: '#/components/schemas/Message'
        entryAgent:
          description: >-
            Optional. The entry agent to handle the session. If not specified,
            the session will be handled by the root agent of the app. Format:
            `projects/{project}/locations/{location}/apps/{app}/agents/{agent}`
          type: string
        inputAudioConfig:
          description: Optional. Configuration for processing the input audio.
          $ref: '#/components/schemas/InputAudioConfig'
        deployment:
          description: >-
            Optional. The deployment of the app to use for the session. Format:
            `projects/{project}/locations/{location}/apps/{app}/deployments/{deployment}`
          type: string
        remoteDialogflowQueryParameters:
          description: >-
            Optional.
            [QueryParameters](https://cloud.google.com/dialogflow/cx/docs/reference/rpc/google.cloud.dialogflow.cx.v3#queryparameters)
            to send to the remote
            [Dialogflow](https://cloud.google.com/dialogflow/cx/docs/concept/console-conversational-agents)
            agent when the session control is transferred to the remote agent.
          $ref: '#/components/schemas/SessionConfigRemoteDialogflowQueryParameters'
        outputAudioConfig:
          description: Optional. Configuration for generating the output audio.
          $ref: '#/components/schemas/OutputAudioConfig'
        timeZone:
          description: >-
            Optional. The time zone of the user. If provided, the agent will use
            the time zone for date and time related variables. Otherwise, the
            agent will use the time zone specified in the
            App.time_zone_settings. The format is the IANA Time Zone Database
            time zone, e.g. "America/Los_Angeles".
          type: string
      id: SessionConfig
      description: The configuration for the session.
      type: object
    ErrorHandlingSettings:
      properties:
        errorHandlingStrategy:
          description: Optional. The strategy to use for error handling.
          type: string
          enumDescriptions:
            - Unspecified error handling strategy.
            - No specific handling is enabled.
            - >-
              A fallback message will be returned to the user in case of system
              errors (e.g. LLM errors).
            - >-
              An EndSession signal will be emitted in case of system errors
              (e.g. LLM errors).
          enum:
            - ERROR_HANDLING_STRATEGY_UNSPECIFIED
            - NONE
            - FALLBACK_RESPONSE
            - END_SESSION
        fallbackResponseConfig:
          description: Optional. Configuration for handling fallback responses.
          $ref: '#/components/schemas/ErrorHandlingSettingsFallbackResponseConfig'
        endSessionConfig:
          description: >-
            Optional. Configuration for ending the session in case of system
            errors (e.g. LLM errors).
          $ref: '#/components/schemas/ErrorHandlingSettingsEndSessionConfig'
      id: ErrorHandlingSettings
      description: Settings to describe how errors should be handled in the app.
      type: object
    DataStoreToolDataStoreSource:
      id: DataStoreToolDataStoreSource
      description: Configuration for searching within a specific DataStore.
      type: object
      properties:
        filter:
          description: >-
            Optional. Filter specification for the DataStore. See:
            https://cloud.google.com/generative-ai-app-builder/docs/filter-search-metadata
          type: string
        dataStore:
          description: Optional. The data store.
          $ref: '#/components/schemas/DataStore'
    Toolset:
      properties:
        name:
          description: >-
            Identifier. The unique identifier of the toolset. Format:
            `projects/{project}/locations/{location}/apps/{app}/toolsets/{toolset}`
          type: string
        displayName:
          description: >-
            Optional. The display name of the toolset. Must be unique within the
            same app.
          type: string
        mcpToolset:
          description: >-
            Optional. A toolset that contains a list of tools that are offered
            by the MCP server.
          $ref: '#/components/schemas/McpToolset'
        timeout:
          description: >-
            Optional. The timeout for the toolset execution. If not set, the
            default timeout is 30 seconds for `SYNCHRONOUS` toolsets and 60
            seconds for `ASYNCHRONOUS` toolsets.
          type: string
          format: google-duration
        createTime:
          description: Output only. Timestamp when the toolset was created.
          readOnly: true
          type: string
          format: google-datetime
        description:
          description: Optional. The description of the toolset.
          type: string
        connectorToolset:
          description: >-
            Optional. A toolset that generates tools from an Integration
            Connectors Connection.
          $ref: '#/components/schemas/ConnectorToolset'
        toolFakeConfig:
          description: Optional. Configuration for tools behavior in fake mode.
          $ref: '#/components/schemas/ToolFakeConfig'
        etag:
          description: >-
            ETag used to ensure the object hasn't changed during a
            read-modify-write operation. If the etag is empty, the update will
            overwrite any concurrent changes.
          type: string
        executionType:
          enumDescriptions:
            - >-
              The execution type is unspecified. Defaults to `SYNCHRONOUS` if
              unspecified.
            - >-
              The tool is executed synchronously. The session is blocked until
              the tool returns.
            - >-
              The tool is executed asynchronously. The session will continue
              while the tool is executing.
          description: Optional. The execution type of the tools in the toolset.
          type: string
          enum:
            - EXECUTION_TYPE_UNSPECIFIED
            - SYNCHRONOUS
            - ASYNCHRONOUS
        openApiToolset:
          description: >-
            Optional. A toolset that contains a list of tools that are defined
            by an OpenAPI schema.
          $ref: '#/components/schemas/OpenApiToolset'
        updateTime:
          description: Output only. Timestamp when the toolset was last updated.
          readOnly: true
          type: string
          format: google-datetime
      id: Toolset
      description: >-
        A toolset represents a group of dynamically managed tools that can be
        used by the agent.
      type: object
    Location:
      id: Location
      description: A resource that represents a Google Cloud location.
      type: object
      properties:
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
          additionalProperties:
            type: string
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
    ExperimentConfigVersionReleaseTrafficAllocation:
      properties:
        id:
          description: >-
            Optional. Id of the traffic allocation. Free format string, up to
            128 characters.
          type: string
        trafficPercentage:
          description: >-
            Optional. Traffic percentage of the traffic allocation. Must be
            between 0 and 100.
          type: integer
          format: int32
        appVersion:
          description: >-
            Optional. App version of the traffic allocation. Format:
            `projects/{project}/locations/{location}/apps/{app}/versions/{version}`
          type: string
      id: ExperimentConfigVersionReleaseTrafficAllocation
      description: Traffic allocation for the version release.
      type: object
    Empty:
      id: Empty
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      type: object
      properties: {}
    AudioRecordingConfig:
      id: AudioRecordingConfig
      description: Configuration for how the audio interactions should be recorded.
      type: object
      properties:
        gcsBucket:
          description: >-
            Optional. The [Cloud Storage](https://cloud.google.com/storage)
            bucket to store the session audio recordings. The URI must start
            with "gs://". Please choose a bucket location that meets your data
            residency requirements. Note: If the Cloud Storage bucket is in a
            different project from the app, you should grant
            `storage.objects.create` permission to the CES service agent
            `service-@gcp-sa-ces.iam.gserviceaccount.com`.
          type: string
        gcsPathPrefix:
          description: >-
            Optional. The Cloud Storage path prefix for audio recordings. This
            prefix can include the following placeholders, which will be
            dynamically substituted at serving time: - $project: project ID -
            $location: app location - $app: app ID - $date: session date in
            YYYY-MM-DD format - $session: session ID If the path prefix is not
            specified, the default prefix
            `$project/$location/$app/$date/$session/` will be used.
          type: string
    TriggerActionGenerativeAnswer:
      properties:
        prompt:
          description: Required. The prompt to use for the generative answer.
          type: string
      id: TriggerActionGenerativeAnswer
      description: The agent will immediately respond with a generative answer.
      type: object
    WidgetToolTextResponseConfig:
      properties:
        type:
          description: Optional. The strategy for providing the text response.
          type: string
          enumDescriptions:
            - Unspecified type.
            - >-
              The LLM dynamically decides whether to generate a text response
              alongside the widget based on the conversation context.
            - The LLM is explicitly required to generate a text response.
            - A pre-defined static text response is always used.
          enum:
            - TYPE_UNSPECIFIED
            - NONE
            - LLM_GENERATED
            - STATIC
        staticText:
          description: Optional. The static text response to return when type is STATIC.
          type: string
        textResponseInstruction:
          description: >-
            Optional. Instruction for the LLM on how to generate the text
            response. Used as the description for the text response parameter if
            type is LLM_GENERATED.
          type: string
      id: WidgetToolTextResponseConfig
      description: Configuration for the text response returned with the widget.
      type: object
    LfA2aV1APIKeySecurityScheme:
      id: LfA2aV1APIKeySecurityScheme
      description: Defines a security scheme using an API key.
      type: object
      properties:
        name:
          description: >-
            Required. The name of the header, query, or cookie parameter to be
            used.
          type: string
        description:
          description: An optional description for the security scheme.
          type: string
        location:
          description: >-
            Required. The location of the API key. Valid values are "query",
            "header", or "cookie".
          type: string
    AppVersion:
      id: AppVersion
      description: >-
        In Customer Engagement Suite (CES), an app version is a snapshot of the
        app at a specific point in time. It is immutable and cannot be modified
        once created.
      type: object
      properties:
        etag:
          description: >-
            Output only. Etag used to ensure the object hasn't changed during a
            read-modify-write operation. If the etag is empty, the update will
            overwrite any concurrent changes.
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. The unique identifier of the app version. Format:
            `projects/{project}/locations/{location}/apps/{app}/versions/{version}`
          type: string
        displayName:
          description: Optional. The display name of the app version.
          type: string
        description:
          description: Optional. The description of the app version.
          type: string
        creator:
          description: Output only. Email of the user who created the app version.
          readOnly: true
          type: string
        snapshot:
          description: Output only. The snapshot of the app when the version is created.
          readOnly: true
          $ref: '#/components/schemas/AppSnapshot'
        createTime:
          description: Output only. Timestamp when the app version was created.
          readOnly: true
          type: string
          format: google-datetime
    LfA2aV1HTTPAuthSecurityScheme:
      id: LfA2aV1HTTPAuthSecurityScheme
      description: Defines a security scheme using HTTP authentication.
      type: object
      properties:
        description:
          description: An optional description for the security scheme.
          type: string
        scheme:
          description: >-
            Required. The name of the HTTP Authentication scheme to be used in
            the Authorization header, as defined in RFC7235 (e.g., "Bearer").
            This value should be registered in the IANA Authentication Scheme
            registry.
          type: string
        bearerFormat:
          description: >-
            A hint to the client to identify how the bearer token is formatted
            (e.g., "JWT"). Primarily for documentation purposes.
          type: string
    ChannelProfilePersonaProperty:
      id: ChannelProfilePersonaProperty
      description: Represents the persona property of a channel.
      type: object
      properties:
        persona:
          description: Optional. The persona of the channel.
          type: string
          enumDescriptions:
            - UNKNOWN persona.
            - The agent keeps the responses concise and to the point
            - The agent provides additional context, explanations, and details
          enum:
            - UNKNOWN
            - CONCISE
            - CHATTY
    GuardrailModelSafety:
      id: GuardrailModelSafety
      description: >-
        Model safety settings overrides. When this is set, it will override the
        default settings and trigger the guardrail if the response is considered
        unsafe.
      type: object
      properties:
        safetySettings:
          description: Required. List of safety settings.
          type: array
          items:
            $ref: '#/components/schemas/GuardrailModelSafetySafetySetting'
    LfA2aV1Task:
      properties:
        contextId:
          description: >-
            Unique identifier (e.g. UUID) for the contextual collection of
            interactions (tasks and messages).
          type: string
        history:
          description: >-
            protolint:disable REPEATED_FIELD_NAMES_PLURALIZED The history of
            interactions from a `Task`.
          type: array
          items:
            $ref: '#/components/schemas/LfA2aV1Message'
        status:
          description: >-
            Required. The current status of a `Task`, including `state` and a
            `message`.
          $ref: '#/components/schemas/LfA2aV1TaskStatus'
        metadata:
          description: >-
            protolint:enable REPEATED_FIELD_NAMES_PLURALIZED A key/value object
            to store custom metadata about a task.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        id:
          description: >-
            Required. Unique identifier (e.g. UUID) for the task, generated by
            the server for a new task.
          type: string
        artifacts:
          description: A set of output artifacts for a `Task`.
          type: array
          items:
            $ref: '#/components/schemas/LfA2aV1Artifact'
      id: LfA2aV1Task
      description: >-
        `Task` is the core unit of action for A2A. It has a current status and
        when results are created for the task they are stored in the artifact.
        If there are multiple turns for a task, these are stored in history.
      type: object
    RedactionConfig:
      id: RedactionConfig
      description: Configuration to instruct how sensitive data should be handled.
      type: object
      properties:
        deidentifyTemplate:
          description: >-
            Optional. [DLP](https://cloud.google.com/dlp/docs) deidentify
            template name to instruct on how to de-identify content. Format:
            `projects/{project}/locations/{location}/deidentifyTemplates/{deidentify_template}`
          type: string
        enableRedaction:
          description: >-
            Optional. If true, redaction will be applied in various logging
            scenarios, including conversation history, Cloud Logging and audio
            recording.
          type: boolean
        inspectTemplate:
          description: >-
            Optional. [DLP](https://cloud.google.com/dlp/docs) inspect template
            name to configure detection of sensitive data types. Format:
            `projects/{project}/locations/{location}/inspectTemplates/{inspect_template}`
          type: string
    ListAppsResponse:
      id: ListAppsResponse
      description: Response message for AgentService.ListApps.
      type: object
      properties:
        unreachable:
          description: Unordered list. Locations that could not be reached.
          type: array
          items:
            type: string
        apps:
          description: The list of apps.
          type: array
          items:
            $ref: '#/components/schemas/App'
        nextPageToken:
          description: >-
            A token that can be sent as ListAppsRequest.page_token to retrieve
            the next page. Absence of this field indicates there are no
            subsequent pages.
          type: string
    Callback:
      id: Callback
      description: >-
        A callback defines the custom logic to be executed at various stages of
        agent interaction.
      type: object
      properties:
        pythonCode:
          description: Required. The python code to execute for the callback.
          type: string
        disabled:
          description: >-
            Optional. Whether the callback is disabled. Disabled callbacks are
            ignored by the agent.
          type: boolean
        description:
          description: Optional. Human-readable description of the callback.
          type: string
        proactiveExecutionEnabled:
          description: >-
            Optional. If enabled, the callback will also be executed on
            intermediate model outputs. This setting only affects after model
            callback. **ENABLE WITH CAUTION**. Typically after model callback
            only needs to be executed after receiving all model responses.
            Enabling proactive execution may have negative implication on the
            execution cost and latency, and should only be enabled in rare
            situations.
          type: boolean
    LfA2aV1SecurityRequirement:
      id: LfA2aV1SecurityRequirement
      description: Defines the security requirements for an agent.
      type: object
      properties:
        schemes:
          description: A map of security schemes to the required scopes.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LfA2aV1StringList'
    Guardrail:
      properties:
        description:
          description: Optional. Description of the guardrail.
          type: string
        codeCallback:
          description: >-
            Optional. Guardrail that potentially blocks the conversation based
            on the result of the callback execution.
          $ref: '#/components/schemas/GuardrailCodeCallback'
        etag:
          description: >-
            Etag used to ensure the object hasn't changed during a
            read-modify-write operation. If the etag is empty, the update will
            overwrite any concurrent changes.
          type: string
        llmPolicy:
          description: >-
            Optional. Guardrail that blocks the conversation if the LLM response
            is considered violating the policy based on the LLM classification.
          $ref: '#/components/schemas/GuardrailLlmPolicy'
        enabled:
          description: Optional. Whether the guardrail is enabled.
          type: boolean
        llmPromptSecurity:
          description: >-
            Optional. Guardrail that blocks the conversation if the prompt is
            considered unsafe based on the LLM classification.
          $ref: '#/components/schemas/GuardrailLlmPromptSecurity'
        updateTime:
          description: Output only. Timestamp when the guardrail was last updated.
          readOnly: true
          type: string
          format: google-datetime
        name:
          description: >-
            Identifier. The unique identifier of the guardrail. Format:
            `projects/{project}/locations/{location}/apps/{app}/guardrails/{guardrail}`
          type: string
        displayName:
          description: Required. Display name of the guardrail.
          type: string
        contentFilter:
          description: >-
            Optional. Guardrail that bans certain content from being used in the
            conversation.
          $ref: '#/components/schemas/GuardrailContentFilter'
        modelSafety:
          description: >-
            Optional. Guardrail that blocks the conversation if the LLM response
            is considered unsafe based on the model safety settings.
          $ref: '#/components/schemas/GuardrailModelSafety'
        createTime:
          description: Output only. Timestamp when the guardrail was created.
          readOnly: true
          type: string
          format: google-datetime
        action:
          description: Optional. Action to take when the guardrail is triggered.
          $ref: '#/components/schemas/TriggerAction'
      id: Guardrail
      description: >-
        Guardrail contains a list of checks and balances to keep the agents safe
        and secure.
      type: object
    TimeZoneSettings:
      properties:
        timeZone:
          description: >-
            Optional. The time zone of the app from the [time zone
            database](https://www.iana.org/time-zones), e.g.,
            America/Los_Angeles, Europe/Paris.
          type: string
      id: TimeZoneSettings
      description: TimeZone settings of the app.
      type: object
    AudioProcessingConfig:
      id: AudioProcessingConfig
      description: >-
        Configuration for how the input and output audio should be processed and
        delivered.
      type: object
      properties:
        synthesizeSpeechConfigs:
          description: >-
            Optional. Configuration of how the agent response should be
            synthesized, mapping from the language code to
            SynthesizeSpeechConfig. If the configuration for the specified
            language code is not found, the configuration for the root language
            code will be used. For example, if the map contains "en-us" and
            "en", and the specified language code is "en-gb", then "en"
            configuration will be used. Note: Language code is case-insensitive.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SynthesizeSpeechConfig'
        bargeInConfig:
          description: >-
            Optional. Configures the agent behavior for the user barge-in
            activities.
          $ref: '#/components/schemas/BargeInConfig'
        inactivityTimeout:
          description: >-
            Optional. The duration of user inactivity (no speech or interaction)
            before the agent prompts the user for reengagement. If not set, the
            agent will not prompt the user for reengagement.
          type: string
          format: google-duration
        ambientSoundConfig:
          description: >-
            Optional. Configuration for the ambient sound to be played with the
            synthesized agent response, to enhance the naturalness of the
            conversation.
          $ref: '#/components/schemas/AmbientSoundConfig'
    ListToolsResponse:
      properties:
        tools:
          description: The list of tools.
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        nextPageToken:
          description: >-
            A token that can be sent as ListToolsRequest.page_token to retrieve
            the next page. Absence of this field indicates there are no
            subsequent pages.
          type: string
      id: ListToolsResponse
      description: Response message for AgentService.ListTools.
      type: object
    ImportAppRequest:
      properties:
        appContent:
          description: >-
            Raw bytes representing the compressed zip file with the app folder
            structure.
          type: string
          format: byte
        ignoreAppLock:
          description: >-
            Optional. Flag for overriding the app lock during import. If set to
            true, the import process will ignore the app lock.
          type: boolean
        gcsUri:
          description: >-
            The [Google Cloud Storage](https://cloud.google.com/storage/docs/)
            URI from which to import app. The format of this URI must be
            `gs:///`.
          type: string
        importOptions:
          description: Optional. Options governing the import process for the app.
          $ref: '#/components/schemas/ImportAppRequestImportOptions'
        appId:
          description: >-
            Optional. The ID to use for the imported app. * If not specified, a
            unique ID will be automatically assigned for the app. * Otherwise,
            the imported app will use this ID as the final component of its
            resource name. If an app with the same ID already exists at the
            specified location in the project, the content of the existing app
            will be replaced.
          type: string
        displayName:
          description: >-
            Optional. The display name of the app to import. * If the app is
            created on import, and the display name is specified, the imported
            app will use this display name. If a conflict is detected with an
            existing app, a timestamp will be appended to the display name to
            make it unique. * If the app is a reimport, this field should not be
            set. Providing a display name during reimport will result in an
            INVALID_ARGUMENT error.
          type: string
      id: ImportAppRequest
      description: Request message for AgentService.ImportApp.
      type: object
    Conversation:
      properties:
        startTime:
          description: Output only. Timestamp when the conversation was created.
          readOnly: true
          type: string
          format: google-datetime
        messages:
          description: Deprecated. Use turns instead.
          type: array
          items:
            $ref: '#/components/schemas/Message'
          deprecated: true
        source:
          enumDescriptions:
            - Unspecified source.
            - The conversation is from the live end user.
            - The conversation is from the simulator.
            - The conversation is from the evaluation.
            - >-
              The conversation is from an agent tool. Agent tool runs the agent
              in a separate session, which is persisted for testing and
              debugging purposes.
          readOnly: true
          type: string
          description: Output only. Indicate the source of the conversation.
          enum:
            - SOURCE_UNSPECIFIED
            - LIVE
            - SIMULATOR
            - EVAL
            - AGENT_TOOL
        name:
          description: >-
            Identifier. The unique identifier of the conversation. Format:
            `projects/{project}/locations/{location}/apps/{app}/conversations/{conversation}`
          type: string
        turnCount:
          description: Output only. The number of turns in the conversation.
          readOnly: true
          type: integer
          format: int32
        deployment:
          description: >-
            Output only. The deployment of the app used for processing the
            conversation. Format:
            `projects/{project}/locations/{location}/apps/{app}/deployments/{deployment}`
          readOnly: true
          type: string
        channelType:
          enumDescriptions:
            - Unspecified channel type.
            - >-
              The conversation only contains text messages between the end user
              and the agent.
            - >-
              The conversation contains audio messages between the end user and
              the agent.
            - >-
              The conversation multi-modal messages (e.g. image) between the end
              user and the agent.
          type: string
          enum:
            - CHANNEL_TYPE_UNSPECIFIED
            - TEXT
            - AUDIO
            - MULTIMODAL
          deprecated: true
          description: DEPRECATED. Please use input_types instead.
        entryAgent:
          description: >-
            Output only. The agent that initially handles the conversation. If
            not specified, the conversation is handled by the root agent.
            Format:
            `projects/{project}/locations/{location}/apps/{app}/agents/{agent}`
          readOnly: true
          type: string
        inputTypes:
          description: Output only. The input types of the conversation.
          readOnly: true
          type: array
          items:
            type: string
            enumDescriptions:
              - Unspecified input type.
              - Text input.
              - Event input.
              - Audio input.
              - Image input.
              - Blob input.
              - Client function tool response input.
              - Variables input.
            enum:
              - INPUT_TYPE_UNSPECIFIED
              - INPUT_TYPE_TEXT
              - INPUT_TYPE_EVENT
              - INPUT_TYPE_AUDIO
              - INPUT_TYPE_IMAGE
              - INPUT_TYPE_BLOB
              - INPUT_TYPE_TOOL_RESPONSE
              - INPUT_TYPE_VARIABLES
        turns:
          description: Required. The turns in the conversation.
          type: array
          items:
            $ref: '#/components/schemas/ConversationTurn'
        endTime:
          description: Output only. Timestamp when the conversation was completed.
          readOnly: true
          type: string
          format: google-datetime
        appVersion:
          description: >-
            Output only. The version of the app used for processing the
            conversation. Format:
            `projects/{project}/locations/{location}/apps/{app}/versions/{version}`
          readOnly: true
          type: string
        languageCode:
          description: Output only. The language code of the conversation.
          readOnly: true
          type: string
      id: Conversation
      description: >-
        A conversation represents an interaction between an end user and the CES
        app.
      type: object
    RestoreAppVersionRequest:
      properties: {}
      id: RestoreAppVersionRequest
      description: Request message for AgentService.RestoreAppVersion
      type: object
    DataStoreToolEngineSource:
      id: DataStoreToolEngineSource
      description: >-
        Configuration for searching within an Engine, potentially targeting
        specific DataStores.
      type: object
      properties:
        dataStoreSources:
          description: >-
            Optional. Use to target specific DataStores within the Engine. If
            empty, the search applies to all DataStores associated with the
            Engine.
          type: array
          items:
            $ref: '#/components/schemas/DataStoreToolDataStoreSource'
        engine:
          description: >-
            Required. Full resource name of the Engine. Format:
            `projects/{project}/locations/{location}/collections/{collection}/engines/{engine}`
          type: string
        filter:
          description: >-
            Optional. A filter applied to the search across the Engine. Not
            relevant and not used if 'data_store_sources' is provided. See:
            https://cloud.google.com/generative-ai-app-builder/docs/filter-search-metadata
          type: string
    ApiKeyConfig:
      id: ApiKeyConfig
      description: Configurations for authentication with API key.
      type: object
      properties:
        keyName:
          description: >-
            Required. The parameter name or the header name of the API key.
            E.g., If the API request is "https://example.com/act?X-Api-Key=",
            "X-Api-Key" would be the parameter name.
          type: string
        requestLocation:
          description: Required. Key location in the request.
          type: string
          enumDescriptions:
            - Unspecified. This value should not be used.
            - Represents the key in http header.
            - Represents the key in query string.
          enum:
            - REQUEST_LOCATION_UNSPECIFIED
            - HEADER
            - QUERY_STRING
        apiKeySecretVersion:
          description: >-
            Required. The name of the SecretManager secret version resource
            storing the API key. Format:
            `projects/{project}/secrets/{secret}/versions/{version}` Note: You
            should grant `roles/secretmanager.secretAccessor` role to the CES
            service agent `service-@gcp-sa-ces.iam.gserviceaccount.com`.
          type: string
    ActionEntityOperation:
      properties:
        operation:
          enumDescriptions:
            - >-
              Operation type unspecified. Invalid, ConnectorTool create/update
              will fail.
            - List operation.
            - Get operation.
            - Create operation.
            - Update operation.
            - Delete operation.
          description: Required. Operation to perform on the entity.
          type: string
          enum:
            - OPERATION_TYPE_UNSPECIFIED
            - LIST
            - GET
            - CREATE
            - UPDATE
            - DELETE
        entityId:
          description: Required. ID of the entity.
          type: string
      id: ActionEntityOperation
      description: Entity CRUD operation specification.
      type: object
    TriggerActionRespondImmediately:
      id: TriggerActionRespondImmediately
      description: The agent will immediately respond with a preconfigured response.
      type: object
      properties:
        responses:
          description: >-
            Required. The canned responses for the agent to choose from. The
            response is chosen randomly.
          type: array
          items:
            $ref: '#/components/schemas/TriggerActionResponse'
    RunSessionResponse:
      properties:
        outputs:
          description: Outputs for the session.
          type: array
          items:
            $ref: '#/components/schemas/SessionOutput'
      id: RunSessionResponse
      description: Response message for SessionService.RunSession.
      type: object
    GoogleSearchTool:
      properties:
        name:
          description: Required. The name of the tool.
          type: string
        promptConfig:
          description: >-
            Optional. Prompt instructions passed to planner on how the search
            results should be processed for text and voice.
          $ref: '#/components/schemas/GoogleSearchToolPromptConfig'
        preferredDomains:
          description: >-
            Optional. Specifies domains to restrict search results to. Example:
            "example.com", "another.site". A maximum of 20 domains can be
            specified.
          type: array
          items:
            type: string
        excludeDomains:
          description: >-
            Optional. List of domains to be excluded from the search results.
            Example: "example.com". A maximum of 2000 domains can be excluded.
          type: array
          items:
            type: string
        description:
          description: Optional. Description of the tool's purpose.
          type: string
        contextUrls:
          description: >-
            Optional. Content will be fetched directly from these URLs for
            context and grounding. Example: "https://example.com/path.html". A
            maximum of 20 URLs are allowed.
          type: array
          items:
            type: string
      id: GoogleSearchTool
      description: >-
        Represents a tool to perform Google web searches for grounding. See
        https://cloud.google.com/customer-engagement-ai/conversational-agents/ps/tool#google-search.
      type: object
    ToolResponse:
      id: ToolResponse
      description: The execution result of a specific tool from the client or the agent.
      type: object
      properties:
        toolsetTool:
          description: Optional. The toolset tool that got executed.
          $ref: '#/components/schemas/ToolsetTool'
        id:
          description: Optional. The matching ID of the tool call the response is for.
          type: string
        response:
          description: >-
            Required. The tool execution result in JSON object format. Use
            "output" key to specify tool response and "error" key to specify
            error details (if any). If "output" and "error" keys are not
            specified, then whole "response" is treated as tool execution
            result.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        displayName:
          description: Output only. Display name of the tool.
          readOnly: true
          type: string
        tool:
          description: >-
            Optional. The name of the tool to execute. Format:
            `projects/{project}/locations/{location}/apps/{app}/tools/{tool}`
          type: string
    AgentAgentToolset:
      id: AgentAgentToolset
      description: A toolset with a selection of its tools.
      type: object
      properties:
        toolset:
          description: >-
            Required. The resource name of the toolset. Format:
            `projects/{project}/locations/{location}/apps/{app}/toolsets/{toolset}`
          type: string
        toolIds:
          description: Optional. The tools IDs to filter the toolset.
          type: array
          items:
            type: string
    DataStoreToolGroundingConfig:
      id: DataStoreToolGroundingConfig
      description: Grounding configuration.
      type: object
      properties:
        groundingLevel:
          description: >-
            Optional. The groundedness threshold of the answer based on the
            retrieved sources. The value has a configurable range of [1, 5]. The
            level is used to threshold the groundedness of the answer, meaning
            that all responses with a groundedness score below the threshold
            will fall back to returning relevant snippets only. For example, a
            level of 3 means that the groundedness score must be 3 or higher for
            the response to be returned.
          type: number
          format: float
        disabled:
          description: Optional. Whether grounding is disabled.
          type: boolean
    ToolCalls:
      id: ToolCalls
      description: >-
        Request for the client to execute the tools and return the execution
        results before continuing the session.
      type: object
      properties:
        toolCalls:
          description: Optional. The list of tool calls to execute.
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
    ServiceAccountAuthConfig:
      id: ServiceAccountAuthConfig
      description: Configurations for authentication using a custom service account.
      type: object
      properties:
        serviceAccount:
          description: >-
            Required. The email address of the service account used for
            authentication. CES uses this service account to exchange an access
            token and the access token is then sent in the `Authorization`
            header of the request. The service account must have the
            `roles/iam.serviceAccountTokenCreator` role granted to the CES
            service agent `service-@gcp-sa-ces.iam.gserviceaccount.com`.
          type: string
        scopes:
          description: >-
            Optional. The OAuth scopes to grant. If not specified, the default
            scope `https://www.googleapis.com/auth/cloud-platform` is used.
          type: array
          items:
            type: string
    LfA2aV1DeviceCodeOAuthFlow:
      properties:
        refreshUrl:
          description: The URL to be used for obtaining refresh tokens.
          type: string
        tokenUrl:
          description: Required. The token URL to be used for this flow.
          type: string
        scopes:
          additionalProperties:
            type: string
          description: Required. The available scopes for the OAuth2 security scheme.
          type: object
        deviceAuthorizationUrl:
          description: Required. The device authorization endpoint URL.
          type: string
      id: LfA2aV1DeviceCodeOAuthFlow
      description: >-
        Defines configuration details for the OAuth 2.0 Device Code flow (RFC
        8628). This flow is designed for input-constrained devices such as IoT
        devices, and CLI tools where the user authenticates on a separate
        device.
      type: object
    Blob:
      id: Blob
      description: Represents a blob input or output in the conversation.
      type: object
      properties:
        data:
          description: Required. Raw bytes of the blob.
          type: string
          format: byte
        mimeType:
          description: Required. The IANA standard MIME type of the source data.
          type: string
    OpenApiToolset:
      properties:
        serviceDirectoryConfig:
          description: Optional. Service Directory configuration.
          $ref: '#/components/schemas/ServiceDirectoryConfig'
        tlsConfig:
          description: >-
            Optional. The TLS configuration. Includes the custom server
            certificates
          $ref: '#/components/schemas/TlsConfig'
        url:
          description: >-
            Optional. The server URL of the Open API schema. This field is only
            set in toolsets in the environment dependencies during the export
            process if the schema contains a server url. During the import
            process, if this url is present in the environment dependencies and
            the schema has the $env_var placeholder, it will replace the
            placeholder in the schema.
          type: string
        apiAuthentication:
          description: Optional. Authentication information required by the API.
          $ref: '#/components/schemas/ApiAuthentication'
        openApiSchema:
          description: Required. The OpenAPI schema of the toolset.
          type: string
        ignoreUnknownFields:
          description: >-
            Optional. If true, the agent will ignore unknown fields in the API
            response for all operations defined in the OpenAPI schema.
          type: boolean
      id: OpenApiToolset
      description: >-
        A toolset that contains a list of tools that are defined by an OpenAPI
        schema.
      type: object
    SystemTool:
      properties:
        name:
          description: Required. The name of the system tool.
          type: string
        description:
          description: Output only. The description of the system tool.
          readOnly: true
          type: string
      id: SystemTool
      description: Pre-defined system tool.
      type: object
    Operation:
      id: Operation
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      type: object
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
    ChannelProfile:
      properties:
        channelType:
          description: Optional. The type of the channel profile.
          type: string
          enumDescriptions:
            - Unknown channel type.
            - Web UI channel.
            - API channel.
            - Twilio channel.
            - Google Telephony Platform channel.
            - Contact Center as a Service (CCaaS) channel.
            - Contact Center as a Service (CCaaS Chat) channel.
            - Five9 channel.
            - Third party contact center integration channel.
            - WhatsApp channel.
            - Instagram channel.
          enum:
            - UNKNOWN
            - WEB_UI
            - API
            - TWILIO
            - GOOGLE_TELEPHONY_PLATFORM
            - CONTACT_CENTER_AS_A_SERVICE
            - CONTACT_CENTER_AS_A_SERVICE_CHAT
            - FIVE9
            - CONTACT_CENTER_INTEGRATION
            - WHATSAPP
            - INSTAGRAM
        disableBargeInControl:
          description: >-
            Optional. Whether to disable user barge-in control in the
            conversation. - **true**: User interruptions are disabled while the
            agent is speaking. - **false**: The agent retains automatic control
            over when the user can interrupt.
          type: boolean
        webWidgetConfig:
          description: Optional. The configuration for the web widget.
          $ref: '#/components/schemas/ChannelProfileWebWidgetConfig'
        noiseSuppressionLevel:
          description: >-
            Optional. The noise suppression level of the channel profile.
            Available values are "low", "moderate", "high", "very_high".
          type: string
        profileId:
          description: Optional. The unique identifier of the channel profile.
          type: string
        whatsappConfig:
          description: Optional. Configuration specific to WhatsApp deployments.
          $ref: '#/components/schemas/ChannelProfileWhatsAppConfig'
        instagramConfig:
          description: Optional. Configuration specific to Instagram deployments.
          $ref: '#/components/schemas/ChannelProfileInstagramConfig'
        personaProperty:
          description: Optional. The persona property of the channel profile.
          $ref: '#/components/schemas/ChannelProfilePersonaProperty'
        disableDtmf:
          description: Optional. Whether to disable DTMF (dual-tone multi-frequency).
          type: boolean
      id: ChannelProfile
      description: >-
        A ChannelProfile configures the agent's behavior for a specific
        communication channel, such as web UI or telephony.
      type: object
    ListConversationsResponse:
      properties:
        conversations:
          description: The list of conversations.
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        nextPageToken:
          description: >-
            A token that can be sent as ListConversationsRequest.page_token to
            retrieve the next page. Absence of this field indicates there are no
            subsequent pages.
          type: string
      id: ListConversationsResponse
      description: Response message for AgentService.ListConversations.
      type: object
    EvaluationMetricsThresholdsGoldenEvaluationMetricsThresholdsExpectationLevelMetricsThresholds:
      properties:
        toolInvocationParameterCorrectnessThreshold:
          description: >-
            Optional. The success threshold for individual tool invocation
            parameter correctness. Must be a float between 0 and 1. Default is
            1.0.
          type: number
          format: float
      id: >-
        EvaluationMetricsThresholdsGoldenEvaluationMetricsThresholdsExpectationLevelMetricsThresholds
      description: Expectation level metrics thresholds.
      type: object
    ExportAppRequest:
      properties:
        exportFormat:
          enum:
            - EXPORT_FORMAT_UNSPECIFIED
            - JSON
            - YAML
          description: Required. The format to export the app in.
          type: string
          enumDescriptions:
            - The export format is unspecified.
            - The export format is JSON.
            - The export format is YAML.
        appVersion:
          description: >-
            Optional. The resource name of the app version to export. Format:
            `projects/{project}/locations/{location}/apps/{app}/versions/{version}`.
          type: string
        gcsUri:
          description: >-
            Optional. The [Google Cloud
            Storage](https://cloud.google.com/storage/docs/) URI to which to
            export the app. The format of this URI must be `gs:///`. The
            exported app archive will be written directly to the specified GCS
            object.
          type: string
      id: ExportAppRequest
      description: Request message for AgentService.ExportApp.
      type: object
    LfA2aV1AgentSkill:
      id: LfA2aV1AgentSkill
      description: Represents a distinct capability or function that an agent can perform.
      type: object
      properties:
        id:
          description: Required. A unique identifier for the agent's skill.
          type: string
        description:
          description: Required. A detailed description of the skill.
          type: string
        outputModes:
          description: >-
            The set of supported output media types for this skill, overriding
            the agent's defaults.
          type: array
          items:
            type: string
        securityRequirements:
          description: Security schemes necessary for this skill.
          type: array
          items:
            $ref: '#/components/schemas/LfA2aV1SecurityRequirement'
        inputModes:
          description: >-
            The set of supported input media types for this skill, overriding
            the agent's defaults.
          type: array
          items:
            type: string
        name:
          description: Required. A human-readable name for the skill.
          type: string
        tags:
          description: Required. A set of keywords describing the skill's capabilities.
          type: array
          items:
            type: string
        examples:
          description: Example prompts or scenarios that this skill can handle.
          type: array
          items:
            type: string
    ErrorHandlingSettingsEndSessionConfig:
      properties:
        escalateSession:
          description: >-
            Optional. Whether to escalate the session in EndSession. If session
            is escalated, metadata in EndSession will contain `session_escalated
            = true`. See
            https://docs.cloud.google.com/customer-engagement-ai/conversational-agents/ps/deploy/google-telephony-platform#transfer_a_call_to_a_human_agent
            for details.
          type: boolean
      id: ErrorHandlingSettingsEndSessionConfig
      description: >-
        Configuration for ending the session in case of system errors (e.g. LLM
        errors).
      type: object
    GuardrailCodeCallback:
      properties:
        beforeAgentCallback:
          description: >-
            Optional. The callback to execute before the agent is called. Each
            callback function is expected to return a structure (e.g., a dict or
            object) containing at least: - 'decision': Either 'OK' or 'TRIGGER'.
            - 'reason': A string explaining the decision. A 'TRIGGER' decision
            may halt further processing.
          $ref: '#/components/schemas/Callback'
        afterModelCallback:
          description: >-
            Optional. The callback to execute after the model is called. If
            there are multiple calls to the model, the callback will be executed
            multiple times. Each callback function is expected to return a
            structure (e.g., a dict or object) containing at least: -
            'decision': Either 'OK' or 'TRIGGER'. - 'reason': A string
            explaining the decision. A 'TRIGGER' decision may halt further
            processing.
          $ref: '#/components/schemas/Callback'
        beforeModelCallback:
          description: >-
            Optional. The callback to execute before the model is called. If
            there are multiple calls to the model, the callback will be executed
            multiple times. Each callback function is expected to return a
            structure (e.g., a dict or object) containing at least: -
            'decision': Either 'OK' or 'TRIGGER'. - 'reason': A string
            explaining the decision. A 'TRIGGER' decision may halt further
            processing.
          $ref: '#/components/schemas/Callback'
        afterAgentCallback:
          description: >-
            Optional. The callback to execute after the agent is called. Each
            callback function is expected to return a structure (e.g., a dict or
            object) containing at least: - 'decision': Either 'OK' or 'TRIGGER'.
            - 'reason': A string explaining the decision. A 'TRIGGER' decision
            may halt further processing.
          $ref: '#/components/schemas/Callback'
      id: GuardrailCodeCallback
      description: >-
        Guardrail that blocks the conversation based on the code callbacks
        provided.
      type: object
    LfA2aV1AgentCard:
      id: LfA2aV1AgentCard
      description: >-
        A self-describing manifest for an agent. It provides essential metadata
        including the agent's identity, capabilities, skills, supported
        communication methods, and security requirements. Next ID: 20
      type: object
      properties:
        name:
          description: >-
            Required. A human readable name for the agent. Example: "Recipe
            Agent"
          type: string
        defaultInputModes:
          description: >-
            Required. protolint:enable REPEATED_FIELD_NAMES_PLURALIZED The set
            of interaction modes that the agent supports across all skills. This
            can be overridden per skill. Defined as media types.
          type: array
          items:
            type: string
        version:
          description: 'Required. The version of the agent. Example: "1.0.0"'
          type: string
        provider:
          description: The service provider of the agent.
          $ref: '#/components/schemas/LfA2aV1AgentProvider'
        iconUrl:
          description: Optional. A URL to an icon for the agent.
          type: string
        defaultOutputModes:
          description: Required. The media types supported as outputs from this agent.
          type: array
          items:
            type: string
        supportedInterfaces:
          description: >-
            Required. Ordered list of supported interfaces. The first entry is
            preferred.
          type: array
          items:
            $ref: '#/components/schemas/LfA2aV1AgentInterface'
        securitySchemes:
          description: The security scheme details used for authenticating with this agent.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LfA2aV1SecurityScheme'
        securityRequirements:
          description: Security requirements for contacting the agent.
          type: array
          items:
            $ref: '#/components/schemas/LfA2aV1SecurityRequirement'
        description:
          description: >-
            Required. A human-readable description of the agent, assisting users
            and other agents in understanding its purpose. Example: "Agent that
            helps users with recipes and cooking."
          type: string
        documentationUrl:
          description: A URL providing additional documentation about the agent.
          type: string
        skills:
          description: >-
            Required. Skills represent the abilities of an agent. It is largely
            a descriptive concept but represents a more focused set of behaviors
            that the agent is likely to succeed at.
          type: array
          items:
            $ref: '#/components/schemas/LfA2aV1AgentSkill'
        capabilities:
          description: Required. A2A Capability set supported by the agent.
          $ref: '#/components/schemas/LfA2aV1AgentCapabilities'
        signatures:
          description: JSON Web Signatures computed for this `AgentCard`.
          type: array
          items:
            $ref: '#/components/schemas/LfA2aV1AgentCardSignature'
    ServiceDirectoryConfig:
      id: ServiceDirectoryConfig
      description: Configuration for tools using Service Directory.
      type: object
      properties:
        service:
          description: >-
            Required. The name of [Service
            Directory](https://cloud.google.com/service-directory) service.
            Format:
            `projects/{project}/locations/{location}/namespaces/{namespace}/services/{service}`.
            Location of the service directory must be the same as the location
            of the app.
          type: string
    RetrieveToolSchemaRequest:
      properties:
        tool:
          description: >-
            Optional. The name of the tool to retrieve the schema for. Format:
            projects/{project}/locations/{location}/apps/{app}/tools/{tool}
          type: string
        toolsetTool:
          description: >-
            Optional. The toolset tool to retrieve the schema for. Only one tool
            should match the predicate from the toolset. Otherwise, an error
            will be returned.
          $ref: '#/components/schemas/ToolsetTool'
      id: RetrieveToolSchemaRequest
      description: Request message for ToolService.RetrieveToolSchema.
      type: object
    ExecuteToolResponse:
      id: ExecuteToolResponse
      description: Response message for ToolService.ExecuteTool.
      type: object
      properties:
        citations:
          description: >-
            Citations that provide the source information for the tool's
            execution.
          $ref: '#/components/schemas/Citations'
        tool:
          description: >-
            The name of the tool that got executed. Format:
            `projects/{project}/locations/{location}/apps/{app}/tools/{tool}`
          type: string
        toolsetTool:
          description: The toolset tool that got executed.
          $ref: '#/components/schemas/ToolsetTool'
        googleSearchSuggestions:
          description: >-
            The suggestions returned from Google Search as a result of invoking
            the Google Search Tool during the tool execution.
          $ref: '#/components/schemas/GoogleSearchSuggestions'
        variables:
          additionalProperties:
            type: any
            description: Properties of the object.
          description: The variable values at the end of the tool execution.
          type: object
        response:
          additionalProperties:
            type: any
            description: Properties of the object.
          description: >-
            The tool execution result in JSON object format. Use "output" key to
            specify tool response and "error" key to specify error details (if
            any). If "output" and "error" keys are not specified, then whole
            "response" is treated as tool execution result.
          type: object
    LfA2aV1AgentInterface:
      id: LfA2aV1AgentInterface
      description: >-
        Declares a combination of a target URL, transport and protocol version
        for interacting with the agent. This allows agents to expose the same
        functionality over multiple protocol binding mechanisms.
      type: object
      properties:
        url:
          description: >-
            Required. The URL where this interface is available. Must be a valid
            absolute HTTPS URL in production. Example:
            "https://api.example.com/a2a/v1", "https://grpc.example.com/a2a"
          type: string
        tenant:
          description: Tenant ID to be used in the request when calling the agent.
          type: string
        protocolBinding:
          description: >-
            Required. The protocol binding supported at this URL. This is an
            open form string, to be easily extended for other protocol bindings.
            The core ones officially supported are `JSONRPC`, `GRPC` and
            `HTTP+JSON`.
          type: string
        protocolVersion:
          description: >-
            Required. The version of the A2A protocol this interface exposes.
            Use the latest supported minor version per major version. Examples:
            "0.3", "1.0"
          type: string
    ChannelProfileWhatsAppConfig:
      properties:
        phoneNumber:
          description: Optional. The phone number in E.164 format.
          type: string
        displayName:
          description: Output only. The fetched Meta business page name.
          readOnly: true
          type: string
        wabaId:
          description: Required. The WhatsApp Business Account ID.
          type: string
        phoneNumberId:
          description: Required. The Meta phone number ID.
          type: string
        thumbnailUrl:
          description: Output only. The fetched Meta business profile thumbnail URL.
          readOnly: true
          type: string
        description:
          description: Output only. The description of the Meta business page or profile.
          readOnly: true
          type: string
      id: ChannelProfileWhatsAppConfig
      description: Configuration specific to WhatsApp deployments.
      type: object
    Deployment:
      id: Deployment
      description: >-
        A deployment represents an immutable, queryable version of the app. It
        is used to deploy an app version with a specific channel profile.
      type: object
      properties:
        updateTime:
          description: Output only. Timestamp when this deployment was last updated.
          readOnly: true
          type: string
          format: google-datetime
        experimentConfig:
          description: Optional. Experiment configuration for the deployment.
          $ref: '#/components/schemas/ExperimentConfig'
        whatsappCredentials:
          description: >-
            Optional. Input only. Ephemeral WhatsApp credentials required when
            configuring a WhatsApp channel profile.
          $ref: '#/components/schemas/WhatsAppCredentials'
        etag:
          description: >-
            Output only. Etag used to ensure the object hasn't changed during a
            read-modify-write operation. If the etag is empty, the update will
            overwrite any concurrent changes.
          readOnly: true
          type: string
        createTime:
          description: Output only. Timestamp when this deployment was created.
          readOnly: true
          type: string
          format: google-datetime
        instagramCredentials:
          description: >-
            Optional. Input only. Ephemeral Instagram credentials required when
            configuring a Instagram channel profile.
          $ref: '#/components/schemas/InstagramCredentials'
        channelProfile:
          description: Required. The channel profile used in the deployment.
          $ref: '#/components/schemas/ChannelProfile'
        name:
          description: >-
            Identifier. The resource name of the deployment. Format:
            `projects/{project}/locations/{location}/apps/{app}/deployments/{deployment}`
          type: string
        displayName:
          description: Required. Display name of the deployment.
          type: string
        appVersion:
          description: >-
            Optional. The resource name of the app version to deploy. Format:
            `projects/{project}/locations/{location}/apps/{app}/versions/{version}`
            Use `projects/{project}/locations/{location}/apps/{app}/versions/-`
            to use the draft app.
          type: string
    RemoteAgentTool:
      properties:
        name:
          description: Required. The name of the tool.
          type: string
        agentCard:
          description: Required. The agent card of the remote agent that this tool invokes.
          $ref: '#/components/schemas/AgentCard'
        description:
          description: Required. The description of the tool.
          type: string
      id: RemoteAgentTool
      description: Represents a tool that allows the agent to call another remote agent.
      type: object
    DataStoreToolBoostSpec:
      properties:
        conditionBoostSpecs:
          description: Required. A list of boosting specifications.
          type: array
          items:
            $ref: '#/components/schemas/DataStoreToolBoostSpecConditionBoostSpec'
      id: DataStoreToolBoostSpec
      description: Boost specification to boost certain documents.
      type: object
    RunSessionRequest:
      id: RunSessionRequest
      description: Request message for SessionService.RunSession.
      type: object
      properties:
        config:
          description: Required. The configuration for the session.
          $ref: '#/components/schemas/SessionConfig'
        inputs:
          description: Required. Inputs for the session.
          type: array
          items:
            $ref: '#/components/schemas/SessionInput'
    CloudLoggingSettings:
      id: CloudLoggingSettings
      description: Settings to describe the Cloud Logging behaviors for the app.
      type: object
      properties:
        enableCloudLogging:
          description: Optional. Whether to enable Cloud Logging for the sessions.
          type: boolean
    LfA2aV1SendMessageResponse:
      id: LfA2aV1SendMessageResponse
      description: Represents the response for the `SendMessage` method.
      type: object
      properties:
        task:
          description: The task created or updated by the message.
          $ref: '#/components/schemas/LfA2aV1Task'
        message:
          description: A message from the agent.
          $ref: '#/components/schemas/LfA2aV1Message'
    TriggerActionTransferAgent:
      id: TriggerActionTransferAgent
      description: The agent will transfer the conversation to a different agent.
      type: object
      properties:
        agent:
          description: >-
            Required. The name of the agent to transfer the conversation to. The
            agent must be in the same app as the current agent. Format:
            `projects/{project}/locations/{location}/apps/{app}/agents/{agent}`
          type: string
    DataStoreConnectorConfig:
      id: DataStoreConnectorConfig
      description: The connector config for the data store connection.
      type: object
      properties:
        collection:
          description: Resource name of the collection the data store belongs to.
          type: string
        collectionDisplayName:
          description: Display name of the collection the data store belongs to.
          type: string
        dataSource:
          description: >-
            The name of the data source. Example: `salesforce`, `jira`,
            `confluence`, `bigquery`.
          type: string
    EndpointControlPolicy:
      id: EndpointControlPolicy
      description: Defines project/location level endpoint control policy.
      type: object
      properties:
        enforcementScope:
          enum:
            - ENFORCEMENT_SCOPE_UNSPECIFIED
            - VPCSC_ONLY
            - ALWAYS
          description: >-
            Optional. The scope in which this policy's allowed_origins list is
            enforced.
          type: string
          enumDescriptions:
            - Unspecified. This policy will be treated as VPCSC_ONLY.
            - This policy applies only when VPC-SC is active.
            - This policy ALWAYS applies, regardless of VPC-SC status.
        allowedOrigins:
          description: >-
            Optional. The allowed HTTP(s) origins that tools in the App are able
            to directly call. The enforcement depends on the value of
            enforcement_scope and the VPC-SC status of the project. If a port
            number is not provided, all ports will be allowed. Otherwise, the
            port number must match exactly. For example, "https://example.com"
            will match "https://example.com:443" and any other port.
            "https://example.com:443" will only match "https://example.com:443".
          type: array
          items:
            type: string
    PythonFunction:
      id: PythonFunction
      description: A Python function tool.
      type: object
      properties:
        description:
          description: >-
            Output only. The description of the Python function, parsed from the
            python code's docstring.
          readOnly: true
          type: string
        name:
          description: >-
            Optional. The name of the Python function to execute. Must match a
            Python function name defined in the python code. Case sensitive. If
            the name is not provided, the first function defined in the python
            code will be used.
          type: string
        pythonCode:
          description: Optional. The Python code to execute for the tool.
          type: string
        serviceDirectoryConfig:
          description: Optional. Service Directory configuration for the tool.
          $ref: '#/components/schemas/ServiceDirectoryConfig'
    ToolResponses:
      properties:
        toolResponses:
          description: Optional. The list of tool execution results.
          type: array
          items:
            $ref: '#/components/schemas/ToolResponse'
      id: ToolResponses
      description: Execution results for the requested tool calls from the client.
      type: object
    GenerateChatTokenRequest:
      properties:
        liveHandoffEnabled:
          description: Optional. Indicates if live handoff is enabled for the session.
          type: boolean
        deployment:
          description: >-
            Required. The deployment of the app to use for the session. Format:
            projects/{project}/locations/{location}/apps/{app}/deployments/{deployment}
          type: string
        recaptchaToken:
          description: >-
            Optional. The reCAPTCHA token generated by the client-side chat
            widget.
          type: string
      id: GenerateChatTokenRequest
      description: Request message for WidgetService.GenerateChatToken.
      type: object
    GuardrailLlmPolicy:
      id: GuardrailLlmPolicy
      description: >-
        Guardrail that blocks the conversation if the LLM response is considered
        violating the policy based on the LLM classification.
      type: object
      properties:
        policyScope:
          enumDescriptions:
            - Policy scope is not specified.
            - Policy check is triggered on user input.
            - >-
              Policy check is triggered on agent response. Applying this policy
              scope will introduce additional latency before the agent can
              respond.
            - >-
              Policy check is triggered on both user input and agent response.
              Applying this policy scope will introduce additional latency
              before the agent can respond.
          description: >-
            Required. Defines when to apply the policy check during the
            conversation. If set to `POLICY_SCOPE_UNSPECIFIED`, the policy will
            be applied to the user input. When applying the policy to the agent
            response, additional latency will be introduced before the agent can
            respond.
          type: string
          enum:
            - POLICY_SCOPE_UNSPECIFIED
            - USER_QUERY
            - AGENT_RESPONSE
            - USER_QUERY_AND_AGENT_RESPONSE
        maxConversationMessages:
          description: >-
            Optional. When checking this policy, consider the last 'n' messages
            in the conversation. When not set a default value of 10 will be
            used.
          type: integer
          format: int32
        modelSettings:
          description: Optional. Model settings.
          $ref: '#/components/schemas/ModelSettings'
        failOpen:
          description: >-
            Optional. If an error occurs during the policy check, fail open and
            do not trigger the guardrail.
          type: boolean
        allowShortUtterance:
          description: >-
            Optional. By default, the LLM policy check is bypassed for short
            utterances. Enabling this setting applies the policy check to all
            utterances, including those that would normally be skipped.
          type: boolean
        prompt:
          description: Required. Policy prompt.
          type: string
    ListLocationsResponse:
      id: ListLocationsResponse
      description: The response message for Locations.ListLocations.
      type: object
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          type: array
          items:
            $ref: '#/components/schemas/Location'
        nextPageToken:
          description: The standard List next-page token.
          type: string
    WidgetToolDataMapping:
      properties:
        fieldMappings:
          additionalProperties:
            type: string
          description: >-
            Optional. A map of widget input parameter fields to the
            corresponding output fields of the source tool.
          type: object
        mode:
          description: Optional. The mode of the data mapping.
          type: string
          enumDescriptions:
            - Unspecified mode.
            - Use the `field_mappings` map for data transformation.
            - Use the `python_script` for data transformation.
          enum:
            - MODE_UNSPECIFIED
            - FIELD_MAPPING
            - PYTHON_SCRIPT
        pythonFunction:
          description: >-
            Optional. Configuration for a Python function used to transform the
            source tool's output into the widget's input format.
          $ref: '#/components/schemas/PythonFunction'
        sourceToolName:
          description: >-
            Optional. The resource name of the tool that provides the data for
            the widget (e.g., a search tool or a custom function). Format:
            `projects/{project}/locations/{location}/agents/{agent}/tools/{tool}`
          type: string
        pythonScript:
          deprecated: true
          description: 'Deprecated: Use `python_function` instead.'
          type: string
      id: WidgetToolDataMapping
      description: >-
        Configuration for mapping data from a source tool to the widget's input
        parameters.
      type: object
    OutputAudioConfig:
      id: OutputAudioConfig
      description: >-
        OutputAudioConfig configures how the CES agent should synthesize
        outgoing audio responses.
      type: object
      properties:
        audioEncoding:
          enumDescriptions:
            - Unspecified audio encoding.
            - 16-bit linear PCM audio encoding.
            - >-
              8-bit samples that compand 14-bit audio samples using G.711
              PCMU/mu-law.
            - >-
              8-bit samples that compand 14-bit audio samples using G.711
              PCMU/A-law.
          description: Required. The encoding of the output audio data.
          type: string
          enum:
            - AUDIO_ENCODING_UNSPECIFIED
            - LINEAR16
            - MULAW
            - ALAW
        sampleRateHertz:
          description: Required. The sample rate (in Hertz) of the output audio data.
          type: integer
          format: int32
    LfA2aV1SendMessageRequest:
      id: LfA2aV1SendMessageRequest
      description: Represents a request for the `SendMessage` method.
      type: object
      properties:
        message:
          description: Required. The message to send to the agent.
          $ref: '#/components/schemas/LfA2aV1Message'
        configuration:
          description: Configuration for the send request.
          $ref: '#/components/schemas/LfA2aV1SendMessageConfiguration'
        metadata:
          additionalProperties:
            type: any
            description: Properties of the object.
          description: >-
            A flexible key-value map for passing additional context or
            parameters.
          type: object
    ConversationTurn:
      id: ConversationTurn
      description: All information about a single turn in the conversation.
      type: object
      properties:
        messages:
          description: >-
            Optional. List of messages in the conversation turn, including user
            input, agent responses and intermediate events during the
            processing.
          type: array
          items:
            $ref: '#/components/schemas/Message'
        rootSpan:
          description: Optional. The root span of the action processing.
          $ref: '#/components/schemas/Span'
    ListOperationsResponse:
      properties:
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          type: array
          items:
            type: string
        nextPageToken:
          description: The standard List next-page token.
          type: string
      id: ListOperationsResponse
      description: The response message for Operations.ListOperations.
      type: object
    DataStoreToolBoostSpecConditionBoostSpec:
      id: DataStoreToolBoostSpecConditionBoostSpec
      description: Boost specification for a condition.
      type: object
      properties:
        boostControlSpec:
          description: >-
            Optional. Complex specification for custom ranking based on customer
            defined attribute value.
          $ref: >-
            #/components/schemas/DataStoreToolBoostSpecConditionBoostSpecBoostControlSpec
        condition:
          description: >-
            Required. An expression which specifies a boost condition. The
            syntax is the same as filter expression syntax. Currently, the only
            supported condition is a list of BCP-47 lang codes. Example: To
            boost suggestions in languages en or fr: (lang_code: ANY("en",
            "fr"))
          type: string
        boost:
          description: >-
            Optional. Strength of the boost, which should be in [-1, 1].
            Negative boost means demotion. Default is 0.0. Setting to 1.0 gives
            the suggestions a big promotion. However, it does not necessarily
            mean that the top result will be a boosted suggestion. Setting to
            -1.0 gives the suggestions a big demotion. However, other
            suggestions that are relevant might still be shown. Setting to 0.0
            means no boost applied. The boosting condition is ignored.
          type: number
          format: float
    LfA2aV1Part:
      id: LfA2aV1Part
      description: >-
        `Part` represents a container for a section of communication content.
        Parts can be purely textual, some sort of file (image, video, etc) or a
        structured data blob (i.e. JSON).
      type: object
      properties:
        raw:
          description: >-
            The `raw` byte content of a file. In JSON serialization, this is
            encoded as a base64 string.
          type: string
          format: byte
        filename:
          description: An optional `filename` for the file (e.g., "document.pdf").
          type: string
        data:
          description: >-
            Arbitrary structured `data` as a JSON value (object, array, string,
            number, boolean, or null).
          type: any
        mediaType:
          description: >-
            The `media_type` (MIME type) of the part content (e.g.,
            "text/plain", "application/json", "image/png"). This field is
            available for all part types.
          type: string
        text:
          description: The string content of the `text` part.
          type: string
        metadata:
          additionalProperties:
            type: any
            description: Properties of the object.
          description: Optional. metadata associated with this part.
          type: object
        url:
          description: A `url` pointing to the file's content.
          type: string
    Image:
      id: Image
      description: Represents an image input or output in the conversation.
      type: object
      properties:
        mimeType:
          description: >-
            Required. The IANA standard MIME type of the source data. Supported
            image types includes: * image/png * image/jpeg * image/webp
          type: string
        data:
          description: Required. Raw bytes of the image.
          type: string
          format: byte
    TlsConfig:
      id: TlsConfig
      description: The TLS configuration.
      type: object
      properties:
        caCerts:
          description: >-
            Required. Specifies a list of allowed custom CA certificates for
            HTTPS verification.
          type: array
          items:
            $ref: '#/components/schemas/TlsConfigCaCert'
    McpToolOverride:
      properties:
        descriptionOverride:
          description: >-
            Optional. If present, this tool uses this description instead of the
            original description from the server.
          type: string
        snapshot:
          description: >-
            Output only. If present, this tool is "Pinned" and uses the snapshot
            values as fallbacks if the server becomes temporarily unavailable or
            if no Override is present.
          readOnly: true
          $ref: '#/components/schemas/McpToolDefinition'
        tool:
          description: >-
            Required. The original name of the tool as it is emitted by the MCP
            server.
          type: string
        nameOverride:
          description: >-
            Optional. If present, this tool uses this name in the Agent instead
            of the original name. This is primarily used as an alias if the MCP
            server offers poorly named tools.
          type: string
      id: McpToolOverride
      description: >-
        Overrides associated with a given tool in a Toolset. This enables
        "pinning" or "overriding" of tool definitions from the external dynamic
        server.
      type: object
    DataStoreToolBoostSpecConditionBoostSpecBoostControlSpecControlPoint:
      id: DataStoreToolBoostSpecConditionBoostSpecBoostControlSpecControlPoint
      description: >-
        The control points used to define the curve. The curve defined through
        these control points can only be monotonically increasing or
        decreasing(constant values are acceptable).
      type: object
      properties:
        boostAmount:
          description: >-
            Optional. The value between -1 to 1 by which to boost the score if
            the attribute_value evaluates to the value specified above.
          type: number
          format: float
        attributeValue:
          description: >-
            Optional. Can be one of: 1. The numerical field value. 2. The
            duration spec for freshness: The value must be formatted as an XSD
            `dayTimeDuration` value (a restricted subset of an ISO 8601 duration
            value). The pattern for this is: `nDnM]`.
          type: string
    AgentCard:
      properties:
        version:
          description: Required. The version of the agent.
          type: string
        name:
          description: Required. A human-readable name for the agent.
          type: string
        description:
          description: >-
            Required. A description of the agent's domain of action/solution
            space.
          type: string
        skills:
          description: >-
            Required. Skills represent a unit of ability an agent can perform.
            This may somewhat abstract but represents a more focused set of
            actions that the agent is highly likely to succeed at.
          type: array
          items:
            $ref: '#/components/schemas/AgentSkill'
        supportedInterfaces:
          description: >-
            Required. Ordered list of supported interfaces. The first entry is
            preferred.
          type: array
          items:
            $ref: '#/components/schemas/AgentInterface'
      id: AgentCard
      description: >-
        AgentCard conveys key information about a remote agent. It is a trimmed
        version of the AgentCard defined in the A2A protocol
        https://a2a-protocol.org/dev/specification/#441-agentcard
      type: object
    DataStoreSettingsEngine:
      id: DataStoreSettingsEngine
      description: >-
        An engine to which the data stores are connected. See Vertex AI Search:
        https://cloud.google.com/generative-ai-app-builder/docs/enterprise-search-introduction.
      type: object
      properties:
        name:
          description: >-
            Output only. The resource name of the engine. Format:
            `projects/{project}/locations/{location}/collections/{collection}/engines/{engine}`
          readOnly: true
          type: string
        type:
          readOnly: true
          type: string
          enumDescriptions:
            - Unspecified engine type.
            - >-
              The SOLUTION_TYPE_SEARCH engine for the app. All connector data
              stores added to the app will be added to this engine.
            - >-
              Chat engine type. The SOLUTION_TYPE_CHAT engine for the app. All
              connector data stores added to the app will be added to this
              engine.
          description: Output only. The type of the engine.
          enum:
            - TYPE_UNSPECIFIED
            - ENGINE_TYPE_SEARCH
            - ENGINE_TYPE_CHAT
    ChannelProfileWebWidgetConfig:
      id: ChannelProfileWebWidgetConfig
      description: Message for configuration for the web widget.
      type: object
      properties:
        theme:
          enum:
            - THEME_UNSPECIFIED
            - LIGHT
            - DARK
          description: Optional. The theme of the web widget.
          type: string
          enumDescriptions:
            - Unknown theme.
            - Light theme.
            - Dark theme.
        webWidgetTitle:
          description: Optional. The title of the web widget.
          type: string
        modality:
          enumDescriptions:
            - Unknown modality.
            - Widget supports both chat and voice input.
            - Widget supports only voice input.
            - Widget supports only chat input.
            - Widget supports chat, voice, and video input.
          description: Optional. The modality of the web widget.
          type: string
          enum:
            - MODALITY_UNSPECIFIED
            - CHAT_AND_VOICE
            - VOICE_ONLY
            - CHAT_ONLY
            - CHAT_VOICE_AND_VIDEO
        securitySettings:
          description: Optional. The security settings of the web widget.
          $ref: '#/components/schemas/ChannelProfileWebWidgetConfigSecuritySettings'
    Agent:
      properties:
        beforeToolCallbacks:
          description: >-
            Optional. The callbacks to execute before the tool is invoked. If
            there are multiple tool invocations, the callback will be executed
            multiple times. The provided callbacks are executed sequentially in
            the exact order they are given in the list. If a callback returns an
            overridden response, execution stops and any remaining callbacks are
            skipped.
          type: array
          items:
            $ref: '#/components/schemas/Callback'
        remoteDialogflowAgent:
          description: >-
            Optional. The remote
            [Dialogflow](https://cloud.google.com/dialogflow/cx/docs/concept/console-conversational-agents)
            agent to be used for the agent execution. If this field is set, all
            other agent level properties will be ignored. Note: If the
            Dialogflow agent is in a different project from the app, you should
            grant `roles/dialogflow.client` to the CES service agent
            `service-@gcp-sa-ces.iam.gserviceaccount.com`.
          $ref: '#/components/schemas/AgentRemoteDialogflowAgent'
        description:
          description: Optional. Human-readable description of the agent.
          type: string
        updateTime:
          description: Output only. Timestamp when the agent was last updated.
          readOnly: true
          type: string
          format: google-datetime
        afterModelCallbacks:
          description: >-
            Optional. The callbacks to execute after the model is called. If
            there are multiple calls to the model, the callback will be executed
            multiple times. The provided callbacks are executed sequentially in
            the exact order they are given in the list. If a callback returns an
            overridden response, execution stops and any remaining callbacks are
            skipped.
          type: array
          items:
            $ref: '#/components/schemas/Callback'
        instruction:
          description: >-
            Optional. Instructions for the LLM model to guide the agent's
            behavior.
          type: string
        tools:
          description: >-
            Optional. List of available tools for the agent. Format:
            `projects/{project}/locations/{location}/apps/{app}/tools/{tool}`
          type: array
          items:
            type: string
        beforeAgentCallbacks:
          description: >-
            Optional. The callbacks to execute before the agent is called. The
            provided callbacks are executed sequentially in the exact order they
            are given in the list. If a callback returns an overridden response,
            execution stops and any remaining callbacks are skipped.
          type: array
          items:
            $ref: '#/components/schemas/Callback'
        etag:
          description: >-
            Etag used to ensure the object hasn't changed during a
            read-modify-write operation. If the etag is empty, the update will
            overwrite any concurrent changes.
          type: string
        createTime:
          description: Output only. Timestamp when the agent was created.
          readOnly: true
          type: string
          format: google-datetime
        generatedSummary:
          description: >-
            Output only. If the agent is generated by the LLM assistant, this
            field contains a descriptive summary of the generation.
          readOnly: true
          type: string
        guardrails:
          description: >-
            Optional. List of guardrails for the agent. Format:
            `projects/{project}/locations/{location}/apps/{app}/guardrails/{guardrail}`
          type: array
          items:
            type: string
        name:
          description: >-
            Identifier. The unique identifier of the agent. Format:
            `projects/{project}/locations/{location}/apps/{app}/agents/{agent}`
          type: string
        displayName:
          description: Required. Display name of the agent.
          type: string
        beforeModelCallbacks:
          description: >-
            Optional. The callbacks to execute before the model is called. If
            there are multiple calls to the model, the callback will be executed
            multiple times. The provided callbacks are executed sequentially in
            the exact order they are given in the list. If a callback returns an
            overridden response, execution stops and any remaining callbacks are
            skipped.
          type: array
          items:
            $ref: '#/components/schemas/Callback'
        childAgents:
          description: >-
            Optional. List of child agents in the agent tree. Format:
            `projects/{project}/locations/{location}/apps/{app}/agents/{agent}`
          type: array
          items:
            type: string
        afterToolCallbacks:
          description: >-
            Optional. The callbacks to execute after the tool is invoked. If
            there are multiple tool invocations, the callback will be executed
            multiple times. The provided callbacks are executed sequentially in
            the exact order they are given in the list. If a callback returns an
            overridden response, execution stops and any remaining callbacks are
            skipped.
          type: array
          items:
            $ref: '#/components/schemas/Callback'
        validationErrors:
          description: >-
            Output only. Misconfigurations or errors in the agent that may
            affect agent quality.
          readOnly: true
          type: array
          items:
            type: string
        afterAgentCallbacks:
          description: >-
            Optional. The callbacks to execute after the agent is called. The
            provided callbacks are executed sequentially in the exact order they
            are given in the list. If a callback returns an overridden response,
            execution stops and any remaining callbacks are skipped.
          type: array
          items:
            $ref: '#/components/schemas/Callback'
        toolsets:
          description: Optional. List of toolsets for the agent.
          type: array
          items:
            $ref: '#/components/schemas/AgentAgentToolset'
        transferRules:
          description: >-
            Optional. Agent transfer rules. If multiple rules match, the first
            one in the list will be used.
          type: array
          items:
            $ref: '#/components/schemas/TransferRule'
        modelSettings:
          description: Optional. Configurations for the LLM model.
          $ref: '#/components/schemas/ModelSettings'
        llmAgent:
          description: Optional. The default agent type.
          $ref: '#/components/schemas/AgentLlmAgent'
      id: Agent
      description: >-
        An agent acts as the fundamental building block that provides
        instructions to the Large Language Model (LLM) for executing specific
        tasks.
      type: object
    InputAudioConfig:
      id: InputAudioConfig
      description: >-
        InputAudioConfig configures how the CES agent should interpret the
        incoming audio data.
      type: object
      properties:
        audioEncoding:
          enumDescriptions:
            - Unspecified audio encoding.
            - 16-bit linear PCM audio encoding.
            - >-
              8-bit samples that compand 14-bit audio samples using G.711
              PCMU/mu-law.
            - >-
              8-bit samples that compand 14-bit audio samples using G.711
              PCMU/A-law.
          description: Required. The encoding of the input audio data.
          type: string
          enum:
            - AUDIO_ENCODING_UNSPECIFIED
            - LINEAR16
            - MULAW
            - ALAW
        noiseSuppressionLevel:
          description: >-
            Optional. Whether to enable noise suppression on the input audio.
            Available values are "low", "moderate", "high", "very_high".
          type: string
        sampleRateHertz:
          description: Required. The sample rate (in Hertz) of the input audio data.
          type: integer
          format: int32
    ListGuardrailsResponse:
      properties:
        guardrails:
          description: The list of guardrails.
          type: array
          items:
            $ref: '#/components/schemas/Guardrail'
        nextPageToken:
          description: >-
            A token that can be sent as ListGuardrailsRequest.page_token to
