        redactionConfig:
          description: Optional. Configuration for how sensitive data should be redacted.
          $ref: '#/components/schemas/RedactionConfig'
        unredactedBigqueryExportSettings:
          description: >-
            Optional. Configures the BigQuery export behaviors for the app. The
            unredacted conversation data will be exported to BigQuery tables if
            it is enabled.
          $ref: '#/components/schemas/BigQueryExportSettings'
        cloudLoggingSettings:
          description: >-
            Optional. Settings to describe the Cloud Logging behaviors for the
            app.
          $ref: '#/components/schemas/CloudLoggingSettings'
      id: LoggingSettings
      description: Settings to describe the logging behaviors for the app.
      type: object
    ExperimentConfigVersionRelease:
      id: ExperimentConfigVersionRelease
