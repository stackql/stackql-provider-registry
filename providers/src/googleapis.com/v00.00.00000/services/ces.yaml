          items:
            $ref: '#/components/schemas/Guardrail'
        examples:
          description: Optional. List of examples in the app.
          type: array
          items:
            $ref: '#/components/schemas/Example'
        tools:
          description: Optional. List of tools in the app.
          type: array
          items:
            $ref: '#/components/schemas/Tool'
    ImportAppResponse:
      properties:
        name:
