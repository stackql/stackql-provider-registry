            $ref: '#/components/schemas/Changelog'
        nextPageToken:
          description: >-
            A token that can be sent as ListChangelogsRequest.page_token to
            retrieve the next page. Absence of this field indicates there are no
            subsequent pages.
          type: string
      id: ListChangelogsResponse
      description: Response message for AgentService.ListChangelogs.
      type: object
    MockConfig:
      id: MockConfig
