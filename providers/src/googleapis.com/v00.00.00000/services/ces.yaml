            Optional. The description of the tool that can be used by the Agent
            to decide whether to call this ConnectorTool.
          type: string
        name:
          description: >-
            Optional. The name of the tool that can be used by the Agent to
            decide whether to call this ConnectorTool.
          type: string
        connection:
          description: >-
            Required. The full resource name of the referenced Integration
            Connectors Connection. Format:
            `projects/{project}/locations/{location}/connections/{connection}`
          type: string
        authConfig:
          description: >-
            Optional. Configures how authentication is handled in Integration
            Connectors. By default, an admin authentication is passed in the
            Integration Connectors API requests. You can override it with a
            different end-user authentication config. **Note**: The Connection
            must have authentication override enabled in order to specify an EUC
            configuration here - otherwise, the ConnectorTool creation will
            fail. See
            https://cloud.google.com/application-integration/docs/configure-connectors-task#configure-authentication-override
            for details.
          $ref: '#/components/schemas/EndUserAuthConfig'
      id: ConnectorTool
      description: >-
        A ConnectorTool allows connections to different integrations. See:
        https://cloud.google.com/integration-connectors/docs/overview.
      type: object
    OperationMetadata:
      id: OperationMetadata
      description: Represents the metadata of the long-running operation.
      type: object
      properties:
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        createTime:
