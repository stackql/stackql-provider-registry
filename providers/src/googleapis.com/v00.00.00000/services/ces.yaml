            - ALWAYS_INCLUDE
            - NEVER_INCLUDE
          description: Optional. The filter parameter behavior.
          type: string
          enumDescriptions:
            - >-
              Default filter behavior. Include filter parameter for connector
              datastores. For the rest of the datastore types, the filter input
              parameter is omitted.
            - Always include filter parameter for all datastore types.
