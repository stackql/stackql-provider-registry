            conversation turn and will provide no further output for this turn.
          type: boolean
        toolCalls:
          description: Request for the client to execute the tools.
          $ref: '#/components/schemas/ToolCalls'
        citations:
          description: >-
            Citations that provide the source information for the agent's
            generated text.
          $ref: '#/components/schemas/Citations'
        payload:
          description: Custom payload with structured output from the CES agent.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
      id: SessionOutput
      description: Output for the session.
      type: object
    Tool:
      id: Tool
      description: >-
        A tool represents an action that the CES agent can take to achieve
        certain goals.
      type: object
      properties:
        generatedSummary:
          description: >-
            Output only. If the tool is generated by the LLM assistant, this
            field contains a descriptive summary of the generation.
          readOnly: true
          type: string
        createTime:
          description: Output only. Timestamp when the tool was created.
          readOnly: true
          type: string
          format: google-datetime
        connectorTool:
          description: Optional. The Integration Connector tool.
          $ref: '#/components/schemas/ConnectorTool'
        timeout:
          description: >-
            Optional. The timeout for the tool execution. If not set, the
            default timeout is 30 seconds for `SYNCHRONOUS` tools and 60 seconds
            for `ASYNCHRONOUS` tools.
          type: string
          format: google-duration
        name:
          description: >-
            Identifier. The resource name of the tool. Format: *
            `projects/{project}/locations/{location}/apps/{app}/tools/{tool}`
            for standalone tools. *
            `projects/{project}/locations/{location}/apps/{app}/toolsets/{toolset}/tools/{tool}`
            for tools retrieved from a toolset. These tools are dynamic and
            output-only; they cannot be referenced directly where a tool is
            expected.
          type: string
        displayName:
          description: >-
            Output only. The display name of the tool, derived based on the
            tool's type. For example, display name of a ClientFunction is
            derived from its `name` property.
          readOnly: true
          type: string
        openApiTool:
          description: Optional. The open API tool.
          $ref: '#/components/schemas/OpenApiTool'
        fileSearchTool:
          description: Optional. The file search tool.
          $ref: '#/components/schemas/FileSearchTool'
        systemTool:
          description: Optional. The system tool.
          $ref: '#/components/schemas/SystemTool'
        widgetTool:
          description: Optional. The widget tool.
          $ref: '#/components/schemas/WidgetTool'
        pythonFunction:
          description: Optional. The python function tool.
          $ref: '#/components/schemas/PythonFunction'
        mcpTool:
          description: >-
            Optional. The MCP tool. An MCP tool cannot be created or updated
            directly and is managed by the MCP toolset.
          $ref: '#/components/schemas/McpTool'
        googleSearchTool:
          description: Optional. The google search tool.
          $ref: '#/components/schemas/GoogleSearchTool'
        clientFunction:
          description: Optional. The client function.
          $ref: '#/components/schemas/ClientFunction'
        remoteAgentTool:
          description: Optional. The remote agent tool.
          $ref: '#/components/schemas/RemoteAgentTool'
        dataStoreTool:
          description: Optional. The data store tool.
          $ref: '#/components/schemas/DataStoreTool'
        updateTime:
          description: Output only. Timestamp when the tool was last updated.
          readOnly: true
          type: string
          format: google-datetime
        etag:
          description: >-
            Etag used to ensure the object hasn't changed during a
            read-modify-write operation. If the etag is empty, the update will
            overwrite any concurrent changes.
          type: string
        executionType:
          description: Optional. The execution type of the tool.
          type: string
          enumDescriptions:
            - >-
              The execution type is unspecified. Defaults to `SYNCHRONOUS` if
              unspecified.
            - >-
              The tool is executed synchronously. The session is blocked until
              the tool returns.
            - >-
              The tool is executed asynchronously. The session will continue
              while the tool is executing.
          enum:
            - EXECUTION_TYPE_UNSPECIFIED
            - SYNCHRONOUS
            - ASYNCHRONOUS
        agentTool:
          description: Optional. The agent tool.
          $ref: '#/components/schemas/AgentTool'
        toolFakeConfig:
          description: Optional. Configuration for tool behavior in fake mode.
          $ref: '#/components/schemas/ToolFakeConfig'
    BearerTokenConfig:
      id: BearerTokenConfig
      description: Configurations for authentication with a bearer token.
      type: object
      properties:
        token:
          description: >-
            Required. The bearer token. Must be in the format
            `$context.variables.`.
          type: string
    ListExamplesResponse:
      properties:
        nextPageToken:
          description: >-
            A token that can be sent as ListExamplesRequest.page_token to
            retrieve the next page. Absence of this field indicates there are no
            subsequent pages.
          type: string
        examples:
          description: The list of examples.
          type: array
          items:
            $ref: '#/components/schemas/Example'
      id: ListExamplesResponse
      description: Response message for AgentService.ListExamples.
      type: object
    ExperimentConfig:
      properties:
        versionRelease:
          description: Optional. Version release for the experiment.
          $ref: '#/components/schemas/ExperimentConfigVersionRelease'
      id: ExperimentConfig
      description: Experiment for the deployment.
      type: object
    LfA2aV1AgentCapabilities:
      properties:
        extensions:
          description: A list of protocol extensions supported by the agent.
          type: array
          items:
            $ref: '#/components/schemas/LfA2aV1AgentExtension'
        streaming:
          description: Indicates if the agent supports streaming responses.
          type: boolean
        pushNotifications:
          description: >-
            Indicates if the agent supports sending push notifications for
            asynchronous task updates.
          type: boolean
        extendedAgentCard:
          description: >-
            Indicates if the agent supports providing an extended agent card
            when authenticated.
          type: boolean
      id: LfA2aV1AgentCapabilities
      description: Defines optional capabilities supported by an agent.
      type: object
    EndUserAuthConfig:
      id: EndUserAuthConfig
      description: >-
        End-user authentication configuration used for Connection calls. The
        field values must be the names of context variables in the format
        `$context.variables.`.
      type: object
      properties:
        oauth2AuthCodeConfig:
          description: Oauth 2.0 Authorization Code authentication.
          $ref: '#/components/schemas/EndUserAuthConfigOauth2AuthCodeConfig'
        oauth2JwtBearerConfig:
          description: JWT Profile Oauth 2.0 Authorization Grant authentication.
          $ref: '#/components/schemas/EndUserAuthConfigOauth2JwtBearerConfig'
    EvaluationMetricsThresholdsToolMatchingSettings:
      id: EvaluationMetricsThresholdsToolMatchingSettings
      description: Settings for matching tool calls.
      type: object
      properties:
        extraToolCallBehavior:
          enumDescriptions:
            - Unspecified behavior. Defaults to FAIL.
            - Fail the evaluation if an extra tool call is encountered.
            - Allow the extra tool call.
          description: Optional. Behavior for extra tool calls. Defaults to FAIL.
          type: string
          enum:
            - EXTRA_TOOL_CALL_BEHAVIOR_UNSPECIFIED
            - FAIL
            - ALLOW
    App:
      properties:
        deploymentCount:
          description: Output only. Number of deployments in the app.
          readOnly: true
          type: integer
          format: int32
        validationErrors:
          description: Output only. Misconfigurations or warnings in the app.
          readOnly: true
          type: array
          items:
            type: string
        timeZoneSettings:
          description: Optional. TimeZone settings of the app.
          $ref: '#/components/schemas/TimeZoneSettings'
        metadata:
          description: >-
            Optional. Metadata about the app. This field can be used to store
            additional information relevant to the app's details or intended
            usages.
          type: object
          additionalProperties:
            type: string
        vpcScSettings:
          description: Optional. VPC-SC settings for the app.
          $ref: '#/components/schemas/VpcScSettings'
        loggingSettings:
          description: Optional. Logging settings of the app.
          $ref: '#/components/schemas/LoggingSettings'
        toolExecutionMode:
          description: >-
            Optional. The tool execution mode for the app. If not provided, will
            default to PARALLEL.
          type: string
          enumDescriptions:
            - Unspecified tool execution mode. Default to PARALLEL.
            - >-
              If there are multiple tools being selected, they will be executed
              in parallel, with the same
              [ToolContext](https://google.github.io/adk-docs/context/#the-different-types-of-context).
            - >-
              If there are multiple tools being selected, they will be executed
              sequentially. The next tool will only be executed after the
              previous tool completes and it can see updated
              [ToolContext](https://google.github.io/adk-docs/context/#the-different-types-of-context)
              from the previous tool.
          enum:
            - TOOL_EXECUTION_MODE_UNSPECIFIED
            - PARALLEL
            - SEQUENTIAL
        defaultChannelProfile:
          description: Optional. The default channel profile used by the app.
          $ref: '#/components/schemas/ChannelProfile'
        clientCertificateSettings:
          description: Optional. The default client certificate settings for the app.
          $ref: '#/components/schemas/ClientCertificateSettings'
        errorHandlingSettings:
          description: Optional. Error handling settings of the app.
          $ref: '#/components/schemas/ErrorHandlingSettings'
        predefinedVariableDeclarations:
          description: Output only. The declarations of predefined variables for the app.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/AppVariableDeclaration'
        languageSettings:
          description: Optional. Language settings of the app.
          $ref: '#/components/schemas/LanguageSettings'
        modelSettings:
          description: >-
            Optional. The default LLM model settings for the app. Individual
            resources (e.g. agents, guardrails) can override these
            configurations as needed.
          $ref: '#/components/schemas/ModelSettings'
        pinned:
          description: Optional. Whether the app is pinned in the app list.
          type: boolean
        createTime:
          description: Output only. Timestamp when the app was created.
          readOnly: true
          type: string
          format: google-datetime
        globalInstruction:
          description: >-
            Optional. Instructions for all the agents in the app. You can use
            this instruction to set up a stable identity or personality across
            all the agents.
          type: string
        guardrails:
          description: >-
            Optional. List of guardrails for the app. Format:
            `projects/{project}/locations/{location}/apps/{app}/guardrails/{guardrail}`
          type: array
          items:
            type: string
        name:
          description: >-
            Identifier. The unique identifier of the app. Format:
            `projects/{project}/locations/{location}/apps/{app}`
          type: string
        displayName:
          description: Required. Display name of the app.
          type: string
        locked:
          description: >-
            Optional. Indicates whether the app is locked for changes. If the
            app is locked, modifications to the app resources will be rejected.
          type: boolean
        updateTime:
          description: Output only. Timestamp when the app was last updated.
          readOnly: true
          type: string
          format: google-datetime
        etag:
          description: >-
            Output only. Etag used to ensure the object hasn't changed during a
            read-modify-write operation. If the etag is empty, the update will
            overwrite any concurrent changes.
          readOnly: true
          type: string
        variableDeclarations:
          description: Optional. The declarations of the variables.
          type: array
          items:
            $ref: '#/components/schemas/AppVariableDeclaration'
        description:
          description: Optional. Human-readable description of the app.
          type: string
        audioProcessingConfig:
          description: Optional. Audio processing configuration of the app.
          $ref: '#/components/schemas/AudioProcessingConfig'
        dataStoreSettings:
          description: Optional. The data store settings for the app.
          $ref: '#/components/schemas/DataStoreSettings'
        evaluationMetricsThresholds:
          description: Optional. The evaluation thresholds for the app.
          $ref: '#/components/schemas/EvaluationMetricsThresholds'
        rootAgent:
          description: >-
            Optional. The root agent is the entry point of the app. Format:
            `projects/{project}/locations/{location}/apps/{app}/agents/{agent}`
          type: string
      id: App
      description: >-
        An app serves as a top-level container for a group of agents, including
        the root agent and its sub-agents, along with their associated
        configurations. These agents work together to achieve specific goals
        within the app's context.
      type: object
    Action:
      id: Action
      description: >-
        Configuration of an Action for the tool to use. Note: This can be either
        an Action or an Operation. See
        https://cloud.google.com/integration-connectors/docs/entities-operation-action
        for details.
      type: object
      properties:
        inputFields:
          description: >-
            Optional. Entity fields to use as inputs for the operation. If no
            fields are specified, all fields of the Entity will be used.
          type: array
          items:
            type: string
        connectionActionId:
          description: ID of a Connection action for the tool to use.
          type: string
        entityOperation:
          description: Entity operation configuration for the tool to use.
          $ref: '#/components/schemas/ActionEntityOperation'
        outputFields:
          description: >-
            Optional. Entity fields to return from the operation. If no fields
            are specified, all fields of the Entity will be returned.
          type: array
          items:
            type: string
    ListToolsetsResponse:
      id: ListToolsetsResponse
      description: Response message for AgentService.ListToolsets.
      type: object
      properties:
        toolsets:
          description: The list of toolsets.
          type: array
          items:
            $ref: '#/components/schemas/Toolset'
        nextPageToken:
          description: >-
            A token that can be sent as ListToolsetsRequest.page_token to
            retrieve the next page. Absence of this field indicates there are no
            subsequent pages.
          type: string
    Message:
      id: Message
      description: A message within a conversation.
      type: object
      properties:
        chunks:
          description: Optional. Content of the message as a series of chunks.
          type: array
          items:
            $ref: '#/components/schemas/Chunk'
        eventTime:
          description: >-
            Optional. Timestamp when the message was sent or received. Should
            not be used if the message is part of an example.
          type: string
          format: google-datetime
        role:
          description: Optional. The role within the conversation, e.g., user, agent.
          type: string
    DataStoreToolModalityConfig:
      id: DataStoreToolModalityConfig
      description: >-
        If specified, will apply the given configuration for the specified
        modality.
      type: object
      properties:
        modalityType:
          enumDescriptions:
            - Unspecified modality type.
            - Text modality.
            - Audio modality.
          description: Required. The modality type.
          type: string
          enum:
            - MODALITY_TYPE_UNSPECIFIED
            - TEXT
            - AUDIO
        groundingConfig:
          description: Optional. The grounding configuration.
          $ref: '#/components/schemas/DataStoreToolGroundingConfig'
        rewriterConfig:
          description: Optional. The rewriter config.
          $ref: '#/components/schemas/DataStoreToolRewriterConfig'
        summarizationConfig:
          description: Optional. The summarization config.
          $ref: '#/components/schemas/DataStoreToolSummarizationConfig'
    LfA2aV1OAuth2SecurityScheme:
      properties:
        flows:
          description: >-
            Required. An object containing configuration information for the
            supported OAuth 2.0 flows.
          $ref: '#/components/schemas/LfA2aV1OAuthFlows'
        description:
          description: An optional description for the security scheme.
          type: string
        oauth2MetadataUrl:
          description: >-
            URL to the OAuth2 authorization server metadata [RFC
            8414](https://datatracker.ietf.org/doc/html/rfc8414). TLS is
            required.
          type: string
      id: LfA2aV1OAuth2SecurityScheme
      description: Defines a security scheme using OAuth 2.0.
      type: object
    ErrorHandlingSettingsFallbackResponseConfig:
      properties:
        customFallbackMessages:
          additionalProperties:
            type: string
          description: >-
            Optional. The fallback messages in case of system errors (e.g. LLM
            errors), mapped by [supported language
            code](https://docs.cloud.google.com/customer-engagement-ai/conversational-agents/ps/reference/language).
          type: object
        maxFallbackAttempts:
          description: >-
            Optional. The maximum number of fallback attempts to make before the
            agent emitting EndSession Signal.
          type: integer
          format: int32
      id: ErrorHandlingSettingsFallbackResponseConfig
      description: Configuration for handling fallback responses.
      type: object
    TransferRuleDisablePlannerTransfer:
      properties:
        expressionCondition:
          description: >-
            Required. If the condition evaluates to true, planner will not be
            allowed to transfer to the target agent.
          $ref: '#/components/schemas/ExpressionCondition'
      id: TransferRuleDisablePlannerTransfer
      description: A rule that prevents the planner from transferring to the target agent.
      type: object
    ToolFakeConfig:
      properties:
        codeBlock:
          description: >-
            Optional. Code block which will be executed instead of a real tool
            call.
          $ref: '#/components/schemas/CodeBlock'
        enableFakeMode:
          description: Optional. Whether the tool is using fake mode.
          type: boolean
      id: ToolFakeConfig
      description: Configuration for tool behavior in fake mode.
      type: object
    Span:
      id: Span
      description: >-
        A span is a unit of work or a single operation during the request
        processing.
      type: object
      properties:
        name:
          description: Output only. The name of the span.
          readOnly: true
          type: string
        endTime:
          description: Output only. The end time of the span.
          readOnly: true
          type: string
          format: google-datetime
        duration:
          description: Output only. The duration of the span.
          readOnly: true
          type: string
          format: google-duration
        attributes:
          description: Output only. Key-value attributes associated with the span.
          readOnly: true
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        childSpans:
          description: Output only. The child spans that are nested under this span.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/Span'
        startTime:
          description: Output only. The start time of the span.
          readOnly: true
          type: string
          format: google-datetime
    FileSearchTool:
      id: FileSearchTool
      description: >-
        The file search tool allows the agent to search across the files
        uploaded by the app/agent developer. It has presets to give relatively
        good quality search over the uploaded files and summarization of the
        retrieved results.
      type: object
      properties:
        corpusType:
          enum:
            - CORPUS_TYPE_UNSPECIFIED
            - USER_OWNED
            - FULLY_MANAGED
          description: Optional. The type of the corpus. Default is FULLY_MANAGED.
          type: string
          enumDescriptions:
            - Unspecified corpus type.
            - The corpus is created and owned by the user.
            - The corpus is created by the agent.
        name:
          description: Required. The tool name.
          type: string
        fileCorpus:
          description: >-
            Optional. The corpus where files are stored. Format:
            projects/{project}/locations/{location}/ragCorpora/{rag_corpus}
          type: string
        description:
          description: Optional. The tool description.
          type: string
    AgentLlmAgent:
      id: AgentLlmAgent
      description: >-
        Default agent type. The agent uses instructions and callbacks specified
        in the agent to perform the task using a large language model.
      type: object
      properties: {}
    ClientFunction:
      id: ClientFunction
      description: >-
        Represents a client-side function that the agent can invoke. When the
        tool is chosen by the agent, control is handed off to the client. The
        client is responsible for executing the function and returning the
        result as a ToolResponse to continue the interaction with the agent.
      type: object
      properties:
        name:
          description: Required. The function name.
          type: string
        response:
          description: Optional. The schema of the function response.
          $ref: '#/components/schemas/Schema'
        description:
          description: Optional. The function description.
          type: string
        parameters:
          description: Optional. The schema of the function parameters.
          $ref: '#/components/schemas/Schema'
    LfA2aV1AuthenticationInfo:
      properties:
        scheme:
          description: >-
            Required. HTTP Authentication Scheme from the [IANA
            registry](https://www.iana.org/assignments/http-authschemes/).
            Examples: `Bearer`, `Basic`, `Digest`. Scheme names are
            case-insensitive per [RFC 9110 Section
            11.1](https://www.rfc-editor.org/rfc/rfc9110#section-11.1).
          type: string
        credentials:
          description: >-
            Push Notification credentials. Format depends on the scheme (e.g.,
            token for Bearer).
          type: string
      id: LfA2aV1AuthenticationInfo
      description: Defines authentication details, used for push notifications.
      type: object
    LfA2aV1AuthorizationCodeOAuthFlow:
      id: LfA2aV1AuthorizationCodeOAuthFlow
      description: Defines configuration details for the OAuth 2.0 Authorization Code flow.
      type: object
      properties:
        authorizationUrl:
          description: Required. The authorization URL to be used for this flow.
          type: string
        refreshUrl:
          description: The URL to be used for obtaining refresh tokens.
          type: string
        pkceRequired:
          description: >-
            Indicates if PKCE (RFC 7636) is required for this flow. PKCE should
            always be used for public clients and is recommended for all
            clients.
          type: boolean
        tokenUrl:
          description: Required. The token URL to be used for this flow.
          type: string
        scopes:
          description: Required. The available scopes for the OAuth2 security scheme.
          type: object
          additionalProperties:
            type: string
    WebSearchQuery:
      properties:
        query:
          description: The search query text.
          type: string
        uri:
          description: The URI to the Google Search results page for the query.
          type: string
      id: WebSearchQuery
      description: Represents a single web search query and its associated search uri.
      type: object
    LfA2aV1AgentExtension:
      properties:
        uri:
          description: The unique URI identifying the extension.
          type: string
        description:
          description: A human-readable description of how this agent uses the extension.
          type: string
        required:
          description: >-
            If true, the client must understand and comply with the extension's
            requirements.
          type: boolean
        params:
          description: Optional. Extension-specific configuration parameters.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
      id: LfA2aV1AgentExtension
      description: A declaration of a protocol extension supported by an Agent.
      type: object
    EvaluationMetricsThresholdsGoldenEvaluationMetricsThresholds:
      properties:
        turnLevelMetricsThresholds:
          description: Optional. The turn level metrics thresholds.
          $ref: >-
            #/components/schemas/EvaluationMetricsThresholdsGoldenEvaluationMetricsThresholdsTurnLevelMetricsThresholds
        toolMatchingSettings:
          description: >-
            Optional. The tool matching settings. An extra tool call is a tool
            call that is present in the execution but does not match any tool
            call in the golden expectation.
          $ref: '#/components/schemas/EvaluationMetricsThresholdsToolMatchingSettings'
        expectationLevelMetricsThresholds:
          description: Optional. The expectation level metrics thresholds.
          $ref: >-
            #/components/schemas/EvaluationMetricsThresholdsGoldenEvaluationMetricsThresholdsExpectationLevelMetricsThresholds
      id: EvaluationMetricsThresholdsGoldenEvaluationMetricsThresholds
      description: Settings for golden evaluations.
      type: object
    LfA2aV1SendMessageConfiguration:
      properties:
        historyLength:
          description: >-
            The maximum number of most recent messages from the task's history
            to retrieve in the response. An unset value means the client does
            not impose any limit. A value of zero is a request to not include
            any messages. The server MUST NOT return more messages than the
            provided value, but MAY apply a lower limit.
          type: integer
          format: int32
        returnImmediately:
          description: >-
            If `true`, the operation returns immediately after creating the
            task, even if processing is still in progress. If `false` (default),
            the operation MUST wait until the task reaches a terminal
            (`COMPLETED`, `FAILED`, `CANCELED`, `REJECTED`) or interrupted
            (`INPUT_REQUIRED`, `AUTH_REQUIRED`) state before returning.
          type: boolean
        acceptedOutputModes:
          description: >-
            A list of media types the client is prepared to accept for response
            parts. Agents SHOULD use this to tailor their output.
          type: array
          items:
            type: string
        taskPushNotificationConfig:
          description: >-
            Configuration for the agent to send push notifications for task
            updates. Task id should be empty when sending this configuration in
            a `SendMessage` request.
          $ref: '#/components/schemas/LfA2aV1TaskPushNotificationConfig'
      id: LfA2aV1SendMessageConfiguration
      description: Configuration of a send message request.
      type: object
    EvaluationMetricsThresholds:
      id: EvaluationMetricsThresholds
      description: Threshold settings for metrics in an Evaluation.
      type: object
      properties:
        goldenEvaluationMetricsThresholds:
          description: Optional. The golden evaluation metrics thresholds.
          $ref: >-
            #/components/schemas/EvaluationMetricsThresholdsGoldenEvaluationMetricsThresholds
        hallucinationMetricBehavior:
          type: string
          enumDescriptions:
            - Unspecified hallucination metric behavior.
            - Disable hallucination metric.
            - Enable hallucination metric.
          enum:
            - HALLUCINATION_METRIC_BEHAVIOR_UNSPECIFIED
            - DISABLED
            - ENABLED
          description: >-
            Optional. Deprecated: Use `golden_hallucination_metric_behavior`
            instead. The hallucination metric behavior is currently used for
            golden evaluations.
          deprecated: true
        goldenHallucinationMetricBehavior:
          enumDescriptions:
            - Unspecified hallucination metric behavior.
            - Disable hallucination metric.
            - Enable hallucination metric.
          description: Optional. The hallucination metric behavior for golden evaluations.
          type: string
          enum:
            - HALLUCINATION_METRIC_BEHAVIOR_UNSPECIFIED
            - DISABLED
            - ENABLED
        scenarioHallucinationMetricBehavior:
          enum:
            - HALLUCINATION_METRIC_BEHAVIOR_UNSPECIFIED
            - DISABLED
            - ENABLED
          description: >-
            Optional. The hallucination metric behavior for scenario
            evaluations.
          type: string
          enumDescriptions:
            - Unspecified hallucination metric behavior.
            - Disable hallucination metric.
            - Enable hallucination metric.
    RetrieveToolsResponse:
      properties:
        tools:
          description: The list of tools that are included in the specified toolset.
          type: array
          items:
            $ref: '#/components/schemas/Tool'
      id: RetrieveToolsResponse
      description: Response message for ToolService.RetrieveTools.
      type: object
    GuardrailLlmPromptSecurity:
      id: GuardrailLlmPromptSecurity
      description: >-
        Guardrail that blocks the conversation if the input is considered unsafe
        based on the LLM classification.
      type: object
      properties:
        defaultSettings:
          description: >-
            Optional. Use the system's predefined default security settings. To
            select this mode, include an empty 'default_settings' message in the
            request. The 'default_prompt_template' field within will be
            populated by the server in the response.
          $ref: >-
            #/components/schemas/GuardrailLlmPromptSecurityDefaultSecuritySettings
        failOpen:
          description: >-
            Optional. Determines the behavior when the guardrail encounters an
            LLM error. - If true: the guardrail is bypassed. - If false
            (default): the guardrail triggers/blocks. Note: If a custom policy
            is provided, this field is ignored in favor of the policy's
            'fail_open' configuration.
          type: boolean
        customPolicy:
          description: >-
            Optional. Use a user-defined LlmPolicy to configure the security
            guardrail.
          $ref: '#/components/schemas/GuardrailLlmPolicy'
    CancelOperationRequest:
      id: CancelOperationRequest
      description: The request message for Operations.CancelOperation.
      type: object
      properties: {}
    EvaluationMetricsThresholdsGoldenEvaluationMetricsThresholdsTurnLevelMetricsThresholds:
      properties:
        semanticSimilarityChannel:
          enum:
            - SEMANTIC_SIMILARITY_CHANNEL_UNSPECIFIED
            - TEXT
            - AUDIO
          enumDescriptions:
            - Metric unspecified. Defaults to TEXT.
            - Use text semantic similarity.
            - Use audio semantic similarity.
          description: Optional. The semantic similarity channel to use for evaluation.
          type: string
        overallToolInvocationCorrectnessThreshold:
          description: >-
            Optional. The success threshold for overall tool invocation
            correctness. Must be a float between 0 and 1. Default is 1.0.
          type: number
          format: float
        semanticSimilaritySuccessThreshold:
          description: >-
            Optional. The success threshold for semantic similarity. Must be an
            integer between 0 and 4. Default is >= 3.
          type: integer
          format: int32
      id: >-
        EvaluationMetricsThresholdsGoldenEvaluationMetricsThresholdsTurnLevelMetricsThresholds
      description: Turn level metrics thresholds.
      type: object
    GoogleSearchSuggestions:
      id: GoogleSearchSuggestions
      description: Search suggestions from Google Search Tool.
      type: object
      properties:
        htmls:
          description: >-
            Compliant HTML and CSS styling for search suggestions. The provided
            HTML and CSS automatically adapts to your device settings,
            displaying in either light or dark mode indicated by
            `@media(prefers-color-scheme)`.
          type: array
          items:
            type: string
        webSearchQueries:
          description: >-
            List of queries used to perform the google search along with the
            search result URIs forming the search suggestions.
          type: array
          items:
            $ref: '#/components/schemas/WebSearchQuery'
    LfA2aV1Message:
      id: LfA2aV1Message
      description: >-
        `Message` is one unit of communication between client and server. It can
        be associated with a context and/or a task. For server messages,
        `context_id` must be provided, and `task_id` only if a task was created.
        For client messages, both fields are optional, with the caveat that if
        both are provided, they have to match (the `context_id` has to be the
        one that is set on the task). If only `task_id` is provided, the server
        will infer `context_id` from it.
      type: object
      properties:
        role:
          description: Required. Identifies the sender of the message.
          type: string
          enumDescriptions:
            - The role is unspecified.
            - The message is from the client to the server.
            - The message is from the server to the client.
          enum:
            - ROLE_UNSPECIFIED
            - ROLE_USER
            - ROLE_AGENT
        metadata:
          description: Optional. Any metadata to provide along with the message.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        taskId:
          description: >-
            Optional. The task id of the message. If set, the message will be
            associated with the given task.
          type: string
        parts:
          description: Required. Parts is the container of the message content.
          type: array
          items:
            $ref: '#/components/schemas/LfA2aV1Part'
        referenceTaskIds:
          description: >-
            A list of task IDs that this message references for additional
            context.
          type: array
          items:
            type: string
        contextId:
          description: >-
            Optional. The context id of the message. If set, the message will be
            associated with the given context.
          type: string
        messageId:
          description: >-
            Required. The unique identifier (e.g. UUID) of the message. This is
            created by the message creator.
          type: string
        extensions:
          description: >-
            The URIs of extensions that are present or contributed to this
            Message.
          type: array
          items:
            type: string
    ExecuteToolRequest:
      id: ExecuteToolRequest
      description: Request message for ToolService.ExecuteTool.
      type: object
      properties:
        tool:
          description: >-
            Optional. The name of the tool to execute. Format:
            projects/{project}/locations/{location}/apps/{app}/tools/{tool}
          type: string
        args:
          additionalProperties:
            type: any
            description: Properties of the object.
          description: >-
            Optional. The input parameters and values for the tool in JSON
            object format.
          type: object
        variables:
          description: Optional. The variables that are available for the tool execution.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        toolsetTool:
          description: >-
            Optional. The toolset tool to execute. Only one tool should match
            the predicate from the toolset. Otherwise, an error will be
            returned.
          $ref: '#/components/schemas/ToolsetTool'
        mockConfig:
          description: >-
            Optional. Mock configuration for the tool execution. If this field
            is set, tools that call other tools will be mocked based on the
            provided patterns and responses.
          $ref: '#/components/schemas/MockConfig'
        context:
          additionalProperties:
            type: any
            description: Properties of the object.
          description: >-
            Optional. The
            [ToolCallContext](https://docs.cloud.google.com/customer-engagement-ai/conversational-agents/ps/tool/python#environment
            for details) to be passed to the Python tool.
          type: object
    TlsConfigCaCert:
      properties:
        displayName:
          description: >-
            Required. The name of the allowed custom CA certificates. This can
            be used to disambiguate the custom CA certificates.
          type: string
        cert:
          description: >-
            Required. The allowed custom CA certificates (in DER format) for
            HTTPS verification. This overrides the default SSL trust store. If
            this is empty or unspecified, CES will use Google's default trust
            store to verify certificates. N.B. Make sure the HTTPS server
            certificates are signed with "subject alt name". For instance a
            certificate can be self-signed using the following command: ```
            openssl x509 -req -days 200 -in example.com.csr \ -signkey
            example.com.key \ -out example.com.crt \ -extfile <(printf
            "\nsubjectAltName='DNS:www.example.com'") ```
          type: string
          format: byte
      id: TlsConfigCaCert
      description: The CA certificate.
      type: object
    LfA2aV1Artifact:
      properties:
        artifactId:
          description: >-
            Required. Unique identifier (e.g. UUID) for the artifact. It must be
