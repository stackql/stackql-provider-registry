    WidgetTool:
      properties:
        uiConfig:
          description: Optional. Configuration for rendering the widget.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        widgetType:
          enumDescriptions:
            - Unspecified widget type.
            - Custom widget type.
            - Product carousel widget.
            - Product details widget.
            - Quick actions widget.
            - Product comparison widget.
            - Advanced product details widget.
            - Short form widget.
            - Overall satisfaction widget.
            - Order summary widget.
            - Appointment details widget.
            - Appointment scheduler widget.
            - Contact form widget.
          description: >-
            Optional. The type of the widget tool. If not specified, the default
            type will be CUSTOMIZED.
          type: string
          enum:
            - WIDGET_TYPE_UNSPECIFIED
            - CUSTOM
            - PRODUCT_CAROUSEL
            - PRODUCT_DETAILS
            - QUICK_ACTIONS
            - PRODUCT_COMPARISON
            - ADVANCED_PRODUCT_DETAILS
            - SHORT_FORM
            - OVERALL_SATISFACTION
            - ORDER_SUMMARY
            - APPOINTMENT_DETAILS
            - APPOINTMENT_SCHEDULER
            - CONTACT_FORM
        dataMapping:
          description: >-
            Optional. The mapping that defines how data from a source tool is
