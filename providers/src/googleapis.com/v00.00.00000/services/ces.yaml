          type: string
        organization:
          description: >-
            Required. The name of the agent provider's organization. Example:
            "Google"
          type: string
      id: LfA2aV1AgentProvider
      description: Represents the service provider of an agent.
      type: object
    ModelSettings:
      id: ModelSettings
      description: Model settings contains various configurations for the LLM model.
      type: object
      properties:
        model:
          description: >-
            Optional. The LLM model that the agent should use. If not set, the
            agent will inherit the model from its parent agent.
          type: string
        temperature:
          description: >-
            Optional. If set, this temperature will be used for the LLM model.
            Temperature controls the randomness of the model's responses. Lower
            temperatures produce responses that are more predictable. Higher
            temperatures produce responses that are more creative.
          type: number
          format: double
    Citations:
      id: Citations
      description: Citations associated with the agent response.
      type: object
      properties:
        citedChunks:
          description: List of cited pieces of information.
          type: array
          items:
            $ref: '#/components/schemas/CitationsCitedChunk'
    Event:
      properties:
        event:
          description: Required. The name of the event.
          type: string
      id: Event
      description: Event input.
      type: object
    ClientCertificateSettings:
      properties:
        tlsCertificate:
          description: >-
            Required. The TLS certificate encoded in PEM format. This string
            must include the begin header and end footer lines.
          type: string
        passphrase:
          description: >-
            Optional. The name of the SecretManager secret version resource
            storing the passphrase to decrypt the private key. Should be left
            unset if the private key is not encrypted. Format:
            `projects/{project}/secrets/{secret}/versions/{version}`
          type: string
        privateKey:
          description: >-
            Required. The name of the SecretManager secret version resource
            storing the private key encoded in PEM format. Format:
            `projects/{project}/secrets/{secret}/versions/{version}`
          type: string
      id: ClientCertificateSettings
      description: Settings for custom client certificates.
      type: object
    LfA2aV1MutualTlsSecurityScheme:
      properties:
        description:
          description: An optional description for the security scheme.
          type: string
      id: LfA2aV1MutualTlsSecurityScheme
