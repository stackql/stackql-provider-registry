      type: object
      properties:
        appVersions:
          description: The list of app versions.
          type: array
          items:
            $ref: '#/components/schemas/AppVersion'
        nextPageToken:
          description: >-
            A token that can be sent as ListAppVersionsRequest.page_token to
            retrieve the next page. Absence of this field indicates there are no
            subsequent pages.
          type: string
    ChannelProfileWebWidgetConfigSecuritySettings:
      properties:
        enableRecaptcha:
          description: >-
            Optional. Indicates whether reCAPTCHA verification for the web
            widget is enabled.
          type: boolean
        allowedOrigins:
          description: >-
            Optional. The origins that are allowed to host the web widget. An
            origin is defined by RFC 6454. If empty, all origins are allowed. A
            maximum of 100 origins is allowed. Example: "https://example.com"
          type: array
          items:
            type: string
        enablePublicAccess:
          description: >-
            Optional. Indicates whether public access to the web widget is
            enabled. If `true`, the web widget will be publicly accessible. If
            `false`, the web widget must be integrated with your own
            authentication and authorization system to return valid credentials
            for accessing the CES agent.
          type: boolean
        enableOriginCheck:
          description: >-
            Optional. Indicates whether origin check for the web widget is
            enabled. If `true`, the web widget will check the origin of the
            website that loads the web widget and only allow it to be loaded in
            the same origin or any of the allowed origins.
          type: boolean
      id: ChannelProfileWebWidgetConfigSecuritySettings
      description: Security settings for the web widget.
      type: object
    GuardrailModelSafetySafetySetting:
      id: GuardrailModelSafetySafetySetting
      description: Safety setting.
      type: object
      properties:
        category:
          description: Required. The harm category.
          type: string
          enumDescriptions:
            - The harm category is unspecified.
            - The harm category is hate speech.
            - The harm category is dangerous content.
            - The harm category is harassment.
            - The harm category is sexually explicit content.
          enum:
            - HARM_CATEGORY_UNSPECIFIED
            - HARM_CATEGORY_HATE_SPEECH
            - HARM_CATEGORY_DANGEROUS_CONTENT
            - HARM_CATEGORY_HARASSMENT
            - HARM_CATEGORY_SEXUALLY_EXPLICIT
        threshold:
          enum:
            - HARM_BLOCK_THRESHOLD_UNSPECIFIED
            - BLOCK_LOW_AND_ABOVE
            - BLOCK_MEDIUM_AND_ABOVE
            - BLOCK_ONLY_HIGH
            - BLOCK_NONE
            - 'OFF'
          description: Required. The harm block threshold.
          type: string
          enumDescriptions:
            - Unspecified harm block threshold.
            - Block low threshold and above (i.e. block more).
            - Block medium threshold and above.
            - Block only high threshold (i.e. block less).
            - Block none.
            - Turn off the safety filter.
    BatchDeleteConversationsRequest:
