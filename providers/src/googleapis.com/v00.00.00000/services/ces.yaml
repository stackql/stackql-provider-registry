        conversationLoggingSettings:
          description: >-
            Optional. Settings to describe the conversation logging behaviors
            for the app.
          $ref: '#/components/schemas/ConversationLoggingSettings'
        evaluationAudioRecordingConfig:
          description: >-
            Optional. Configuration for how audio interactions should be
            recorded for the evaluation. By default, audio recording is not
            enabled for evaluation sessions.
          $ref: '#/components/schemas/AudioRecordingConfig'
        audioRecordingConfig:
          description: >-
            Optional. Configuration for how audio interactions should be
            recorded. The audio is subject to redaction as configured in
            RedactionConfig.
          $ref: '#/components/schemas/AudioRecordingConfig'
        bigqueryExportSettings:
          description: >-
            Optional. Configures the BigQuery export behaviors for the app. The
            conversation data is subject to redaction as configured in
            RedactionConfig.
          $ref: '#/components/schemas/BigQueryExportSettings'
        metricAnalysisSettings:
          description: >-
            Optional. Settings to describe the conversation data collection
