            - PASS_THROUGH
          description: >-
            Required. Beavhior for tool calls that don't match any args patterns
            in mocked_tool_calls.
          type: string
          enumDescriptions:
            - Default value. This value is unused.
            - >-
              Throw an error for any tool calls that don't match a mock expected
