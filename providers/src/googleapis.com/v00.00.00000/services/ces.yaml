            description: Properties of the object.
        toolset:
          description: Optional. The toolset to mock.
          $ref: '#/components/schemas/ToolsetTool'
        expectedArgsPattern:
          description: >-
            Required. A pattern to match against the args / inputs of all
            dispatched tool calls. If the tool call inputs match this pattern,
            then mock output will be returned.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        tool:
          description: Optional. Deprecated. Use tool_identifier instead.
          type: string
          deprecated: true
        toolId:
          description: >-
            Optional. The name of the tool to mock. Format:
            `projects/{project}/locations/{location}/apps/{app}/tools/{tool}`
          type: string
      id: MockedToolCall
      description: >-
        A mocked tool call. Expresses the target tool + a pattern to match
        against that tool's args / inputs. If the pattern matches, then the mock
        response will be returned.
      type: object
    PythonCodeCondition:
      properties:
        pythonCode:
          description: Required. The python code to execute.
          type: string
      id: PythonCodeCondition
      description: Python code block to evaluate the condition.
      type: object
    ExportAppResponse:
      properties:
        appUri:
