        user query to continue the interaction with the agent.
      type: object
    Schema:
      properties:
        type:
          enum:
            - TYPE_UNSPECIFIED
            - STRING
            - INTEGER
            - NUMBER
            - BOOLEAN
            - OBJECT
            - ARRAY
          enumDescriptions:
            - Type unspecified.
            - String type.
            - Integer type.
            - Number type.
            - Boolean type.
            - Object type.
            - Array type.
          description: Required. The type of the data.
          type: string
        minimum:
          description: Optional. Minimum value for Type.INTEGER and Type.NUMBER.
          type: number
          format: double
        items:
          description: Optional. Schema of the elements of Type.ARRAY.
          $ref: '#/components/schemas/Schema'
        nullable:
          description: Optional. Indicates if the value may be null.
          type: boolean
        maximum:
          description: Optional. Maximum value for Type.INTEGER and Type.NUMBER.
          type: number
          format: double
        description:
          description: Optional. The description of the data.
          type: string
        default:
          description: Optional. Default value of the data.
          type: any
        ref:
          description: >-
            Optional. Allows indirect references between schema nodes. The value
            should be a valid reference to a child of the root `defs`. For
            example, the following schema defines a reference to a schema node
            named "Pet": ``` type: object properties: pet: ref: #/defs/Pet defs:
            Pet: type: object properties: name: type: string ``` The value of
            the "pet" property is a reference to the schema node named "Pet".
            See details in
            https://json-schema.org/understanding-json-schema/structuring.
          type: string
        minItems:
          description: Optional. Minimum number of the elements for Type.ARRAY.
          type: string
          format: int64
        anyOf:
          description: >-
            Optional. The value should be validated against any (one or more) of
            the subschemas in the list.
          type: array
          items:
            $ref: '#/components/schemas/Schema'
        enum:
          description: >-
            Optional. Possible values of the element of primitive type with enum
            format. Examples: 1. We can define direction as : {type:STRING,
            format:enum, enum:["EAST", NORTH", "SOUTH", "WEST"]} 2. We can
            define apartment number as : {type:INTEGER, format:enum,
            enum:["101", "201", "301"]}
          type: array
          items:
            type: string
        required:
          description: Optional. Required properties of Type.OBJECT.
          type: array
          items:
            type: string
        properties:
          additionalProperties:
            $ref: '#/components/schemas/Schema'
          description: Optional. Properties of Type.OBJECT.
          type: object
        prefixItems:
          description: Optional. Schemas of initial elements of Type.ARRAY.
          type: array
          items:
            $ref: '#/components/schemas/Schema'
        defs:
          description: >-
            Optional. A map of definitions for use by `ref`. Only allowed at the
            root of the schema.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Schema'
        maxItems:
          description: Optional. Maximum number of the elements for Type.ARRAY.
          type: string
          format: int64
        uniqueItems:
          description: >-
            Optional. Indicate the items in the array must be unique. Only
            applies to TYPE.ARRAY.
          type: boolean
        additionalProperties:
          description: >-
            Optional. Can either be a boolean or an object, controls the
            presence of additional properties.
          $ref: '#/components/schemas/Schema'
        title:
          description: Optional. The title of the schema.
          type: string
      id: Schema
      description: Represents a select subset of an OpenAPI 3.0 schema object.
      type: object
    GuardrailContentFilter:
      properties:
        matchType:
          enum:
            - MATCH_TYPE_UNSPECIFIED
            - SIMPLE_STRING_MATCH
            - WORD_BOUNDARY_STRING_MATCH
            - REGEXP_MATCH
          description: Required. Match type for the content filter.
          type: string
          enumDescriptions:
            - Match type is not specified.
            - Content is matched for substrings character by character.
            - >-
              Content only matches if the pattern found in the text is
              surrounded by word delimiters. Banned phrases can also contain
              word delimiters.
            - Content is matched using regular expression syntax.
        disregardDiacritics:
          description: Optional. If true, diacritics are ignored during matching.
          type: boolean
        bannedContentsInAgentResponse:
          description: Optional. List of banned phrases. Applies only to agent responses.
          type: array
          items:
            type: string
        bannedContentsInUserInput:
          description: Optional. List of banned phrases. Applies only to user inputs.
          type: array
          items:
            type: string
        bannedContents:
          description: >-
            Optional. List of banned phrases. Applies to both user inputs and
            agent responses.
          type: array
          items:
            type: string
      id: GuardrailContentFilter
      description: Guardrail that bans certain content from being used in the conversation.
      type: object
    EndUserAuthConfigOauth2AuthCodeConfig:
      properties:
        oauthToken:
          description: >-
            Required. Oauth token parameter name to pass through. Must be in the
            format `$context.variables.`.
          type: string
      id: EndUserAuthConfigOauth2AuthCodeConfig
      description: Oauth 2.0 Authorization Code authentication configuration.
      type: object
    SecuritySettings:
      id: SecuritySettings
      description: Project/Location level security settings for CES.
      type: object
      properties:
        updateTime:
          description: Output only. Last update time of the security settings.
          readOnly: true
          type: string
          format: google-datetime
        createTime:
          description: Output only. Create time of the security settings.
          readOnly: true
          type: string
          format: google-datetime
        endpointControlPolicy:
          description: Optional. Endpoint control related settings.
          $ref: '#/components/schemas/EndpointControlPolicy'
        name:
          description: >-
            Identifier. The unique identifier of the security settings. Format:
            `projects/{project}/locations/{location}/securitySettings`
          type: string
        etag:
          description: Output only. Etag of the security settings.
          readOnly: true
          type: string
    McpTool:
      id: McpTool
      description: >-
        An MCP tool. See
        https://modelcontextprotocol.io/specification/2025-06-18/server/tools
        for more details.
      type: object
      properties:
        description:
          description: Optional. The description of the MCP tool.
          type: string
        customHeaders:
          description: >-
            Optional. The custom headers to send in the request to the MCP
            server. The values must be in the format `$context.variables.` and
            can be set in the session variables. See
            https://docs.cloud.google.com/customer-engagement-ai/conversational-agents/ps/tool/open-api#openapi-injection
            for more details.
          type: object
          additionalProperties:
            type: string
        serviceDirectoryConfig:
          description: >-
            Optional. Service Directory configuration for VPC-SC, used to
            resolve service names within a perimeter.
          $ref: '#/components/schemas/ServiceDirectoryConfig'
        inputSchema:
          description: Optional. The schema of the input arguments of the MCP tool.
          $ref: '#/components/schemas/Schema'
        name:
          description: Required. The name of the MCP tool.
          type: string
        nameOverride:
          description: >-
            Optional. The name override of the MCP tool. This is populated if
            the name was overridden by a Toolset override.
          type: string
        outputSchema:
          description: Optional. The schema of the output arguments of the MCP tool.
          $ref: '#/components/schemas/Schema'
        serverAddress:
          description: >-
            Required. The server address of the MCP server, e.g.,
            "https://example.com/mcp/". If the server is built with the MCP SDK,
            the url should be suffixed with "/mcp/". Only Streamable HTTP
            transport based servers are supported. This is the same as the
            server_address in the McpToolset. See
            https://modelcontextprotocol.io/specification/2025-03-26/basic/transports#streamable-http
            for more details.
          type: string
        state:
          enumDescriptions:
            - Default state.
            - The tool is available and actively offered by the server.
            - >-
              The tool is configured or pinned, but currently not offered by the
              server.
            - >-
              The tool exists on the server, but does not match the version on
              the server.
          readOnly: true
          type: string
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - INACTIVE
            - STALE
          description: >-
            Output only. The dynamic availability state of the tool on the
            external server.
        tlsConfig:
          description: >-
            Optional. The TLS configuration. Includes the custom server
            certificates that the client should trust.
          $ref: '#/components/schemas/TlsConfig'
        apiAuthentication:
          description: >-
            Optional. Authentication information required to execute the tool
            against the MCP server. For bearer token authentication, the token
            applies only to tool execution, not to listing tools. This requires
            that tools can be listed without authentication.
          $ref: '#/components/schemas/ApiAuthentication'
    Changelog:
      id: Changelog
      description: >-
        Changelogs represent a change made to the app or to an resource within
        the app.
      type: object
      properties:
        author:
          description: Output only. Email address of the change author.
          readOnly: true
          type: string
        createTime:
          description: Output only. The time when the change was made.
          readOnly: true
          type: string
          format: google-datetime
        action:
          description: Output only. The action that was performed on the resource.
          readOnly: true
          type: string
        sequenceNumber:
          description: >-
            Output only. The monotonically increasing sequence number of the
            changelog.
          readOnly: true
          type: string
          format: int64
        description:
          description: >-
            Output only. Description of the change. which typically captures the
            changed fields in the resource.
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. The unique identifier of the changelog. Format:
            `projects/{project}/locations/{location}/apps/{app}/changelogs/{changelog}`
          type: string
        displayName:
          description: >-
            Output only. Display name of the change. It typically should be the
            display name of the resource that was changed.
          readOnly: true
          type: string
        newResource:
          additionalProperties:
            type: any
            description: Properties of the object.
          description: Output only. The new resource after the change.
          readOnly: true
          type: object
        originalResource:
          description: Output only. The original resource before the change.
          readOnly: true
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        dependentResources:
          description: Output only. The dependent resources that were changed.
          readOnly: true
          type: array
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object.
        resourceType:
          description: Output only. The type of the resource that was changed.
          readOnly: true
          type: string
        resource:
          description: Output only. The resource that was changed.
          readOnly: true
          type: string
    LoggingSettings:
      properties:
        unredactedAudioRecordingConfig:
          description: >-
