    AgentRemoteDialogflowAgent:
      id: AgentRemoteDialogflowAgent
      description: >-
        The agent which will transfer execution to a remote [Dialogflow
        CX](https://docs.cloud.google.com/dialogflow/cx/docs/concept/agent)
        agent. The Dialogflow agent will process subsequent user queries until
        the session ends or flow ends, and the control is transferred back to
        the parent CES agent.
      type: object
      properties:
        environmentId:
          description: >-
            Optional. The environment ID of the Dialogflow agent to be used for
            the agent execution. If not specified, the draft environment will be
            used.
          type: string
        inputVariableMapping:
          description: >-
            Optional. The mapping of the app variables names to the Dialogflow
            session parameters names to be sent to the Dialogflow agent as
            input.
          type: object
          additionalProperties:
            type: string
        outputVariableMapping:
          description: >-
            Optional. The mapping of the Dialogflow session parameters names to
            the app variables names to be sent back to the CES agent after the
            Dialogflow agent execution ends.
          type: object
          additionalProperties:
            type: string
        languageCodeVariable:
          description: >-
            Optional. The name of the variable that contains the language code
            to be used for the Dialogflow session. If unspecified, the default
            language code of the Dialogflow agent will be used.
          type: string
        flowId:
          description: Optional. The flow ID of the flow in the Dialogflow agent.
          type: string
        agent:
          description: >-
            Required. The
            [Dialogflow](https://docs.cloud.google.com/dialogflow/cx/docs/concept/agent)
            agent resource name. Format:
            `projects/{project}/locations/{location}/agents/{agent}`
          type: string
        respectResponseInterruptionSettings:
          description: >-
            Optional. Indicates whether to respect the message-level
            interruption settings configured in the Dialogflow agent. * If
            false: all response messages from the Dialogflow agent follow the
            app-level barge-in settings. * If true: only response messages with
            [`allow_playback_interruption`](https://docs.cloud.google.com/dialogflow/cx/docs/reference/rpc/google.cloud.dialogflow.cx.v3#text)
            set to true will be interruptable, all other messages follow the
            app-level barge-in settings.
          type: boolean
    LfA2aV1SecurityScheme:
