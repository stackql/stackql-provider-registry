          type: string
        openApiSchema:
          description: Required. The OpenAPI schema in JSON or YAML format.
          type: string
        ignoreUnknownFields:
          description: >-
            Optional. If true, the agent will ignore unknown fields in the API
            response.
          type: boolean
        name:
          description: >-
            Optional. The name of the tool. If not provided, the name of the
            tool will be derived from the OpenAPI schema, from
