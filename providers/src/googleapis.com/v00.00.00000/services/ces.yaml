            Warning messages generated during the import process. If errors
            occur for specific resources, they will not be included in the
            imported app and the error will be mentioned here.
          type: array
          items:
            type: string
      id: ImportAppResponse
      description: Response message for AgentService.ImportApp.
      type: object
    Example:
      properties:
        name:
          description: >-
            Identifier. The unique identifier of the example. Format:
            `projects/{project}/locations/{location}/apps/{app}/examples/{example}`
          type: string
        displayName:
          description: Required. Display name of the example.
          type: string
        description:
          description: Optional. Human-readable description of the example.
          type: string
        messages:
          description: Optional. The collection of messages that make up the conversation.
          type: array
          items:
            $ref: '#/components/schemas/Message'
        createTime:
          description: Output only. Timestamp when the example was created.
          readOnly: true
          type: string
          format: google-datetime
        etag:
          description: >-
            Etag used to ensure the object hasn't changed during a
            read-modify-write operation. If the etag is empty, the update will
            overwrite any concurrent changes.
          type: string
        entryAgent:
          description: >-
            Optional. The agent that initially handles the conversation. If not
            specified, the example represents a conversation that is handled by
            the root agent. Format:
            `projects/{project}/locations/{location}/apps/{app}/agents/{agent}`
          type: string
        invalid:
          description: >-
            Output only. The example may become invalid if referencing resources
            are deleted. Invalid examples will not be used as few-shot examples.
          readOnly: true
          type: boolean
        updateTime:
          description: Output only. Timestamp when the example was last updated.
          readOnly: true
          type: string
          format: google-datetime
      id: Example
      description: >-
        An example represents a sample conversation between the user and the
        agent(s).
      type: object
    AgentInterface:
      properties:
        url:
          description: >-
            Required. The URL where this interface is available. Must be a valid
            absolute HTTPS URL in production. Example:
            "https://api.example.com/a2a/v1", "https://grpc.example.com/a2a"
          type: string
        tenant:
          description: Tenant ID to be used in the request when calling the agent.
          type: string
        protocolVersion:
          description: >-
            Required. The version of the A2A protocol this interface exposes.
            Use the latest supported minor version per major version. Examples:
            "0.3", "1.0"
          type: string
        protocolBinding:
          description: >-
            Required. The protocol binding supported at this URL. This is an
            open form string, to be easily extended for other protocol bindings.
            The core ones officially supported are `JSONRPC`, `GRPC` and
            `HTTP+JSON`.
          type: string
      id: AgentInterface
      description: >-
        Declares a combination of a target URL, transport and protocol version
        for interacting with the agent. This allows agents to expose the same
        functionality over multiple protocol binding mechanisms.
      type: object
    DataStoreToolBoostSpecConditionBoostSpecBoostControlSpec:
      properties:
        fieldName:
          description: >-
            Optional. The name of the field whose value will be used to
            determine the boost amount.
          type: string
        interpolationType:
          enum:
            - INTERPOLATION_TYPE_UNSPECIFIED
            - LINEAR
          description: >-
            Optional. The interpolation type to be applied to connect the
            control points listed below.
          type: string
          enumDescriptions:
            - >-
              Interpolation type is unspecified. In this case, it defaults to
              Linear.
            - Piecewise linear interpolation will be applied.
        controlPoints:
          description: >-
            Optional. The control points used to define the curve. The monotonic
            function (defined through the interpolation_type above) passes
            through the control points listed here.
          type: array
          items:
            $ref: >-
              #/components/schemas/DataStoreToolBoostSpecConditionBoostSpecBoostControlSpecControlPoint
        attributeType:
          enumDescriptions:
            - Unspecified AttributeType.
            - >-
              The value of the numerical field will be used to dynamically
              update the boost amount. In this case, the attribute_value (the x
              value) of the control point will be the actual value of the
              numerical field for which the boost_amount is specified.
            - >-
              For the freshness use case the attribute value will be the
              duration between the current time and the date in the datetime
              field specified. The value must be formatted as an XSD
              `dayTimeDuration` value (a restricted subset of an ISO 8601
              duration value). The pattern for this is: `nDnM]`. E.g. `5D`,
              `3DT12H30M`, `T24H`.
          description: >-
            Optional. The attribute type to be used to determine the boost
            amount. The attribute value can be derived from the field value of
            the specified field_name. In the case of numerical it is
            straightforward i.e. attribute_value = numerical_field_value. In the
            case of freshness however, attribute_value = (time.now() -
            datetime_field_value).
          type: string
          enum:
            - ATTRIBUTE_TYPE_UNSPECIFIED
            - NUMERICAL
            - FRESHNESS
      id: DataStoreToolBoostSpecConditionBoostSpecBoostControlSpec
      description: >-
        Specification for custom ranking based on customer specified attribute
        value. It provides more controls for customized ranking than the simple
        (condition, boost) combination above.
      type: object
    ListChangelogsResponse:
      properties:
        changelogs:
          description: The list of changelogs.
