openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: NetApp API
  description: >-
    Google Cloud NetApp Volumes is a fully-managed, cloud-based data storage
    service that provides advanced data management capabilities and highly
    scalable performance with global availability.
  version: v1
  x-discovery-doc-revision: '20260719'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/netapp/
servers:
  - url: https://netapp.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    EncryptVolumesRequest:
      description: >-
        EncryptVolumesRequest specifies the KMS config to encrypt existing
        volumes.
      id: EncryptVolumesRequest
      properties: {}
      type: object
    ListBackupVaultsResponse:
      type: object
      id: ListBackupVaultsResponse
      properties:
        unreachable:
          items:
            type: string
          type: array
          description: Locations that could not be reached.
        backupVaults:
          description: A list of backupVaults in the project for the specified location.
          items:
            $ref: '#/components/schemas/BackupVault'
          type: array
        nextPageToken:
          type: string
          description: >-
            The token you can use to retrieve the next page of results. Not
            returned if there are no more results in the list.
      description: ListBackupVaultsResponse is the result of ListBackupVaultsRequest.
    CacheConfig:
      description: Configuration of the cache volume.
      id: CacheConfig
      properties:
        cachePrePopulate:
          description: >-
            Optional. Pre-populate cache volume with data from the origin
            volume.
          $ref: '#/components/schemas/CachePrePopulate'
        writebackEnabled:
          type: boolean
          description: >-
            Optional. Flag indicating whether writeback is enabled for the
            FlexCache volume.
        cachePrePopulateState:
          enumDescriptions:
            - Default unspecified state.
            - >-
              State representing when the most recent create or update request
              did not require a prepopulation job.
            - >-
              State representing when the most recent update request requested a
              prepopulation job but it has not yet completed.
            - >-
              State representing when the most recent update request requested a
              prepopulation job and it has completed successfully.
            - >-
              State representing when the most recent update request requested a
              prepopulation job but the prepopulate job failed.
          readOnly: true
          type: string
          enum:
            - CACHE_PRE_POPULATE_STATE_UNSPECIFIED
            - NOT_NEEDED
            - IN_PROGRESS
            - COMPLETE
            - ERROR
          description: >-
            Output only. State of the prepopulation job indicating how the
            prepopulation is progressing.
        cifsChangeNotifyEnabled:
          type: boolean
          description: >-
            Optional. Flag indicating whether a CIFS change notification is
            enabled for the FlexCache volume.
      type: object
    BackupRetentionPolicy:
      description: Retention policy for backups in the backup vault
      id: BackupRetentionPolicy
      properties:
        backupMinimumEnforcedRetentionDays:
          description: >-
            Required. Minimum retention duration in days for backups in the
            backup vault.
          format: int32
          type: integer
        manualBackupImmutable:
          type: boolean
          description: >-
            Optional. Indicates if the manual backups are immutable. At least
            one of daily_backup_immutable, weekly_backup_immutable,
            monthly_backup_immutable and manual_backup_immutable must be true.
        dailyBackupImmutable:
          type: boolean
          description: >-
            Optional. Indicates if the daily backups are immutable. At least one
            of daily_backup_immutable, weekly_backup_immutable,
            monthly_backup_immutable and manual_backup_immutable must be true.
        weeklyBackupImmutable:
          type: boolean
          description: >-
            Optional. Indicates if the weekly backups are immutable. At least
            one of daily_backup_immutable, weekly_backup_immutable,
            monthly_backup_immutable and manual_backup_immutable must be true.
        monthlyBackupImmutable:
          type: boolean
          description: >-
            Optional. Indicates if the monthly backups are immutable. At least
            one of daily_backup_immutable, weekly_backup_immutable,
            monthly_backup_immutable and manual_backup_immutable must be true.
      type: object
    ExecuteOntapPostRequest:
      id: ExecuteOntapPostRequest
      properties:
        body:
          description: >-
            Required. The raw `JSON` body of the request. The body should be in
            the format of the ONTAP resource. For example: ``` { "body": {
            "field1": "value1", "field2": "value2", } } ```
          additionalProperties:
            type: any
            description: Properties of the object.
          type: object
      description: Request message for `ExecuteOntapPost` API.
      type: object
    RevertVolumeRequest:
      id: RevertVolumeRequest
      properties:
        snapshotId:
          description: >-
            Required. The snapshot resource ID, in the format 'my-snapshot',
            where the specified ID is the {snapshot_id} of the fully qualified
            name like
            projects/{project_id}/locations/{location_id}/volumes/{volume_id}/snapshots/{snapshot_id}
          type: string
      description: RevertVolumeRequest reverts the given volume to the specified snapshot.
      type: object
    Snapshot:
      id: Snapshot
      properties:
        labels:
          type: object
          description: Resource labels to represent user provided metadata.
          additionalProperties:
            type: string
        stateDetails:
          type: string
          description: Output only. State details of the storage pool
          readOnly: true
        name:
          type: string
          description: >-
            Identifier. The resource name of the snapshot. Format:
            `projects/{project_id}/locations/{location}/volumes/{volume_id}/snapshots/{snapshot_id}`.
        usedBytes:
          description: Output only. Current storage usage for the snapshot in bytes.
          readOnly: true
          format: double
          type: number
        createTime:
          type: string
          description: Output only. The time when the snapshot was created.
          readOnly: true
          format: google-datetime
        state:
          enumDescriptions:
            - Unspecified Snapshot State
            - Snapshot State is Ready
            - Snapshot State is Creating
            - Snapshot State is Deleting
            - Snapshot State is Updating
            - Snapshot State is Disabled
            - Snapshot State is Error
          readOnly: true
          type: string
          enum:
            - STATE_UNSPECIFIED
            - READY
            - CREATING
            - DELETING
            - UPDATING
            - DISABLED
            - ERROR
          description: Output only. The snapshot state.
        description:
          description: >-
            A description of the snapshot with 2048 characters or less. Requests
            with longer descriptions will be rejected.
          type: string
      description: Snapshot is a point-in-time version of a Volume's content.
      type: object
    LocationMetadata:
      type: object
      description: Metadata for a given google.cloud.location.Location.
      id: LocationMetadata
      properties:
        flexPerformanceTier:
          description: Output only. Indicates the flex performance tier of this location.
          type: string
          enum:
            - FLEX_PERFORMANCE_TIER_UNSPECIFIED
            - LIMITED
          readOnly: true
          enumDescriptions:
            - Unspecified flex performance tier.
            - Flex performance tier is limited.
        supportedServiceLevels:
          type: array
          items:
            enumDescriptions:
              - Unspecified service level.
              - Premium service level.
              - Extreme service level.
              - Standard service level.
              - Flex service level.
            type: string
            enum:
              - SERVICE_LEVEL_UNSPECIFIED
              - PREMIUM
              - EXTREME
              - STANDARD
              - FLEX
          description: Output only. Supported service levels in a location.
          readOnly: true
        hasVcp:
          description: Output only. Indicates if the location has VCP support.
          readOnly: true
          type: boolean
        hasOntapProxy:
          type: boolean
          description: Output only. Indicates if the location has ONTAP Proxy support.
          readOnly: true
        supportedFlexPerformance:
          type: array
          items:
            type: string
            enum:
              - FLEX_PERFORMANCE_UNSPECIFIED
              - FLEX_PERFORMANCE_DEFAULT
              - FLEX_PERFORMANCE_CUSTOM
            enumDescriptions:
              - Unspecified flex performance.
              - Flex Storage Pool with default performance.
              - Flex Storage Pool with custom performance.
          description: Output only. Supported flex performance in a location.
          readOnly: true
    BackupPolicy:
      description: Backup Policy.
      id: BackupPolicy
      properties:
        weeklyBackupLimit:
          type: integer
          description: >-
            Number of weekly backups to keep. Note that the sum of daily, weekly
            and monthly backups should be greater than 1.
          format: int32
        assignedVolumeCount:
          type: integer
          description: >-
            Output only. The total number of volumes assigned by this backup
            policy.
          readOnly: true
          format: int32
        createTime:
          type: string
          description: Output only. The time when the backup policy was created.
          readOnly: true
          format: google-datetime
        description:
          description: Description of the backup policy.
          type: string
        monthlyBackupLimit:
          type: integer
          description: >-
            Number of monthly backups to keep. Note that the sum of daily,
            weekly and monthly backups should be greater than 1.
          format: int32
        enabled:
          type: boolean
          description: >-
            If enabled, make backups automatically according to the schedules.
            This will be applied to all volumes that have this policy attached
            and enforced on volume level. If not specified, default is true.
        labels:
          description: Resource labels to represent user provided metadata.
          additionalProperties:
            type: string
          type: object
        name:
          description: >-
            Identifier. The resource name of the backup policy. Format:
            `projects/{project_id}/locations/{location}/backupPolicies/{backup_policy_id}`.
          type: string
        dailyBackupLimit:
          type: integer
          description: >-
            Number of daily backups to keep. Note that the minimum daily backup
            limit is 2.
          format: int32
        state:
          readOnly: true
          enumDescriptions:
            - State not set.
            - BackupPolicy is being created.
            - BackupPolicy is available for use.
            - BackupPolicy is being deleted.
            - BackupPolicy is not valid and cannot be used.
            - BackupPolicy is being updated.
          description: Output only. The backup policy state.
          type: string
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - DELETING
            - ERROR
            - UPDATING
      type: object
    SwitchActiveReplicaZoneRequest:
      id: SwitchActiveReplicaZoneRequest
      properties: {}
      description: >-
        SwitchActiveReplicaZoneRequest switch the active/replica zone for a
        regional storagePool.
      type: object
    BackupVault:
      description: A NetApp BackupVault.
      id: BackupVault
      properties:
        sourceRegion:
          description: >-
            Optional. Region in which the backup vault is created. Format:
            `projects/{project_id}/locations/{location}`
          type: string
        sourceBackupVault:
          type: string
          description: >-
            Output only. Name of the Backup vault created in source region.
            Format:
            `projects/{project_id}/locations/{location}/backupVaults/{backup_vault_id}`
          readOnly: true
        backupsCryptoKeyVersion:
          description: >-
            Output only. The crypto key version used to encrypt the backup
            vault. Format:
            `projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{crypto_key}/cryptoKeyVersions/{crypto_key_version}`
          readOnly: true
          type: string
        labels:
          description: Resource labels to represent user provided metadata.
          additionalProperties:
            type: string
          type: object
        backupRegion:
          type: string
          description: >-
            Optional. Region where the backups are stored. Format:
            `projects/{project_id}/locations/{location}`
        encryptionState:
          type: string
          enum:
            - ENCRYPTION_STATE_UNSPECIFIED
            - ENCRYPTION_STATE_PENDING
            - ENCRYPTION_STATE_COMPLETED
            - ENCRYPTION_STATE_IN_PROGRESS
            - ENCRYPTION_STATE_FAILED
          description: Output only. Field indicating encryption state of CMEK backups.
          enumDescriptions:
            - Encryption state not set.
            - Encryption state is pending.
            - Encryption is complete.
            - Encryption is in progress.
            - Encryption has failed.
          readOnly: true
        description:
          type: string
          description: Description of the backup vault.
        name:
          description: >-
            Identifier. The resource name of the backup vault. Format:
            `projects/{project_id}/locations/{location}/backupVaults/{backup_vault_id}`.
          type: string
        state:
          enumDescriptions:
            - State not set.
            - BackupVault is being created.
            - BackupVault is available for use.
            - BackupVault is being deleted.
            - BackupVault is not valid and cannot be used.
            - BackupVault is being updated.
          readOnly: true
          type: string
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - DELETING
            - ERROR
            - UPDATING
          description: Output only. The backup vault state.
        kmsConfig:
          type: string
          description: >-
            Optional. Specifies the Key Management System (KMS) configuration to
            be used for backup encryption. Format:
            `projects/{project}/locations/{location}/kmsConfigs/{kms_config}`
        createTime:
          description: Output only. Create time of the backup vault.
          readOnly: true
          format: google-datetime
          type: string
        destinationBackupVault:
          type: string
          description: >-
            Output only. Name of the Backup vault created in backup region.
            Format:
            `projects/{project_id}/locations/{location}/backupVaults/{backup_vault_id}`
          readOnly: true
        backupRetentionPolicy:
          description: Optional. Backup retention policy defining the retention of backups.
          $ref: '#/components/schemas/BackupRetentionPolicy'
        backupVaultType:
          enumDescriptions:
            - BackupVault type not set.
            - BackupVault type is IN_REGION.
            - BackupVault type is CROSS_REGION.
          type: string
          enum:
            - BACKUP_VAULT_TYPE_UNSPECIFIED
            - IN_REGION
            - CROSS_REGION
          description: Optional. Type of backup vault to be created. Default is IN_REGION.
      type: object
    VerifyKmsConfigResponse:
      description: >-
        VerifyKmsConfigResponse contains the information if the config is
        correctly and error message.
      id: VerifyKmsConfigResponse
      properties:
        instructions:
          description: >-
            Output only. Instructions for the customers to provide the access to
            the encryption key.
          readOnly: true
          type: string
        healthError:
          description: Output only. Error message if config is not healthy.
          readOnly: true
          type: string
        healthy:
          description: >-
            Output only. If the customer key configured correctly to the encrypt
            volume.
          readOnly: true
          type: boolean
      type: object
    Operation:
      id: Operation
      properties:
        name:
          type: string
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
        metadata:
          type: object
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        done:
          type: boolean
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
        response:
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          type: object
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      type: object
    StartSplitRequest:
      id: StartSplitRequest
      properties: {}
      description: Request message for splitting a volume.
      type: object
    DestinationVolumeParameters:
      type: object
      id: DestinationVolumeParameters
      properties:
        volumeId:
          type: string
          description: >-
            Desired destination volume resource id. If not specified, source
            volume's resource id will be used. This value must start with a
            lowercase letter followed by up to 62 lowercase letters, numbers, or
            hyphens, and cannot end with a hyphen.
        shareName:
          type: string
          description: >-
            Destination volume's share name. If not specified, source volume's
            share name will be used.
        storagePool:
          type: string
          description: Required. Existing destination StoragePool name.
        description:
          description: Description for the destination volume.
          type: string
        tieringPolicy:
          description: Optional. Tiering policy for the volume.
          $ref: '#/components/schemas/TieringPolicy'
      description: >-
        DestinationVolumeParameters specify input parameters used for creating
        destination volume.
    RestoreVolumeRequest:
      type: object
      id: RestoreVolumeRequest
      properties:
        backupSource:
          description: The backup source of the restore operation.
          $ref: '#/components/schemas/BackupSource'
        ontapVolumeTarget:
          description: The ONTAP volume target of the restore operation.
          $ref: '#/components/schemas/OntapVolumeTarget'
      description: Request message for `RestoreVolume` API.
    ListActiveDirectoriesResponse:
      id: ListActiveDirectoriesResponse
      properties:
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
        activeDirectories:
          type: array
          items:
            $ref: '#/components/schemas/ActiveDirectory'
          description: The list of active directories.
        unreachable:
          description: Locations that could not be reached.
          type: array
          items:
            type: string
      description: >-
        ListActiveDirectoriesResponse contains all the active directories
        requested.
      type: object
    ExecuteOntapPostResponse:
      id: ExecuteOntapPostResponse
      properties:
        body:
          type: object
          description: The raw `JSON` body of the response.
          additionalProperties:
            type: any
            description: Properties of the object.
      description: Response message for `ExecuteOntapPost` API.
      type: object
    HostGroup:
      type: object
      description: >-
        Host group is a collection of hosts that can be used for accessing a
        Block Volume.
      id: HostGroup
      properties:
        hosts:
          description: Required. The list of hosts associated with the host group.
          items:
            type: string
          type: array
        labels:
          description: Optional. Labels of the host group.
          additionalProperties:
            type: string
          type: object
        name:
          description: >-
            Identifier. The resource name of the host group. Format:
            `projects/{project_number}/locations/{location_id}/hostGroups/{host_group_id}`.
          type: string
        type:
          description: Required. Type of the host group.
          type: string
          enum:
            - TYPE_UNSPECIFIED
            - ISCSI_INITIATOR
          enumDescriptions:
            - Unspecified type for host group.
            - iSCSI initiator host group.
        osType:
          enumDescriptions:
            - Unspecified OS Type
            - OS Type is Linux
            - OS Type is Windows
            - OS Type is VMware ESXi
          type: string
          enum:
            - OS_TYPE_UNSPECIFIED
            - LINUX
            - WINDOWS
            - ESXI
          description: >-
            Required. The OS type of the host group. It indicates the type of
            operating system used by all of the hosts in the HostGroup. All
            hosts in a HostGroup must be of the same OS type. This can be set
            only when creating a HostGroup.
        createTime:
          type: string
          description: Output only. Create time of the host group.
          readOnly: true
          format: google-datetime
        state:
          type: string
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - UPDATING
            - DELETING
            - DISABLED
          description: Output only. State of the host group.
          enumDescriptions:
            - Unspecified state for host group.
            - Host group is creating.
            - Host group is ready.
            - Host group is updating.
            - Host group is deleting.
            - Host group is disabled.
          readOnly: true
        description:
          description: Optional. Description of the host group.
          type: string
    ListBackupConfigsResponse:
      type: object
      description: Message for response to listing BackupConfigs in an ONTAP StoragePool.
      id: ListBackupConfigsResponse
      properties:
        unreachable:
          items:
            type: string
          type: array
          description: Unordered list. Locations that could not be reached.
        volumeBackupConfigs:
          description: A list of backup configurations for volumes in the pool.
          items:
            $ref: '#/components/schemas/VolumeBackupConfig'
          type: array
        nextPageToken:
          type: string
          description: >-
            The token you can use to retrieve the next page of results. Not
            returned if there are no more results in the list.
    ListHostGroupsResponse:
      type: object
      description: ListHostGroupsResponse is the response to a ListHostGroupsRequest.
      id: ListHostGroupsResponse
      properties:
        hostGroups:
          type: array
          items:
            $ref: '#/components/schemas/HostGroup'
          description: The list of host groups.
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
        unreachable:
          type: array
          items:
            type: string
          description: Locations that could not be reached.
    ExecuteOntapDeleteResponse:
      type: object
      description: Response message for `ExecuteOntapDelete` API.
      id: ExecuteOntapDeleteResponse
      properties:
        body:
          type: object
          description: The raw `JSON` body of the response.
          additionalProperties:
            type: any
            description: Properties of the object.
    QuotaRule:
      description: >-
        QuotaRule specifies the maximum disk space a user or group can use
        within a volume. They can be used for creating default and individual
        quota rules.
      id: QuotaRule
      properties:
        labels:
          type: object
          description: Optional. Labels of the quota rule
          additionalProperties:
            type: string
        state:
          enumDescriptions:
            - Unspecified state for quota rule
            - Quota rule is creating
            - Quota rule is updating
            - Quota rule is deleting
            - Quota rule is ready
            - Quota rule is in error state.
          readOnly: true
          type: string
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - UPDATING
            - DELETING
            - READY
            - ERROR
          description: Output only. State of the quota rule
        name:
          description: >-
            Identifier. The resource name of the quota rule. Format:
            `projects/{project_number}/locations/{location_id}/volumes/volumes/{volume_id}/quotaRules/{quota_rule_id}`.
          type: string
        stateDetails:
          description: Output only. State details of the quota rule
          readOnly: true
          type: string
        target:
          description: >-
            Optional. The quota rule applies to the specified user or group,
            identified by a Unix UID/GID, Windows SID, or null for default.
          type: string
        description:
          type: string
          description: Optional. Description of the quota rule
        createTime:
          description: Output only. Create time of the quota rule
          readOnly: true
          format: google-datetime
          type: string
        type:
          enumDescriptions:
            - Unspecified type for quota rule
            - Individual user quota rule
            - Individual group quota rule
            - Default user quota rule
            - Default group quota rule
          type: string
          enum:
            - TYPE_UNSPECIFIED
            - INDIVIDUAL_USER_QUOTA
            - INDIVIDUAL_GROUP_QUOTA
            - DEFAULT_USER_QUOTA
            - DEFAULT_GROUP_QUOTA
          description: Required. The type of quota rule.
        diskLimitMib:
          type: integer
          description: Required. The maximum allowed disk space in MiB.
          format: int32
      type: object
    HourlySchedule:
      type: object
      description: Make a snapshot every hour e.g. at 04:00, 05:00, 06:00.
      id: HourlySchedule
      properties:
        snapshotsToKeep:
          type: number
          description: The maximum number of Snapshots to keep for the hourly schedule
          format: double
        minute:
          description: >-
            Set the minute of the hour to start the snapshot (0-59), defaults to
            the top of the hour (0).
          format: double
          type: number
    ValidateDirectoryServiceRequest:
      id: ValidateDirectoryServiceRequest
      properties:
        directoryServiceType:
          description: Type of directory service policy attached to the storage pool.
          type: string
          enum:
            - DIRECTORY_SERVICE_TYPE_UNSPECIFIED
            - ACTIVE_DIRECTORY
          enumDescriptions:
            - Directory service type is not specified.
            - Active directory policy attached to the storage pool.
      description: >-
        ValidateDirectoryServiceRequest validates the directory service policy
        attached to the storage pool.
      type: object
    ExportPolicy:
      type: object
      id: ExportPolicy
      properties:
        rules:
          items:
            $ref: '#/components/schemas/SimpleExportPolicyRule'
          type: array
          description: Required. List of export policy rules
      description: Defines the export policy for the volume.
    SimpleExportPolicyRule:
      type: object
      id: SimpleExportPolicyRule
      properties:
        squashMode:
          type: string
          enum:
            - SQUASH_MODE_UNSPECIFIED
            - NO_ROOT_SQUASH
            - ROOT_SQUASH
            - ALL_SQUASH
          enumDescriptions:
            - Defaults to `NO_ROOT_SQUASH`.
            - >-
              The root user (UID 0) retains full access. Other users are
              unaffected.
            - >-
              The root user (UID 0) is squashed to anonymous user ID. Other
              users are unaffected.
            - All users are squashed to anonymous user ID.
          description: >-
            Optional. Defines how user identity squashing is applied for this
            export rule. This field is the preferred way to configure squashing
            behavior and takes precedence over `has_root_access` if both are
            provided.
        kerberos5iReadOnly:
          type: boolean
          description: >-
            If enabled (true) the rule defines a read only access for clients
            matching the 'allowedClients' specification. It enables nfs clients
            to mount using 'integrity' kerberos security mode.
        kerberos5ReadWrite:
          type: boolean
          description: >-
            If enabled (true) the rule defines read and write access for clients
            matching the 'allowedClients' specification. It enables nfs clients
            to mount using 'authentication' kerberos security mode. The
            'kerberos5ReadOnly' value be ignored if this is enabled.
        kerberos5ReadOnly:
          type: boolean
          description: >-
            If enabled (true) the rule defines a read only access for clients
            matching the 'allowedClients' specification. It enables nfs clients
            to mount using 'authentication' kerberos security mode.
        accessType:
          description: Access type (ReadWrite, ReadOnly, None)
          enumDescriptions:
            - Unspecified Access Type
            - Read Only
            - Read Write
            - None
          type: string
          enum:
            - ACCESS_TYPE_UNSPECIFIED
            - READ_ONLY
            - READ_WRITE
            - READ_NONE
        allowedClients:
          description: Comma separated list of allowed clients IP addresses
          type: string
        hasRootAccess:
          description: Whether Unix root access will be granted.
          type: string
        nfsv3:
          description: NFS V3 protocol.
          type: boolean
        kerberos5pReadOnly:
          type: boolean
          description: >-
            If enabled (true) the rule defines a read only access for clients
            matching the 'allowedClients' specification. It enables nfs clients
            to mount using 'privacy' kerberos security mode.
        nfsv4:
          type: boolean
          description: NFS V4 protocol.
        kerberos5pReadWrite:
          type: boolean
          description: >-
            If enabled (true) the rule defines read and write access for clients
            matching the 'allowedClients' specification. It enables nfs clients
            to mount using 'privacy' kerberos security mode. The
            'kerberos5pReadOnly' value be ignored if this is enabled.
        kerberos5iReadWrite:
          type: boolean
          description: >-
            If enabled (true) the rule defines read and write access for clients
            matching the 'allowedClients' specification. It enables nfs clients
            to mount using 'integrity' kerberos security mode. The
            'kerberos5iReadOnly' value be ignored if this is enabled.
        anonUid:
          type: string
          description: >-
            Optional. An integer representing the anonymous user ID. Range is 0
            to `4294967295`. Required when `squash_mode` is `ROOT_SQUASH` or
            `ALL_SQUASH`.
          format: int64
      description: An export policy rule describing various export options.
    DailySchedule:
      description: Make a snapshot every day e.g. at 04:00, 05:20, 23:50
      id: DailySchedule
      properties:
        minute:
          description: >-
            Set the minute of the hour to start the snapshot (0-59), defaults to
            the top of the hour (0).
          format: double
          type: number
        snapshotsToKeep:
          type: number
          description: The maximum number of Snapshots to keep for the hourly schedule
          format: double
        hour:
          type: number
          description: Set the hour to start the snapshot (0-23), defaults to midnight (0).
          format: double
      type: object
    ExecuteOntapPatchRequest:
      id: ExecuteOntapPatchRequest
      properties:
        body:
          type: object
