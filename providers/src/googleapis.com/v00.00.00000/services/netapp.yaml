components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    ActiveDirectory:
      description: >-
        ActiveDirectory is the public representation of the active directory
        config.
      id: ActiveDirectory
      properties:
        administrators:
          description: Optional. Users to be added to the Built-in Admininstrators group.
          items:
            type: string
          type: array
        aesEncryption:
          description: If enabled, AES encryption will be enabled for SMB communication.
          type: boolean
        backupOperators:
          description: >-
            Optional. Users to be added to the Built-in Backup Operator active
            directory group.
          items:
            type: string
          type: array
        createTime:
          description: Output only. Create time of the active directory.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Description of the active directory.
          type: string
        dns:
          description: >-
            Required. Comma separated list of DNS server IP addresses for the
            Active Directory domain.
          type: string
        domain:
          description: Required. Name of the Active Directory domain
          type: string
        encryptDcConnections:
          description: >-
            If enabled, traffic between the SMB server to Domain Controller (DC)
            will be encrypted.
          type: boolean
        kdcHostname:
          description: >-
            Name of the active directory machine. This optional parameter is
            used only while creating kerberos volume
          type: string
        kdcIp:
          description: KDC server IP address for the active directory machine.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Labels for the active directory.
          type: object
        ldapSigning:
          description: Specifies whether or not the LDAP traffic needs to be signed.
          type: boolean
        name:
          description: >-
            Identifier. The resource name of the active directory. Format:
            `projects/{project_number}/locations/{location_id}/activeDirectories/{active_directory_id}`.
          type: string
        netBiosPrefix:
          description: Required. NetBIOSPrefix is used as a prefix for SMB server name.
          type: string
        nfsUsersWithLdap:
          description: >-
            If enabled, will allow access to local users and LDAP users. If
            access is needed for only LDAP users, it has to be disabled.
          type: boolean
        organizationalUnit:
          description: >-
            The Organizational Unit (OU) within the Windows Active Directory the
            user belongs to.
          type: string
        password:
          description: Required. Password of the Active Directory domain administrator.
          type: string
        securityOperators:
          description: Optional. Domain users to be given the SeSecurityPrivilege.
          items:
            type: string
          type: array
        site:
          description: >-
            The Active Directory site the service will limit Domain Controller
            discovery too.
          type: string
        state:
          description: Output only. The state of the AD.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - UPDATING
            - IN_USE
            - DELETING
            - ERROR
            - DIAGNOSING
          enumDescriptions:
            - Unspecified Active Directory State
            - Active Directory State is Creating
            - Active Directory State is Ready
            - Active Directory State is Updating
            - Active Directory State is In use
            - Active Directory State is Deleting
            - Active Directory State is Error
            - Active Directory State is Diagnosing.
          readOnly: true
          type: string
        stateDetails:
          description: Output only. The state details of the Active Directory.
          readOnly: true
          type: string
        username:
          description: Required. Username of the Active Directory domain administrator.
          type: string
      type: object
    Backup:
      description: A NetApp Backup.
      id: Backup
      properties:
        backupRegion:
          description: >-
            Output only. Region in which backup is stored. Format:
            `projects/{project_id}/locations/{location}`
          readOnly: true
          type: string
        backupType:
          description: >-
            Output only. Type of backup, manually created or created by a backup
            policy.
          enum:
            - TYPE_UNSPECIFIED
            - MANUAL
            - SCHEDULED
          enumDescriptions:
            - Unspecified backup type.
            - Manual backup type.
            - Scheduled backup type.
          readOnly: true
          type: string
        chainStorageBytes:
          description: >-
            Output only. Total size of all backups in a chain in bytes =
            baseline backup size + sum(incremental backup size)
          format: int64
          readOnly: true
          type: string
        createTime:
          description: Output only. The time when the backup was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            A description of the backup with 2048 characters or less. Requests
            with longer descriptions will be rejected.
          type: string
        enforcedRetentionEndTime:
          description: Output only. The time until which the backup is not deletable.
          format: google-datetime
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: Resource labels to represent user provided metadata.
          type: object
        name:
          description: >-
            Identifier. The resource name of the backup. Format:
            `projects/{project_id}/locations/{location}/backupVaults/{backup_vault_id}/backups/{backup_id}`.
          type: string
        ontapSource:
          $ref: '#/components/schemas/OntapSource'
          description: >-
            Optional. Represents source details for ONTAP backups. Either
            source_volume or ontap_source should be provided.
        satisfiesPzi:
          description: Output only. Reserved for future use
          readOnly: true
          type: boolean
        satisfiesPzs:
          description: Output only. Reserved for future use
          readOnly: true
          type: boolean
        sourceSnapshot:
          description: >-
            If specified, backup will be created from the given snapshot. If not
            specified, there will be a new snapshot taken to initiate the backup
            creation. Format:
            `projects/{project_id}/locations/{location}/volumes/{volume_id}/snapshots/{snapshot_id}`
          type: string
        sourceVolume:
          description: >-
            The resource name of the volume that this backup belongs to. You
            must provide either `source_volume` or `ontap_source`. Format:
            `projects/{project_id}/locations/{location}/volumes/{volume_id}`
          type: string
        state:
          description: Output only. The backup state.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - UPLOADING
            - READY
            - DELETING
            - ERROR
            - UPDATING
          enumDescriptions:
            - State not set.
            - >-
              Backup is being created. While in this state, the snapshot for the
              backup point-in-time may not have been created yet, and so the
              point-in-time may not have been fixed.
            - >-
              Backup is being uploaded. While in this state, none of the writes
              to the volume will be included in the backup.
            - Backup is available for use.
            - Backup is being deleted.
            - >-
              Backup is not valid and cannot be used for creating new volumes or
              restoring existing volumes.
            - Backup is being updated.
          readOnly: true
          type: string
        volumeRegion:
          description: >-
            Output only. Region of the volume from which the backup was created.
            Format: `projects/{project_id}/locations/{location}`
          readOnly: true
          type: string
        volumeUsageBytes:
          description: >-
            Output only. Size of the file system when the backup was created.
            When creating a new volume from the backup, the volume capacity will
            have to be at least as big.
          format: int64
          readOnly: true
          type: string
      type: object
    BackupConfig:
      description: BackupConfig contains backup related config on a volume.
      id: BackupConfig
      properties:
        backupChainBytes:
          description: >-
            Output only. Total size of all backups in a chain in bytes =
            baseline backup size + sum(incremental backup size).
          format: int64
          readOnly: true
          type: string
        backupPolicies:
          description: >-
            Optional. When specified, schedule backups will be created based on
            the policy configuration.
          items:
            type: string
          type: array
        backupVault:
          description: >-
            Optional. Name of backup vault. Format:
            projects/{project_id}/locations/{location}/backupVaults/{backup_vault_id}
          type: string
        scheduledBackupEnabled:
          description: >-
            Optional. When set to true, scheduled backup is enabled on the
            volume. This field should be nil when there's no backup policy
            attached.
          type: boolean
      type: object
    BackupPolicy:
      description: Backup Policy.
      id: BackupPolicy
      properties:
        assignedVolumeCount:
          description: >-
            Output only. The total number of volumes assigned by this backup
            policy.
          format: int32
          readOnly: true
          type: integer
        createTime:
          description: Output only. The time when the backup policy was created.
          format: google-datetime
          readOnly: true
          type: string
        dailyBackupLimit:
          description: >-
            Number of daily backups to keep. Note that the minimum daily backup
            limit is 2.
          format: int32
          type: integer
        description:
          description: Description of the backup policy.
          type: string
        enabled:
          description: >-
            If enabled, make backups automatically according to the schedules.
            This will be applied to all volumes that have this policy attached
            and enforced on volume level. If not specified, default is true.
          type: boolean
        labels:
          additionalProperties:
            type: string
          description: Resource labels to represent user provided metadata.
          type: object
        monthlyBackupLimit:
          description: >-
            Number of monthly backups to keep. Note that the sum of daily,
            weekly and monthly backups should be greater than 1.
          format: int32
          type: integer
        name:
          description: >-
            Identifier. The resource name of the backup policy. Format:
            `projects/{project_id}/locations/{location}/backupPolicies/{backup_policy_id}`.
          type: string
        state:
          description: Output only. The backup policy state.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - DELETING
            - ERROR
            - UPDATING
          enumDescriptions:
            - State not set.
            - BackupPolicy is being created.
            - BackupPolicy is available for use.
            - BackupPolicy is being deleted.
            - BackupPolicy is not valid and cannot be used.
            - BackupPolicy is being updated.
          readOnly: true
          type: string
        weeklyBackupLimit:
          description: >-
            Number of weekly backups to keep. Note that the sum of daily, weekly
            and monthly backups should be greater than 1.
          format: int32
          type: integer
      type: object
    BackupRetentionPolicy:
      description: Retention policy for backups in the backup vault
      id: BackupRetentionPolicy
      properties:
        backupMinimumEnforcedRetentionDays:
          description: >-
            Required. Minimum retention duration in days for backups in the
            backup vault.
          format: int32
          type: integer
        dailyBackupImmutable:
          description: >-
            Optional. Indicates if the daily backups are immutable. At least one
            of daily_backup_immutable, weekly_backup_immutable,
            monthly_backup_immutable and manual_backup_immutable must be true.
          type: boolean
        manualBackupImmutable:
          description: >-
            Optional. Indicates if the manual backups are immutable. At least
            one of daily_backup_immutable, weekly_backup_immutable,
            monthly_backup_immutable and manual_backup_immutable must be true.
          type: boolean
        monthlyBackupImmutable:
          description: >-
            Optional. Indicates if the monthly backups are immutable. At least
            one of daily_backup_immutable, weekly_backup_immutable,
            monthly_backup_immutable and manual_backup_immutable must be true.
          type: boolean
        weeklyBackupImmutable:
          description: >-
            Optional. Indicates if the weekly backups are immutable. At least
            one of daily_backup_immutable, weekly_backup_immutable,
            monthly_backup_immutable and manual_backup_immutable must be true.
          type: boolean
      type: object
    BackupSource:
      description: Represents the backup source of the restore operation.
      id: BackupSource
      properties:
        backup:
          description: Required. The backup resource name.
          type: string
        fileList:
          description: >-
            Optional. List of files to be restored in the form of their absolute
            path as in source volume. If provided, only these files will be
            restored. If not provided, the entire backup will be restored (Full
            Backup Restore)
          items:
            type: string
          type: array
      type: object
    BackupVault:
      description: A NetApp BackupVault.
      id: BackupVault
      properties:
        backupRegion:
          description: >-
            Optional. Region where the backups are stored. Format:
            `projects/{project_id}/locations/{location}`
          type: string
        backupRetentionPolicy:
          $ref: '#/components/schemas/BackupRetentionPolicy'
          description: Optional. Backup retention policy defining the retention of backups.
        backupVaultType:
          description: Optional. Type of backup vault to be created. Default is IN_REGION.
          enum:
            - BACKUP_VAULT_TYPE_UNSPECIFIED
            - IN_REGION
            - CROSS_REGION
          enumDescriptions:
            - BackupVault type not set.
            - BackupVault type is IN_REGION.
            - BackupVault type is CROSS_REGION.
          type: string
        backupsCryptoKeyVersion:
          description: >-
            Output only. The crypto key version used to encrypt the backup
            vault. Format:
            `projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{crypto_key}/cryptoKeyVersions/{crypto_key_version}`
          readOnly: true
          type: string
        createTime:
          description: Output only. Create time of the backup vault.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Description of the backup vault.
          type: string
        destinationBackupVault:
          description: >-
            Output only. Name of the Backup vault created in backup region.
            Format:
            `projects/{project_id}/locations/{location}/backupVaults/{backup_vault_id}`
          readOnly: true
          type: string
        encryptionState:
          description: Output only. Field indicating encryption state of CMEK backups.
          enum:
            - ENCRYPTION_STATE_UNSPECIFIED
            - ENCRYPTION_STATE_PENDING
            - ENCRYPTION_STATE_COMPLETED
            - ENCRYPTION_STATE_IN_PROGRESS
            - ENCRYPTION_STATE_FAILED
          enumDescriptions:
            - Encryption state not set.
            - Encryption state is pending.
            - Encryption is complete.
            - Encryption is in progress.
            - Encryption has failed.
          readOnly: true
          type: string
        kmsConfig:
          description: >-
            Optional. Specifies the Key Management System (KMS) configuration to
            be used for backup encryption. Format:
            `projects/{project}/locations/{location}/kmsConfigs/{kms_config}`
          type: string
        labels:
          additionalProperties:
            type: string
          description: Resource labels to represent user provided metadata.
          type: object
        name:
          description: >-
            Identifier. The resource name of the backup vault. Format:
            `projects/{project_id}/locations/{location}/backupVaults/{backup_vault_id}`.
          type: string
        sourceBackupVault:
          description: >-
            Output only. Name of the Backup vault created in source region.
            Format:
            `projects/{project_id}/locations/{location}/backupVaults/{backup_vault_id}`
          readOnly: true
          type: string
        sourceRegion:
          description: >-
            Optional. Region in which the backup vault is created. Format:
            `projects/{project_id}/locations/{location}`
          type: string
        state:
          description: Output only. The backup vault state.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - DELETING
            - ERROR
            - UPDATING
          enumDescriptions:
            - State not set.
            - BackupVault is being created.
            - BackupVault is available for use.
            - BackupVault is being deleted.
            - BackupVault is not valid and cannot be used.
            - BackupVault is being updated.
          readOnly: true
          type: string
      type: object
    BlockDevice:
      description: >-
        Block device represents the device(s) which are stored in the block
        volume.
      id: BlockDevice
      properties:
        hostGroups:
          description: >-
            Optional. A list of host groups that identify hosts that can mount
            the block volume. Format:
            `projects/{project_id}/locations/{location}/hostGroups/{host_group_id}`
            This field can be updated after the block device is created.
          items:
            type: string
          type: array
        identifier:
          description: >-
            Output only. Device identifier of the block volume. This represents
            `lun_serial_number` for iSCSI volumes.
          readOnly: true
          type: string
        name:
          description: >-
            Optional. User-defined name for the block device, unique within the
            volume. In case no user input is provided, name will be
            auto-generated in the backend. The name must meet the following
            requirements: * Be between 1 and 255 characters long. * Contain only
            uppercase or lowercase letters (A-Z, a-z), numbers (0-9), and the
            following special characters: "-", "_", "}", "{", ".". * Spaces are
            not allowed.
          type: string
        osType:
          description: >-
            Required. Immutable. The OS type of the volume. This field can't be
            changed after the block device is created.
          enum:
            - OS_TYPE_UNSPECIFIED
            - LINUX
            - WINDOWS
            - ESXI
          enumDescriptions:
            - Unspecified OS Type
            - OS Type is Linux
            - OS Type is Windows
            - OS Type is VMware ESXi
          type: string
        sizeGib:
          description: >-
            Optional. The size of the block device in GiB. Any value provided
            for the `size_gib` field during volume creation is ignored. The
            block device's size is system-managed and will be set to match the
            parent Volume's `capacity_gib`.
          format: int64
          type: string
      type: object
    CacheConfig:
      description: Configuration of the cache volume.
      id: CacheConfig
      properties:
        cachePrePopulate:
          $ref: '#/components/schemas/CachePrePopulate'
          description: >-
            Optional. Pre-populate cache volume with data from the origin
            volume.
        cachePrePopulateState:
          description: >-
            Output only. State of the prepopulation job indicating how the
            prepopulation is progressing.
          enum:
            - CACHE_PRE_POPULATE_STATE_UNSPECIFIED
            - NOT_NEEDED
            - IN_PROGRESS
            - COMPLETE
            - ERROR
          enumDescriptions:
            - Default unspecified state.
            - >-
              State representing when the most recent create or update request
              did not require a prepopulation job.
            - >-
              State representing when the most recent update request requested a
              prepopulation job but it has not yet completed.
            - >-
              State representing when the most recent update request requested a
              prepopulation job and it has completed successfully.
            - >-
              State representing when the most recent update request requested a
              prepopulation job but the prepopulate job failed.
          readOnly: true
          type: string
        cifsChangeNotifyEnabled:
          description: >-
            Optional. Flag indicating whether a CIFS change notification is
            enabled for the FlexCache volume.
          type: boolean
        writebackEnabled:
          description: >-
            Optional. Flag indicating whether writeback is enabled for the
            FlexCache volume.
          type: boolean
      type: object
    CacheParameters:
      description: Cache Parameters for the volume.
      id: CacheParameters
      properties:
        cacheConfig:
          $ref: '#/components/schemas/CacheConfig'
          description: Optional. Configuration of the cache volume.
        cacheState:
          description: >-
            Output only. State of the cache volume indicating the peering
            status.
          enum:
            - CACHE_STATE_UNSPECIFIED
            - PENDING_CLUSTER_PEERING
            - PENDING_SVM_PEERING
            - PEERED
            - ERROR
          enumDescriptions:
            - Default unspecified state.
            - State indicating waiting for cluster peering to be established.
            - State indicating waiting for SVM peering to be established.
            - >-
              State indicating successful establishment of peering with origin
              volumes's ONTAP cluster.
            - >-
              Terminal state wherein peering with origin volume's ONTAP cluster
              has failed.
          readOnly: true
          type: string
        command:
          description: >-
            Output only. Copy-paste-able commands to be used on user's ONTAP to
            accept peering requests.
          readOnly: true
          type: string
        enableGlobalFileLock:
          description: >-
            Optional. Indicates whether the cache volume has global file lock
            enabled.
          type: boolean
        passphrase:
          description: >-
            Output only. Temporary passphrase generated to accept cluster
            peering command.
          readOnly: true
          type: string
        peerClusterName:
          description: Required. Name of the origin volume's ONTAP cluster.
          type: string
        peerIpAddresses:
          description: >-
            Required. List of IC LIF addresses of the origin volume's ONTAP
            cluster.
          items:
            type: string
          type: array
        peerSvmName:
          description: Required. Name of the origin volume's SVM.
          type: string
        peerVolumeName:
          description: Required. Name of the origin volume for the cache volume.
          type: string
        peeringCommandExpiryTime:
          description: >-
            Optional. Expiration time for the peering command to be executed on
            user's ONTAP.
          format: google-datetime
          type: string
        stateDetails:
          description: Output only. Detailed description of the current cache state.
          readOnly: true
          type: string
      type: object
    CachePrePopulate:
      description: Pre-populate cache volume with data from the origin volume.
      id: CachePrePopulate
      properties:
        excludePathList:
          description: >-
            Optional. List of directory-paths to be excluded for pre-population
            for the FlexCache volume.
          items:
            type: string
          type: array
        pathList:
          description: >-
            Optional. List of directory-paths to be pre-populated for the
            FlexCache volume.
          items:
            type: string
          type: array
        recursion:
          description: >-
            Optional. Flag indicating whether the directories listed with the
            `path_list` need to be recursively pre-populated.
          type: boolean
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    CloneDetails:
      description: Details about a clone volume.
      id: CloneDetails
      properties:
        sharedSpaceGib:
          description: >-
            Output only. Shared space in GiB. Determined at volume creation time
            based on size of source snapshot.
          format: int64
          readOnly: true
          type: string
        sourceSnapshot:
          description: >-
            Output only. Specifies the full resource name of the source snapshot
            from which this volume was cloned. Format:
            projects/{project}/locations/{location}/volumes/{volume}/snapshots/{snapshot}
          readOnly: true
          type: string
        sourceVolume:
          description: >-
            Output only. Full name of the source volume resource. Format:
            projects/{project}/locations/{location}/volumes/{volume}
          readOnly: true
          type: string
        splitState:
          description: Output only. The current state of the clone split operation.
          enum:
            - SPLIT_STATE_UNSPECIFIED
            - SPLIT_STATE_NOT_SPLITTING
            - SPLIT_STATE_IN_PROGRESS
            - SPLIT_STATE_FAILED
          enumDescriptions:
            - State is not specified.
            - The volume is a thin clone, sharing blocks with its source.
            - A split operation is currently active and in progress.
            - The attempt to split the volume failed.
          readOnly: true
          type: string
      type: object
    DailySchedule:
      description: Make a snapshot every day e.g. at 04:00, 05:20, 23:50
      id: DailySchedule
      properties:
        hour:
          description: Set the hour to start the snapshot (0-23), defaults to midnight (0).
          format: double
          type: number
        minute:
          description: >-
            Set the minute of the hour to start the snapshot (0-59), defaults to
            the top of the hour (0).
          format: double
          type: number
        snapshotsToKeep:
          description: The maximum number of Snapshots to keep for the hourly schedule
          format: double
          type: number
      type: object
    DestinationVolumeParameters:
      description: >-
        DestinationVolumeParameters specify input parameters used for creating
        destination volume.
      id: DestinationVolumeParameters
      properties:
        description:
          description: Description for the destination volume.
          type: string
        shareName:
          description: >-
            Destination volume's share name. If not specified, source volume's
            share name will be used.
          type: string
        storagePool:
          description: Required. Existing destination StoragePool name.
          type: string
        tieringPolicy:
          $ref: '#/components/schemas/TieringPolicy'
          description: Optional. Tiering policy for the volume.
        volumeId:
          description: >-
            Desired destination volume resource id. If not specified, source
            volume's resource id will be used. This value must start with a
