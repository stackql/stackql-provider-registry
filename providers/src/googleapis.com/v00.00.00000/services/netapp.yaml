            Optional. Type of the storage pool. This field is used to control
            whether the pool supports `FILE` based volumes only or `UNIFIED`
            (both `FILE` and `BLOCK`) volumes. If not specified during creation,
            it defaults to `FILE`.
          enumDescriptions:
            - Storage pool type is not specified.
            - Storage pool type is file.
            - Storage pool type is unified.
          type: string
          enum:
            - STORAGE_POOL_TYPE_UNSPECIFIED
            - FILE
            - UNIFIED
        volumeCount:
          description: Output only. Volume count of the storage pool
          readOnly: true
          format: int32
          type: integer
        allowAutoTiering:
          type: boolean
          description: >-
            Optional. True if the storage pool supports Auto Tiering enabled
            volumes. Default is false. Auto-tiering can be enabled after storage
            pool creation but it can't be disabled once enabled.
        replicaZone:
          type: string
          description: Optional. Specifies the replica zone for regional storagePool.
        description:
          description: Optional. Description of the storage pool
          type: string
        scaleType:
          type: string
          enum:
            - SCALE_TYPE_UNSPECIFIED
            - SCALE_TYPE_DEFAULT
            - SCALE_TYPE_SCALEOUT
          enumDescriptions:
            - Unspecified scale type.
            - >-
              Represents standard capacity and performance scale-type. Suitable
              for general purpose workloads.
            - >-
              Represents higher capacity and performance scale-type. Suitable
              for more demanding workloads.
          description: >-
            Optional. The scale type of the storage pool. Defaults to
            `SCALE_TYPE_DEFAULT` if not specified.
        serviceLevel:
          description: Required. Service level of the storage pool
          enumDescriptions:
            - Unspecified service level.
            - Premium service level.
            - Extreme service level.
            - Standard service level.
            - Flex service level.
          type: string
          enum:
            - SERVICE_LEVEL_UNSPECIFIED
            - PREMIUM
            - EXTREME
            - STANDARD
            - FLEX
        stateDetails:
          type: string
          description: Output only. State details of the storage pool
          readOnly: true
        qosType:
          description: Optional. QoS (Quality of Service) Type of the storage pool
          type: string
          enum:
            - QOS_TYPE_UNSPECIFIED
            - AUTO
            - MANUAL
          enumDescriptions:
            - Unspecified QoS Type
            - QoS Type is Auto
            - QoS Type is Manual
        hotTierSizeUsedGib:
          description: >-
            Output only. Total hot tier data rounded down to the nearest GiB
            used by the storage pool.
          readOnly: true
          format: int64
          type: string
        network:
          description: >-
            Required. VPC Network name. Format:
            projects/{project}/global/networks/{network}
          type: string
        activeDirectory:
          type: string
          description: >-
            Optional. Specifies the Active Directory to be used for creating a
            SMB volume.
        satisfiesPzi:
          description: Output only. Reserved for future use
          readOnly: true
          type: boolean
        volumeCapacityGib:
          description: >-
            Output only. Allocated size of all volumes in GIB in the storage
            pool
          readOnly: true
          format: int64
          type: string
        hotTierSizeGib:
          type: string
          description: >-
            Optional. Total hot tier capacity for the Storage Pool. It is
            applicable only to Flex service level. It should be less than the
            minimum storage pool size and cannot be more than the current
            storage pool size. It cannot be decreased once set.
          format: int64
        psaRange:
          type: string
          description: >-
            Optional. This field is not implemented. The values provided in this
            field are ignored.
        createTime:
          description: Output only. Create time of the storage pool
          readOnly: true
          format: google-datetime
          type: string
        totalThroughputMibps:
          type: string
          description: Optional. Custom Performance Total Throughput of the pool (in MiBps)
          format: int64
        totalIops:
          type: string
          description: >-
            Optional. Custom Performance Total IOPS of the pool if not provided,
            it will be calculated based on the total_throughput_mibps
          format: int64
        satisfiesPzs:
          type: boolean
          description: Output only. Reserved for future use
          readOnly: true
        encryptionType:
          enumDescriptions:
            - The source of the encryption key is not specified.
            - Google managed encryption key.
            - Customer managed encryption key, which is stored in KMS.
          readOnly: true
          type: string
          enum:
            - ENCRYPTION_TYPE_UNSPECIFIED
            - SERVICE_MANAGED
            - CLOUD_KMS
          description: Output only. Specifies the current pool encryption key source.
        customPerformanceEnabled:
          description: >-
            Optional. True if using Independent Scaling of capacity and
            performance (Hyperdisk) By default set to false
          type: boolean
        mode:
          type: string
          enum:
            - MODE_UNSPECIFIED
            - DEFAULT
            - ONTAP
          enumDescriptions:
            - The `Mode` is not specified.
            - The resource is managed by the GCNV APIs.
            - The resource is managed by the GCNV ONTAP Mode APIs.
          description: >-
            Optional. Mode of the storage pool. This field is used to control
            whether the user can perform ONTAP operations on the storage pool
            using the GCNV ONTAP Mode APIs. If not specified during creation, it
            defaults to `DEFAULT`.
        labels:
          type: object
          description: Optional. Labels as key value pairs
          additionalProperties:
            type: string
        ldapEnabled:
          description: Optional. Flag indicating if the pool is NFS LDAP enabled or not.
          type: boolean
        capacityGib:
          type: string
          description: Required. Capacity in GIB of the pool
          format: int64
        availableThroughputMibps:
          type: number
          description: Output only. Available throughput of the storage pool (in MiB/s).
          readOnly: true
          format: double
        globalAccessAllowed:
          description: >-
            Deprecated. Used to allow SO pool to access AD or DNS server from
            other regions.
          deprecated: true
          type: boolean
        enableHotTierAutoResize:
          description: >-
            Optional. Flag indicating that the hot-tier threshold will be
            auto-increased by 10% of the hot-tier when it hits 100%. Default is
            true. The increment will kick in only if the new size after
            increment is still less than or equal to storage pool size.
          type: boolean
    KmsConfig:
      type: object
      description: KmsConfig is the customer-managed encryption key(CMEK) configuration.
      id: KmsConfig
      properties:
        cryptoKeyName:
          description: >-
            Required. Customer-managed crypto key resource full name. Format:
            `projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{crypto_key}`
          type: string
        stateDetails:
          description: Output only. State details of the KmsConfig.
          readOnly: true
          type: string
        createTime:
          type: string
          description: Output only. Create time of the KmsConfig.
          readOnly: true
          format: google-datetime
        description:
          description: Description of the KmsConfig.
          type: string
        instructions:
          description: >-
            Output only. Instructions to provide the access to the customer
            provided encryption key.
          readOnly: true
          type: string
        labels:
          type: object
          description: Labels as key value pairs
          additionalProperties:
            type: string
        name:
          description: >-
            Identifier. Name of the `KmsConfig`. Format:
            `projects/{project}/locations/{location}/kmsConfigs/{kms_config}`
          type: string
        serviceAccount:
          description: >-
            Output only. The Service account which will have access to the
            customer provided encryption key.
          readOnly: true
          type: string
        state:
          type: string
          enum:
            - STATE_UNSPECIFIED
            - READY
            - CREATING
            - DELETING
            - UPDATING
            - IN_USE
            - ERROR
            - KEY_CHECK_PENDING
            - KEY_NOT_REACHABLE
            - DISABLING
            - DISABLED
            - MIGRATING
          description: Output only. State of the KmsConfig.
          enumDescriptions:
            - Unspecified KmsConfig State
            - KmsConfig State is Ready
            - KmsConfig State is Creating
            - KmsConfig State is Deleting
            - KmsConfig State is Updating
            - KmsConfig State is In Use.
            - KmsConfig State is Error
            - KmsConfig State is Pending to verify crypto key access.
            - >-
              KmsConfig State is Not accessbile by the SDE service account to
              the crypto key.
            - KmsConfig State is Disabling.
            - KmsConfig State is Disabled.
            - >-
              KmsConfig State is Migrating. The existing volumes are migrating
              from SMEK to CMEK.
          readOnly: true
    BackupSource:
      id: BackupSource
      properties:
        fileList:
          items:
            type: string
          type: array
          description: >-
            Optional. List of files to be restored in the form of their absolute
            path as in source volume. If provided, only these files will be
            restored. If not provided, the entire backup will be restored (Full
            Backup Restore)
        backup:
          description: Required. The backup resource name.
          type: string
      description: Represents the backup source of the restore operation.
      type: object
    CacheParameters:
      type: object
      description: Cache Parameters for the volume.
      id: CacheParameters
      properties:
        peerIpAddresses:
          description: >-
            Required. List of IC LIF addresses of the origin volume's ONTAP
            cluster.
          type: array
          items:
            type: string
        peerClusterName:
          description: Required. Name of the origin volume's ONTAP cluster.
          type: string
        enableGlobalFileLock:
          type: boolean
          description: >-
            Optional. Indicates whether the cache volume has global file lock
            enabled.
        command:
          description: >-
            Output only. Copy-paste-able commands to be used on user's ONTAP to
            accept peering requests.
          readOnly: true
          type: string
        peerSvmName:
          description: Required. Name of the origin volume's SVM.
          type: string
        peerVolumeName:
          type: string
          description: Required. Name of the origin volume for the cache volume.
        cacheConfig:
          description: Optional. Configuration of the cache volume.
          $ref: '#/components/schemas/CacheConfig'
        stateDetails:
          description: Output only. Detailed description of the current cache state.
          readOnly: true
          type: string
        peeringCommandExpiryTime:
          description: >-
            Optional. Expiration time for the peering command to be executed on
            user's ONTAP.
          format: google-datetime
          type: string
        cacheState:
          readOnly: true
          enumDescriptions:
            - Default unspecified state.
            - State indicating waiting for cluster peering to be established.
            - State indicating waiting for SVM peering to be established.
            - >-
              State indicating successful establishment of peering with origin
              volumes's ONTAP cluster.
            - >-
              Terminal state wherein peering with origin volume's ONTAP cluster
              has failed.
          description: >-
            Output only. State of the cache volume indicating the peering
            status.
          type: string
          enum:
            - CACHE_STATE_UNSPECIFIED
            - PENDING_CLUSTER_PEERING
            - PENDING_SVM_PEERING
            - PEERED
            - ERROR
        passphrase:
          description: >-
            Output only. Temporary passphrase generated to accept cluster
            peering command.
          readOnly: true
          type: string
    EstablishPeeringRequest:
      id: EstablishPeeringRequest
      properties:
        peerSvmName:
          description: >-
            Required. Name of the user's local source vserver svm to be peered
            with the destination vserver svm.
          type: string
        peerIpAddresses:
          description: Optional. List of IPv4 ip addresses to be used for peering.
          type: array
          items:
            type: string
        peerVolumeName:
          type: string
          description: >-
            Required. Name of the user's local source volume to be peered with
            the destination volume.
        peerClusterName:
          description: >-
            Required. Name of the user's local source cluster to be peered with
            the destination cluster.
          type: string
      description: >-
        EstablishPeeringRequest establishes cluster and svm peerings between the
        source and the destination replications.
      type: object
    OntapVolumeTarget:
      type: object
      description: Represents the ONTAP volume target of the restore operation.
      id: OntapVolumeTarget
      properties:
        volumeUuid:
          type: string
          description: Required. The UUID of the ONTAP volume to restore to.
        restoreDestinationPath:
          type: string
          description: Optional. Absolute directory path in the destination volume.
    LargeCapacityConfig:
      description: >-
        Configuration for a Large Capacity Volume. A Large Capacity Volume
        supports sizes ranging from 4.8 TiB to 20 PiB; it is composed of
        multiple internal constituents, and must be created in a large capacity
        pool.
      id: LargeCapacityConfig
      properties:
        constituentCount:
          description: >-
            Optional. The number of internal constituents (e.g., FlexVols) for
            this large volume. The minimum number of constituents is 2.
          format: int32
          type: integer
      type: object
    TieringPolicy:
      id: TieringPolicy
      properties:
        tierAction:
          enumDescriptions:
            - Unspecified.
            - When tiering is enabled, new cold data will be tiered.
            - >-
              When paused, tiering won't be performed on new data. Existing data
              stays tiered until accessed.
          type: string
          enum:
            - TIER_ACTION_UNSPECIFIED
            - ENABLED
            - PAUSED
          description: >-
            Optional. Flag indicating if the volume has tiering policy
            enable/pause. Default is PAUSED.
        coolingThresholdDays:
          description: >-
            Optional. Time in days to mark the volume's data block as cold and
            make it eligible for tiering, can be range from 2-183. Default is
            31.
          format: int32
          type: integer
        hotTierBypassModeEnabled:
          description: >-
            Optional. Flag indicating that the hot tier bypass mode is enabled.
            Default is false. This is only applicable to Flex service level.
          type: boolean
      description: Defines tiering policy for the volume.
      type: object
    ListStoragePoolsResponse:
      type: object
      description: ListStoragePoolsResponse is the response to a ListStoragePoolsRequest.
      id: ListStoragePoolsResponse
      properties:
        nextPageToken:
          type: string
          description: A token identifying a page of results the server should return.
        storagePools:
          description: The list of StoragePools
          type: array
          items:
            $ref: '#/components/schemas/StoragePool'
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
    ResumeReplicationRequest:
      description: ResumeReplicationRequest resumes a stopped replication.
      id: ResumeReplicationRequest
      properties: {}
      type: object
    VolumeBackupConfig:
      id: VolumeBackupConfig
      properties:
        backupConfig:
          description: Backup configuration for the volume.
          $ref: '#/components/schemas/BackupConfig'
        volumeUuid:
          description: Provides the Ontap UUID of the volume within the pool.
          type: string
      description: Backup configuration for a volume in a pool.
      type: object
    BlockDevice:
      id: BlockDevice
      properties:
        hostGroups:
          items:
            type: string
          type: array
          description: >-
            Optional. A list of host groups that identify hosts that can mount
            the block volume. Format:
            `projects/{project_id}/locations/{location}/hostGroups/{host_group_id}`
            This field can be updated after the block device is created.
        sizeGib:
          type: string
          description: >-
            Optional. The size of the block device in GiB. Any value provided
            for the `size_gib` field during volume creation is ignored. The
            block device's size is system-managed and will be set to match the
            parent Volume's `capacity_gib`.
          format: int64
        name:
          type: string
          description: >-
            Optional. User-defined name for the block device, unique within the
            volume. In case no user input is provided, name will be
            auto-generated in the backend. The name must meet the following
            requirements: * Be between 1 and 255 characters long. * Contain only
            uppercase or lowercase letters (A-Z, a-z), numbers (0-9), and the
            following special characters: "-", "_", "}", "{", ".". * Spaces are
            not allowed.
        identifier:
          description: >-
            Output only. Device identifier of the block volume. This represents
            `lun_serial_number` for iSCSI volumes.
          readOnly: true
          type: string
        osType:
          enumDescriptions:
            - Unspecified OS Type
            - OS Type is Linux
            - OS Type is Windows
            - OS Type is VMware ESXi
          type: string
          enum:
            - OS_TYPE_UNSPECIFIED
            - LINUX
            - WINDOWS
            - ESXI
          description: >-
            Required. Immutable. The OS type of the volume. This field can't be
            changed after the block device is created.
      description: >-
        Block device represents the device(s) which are stored in the block
        volume.
      type: object
    BackupConfig:
      description: BackupConfig contains backup related config on a volume.
      id: BackupConfig
      properties:
        backupPolicies:
          description: >-
            Optional. When specified, schedule backups will be created based on
            the policy configuration.
          items:
            type: string
          type: array
        backupVault:
          description: >-
            Optional. Name of backup vault. Format:
            projects/{project_id}/locations/{location}/backupVaults/{backup_vault_id}
          type: string
        backupChainBytes:
          type: string
          description: >-
            Output only. Total size of all backups in a chain in bytes =
            baseline backup size + sum(incremental backup size).
          readOnly: true
          format: int64
        scheduledBackupEnabled:
          type: boolean
          description: >-
            Optional. When set to true, scheduled backup is enabled on the
            volume. This field should be nil when there's no backup policy
            attached.
      type: object
  parameters:
    key:
      description: >-
