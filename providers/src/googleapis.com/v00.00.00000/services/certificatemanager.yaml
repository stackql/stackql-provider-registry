openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Certificate Manager API
  description: ''
  version: v1
  x-discovery-doc-revision: '20260721'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://docs.cloud.google.com/certificate-manager/docs/overview
servers:
  - url: https://certificatemanager.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    UsedBy:
      description: Defines a resource that uses the certificate.
      properties:
        name:
          description: >-
            Output only. Full name of the resource
            https://google.aip.dev/122#full-resource-names, e.g.
            `//certificatemanager.googleapis.com/projects/*/locations/*/certificateMaps/*/certificateMapEntries/*`
            or
            `//compute.googleapis.com/projects/*/locations/*/targetHttpsProxies/*`.
          type: string
          readOnly: true
      id: UsedBy
      type: object
    ListCertificatesResponse:
      description: Response for the `ListCertificates` method.
      properties:
        unreachable:
          description: A list of locations that could not be reached.
          type: array
          items:
            type: string
        certificates:
          items:
            $ref: '#/components/schemas/Certificate'
          type: array
          description: A list of certificates for the parent resource.
        nextPageToken:
          description: >-
            If there might be more results than those appearing in this
            response, then `next_page_token` is included. To get the next set of
            results, call this method again using the value of `next_page_token`
            as `page_token`.
          type: string
      type: object
      id: ListCertificatesResponse
    IPs:
      description: IPs troubleshooting information.
      properties:
        serving:
          description: >-
            Output only. The list of IP addresses, where the certificate is
            attached and port 443 is open.
          readOnly: true
          items:
            type: string
          type: array
        servingOnAltPorts:
          type: array
          readOnly: true
          items:
            type: string
          description: >-
            Output only. The list of IP addresses, where the certificate is
            attached, but port 443 is not open.
        resolved:
          description: >-
            Output only. The list of IP addresses resolved from the domain's
            A/AAAA records. Can contain both ipv4 and ipv6 addresses.
          readOnly: true
          items:
            type: string
          type: array
      type: object
      id: IPs
    CertificateIssuanceConfig:
      description: >-
        CertificateIssuanceConfig specifies how to issue and manage a
        certificate.
      properties:
        name:
          description: >-
            Identifier. A user-defined name of the certificate issuance config.
            CertificateIssuanceConfig names must be unique globally and match
            pattern `projects/*/locations/*/certificateIssuanceConfigs/*`.
          type: string
        tags:
          description: >-
            Optional. Input only. Immutable. Tag keys/values directly bound to
            this resource. For example: "123/environment": "production",
            "123/costCenter": "marketing"
          additionalProperties:
            type: string
          type: object
        certificateAuthorityConfig:
          description: >-
            Required. The CA that issues the workload certificate. It includes
            the CA address, type, authentication to CA service, etc.
          $ref: '#/components/schemas/CertificateAuthorityConfig'
        keyAlgorithm:
          enumDescriptions:
            - Unspecified key algorithm.
            - Specifies RSA with a 2048-bit modulus.
            - Specifies ECDSA with curve P256.
          enum:
            - KEY_ALGORITHM_UNSPECIFIED
            - RSA_2048
            - ECDSA_P256
          type: string
          description: Required. The key algorithm to use when generating the private key.
        rotationWindowPercentage:
          type: integer
          description: >-
            Required. Specifies the percentage of elapsed time of the
            certificate lifetime to wait before renewing the certificate. Must
            be a number between 1-99, inclusive.
          format: int32
        description:
          description: >-
            Optional. One or more paragraphs of text description of a
            CertificateIssuanceConfig.
          type: string
        updateTime:
          readOnly: true
          type: string
          description: >-
            Output only. The last update timestamp of a
            CertificateIssuanceConfig.
          format: google-datetime
        lifetime:
          type: string
          description: Required. Workload certificate lifetime requested.
          format: google-duration
        createTime:
          description: Output only. The creation timestamp of a CertificateIssuanceConfig.
          format: google-datetime
          readOnly: true
          type: string
        labels:
          description: Optional. Set of labels associated with a CertificateIssuanceConfig.
          additionalProperties:
            type: string
          type: object
      id: CertificateIssuanceConfig
      type: object
    ListOperationsResponse:
      id: ListOperationsResponse
      type: object
      description: The response message for Operations.ListOperations.
      properties:
        unreachable:
          type: array
          items:
            type: string
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
        operations:
          items:
            $ref: '#/components/schemas/Operation'
          type: array
          description: >-
            A list of operations that matches the specified filter in the
            request.
        nextPageToken:
          description: The standard List next-page token.
          type: string
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      properties:
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
        response:
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
      id: Operation
      type: object
    ListCertificateIssuanceConfigsResponse:
      id: ListCertificateIssuanceConfigsResponse
      type: object
      description: Response for the `ListCertificateIssuanceConfigs` method.
      properties:
        unreachable:
          items:
            type: string
          type: array
          description: Locations that could not be reached.
        nextPageToken:
          description: >-
            If there might be more results than those appearing in this
            response, then `next_page_token` is included. To get the next set of
            results, call this method again using the value of `next_page_token`
            as `page_token`.
          type: string
        certificateIssuanceConfigs:
          description: A list of certificate configs for the parent resource.
          items:
            $ref: '#/components/schemas/CertificateIssuanceConfig'
          type: array
    CancelOperationRequest:
      id: CancelOperationRequest
      type: object
      description: The request message for Operations.CancelOperation.
      properties: {}
    ManagedIdentityCertificate:
      description: >-
        Configuration and state of a Managed Identity Certificate. Certificate
        Manager provisions and renews Managed Identity Certificates
        automatically, for as long as it's authorized to do so.
      properties:
        state:
          description: Output only. State of the managed certificate resource.
          type: string
          readOnly: true
          enumDescriptions:
            - State is unspecified.
            - >-
              Certificate Manager attempts to provision or renew the
              certificate. If the process takes longer than expected, consult
              the `provisioning_issue` field.
            - >-
              Multiple certificate provisioning attempts failed and Certificate
              Manager gave up. To try again, delete and create a new managed
              Certificate resource. For details see the `provisioning_issue`
              field.
            - >-
              The certificate management is working, and a certificate has been
              provisioned.
          enum:
            - STATE_UNSPECIFIED
            - PROVISIONING
            - FAILED
            - ACTIVE
        identity:
          description: >-
            Required. Immutable. SPIFFE ID of the Managed Identity used for this
            certificate.
          type: string
        provisioningIssue:
          readOnly: true
          $ref: '#/components/schemas/ProvisioningIssue'
          description: >-
            Output only. Information about issues with provisioning a managed
            certificate.
      id: ManagedIdentityCertificate
      type: object
    CNAME:
      description: CNAME troubleshooting information.
      properties:
        name:
          readOnly: true
          type: string
          description: >-
            Output only. The name of the CNAME record for the domain, equals to
            `dns_resource_record.name` in the corresponding `DnsAuthorization`.
        resolvedData:
          description: >-
            Output only. The resolved CNAME chain. Empty list if the CNAME
            record for `CNAME.name` is not found. Otherwise the first item is
            the value of the CNAME record for `CNAME.name`. If the CNAME chain
            is longer, the second item is the value of the CNAME record for the
            first item, and so on.
          type: array
          readOnly: true
          items:
            type: string
        expectedData:
          readOnly: true
          type: string
          description: >-
            Output only. The expected value of the CNAME record for the domain,
            equals to `dns_resource_record.data` in the corresponding
            `DnsAuthorization`.
      id: CNAME
      type: object
    CertificateMap:
      description: Defines a collection of certificate configurations.
      properties:
        createTime:
          readOnly: true
          type: string
          description: Output only. The creation timestamp of a Certificate Map.
          format: google-datetime
        labels:
          description: Optional. Set of labels associated with a Certificate Map.
          additionalProperties:
            type: string
          type: object
        updateTime:
          readOnly: true
          type: string
          description: Output only. The update timestamp of a Certificate Map.
          format: google-datetime
        name:
          description: >-
            Identifier. A user-defined name of the Certificate Map. Certificate
            Map names must be unique globally and match pattern
            `projects/*/locations/*/certificateMaps/*`.
          type: string
        tags:
          type: object
          description: >-
            Optional. Input only. Immutable. Tag keys/values directly bound to
            this resource. For example: "123/environment": "production",
            "123/costCenter": "marketing"
          additionalProperties:
            type: string
        description:
          description: >-
            Optional. One or more paragraphs of text description of a
            certificate map.
          type: string
        gclbTargets:
          readOnly: true
          items:
            $ref: '#/components/schemas/GclbTarget'
          type: array
          description: >-
            Output only. A list of GCLB targets that use this Certificate Map. A
            Target Proxy is only present on this list if it's attached to a
            Forwarding Rule.
      type: object
      id: CertificateMap
    IntermediateCA:
      description: Defines an intermediate CA.
      properties:
        pemCertificate:
          description: >-
            PEM intermediate certificate used for building up paths for
            validation. Each certificate provided in PEM format may occupy up to
            5kB.
          type: string
      id: IntermediateCA
      type: object
    TrustStore:
      id: TrustStore
      type: object
      description: Defines a trust store.
      properties:
        trustAnchors:
          type: array
          items:
            $ref: '#/components/schemas/TrustAnchor'
          description: >-
            Optional. List of Trust Anchors to be used while performing
            validation against a given TrustStore.
        intermediateCas:
          items:
            $ref: '#/components/schemas/IntermediateCA'
          type: array
          description: >-
            Optional. Set of intermediate CA certificates used for the path
            building phase of chain validation. The field is currently not
            supported if TrustConfig is used for the workload certificate
            feature.
    DnsAuthorization:
      description: >-
        A DnsAuthorization resource describes a way to perform domain
        authorization for certificate issuance.
      properties:
        name:
          description: >-
            Identifier. A user-defined name of the dns authorization.
            DnsAuthorization names must be unique globally and match pattern
            `projects/*/locations/*/dnsAuthorizations/*`.
          type: string
        tags:
          description: >-
            Optional. Input only. Immutable. Tag keys/values directly bound to
            this resource. For example: "123/environment": "production",
            "123/costCenter": "marketing"
          additionalProperties:
            type: string
          type: object
        domain:
          description: >-
            Required. Immutable. A domain that is being authorized. A
            DnsAuthorization resource covers a single domain and its wildcard,
            e.g. authorization for `example.com` can be used to issue
            certificates for `example.com` and `*.example.com`.
          type: string
        updateTime:
          description: Output only. The last update timestamp of a DnsAuthorization.
          format: google-datetime
          readOnly: true
          type: string
        createTime:
          description: Output only. The creation timestamp of a DnsAuthorization.
          format: google-datetime
          type: string
          readOnly: true
        labels:
          description: Optional. Set of labels associated with a DnsAuthorization.
          additionalProperties:
            type: string
          type: object
        description:
          description: >-
            Optional. One or more paragraphs of text description of a
            DnsAuthorization.
          type: string
        dnsResourceRecord:
          description: >-
            Output only. DNS Resource Record that needs to be added to DNS
            configuration.
          readOnly: true
          $ref: '#/components/schemas/DnsResourceRecord'
        type:
          enumDescriptions:
            - Type is unspecified.
            - FIXED_RECORD DNS authorization uses DNS-01 validation method.
            - >-
              PER_PROJECT_RECORD DNS authorization allows for independent
              management of Google-managed certificates with DNS authorization
              across multiple projects.
          enum:
            - TYPE_UNSPECIFIED
            - FIXED_RECORD
            - PER_PROJECT_RECORD
          type: string
          description: >-
            Optional. Immutable. Type of DnsAuthorization. If unset during
            resource creation the following default will be used: - in location
            `global`: FIXED_RECORD, - in other locations: PER_PROJECT_RECORD.
      type: object
      id: DnsAuthorization
    Troubleshooting:
      type: object
      id: Troubleshooting
      description: Troubleshooting information for the authorization attempt.
      properties:
        issues:
          description: >-
            Output only. The list of issues discovered during the authorization
            attempt.
          readOnly: true
          items:
            type: string
            enumDescriptions:
              - Issue is unspecified.
              - The resolved CNAME value doesn't match the expected CNAME.
              - >-
                Domain has A/AAAA records that point to IPs, where the
                certificate is not attached.
              - >-
                Domain has A/AAAA records that point to IPs, where the
                certificate is attached, but port 443 is not open.
              - Domain doesn't have any A/AAAA records.
              - >-
                Certificate is not configured to be served from any IPs (e.g.
                Certificate is not attached to any load balancer).
            enum:
              - ISSUE_UNSPECIFIED
              - CNAME_MISMATCH
              - RESOLVED_TO_NOT_SERVING
              - RESOLVED_TO_SERVING_ON_ALT_PORTS
              - NO_RESOLVED_IPS
              - CERTIFICATE_NOT_ATTACHED
          type: array
        cname:
          description: Output only. CNAME troubleshooting information.
          readOnly: true
          $ref: '#/components/schemas/CNAME'
        ips:
          description: Output only. IPs troubleshooting information.
          readOnly: true
          $ref: '#/components/schemas/IPs'
    TrustConfig:
      description: Defines a trust config.
      properties:
        updateTime:
          description: Output only. The last update timestamp of a TrustConfig.
          format: google-datetime
          readOnly: true
          type: string
        createTime:
          readOnly: true
          type: string
          description: Output only. The creation timestamp of a TrustConfig.
          format: google-datetime
        labels:
          description: Optional. Set of labels associated with a TrustConfig.
          additionalProperties:
            type: string
          type: object
        spiffeTrustStores:
          description: >-
            Optional. Defines a mapping from a trust domain to a TrustStore.
            This is used for SPIFFE certificate validation.
          additionalProperties:
            $ref: '#/components/schemas/TrustStore'
          type: object
        allowlistedCertificates:
          type: array
          items:
            $ref: '#/components/schemas/AllowlistedCertificate'
          description: >-
            Optional. A certificate matching an allowlisted certificate is
            always considered valid as long as the certificate is parseable,
            proof of private key possession is established, and constraints on
            the certificate's SAN field are met.
        description:
          description: >-
            Optional. One or more paragraphs of text description of a
            TrustConfig.
          type: string
        etag:
          description: >-
            This checksum is computed by the server based on the value of other
            fields, and may be sent on update and delete requests to ensure the
            client has an up-to-date value before proceeding.
          type: string
        trustStores:
          description: >-
            Optional. Set of trust stores to perform validation against. This
            field is supported when TrustConfig is configured with Load
            Balancers, currently not supported for SPIFFE certificate
            validation. Only one TrustStore specified is currently allowed.
          type: array
          items:
            $ref: '#/components/schemas/TrustStore'
        name:
          description: >-
            Identifier. A user-defined name of the trust config. TrustConfig
            names must be unique globally and match pattern
            `projects/*/locations/*/trustConfigs/*`.
          type: string
        tags:
          type: object
          description: >-
            Optional. Input only. Immutable. Tag keys/values directly bound to
            this resource. For example: "123/environment": "production",
            "123/costCenter": "marketing"
          additionalProperties:
            type: string
      id: TrustConfig
      type: object
    Certificate:
      id: Certificate
      type: object
      description: Defines TLS certificate.
      properties:
        selfManaged:
          $ref: '#/components/schemas/SelfManagedCertificate'
          description: If set, defines data of a self-managed certificate.
        tags:
          type: object
          description: >-
            Optional. Input only. Immutable. Tag keys/values directly bound to
            this resource. For example: "123/environment": "production",
            "123/costCenter": "marketing"
          additionalProperties:
            type: string
        description:
          description: >-
            Optional. One or more paragraphs of text description of a
            certificate.
          type: string
        pemCertificate:
          description: Output only. The PEM-encoded certificate chain.
          readOnly: true
          type: string
        expireTime:
          description: Output only. The expiry timestamp of a Certificate.
          format: google-datetime
          type: string
          readOnly: true
        managed:
          $ref: '#/components/schemas/ManagedCertificate'
          description: If set, contains configuration and state of a managed certificate.
        usedBy:
          description: Output only. The list of resources that use this Certificate.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/UsedBy'
        labels:
          description: Optional. Set of labels associated with a Certificate.
          additionalProperties:
            type: string
          type: object
        name:
          description: >-
            Identifier. A user-defined name of the certificate. Certificate
            names must be unique globally and match pattern
            `projects/*/locations/*/certificates/*`.
          type: string
        managedIdentity:
          $ref: '#/components/schemas/ManagedIdentityCertificate'
          description: >-
            If set, contains configuration and state of a managed identity
            certificate.
        scope:
          enumDescriptions:
            - >-
              Use the DEFAULT scope if you plan to use the certificate with
              global external Application Load Balancer, global external proxy
              Network Load Balancer, or any of the regional Google Cloud
              services.
            - >-
              Use the EDGE_CACHE scope if you plan to use the certificate with
              Media CDN. The certificates are served from Edge Points of
              Presence. See https://cloud.google.com/vpc/docs/edge-locations.
            - >-
              Use the ALL_REGIONS scope if you plan to use the certificate with
              cross-region internal Application Load Balancer. The certificates
              are served from all Google Cloud regions. See
              https://cloud.google.com/compute/docs/regions-zones.
            - >-
              Associated with certificates used as client certificates in
              Backend mTLS.
          enum:
            - DEFAULT
            - EDGE_CACHE
            - ALL_REGIONS
            - CLIENT_AUTH
          type: string
          description: Optional. Immutable. The scope of the certificate.
        updateTime:
          type: string
          readOnly: true
          description: Output only. The last update timestamp of a Certificate.
          format: google-datetime
        sanDnsnames:
          type: array
          readOnly: true
          items:
            type: string
          description: >-
            Output only. The list of Subject Alternative Names of dnsName type
            defined in the certificate (see RFC 5280 4.2.1.6). Managed
            certificates that haven't been provisioned yet have this field
            populated with a value of the managed.domains field.
        createTime:
          readOnly: true
          type: string
          description: Output only. The creation timestamp of a Certificate.
          format: google-datetime
    CertificateAuthorityServiceConfig:
      id: CertificateAuthorityServiceConfig
      type: object
      description: Contains information required to contact CA service.
      properties:
        caPool:
          description: >-
            Required. A CA pool resource used to issue a certificate. The CA
            pool string has a relative resource path following the form
            "projects/{project}/locations/{location}/caPools/{ca_pool}".
          type: string
    ManagedCertificate:
      description: >-
        Configuration and state of a Managed Certificate. Certificate Manager
        provisions and renews Managed Certificates automatically, for as long as
        it's authorized to do so.
      properties:
        dnsAuthorizations:
          description: >-
            Optional. Immutable. Authorizations that will be used for performing
            domain authorization.
          type: array
          items:
            type: string
        state:
          enumDescriptions:
            - State is unspecified.
            - >-
              Certificate Manager attempts to provision or renew the
              certificate. If the process takes longer than expected, consult
              the `provisioning_issue` field.
            - >-
              Multiple certificate provisioning attempts failed and Certificate
              Manager gave up. To try again, delete and create a new managed
              Certificate resource. For details see the `provisioning_issue`
              field.
            - >-
              The certificate management is working, and a certificate has been
              provisioned.
          enum:
            - STATE_UNSPECIFIED
            - PROVISIONING
            - FAILED
            - ACTIVE
          description: Output only. State of the managed certificate resource.
          readOnly: true
          type: string
        authorizationAttemptInfo:
          description: >-
            Output only. Detailed state of the latest authorization attempt for
            each domain specified for managed certificate resource.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/AuthorizationAttemptInfo'
        issuanceConfig:
          description: >-
            Optional. Immutable. The resource name for a
            CertificateIssuanceConfig used to configure private PKI certificates
            in the format `projects/*/locations/*/certificateIssuanceConfigs/*`.
            If this field is not set, the certificates will instead be publicly
            signed as documented at
            https://cloud.google.com/load-balancing/docs/ssl-certificates/google-managed-certs#caa.
          type: string
        domains:
          items:
            type: string
          type: array
          description: >-
            Optional. Immutable. The domains for which a managed SSL certificate
            will be generated. Wildcard domains are only supported with DNS
            challenge resolution.
        provisioningIssue:
          description: >-
            Output only. Information about issues with provisioning a Managed
            Certificate.
          readOnly: true
          $ref: '#/components/schemas/ProvisioningIssue'
      type: object
      id: ManagedCertificate
    AllowlistedCertificate:
      type: object
      id: AllowlistedCertificate
      description: Defines an allowlisted certificate.
      properties:
        pemCertificate:
          description: >-
            Required. PEM certificate that is allowlisted. The certificate can
            be up to 5k bytes, and must be a parseable X.509 certificate.
          type: string
    ProvisioningIssue:
      type: object
      id: ProvisioningIssue
      description: Information about issues with provisioning a Managed Certificate.
      properties:
        reason:
          enumDescriptions:
            - Reason is unspecified.
            - >-
              Certificate provisioning failed due to an issue with one or more
              of the domains on the certificate. For details of which domains
              failed, consult the `authorization_attempt_info` field.
            - >-
              Exceeded Certificate Authority quotas or internal rate limits of
              the system. Provisioning may take longer to complete.
          enum:
            - REASON_UNSPECIFIED
            - AUTHORIZATION_ISSUE
            - RATE_LIMITED
          type: string
          readOnly: true
          description: Output only. Reason for provisioning failures.
        details:
          type: string
          readOnly: true
          description: >-
            Output only. Human readable explanation about the issue. Provided to
            help address the configuration issues. Not guaranteed to be stable.
            For programmatic access use Reason enum.
    AuthorizationAttemptInfo:
      id: AuthorizationAttemptInfo
      type: object
      description: >-
        State of the latest attempt to authorize a domain for certificate
        issuance.
      properties:
        state:
          enumDescriptions:
            - State is unspecified.
            - >-
              Certificate provisioning for this domain is under way. Google
              Cloud will attempt to authorize the domain.
            - >-
              A managed certificate can be provisioned, no issues for this
              domain.
            - >-
              Attempt to authorize the domain failed. This prevents the Managed
              Certificate from being issued. See `failure_reason` and `details`
              fields for more information.
